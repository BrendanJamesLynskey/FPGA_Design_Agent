# isqrt testplan, schema v1 (brief 116 format; brief 139b). The agent wrote every requirement below from the owner's request; none is agreed by a human (`spec_status: draft`).
# Status is never typed here: `python -m flow.trace_v1 write arith/isqrt` computes it from the evidence files named in each item. Evidence is regenerated by the commands in `notes`.
schema: fpga-design-agent/testplan/v1
design: isqrt
notes: 'Arithmetic library function isqrt (brief 139b). Every requirement is a draft written by the agent from the owner''s request (spec_status: draft; only a human sets agreed). Evidence is generated
  by `python -m pytest arith/isqrt/tests --junitxml=results/139b_arith/isqrt_junit.xml` with ARITH_RECORD_DIR=results/139b_arith. The Lean items show ''statement not approved'': lean_approvals.yaml is the
  owner''s. The one performance requirement (brief 160) says every prepared out-of-context point has a routed Vivado result; no Fmax or area bound is agreed.'
discover:
- glob: arith/isqrt/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: SQRT-F-MODEL
  kind: functional
  title: 'The model is the specification: it equals integer arithmetic'
  text: 'For the integer square root: the root and remainder equal math.isqrt for every radicand at W = 3 to 14 and for random values at W up to 200, the restoring and non-restoring recurrences equal the
    root step by step, and the non-restoring remainder stays in [-(2q+1), 2q].'
  source: arith/isqrt/spec.md#the-function
  spec_status: draft
- id: SQRT-F-RTL-EXH
  kind: functional
  title: Every variant is bit-exact against the model, exhaustively at small widths
  text: 'Simulation (Icarus 14) of every variant against the model: every radicand at W = 3 to 16 (odd and even), every variant, with input gaps; root, remainder, order and latency checked.'
  source: arith/isqrt/spec.md#the-function
  spec_status: draft
- id: SQRT-F-RTL-RAND
  kind: functional
  title: Every variant is bit-exact against the model at large widths
  text: 'Simulation of every variant against the model: 3000 random and near-square values (remainders 0 and 2 * root) at W = 24, 31, 32, 48 and 64.'
  source: arith/isqrt/spec.md#the-function
  spec_status: draft
- id: SQRT-F-LAT
  kind: functional
  title: Latency and throughput are what the spec states
  text: The measured latency equals the spec's formula (RW + 1 and ceil(RW / PIPE)) for PIPE = 1 to 6 at W = 11 (RW = 6), one result per clock for the pipelines.
  source: arith/isqrt/spec.md#the-function
  spec_status: draft
- id: SQRT-F-LINT
  kind: functional
  title: The RTL is Verilator -Wall clean
  text: Verilator -Wall --lint-only reports nothing for any variant at W = 3, 4, 8, 13 and 32 with PIPE = 1, 3 and 40.
  source: arith/isqrt/spec.md#the-function
  spec_status: draft
- id: SQRT-F-MUTANT
  kind: functional
  title: The bench catches seeded faults
  text: 'Each of 16 seeded faults (one text change in the RTL, verif/mutants.yaml) makes the bench fail: killed/total = 16/16.'
  source: arith/isqrt/spec.md#the-function
  spec_status: draft
- id: SQRT-F-FORMAL-REF
  kind: functional
  title: Every variant equals an independent reference (SymbiYosys)
  text: 'SymbiYosys with the slang front end: each variant satisfies root^2 + rem = x and rem <= 2 * root (so root^2 <= x < (root+1)^2) for all input sequences from reset: 12 jobs at W = 6 to 10; unbounded
    (abc pdr). Six seeded faults are applied to the RTL and the same proof fails (bounded model checking finds the counterexample), which shows the harness is not vacuous.'
  source: arith/isqrt/spec.md#the-function
  spec_status: draft
- id: SQRT-F-FORMAL-PAIR
  kind: functional
  title: Variants of the function agree with each other (SymbiYosys)
  text: 'SymbiYosys with the slang front end, no reference involved: the restoring and non-restoring pipelines give the same output on the same inputs, W = 6, 8, 9; unbounded (abc pdr).'
  source: arith/isqrt/spec.md#the-function
  spec_status: draft
- id: SQRT-F-LEAN-RESTORING
  kind: functional
  title: Restoring square root is correct for every width (Lean)
  text: The restoring digit recurrence of isqrt_restoring_*.sv yields root and rem with root^2 + rem = x and rem <= 2 * root for every width, which determines the floor square root. Proved in Lean, statement
    not approved; the Lean text is a transcription of the RTL's step, cross-checked against the Python model for up to 10-bit radicands; register widths are not modelled. The non-restoring recurrence is
    not proved (spec.md).
  source: arith/isqrt/spec.md#verification-everything-before-vivado
  spec_status: draft
- id: SQRT-F-BUILD
  kind: functional
  title: Out-of-context build descriptions are prepared for Artix-7 and K26 (prepared in brief 139b, run in brief 160)
  text: 'For every variant of the integer square root there is a build.yaml and an out-of-context clock constraint for xc7a100t and xck26, current against arith/tools/gen_build.py, consistent with the RTL
    (top, parameters, sources), with the expected primitive use evaluated for each point; the out-of-context wrapper lints clean and is functionally exact for the always-ready variants; the packaged verification
    harness (harness/run.py, which a user reruns against their own instance) passes on the library instance with every coverage bin hit. This requirement is about preparation; the measured area, Fmax and power are in brief 160's records.'
  source: arith/isqrt/spec.md#vivado-builds-prepared-in-brief-139b-run-in-brief-160
  spec_status: draft
- id: SQRT-P-OOC
  kind: performance
  title: Every prepared point places and routes out of context on Artix-7 and K26
  text: Each point of the build files of isqrt (build/<variant>/build.yaml; 24 in all, both parts) goes through Vivado 2026.1 out-of-context synthesis, placement and routing and leaves
    a recorded result (utilisation, WNS, WHS, Fmax, logic levels, vectorless power) in verif/results/vivado_ooc_<variant>_<part>.json. The measured values and each point's pre-stated
    expectation are in the Measured table of spec.md and in verif/results/vivado_surface.json; this requirement states only that the measurement exists for every point, because no Fmax
    or area bound has been agreed.
  source: arith/isqrt/spec.md
  spec_status: draft
  performance:
    quantity: prepared points with a routed out-of-context Vivado result
    unit: points
    op: ge
    bound: 24
    condition: Vivado 2026.1 out-of-context, one thread, the clocks of the build files, brief 160
verification:
- id: V-SQRT-MODEL
  requirements:
  - SQRT-F-MODEL
  method: sim_test
  title: Model tests against Python integer arithmetic
  evidence:
    file: results/139b_arith/isqrt_junit.xml
    reader: junit
    tests:
    - test_isqrt_model::*
  checks:
  - arith/isqrt/model.py
- id: V-SQRT-RTL-EXH
  requirements:
  - SQRT-F-RTL-EXH
  method: sim_test
  title: Exhaustive small widths, every variant
  evidence:
    file: results/139b_arith/isqrt_junit.xml
    reader: junit
    tests:
    - test_isqrt_rtl::test_exhaustive_small_widths
  checks: &id001
  - arith/isqrt/rtl/isqrt_nonrestoring_pipe.sv
  - arith/isqrt/rtl/isqrt_ooc.sv
  - arith/isqrt/rtl/isqrt_restoring_iter.sv
  - arith/isqrt/rtl/isqrt_restoring_pipe.sv
  - arith/isqrt/rtl/isqrt_sel.sv
  - arith/isqrt/model.py
  - arith/common/tb_stream.sv
  - arith/isqrt/tb/tb_isqrt.sv
- id: V-SQRT-RTL-RAND
  requirements:
  - SQRT-F-RTL-RAND
  method: sim_test
  title: Random and edge vectors at large widths
  evidence:
    file: results/139b_arith/isqrt_junit.xml
    reader: junit
    tests:
    - test_isqrt_rtl::test_random_and_near_square_large_widths
  checks: *id001
- id: V-SQRT-LAT
  requirements:
  - SQRT-F-LAT
  method: sim_test
  title: Latency measured per result
  evidence:
    file: results/139b_arith/isqrt_junit.xml
    reader: junit
    tests:
    - test_isqrt_rtl::test_latency_matches_the_formula_at_every_pipeline_depth
  checks: *id001
- id: V-SQRT-LINT
  requirements:
  - SQRT-F-LINT
  method: sim_test
  title: Verilator -Wall lint
  evidence:
    file: results/139b_arith/isqrt_junit.xml
    reader: junit
    tests:
    - test_isqrt_rtl::test_lint_clean
  checks: *id001
- id: V-SQRT-MUTANT-RUN
  requirements:
  - SQRT-F-MUTANT
  method: sim_test
  title: The mutant check passes
  evidence:
    file: results/139b_arith/isqrt_junit.xml
    reader: junit
    tests:
    - test_isqrt_rtl::test_seeded_mutants_are_all_killed
  checks:
  - arith/isqrt/rtl/isqrt_nonrestoring_pipe.sv
  - arith/isqrt/rtl/isqrt_ooc.sv
  - arith/isqrt/rtl/isqrt_restoring_iter.sv
  - arith/isqrt/rtl/isqrt_restoring_pipe.sv
  - arith/isqrt/rtl/isqrt_sel.sv
  - arith/isqrt/model.py
  - arith/common/tb_stream.sv
  - arith/isqrt/tb/tb_isqrt.sv
  - arith/isqrt/verif/mutants.yaml
- id: V-SQRT-MUTANT-SCORE
  requirements:
  - SQRT-F-MUTANT
  method: sim_measurement
  title: Mutants killed / total
  evidence:
    file: results/139b_arith/isqrt_sim_record.json
    reader: json
    field: mutants_summary.killed
  pass_when:
  - field: mutants_summary.killed
    op: ge
    value: 16
  - field: mutants_summary.survived
    op: eq
    value: 0
  checks:
  - arith/isqrt/rtl/isqrt_nonrestoring_pipe.sv
  - arith/isqrt/rtl/isqrt_ooc.sv
  - arith/isqrt/rtl/isqrt_restoring_iter.sv
  - arith/isqrt/rtl/isqrt_restoring_pipe.sv
  - arith/isqrt/rtl/isqrt_sel.sv
  - arith/isqrt/model.py
  - arith/common/tb_stream.sv
  - arith/isqrt/tb/tb_isqrt.sv
  - arith/isqrt/verif/mutants.yaml
- id: V-SQRT-FORMAL-REF-RUN
  requirements:
  - SQRT-F-FORMAL-REF
  method: sim_test
  title: The formal reference and fault-catching tests pass
  evidence:
    file: results/139b_arith/isqrt_junit.xml
    reader: junit
    tests:
    - test_isqrt_formal_rtl::test_each_variant_equals_the_characterisation_unbounded
    - test_isqrt_formal_rtl::test_formal_catches_seeded_faults
  checks: *id001
- id: V-SQRT-FORMAL-REF
  requirements:
  - SQRT-F-FORMAL-REF
  method: formal
  title: 'Reference proofs: jobs proved unbounded, none failed'
  evidence:
    file: results/139b_arith/isqrt_formal_record.json
    reader: json
    field: summary.reference.proved_unbounded
  pass_when:
  - field: summary.reference.proved_unbounded
    op: ge
    value: 12
  - field: summary.reference.failed
    op: eq
    value: 0
  checks:
  - arith/isqrt/rtl/isqrt_nonrestoring_pipe.sv
  - arith/isqrt/rtl/isqrt_ooc.sv
  - arith/isqrt/rtl/isqrt_restoring_iter.sv
  - arith/isqrt/rtl/isqrt_restoring_pipe.sv
  - arith/isqrt/rtl/isqrt_sel.sv
  - arith/isqrt/model.py
  - arith/common/tb_stream.sv
  - arith/isqrt/tb/tb_isqrt.sv
  - arith/isqrt/formal/isqrt_fv.sv
- id: V-SQRT-FORMAL-FAULTS
  requirements:
  - SQRT-F-FORMAL-REF
  method: formal
  title: Six seeded faults each make the proof fail (bounded model checking)
  evidence:
    file: results/139b_arith/isqrt_formal_record.json
    reader: json
    field: summary.mutant.faults_caught
  pass_when:
  - field: summary.mutant.faults_caught
    op: ge
    value: 6
  - field: summary.mutant.failed
    op: eq
    value: 0
  bounded:
    depth: BMC, 8 to 16 cycles
  checks:
  - arith/isqrt/rtl/isqrt_nonrestoring_pipe.sv
  - arith/isqrt/rtl/isqrt_ooc.sv
  - arith/isqrt/rtl/isqrt_restoring_iter.sv
  - arith/isqrt/rtl/isqrt_restoring_pipe.sv
  - arith/isqrt/rtl/isqrt_sel.sv
  - arith/isqrt/model.py
  - arith/common/tb_stream.sv
  - arith/isqrt/tb/tb_isqrt.sv
  - arith/isqrt/formal/isqrt_fv.sv
- id: V-SQRT-FORMAL-PAIR-RUN
  requirements:
  - SQRT-F-FORMAL-PAIR
  method: sim_test
  title: The variant-pair tests pass
  evidence:
    file: results/139b_arith/isqrt_junit.xml
    reader: junit
    tests:
    - test_isqrt_formal_rtl::test_pipelined_variants_agree_with_each_other
  checks: *id001
- id: V-SQRT-FORMAL-PAIR
  requirements:
  - SQRT-F-FORMAL-PAIR
  method: formal
  title: Variant pairs proved equal, none failed
  evidence:
    file: results/139b_arith/isqrt_formal_record.json
    reader: json
    field: summary.pair.proved_unbounded
  pass_when:
  - field: summary.pair.proved_unbounded
    op: ge
    value: 3
  - field: summary.pair.failed
    op: eq
    value: 0
  checks:
  - arith/isqrt/rtl/isqrt_nonrestoring_pipe.sv
  - arith/isqrt/rtl/isqrt_ooc.sv
  - arith/isqrt/rtl/isqrt_restoring_iter.sv
  - arith/isqrt/rtl/isqrt_restoring_pipe.sv
  - arith/isqrt/rtl/isqrt_sel.sv
  - arith/isqrt/model.py
  - arith/common/tb_stream.sv
  - arith/isqrt/tb/tb_isqrt.sv
  - arith/isqrt/formal/isqrt_fv.sv
- id: V-LEAN-SQRT-RESTORING
  requirements:
  - SQRT-F-LEAN-RESTORING
  method: formal_lean
  title: 'The restoring recurrence is a floor square root: root^2 + rem = x and rem <= 2 * root, every width'
  evidence:
    file: formal/lean/records/build_record.json
    reader: json
  lean:
    module: Arith.Isqrt
    theorem: Arith.Isqrt.rsqrt_correct
  rtl_link:
    kind: transcription_tested
    source:
    - file: arith/isqrt/rtl/isqrt_restoring_iter.sv
      lines: 33-35
    - file: arith/isqrt/rtl/isqrt_restoring_iter.sv
      lines: 67-68
    transcribed_in: Arith/Isqrt.lean (rsqrt)
    crosscheck:
      file: formal/lean/Arith/CrossCheck.lean
      reference: the Python bit-exact model arith/isqrt/model.py (written from spec.md; the simulation tests tie it to the RTL), compared on small widths by formal/lean/tools/crosscheck_arith.py; not the
        RTL itself
- id: V-SQRT-BUILD
  requirements:
  - SQRT-F-BUILD
  method: sim_test
  title: Build descriptions current and consistent; wrapper lint and simulation; packaged harness runs on the library instance
  evidence:
    file: results/139b_arith/isqrt_junit.xml
    reader: junit
    tests:
    - test_isqrt_build_rtl::test_build_descriptions_are_complete_and_current
    - test_isqrt_build_rtl::test_packaged_harness_runs_against_an_instance
    - test_isqrt_build_rtl::test_ooc_wrapper_lints_and_is_functionally_exact_for_pipelines
  checks: *id001
- id: V-SQRT-OOC
  requirements:
  - SQRT-P-OOC
  method: timing
  title: The routed Vivado results of every prepared point (the records of the last run)
  evidence:
    file: arith/isqrt/verif/results/vivado_surface.json
    reader: json
    field: summary.routed_points
  checks:
  - arith/isqrt/build/nonrestoring_pipe/a7/build.yaml
  - arith/isqrt/build/nonrestoring_pipe/k26/build.yaml
  - arith/isqrt/build/restoring_iter/a7/build.yaml
  - arith/isqrt/build/restoring_iter/k26/build.yaml
  - arith/isqrt/build/restoring_pipe/a7/build.yaml
  - arith/isqrt/build/restoring_pipe/k26/build.yaml
