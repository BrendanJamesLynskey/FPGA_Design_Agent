# Formal jobs of the multiplier (arith brief 139a; tools/run_formal.py). The fv top (mult_fv.sv) holds the four multipliers (a plain `*` as the reference) and the
# assertions; a registered variant is compared with the reference delayed by its latency. prove = k-induction (unbounded); a combinational multiplier equivalence
# is an SMT problem whose size grows with the product of the widths, so the widths proved here are small (8 x 8, 9 x 6 and 6 x 9; a 10 x 10 attempt did not finish in 20 minutes and was dropped) and the larger ones are covered by simulation only.
jobs:
- {name: eq_8x8_signed, top: mult_fv, params: {WA: 8, WB: 8, SIGNED: 1, STAGES_D: 3, REG_L: 1, REG_B: 1}, mode: prove, depth: 5, sources: [formal/mult_fv.sv, rtl/mult_dsp.sv, rtl/mult_lut_array.sv, rtl/mult_booth_r4.sv], claim: "dsp (3 stages), lut_array and booth_r4 (1 register each) == a plain signed `*`, 8 x 8: proved for all inputs (k-induction)"}
- {name: eq_8x8_unsigned, top: mult_fv, params: {WA: 8, WB: 8, SIGNED: 0, STAGES_D: 2, REG_L: 0, REG_B: 0}, mode: prove, depth: 5, sources: [formal/mult_fv.sv, rtl/mult_dsp.sv, rtl/mult_lut_array.sv, rtl/mult_booth_r4.sv], claim: "dsp (2 stages), lut_array and booth_r4 (combinational) == a plain unsigned `*`, 8 x 8: proved for all inputs"}
- {name: eq_9x6_signed, top: mult_fv, params: {WA: 9, WB: 6, SIGNED: 1, STAGES_D: 1, REG_L: 1, REG_B: 0}, mode: prove, depth: 5, sources: [formal/mult_fv.sv, rtl/mult_dsp.sv, rtl/mult_lut_array.sv, rtl/mult_booth_r4.sv], claim: "the same signed, 9 x 6 (a multiplier with an odd digit count): proved for all inputs"}
- {name: eq_6x9_unsigned, top: mult_fv, params: {WA: 6, WB: 9, SIGNED: 0, STAGES_D: 0, REG_L: 1, REG_B: 1}, mode: prove, depth: 5, sources: [formal/mult_fv.sv, rtl/mult_dsp.sv, rtl/mult_lut_array.sv, rtl/mult_booth_r4.sv], claim: "the same unsigned, 6 x 9: proved for all inputs"}
- {name: mutant_booth_digit, top: mult_fv, params: {WA: 6, WB: 6, SIGNED: 1, STAGES_D: 1, REG_L: 0, REG_B: 0}, mode: bmc, depth: 4, mutant: bo_double_is_single, sources: [formal/mult_fv.sv, rtl/mult_dsp.sv, rtl/mult_lut_array.sv, rtl/mult_booth_r4.sv], claim: "a Booth multiplier whose +2 digit adds a is refuted"}
- {name: mutant_lut_sign_row, top: mult_fv, params: {WA: 6, WB: 6, SIGNED: 1, STAGES_D: 1, REG_L: 0, REG_B: 0}, mode: bmc, depth: 4, mutant: la_sign_row, sources: [formal/mult_fv.sv, rtl/mult_dsp.sv, rtl/mult_lut_array.sv, rtl/mult_booth_r4.sv], claim: "a LUT array that subtracts the wrong row is refuted"}
