# Formal jobs of the adder (arith brief 139a; tools/run_formal.py). The fv top (adder_fv.sv) holds the three variants and the assertions.
# prove = k-induction (unbounded: a pass holds for every input sequence); bmc = bounded model checking from reset (a pass says nothing past the depth).
jobs:
- {name: eq_w8, top: adder_fv, params: {WIDTH: 8, BLOCK: 3, STAGES: 3}, mode: prove, depth: 6, sources: [formal/adder_fv.sv, rtl/adder_ripple.sv, rtl/adder_carry_select.sv, rtl/adder_pipelined.sv], claim: "carry_select == ripple and pipelined == ripple delayed, WIDTH 8, BLOCK 3, STAGES 3: proved for all inputs (k-induction)"}
- {name: eq_w16, top: adder_fv, params: {WIDTH: 16, BLOCK: 4, STAGES: 4}, mode: prove, depth: 8, sources: [formal/adder_fv.sv, rtl/adder_ripple.sv, rtl/adder_carry_select.sv, rtl/adder_pipelined.sv], claim: "the same at WIDTH 16, BLOCK 4, STAGES 4: proved for all inputs"}
- {name: eq_w32, top: adder_fv, params: {WIDTH: 32, BLOCK: 8, STAGES: 5}, mode: prove, depth: 9, sources: [formal/adder_fv.sv, rtl/adder_ripple.sv, rtl/adder_carry_select.sv, rtl/adder_pipelined.sv], claim: "the same at WIDTH 32, BLOCK 8, STAGES 5 (a last block and chunks narrower than the rest): proved for all inputs"}
- {name: eq_w64, top: adder_fv, params: {WIDTH: 64, BLOCK: 16, STAGES: 8}, mode: prove, depth: 12, sources: [formal/adder_fv.sv, rtl/adder_ripple.sv, rtl/adder_carry_select.sv, rtl/adder_pipelined.sv], claim: "the same at WIDTH 64, BLOCK 16, STAGES 8: proved for all inputs"}
- {name: eq_w33_odd, top: adder_fv, params: {WIDTH: 33, BLOCK: 7, STAGES: 3}, mode: prove, depth: 7, sources: [formal/adder_fv.sv, rtl/adder_ripple.sv, rtl/adder_carry_select.sv, rtl/adder_pipelined.sv], claim: "the same at WIDTH 33, BLOCK 7, STAGES 3 (neither divides the width): proved for all inputs"}
- {name: mutant_cs_select, top: adder_fv, params: {WIDTH: 8, BLOCK: 3, STAGES: 3}, mode: bmc, depth: 6, mutant: cs_select_swapped, sources: [formal/adder_fv.sv, rtl/adder_ripple.sv, rtl/adder_carry_select.sv, rtl/adder_pipelined.sv], claim: "a carry_select with its block carries selected the wrong way is refuted (the check can fail)"}
- {name: mutant_pl_carry, top: adder_fv, params: {WIDTH: 8, BLOCK: 3, STAGES: 3}, mode: bmc, depth: 8, mutant: pl_carry_dropped, sources: [formal/adder_fv.sv, rtl/adder_ripple.sv, rtl/adder_carry_select.sv, rtl/adder_pipelined.sv], claim: "a pipelined adder that drops the chunk carry is refuted"}
