# adder testplan, schema v1 (brief 116) for the arithmetic library (brief 139a). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_adder
notes: 'Arithmetic library, function adder (brief 139a). Everything here except the performance requirement is before Vivado: the model, the RTL variants, simulation, formal equivalence,
  Lean statements and the prepared out-of-context build files. The one performance requirement (brief 160) says every prepared out-of-context point has a routed Vivado result; no Fmax
  or area bound is agreed. Every requirement is a draft written by the agent; none is agreed by a human. Lean statements are not approved. Generated by arith/tools/gen_testplan.py.'
discover:
- glob: arith/adder/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: ADD-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/adder/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (a bit-serial chain of full adders) on every input at
    small widths and with Python's integer arithmetic on random large-width inputs, and the conventions that a user could guess wrong (spec.md, last section) are pinned by examples.
  source: arith/adder/spec.md
  spec_status: draft
- id: ADD-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (16 exhaustive points, 14 random ones, across 3 variants), each variant''s outputs equal the model''s in every clock: every input
    is driven at the small points; edge values, runs of ones, and random inputs at the large ones. The function is exact, so there is no error bound.'
  source: arith/adder/spec.md
  spec_status: draft
- id: ADD-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (ripple: 0; carry_select: 0; pipelined: STAGES), and the bench, run with a latency two clocks off, fails for
    every variant, so the passing runs prove the latency rather than assume it.'
  source: arith/adder/spec.md
  spec_status: draft
- id: ADD-F-EQUIV
  kind: functional
  title: The variants are equivalent to a plain reference, by proof where the tools allow
  text: SymbiYosys with the slang front end checks the variants against each other and a plain reference (a single `+` or `*`, or the specification written as RTL). The jobs in formal/jobs.yaml
    name the widths; a proof is by k-induction (for all inputs, any run length) at the widths listed there, a bounded check holds only to its stated depth. Widths beyond the listed ones
    are covered by simulation, not by proof.
  source: arith/adder/formal/jobs.yaml
  spec_status: draft
- id: ADD-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each, in the variant''s RTL: an inverted condition, a wrong constant, a dropped connection, a lost reset)
    makes the cocotb bench fail; mutants that survive or do not build are reported, never hidden.'
  source: arith/adder/verif/mutants.yaml
  spec_status: draft
- id: ADD-F-HARNESS
  kind: functional
  title: The packaged verification harness is a standalone deliverable that works
  text: arith/adder/harness holds the model, the cocotb bench, a SystemVerilog checker, coverage targets and a runner that needs nothing else from the repository. Run standalone against
    every variant (one small exhaustive point and one large random point each, with the checker beside the instance) it passes and the random runs meet every coverage target; run against
    a planted fault it fails, with and without the checker. Its generated files are the repository's own bench, so they cannot drift.
  source: arith/adder/harness/README.md
  spec_status: draft
- id: ADD-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared in 139a and run in brief 160) are current
    and lint-clean at every point they list, so a Vivado run can start from the repository alone.
  source: arith/adder/spec.yaml
  spec_status: draft
- id: ADD-F-LEAN-CS
  kind: functional
  title: Carry-select composition adds, for every width
  text: A carry-select adder (a low block, and a high block computed for carry in 0 and 1 and selected by the low block's carry out) returns the same sum and carry out as plain addition,
    for every block widths m and k and every pair of operands. The statement is the specification and is NOT approved by a human (verif/lean_approvals.yaml is empty), so the proof is
    shown but not counted as verification. The Lean text is a hand transcription of the RTL's structure; it models no timing or clocking.
  source: arith/adder/rtl/adder_carry_select.sv (g_first and g_sel blocks, two blocks)
  spec_status: draft
- id: ADD-F-LEAN-SUB
  kind: functional
  title: Subtraction is addition of the complements, for every width
  text: 'For every width n, a + ~b + ~bin on n bits equals a - b - bin modulo 2^n, and its carry out is 1 exactly when there is no borrow: the identity every variant''s subtract path
    rests on. The statement is the specification and is NOT approved by a human (verif/lean_approvals.yaml is empty), so the proof is shown but not counted as verification. The Lean
    text is a hand transcription of the RTL''s structure; it models no timing or clocking.'
  source: arith/adder/rtl/adder_ripple.sv (be, ce, the one adder)
  spec_status: draft
- id: ADD-P-OOC
  kind: performance
  title: Every prepared point places and routes out of context on Artix-7 and K26
  text: Each point of the build files of adder (build/<variant>/build.yaml; 20 in all, both parts) goes through Vivado 2026.1 out-of-context synthesis, placement and routing and leaves
    a recorded result (utilisation, WNS, WHS, Fmax, logic levels, vectorless power) in verif/results/vivado_ooc_<variant>_<part>.json. The measured values and each point's pre-stated
    expectation are in the Measured table of spec.md and in verif/results/vivado_surface.json; this requirement states only that the measurement exists for every point, because no Fmax
    or area bound has been agreed.
  source: arith/adder/spec.md
  spec_status: draft
  performance:
    quantity: prepared points with a routed out-of-context Vivado result
    unit: points
    op: ge
    bound: 20
    condition: Vivado 2026.1 out-of-context, one thread, the clocks of the build files, brief 160
verification:
- id: V-ADD-MODEL
  requirements:
  - ADD-F-MODEL
  method: sim_test
  title: The model against independent formulations (exhaustive small, random large) and the pinned conventions
  evidence:
    file: arith/adder/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_adder_model::*
  checks:
  - arith/adder/model.py
- id: V-ADD-EXHAUSTIVE
  requirements:
  - ADD-F-EXACT
  method: sim_test
  title: Every variant against the model, every input, at the small points (Icarus + cocotb)
  evidence:
    file: arith/adder/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_adder_exhaustive_rtl::*
  checks:
  - arith/adder/rtl/adder_ripple.sv
  - arith/adder/rtl/adder_carry_select.sv
  - arith/adder/rtl/adder_pipelined.sv
  - arith/adder/tests/adder_cocotb.py
  - arith/adder/model.py
- id: V-ADD-RANDOM
  requirements:
  - ADD-F-EXACT
  method: sim_test
  title: 'Every variant against the model at the large points: edge values, carry runs and random inputs (Icarus + cocotb)'
  evidence:
    file: arith/adder/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_adder_random_rtl::*
  checks:
  - arith/adder/rtl/adder_ripple.sv
  - arith/adder/rtl/adder_carry_select.sv
  - arith/adder/rtl/adder_pipelined.sv
  - arith/adder/tests/adder_cocotb.py
  - arith/adder/model.py
- id: V-ADD-LATENCY
  requirements:
  - ADD-F-LAT
  method: sim_test
  title: The bench passes at the stated latency and fails two clocks off, for every variant
  evidence:
    file: arith/adder/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_adder_latency_rtl::*
  checks:
  - arith/adder/rtl/adder_ripple.sv
  - arith/adder/rtl/adder_carry_select.sv
  - arith/adder/rtl/adder_pipelined.sv
  - arith/adder/tests/adder_cocotb.py
  - arith/adder/model.py
- id: V-ADD-FORMAL-PROOF
  requirements:
  - ADD-F-EQUIV
  method: formal
  title: k-induction proofs of the variants against the reference (5 jobs; widths in formal/jobs.yaml)
  evidence:
    file: arith/adder/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_adder_formal_proof_rtl::*
  checks:
  - arith/adder/rtl/adder_ripple.sv
  - arith/adder/rtl/adder_carry_select.sv
  - arith/adder/rtl/adder_pipelined.sv
  - arith/adder/formal/adder_fv.sv
  - arith/adder/formal/jobs.yaml
- id: V-ADD-FORMAL-REFUTE
  requirements:
  - ADD-F-EQUIV
  method: formal
  title: Each formal check refutes a planted fault (the check can fail)
  evidence:
    file: arith/adder/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_adder_formal_refute_rtl::*
  checks:
  - arith/adder/rtl/adder_ripple.sv
  - arith/adder/rtl/adder_carry_select.sv
  - arith/adder/rtl/adder_pipelined.sv
  - arith/adder/formal/adder_fv.sv
  - arith/adder/formal/jobs.yaml
- id: V-ADD-MUTANT-TEST
  requirements:
  - ADD-F-BENCH
  method: sim_test
  title: 'The mutation run as a test: no mutant survives, none fails to build'
  evidence:
    file: arith/adder/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_adder_mutants_rtl::*
  checks:
  - arith/adder/rtl/adder_ripple.sv
  - arith/adder/rtl/adder_carry_select.sv
  - arith/adder/rtl/adder_pipelined.sv
  - arith/adder/tests/adder_cocotb.py
  - arith/adder/model.py
- id: V-ADD-MUTANT-SCORE
  requirements:
  - ADD-F-BENCH
  method: sim_measurement
  title: Mutants killed of valid mutants (the record of the last full run)
  evidence:
    file: arith/adder/verif/results/mutation.json
    reader: json
  pass_when:
  - field: survived
    op: eq
    value: []
  - field: invalid
    op: eq
    value: []
  - field: valid
    op: ge
    value: 10
  - field: score_pct
    op: eq
    value: 100.0
  checks:
  - arith/adder/rtl/adder_ripple.sv
  - arith/adder/rtl/adder_carry_select.sv
  - arith/adder/rtl/adder_pipelined.sv
  - arith/adder/tests/adder_cocotb.py
  - arith/adder/model.py
  - arith/adder/verif/mutants.yaml
- id: V-ADD-HARNESS
  requirements:
  - ADD-F-HARNESS
  method: sim_test
  title: The packaged harness run standalone on every variant (with the checker and the coverage targets) and on a planted fault
  evidence:
    file: arith/adder/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_adder_harness_rtl::*
  checks:
  - arith/adder/rtl/adder_ripple.sv
  - arith/adder/rtl/adder_carry_select.sv
  - arith/adder/rtl/adder_pipelined.sv
  - arith/adder/harness/assertions.sv
  - arith/adder/harness/chk_top.sv
  - arith/adder/harness/coverage.yaml
  - arith/adder/harness/run_harness.py
  - arith/adder/harness/model.py
  - arith/adder/harness/bench.py
- id: V-ADD-PACKAGE
  requirements:
  - ADD-F-PACKAGE
  method: sim_test
  title: spec.yaml against the RTL headers, spec.md against spec.yaml, Verilator -Wall at every point, wrappers and build.yaml current and lint-clean
  evidence:
    file: arith/adder/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_adder_package::*
  checks:
  - arith/adder/rtl/adder_ripple.sv
  - arith/adder/rtl/adder_carry_select.sv
  - arith/adder/rtl/adder_pipelined.sv
  - arith/adder/spec.yaml
  - arith/adder/spec.md
  - arith/adder/build/ripple/build.yaml
  - arith/adder/build/carry_select/build.yaml
  - arith/adder/build/pipelined/build.yaml
- id: V-ADD-LEAN-CS
  requirements:
  - ADD-F-LEAN-CS
  method: formal_lean
  title: Carry-select composition adds
  lean:
    module: Arith.Adder
    theorem: ArithAdder.cs_correct
  rtl_link:
    kind: transcription_untested
    source:
    - file: arith/adder/rtl/adder_carry_select.sv
      lines: 39-47
    transcribed_in: formal/lean/Arith/Adder.lean (csSum, csCarry, sumN, carryN)
- id: V-ADD-LEAN-SUB
  requirements:
  - ADD-F-LEAN-SUB
  method: formal_lean
  title: Subtraction is addition of the complements
  lean:
    module: Arith.Adder
    theorem: ArithAdder.sub_is_add_complement
  rtl_link:
    kind: transcription_untested
    source:
    - file: arith/adder/rtl/adder_ripple.sv
      lines: 26-28
    transcribed_in: formal/lean/Arith/Adder.lean (sumN, carryN, the statement itself)
- id: V-ADD-OOC
  requirements:
  - ADD-P-OOC
  method: timing
  title: The routed Vivado results of every prepared point (the records of the last run)
  evidence:
    file: arith/adder/verif/results/vivado_surface.json
    reader: json
    field: summary.routed_points
  checks:
  - arith/adder/build/carry_select/build.yaml
  - arith/adder/build/pipelined/build.yaml
  - arith/adder/build/ripple/build.yaml
