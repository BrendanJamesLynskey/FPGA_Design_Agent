# lzc_norm testplan, schema v1 (brief 116 format; brief 139b). The agent wrote every requirement below from the owner's request; none is agreed by a human (`spec_status: draft`).
# Status is never typed here: `python -m flow.trace_v1 write arith/lzc_norm` computes it from the evidence files named in each item. Evidence is regenerated by the commands in `notes`.
schema: fpga-design-agent/testplan/v1
design: lzc_norm
notes: 'Arithmetic library function lzc_norm (brief 139b). Every requirement is a draft written by the agent from the owner''s request (spec_status: draft; only a human sets agreed). Evidence is generated
  by `python -m pytest arith/lzc_norm/tests --junitxml=results/139b_arith/lzc_norm_junit.xml` with ARITH_RECORD_DIR=results/139b_arith. The Lean items show ''statement not approved'': lean_approvals.yaml
  is the owner''s. The one performance requirement (brief 160) says every prepared out-of-context point has a routed Vivado result; no Fmax or area bound is agreed.'
discover:
- glob: arith/lzc_norm/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: LZN-F-MODEL
  kind: functional
  title: 'The model is the specification: it equals integer arithmetic'
  text: 'For the leading-zero count and normaliser: lz and y equal the bit_length definition for every input at W = 2 to 14 and for random values at W up to 256, and the stagewise log-shifter recurrence
    computes the same count and word.'
  source: arith/lzc_norm/spec.md#the-function
  spec_status: draft
- id: LZN-F-RTL-EXH
  kind: functional
  title: Every variant is bit-exact against the model, exhaustively at small widths
  text: 'Simulation (Icarus 14) of every variant against the model: every input at W = 2 to 16 (powers of two and not), every variant, with input gaps; count, normalised word, order and latency checked.'
  source: arith/lzc_norm/spec.md#the-function
  spec_status: draft
- id: LZN-F-RTL-RAND
  kind: functional
  title: Every variant is bit-exact against the model at large widths
  text: 'Simulation of every variant against the model: 3000 inputs of every magnitude at W = 24, 32, 33, 48, 64 and 100.'
  source: arith/lzc_norm/spec.md#the-function
  spec_status: draft
- id: LZN-F-LAT
  kind: functional
  title: Latency and throughput are what the spec states
  text: The measured latency equals the spec (1, 1, ceil(K / PIPE), 2 clocks) for every variant and the stagewise variant at every PIPE from 1 to K + 1 at W = 9 and 16, one result per clock.
  source: arith/lzc_norm/spec.md#the-function
  spec_status: draft
- id: LZN-F-LINT
  kind: functional
  title: The RTL is Verilator -Wall clean
  text: Verilator -Wall --lint-only reports nothing for any variant at W = 2, 3, 8, 13, 16 and 32 (stagewise with PIPE = 1, 2 and 40).
  source: arith/lzc_norm/spec.md#the-function
  spec_status: draft
- id: LZN-F-MUTANT
  kind: functional
  title: The bench catches seeded faults
  text: 'Each of 16 seeded faults (one text change in the RTL, verif/mutants.yaml) makes the bench fail: killed/total = 16/16. 1 further mutant(s) are equivalent (the same function and timing) and are listed
    apart with the reason; they are not counted.'
  source: arith/lzc_norm/spec.md#the-function
  spec_status: draft
- id: LZN-F-FORMAL-REF
  kind: functional
  title: Every variant equals an independent reference (SymbiYosys)
  text: 'SymbiYosys with the slang front end: each variant satisfies the characterisation of the count (zero bits above the leading one, y = x << lz with its MSB set; W for x = 0) for all input sequences
    from reset: 13 jobs at W = 5 to 12; unbounded (abc pdr). Six seeded faults are applied to the RTL and the same proof fails (bounded model checking finds the counterexample), which shows the harness
    is not vacuous.'
  source: arith/lzc_norm/spec.md#the-function
  spec_status: draft
- id: LZN-F-FORMAL-PAIR
  kind: functional
  title: Variants of the function agree with each other (SymbiYosys)
  text: 'SymbiYosys with the slang front end, no reference involved: tree against priority loop (W = 8, 11), tree against one-block stagewise (W = 8), and the two-clock tree against two- and three-group
    stagewise (W = 8, 12) give the same outputs on the same inputs; unbounded (abc pdr).'
  source: arith/lzc_norm/spec.md#the-function
  spec_status: draft
- id: LZN-F-LEAN-TREE
  kind: functional
  title: The tree leading-zero count is correct for every width 2^k (Lean)
  text: 'lzc_tree.sv''s recursive halving returns a count c with 2^(P-1-c) <= x < 2^(P-c) for every non-zero word of P = 2^k bits and flags a zero word. Proved in Lean, statement not approved; the Lean
    base case is a one-bit word (the RTL''s leaf is two bits: one more unfolding). Zero padding to a non-power-of-two width, the stagewise variants and the barrel shift are not in the Lean model.'
  source: arith/lzc_norm/spec.md#verification-everything-before-vivado
  spec_status: draft
- id: LZN-F-BUILD
  kind: functional
  title: Out-of-context build descriptions are prepared for Artix-7 and K26 (prepared in brief 139b, run in brief 160)
  text: 'For every variant of the leading-zero count and normaliser there is a build.yaml and an out-of-context clock constraint for xc7a100t and xck26, current against arith/tools/gen_build.py, consistent
    with the RTL (top, parameters, sources), with the expected primitive use evaluated for each point; the out-of-context wrapper lints clean and is functionally exact for the always-ready variants; the
    packaged verification harness (harness/run.py, which a user reruns against their own instance) passes on the library instance with every coverage bin hit. This requirement is about preparation; the measured area, Fmax and power are in brief 160's records.'
  source: arith/lzc_norm/spec.md#vivado-builds-prepared-in-brief-139b-run-in-brief-160
  spec_status: draft
- id: LZN-P-OOC
  kind: performance
  title: Every prepared point places and routes out of context on Artix-7 and K26
  text: Each point of the build files of lzc_norm (build/<variant>/build.yaml; 28 in all, both parts) goes through Vivado 2026.1 out-of-context synthesis, placement and routing and leaves
    a recorded result (utilisation, WNS, WHS, Fmax, logic levels, vectorless power) in verif/results/vivado_ooc_<variant>_<part>.json. The measured values and each point's pre-stated
    expectation are in the Measured table of spec.md and in verif/results/vivado_surface.json; this requirement states only that the measurement exists for every point, because no Fmax
    or area bound has been agreed.
  source: arith/lzc_norm/spec.md
  spec_status: draft
  performance:
    quantity: prepared points with a routed out-of-context Vivado result
    unit: points
    op: ge
    bound: 28
    condition: Vivado 2026.1 out-of-context, one thread, the clocks of the build files, brief 160
verification:
- id: V-LZN-MODEL
  requirements:
  - LZN-F-MODEL
  method: sim_test
  title: Model tests against Python integer arithmetic
  evidence:
    file: results/139b_arith/lzc_norm_junit.xml
    reader: junit
    tests:
    - test_lzc_norm_model::*
  checks:
  - arith/lzc_norm/model.py
- id: V-LZN-RTL-EXH
