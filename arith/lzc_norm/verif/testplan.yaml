  checks:
  - arith/lzc_norm/rtl/lzc_norm_ooc.sv
  - arith/lzc_norm/rtl/lzc_tree.sv
  - arith/lzc_norm/rtl/lznorm_loop_barrel.sv
  - arith/lzc_norm/rtl/lznorm_sel.sv
  - arith/lzc_norm/rtl/lznorm_stagewise_pipe.sv
  - arith/lzc_norm/rtl/lznorm_tree_barrel.sv
  - arith/lzc_norm/rtl/lznorm_tree_barrel_2st.sv
  - arith/lzc_norm/model.py
  - arith/common/tb_stream.sv
  - arith/lzc_norm/tb/tb_lzc_norm.sv
  - arith/lzc_norm/verif/mutants.yaml
- id: V-LZN-MUTANT-SCORE
