- id: V-LEAN-LZN-TREE
  requirements:
  - LZN-F-LEAN-TREE
  method: formal_lean
  title: 'The recursive-halving count is correct for every word of 2^k bits: it brackets the word and flags non-zero'
  evidence:
    file: formal/lean/records/build_record.json
    reader: json
  lean:
    module: Arith.Lzc
    theorem: Arith.Lzc.lzcTree_correct
  rtl_link:
    kind: transcription_tested
    source:
    - file: arith/lzc_norm/rtl/lzc_tree.sv
      lines: 12-23
    transcribed_in: Arith/Lzc.lean (lzcTree)
    crosscheck:
      file: formal/lean/Arith/CrossCheck.lean
      reference: the Python bit-exact model arith/lzc_norm/model.py (written from spec.md; the simulation tests tie it to the RTL), compared on small widths by formal/lean/tools/crosscheck_arith.py; not
        the RTL itself
