# Formal jobs of atan2_mag (arith brief 139d; tools/run_formal.py). The fv top (atan2_fv.sv) compares a variant (picked by SEL) with atan2_ref, the exact angle and length of a 4-bit vector, delayed by the variant's latency, and the variants with each other; prove = k-induction (unbounded), bmc = bounded (used only to refute a planted fault, which must fail). Angle bounds are in units of 2**-24 turn, length bounds in 2**-16. Wider vectors are covered by simulation and the accuracy scan only.
jobs:
- {name: "cordic_ph8_nit8", top: "atan2_fv", params: {SEL: 1, PH: 8, NIT: 8, G: 6, GRP: 2, BA: 62744, BM: 33734}, mode: "prove", depth: 12, sources: ["formal/atan2_fv.sv", "formal/atan2_ref.sv", "rtl/atan2_cordic.sv", "rtl/atan2_cordic_g2.sv"], claim: "cordic at W = 4, PH = 8, 8 iterations, 6 guard bits: angle and length within their stated errors of the exact atan2 and hypot (the atan2_ref ROM): proved for all inputs (k-induction)"}
- {name: "g2_ph8_nit8_grp2", top: "atan2_fv", params: {SEL: 2, PH: 8, NIT: 8, G: 6, GRP: 2, BA: 62744, BM: 33734}, mode: "prove", depth: 8, sources: ["formal/atan2_fv.sv", "formal/atan2_ref.sv", "rtl/atan2_cordic.sv", "rtl/atan2_cordic_g2.sv"], claim: "cordic_g2 with GRP = 2 at the same point: proved for all inputs"}
- {name: "g2_ph8_nit8_grp3", top: "atan2_fv", params: {SEL: 2, PH: 8, NIT: 8, G: 6, GRP: 3, BA: 62744, BM: 33734}, mode: "prove", depth: 8, sources: ["formal/atan2_fv.sv", "formal/atan2_ref.sv", "rtl/atan2_cordic.sv", "rtl/atan2_cordic_g2.sv"], claim: "cordic_g2 with GRP = 3 (8 iterations are not a multiple of 3): proved for all inputs"}
- {name: "same_grp2", top: "atan2_fv", params: {SEL: 4, PH: 8, NIT: 8, G: 6, GRP: 2, BA: 62744, BM: 33734}, mode: "prove", depth: 12, sources: ["formal/atan2_fv.sv", "formal/atan2_ref.sv", "rtl/atan2_cordic.sv", "rtl/atan2_cordic_g2.sv"], claim: "cordic_g2 (GRP = 2) is bit-identical to cordic, delayed to meet it: proved for all inputs"}
- {name: "same_grp3", top: "atan2_fv", params: {SEL: 4, PH: 8, NIT: 8, G: 6, GRP: 3, BA: 62744, BM: 33734}, mode: "prove", depth: 12, sources: ["formal/atan2_fv.sv", "formal/atan2_ref.sv", "rtl/atan2_cordic.sv", "rtl/atan2_cordic_g2.sv"], claim: "cordic_g2 (GRP = 3, a partial last group) is bit-identical to cordic: proved for all inputs"}
- {name: "mutant_reflection", top: "atan2_fv", params: {SEL: 1, PH: 8, NIT: 6, G: 6, GRP: 2, BA: 98517, BM: 31805}, mode: "bmc", depth: 10, mutant: "ac_y_not_reflected", sources: ["formal/atan2_fv.sv", "formal/atan2_ref.sv", "rtl/atan2_cordic.sv", "rtl/atan2_cordic_g2.sv"], claim: "a CORDIC that does not negate y in the reflection is refuted"}
- {name: "mutant_g2_extra_iteration", top: "atan2_fv", params: {SEL: 4, PH: 8, NIT: 7, G: 6, GRP: 3, BA: 65537, BM: 33734}, mode: "bmc", depth: 10, mutant: "ag_extra_iteration", sources: ["formal/atan2_fv.sv", "formal/atan2_ref.sv", "rtl/atan2_cordic.sv", "rtl/atan2_cordic_g2.sv"], claim: "a grouped CORDIC that runs one iteration too many when NIT is not a multiple of GRP is no longer the same function as cordic: refuted"}
