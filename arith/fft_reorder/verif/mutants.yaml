# the lines below.
# Left out as equivalent: wpos = wc (no restart at in_sof): the write counter wraps at N, so for the contiguous frames of exactly N words the protocol requires it equals the restarted counter; it differs only when a frame is cut short, which is outside the protocol and is documented in spec.md
mutants:
- {class: connection, name: read_bank, new: rd_bank <= ~wb;, old: rd_bank <= wb;, variant: pingpong, why: the bank just written is not the one read}
- {class: connection, name: bank_toggle, new: wb      <= wb;, old: wb      <= ~wb;, variant: pingpong, why: the write bank never toggles}
- {class: constant, name: read_end, new: if (rc == LOGN'(N - 2)) rd_on <= 1'b0;, old: if (rc == LOGN'(N - 1)) rd_on <= 1'b0;, variant: pingpong, why: the read stops one word early}
- {class: constant, name: sof_pos, new: s1 <= rd_on && (rc == LOGN'(1));, old: s1 <= rd_on && (rc == '0);, variant: pingpong, why: out_sof marks the second word}
- {class: operator, file: ../fft_common/fft_bitrev.sv, name: bitrev_identity, new: 'y[i] = a[i];', old: 'y[i] = a[LOGN-1-i];', variant: pingpong, why: no reversal}
- {class: connection, name: bank_select, new: b1 <= wb;, old: b1 <= rd_bank;, variant: pingpong, why: the output select follows the write bank}
- {class: connection, name: out_mux, new: 'out_d     = b1 ? rd0 : rd1;', old: 'out_d     = b1 ? rd1 : rd0;', variant: pingpong, why: the banks are swapped at the output}
- {class: connection, name: write_bank, new: 'if (wb) mem0[wpos] <= in_d;', old: 'if (wb) mem1[wpos] <= in_d;', variant: pingpong, why: both banks are written to bank 0}
- {class: operator, file: ../fft_common/fft_bitrev.sv, name: bitrev_off, new: 'for (int i = 0; i < LOGN - 1; i++) y[i] = a[LOGN-1-i];', old: 'for (int i = 0; i < LOGN; i++) y[i] = a[LOGN-1-i];', variant: pingpong, why: the top bit of the address is dropped (left X)}
