# fft_reorder testplan, schema v1 (brief 116) for the frequency-domain suite (brief 148). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_fft_reorder
notes: 'Frequency-domain suite, function fft_reorder (brief 148). Everything here is before Vivado: the model, the RTL variants, simulation, formal properties and the prepared out-of-context
  build files. No performance requirement on LUTs, DSPs, Fmax or power exists because none has been measured; the Vivado runs (build/<variant>/build.yaml, queued in _handoff/fpga_agent/vivado_later_queue.md)
  will add them. Every requirement is a draft written by the agent; none is agreed by a human. There are no Lean statements and no packaged harness for this suite (stated in the report).
  Generated by arith/tools/gen_testplan_fft.py.'
discover:
- glob: arith/fft_reorder/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: FRO-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/fft_reorder/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (a bit-string reversal of every position, and the
    involution and permutation properties for every LOGN up to 12), and the conventions that a user could guess wrong (spec.md, last section) are pinned by examples.
  source: arith/fft_reorder/spec.md
  spec_status: draft
- id: FRO-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (8 directed or exhaustive points, 3 random ones, across 1 variants), each variant''s outputs equal the model''s: frames of distinct
    words (so a wrong address shows at once), back to back and after gaps of 0, 1, 2 and more clocks, up to N = 4096, and random words. The function is an exact permutation.'
  source: arith/fft_reorder/spec.md
  spec_status: draft
- id: FRO-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (pingpong: (1<<LOGN)+1), and the bench, run with a latency two clocks off, fails for every variant, so the passing
    runs prove the latency rather than assume it.'
  source: arith/fft_reorder/spec.md
  spec_status: draft
- id: FRO-F-EQUIV
  kind: functional
  title: The properties named in formal/jobs.yaml hold, by proof where the tools allow
  text: 'SymbiYosys with the slang front end checks the properties of formal/jobs.yaml: a proof is by k-induction (for all inputs, any run length) at the parameters listed there, a bounded
    check holds only to its stated depth. What the jobs say is in each job''s `claim`; parameters beyond the listed ones are covered by simulation, not by proof.'
  source: arith/fft_reorder/formal/jobs.yaml
  spec_status: draft
- id: FRO-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each: an inverted condition, a wrong constant, a dropped connection, a wrong width) makes the cocotb bench
    fail, or is argued equivalent in the file''s header; mutants that survive or do not build are reported, never hidden.'
  source: arith/fft_reorder/verif/mutants.yaml
  spec_status: draft
- id: FRO-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/fft_reorder/spec.yaml
  spec_status: draft
verification:
- id: V-FRO-MODEL
  requirements:
  - FRO-F-MODEL
  method: sim_test
  title: The model against independent formulations and the pinned conventions
  evidence:
    file: arith/fft_reorder/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_fft_reorder_model::*
  checks:
  - arith/fft_reorder/model.py
  - arith/fft_common/fft_ref.py
- id: V-FRO-DIRECTED
  requirements:
  - FRO-F-EXACT
  method: sim_test
  title: 'Every variant against the model at the small points (Icarus + cocotb): directed or exhaustive stimuli'
  evidence:
    file: arith/fft_reorder/verif/results/pytest_junit.xml
    reader: junit
    tests:
