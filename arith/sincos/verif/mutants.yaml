- {name: "sc_q_misaligned", variant: "cordic", class: "connection", old: "qr <= qi;", new: "qr <= q;", why: "the quadrant is not delayed with the data"}
- {name: "sc_no_round", variant: "cordic", class: "operator", old: "assign xs  = (xo + (DW'(1) <<< (HG - 1))) >>> G;", new: "assign xs  = xo >>> G;", why: "the cosine is truncated, not rounded"}
- {name: "sc_z0_shift", variant: "cordic", class: "constant", old: "assign z0 = ZW'(signed'({1'b0, o})) <<< (ZF - PH);", new: "assign z0 = ZW'(signed'({1'b0, o})) <<< (ZF - PH + 1);", why: "the start angle is doubled"}
- {name: "sc_clamp_value", variant: "cordic", class: "constant", old: "(xs > DW'((1 << FB) - 1)) ? FB'((1 << FB) - 1)", new: "(xs > DW'((1 << FB) - 1)) ? FB'((1 << FB) - 2)", why: "the cosine's limit is one place too low"}
- {name: "cx_quadrant1", variant: "cordic", class: "operator", old: "2'd1:    begin s = cp;        c = OW'(-sp);  end", new: "2'd1:    begin s = cp;        c = sp;        end", why: "quadrant 1 does not negate the cosine"}
- {name: "cx_quadrant2", variant: "cordic", class: "operator", old: "2'd2:    begin s = OW'(-sp);  c = OW'(-cp);  end", new: "2'd2:    begin s = sp;        c = OW'(-cp);  end", why: "quadrant 2 does not negate the sine"}
- {name: "cx_quadrant3", variant: "cordic", class: "operator", old: "default: begin s = OW'(-cp);  c = sp;        end", new: "default: begin s = OW'(-cp);  c = cp;        end", why: "quadrant 3 returns the cosine twice"}
