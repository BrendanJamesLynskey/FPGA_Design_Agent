# Formal jobs of sincos (arith brief 139d; tools/run_formal.py). The fv top (sincos_fv.sv) compares a variant (picked by SEL) with sincos_ref, the exact sine and cosine of an 8-bit phase, delayed by the variant's latency; prove = k-induction (unbounded), bmc = bounded (used only to refute a planted fault, which must fail). Bounds are in units of 2**-24. Wider phases are covered by simulation and the exhaustive accuracy scan only.
jobs:
- {name: "lerp_ow8", top: "sincos_fv", params: {SEL: 1, OW: 8, SBL: 3, SBP: 3, NIT: 8, G: 3, BL: 135973, BP: 131073, BC: 195342}, mode: "prove", depth: 5, sources: ["formal/sincos_fv.sv", "formal/sincos_ref.sv", "rtl/sincos_lerp.sv", "rtl/sincos_poly2.sv", "rtl/sincos_cordic.sv"], claim: "lerp at PH = 8, OW = 8, 8 segments is within its stated error of the exact sine and cosine (the sincos_ref ROM), quadrant map included: proved for all inputs (k-induction)"}
