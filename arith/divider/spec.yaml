# Machine-readable specification of the divider function (brief 139b). Human-readable form: spec.md. spec_status is set by a human only.
function: divider
spec_version: 1
spec_status: draft
summary: Unsigned W-bit division, quotient and remainder.
parameters:
  W: {meaning: operand width in bits, range: "2 or more", checked_in_simulation: "2 to 8 exhaustively, 16 24 32 64 by random and edge vectors"}
  PIPE: {meaning: "unrolled variants only: quotient bits per register stage", range: "1 to W (more than W behaves as W)"}
interface:
  clock: "clk (rising edge)"
  reset: "rst (synchronous, active high; clears only the valid flags and the iterative divider's busy state, not the data path)"
  in: {in_valid: 1, in_ready: "1 for the unrolled variants; low while an iterative divider is busy", in_data: "{n, d}, 2*W bits, both unsigned"}
  out: {out_valid: 1, out_data: "{q, r}, 2*W bits, both unsigned; meaningful only while out_valid is high"}
  handshake: "a transfer happens on a rising edge where in_valid and in_ready are both high; there is no back-pressure on the output (out_valid is one clock wide per result, results are never held)"
function_definition:
  d_nonzero: "q = floor(n / d), r = n - q * d, so r < d"
  d_zero: "q = 2**W - 1 (all ones), r = n (the RISC-V convention); no flag is raised"
error_bound: exact (no approximation)
latency_definition: "clock edges from the edge that accepts an input to the edge that samples out_valid high (1 = out_valid is high in the cycle immediately after the accepting edge)"
variants:
  - id: restoring_iter
    module: div_restoring_iter
    selector: {VARIANT: 0}
    protocol: "valid/ready on the input (a transfer is in_valid and in_ready on a rising edge; in_ready is low while a result is being computed and and is high again in the cycle out_valid is high), out_valid one clock wide, no back-pressure on the output, results in input order"
    reset_clock_assumptions: "one clock, rising edge; rst is synchronous and must be held for at least one clock before the first in_valid (the formal harness assumes reset in the first cycle only); outputs and in_ready are defined from the first clock after reset; data-path registers are not reset"
    latency: "W + 1"
    throughput: "one division per W + 1 clocks (in_ready low while busy)"
    expected_primitives: {carry4: "ceil((W+1)/4)", dsp48: 0, bram: 0, ff: "3*W + ceil(log2(W+1)) + 2"}
    trade_off: smallest; one subtractor reused W times; slowest per division
    points: [{W: 16}, {W: 32}]
  - id: nonrestoring_iter
    module: div_nonrestoring_iter
    selector: {VARIANT: 1}
    protocol: "valid/ready on the input (a transfer is in_valid and in_ready on a rising edge; in_ready is low while a result is being computed and and is high again in the cycle out_valid is high), out_valid one clock wide, no back-pressure on the output, results in input order"
    reset_clock_assumptions: "one clock, rising edge; rst is synchronous and must be held for at least one clock before the first in_valid (the formal harness assumes reset in the first cycle only); outputs and in_ready are defined from the first clock after reset; data-path registers are not reset"
    latency: "W + 2"
    throughput: "one division per W + 2 clocks"
    expected_primitives: {carry4: "ceil((W+2)/4) + ceil((W+1)/4)", dsp48: 0, bram: 0, ff: "3*W + 1 + ceil(log2(W+2)) + 2"}
    trade_off: no restore multiplexer, one extra clock and a second (correction) adder
    points: [{W: 16}, {W: 32}]
  - id: restoring_pipe
    module: div_restoring_pipe
    selector: {VARIANT: 2}
    protocol: "valid only: in_ready is constant 1, fixed latency, one result per clock, no stall or enable (a free-running pipeline); out_valid is in_valid delayed by the latency, results in input order"
    reset_clock_assumptions: "one clock, rising edge; rst is synchronous and must be held for at least one clock before the first in_valid (the formal harness assumes reset in the first cycle only); outputs and in_ready are defined from the first clock after reset; data-path registers are not reset"
    latency: "ceil(W / PIPE)"
    throughput: one division per clock
    expected_primitives: {carry4: "W * ceil((W+1)/4)", dsp48: 0, bram: 0, ff: "ceil(W/PIPE) * 2*W + (ceil(W/PIPE) - 1) * W + ceil(W/PIPE)"}
    trade_off: PIPE sets the register spacing; many carry chains in series inside a stage when PIPE is large
    points: [{W: 16, PIPE: 1}, {W: 16, PIPE: 4}, {W: 32, PIPE: 1}, {W: 32, PIPE: 4}, {W: 32, PIPE: 8}]
  - id: nonrestoring_pipe
    module: div_nonrestoring_pipe
    selector: {VARIANT: 3}
    protocol: "valid only: in_ready is constant 1, fixed latency, one result per clock, no stall or enable (a free-running pipeline); out_valid is in_valid delayed by the latency, results in input order"
    reset_clock_assumptions: "one clock, rising edge; rst is synchronous and must be held for at least one clock before the first in_valid (the formal harness assumes reset in the first cycle only); outputs and in_ready are defined from the first clock after reset; data-path registers are not reset"
    latency: "ceil(W / PIPE)"
    throughput: one division per clock
    expected_primitives: {carry4: "W * ceil((W+2)/4) + ceil((W+1)/4)", dsp48: 0, bram: 0, ff: "ceil(W/PIPE) * (2*W + 1) + (ceil(W/PIPE) - 1) * W + ceil(W/PIPE)"}
    trade_off: no restore mux per iteration; the correction adder is in the last stage's path
    points: [{W: 16, PIPE: 1}, {W: 16, PIPE: 4}, {W: 32, PIPE: 1}, {W: 32, PIPE: 4}, {W: 32, PIPE: 8}]
integration:
  port_timing: "All inputs are sampled on the rising edge and all outputs change after it; there is no combinational path from in_data or in_valid to out_data or out_valid in any variant except that the unrolled pipelines' first stage logic is between the input pins and the first register, so register the inputs (the out-of-context wrapper does) when the source is slow. in_ready of an iterative variant is a registered state and may drive a source's enable directly."
  constraints_to_carry: "One clock constraint on clk. No multicycle or false-path exceptions are needed or valid: every path is single-cycle register to register. rst is synchronous: do not give it an asynchronous or set_false_path treatment. Do not retime across the valid pipeline of a multi-stage variant without re-running the harness (latency is part of the contract). Out-of-context numbers (Fmax, area, power) for the variants are not yet measured: see build/<variant>/<fabric>/build.yaml, prepared and not run."
  after_integration: "Rerun the packaged harness against your instance (harness/README.md): it checks values, order and the measured latency of every result and reports coverage of the target bins."
what_a_user_could_guess_wrong:
  - "Division by zero does not raise anything: q is all ones and r is n. A caller that needs a flag must compare d with zero itself."
  - "The operands are unsigned. A signed division needs sign handling outside this block (take magnitudes, restore signs; the remainder takes the dividend's sign by convention there, not here)."
  - "The iterative variants accept an input only while in_ready is high; an in_valid that is held through a busy period is accepted when the divider becomes idle (the harness checks this). An out_valid pulse can coincide with in_ready, so the next division may be accepted on the edge that samples the previous result."
  - "out_data is valid only while out_valid is high and is overwritten by the next accepted input on the same edge that samples it; sample it on that edge."
  - "Reset clears the valid flags and the busy flag only; a division in flight when rst is asserted is dropped, its data registers are not cleared (they are never read without a valid)."
  - "The latency is a clock count, not a time; the Fmax of each variant is the Vivado runs' job (prepared, not run)."
  - "PIPE above W is the same as PIPE = W; the register spacing of the last stage may be shorter than PIPE."
requirements: [DIV-F-MODEL, DIV-F-RTL-EXH, DIV-F-RTL-RAND, DIV-F-LAT, DIV-F-LINT, DIV-F-MUTANT, DIV-F-FORMAL-REF, DIV-F-FORMAL-PAIR, DIV-F-LEAN-RESTORING, DIV-F-LEAN-NONRESTORING, DIV-F-BUILD]
