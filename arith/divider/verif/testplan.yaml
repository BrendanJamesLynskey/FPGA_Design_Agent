# divider testplan, schema v1 (brief 116 format; brief 139b). The agent wrote every requirement below from the owner's request; none is agreed by a human (`spec_status: draft`).
# Status is never typed here: `python -m flow.trace_v1 write arith/divider` computes it from the evidence files named in each item. Evidence is regenerated by the commands in `notes`.
schema: fpga-design-agent/testplan/v1
design: divider
notes: 'Arithmetic library function divider (brief 139b). Every requirement is a draft written by the agent from the owner''s request (spec_status: draft; only a human sets agreed). Evidence is generated
  by `python -m pytest arith/divider/tests --junitxml=results/139b_arith/divider_junit.xml` with ARITH_RECORD_DIR=results/139b_arith. The Lean items show ''statement not approved'': lean_approvals.yaml
  is the owner''s. The one performance requirement (brief 160) says every prepared out-of-context point has a routed Vivado result; no Fmax or area bound is agreed.'
discover:
- glob: arith/divider/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: DIV-F-MODEL
  kind: functional
  title: 'The model is the specification: it equals integer arithmetic'
  text: 'For the divider: the quotient and remainder equal Python integer division for every pair at W = 1 to 8 and for random pairs at W up to 128, division by zero gives all ones and n, and the restoring
    and non-restoring recurrences equal division step by step with the RTL''s register widths.'
  source: arith/divider/spec.md#the-function
  spec_status: draft
- id: DIV-F-RTL-EXH
  kind: functional
  title: Every variant is bit-exact against the model, exhaustively at small widths
  text: 'Simulation (Icarus 14) of every variant against the model: every operand pair at W = 2 to 8 (65536 pairs at W = 8), with input gaps; quotient, remainder, order and latency checked.'
  source: arith/divider/spec.md#the-function
  spec_status: draft
- id: DIV-F-RTL-RAND
  kind: functional
  title: Every variant is bit-exact against the model at large widths
  text: 'Simulation of every variant against the model: edge-value pairs plus 3000 random pairs (divisors of every magnitude) at W = 16, 24, 32 and 64.'
  source: arith/divider/spec.md#the-function
  spec_status: draft
- id: DIV-F-LAT
  kind: functional
  title: Latency and throughput are what the spec states
  text: The measured latency of every result equals the spec's formula (W + 1, W + 2, ceil(W / PIPE)) for PIPE = 1 to 7 at W = 7, and a pipeline accepts an input on every clock.
  source: arith/divider/spec.md#the-function
  spec_status: draft
- id: DIV-F-LINT
  kind: functional
  title: The RTL is Verilator -Wall clean
  text: Verilator -Wall --lint-only reports nothing for any variant at W = 8 and 13 with PIPE = 1, 3 and W.
  source: arith/divider/spec.md#the-function
  spec_status: draft
- id: DIV-F-MUTANT
  kind: functional
  title: The bench catches seeded faults
  text: 'Each of 16 seeded faults (one text change in the RTL, verif/mutants.yaml) makes the bench fail: killed/total = 16/16. 1 further mutant(s) are equivalent (the same function and timing) and are listed
    apart with the reason; they are not counted.'
  source: arith/divider/spec.md#the-function
  spec_status: draft
- id: DIV-F-FORMAL-REF
  kind: functional
  title: Every variant equals an independent reference (SymbiYosys)
  text: 'SymbiYosys with the slang front end: each variant equals an independent reference (SystemVerilog `/` and `%`, the divide-by-zero convention) for all input sequences from reset: 14 jobs at W = 4,
    5 and 6, iterative and pipelined, PIPE = 1 to 4; unbounded (abc pdr). Six seeded faults are applied to the RTL and the same proof fails (bounded model checking finds the counterexample), which shows
    the harness is not vacuous.'
  source: arith/divider/spec.md#the-function
  spec_status: draft
- id: DIV-F-FORMAL-PAIR
  kind: functional
  title: Variants of the function agree with each other (SymbiYosys)
  text: 'SymbiYosys with the slang front end, no reference involved: the restoring and non-restoring pipelines give the same output on the same inputs, W = 4, 5, 6; unbounded (abc pdr).'
  source: arith/divider/spec.md#the-function
  spec_status: draft
- id: DIV-F-LEAN-RESTORING
  kind: functional
  title: Restoring division is correct for every width (Lean)
  text: The restoring recurrence of div_restoring_*.sv computes n / d and n % d for every width, and for d = 0 returns all ones and n. Proved for all widths in Lean, statement not approved; the Lean text
    is a transcription of the RTL's step, cross-checked against the Python model for W <= 5; register widths are not modelled.
  source: arith/divider/spec.md#verification-everything-before-vivado
  spec_status: draft
- id: DIV-F-LEAN-NONRESTORING
  kind: functional
  title: Non-restoring division with correction is correct for every width (Lean)
  text: 'The non-restoring recurrence of div_nonrestoring_*.sv, with its final correction, computes n / d and n % d for every width and d > 0 (invariant: a non-negative partial remainder is n - d*Q, a negative
    one n - d*(Q+1), always in [-d, d)). Proved in Lean, statement not approved; division by zero is not part of this theorem (covered by simulation and the formal reference).'
  source: arith/divider/spec.md#verification-everything-before-vivado
  spec_status: draft
- id: DIV-F-BUILD
  kind: functional
  title: Out-of-context build descriptions are prepared for Artix-7 and K26 (prepared in brief 139b, run in brief 160)
  text: 'For every variant of the divider there is a build.yaml and an out-of-context clock constraint for xc7a100t and xck26, current against arith/tools/gen_build.py, consistent with the RTL (top, parameters,
    sources), with the expected primitive use evaluated for each point; the out-of-context wrapper lints clean and is functionally exact for the always-ready variants; the packaged verification harness
    (harness/run.py, which a user reruns against their own instance) passes on the library instance with every coverage bin hit. This requirement is about preparation; the measured area, Fmax and power are in brief 160's records.'
  source: arith/divider/spec.md#vivado-builds-prepared-in-brief-139b-run-in-brief-160
  spec_status: draft
- id: DIV-P-OOC
  kind: performance
  title: Every prepared point places and routes out of context on Artix-7 and K26
  text: Each point of the build files of divider (build/<variant>/build.yaml; 28 in all, both parts) goes through Vivado 2026.1 out-of-context synthesis, placement and routing and leaves
    a recorded result (utilisation, WNS, WHS, Fmax, logic levels, vectorless power) in verif/results/vivado_ooc_<variant>_<part>.json. The measured values and each point's pre-stated
    expectation are in the Measured table of spec.md and in verif/results/vivado_surface.json; this requirement states only that the measurement exists for every point, because no Fmax
    or area bound has been agreed.
  source: arith/divider/spec.md
  spec_status: draft
  performance:
    quantity: prepared points with a routed out-of-context Vivado result
    unit: points
    op: ge
    bound: 28
    condition: Vivado 2026.1 out-of-context, one thread, the clocks of the build files, brief 160
verification:
- id: V-DIV-MODEL
  requirements:
  - DIV-F-MODEL
  method: sim_test
  title: Model tests against Python integer arithmetic
  evidence:
    file: results/139b_arith/divider_junit.xml
    reader: junit
    tests:
    - test_divider_model::*
  checks:
  - arith/divider/model.py
- id: V-DIV-RTL-EXH
  requirements:
  - DIV-F-RTL-EXH
  method: sim_test
  title: Exhaustive small widths, every variant
  evidence:
    file: results/139b_arith/divider_junit.xml
    reader: junit
    tests:
    - test_divider_rtl::test_exhaustive_small_widths
  checks: &id001
  - arith/divider/rtl/div_nonrestoring_iter.sv
  - arith/divider/rtl/div_nonrestoring_pipe.sv
  - arith/divider/rtl/div_restoring_iter.sv
  - arith/divider/rtl/div_restoring_pipe.sv
  - arith/divider/rtl/divider_ooc.sv
  - arith/divider/rtl/divider_sel.sv
  - arith/divider/model.py
  - arith/common/tb_stream.sv
  - arith/divider/tb/tb_divider.sv
- id: V-DIV-RTL-RAND
  requirements:
  - DIV-F-RTL-RAND
  method: sim_test
  title: Random and edge vectors at large widths
  evidence:
    file: results/139b_arith/divider_junit.xml
    reader: junit
    tests:
    - test_divider_rtl::test_random_and_edge_large_widths
  checks: *id001
- id: V-DIV-LAT
  requirements:
  - DIV-F-LAT
  method: sim_test
  title: Latency measured per result
  evidence:
    file: results/139b_arith/divider_junit.xml
    reader: junit
    tests:
    - test_divider_rtl::test_latency_matches_the_formula_at_every_pipeline_depth
    - test_divider_rtl::test_throughput_one_per_clock_for_pipelines
  checks: *id001
- id: V-DIV-LINT
  requirements:
  - DIV-F-LINT
  method: sim_test
  title: Verilator -Wall lint
  evidence:
    file: results/139b_arith/divider_junit.xml
    reader: junit
    tests:
    - test_divider_rtl::test_lint_clean
  checks: *id001
- id: V-DIV-MUTANT-RUN
  requirements:
  - DIV-F-MUTANT
  method: sim_test
  title: The mutant check passes
  evidence:
    file: results/139b_arith/divider_junit.xml
    reader: junit
    tests:
    - test_divider_rtl::test_seeded_mutants_are_all_killed
  checks:
  - arith/divider/rtl/div_nonrestoring_iter.sv
  - arith/divider/rtl/div_nonrestoring_pipe.sv
  - arith/divider/rtl/div_restoring_iter.sv
  - arith/divider/rtl/div_restoring_pipe.sv
  - arith/divider/rtl/divider_ooc.sv
  - arith/divider/rtl/divider_sel.sv
  - arith/divider/model.py
  - arith/common/tb_stream.sv
  - arith/divider/tb/tb_divider.sv
  - arith/divider/verif/mutants.yaml
- id: V-DIV-MUTANT-SCORE
  requirements:
  - DIV-F-MUTANT
  method: sim_measurement
  title: Mutants killed / total
  evidence:
    file: results/139b_arith/divider_sim_record.json
    reader: json
    field: mutants_summary.killed
  pass_when:
  - field: mutants_summary.killed
    op: ge
    value: 16
  - field: mutants_summary.survived
    op: eq
    value: 0
  checks:
  - arith/divider/rtl/div_nonrestoring_iter.sv
  - arith/divider/rtl/div_nonrestoring_pipe.sv
  - arith/divider/rtl/div_restoring_iter.sv
  - arith/divider/rtl/div_restoring_pipe.sv
  - arith/divider/rtl/divider_ooc.sv
  - arith/divider/rtl/divider_sel.sv
  - arith/divider/model.py
  - arith/common/tb_stream.sv
  - arith/divider/tb/tb_divider.sv
  - arith/divider/verif/mutants.yaml
- id: V-DIV-FORMAL-REF-RUN
  requirements:
  - DIV-F-FORMAL-REF
  method: sim_test
  title: The formal reference and fault-catching tests pass
  evidence:
    file: results/139b_arith/divider_junit.xml
    reader: junit
    tests:
    - test_divider_formal_rtl::test_each_variant_equals_the_reference_unbounded
    - test_divider_formal_rtl::test_formal_catches_seeded_faults
  checks: *id001
- id: V-DIV-FORMAL-REF
  requirements:
  - DIV-F-FORMAL-REF
  method: formal
  title: 'Reference proofs: jobs proved unbounded, none failed'
  evidence:
    file: results/139b_arith/divider_formal_record.json
    reader: json
    field: summary.reference.proved_unbounded
  pass_when:
  - field: summary.reference.proved_unbounded
    op: ge
    value: 14
  - field: summary.reference.failed
    op: eq
    value: 0
  checks:
  - arith/divider/rtl/div_nonrestoring_iter.sv
  - arith/divider/rtl/div_nonrestoring_pipe.sv
  - arith/divider/rtl/div_restoring_iter.sv
  - arith/divider/rtl/div_restoring_pipe.sv
  - arith/divider/rtl/divider_ooc.sv
  - arith/divider/rtl/divider_sel.sv
  - arith/divider/model.py
  - arith/common/tb_stream.sv
  - arith/divider/tb/tb_divider.sv
  - arith/divider/formal/divider_fv.sv
- id: V-DIV-FORMAL-FAULTS
  requirements:
  - DIV-F-FORMAL-REF
  method: formal
  title: Six seeded faults each make the proof fail (bounded model checking)
  evidence:
    file: results/139b_arith/divider_formal_record.json
    reader: json
    field: summary.mutant.faults_caught
  pass_when:
  - field: summary.mutant.faults_caught
    op: ge
    value: 6
  - field: summary.mutant.failed
    op: eq
    value: 0
  bounded:
    depth: BMC, 8 to 16 cycles
  checks:
  - arith/divider/rtl/div_nonrestoring_iter.sv
  - arith/divider/rtl/div_nonrestoring_pipe.sv
  - arith/divider/rtl/div_restoring_iter.sv
  - arith/divider/rtl/div_restoring_pipe.sv
  - arith/divider/rtl/divider_ooc.sv
  - arith/divider/rtl/divider_sel.sv
  - arith/divider/model.py
  - arith/common/tb_stream.sv
  - arith/divider/tb/tb_divider.sv
  - arith/divider/formal/divider_fv.sv
- id: V-DIV-FORMAL-PAIR-RUN
  requirements:
  - DIV-F-FORMAL-PAIR
  method: sim_test
  title: The variant-pair tests pass
  evidence:
    file: results/139b_arith/divider_junit.xml
    reader: junit
    tests:
    - test_divider_formal_rtl::test_pipelined_variants_agree_with_each_other
  checks: *id001
- id: V-DIV-FORMAL-PAIR
  requirements:
  - DIV-F-FORMAL-PAIR
  method: formal
  title: Variant pairs proved equal, none failed
  evidence:
    file: results/139b_arith/divider_formal_record.json
    reader: json
    field: summary.pair.proved_unbounded
  pass_when:
  - field: summary.pair.proved_unbounded
    op: ge
    value: 3
  - field: summary.pair.failed
    op: eq
    value: 0
  checks:
  - arith/divider/rtl/div_nonrestoring_iter.sv
  - arith/divider/rtl/div_nonrestoring_pipe.sv
  - arith/divider/rtl/div_restoring_iter.sv
  - arith/divider/rtl/div_restoring_pipe.sv
  - arith/divider/rtl/divider_ooc.sv
  - arith/divider/rtl/divider_sel.sv
  - arith/divider/model.py
  - arith/common/tb_stream.sv
  - arith/divider/tb/tb_divider.sv
  - arith/divider/formal/divider_fv.sv
- id: V-LEAN-DIV-RESTORING
  requirements:
  - DIV-F-LEAN-RESTORING
  method: formal_lean
  title: Restoring division equals Nat.div and Nat.mod, every width
  evidence:
    file: formal/lean/records/build_record.json
    reader: json
  lean:
    module: Arith.Divide
    theorem: Arith.Divide.restDiv_correct
  rtl_link:
    kind: transcription_tested
    source:
    - file: arith/divider/rtl/div_restoring_iter.sv
      lines: 30-31
    - file: arith/divider/rtl/div_restoring_iter.sv
      lines: 61-62
    transcribed_in: Arith/Divide.lean (restDiv)
    crosscheck:
      file: formal/lean/Arith/CrossCheck.lean
      reference: the Python bit-exact model arith/divider/model.py (written from spec.md; the simulation tests tie it to the RTL), compared on small widths by formal/lean/tools/crosscheck_arith.py; not
        the RTL itself
- id: V-LEAN-DIV-RESTORING-ZERO
  requirements:
  - DIV-F-LEAN-RESTORING
  method: formal_lean
  title: Restoring division by zero returns all ones and the dividend, every width
  evidence:
    file: formal/lean/records/build_record.json
    reader: json
  lean:
    module: Arith.Divide
    theorem: Arith.Divide.restDiv_zero
  rtl_link:
    kind: transcription_tested
    source:
    - file: arith/divider/rtl/div_restoring_iter.sv
      lines: 30-31
    - file: arith/divider/rtl/div_restoring_iter.sv
      lines: 61-62
    transcribed_in: Arith/Divide.lean (restDiv)
    crosscheck:
      file: formal/lean/Arith/CrossCheck.lean
      reference: the Python bit-exact model arith/divider/model.py (written from spec.md; the simulation tests tie it to the RTL), compared on small widths by formal/lean/tools/crosscheck_arith.py; not
        the RTL itself
- id: V-LEAN-DIV-NONRESTORING
  requirements:
  - DIV-F-LEAN-NONRESTORING
  method: formal_lean
  title: Non-restoring division with its final correction equals Nat.div and Nat.mod, every width
  evidence:
    file: formal/lean/records/build_record.json
    reader: json
  lean:
    module: Arith.Divide
    theorem: Arith.Divide.nr_correct
  rtl_link:
    kind: transcription_tested
    source:
    - file: arith/divider/rtl/div_nonrestoring_iter.sv
      lines: 32-33
    - file: arith/divider/rtl/div_nonrestoring_iter.sv
      lines: 63-67
    transcribed_in: Arith/Divide.lean (nrStep, nrRun, nrFinal)
    crosscheck:
      file: formal/lean/Arith/CrossCheck.lean
      reference: the Python bit-exact model arith/divider/model.py (written from spec.md; the simulation tests tie it to the RTL), compared on small widths by formal/lean/tools/crosscheck_arith.py; not
        the RTL itself
- id: V-DIV-BUILD
  requirements:
  - DIV-F-BUILD
  method: sim_test
  title: Build descriptions current and consistent; wrapper lint and simulation; packaged harness runs on the library instance
  evidence:
    file: results/139b_arith/divider_junit.xml
    reader: junit
    tests:
    - test_divider_build_rtl::test_build_descriptions_are_complete_and_current
    - test_divider_build_rtl::test_packaged_harness_runs_against_an_instance
    - test_divider_build_rtl::test_ooc_wrapper_lints_and_is_functionally_exact_for_pipelines
  checks: *id001
- id: V-DIV-OOC
  requirements:
  - DIV-P-OOC
  method: timing
  title: The routed Vivado results of every prepared point (the records of the last run)
  evidence:
    file: arith/divider/verif/results/vivado_surface.json
    reader: json
    field: summary.routed_points
  checks:
  - arith/divider/build/nonrestoring_iter/a7/build.yaml
  - arith/divider/build/nonrestoring_iter/k26/build.yaml
  - arith/divider/build/nonrestoring_pipe/a7/build.yaml
  - arith/divider/build/nonrestoring_pipe/k26/build.yaml
  - arith/divider/build/restoring_iter/a7/build.yaml
  - arith/divider/build/restoring_iter/k26/build.yaml
  - arith/divider/build/restoring_pipe/a7/build.yaml
  - arith/divider/build/restoring_pipe/k26/build.yaml
