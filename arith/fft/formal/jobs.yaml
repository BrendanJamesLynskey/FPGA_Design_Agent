# Formal jobs of the FFT (arith brief 148; tools/run_formal.py). They check the delay-feedback stage that every stage of the radix-2^2 pipeline is made of, bounded; the whole pipeline and the burst variant are checked by simulation only.
jobs:
- {name: stage_n16_d2_t0_w4_s1_r1, top: fft_sdf_stage_fv, params: {LOGN: 4, LD: 1, TYP: 0, WI: 4, SCALE: 1, RND: 1}, mode: bmc, depth: 10, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "the stage's butterfly (delay 2, type 0, 4-bit words, SCALE 1, RND 1) and position output equal the integer shadow on every input sequence, bounded to 10 clocks from an arbitrary state"}
- {name: stage_n16_d2_t1_w4_s1_r1, top: fft_sdf_stage_fv, params: {LOGN: 4, LD: 1, TYP: 1, WI: 4, SCALE: 1, RND: 1}, mode: bmc, depth: 10, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "the stage's butterfly (delay 2, type 1, 4-bit words, SCALE 1, RND 1) and position output equal the integer shadow on every input sequence, bounded to 10 clocks from an arbitrary state"}
- {name: stage_n16_d2_t1_w4_s0_r0, top: fft_sdf_stage_fv, params: {LOGN: 4, LD: 1, TYP: 1, WI: 4, SCALE: 0, RND: 0}, mode: bmc, depth: 10, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "the stage's butterfly (delay 2, type 1, 4-bit words, SCALE 0, RND 0) and position output equal the integer shadow on every input sequence, bounded to 10 clocks from an arbitrary state"}
- {name: stage_n32_d4_t1_w4_s1_r1, top: fft_sdf_stage_fv, params: {LOGN: 5, LD: 2, TYP: 1, WI: 4, SCALE: 1, RND: 1}, mode: bmc, depth: 14, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "the stage's butterfly (delay 4, type 1, 4-bit words, SCALE 1, RND 1) and position output equal the integer shadow on every input sequence, bounded to 14 clocks from an arbitrary state"}
- {name: stage_n32_d4_t0_w5_s0_r1, top: fft_sdf_stage_fv, params: {LOGN: 5, LD: 2, TYP: 0, WI: 5, SCALE: 0, RND: 1}, mode: bmc, depth: 14, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "the stage's butterfly (delay 4, type 0, 5-bit words, SCALE 0, RND 1) and position output equal the integer shadow on every input sequence, bounded to 14 clocks from an arbitrary state"}
- {name: mutant_stage_mj, top: fft_sdf_stage_fv, params: {LOGN: 4, LD: 1, TYP: 1, WI: 4, SCALE: 1, RND: 1}, mode: bmc, depth: 10, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "a build with the seeded fault stage_mj is refuted", mutant: stage_mj}
- {name: mutant_stage_dif, top: fft_sdf_stage_fv, params: {LOGN: 4, LD: 1, TYP: 1, WI: 4, SCALE: 1, RND: 1}, mode: bmc, depth: 10, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "a build with the seeded fault stage_dif is refuted", mutant: stage_dif}
- {name: mutant_stage_round, top: fft_sdf_stage_fv, params: {LOGN: 4, LD: 1, TYP: 1, WI: 4, SCALE: 1, RND: 1}, mode: bmc, depth: 10, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "a build with the seeded fault stage_round is refuted", mutant: stage_round}
- {name: mutant_stage_minus_j, top: fft_sdf_stage_fv, params: {LOGN: 4, LD: 1, TYP: 1, WI: 4, SCALE: 1, RND: 1}, mode: bmc, depth: 10, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "a build with the seeded fault stage_minus_j is refuted", mutant: stage_minus_j}
- {name: mutant_stage_store, top: fft_sdf_stage_fv, params: {LOGN: 4, LD: 1, TYP: 1, WI: 4, SCALE: 1, RND: 1}, mode: bmc, depth: 10, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "a build with the seeded fault stage_store is refuted", mutant: stage_store}
- {name: mutant_stage_pos, top: fft_sdf_stage_fv, params: {LOGN: 4, LD: 1, TYP: 1, WI: 4, SCALE: 1, RND: 1}, mode: bmc, depth: 10, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "a build with the seeded fault stage_pos is refuted", mutant: stage_pos}
- {name: mutant_stage_half, top: fft_sdf_stage_fv, params: {LOGN: 4, LD: 1, TYP: 1, WI: 4, SCALE: 1, RND: 1}, mode: bmc, depth: 10, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "a build with the seeded fault stage_half is refuted", mutant: stage_half}
- {name: mutant_stage_sof, top: fft_sdf_stage_fv, params: {LOGN: 4, LD: 1, TYP: 1, WI: 4, SCALE: 1, RND: 1}, mode: bmc, depth: 10, sources: [formal/fft_sdf_stage_fv.sv, ../fft_common/fft_sdf_stage.sv], claim: "a build with the seeded fault stage_sof is refuted", mutant: stage_sof}
