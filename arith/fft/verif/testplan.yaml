# fft testplan, schema v1 (brief 116) for the frequency-domain suite (brief 148). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_fft
notes: 'Frequency-domain suite, function fft (brief 148). Everything here is before Vivado: the model, the RTL variants, simulation, formal properties and the prepared out-of-context
  build files. No performance requirement on LUTs, DSPs, Fmax or power exists because none has been measured; the Vivado runs (build/<variant>/build.yaml, queued in _handoff/fpga_agent/vivado_later_queue.md)
  will add them. Every requirement is a draft written by the agent; none is agreed by a human. There are no Lean statements and no packaged harness for this suite (stated in the report).
  Generated by arith/tools/gen_testplan_fft.py.'
discover:
- glob: arith/fft/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: FFT-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/fft/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (NumPy's FFT (forward and inverse), checked for both variants
    at every N from 8 to 1024, and the identity that the inverse is the swap of a forward transform), and the conventions that a user could guess wrong (spec.md, last section) are pinned
    by examples.
  source: arith/fft/spec.md
  spec_status: draft
- id: FFT-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (12 directed or exhaustive points, 8 random ones, across 2 variants), each variant''s outputs equal the model''s: the directed points
    drive impulses at every position and tones at every bin (small N), DC, Nyquist, a chirp and corner values, forward and inverse, back to back and after the shortest legal gap; the
    random points drive random frames with random direction and legal gaps up to N = 4096. Each output frame equals the model bit for bit, the latency from in_sof to out_sof equals the
    formula, and out_valid is N consecutive clocks.'
  source: arith/fft/spec.md
  spec_status: draft
- id: FFT-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (sdf: (1<<LOGN)-1+LOGN+((LOGN-1)//2)*(TWSTAGES+MULSTAGES+1)+(0 if ORDER else (1<<LOGN)+1); burst: (1<<LOGN)+LOGN*((1<<LOGN)//2+MULSTAGES+3)+1),
    and the bench, run with a latency two clocks off, fails for every variant, so the passing runs prove the latency rather than assume it.'
  source: arith/fft/spec.md
  spec_status: draft
- id: FFT-F-EQUIV
  kind: functional
  title: The properties named in formal/jobs.yaml hold, by proof where the tools allow
  text: 'SymbiYosys with the slang front end checks the properties of formal/jobs.yaml: a proof is by k-induction (for all inputs, any run length) at the parameters listed there, a bounded
    check holds only to its stated depth. What the jobs say is in each job''s `claim`; parameters beyond the listed ones are covered by simulation, not by proof.'
  source: arith/fft/formal/jobs.yaml
  spec_status: draft
- id: FFT-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each: an inverted condition, a wrong constant, a dropped connection, a wrong width) makes the cocotb bench
    fail, or is argued equivalent in the file''s header; mutants that survive or do not build are reported, never hidden.'
  source: arith/fft/verif/mutants.yaml
  spec_status: draft
- id: FFT-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/fft/spec.yaml
  spec_status: draft
- id: FFT-F-BACKPRESSURE
  kind: functional
  title: 'The burst variant honours out_ready: stalling the sink changes nothing but the timing'
  text: With out_ready driven low at random (40 per cent of the clocks) the burst variant's output frames equal the model bit for bit, and out_valid, out_sof and the data stay unchanged
    in every clock in which out_valid is high and out_ready low. The sdf variant ignores out_ready (stated).
  source: arith/fft/spec.md
  spec_status: draft
- id: FFT-F-ACCURACY
  kind: functional
  title: Accuracy against NumPy's FFT is measured and stated, per scaling mode
  text: 'For each variant, scaling mode and several N and twiddle widths, the error of the model (which the RTL equals bit for bit) against the double-precision FFT of NumPy is recorded
    in verif/results/accuracy.json: worst and rms error in units of the output LSB, and the SQNR and SFDR for a full-scale tone. The recorded worst error of the scaled mode is at most
    6 LSB at every recorded point, and the unscaled mode''s SQNR for noise-like input is at least 80 dB at every recorded point with twiddles of 16 bits or more (the unscaled word is
    W + LOGN bits wide, so its error in output LSBs is large for narrow twiddles: the SQNR is the figure to read); these are the bounds the test enforces, and the figures are what the
    report states, with no claim beyond them.'
  source: arith/fft/spec.md
  spec_status: draft
- id: FFT-F-ROUNDTRIP
  kind: functional
  title: A forward transform followed by an inverse transform returns the input within the stated error
  text: Through the RTL (both variants, the scaled mode), forward then inverse of the same frames returns the input divided by N (the scaled mode divides by N in both directions) to
    within 3 LSB, at the point of the round-trip test; the inverse is the swap of a forward transform, so forward and inverse results are related exactly by the swap.
  source: arith/fft/spec.md
  spec_status: draft
- id: FFT-F-FASTCONV
  kind: functional
  title: Fast convolution built on the FFT models equals direct convolution within the stated error (model only, phase 0)
  text: 'arith/fft_common/fastconv.py (overlap-save and overlap-add on the bit-exact FFT models, both variants) equals numpy.convolve of the same samples and taps to within 8 LSB of
    the output word (N = 128 to 512, L = 1 to 65 taps, W = 16, TW = 18, WH = 24, FH = 14), the two methods agree with each other within the same bound, a unit filter passes the signal
    within 3 LSB, and a complex input is filtered part by part. This is a Python model and an interface proposal (docs/fft_suite_plan.md section 5), not RTL: the fast-convolution block
    is the next phase.'
  source: docs/fft_suite_plan.md
  spec_status: draft
