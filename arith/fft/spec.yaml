# Machine-readable specification of the configurable FFT (arith brief 148). The prose is spec.md; the two agree (tests/test_fft_package.py).
schema: fda-arith/spec/1
function: fft
title: Configurable FFT (N = 8 to 4096, forward or inverse, scaled or growing, two architectures)
model: arith/fft/model.py
summary: "The N = 2**LOGN point discrete Fourier transform of frames of complex samples (signed W-bit parts), forward (X[k] = sum over n of x[n] exp(-j 2 pi n k / N)) or inverse (exp(+j ...)), chosen per frame at run time, with twiddle factors of TW bits, either scaled (every radix-2 butterfly halves, so the transform is scaled by 1/N in both directions and the word stays W bits) or unscaled (the word grows one bit per butterfly stage), in natural or bit-reversed output order, rounding half up or truncating. Two architectures: sdf, a streaming radix-2^2 single-path delay-feedback pipeline that takes one sample per clock, continuously; and burst, a memory-based pipeline with one butterfly that takes a frame at a time. They have the same ports and parameters; their results are not bit-identical to each other (different rounding points: both are checked against NumPy's FFT and against their own bit-exact models). Real-input transforms and fast convolution are built from this block (docs/fft_suite_plan.md, sections 4 and 5)."
semantics:
  - "frame: N = 2**LOGN consecutive clocks of in_valid, the first with in_sof; sample n of the frame is in_re[n] + j in_im[n], two's complement, W bits; in_inverse is sampled with in_sof and holds for the frame"
  - "forward (in_inverse = 0): X[k] = sum over n of x[n] exp(-j 2 pi n k / N). Inverse (in_inverse = 1): X[k] = sum over n of x[n] exp(+j 2 pi n k / N) (no 1/N in the definition: see scaling)"
  - "SCALE = 1: every butterfly sum and difference is divided by 2 (rounded as RND says), so the output is X[k] / N for BOTH directions: the forward transform is scaled by 1/N, the inverse is the standard normalised inverse. SCALE = 0: no division; the words grow by one bit per butterfly stage and the output is exactly X[k] up to the rounding of the twiddle products, in W + LOGN bits"
  - "twiddle factors: exp(-j 2 pi m / M) as signed TW-bit numbers of scale 2**(TW-2) from the quarter-wave table of fft_twiddle (arith/fft_twiddle/spec.md); every product with a twiddle is rounded once by a right shift of TW-2 bits (RND = 1: half up, RND = 0: floor)"
  - "the inverse transform swaps the real and imaginary parts at the input and at the output of a FORWARD transform (ifft(x) = swap(fft(swap(x)))): it uses the same twiddles and the same rounding, so inverse and forward results are related exactly by the swap"
  - "ORDER = 0: the output frame is in natural order (X[0], X[1], ... X[N-1]); ORDER = 1: bit-reversed order (the word at output position p is X[bitrev(p)]), the natural order of the decimation-in-frequency flow, without the reorder buffer"
  - "overflow: the guarantee is that no word overflows if the magnitude of every input sample is below full scale, re**2 + im**2 < 2**(2W-2) (SCALE = 1 and SCALE = 0 alike). A full-scale square corner (re = im = full scale) can overflow: there is no saturation and no overflow flag, the word wraps (two's complement)"
  - "the bit-exact models are fft_ref.sdf_frame (radix-2^2: stage pairs with the -j and the deferred twiddle after the pair) and fft_ref.burst_frame (radix-2, every butterfly's difference multiplied by its twiddle); the RTL equals them for every input within the overflow guarantee. Against NumPy the error is measured and stated in verif/results/accuracy.json"
ports:
  - {name: clk, dir: in, width: 1, text: "clock"}
  - {name: rst, dir: in, width: 1, text: "synchronous reset of the control state (the data memories and delay lines are not reset)"}
  - {name: in_valid, dir: in, width: 1, text: "an input sample is present; N consecutive clocks per frame"}
  - {name: in_sof, dir: in, width: 1, text: "with in_valid, the first sample of a frame"}
  - {name: in_inverse, dir: in, width: 1, text: "sampled with in_sof: 1 = inverse transform for this frame"}
  - {name: in_re, dir: in, width: W, text: "real part of the sample, two's complement"}
  - {name: in_im, dir: in, width: W, text: "imaginary part of the sample"}
  - {name: out_ready, dir: in, width: 1, text: "the consumer takes the output word in this clock; honoured by burst, IGNORED by sdf (which cannot stall: the consumer must take every word when it is presented)"}
  - {name: in_ready, dir: out, width: 1, text: "a frame may start (in_sof) in this clock: always 1 for sdf; for burst, 1 only while idle with no output word waiting"}
  - {name: out_valid, dir: out, width: 1, text: "an output sample is present; N consecutive clocks per frame"}
  - {name: out_sof, dir: out, width: 1, text: "with out_valid, the first output sample of a frame"}
  - {name: out_re, dir: out, width: "((SCALE != 0) ? W : W + LOGN)", text: "real part of the output sample, two's complement"}
  - {name: out_im, dir: out, width: "((SCALE != 0) ? W : W + LOGN)", text: "imaginary part of the output sample"}
parameters:
  LOGN: {min: 3, text: "log2 of the frame length N: 3 to 12 (N = 8 to 4096); 12 is simulated"}
  W: {min: 4, text: "input sample part width"}
  TW: {min: 4, text: "twiddle width, 4 to 28 (scale 2**(TW-2))"}
  SCALE: {values: [0, 1], text: "1: halve every butterfly (output scaled by 1/N, width W); 0: grow (width W + LOGN)"}
  RND: {values: [0, 1], text: "1: round half up at every shift; 0: truncate (floor)"}
  ORDER: {values: [0, 1], text: "0: natural-order output; 1: bit-reversed output"}
  CMUL: {values: [3, 4], text: "twiddle multiplier form: 4 real multipliers or 3 (identical results)"}
  TWSTAGES: {values: [1, 2], text: "twiddle ROM latency (1: registered ROM, 2: registered outputs too)"}
  MULSTAGES: {min: 0, text: "register ranks in each complex multiplier, 0 to 3"}
signedness: "all data ports are two's complement; the output order and the transform's sign convention are as stated in Function"
exactness: "bit-exact against the model of each variant (every frame within the overflow guarantee); against the real DFT the error is the rounding noise of the quantised twiddles and the per-stage rounding, measured per scaling mode in verif/results/accuracy.json (worst and rms error in units of the output LSB, SQNR and SFDR for a full-scale tone) and stated in the report"
latency_definition: "clocks from the clock in which in_sof is asserted to the clock in which out_sof is asserted; throughput is stated per variant"
contract:
  protocol: "streaming frames, no valid/ready back-pressure. sdf: in_valid is high for N consecutive clocks per frame (in_sof on the first), the next frame follows with no gap, or after at least N/4 idle clocks (a gap of 1 to N/4 - 1 clocks is not allowed), in_ready is always 1. burst: the same frame, but in_sof may be asserted only while in_ready is 1 (idle), a new frame cannot overlap the previous one's computation and read-out; out_ready stalls the output (out_valid, out_sof and the data are held), sdf ignores out_ready"
  throughput: "sdf: one sample per clock continuously, a frame every N clocks. burst: one frame per N + LOGN * (N/2 + MULSTAGES + 3) + N clocks (load, compute, unload; no overlap)"
  latency: "sdf, bit-reversed order: N - 1 + LOGN + NM * (TWSTAGES + MULSTAGES + 1) with NM = (LOGN - 1) // 2 multipliers; natural order adds N + 1 (the reorder buffer). burst: N + LOGN * (N/2 + MULSTAGES + 3) + 1 for both orders"
  reset: "synchronous: clears the control state (counters, frame markers, valid flags, state machine); data memories and delay lines are not cleared. A frame in flight when rst is asserted is lost; no test covers a reset in the middle of a frame"
  clock: "one clock, rising edge, no clock-enable"
  stall: "sdf: none (once started a frame cannot be paused: in_valid must stay high for N clocks, and out_ready is ignored); burst: in_ready low means busy, and the output stalls while out_ready is low"
integration:
  port_timing: "outputs come from registers through at most a 2:1 mux (direction swap) and, in natural order, a bank select; inputs go through a 2:1 swap mux into the first stage (sdf) or the memory write port (burst). The longest paths are the complex multiplier (use MULSTAGES 3 to let the DSPs absorb their registers) and the butterfly adders"
  constraints: "one clock, no multicycle paths. sdf: the long delay lines infer shift registers or RAM; the control delay lines (2 * the latency flip-flops) are reset registers, not SRLs. burst: both banks have one read and one write port, so a simple dual-port RAM inference works; read-during-write on the same address does not occur (the schedule separates them)"
guess_wrong:
  - "SCALE = 1 scales the forward transform by 1/N as well as the inverse: the output of an impulse of height A at n = 0 is A/N everywhere, not A. SCALE = 0 gives the plain sum but with a wider word (W + LOGN); there is no block floating point and no scaling schedule input"
  - "the inverse is selected per frame by in_inverse sampled with in_sof and is exactly the swap trick (real and imaginary parts exchanged at input and output of a forward transform): it equals the textbook inverse only up to the scaling stated above (1/N with SCALE = 1, none with SCALE = 0)"
  - "the output order is natural when ORDER = 0 and BIT-REVERSED when ORDER = 1; the bit-reversed word at position p is X[bitrev(p, LOGN)]"
  - "the guarantee against overflow is on the MAGNITUDE of a sample (re**2 + im**2 < 2**(2W-2)), not on each part: a full-scale corner sample can overflow and wraps without any flag; the output is then wrong, not saturated"
  - "the sdf variant needs frames of exactly N consecutive in_valid clocks and a gap of 0 or at least N/4 clocks between frames: a gap of 1 to N/4 - 1 clocks corrupts the last outputs of the previous frame (the position counter that addresses the first twiddle multiplier restarts while that stage is still draining; measured at N = 8, 16 and 32: the smallest passing gap is N/4) and nothing flags it"
  - "the burst variant ignores in_valid while it is computing or unloading: an in_sof presented while in_ready is 0 is lost (during the load, in_valid clocks are the frame's words); a gap inside a frame is not allowed (the load counts only valid clocks, so a gap would stretch the frame, but no test covers it)"
  - "the twiddle factors are quantised to TW bits (scale 2**(TW-2)) and the products are rounded, so the output differs from the exact DFT by rounding noise: see the accuracy table; the result is not bit-identical to NumPy and the two variants are not bit-identical to each other"
  - "the latency is the first output word's delay from the first input word; the LAST output word leaves N - 1 clocks later. Latency formulas are per variant and per parameter set; a different TWSTAGES or MULSTAGES changes it"
  - "in_ready is always 1 for sdf: it does not mean the pipeline accepts a frame at any time (see the gap rule); the burst variant's in_ready is a real busy signal. out_ready is IGNORED by sdf (a sink that stalls loses words); the burst variant stalls its output while out_ready is low"
  - "a real-input transform is not this block's job: feed it complex words with imaginary part 0 (spectrum symmetric, half redundant) or use the real-input arrangement described in docs/fft_suite_plan.md section 4 (a model only in this phase)"
lean_note: "Not attempted. The FFT's algebra (the radix-2^2 decomposition, the -j folding, the twiddle exponent pattern) is covered by the bit-exact model checked against NumPy's FFT at N = 8 .. 1024 and the RTL against the model; a Lean proof of the DFT factorisation needs complex exponentials and a sum-manipulation library, neither in core Lean (4.36)."
variants:
  sdf:
    file: rtl/fft_sdf_r22.sv
    module: fft_sdf_r22
    deps: [fft_common/fft_sdf_stage.sv, fft_common/fft_sdf_twmul.sv, fft_common/fft_bitrev.sv, fft_common/fft_cos_rom.sv, fft_reorder/rtl/fft_reorder_pingpong.sv, fft_twiddle/rtl/fft_twiddle_quarter.sv, fft_cmul/rtl/fft_cmul_m4.sv, fft_cmul/rtl/fft_cmul_m3.sv]
    params: {LOGN: 6, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}
    throughput: "1 sample per clock, a frame every N clocks, continuously"
    latency: "(1<<LOGN)-1+LOGN+((LOGN-1)//2)*(TWSTAGES+MULSTAGES+1)+(0 if ORDER else (1<<LOGN)+1)"
    tradeoff: "streaming, one sample per clock, about N - 1 words of delay memory and (LOGN - 1) // 2 complex multipliers: the highest throughput and the fewest multipliers per sample; the natural-order output costs a second memory of 2 * N words"
    exhaustive_points: [{LOGN: 3, W: 8, TW: 8, SCALE: 1, RND: 1, ORDER: 1, CMUL: 4, TWSTAGES: 1, MULSTAGES: 1}, {LOGN: 4, W: 8, TW: 10, SCALE: 0, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, {LOGN: 5, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, {LOGN: 6, W: 16, TW: 18, SCALE: 1, RND: 1, ORDER: 1, CMUL: 3, TWSTAGES: 2, MULSTAGES: 0}, {LOGN: 7, W: 12, TW: 14, SCALE: 1, RND: 0, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 3}, {LOGN: 8, W: 16, TW: 16, SCALE: 0, RND: 1, ORDER: 1, CMUL: 3, TWSTAGES: 2, MULSTAGES: 3}]
    random_points: [{LOGN: 6, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, {LOGN: 9, W: 16, TW: 18, SCALE: 0, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 3}, {LOGN: 10, W: 18, TW: 18, SCALE: 1, RND: 1, ORDER: 1, CMUL: 3, TWSTAGES: 1, MULSTAGES: 2}, {LOGN: 12, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}]
    expected_primitives:
      a7: "N = 1024, W = TW = 16, CMUL 4, MULSTAGES 3: (LOGN - 1) // 2 = 4 complex multipliers = 16 DSP48E1 (12 with CMUL 3); delay memory N - 1 = 1023 words of 32 bits = 32 Kbit (the 512- and 256-word stages as 1 RAMB18 each or LUTRAM/SRL, the shorter ones in SRL32/LUTRAM); 4 twiddle ROMs of 1025 x 31 bits with two read ports (1 to 2 RAMB18 each, or 500 to 1000 LUT6 each if the tool keeps them distributed); the reorder buffer 2 x 1024 x 32 bits = 4 RAMB18 at ORDER 0; about 2 to 4 k LUT and 3 to 4 k flip-flops, of which about 2.1 k are the two control delay lines (2 x latency); expected Fmax 250 to 350 MHz"
      k26: "as a7 with DSP48E2 (27 x 18, so W <= 27) and URAM or BRAM for the long delay lines and the reorder buffer; Fmax 400 to 550 MHz expected"
    ooc_points: [{LOGN: 10, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 2, MULSTAGES: 3}, {LOGN: 10, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 1, CMUL: 3, TWSTAGES: 2, MULSTAGES: 3}, {LOGN: 12, W: 16, TW: 18, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 2, MULSTAGES: 3}, {LOGN: 8, W: 16, TW: 16, SCALE: 0, RND: 1, ORDER: 1, CMUL: 4, TWSTAGES: 2, MULSTAGES: 3}]
    mutant_run: [{mode: directed, params: {LOGN: 4, W: 8, TW: 10, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}}, {mode: directed, params: {LOGN: 5, W: 8, TW: 10, SCALE: 0, RND: 0, ORDER: 1, CMUL: 3, TWSTAGES: 2, MULSTAGES: 0}}, {mode: randomised, params: {LOGN: 6, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, n: 512}]
  burst:
    file: rtl/fft_burst_r2.sv
    module: fft_burst_r2
    deps: [fft_common/fft_bitrev.sv, fft_common/fft_cos_rom.sv, fft_twiddle/rtl/fft_twiddle_quarter.sv, fft_cmul/rtl/fft_cmul_m4.sv, fft_cmul/rtl/fft_cmul_m3.sv]
    params: {LOGN: 6, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}
    throughput: "one frame per N + LOGN * (N/2 + MULSTAGES + 3) + N clocks (load, compute, unload), no overlap: about 1 / (2 + LOGN / 2) of the streaming frame rate (1/7 at N = 1024)"
    latency: "(1<<LOGN)+LOGN*((1<<LOGN)//2+MULSTAGES+3)+1"
    tradeoff: "one butterfly and one complex multiplier (3 or 4 DSP blocks in all, whatever N), two banks of N/2 words, and no reorder buffer (the order is the read order): the smallest design, at about N / 2 * LOGN clocks of compute per frame instead of N"
    exhaustive_points: [{LOGN: 3, W: 8, TW: 8, SCALE: 1, RND: 1, ORDER: 1, CMUL: 4, TWSTAGES: 1, MULSTAGES: 1}, {LOGN: 4, W: 8, TW: 10, SCALE: 0, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, {LOGN: 5, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, {LOGN: 6, W: 16, TW: 18, SCALE: 1, RND: 1, ORDER: 1, CMUL: 3, TWSTAGES: 2, MULSTAGES: 0}, {LOGN: 7, W: 12, TW: 14, SCALE: 1, RND: 0, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 3}, {LOGN: 8, W: 16, TW: 16, SCALE: 0, RND: 1, ORDER: 1, CMUL: 3, TWSTAGES: 2, MULSTAGES: 3}]
    random_points: [{LOGN: 6, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, {LOGN: 9, W: 16, TW: 18, SCALE: 0, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 3}, {LOGN: 10, W: 18, TW: 18, SCALE: 1, RND: 1, ORDER: 1, CMUL: 3, TWSTAGES: 1, MULSTAGES: 2}, {LOGN: 12, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}]
    expected_primitives:
      a7: "N = 1024, W = TW = 16: 1 complex multiplier = 4 DSP48E1 (CMUL 4) or 3 (CMUL 3); two banks of 512 x 32 bits = 2 RAMB18 (SCALE 1); 1 twiddle ROM; about 500 to 800 LUT and 700 to 1000 flip-flops; expected Fmax 250 to 350 MHz at MULSTAGES 3"
      k26: "as a7 with DSP48E2; two RAMB18 or one RAMB36 per bank; Fmax 400 to 550 MHz expected"
    ooc_points: [{LOGN: 10, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 2, MULSTAGES: 3}, {LOGN: 10, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 3, TWSTAGES: 2, MULSTAGES: 3}, {LOGN: 12, W: 16, TW: 18, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 2, MULSTAGES: 3}, {LOGN: 8, W: 16, TW: 16, SCALE: 0, RND: 1, ORDER: 1, CMUL: 4, TWSTAGES: 2, MULSTAGES: 3}]
    mutant_run: [{mode: directed, params: {LOGN: 4, W: 8, TW: 10, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}}, {mode: directed, params: {LOGN: 5, W: 8, TW: 10, SCALE: 0, RND: 0, ORDER: 1, CMUL: 3, TWSTAGES: 2, MULSTAGES: 0}}, {mode: randomised, params: {LOGN: 6, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, n: 512}, {mode: stalled, params: {LOGN: 4, W: 8, TW: 10, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, n: 400}]
