# fp_fma testplan, schema v1 (brief 116) for the arithmetic library (brief 139e). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_fp_fma
notes: 'Arithmetic library, function fp_fma (brief 139e). Everything here is before Vivado: the model, the RTL variants, simulation, formal equivalence, Lean statements and the prepared
  out-of-context build files. No performance requirement exists because nothing about LUTs, DSPs, Fmax or power has been measured yet; the Vivado runs (build/<variant>/build.yaml) will
  add them. Every requirement is a draft written by the agent; none is agreed by a human. Lean statements are not approved. Generated by arith/tools/gen_testplan.py.'
discover:
- glob: arith/fp_fma/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: FPFMA-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/fp_fma/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (an enumeration of every finite value of a tiny format
    (the nearest one, ties to even), the multiplier and adder models, and the identities a * 1 + c = c + a and a * b + 0 = a * b) on every input at small widths and with Python's integer
    arithmetic on random large-width inputs, and the conventions that a user could guess wrong (spec.md, last section) are pinned by examples.
  source: arith/fp_fma/spec.md
  spec_status: draft
- id: FPFMA-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (11 exhaustive points, 11 random ones, across 2 variants), each variant''s outputs equal the model''s in every clock: every input
    is driven at the small points; edge values, runs of ones, and random inputs at the large ones. The function is exact, so there is no error bound.'
  source: arith/fp_fma/spec.md
  spec_status: draft
- id: FPFMA-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (fused: STAGES; cascade: STAGES_M + STAGES_A), and the bench, run with a latency two clocks off, fails for every
    variant, so the passing runs prove the latency rather than assume it.'
  source: arith/fp_fma/spec.md
  spec_status: draft
- id: FPFMA-F-EQUIV
  kind: functional
  title: The variants are equivalent to a plain reference, by proof where the tools allow
  text: SymbiYosys with the slang front end checks the variants against each other and a plain reference (a single `+` or `*`, or the specification written as RTL). The jobs in formal/jobs.yaml
    name the widths; a proof is by k-induction (for all inputs, any run length) at the widths listed there, a bounded check holds only to its stated depth. Widths beyond the listed ones
    are covered by simulation, not by proof.
  source: arith/fp_fma/formal/jobs.yaml
  spec_status: draft
- id: FPFMA-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each, in the variant''s RTL: an inverted condition, a wrong constant, a dropped connection, a lost reset)
    makes the cocotb bench fail; mutants that survive or do not build are reported, never hidden.'
  source: arith/fp_fma/verif/mutants.yaml
  spec_status: draft
- id: FPFMA-F-HARNESS
  kind: functional
  title: The packaged verification harness is a standalone deliverable that works
  text: arith/fp_fma/harness holds the model, the cocotb bench, a SystemVerilog checker, coverage targets and a runner that needs nothing else from the repository. Run standalone against
    every variant (one small exhaustive point and one large random point each, with the checker beside the instance) it passes and the random runs meet every coverage target; run against
    a planted fault it fails, with and without the checker. Its generated files are the repository's own bench, so they cannot drift.
  source: arith/fp_fma/harness/README.md
  spec_status: draft
- id: FPFMA-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/fp_fma/spec.yaml
  spec_status: draft
- id: FPFMA-F-LEAN-CARRY
  kind: functional
  title: Rounding increment carries into the exponent, for every width
  text: 'For a packed pattern e * m + f with fraction f < m (m = 2^MAN), adding the rounding increment 1 either raises the fraction by one or, when the fraction is all ones, raises the
    exponent by one and leaves a zero fraction: the identity fp_pack''s single add on the packed {exponent, fraction} pattern rests on, so a significand overflow, a subnormal rounding
    up to the smallest normal number and a largest finite number rounding up to infinity need no special case. The statement is the specification and is NOT approved by a human (verif/lean_approvals.yaml
    is empty), so the proof is shown but not counted as verification. The Lean text is a hand transcription of the RTL''s structure; it models no timing or clocking.'
  source: 'arith/fp_common/fp_pack.sv (wsum: the increment added to the packed pattern)'
  spec_status: draft
- id: FPFMA-F-LEAN-NORM
  kind: functional
  title: Normalising left by NW - 1 - msb puts the leading one at the top, for every width
  text: 'For a value v with its leading one at bit k (2^k <= v < 2^(k+1)) and k < NW, shifting left by NW - 1 - k places gives a value in [2^(NW-1), 2^NW): the leading one is at bit
    NW - 1, which is what fp_norm''s count lz = NW - 1 - msb does. The statement is the specification and is NOT approved by a human (verif/lean_approvals.yaml is empty), so the proof
    is shown but not counted as verification. The Lean text is a hand transcription of the RTL''s structure; it models no timing or clocking.'
  source: arith/fp_common/fp_norm.sv (the shift by the leading-zero count)
  spec_status: draft
- id: FPFMA-F-LEAN-RNE
  kind: functional
  title: The rounding decision is round-to-nearest, ties to even, for every width
  text: For a kept part hi and a discarded part lo below the threshold 2h, incrementing hi exactly when lo > h, or lo = h and hi is odd (the guard-and-sticky rule of fp_pack), gives
    a value within h of the exact one and, when it is exactly h away, even. The statement is the specification and is NOT approved by a human (verif/lean_approvals.yaml is empty), so
    the proof is shown but not counted as verification. The Lean text is a hand transcription of the RTL's structure; it models no timing or clocking.
  source: arith/fp_common/fp_pack.sv (guard, rest and inc)
  spec_status: draft
