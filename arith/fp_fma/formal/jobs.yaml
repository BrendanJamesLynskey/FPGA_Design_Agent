# Formal jobs of the floating-point multiply-add (arith brief 139e; tools/run_formal.py). The fv top (fp_fma_fv.sv) holds both variants and fpx_ref (the specification as wide integer
# arithmetic, sharing no code with them; for the cascade, two steps of it); each variant is compared with the reference delayed by its latency. prove = k-induction (unbounded: for every
# input in every clock, any run length) at the formats listed, which are tiny because the SMT problem grows with the exponent range and with three operands; larger formats are covered by
# simulation only. mutant jobs run on a copy with one seeded fault from verif/mutants.yaml and EXPECT a counterexample (the check can fail).
jobs:
- {name: eq_e2m1_s1_f4_c21, top: fp_fma_fv, params: {EXP: 2, MAN: 1, SUBNORM: 1, ST_F: 4, ST_M: 2, ST_A: 1}, mode: prove, depth: 8, sources: [formal/fp_fma_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_fma_fused.sv, rtl/fp_fma_cascade.sv, ../fp_mul/rtl/fp_mul_dsp.sv, ../fp_add/rtl/fp_add_single.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'fused (4 ranks) == the exact a*b+c rounded once, and cascade (2 + 1 ranks) == the product rounded then the sum rounded, EXP 2 MAN 1, subnormals: proved for all inputs (k-induction)'}
- {name: eq_e2m1_s0_f0_c00, top: fp_fma_fv, params: {EXP: 2, MAN: 1, SUBNORM: 0, ST_F: 0, ST_M: 0, ST_A: 0}, mode: prove, depth: 8, sources: [formal/fp_fma_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_fma_fused.sv, rtl/fp_fma_cascade.sv, ../fp_mul/rtl/fp_mul_dsp.sv, ../fp_add/rtl/fp_add_single.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'fused (0 ranks) == the exact a*b+c rounded once, and cascade (0 + 0 ranks) == the product rounded then the sum rounded, EXP 2 MAN 1, flush to zero: proved for all inputs (k-induction)'}
- {name: eq_e2m2_s1_f2_c12, top: fp_fma_fv, params: {EXP: 2, MAN: 2, SUBNORM: 1, ST_F: 2, ST_M: 1, ST_A: 2}, mode: prove, depth: 8, sources: [formal/fp_fma_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_fma_fused.sv, rtl/fp_fma_cascade.sv, ../fp_mul/rtl/fp_mul_dsp.sv, ../fp_add/rtl/fp_add_single.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'fused (2 ranks) == the exact a*b+c rounded once, and cascade (1 + 2 ranks) == the product rounded then the sum rounded, EXP 2 MAN 2, subnormals: proved for all inputs (k-induction)'}
- {name: eq_e2m2_s0_f3_c30, top: fp_fma_fv, params: {EXP: 2, MAN: 2, SUBNORM: 0, ST_F: 3, ST_M: 3, ST_A: 0}, mode: prove, depth: 8, sources: [formal/fp_fma_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_fma_fused.sv, rtl/fp_fma_cascade.sv, ../fp_mul/rtl/fp_mul_dsp.sv, ../fp_add/rtl/fp_add_single.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'fused (3 ranks) == the exact a*b+c rounded once, and cascade (3 + 0 ranks) == the product rounded then the sum rounded, EXP 2 MAN 2, flush to zero: proved for all inputs (k-induction)'}
- {name: eq_e3m1_s1_f1_c01, top: fp_fma_fv, params: {EXP: 3, MAN: 1, SUBNORM: 1, ST_F: 1, ST_M: 0, ST_A: 1}, mode: prove, depth: 8, sources: [formal/fp_fma_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_fma_fused.sv, rtl/fp_fma_cascade.sv, ../fp_mul/rtl/fp_mul_dsp.sv, ../fp_add/rtl/fp_add_single.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'fused (1 ranks) == the exact a*b+c rounded once, and cascade (0 + 1 ranks) == the product rounded then the sum rounded, EXP 3 MAN 1, subnormals: proved for all inputs (k-induction)'}
- {name: mutant_sticky, top: fp_fma_fv, params: {EXP: 4, MAN: 2, SUBNORM: 1, ST_F: 0, ST_M: 0, ST_A: 0}, mode: bmc, depth: 2, sources: [formal/fp_fma_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_fma_fused.sv, rtl/fp_fma_cascade.sv, ../fp_mul/rtl/fp_mul_dsp.sv, ../fp_add/rtl/fp_add_single.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault fu_no_sticky is refuted, mutant: fu_no_sticky}
- {name: mutant_anchor, top: fp_fma_fv, params: {EXP: 2, MAN: 2, SUBNORM: 1, ST_F: 0, ST_M: 2, ST_A: 0}, mode: bmc, depth: 3, sources: [formal/fp_fma_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_fma_fused.sv, rtl/fp_fma_cascade.sv, ../fp_mul/rtl/fp_mul_dsp.sv, ../fp_add/rtl/fp_add_single.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault fu_anchor is refuted, mutant: fu_anchor}
- {name: mutant_addend_sign, top: fp_fma_fv, params: {EXP: 2, MAN: 2, SUBNORM: 1, ST_F: 0, ST_M: 2, ST_A: 0}, mode: bmc, depth: 3, sources: [formal/fp_fma_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_fma_fused.sv, rtl/fp_fma_cascade.sv, ../fp_mul/rtl/fp_mul_dsp.sv, ../fp_add/rtl/fp_add_single.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault fu_addend_sign is refuted, mutant: fu_addend_sign}
- {name: mutant_zero_sign, top: fp_fma_fv, params: {EXP: 2, MAN: 2, SUBNORM: 1, ST_F: 0, ST_M: 2, ST_A: 0}, mode: bmc, depth: 3, sources: [formal/fp_fma_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_fma_fused.sv, rtl/fp_fma_cascade.sv, ../fp_mul/rtl/fp_mul_dsp.sv, ../fp_add/rtl/fp_add_single.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault fu_zero_sign is refuted, mutant: fu_zero_sign}
- {name: mutant_c_delay, top: fp_fma_fv, params: {EXP: 2, MAN: 2, SUBNORM: 1, ST_F: 0, ST_M: 2, ST_A: 0}, mode: bmc, depth: 3, sources: [formal/fp_fma_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_fma_fused.sv, rtl/fp_fma_cascade.sv, ../fp_mul/rtl/fp_mul_dsp.sv, ../fp_add/rtl/fp_add_single.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault ca_delay_tap is refuted, mutant: ca_delay_tap}
- {name: mutant_ties_down, top: fp_fma_fv, params: {EXP: 2, MAN: 2, SUBNORM: 1, ST_F: 0, ST_M: 2, ST_A: 0}, mode: bmc, depth: 3, sources: [formal/fp_fma_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_fma_fused.sv, rtl/fp_fma_cascade.sv, ../fp_mul/rtl/fp_mul_dsp.sv, ../fp_add/rtl/fp_add_single.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault pk_ties_down is refuted, mutant: pk_ties_down}
