    theorem: Arith.Rounding.halfUp_def
  rtl_link:
    kind: model_only
- id: V-LEAN-FXR-HALFUP-ERR
  requirements:
  - FXR-F-LEAN-HALFUP
  method: formal_lean
  title: Round half up errs by at most half a unit (and strictly less on the low side), every x and S
  evidence:
    file: formal/lean/records/build_record.json
    reader: json
  lean:
