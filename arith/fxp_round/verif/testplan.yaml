- id: V-LEAN-FXR-CONV-FOLD
  requirements:
  - FXR-F-LEAN-CONV
  method: formal_lean
  title: The carry-in form of convergent rounding equals its definition, every x and every S >= 1
  evidence:
    file: formal/lean/records/build_record.json
    reader: json
  lean:
    module: Arith.Rounding
    theorem: Arith.Rounding.convFold_eq
  rtl_link:
    kind: transcription_tested
    source:
    - file: arith/fxp_round/rtl/fxp_round_fold.sv
      lines: 32-35
    transcribed_in: Arith/Rounding.lean (convFold, convergent)
    crosscheck:
      file: formal/lean/Arith/CrossCheck.lean
      reference: the Python bit-exact model arith/fxp_round/model.py (written from spec.md; the simulation tests tie it to the RTL), compared on small widths by formal/lean/tools/crosscheck_arith.py; not
        the RTL itself
