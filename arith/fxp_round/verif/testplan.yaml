# fxp_round testplan, schema v1 (brief 116 format; brief 139b). The agent wrote every requirement below from the owner's request; none is agreed by a human (`spec_status: draft`).
# Status is never typed here: `python -m flow.trace_v1 write arith/fxp_round` computes it from the evidence files named in each item. Evidence is regenerated by the commands in `notes`.
schema: fpga-design-agent/testplan/v1
design: fxp_round
notes: 'Arithmetic library function fxp_round (brief 139b). Every requirement is a draft written by the agent from the owner''s request (spec_status: draft; only a human sets agreed). Evidence is generated
  by `python -m pytest arith/fxp_round/tests --junitxml=results/139b_arith/fxp_round_junit.xml` with ARITH_RECORD_DIR=results/139b_arith. The Lean items show ''statement not approved'': lean_approvals.yaml
  is the owner''s. The one performance requirement (brief 160) says every prepared out-of-context point has a routed Vivado result; no Fmax or area bound is agreed.'
discover:
- glob: arith/fxp_round/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: FXR-F-MODEL
  kind: functional
  title: 'The model is the specification: it equals integer arithmetic'
  text: 'For the rounding and saturation: the three rounding modes equal their definitions on exact fractions for every x, S and W_IN up to 9, the single-adder carry-in form equals the definition for every
    x, S and mode up to W_IN = 10, the error bounds hold, and saturation and wrap are as specified.'
  source: arith/fxp_round/spec.md#the-function
  spec_status: draft
- id: FXR-F-RTL-EXH
  kind: functional
  title: Every variant is bit-exact against the model, exhaustively at small widths
  text: 'Simulation (Icarus 14) of every variant against the model: every input x at W_IN = 5 and 8 for every S, four W_OUT around the rounded width, three modes, wrap and saturate: 954 configurations over
    the three variants.'
  source: arith/fxp_round/spec.md#the-function
  spec_status: draft
- id: FXR-F-RTL-RAND
  kind: functional
  title: Every variant is bit-exact against the model at large widths
  text: 'Simulation of every variant against the model: edge, random and tie-pattern values at W_IN = 16, 24, 32 and 48, six random configurations per variant and width.'
  source: arith/fxp_round/spec.md#the-function
  spec_status: draft
- id: FXR-F-LAT
  kind: functional
  title: Latency and throughput are what the spec states
  text: The measured latency equals the spec (1, 1, 2 clocks) for every variant, one result per clock.
  source: arith/fxp_round/spec.md#the-function
  spec_status: draft
- id: FXR-F-LINT
  kind: functional
  title: The RTL is Verilator -Wall clean
  text: Verilator -Wall --lint-only reports nothing for any variant at the corner configurations (S = 0, 1, W_IN - 1; W_OUT 2, narrower, equal and wider than the rounded value; all modes, wrap and saturate).
  source: arith/fxp_round/spec.md#the-function
  spec_status: draft
- id: FXR-F-MUTANT
  kind: functional
  title: The bench catches seeded faults
  text: 'Each of 14 seeded faults (one text change in the RTL, verif/mutants.yaml) makes the bench fail: killed/total = 14/14.'
  source: arith/fxp_round/spec.md#the-function
  spec_status: draft
- id: FXR-F-FORMAL-REF
  kind: functional
  title: Every variant equals an independent reference (SymbiYosys)
  text: 'SymbiYosys with the slang front end: each variant equals a reference written from the definitions with wide signed arithmetic for all input sequences from reset: 3 variants x 8 configurations;
    unbounded (abc pdr). Six seeded faults are applied to the RTL and the same proof fails (bounded model checking finds the counterexample), which shows the harness is not vacuous.'
  source: arith/fxp_round/spec.md#the-function
  spec_status: draft
- id: FXR-F-FORMAL-PAIR
  kind: functional
  title: Variants of the function agree with each other (SymbiYosys)
  text: 'SymbiYosys with the slang front end, no reference involved: the fold-add and the increment-after variants give the same output on the same inputs for the 8 configurations; unbounded (abc pdr).'
  source: arith/fxp_round/spec.md#the-function
  spec_status: draft
- id: FXR-F-LEAN-CONV
  kind: functional
  title: 'Convergent rounding: carry-in form, error bound and tie-to-even for every S (Lean)'
  text: Convergent rounding computed by one addition of the constant 2^(S-1) - 1 and the result's LSB as a carry-in (what fxp_round_fold builds) equals the textbook definition for every integer x and every
    S >= 1; its error is at most half a unit; a tie goes to the even result. Proved in Lean, statements not approved. Saturation and wrap are not in the Lean model.
  source: arith/fxp_round/spec.md#verification-everything-before-vivado
  spec_status: draft
- id: FXR-F-LEAN-HALFUP
  kind: functional
  title: 'Round half up and truncation: definition and error bounds for every S (Lean)'
  text: Round half up is floor + [fraction >= half] and errs by at most half a unit; truncation errs by less than one unit and never upward; every x, every S >= 1. Proved in Lean, statements not approved;
    pure arithmetic, no RTL link.
  source: arith/fxp_round/spec.md#verification-everything-before-vivado
  spec_status: draft
- id: FXR-F-BUILD
  kind: functional
  title: Out-of-context build descriptions are prepared for Artix-7 and K26 (prepared in brief 139b, run in brief 160)
  text: 'For every variant of the rounding and saturation there is a build.yaml and an out-of-context clock constraint for xc7a100t and xck26, current against arith/tools/gen_build.py, consistent with the
    RTL (top, parameters, sources), with the expected primitive use evaluated for each point; the out-of-context wrapper lints clean and is functionally exact for the always-ready variants; the packaged
    verification harness (harness/run.py, which a user reruns against their own instance) passes on the library instance with every coverage bin hit. This requirement is about preparation; the measured area, Fmax and power are in the brief 160 records.'
  source: arith/fxp_round/spec.md#vivado-builds-prepared-in-brief-139b-run-in-brief-160
  spec_status: draft
- id: FXR-P-OOC
  kind: performance
  title: Every prepared point places and routes out of context on Artix-7 and K26
  text: Each point of the build files of fxp_round (build/<variant>/build.yaml; 24 in all, both parts) goes through Vivado 2026.1 out-of-context synthesis, placement and routing and
    leaves a recorded result (utilisation, WNS, WHS, Fmax, logic levels, vectorless power) in verif/results/vivado_ooc_<variant>_<part>.json. The measured values and each point's pre-stated
    expectation are in the Measured table of spec.md and in verif/results/vivado_surface.json; this requirement states only that the measurement exists for every point, because no Fmax
    or area bound has been agreed.
  source: arith/fxp_round/spec.md
  spec_status: draft
  performance:
    quantity: prepared points with a routed out-of-context Vivado result
    unit: points
    op: ge
    bound: 24
    condition: Vivado 2026.1 out-of-context, one thread, the clocks of the build files, brief 160
verification:
- id: V-FXR-MODEL
  requirements:
  - FXR-F-MODEL
  method: sim_test
  title: Model tests against Python integer arithmetic
  evidence:
    file: results/139b_arith/fxp_round_junit.xml
    reader: junit
    tests:
    - test_fxp_round_model::*
  checks:
  - arith/fxp_round/model.py
- id: V-FXR-RTL-EXH
  requirements:
  - FXR-F-RTL-EXH
  method: sim_test
  title: Exhaustive small widths, every variant
  evidence:
    file: results/139b_arith/fxp_round_junit.xml
    reader: junit
    tests:
    - test_fxp_round_rtl::test_exhaustive_small_widths
  checks: &id001
  - arith/fxp_round/rtl/fxp_round_2st.sv
  - arith/fxp_round/rtl/fxp_round_fold.sv
