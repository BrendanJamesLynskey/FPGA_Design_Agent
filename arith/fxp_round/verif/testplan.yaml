  - FXR-F-RTL-RAND
  method: sim_test
  title: Random and edge vectors at large widths
  evidence:
    file: results/139b_arith/fxp_round_junit.xml
    reader: junit
    tests:
    - test_fxp_round_rtl::test_random_and_tie_heavy_large_widths
  checks: *id001
- id: V-FXR-LAT
  requirements:
  - FXR-F-LAT
  method: sim_test
  title: Latency measured per result
  evidence:
    file: results/139b_arith/fxp_round_junit.xml
    reader: junit
    tests:
    - test_fxp_round_rtl::test_latency_one_clock_for_fold_and_inc_two_for_the_two_stage
  checks: *id001
- id: V-FXR-LINT
  requirements:
  - FXR-F-LINT
  method: sim_test
  title: Verilator -Wall lint
  evidence:
    file: results/139b_arith/fxp_round_junit.xml
    reader: junit
    tests:
    - test_fxp_round_rtl::test_lint_clean
  checks: *id001
- id: V-FXR-MUTANT-RUN
  requirements:
  - FXR-F-MUTANT
  method: sim_test
  title: The mutant check passes
  evidence:
    file: results/139b_arith/fxp_round_junit.xml
    reader: junit
    tests:
    - test_fxp_round_rtl::test_seeded_mutants_are_all_killed
  checks:
  - arith/fxp_round/rtl/fxp_round_2st.sv
  - arith/fxp_round/rtl/fxp_round_fold.sv
  - arith/fxp_round/rtl/fxp_round_inc.sv
  - arith/fxp_round/rtl/fxp_round_ooc.sv
  - arith/fxp_round/rtl/fxp_round_sel.sv
  - arith/fxp_round/rtl/fxp_sat.sv
  - arith/fxp_round/model.py
  - arith/common/tb_stream.sv
  - arith/fxp_round/tb/tb_fxp_round.sv
  - arith/fxp_round/verif/mutants.yaml
- id: V-FXR-MUTANT-SCORE
  requirements:
  - FXR-F-MUTANT
  method: sim_measurement
  title: Mutants killed / total
  evidence:
    file: results/139b_arith/fxp_round_sim_record.json
