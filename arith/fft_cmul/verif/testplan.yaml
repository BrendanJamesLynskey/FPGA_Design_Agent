- id: V-FCMUL-MUTANT-SCORE
  requirements:
  - FCMUL-F-BENCH
  method: sim_measurement
  title: Mutants killed of valid mutants (the record of the last full run)
  evidence:
    file: arith/fft_cmul/verif/results/mutation.json
    reader: json
  pass_when:
  - field: survived
    op: eq
    value: []
  - field: invalid
    op: eq
    value: []
  - field: valid
    op: ge
    value: 6
  - field: score_pct
    op: eq
    value: 100.0
  checks:
  - arith/fft_cmul/rtl/fft_cmul_m4.sv
  - arith/fft_cmul/rtl/fft_cmul_m3.sv
  - arith/fft_cmul/tests/fft_cmul_cocotb.py
  - arith/fft_cmul/model.py
  - arith/fft_cmul/verif/mutants.yaml
- id: V-FCMUL-PACKAGE
  requirements:
  - FCMUL-F-PACKAGE
  method: sim_test
  title: spec.yaml against the RTL headers, spec.md against spec.yaml, Verilator -Wall at every point, wrappers and build.yaml current and lint-clean
  evidence:
    file: arith/fft_cmul/verif/results/pytest_junit.xml
    reader: junit
    tests:
