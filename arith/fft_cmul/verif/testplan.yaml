# fft_cmul testplan, schema v1 (brief 116) for the frequency-domain suite (brief 148). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_fft_cmul
notes: 'Frequency-domain suite, function fft_cmul (brief 148). Everything here is before Vivado: the model, the RTL variants, simulation, formal properties and the prepared out-of-context
  build files. No performance requirement on LUTs, DSPs, Fmax or power exists because none has been measured; the Vivado runs (build/<variant>/build.yaml, queued in _handoff/fpga_agent/vivado_later_queue.md)
  will add them. Every requirement is a draft written by the agent; none is agreed by a human. There are no Lean statements and no packaged harness for this suite (stated in the report).
  Generated by arith/tools/gen_testplan_fft.py.'
discover:
- glob: arith/fft_cmul/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: FCMUL-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/fft_cmul/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (a second formulation (the three-multiplication identity)
    in Python integers), and the conventions that a user could guess wrong (spec.md, last section) are pinned by examples.
  source: arith/fft_cmul/spec.md
  spec_status: draft
- id: FCMUL-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (10 directed or exhaustive points, 10 random ones, across 2 variants), each variant''s outputs equal the model''s: every input is
    driven at the small points (4 operands of 2 to 4 bits); edge values and random inputs at the large ones. The function is exact, so there is no error bound.'
  source: arith/fft_cmul/spec.md
  spec_status: draft
- id: FCMUL-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (m4: STAGES; m3: STAGES), and the bench, run with a latency two clocks off, fails for every variant, so the
    passing runs prove the latency rather than assume it.'
  source: arith/fft_cmul/spec.md
  spec_status: draft
- id: FCMUL-F-EQUIV
  kind: functional
  title: The properties named in formal/jobs.yaml hold, by proof where the tools allow
  text: 'SymbiYosys with the slang front end checks the properties of formal/jobs.yaml: a proof is by k-induction (for all inputs, any run length) at the parameters listed there, a bounded
    check holds only to its stated depth. What the jobs say is in each job''s `claim`; parameters beyond the listed ones are covered by simulation, not by proof.'
  source: arith/fft_cmul/formal/jobs.yaml
  spec_status: draft
- id: FCMUL-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each: an inverted condition, a wrong constant, a dropped connection, a wrong width) makes the cocotb bench
    fail, or is argued equivalent in the file''s header; mutants that survive or do not build are reported, never hidden.'
  source: arith/fft_cmul/verif/mutants.yaml
  spec_status: draft
- id: FCMUL-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/fft_cmul/spec.yaml
  spec_status: draft
verification:
- id: V-FCMUL-MODEL
  requirements:
  - FCMUL-F-MODEL
  method: sim_test
  title: The model against independent formulations and the pinned conventions
  evidence:
    file: arith/fft_cmul/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_fft_cmul_model::*
  checks:
  - arith/fft_cmul/model.py
  - arith/fft_common/fft_ref.py
- id: V-FCMUL-DIRECTED
  requirements:
  - FCMUL-F-EXACT
  method: sim_test
  title: 'Every variant against the model at the small points (Icarus + cocotb): directed or exhaustive stimuli'
  evidence:
    file: arith/fft_cmul/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_fft_cmul_directed_rtl::*
  checks:
  - arith/fft_cmul/rtl/fft_cmul_m4.sv
  - arith/fft_cmul/rtl/fft_cmul_m3.sv
  - arith/fft_cmul/tests/fft_cmul_cocotb.py
  - arith/fft_cmul/model.py
- id: V-FCMUL-RANDOM
  requirements:
  - FCMUL-F-EXACT
  method: sim_test
  title: 'Every variant against the model at the large points: random stimuli (Icarus + cocotb)'
  evidence:
    file: arith/fft_cmul/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_fft_cmul_random_rtl::*
  checks:
  - arith/fft_cmul/rtl/fft_cmul_m4.sv
  - arith/fft_cmul/rtl/fft_cmul_m3.sv
  - arith/fft_cmul/tests/fft_cmul_cocotb.py
  - arith/fft_cmul/model.py
- id: V-FCMUL-LATENCY
  requirements:
  - FCMUL-F-LAT
  method: sim_test
  title: The bench passes at the stated latency and fails two clocks off, for every variant
  evidence:
    file: arith/fft_cmul/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_fft_cmul_latency_rtl::*
  checks:
  - arith/fft_cmul/rtl/fft_cmul_m4.sv
  - arith/fft_cmul/rtl/fft_cmul_m3.sv
  - arith/fft_cmul/tests/fft_cmul_cocotb.py
  - arith/fft_cmul/model.py
- id: V-FCMUL-FORMAL-PROOF
  requirements:
  - FCMUL-F-EQUIV
  method: formal
  title: k-induction proofs (6 jobs; parameters in formal/jobs.yaml)
  evidence:
    file: arith/fft_cmul/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_fft_cmul_formal_proof_rtl::*
  checks:
  - arith/fft_cmul/rtl/fft_cmul_m4.sv
  - arith/fft_cmul/rtl/fft_cmul_m3.sv
  - arith/fft_cmul/formal/fft_cmul_fv.sv
  - arith/fft_cmul/formal/jobs.yaml
- id: V-FCMUL-FORMAL-REFUTE
  requirements:
  - FCMUL-F-EQUIV
  method: formal
  title: Each formal check refutes a planted fault (the check can fail)
  evidence:
    file: arith/fft_cmul/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_fft_cmul_formal_refute_rtl::*
  checks:
  - arith/fft_cmul/rtl/fft_cmul_m4.sv
  - arith/fft_cmul/rtl/fft_cmul_m3.sv
  - arith/fft_cmul/formal/fft_cmul_fv.sv
  - arith/fft_cmul/formal/jobs.yaml
- id: V-FCMUL-MUTANT-TEST
  requirements:
  - FCMUL-F-BENCH
  method: sim_test
  title: 'The mutation run as a test: no mutant survives, none fails to build'
  evidence:
    file: arith/fft_cmul/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_fft_cmul_mutants_rtl::*
  checks:
  - arith/fft_cmul/rtl/fft_cmul_m4.sv
  - arith/fft_cmul/rtl/fft_cmul_m3.sv
  - arith/fft_cmul/tests/fft_cmul_cocotb.py
