# Coverage targets of the packaged harness (brief 139c): each bin is a Python expression over one input vector; every bin must be hit at least once.
bins:
  a_equals_b: "a == b"
  a_below_b: "a < b"
  a_above_b: "a > b"
  ratio_near_two_thirds: "-3 <= 3 * a - 2 * b <= 3"
  ratio_near_five_thirds: "-3 <= 3 * a - 5 * b <= 3"
  a_max: "a == (1 << w) - 1"
  b_min: "b == 1 << (w - 1)"
  b_max: "b == (1 << w) - 1"
  divisor_interval_0: "i == 0"
  divisor_interval_1: "i == 1"
  divisor_interval_2: "i == 2"
  divisor_interval_3: "i == 3"
  divisor_interval_4: "i == 4"
  divisor_interval_5: "i == 5"
  divisor_interval_6: "i == 6"
  divisor_interval_7: "i == 7"
