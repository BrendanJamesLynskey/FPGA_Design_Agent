# Machine-readable specification of the high-radix divider (brief 139c). Human-readable form: spec.md. spec_status is set by a human only.
function: divider_hr
spec_version: 1
spec_status: draft
summary: Exact radix-4 SRT division of normalised significands, quotient with 2K fractional bits and the exact remainder.
parameters:
  W: {meaning: operand width in bits (a and b are W-bit normalised significands), range: "7 or more", checked_in_simulation: "7 to 9 exhaustively (every pair), 12 16 24 32 48 by random and boundary-ratio vectors"}
  K: {meaning: "fractional radix-4 digits of the quotient (2K fractional bits); the division takes K + 1 digit steps, the first being the integer digit", range: "1 or more", checked_in_simulation: "1 to 5 exhaustively at W = 7 to 9; 3 to 26 by random vectors"}
  PIPE: {meaning: "unrolled variant only: digit steps per register stage", range: "1 to K + 1 (more behaves as K + 1)"}
interface:
  clock: "clk (rising edge)"
  reset: "rst (synchronous, active high; clears only the valid flags and the iterative variants' busy state)"
  in: {in_valid: 1, in_ready: "1 for the unrolled variant; low while an iterative variant is busy", in_data: "{a, b}, 2*W bits, both unsigned and normalised (MSB set): a / b is in (1/2, 2)"}
  out: {out_valid: 1, out_data: "{quo, rem}: quo 2*K + 1 bits, rem W bits, both unsigned; meaningful only while out_valid is high"}
  handshake: "a transfer happens on a rising edge where in_valid and in_ready are both high; there is no back-pressure on the output (out_valid is one clock wide per result, results are never held)"
function_definition:
  precondition: "a and b are W-bit with the MSB set (2**(W-1) <= a, b < 2**W). The behaviour for other inputs is not specified and no flag is raised."
  quotient: "quo = floor(a * 4**K / b); quo < 2**(2K+1), so it has K integer-digit bits plus the integer digit: one integer bit (quo >= 4**K exactly when a >= b) and 2K fractional bits"
  remainder: "rem = a * 4**K - quo * b, so 0 <= rem < b (the exact remainder, an integer in the units of the divisor)"
  relation_to_integer_division: "the same pair as arith/divider (brief 139b) at width W + 2K with n = a * 4**K and d = b"
error_bound: exact (no approximation; the remainder is returned)
latency_definition: "clock edges from the edge that accepts an input to the edge that samples out_valid high (1 = out_valid is high in the cycle immediately after the accepting edge)"
variants:
  - id: srt4_iter
    module: divider_hr_iter
    selector: {VARIANT: 0}
    protocol: "valid/ready on the input (a transfer is in_valid and in_ready on a rising edge; in_ready is low while a result is being computed and is high again in the cycle out_valid is high), out_valid one clock wide, no back-pressure on the output, results in input order"
    reset_clock_assumptions: "one clock, rising edge; rst is synchronous and must be held for at least one clock before the first in_valid (the formal harness assumes reset in the first cycle only); outputs and in_ready are defined from the first clock after reset; data-path registers are not reset"
    latency: "K + 3"
    throughput: "one division per K + 3 clocks (in_ready low while busy)"
    expected_primitives: {carry4: "2 + ceil((W+3)/4) + ceil((W+1)/4)", dsp48: 0, bram: 0, ff: "2*(W+3) + 2*W + 3*(2*K+1) + ceil(log2(K+2)) + 5", lut: "about 2*(W+3) for the compressor with the b and 2b select, plus the digit table (10 inputs)"}
    trade_off: "carry-save remainder (no carry chain across W bits in the loop, two remainder registers) and one carry-propagate add at the end; two quotient bits per clock"
    points: [{W: 16, K: 8}, {W: 24, K: 12}, {W: 32, K: 16}]
  - id: srt4_cpa
    module: divider_hr_cpa
    selector: {VARIANT: 1}
    protocol: "valid/ready on the input (a transfer is in_valid and in_ready on a rising edge; in_ready is low while a result is being computed and is high again in the cycle out_valid is high), out_valid one clock wide, no back-pressure on the output, results in input order"
    reset_clock_assumptions: "one clock, rising edge; rst is synchronous and must be held for at least one clock before the first in_valid (the formal harness assumes reset in the first cycle only); outputs and in_ready are defined from the first clock after reset; data-path registers are not reset"
    latency: "K + 3"
    throughput: "one division per K + 3 clocks (in_ready low while busy)"
    expected_primitives: {carry4: "ceil((W+3)/4) + ceil((W+1)/4)", dsp48: 0, bram: 0, ff: "(W+1) + 2*W + 3*(2*K+1) + ceil(log2(K+2)) + 5", lut: "about W + 3 for the b and 2b select, plus the digit table"}
    trade_off: "the same digits with an ordinary binary remainder: one adder in the loop (a carry chain on every step) and one register fewer; on a fabric with fast carry chains this may beat the carry-save form, which is what the Vivado runs are for"
    points: [{W: 16, K: 8}, {W: 24, K: 12}, {W: 32, K: 16}]
  - id: srt4_pipe
    module: divider_hr_pipe
    selector: {VARIANT: 2}
    protocol: "valid only: in_ready is constant 1, fixed latency, one result per clock, no stall or enable (a free-running pipeline); out_valid is in_valid delayed by the latency, results in input order"
    reset_clock_assumptions: "one clock, rising edge; rst is synchronous and must be held for at least one clock before the first in_valid (the formal harness assumes reset in the first cycle only); outputs and in_ready are defined from the first clock after reset; data-path registers are not reset"
    latency: "ceil((K + 1) / PIPE) + 1"
    throughput: one division per clock
    expected_primitives: {carry4: "2*(K+1) + ceil((W+3)/4) + ceil((W+1)/4)", dsp48: 0, bram: 0, ff: "ceil((K+1)/PIPE) * (2*(W+3) + W + 2*(2*K+1)) + (2*K+1) + W + ceil((K+1)/PIPE) + 1", lut: "about (K+1) * 2*(W+3) for the compressors plus (K+1) digit tables"}
    trade_off: "K + 1 compressor rows in one pipeline for one division per clock; PIPE sets the register spacing (one carry-save step is very short, so PIPE above 1 is the usual choice)"
    points: [{W: 16, K: 8, PIPE: 1}, {W: 16, K: 8, PIPE: 3}, {W: 32, K: 16, PIPE: 1}, {W: 32, K: 16, PIPE: 3}, {W: 32, K: 16, PIPE: 17}]
integration:
  port_timing: "All inputs are sampled on the rising edge and all outputs change after it; there is no combinational path from in_data or in_valid to out_data or out_valid in any variant except that the unrolled pipeline's first stage logic is between the input pins and the first register, so register the inputs (the out-of-context wrapper does) when the source is slow. in_ready of an iterative variant is a registered state and may drive a source's enable directly."
  constraints_to_carry: "One clock constraint on clk. No multicycle or false-path exceptions are needed or valid: every path is single-cycle register to register. rst is synchronous: do not give it an asynchronous or set_false_path treatment. Do not retime across the valid pipeline of the unrolled variant without re-running the harness (latency is part of the contract). The operands must be normalised before this block (arith/lzc_norm from brief 139b is the matching leading-zero count and shifter). Out-of-context numbers (Fmax, area, power) are not yet measured: see build/<variant>/<fabric>/build.yaml, prepared and not run."
  after_integration: "Rerun the packaged harness against your instance (harness/README.md): it checks values, order and the measured latency of every result and reports coverage of the target bins (the eight divisor intervals of the digit-selection table among them)."
what_a_user_could_guess_wrong:
  - "Both operands must be normalised (MSB set). An unnormalised divisor can break the digit selection (it indexes a table by the three bits below the leading one) and the result is then wrong without any flag. Normalise first (arith/lzc_norm), divide, and take the exponent difference separately."
  - "The quotient is exact, not rounded: quo = floor(a * 4**K / b) and the remainder rem = a * 4**K - quo * b is returned. For a floating-point divide the remainder gives the sticky bit (rem != 0) and the rounding position is yours to choose; K = ceil((W - 1) / 2) gives W - 1 or W fractional quotient bits."
  - "quo has 2K + 1 bits: the top bit is the integer part (1 when a >= b), the other 2K bits are fractional. With W even and K = W / 2 there is one more fractional bit than W - 1."
  - "rem is in the units of the divisor (an integer below b), not a fraction of the quotient's last place."
  - "'Radix 4' here means two quotient bits per step with the redundant digit set {-2,-1,0,1,2} (SRT): the partial remainder stays in a carry-save form in srt4_iter and srt4_pipe, and the quotient is converted to binary on the fly, so the final quotient may be one more than the last digit string's value and is corrected by the sign of the final remainder."
  - "The first of the K + 1 digit steps is the integer digit; the latency is therefore K + 3 for the iterative variants, not K + 1."
  - "A division is not accepted while an iterative variant is busy: in_ready is low for K + 2 clocks. out_valid is one clock wide and out_data is overwritten by the next accepted division on the edge that samples it."
  - "W below 7 is not supported (the digit estimate takes bits W-1 down to W-7)."
  - "Reset drops results in flight; the data registers are not cleared (never read without a valid)."
requirements: [DIVHR-F-MODEL, DIVHR-F-RTL-EXH, DIVHR-F-RTL-RAND, DIVHR-F-LAT, DIVHR-F-LINT, DIVHR-F-MUTANT, DIVHR-F-FORMAL-LEMMA, DIVHR-F-FORMAL-REF, DIVHR-F-FORMAL-PAIR, DIVHR-F-LEAN-RECURRENCE, DIVHR-F-BUILD]
