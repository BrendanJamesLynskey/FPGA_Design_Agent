# divider_hr testplan, schema v1 (brief 116 format; brief 139c). The agent wrote every requirement below from the owner's request; none is agreed by a human (`spec_status: draft`).
# Status is never typed here: `python -m flow.trace_v1 write arith/divider_hr` computes it from the evidence files named in each item. Evidence is regenerated by the commands in `notes`.
schema: fpga-design-agent/testplan/v1
design: divider_hr
notes: 'Arithmetic library function divider_hr (brief 139c). Every requirement is a draft written by the agent from the owner''s request (spec_status: draft; only a human sets agreed). Evidence is generated
  by `python -m pytest arith/divider_hr/tests --junitxml=results/139c_arith/divider_hr_junit.xml` with ARITH_RECORD_DIR=results/139c_arith. The Lean items show ''statement not approved'': lean_approvals.yaml
  is a human''s. No Vivado run exists for this function (the build descriptions are prepared, not run), so there are no performance requirements.'
discover:
- glob: arith/divider_hr/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: DIVHR-F-MODEL
  kind: functional
  title: 'The model is the specification: it equals integer division, and the SRT recurrence converges'
  text: 'For the high-radix divider: quo and rem equal floor(a * 4**K / b) and a * 4**K - quo * b for every pair of normalised operands at W = 7 to 9 (K = 1, 3, 4), are the same pair as arith/divider (brief
    139b) at width W + 2K, the selection table is what an exact-fraction search over every divisor interval and estimate cell finds, and the carry-save and carry-propagate SRT recurrences assert |u| <=
    2b/3 after every step, the estimate error of 0 or 1 unit and the exactness of every step, for every pair at W = 7 and 8 (K = 1 to 4) and by random pairs to W = 64.'
  source: arith/divider_hr/spec.md#the-function
  spec_status: draft
- id: DIVHR-F-RTL-EXH
  kind: functional
  title: Every variant is bit-exact against the model, exhaustively at small widths
  text: 'Simulation (Icarus 14) of all three variants against the model: every pair of normalised operands at W = 7 (K = 1, 3, 4), W = 8 (K = 2, 4, 5) and W = 9 (K = 4, 5), with input gaps; quotient, remainder,
    order and latency checked.'
  source: arith/divider_hr/spec.md#the-function
  spec_status: draft
- id: DIVHR-F-RTL-RAND
  kind: functional
  title: Every variant is bit-exact against the model at large widths
  text: Simulation of all three variants against the model with 3000 random and boundary-ratio pairs (ratios near 1/2, 2/3, 1, 4/3, 5/3, 2) at W = 12, 16, 24, 32 and 48 (K = 6 to 24).
  source: arith/divider_hr/spec.md#the-function
  spec_status: draft
- id: DIVHR-F-LAT
  kind: functional
  title: Latency and throughput are what the spec states
  text: The measured latency equals the spec formula (K + 3 for the iterative variants, ceil((K + 1) / PIPE) + 1 for the pipeline) for PIPE = 1 to 7 at W = 8, K = 5, one result per clock for the pipeline.
  source: arith/divider_hr/spec.md#the-function
  spec_status: draft
- id: DIVHR-F-LINT
  kind: functional
  title: The RTL is Verilator -Wall clean
  text: Verilator -Wall --lint-only reports nothing for any variant at W = 7, 8, 16, 24, 32 and 64 (K = 1 to 32) with PIPE = 1, 3 and 40.
  source: arith/divider_hr/spec.md#the-function
  spec_status: draft
- id: DIVHR-F-MUTANT
  kind: functional
  title: The bench catches seeded faults
  text: 'Each of 32 seeded faults (one text change in the RTL, verif/mutants.yaml) makes the bench fail: killed/total = 32/32. One more mutant (E02, the Q-1 register''s initial value) and one (E01, the
    fix stage''s sign bit) are equivalent by arguments given in verif/mutants.yaml and are not counted.'
  source: arith/divider_hr/spec.md#the-function
  spec_status: draft
- id: DIVHR-F-FORMAL-LEMMA
  kind: functional
  title: The digit-recurrence step lemmas hold for all inputs (SymbiYosys)
  text: 'SymbiYosys with the slang front end, the combinational step lemmas of formal/divider_hr_lemma_fv.sv for ALL inputs at a fixed width (6 widths, W = 7 to 16): L1 the first digit is 0, 1 or 2 and
    leaves |a - q*b| <= 2b/3; L2 the carry-save step, for ANY two words whose sum is bounded, sums to 4u - q*b and is bounded; L3 the same for the carry-propagate step; L4 the on-the-fly conversion keeps
    QM = Q - 1; L5 the fix returns the remainder in [0, b) and the right quotient. With the induction on the number of steps (proved in Lean for every K, DIVHR-F-LEAN-RECURRENCE) these are the correctness
    argument of the recurrence at that width.'
  source: arith/divider_hr/spec.md#the-function
  spec_status: draft
- id: DIVHR-F-FORMAL-REF
  kind: functional
  title: Every variant equals an independent characterisation (SymbiYosys)
  text: 'SymbiYosys with the slang front end: a * 4**K = quo * b + rem with 0 <= rem < b, for all input sequences from reset, unbounded (abc pdr) at W = 7, K = 1 for all three variants (3 jobs), bounded
    at W = 7, K = 3 (3 jobs; nothing claimed beyond the depth). The unbounded proof does not finish at K = 2 for the pipeline (400 s): the nonlinear relation between the quotient and remainder registers
    is not found by abc pdr; the lemmas above and the exhaustive simulation cover the larger K.'
  source: arith/divider_hr/spec.md#the-function
  spec_status: draft
- id: DIVHR-F-FORMAL-PAIR
  kind: functional
  title: The carry-save and carry-propagate iterative variants agree (SymbiYosys)
  text: 'SymbiYosys with the slang front end, no reference involved: srt4_iter and srt4_cpa give the same in_ready, out_valid and out_data in every cycle: unbounded (abc pdr) at W = 7, K = 1 (1 job), bounded
    at W = 7, K = 3 (1 job).'
  source: arith/divider_hr/spec.md#the-function
  spec_status: draft
- id: DIVHR-F-LEAN-RECURRENCE
  kind: functional
  title: The SRT recurrence with any contained digit selection is a floor division for every K (Lean)
  text: For every number of digit steps K and every digit-selection rule that keeps the partial remainder bounded (|u| <= 2b/3, written 3|u| <= 2b), after K steps b * Q + U = 4**K * (b * q1 + u1) with U
    bounded, and the correction (Q - 1 and U + b when U < 0) is exactly floor(4**K * a / b) and 4**K * a mod b, with the remainder in [0, b). Proved in Lean, statements not approved; the digit-selection
    table's containment is NOT in Lean (it is an exact-fraction search in the model and the step lemmas above), and registers, widths, the carry-save form and the on-the-fly conversion are not modelled.
  source: arith/divider_hr/spec.md#verification-everything-before-vivado
  spec_status: draft
- id: DIVHR-F-BUILD
  kind: functional
  title: Out-of-context build descriptions are prepared for Artix-7 and K26 (not run)
  text: 'For every variant of the high-radix divider there is a build.yaml and an out-of-context clock constraint for xc7a100t and xck26, current against arith/tools/gen_build.py, consistent with the RTL
    (top, parameters, sources), with the expected primitive use evaluated for each point; the out-of-context wrapper lints clean and is functionally exact for the pipelined variant; the packaged verification
    harness (harness/run.py) passes on the library instance with every coverage bin hit (the eight divisor intervals among them). No Vivado run has been made: this requirement is about preparation, not
    about area, Fmax or power.'
  source: arith/divider_hr/spec.md#prepared-for-vivado-not-run
  spec_status: draft
