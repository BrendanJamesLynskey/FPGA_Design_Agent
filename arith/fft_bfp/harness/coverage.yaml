# Coverage targets of the block-floating-point FFT harness (arith brief 161): minimum numbers of events the stimulus must produce over a full run (--mode all). A bin with min_if is required only
# where that Python expression over the parameters p holds.
bins:
  - {name: frames, min: 40}
  - {name: forward_frames, min: 8}
  - {name: inverse_frames, min: 8}
  - {name: gap_zero, min: 4}
  - {name: gap_nonzero, min: 4}
  - {name: exp_negative, min: 2}
  - {name: exp_zero, min: 1}
  - {name: exp_positive, min: 4}
  - {name: exp_all_zero_frame, min: 1}
  - {name: saturated_or_extreme_word, min: 1}
