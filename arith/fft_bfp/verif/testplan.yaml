# fft_bfp testplan, schema v1 (brief 116) for the frequency-domain suite (brief 148). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_fft_bfp
notes: 'Frequency-domain suite, function fft_bfp (brief 148). Everything here is before Vivado: the model, the RTL variants, simulation, formal properties and the prepared out-of-context
  build files. No performance requirement on LUTs, DSPs, Fmax or power exists because none has been measured; the Vivado runs (build/<variant>/build.yaml, queued in _handoff/fpga_agent/vivado_later_queue.md)
  will add them. Every requirement is a draft written by the agent; none is agreed by a human. There are no Lean statements (the packaged harness of this function, in harness/, is evidenced
  by the harness item). Generated by arith/tools/gen_testplan_fft.py.'
discover:
- glob: arith/fft_bfp/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: FBFP-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/fft_bfp/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (NumPy's FFT (the value of every word times 2**exponent
    against the transform, within the stated bound, both variants, N = 8 to 1024, three input levels), a brute-force search for the smallest shift after which every part fits, and the
    identities of the order and of the inverse), and the conventions that a user could guess wrong (spec.md, last section) are pinned by examples.
  source: arith/fft_bfp/spec.md
  spec_status: draft
- id: FBFP-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (10 directed or exhaustive points, 6 random ones, across 2 variants), each variant''s outputs equal the model''s: the directed points
    drive impulses at every position and tones at every bin (small N), DC, Nyquist, a chirp and corner values, forward and inverse, back to back and after the shortest legal gap; the
    random points drive random frames with random direction and legal gaps up to N = 4096 (sdf) and 1024 (burst); the level frames drive all-zero, one-LSB, quiet and loud noise, loud
    and quiet tones, the most negative value and a frame whose rounding carries and saturates, so that every exponent range is visited. Each output frame, its exponent word included,
    equals the model bit for bit, the latency from in_sof to out_sof equals the formula, out_valid is N consecutive clocks and the exponent is the same on every word of a frame.'
  source: arith/fft_bfp/spec.md
  spec_status: draft
- id: FBFP-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (sdf: (1<<LOGN)-1+LOGN+((LOGN-1)//2)*(TWSTAGES+MULSTAGES+1)+(1<<LOGN)+2; burst: (1<<LOGN)+LOGN*((1<<LOGN)//2+MULSTAGES+3)+1+(1<<LOGN)+2),
    and the bench, run with a latency two clocks off, fails for every variant, so the passing runs prove the latency rather than assume it.'
  source: arith/fft_bfp/spec.md
  spec_status: draft
- id: FBFP-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each: an inverted condition, a wrong constant, a dropped connection, a wrong width) makes the cocotb bench
    fail, or is argued equivalent in the file''s header; mutants that survive or do not build are reported, never hidden.'
  source: arith/fft_bfp/verif/mutants.yaml
  spec_status: draft
- id: FBFP-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/fft_bfp/spec.yaml
  spec_status: draft
- id: FBFP-F-ACCURACY
  kind: functional
  title: Accuracy against NumPy is measured beside the scaled and unscaled modes, and the stated bound holds
  text: 'For both architectures, every N from 8 to 4096 and four input levels (0, -20, -40 and -60 dB of a full-scale noise-like frame), the error of the bit-exact model (which the RTL
    equals) against numpy.fft is recorded in verif/results/accuracy.json for the block-floating-point mode, the scaled mode and the unscaled mode (worst and rms error in the mode''s
    own output LSB, and the SQNR). The bound is: the error of every part is at most the unscaled core''s own worst error plus 2**exponent (the final rounding at the frame''s exponent);
    it holds at every recorded point. The recorded SQNR of the block-floating-point mode at full level is at least 80 dB, its worst error at full level at most 2 output LSB, and at -60
    dB its SQNR is at least 30 dB where the scaled mode''s is negative.'
  source: arith/fft_bfp/spec.md
  spec_status: draft
- id: FBFP-F-LEVELS
  kind: functional
  title: Every exponent range is visited and the exponent word is bit exact
  text: Frames of very different level (all zero, one LSB, noise at six amplitudes, a loud and a quiet tone, the most negative value, a frame whose bin 0 is 2**W - 1 so that the rounding
    carries and the word saturates) are sent through both architectures; each output frame and its exponent equal the model, the frames reach at least six different exponents, and the
    exponent is the same on every word of its frame and travels with the data when frames follow each other at different levels.
  source: arith/fft_bfp/spec.md
  spec_status: draft
- id: FBFP-F-BACKPRESSURE
  kind: functional
  title: The burst variant honours out_ready, even when both frame banks fill
  text: With out_ready low in 40 per cent of the clocks, and again in 92 per cent (reading a frame then takes longer than the core needs for the next, so both banks fill and the core
    must wait), the burst variant's frames, exponents and order equal the model, and out_valid, out_sof, the data and the exponent stay unchanged in every clock in which out_valid is
    high and out_ready low. The sdf variant ignores out_ready (stated).
  source: arith/fft_bfp/spec.md
  spec_status: draft
- id: FBFP-F-HARNESS
  kind: functional
  title: The packaged harness runs standalone, passes on the repository's variants and catches faults
  text: 'arith/fft_bfp/harness/ (model, bench, SystemVerilog checkers, coverage targets, standalone runner: owner decision 24) needs no other file of the repository. Run against each
    variant of this function with the checkers beside it, in every mode, it passes and meets every coverage target; against one planted fault (a mutant of verif/mutants.yaml), or with
    a latency two clocks off, it fails; its model, bench and checker files are the repository''s own, generated by arith/tools/gen_harness_fft.py, so they cannot drift.'
  source: arith/fft_bfp/harness/README.md
  spec_status: draft
