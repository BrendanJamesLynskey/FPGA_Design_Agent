- id: V-EXP-LATENCY
  requirements:
  - EXP-F-LAT
  method: sim_test
  title: The bench passes at the stated latency and fails two clocks off, for every variant
  evidence:
    file: arith/exp2/verif/results/pytest_junit.xml
    reader: junit
    tests:
