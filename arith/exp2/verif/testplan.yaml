# exp2 testplan, schema v1 (brief 116) for the arithmetic library (brief 139d). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_exp2
notes: 'Arithmetic library, function exp2 (brief 139d). Everything here is before Vivado: the model, the RTL variants, simulation, formal equivalence, Lean statements and the prepared
  out-of-context build files. No performance requirement exists because nothing about LUTs, DSPs, Fmax or power has been measured yet; the Vivado runs (build/<variant>/build.yaml) will
  add them. Every requirement is a draft written by the agent; none is agreed by a human. Lean statements are not approved. Generated by arith/tools/gen_testplan.py.'
discover:
- glob: arith/exp2/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: EXP-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/exp2/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (exact rational (Fraction) evaluations of the interpolation
    and Horner formulas, a floating-point hyperbolic CORDIC, and the maths library's 2**x) on every input at small widths and with Python's integer arithmetic on random large-width inputs,
    and the conventions that a user could guess wrong (spec.md, last section) are pinned by examples.
  source: arith/exp2/spec.md
  spec_status: draft
- id: EXP-F-EXACT
  kind: functional
  title: Every variant is bit-exact against its own model
  text: 'At every parameter point listed in spec.yaml (24 exhaustive points, 12 random ones, across 4 variants), each variant''s outputs equal its own model''s (model.py, selected by
    variant) in every clock: every input is driven at the small points; edge values, table break points and random inputs at the large ones. The variants round differently and are not
    bit-identical to each other; the model of each is the bit-exact definition of that variant, and its distance from the exact function is the accuracy requirement.'
  source: arith/exp2/spec.md
  spec_status: draft
- id: EXP-F-ACC
  kind: functional
  title: The error against the exact function is within the stated bound, at every listed point
  text: Each of the 12 accuracy points of spec.yaml states a bound in last places; the model's error against the exact function (the maths library, real arithmetic, unrounded) over EVERY
    input of that point is at most the bound and within 0.06 of it (so the bound is neither false nor loose). A point not listed has no stated bound.
  source: arith/exp2/spec.md
  spec_status: draft
- id: EXP-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (table: REG; lerp: 2; poly2: 3; cordic: NIT + 1), and the bench, run with a latency two clocks off, fails for
    every variant, so the passing runs prove the latency rather than assume it.'
  source: arith/exp2/spec.md
  spec_status: draft
- id: EXP-F-EQUIV
  kind: functional
  title: The error against the exact function is bounded for all inputs, by proof, at a small input width
  text: SymbiYosys with the slang front end compares each variant, delayed by its latency, with the exact function on 8 input bits to 24 fractional bits (a reference ROM written from
    the maths library, formal/*_ref.sv) and asserts the error stays within the bound of the job, which is the model's measured error at that point plus one unit for the reference's own
    rounding. A proof is by k-induction (for all inputs, any run length) at the widths in formal/jobs.yaml; wider points are covered by the exhaustive scan of the accuracy requirement
    and by simulation, not by proof. The quadrant map and the variants' structural identities are inside the checks.
  source: arith/exp2/formal/jobs.yaml
  spec_status: draft
- id: EXP-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each, in the variant''s RTL: an inverted condition, a wrong constant, a dropped connection, a lost reset)
    makes the cocotb bench fail; mutants that survive or do not build are reported, never hidden.'
  source: arith/exp2/verif/mutants.yaml
  spec_status: draft
- id: EXP-F-HARNESS
  kind: functional
  title: The packaged verification harness is a standalone deliverable that works
  text: arith/exp2/harness holds the model, the cocotb bench, a SystemVerilog checker, coverage targets and a runner that needs nothing else from the repository. Run standalone against
    every variant (one small exhaustive point and one large random point each, with the checker beside the instance) it passes and the random runs meet every coverage target; run against
    a planted fault it fails, with and without the checker. Its generated files are the repository's own bench, so they cannot drift.
  source: arith/exp2/harness/README.md
  spec_status: draft
- id: EXP-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/exp2/spec.yaml
  spec_status: draft
- id: EXP-F-LEAN-LERP
  kind: functional
  title: Linear interpolation stays between the segment's end values, for every width
  text: 'In a rising segment with break-point value c0 and slope s, the interpolated value (c0 * 2^D + s * d) / 2^D lies between c0 and c0 + s for every position d below 2^D and every
    D: the table variant cannot overshoot its segment. The statement is the specification and is NOT approved by a human (verif/lean_approvals.yaml is empty), so the proof is shown but
    not counted as verification. The Lean text is a hand transcription of the RTL''s structure; it models no timing or clocking.'
  source: arith/exp2/rtl/exp2_lerp.sv (the product, sum and shift lines of the interpolation)
  spec_status: draft
- id: EXP-F-LEAN-LERP-MONO
  kind: functional
  title: Linear interpolation does not fall as the position grows, for every width
  text: Within a segment of non-negative slope the interpolated value is non-decreasing in the position d, for every D, c0 and s. The statement is the specification and is NOT approved
    by a human (verif/lean_approvals.yaml is empty), so the proof is shown but not counted as verification. The Lean text is a hand transcription of the RTL's structure; it models no
    timing or clocking.
  source: arith/exp2/rtl/exp2_lerp.sv (the product, sum and shift lines of the interpolation)
  spec_status: draft
- id: EXP-F-LEAN-HYP
  kind: functional
  title: A hyperbolic CORDIC step scales x^2 - y^2 by a constant, for every width
  text: 'For every direction d = +-1 and every shift (scaled by u = 2^i), the step (u x + d y, u y + d x) multiplies x^2 - y^2 by exactly u^2 - 1, whatever the data: the hyperbolic gain
    is a data-independent constant. The statement is the specification and is NOT approved by a human (verif/lean_approvals.yaml is empty), so the proof is shown but not counted as verification.
    The Lean text is a hand transcription of the RTL''s structure; it models no timing or clocking.'
  source: arith/exp2/rtl/exp2_cordic.sv (the x and y adders of one stage)
  spec_status: draft
verification:
- id: V-EXP-MODEL
  requirements:
  - EXP-F-MODEL
  method: sim_test
  title: The model against independent formulations (exhaustive small, random large) and the pinned conventions
  evidence:
    file: arith/exp2/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_exp2_model::*
  checks:
  - arith/exp2/model.py
  - arith/tools/fxlib.py
- id: V-EXP-EXHAUSTIVE
  requirements:
  - EXP-F-EXACT
  method: sim_test
  title: Every variant against the model, every input, at the small points (Icarus + cocotb)
  evidence:
    file: arith/exp2/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_exp2_exhaustive_rtl::*
  checks:
  - arith/exp2/rtl/exp2_table.sv
  - arith/exp2/rtl/exp2_lerp.sv
  - arith/exp2/rtl/exp2_poly2.sv
  - arith/exp2/rtl/exp2_cordic.sv
  - arith/exp2/tests/exp2_cocotb.py
  - arith/exp2/model.py
  - arith/tools/fxlib.py
- id: V-EXP-RANDOM
