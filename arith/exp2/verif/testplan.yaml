    file: arith/exp2/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_exp2_random_rtl::*
  checks:
  - arith/exp2/rtl/exp2_table.sv
  - arith/exp2/rtl/exp2_lerp.sv
  - arith/exp2/rtl/exp2_poly2.sv
  - arith/exp2/rtl/exp2_cordic.sv
  - arith/exp2/tests/exp2_cocotb.py
  - arith/exp2/model.py
  - arith/tools/fxlib.py
- id: V-EXP-ACCURACY
