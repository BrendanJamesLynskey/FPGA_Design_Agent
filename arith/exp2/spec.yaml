# Machine-readable specification of the 2**x function (arith brief 139d). The prose is spec.md; the two agree (tests/test_exp2_package.py).
schema: fda-arith/spec/1
function: exp2
title: Base-2 exponential of a fraction, 2**x for x in [0, 1)
model: arith/exp2/model.py
summary: "y = 2**x for an unsigned IW-bit fraction x in [0, 1), the result as 1 + y / 2**OW (the leading one is implicit). Four implementations trade BRAM, DSP, LUTs, latency and accuracy: a direct table (exact to half a last place, at most 8 input bits), a segment table with linear interpolation (one DSP, about 2 to 4 last places at 16 bits), a segment table with a quadratic (two DSPs, about 0.6 last places) and a hyperbolic CORDIC (no DSP and no BRAM, a stage per iteration, about 1 last place). The general exp and 2**x for any x are this core plus a range reduction that the caller owns (see Integration)."
semantics:
  - "x is read as the fraction x / 2**IW in [0, 1); y is read as the fraction y / 2**OW in [0, 1); the function is 2**(x / 2**IW) = 1 + y / 2**OW"
  - "y is the variant's own arithmetic result rounded to nearest, ties upward, and clamped to [0, 2**OW - 1]; it is never wrapped"
  - "table: y = round(T[x] / 2**(20 - OW)) where T is a 256-entry table of the exact function with 20 fractional bits, read at x * 2**(8 - IW) (so IW <= 8)"
  - "lerp: the top SB bits of x pick a segment; with the table's value c0 and slope s1 (both 20 fractional bits, exact at the segment ends) and the position d in the segment (DB = IW - SB bits), y = round((c0 * 2**DB + s1 * d) / 2**(20 + DB - OW))"
  - "poly2: the same segments with a quadratic a0 + a1 t + a2 t**2 (t = d / 2**DB) fitted at the three Chebyshev nodes of the segment; Horner in integers: p1 = (a2 d) >> DB (floor), q = a1 + p1, y = round((q d + a0 * 2**DB) / 2**(20 + DB - OW))"
  - "cordic: z = round(x * ln 2) in units of 2**-(OW + G); NIT hyperbolic rotations (shifts 1, 2, 3, 4, 4, 5, ..., 13, 13, 14, ...; 4 and 13 are repeated) drive z to 0 starting from (x, y) = (1 / gain, 0); e**z = x + y; y = round((x + y - 1) / 2**G)"
  - "the four models differ in their rounding steps, so the variants are NOT bit-identical to each other; each variant is bit-exact against its own model (model.py) and within the stated error of the exact function"
ports:
  - {name: clk, dir: in, width: 1, text: "clock; unused by the combinational table configuration (REG = 0)"}
  - {name: x, dir: in, width: IW, text: "the argument, an unsigned fraction x / 2**IW in [0, 1)"}
  - {name: y, dir: out, width: OW, text: "the fractional part of the result: 2**x = 1 + y / 2**OW"}
parameters:
  IW: {min: 4, max: 16, text: "bits of x; table: at most 8; lerp and poly2: more than SB; cordic: IW + 20 > OW + G"}
  OW: {min: 4, max: 16, text: "bits of y (the result's fractional bits)"}
  REG: {values: [0, 1], text: "table only: 1 registers the output (latency 1), 0 is combinational"}
  SB: {min: 3, max: 6, text: "lerp (3 to 6) and poly2 (3 to 5): bits of x that select the segment, 2**SB segments"}
  NIT: {min: 4, max: 24, text: "cordic: iterations (stages), counting the two repeated ones"}
  G: {min: 1, max: 8, text: "cordic: guard bits below the last place of y; OW + G <= 24"}
signedness: "x and y are unsigned"
exactness: "not exact: every variant is within the error stated in 'Accuracy' of the exact 2**x, which includes the rounding of y; the table variant is within half a last place plus the table's own rounding of 2**-21 of the function (0.03 last places at OW = 16, 0.0005 at OW = 8); the others are bit-exact against their own model but not against each other"
latency_definition: "clocks from x being presented to y being valid: table REG, lerp 2, poly2 3, cordic NIT + 1; throughput is one result per clock in every variant"
accuracy: "Error is |y - 2**x ideal| in units of the last place of y (2**-OW), with the ideal 2**(x / 2**IW) - 1 taken in real arithmetic and not rounded, so a perfectly rounded result has error 0.5. The bound of each listed point is a measured maximum over every input of that point (python -m pytest arith/exp2/tests/test_exp2_accuracy.py), rounded up to 0.01. The error depends on the parameters: lerp falls with 4x per extra SB; poly2 and the table sit near 0.5 to 0.65 once SB and the coefficient precision (20 bits) allow; cordic falls with NIT and G until the rounding of the table constants (about 1 last place at OW = 16). A point not listed has no stated bound: measure it with model.max_error."
contract:
  protocol: "plain registered-or-combinational ports, no handshake: x is sampled every clock and one result leaves, with no valid, ready or backpressure. A caller that needs a valid bit delays its own valid by the variant's latency"
  throughput: "one result per clock in every variant (initiation interval 1)"
  latency: "per variant, in clocks: table REG (0 or 1), lerp 2, poly2 3, cordic NIT + 1"
  reset: "none: no control state; the pipelines hold data only and their outputs are meaningless for latency clocks after power-up"
  clock: "one clock, rising edge, no clock-enable and no gating; clk is present but unused when the latency is 0"
  stall: "none: the pipeline cannot be frozen (no enable)"
integration:
  port_timing: "x goes straight to a ROM address (table, lerp, poly2) or to a constant multiplier (cordic): register x in the caller if it comes from logic. y leaves a register (every variant but the table with REG = 0, and cordic whose output rounding is a short adder after the last stage). table with REG = 1 is a BRAM-friendly read: the ROM output register is the output register. lerp and poly2 put the ROM output in a register before the multiplier, so the DSP is fed by flip-flops"
  constraints: "no multicycle or false paths, one clock. DSP variants: keep the register stages un-merged so the DSP's AREG/BREG/MREG/PREG can absorb them (no keep or retiming that moves them). For a range other than [0, 1): exp(x) = 2**(x * log2 e); write x * log2 e = n + f with n an integer and f in [0, 1) (a constant multiplier and a split at the binary point), take 2**f from this core, and shift the result left by n after adding the implicit one back (1 + y / 2**OW); a negative n shifts right. That range reduction is the caller's: this core's contract stops at [0, 1)"
guess_wrong:
  - "the leading one is implicit: 2**x = 1 + y / 2**OW, so y has OW fraction bits and the true result has OW + 1 bits; with x = 0 the result is y = 0 meaning exactly 1"
  - "x is a fraction of one, not an integer: x = 2**(IW - 1) means 0.5 and the result 2**0.5 = 1.4142"
  - "the error is not 0.5 ulp for every variant: only the table variant (and poly2 at a good SB) is near it; lerp is several last places at 16 bits and cordic about 1; read the accuracy table of the variant before choosing"
  - "the variants are not bit-identical to each other (different rounding steps): switching variant changes the low bits of y, and a downstream check built on one variant's output will not hold bit for bit on another"
  - "x = 2**IW - 1 is the largest input and gives a result just below 2; the function does not wrap or saturate there, but y is clamped at 2**OW - 1 if rounding reaches it"
  - "table reads a 256-entry table whatever IW is (a narrower IW uses every 2**(8 - IW)-th entry), and IW above 8 is not supported by it; REG other than 0 or 1 behaves as 1"
  - "the parameter ranges (SB inside 3 to 6 for lerp and 3 to 5 for poly2, SB < IW, NIT 4 to 24, OW + G <= 24, IW + 20 > OW + G for cordic) are documented, not enforced by assertions: a value outside them gives wrong results without a message"
  - "no reset and no valid: for latency clocks after power-up the output is not meaningful; there is no clock-enable"

variants:
  table:
    file: rtl/exp2_table.sv
    module: exp2_table
    params: {IW: 8, OW: 12, REG: 1}
    throughput: "1 per clock"
    latency: "REG"
    tradeoff: "no DSP and no multiplier: a 256-entry ROM and one rounding adder; correctly rounded to within 2**-21 of half a last place; limited to 8 input bits, and the table does not shrink with a narrower IW (it only reads every k-th entry)"
    exhaustive_points: [{IW: 4, OW: 4, REG: 0}, {IW: 6, OW: 8, REG: 1}, {IW: 8, OW: 8, REG: 0}, {IW: 8, OW: 12, REG: 1}, {IW: 5, OW: 16, REG: 1}, {IW: 7, OW: 10, REG: 0}]
    random_points: [{IW: 8, OW: 16, REG: 1}, {IW: 8, OW: 12, REG: 0}, {IW: 7, OW: 15, REG: 1}]
    accuracy_points:
      - {params: {IW: 8, OW: 12, REG: 1}, bound_ulp: {y: 0.51}}
      - {params: {IW: 8, OW: 16, REG: 1}, bound_ulp: {y: 0.54}}
      - {params: {IW: 6, OW: 8, REG: 0}, bound_ulp: {y: 0.5}}
    expected_primitives:
      a7: "0 DSP; one 256 x 20 ROM: a 36 Kb BRAM (RAMB36E1 in 18 Kb mode, output register absorbed when REG = 1) or about 100 to 150 LUT6 as distributed ROM; one 21-bit rounding adder; OW FFs when REG = 1"
      k26: "0 DSP; as a7 with RAMB36E2 or LUT ROM; CARRY8 for the adder"
    ooc_points: [{IW: 8, OW: 12, REG: 1}, {IW: 8, OW: 16, REG: 1}, {IW: 8, OW: 10, REG: 0}]
    mutant_run: [{mode: exhaustive, params: {IW: 6, OW: 8, REG: 1}}, {mode: exhaustive, params: {IW: 8, OW: 12, REG: 0}}, {mode: randomised, params: {IW: 8, OW: 16, REG: 1}, n: 400}]
  lerp:
    file: rtl/exp2_lerp.sv
    module: exp2_lerp
    params: {IW: 12, OW: 12, SB: 5}
    throughput: "1 per clock"
    latency: "2"
    tradeoff: "one DSP for slope times position and a small coefficient ROM (2**SB entries): the cheapest of the interpolating variants; error falls 4x per extra SB (about 2.4 last places at IW = OW = 16 and SB = 6)"
    exhaustive_points: [{IW: 7, OW: 7, SB: 3}, {IW: 8, OW: 8, SB: 6}, {IW: 9, OW: 10, SB: 4}, {IW: 10, OW: 12, SB: 5}, {IW: 12, OW: 12, SB: 6}, {IW: 12, OW: 16, SB: 3}, {IW: 5, OW: 8, SB: 4}]
    random_points: [{IW: 16, OW: 16, SB: 6}, {IW: 16, OW: 16, SB: 3}, {IW: 14, OW: 13, SB: 5}]
    accuracy_points:
      - {params: {IW: 12, OW: 12, SB: 5}, bound_ulp: {y: 0.95}}
      - {params: {IW: 16, OW: 16, SB: 6}, bound_ulp: {y: 2.43}}
      - {params: {IW: 14, OW: 13, SB: 5}, bound_ulp: {y: 1.44}}
    expected_primitives:
      a7: "1 DSP48E1 (22 x (IW - SB + 1) signed multiply-add); the 2**SB x 44-bit coefficient ROM in distributed RAM (a few dozen LUTs for SB <= 5; possibly a BRAM at SB = 6); about 3 x 22 FFs for the two stages (some absorbed by the DSP)"
      k26: "1 DSP48E2; as a7"
    ooc_points: [{IW: 12, OW: 12, SB: 5}, {IW: 16, OW: 16, SB: 6}, {IW: 16, OW: 14, SB: 4}]
    mutant_run: [{mode: exhaustive, params: {IW: 9, OW: 10, SB: 4}}, {mode: exhaustive, params: {IW: 12, OW: 12, SB: 6}}, {mode: randomised, params: {IW: 16, OW: 16, SB: 5}, n: 400}]
  poly2:
    file: rtl/exp2_poly2.sv
    module: exp2_poly2
    params: {IW: 12, OW: 12, SB: 4}
    throughput: "1 per clock"
    latency: "3"
    tradeoff: "two DSPs in a Horner chain and the smallest segment count for one accuracy: near half a last place already at 16 segments, but one more DSP and one more clock than lerp, and a larger coefficient word per segment"
    exhaustive_points: [{IW: 7, OW: 7, SB: 3}, {IW: 8, OW: 8, SB: 5}, {IW: 9, OW: 10, SB: 4}, {IW: 12, OW: 12, SB: 3}, {IW: 12, OW: 16, SB: 5}, {IW: 5, OW: 8, SB: 4}]
    random_points: [{IW: 16, OW: 16, SB: 5}, {IW: 16, OW: 16, SB: 3}, {IW: 14, OW: 13, SB: 4}]
    accuracy_points:
      - {params: {IW: 12, OW: 12, SB: 4}, bound_ulp: {y: 0.51}}
      - {params: {IW: 16, OW: 16, SB: 5}, bound_ulp: {y: 0.6}}
      - {params: {IW: 14, OW: 13, SB: 4}, bound_ulp: {y: 0.52}}
    expected_primitives:
      a7: "2 DSP48E1 (22 x DB then 24 x DB signed multiplies); a 2**SB x 66-bit coefficient ROM in distributed RAM (SB <= 5); about 3 x 24 FFs of stage registers (some absorbed by the DSPs)"
      k26: "2 DSP48E2; as a7"
    ooc_points: [{IW: 12, OW: 12, SB: 4}, {IW: 16, OW: 16, SB: 5}, {IW: 16, OW: 14, SB: 3}]
    mutant_run: [{mode: exhaustive, params: {IW: 9, OW: 10, SB: 4}}, {mode: exhaustive, params: {IW: 12, OW: 12, SB: 3}}, {mode: randomised, params: {IW: 16, OW: 16, SB: 5}, n: 400}]
  cordic:
    file: rtl/exp2_cordic.sv
    module: exp2_cordic
    params: {IW: 12, OW: 12, NIT: 16, G: 5}
    throughput: "1 per clock"
    latency: "NIT + 1"
    tradeoff: "no DSP and no BRAM beyond a constant multiplier, in carry chains only: the only variant whose cost scales with the accuracy wanted (one stage per bit), at the price of a latency of NIT + 1 clocks and about 3 adders and 2 x (OW + G + 3) FFs per stage"
    exhaustive_points: [{IW: 6, OW: 8, NIT: 10, G: 3}, {IW: 8, OW: 10, NIT: 12, G: 4}, {IW: 4, OW: 6, NIT: 5, G: 2}, {IW: 12, OW: 12, NIT: 14, G: 5}, {IW: 10, OW: 12, NIT: 16, G: 5}]
    random_points: [{IW: 16, OW: 16, NIT: 20, G: 6}, {IW: 16, OW: 12, NIT: 16, G: 5}, {IW: 14, OW: 14, NIT: 24, G: 8}]
    accuracy_points:
      - {params: {IW: 12, OW: 12, NIT: 16, G: 5}, bound_ulp: {y: 1.14}}
      - {params: {IW: 16, OW: 16, NIT: 20, G: 6}, bound_ulp: {y: 1.07}}
      - {params: {IW: 14, OW: 14, NIT: 24, G: 8}, bound_ulp: {y: 0.55}}
    expected_primitives:
      a7: "0 BRAM; the x * ln 2 constant multiplier (IW x 21 bits: LUT adders or 1 to 2 DSP48E1); per stage 3 add/subtract (about OW + G + 3 LUTs each in carry chains) and 3 registers of OW + G + 3, OW + G + 3 and OW + G + 2 bits; about 3 x NIT x (OW + G + 3) LUTs in total"
      k26: "as a7 with CARRY8 chains"
    ooc_points: [{IW: 12, OW: 12, NIT: 16, G: 5}, {IW: 16, OW: 16, NIT: 20, G: 6}, {IW: 16, OW: 16, NIT: 24, G: 8}]
    mutant_run: [{mode: exhaustive, params: {IW: 8, OW: 10, NIT: 12, G: 4}}, {mode: exhaustive, params: {IW: 12, OW: 12, NIT: 14, G: 5}}, {mode: randomised, params: {IW: 16, OW: 16, NIT: 20, G: 6}, n: 400}]
