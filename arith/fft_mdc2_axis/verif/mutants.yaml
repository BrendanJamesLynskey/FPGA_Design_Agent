# Mutation set for fft_mdc2_axis (arith brief 168; tools/run_mutants.py): each mutant replaces `old` (exactly once) by `new` in a copy of the file it names (the variant's own file, or `file`,
# relative to this function's folder, for a mutant of a shared file). Generated by arith/tools/gen_mutants_fft.py: edit that list, not this file. Mutants left out as equivalent are listed in
# the lines below.
# Left out as equivalent: `win <= s_last` as `win <= 1'b1` in fft_mdc2_axis_ctl (window_flag_always): the window flag is read only in the clock after a transfer; inside a frame no clock passes without a transfer, so the flag set by a non-last beat is cleared by the next transfer before it is read. Run: it survives all six benches
# Left out as equivalent: `full[rb] <= 1'b0` as `full[wb] <= 1'b0` in fft_bfp_out_pair (full_clear_other): the read bank's flag stays set, but the reader only arrives at a bank with a stale flag when the previous read ended with the write pointer on that bank (no finished frame beyond it), and that same read clears the flag of the write bank. A stale flag can only be seen by the reader if the bank holds no finished frame, and then it was just cleared. Run: it survives all benches including `stress` (80 frames at NB 2 to 4, LOGN 4 and 5, random idles and random stalls) and `drain`; not proved
