# fft_mdc2_axis testplan, schema v1 (brief 116) for the frequency-domain suite (brief 148). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_fft_mdc2_axis
notes: 'Frequency-domain suite, function fft_mdc2_axis (brief 148). Everything here is before Vivado: the model, the RTL variants, simulation, formal properties and the prepared out-of-context
  build files. No performance requirement on LUTs, DSPs, Fmax or power exists because none has been measured; the Vivado runs (build/<variant>/build.yaml, queued in _handoff/fpga_agent/vivado_later_queue.md)
  will add them. Every requirement is a draft written by the agent; none is agreed by a human. There are no Lean statements and no packaged harness for this suite (stated in the report).
  Generated by arith/tools/gen_testplan_fft.py.'
discover:
- glob: arith/fft_mdc2_axis/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: FMAXIS-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/fft_mdc2_axis/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (the 2-parallel core's own model (arith/fft_common/fft_ref.py
    mdc2_frame at SCALE = 0), the block-floating-point rule shared with arith/fft_bfp (a brute-force exponent search is in that function's tests), and the packing of the AXI words (sample
    0 in the low half, real part in the low half of a sample)), and the conventions that a user could guess wrong (spec.md, last section) are pinned by examples.
  source: arith/fft_mdc2_axis/spec.md
  spec_status: draft
- id: FMAXIS-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (5 directed or exhaustive points, 3 random ones, across 1 variants), each variant''s outputs equal the model''s: the directed points
    send the bench''s frames (impulses, tones, DC, Nyquist, a chirp, corner values, and frames whose largest part is 2**m - 1 so that the normalisation saturates), forward and inverse,
    from a source that never pauses into a sink that is always ready: every output frame equals the model bit for bit, the exponent on tuser equals the model''s on every beat, the first-beat
    latency equals the formula, the idle clocks between frames are 0 or at least N/8, and the frame period equals N/2 when NB * N/2 >= latency + N/2; the random points send random frames
    with random idle clocks (including 1 to N/8 - 1, which the wrapper must turn into a legal gap) into a sink that is always ready and into one with random tready.'
  source: arith/fft_mdc2_axis/spec.md
  spec_status: draft
- id: FMAXIS-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (par2: (1<<LOGN)//2-1+(LOGN-1)+((LOGN-2)//2)*(TWSTAGES+MULSTAGES+1)+TWSTAGES+MULSTAGES+2+(1<<LOGN)//2+2), and
    the bench, run with a latency two clocks off, fails for every variant, so the passing runs prove the latency rather than assume it.'
  source: arith/fft_mdc2_axis/spec.md
  spec_status: draft
- id: FMAXIS-F-EQUIV
  kind: functional
  title: The properties named in formal/jobs.yaml hold, by proof where the tools allow
  text: 'SymbiYosys with the slang front end checks the properties of formal/jobs.yaml: a proof is by k-induction (for all inputs, any run length) at the parameters listed there, a bounded
    check holds only to its stated depth. What the jobs say is in each job''s `claim`; parameters beyond the listed ones are covered by simulation, not by proof.'
  source: arith/fft_mdc2_axis/formal/jobs.yaml
  spec_status: draft
- id: FMAXIS-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each: an inverted condition, a wrong constant, a dropped connection, a wrong width) makes the cocotb bench
    fail, or is argued equivalent in the file''s header; mutants that survive or do not build are reported, never hidden.'
  source: arith/fft_mdc2_axis/verif/mutants.yaml
  spec_status: draft
- id: FMAXIS-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/fft_mdc2_axis/spec.yaml
  spec_status: draft
- id: FMAXIS-F-AXIS
  kind: interface
  title: The AXI4-Stream rules hold on both streams, also with a sink that stalls, and the checkers can fail
  text: 'On both streams the wrapper''s SystemVerilog protocol checkers (fft_common/axis_checker.sv: valid stays high until accepted, tdata, tuser and tlast stable while stalled, no
    unknowns after reset, tlast on every (N/2)-th beat, no pause inside an input frame) count zero violations in every run of the directed, random, back-pressure and gap benches, including
    random tready and a sink that holds tready low for three frame times; the checker bench shows that a pause inside a frame and a withdrawn tvalid are counted.'
  source: arith/fft_mdc2_axis/spec.md
  spec_status: draft
- id: FMAXIS-F-GAP
  kind: interface
  title: Whatever the source does, the core sees 0 or at least N/8 idle clocks between frames, and nothing is lost to the output store
  text: After every beat with tlast s_axis_tready is high for one clock (a frame may follow with no idle clock) and, when no beat is transferred in it, low for N/8 - 1 clocks; the bench
    measures the idle clocks between every pair of frames under source idles of 0, 1 .. N/8 + 1 clocks and requires 0 or at least N/8, and exactly max(source idle, N/8) for a source
    idle of 1 or more. At a frame start s_axis_tready is low while NB frames are in the block, so with a sink that stalls for three frame times no frame is lost or altered (every output
    frame equals the model). With NB * N/2 >= latency + N/2 and a ready sink the frame period is N/2.
  source: arith/fft_mdc2_axis/spec.md
  spec_status: draft
- id: FMAXIS-F-EXPONENT
  kind: functional
  title: The block exponent is on tuser from the first beat and the words are normalised to W bits
  text: 'Every output frame''s m_axis_tuser equals the model''s exponent on every beat (the first beat is the contract), and every output part equals the model''s normalised word: including
    frames whose largest part makes the rounding carry (saturation), frames of very different level back to back (so the exponent of one frame never leaks into the next), and the inverse
    transform.'
  source: arith/fft_mdc2_axis/spec.md
  spec_status: draft
