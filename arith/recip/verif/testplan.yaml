# recip testplan, schema v1 (brief 116 format; brief 139c). The agent wrote every requirement below from the owner's request; none is agreed by a human (`spec_status: draft`).
# Status is never typed here: `python -m flow.trace_v1 write arith/recip` computes it from the evidence files named in each item. Evidence is regenerated by the commands in `notes`.
schema: fpga-design-agent/testplan/v1
design: recip
notes: 'Arithmetic library function recip (brief 139c). Every requirement is a draft written by the agent from the owner''s request (spec_status: draft; only a human sets agreed). Evidence is generated
  by `python -m pytest arith/recip/tests --junitxml=results/139c_arith/recip_junit.xml` with ARITH_RECORD_DIR=results/139c_arith. The Lean items show ''statement not approved'': lean_approvals.yaml is a
  human''s. No Vivado run exists for this function (the build descriptions are prepared, not run), so there are no performance requirements.'
discover:
- glob: arith/recip/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: RECIP-F-MODEL
  kind: functional
  title: 'The model is the specification: the error of every variant is within the stated bound'
  text: 'For the reciprocal: every variant''s error (exact value minus result, in units of the last place, by exact rational arithmetic) is within the spec''s bound over every normalised input at W = 8
    to 12 for every A from 2 to W - 2, at W = 16 for A = 7 and 8, and over sampled inputs to W = 32; the Newton variants never exceed the exact value; the residual word never overflows its width (asserted
    at every step); the seed table entry is the nearest integer to the midpoint reciprocal.'
  source: arith/recip/spec.md#the-function
  spec_status: draft
- id: RECIP-F-RTL-EXH
  kind: functional
  title: Every variant is bit-exact against the model, for every input at small widths
  text: 'Simulation (Icarus 14) of all three variants against the model: every normalised b at W = 8 to 14 with several A (every A at W = 8 and 9), with input gaps; value, order and latency checked.'
  source: arith/recip/spec.md#the-function
  spec_status: draft
- id: RECIP-F-RTL-RAND
  kind: functional
  title: Every variant is bit-exact against the model at large widths
  text: Simulation of all three variants against the model with 3000 random and seed-table-boundary inputs at W = 16, 20, 24 and 32.
  source: arith/recip/spec.md#the-function
  spec_status: draft
- id: RECIP-F-LAT
  kind: functional
  title: Latency and throughput are what the spec states
  text: The measured latency equals the spec (1, 5 and 9 clocks for table, nr1, nr2), one result per clock, with back-to-back inputs at W = 10.
  source: arith/recip/spec.md#the-function
  spec_status: draft
- id: RECIP-F-LINT
  kind: functional
  title: The RTL is Verilator -Wall clean
  text: Verilator -Wall --lint-only reports nothing for any variant at W = 8, 10, 16, 24 and 32 (A = 3 to 10).
  source: arith/recip/spec.md#the-function
  spec_status: draft
- id: RECIP-F-MUTANT
  kind: functional
  title: The bench catches seeded faults
  text: 'Each of 13 seeded faults (one text change in the RTL, verif/mutants.yaml) makes the bench fail: killed/total = 13/13. Two more mutants (E01, E02: the residual''s reference value and shift type)
    are equivalent by arguments given in verif/mutants.yaml and are not counted.'
  source: arith/recip/spec.md#the-function
  spec_status: draft
- id: RECIP-F-FORMAL-BOUND
  kind: functional
  title: Every variant meets its error bound for all input sequences (SymbiYosys)
  text: 'SymbiYosys with the slang front end: each variant''s result y satisfies the error characterisation (two products, no shared code with the RTL) for all input sequences from reset, proved by k-induction
    at an induction depth above the latency (the datapath is a feed-forward pipeline): 8 jobs (table, nr1, nr2 at W = 8, 10, 12). 7 faults or an over-tight bound make the proof fail (bounded model checking),
    which shows the harness is not vacuous. Not proved for other widths.'
  source: arith/recip/spec.md#the-function
  spec_status: draft
- id: RECIP-F-LEAN-NEWTON
  kind: functional
  title: The exact Newton reciprocal step squares the residual and never overshoots (Lean)
  text: 'For all integers S (the scale of 1.0), b and y: S*S - b*(y*(2S - b*y)) = (S - b*y)**2, hence b*y1 <= S*S: the exact Newton-Raphson reciprocal step squares the relative error and never exceeds the
    exact reciprocal. Proved in Lean, statements not approved; the truncations of the RTL (floor at every shift, two guard bits) and the seed table''s accuracy are not in Lean (they are measured and proved
    at fixed widths by SymbiYosys).'
  source: arith/recip/spec.md#verification-everything-before-vivado
  spec_status: draft
- id: RECIP-F-BUILD
  kind: functional
  title: Out-of-context build descriptions are prepared for Artix-7 and K26 (not run)
  text: 'For every variant of the reciprocal there is a build.yaml and an out-of-context clock constraint for xc7a100t and xck26, current against arith/tools/gen_build.py, consistent with the RTL (top,
    parameters, sources), with the expected primitive use evaluated for each point; the out-of-context wrapper lints clean and is functionally exact for every variant; the packaged verification harness
    (harness/run.py) passes on the library instance with every coverage bin hit. No Vivado run has been made: this requirement is about preparation, not about area, Fmax or power.'
  source: arith/recip/spec.md#prepared-for-vivado-not-run
  spec_status: draft
