# Coverage targets of the fast-convolution harness (arith brief 161): minimum numbers of events the stimulus must produce over a full run (--mode all).
bins:
  - {name: blocks, min: 8}
  - {name: filter_loaded, min: 1}
  - {name: filter_reloaded, min: 1}
  - {name: zero_filter_block, min: 1}
  - {name: stalled_source, min: 1}
  - {name: stalled_sink, min: 1}
  - {name: saturated_outputs, min: 1}
  - {name: axil_unmapped, min: 1}
  - {name: axil_readonly_write, min: 1}
  - {name: axil_partial_strobe, min: 1}
  - {name: axil_refused_commit, min: 1}
  - {name: axil_autoincrement_wrap, min: 1}
  - {name: axil_status_w1c, min: 1}
  - {name: axil_order_variants, min: 1}
