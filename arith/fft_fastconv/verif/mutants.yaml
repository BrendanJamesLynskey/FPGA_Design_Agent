# Mutation set for fft_fastconv (arith brief 161; tools/run_mutants.py): each mutant replaces `old` (exactly once) by `new` in a copy of the file it names (the variant's own file, or `file`,
# relative to this function's folder, for a mutant of a shared file). Generated by arith/tools/gen_mutants_fft.py: edit that list, not this file. Mutants left out as equivalent are listed in
# the lines below.
# Left out as equivalent: `fcnt == N - 2` instead of `N - 1` as the last feed clock (the block is fed one word short): the FFT pipelines take their data every clock whatever in_valid says (in_valid and in_sof only mark the start of the frame), and the ring read address keeps following fcnt, so the last word reaches the transform in the clock in which it would have been presented; only the valid flag of that clock differs, and nothing uses it
# Left out as equivalent: `wr_ptr <= 0` instead of `LOGN'(L - 1)` at the end of the clear: the ring is cleared everywhere, so starting the first block at position 0 (and feeding it from position B) presents the same L - 1 zeros followed by the same B samples, only rotated in memory; every later block starts at the pointer the same way
# Left out as equivalent: `hmem[qcnt]` instead of `hmem[qpos]` (qpos = 0 at the first word of a frame): qcnt wraps to 0 after N words, so for the whole frames the forward FFT delivers it equals qpos
# Left out as equivalent: the same-clock priority of a write-1-to-clear of SAT against the datapath's SAT pulse (`!sat_pulse` in the clear): a clear that loses to a pulse in the same clock cannot be arranged by a bench that sees only whole-clock behaviour; it is stated in the contract and covered by formal/jobs.yaml
mutants:
- {class: connection, name: feed_start_address, new: 'ra            = fcnt[LOGN-1:0];', old: 'ra            = wr_ptr + fcnt[LOGN-1:0];', variant: os, why: 'the block is fed from ring position 0, not from its start'}
- {class: constant, name: collect_one_more, new: if (ccnt == (LOGN + 1)'(B)) begin, old: if (ccnt == (LOGN + 1)'(B - 1)) begin, variant: os, why: a block collects B + 1 samples}
- {class: connection, name: credit_ignored, new: feed_start    = (state == S_WAIT);, old: feed_start    = (state == S_WAIT) && (credit >= (LOGN + 1)'(B));, variant: os, why: a block starts although the output FIFO may lack room for its results}
- {class: connection, name: sof_always, new: sof_r <= 1'b1;, old: sof_r <= (fcnt == '0);, variant: os, why: every fed word is a start of frame}
- {class: connection, name: ring_write_swapped, new: 'else if (in_xfer) ring[wr_ptr] <= {s_axis_tdata[W-1:0], s_axis_tdata[2*W-1:W]};', old: 'else if (in_xfer) ring[wr_ptr] <= s_axis_tdata;', variant: os, why: real and imaginary parts exchanged on the way into the ring}
- {class: connection, name: inverse_is_forward, new: '.in_inverse(1''b0), .in_re(xr)', old: '.in_inverse(1''b1), .in_re(xr)', variant: os, why: the second transform is a forward one}
- {class: constant, name: forward_bit_reversed, new: '.SCALE(0), .RND(RND), .ORDER(1), .CMUL(CMUL), .TWSTAGES(TWSTAGES), .MULSTAGES(MULSTAGES)) u_fwd', old: '.SCALE(0), .RND(RND), .ORDER(0), .CMUL(CMUL), .TWSTAGES(TWSTAGES), .MULSTAGES(MULSTAGES)) u_fwd', variant: os, why: the forward transform emits bit-reversed order but the filter is in natural order}
- {class: constant, name: inverse_unscaled, new: '.SCALE(0), .RND(RND), .ORDER(0), .CMUL(CMUL), .TWSTAGES(TWSTAGES), .MULSTAGES(MULSTAGES)) u_inv', old: '.SCALE(1), .RND(RND), .ORDER(0), .CMUL(CMUL), .TWSTAGES(TWSTAGES), .MULSTAGES(MULSTAGES)) u_inv', variant: os, why: the inverse transform is not scaled by 1/N}
- {class: constant, name: product_round_quarter, new: 'rr = (RND != 0) ? (sr + (WP)''(1 << (FH - 2))) >>> FH : sr >>> FH;', old: 'rr = (RND != 0) ? (sr + (WP)''(1 << (FH - 1))) >>> FH : sr >>> FH;', variant: os, why: the spectral product's rounding constant is a quarter instead of a half}
