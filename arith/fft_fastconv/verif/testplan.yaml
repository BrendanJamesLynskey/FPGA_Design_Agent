# fft_fastconv testplan, schema v1 (brief 116) for the frequency-domain suite (brief 148). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_fft_fastconv
notes: 'Frequency-domain suite, function fft_fastconv (brief 148). Everything here is before Vivado: the model, the RTL variants, simulation, formal properties and the prepared out-of-context
  build files. No performance requirement on LUTs, DSPs, Fmax or power exists because none has been measured; the Vivado runs (build/<variant>/build.yaml, queued in _handoff/fpga_agent/vivado_later_queue.md)
  will add them. Every requirement is a draft written by the agent; none is agreed by a human. There are no Lean statements (the packaged harness of this function, in harness/, is evidenced
  by the harness item). Generated by arith/tools/gen_testplan_fft.py.'
discover:
- glob: arith/fft_fastconv/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: FFC-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/fft_fastconv/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (numpy.convolve of the same samples and the unquantised
    taps (the overlap-save identity, within the stated bound), the bit-exact FFT models it is built from, and the overlap-save and overlap-add models of arith/fft_common/fastconv.py),
    and the conventions that a user could guess wrong (spec.md, last section) are pinned by examples.
  source: arith/fft_fastconv/spec.md
  spec_status: draft
- id: FFC-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (5 directed or exhaustive points, 3 random ones, across 1 variants), each variant''s outputs equal the model''s: the directed points
    drive the register defaults, a zero filter (zero output), a filter loaded through the registers and a random stream through it with random stalls on both streams; the random points
    use random taps, random streams with random stalls, register traffic while the stream runs and a new filter after the stream drains. The whole output stream equals the model bit
    for bit (no sample lost, added or reordered), the latency from the last input beat of the first block to its first output beat equals the formula, and the three protocol checkers
    count no error.'
  source: arith/fft_fastconv/spec.md
  spec_status: draft
- id: FFC-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (os: 2*(2*(1<<LOGN)+LOGN+((LOGN-1)//2)*(TWSTAGES+MULSTAGES+1))+MULSTAGES+L+7), and the bench, run with a latency
    two clocks off, fails for every variant, so the passing runs prove the latency rather than assume it.'
  source: arith/fft_fastconv/spec.md
  spec_status: draft
- id: FFC-F-EQUIV
  kind: functional
  title: The properties named in formal/jobs.yaml hold, by proof where the tools allow
  text: 'SymbiYosys with the slang front end checks the properties of formal/jobs.yaml: a proof is by k-induction (for all inputs, any run length) at the parameters listed there, a bounded
    check holds only to its stated depth. What the jobs say is in each job''s `claim`; parameters beyond the listed ones are covered by simulation, not by proof.'
  source: arith/fft_fastconv/formal/jobs.yaml
  spec_status: draft
- id: FFC-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each: an inverted condition, a wrong constant, a dropped connection, a wrong width) makes the cocotb bench
    fail, or is argued equivalent in the file''s header; mutants that survive or do not build are reported, never hidden.'
  source: arith/fft_fastconv/verif/mutants.yaml
  spec_status: draft
- id: FFC-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/fft_fastconv/spec.yaml
  spec_status: draft
- id: FFC-F-AXIL
  kind: interface
  title: The AXI4-Lite register file follows the contract's register map and response rules
  text: The ID, CFG0 and CFG1 registers read their documented values; read-only and unmapped addresses answer SLVERR and change nothing; byte address bits [1:0] are ignored; writes with
    partial strobes are refused with SLVERR and no effect; COEF_ADDR masks its upper bits and wraps; the staging registers read back sign-extended; a commit auto-increments COEF_ADDR
    and wraps at the last bin; a commit while BUSY (during the clear after reset, and while a block is in flight) is refused with SLVERR, sets DROPPED, does not advance COEF_ADDR and
    changes nothing; DROPPED and SAT are cleared by writing 1; reads have no side effects; address and data may arrive in either order and the response channels may wait. The AXI4-Lite
    protocol checker (fft_common/axil_checker.sv) counts no violation. The handshake rules and the response of every executed write are also checked by bounded model checks (formal/jobs.yaml)
    against shadow state.
  source: arith/fft_fastconv/spec.md
  spec_status: draft
- id: FFC-F-SAT
  kind: functional
  title: Output saturation is exact and reported
  text: With a filter of gain 2**GB and a loud input the output parts that leave the W-bit range are clamped to the nearest end exactly as the model says, STATUS.SAT is set, and it is
    cleared by writing 1 to it.
  source: arith/fft_fastconv/spec.md
  spec_status: draft
- id: FFC-F-AXIS
  kind: interface
  title: The AXI4-Stream rules hold on both streams under random stalls
  text: 'The checkers on s_axis and m_axis (valid stays high until accepted, tdata stable while stalled, no unknowns after reset) count no violation while both streams stall at random,
    including a sink so slow that the block controller must wait for output room: no sample is lost, added or reordered. A mutant that makes tvalid depend on tready is killed.'
  source: arith/fft_fastconv/spec.md
  spec_status: draft
- id: FFC-F-ACCURACY
  kind: functional
  title: The filter output equals numpy.convolve within a stated error
  text: 'For N = 64 to 4096, L from N/8 + 1 to 3N/4 + 1 taps (low-pass, random and delta filters of absolute gain at most 2**GB) and a random complex stream, the output of the model
    (which the RTL equals bit for bit) differs from numpy.convolve of the same samples and the unquantised taps by at most the recorded error (verif/results/accuracy.json: worst and
    rms error in output LSB, SQNR) at W = 16, TW = 18, WH = 24, FH = 14; the test enforces a worst error of at most 8 LSB.'
  source: arith/fft_fastconv/spec.md
  spec_status: draft
- id: FFC-F-HARNESS
  kind: functional
  title: The packaged harness runs standalone, passes on the repository's variants and catches faults
  text: 'arith/fft_fastconv/harness/ (model, bench, SystemVerilog checkers, coverage targets, standalone runner: owner decision 24) needs no other file of the repository. Run against
    each variant of this function with the checkers beside it, in every mode, it passes and meets every coverage target; against one planted fault (a mutant of verif/mutants.yaml), or
    with a latency two clocks off, it fails; its model, bench and checker files are the repository''s own, generated by arith/tools/gen_harness_fft.py, so they cannot drift.'
  source: arith/fft_fastconv/harness/README.md
  spec_status: draft
