# Formal jobs of the fast-convolution block (arith brief 161; tools/run_formal.py): bounded model checks of the AXI4-Lite register file from reset; the datapath is checked by simulation only.
jobs:
- {claim: 'the register file''s handshakes, responses, register map and commit rules (HB, ONE, RESP, RID, RUNM, COMMIT, DROP, SATP in the fv top) hold for every master that obeys the AXI4-Lite master rules and every busy and sat_pulse sequence, bounded to 26 clocks from reset', depth: 26, mode: bmc, name: axil_n16_wh12, params: {FH: 8, GB: 1, L: 9, LOGN: 4, W: 8, WH: 12}, sources: [formal/fft_fastconv_axil_fv.sv, rtl/fft_fastconv_axil.sv], top: fft_fastconv_axil_fv}
- {claim: 'the same, at LOGN 5, WH 16, bounded to 26 clocks from reset', depth: 26, mode: bmc, name: axil_n32_wh16, params: {FH: 12, GB: 2, L: 17, LOGN: 5, W: 16, WH: 16}, sources: [formal/fft_fastconv_axil_fv.sv, rtl/fft_fastconv_axil.sv], top: fft_fastconv_axil_fv}
