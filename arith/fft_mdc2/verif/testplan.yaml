# fft_mdc2 testplan, schema v1 (brief 116) for the frequency-domain suite (brief 148). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_fft_mdc2
notes: 'Frequency-domain suite, function fft_mdc2 (brief 148). Everything here is before Vivado: the model, the RTL variants, simulation, formal properties and the prepared out-of-context
  build files. No performance requirement on LUTs, DSPs, Fmax or power exists because none has been measured; the Vivado runs (build/<variant>/build.yaml, queued in _handoff/fpga_agent/vivado_later_queue.md)
  will add them. Every requirement is a draft written by the agent; none is agreed by a human. There are no Lean statements (the packaged harness of this function, in harness/, is evidenced
  by the harness item). Generated by arith/tools/gen_testplan_fft.py.'
discover:
- glob: arith/fft_mdc2/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: FMDC-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/fft_mdc2/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (NumPy's FFT (forward and inverse, both scaling modes,
    N = 16 to 1024, the pairs put back into natural order) and the identities of the pair order, the swap and the even/odd split), and the conventions that a user could guess wrong (spec.md,
    last section) are pinned by examples.
  source: arith/fft_mdc2/spec.md
  spec_status: draft
- id: FMDC-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (6 directed or exhaustive points, 4 random ones, across 1 variants), each variant''s outputs equal the model''s: the directed points
    drive impulses, tones, DC, Nyquist, a chirp and corner values as pairs (x[2m], x[2m+1]), forward and inverse, back to back and after the shortest legal gap (N/8); the random points
    drive random frames with random direction and legal gaps up to N = 4096. Each output frame of N/2 pairs equals the model bit for bit, the latency from in_sof to out_sof equals the
    formula and out_valid is N/2 consecutive clocks.'
  source: arith/fft_mdc2/spec.md
  spec_status: draft
- id: FMDC-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (par2: (1<<LOGN)//2-1+(LOGN-1)+((LOGN-2)//2)*(TWSTAGES+MULSTAGES+1)+(0 if ORDER else (1<<LOGN)//2+1)+TWSTAGES+MULSTAGES+2),
    and the bench, run with a latency two clocks off, fails for every variant, so the passing runs prove the latency rather than assume it.'
  source: arith/fft_mdc2/spec.md
  spec_status: draft
- id: FMDC-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each: an inverted condition, a wrong constant, a dropped connection, a wrong width) makes the cocotb bench
    fail, or is argued equivalent in the file''s header; mutants that survive or do not build are reported, never hidden.'
  source: arith/fft_mdc2/verif/mutants.yaml
  spec_status: draft
- id: FMDC-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/fft_mdc2/spec.yaml
  spec_status: draft
- id: FMDC-F-GAPS
  kind: functional
  title: The frame-gap rule (0 or at least N/8 clocks) is measured, not assumed
  text: At N = 32, 64, 128 and 256 a source that leaves exactly N/8 idle clocks between frames gets every frame right, and one that leaves N/8 - 1 clocks corrupts at least one frame,
    so the stated rule is the real minimum, not a guess.
  source: arith/fft_mdc2/spec.md
  spec_status: draft
- id: FMDC-F-HARNESS
  kind: functional
  title: The packaged harness runs standalone, passes on the repository's variants and catches faults
  text: 'arith/fft_mdc2/harness/ (model, bench, SystemVerilog checkers, coverage targets, standalone runner: owner decision 24) needs no other file of the repository. Run against each
    variant of this function with the checkers beside it, in every mode, it passes and meets every coverage target; against one planted fault (a mutant of verif/mutants.yaml), or with
    a latency two clocks off, it fails; its model, bench and checker files are the repository''s own, generated by arith/tools/gen_harness_fft.py, so they cannot drift.'
  source: arith/fft_mdc2/harness/README.md
  spec_status: draft
