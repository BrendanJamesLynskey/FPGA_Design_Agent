# Machine-readable specification of the 2-parallel FFT (arith brief 161). The prose is spec.md; the two agree (tests/test_fft_mdc2_package.py).
schema: fda-arith/spec/1
function: fft_mdc2
title: 2-parallel streaming FFT (two samples per clock, N = 16 to 4096)
model: arith/fft_mdc2/model.py
summary: "The N = 2**LOGN point discrete Fourier transform of frames of complex samples (signed W-bit parts), forward or inverse per frame, at TWO samples per clock: a frame is N/2 clocks, clock m carrying the pair (x[2m], x[2m+1]), and the output frame is N/2 clocks, clock k carrying the pair (X[k], X[k + N/2]) (natural order) or the same pairs in bit-reversed order. Same transform, twiddles, scaling modes (scaled by 1/N with W-bit words, or growing to W + LOGN bits), rounding and direction swap as arith/fft. Built as two N/2-point radix-2^2 single-path delay-feedback pipelines (the even and the odd samples, arith/fft sdf) and one more radix-2 stage that combines them; it is the 2-parallel pipelined architecture of the multi-path delay-commutator family (the same throughput and the same delay memory) built as a decimation-in-time split, not as a commutator network (docs/fft_suite_plan.md section 2: the commutator form was costed there and not built). Its use is a line rate above one sample per clock, or the same rate at half the clock."
semantics:
  - "frame: N = 2**LOGN samples as N/2 consecutive clocks of in_valid, the first with in_sof; at clock m the real and imaginary parts of x[2m] are on in_re0 and in_im0 and those of x[2m + 1] on in_re1 and in_im1, two's complement, W bits each; in_inverse is sampled with in_sof and holds for the frame"
  - "forward (in_inverse = 0): X[k] = sum over n of x[n] exp(-j 2 pi n k / N); inverse (in_inverse = 1): exp(+j ...), by the swap trick of arith/fft (real and imaginary parts exchanged at the input and at every output part of a forward transform); SCALE = 1 gives X[k] / N for both directions, SCALE = 0 the plain sum in W + LOGN bits (arith/fft/spec.md, 'Function')"
  - "natural order (ORDER = 0): at output clock k, (out_re0, out_im0) = X[k] and (out_re1, out_im1) = X[k + N/2], k = 0 .. N/2 - 1; ORDER = 1: the sub-pipelines emit bit-reversed order, so at output clock p the pair is (X[b], X[b + N/2]) with b the bit reversal of p in LOGN - 1 bits. The output port 0 therefore carries the lower half of the spectrum and port 1 the upper half, in the same clock"
  - "the combining stage: X[k] = E[k] + W_N^k O[k], X[k + N/2] = E[k] - W_N^k O[k] where E and O are the N/2-point transforms of the even and the odd samples (each scaled by 2/N when SCALE = 1), W_N^k = exp(-j 2 pi k / N) from the quarter-wave table of fft_twiddle at TW bits, the product rounded once by a right shift of TW - 2 (RND), the sum and the difference halved and rounded when SCALE = 1; the bit-exact model is fft_ref.mdc2_frame"
  - "overflow: no overflow occurs if the magnitude of every input sample is below full scale (re**2 + im**2 < 2**(2W-2)), as in arith/fft; a full-scale corner can wrap, with no flag"
  - "the sub-pipelines have the streaming rules of arith/fft sdf at N/2 points: after a frame, the next starts with no gap or after at least N/8 idle clocks (the sub-pipeline's N'/4 with N' = N/2); a gap of 1 to N/8 - 1 clocks corrupts the previous frame's last outputs (the bench proves it at every small point); in_ready is always 1 and there is no back-pressure"
ports:
  - {name: clk, dir: in, width: 1, text: "clock"}
  - {name: rst, dir: in, width: 1, text: "synchronous reset of the control state (the data memories and delay lines are not reset)"}
  - {name: in_valid, dir: in, width: 1, text: "an input pair is present; N/2 consecutive clocks per frame"}
  - {name: in_sof, dir: in, width: 1, text: "with in_valid, the first pair of a frame"}
  - {name: in_inverse, dir: in, width: 1, text: "sampled with in_sof: 1 = inverse transform for this frame"}
  - {name: in_re0, dir: in, width: W, text: "real part of the even sample x[2m]"}
  - {name: in_im0, dir: in, width: W, text: "imaginary part of the even sample x[2m]"}
  - {name: in_re1, dir: in, width: W, text: "real part of the odd sample x[2m + 1]"}
  - {name: in_im1, dir: in, width: W, text: "imaginary part of the odd sample x[2m + 1]"}
  - {name: in_ready, dir: out, width: 1, text: "always 1: the pipeline cannot be stalled (see the gap rule)"}
  - {name: out_valid, dir: out, width: 1, text: "an output pair is present; N/2 consecutive clocks per frame"}
  - {name: out_sof, dir: out, width: 1, text: "with out_valid, the first output pair of a frame"}
  - {name: out_re0, dir: out, width: "((SCALE != 0) ? W : W + LOGN)", text: "real part of X[k], the lower half of the spectrum"}
  - {name: out_im0, dir: out, width: "((SCALE != 0) ? W : W + LOGN)", text: "imaginary part of X[k]"}
  - {name: out_re1, dir: out, width: "((SCALE != 0) ? W : W + LOGN)", text: "real part of X[k + N/2], the upper half of the spectrum"}
  - {name: out_im1, dir: out, width: "((SCALE != 0) ? W : W + LOGN)", text: "imaginary part of X[k + N/2]"}
parameters:
  LOGN: {min: 4, text: "log2 of the frame length N: 4 to 12 (N = 16 to 4096; the sub-pipelines are the 8 to 2048 point cores)"}
  W: {min: 4, text: "input sample part width"}
  TW: {min: 4, text: "twiddle width, 4 to 28 (scale 2**(TW-2))"}
  SCALE: {values: [0, 1], text: "1: scaled (output W bits, X / N); 0: growing (W + LOGN bits)"}
  RND: {values: [0, 1], text: "1: round half up at every shift; 0: truncate (floor)"}
  ORDER: {values: [0, 1], text: "0: natural-order output pairs; 1: bit-reversed (in LOGN - 1 bits) pair order"}
  CMUL: {values: [3, 4], text: "twiddle multiplier form: 4 real multipliers or 3 (identical results)"}
  TWSTAGES: {values: [1, 2], text: "twiddle ROM latency"}
  MULSTAGES: {min: 0, text: "register ranks in each complex multiplier, 0 to 3"}
signedness: "all data ports are two's complement"
exactness: "bit-exact against the model (arith/fft_mdc2/model.py: two N/2-point sdf models and the combining stage) for every frame within the overflow guarantee; against the real DFT the error is the rounding noise of the sub-pipelines and the combining stage, measured against NumPy in arith/fft_mdc2/tests/test_fft_mdc2_model.py (TW = 18, W = 16, N = 16 to 1024, forward and inverse: scaled worst error below 5 LSB, unscaled worst error below 2 * sqrt(N) + 6 LSB of the W + LOGN bit word)"
latency_definition: "clocks from the clock in which in_sof is asserted to the clock in which out_sof is asserted; throughput is two samples per clock"
contract:
  protocol: "streaming frames of N/2 pairs, no back-pressure: in_valid high for N/2 consecutive clocks per frame (in_sof on the first), the next frame after no gap or at least N/8 idle clocks, in_ready always 1, the consumer takes every output pair in the clock it is presented"
  throughput: "two samples per clock continuously: a frame every N/2 clocks (N/2 clocks of input, N/2 of output)"
  latency: "N/2 - 1 + (LOGN - 1) + ((LOGN - 2) // 2) * (TWSTAGES + MULSTAGES + 1) + TWSTAGES + MULSTAGES + 2, plus N/2 + 1 for natural order"
  reset: "synchronous: clears the control state of both sub-pipelines and of the combining stage (counters, frame markers, valid flags, the direction-flag line); data memories and delay lines are not cleared. A frame in flight when rst is asserted is lost; no test covers a reset in the middle of a frame"
  clock: "one clock, rising edge, no clock-enable"
  stall: "none: once started a frame cannot be paused (in_valid must stay high for N/2 clocks) and the output cannot be stalled"
integration:
  port_timing: "outputs come from registers through a 2:1 mux (direction swap); inputs go through a 2:1 swap mux into the first stage of each sub-pipeline. The longest paths are the complex multipliers (use MULSTAGES 3 to let the DSPs absorb their registers) and the butterfly adders"
  constraints: "one clock, no multicycle paths. The delay lines of the two sub-pipelines infer shift registers or RAM; the control delay lines (the sub-pipelines' and the direction-flag line, about 2 * the latency flip-flops) are reset registers, not SRLs"
guess_wrong:
  - "TWO samples per clock in, TWO out: in_re0/in_im0 is the EVEN-indexed sample x[2m], in_re1/in_im1 the odd one x[2m + 1]; a source that sends x[m] and x[m + N/2] (the first and second half of the frame) is wrong. A frame is N/2 clocks, not N"
  - "the output pair at clock k is (X[k], X[k + N/2]): port 0 is the LOWER half of the spectrum, port 1 the UPPER half, in the same clock. With ORDER = 1 the pair order is the bit reversal in LOGN - 1 bits, NOT a bit reversal of the whole N-bit index: the pair at clock p holds X[b] and X[b + N/2] with b = bitrev(p)"
  - "the gap rule is N/8 clocks (not N/4): 0 or at least N/8 idle clocks between frames, because the sub-pipelines are N/2-point sdf cores whose rule is N'/4; a gap of 1 to N/8 - 1 clocks corrupts the previous frame's last outputs and nothing flags it. There is no back-pressure at all: in_ready is always 1 and the sink must take every pair"
  - "SCALE = 1 scales the forward transform by 1/N as well as the inverse (an impulse of height A gives A/N everywhere); SCALE = 0 gives the plain sum in W + LOGN bits; there is no block floating point at this level"
  - "the result is not bit-identical to arith/fft's: the rounding points differ (two N/2-point transforms, then one rounded product and one halving); both are checked against NumPy, each against its own bit-exact model"
  - "the latency is the first output pair's delay from the first input pair; the last pair leaves N/2 - 1 clocks later. The latency formula depends on ORDER, TWSTAGES and MULSTAGES"
  - "the architecture is the decimation-in-time split, not the delay-commutator network usually called MDC: the multiplier count is 2 * ((LOGN - 2) // 2) + 1 complex multipliers, against about LOGN - 2 for a radix-2^2 MDC at the same throughput (the plan, section 2, costs the commutator form; it was not built)"
lean_note: "Not attempted. The split into two half-size transforms and a combining stage is the Cooley-Tukey identity, checked by the bit-exact model against NumPy's FFT and by the RTL against the model; a proof needs complex exponentials and sum manipulation, not in core Lean (4.36)."
variants:
  par2:
    file: rtl/fft_mdc2_par2.sv
    module: fft_mdc2_par2
    deps: [fft/rtl/fft_sdf_r22.sv, fft_common/fft_sdf_stage.sv, fft_common/fft_sdf_twmul.sv, fft_common/fft_bitrev.sv, fft_common/fft_cos_rom.sv, fft_reorder/rtl/fft_reorder_pingpong.sv, fft_twiddle/rtl/fft_twiddle_quarter.sv, fft_cmul/rtl/fft_cmul_m4.sv, fft_cmul/rtl/fft_cmul_m3.sv]
    params: {LOGN: 6, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}
    throughput: "2 samples per clock, a frame every N/2 clocks (gap 0 or at least N/8), continuously"
    latency: "(1<<LOGN)//2-1+(LOGN-1)+((LOGN-2)//2)*(TWSTAGES+MULSTAGES+1)+(0 if ORDER else (1<<LOGN)//2+1)+TWSTAGES+MULSTAGES+2"
    tradeoff: "two samples per clock at the same clock rate: twice arith/fft sdf's throughput for twice its multipliers (2 * ((LOGN - 2) // 2) + 1 complex multipliers) and the same delay memory (N - 2 words in all), at the cost of the combining stage's latency"
    exhaustive_points: [{LOGN: 4, W: 8, TW: 10, SCALE: 1, RND: 1, ORDER: 1, CMUL: 4, TWSTAGES: 1, MULSTAGES: 1}, {LOGN: 5, W: 8, TW: 10, SCALE: 0, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, {LOGN: 6, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, {LOGN: 7, W: 16, TW: 18, SCALE: 1, RND: 1, ORDER: 1, CMUL: 3, TWSTAGES: 2, MULSTAGES: 0}, {LOGN: 8, W: 12, TW: 14, SCALE: 1, RND: 0, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 3}, {LOGN: 9, W: 16, TW: 16, SCALE: 0, RND: 1, ORDER: 1, CMUL: 3, TWSTAGES: 2, MULSTAGES: 3}]
    random_points: [{LOGN: 6, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, {LOGN: 9, W: 16, TW: 18, SCALE: 0, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 3}, {LOGN: 10, W: 18, TW: 18, SCALE: 1, RND: 1, ORDER: 1, CMUL: 3, TWSTAGES: 1, MULSTAGES: 2}, {LOGN: 12, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}]
    expected_primitives:
      a7: "N = 1024, W = TW = 16, CMUL 4, MULSTAGES 3: two 512-point sdf pipelines of (LOGN - 2) // 2 = 4 complex multipliers each, so 8 + 1 = 9 complex multipliers = 36 DSP48E1 (27 with CMUL 3); delay memory 2 x 511 words of 32 bits; 5 twiddle ROMs; the natural-order reorder buffers (2 x 2 x 512 x 32 bits); about 5 to 8 k LUT and 6 to 9 k flip-flops, of which about 4 k are the control delay lines; expected Fmax 250 to 350 MHz"
      k26: "as a7 with DSP48E2; Fmax 400 to 550 MHz expected"
    ooc_points: [{LOGN: 10, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 2, MULSTAGES: 3}, {LOGN: 10, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 1, CMUL: 3, TWSTAGES: 2, MULSTAGES: 3}, {LOGN: 8, W: 16, TW: 16, SCALE: 0, RND: 1, ORDER: 1, CMUL: 4, TWSTAGES: 2, MULSTAGES: 3}]
    mutant_run: [{mode: directed, params: {LOGN: 5, W: 8, TW: 10, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}}, {mode: directed, params: {LOGN: 5, W: 8, TW: 10, SCALE: 0, RND: 0, ORDER: 1, CMUL: 3, TWSTAGES: 2, MULSTAGES: 0}}, {mode: randomised, params: {LOGN: 6, W: 16, TW: 16, SCALE: 1, RND: 1, ORDER: 0, CMUL: 4, TWSTAGES: 1, MULSTAGES: 2}, n: 512}]
