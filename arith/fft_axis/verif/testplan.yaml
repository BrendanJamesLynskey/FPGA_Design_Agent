# fft_axis testplan, schema v1 (brief 116) for the frequency-domain suite (brief 148). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_fft_axis
notes: 'Frequency-domain suite, function fft_axis (brief 148). Everything here is before Vivado: the model, the RTL variants, simulation, formal properties and the prepared out-of-context
  build files. No performance requirement on LUTs, DSPs, Fmax or power exists because none has been measured; the Vivado runs (build/<variant>/build.yaml, queued in _handoff/fpga_agent/vivado_later_queue.md)
  will add them. Every requirement is a draft written by the agent; none is agreed by a human. There are no Lean statements and no packaged harness for this suite (stated in the report).
  Generated by arith/tools/gen_testplan_fft.py.'
discover:
- glob: arith/fft_axis/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: FAXIS-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/fft_axis/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (the wrapped variants' own models (arith/fft/model.py)
    and the packing of {imaginary, real} words), and the conventions that a user could guess wrong (spec.md, last section) are pinned by examples.
  source: arith/fft_axis/spec.md
  spec_status: draft
- id: FAXIS-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (6 directed or exhaustive points, 4 random ones, across 2 variants), each variant''s outputs equal the model''s: the directed points
    send the FFT bench''s frames as AXI4-Stream beats with no pauses (the first-beat latency equals the formula); the random points send random frames, the burst variant with random
    tvalid pauses inside and between frames and a sink that stalls 40 per cent of the clocks, the sdf variant with the legal gaps. Every output frame equals the model bit for bit, tlast
    is on the right beat, and the protocol checkers (valid stability, data stability, no unknowns, tlast position, no stall for sdf, no pause inside a frame for sdf) count no error.'
  source: arith/fft_axis/spec.md
  spec_status: draft
- id: FAXIS-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (sdf: (1<<LOGN)-1+LOGN+((LOGN-1)//2)*(TWSTAGES+MULSTAGES+1)+(0 if ORDER else (1<<LOGN)+1); burst: (1<<LOGN)+LOGN*((1<<LOGN)//2+MULSTAGES+3)+1),
    and the bench, run with a latency two clocks off, fails for every variant, so the passing runs prove the latency rather than assume it.'
  source: arith/fft_axis/spec.md
  spec_status: draft
- id: FAXIS-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each: an inverted condition, a wrong constant, a dropped connection, a wrong width) makes the cocotb bench
    fail, or is argued equivalent in the file''s header; mutants that survive or do not build are reported, never hidden.'
  source: arith/fft_axis/verif/mutants.yaml
  spec_status: draft
- id: FAXIS-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/fft_axis/spec.yaml
  spec_status: draft
- id: FAXIS-F-AXIS
  kind: interface
  title: The AXI4-Stream handshake rules hold, and the checkers can fail
  text: 'On both streams of both variants the wrapper''s SystemVerilog protocol checkers (fft_common/axis_checker.sv: valid stays high until accepted, tdata and tlast stable while stalled,
    no unknowns after reset, tlast on every N-th beat, no stall on the streaming variant, no pause inside a frame where the variant forbids it) count zero violations in every run of
    the directed and random benches, which stall the burst variant''s sink and pause its source at random; tvalid is registered and independent of tready by construction (a mutant that
    makes it depend on tready is killed by the valid-stability rule). A deliberate-violation test shows each checker can fail. The back-pressure of each variant is stated in spec.yaml
    (sdf none, burst full).'
  source: arith/fft_axis/spec.md
  spec_status: draft
verification:
