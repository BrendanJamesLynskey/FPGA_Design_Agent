# sqrt_r4 testplan, schema v1 (brief 116 format; brief 139c). The agent wrote every requirement below from the owner's request; none is agreed by a human (`spec_status: draft`).
# Status is never typed here: `python -m flow.trace_v1 write arith/sqrt_r4` computes it from the evidence files named in each item. Evidence is regenerated by the commands in `notes`.
schema: fpga-design-agent/testplan/v1
design: sqrt_r4
notes: 'Arithmetic library function sqrt_r4 (brief 139c). Every requirement is a draft written by the agent from the owner''s request (spec_status: draft; only a human sets agreed). Evidence is generated
  by `python -m pytest arith/sqrt_r4/tests --junitxml=results/139c_arith/sqrt_r4_junit.xml` with ARITH_RECORD_DIR=results/139c_arith. The Lean items show ''statement not approved'': lean_approvals.yaml
  is a human''s. No Vivado run exists for this function (the build descriptions are prepared, not run), so there are no performance requirements.'
discover:
- glob: arith/sqrt_r4/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: SQRT4-F-MODEL
  kind: functional
  title: 'The model is the specification: it equals integer arithmetic'
  text: 'For the radix-4 integer square root: the root and remainder equal math.isqrt for every radicand at W = 5 to 14 and for random values at W up to 200, are the same pairs and packing as arith/isqrt,
    and the radix-4 recurrence equals the root step by step with the register widths of the RTL asserted at every step (sh below 2**(QW+3), the three trial values below it, rem <= 2q).'
  source: arith/sqrt_r4/spec.md#the-function
  spec_status: draft
- id: SQRT4-F-RTL-EXH
  kind: functional
  title: Every variant is bit-exact against the model, exhaustively at small widths
  text: 'Simulation (Icarus 14) of both variants against the model: every radicand at W = 5 to 16 (odd and even), with input gaps; root, remainder, order and latency checked.'
  source: arith/sqrt_r4/spec.md#the-function
  spec_status: draft
- id: SQRT4-F-RTL-RAND
  kind: functional
  title: Every variant is bit-exact against the model at large widths
  text: Simulation of both variants against the model with 3000 random and near-square values (remainders 0 and 2 * root) at W = 24, 31, 32, 48 and 64.
  source: arith/sqrt_r4/spec.md#the-function
  spec_status: draft
- id: SQRT4-F-LAT
  kind: functional
  title: Latency and throughput are what the spec states
  text: The measured latency equals the spec formula (RP + 1 and ceil(RP / PIPE), RP = ceil(RW / 2)) for PIPE = 1 to 5 at W = 13 (RP = 4) and PIPE = 3 and 4 at W = 24, one result per clock for the pipeline.
  source: arith/sqrt_r4/spec.md#the-function
  spec_status: draft
- id: SQRT4-F-LINT
  kind: functional
  title: The RTL is Verilator -Wall clean
  text: Verilator -Wall --lint-only reports nothing for either variant at W = 5, 6, 8, 13, 32 and 64 with PIPE = 1, 2 and 40.
  source: arith/sqrt_r4/spec.md#the-function
  spec_status: draft
- id: SQRT4-F-MUTANT
  kind: functional
  title: The bench catches seeded faults
  text: 'Each of 18 seeded faults (one text change in the RTL, verif/mutants.yaml) makes the bench fail: killed/total = 18/18.'
  source: arith/sqrt_r4/spec.md#the-function
  spec_status: draft
- id: SQRT4-F-FORMAL-REF
  kind: functional
  title: Every variant equals an independent reference (SymbiYosys)
  text: 'SymbiYosys with the slang front end: each variant satisfies root^2 + rem = x and rem <= 2 * root (so root^2 <= x < (root+1)^2) for all input sequences from reset: 11 jobs at W = 6 to 14; unbounded
    (abc pdr). 6 seeded faults are applied to the RTL and the same proof fails (bounded model checking finds the counterexample), which shows the harness is not vacuous.'
  source: arith/sqrt_r4/spec.md#the-function
  spec_status: draft
- id: SQRT4-F-FORMAL-ISQRT
  kind: functional
  title: The radix-4 pipeline agrees with the radix-2 pipeline of arith/isqrt (SymbiYosys)
  text: 'SymbiYosys with the slang front end, no reference involved: sqrt_r4''s pipeline and arith/isqrt''s restoring pipeline (a different digit recurrence, written for the same specification, at its own
    latency, the shorter one delayed) give the same output on the same inputs, W = 8, 10, 12; unbounded (abc pdr): 3 jobs.'
  source: arith/sqrt_r4/spec.md#the-function
  spec_status: draft
- id: SQRT4-F-LEAN-RECURRENCE
  kind: functional
  title: The radix-4 recurrence is a floor square root for every width (Lean)
  text: The radix-4 digit recurrence of sqrt_r4_iter.sv and sqrt_r4_pipe.sv yields root and rem with root^2 + rem = x and rem <= 2 * root for every number of steps, which determines the floor square root.
    Proved in Lean, statement not approved; the Lean text is a transcription of the RTL's step, cross-checked against the Python model for every 8-bit radicand and every 17th 12-bit radicand; register widths
    are not modelled.
  source: arith/sqrt_r4/spec.md#verification-everything-before-vivado
  spec_status: draft
- id: SQRT4-F-BUILD
  kind: functional
  title: Out-of-context build descriptions are prepared for Artix-7 and K26 (not run)
  text: 'For every variant of the radix-4 square root there is a build.yaml and an out-of-context clock constraint for xc7a100t and xck26, current against arith/tools/gen_build.py, consistent with the RTL
    (top, parameters, sources), with the expected primitive use evaluated for each point; the out-of-context wrapper lints clean and is functionally exact for the pipelined variant; the packaged verification
    harness (harness/run.py) passes on the library instance with every coverage bin hit. No Vivado run has been made: this requirement is about preparation, not about area, Fmax or power.'
  source: arith/sqrt_r4/spec.md#prepared-for-vivado-not-run
  spec_status: draft
