# Formal jobs of log2 (arith brief 139d; tools/run_formal.py). The fv top (log2_fv.sv) compares a variant (picked by SEL) with log2_ref, the exact function on 8 input bits, delayed by the variant's latency; prove = k-induction (unbounded), bmc = bounded (used only to refute a planted fault, which must fail). Bounds are in units of 2**-24: the model's measured error plus one unit for the reference's rounding. Wider points are covered by simulation and the exhaustive accuracy scan only.
jobs:
- {name: "table_ow10", top: "log2_fv", params: {SEL: 1, OW: 10, SBL: 4, SBP: 3, NIT: 10, G: 4, BT: 8185, BL: 17121, BP: 8274, BC: 100256}, mode: "prove", depth: 4, sources: ["formal/log2_fv.sv", "formal/log2_ref.sv", "rtl/log2_table.sv", "rtl/log2_lerp.sv", "rtl/log2_poly2.sv", "rtl/log2_cordic.sv"], claim: "the table at IW = 8, OW = 10 is within its measured error (about half a last place) of the exact log2 (the log2_ref ROM) and its registered form equals its combinational form delayed one clock: proved for all inputs (k-induction)"}
- {name: "lerp_ow10_sb4", top: "log2_fv", params: {SEL: 2, OW: 10, SBL: 4, SBP: 3, NIT: 10, G: 4, BT: 8185, BL: 17121, BP: 8274, BC: 100256}, mode: "prove", depth: 5, sources: ["formal/log2_fv.sv", "formal/log2_ref.sv", "rtl/log2_table.sv", "rtl/log2_lerp.sv", "rtl/log2_poly2.sv", "rtl/log2_cordic.sv"], claim: "lerp at IW = 8, OW = 10, 16 segments is within its stated error of the exact log2: proved for all inputs"}
- {name: "lerp_ow8_sb3", top: "log2_fv", params: {SEL: 2, OW: 8, SBL: 3, SBP: 3, NIT: 10, G: 4, BT: 32717, BL: 71843, BP: 32717, BC: 132835}, mode: "prove", depth: 5, sources: ["formal/log2_fv.sv", "formal/log2_ref.sv", "rtl/log2_table.sv", "rtl/log2_lerp.sv", "rtl/log2_poly2.sv", "rtl/log2_cordic.sv"], claim: "lerp at IW = 8, OW = 8, 8 segments (the segment position has 5 bits): proved for all inputs"}
- {name: "poly2_ow10_sb3", top: "log2_fv", params: {SEL: 4, OW: 10, SBL: 4, SBP: 3, NIT: 10, G: 4, BT: 8185, BL: 17121, BP: 8274, BC: 100256}, mode: "prove", depth: 6, sources: ["formal/log2_fv.sv", "formal/log2_ref.sv", "rtl/log2_table.sv", "rtl/log2_lerp.sv", "rtl/log2_poly2.sv", "rtl/log2_cordic.sv"], claim: "poly2 at IW = 8, OW = 10, 8 segments is within its stated error of the exact log2: proved for all inputs"}
- {name: "poly2_ow8_sb4", top: "log2_fv", params: {SEL: 4, OW: 8, SBL: 4, SBP: 4, NIT: 10, G: 4, BT: 32717, BL: 40638, BP: 32717, BC: 132835}, mode: "prove", depth: 6, sources: ["formal/log2_fv.sv", "formal/log2_ref.sv", "rtl/log2_table.sv", "rtl/log2_lerp.sv", "rtl/log2_poly2.sv", "rtl/log2_cordic.sv"], claim: "poly2 at IW = 8, OW = 8, 16 segments: proved for all inputs"}
- {name: "cordic_ow10_nit10", top: "log2_fv", params: {SEL: 8, OW: 10, SBL: 4, SBP: 3, NIT: 10, G: 4, BT: 8185, BL: 17121, BP: 8274, BC: 100256}, mode: "prove", depth: 13, sources: ["formal/log2_fv.sv", "formal/log2_ref.sv", "rtl/log2_table.sv", "rtl/log2_lerp.sv", "rtl/log2_poly2.sv", "rtl/log2_cordic.sv"], claim: "cordic at IW = 8, OW = 10, 10 iterations, 4 guard bits is within its stated error of the exact log2: proved for all inputs"}
- {name: "cordic_ow8_nit8", top: "log2_fv", params: {SEL: 8, OW: 8, SBL: 4, SBP: 3, NIT: 8, G: 3, BT: 32717, BL: 40638, BP: 32717, BC: 391227}, mode: "prove", depth: 11, sources: ["formal/log2_fv.sv", "formal/log2_ref.sv", "rtl/log2_table.sv", "rtl/log2_lerp.sv", "rtl/log2_poly2.sv", "rtl/log2_cordic.sv"], claim: "cordic at IW = 8, OW = 8, 8 iterations, 3 guard bits: proved for all inputs"}
- {name: "mutant_table_shift", top: "log2_fv", params: {SEL: 1, OW: 10, SBL: 4, SBP: 3, NIT: 6, G: 3, BT: 8521, BL: 17121, BP: 8274, BC: 1508972}, mode: "bmc", depth: 5, mutant: "t_sh_off", sources: ["formal/log2_fv.sv", "formal/log2_ref.sv", "rtl/log2_table.sv", "rtl/log2_lerp.sv", "rtl/log2_poly2.sv", "rtl/log2_cordic.sv"], claim: "a table read with one fractional bit too many is refuted"}
- {name: "mutant_lerp_slope", top: "log2_fv", params: {SEL: 2, OW: 10, SBL: 4, SBP: 3, NIT: 6, G: 3, BT: 8521, BL: 17121, BP: 8274, BC: 1508972}, mode: "bmc", depth: 6, mutant: "l_slope_zero", sources: ["formal/log2_fv.sv", "formal/log2_ref.sv", "rtl/log2_table.sv", "rtl/log2_lerp.sv", "rtl/log2_poly2.sv", "rtl/log2_cordic.sv"], claim: "a lerp that loses its slope is refuted"}
- {name: "mutant_poly2_a2", top: "log2_fv", params: {SEL: 4, OW: 10, SBL: 4, SBP: 3, NIT: 6, G: 3, BT: 8521, BL: 17121, BP: 8274, BC: 1508972}, mode: "bmc", depth: 6, mutant: "p_a2_lost", sources: ["formal/log2_fv.sv", "formal/log2_ref.sv", "rtl/log2_table.sv", "rtl/log2_lerp.sv", "rtl/log2_poly2.sv", "rtl/log2_cordic.sv"], claim: "a quadratic that loses its quadratic term is refuted"}
- {name: "mutant_cordic_direction", top: "log2_fv", params: {SEL: 8, OW: 10, SBL: 4, SBP: 3, NIT: 6, G: 3, BT: 8521, BL: 17121, BP: 8274, BC: 1508972}, mode: "bmc", depth: 10, mutant: "c_dir_flip", sources: ["formal/log2_fv.sv", "formal/log2_ref.sv", "rtl/log2_table.sv", "rtl/log2_lerp.sv", "rtl/log2_poly2.sv", "rtl/log2_cordic.sv"], claim: "a CORDIC with the rotation direction inverted is refuted"}
