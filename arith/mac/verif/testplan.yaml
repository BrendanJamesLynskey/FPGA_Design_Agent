# mac testplan, schema v1 (brief 116) for the arithmetic library (brief 139a). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_mac
notes: 'Arithmetic library, function mac (brief 139a). Everything here is before Vivado: the model, the RTL variants, simulation, formal equivalence, Lean statements and the prepared
  out-of-context build files. No performance requirement exists because nothing about LUTs, DSPs, Fmax or power has been measured yet; the Vivado runs (build/<variant>/build.yaml) will
  add them. Every requirement is a draft written by the agent; none is agreed by a human. Lean statements are not approved. Generated by arith/tools/gen_testplan.py.'
discover:
- glob: arith/mac/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: MAC-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/mac/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (a structure-free reference that applies the samples one
    at a time with Python integers) on every input at small widths and with Python's integer arithmetic on random large-width inputs, and the conventions that a user could guess wrong
    (spec.md, last section) are pinned by examples.
  source: arith/mac/spec.md
  spec_status: draft
- id: MAC-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (16 exhaustive points, 12 random ones, across 3 variants), each variant''s outputs equal the model''s in every clock: every input
    is driven at the small points; edge values, runs of ones, and random inputs at the large ones. The function is exact, so there is no error bound.'
  source: arith/mac/spec.md
  spec_status: draft
- id: MAC-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (dsp: NREG; dsp_cascade: LANES + 1; fabric: NREG), and the bench, run with a latency two clocks off, fails for
    every variant, so the passing runs prove the latency rather than assume it.'
  source: arith/mac/spec.md
  spec_status: draft
- id: MAC-F-EQUIV
  kind: functional
  title: The variants are equivalent to a plain reference, by proof where the tools allow
  text: SymbiYosys with the slang front end checks the variants against each other and a plain reference (a single `+` or `*`, or the specification written as RTL). The jobs in formal/jobs.yaml
    name the widths; a proof is by k-induction (for all inputs, any run length) at the widths listed there, a bounded check holds only to its stated depth. Widths beyond the listed ones
    are covered by simulation, not by proof.
  source: arith/mac/formal/jobs.yaml
  spec_status: draft
- id: MAC-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each, in the variant''s RTL: an inverted condition, a wrong constant, a dropped connection, a lost reset)
    makes the cocotb bench fail; mutants that survive or do not build are reported, never hidden.'
  source: arith/mac/verif/mutants.yaml
  spec_status: draft
- id: MAC-F-HARNESS
  kind: functional
  title: The packaged verification harness is a standalone deliverable that works
  text: arith/mac/harness holds the model, the cocotb bench, a SystemVerilog checker, coverage targets and a runner that needs nothing else from the repository. Run standalone against
    every variant (one small exhaustive point and one large random point each, with the checker beside the instance) it passes and the random runs meet every coverage target; run against
    a planted fault it fails, with and without the checker. Its generated files are the repository's own bench, so they cannot drift.
  source: arith/mac/harness/README.md
  spec_status: draft
- id: MAC-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/mac/spec.yaml
  spec_status: draft
- id: MAC-F-LEAN-NOCLR
  kind: functional
  title: A clear-free run adds up modulo 2^ACCW, for every width
  text: 'For every modulus M and run length, applying samples that never clear gives the initial accumulator plus the sum of the products, reduced modulo M: no saturation, no loss, however
    long the run. The statement is the specification and is NOT approved by a human (verif/lean_approvals.yaml is empty), so the proof is shown but not counted as verification. The Lean
    text is a hand transcription of the RTL''s structure; it models no timing or clocking.'
  source: arith/mac/rtl/mac_dsp.sv (the accumulator always_ff block; the same line in mac_fabric.sv and mac_dsp_cascade.sv)
  spec_status: draft
- id: MAC-F-LEAN-CLR
  kind: functional
  title: A clear makes the history irrelevant, for every width
  text: Whatever the accumulator held, a sample with clr followed by clear-free samples gives that sample's product plus the others, reduced modulo M. The statement is the specification
    and is NOT approved by a human (verif/lean_approvals.yaml is empty), so the proof is shown but not counted as verification. The Lean text is a hand transcription of the RTL's structure;
    it models no timing or clocking.
  source: arith/mac/rtl/mac_dsp.sv (the accumulator always_ff block)
  spec_status: draft
verification:
- id: V-MAC-MODEL
  requirements:
  - MAC-F-MODEL
  method: sim_test
  title: The model against independent formulations (exhaustive small, random large) and the pinned conventions
  evidence:
    file: arith/mac/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_mac_model::*
  checks:
  - arith/mac/model.py
- id: V-MAC-EXHAUSTIVE
  requirements:
  - MAC-F-EXACT
  method: sim_test
  title: Every variant against the model, every input, at the small points (Icarus + cocotb)
  evidence:
    file: arith/mac/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_mac_exhaustive_rtl::*
  checks:
  - arith/mac/rtl/mac_dsp.sv
  - arith/mac/rtl/mac_dsp_cascade.sv
  - arith/mac/rtl/mac_fabric.sv
  - arith/mac/tests/mac_cocotb.py
  - arith/mac/model.py
- id: V-MAC-RANDOM
  requirements:
  - MAC-F-EXACT
  method: sim_test
  title: 'Every variant against the model at the large points: edge values, carry runs and random inputs (Icarus + cocotb)'
  evidence:
    file: arith/mac/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_mac_random_rtl::*
  checks:
  - arith/mac/rtl/mac_dsp.sv
  - arith/mac/rtl/mac_dsp_cascade.sv
  - arith/mac/rtl/mac_fabric.sv
  - arith/mac/tests/mac_cocotb.py
  - arith/mac/model.py
- id: V-MAC-LATENCY
  requirements:
  - MAC-F-LAT
  method: sim_test
  title: The bench passes at the stated latency and fails two clocks off, for every variant
  evidence:
    file: arith/mac/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_mac_latency_rtl::*
  checks:
  - arith/mac/rtl/mac_dsp.sv
  - arith/mac/rtl/mac_dsp_cascade.sv
  - arith/mac/rtl/mac_fabric.sv
  - arith/mac/tests/mac_cocotb.py
  - arith/mac/model.py
- id: V-MAC-FORMAL-PROOF
  requirements:
  - MAC-F-EQUIV
  method: formal
  title: k-induction proofs of the variants against the reference (4 jobs; widths in formal/jobs.yaml)
  evidence:
    file: arith/mac/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_mac_formal_proof_rtl::*
  checks:
  - arith/mac/rtl/mac_dsp.sv
  - arith/mac/rtl/mac_dsp_cascade.sv
  - arith/mac/rtl/mac_fabric.sv
  - arith/mac/formal/mac_fv.sv
  - arith/mac/formal/mac_ref.sv
  - arith/mac/formal/jobs.yaml
- id: V-MAC-FORMAL-BOUNDED
  requirements:
  - MAC-F-EQUIV
  method: formal
  title: 'Bounded model checking from reset (1 job: a larger width than the proofs reach)'
  evidence:
    file: arith/mac/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_mac_formal_bounded_rtl::*
  checks:
  - arith/mac/rtl/mac_dsp.sv
  - arith/mac/rtl/mac_dsp_cascade.sv
  - arith/mac/rtl/mac_fabric.sv
  - arith/mac/formal/mac_fv.sv
  - arith/mac/formal/mac_ref.sv
  - arith/mac/formal/jobs.yaml
  bounded:
    depth: 14
- id: V-MAC-FORMAL-REFUTE
  requirements:
  - MAC-F-EQUIV
  method: formal
  title: Each formal check refutes a planted fault (the check can fail)
  evidence:
    file: arith/mac/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_mac_formal_refute_rtl::*
  checks:
  - arith/mac/rtl/mac_dsp.sv
  - arith/mac/rtl/mac_dsp_cascade.sv
  - arith/mac/rtl/mac_fabric.sv
  - arith/mac/formal/mac_fv.sv
  - arith/mac/formal/mac_ref.sv
  - arith/mac/formal/jobs.yaml
- id: V-MAC-MUTANT-TEST
  requirements:
  - MAC-F-BENCH
  method: sim_test
  title: 'The mutation run as a test: no mutant survives, none fails to build'
  evidence:
    file: arith/mac/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_mac_mutants_rtl::*
  checks:
  - arith/mac/rtl/mac_dsp.sv
  - arith/mac/rtl/mac_dsp_cascade.sv
  - arith/mac/rtl/mac_fabric.sv
  - arith/mac/tests/mac_cocotb.py
  - arith/mac/model.py
- id: V-MAC-MUTANT-SCORE
  requirements:
  - MAC-F-BENCH
  method: sim_measurement
  title: Mutants killed of valid mutants (the record of the last full run)
  evidence:
    file: arith/mac/verif/results/mutation.json
    reader: json
  pass_when:
  - field: survived
    op: eq
    value: []
  - field: invalid
    op: eq
    value: []
  - field: valid
    op: ge
    value: 10
  - field: score_pct
    op: eq
    value: 100.0
  checks:
  - arith/mac/rtl/mac_dsp.sv
  - arith/mac/rtl/mac_dsp_cascade.sv
  - arith/mac/rtl/mac_fabric.sv
  - arith/mac/tests/mac_cocotb.py
  - arith/mac/model.py
  - arith/mac/verif/mutants.yaml
- id: V-MAC-HARNESS
  requirements:
  - MAC-F-HARNESS
  method: sim_test
  title: The packaged harness run standalone on every variant (with the checker and the coverage targets) and on a planted fault
  evidence:
    file: arith/mac/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_mac_harness_rtl::*
  checks:
  - arith/mac/rtl/mac_dsp.sv
  - arith/mac/rtl/mac_dsp_cascade.sv
  - arith/mac/rtl/mac_fabric.sv
  - arith/mac/harness/assertions.sv
  - arith/mac/harness/chk_top.sv
  - arith/mac/harness/coverage.yaml
  - arith/mac/harness/run_harness.py
  - arith/mac/harness/model.py
  - arith/mac/harness/bench.py
- id: V-MAC-PACKAGE
  requirements:
  - MAC-F-PACKAGE
  method: sim_test
  title: spec.yaml against the RTL headers, spec.md against spec.yaml, Verilator -Wall at every point, wrappers and build.yaml current and lint-clean
  evidence:
    file: arith/mac/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_mac_package::*
  checks:
  - arith/mac/rtl/mac_dsp.sv
  - arith/mac/rtl/mac_dsp_cascade.sv
  - arith/mac/rtl/mac_fabric.sv
  - arith/mac/spec.yaml
  - arith/mac/spec.md
  - arith/mac/build/dsp/build.yaml
  - arith/mac/build/dsp_cascade/build.yaml
  - arith/mac/build/fabric/build.yaml
- id: V-MAC-LEAN-NOCLR
  requirements:
  - MAC-F-LEAN-NOCLR
  method: formal_lean
  title: A clear-free run adds up modulo 2^ACCW
  lean:
    module: Arith.Mac
    theorem: ArithMac.run_noclr
  rtl_link:
    kind: transcription_untested
    source:
    - file: arith/mac/rtl/mac_dsp.sv
      lines: 108-109
    transcribed_in: formal/lean/Arith/Mac.lean (step, run)
- id: V-MAC-LEAN-CLR
  requirements:
  - MAC-F-LEAN-CLR
  method: formal_lean
  title: A clear makes the history irrelevant
  lean:
    module: Arith.Mac
    theorem: ArithMac.run_after_clr
  rtl_link:
    kind: transcription_untested
    source:
    - file: arith/mac/rtl/mac_dsp.sv
      lines: 108-109
    transcribed_in: formal/lean/Arith/Mac.lean (step, run)
