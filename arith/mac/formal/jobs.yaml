# Formal jobs of the multiply-accumulate (arith brief 139a; tools/run_formal.py). The fv top (mac_fv.sv) holds the three variants and, for each, mac_ref (the
# specification written plainly, with the same latency); the first clock is a reset clock and every later clock must agree. prove = k-induction (unbounded:
# holds for every input sequence of any length); bmc = bounded model checking from reset (nothing is claimed past the depth). A job with `mutant` expects a failure.
jobs:
- {name: eq_3x3_2lane_signed, top: mac_fv, params: {WA: 3, WB: 3, LANES: 2, ACCW: 8, SIGNED: 1, NREG_D: 3, NREG_F: 2}, mode: prove, depth: 8, sources: [formal/mac_fv.sv, formal/mac_ref.sv, rtl/mac_dsp.sv, rtl/mac_dsp_cascade.sv, rtl/mac_fabric.sv], claim: "dsp (3 registers), fabric (2) and dsp_cascade (3 clocks) == the reference MAC, 3 x 3 bit, 2 lanes, signed, 8-bit accumulator: proved for all input sequences (k-induction)"}
- {name: eq_3x3_1lane_unsigned, top: mac_fv, params: {WA: 3, WB: 3, LANES: 1, ACCW: 7, SIGNED: 0, NREG_D: 1, NREG_F: 1}, mode: prove, depth: 6, sources: [formal/mac_fv.sv, formal/mac_ref.sv, rtl/mac_dsp.sv, rtl/mac_dsp_cascade.sv, rtl/mac_fabric.sv], claim: "the same, 1 lane, unsigned, 1-register variants, 7-bit accumulator: proved for all input sequences"}
- {name: eq_4x3_3lane_signed, top: mac_fv, params: {WA: 4, WB: 3, LANES: 3, ACCW: 9, SIGNED: 1, NREG_D: 2, NREG_F: 1}, mode: prove, depth: 9, sources: [formal/mac_fv.sv, formal/mac_ref.sv, rtl/mac_dsp.sv, rtl/mac_dsp_cascade.sv, rtl/mac_fabric.sv], claim: "the same, 4 x 3 bit, 3 lanes (a 4-clock cascade), signed, 9-bit accumulator: proved for all input sequences"}
- {name: eq_6x6_1lane_signed, top: mac_fv, params: {WA: 6, WB: 6, LANES: 1, ACCW: 14, SIGNED: 1, NREG_D: 3, NREG_F: 2}, mode: prove, depth: 7, timeout: 1500, sources: [formal/mac_fv.sv, formal/mac_ref.sv, rtl/mac_dsp.sv, rtl/mac_dsp_cascade.sv, rtl/mac_fabric.sv], claim: "the same, 6 x 6 bit, 1 lane, signed, 14-bit accumulator: proved for all input sequences"}
- {name: bmc_5x4_2lane_signed, top: mac_fv, params: {WA: 5, WB: 4, LANES: 2, ACCW: 11, SIGNED: 1, NREG_D: 3, NREG_F: 2}, mode: bmc, depth: 14, sources: [formal/mac_fv.sv, formal/mac_ref.sv, rtl/mac_dsp.sv, rtl/mac_dsp_cascade.sv, rtl/mac_fabric.sv], claim: "the same, 5 x 4 bit, 2 lanes, signed: bounded to 14 clocks from reset (no counterexample within 14 clocks; nothing is claimed beyond)"}
- {name: mutant_dsp_rst_in_flight, top: mac_fv, params: {WA: 3, WB: 3, LANES: 2, ACCW: 8, SIGNED: 1, NREG_D: 3, NREG_F: 2}, mode: bmc, depth: 10, mutant: dsp_rst_in_flight, sources: [formal/mac_fv.sv, formal/mac_ref.sv, rtl/mac_dsp.sv, rtl/mac_dsp_cascade.sv, rtl/mac_fabric.sv], claim: "a dsp MAC whose reset leaves the sample in flight is refuted"}
- {name: mutant_cascade_skew, top: mac_fv, params: {WA: 3, WB: 3, LANES: 3, ACCW: 8, SIGNED: 0, NREG_D: 2, NREG_F: 1}, mode: bmc, depth: 10, mutant: cas_skew_short, sources: [formal/mac_fv.sv, formal/mac_ref.sv, rtl/mac_dsp.sv, rtl/mac_dsp_cascade.sv, rtl/mac_fabric.sv], claim: "a cascade whose lane delays are all one clock is refuted"}
- {name: mutant_fabric_clr, top: mac_fv, params: {WA: 3, WB: 3, LANES: 1, ACCW: 7, SIGNED: 1, NREG_D: 1, NREG_F: 1}, mode: bmc, depth: 8, mutant: fab_clr_ignored, sources: [formal/mac_fv.sv, formal/mac_ref.sv, rtl/mac_dsp.sv, rtl/mac_dsp_cascade.sv, rtl/mac_fabric.sv], claim: "a fabric MAC that ignores clr is refuted"}
