# fft_real_axis testplan, schema v1 (brief 116) for the frequency-domain suite (brief 148). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_fft_real_axis
notes: 'Frequency-domain suite, function fft_real_axis (brief 148). Everything here is before Vivado: the model, the RTL variants, simulation, formal properties and the prepared out-of-context
  build files. No performance requirement on LUTs, DSPs, Fmax or power exists because none has been measured; the Vivado runs (build/<variant>/build.yaml, queued in _handoff/fpga_agent/vivado_later_queue.md)
  will add them. Every requirement is a draft written by the agent; none is agreed by a human. There are no Lean statements (the packaged harness of this function, in harness/, is evidenced
  by the harness item). Generated by arith/tools/gen_testplan_fft.py.'
discover:
- glob: arith/fft_real_axis/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: FRAXIS-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/fft_real_axis/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (the wrapped core's own model (arith/fft_real/model.py)
    and the packing of the AXI words (the even sample in the low half of the input word, the real part in the low half of the output word)), and the conventions that a user could guess
    wrong (spec.md, last section) are pinned by examples.
  source: arith/fft_real_axis/spec.md
  spec_status: draft
- id: FRAXIS-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (4 directed or exhaustive points, 3 random ones, across 1 variants), each variant''s outputs equal the model''s: the directed points
    send the real-FFT bench''s frames as AXI4-Stream beats from a source that never pauses: the wrapper itself opens the gap, which the bench measures and requires to equal N/8 exactly,
    and the first-beat latency equals the formula; the random points send random real frames with random idle times up to N = 2048. Every output frame of N/2 + 1 bins equals the model
    bit for bit, tlast is on the right beat and the protocol checkers count no error.'
  source: arith/fft_real_axis/spec.md
  spec_status: draft
- id: FRAXIS-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (post: (1<<(LOGN-1))-1+(LOGN-1)+((LOGN-2)//2)*(TWSTAGES+MULSTAGES+1)+(1<<(LOGN-1))+MULSTAGES+3), and the bench,
    run with a latency two clocks off, fails for every variant, so the passing runs prove the latency rather than assume it.'
  source: arith/fft_real_axis/spec.md
  spec_status: draft
- id: FRAXIS-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each: an inverted condition, a wrong constant, a dropped connection, a wrong width) makes the cocotb bench
    fail, or is argued equivalent in the file''s header; mutants that survive or do not build are reported, never hidden.'
  source: arith/fft_real_axis/verif/mutants.yaml
  spec_status: draft
- id: FRAXIS-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/fft_real_axis/spec.yaml
  spec_status: draft
- id: FRAXIS-F-AXIS
  kind: interface
  title: The AXI4-Stream rules hold on both streams, and the checkers can fail
  text: 'On both streams the wrapper''s SystemVerilog protocol checkers (fft_common/axis_checker.sv: valid stays high until accepted, tdata and tlast stable while stalled, no unknowns
    after reset, tlast on every (N/2)-th beat of the input and every (N/2 + 1)-th beat of the output, no stall on the output, no pause inside an input frame) count zero violations in
    every run of the directed and random benches, the source of which presents the next frame at once and waits on tready. A deliberate-violation test shows each checker can fail (a
    pause inside a frame, a stalled sink). tvalid is registered and independent of tready by construction.'
  source: arith/fft_real_axis/spec.md
  spec_status: draft
- id: FRAXIS-F-GAP
  kind: interface
  title: The wrapper enforces the transform's frame gap by back-pressure
  text: After every beat with tlast on the input stream s_axis_tready is low for N/8 clocks (the measured gap rule of the real-input core), and a source that never pauses sees exactly
    N/8 idle clocks between its frames; every such frame is correct. Mutants that remove the gap, shorten it or lengthen it are killed.
  source: arith/fft_real_axis/spec.md
  spec_status: draft
- id: FRAXIS-F-HARNESS
  kind: functional
  title: The packaged harness runs standalone, passes on the repository's variants and catches faults
  text: 'arith/fft_real_axis/harness/ (model, bench, SystemVerilog checkers, coverage targets, standalone runner: owner decision 24) needs no other file of the repository. Run against
    each variant of this function with the checkers beside it, in every mode, it passes and meets every coverage target; against one planted fault (a mutant of verif/mutants.yaml), or
    with a latency two clocks off, it fails; its model, bench and checker files are the repository''s own, generated by arith/tools/gen_harness_fft.py, so they cannot drift.'
  source: arith/fft_real_axis/harness/README.md
  spec_status: draft
