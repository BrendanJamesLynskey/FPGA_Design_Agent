# rsqrt testplan, schema v1 (brief 116 format; brief 139c). The agent wrote every requirement below from the owner's request; none is agreed by a human (`spec_status: draft`).
# Status is never typed here: `python -m flow.trace_v1 write arith/rsqrt` computes it from the evidence files named in each item. Evidence is regenerated by the commands in `notes`.
schema: fpga-design-agent/testplan/v1
design: rsqrt
notes: 'Arithmetic library function rsqrt (brief 139c). Every requirement is a draft written by the agent from the owner''s request (spec_status: draft; only a human sets agreed). Evidence is generated
  by `python -m pytest arith/rsqrt/tests --junitxml=results/139c_arith/rsqrt_junit.xml` with ARITH_RECORD_DIR=results/139c_arith. The Lean items show ''statement not approved'': lean_approvals.yaml is a
  human''s. No Vivado run exists for this function (the build descriptions are prepared, not run), so there are no performance requirements.'
discover:
- glob: arith/rsqrt/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: RSQRT-F-MODEL
  kind: functional
  title: 'The model is the specification: the error of every variant is within the stated bound'
  text: 'For the reciprocal square root: every variant''s error (exact value minus result, in units of the last place, from an integer square root to 2**-64) is within the spec''s bound over every input
    at W = 8 to 12 for every A from 2 to W - 3, at W = 14 (A = 6) and W = 16 (A = 7), and over sampled inputs to W = 32; the residual word never overflows its width (asserted at every step); the seed table
    entry is the floor of the midpoint value.'
  source: arith/rsqrt/spec.md#the-function
  spec_status: draft
- id: RSQRT-F-RTL-EXH
  kind: functional
  title: Every variant is bit-exact against the model, for every input at small widths
  text: 'Simulation (Icarus 14) of all three variants against the model: every x in [2**(W-2), 2**W) at W = 8 to 14 with several A (every A at W = 8 and 9), with input gaps; value, order and latency checked.'
  source: arith/rsqrt/spec.md#the-function
  spec_status: draft
- id: RSQRT-F-RTL-RAND
  kind: functional
  title: Every variant is bit-exact against the model at large widths
  text: Simulation of all three variants against the model with 3000 random and seed-table-boundary inputs (including the change of binade at X = 2) at W = 16, 20, 22 and 24.
  source: arith/rsqrt/spec.md#the-function
  spec_status: draft
- id: RSQRT-F-LAT
  kind: functional
  title: Latency and throughput are what the spec states
  text: The measured latency equals the spec (1, 6 and 11 clocks for table, nr1, nr2), one result per clock, with back-to-back inputs at W = 10.
  source: arith/rsqrt/spec.md#the-function
  spec_status: draft
- id: RSQRT-F-LINT
  kind: functional
  title: The RTL is Verilator -Wall clean
  text: Verilator -Wall --lint-only reports nothing for any variant at W = 8, 10, 16 and 24 (A = 3 to 9).
  source: arith/rsqrt/spec.md#the-function
  spec_status: draft
- id: RSQRT-F-MUTANT
  kind: functional
  title: The bench catches seeded faults
  text: 'Each of 15 seeded faults (one text change in the RTL, verif/mutants.yaml) makes the bench fail: killed/total = 15/15. One more mutant (E01, the residual''s reference value) is equivalent by an
    argument given in verif/mutants.yaml and is not counted.'
  source: arith/rsqrt/spec.md#the-function
  spec_status: draft
- id: RSQRT-F-FORMAL-BOUND
  kind: functional
  title: Every variant meets its error bound for all input sequences (SymbiYosys)
  text: 'SymbiYosys with the slang front end: each variant''s result y satisfies the error characterisation (a comparison of squares, no shared code with the RTL) for all input sequences from reset, proved
    by k-induction at an induction depth above the latency (the datapath is a feed-forward pipeline): 8 jobs (table, nr1, nr2 at W = 8, 10, 12). 7 faults or an over-tight bound make the proof fail (bounded
    model checking), which shows the harness is not vacuous. Not proved for other widths.'
  source: arith/rsqrt/spec.md#the-function
  spec_status: draft
- id: RSQRT-F-LEAN-NEWTON
  kind: functional
  title: 'The exact Newton reciprocal-square-root step: a polynomial identity and one-sidedness (Lean)'
  text: 'For all integers S (the scale of 1.0) and T (standing for x*y*y): 4*S**3 - T*(3S - T)**2 = (S - T)**2 * (4S - T), hence T*(3S - T)**2 <= 4*S**3 whenever T <= 4S: the exact Newton-Raphson reciprocal-square-root
    step never exceeds the exact value. Proved in Lean, statements not approved; the truncations of the RTL and the seed table''s accuracy are not in Lean.'
  source: arith/rsqrt/spec.md#verification-everything-before-vivado
  spec_status: draft
- id: RSQRT-F-BUILD
  kind: functional
  title: Out-of-context build descriptions are prepared for Artix-7 and K26 (not run)
  text: 'For every variant of the reciprocal square root there is a build.yaml and an out-of-context clock constraint for xc7a100t and xck26, current against arith/tools/gen_build.py, consistent with the
    RTL (top, parameters, sources), with the expected primitive use evaluated for each point; the out-of-context wrapper lints clean and is functionally exact for every variant; the packaged verification
    harness (harness/run.py) passes on the library instance with every coverage bin hit. No Vivado run has been made: this requirement is about preparation, not about area, Fmax or power.'
  source: arith/rsqrt/spec.md#prepared-for-vivado-not-run
  spec_status: draft
