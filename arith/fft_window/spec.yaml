# Machine-readable specification of the window multiplier (arith brief 148). The prose is spec.md; the two agree (tests/test_fft_window_package.py).
schema: fda-arith/spec/1
function: fft_window
title: Window multiplier (one coefficient for both parts of a complex sample)
model: arith/fft_window/model.py
summary: "yr = round(xr * w / 2**WW) and yi = round(xi * w / 2**WW): a complex sample (WD-bit signed parts) times a real window coefficient w, a WW-bit UNSIGNED number of value w / 2**WW (so the largest coefficient is 1 - 2**-WW; exactly 1.0 cannot be represented, a stated convention). Rounding half up or truncation (RND). The result has the width of the input and cannot overflow. One sample per clock. The coefficient comes from the caller (arith/fft_common/fft_ref.py has rect, Hann, Hamming and Blackman coefficient generators)."
semantics:
  - "xr and xi are WD-bit two's complement; w is a WW-bit unsigned number; yr and yi are WD-bit two's complement"
  - "RND = 1: y = floor((x * w + 2**(WW-1)) / 2**WW), round half up (toward plus infinity at a tie); RND = 0: y = floor(x * w / 2**WW), truncation toward minus infinity"
  - "because w < 2**WW the magnitude of y never exceeds that of x (|y| <= |x|), so y always fits WD bits"
  - "the same coefficient multiplies the real and the imaginary part"
ports:
  - {name: clk, dir: in, width: 1, text: "clock; unused (kept for a common port list) when STAGES is 0"}
  - {name: xr, dir: in, width: WD, text: "real part of the sample, two's complement"}
  - {name: xi, dir: in, width: WD, text: "imaginary part of the sample"}
  - {name: w, dir: in, width: WW, text: "window coefficient, unsigned, value w / 2**WW"}
  - {name: yr, dir: out, width: WD, text: "windowed real part, STAGES clocks after the inputs"}
  - {name: yi, dir: out, width: WD, text: "windowed imaginary part"}
parameters:
  WD: {min: 2, text: "width of the sample parts"}
  WW: {min: 2, text: "width of the coefficient (value w / 2**WW)"}
  RND: {values: [0, 1], text: "1: round half up; 0: truncate"}
  STAGES: {min: 0, text: "register ranks, 0 to 3: the latency in clocks (above 3 behaves as 3)"}
signedness: "samples signed two's complement; the coefficient unsigned"
exactness: "bit-exact against the model, which rounds once: the error against the real product is at most 0.5 unit in the last place (RND = 1) or less than 1 (RND = 0)"
latency_definition: "clocks from the inputs being presented to yr and yi being valid; 0 means combinational; one sample per clock"
contract:
  protocol: "plain ports, no handshake: a sample and its coefficient are sampled every clock; the caller delays its own valid by STAGES and presents the coefficient with its sample (a counter-addressed ROM of the caller, one clock ahead if the ROM is synchronous)"
  throughput: "one sample per clock (initiation interval 1)"
  latency: "STAGES (0 to 3)"
  reset: "none: no control state; data only"
  clock: "one clock, rising edge, no clock-enable"
  stall: "none"
integration:
  port_timing: "STAGES 3 lets the DSP absorb the operand, product and output registers; at STAGES 0 the multiplier and the rounding adder are in series with the caller's logic"
  constraints: "one clock; keep the stages as written. The coefficient generator is outside this block: a window table sized N x WW bits per window shape, or one shared table with a run-time shape select"
guess_wrong:
  - "the coefficient is UNSIGNED with scale 2**WW: 1.0 is not representable, the largest coefficient is 1 - 2**-WW, so a rectangular window of 'all ones' attenuates by 2**-WW; a window that must reach 1.0 uses WW + 1 bits with the top bit meaning exactly 1.0, which this block does not do"
  - "RND = 1 rounds half up, not half to even, so a long run of exact ties is biased upward by half a unit; RND = 0 truncates toward minus infinity and is biased downward by half a unit on average"
  - "the same coefficient is applied to the real and the imaginary part: a complex window (a different coefficient per part) is not this block"
  - "the window coefficients themselves are the caller's: fft_common/fft_ref.window_coeffs gives periodic (DFT-even) Hann, Hamming and Blackman tables rounded to nearest and clipped to 2**WW - 1; a symmetric window of the same name has slightly different values"
  - "STAGES is the number of register ranks and the latency, not a retiming request. Above 3 it behaves as 3"
  - "no valid, ready or reset: for STAGES clocks after power-up the outputs are not meaningful"
lean_note: "Not attempted: the statement that |round(x w / 2**WW)| <= |x| for 0 <= w < 2**WW is elementary but is covered here by exhaustive simulation at small widths and the model's tests; core Lean has no tactic support that makes it quicker than that."
variants:
  dsp:
    file: rtl/fft_window_dsp.sv
    module: fft_window_dsp
    deps: []
    params: {WD: 16, WW: 16, RND: 1, STAGES: 3}
    throughput: "1 per clock"
    latency: "STAGES"
    tradeoff: "two WD x (WW+1) signed multipliers on DSP blocks; the rounding constant folds into the post-adder at STAGES 3"
    exhaustive_points: [{WD: 3, WW: 3, RND: 1, STAGES: 0}, {WD: 3, WW: 3, RND: 0, STAGES: 1}, {WD: 4, WW: 3, RND: 1, STAGES: 2}, {WD: 3, WW: 4, RND: 0, STAGES: 3}, {WD: 2, WW: 5, RND: 1, STAGES: 3}]
    random_points: [{WD: 16, WW: 16, RND: 1, STAGES: 3}, {WD: 24, WW: 17, RND: 0, STAGES: 2}, {WD: 18, WW: 12, RND: 1, STAGES: 1}, {WD: 12, WW: 10, RND: 1, STAGES: 0}]
    expected_primitives:
      a7: "2 DSP48E1 (WD <= 25, WW + 1 <= 18); 0 BRAM; about WD LUT6 if the rounding add stays outside the DSPs"
      k26: "2 DSP48E2 (WD <= 27, WW + 1 <= 18); 0 BRAM"
    ooc_points: [{WD: 16, WW: 16, RND: 1, STAGES: 3}, {WD: 24, WW: 17, RND: 1, STAGES: 3}, {WD: 16, WW: 16, RND: 0, STAGES: 3}, {WD: 16, WW: 16, RND: 1, STAGES: 1}]
    mutant_run: [{mode: exhaustive, params: {WD: 3, WW: 3, RND: 1, STAGES: 0}}, {mode: exhaustive, params: {WD: 3, WW: 3, RND: 0, STAGES: 2}}, {mode: randomised, params: {WD: 16, WW: 16, RND: 1, STAGES: 3}, n: 3000}]
