# Mutation set for fft_window (arith brief 148; tools/run_mutants.py): each mutant replaces `old` (exactly once) by `new` in a copy of the file it names (the variant's own file, or `file`,
# relative to this function's folder, for a mutant of a shared file). Generated by arith/tools/gen_mutants_fft.py: edit that list, not this file. Mutants left out as equivalent are listed in
# the lines below.
# Left out as equivalent: shift_logical: `sr >> WW` instead of `sr >>> WW` on the signed product: the bits above the kept WD bits are the only ones a logical shift changes, and they are cut off by the truncation to WD bits, so the output is the same
mutants:
- {class: constant, name: round_half, new: 'sr = (RND != 0) ? tr + (WD + WW + 1)''(1 << (WW - 2)) : tr;', old: 'sr = (RND != 0) ? tr + (WD + WW + 1)''(1 << (WW - 1)) : tr;', variant: dsp, why: the rounding constant is a quarter instead of a half}
- {class: width, name: coef_sign, new: 'ws = {wu[WW-1], wu};', old: 'ws = {1''b0, wu};', variant: dsp, why: the coefficient is read as signed}
- {class: connection, name: imag_uses_real, new: pi = ar * ws;, old: pi = ai * ws;, variant: dsp, why: the imaginary part multiplies the real part}
- {class: latency, name: coef_rank, new: wu = w;, old: 'wu = (STAGES >= 2) ? w2 : w;', variant: dsp, why: the coefficient skips its operand rank}
- {class: latency, name: output_rank, new: yr = rr;, old: 'yr = (STAGES >= 1) ? yr_q : rr;', variant: dsp, why: the real output skips its register}
- {class: latency, name: product_rank, new: tr = pr;, old: 'tr = (STAGES >= 3) ? qr : pr;', variant: dsp, why: the real product skips its register}
- {class: operator, name: rnd_inverted, new: 'sr = (RND == 0) ? tr +', old: 'sr = (RND != 0) ? tr +', variant: dsp, why: rounding and truncation are exchanged}
