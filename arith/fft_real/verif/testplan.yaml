# fft_real testplan, schema v1 (brief 116) for the frequency-domain suite (brief 148). GENERATED by `python -m arith.tools.gen_testplan` from spec.yaml, formal/jobs.yaml and the
# test files: edit those, not this file. Status is never typed here: `python -m flow.trace_v1 write` reads the recorded evidence in verif/results/ and computes it.
schema: fpga-design-agent/testplan/v1
design: arith_fft_real
notes: 'Frequency-domain suite, function fft_real (brief 148). Everything here is before Vivado: the model, the RTL variants, simulation, formal properties and the prepared out-of-context
  build files. No performance requirement on LUTs, DSPs, Fmax or power exists because none has been measured; the Vivado runs (build/<variant>/build.yaml, queued in _handoff/fpga_agent/vivado_later_queue.md)
  will add them. Every requirement is a draft written by the agent; none is agreed by a human. There are no Lean statements and no packaged harness for this suite (stated in the report).
  Generated by arith/tools/gen_testplan_fft.py.'
discover:
- glob: arith/fft_real/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: FREAL-F-MODEL
  kind: functional
  title: The bit-exact model is right
  text: arith/fft_real/model.py gives, for every input, the result that spec.md defines. It agrees with an independent formulation (numpy.fft.rfft (the N/2 + 1 bins, both scaling modes,
    both FFT variants as the core) and the equality of the complex-core path with a direct split), and the conventions that a user could guess wrong (spec.md, last section) are pinned
    by examples.
  source: arith/fft_real/spec.md
  spec_status: draft
- id: FREAL-F-EXACT
  kind: functional
  title: Every variant is bit-exact against the model
  text: 'At every parameter point listed in spec.yaml (5 directed or exhaustive points, 3 random ones, across 1 variants), each variant''s outputs equal the model''s: the directed points
    drive impulses at several positions, tones, DC, Nyquist and corner values as pairs of real samples, with the shortest legal spacing and longer ones; the random points drive random
    real frames with random legal spacing up to N = 2048. Each output frame of N/2 + 1 bins equals the model bit for bit, the latency from in_sof to out_sof equals the formula, and out_valid
    is N/2 + 1 consecutive clocks.'
  source: arith/fft_real/spec.md
  spec_status: draft
- id: FREAL-F-LAT
  kind: functional
  title: Latency is as specified and the bench would notice if it were not
  text: 'Each variant''s latency in clocks is the expression in spec.yaml (post: (1<<(LOGN-1))-1+(LOGN-1)+((LOGN-2)//2)*(TWSTAGES+MULSTAGES+1)+(1<<(LOGN-1))+MULSTAGES+3), and the bench,
    run with a latency two clocks off, fails for every variant, so the passing runs prove the latency rather than assume it.'
  source: arith/fft_real/spec.md
  spec_status: draft
- id: FREAL-F-BENCH
  kind: functional
  title: The bench catches seeded faults
  text: 'Every one of the mutants in verif/mutants.yaml (one exact text change each: an inverted condition, a wrong constant, a dropped connection, a wrong width) makes the cocotb bench
    fail, or is argued equivalent in the file''s header; mutants that survive or do not build are reported, never hidden.'
  source: arith/fft_real/verif/mutants.yaml
  spec_status: draft
- id: FREAL-F-PACKAGE
  kind: functional
  title: The RTL is lint-clean, and its files agree with the specification and with the Vivado build files
  text: spec.yaml states an interface contract (protocol, throughput, latency, reset, clock, stalls) and integration guidance (port timing, constraints to carry). Every variant passes
    Verilator -Wall at every point of spec.yaml; its ports and default parameters are the ones spec.yaml states; its header states the intended primitive use before any Vivado run; spec.md
    is the rendering of spec.yaml; the out-of-context wrapper and the build.yaml for each variant (Artix-7 xc7a100t and K26 xck26, prepared and not run) are current and lint-clean at
    every point they list, so a Vivado run can start from the repository alone.
  source: arith/fft_real/spec.yaml
  spec_status: draft
verification:
- id: V-FREAL-MODEL
  requirements:
  - FREAL-F-MODEL
  method: sim_test
  title: The model against independent formulations and the pinned conventions
  evidence:
    file: arith/fft_real/verif/results/pytest_junit.xml
    reader: junit
    tests:
    - test_fft_real_model::*
  checks:
  - arith/fft_real/model.py
  - arith/fft_common/fft_ref.py
- id: V-FREAL-DIRECTED
