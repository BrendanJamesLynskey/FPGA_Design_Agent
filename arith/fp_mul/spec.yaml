# Machine-readable specification of the floating-point multiplier (arith brief 139e). The prose is spec.md; the two agree (tests/test_fp_mul_package.py).
schema: fda-arith/spec/1
function: fp_mul
title: Floating-point multiplier (IEEE-754-style binary formats)
model: arith/fp_mul/model.py
summary: "y = a * b for a binary floating-point format of EXP exponent and MAN fraction bits (binary32 is 8/23, bfloat16 8/7, binary16 5/10; any EXP >= 2 and MAN >= 1 works), one correctly rounded result per clock (round to nearest, ties to even), with the special cases fixed and documented. The significand product is exact, then rounded once. Two implementations trade DSP blocks against LUTs: the product on DSP blocks, or in a LUT array. Each takes STAGES register ranks (0 to 3) and a SUBNORM switch between full subnormal support and flush-to-zero."
semantics:
  - "format: sign (1 bit), exponent (EXP bits, bias 2**(EXP-1) - 1), fraction (MAN bits); y has the same format. An exponent field of all ones is infinity (fraction 0) or NaN (fraction nonzero); a field of 0 is zero (fraction 0) or subnormal"
  - "y is the exact product a * b rounded ONCE to nearest, ties to even (the correctly rounded product; there is no other rounding mode and no exception flag); the sign of y is the xor of the signs, including for zero and infinity"
  - "NaN: any NaN input, and infinity * 0, give the canonical quiet NaN (sign 0, exponent all ones, fraction msb 1, rest 0); NaN payloads and signs are not propagated"
  - "infinity: infinity times a nonzero number (finite or infinite) is an infinity of the xor sign; a finite product too large to round to a finite number is an infinity of that sign"
  - "zero: zero times a finite number is a zero of the xor sign"
  - "SUBNORM = 1: subnormal inputs and outputs follow IEEE 754 (gradual underflow)"
  - "SUBNORM = 0 (flush to zero): a subnormal input is read as a zero of its own sign (denormals-are-zero), and a product smaller in magnitude than the smallest normal number, after rounding with an unbounded exponent range, is replaced by a zero of the product's sign"
  - "the model (fp_common/fp_ref.py) multiplies with exact rational arithmetic and rounds once; the RTL multiplies the two (MAN+1)-bit significands exactly (2 * (MAN+1) bits), adds the exponents, normalises and rounds, and equals the model for every input (exhaustive at small formats, proved by SymbiYosys at tiny formats, random elsewhere)"
ports:
  - {name: clk, dir: in, width: 1, text: "clock; unused (kept for a common port list) when STAGES is 0"}
  - {name: a, dir: in, width: "EXP+MAN+1", text: "first operand, an IEEE-style bit pattern {sign, exponent, fraction}"}
  - {name: b, dir: in, width: "EXP+MAN+1", text: "second operand"}
  - {name: y, dir: out, width: "EXP+MAN+1", text: "the correctly rounded product, same format; STAGES clocks after the operands"}
parameters:
  EXP: {min: 2, text: "exponent bits (8 for binary32 and bfloat16, 5 for binary16)"}
  MAN: {min: 1, text: "stored fraction bits (23 for binary32, 7 for bfloat16, 10 for binary16)"}
  SUBNORM: {values: [0, 1], text: "1: subnormal numbers supported (IEEE 754); 0: flush to zero, smaller and faster"}
  STAGES: {min: 0, text: "register ranks, 0 to 3: the latency in clocks (above 3 behaves as 3)"}
signedness: "sign-magnitude as IEEE 754: the top bit of a, b and y is the sign; there is no two's complement reading"
exactness: "exact in the sense of IEEE 754: y is the correctly rounded value of the exact product (round to nearest, ties to even), for every input including zeros, subnormals (SUBNORM = 1), infinities and NaNs; the error is at most half a unit in the last place (0.5 ulp) except where the result is flushed or overflows. Both variants give identical results"
latency_definition: "clocks from the operands being presented to y being valid; 0 means combinational; throughput is one product per clock in every variant"
contract:
  protocol: "plain registered-or-combinational ports, no handshake: operands are sampled every clock and one product leaves, with no valid, ready or backpressure. A caller that needs a valid bit delays its own valid by STAGES"
  throughput: "one product per clock in every variant (initiation interval 1)"
  latency: "per variant, in clocks: STAGES (0 to 3) for both dsp and lut"
  reset: "none: no control state; the rank registers hold data only and y is meaningless for STAGES clocks after power-up"
  clock: "one clock, rising edge, no clock-enable and no gating; clk is present but unused when STAGES is 0"
  stall: "none: the pipeline cannot be frozen (no enable); DSP registers are inferred without a clock-enable"
integration:
  port_timing: "dsp with STAGES 3: the significand registers before the multiplier and the product register after it can be absorbed by the DSP blocks (AREG/BREG, PREG), then the normalise-and-round stage is a path of its own and y is registered: the block sits between ordinary registers with a clock on each side except for the input exponent adder, which is in front of the first rank. STAGES 0 to 2 leave the multiplier and the normaliser in series. lut with any STAGES: the SP-row adder array is one long carry-chain path (a binary32 array is about 24 adders in series): STAGES 3 does not split it, so expect a low Fmax unless the array is pipelined further by the user"
  constraints: "no multicycle or false paths, one clock. DSP variant: use the DSP block registers (STAGES 3); placing the surrounding registers next to the DSP column helps; keep the register stages as written (no keep or retiming that moves them). LUT variant: nothing to carry beyond the clock; floorplan the array in one region at binary32"
guess_wrong:
  - "the result is correctly rounded to nearest, ties to even; there is no rounding-mode input, no sticky or exception flag output (overflow, underflow, inexact, invalid)"
  - "every NaN result is the canonical quiet NaN (sign 0, fraction 0x400000 for binary32): the payload and sign of an input NaN are NOT propagated, and a signalling NaN is not distinguished"
  - "infinity times zero is NaN (not zero), and with SUBNORM = 0 infinity times a subnormal is also NaN because the subnormal is read as zero"
  - "with SUBNORM = 0 a subnormal INPUT is treated as zero: 1.0 * (a subnormal) = +-0. A product is flushed when it is below the smallest normal number after rounding with an unbounded exponent range; a product that rounds up to exactly the smallest normal number is NOT flushed"
  - "the sign of a zero or infinity result is the xor of the input signs, also for (-0) * (-0) = +0"
  - "there is no valid, ready or reset: for STAGES clocks after power-up y is not meaningful, and a change of EXP, MAN or SUBNORM is a different block, not a mode"
  - "on a DSP a (MAN+1) x (MAN+1) UNSIGNED product costs more than the signed width suggests: the DSP multiplier is signed (25 x 18 on 7 series), so binary32 (24 x 24) needs several DSPs, not one"
  - "STAGES is the number of register ranks and the latency, not a retiming request. Above 3 it behaves as 3; values outside the ranges in the table above are not rejected by an assertion"
  - "EXP = 8, MAN = 7 is bfloat16 (NOT binary16, which is EXP = 5, MAN = 10); formats other than these two and binary32 are not checked against any external library"

lean_note: "Core Lean (4.36, no Mathlib) has no IEEE-754 library (Flocq is a Coq library). The rounding and special-case rules are stated in \"Function\" above and written as a program in fp_common/fp_ref.py (exact rational arithmetic, one rounding); they are checked against NumPy's float32 and float16, against an enumeration of every value of a tiny format, by simulation of every variant, and by SymbiYosys proofs against a wide-integer specification at tiny formats. None of that is a Lean proof. Lean (formal/lean/Arith/Float.lean) states only three small integer facts that the RTL relies on: that the rounding increment added to the packed {exponent, fraction} pattern carries into the exponent, that left-normalising by the leading-zero count puts the leading one at the top, and that the guard-and-sticky rule is round-to-nearest with ties to even. They are proved for all widths; the statements are NOT approved (verif/lean_approvals.yaml is empty), so the matrix shows \"statement not approved\". Marked research and not attempted: that fp_ref.py's rounding is IEEE roundTiesToEven for every format and exponent range (it needs a real-number or rational model of the format, as Flocq gives in Coq), and the exponent and denormalisation arithmetic of the product (the biased exponent after normalisation, the right shift of a subnormal result). Those are covered by simulation and by the proofs at the tiny formats only."

variants:
  dsp:
    file: rtl/fp_mul_dsp.sv
    module: fp_mul_dsp
    deps: [fp_common/fp_pack.sv, fp_common/fp_norm.sv]
    params: {EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}
    throughput: "1 per clock"
    latency: "STAGES"
    tradeoff: "the significand product on DSP blocks: about 2 (DSP48E2) to 4 (DSP48E1) DSPs for binary32 and one for bfloat16 and binary16, few LUTs, high clock at STAGES 3; the scarce resource is the DSP"
    exhaustive_points: [{EXP: 2, MAN: 1, SUBNORM: 1, STAGES: 0}, {EXP: 2, MAN: 2, SUBNORM: 1, STAGES: 0}, {EXP: 2, MAN: 2, SUBNORM: 0, STAGES: 1}, {EXP: 3, MAN: 2, SUBNORM: 1, STAGES: 2}, {EXP: 3, MAN: 2, SUBNORM: 0, STAGES: 3}, {EXP: 3, MAN: 3, SUBNORM: 1, STAGES: 3}, {EXP: 4, MAN: 2, SUBNORM: 1, STAGES: 1}, {EXP: 2, MAN: 3, SUBNORM: 0, STAGES: 0}]
    random_points: [{EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}, {EXP: 8, MAN: 23, SUBNORM: 0, STAGES: 2}, {EXP: 8, MAN: 7, SUBNORM: 1, STAGES: 1}, {EXP: 5, MAN: 10, SUBNORM: 1, STAGES: 0}, {EXP: 5, MAN: 10, SUBNORM: 0, STAGES: 3}, {EXP: 6, MAN: 12, SUBNORM: 1, STAGES: 2}]
    expected_primitives:
      a7: "binary32: about 4 DSP48E1 (a 24 x 24 unsigned product tiled on the 25 x 18 signed multiplier), bfloat16 and binary16: 1 DSP48E1; 0 BRAM; about 150 to 250 LUT6 at binary32 (normaliser, exponent adder, rounding)"
      k26: "binary32: about 2 DSP48E2 (27 x 18 signed), bfloat16 and binary16: 1 DSP48E2; 0 BRAM; LUT use as a7 with CARRY8 cells"
    ooc_points: [{EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}, {EXP: 8, MAN: 23, SUBNORM: 0, STAGES: 3}, {EXP: 8, MAN: 7, SUBNORM: 1, STAGES: 3}, {EXP: 5, MAN: 10, SUBNORM: 1, STAGES: 3}, {EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 1}]
    mutant_run: [{mode: exhaustive, params: {EXP: 3, MAN: 2, SUBNORM: 1, STAGES: 0}}, {mode: exhaustive, params: {EXP: 3, MAN: 2, SUBNORM: 0, STAGES: 2}}, {mode: randomised, params: {EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}, n: 3000}, {mode: randomised, params: {EXP: 5, MAN: 10, SUBNORM: 0, STAGES: 1}, n: 3000}]
  lut:
    file: rtl/fp_mul_lut.sv
    module: fp_mul_lut
    deps: [fp_common/fp_pack.sv, fp_common/fp_norm.sv]
    params: {EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}
    throughput: "1 per clock"
    latency: "STAGES"
    tradeoff: "no DSP: the significand product is a shift-and-add array in LUTs and carry chains (about one LUT per partial-product bit), the longest combinational path and the most LUTs; for a part with no spare DSP, or a narrow format where a DSP would be mostly empty"
    exhaustive_points: [{EXP: 2, MAN: 1, SUBNORM: 1, STAGES: 0}, {EXP: 2, MAN: 2, SUBNORM: 1, STAGES: 0}, {EXP: 2, MAN: 2, SUBNORM: 0, STAGES: 1}, {EXP: 3, MAN: 2, SUBNORM: 1, STAGES: 2}, {EXP: 3, MAN: 2, SUBNORM: 0, STAGES: 3}, {EXP: 3, MAN: 3, SUBNORM: 1, STAGES: 3}, {EXP: 4, MAN: 2, SUBNORM: 1, STAGES: 1}, {EXP: 2, MAN: 3, SUBNORM: 0, STAGES: 0}]
    random_points: [{EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}, {EXP: 8, MAN: 23, SUBNORM: 0, STAGES: 2}, {EXP: 8, MAN: 7, SUBNORM: 1, STAGES: 1}, {EXP: 5, MAN: 10, SUBNORM: 1, STAGES: 0}, {EXP: 5, MAN: 10, SUBNORM: 0, STAGES: 3}, {EXP: 6, MAN: 12, SUBNORM: 1, STAGES: 2}]
    expected_primitives:
      a7: "0 DSP, 0 BRAM; binary32 about 24 adders of up to 48 bits in carry chains (several hundred CARRY4) and 600 to 1100 LUT6; bfloat16 and binary16 tens to about a hundred LUTs"
      k26: "0 DSP, 0 BRAM; as a7 with CARRY8 cells"
    ooc_points: [{EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}, {EXP: 8, MAN: 23, SUBNORM: 0, STAGES: 3}, {EXP: 8, MAN: 7, SUBNORM: 1, STAGES: 3}, {EXP: 5, MAN: 10, SUBNORM: 1, STAGES: 3}, {EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 1}]
    mutant_run: [{mode: exhaustive, params: {EXP: 3, MAN: 2, SUBNORM: 1, STAGES: 0}}, {mode: exhaustive, params: {EXP: 3, MAN: 2, SUBNORM: 0, STAGES: 2}}, {mode: randomised, params: {EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}, n: 3000}, {mode: randomised, params: {EXP: 5, MAN: 10, SUBNORM: 0, STAGES: 1}, n: 3000}]
