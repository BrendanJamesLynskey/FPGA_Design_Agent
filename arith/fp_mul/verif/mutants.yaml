# Mutation set for the floating-point multiplier variants (arith brief 139e; tools/run_mutants.py): each mutant replaces `old` (exactly once) by `new` in a copy of the file it names
# (the variant's own file, or `file`, relative to this folder, for a mutant of the shared fp_pack.sv or fp_norm.sv).
mutants:
- {name: dsp_add_not_mul, variant: dsp, class: operator, old: "assign pp2 = siga1 * sigb1;", new: "assign pp2 = siga1 + sigb1;", why: "an adder where the significand multiplier is"}
- {name: dsp_sign_and, variant: dsp, class: operator, old: "assign sg0 = sa ^ sb;", new: "assign sg0 = sa & sb;", why: "the product sign is the AND of the signs, not the xor"}
- {name: dsp_bias, variant: dsp, class: constant, old: "- $signed(EW'(BIAS));", new: "- $signed(EW'(BIAS + 1));", why: "the exponent bias subtracted is one too large"}
- {name: dsp_no_daz, variant: dsp, class: condition, old: "assign a_zero = (ea == '0) && (SUBNORM == 0 || fa == '0);          // a subnormal is a zero when flushing", new: "assign a_zero = (ea == '0) && (fa == '0);          // a subnormal is a zero when flushing", why: "flush-to-zero does not flush a subnormal first operand"}
- {name: dsp_inf_zero, variant: dsp, class: condition, old: "else if ((a_inf && b_zero) || (b_inf && a_zero)) sp_x0 = QNAN;", new: "else if (a_inf && b_zero)                        sp_x0 = QNAN;", why: "infinity times zero is NaN only in one operand order"}
- {name: dsp_zero_sign, variant: dsp, class: connection, old: "else if (a_zero || b_zero)                       sp_x0 = {sg0, {(W - 1){1'b0}}};", new: "else if (a_zero || b_zero)                       sp_x0 = {1'b0, {(W - 1){1'b0}}};", why: "a zero product is always +0"}
- {name: dsp_ftz_norm, variant: dsp, class: constant, old: "assign nrm = pp3[PW-1] ? pp3 : {pp3[PW-2:0], 1'b0};", new: "assign nrm = pp3[PW-1] ? pp3 : {pp3[PW-3:0], 2'b00};", why: "flush-to-zero normalisation shifts two places instead of one"}
- {name: dsp_eff_exp, variant: dsp, class: condition, old: "assign t0 = $signed(EW'(ea == '0 ? EXP'(1) : ea)) + $signed(EW'(eb == '0 ? EXP'(1) : eb)) - $signed(EW'(BIAS));", new: "assign t0 = $signed(EW'(ea)) + $signed(EW'(eb == '0 ? EXP'(1) : eb)) - $signed(EW'(BIAS));", why: "a subnormal first operand has exponent 0 instead of 1"}
- {name: dsp_rank1_sig, variant: dsp, class: connection, old: "siga1 <= siga0;", new: "siga1 <= sigb0;", why: "the first rank register takes the wrong significand"}
- {name: dsp_rank2_exp, variant: dsp, class: connection, old: "t2    <= t1;", new: "t2    <= t2;", why: "the second rank register never loads the exponent"}
- {name: dsp_out_reg_or, variant: dsp, class: operator, old: "always_ff @(posedge clk) y <= y_c;", new: "always_ff @(posedge clk) y <= y | y_c;", why: "the output register accumulates instead of loading"}
- {name: lut_shift, variant: lut, class: operator, old: "if (sigb1[i]) pp2 = pp2 + (PW'(siga1) << i);", new: "if (sigb1[i]) pp2 = pp2 + (PW'(siga1) << (i + 1));", why: "every partial product is shifted one place too far"}
- {name: lut_top_row, variant: lut, class: condition, old: "for (int i = 0; i < SP; i++) begin", new: "for (int i = 0; i < SP - 1; i++) begin", why: "the last partial product is not added"}
- {name: lut_row_select, variant: lut, class: condition, old: "if (sigb1[i]) pp2 = pp2 + (PW'(siga1) << i);", new: "if (sigb1[SP-1-i]) pp2 = pp2 + (PW'(siga1) << i);", why: "the multiplier bits are taken in reverse order"}
- {name: pk_ties_down, variant: dsp, file: ../fp_common/fp_pack.sv, class: condition, old: "assign inc   = guard & (rest | frac[0]);", new: "assign inc   = guard & rest;", why: "a tie always rounds down instead of to even"}
- {name: pk_ties_up, variant: lut, file: ../fp_common/fp_pack.sv, class: condition, old: "assign inc   = guard & (rest | frac[0]);", new: "assign inc   = guard;", why: "a tie always rounds up instead of to even"}
- {name: pk_no_round, variant: dsp, file: ../fp_common/fp_pack.sv, class: operator, old: "assign wsum = {ef, frac} + (EW + MAN)'(inc);", new: "assign wsum = {ef, frac} + (EW + MAN)'(0);", why: "the result is truncated"}
- {name: pk_denorm_threshold, variant: dsp, file: ../fp_common/fp_pack.sv, class: condition, old: "if (SUBNORM != 0 && er < 1) begin", new: "if (SUBNORM != 0 && er < 0) begin", why: "a result with biased exponent 0 is not denormalised"}
- {name: pk_denorm_sticky, variant: lut, file: ../fp_common/fp_pack.sv, class: connection, old: "assign rest  = (|nn[NW-3-MAN:0]) | st;", new: "assign rest  = (|nn[NW-3-MAN:0]);", why: "the bits lost by the denormalising shift are not part of the sticky bit"}
- {name: pk_overflow_compare, variant: dsp, file: ../fp_common/fp_pack.sv, class: condition, old: "if (int'(expo) >= (1 << EXP) - 1)                y = {sgn, {EXP{1'b1}}, {MAN{1'b0}}};", new: "if (int'(expo) > (1 << EXP) - 1)                 y = {sgn, {EXP{1'b1}}, {MAN{1'b0}}};", why: "a rounded exponent of all ones is not turned into an infinity"}
- {name: pk_flush_compare, variant: dsp, file: ../fp_common/fp_pack.sv, class: condition, old: "else if (SUBNORM == 0 && int'(expo) <= 0)        y = {sgn, {(EXP + MAN){1'b0}}};", new: "else if (SUBNORM == 0 && int'(expo) < 0)         y = {sgn, {(EXP + MAN){1'b0}}};", why: "flush-to-zero leaves a result with exponent field 0 as a subnormal pattern"}
- {name: nm_first_one, variant: dsp, file: ../fp_common/fp_norm.sv, class: condition, old: "if (v[i] && !found) begin", new: "if (v[i]) begin", why: "the leading-zero count takes the lowest set bit instead of the highest"}

