# Formal jobs of the floating-point multiplier (arith brief 139e; tools/run_formal.py). The fv top (fp_mul_fv.sv) holds both variants and fpx_ref (the specification as wide integer
# arithmetic, sharing no code with them); each variant is compared with the reference delayed by its latency. prove = k-induction (unbounded: for every input in every clock, any run length)
# at the formats listed, which are tiny because the SMT problem grows with the exponent range; larger formats are covered by simulation only. mutant jobs run on a copy with one seeded
# fault from verif/mutants.yaml and EXPECT a counterexample (the check can fail).
jobs:
- {name: eq_e2m1_s1_r33, top: fp_mul_fv, params: {EXP: 2, MAN: 1, SUBNORM: 1, ST_D: 3, ST_L: 3}, mode: prove, depth: 5, sources: [formal/fp_mul_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_mul_dsp.sv, rtl/fp_mul_lut.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'dsp (3 ranks) and lut (3 ranks) == the exact product rounded once, EXP 2 MAN 1, subnormals: proved for all inputs (k-induction)'}
- {name: eq_e2m2_s1_r32, top: fp_mul_fv, params: {EXP: 2, MAN: 2, SUBNORM: 1, ST_D: 3, ST_L: 2}, mode: prove, depth: 5, sources: [formal/fp_mul_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_mul_dsp.sv, rtl/fp_mul_lut.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'dsp (3 ranks) and lut (2 ranks) == the exact product rounded once, EXP 2 MAN 2, subnormals: proved for all inputs (k-induction)'}
- {name: eq_e2m2_s0_r10, top: fp_mul_fv, params: {EXP: 2, MAN: 2, SUBNORM: 0, ST_D: 1, ST_L: 0}, mode: prove, depth: 5, sources: [formal/fp_mul_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_mul_dsp.sv, rtl/fp_mul_lut.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'dsp (1 ranks) and lut (0 ranks) == the exact product rounded once, EXP 2 MAN 2, flush to zero: proved for all inputs (k-induction)'}
- {name: eq_e3m2_s1_r23, top: fp_mul_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_D: 2, ST_L: 3}, mode: prove, depth: 5, sources: [formal/fp_mul_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_mul_dsp.sv, rtl/fp_mul_lut.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'dsp (2 ranks) and lut (3 ranks) == the exact product rounded once, EXP 3 MAN 2, subnormals: proved for all inputs (k-induction)'}
- {name: eq_e3m2_s0_r31, top: fp_mul_fv, params: {EXP: 3, MAN: 2, SUBNORM: 0, ST_D: 3, ST_L: 1}, mode: prove, depth: 5, sources: [formal/fp_mul_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_mul_dsp.sv, rtl/fp_mul_lut.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'dsp (3 ranks) and lut (1 ranks) == the exact product rounded once, EXP 3 MAN 2, flush to zero: proved for all inputs (k-induction)'}
- {name: eq_e3m3_s1_r00, top: fp_mul_fv, params: {EXP: 3, MAN: 3, SUBNORM: 1, ST_D: 0, ST_L: 0}, mode: prove, depth: 5, sources: [formal/fp_mul_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_mul_dsp.sv, rtl/fp_mul_lut.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'dsp (0 ranks) and lut (0 ranks) == the exact product rounded once, EXP 3 MAN 3, subnormals: proved for all inputs (k-induction)'}
- {name: mutant_add_not_mul, top: fp_mul_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_D: 0, ST_L: 0}, mode: bmc, depth: 3, sources: [formal/fp_mul_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_mul_dsp.sv, rtl/fp_mul_lut.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault dsp_add_not_mul is refuted, mutant: dsp_add_not_mul}
- {name: mutant_lut_shift, top: fp_mul_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_D: 0, ST_L: 0}, mode: bmc, depth: 3, sources: [formal/fp_mul_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_mul_dsp.sv, rtl/fp_mul_lut.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault lut_shift is refuted, mutant: lut_shift}
- {name: mutant_zero_sign, top: fp_mul_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_D: 0, ST_L: 0}, mode: bmc, depth: 3, sources: [formal/fp_mul_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_mul_dsp.sv, rtl/fp_mul_lut.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault dsp_zero_sign is refuted, mutant: dsp_zero_sign}
- {name: mutant_ties_down, top: fp_mul_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_D: 0, ST_L: 0}, mode: bmc, depth: 3, sources: [formal/fp_mul_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_mul_dsp.sv, rtl/fp_mul_lut.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault pk_ties_down is refuted, mutant: pk_ties_down}
- {name: mutant_denorm_sticky, top: fp_mul_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_D: 0, ST_L: 0}, mode: bmc, depth: 3, sources: [formal/fp_mul_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_mul_dsp.sv, rtl/fp_mul_lut.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault pk_denorm_sticky is refuted, mutant: pk_denorm_sticky}
- {name: mutant_overflow_compare, top: fp_mul_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_D: 0, ST_L: 0}, mode: bmc, depth: 3, sources: [formal/fp_mul_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_mul_dsp.sv, rtl/fp_mul_lut.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault pk_overflow_compare is refuted, mutant: pk_overflow_compare}
