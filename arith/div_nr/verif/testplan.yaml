# div_nr testplan, schema v1 (brief 116 format; brief 139c). The agent wrote every requirement below from the owner's request; none is agreed by a human (`spec_status: draft`).
# Status is never typed here: `python -m flow.trace_v1 write arith/div_nr` computes it from the evidence files named in each item. Evidence is regenerated by the commands in `notes`.
schema: fpga-design-agent/testplan/v1
design: div_nr
notes: 'Arithmetic library function div_nr (brief 139c). Every requirement is a draft written by the agent from the owner''s request (spec_status: draft; only a human sets agreed). Evidence is generated
  by `python -m pytest arith/div_nr/tests --junitxml=results/139c_arith/div_nr_junit.xml` with ARITH_RECORD_DIR=results/139c_arith. The Lean items show ''statement not approved'': lean_approvals.yaml is
  a human''s. No Vivado run exists for this function (the build descriptions are prepared, not run), so there are no performance requirements.'
discover:
- glob: arith/div_nr/tests/test_*.py
  pattern: ^def (test_\w+)
requirements:
- id: DIVNR-F-MODEL
  kind: functional
  title: 'The model is the specification: the error of both variants is within the stated bound'
  text: 'For the reciprocal-multiply divider: both variants'' error (exact quotient minus result, in units of the last place, by exact rational arithmetic) is within the spec''s bound over every normalised
    pair at W = 8 (A = 2 to 6, IT = 1 to 3), W = 9 (A = 3 to 5, IT = 1 to 3) and W = 10 (A = 4, IT = 2), and over 15000 sampled pairs at ten (W, A, IT) points to W = 32; the Newton variant never exceeds
    the exact quotient; the residual and the iterates never overflow their widths (asserted at every step).'
  source: arith/div_nr/spec.md#the-function
  spec_status: draft
- id: DIVNR-F-RTL-EXH
  kind: functional
  title: Both variants are bit-exact against the model, for every pair at small widths
  text: 'Simulation (Icarus 14) of both variants against the model: every pair of normalised operands at W = 8 (A = 2 to 6, IT = 1 to 3) and W = 9 (A = 4, IT = 2), with input gaps; value, order and latency
    checked.'
  source: arith/div_nr/spec.md#the-function
  spec_status: draft
- id: DIVNR-F-RTL-RAND
  kind: functional
  title: Both variants are bit-exact against the model at large widths
  text: Simulation of both variants against the model with 4000 random and extreme pairs at W = 12, 16, 20, 24 and 32.
  source: arith/div_nr/spec.md#the-function
  spec_status: draft
- id: DIVNR-F-LAT
  kind: functional
  title: Latency and throughput are what the spec states
  text: The measured latency equals the spec (2 + 4 * IT for newton, 2 + 2 * IT for goldschmidt) for IT = 1 to 4 at W = 8, one result per clock with back-to-back inputs.
  source: arith/div_nr/spec.md#the-function
  spec_status: draft
- id: DIVNR-F-LINT
  kind: functional
  title: The RTL is Verilator -Wall clean
  text: Verilator -Wall --lint-only reports nothing for either variant at W = 8, 10, 16, 24 and 32 (IT = 1 to 3).
  source: arith/div_nr/spec.md#the-function
  spec_status: draft
- id: DIVNR-F-MUTANT
  kind: functional
  title: The bench catches seeded faults
  text: 'Each of 16 seeded faults (one text change in the RTL, verif/mutants.yaml) makes the bench fail: killed/total = 16/16.'
  source: arith/div_nr/spec.md#the-function
  spec_status: draft
- id: DIVNR-F-FORMAL-BOUND
  kind: functional
  title: Both variants meet their error bounds for all input sequences (SymbiYosys)
  text: 'SymbiYosys with the slang front end: each variant''s result q satisfies the error characterisation (two products, no shared code with the RTL) for all input sequences from reset, proved by k-induction
    at an induction depth above the latency (the datapath is a feed-forward pipeline): 6 jobs (newton and goldschmidt at W = 8 for three (A, IT) points each). 7 faults or an over-tight bound make the proof
    fail (bounded model checking), which shows the harness is not vacuous. Not proved for other widths.'
  source: arith/div_nr/spec.md#the-function
  spec_status: draft
- id: DIVNR-F-LEAN-GS
  kind: functional
  title: The exact Goldschmidt iteration keeps the ratio and squares the denominator's distance from 1 (Lean)
  text: 'For all integers: multiplying numerator and denominator by the same factor keeps n*b = d*a (so the numerator is the quotient when the denominator reaches 1.0), and the denominator update d(2S -
    d) has S*S - d*(2S - d) = (S - d)**2, hence never exceeds 1.0 once d <= S. Proved in Lean, statements not approved; the truncations of the RTL and the seed table''s accuracy are not in Lean (they are
    measured and proved at fixed widths by SymbiYosys).'
  source: arith/div_nr/spec.md#verification-everything-before-vivado
  spec_status: draft
- id: DIVNR-F-BUILD
  kind: functional
  title: Out-of-context build descriptions are prepared for Artix-7 and K26 (not run)
  text: 'For every variant of the reciprocal-multiply divider there is a build.yaml and an out-of-context clock constraint for xc7a100t and xck26, current against arith/tools/gen_build.py, consistent with
    the RTL (top, parameters, sources), with the expected primitive use evaluated for each point; the out-of-context wrapper lints clean and is functionally exact for every variant; the packaged verification
    harness (harness/run.py) passes on the library instance with every coverage bin hit. No Vivado run has been made: this requirement is about preparation, not about area, Fmax or power.'
  source: arith/div_nr/spec.md#prepared-for-vivado-not-run
  spec_status: draft
