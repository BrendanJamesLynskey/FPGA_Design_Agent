# Mutation set for the floating-point adder variants (arith brief 139e; tools/run_mutants.py): each mutant replaces `old` (exactly once) by `new` in a copy of the file it names
# (the variant's own file, or `file`, relative to this folder, for a mutant of the shared fp_pack.sv or fp_norm.sv, which both variants use).
# Mutants considered and dropped as EQUIVALENT (no input can tell them from the original), each with its reason, so that the 100 % kill rate is not hiding survivors:
#   - the aligner clamped at NS - 1 instead of NS: a shift of NS - 1 already leaves only the sticky bit set for a nonzero operand;
#   - dual_path without `|| (erx == '0)` in the near-path condition: the far path's two-place normalisation, with the effective exponent 1 of a subnormal sum, lands on exactly the
#     subnormal the denormalising shift would give, so the sum of two subnormals is the same on either path;
#   - dual_path's zero test on the far sum only: an exact cancellation on the near path has d = 0, where the far path's aligner also gives the same difference, zero;
#   - fp_pack without the denormalisation's sticky bit, for the ADDER: the sum has only zeros below the guard position wherever the result is subnormal (both exponents are 1, no shift), so
#     the bits that shift discards are always zero (the same mutant is killed in fp_mul and fp_fma, whose products and windows are wide).
mutants:
- {name: sp_no_sticky, variant: single_path, class: connection, old: "yal0 = {tsh[2*NS-1:NS+1], tsh[NS] | (|tsh[NS-1:0])};", new: "yal0 = {tsh[2*NS-1:NS+1], tsh[NS]};", why: "the bits shifted out of the aligner are not kept as a sticky bit"}
- {name: sp_sub_swapped, variant: single_path, class: operator, old: "assign s2 = es1 ? ({1'b0, x1} - {1'b0, y1}) : ({1'b0, x1} + {1'b0, y1});", new: "assign s2 = es1 ? ({1'b0, x1} + {1'b0, y1}) : ({1'b0, x1} - {1'b0, y1});", why: "add and subtract exchanged"}
- {name: sp_zero_sign, variant: single_path, class: condition, old: "y_c = {(es2 ? 1'b0 : sx2), {(W - 1){1'b0}}};", new: "y_c = {sx2, {(W - 1){1'b0}}};", why: "an exact cancellation takes the sign of the larger operand instead of +0"}
- {name: sp_exponent_off, variant: single_path, class: constant, old: "assign er = $signed(EW'(ex2)) + 1 - $signed(EW'(lz));", new: "assign er = $signed(EW'(ex2)) + 0 - $signed(EW'(lz));", why: "the result exponent is one too small"}
- {name: sp_no_daz, variant: single_path, class: condition, old: "assign ma = (SUBNORM == 0 && ea == '0) ? '0 : a[EXP+MAN-1:0];", new: "assign ma = a[EXP+MAN-1:0];", why: "flush-to-zero does not flush a subnormal first operand"}
- {name: sp_eff_exp, variant: single_path, class: condition, old: "assign ex  = (erx == '0) ? EXP'(1) : erx;", new: "assign ex  = erx;", why: "a subnormal larger operand keeps exponent 0 instead of 1"}
- {name: sp_inf_inf_same, variant: single_path, class: condition, old: "else if (a_inf && b_inf && sa != sb)   sp_x0 = QNAN;", new: "else if (a_inf && b_inf && sa == sb)   sp_x0 = QNAN;", why: "infinity plus infinity of the same sign is NaN"}
- {name: sp_nan_sign, variant: single_path, class: constant, old: "localparam logic [W-1:0]   QNAN = {1'b0, ONES, 1'b1, {(MAN - 1){1'b0}}};", new: "localparam logic [W-1:0]   QNAN = {1'b1, ONES, 1'b1, {(MAN - 1){1'b0}}};", why: "the canonical NaN has its sign set"}
- {name: sp_align_clamp, variant: single_path, class: constant, old: "dc   = (EW'(d) > EW'(NS)) ? EW'(NS) : EW'(d);", new: "dc   = (EW'(d) > EW'(NS - 2)) ? EW'(NS - 2) : EW'(d);", why: "a very small operand is not shifted entirely into the sticky bit"}
- {name: sp_rank1_operand, variant: single_path, class: connection, old: "x1    <= x0;", new: "x1    <= '0;", why: "the first rank register loses the larger operand"}
- {name: sp_out_reg_or, variant: single_path, class: operator, old: "always_ff @(posedge clk) y <= y_c;", new: "always_ff @(posedge clk) y <= y | y_c;", why: "the output register accumulates instead of loading"}
- {name: sp_rank2_sum, variant: single_path, class: connection, old: "s3    <= s2;", new: "s3    <= s3;", why: "the second rank register never loads the sum"}
- {name: du_near_range, variant: dual_path, class: constant, old: "assign near0 = (esub0 && d <= EXP'(1)) || (erx == '0);", new: "assign near0 = (esub0 && d <= EXP'(2)) || (erx == '0);", why: "the near path is used for an exponent difference of 2, which its aligner does not handle"}
- {name: du_far_shift2, variant: dual_path, class: constant, old: "else                begin lz_f = 2'd2; nrm_f = sf3 << 2; end", new: "else                begin lz_f = 2'd2; nrm_f = sf3 << 1; end", why: "the far path's two-place normalisation shifts one place"}
- {name: du_far_test, variant: dual_path, class: condition, old: "else if (sf3[WS-2]) begin lz_f = 2'd1; nrm_f = sf3 << 1; end", new: "else if (sf3[WS-3]) begin lz_f = 2'd1; nrm_f = sf3 << 1; end", why: "the far path tests the wrong bit for a one-place shift"}
- {name: du_near_align, variant: dual_path, class: constant, old: "ynr0 = (d == EXP'(1)) ? ({sigy, 3'b000} >> 1) : {sigy, 3'b000};", new: "ynr0 = (d == EXP'(1)) ? ({sigy, 3'b000} >> 2) : {sigy, 3'b000};", why: "the near path's one-place alignment shifts two places"}
- {name: du_select_swapped, variant: dual_path, class: operator, old: "assign nrm = nr2 ? nrm_n : nrm_f;", new: "assign nrm = nr2 ? nrm_f : nrm_n;", why: "the path selector is inverted for the significand"}
- {name: du_no_sticky, variant: dual_path, class: connection, old: "yal0 = {tsh[2*NS-1:NS+1], tsh[NS] | (|tsh[NS-1:0])};", new: "yal0 = {tsh[2*NS-1:NS+1], tsh[NS]};", why: "the far path's aligner does not keep a sticky bit"}
- {name: pk_ties_down, variant: single_path, file: ../fp_common/fp_pack.sv, class: condition, old: "assign inc   = guard & (rest | frac[0]);", new: "assign inc   = guard & rest;", why: "a tie always rounds down instead of to even"}
- {name: pk_ties_up, variant: dual_path, file: ../fp_common/fp_pack.sv, class: condition, old: "assign inc   = guard & (rest | frac[0]);", new: "assign inc   = guard;", why: "a tie always rounds up instead of to even"}
- {name: pk_no_round, variant: single_path, file: ../fp_common/fp_pack.sv, class: operator, old: "assign wsum = {ef, frac} + (EW + MAN)'(inc);", new: "assign wsum = {ef, frac} + (EW + MAN)'(0);", why: "the result is truncated"}
- {name: pk_guard_bit, variant: single_path, file: ../fp_common/fp_pack.sv, class: constant, old: "assign guard = nn[NW-2-MAN];", new: "assign guard = nn[NW-3-MAN];", why: "the guard bit is the bit below the real one"}
- {name: pk_denorm_threshold, variant: single_path, file: ../fp_common/fp_pack.sv, class: condition, old: "if (SUBNORM != 0 && er < 1) begin", new: "if (SUBNORM != 0 && er < 0) begin", why: "a result with biased exponent 0 is not denormalised"}
- {name: pk_denorm_shift, variant: dual_path, file: ../fp_common/fp_pack.sv, class: constant, old: "kc = 1 - int'(er);", new: "kc = 2 - int'(er);", why: "a subnormal result is shifted one place too far"}
- {name: pk_overflow_compare, variant: single_path, file: ../fp_common/fp_pack.sv, class: condition, old: "if (int'(expo) >= (1 << EXP) - 1)                y = {sgn, {EXP{1'b1}}, {MAN{1'b0}}};", new: "if (int'(expo) > (1 << EXP) - 1)                 y = {sgn, {EXP{1'b1}}, {MAN{1'b0}}};", why: "a rounded exponent of all ones is not turned into an infinity"}
- {name: pk_flush_compare, variant: single_path, file: ../fp_common/fp_pack.sv, class: condition, old: "else if (SUBNORM == 0 && int'(expo) <= 0)        y = {sgn, {(EXP + MAN){1'b0}}};", new: "else if (SUBNORM == 0 && int'(expo) < 0)         y = {sgn, {(EXP + MAN){1'b0}}};", why: "flush-to-zero leaves a result with exponent field 0 as a subnormal pattern"}
- {name: nm_first_one, variant: single_path, file: ../fp_common/fp_norm.sv, class: condition, old: "if (v[i] && !found) begin", new: "if (v[i]) begin", why: "the leading-zero count takes the lowest set bit instead of the highest"}
