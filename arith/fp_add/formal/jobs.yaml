# Formal jobs of the floating-point adder (arith brief 139e; tools/run_formal.py). The fv top (fp_add_fv.sv) holds both variants and fpx_ref (the specification as wide integer
# arithmetic, sharing no code with them); each variant is compared with the reference delayed by its latency. prove = k-induction (unbounded: for every input in every clock, any run length)
# at the formats listed, which are tiny because the SMT problem grows with the exponent range; larger formats are covered by simulation only. mutant jobs run on a copy with one seeded
# fault from verif/mutants.yaml and EXPECT a counterexample (the check can fail).
jobs:
- {name: eq_e2m1_s1_r33, top: fp_add_fv, params: {EXP: 2, MAN: 1, SUBNORM: 1, ST_S: 3, ST_D: 3}, mode: prove, depth: 5, sources: [formal/fp_add_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_add_single.sv, rtl/fp_add_dual.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'single_path (3 ranks) and dual_path (3 ranks) == the exact sum rounded once, EXP 2 MAN 1, subnormals: proved for all inputs (k-induction)'}
- {name: eq_e2m2_s1_r32, top: fp_add_fv, params: {EXP: 2, MAN: 2, SUBNORM: 1, ST_S: 3, ST_D: 2}, mode: prove, depth: 5, sources: [formal/fp_add_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_add_single.sv, rtl/fp_add_dual.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'single_path (3 ranks) and dual_path (2 ranks) == the exact sum rounded once, EXP 2 MAN 2, subnormals: proved for all inputs (k-induction)'}
- {name: eq_e2m2_s0_r10, top: fp_add_fv, params: {EXP: 2, MAN: 2, SUBNORM: 0, ST_S: 1, ST_D: 0}, mode: prove, depth: 5, sources: [formal/fp_add_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_add_single.sv, rtl/fp_add_dual.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'single_path (1 ranks) and dual_path (0 ranks) == the exact sum rounded once, EXP 2 MAN 2, flush to zero: proved for all inputs (k-induction)'}
- {name: eq_e3m2_s1_r23, top: fp_add_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_S: 2, ST_D: 3}, mode: prove, depth: 5, sources: [formal/fp_add_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_add_single.sv, rtl/fp_add_dual.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'single_path (2 ranks) and dual_path (3 ranks) == the exact sum rounded once, EXP 3 MAN 2, subnormals: proved for all inputs (k-induction)'}
- {name: eq_e3m2_s0_r31, top: fp_add_fv, params: {EXP: 3, MAN: 2, SUBNORM: 0, ST_S: 3, ST_D: 1}, mode: prove, depth: 5, sources: [formal/fp_add_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_add_single.sv, rtl/fp_add_dual.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'single_path (3 ranks) and dual_path (1 ranks) == the exact sum rounded once, EXP 3 MAN 2, flush to zero: proved for all inputs (k-induction)'}
- {name: eq_e3m3_s1_r00, top: fp_add_fv, params: {EXP: 3, MAN: 3, SUBNORM: 1, ST_S: 0, ST_D: 0}, mode: prove, depth: 5, sources: [formal/fp_add_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_add_single.sv, rtl/fp_add_dual.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: 'single_path (0 ranks) and dual_path (0 ranks) == the exact sum rounded once, EXP 3 MAN 3, subnormals: proved for all inputs (k-induction)'}
- {name: mutant_sub_swapped, top: fp_add_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_S: 0, ST_D: 0}, mode: bmc, depth: 3, sources: [formal/fp_add_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_add_single.sv, rtl/fp_add_dual.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault sp_sub_swapped is refuted, mutant: sp_sub_swapped}
- {name: mutant_no_sticky, top: fp_add_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_S: 0, ST_D: 0}, mode: bmc, depth: 3, sources: [formal/fp_add_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_add_single.sv, rtl/fp_add_dual.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault sp_no_sticky is refuted, mutant: sp_no_sticky}
- {name: mutant_select_swapped, top: fp_add_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_S: 0, ST_D: 0}, mode: bmc, depth: 3, sources: [formal/fp_add_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_add_single.sv, rtl/fp_add_dual.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault du_select_swapped is refuted, mutant: du_select_swapped}
- {name: mutant_far_shift2, top: fp_add_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_S: 0, ST_D: 0}, mode: bmc, depth: 3, sources: [formal/fp_add_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_add_single.sv, rtl/fp_add_dual.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault du_far_shift2 is refuted, mutant: du_far_shift2}
- {name: mutant_ties_down, top: fp_add_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_S: 0, ST_D: 0}, mode: bmc, depth: 3, sources: [formal/fp_add_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_add_single.sv, rtl/fp_add_dual.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault pk_ties_down is refuted, mutant: pk_ties_down}
- {name: mutant_denorm_shift, top: fp_add_fv, params: {EXP: 3, MAN: 2, SUBNORM: 1, ST_S: 0, ST_D: 0}, mode: bmc, depth: 3, sources: [formal/fp_add_fv.sv, ../fp_common/fpx_ref.sv, rtl/fp_add_single.sv, rtl/fp_add_dual.sv, ../fp_common/fp_pack.sv, ../fp_common/fp_norm.sv], claim: a build with the seeded fault pk_denorm_shift is refuted, mutant: pk_denorm_shift}
