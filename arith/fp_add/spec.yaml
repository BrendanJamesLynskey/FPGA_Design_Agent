# Machine-readable specification of the floating-point adder (arith brief 139e). The prose is spec.md; the two agree (tests/test_fp_add_package.py).
schema: fda-arith/spec/1
function: fp_add
title: Floating-point adder (IEEE-754-style binary formats)
model: arith/fp_add/model.py
summary: "y = a + b for a binary floating-point format of EXP exponent and MAN fraction bits (binary32 is 8/23, bfloat16 8/7, binary16 5/10; any EXP >= 2 and MAN >= 1 works), one correctly rounded result per clock (round to nearest, ties to even), with the special cases fixed and documented. Two structures trade the length of the combinational path against LUTs: a single datapath, and a near/far dual datapath with a shorter normalisation. Each takes STAGES register ranks (0 to 3) and a SUBNORM switch between full subnormal support and flush-to-zero."
semantics:
  - "format: sign (1 bit), exponent (EXP bits, bias 2**(EXP-1) - 1), fraction (MAN bits); y has the same format. An exponent field of all ones is infinity (fraction 0) or NaN (fraction nonzero); a field of 0 is zero (fraction 0) or subnormal"
  - "y is the exact sum a + b rounded ONCE to nearest, ties to even (so the result is the correctly rounded sum; there is no other rounding mode and no exception flag)"
  - "NaN: any NaN input, and infinity + (-infinity), give the canonical quiet NaN (sign 0, exponent all ones, fraction msb 1, rest 0); NaN payloads and signs are not propagated"
  - "infinity: infinity + a finite number is that infinity; infinity + infinity of the same sign is that infinity; a finite sum too large to round to a finite number is an infinity of the sign of the sum"
  - "zeros: x + (-x) is +0 for finite nonzero x; (+0) + (-0) is +0; (-0) + (-0) is -0; (+0) + (+0) is +0; zero plus a nonzero number is that number"
  - "SUBNORM = 1: subnormal inputs and outputs follow IEEE 754 (gradual underflow, the sum of two numbers of the format is exact whenever the exact value is a multiple of the subnormal step, which every sum is when it is small)"
  - "SUBNORM = 0 (flush to zero): a subnormal input is read as a zero of its own sign (denormals-are-zero) and a result smaller in magnitude than the smallest normal number, after rounding with an unbounded exponent range, is replaced by a zero of the result's sign"
  - "the model (fp_common/fp_ref.py) adds with exact rational arithmetic and rounds once; the RTL aligns, adds on SP + 3 bits (guard, round, sticky), normalises and rounds, and equals the model for every input (exhaustive at small formats, proved by SymbiYosys at tiny formats, random elsewhere)"
ports:
  - {name: clk, dir: in, width: 1, text: "clock; unused (kept for a common port list) when STAGES is 0"}
  - {name: a, dir: in, width: "EXP+MAN+1", text: "first operand, an IEEE-style bit pattern {sign, exponent, fraction}"}
  - {name: b, dir: in, width: "EXP+MAN+1", text: "second operand"}
  - {name: y, dir: out, width: "EXP+MAN+1", text: "the correctly rounded sum, same format; STAGES clocks after the operands"}
parameters:
  EXP: {min: 2, text: "exponent bits (8 for binary32 and bfloat16, 5 for binary16)"}
  MAN: {min: 1, text: "stored fraction bits (23 for binary32, 7 for bfloat16, 10 for binary16)"}
  SUBNORM: {values: [0, 1], text: "1: subnormal numbers supported (IEEE 754); 0: flush to zero, smaller and faster"}
  STAGES: {min: 0, text: "register ranks, 0 to 3: the latency in clocks (above 3 behaves as 3)"}
signedness: "sign-magnitude as IEEE 754: the top bit of a, b and y is the sign; there is no two's complement reading"
exactness: "exact in the sense of IEEE 754: y is the correctly rounded value of the exact sum (round to nearest, ties to even), for every input including zeros, subnormals (SUBNORM = 1), infinities and NaNs; the error is at most half a unit in the last place (0.5 ulp) except where the result is flushed or overflows"
latency_definition: "clocks from the operands being presented to y being valid; 0 means combinational; throughput is one sum per clock in every variant"
contract:
  protocol: "plain registered-or-combinational ports, no handshake: operands are sampled every clock and one sum leaves, with no valid, ready or backpressure. A caller that needs a valid bit delays its own valid by STAGES"
  throughput: "one sum per clock in every variant (initiation interval 1)"
  latency: "per variant, in clocks: STAGES (0 to 3) for both single_path and dual_path"
  reset: "none: no control state; the rank registers hold data only and y is meaningless for STAGES clocks after power-up"
  clock: "one clock, rising edge, no clock-enable and no gating; clk is present but unused when STAGES is 0"
  stall: "none: the pipeline cannot be frozen (no enable)"
integration:
  port_timing: "STAGES 0 is one long combinational path from a and b to y (two barrel shifters and an adder in series: expect many nanoseconds at binary32); STAGES 1 registers only y, so the path from a and b is still the whole adder; STAGES 3 splits it into align, add and normalise-and-round, each about a third, with a register on y so the block sits between ordinary registers with a full clock on both sides only at STAGES 3 (the input side is the aligner, not a register)"
  constraints: "no multicycle or false paths, one clock. Keep the rank registers as written (do not retime across the aligner with keep or dont_touch changes if the latency must be exactly STAGES; Vivado does not retime unless asked). The shifters are wide multiplexers: floorplan the block in one region at binary32. The flush-to-zero build (SUBNORM 0) removes the denormalising shifter at the output"
guess_wrong:
  - "the result is correctly rounded to nearest, ties to even; there is no rounding-mode input, no sticky or exception flag output (overflow, underflow, inexact, invalid)"
  - "every NaN result is the canonical quiet NaN (sign 0, fraction 0x400000 for binary32): the payload and sign of an input NaN are NOT propagated, and a signalling NaN is not distinguished"
  - "with SUBNORM = 0 a subnormal INPUT is treated as zero: 1.0 + (a subnormal) = 1.0, and (subnormal) + (subnormal) = +0 or -0 by the zero rules. A result is flushed when it is below the smallest normal number after rounding with an unbounded exponent range; a sum that rounds up to exactly the smallest normal number is NOT flushed"
  - "x + (-x) is +0, never -0 (round to nearest); only (-0) + (-0) gives -0"
  - "there is no valid, ready or reset: for STAGES clocks after power-up y is not meaningful, and a change of EXP, MAN or SUBNORM is a different block, not a mode"
  - "STAGES is the number of register ranks and the latency, not a retiming request. Above 3 it behaves as 3; values outside the ranges in the table above (EXP below 2, MAN below 1) are not rejected by an assertion"
  - "the exponent bias is 2**(EXP-1) - 1 for every EXP; EXP = 8, MAN = 7 is bfloat16 (NOT binary16, which is EXP = 5, MAN = 10); half-precision formats other than these two are not checked against any external library"

lean_note: "Core Lean (4.36, no Mathlib) has no IEEE-754 library (Flocq is a Coq library). The rounding and special-case rules are stated in \"Function\" above and written as a program in fp_common/fp_ref.py (exact rational arithmetic, one rounding); they are checked against NumPy's float32 and float16, against an enumeration of every value of a tiny format, by simulation of every variant, and by SymbiYosys proofs against a wide-integer specification at tiny formats. None of that is a Lean proof. Lean (formal/lean/Arith/Float.lean) states only three small integer facts that the RTL relies on: that the rounding increment added to the packed {exponent, fraction} pattern carries into the exponent, that left-normalising by the leading-zero count puts the leading one at the top, and that the guard-and-sticky rule is round-to-nearest with ties to even. They are proved for all widths; the statements are NOT approved (verif/lean_approvals.yaml is empty), so the matrix shows \"statement not approved\". Marked research and not attempted: that fp_ref.py's rounding is IEEE roundTiesToEven for every format and exponent range (it needs a real-number or rational model of the format, as Flocq gives in Coq), and the adder's alignment-with-sticky argument (a sticky bit OR-ed into the last place of the aligned operand gives the correct rounding because three bits are kept below the significand and the larger operand's low bits are zero). Those are covered by simulation and by the proofs at the tiny formats only."

variants:
  single_path:
    file: rtl/fp_add_single.sv
    module: fp_add_single
    deps: [fp_common/fp_pack.sv, fp_common/fp_norm.sv]
    params: {EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}
    throughput: "1 per clock"
    latency: "STAGES"
    tradeoff: "the smallest in LUTs (two barrel shifters, one adder); both shifters are the full width, so the combinational path is the longest and a binary32 sum needs about 3 register ranks to reach a high clock"
    exhaustive_points: [{EXP: 2, MAN: 1, SUBNORM: 1, STAGES: 0}, {EXP: 2, MAN: 2, SUBNORM: 1, STAGES: 0}, {EXP: 2, MAN: 2, SUBNORM: 0, STAGES: 1}, {EXP: 3, MAN: 2, SUBNORM: 1, STAGES: 2}, {EXP: 3, MAN: 2, SUBNORM: 0, STAGES: 3}, {EXP: 3, MAN: 3, SUBNORM: 1, STAGES: 3}, {EXP: 4, MAN: 2, SUBNORM: 1, STAGES: 1}, {EXP: 2, MAN: 3, SUBNORM: 0, STAGES: 0}]
    random_points: [{EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}, {EXP: 8, MAN: 23, SUBNORM: 0, STAGES: 2}, {EXP: 8, MAN: 7, SUBNORM: 1, STAGES: 1}, {EXP: 5, MAN: 10, SUBNORM: 1, STAGES: 0}, {EXP: 5, MAN: 10, SUBNORM: 0, STAGES: 3}, {EXP: 6, MAN: 12, SUBNORM: 1, STAGES: 2}]
    expected_primitives:
      a7: "0 DSP, 0 BRAM; about 450 to 600 LUT6 and 60 CARRY4 at binary32 (two 27-bit barrel shifters of about 5 LUT levels each, one 28-bit adder); flip-flops only for the rank registers (about 100 per rank at STAGES 3)"
      k26: "0 DSP, 0 BRAM; as a7 with CARRY8 cells"
    ooc_points: [{EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}, {EXP: 8, MAN: 23, SUBNORM: 0, STAGES: 3}, {EXP: 8, MAN: 7, SUBNORM: 1, STAGES: 2}, {EXP: 5, MAN: 10, SUBNORM: 1, STAGES: 2}, {EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 1}]
    mutant_run: [{mode: exhaustive, params: {EXP: 3, MAN: 2, SUBNORM: 1, STAGES: 0}}, {mode: exhaustive, params: {EXP: 3, MAN: 2, SUBNORM: 0, STAGES: 2}}, {mode: randomised, params: {EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}, n: 3000}, {mode: randomised, params: {EXP: 5, MAN: 10, SUBNORM: 0, STAGES: 1}, n: 3000}]
  dual_path:
    file: rtl/fp_add_dual.sv
    module: fp_add_dual
    deps: [fp_common/fp_pack.sv, fp_common/fp_norm.sv]
    params: {EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}
    throughput: "1 per clock"
    latency: "STAGES"
    tradeoff: "a near path (exponents differ by at most 1, or a subnormal operand: a one-bit alignment, an adder and a full leading-zero count) and a far path (a full-width aligner, an adder and a normalisation of at most two places) computed side by side and selected before rounding; no path has both a full-width aligner and a full-width normaliser, so the combinational path is shorter, for about one more adder and one more small shifter in LUTs"
    exhaustive_points: [{EXP: 2, MAN: 1, SUBNORM: 1, STAGES: 0}, {EXP: 2, MAN: 2, SUBNORM: 1, STAGES: 0}, {EXP: 2, MAN: 2, SUBNORM: 0, STAGES: 1}, {EXP: 3, MAN: 2, SUBNORM: 1, STAGES: 2}, {EXP: 3, MAN: 2, SUBNORM: 0, STAGES: 3}, {EXP: 3, MAN: 3, SUBNORM: 1, STAGES: 3}, {EXP: 4, MAN: 2, SUBNORM: 1, STAGES: 1}, {EXP: 2, MAN: 3, SUBNORM: 0, STAGES: 0}]
    random_points: [{EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}, {EXP: 8, MAN: 23, SUBNORM: 0, STAGES: 2}, {EXP: 8, MAN: 7, SUBNORM: 1, STAGES: 1}, {EXP: 5, MAN: 10, SUBNORM: 1, STAGES: 0}, {EXP: 5, MAN: 10, SUBNORM: 0, STAGES: 3}, {EXP: 6, MAN: 12, SUBNORM: 1, STAGES: 2}]
    expected_primitives:
      a7: "0 DSP, 0 BRAM; about 1.3 to 1.6 times the LUTs of single_path at binary32 (a second adder and a three-way small shifter, plus the near path's 1-bit aligner and its own leading-zero counter and shifter); shorter longest path; flip-flops only for the rank registers (more bits per rank than single_path: both paths' operands are registered)"
      k26: "0 DSP, 0 BRAM; as a7 with CARRY8 cells"
    ooc_points: [{EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}, {EXP: 8, MAN: 23, SUBNORM: 0, STAGES: 3}, {EXP: 8, MAN: 7, SUBNORM: 1, STAGES: 2}, {EXP: 5, MAN: 10, SUBNORM: 1, STAGES: 2}, {EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 1}]
    mutant_run: [{mode: exhaustive, params: {EXP: 3, MAN: 2, SUBNORM: 1, STAGES: 0}}, {mode: exhaustive, params: {EXP: 3, MAN: 2, SUBNORM: 0, STAGES: 2}}, {mode: randomised, params: {EXP: 8, MAN: 23, SUBNORM: 1, STAGES: 3}, n: 3000}, {mode: randomised, params: {EXP: 5, MAN: 10, SUBNORM: 0, STAGES: 1}, n: 3000}]
