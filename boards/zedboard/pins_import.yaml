board: zedboard
out: boards/zedboard/zedboard-pins.xdc
title: "ZedBoard (Avnet and Digilent, xc7z020clg484-1): PL pins whose I/O standard the sources fix"
sources:
  - {id: ZED_XDC, url: https://raw.githubusercontent.com/Digilent/digilent-xdc/c8644a9fe31cc803789643124545d56b3bef4600/Zedboard-Master.xdc, sha256: 4c3ae9d40dce0cb0ca86fdd381a3ec05e0cc099c6f17f8299e270690b2b58b5c, format: xdc, licence: "Avnet design resource, header says publication needs Avnet's consent; not copied, only pin facts are listed", use: "pin locations and names"}
  - {id: ZED_BOARDFILE, url: https://raw.githubusercontent.com/Xilinx/XilinxBoardStore/40fad97cf36f3d856c6759d83c2390de1566ffa7/boards/Avnet/zedboard/1.4/part0_pins.xml, sha256: 732296bd482fe6a0f8d057589703c7f314c02c399787edd6dec3d2b9c034a271, format: board-store-xml, licence: "Avnet, Apache-2.0", use: "the I/O standard of each pin it lists"}
rename:
  - ['^LD(\d)$', 'LD[\1]']
  - ['^SW(\d)$', 'SW[\1]']
iostandard:
  std_from_pin: true
  by_name:
    - ['^(BTN[CDLRU]|SW\[)', 'LVCMOS18']
    - ['^J[A-D]\d', 'LVCMOS33']
  by_name_reason: "BTN* and SW*: banks 34 and 35, Vadj = 1.8 V, owner-confirmed 2026-11-17 (both boards: J18 on 1V8, JP6 removed), matching the Avnet XDC's bank constraint (LVCMOS18); Pmod JA to JD: the Avnet XDC labels all four 'Bank 13' and sets bank 13 to LVCMOS33 (not a Vadj bank)"
  only: [LVCMOS33, LVCMOS18]
  only_reason: "the AMD board file assigns LVCMOS25 to some Vadj-bank pins, which contradicts the owner-confirmed 1.8 V; those pins stay out"
section_by:
  - ['^GCLK$', 'PL clock']
  - ['^LD\[', 'LEDs']
  - ['^BTN', 'Push buttons (Vadj bank, 1.8 V)']
  - ['^SW\[', 'Slide switches (Vadj bank, 1.8 V)']
  - ['^J[A-D]', 'Pmod (bank 13, 3.3 V)']
