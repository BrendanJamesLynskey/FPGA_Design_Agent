# Kria KR260 Robotics Starter Kit (AMD): K26 SOM (XCK26, Zynq UltraScale+) on the KR260 carrier.
# First board file for this board in the flow. Facts come from the knowledge bank (board/kr260/*), which
# cites AMD UG1092 r1.1 and the AMD kr260_som/kr260_carrier 1.1 board files shipped with Vivado (Apache-2.0); pins of
# the PL Ethernet ports are resolved from those board files (designs/b58a_trigger/design.xdc).
name: kr260
vendor: AMD
part: xck26-sfvc784-2LV-c
master_xdc: kr260-pins.xdc         # brief 98: our own listing (tools/board_pins_import.py) of the pins this repository's designs use; not a vendor file
master_xdc_source:
  kind: derived
  tool: tools/board_pins_import.py
  spec: boards/kr260/pins_import.yaml
  note: the clock, user LEDs and PL Ethernet pins come from the AMD board files (kr260_carrier 1.1 and kr260_som 1.1, Apache-2.0) through designs/b58a_trigger/design.xdc; the SFP+ control and I2C pins through designs/b96_kr260_10g/design.xdc, which the board run of 2026-11-17 used; the GTH pins are in `gt:` below, they have no I/O standard
clock:
  port: clk_25
  pin: C3                         # HPA_CLK0P, bank 66, LVCMOS18; 25 MHz: schematic XTP743 page 16 labels the 25 MHz LVCMOS (PL GEM2&3) clock (SiT1602 25.000 MHz, BOM U92, through the LMK1C1104 buffer U91 and 0 ohm R477 to HPA_CLK0P_CLK); brief 174
  freq_mhz: 25
pl_ethernet:                      # TI DP83867 PHYs (DP83867CSRGZT, refs U36, U79, U80, U81; the schematic text puts U79 on GEM2), RGMII, 1.8 V HP banks
  # brief 174 CORRECTION (2026-11-22): this entry said Marvell M88E1111. AMD's carrier BOM (XTP757, row 60: DP83867CSRGZT, 4 parts) and the
  # schematic (XTP743, four PHY sheets, first on page 18, carry DP83867CSRGZ) name the TI DP83867; the knowledge-bank claim could not be re-read
  # here (UG1092 is not on disk). Consequence for designs/b58a_trigger: its PHY register plan (Marvell register 20 bits 7 and 1) and the RGMII
  # timing notes citing the 88E1111 datasheet do not apply to a DP83867 (its delays are in RGMIICTL/RGMIIDCTL); the design was never run on the board.
  # Sources: packages/kr260/board_facts.yaml (chip.phy.DP83867). The 5 pF input figure of brief 162 is the DP83867's (SNLS504G).
  phy_part: DP83867
  port_a: {connector: J10B, name: Ethernet 2, phy: PHY2, rx_clk: D4, tx_clk: A2, reset_n: B1, mdio: F3, mdc: G3}
  port_b: {connector: J10A, name: Ethernet 3, phy: PHY3, rx_clk: K4, tx_clk: J1, reset_n: K1, mdio: T8, mdc: R8}
gt:                               # GTH transceivers on the PL (brief 56A; flow/gt_plan.py, flow/gt_gates.py)
  sfp:                            # SFP+ cage J24 (UG1092); pins and sites resolved on Vivado 2026.1 (results/56a_serdes/gt_sites.txt)
    lanes: 1
    channel: X0Y6                 # GTHE4_CHANNEL_X0Y6, quad 224 (GTHE4_COMMON_X0Y1), channel 2
    rx: {p: T2, n: T1}
    tx: {p: R4, n: R3}
    refclk: {source: "X0Y6 clk0", mhz: 156.25, p: Y6, n: Y5, status: "pins confirmed (Vivado package database: MGTREFCLK0P/N_224); frequency CONFIRMED by brief 174 against AMD's carrier files: BOM XTP757 U90 (Raltron XCO583IV11-156.250, LVDS) and schematic XTP743 page 16 label '156.25 MHz LVDS (GTH SFP+)' on GTH_REFCLK0 (before brief 174: unconfirmed, two third-party sources agreed on 156.25 MHz); only the 156.25 family (156.25, 312.5, 161.1328125, 322.265625 MHz) reaches 10.3125 Gb/s exactly through the QPLL0 integer dividers; 100 or 125 MHz would need the fractional-N divider (not built), see designs/b96_kr260_10g/docs/design.md"}
    speed: {line_rate_gbps_max: 12.5, note: "K26 -2LV GTH maximum (DS925 table 99, brief 56A); 10.3125 Gb/s is inside the QPLL0 divider-1 window 9.8 to 12.5; the SFP+ cage J24 carries one lane (UG1092)"}
    control: {tx_disable: Y10, mod_abs: W10, rx_los: J12, tx_fault: A10, i2c_scl: AB11, i2c_sda: AC11, level: LVCMOS33, status: "I2C pins confirmed (AMD board file sfp_iic: som240_2 b49/b50); SOM-to-package pins confirmed (AMD board files); the TX_DISABLE, MOD_ABS, RX_LOS and TX_FAULT functions were exercised on the owner's board on 2026-11-17 (results/b96/hw/20261117_101326/stage3.json: polarity_ok true, rx_los 1 with the laser off and 0 with it on, mod_abs 0 with the module fitted, tx_fault 0); they are still not checked against the schematic"}
user_leds: [F8, E8]               # LVCMOS18
resources:                        # brief 98: names a design maps its ports to (core tool board_constraints); every other master-XDC port is also a resource
  clk: clk_25                     # 25 MHz on HPA_CLK0P: the frequency is unconfirmed (an open-source reference design's figure; no board measurement)
  led: ["led[0]", "led[1]"]
  sfp_tx_disable: sfp_tx_disable  # SFP+ cage J24 control and I2C (3.3 V): the board run of 2026-11-17 used these pins and read the module
  sfp_mod_abs: sfp_mod_abs
  sfp_rx_los: sfp_rx_los
  sfp_tx_fault: sfp_tx_fault
  sfp_i2c_scl: sfp_i2c_scl
  sfp_i2c_sda: sfp_i2c_sda
measured_on_board:                # brief 96 stage 3, 2026-11-17, the owner's board, wall power, SRAM only; records in results/b96/hw/
  evidence: [results/b96/hw/20261117_101326/stage3.json, results/b96/hw/20261117_095236.program.json]
  jtag_chain: "xck26 then arm_dap (a cascaded chain; results/b96/hw/20261117_095236.program.json device xck26_0); the K26's USER4 instruction is 0x923 in the 12-bit IR with the DAP in BYPASS, a 65-bit DR (brief 96 report, stage 3; the register script that measured it is not a committed record)"
  sfp_lane: "GTHE4_CHANNEL_X0Y6 (quad 224): the link came up and locked on 100 of 100 restarts (stage3.json, restarts.failed_to_lock = 0)"
  sfp_refclk: "156.25 MHz on Y6/Y5 (MGTREFCLK0 of quad 224) worked: the link came up"
  sfp_control_pins: "the pins in designs/b96_kr260_10g/design.xdc (tx_disable Y10, mod_abs W10, rx_los J12, tx_fault A10, I2C AB11/AC11, LVCMOS33) worked: module identity and diagnostics were read (stage3.json module, ddm_start)"
  not_measured: "the 25 MHz clock on C3 (the design's free-running clock came from it through an MMCM, so a 25 MHz input is likely, but no run measured its frequency), the PL Ethernet ports and the user LEDs (built in results/b58a, never run on the board)"

host_access: JTAG cable (BSCANE2 USER4 register bus, designs/b58a_trigger/rtl/jtag_bus.sv); no PL UART pins
slow_ports:
  - 'led\[\d+\]'
  - '[ab]_rst_n'
  - '[ab]_mdc'
  - '[ab]_mdio'
thermal:                          # report_power's environment for this board (flow/build.tcl applies it)
  airflow_lfm: 0                  # the fansink's airflow and thermal resistance are not published (project knowledge base):
  heatsink: none                  # still air and no heat sink is the pessimistic bound (the real junction runs cooler)
  board: medium
  board_layers: 8to11             # not published: a mid class
  ambient_c: 40
