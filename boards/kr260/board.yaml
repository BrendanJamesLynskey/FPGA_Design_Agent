# Kria KR260 Robotics Starter Kit (AMD): K26 SOM (XCK26, Zynq UltraScale+) on the KR260 carrier.
# First board file for this board in the flow. Facts come from the knowledge bank (board/kr260/*), which
# cites AMD UG1092 r1.1 and the AMD kr260_som/kr260_carrier 1.1 board files shipped with Vivado (Apache-2.0); pins of
# the PL Ethernet ports are resolved from those board files (designs/b58a_trigger/design.xdc).
name: kr260
vendor: AMD
part: xck26-sfvc784-2LV-c
clock:
  port: clk_25
  pin: C3                         # HPA_CLK0P, bank 66, LVCMOS18 (25 MHz in an open-source reference design: unconfirmed against the schematic)
  freq_mhz: 25
pl_ethernet:                      # Marvell M88E1111 PHYs, RGMII, 1.8 V HP banks
  port_a: {connector: J10B, name: Ethernet 2, phy: PHY2, rx_clk: D4, tx_clk: A2, reset_n: B1, mdio: F3, mdc: G3}
  port_b: {connector: J10A, name: Ethernet 3, phy: PHY3, rx_clk: K4, tx_clk: J1, reset_n: K1, mdio: T8, mdc: R8}
user_leds: [F8, E8]               # LVCMOS18
host_access: JTAG cable (BSCANE2 USER4 register bus, designs/b58a_trigger/rtl/jtag_bus.sv); no PL UART pins
slow_ports:
  - 'led\[\d+\]'
  - '[ab]_rst_n'
  - '[ab]_mdc'
  - '[ab]_mdio'
thermal:                          # report_power's environment for this board (flow/build.tcl applies it)
  airflow_lfm: 0                  # the fansink's airflow and thermal resistance are not published (project knowledge base):
  heatsink: none                  # still air and no heat sink is the pessimistic bound (the real junction runs cooler)
  board: medium
  board_layers: 8to11             # not published: a mid class
  ambient_c: 40
