# AMD Kria KV260: board file (fpga-design-agent/board/v2). Facts name their sources (ids under `sources`); an unconfirmed
# fact says so and why. Written by hand from the cited documents; see boards/SCHEMA.md.
schema: fpga-design-agent/board/v2
name: kv260
display_name: AMD Kria KV260 Vision AI Starter Kit
vendor: AMD
family: Zynq UltraScale+ MPSoC (K26 SOM)
part: xck26-sfvc784-2LV-c
board_revision: SOM board file 1.4, carrier board file 1.3
master_xdc: null
master_xdc_source:
  kind: none
  reason: 'no PL pin list in the sources read: the SOM board file lists only SOM-connector pins with no I/O standard, and the carrier file lists
    no PL user I/O; the carrier schematic was not read'
sources:
  SOM:
    title: 'AMD XilinxBoardStore SOM board file for the KV260 (kv260_som): part'
    version: XilinxBoardStore @ 40fad97, boards/Xilinx/kv260_som/1.4/board.xml (Apache-2.0)
    url: https://github.com/Xilinx/XilinxBoardStore/blob/40fad97cf36f3d856c6759d83c2390de1566ffa7/boards/Xilinx/kv260_som/1.4/board.xml
  UG1089:
    title: AMD Kria KV260 Vision AI Starter Kit User Guide (UG1089)
    version: v1.4, 25 June 2025 (local copy of the PDF, not committed)
    url: https://docs.amd.com/r/en-US/ug1089-kv260-starter-kit
clock:
  port: null
  status: none
  reason: UG1089 v1.4 names no PL oscillator among the carrier's parts; a design takes its clock from the PS (pl_clk0), which needs a PS8 block.
    Whether the SOM routes a PL reference is not stated in the sources read
  source:
  - UG1089
resources: {}
facts:
- item: part
  value: 'xck26-sfvc784-2LV-c: the same K26 SOM part as the KR260 (so the same family notes apply)'
  source:
  - SOM
- item: user I/O
  value: three SOM LEDs (DS34 PS done, DS35 heartbeat, DS36 PS status) driven by the PS, power-status LEDs on the carrier, and one Pmod (J2, 2x6,
    3.3 V, 100 mA)
  source:
  - UG1089
- item: expansion
  value: a Digilent-style Pmod connector J2; the PL pins behind it are not in the sources read
  source:
  - UG1089
  status: unconfirmed
  reason: the pin mapping is on the carrier schematic, which was not read
- item: boot and management
  value: boot and platform management through xmutil on the SOM's Linux image (UG1089 chapter 3 and 4); the safety rules for this board are not
    recorded in the house rules
  source:
  - UG1089
- item: PL clock, PL user pins, memory, Ethernet, DisplayPort, USB
  status: unconfirmed
  reason: 'not read: no reference manual or schematic for this board was retrieved (vendor sites block automated clients), so this is not stated'
pynq:
  needs: PYNQ on the KV260 is a Kria SOM image with overlays (.bit plus .hwh plus metadata); PS-configured block designs
  agent_flow: the agent's flow writes a PL-only bitstream, so it cannot yet produce a PYNQ overlay
  status: unconfirmed
  reason: stated from general knowledge; the PYNQ and Kria documentation was not read in this session
slow_ports: []
thermal:
  airflow_lfm: 0
  heatsink: none
  board: medium
  board_layers: 8to11
  ambient_c: 40
  status: assumption
  reason: stack-up, heat sink and airflow are not published; still air and no heat sink is the pessimistic bound (as for the KR260)
hardware_use:
  owned: false
  rule: no supply or programming rule is recorded for this board; do not program one without the owner adding a per-board rule to the house rules
