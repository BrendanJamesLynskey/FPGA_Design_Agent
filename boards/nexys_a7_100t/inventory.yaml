  - id: qspi_flash
    part: "S25FL128SAG[M|N]FI00 (16 MiB) on every revision; S25FL127SABMF may be fitted from Rev D with a sticker"
    function: "configuration flash (the FPGA boots from it when JP1 = QSPI); user data above the bitstream (just under 4 MiB for the 100T)"
    interface: "SPI x1/x2/x4; SCK is the FPGA's dedicated CCLK pin (E9), driven after configuration only through STARTUPE2 USRCCLKO"
    pins:
      "QSPI_DQ[0]": {pin: K17, iostandard: LVCMOS33, dir: inout}
      "QSPI_DQ[1]": {pin: K18, iostandard: LVCMOS33, dir: inout}
      "QSPI_DQ[2]": {pin: L14, iostandard: LVCMOS33, dir: inout}
      "QSPI_DQ[3]": {pin: M14, iostandard: LVCMOS33, dir: inout}
      QSPI_CSN:     {pin: L13, iostandard: LVCMOS33, dir: out}
    address_or_id: "RDID (9Fh): 01 20 18 4D, then 00/01 (sector architecture), 80 (FL-S family), 2 ASCII model bytes; the same first 3 bytes for both parts"
    reset_enable: "CS: 4.7 kohm pull-up (R212); no reset pin on the 8-pin package; WP# (DQ2) and HOLD# (DQ3) must be held (HOLD# high) in x1/x2 mode"
    pullups: "CS only (4.7 kohm); DQ0-DQ3 have 100 ohm series resistors and no pull-ups on the board"
    clocking: "board limit 50 MHz (RMWEB 3.2); STARTUPE2 drops the first 3 USRCCLKO edges after configuration"
    self_check: "JEDEC ID by RDID only, no write/erase/register-write opcode in the RTL (DONE: designs/b2_qspi_jedec)"
    current: {typical: "-", max: "61 mA reading (quad, 104 MHz); 100 mA programming/erasing (never done here)"}
    usb_power_safe: {verdict: "yes", reason: "reads only; tens of mA at most. Writes are forbidden by the house rules whatever the power"}
    notes: "The PIC24 shares QSPI_SCK and QSPI_DQ1 (SCH sheet 4) for configuration before the FPGA is programmed. RMWEB lists differences between the two parts (SFDP on the 127S, no DDR reads, different sector map)."
    sources:
      part: [SCH sheet 8, SCH_D3 sheet 8, RMWEB 3.2 (Table 3.2.1)]
      function: [RM 3.2, RM 2.2]
      interface: [RM 3.2, SCH sheet 8, UG470 chapter 5 (STARTUPE2 primitive)]
      pins: [XDC]
      address_or_id: [S25FL128S Table 54, S25FL127S Table 49, HW]
      reset_enable: [SCH sheet 8, S25FL128S (signal descriptions)]
      pullups: [SCH sheet 8]
      clocking: [RMWEB 3.2, "UG470 chapter 5 (STARTUPE2 primitive: USRCCLKO)"]
      self_check: [S25FL128S Table 53, HW]
      current: ["S25FL128S (DC characteristics: ICC1-ICC4)"]
      usb_power_safe: [S25FL128S (DC characteristics)]

