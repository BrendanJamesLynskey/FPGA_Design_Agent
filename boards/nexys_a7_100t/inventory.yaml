  - id: microsd
    part: microSD slot J1 (card power switched by Q8)
    function: "microSD card: configuration source before the FPGA is configured (PIC24, SPI); after that, the FPGA's (native SD or SPI)"
    interface: "SD native 4-bit or SPI"
    pins:
      SD_RESET:    {pin: E2, iostandard: LVCMOS33, dir: out}
      SD_CD:       {pin: A1, iostandard: LVCMOS33, dir: in}
      SD_SCK:      {pin: B1, iostandard: LVCMOS33, dir: out}
      SD_CMD:      {pin: C1, iostandard: LVCMOS33, dir: inout}
      "SD_DAT[0]": {pin: C2, iostandard: LVCMOS33, dir: inout}
      "SD_DAT[1]": {pin: E1, iostandard: LVCMOS33, dir: inout}
      "SD_DAT[2]": {pin: F1, iostandard: LVCMOS33, dir: inout}
      "SD_DAT[3]": {pin: D2, iostandard: LVCMOS33, dir: inout}
    address_or_id: "the card's own (CID/CSD registers via CMD2/CMD9); none on the board"
    reset_enable: "SD_RESET drives the gate of the card's power switch (Q8, 10 kohm pull-up): drive it LOW to power the card"
    pullups: "DAT0-3 and CMD: 100 kohm to the switched card supply; SD_CD: 10 kohm pull-up to 3.3 V through 100 ohm (low = card present)"
    clocking: "SD_SCK from the FPGA: 100-400 kHz for card identification, then up to the card's speed"
    self_check: "proposed: SD_CD shows card presence; CMD0 then CMD8 response with a card fitted (needs a card: one batched ask); not run in 04c"
    current: {typical: "card dependent", max: "not in any document collected (the SD specification was not collected)"}
    usb_power_safe: {verdict: "with conditions", reason: "card current is unknown here; with a standard card at default speed it is usually acceptable, but measure or budget it before relying on USB power"}
    notes: "After configuration the PIC24 power-cycles the slot and releases the bus (RM 11)."
    sources:
      part: [SCH sheet 2, RM 11]
      function: [RM 2.3, RM 11]
      interface: [RM 11]
      pins: [XDC]
      address_or_id: [RM 11]
      reset_enable: [SCH sheet 2, RM 11]
      pullups: [SCH sheet 2]
      clocking: [RM 11, CALC]
      self_check: [SCH sheet 2, CALC]
      current: [RM 11]
      usb_power_safe: [RM 11, CALC]

