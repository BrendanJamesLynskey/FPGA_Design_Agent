# Nexys A7-100T: inventory of everything a design can reach (brief 04c, 2026-10-31).
# Facts only, in our own words; no text copied from the documents. Every field names its source
# (`sources:` per peripheral; ids in `documents:`). FPGA pins are checked against the master XDC
# by tools/inventory_check.py (run in CI). Procedure: knowledge bank procedures/board-onboarding.
schema: fpga-design-agent/board-inventory/v1
board: nexys_a7_100t
part: xc7a100tcsg324-1
master_xdc: Nexys-A7-100T-Master.xdc
board_revision: >-
  Schematic Rev D.0 (2018-07-24) is the base; Rev D.2 (2021-12-23) and D.3 (2022-01-25) add the
  S25FL127S as a flash load option and change nothing else this inventory uses (part lists compared
  sheet by sheet). The owner's board revision is not recorded; its flash answered as listed under
  qspi_flash (results/board_v2/).

