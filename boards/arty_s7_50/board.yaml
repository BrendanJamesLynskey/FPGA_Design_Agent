- led\[\d+\]
- led\d_[rgb]
- sw\[\d+\]
- btn\w*(\[\d+\])?
- uart_\w+
- Rs[RT]x
- cpu_resetn
config:
  cfgbvs: VCCO
  config_voltage: 3.3
  source:
  - XDC
thermal:
  airflow_lfm: 0
  heatsink: none
  board: small
  board_layers: 4to7
  ambient_c: 40
  status: assumption
  reason: board stack-up, heat sink and airflow are not published; still air, no heat sink, the smallest class is the pessimistic choice (as for
    the Nexys A7)
hardware_use:
  owned: false
  rule: no supply or programming rule is recorded for this board; do not program one without the owner adding a per-board rule to the house rules
smoke:
  clk_hz: 100000000
  banner: Arty S7-50
internal_vref:
  bank: 34
  volts: 0.675
  status: derived
  reason: the vendor XDC puts the clock (R2) and sw[3] (M5, a VREF pin) in bank 34 at SSTL135, so Vivado's DRC BIVRU-1 needs the bank's INTERNAL_VREF; 0.675 V is half of 1.35 V, the SSTL135 reference. Found by the first smoke build, not read from a board document
