# How flow/run_vivado.sh builds this design (paths are relative to the repo root). The block pcs_unit is a placed-and-routed
# checkpoint made outside the project (netlists:), locked at routing level, filling the black-box slot in ext/pcs_unit.sv.
top: pr_top
part: xck26-sfvc784-2LV-c
board: kr260           # boards/kr260/board.yaml
sources:
  - designs/b102_managed_pr/ext/pcs_unit.sv
  - designs/b102_managed_pr/rtl/pr_src.sv
  - designs/b102_managed_pr/rtl/pr_sink.sv
  - designs/b102_managed_pr/rtl/pr_top.sv
netlists:
  - {file: designs/b102_managed_pr/ext/pcs_unit_p0.dcp, format: checkpoint, cell: u_blk}
constraints:
  - designs/b102_managed_pr/design.xdc
generics: {}           # BUILD_STAMP is added by the flow
