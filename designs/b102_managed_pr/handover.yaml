commands:
- what: import check (interface, licence, lock, footprint, simulation)
  cmd: python3 flow/managed_placed.py check designs/b102_managed_pr --sim
  heavy: true
  minutes: 3
  needs: Vivado 2026.1, the OSS CAD Suite (FDA_OSS_CAD), Icarus Verilog and a heavy slot (take_heavy_slot.sh)
- what: the placement runs and the evidence
  cmd: designs/b102_managed_pr/scripts/run_placements.sh && designs/b102_managed_pr/scripts/run_dumps.sh
  heavy: true
  minutes: 45
  needs: Vivado 2026.1, RapidWright (tools/rapidwright_env/setup.sh) and a heavy slot
- what: the scripted agent session
  cmd: python3 designs/b102_managed_pr/scripts/demo_managed_session.py
  heavy: false
  minutes: 1
  needs: Python with PyYAML and jsonschema (the argument checks only; --rapidwright adds the real tools)
- what: build and run the gates
  cmd: flow/run_vivado.sh designs/b102_managed_pr base
  heavy: true
  minutes: 15
  needs: local Vivado 2026.1 and a heavy slot (take_heavy_slot.sh)
