gaps:
- about: E5
  text: The evidence for all six placements fails by design of the demonstration; the project adopts the four placements
    of E4 and the other two are recorded as not adoptable at tolerance 0 ps.
- about: power
  text: The estimate is vectorless at default toggle rates; this is a timing study that was never run on a board, so no
    power measurement is claimed.
- about: latency
  text: Not measured; the design is a timing and placement study, and the block's latency in clocks is the supplier's, from
    its RTL.
- about: throughput
  text: Not applicable beyond the clock; the block takes one bit a clock by construction and no throughput measurement was
    made.
- about: board
  text: Never programmed; no hardware evidence and no operating conditions exist.
- about: placement evidence
  text: Six placements of one block on one device, one run each (Vivado's placer has no seed). Relocation by a clock region
    leaves every interconnect delay unchanged; half a region or another column does not (see the placement table in results/102_managed_pr/README.md).
- about: keep-out
  text: The keep-out binds the agent's tools and constraints; Vivado's own placer fills free slices inside the supplier's
    pblock rectangle with owned logic.
next_steps:
- A model-driven run on this project (the session here is a script).
- Stage 3 of brief 102 integrates a real external open-licence block.
open_questions:
- Which tolerance should a project accept for relocated blocks? Zero passes only whole-clock-region moves.
