# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b102_managed_pr
title: Managed-project demonstration - a placed-and-routed block, relocated, with a keep-out
kind: demonstration
produced_by: human
summary: A KR260 timing study that exists to demonstrate stage 2 of a managed project (brief 102). The block pcs_unit, brief
  96's 64b/66b transmit path, arrives as a placed, routed and locked checkpoint made outside the project and is frozen;
  an owned stimulus and sink around it are placed and routed by Vivado. project.yaml records the block's keep-out region,
  the agent's tools refuse to place or constrain anything inside it, and the block's internal timing is measured at six
  placements, relocated by RapidWright and not.
scope_not:
- a 10G Ethernet design; the block is the 64b/66b encoder and scrambler between a shift register and an XOR sink, with three
  input pins
- a board design; it was not programmed, and the 250 MHz constraint is on the 25 MHz oscillator pin for a timing study
- a claim that relocation preserves a block's timing everywhere; the results say where it does and where it does not
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260
  top: pr_top
  tool: Vivado 2026.1
clocks:
- name: clk_25
  mhz: 250
  source: designs/b102_managed_pr/design.xdc
  note: the oscillator pin is 25 MHz on the board; the constraint is 4.0 ns, the period the supplier implemented the block
    for
resets:
- name: power-on counter
  active: high
  note: a four-clock shift register in pr_top holds the owned logic and the block in synchronous reset after configuration;
    there is no reset input
interfaces:
- name: pcs_unit slot
  type: black-box module filled by a locked placed-and-routed checkpoint (build.yaml netlists, format checkpoint)
  doc: designs/b102_managed_pr/project.yaml
  note: the contract is in project.yaml (ports, clock, reset, boundary timing budgets, keep-out region); the block's input
    shift register has no reset, so its first 72 outputs after configuration depend on what shifted in, and the reset must
    be held for 80 clocks while data shifts in before the output is comparable with the supplier's RTL (the import simulation
    does this)
parameters:
- name: placement.region
  value: SLICE_X26Y70:SLICE_X37Y91
  legal: a slice range that contains the block's footprint (slices X27..34, Y72..90)
  note: the keep-out; it is the supplier's pblock rectangle and is larger than the footprint
- name: placement.timing_tolerance_ps
  value: 0
  legal: a whole number of picoseconds, 0 or more
  note: the largest change of an interconnect delay inside the block across placements that the evidence accepts
