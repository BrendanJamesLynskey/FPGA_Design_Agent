gaps:
- about: power
  text: The estimate is vectorless at default toggle rates; this is a timing study that was never run on a board, so no
    power measurement is claimed.
- about: throughput
  text: Not applicable beyond the clock; the block takes two bytes a clock by construction and no throughput measurement
    was made.
- about: width
  text: The block is instantiated at sixteen data bits; the 10G design uses sixty-four. The block alone is simulated at
    8, 16, 32 and 64 bits against a model, but only the 16-bit instance is built.
- about: board
  text: Never programmed; no hardware evidence and no operating conditions exist.
- about: behaviour
  text: The design has no reset input and one fixed frame; the verdict LED is sticky until the next configuration.
- about: upstream tests
  text: 'The block''s upstream tests (MyHDL co-simulations of the Ethernet modules that use it) were not run: they need
    MyHDL''s Icarus plug-in built from source, which was not approved here.'
- about: latency
  text: Not measured on this design; the stage 1 demonstration measured the verdict latency, and the scripted session records
    only that the controller edit saves one clock in simulation (results/102_stage3/demo_session.json).
next_steps:
