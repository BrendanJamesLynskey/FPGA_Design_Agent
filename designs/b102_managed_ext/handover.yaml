schema: fda-handover/1
id: b102_managed_ext
title: Managed-project stage 3 - an FCS self-test around a frozen third-party LFSR block
kind: demonstration
produced_by: session
summary: A KR260 self-test of an Ethernet FCS stage that integrates one real third-party block under a managed project (brief
  102, stage 3). Alex Forencich's parallel CRC/LFSR (verilog-ethernet, MIT, commit 77320a9471d1) is vendored unmodified
  and frozen; our adapter (owned) adds the register, the restart and the enable around it; an owned sequencer sends a fixed
  sixteen-word frame and shows the verdict on an LED. project.yaml records the licence, the commit and the hash of every
  file of theirs, and the agent's tools refuse every route to edit them.
scope_not:
- a 10G Ethernet FCS check; the block is instantiated at 16 data bits a clock, not the 64-bit word of the 96 design
- a board design; it was not programmed, and the 161 MHz clock constraint is on the 25 MHz oscillator pin for a timing study
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260
  top: fcs_top
  tool: Vivado 2026.1
clocks:
- name: clk_25
  mhz: 161.13
  source: designs/b102_managed_fcs/design.xdc
  note: the oscillator pin is 25 MHz on the board; the constraint is the 10G datapath rate to ask the real question of the
    CRC block
resets:
- name: power-on counter
  active: high
  note: a four-clock shift register in fcs_top holds every block in synchronous reset after configuration; there is no reset
    input
interfaces:
- name: lfsr block
  type: third-party combinational RTL module (data_in, state_in, data_out, state_out) at LFSR_WIDTH 32, DATA_WIDTH 16
  doc: designs/b102_managed_ext/project.yaml
  note: the contract is in project.yaml; behaviour a user could guess wrong is in the header of rtl/crc32_d16.sv (register
    not complement, little-endian words, hold on en low, reset wins) and in the block's own header (CRC32 = Galois, bit-reverse,
    polynomial 04C11DB7, initial FFFFFFFF)
parameters:
- name: N_WORDS
  value: 16
  legal: at least 1; the sequencer counter is sized from it and the word function takes an eight-bit index
  note: words per frame, two bytes each
- name: EXPECT
  value: '0x79D3D43A'
  legal: the CRC register value of the frame, from flow/managed_import.crc32_model
  note: checked against zlib in designs/b102_managed_fcs/tests/test_b102_fcs.py
