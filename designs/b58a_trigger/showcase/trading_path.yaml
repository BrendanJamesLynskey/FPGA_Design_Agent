title: A mock trading path at the wire
one_line: "A packet's fields are read while it is still arriving, a rule loaded at run time decides, hardware interlocks check the order and a response leaves before the incoming frame has finished: a mock trading path on a bench, with our own message format and no market data."
board: AMD Kria KR260
part: xck26-sfvc784-2LV-c
what_it_will_show: "The time from the first bit in to the first bit out measured on the board for every order, with its full distribution, the speculative path against the safe one, a rule written from a plain-English sentence, and the interlocks refusing hostile traffic."
