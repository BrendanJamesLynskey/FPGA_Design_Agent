# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b58a_trigger
title: Mock low-latency trading path on the Kria KR260
kind: showcase
produced_by: human
summary: A bench model of a low-latency trading path. A packet arrives on a PL Ethernet port, its fields are parsed while
  it is still arriving, a rule loaded at run time decides, hardware interlocks check the order, and in speculative mode
  the response leaves before the incoming frame has finished (undone by a poisoned frame check sequence if the frame was
  bad). Simulated, formally checked in part, and built with Vivado 2026.1; never run on a board.
scope_not:
- 'a real market path: a mock. The message format is our own (docs/bench_feed_v1.md), the traffic sources are our own, and
  there is no exchange, broker or market data'
- a board result; no latency figure here was measured on hardware, and the PHYs, the cable and the real RGMII timing are
  outside every number
- a proof of the whole design; only interlocks.sv has a k-induction proof, and the order slot and the MAC state machines
  have bounded checks
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260
  top: kr260_top
  tool: Vivado 2026.1
  note: the PS is unused; the host reaches the registers over the JTAG cable
clocks:
- name: clk_25
  mhz: 25
  source: designs/b58a_trigger/design.xdc
  note: board oscillator; an MMCM makes the 125 MHz core clock (one byte time at 1 Gb/s, 8 ns)
- name: a_rxc
  mhz: 125
  source: designs/b58a_trigger/design.xdc
  note: port A receive clock from the PHY; crossed into the core clock by gmii_cdc
- name: b_rxc
  mhz: 125
  source: designs/b58a_trigger/design.xdc
  note: port B receive clock from the PHY
resets:
- name: core reset
  active: high
  note: held until the MMCM locks and the receive delay lines are calibrated (IDELAYCTRL ready), through reset synchronisers;
    the PHYs have a register bit that holds them in reset
interfaces:
- name: RGMII ports A and B
  type: RGMII at 1000 Mb/s, LVCMOS18; port A (PHY2, J10B) is the trading port, port B (PHY3, J10A) the generator and loop
    timer
  doc: ip_lib/eth_mac_rgmii/README.md
  note: receive is centre-aligned with the PHY's RX delay on and a 1000 ps IDELAY on each input; transmit is edge-aligned
    with the PHY's TX delay on. Constraints come from the PHY datasheet and are in design.xdc
- name: host register bus
  type: 32-bit registers over the JTAG cable (BSCANE2), word addresses 0x000 to 0xFFF
  doc: designs/b58a_trigger/docs/register_map.md
  note: control, addresses, interlock limits, rule table, counters, order log, book and two latency histograms; a read returns
    data two clocks after the address. The JTAG script has not run on a board
- name: message format
  type: Bench Feed v1 over UDP, Ethernet and IPv4
  doc: designs/b58a_trigger/docs/bench_feed_v1.md
  note: our own format; UDP checksums are not checked or generated, and IPv4 options, VLAN tags and fragments are rejected
parameters:
- name: BUILD_MODE
  value: 0
  legal: 0, 1 or 2
  note: 0 computes the response's IPv4 checksum before the decision, 1 after it, 2 stores and assembles the frame before
    sending
- name: RX_IDELAY_PS
  value: 1000
  legal: from the timing analysis
  note: receive data delay on each RGMII input
- name: NINST
  value: 256
  legal: instrument count
  note: number of instruments the book holds
