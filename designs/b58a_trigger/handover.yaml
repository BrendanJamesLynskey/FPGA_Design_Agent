gaps:
- about: board_run
  text: No board run has happened and no KR260 programming path exists in the flow yet. The JTAG register script has not
    run on a board. docs/board_run_plan.md lists the steps.
- about: throughput
  text: Not measured. Only latency was recorded; no record states a sustained order or frame rate.
- about: E3
  text: Only interlocks.sv is proved (k-induction). order_ctl.sv (30 clocks) and the MAC receive and transmit state machines
    (20 and 40 clocks) are bounded checks; order backlogs and the saturation of its 16-bit age counter are outside the bound.
- about: latency
  text: Every latency figure is simulation. The receive clock crossing, the RGMII registers, the pins, the PHY chips and
    the cable are outside it, and the crossing FIFO is a simulation model of the Xilinx XPM macro, so its real latency is
    unmeasured.
- about: operating conditions
  text: No SYSMON temperature or rail readings exist because nothing ran on a board; the board run plan reads them.
- about: build
  text: The transmit window assumes 0.1 ns of TXC-to-TXD skew on the KR260, which is not in our notes; the schematic or
    the layout report would confirm it. Worst transmit setup slack is the smallest margin in the build.
- about: behaviour
  text: One order slot, at most one request per frame. A bad frame's book updates are not rolled back. No UDP checksum checks.
    The kill is a register only because the KR260 has no PL push button.
- about: tick-to-config
  text: The 2,125-clock tick-to-config figure includes 2,000 clocks of software time that is assumed, not measured; it shows
    the mechanism.
next_steps:
- Run the board run plan, starting with the bench loop between the two PL ports, and read SYSMON during each run.
- Add a KR260 programming path to the flow.
- Confirm the TXC-to-TXD skew from the schematic or the layout report and re-derive the transmit constraints.
open_questions:
- Should the order slot be widened so that several orders can be outstanding?
