# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b89_lutnet_gen
title: A LUT-network generator, built and measured against the brief 87 arms and TreeLUT
kind: showcase
produced_by: session
summary: Our own generator of LUT networks for nanosecond inference. It trains a sparse network with its quantisers in the
  loop, enumerates every neuron into a truth table, and emits SystemVerilog plus a bit-exact Python twin, with a choice
  of pipelining. On the brief 87 synthetic order-flow data its best network beats the trivial rule and equals the 87 boosted
  trees on the test split; it is built out of context on the K26 and the Artix-7 100T beside TreeLUT, the published tree-to-LUT
  tool, as the reference.
scope_not:
- real market data; the data are brief 87's seeded synthetic order flow with a planted signal
- a board run or a full-design build; every hardware number is an out-of-context, post-route Vivado 2026.1 build
- a general-purpose tool; the argmax is written for three classes, and the generator has been measured on one data set
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260 (K26 SOM); also xc7a100tcsg324-1 (Nexys A7) out of context
  top: ooc_wrap (one generated network with an input register), out of context
  tool: Vivado 2026.1
  note: no board top; the networks have the brief 87 arm ports, so they drop into the 58A decision stage the same way
clocks:
- name: clk
  mhz: 202.0
  source: results/b89/ooc/k26/lg_add_comb.json
  note: lg_add_comb's closed clock on the K26; every module's closed clock is in results/b89/ooc/<part>/<module>.json
resets:
- name: rst
  active: high
  note: synchronous; clears only the valid pipeline, never the datapath (out_cls is undefined until the first out_v)
interfaces:
- name: network ports
  type: clk, rst, in_v, in_f[37:0] (packed 87 features, feature 0 in the low bits), out_v, out_cls[1:0]
  doc: designs/b89_lutnet_gen/docs/generator.md
  note: out_v follows in_v by exactly LATENCY clocks for every input; one input a clock; ties go to the lower class
- name: generator API and options
  type: Python (lutgen.model.Config, train, twin_predict; lutgen.rtl.emit)
  doc: designs/b89_lutnet_gen/docs/generator.md
  note: every option with its default and the behaviours a user could guess wrong (table address order, pass-through codes,
    best-validation epoch, pipelining definition)
parameters:
- name: pipe
  value: comb and layer (both built)
  legal: comb, layer, or a positive integer N (a register after every N-th LUT layer)
  note: LATENCY is 1 for comb and LUT layers + 1 for layer; reg_encoder adds one
- name: arm
  value: lg_add, lg_small, lg_b87 (results/b89/frozen.json)
  legal: any configuration of lutgen.model.Config; tables of at most 2^12 entries
  note: lg_add is the pre-registered main result; the built seed is the best of three on validation
