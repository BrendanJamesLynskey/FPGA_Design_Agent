gaps:
- about: board_run
  text: Not run on a board and not built inside the 58A top; out of context only.
- about: timing
  text: Out of context the clock has no buffer or jitter, so every latency is quoted at no faster than 2.0 ns.
- about: power
  text: Not measured; the out-of-context builds have no power report.
- about: throughput
  text: Every network accepts one input a clock (the RTL test streams half the inputs back to back); no separate throughput
    figure is recorded.
- about: data
  text: One synthetic data set; the generator's ranking against trees and MLPs may not hold elsewhere.
- about: treelut
  text: TreeLUT is tuned for accuracy on a small grid with 8-bit inputs; a cost-tuned point could be smaller, and only its
    seed 0 is built while our built seed is chosen on validation.
- about: behaviour
  text: 'Guessable wrongly: the model returned by training is the best validation epoch, not the last; narrow features pass
    through exactly and use fewer code bits than asked; class-score ties go to the lower class (their share of test rows
    is tie_share_test_built_seed in results/b89/accuracy.json).'
next_steps:
- Learned wiring (pruning and regrowth) in place of random triples.
- Put lg_small behind the 58A rule table in place of the 87 LUT network and build the KR260 top.
- A cost-tuned TreeLUT point for an area comparison at equal accuracy.
open_questions:
- Is the remaining 0.007 to the MLP and TreeLUT worth more tables, or is the label noise the limit?
