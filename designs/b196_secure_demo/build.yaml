# How flow/run_vivado.sh builds this design (paths are relative to the repo root).
# The security request is not in this file: it comes from the run's pin (FDA_SECURITY, flow/security.py), the way an agent run gives it.
#   plain build:           flow/run_vivado.sh designs/b196_secure_demo base
#   production_secure on:  FDA_SECURITY='{"production_secure": true}' flow/run_vivado.sh designs/b196_secure_demo base
#   the same with a debug core (the check must fail): FDA_SECURITY='{"production_secure": true}' flow/run_vivado.sh designs/b196_secure_demo ila
# By hand, the equivalent of the pin is a `security:` mapping here (see docs/security.md).
top: b196_top
part: xck26-sfvc784-2LV-c
board: kr260           # boards/kr260/board.yaml
sources:
  - designs/b194_assurance/rtl/*.sv
  - designs/b196_secure_demo/rtl/*.sv
constraints:
  - designs/b196_secure_demo/design.xdc
generics: {}           # BUILD_STAMP is added by the flow
probes: designs/b196_secure_demo/probes.yaml
