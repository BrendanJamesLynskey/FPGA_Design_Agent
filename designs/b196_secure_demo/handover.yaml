schema: fda-handover/1
id: b196_secure_demo
title: Demonstration of the production_secure switch on the KR260 part (a stream core, a system-monitor safe shutdown, no
  debug core)
kind: demonstration
produced_by: human
summary: A 25 MHz design for the Kria KR260 part that runs the brief-194 stream core and drives two LEDs, with a SYSMONE4
  whose alarm thresholds come from the board's operating limits and feed a latched safe shutdown. It is built with the production_secure
  switch on, and the same design with one ILA added is built to show the check failing. Built only; never programmed and
  never on a board.
scope_not:
- a held-out or benchmark task; it was written to demonstrate and measure the production_secure check
- a statement that the part is secure against an attacker; nothing was measured against one and no certification or side-channel
  claim is made
- a board design; it was never programmed and no hardware measurement exists
- bitstream encryption or authentication, which on a Zynq MPSoC are boot-image steps that belong to the owner
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  top: b196_top
  tool: Vivado 2026.1
clocks:
- name: clk_25
  mhz: 25
  source: designs/b196_secure_demo/design.xdc
  note: the board's 25 MHz clock input; the frequency is an open-source reference design's figure, unconfirmed on the board
resets:
- name: por
  active: low
  note: a 32-clock power-on counter from the configuration's register values; there is no reset pin; used synchronously
    everywhere
interfaces:
- name: led
  type: two user LEDs, LVCMOS18
  doc: designs/b196_secure_demo/rtl/b196_top.sv
  note: led 0 follows the parity of the core's running checksum, led 1 lights on any core fault flag; both are driven low
    in the safe state
parameters:
- name: ECC
  value: 1
  legal: 0 to 2 in the brief-194 core
  note: fabric SECDED code on the core's FIFO, fixed in b196_top
- name: SAFE
  value: 1
  legal: 0 or 1
  note: fsm_safe_state on the core's state register, fixed in b196_top
