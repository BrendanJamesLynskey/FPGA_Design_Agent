security:
  production_secure: true
  enabled:
  - item: readback security Level1, JTAG access to the system monitor disabled, BSCAN access after configuration disabled
    proof: the three BITSTREAM properties are set before write_bitstream and read back from the design after it (gate security_readback_off),
      and the write_bitstream verbose log prints them
    record: results/b196/secure_security_design.txt
  - item: no debug core, hub, bridge, BSCAN primitive, marked debug net, debug-class port or probe file
    proof: the inventory of the implemented design lists none of them (gate security_strip_debug); the debug build of the
      same design lists two cores, a BSCAN primitive and sixteen marked nets and fails it
    record: results/b196/debug_security_design.txt
  - item: system-monitor alarm thresholds from the board's operating limits, wired to a latched safe shutdown
    proof: the SYSMONE4 attributes in the implemented design equal the values recomputed from boards/kr260/board.yaml, and
      each alarm output reaches the shutdown register (gate security_sysmon_shutdown)
    record: results/b196/secure_security_design.txt
  not_enabled:
  - item: bitstream encryption and authentication
    reason: on a Zynq MPSoC they are boot-image steps; Vivado 2026.1 makes the encryption and authentication properties
      read-only for this part, so the record lists them as handed to the owner
  - item: the user over-temperature limit and the automatic device shutdown
    reason: setting the limit also enables the automatic shutdown that de-configures the part, so the device keeps its default
      limit and the shutdown is a latch in the fabric
  - item: a JTAG disable by eFUSE and any key programming
    reason: irreversible and the owner's; this design never programs anything
  could_get_wrong:
  - a passed gate shows that Vivado's output carries the setting, not that the part resists an attacker
  - the alarm thresholds were checked in the vendor simulation model, not on silicon, and the model uses another temperature
    transfer function than the data sheet
  - the limits are the 0.72 volt rows of the data sheet, because the K26 grade is not named there
  - with JTAG access to the system monitor disabled a reconfiguration over JTAG needs a power cycle first
  - the latch holds until power or a new configuration clears it, by design
  key_handling: the flow never makes, reads, stores or programs a key; there is no key in this design; key files are git-ignored
    and never recorded; eFUSE and BBRAM are the owner's.
gaps:
- about: power
  text: Not measured here; no power report was recorded for the production build.
- about: throughput
  text: Not applicable beyond the brief-194 core; the design moves 16 words every 65536 clocks.
- about: latency
  text: Not measured; the design has no latency requirement.
- about: board
  text: Never programmed and never on a board; every statement about behaviour on the part is from Vivado's reports or its
    simulation model.
- about: E4
  text: Evidence E4 is a build that fails its gate on purpose; the failure is the expected result.
- about: threshold
  text: The temperature thresholds follow the data-sheet transfer function that this repository read back on the owner's
    board; the vendor model uses another one, about one degree apart at 85 degrees.
- about: bitstream
  text: The bitstreams of the plain and the production build differ; the differing configuration words were not decoded
    for this family.
- about: spread
  text: Resources and times are one run each; the spread between runs is unknown.
next_steps:
- Run the debug build and the production build on a fresh Vivado release when the pin changes.
- Decode the configuration-register difference between the plain and the production bitstream.
- Give the owner the boot-image steps for encryption and authentication when a board run is planned.
open_questions:
- Whether the K26 grade has its own limits table that replaces the 0.72 volt rows.
