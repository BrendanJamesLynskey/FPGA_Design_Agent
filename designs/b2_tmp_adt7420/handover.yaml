  mhz: 100
  source: designs/b2_tmp_adt7420/design.xdc
  note: the only clock; SCL is made from it (four quarters of QUARTER clocks a bit) and both I2C lines are synchronised
    into it
resets:
- name: CPU_RESETN
  active: low
  note: the board's reset button, synchronised by the test shell's reset synchroniser (assert asynchronous, release synchronous)
interfaces:
- name: UART register window
  type: test shell, 8N1 UART at 115200 baud
  doc: shell/PROTOCOL.md
  note: four registers at shell addresses 0x80 to 0x83 (CTRL, STATUS, RDATA, INFO); the map is in the header of rtl/tmp_regs.sv;
    other window addresses read 0, and writes to any address but CTRL are ignored
- name: ADT7420 I2C
  type: TMP_SCL and TMP_SDA, open drain with the board's pull-ups, LVCMOS33
  doc: boards/nexys_a7_100t/inventory.yaml
  note: START, address and write, pointer byte, repeated START, address and read, one or two bytes, STOP; the master waits
    while the device stretches SCL; a byte that is not acknowledged sets nack and the transfer ends with a STOP
parameters:
- name: QUARTER
  value: 250
  legal: 1 to 65535 (16-bit divider); the board value is 250
  note: a quarter of an I2C bit in 100 MHz clocks; 250 gives a 100 kHz SCL
- name: DEV_ADDR
  value: 75
  legal: 7-bit address; the board value is 0x4B (75)
  note: the sensor's address with both address pins high on this board
- name: CLKS_PER_BIT
  value: 868
  legal: set by the shell's UART; the board value is 868
  note: UART bit period in clocks (115200 baud at 100 MHz)
