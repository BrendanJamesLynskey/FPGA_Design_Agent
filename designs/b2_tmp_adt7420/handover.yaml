schema: fda-handover/1
id: b2_tmp_adt7420
title: ADT7420 temperature sensor board self-check
kind: board-selfcheck
produced_by: human
summary: Reads the Nexys A7's ADT7420 temperature sensor over I2C (address 0x4B, 100 kHz) from a small register block in
  the test shell. The host reads the ID register and the temperature, and the pass rule checks the ID, that no byte was
  not acknowledged and that the temperature is plausible. The design only sets the register pointer and reads, so it cannot
  change the sensor's configuration. `selfcheck.py` holds the on-board pass rule, written before any board run.
scope_not:
- 'a temperature measurement: the pass range (10 to 40 C) only shows the sensor answers with a plausible value, not that
  it is accurate'
- an agent benchmark task; it was written by hand to prove the board inventory on hardware
