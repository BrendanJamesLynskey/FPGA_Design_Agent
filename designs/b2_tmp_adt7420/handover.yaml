gaps:
- about: latency
  text: Not measured. A read takes nine bit periods for each of the address, pointer and address-read bytes plus nine for
    each data byte at 100 kHz by construction; no record times it.
- about: throughput
  text: Not applicable; the block moves one or two bytes per host request.
- about: E3
  text: The board runs used bitstreams built on the earlier Vivado release; the 2026.1 build (E2) was not programmed. Re-run
    the board check on a 2026.1 bitstream to close this.
- about: operating conditions
  text: The board runs predate the house rule of 2026-11-11 that every board run records its operating conditions from the
    XADC; die temperature and the VCCINT, VCCAUX and VCCBRAM rails were not read from the XADC, so the runs cannot be shown
    to be inside the recommended operating conditions.
- about: accuracy
  text: The temperature was not compared with a reference, and the room temperature was not recorded; the range check shows
    the sensor answers plausibly, not that the reading is accurate. Only the 13-bit power-on mode is decoded.
- about: behaviour
  text: GO written while a transfer runs is ignored (i2c_ptr_read.sv takes GO only when idle), but no test covers it. A
    CTRL write while a transfer runs still changes the pointer and byte-count registers; the engine loads the pointer byte
    after the address is acknowledged, so a write before that point changes the pointer sent, while the byte count is taken
    at GO. A byte count other than 2 reads one byte. After a NACK the transfer ends with a STOP, nack stays set until the
    next GO and RDATA is 0. A 2-byte read puts the first byte in bits 15 to 8. STATUS and RDATA reads of undefined addresses
    return 0 with no error.
- about: reset
  text: Reset clears the registers, DONE, NACK and the pointer, and releases both I2C lines. A reset in the middle of a
    transfer releases the lines at once without a STOP, which can leave a device mid-byte.
next_steps:
- Re-run the board check on a Vivado 2026.1 bitstream with the XADC read at the start and end of each run.
- Add tests for GO written while busy and for a CTRL write during a transfer, and state the behaviour in the register map
  header.
- Compare the temperature with a reference thermometer once, and record the room temperature.
open_questions:
- Should the 16-bit (high resolution) configuration be supported, which would need a configuration write that this design
  deliberately cannot do?
