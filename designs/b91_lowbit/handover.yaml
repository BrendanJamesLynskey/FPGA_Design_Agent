# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b91_lowbit
title: Low-bit weight formats (binary, ternary, INT4, MXFP4-style, our power-of-two formats) for nanosecond inference, measured
kind: showcase
produced_by: session
summary: 'A generator and a measurement of eight weight formats for tiny integer networks: binary, ternary, INT4, an MXFP4-style
  E2M1 format with a power-of-two scale, our power-of-two format log4 (with and without a zero) and a two-term log4+1. Each
  is trained with its quantiser in the loop, exported to integers, checked against a bit-exact Python twin and generated
  RTL, and built out of context on the K26 and the Artix-7 100T. On the brief 87 synthetic order flow the 4-bit-weight formats
  match the 89 LUT network and the 87 trees on accuracy but need about four times the LUTs, so no format is on the accuracy-against-area
  or accuracy-against-latency front.'
scope_not:
- real market data; the data are brief 87's seeded synthetic order flow with a planted signal
- a board run or a full-design build; every hardware number is an out-of-context, post-route Vivado 2026.1 build
- 'weights held in block RAM (the phase-2 student): phase 1 weights are constants; docs/stage2_plan.md is a plan only'
- a general-purpose tool; the argmax is written for three classes and the networks have at most two hidden layers
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260 (K26 SOM); also xc7a100tcsg324-1 (Nexys A7) out of context
  top: ooc_wrap (one generated network with an input register), out of context
  tool: Vivado 2026.1
  note: no board top; the networks have the brief 87 arm ports, so they drop into the 58A decision stage the same way
clocks:
- name: clk
  mhz: 98.0
  source: results/b91/ooc/k26/lb_log4_h16x8_a4_comb.json
  note: closed clocks differ per module; every module's closed clock is in results/b91/ooc/<part>/<module>.json
resets:
- name: rst
  active: high
  note: synchronous; clears only the valid pipeline, never the datapath (out_cls is undefined until the first out_v)
interfaces:
- name: network ports
  type: clk, rst, in_v, in_f[37:0] (packed 87 features, feature 0 in the low bits), out_v, out_cls[1:0]
  doc: designs/b91_lowbit/docs/generator.md
  note: out_v follows in_v by exactly LATENCY clocks for every input; one input a clock; ties go to the lower class
- name: generator API and options
  type: Python (lowbit.model.Config, train, twin_predict; lowbit.rtl.emit) and flow/lowbit.py
  doc: designs/b91_lowbit/docs/generator.md
  note: every option with its default and the behaviours a user could guess wrong (rounding, zero, scale as a shift, floor,
    tie to lowest class)
parameters:
- name: format
  value: binary_t3, binary_t7, ternary, int4, mxfp4, log4, log4_nz, log4p1
  legal: the same
  note: element tables in docs/design.md section 3
- name: pipe
  value: comb and layer (A = 4 networks); comb only for the A = 2 and 8 sweep
  legal: comb, layer
  note: LATENCY is 1 for comb and layers + 1 for layer
- name: act_bits
  value: '4 (binary: 1); 2 and 8 for log4 and mxfp4'
  legal: any positive width up to the 8-bit feature width
  note: also the input code width
