gaps:
- about: board_run
  text: Not run on a board and not built inside the 58A top; out of context only.
- about: timing
  text: Out of context the clock has no buffer or jitter, so every latency is quoted at no faster than 2.0 ns.
- about: power
  text: Not measured; the out-of-context builds have no power report.
- about: data
  text: One synthetic data set and one planted signal; the ranking of formats may not hold elsewhere.
- about: scale
  text: Scales are powers of two; a real-valued per-neuron scale was not tried, so the accuracy price of the restriction
    is unknown.
- about: comparison
  text: The formats use two shapes and the rule chose different shapes per format, so cross-format area compares format
    and size together; the networks are not tuned per format.
- about: phase2
  text: Weights here are constants. Where weights live in block RAM the cost of each format changes; docs/stage2_plan.md
    is a plan, not a measurement.
- about: throughput
  text: Every network accepts one input a clock (the RTL test streams half the inputs back to back); no separate throughput
    figure is recorded.
- about: behaviour
  text: 'Guessable wrongly: rounding is linear nearest with ties to the even code index; the scale is a right shift that
    floors; class-score ties go to the lowest class; binary and log4_nz have no zero weight.'
next_steps:
- 'A LUT-network hybrid: enumerate quantised neurons into tables.'
- Trained sparsity and narrower accumulators for ternary and log4.
- A real-valued per-neuron scale as an ablation.
- The stage 2 plan for weights in block RAM.
open_questions:
- Is the gap to the 89 LUT networks the adder trees alone, or also the missing table-level nonlinearity?
