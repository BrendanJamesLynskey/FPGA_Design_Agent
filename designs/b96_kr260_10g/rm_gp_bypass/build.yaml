# rm_gp_bypass (brief 96F1, build B1): build rm_gp (RATE_MATCH = 1, RM_OWN = 1, ENT_SYNC = 1) with BOTH GT elastic buffers bypassed. Differences from rm_gp, and only these: ip/amd_ip_bypass.tcl instead of
# ip/amd_ip.tcl (TX_BUFFER_MODE 0, RX_BUFFER_MODE 0: the Wizard then makes TXOUTCLKSEL 101 and adds the buffer-bypass controllers), and rm_gp_bypass/rtl/b96_core.sv + gt_bp_gate.sv in place of rtl/b96_core.sv
# (the controllers' ports, the run gate, the reset synchroniser and alignment timeout/retry of brief 96F1b, the status bits). The rate matcher rm_gp keeps doing the receive-to-transmit crossing; no loop timing, no direct crossing.
top: kr260_10g_top
part: xck26-sfvc784-2LV-c
board: kr260           # boards/kr260/board.yaml
sources:
  - designs/b58a_trigger/rtl/jtag_bus.sv
  - designs/b96_kr260_10g/rtl/b96_pkg.sv
  - designs/b96_kr260_10g/rtl/pcs_tx.sv
  - designs/b96_kr260_10g/rtl/pcs_rx.sv
  - designs/b96_kr260_10g/rtl/mac64_tx.sv
  - designs/b96_kr260_10g/rtl/mac64_rx.sv
  - designs/b96_kr260_10g/rtl/hs_vec.sv
  - designs/b96_kr260_10g/rtl/frame_src.sv
  - designs/b96_kr260_10g/rtl/trade64.sv
  - designs/b96_kr260_10g/rtl/rate_match.sv
  - designs/b96_kr260_10g/rtl/rate_match_gp.sv
  - designs/b96_kr260_10g/rtl/tx_path.sv
  - designs/b96_kr260_10g/rtl/rx_path.sv
  - designs/b96_kr260_10g/rtl/rx_path_legacy.sv
  - designs/b96_kr260_10g/rtl/es_ctrl.sv
  - designs/b96_kr260_10g/rm_gp_bypass/rtl/gt_bp_gate.sv
  - designs/b96_kr260_10g/rm_gp_bypass/rtl/gt_bp_ctl.sv
  - designs/b96_kr260_10g/rm_gp_bypass/rtl/b96_core.sv
  - designs/b96_kr260_10g/rtl/kr260_10g_top.sv
constraints:
  - designs/b96_kr260_10g/design.xdc
ip_tcl:                 # AMD IP created in the in-memory project (flow/prepare.py, flow/build.tcl): brief 56A's GT Wizard with both buffers bypassed (brief 96F1)
  - designs/b96_kr260_10g/ip/amd_ip_bypass.tcl
generics:
  NEAR_END: "1'b0"
  TRADE: "1'b1"         # BUILD_STAMP is added by the flow
  RATE_MATCH: "1'b1"
  RM_OWN: "1'b1"
