<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="540" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">gth_wiz</text><text x="170" y="43">AMD UltraScale FPGAs Transceivers Wizard core of brief 56A: GTHE4 chan</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">pcs_tx</text><text x="170" y="77">10GBASE-R transmit PCS: 64B/66B encode, x^58+x^39+1 scrambler, 66-to-6</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">pcs_rx</text><text x="170" y="111">10GBASE-R receive PCS: 64-to-66 gearbox with bit slip, block lock, des</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">mac64_tx</text><text x="170" y="145">64-bit Ethernet MAC transmitter: preamble, FCS (CRC-32), terminate, in</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">mac64_rx</text><text x="170" y="179">64-bit Ethernet MAC receiver: start in lane 0 or 4, terminate in any l</text><rect x="8" y="196" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="213">frame_src</text><text x="170" y="213">builds order, feed, probe and test frames in Bench Feed v1 format word</text><rect x="8" y="230" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="247">trade64</text><text x="170" y="247">the mock trading decision of brief 58A at 64 bits: one rule on the fir</text><rect x="8" y="264" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="281">tx_path</text><text x="170" y="281">transmit side: frame source, generator, order start, timestamps and co</text><rect x="8" y="298" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="315">rx_path</text><text x="170" y="315">receive side: PCS in RXUSRCLK2, the elastic buffer rate_match across, </text><rect x="8" y="332" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="349">rate_match</text><text x="170" y="349">elastic buffer on xpm_fifo_async: idle insertion and deletion between </text><rect x="8" y="366" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="383">b96_core</text><text x="170" y="383">register block, GT wrapper and the crossings between the clk, TXUSRCLK</text><rect x="8" y="400" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="417">jtag_bus</text><text x="170" y="417">host register bus over the JTAG cable (BSCANE2 USER4), reused from b58</text><text x="8" y="444" font-weight="bold">Interfaces</text><text x="8" y="462">jtag_bus - b96_core: host_regs (simple)</text><text x="8" y="480">pcs_tx - gth_wiz: gt_words (simple)</text><text x="8" y="498">mac64_tx - pcs_tx: xgmii_tx (simple)</text><text x="8" y="516">pcs_rx - mac64_rx: xgmii_rx (simple)</text></svg>
