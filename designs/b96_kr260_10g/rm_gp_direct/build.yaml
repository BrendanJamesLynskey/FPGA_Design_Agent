# rm_gp_direct (brief 96E): the base design with RATE_MATCH = 1 and RM_OWN = 1: the elastic buffer is our own gray-pointer one (rtl/rate_match_gp.sv, about 5 clocks) instead of the one on
# AMD's xpm_fifo_async (rm_ctl, 9 to 13). Everything else as rm_ctl.
top: kr260_10g_top
part: xck26-sfvc784-2LV-c
board: kr260           # boards/kr260/board.yaml
sources:
  - designs/b58a_trigger/rtl/jtag_bus.sv
  - designs/b96_kr260_10g/rtl/b96_pkg.sv
  - designs/b96_kr260_10g/rtl/pcs_tx.sv
  - designs/b96_kr260_10g/rtl/pcs_rx.sv
  - designs/b96_kr260_10g/rtl/mac64_tx.sv
  - designs/b96_kr260_10g/rtl/mac64_rx.sv
  - designs/b96_kr260_10g/rtl/hs_vec.sv
  - designs/b96_kr260_10g/rtl/frame_src.sv
  - designs/b96_kr260_10g/rtl/trade64.sv
  - designs/b96_kr260_10g/rtl/rate_match.sv
  - designs/b96_kr260_10g/rtl/rate_match_gp.sv
  - designs/b96_kr260_10g/rtl/tx_path.sv
  - designs/b96_kr260_10g/rtl/rx_path.sv
  - designs/b96_kr260_10g/rtl/rx_path_legacy.sv
  - designs/b96_kr260_10g/rtl/es_ctrl.sv
  - designs/b96_kr260_10g/rtl/b96_core.sv
  - designs/b96_kr260_10g/rtl/kr260_10g_top.sv
constraints:
  - designs/b96_kr260_10g/design.xdc
  - designs/b96_kr260_10g/rate_match_gp.xdc
ip_tcl:                 # AMD IP created in the in-memory project (flow/prepare.py, flow/build.tcl): brief 56A's GT Wizard, unchanged
  - designs/b96_kr260_10g/ip/amd_ip.tcl
generics:
  NEAR_END: "1'b0"
  TRADE: "1'b1"         # BUILD_STAMP is added by the flow
  RATE_MATCH: "1'b1"
  RM_OWN: "1'b1"
  RM_DIRECT: "1'b1"
