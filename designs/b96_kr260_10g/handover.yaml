gaps:
- about: hardware
  text: Nothing has run on a board. The reference clock source and frequency, the 25 MHz input and the SFP+ control pin
    functions and TX_DISABLE polarity are unconfirmed (third-party example, not the schematic).
- about: interoperability
  text: The PCS and MAC are checked against a model written by the same author and against zlib and a recurrence; the standard
    text was not available, so only a network card proves the block formats and scrambler order.
- about: simulation
  text: The transceiver is a behavioural stand-in because the free simulator refuses the real model; the whole-core bench
    uses same-phase clocks, so the receive-to-transmit crossing phase is not simulated.
- about: trading path
  text: trade64 is a one-rule 64-bit stand-in, not the 58A core; orders that overlap are dropped; no cancel after send;
    the order fields cross as a quasi-static bus (CDC-6 warning).
- about: protocol
  text: No link-fault state machine, BER monitor, ARP or ICMP responder; ordered sets are counted and shown as idles; receive
    does not check preamble, runts or jumbo frames; the transmit MAC does not pad.
- about: throughput
  text: The line rate and the 10 Gb/s payload rate are by configuration and by the gearbox arithmetic; no throughput or
    error-rate measurement exists because nothing ran on a board.
- about: build
  text: The 96C builds of the latency variant (all3) and its ppm twin hit the 6 GiB scope cap about 1000 times and used
    about 700 MiB of swap (the base build did not); the Vivado resident peak of the base build is 4449 MiB. all3 closes
    timing with 0.004 ns of setup slack, which is thin.
next_steps:
- Run docs/board_run_plan.md steps 1 to 4 on the KR260 (laser polarity first), then the NIC steps after the owner buys a
  card and cable.
- Confirm the reference clock and the control pins against the carrier schematic.
- Widen the 58A core to 64 bits, or add the missing 58A features to trade64.
open_questions:
- Does the PL load over JTAG with the PS idle on the KR260 (flow/program.py has no KR260 board entry yet)?
