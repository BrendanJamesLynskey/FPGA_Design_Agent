commands:
- what: simulate the PCS, MAC and core against the Python reference
  cmd: python -m pytest -q designs/b96_kr260_10g/tests
  heavy: false
  minutes: 2
  needs: Icarus Verilog and cocotb 2.0.1
- what: build variant (b) and run all gates
  cmd: flow/run_vivado.sh designs/b96_kr260_10g base
  heavy: true
  minutes: 22
  needs: local Vivado 2026.1 (Basic tier) and a heavy slot (take_heavy_slot.sh), MEM_MAX=6G reaches the cap
- what: build variant (a), the near-end loopback self-test
  cmd: flow/run_vivado.sh designs/b96_kr260_10g/selftest base
  heavy: true
  minutes: 22
  needs: as above
- what: the UVM 1.2 regression of the PCS and MAC in xsim (every test over its seeds, coverage merge, seeded bugs)
  cmd: designs/b96_kr260_10g/verif/uvm/scripts/run_regress.sh --mutants --record results/112_uvm_pcs_mac
  heavy: false
  minutes: 40
  needs: Vivado 2026.1 xsim (Basic tier is enough); a simulation-only run, no heavy slot while the load is under 6 and more
    than 12 GB is free
- what: the pyuvm regression of the PCS and MAC in Icarus (every test over its seeds, coverage merge, seeded bugs); needs
    pyuvm 5.0.0 and cocotb-coverage in a venv that sees cocotb 2.0.1
  cmd: PYTHONPATH=. python designs/b96_kr260_10g/verif/pyuvm/scripts/run_regress.py --mutants --record results/123_pyuvm_pcs_mac
  heavy: false
  minutes: 15
  needs: Icarus Verilog 12, cocotb 2.0.1, pyuvm 5.0.0, cocotb-coverage; a simulation-only run, no heavy slot while the load
    is under 6 and more than 12 GB is free
