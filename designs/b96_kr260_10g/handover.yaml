# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b96_kr260_10g
title: 'A 10GBASE-R link on the KR260 SFP+ cage: our own PCS and 64-bit MAC with a mock trading path'
kind: example
produced_by: session
summary: A Kria KR260 design that carries our own 10GBASE-R PCS (64B/66B, scrambler, gearbox, block lock) and a 64-bit Ethernet
  MAC on one GTH lane at 10.3125 Gb/s, with the mock trading path of brief 58A behind it (a one-rule 64-bit decision in
  the same message format), because the AMD 10G Ethernet core is refused on the free Basic licence. Verified against an
  independent Python reference in simulation (the GT is a behavioural stand-in) and built to a bitstream on Vivado 2026.1
  Basic with every flow gate passing in two variants. Brief 96C added a rate-matching elastic buffer as a build option (default
  off, the board-proven 97C receive path); the base and its rate-matched variants have run on a KR260 optical loopback,
  not yet against a network card or a second reference clock.
scope_not:
- 'an interoperability proof: a PCS talking to itself accepts its own symmetric mistakes, only a network card proves it'
- 'the full 58A trading core (book, rule table, interlocks, ARP) at 64 bits: trade64 is a small stand-in with one rule'
- the reconciliation sublayer link-fault state machine, the BER monitor, an ARP or ICMP responder
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260
  top: kr260_10g_top
  tool: Vivado 2026.1
  note: GTHE4_CHANNEL_X0Y6 of quad 224; SFP+ cage J24; reference MGTREFCLK0 (Y6/Y5); variant (a) is selftest/build.yaml
clocks:
- name: clk_25
  mhz: 25
  source: designs/b96_kr260_10g/design.xdc
  note: input C3, an open-source example figure, unconfirmed against the schematic; an MMCM makes the 100 MHz free-running
    clock
- name: sfp_mgt_refclk
  mhz: 156.25
  source: designs/b96_kr260_10g/design.xdc
  note: MGTREFCLK0 of quad 224; frequency and source unconfirmed (two third-party sources agree, no AMD document or schematic)
resets:
- name: reset helper
  active: high
  note: the register block is reset while the MMCM is unlocked; each path is held in reset while the GT Wizard reports its
    transmit or receive side not done
interfaces:
- name: Host register block
  type: 32-bit register bus over JTAG (BSCANE2 USER4, jtag_bus)
  doc: designs/b96_kr260_10g/docs/register_map.md
  note: generated from regmap.py; unmapped reads return 0; counters read from a snapshot; reads have no side effects
- name: SFP+ lane and control pins
  type: one GTH lane at 10.3125 Gb/s; tx_disable, mod_abs, rx_los, tx_fault, I2C
  doc: designs/b96_kr260_10g/docs/board_run_plan.md
  note: the laser is disabled at reset (tx_disable = 1; polarity unconfirmed until the first board run)
parameters:
- name: NEAR_END
  value: 0 (variant b), 1 (variant a)
  legal: 0 or 1
  note: 1 selects the near-end PMA loopback at reset
- name: TRADE
  value: 1 (variant b), 0 (variant a)
  legal: 0 or 1
  note: 1 enables the mock trading path at reset; it still needs ARM
- name: RATE_MATCH
  value: 0 (default), 1 (the 96C elastic buffer)
  legal: 0 or 1
  note: 0 is the receive path of main 6909e43f (brief 97C, board-proven); 1 puts rate_match between the receive PCS and
    the MAC (11 clocks slower on the board); the register map is the same, with the rate-match and frequency words reading
    0 at 0
- name: EYESCAN
  value: 0 (default), 1 (the eyescan build)
  legal: 0 or 1
  note: 1 adds brief 96D's DRP access, eye-scan point sequencer (es_ctrl) and TX drive registers (FEATURES bit 4); with
    0 they read 0 and the GT's DRP and drive ports are tied to the old constants; es.xdc also powers up the GT's eye-scan
    circuit in the eyescan build
- name: RM_OWN
  value: 0 (default), 1 (the 96E own gray-pointer buffer)
  legal: 0 or 1
  note: RATE_MATCH = 1 only (FEATURES bit 5); 1 uses rate_match_gp.sv (about 5 clocks, 1.2 clocks of tick-to-trade over
    the 97C path in simulation) instead of the xpm_fifo_async buffer (5.3 clocks)
- name: RM_DIRECT
  value: 0 (default), 1 (build rm_gp_direct)
  legal: 0 or 1
  note: RM_OWN = 1 only; 1 sets rate_match_gp's ENT_SYNC to 0 (direct read of the entry flops, 1.2 clocks of tick-to-trade
    in simulation) which fails the report_cdc gate (38 CDC-1 Critical); kept as evidence
- name: GO_REG
  value: 1 (default), 0 in lat_all3
  legal: 0 or 1
  note: RATE_MATCH = 0 only, the register stage of the go-pulse crossing (brief 97's all3 variant removes it)
- name: line rate
  value: 10.3125 Gb/s
  legal: fixed by 10GBASE-R
  note: QPLL0 from the 156.25 MHz reference; the user clocks (161.133 MHz) carry 64 bits a word and the PCS takes one clock
    pause in 33
