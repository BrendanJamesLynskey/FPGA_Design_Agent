gaps:
- about: hardware
  text: The design has run on a KR260 optical loopback only (briefs 97 and 96C), never against a network card or a second
    reference clock, so rate matching (RATE_MATCH = 1) has not been seen under a real frequency offset; the TX phase-interpolator
    route gave none. The reference clock source and frequency, the 25 MHz input and the SFP+ control pin functions are unconfirmed
    against the schematic (third-party example).
- about: interoperability
  text: The PCS and MAC are checked against a model written by the same author and against zlib and a recurrence; the standard
    text was not available, so only a network card proves the block formats and scrambler order.
- about: simulation
  text: The transceiver is a behavioural stand-in because the free simulator refuses the real model; the whole-core bench
    uses same-phase clocks, so the receive-to-transmit crossing phase is not simulated.
- about: trading path
  text: trade64 is a one-rule 64-bit stand-in, not the 58A core; orders that overlap are dropped; no cancel after send;
    the order fields cross as a quasi-static bus (CDC-6 warning).
- about: protocol
  text: No link-fault state machine, BER monitor, ARP or ICMP responder; ordered sets are counted and shown as idles; receive
    does not check preamble, runts or jumbo frames; the transmit MAC does not pad.
- about: throughput
  text: The line rate and the 10 Gb/s payload rate are by configuration and by the gearbox arithmetic; no throughput or
    error-rate measurement exists because nothing ran on a board.
- about: build
  text: The 96C builds of the latency variant with the buffer (rm_all3) and its ppm twin hit the 6 GiB scope cap about 1000
    times and used about 700 MiB of swap (the base build did not); the Vivado resident peak of the base build is 4439 MiB.
    all3 closes timing with 0.004 ns of setup slack, which is thin.
- about: constraints
  text: 'The per-entry data path to the first synchroniser flop (write-clock entry flop to the first `xpm_cdc_array_single`
    flop) has no max-delay bound: the one-clock margin of `ENT_SYNC = 1` covers normal routing, but it is not constrained.'
- about: ml stage
  text: Build rm_gp_ml (the ML decision stage behind the rule, brief 113) has not run on a board; its board test is pre-registered
    in results/b113/preregistration.md and the owner's script is written. The stage tracks one instrument with a top-of-book
    and sees the first message of a frame only; the model is brief 87's trees on one planted-signal data set.
next_steps:
- Run _handoff/fpga_agent/run_113_ml_stage3.sh on the KR260 (pre-registered in results/b113/preregistration.md), build rm_gp_ml
  against the 96E rm_gp board run.
- Run _handoff/fpga_agent/run_96f1_stage1.sh on the KR260 (pre-registered in results/b96f1/preregistration.md), build rm_gp_bypass
  against the 96E rm_gp board run.
- Run docs/board_run_plan.md steps 1 to 4 on the KR260 (laser polarity first), then the NIC steps after the owner buys a
  card and cable.
- Confirm the reference clock and the control pins against the carrier schematic.
- Widen the 58A core to 64 bits, or add the missing 58A features to trade64.
open_questions:
- Does the PL load over JTAG with the PS idle on the KR260 (flow/program.py has no KR260 board entry yet)?
