schema: fda-handover/1
id: b96_kr260_10g
title: 'A 10GBASE-R link on the KR260 SFP+ cage: our own PCS and 64-bit MAC with a mock trading path'
kind: example
produced_by: human
summary: A Kria KR260 design that carries our own 10GBASE-R PCS (64B/66B, scrambler, gearbox, block lock) and a 64-bit Ethernet
  MAC on one GTH lane at 10.3125 Gb/s, with the mock trading path of brief 58A behind it (a one-rule 64-bit decision in
  the same message format), because the AMD 10G Ethernet core is refused on the free Basic licence. Verified against an
  independent Python reference in simulation (the GT is a behavioural stand-in) and built to a bitstream on Vivado 2026.1
  Basic with every flow gate passing in two variants; not run on a board.
scope_not:
- 'an interoperability proof: a PCS talking to itself accepts its own symmetric mistakes, only a network card proves it'
- 'the full 58A trading core (book, rule table, interlocks, ARP) at 64 bits: trade64 is a small stand-in with one rule'
- the reconciliation sublayer link-fault state machine, the BER monitor, an ARP or ICMP responder
