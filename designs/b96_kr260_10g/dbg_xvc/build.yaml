# dbg_xvc (brief 131): the eyescan build (RATE_MATCH = 0, EYESCAN = 1) with a debug path added: the PS's AXI master -> Debug Bridge (AXI to BSCAN) -> one ILA on status taps, so Vivado's hardware manager
# can reach the ILA over Ethernet (XVC) with no JTAG traffic while Linux runs. A debug build only: never a build whose latency is measured. Differences from eyescan: dbg_xvc/rtl/{b96_core,kr260_10g_top,xvc_debug}.sv and ip/amd_ip_xvc.tcl.
