# b96_kr260_10g testplan, schema v1 (brief 116): the specification and the evidence that checks it, in one place.
#
# WHO DOES WHAT. A human specifies the requirements below and checks that the verification is thorough enough. The agent holds the knowledge to
# implement and to verify. The user can open any implementation or evidence file and does not have to.
#
# DRAFT STATUS. Every requirement here was written from the design's own documents (docs/design.md, handover.yaml, the pre-registrations in
# results/) by the agent, and bounds are taken from those records. None is agreed by a human yet (`spec_status: draft`); the matrix says so.
# A bound that is a regression bound (drawn from a recorded run) says so in its text; the owner sets the target.
#
# Status is never typed here. `python -m flow.trace_v1 write designs/b96_kr260_10g` reads the evidence files named below and computes
# pass / fail / not run / stale / bounded per item and a roll-up per requirement. A hook (`planned:`) is evidence that does not exist yet.
schema: fpga-design-agent/testplan/v1
design: b96_kr260_10g
notes: >-
  Variants. Unless a requirement says otherwise, "the default build" is RATE_MATCH = 0 (the board-proven 97C receive path) and "the rate-matched
  build" is rm_gp (RATE_MATCH = 1, RM_OWN = 1). Board evidence is one KR260 on a short optical loopback; nothing has run against a network card.
  Briefs 112 (UVM bench), 115 (formal proofs of the rate matcher) and 123 (pyuvm bench) are merged and their tests are in the recorded run; the bound SVA checkers in simulation and the coverage run have no evidence and are shown as not run.

discover:
  - {glob: designs/b96_kr260_10g/tests/test_*.py, pattern: '^def (test_\w+)'}

x-rtl-pcs-mac: &rtl_pcs_mac [designs/b96_kr260_10g/rtl/b96_pkg.sv, designs/b96_kr260_10g/rtl/pcs_tx.sv, designs/b96_kr260_10g/rtl/pcs_rx.sv,
  designs/b96_kr260_10g/rtl/mac64_tx.sv, designs/b96_kr260_10g/rtl/mac64_rx.sv]
x-rtl-core: &rtl_core [designs/b96_kr260_10g/rtl/b96_pkg.sv, designs/b96_kr260_10g/rtl/pcs_tx.sv, designs/b96_kr260_10g/rtl/pcs_rx.sv,
  designs/b96_kr260_10g/rtl/mac64_tx.sv, designs/b96_kr260_10g/rtl/mac64_rx.sv, designs/b96_kr260_10g/rtl/trade64.sv, designs/b96_kr260_10g/rtl/tx_path.sv,
  designs/b96_kr260_10g/rtl/rx_path.sv, designs/b96_kr260_10g/rtl/rx_path_legacy.sv, designs/b96_kr260_10g/rtl/b96_core.sv,
  designs/b96_kr260_10g/rtl/rate_match.sv, designs/b96_kr260_10g/rtl/rate_match_gp.sv, designs/b96_kr260_10g/rtl/hs_vec.sv, designs/b96_kr260_10g/rtl/frame_src.sv]
x-rtl-rm: &rtl_rm [designs/b96_kr260_10g/rtl/rate_match.sv, designs/b96_kr260_10g/rtl/rate_match_gp.sv, designs/b96_kr260_10g/rtl/rx_path.sv]
x-rtl-es: &rtl_es [designs/b96_kr260_10g/rtl/es_ctrl.sv]

x-lean-gray-link: &lean_gray_link
  kind: transcription_tested
  source:
    - {file: designs/b96_kr260_10g/rtl/rate_match_gp.sv, lines: "78-82"}
    - {file: flow/cdc_models/xpm_cdc_models.sv, lines: "71-87"}
  transcribed_in: formal/lean/Gray/Spec.lean (bin2gray, parity, gray2bin)
  crosscheck: {file: formal/lean/Gray/CrossCheck.lean, reference: "the repository's behavioural model of xpm_cdc_gray (flow/cdc_models/xpm_cdc_models.sv, written from UG974) run in Icarus Verilog, every value of widths 1 to 8, by formal/lean/tools/crosscheck_gray.py; AMD's own macro is not what is compared"}
requirements:
  # ---- functional: the link ------------------------------------------------------------------------------------------
  - id: B96-F-PCS
    kind: functional
    title: PCS encodes and decodes 64B/66B bit-exactly against an independent model
    text: Scrambler, block encode and decode, gearbox and block lock produce the same bits as the bit-serial Python reference, at every bit offset, with idles, ordered sets and bit-error runs.
    source: designs/b96_kr260_10g/docs/design.md#7-verification-plan
    spec_status: draft
  - id: B96-F-MAC
    kind: functional
    title: 64-bit MAC frames correctly in both directions
    text: Frames start in lane 0 and lane 4, every terminate lane and every length residue is handled, FCS is generated and checked, and a bad FCS is counted.
    source: designs/b96_kr260_10g/docs/design.md#7-verification-plan
    spec_status: draft
  - id: B96-F-LOCK
    kind: functional
    title: Block lock is acquired from any bit offset and survives bit errors
    text: The receive gearbox slips to the block boundary from any offset, and a run of bit errors loses lock only above the documented threshold.
    source: designs/b96_kr260_10g/docs/design.md#28-block-lock-bit-slip-errors
    spec_status: draft
  - id: B96-F-RESTART
    kind: functional
    title: The link locks after every receive-datapath restart
    text: At least 100 receive-datapath restarts on the board, each one locks and no restart corrupts a frame.
    source: designs/b96_kr260_10g/docs/design.md#6-loop-measurement-method-pre-registered-stage-3
    spec_status: draft
  - id: B96-F-DEFAULT
    kind: functional
    title: The default build keeps the board-proven receive path
    text: With RATE_MATCH = 0 the core is equivalent to the core of main 6909e43f (brief 97C) and passes that brief's bench.
    source: designs/b96_kr260_10g/handover.yaml
    spec_status: draft
  # ---- rate matching -------------------------------------------------------------------------------------------------
  - id: B96-S-RATEMATCH
    kind: safety
    title: Rate matching never corrupts a frame
    text: The elastic buffer inserts and deletes idles only between frames, never under- or overflows silently, and every order sent is fired and passes its content check.
    source: designs/b96_kr260_10g/docs/design.md#9-rate-matching-and-the-receive-to-core-crossing-brief-96c
    spec_status: draft
  - id: B96-F-OFFSET
    kind: functional
    title: Rate matching holds under a real frequency offset
    text: For any constant receive clock offset from -300 to +300 ppm relative to the transmit clock, no frame is lost or corrupted and the buffer neither overflows nor underflows. IEEE 802.3 allows +-100 ppm at each end, so two compliant ends differ by at most 200 ppm; +-300 ppm gives margin. A loopback has no offset, so a board test needs a second reference clock or another device on the link.
    source: designs/b96_kr260_10g/docs/design.md#board-result-2026-11-19-kr260-and-an-optical-loopback-resultsb96cwhw20261119_080724
    spec_status: draft
    external: a second reference clock or a 10G network card (a loopback has no frequency offset)
  - id: B96-F-INTEROP
    kind: functional
    title: Interoperates with a standard 10GBASE-R network card
    text: The PCS and MAC exchange frames with an independent 10GBASE-R implementation. A PCS talking to itself accepts its own symmetric mistakes, so only another implementation proves the block formats and scrambler order.
    source: designs/b96_kr260_10g/handover.yaml
    spec_status: draft
    external: a 10G network card and cable
  # ---- trading path and board safety ---------------------------------------------------------------------------------
  - id: B96-S-ORDERS
    kind: safety
    title: Orders are sent only for valid decisions, none is lost or poisoned
    text: Every armed decision yields exactly one order, a poisoned order never fires, and every fault counter stays 0.
    source: designs/b96_kr260_10g/docs/design.md#25-the-trading-path-in-variant-b-trade64-not-a-widened-trigger_core
    spec_status: draft
  - id: B96-S-DRIVER
    kind: safety
    title: The board drivers cannot report OK when a safety check fails
    text: A stale counter, a missing order, a counter that was not read, a wrong polarity or a link that never came up fails the run and names the cause; unsafe actions are refused without the lock.
    source: designs/b96_kr260_10g/host/b96_bench.py
    spec_status: draft
  - id: B96-S-LASER
    kind: safety
    title: The laser is off at reset and its polarity is confirmed
    text: tx_disable is 1 at reset; the board run switches the laser on only after the polarity was read back.
    source: designs/b96_kr260_10g/handover.yaml
    spec_status: draft
  - id: B96-S-ROC
    kind: safety
    title: Board runs stay inside the recommended operating conditions
    text: Die temperature, VCCINT, VCCAUX and VCCBRAM read from SYSMON are inside the DS925 windows at the start and end of every board run.
    source: _handoff/fpga_agent/fpga_agent_house_rules.md
    spec_status: draft
  - id: B96-S-CDC
    kind: safety
    title: No critical clock-domain crossing
    text: report_cdc shows no Critical item and every crossing has the documented synchroniser structure.
    source: designs/b96_kr260_10g/docs/design.md#26-where-the-decision-lives-and-how-it-crosses-clocks-as-built-for-brief-96-superseded-by-section-9-brief-96c
    spec_status: draft
  - id: B96-I-REGMAP
    kind: interface
    title: The register map is generated from one source and decoded exactly
    text: Every address in regmap.py is decoded, nothing else is, vector widths agree, and the datasheet states unmapped reads return 0, counters read from a snapshot and reads have no side effects.
    source: designs/b96_kr260_10g/docs/register_map.md
    spec_status: draft
  - id: B96-F-BUILDS
    kind: functional
    title: Every build variant sets only the parameters it documents
    text: The build files set parameters the core has, the base build keeps the 97C defaults, and each variant differs from the base only where documented.
    source: designs/b96_kr260_10g/handover.yaml
    spec_status: draft
  - id: B96-F-EYESCAN
    kind: functional
    title: The eye-scan sequencer drives the GT's DRP as its Python twin does
    text: es_ctrl aborts a point on a DRP timeout, latches the point at start, restores every DRP word and is absent when EYESCAN = 0.
    source: designs/b96_kr260_10g/docs/design.md#10-on-chip-rx-eye-scan-brief-96d-2026-11-19
    spec_status: draft
  # ---- performance ---------------------------------------------------------------------------------------------------
  - id: B96-P-LAT-E
    kind: performance
    title: Echo latency E
    text: Regression bound drawn from the 96E board record; the owner sets the target.
    source: designs/b96_kr260_10g/docs/design.md#6-loop-measurement-method-pre-registered-stage-3
    spec_status: draft
    performance: {quantity: echo latency E (median of per-link minima), unit: clocks, op: le, bound: 22, condition: "clock 6.206 ns, 100 link restarts, KR260 optical fibre loopback, fibre lead 0.17 m"}
  - id: B96-P-LAT-L
    kind: performance
    title: Trading-loop latency L
    text: Regression bound drawn from the 96E board record (L = 2E + D); the owner sets the target.
    source: designs/b96_kr260_10g/docs/design.md#6-loop-measurement-method-pre-registered-stage-3
    spec_status: draft
    performance: {quantity: trading-loop latency L (median of per-link minima), unit: clocks, op: le, bound: 55, condition: "clock 6.206 ns, 100 link restarts, KR260 optical fibre loopback, fibre lead 0.17 m"}
  - id: B96-P-LAT-D
    kind: performance
    title: Decision latency D
    text: D = L - 2E; the 96F1 pre-registration expects it unchanged within 1 clock of 12.
    source: results/b96f1/preregistration.md
    spec_status: draft
    performance: {quantity: decision latency D (L - 2E from medians of minima), unit: clocks, op: le, bound: 13, condition: "clock 6.206 ns, 100 link restarts, KR260 optical fibre loopback"}
  - id: B96-P-T2T-DIGITAL
    kind: performance
    title: Digital tick-to-trade, GT port to GT port
    text: Whole core in xsim with AMD's real XPM macros and the GT stand-in, own gray-pointer buffer; the GT, optics and clock-crossing phase are not in the simulation. Regression bound drawn from the 96E record.
    source: docs/latency_definitions.md
    spec_status: draft
    performance: {quantity: tick-to-trade, GT receive word to GT transmit order start (mean over 8 orders), unit: clocks, op: le, bound: 14, condition: "xsim, RATE_MATCH = 1, RM_OWN = 1, clock phase 1550 ps"}
  - id: B96-P-TIMING
    kind: performance
    title: Post-route setup slack
    text: Every build closes timing on the 161.133 MHz and 100 MHz user clocks.
    source: designs/b96_kr260_10g/handover.yaml
    spec_status: draft
    performance: {quantity: worst setup slack (WNS), unit: ns, op: ge, bound: 0, condition: "routed, Vivado 2026.1, user clocks 161.133 MHz and 100 MHz"}
  - id: B96-P-HOLD
    kind: performance
    title: Post-route hold slack
    text: Every build closes hold on all clocks.
    source: designs/b96_kr260_10g/handover.yaml
    spec_status: draft
    performance: {quantity: worst hold slack (WHS), unit: ns, op: ge, bound: 0, condition: "routed, Vivado 2026.1"}
  - id: B96-P-EYE
    kind: performance
    title: Receive eye margin
    text: Horizontal eye opening after the equaliser, read by the on-chip eye scan on the board. Draft bound for a short loopback; the owner sets the target.
    source: designs/b96_kr260_10g/docs/design.md#10-on-chip-rx-eye-scan-brief-96d-2026-11-19
    spec_status: draft
    performance: {quantity: eye width at BER 1e-9 (LPM equaliser), unit: UI, op: ge, bound: 0.5, condition: "KR260 fibre loopback, one module, room temperature, eye-scan build"}
  - id: B96-P-BYPASS
    kind: performance
    title: GT buffer bypass shortens the echo path (pre-registered)
    text: Build rm_gp_bypass must lower E by at least 1.5 clocks against rm_gp (21.0), else the bypass did not take effect. Pre-registered before any board time. Measured 2026-11-21 (stamp 86037ce1) as E = 17.0 clocks, 4.0 lower, inside the predicted 2.9 to 4.5 (results/b96f1/README.md).
    source: results/b96f1/preregistration.md
    spec_status: draft
    performance: {quantity: echo latency E (median of per-link minima), unit: clocks, op: le, bound: 19.5, condition: "build rm_gp_bypass, 100 receive restarts, KR260 optical fibre loopback, fibre lead 0.17 m"}
  - id: B96-P-THROUGHPUT
    kind: performance
    title: Line-rate throughput without loss
    text: A burst at line rate loses no frame. Nothing has been measured; the line and payload rates stand on configuration and gearbox arithmetic only.
    source: designs/b96_kr260_10g/handover.yaml
    spec_status: draft
    performance: {quantity: frames lost in a line-rate burst, unit: frames, op: eq, bound: 0, condition: "1518-byte frames, 10 s burst, against a 10G network card"}
    external: a 10G network card or a line-rate traffic generator

  # ---- Lean: properties proved for all widths (brief 125) --------------------------------------------------------------
  # A formal_lean item is a Lean 4 proof, checked by Lean's kernel. Its statement is the specification and only a human approves it
  # (verif/lean_approvals.yaml, empty today: every statement below is "statement not approved"). The axiom tier and how the Lean model meets the
  # RTL are shown next to the result. Nothing here models timing, control or metastability.
  - id: B96-F-DBGXVC
    kind: functional
    title: A debug build reaches an ILA over the network and leaves the trading path alone
    text: Build dbg_xvc (the eyescan build plus a PS-AXI Debug Bridge and one ILA) closes timing and report_cdc, adds no cell to and removes no cell from the core's hierarchy except the read-only taps, and, on the board, Vivado finds and captures from the ILA over XVC while Linux keeps running. Never part of a build whose latency is measured.
    source: designs/b96_kr260_10g/dbg_xvc/docs/dbg_xvc.md
    spec_status: draft
  - id: B96-F-LEAN-GRAY-STEP
    kind: functional
    title: A pointer's gray code changes in exactly one bit per count, at every width
    text: The write and read pointers of rate_match_gp count modulo 2^CW and cross by gray code. For every width CW > 0 and every value, the gray codes of b and b + 1 (including the wrap from 2^CW - 1 to 0) differ in exactly one bit, so a sample taken while the pointer moves is the old or the new code.
    source: designs/b96_kr260_10g/rtl/rate_match_gp.sv (pointer crossings u_wp and u_rp, xpm_cdc_gray)
    spec_status: draft
  - id: B96-F-LEAN-GRAY-DECODE
    kind: functional
    title: Gray decoding inverts gray encoding, at every width
    text: For every width and value, the decoder of the pointer crossing returns the count the encoder was given; and a sampled code that is the old or the new code decodes to the old or the new count.
    source: designs/b96_kr260_10g/rtl/rate_match_gp.sv (pointer crossings u_wp and u_rp, xpm_cdc_gray)
    spec_status: draft
verification:
  # ---- simulation tests (pytest + cocotb + Icarus; one recorded run) -------------------------------------------------
  - id: V-SIM-PCSMAC
    requirements: [B96-F-PCS, B96-F-MAC]
    method: sim_test
    title: PCS and MAC cocotb bench against the bit-serial reference
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_pcs_rtl::test_pcs_mac_cocotb"]}
    checks: *rtl_pcs_mac
  - id: V-SIM-PCSMODEL
    requirements: [B96-F-PCS, B96-F-LOCK]
    method: sim_test
    title: Python reference properties (LFSR, descrambler self-sync, block codes, lock time, bit errors)
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_model::*"]}
    checks: [designs/b96_kr260_10g/model/pcs.py, designs/b96_kr260_10g/rtl/pcs_rx.sv, designs/b96_kr260_10g/rtl/pcs_tx.sv]
  - id: V-SIM-CORE-DEFAULT
    requirements: [B96-F-DEFAULT, B96-S-ORDERS]
    method: sim_test
    title: Whole core, RATE_MATCH = 0, under 97C's own bench
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_pcs_rtl::test_core_cocotb_default_rate_match_off"]}
    checks: *rtl_core
  - id: V-SIM-CORE-RM
    requirements: [B96-S-RATEMATCH, B96-S-ORDERS, B96-F-MAC]
    method: sim_test
    title: Whole core with the elastic buffers (macro and own gray-pointer)
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_pcs_rtl::test_core_cocotb", "test_b96_pcs_rtl::test_core_cocotb_rm_own"]}
    checks: *rtl_core
  - id: V-SIM-RM
    requirements: [B96-S-RATEMATCH]
    method: sim_test
    title: Rate matcher benches (macro, own buffer, direct-read variant, the MIN_KEEP limit)
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_pcs_rtl::test_rate_match_cocotb", "test_b96_pcs_rtl::test_rate_match_gp_cocotb", "test_b96_pcs_rtl::test_rate_match_gp_direct_read_cocotb", "test_b96_pcs_rtl::test_rate_match_min_keep_1_shows_the_limit"]}
    checks: *rtl_rm
  - id: V-SIM-PPM-PARTNER
    requirements: [B96-F-OFFSET]
    method: sim_test
    title: Simulated partner at a frequency offset (cocotb)
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_pcs_rtl::test_ppm_partner_cocotb"]}
    checks: *rtl_rm
  - id: V-SIM-EYESCAN
    requirements: [B96-F-EYESCAN]
    method: sim_test
    title: Eye-scan sequencer against its twin and a DRP stand-in
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_pcs_rtl::test_eyescan_cocotb", "test_b96_pcs_rtl::test_eyescan_absent_by_default"]}
    checks: *rtl_es
  - id: V-SIM-REGMAP
    requirements: [B96-I-REGMAP]
    method: sim_test
    title: Register map is current, decoded exactly, widths agree, stated rules hold
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_docs::*", "test_b96_host::*"]}
    checks: [designs/b96_kr260_10g/regmap.py, designs/b96_kr260_10g/docs/register_map.md]
  - id: V-SIM-DRIVER
    requirements: [B96-S-DRIVER, B96-S-LASER]
    method: sim_test
    title: Board bench, ppm and bypass drivers judged on a fake board (every safety counter, polarity, lock, verdicts)
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_bench::*", "test_b96c_ppm::*", "test_b96f1_bypass::*"]}
    checks: [designs/b96_kr260_10g/host/b96_bench.py, designs/b96_kr260_10g/host/b96c_ppm.py, designs/b96_kr260_10g/host/b96f1_bypass.py]
  - id: V-SIM-126-ALL3
    requirements: [B96-F-BUILDS, B96-S-DRIVER]
    method: sim_test
    title: Build lat_all3_bypass composes 97C's cuts with the bypass build's files, and its board driver's verdicts, references and lock prefix (brief 126)
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_126_all3_bypass::*"]}
    checks: [designs/b96_kr260_10g/lat_all3_bypass/build.yaml]
  - id: V-SIM-BUILDS
    requirements: [B96-F-BUILDS]
    method: sim_test
    title: Build parameter consistency
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_generics::*"]}
    checks: [designs/b96_kr260_10g/rtl/b96_core.sv]
  - id: V-SIM-LATENCY-MODEL
    requirements: [B96-P-LAT-E, B96-P-LAT-L, B96-P-LAT-D]
    method: sim_test
    title: Latency stage file reproduces the recorded numbers; board and simulation never added into one figure
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_latency::*", "test_b96f_loop_timing::*"]}
    checks: [designs/b96_kr260_10g/latency_stages.yaml]
  # ---- formal ---------------------------------------------------------------------------------------------------------
  - id: V-FORMAL-EQY-DEFAULT
    requirements: [B96-F-DEFAULT]
    method: formal
    title: eqy equivalence of the RATE_MATCH = 0 core with main 6909e43f's core (a planted change fails it)
    evidence: {file: results/b96c/eqy_default/result_default.txt, reader: text, regex: '^\[default\] (Successfully proved designs equivalent)', }
    pass_when: [{op: eq, value: Successfully proved designs equivalent}]
    checks: [designs/b96_kr260_10g/rtl/b96_core.sv, designs/b96_kr260_10g/rtl/rx_path_legacy.sv, designs/b96_kr260_10g/rtl/rx_path.sv]
  - id: V-FORMAL-SVA-PLANNED
    requirements: [B96-F-PCS, B96-S-RATEMATCH]
    method: formal
    title: SVA properties of the gray-pointer rate matcher with SymbiYosys (brief 115; designs/b96_kr260_10g/verif/formal/, results/b115); safety by k-induction, progress by BMC only; the recorded run re-proves every CI job, mutants included
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b115_formal::*"]}
  - id: V-SVA-PLANNED
    requirements: [B96-F-PCS, B96-F-MAC, B96-S-RATEMATCH]
    method: assertion
    title: Bound SVA checkers in simulation (brief 115)
    planned: no simulation run of the bound checkers is recorded (the proofs are in V-FORMAL-SVA-PLANNED)
  - id: V-UVM-PLANNED
    requirements: [B96-F-PCS, B96-F-MAC, B96-F-LOCK]
    method: uvm_test
    title: UVM 1.2 bench of the PCS and MAC in xsim 2026.1 (brief 112, merged as #244; designs/b96_kr260_10g/verif/uvm/); the recorded run is the smoke test (bench builds and t_smoke passes in xsim 2026.1) and every seeded bug applying to the RTL exactly once; the full regression is run by hand
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_uvm::*"]}
  - id: V-PYUVM
    requirements: [B96-F-PCS, B96-F-MAC, B96-F-LOCK]
    method: uvm_test
    title: pyuvm-on-cocotb twin of the UVM bench of the PCS and MAC (brief 123; designs/b96_kr260_10g/verif/pyuvm/); the recorded run is the reference-model checks, one smoke run in Icarus and one seeded-bug kill; the full regression is run by hand
    evidence: {file: results/116_traceability/b96_kr260_10g/pytest_junit.xml, reader: junit, tests: ["test_b96_pyuvm::*"]}
  - id: V-COV-PLANNED
