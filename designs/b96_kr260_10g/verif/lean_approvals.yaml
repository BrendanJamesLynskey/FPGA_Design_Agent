# Acceptances of Lean theorem statements (briefs 125 and 135). No tool in this repository writes this file, and an agent never sets an entry through the
# testplan. An entry is the owner's (`human`) or the planner's acceptance on the owner's standing delegation (`agent_delegated`); the two are kept apart.
#
# A statement is the specification. Until an entry exists for a formal_lean item, the matrix shows it as "statement not approved" and does not count the
# proof as verification. To accept one: read the statement and the definitions it rests on, with
#
#     python -m flow.trace_v1 lean-statement designs/b96_kr260_10g V-LEAN-GRAY-STEP
#
# then add an entry like the commented one below, copying both hashes from that output. From then on `python -m flow.trace_v1 check` (and CI) fails if the
# theorem's statement, or any definition in its module, differs from the approved hash.
#
# Two kinds of entry (`approver_kind`), both pinned by the frozen-statement gate:
#
#   human            a human approved the statement. Fields: approved_by, date. Shown as "statement approved by a human".
#   agent_delegated  the planner agent accepted it on the owner's delegation (owner decision 23). Fields: accepted_by, delegated_by, date. Shown as
#                    "statement accepted by <who> on the owner's delegation (not a human approval)"; it counts as verification but the summary line
#                    counts it apart ("N verified, of which M rest on delegated acceptances"). It never uses approved_by.
#
# approvals:
#   - item: V-LEAN-GRAY-STEP
#     theorem: Gray.gray_step
#     statement_sha256: <from lean-statement>
#     definitions_sha256: <from lean-statement>
#     approved_by: <your name>                # human; for agent_delegated use accepted_by + delegated_by instead
#     approver_kind: human                    # or: agent_delegated
#     date: YYYY-MM-DD
schema: fpga-design-agent/lean-approvals/v1
approvals: []
