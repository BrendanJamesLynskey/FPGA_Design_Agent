# rm_gp_itch (brief 127): the build rm_gp (RATE_MATCH = 1, RM_OWN = 1: our own gray-pointer elastic buffer) with brief 110's standard-protocol trading path inside: MoldUDP64 over UDP over IPv4 over Ethernet in,
# ITCH 5.0 decode, book, risk, OUCH 5.0 order out in a (stand-in) TCP/IPv4/Ethernet frame. Differences from rm_gp, and only these: rm_gp_itch/rtl/{b96_core,rx_path,tx_path}.sv in place of rtl/{b96_core,rx_path,tx_path}.sv
# (no RATE_MATCH = 0 path, no eye scan registers, the ITCH path and its registers), the new files in rm_gp_itch/rtl (udp_strip, itch_top, itch_path, order_seg, tx_mux, itch_pkg2), brief 110's blocks unchanged from
# designs/b110_itch_ouch/rtl, TRADE = 0 (the Bench Feed rule is off at reset; ARM of the ITCH path is IT_CTRL.ARM), and rtl/rx_path_legacy.sv left out. Same part, same GT Wizard, same constraints.
