gaps:
- about: power
  text: Not measured; no power report was made for any run, and no bitstream of the chain exists.
- about: throughput
  text: Not applicable to this work; the chain moves one 64-bit word a clock by construction and no throughput figure is
    claimed.
- about: board_run
  text: No board was touched, so no claim is made that a faster chain survives the transceiver's own latency; that is a
    question for an owner session.
- about: seeds
  text: Vivado's placer has no seed parameter, so a seed is a 0.01 ns step of the target period; two or three of them per
    capability, which shows scatter but is not a distribution.
- about: placer
  text: The annealer is a first cut that minimises wire length with fixed weights; the comparison says nothing about what
    a timing-driven RapidWright placer would do.
- about: single_chain
  text: One chain, one part (the K26 for all three capabilities; the Artix-7 only in stage 0), and the chain's GT is a bare
    primitive without the real clocking.
- about: block_interface
  text: A pre-implemented block with a wide input bus could not be stamped in Vivado 2026.1 (input pins unreachable past
    locked routes); the block used has three input pins.
- about: stage2
  text: Stage 2 is one run per arm; the arms differ in tools only, but the without arm's pblock build outlasted the tool
    call timeout, so its second attempt was never seen by the agent.
- about: review
  text: One Sonnet review and one fix round per the check-once rule; the fixes are not re-reviewed.
next_steps:
- Merge brief 97's latency path tool when it lands and give the placer its chain instead of the fixed cell patterns.
- A timing-driven placer that takes criticality from Vivado's report each round, and RWRoute with Vivado's delay model,
  then repeat the comparison on the full brief 96 design.
- Hand the stamped-block flow a wider interface by routing the block's input pins in context before locking its routes,
  or by reserving pin access in the out-of-context run.
open_questions:
- Does the relocatable block keep its delays on the Artix-7, where the column structure differs?
