# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b100_rapidwright
title: 'RapidWright in the agent: relocatable blocks, latency-aware placement and routing control, judged by Vivado 2026.1'
kind: showcase
produced_by: human
summary: Three RapidWright capabilities built as tested agent tools and compared with Vivado alone on the K26 (xck26-sfvc784-2LV-c).
  They are a pre-implemented block stamped at other sites with its internal timing kept, an annealing placer for the transmit
  latency chain of brief 96, and RWRoute routing of the whole design or of the worst-path nets. Vivado 2026.1 times every
  result; RapidWright's own estimates are never used. The block capability works and is the only one that beats Vivado alone
  (on repeatability); placement and routing lose to Vivado on timing; the agent given the tools did no better than the agent
  without them.
scope_not:
- a board run; no bitstream of the chain was made or loaded, and the chain's GT is a bare primitive without a reference
  clock or reset sequence
- a claim that RapidWright's placer or router is better or worse than Vivado's in general; this is one chain, one part,
  our first-cut placer and a handful of period perturbations
- the full brief 96 design; the chain is brief 96's own MAC and PCS RTL with a bare GT, not the GT Wizard design
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260
  top: chain_top (the chain); reloc_top (the block runs); s0_top (stage 0, also xc7a100tcsg324-1)
  tool: Vivado 2026.1
  note: RapidWright 2026.1.2 with the JRE inside Vivado 2026.1; no board is touched
clocks:
- name: clk
  mhz: 312.5
  source: designs/b100_rapidwright/agent_run/arm_a/design.xdc
  note: the stage 2 agent runs' constraint (3.2 ns); the other runs set their period per run (3.40 ns and perturbations)
    through the scripts, so no fixed XDC clock exists for them
resets:
- name: rst
  active: high
  note: synchronous, from a register in the source shift register; the RTL is brief 96's and is not changed here
interfaces:
- name: agent tools (rw_status, rw_relocate_block, rw_place_chain, rw_route, rw_referee)
  type: agent/core/rapidwright_tools.py; offered to a role only with FDA_RAPIDWRIGHT=1 and RapidWright installed
  doc: designs/b100_rapidwright/docs/tools.md
  note: every argument is validated, inputs are checkpoint file names inside build/<variant>/, outputs go to build/<variant>/rw/,
    and only rw_referee returns timing, from Vivado
- name: RapidWright scripts
  type: flow/rw/*.py run with the pinned venv python (flow/rapidwright_pin.py)
  doc: designs/b100_rapidwright/docs/design.md
  note: relocate.py, place_chain.py, route.py, roundtrip.py print one JSON line; they need RapidWright and Vivado 2026.1
    on PATH
parameters:
- name: clock period
  value: set per run by the scripts, 3.40 ns for the first chain run, plus 0.01 ns per perturbation (3.2 ns in the agent
    runs)
  legal: any period the scripts are given
  note: there is no fixed clock in an XDC; impl.tcl and stamp.tcl add create_clock on port clk from the run's period
- name: RapidWright
  value: 2026.1.2
  legal: the release whose year and minor match the Vivado release (2026.1.x)
  note: pinned with hashes in flow/rapidwright_pin.py; tools/rapidwright_env/setup.sh installs it
- name: block relocation targets
  value: SLICE_X35Y57, SLICE_X41Y117, SLICE_X41Y177 (original block at SLICE_X35Y87)
  legal: only the anchor sites RapidWright lists as valid for the block's footprint
  note: for the 128-slice block three columns were valid (X35, X38, X41)
- name: chain placer
  value: simulated annealing on whole slices, 200000 moves, window of 60 columns by 40 rows around GTHE4_CHANNEL_X0Y6
  legal: any slice site of the same type inside the window that is free; slices with carry chains or LUT RAM stay
  note: weighted half-perimeter wire length in tile units; its estimate is logged, never reported as a result
