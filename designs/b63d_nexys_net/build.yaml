# How flow/run_vivado.sh builds this design (paths are relative to the repo root).
top: b63d_nexys_net_top
part: xc7a100tcsg324-1
board: nexys_a7_100t    # report_power uses this board's thermal environment (boards/<board>/board.yaml)
sources:
  - shell/rtl/*.sv
  - ip_lib/eth_mac_rmii/rtl/*.sv
  - ip_lib/eth_mac_rgmii/rtl/eth_rx_classify.sv
  - ip_lib/eth_mac_rgmii/rtl/eth_mac_stats.sv
  - ip_lib/arp_responder/rtl/*.sv
  - ip_lib/icmp_echo/rtl/*.sv
  - ip_lib/igmp_join/rtl/*.sv
  - ip_lib/ipv4_udp_rx/rtl/*.sv
  - ip_lib/ipv4_udp_tx/rtl/*.sv
  - ip_lib/mdio_master/rtl/*.sv
  - designs/b63d_nexys_net/rtl/*.sv
constraints:
  - designs/b63d_nexys_net/design.xdc
generics: {}            # board values are the RTL defaults; BUILD_STAMP is added by the flow
