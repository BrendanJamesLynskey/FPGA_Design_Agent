gaps:
- about: board_run
  text: No board run exists. The PHY loopback phase needs no cable but must not start with a cable in J4. The link phase
    needs one cable from J4 to an isolated PC interface at 192.168.63.1/24, and the board owner's confirmation of the cabling
    (host/PLAN.md). Everything about the PHY, the pin timing in practice and the stack against a real host is unobserved.
- about: latency
  text: Not measured on the design. The block benches declare latencies (ARP 3, ICMP 4, UDP transmit 4 clocks) but no record
    times the design end to end.
- about: throughput
  text: Not measured; the design counts frames, and no record gives a frame rate or a bit rate.
- about: timing
  text: The pin timing uses RMII rev 1.2 figures (output change 2 to 14 ns after the clock, input setup 4 ns and hold 2
    ns), not the LAN8720A data sheet's REF_CLK-in table, which is not in the knowledge bank and must be checked before the
    board run. Board traces are ignored. The forwarded clock phase (335.25 degrees) was chosen from the tool's timing, not
    from a measurement.
- about: power
  text: Power is vectorless with confidence Low, and the junction temperature in the build record is a prediction; no XADC
    reading exists.
- about: E2
  text: The host safety checks use stand-in command outputs; the script cannot see past the cable, so a quiet network on
    the far side is not detected and the cabling still needs confirming by a person.
- about: E4
  text: The faults and formal records cover the library blocks the design uses, not this top. Only the MDIO frame is proved
    (k-induction); the other jobs are bounded model checks to 12 to 64 clocks, and the ICMP property checks one copied byte,
    not every byte.
- about: library
  text: No half duplex, no PFC, one VLAN tag, ARP entries do not age, one ICMP or UDP-transmit frame held at a time, IGMPv3
    reports not implemented, UDP receive has no reassembly. The 125 MHz target of the RGMII MAC is not met by several blocks,
    but this design runs at 50 MHz.
- about: behaviour
  text: A UDP datagram to the service on an ARP cache miss is dropped and an ARP request goes out, so the first datagram
    after boot is unanswered; IGMP reports start only after GROUP_EN is set (reset 0); the idle board sends nothing unsolicited;
    event counters are 16 bits and wrap; offsets of the register window not in the map read 0.
next_steps:
- Check the LAN8720A REF_CLK-in input timing against its data sheet, and cite it in build.yaml and design.xdc.
- With the owner's cabling confirmation, run phase 1 (loopback) and then phase 2 (isolated link) and add the records under
  results/.
- Pipeline ipv4_udp_rx, ipv4_udp_tx, igmp_join and icmp_echo toward 125 MHz before they sit behind an RGMII MAC on another
  board.
open_questions:
- Does the LAN8720A accept the REF_CLK phase chosen from tool timing, with real board traces?
