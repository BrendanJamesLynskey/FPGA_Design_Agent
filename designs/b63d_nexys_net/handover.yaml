# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b63d_nexys_net
title: Small network stack on the Nexys A7-100T
kind: demonstration
produced_by: human
summary: Answers ARP and ping, receives and sends UDP, joins IGMP multicast groups and counts frames on the Nexys A7's 10/100
  Ethernet PHY (LAN8720A, RMII). A UDP service on port 5000 replies with the tag N63D and 21 statistics counters. A frame
  injector and capture let the host check the stack through the PHY's loopback with no cable. Built and simulated; it has
  not been run on a board.
scope_not:
- a gigabit design; the RGMII MAC in ip_lib cannot run on this board, whose PHY is RMII
- a board-verified design; no board run exists
target:
  part: xc7a100tcsg324-1
  board: Nexys A7-100T
  top: b63d_nexys_net_top
  tool: Vivado 2026.1
  note: the blocks come from ip_lib; this folder holds the top, constraints, tests and the host script
clocks:
- name: CLK100MHZ
  mhz: 100
  source: designs/b63d_nexys_net/design.xdc
  note: board oscillator; an MMCM makes the 50 MHz logic clock (generated clocks c0 and eth_refclk, 20 ns) and a second
    50 MHz output at 335.25 degrees that is forwarded to the PHY as ETH_REFCLK
resets:
- name: CPU_RESETN
  active: low
  note: the reset button; the PHY has its own reset (ETH_RSTN), held low by CTRL bit 3
interfaces:
- name: UART register window
  type: test shell, 8N1 UART at 115200 baud (CLKS_PER_BIT 434 at 50 MHz)
  doc: shell/PROTOCOL.md
  note: control, own MAC and IP, MDIO, IGMP groups, 21 statistics counters, event counters, XADC codes and latched alarms,
    frame injector and capture; the map is in the header of rtl/b63d_nexys_net_top.sv; unlisted offsets read 0
- name: RMII PHY
  type: LAN8720A on ETH_CRSDV, ETH_RXERR, ETH_RXD[1:0], ETH_TXEN, ETH_TXD[1:0], ETH_REFCLK, MDC and MDIO (LVCMOS33)
  doc: designs/b63d_nexys_net/host/PLAN.md
  note: REF_CLK-in mode, 10/100 only; pin timing is constrained against the forwarded eth_refclk with the RMII rev 1.2 figures
- name: UDP statistics service
  type: UDP, port 5000 (UDP_PORT register, reset 5000)
  doc: designs/b63d_nexys_net/rtl/b63d_nexys_net_top.sv
  note: any good datagram is answered with N63D and the counters, big-endian, to the sender's address and port; on an ARP
    cache miss it sends an ARP request and drops the datagram, so the sender must retry
- name: LEDs
  type: LED[3:0] (LVCMOS33)
  note: LED0 heartbeat, LED1 receive activity, LED2 transmit activity, LED3 on once any echo reply has been sent
parameters:
- name: own MAC
  value: 02:00:00:00:00:63
  legal: any; registers MAC_HI and MAC_LO
  note: reset value, locally administered
- name: own IPv4
  value: 192.168.63.2
  legal: any; register IP
  note: reset value
- name: IGMP groups
  value: 239.63.0.1 and 239.63.0.2
  legal: registers GROUP0, GROUP1; enabled by GROUP_EN, reset 0
  note: the filter's exact multicast table is fed from them
- name: CLKS_PER_BIT
  value: 434
  legal: positive integer
  note: UART bit period at the 50 MHz logic clock
