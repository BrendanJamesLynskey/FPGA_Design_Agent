gaps:
- about: resources
  text: Not measured on Vivado 2026.1; only the earlier release built this design, and brief 49 withdrew those numbers.
    The RTL is the same as b30_hil_audio, whose 2026.1 numbers are in that design's handover, but the placed design was
    not measured.
- about: timing
  text: Not measured on Vivado 2026.1 (see resources). The pin constraint differs from b30_hil_audio, so its slack is not
    assumed equal.
- about: power
  text: Not measured on Vivado 2026.1 (see resources).
- about: latency
  text: Not measured; no record times a window read or the tone path.
- about: throughput
  text: Not applicable; the design is an instrument carrier with a deliberate fault.
- about: E2
  text: The earlier-release build passed its gates, but the design was not rebuilt on 2026.1.
- about: build_2026_1
  text: The 2026.1 build gate was never run for this design; re-run flow/run_vivado.sh designs/b30_hil_audio_pinfault base.
- about: E3
  text: The board run used a bitstream built on the earlier Vivado release and was one run, so there is no spread. The run's
    overall result is fail by intent; the evidence shows the fault is caught, not that the design works.
- about: audio calibration
  text: The audio level is relative to the capture interface's full scale at an uncalibrated gain; the noise floor of the
    interface alone was not recorded, and the pass thresholds were not tuned on a no-tone capture.
- about: fault coverage
  text: One fault in one class (a wrong pin) was seeded. No record shows what the audio stage does with the signal on the
    LED pin beyond the capture at the jack, and no other pin or constraint fault was tried.
- about: behaviour
  text: Everything the design does on the register window is as in b30_hil_audio, including its gaps; the LED[0] indicator
    is on a different pin from that design's, and nothing reads it.
next_steps:
- Rebuild on Vivado 2026.1 and re-run flow/hil.py on that bitstream.
- Capture the audio interface with no tone, so the check's thresholds can be shown to separate a working design from a silent
  one with margin.
- Seed further faults of the same class (a swapped or floating pin) if the repair loop is to be tested on them.
open_questions:
- Should the hardware-in-the-loop stage feed this failure back to the agent's repair loop, and what constraint change should
  it suggest?
