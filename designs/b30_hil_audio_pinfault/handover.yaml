  field: checks.tone_at_the_jack.measured.sinad_db
  conditions: same capture as M1; pass threshold at least 15 dB, so this fails
  value: -2.89
  sha256: 6434637459af7716e05bf0521f09523a5a2445fd1aeff0d6ecfb4a66b912def4
- id: M4
  what: tone frequency measured inside the FPGA
  category: board
  unit: Hz
  record: results/b30/hil_runs/b30_hil_audio_pinfault.hil.json
