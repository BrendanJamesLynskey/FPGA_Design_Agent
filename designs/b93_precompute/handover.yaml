gaps:
- about: board_run
  text: Not run on a board and not built inside the 58A top; ML_PRE 1 to 3 are simulation only.
- about: timing
  text: Out of context the clock has no buffer or jitter, so every latency is quoted at no faster than 2.0 ns; the bypass
    path of the gate is not in the block builds.
- about: power
  text: Not measured; the out-of-context builds have no power report.
- about: throughput
  text: Every block accepts one input a clock (the test streams half the vectors back to back); no separate throughput figure
    is recorded.
- about: data
  text: One synthetic data set and one set of 87 features; none of them uses the message's own price, which is why the table
    arm gains nothing in clocks.
- about: behaviour
  text: 'Guessable wrongly: state is committed at the price field, not at the early clock; a table block answers with another
    message''s table if l_v breaks the timing contract and nothing detects it; the late feature is delayed by the fill in
    trigger_core, it is not really late.'
next_steps:
- Build the KR260 top with ML_PRE 1 and ML_ARM 4, then a board run.
- Train a model with the message's own price as an input (for example inside or outside the touch) and measure the table
  arm on it.
- Pipeline the table fill inside the model, not only at the scores, to see whether the table block can beat its baseline
  clock for trees.
open_questions:
- Is one core clock worth the extra flip-flops of the early feature unit on the board, or is the rule table the longer path
  to shorten next?
