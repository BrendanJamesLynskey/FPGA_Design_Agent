# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b93_precompute
title: Deciding before the last byte, precomputing the ML decision on a serial feed
kind: showcase
produced_by: session
summary: Measures how much of the brief 87 decision model can be done while a message is still arriving. The model's inputs
  turn out to be known three clocks before the price field, so computing the features early removes the one or three clocks
  the model added to the 58A path, at no LUT cost. A table of the model's class per interval of its deepest feature (partial
  evaluation) is built for the 87 trees and the 89 lg_small network and measured, and it saves nothing in clocks in this
  design.
scope_not:
- real market data or a real exchange feed; the data are brief 87's seeded synthetic order flow and our own Bench Feed v1
  format
- a board run or a full-design build of ML_PRE 1 to 3; every hardware number is an out-of-context, post-route Vivado 2026.1
  block build
- a model that uses the message's own price; none exists in this programme, and every arm must equal the 87 integer model
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260 (K26 SOM); also xc7a100tcsg324-1 (Nexys A7) out of context
  top: ooc_wrap (one block with input registers), out of context; the integration is trigger_core in simulation
  tool: Vivado 2026.1
  note: no board top; the new parameter ML_PRE (default 0) of trigger_core selects the early and table paths
clocks:
- name: clk
  mhz: 166.7
  source: results/b93/ooc/k26/ml_feat_pre.json
  note: the early feature unit's closed clock on the K26 out of context; the 58A core runs at 125 MHz (8 ns, a byte a clock)
    and every block's closed clock is in results/b93/ooc/<part>/<block>.json
resets:
- name: rst
  active: high
  note: synchronous; clears the valid pipeline and, in the feature unit and gate, the state; never the table or datapath
    of a table block
interfaces:
- name: table block ports
  type: clk, rst, e_v, e_f[37:0], l_v, l_x[7:0], out_v, out_cls[1:0]
  doc: designs/b93_precompute/docs/blocks.md
  note: l_v must come FILL clocks after e_v and no later than FILL - 1 clocks after the next e_v; out_v is l_v delayed by
    exactly one clock
- name: trigger_core parameters ML_ARM and ML_PRE
  type: ML_ARM and ML_PRE, integer parameters
  doc: designs/b93_precompute/docs/blocks.md
  note: ML_PRE 0 is the 87 behaviour and the default; registers 0x02A-0x02C are unchanged
parameters:
- name: ML_PRE
  value: 0 (default), 1, 2 and 3 all built in simulation
  legal: 0 to 3; 2 and 3 need ML_ARM 1 or 4
  note: 1 early features; 2 and 3 early features and a table block with a fill of 1 or 2 clocks
