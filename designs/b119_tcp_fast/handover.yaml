gaps:
- about: board_run
  text: Not run on a board; phase 2 would put the block behind the 10G MAC of the KR260 design (docs/phase2_integration.md).
- about: power
  text: Not measured; an out-of-context build has no realistic activity and nothing ran on a board.
- about: E6
  text: Out of context the clock has no buffer or jitter and the inputs are registered in the wrapper; inside the 10G core
    the clock and placement can differ.
- about: mac
  text: The pair of this block and the 10G MAC's transmit path was not simulated; whether a MAC accepts a word every clock,
    pads a short poisoned frame and corrupts the frame check sequence on request is the 96 design's behaviour, not shown
    here.
- about: refusals
  text: A refused order is lost and the risk logic of brief 110 is not told, so its order number and position count have
    already moved; the feedback is not built.
- about: tcp
  text: No TCP options (timestamps must be off on the connection), no selective acknowledgement, no window scaling inside
    the block (software scales the values it writes), one connection, no hardware retransmission and no parsing of received
    segments.
- about: software
  text: The TCP endpoint is a minimal user-space model with no congestion control, delayed acknowledgements, orderly close
    or zero-window probes; the exchange follows the Nasdaq documents for the fields it fills but is our own model and no
    real port was involved.
- about: spec
  text: SoupBinTCP 3.00 and OUCH 5.0 layouts of the exchange's replies were read from the public documents; the padding
    of the Login Request's sequence number field is assumed, and brief 110's UNCONFIRMED items about the Enter Order stay
    open.
- about: busy
  text: The block is busy for fifteen clocks per segment, so brief 110's order queue sees a longer busy time than with the
    stub port; the effect on rejected candidates at a real feed rate was not measured.
- about: data
  text: Synthetic orders from our own generators; the figures say how the block behaves on them and nothing about a market.
next_steps:
- Build the transmit multiplexer and the register bridge of docs/phase2_integration.md, and simulate the block with the
  96 design's MAC.
- Add the refusal feedback from the block to the risk logic (release the order number and the position).
- Run the owner against a real TCP peer on the host (a second machine or a namespace) and compare captures with the bench's
  frames.
open_questions:
- Is the fifteen-clock busy time acceptable at the feed rates of interest, or should a second segment buffer let the next
  order start while the last words go out?
- Should the owner's pure acknowledgements go through the block so that its sequence number is always current?
