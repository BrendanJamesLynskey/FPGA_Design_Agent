# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b119_tcp_fast
title: TCP fast path for OUCH orders (software owns the connection, hardware sends pre-built segments)
kind: showcase
produced_by: session
summary: A block that holds the TCP connection state which software hands it and sends each OUCH 5.0 order of brief 110
  as one complete Ethernet, IPv4 and TCP frame, with sequence number, identification and both checksums finished incrementally
  from partial sums of a template. It supports the speculative start and abort of brief 110, where an aborted frame is poisoned
  and consumes no sequence space, refuses to send when it is not armed, its state is stale, the window is closed or the
  MSS is too small, and hands every sent segment back to software. A Python TCP owner and a software OUCH exchange test
  it end to end in simulation, seeded faults in the RTL are caught, and the block is built out of context for the KR260's
  part at the 10G core clock.
scope_not:
- real market data, a real exchange or a real network; every order comes from our own generator and no frame is ever sent
  anywhere
- a board run, power, or timing inside the 10G core; the numbers are simulation and an out-of-context Vivado 2026.1 build
- receiving, parsing or acknowledging anything; software owns the receive side and writes the acknowledgement state into
  the block
- TCP options, selective acknowledgement, window scaling, several connections or a hardware retransmission
- the MAC, the frame check sequence and the transmit multiplexer; the block's words go to a MAC that does not exist here
  (docs/phase2_integration.md is a plan)
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260 (K26 SOM)
  top: tcp_fast (wrapped with input registers in ooc_wrap for the out-of-context build)
  tool: Vivado 2026.1
  note: no board top of its own; it replaces ouch_enter of designs/b110_itch_ouch and feeds the 10G MAC of designs/b96_kr260_10g
    in phase 2
clocks:
- name: clk
  mhz: 161.132
  source: results/b119/ooc/tcp_fast.json
  note: the 10G core user clock (nominally 161.1328125 MHz); the out-of-context build constrains the period 6.2061 ns, the
    4-decimal rounding of the nominal
resets:
- name: rst
  active: high
  note: synchronous; resets every register including the counters; the block is not armed after reset; one clock domain,
    no asynchronous input
interfaces:
- name: order side
  type: go, go_spec, f_sym, f_px, f_qty, f_ref, commit, abort, cfg_*, busy, late, refuse_v, refuse_code (the ports of ouch_enter
    of brief 110 and three more)
  doc: designs/b119_tcp_fast/docs/tcp_fast.md
  note: a go while busy is dropped; a refused order is lost; abort in the go clock cancels the go; cfg_* must stay static
    while a segment is in flight
- name: segment output
  type: o_v, o_d[63:0], o_sof, o_eof, o_keep[7:0], o_poison (to the MAC)
  doc: designs/b119_tcp_fast/docs/tcp_fast.md
  note: 113 bytes without the frame check sequence in fifteen words, never paused; o_poison with the last word asks the
    MAC to corrupt the check sequence
- name: sent-segment record
  type: rec_v, rec_seq, rec_len, rec_id, rec_pay[511:0]
  doc: designs/b119_tcp_fast/docs/tcp_fast.md
  note: one clock for each unpoisoned segment and not buffered; a poisoned segment produces none
- name: software register bus
  type: sw_we, sw_waddr[4:0], sw_wdata[31:0], sw_raddr[4:0], sw_rdata[31:0]
  doc: designs/b119_tcp_fast/docs/tcp_fast.md
  note: static writes while busy are ignored and counted; live registers restart the staleness age; reads show the registers
    as they were before the next edge
parameters:
- name: PAYLEN
  value: 59
  legal: fixed
  note: the payload is always one SoupBinTCP Unsequenced Data packet carrying an Enter Order (brief 110); there are no module
    parameters
- name: segment bytes
  value: 113
  legal: fixed
  note: Ethernet 14, IPv4 20, TCP 20 without options, payload 59; fifteen 64-bit words
