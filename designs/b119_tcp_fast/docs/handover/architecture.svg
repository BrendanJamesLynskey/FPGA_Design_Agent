<svg xmlns="http://www.w3.org/2000/svg" width="640" height="424" viewBox="0 0 640 424" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="424" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">reg_file</text><text x="170" y="43">register bus: connection addressing, sequence and window state, stale </text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">template_build</text><text x="170" y="77">two clocks after an arm write: folded partial sums of the fixed IPv4 h</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">decide</text><text x="170" y="111">at the go edge: busy, not armed, template not valid or state stale, wi</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">csum_pipe</text><text x="170" y="145">IPv4 checksum final at edge 2 and TCP checksum final at edge 5 by addi</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">seg_out</text><text x="170" y="179">header words from the template and captured fields, payload realigned </text><rect x="8" y="196" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="213">ouch_enter</text><text x="170" y="213">brief 110&#x27;s OUCH 5.0 Enter Order in SoupBinTCP 3.00 framing (59 b</text><rect x="8" y="230" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="247">record</text><text x="170" y="247">on an unpoisoned segment: sequence number, length, identification and </text><text x="8" y="274" font-weight="bold">Interfaces</text><text x="8" y="292">tcp_fast - ouch_enter: order_side (simple)</text><text x="8" y="310">reg_file - template_build: register_bus (simple)</text><text x="8" y="328">template_build - csum_pipe: template (simple)</text><text x="8" y="346">decide - csum_pipe: captured_state (simple)</text><text x="8" y="364">seg_out - tcp_fast: segment_words (simple)</text><text x="8" y="382">ouch_enter - seg_out: frame_words (simple)</text><text x="8" y="400">record - tcp_fast: sent_record (simple)</text></svg>
