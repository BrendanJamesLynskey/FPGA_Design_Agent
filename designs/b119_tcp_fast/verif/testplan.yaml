# b119_tcp_fast testplan, schema v1 (brief 133): the specification and the evidence that checks it, in one place.
#
# WHO DOES WHAT. A human specifies the requirements below and checks that the verification is thorough enough. The agent holds the knowledge to
# implement and to verify. The user can open any implementation or evidence file and does not have to.
#
# DRAFT STATUS. Every requirement here was written from the design's README, datasheet (docs/tcp_fast.md), handover and records (results/b119) by the
# agent. None is agreed by a human yet (`spec_status: draft`); the matrix says so. A bound drawn from a recorded run is a regression bound and its text
# says so; the owner sets the target.
#
# Status is never typed here. `python -m flow.trace_v1 write designs/b119_tcp_fast` reads the evidence files named below and computes
# pass / fail / not run / stale / bounded per item and a roll-up per requirement. A hook (`planned:`) is evidence that does not exist yet.
#
# The three Lean checksum requirements (B119-F-CKSUM-IP, -TCP, -MODEL) were filed under the b96 testplan by brief 125 and moved here by brief 133:
# they are about tcp_fast.sv, not the b96 core. Their statements are not approved by a human (verif/lean_approvals.yaml is the owner's alone).
schema: fpga-design-agent/testplan/v1
design: b119_tcp_fast
notes: >-
  Simulation (cocotb on Icarus Verilog 12, one recorded pytest run) and out-of-context Vivado 2026.1 results only. No board run, no MAC of the 96 design
  in the simulation, no real TCP peer, no real exchange; every order is synthetic. Requirements that need those are hooks and show as not run.

discover:
  - {glob: designs/b119_tcp_fast/tests/test_*.py, pattern: '^def (test_\w+)'}

x-rtl: &rtl [designs/b119_tcp_fast/rtl/tcp_fast.sv]
x-rtl-top: &rtl_top [designs/b119_tcp_fast/rtl/tcp_fast.sv, designs/b119_tcp_fast/rtl/itch_ouch_tcp_top.sv]
x-model: &model [designs/b119_tcp_fast/model/tcpref.py, designs/b119_tcp_fast/model/softtcp.py, designs/b119_tcp_fast/model/soup.py,
  designs/b119_tcp_fast/model/hwmodel.py, designs/b119_tcp_fast/model/orders.py]
x-junit: &junit results/116_traceability/b119_tcp_fast/pytest_junit.xml

x-lean-cksum-link: &lean_cksum_link
  kind: transcription_tested
  source:
    - {file: designs/b119_tcp_fast/rtl/tcp_fast.sv, lines: "256-260"}
    - {file: designs/b119_tcp_fast/rtl/tcp_fast.sv, lines: "326-336"}
  transcribed_in: formal/lean/Cksum/Spec.lean (fold16, ipTmpl, rtlIpCsum, tcpTmpl, rtlTcpCsum)
  crosscheck: {file: formal/lean/Cksum/CrossCheck.lean, reference: "brief 119's Python reference designs/b119_tcp_fast/model/tcpref.py, which 119's cocotb tests check against the RTL; 300 random connections and orders, by formal/lean/tools/crosscheck_b119.py"}
x-lean-model-link: &lean_model_link
  kind: model_only


requirements:
  # ---- functional: the segment ---------------------------------------------------------------------------------------
  - id: B119-F-SEGMENT
    kind: functional
    title: Each order leaves as one complete 113-byte Ethernet, IPv4 and TCP frame, byte exact against the reference
    text: For any connection state and order, the block sends 15 words (113 bytes without the frame check sequence) whose bytes equal the Python reference, with sequence number, acknowledgement number, window and IP identification captured at the go edge, the SoupBinTCP Unsequenced Data packet of brief 110 as payload, no TCP options and the PSH and ACK flags, including sequence numbers at the 32-bit wrap.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#21-the-segment
    spec_status: draft
  - id: B119-F-CKSUM-RTL
    kind: functional
    title: Both checksums on the wire are the RFC 1071 checksums, at the corner cases
    text: The IPv4 header checksum and the TCP checksum of every segment sent equal the reference's, which is itself checked against outside vectors (RFC 1071, a published IPv4 header), including carries in the fold, sums that wrap, a TCP checksum that comes out 0 and a segment whose headers sum to all ones. This is checked by simulation of chosen and random cases; the all-inputs statements are B119-F-CKSUM-IP, -TCP and -MODEL.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#22-checksums-incremental-not-recomputed
    spec_status: draft
  - id: B119-F-HANDBACK
    kind: functional
    title: Every segment that left is handed back to software, and none that was poisoned
    text: One record (rec_v, rec_seq, rec_len, rec_id, rec_pay) for each unpoisoned segment in the clock of its last word, and none for a poisoned one, so software can retransmit from the records; a segment dropped on the wire is retransmitted by software with the same bytes.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#13-hand-back-to-software-rec_
    spec_status: draft
  - id: B119-F-E2E
    kind: functional
    title: A Python TCP owner and a software OUCH exchange run a whole session through the block
    text: Handshake, SoupBinTCP login, orders, acknowledgements, a dropped segment, heartbeats, a small window and a rejected login all behave as the software side documents, with the exchange seeing every order exactly once and in order.
    source: designs/b119_tcp_fast/docs/software_side.md#what-the-tests-show
    spec_status: draft
  - id: B119-F-LINT
    kind: functional
    title: The RTL lints clean
    text: Verilator -Wall over tcp_fast.sv and the frame builder inside it reports no warnings, with the waivers in lint/lint_waivers.vlt.
    source: designs/b119_tcp_fast/README.md#verified
    spec_status: draft
  # ---- interface -----------------------------------------------------------------------------------------------------
  - id: B119-I-ORDERPORT
    kind: interface
    title: The block replaces the order port of brief 110 and works behind its risk logic
    text: With tcp_fast in place of ouch_enter, brief 110's path against brief 110's reference model sends the same orders, with the same payload bytes, valid checksums and gapless sequence numbers; speculative orders that the risk logic refuses leave poisoned.
    source: designs/b119_tcp_fast/README.md#verified
    spec_status: draft
  - id: B119-I-REGBUS
    kind: interface
    title: The register bus and counters behave as the datasheet states
    text: Writes to static fields invalidate the template and are ignored and counted while a segment is in flight; live fields are accepted at any time and restart the staleness age; reads show the registers before the next edge; unmapped addresses read 0; the 14 counters count what the datasheet says and clear on CLR_CNT.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#14-register-bus-sw_
    spec_status: draft
  # ---- safety ------------------------------------------------------------------------------------------------------
  - id: B119-S-ABORT
    kind: safety
    title: An aborted or unverdicted segment is poisoned and consumes no sequence space
    text: An abort at any of edges 1 to 14 ends the frame with o_poison, leaves SND_NXT and IP_ID as before and produces no record; an abort at edge 0 cancels the go; a speculative segment with no verdict by edge 14 is poisoned; an abort wins over a commit; an abort after the frame left is late, counted and ignored.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#24-speculative-start-abort-verdict
    spec_status: draft
  - id: B119-S-REFUSE
    kind: safety
    title: The block refuses to send when it is not armed, stale, window-closed, too small or busy
    text: Checked in the order busy, not armed, template not valid or state stale, window closed, MSS below 59, an order is refused with the matching code and counter, nothing leaves and no state changes; a window of exactly 59 bytes admits one segment and one byte less admits none.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#25-refusals
    spec_status: draft
  - id: B119-S-SEQSPACE
    kind: safety
    title: The peer sees no gap and no duplicate in the sequence space
    text: Hardware and software share one sequence space. After a heartbeat takes it and gives it back, after an abort, after a refusal and after a retransmission, the peer's received stream has no gap and no duplicate, and nothing is sent by software while the block is armed and idle.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#3-what-software-must-do-and-when
    spec_status: draft
  - id: B119-S-SUMGUARD
    kind: safety
    title: A segment whose payload disagrees with the checksum that was sent is poisoned
    text: The block sums the payload words ouch_enter actually emits and compares the total with the early one the checksum used; a difference (for example a configuration change in flight) poisons the segment and counts sumerr, so a wrong checksum is never sent as valid.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#22-checksums-incremental-not-recomputed
    spec_status: draft
  - id: B119-S-FAULTS
    kind: safety
    title: A seeded fault anywhere in the checksum, segment, verdict, refusal or register logic is caught
    text: Every one of the seeded faults of verif/mutants.yaml that builds fails the bench (mutation score 100 percent, 73 of 73). The set is the agent's own; whether it is wide enough is the human's check.
    source: designs/b119_tcp_fast/verif/mutants.yaml
    spec_status: draft
  # ---- hardware and peers that are not here yet -----------------------------------------------------------------------
  - id: B119-F-MACPAIR
    kind: functional
    title: The 96 design's MAC accepts the block's words every clock and corrupts the frame check sequence on o_poison
    text: tcp_fast and mac64_tx of designs/b96_kr260_10g simulated together. A 15-word segment is accepted without a pause, a short poisoned frame is padded as needed and its frame check sequence is wrong, and a good segment's is right. Not simulated yet.
    source: designs/b119_tcp_fast/docs/phase2_integration.md
    spec_status: draft
    external: the 96 design's MAC (mac64_tx) and, for the board, the KR260
  - id: B119-F-REALPEER
    kind: functional
    title: The owner completes a session with a real TCP peer and the frames match the bench's
    text: Software owner against a real TCP stack (a second machine or a network namespace) with a capture compared with the bench's frames. Handshake, data, acknowledgements and the window agree. Not done yet.
    source: designs/b119_tcp_fast/README.md#next-steps
    spec_status: draft
    external: a real TCP peer on a second machine or namespace
  # ---- performance (simulation and out-of-context; regression bounds drawn from results/b119) ---------------------------
  - id: B119-P-FIRSTBYTE
    kind: performance
    title: First byte of the frame, clocks after go
    text: Regression bound drawn from the bench record; the owner sets the target. The same clock in which brief 110's stub port shows its first word.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#4-latency-and-rate
    spec_status: draft
    performance: {quantity: clocks from go to the first byte of the frame, unit: clocks, op: le, bound: 1, condition: "simulation, one clock, block alone"}
  - id: B119-P-IPCKSUM
    kind: performance
    title: IPv4 checksum field complete, clocks after go
    text: Regression bound drawn from the bench record; the owner sets the target.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#23-timing-of-a-segment
    spec_status: draft
    performance: {quantity: clocks from go to the last byte of the IPv4 checksum field, unit: clocks, op: le, bound: 4, condition: "simulation, one clock, block alone"}
  - id: B119-P-TCPCKSUM
    kind: performance
    title: TCP checksum field complete, clocks after go
    text: Regression bound drawn from the bench record; the owner sets the target. It is inside the header's own transmission time.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#23-timing-of-a-segment
    spec_status: draft
    performance: {quantity: clocks from go to the last byte of the TCP checksum field, unit: clocks, op: le, bound: 7, condition: "simulation, one clock, block alone"}
  - id: B119-P-SEGMENT
    kind: performance
    title: Whole segment out, clocks after go
    text: Regression bound drawn from the bench record; the owner sets the target.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#4-latency-and-rate
    spec_status: draft
    performance: {quantity: clocks from go to the last byte of the segment, unit: clocks, op: le, bound: 15, condition: "simulation, one clock, block alone"}
  - id: B119-P-RATE
    kind: performance
    title: Segment rate, clocks between starts
    text: Regression bound drawn from the bench record; the owner sets the target. The block is busy for the whole segment and drops a go meanwhile.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#4-latency-and-rate
    spec_status: draft
    performance: {quantity: clocks between the starts of two segments sent back to back, unit: clocks, op: le, bound: 15, condition: "simulation, one clock, block alone"}
  - id: B119-P-TOP-SPEC
    kind: performance
    title: Speculative start behind brief 110's risk logic, clocks from the last ITCH byte
    text: Regression bound drawn from the top-level record; the owner sets the target. Only when the frame is idle and no earlier candidate is in flight.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#4-latency-and-rate
    spec_status: draft
    performance: {quantity: clocks from the last byte of a triggering ITCH message to the first byte of the Ethernet frame, speculative start, unit: clocks, op: le, bound: 3, condition: "simulation of brief 110's path with the block behind it, one clock, frame idle"}
  - id: B119-P-TOP-VERDICT
    kind: performance
    title: Start at the verdict behind brief 110's risk logic, clocks from the last ITCH byte
    text: Regression bound drawn from the top-level record; the owner sets the target.
    source: designs/b119_tcp_fast/docs/tcp_fast.md#4-latency-and-rate
    spec_status: draft
    performance: {quantity: clocks from the last byte of a triggering ITCH message to the first byte of the Ethernet frame, frame started at the risk verdict, unit: clocks, op: le, bound: 8, condition: "simulation of brief 110's path with the block behind it, one clock, frame idle"}
  - id: B119-P-TIMING
    kind: performance
    title: Post-route setup slack at the 10G core clock, out of context
    text: The required clock is 6.2061 ns, the 4-decimal rounding of 161.1328125 MHz. Out of context there is no clock buffer or jitter and the inputs are registered in the wrapper; inside the 10G core the clock and placement can differ.
    source: designs/b119_tcp_fast/README.md#technical-parameters
    spec_status: draft
    performance: {quantity: worst setup slack, unit: ns, op: ge, bound: 0, condition: "Vivado 2026.1, xck26-sfvc784-2LV-c, out of context, post-route, period 6.2061 ns"}
  - id: B119-P-HOLD
    kind: performance
    title: Post-route hold slack at the 10G core clock, out of context
    text: As B119-P-TIMING.
    source: designs/b119_tcp_fast/README.md#technical-parameters
    spec_status: draft
    performance: {quantity: worst hold slack, unit: ns, op: ge, bound: 0, condition: "Vivado 2026.1, xck26-sfvc784-2LV-c, out of context, post-route, period 6.2061 ns"}
  - id: B119-P-AREA
    kind: performance
    title: LUTs of tcp_fast at the required clock
    text: Regression bound drawn from the out-of-context build, frame builder included; the owner sets the target. Registers, block RAM and DSP are checked in the same record.
    source: designs/b119_tcp_fast/README.md#technical-parameters
    spec_status: draft
    performance: {quantity: LUTs of tcp_fast including the frame builder inside it, unit: LUT, op: le, bound: 1546, condition: "Vivado 2026.1, xck26-sfvc784-2LV-c, out of context, period 6.2061 ns"}
  # ---- Lean: the checksum equations, for all inputs (briefs 124 and 125; moved from the b96 testplan by brief 133) ----------------------
  # A formal_lean item is a Lean 4 proof, checked by Lean's kernel. Its statement is the specification and only a human approves it
  # (verif/lean_approvals.yaml, empty today: every statement below is "statement not approved"). Nothing here models timing or control.
  - id: B119-F-CKSUM-IP
    kind: functional
    title: The IPv4 header checksum of the TCP fast path equals the Internet checksum, for all inputs
    text: Brief 119's tcp_fast.sv builds the IPv4 header checksum from a precomputed template plus the changing fields. For all TTL, address and identification values it equals the complement of the ones' complement sum of the header, and the filled-in header sums to 0xFFFF.
    source: brief 119 (PR 245), designs/b119_tcp_fast/rtl/tcp_fast.sv; results/124_lean/README.md
    spec_status: draft
  - id: B119-F-CKSUM-TCP
    kind: functional
    title: The TCP checksum of the TCP fast path equals the Internet checksum, for all inputs and payloads up to 30 words
    text: For all addresses, ports, sequence and acknowledgement numbers, windows and payloads of up to 30 sixteen-bit words, the checksum the RTL equations produce equals the complement of the ones' complement sum over pseudo-header, header and payload. The byte-pair swapping, the streaming receive check and the timing are not modelled.
    source: brief 119 (PR 245), designs/b119_tcp_fast/rtl/tcp_fast.sv; results/124_lean/README.md
    spec_status: draft
  - id: B119-F-CKSUM-MODEL
    kind: functional
    title: The ones' complement arithmetic the checksum equations rest on is correct, for lists of any length
    text: The ones' complement sum of any list of 16-bit words equals the natural-number sum reduced mod 65535, and RFC 1624 equation 3 (incremental update) is correct for a header of any length when the new header is not all zero words; for an all-zero header it gives 0x0000. No current RTL patches a checksum in place; this is the arithmetic the fast path's template-plus-fields form relies on.
    source: results/124_lean/README.md
    spec_status: draft


verification:
  # ---- Python-side tests: the reference, the endpoint, the owner and the exchange (one recorded pytest run) ---------------------------
  - id: V-MODEL-CKSUM
    requirements: [B119-F-CKSUM-RTL]
    method: sim_test
    title: Checksum reference against outside vectors (RFC 1071 example, a published IPv4 header, odd lengths, in-place sum, TCP pseudo-header)
    evidence: {file: *junit, reader: junit, tests: ["test_b119_model::test_rfc1071_example", "test_b119_model::test_published_ipv4_header", "test_b119_model::test_odd_length_pads_low_byte", "test_b119_model::test_checksum_in_place_sums_to_all_ones", "test_b119_model::test_tcp_checksum_pseudo_header"]}
    checks: [designs/b119_tcp_fast/model/tcpref.py]
  - id: V-MODEL-SEGMENT
    requirements: [B119-F-SEGMENT]
    method: sim_test
    title: The reference frame is 113 bytes for an order; SoupBinTCP and OUCH packers
    evidence: {file: *junit, reader: junit, tests: ["test_b119_model::test_frame_is_113_bytes_for_an_order", "test_b119_model::test_soup_packets"]}
    checks: [designs/b119_tcp_fast/model/tcpref.py, designs/b119_tcp_fast/model/soup.py]
  - id: V-MODEL-REFUSE
    requirements: [B119-S-REFUSE]
    method: sim_test
    title: The untimed stand-in refuses as the datasheet says (every code, window of exactly one segment, stale, disarmed)
    evidence: {file: *junit, reader: junit, tests: ["test_b119_model::test_fast_model_refusals", "test_b119_model::test_window_closed_refuses_until_acked", "test_b119_model::test_stale_state_is_refused_and_a_refreshing_owner_keeps_it_fresh", "test_b119_model::test_disarmed_block_refuses"]}
    checks: [designs/b119_tcp_fast/model/hwmodel.py, designs/b119_tcp_fast/model/softtcp.py]
  - id: V-MODEL-ENDPOINT
    requirements: [B119-F-E2E]
    method: sim_test
    title: TCP endpoint (handshake, acknowledgements, out-of-order, bad checksum, foreign frames, pure ACKs) and the exchange (login, orders, replies, rejections)
    evidence: {file: *junit, reader: junit, tests: ["test_b119_model::test_endpoint_handshake_data_and_acks", "test_b119_model::test_endpoint_out_of_order_and_retransmit", "test_b119_model::test_endpoint_rejects_bad_checksum_and_foreign_frames", "test_b119_model::test_endpoint_drops_unacceptable_pure_ack", "test_b119_model::test_session_login_orders_and_replies", "test_b119_model::test_rejected_orders"]}
    checks: *model
  - id: V-MODEL-SEQSPACE
    requirements: [B119-S-SEQSPACE, B119-F-HANDBACK]
    method: sim_test
    title: A dropped fast-path segment is retransmitted by software; a heartbeat takes the sequence space and gives it back; software sends nothing while the block is armed and idle
    evidence: {file: *junit, reader: junit, tests: ["test_b119_model::test_dropped_fast_path_segment_is_retransmitted_by_software", "test_b119_model::test_client_heartbeat_takes_the_sequence_space_and_gives_it_back", "test_b119_model::test_nothing_is_sent_by_software_while_the_fast_path_is_idle_and_armed"]}
    checks: *model
  # ---- the RTL bench (pytest runs the cocotb tests of tests/b119_cocotb.py in one Icarus simulation) --------------------------------
  - id: V-SIM-BENCH
    requirements: [B119-F-SEGMENT, B119-F-CKSUM-RTL, B119-S-ABORT, B119-S-REFUSE, B119-S-SUMGUARD, B119-I-REGBUS, B119-S-SEQSPACE, B119-F-HANDBACK, B119-F-E2E]
    method: sim_test
    title: The block against the reference in cocotb, 19 tests in one simulation (smoke, random segments, checksum corners, fold carries, timing, abort at every offset and without a gap, speculative verdicts, refusals, register semantics, configuration change, continuity with software, random mix, end-to-end session, dropped segment, heartbeats, aborted orders, small window, rejected login)
    evidence: {file: *junit, reader: junit, tests: ["test_b119_rtl::test_all_benches"]}
    checks: [designs/b119_tcp_fast/rtl/tcp_fast.sv, designs/b119_tcp_fast/tests/b119_cocotb.py, designs/b119_tcp_fast/tests/netsim.py, designs/b119_tcp_fast/model/tcpref.py]
  - id: V-SIM-TOP
    requirements: [B119-I-ORDERPORT]
    method: sim_test
    title: Brief 110's path with tcp_fast in place of its stub port, against brief 110's reference model
    evidence: {file: *junit, reader: junit, tests: ["test_b119_rtl::test_behind_the_risk_logic"]}
    checks: [designs/b119_tcp_fast/rtl/tcp_fast.sv, designs/b119_tcp_fast/rtl/itch_ouch_tcp_top.sv, designs/b119_tcp_fast/tests/b119_top_cocotb.py]
  - id: V-LINT
    requirements: [B119-F-LINT]
    method: sim_test
    title: Verilator -Wall lint of tcp_fast.sv and the frame builder inside it
    evidence: {file: *junit, reader: junit, tests: ["test_b119_lint::test_lint_clean"]}
    checks: [designs/b119_tcp_fast/rtl/tcp_fast.sv, designs/b119_tcp_fast/lint/lint_waivers.vlt]
  # ---- recorded outcomes of the bench (results/b119/bench_sim.json, top_sim.json) ----------------------------------------------------
  - id: V-SIMM-RANDOM
    requirements: [B119-F-SEGMENT, B119-F-CKSUM-RTL]
    method: sim_measurement
    title: 450 random segments (random connections, orders and states, sequence numbers at the wrap) compared byte for byte
    evidence: {file: results/b119/bench_sim.json, reader: json, field: random_segments}
    pass_when: [{op: ge, value: 450}]
    checks: *rtl
  - id: V-SIMM-ABORT
    requirements: [B119-S-ABORT]
    method: sim_measurement
    title: Outcome at every abort offset (0 cancels, 1 to 14 abort, 15 and later are late and the segment is sent)
    evidence: {file: results/b119/bench_sim.json, reader: json}
    pass_when:
      - {field: abort_offsets.0, op: eq, value: cancel0}
      - {field: abort_offsets.1, op: eq, value: aborted}
      - {field: abort_offsets.7, op: eq, value: aborted}
      - {field: abort_offsets.14, op: eq, value: aborted}
      - {field: abort_offsets.15, op: eq, value: sent}
      - {field: abort_offsets.17, op: eq, value: sent}
      - {field: e2e_abort.exchange_out_of_order, op: eq, value: 0}
    checks: *rtl
  - id: V-SIMM-REFUSE
    requirements: [B119-S-REFUSE]
    method: sim_measurement
    title: The five refusal codes and the random mix's outcomes (refused, aborted, no verdict, sent)
    evidence: {file: results/b119/bench_sim.json, reader: json}
    pass_when:
      - {field: refusal_codes.1, op: eq, value: not armed}
      - {field: refusal_codes.2, op: eq, value: stale or not valid}
      - {field: refusal_codes.3, op: eq, value: window closed}
      - {field: refusal_codes.4, op: eq, value: MSS below one segment}
      - {field: refusal_codes.5, op: eq, value: busy}
      - {field: random_mix_outcomes.refused3, op: ge, value: 1}
      - {field: e2e_window.refused_window, op: ge, value: 1}
    checks: *rtl
  - id: V-SIMM-MIX
    requirements: [B119-S-ABORT, B119-S-SUMGUARD, B119-F-SEGMENT]
    method: sim_measurement
    title: A long random mix reaches every outcome (sent, aborted, no verdict, cancelled in the go clock)
    evidence: {file: results/b119/bench_sim.json, reader: json}
    pass_when:
      - {field: random_mix_outcomes.sent, op: ge, value: 1}
      - {field: random_mix_outcomes.aborted, op: ge, value: 1}
      - {field: random_mix_outcomes.noverdict, op: ge, value: 1}
      - {field: random_mix_outcomes.cancel0, op: ge, value: 1}
    checks: *rtl
  - id: V-SIMM-E2E
    requirements: [B119-F-E2E, B119-S-SEQSPACE, B119-F-HANDBACK]
    method: sim_measurement
    title: End-to-end session, dropped segment, heartbeats, aborted orders and small window, with the software exchange
    evidence: {file: results/b119/bench_sim.json, reader: json}
    pass_when:
      - {field: e2e_session.orders, op: eq, value: 12}
      - {field: e2e_session.exchange_replies, op: eq, value: 12}
      - {field: e2e_drop.retransmits, op: ge, value: 1}
      - {field: e2e_heartbeat.takeovers, op: ge, value: 1}
      - {field: e2e_heartbeat.client_heartbeats_at_exchange, op: ge, value: 1}
