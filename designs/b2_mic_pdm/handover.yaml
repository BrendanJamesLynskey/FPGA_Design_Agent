# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b2_mic_pdm
title: PDM microphone board self-check
kind: board-selfcheck
produced_by: human
summary: Clocks the Nexys A7's PDM microphone at 2.381 MHz and counts, over a window of PDM bits, how many bits were 1 and
  how many times the bit changed. The counts tell a live microphone (about half ones, frequent changes) from a dead one,
  a stuck data line or a missing clock. The test shell carries the registers, and `selfcheck.py` holds the on-board pass
  rule, written before any board run.
scope_not:
- 'an audio path: nothing decimates or filters the PDM stream, so it says nothing about audio quality'
- an agent benchmark task; it was written by hand to prove the board inventory on hardware
target:
  part: xc7a100tcsg324-1
  board: Nexys A7-100T
  top: b2_mic_pdm_top
  tool: Vivado 2026.1
clocks:
- name: CLK100MHZ
  mhz: 100
  source: designs/b2_mic_pdm/design.xdc
  note: the only clock; M_CLK to the microphone is divided from it (HALF clocks low, HALF high)
resets:
- name: CPU_RESETN
  active: low
  note: the board's reset button, synchronised by the test shell's reset synchroniser (assert asynchronous, release synchronous)
interfaces:
- name: UART register window
  type: test shell, 8N1 UART at 115200 baud
  doc: shell/PROTOCOL.md
  note: the design's six registers sit at shell addresses 0x80 to 0x85 (CTRL, STATUS, NBITS, ONES, CHANGES, INFO); the map
    is in the header of rtl/mic_regs.sv; other window addresses read 0
- name: PDM microphone
  type: M_CLK out, M_DATA in, M_LRSEL out (LVCMOS33)
  doc: boards/nexys_a7_100t/inventory.yaml
  note: M_LRSEL is held low, so the microphone drives M_DATA after each falling edge of M_CLK; M_DATA is synchronised and
    sampled in the middle of the high half
parameters:
- name: HALF
  value: 21
  legal: 1 to 65535 (16-bit divider); the board value is 21
  note: M_CLK half period in 100 MHz clocks; 21 gives 2.381 MHz
