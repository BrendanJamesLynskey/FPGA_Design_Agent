# m141_ddr2_sched testplan, schema v1 (brief 116): the specification and the evidence that checks it, in one place.
#
# WHO DOES WHAT. A human specifies the requirements below and checks that the verification is thorough enough. The agent holds the knowledge to implement and to verify.
#
# DRAFT STATUS. Every requirement here was written by the executor of brief 141 from the brief, docs/memory_controller_plan.md and the Micron MT47H64M16 data sheet. None is agreed by a human yet (`spec_status: draft`).
# The performance bounds are regression bounds drawn from the recorded simulation (results/b141/sim_summary.json), not targets: the owner sets the target. Nothing here is verified on a board.
#
# Status is never typed here. `python -m flow.trace_v1 write designs/m141_ddr2_sched` reads the evidence files named below and computes pass / fail / not run / stale / bounded per item.
schema: fpga-design-agent/testplan/v1
design: m141_ddr2_sched
notes: >-
  Simulation and formal only (phase 0): the scheduler is checked against a behavioural DDR2 command-rule model written from the data sheet, and its rules are proved on its own command output. No PHY, no MIG, no board:
  the board items are hooks (planned) with the pre-registration in docs/memory_controller_plan.md section 12. "Latency" is clocks from the request handshake to the first data beat at the nexys_650 profile (tCK 3077 ps, CL 5).

discover:
  - {glob: designs/m141_ddr2_sched/tests/test_*.py, pattern: '^def (test_\w+)'}

x-rtl: &rtl [designs/m141_ddr2_sched/rtl/ddr2_sched.sv, designs/m141_ddr2_sched/rtl/ddr2_addrmap.sv]

requirements:
  - id: M141-S-TIMING
    kind: safety
    title: "No DDR2 timing rule is ever violated on the command stream"
    text: "For every request sequence and both policies, the command bus never breaks tRCD, tRP and tRPA, tRAS, tRC, tRRD, tFAW, tWR, tWTR, tRTP, tRFC, the read-to-write and write-to-read spacings, the one-command state rules (ACTIVATE to a closed bank, a column command to an open bank, REFRESH with every bank closed), nor the data-bus rules (no overlap, one idle clock between a read and a write burst)."
    source: docs/memory_controller_plan.md#2-the-part-and-the-rules-that-matter
    spec_status: draft
  - id: M141-S-ORDER
    kind: safety
    title: "A request never overtakes an older request to the same burst address when either is a write"
    text: "Read-after-write, write-after-write and write-after-read order to one burst address is kept; other requests complete in any order."
    source: docs/memory_controller_plan.md#7-the-scheduler-v0
    spec_status: draft
  - id: M141-S-REFRESH
    kind: safety
    title: "Refresh is never starved"
    text: "At most REF_POST + 2 refreshes are outstanding at any time, and the gap between two REFRESH commands never exceeds 9 x tREFI (JEDEC's limit with eight postponed); a REFRESH is issued only when one is due."
    source: docs/memory_controller_plan.md#2-the-part-and-the-rules-that-matter
    spec_status: draft
  - id: M141-F-SERVICE
    kind: functional
    title: "Every request is served exactly once with its own bank, row, column and direction"
    text: "Each accepted request gets one column command carrying its tag, the bank and column of its address, in the direction asked, on a bank whose open row is the request's row."
    source: docs/blocks.md
    spec_status: draft
  - id: M141-F-BOUND
    kind: functional
    title: "Every request is served within a bounded wait"
    text: "A request waits at most AGE_LIM + QD x R_MAX + the refresh cost clocks (verif/formal/run_formal.py:bound), under both policies. Proved at small parameters by bounded model check; measured at the real parameters."
    source: docs/memory_controller_plan.md#7-the-scheduler-v0
    spec_status: draft
  - id: M141-F-LINT
    kind: functional
    title: "The RTL is Verilator -Wall clean and follows the HDL standard's structural rules"
    text: "Verilator 5 --lint-only -Wall reports nothing on ddr2_sched and ddr2_addrmap; synchronous reset only, no initial blocks, no latches, no derived clocks."
    source: docs/hdl_coding_standard.md
    spec_status: draft
  - id: M141-P-LAT
    kind: performance
    title: "Median read latency of the latency-first policy on light random reads"
    text: "Random reads at light load (one request every 40 clocks on average) find a precharged bank, so a read pays ACTIVATE, tRCD and the read latency and nothing else. The bound is a regression bound from the recorded run, not a target."
    source: docs/memory_controller_plan.md#10-results
    spec_status: draft
    performance: {quantity: median read latency, unit: clocks, op: le, bound: 13, condition: "POLICY 0, random reads, mean gap 40 clocks, nexys_650 profile (tCK 3077 ps, CL 5), simulation, 3000 reads"}
  - id: M141-P-LATTAIL
    kind: performance
    title: "Tail of the read latency of the latency-first policy on light random reads"
    text: "The 99.9th percentile of the read latency at light load stays within a refresh's worth of the median (a refresh in progress when a read arrives is the tail). Regression bound, not a target."
    source: docs/memory_controller_plan.md#10-results
    spec_status: draft
    performance: {quantity: 99.9th percentile read latency, unit: clocks, op: le, bound: 60, condition: "POLICY 0, random reads, mean gap 40 clocks, REF_POST 4, nexys_650 profile, simulation, 3000 reads"}
  - id: M141-P-WINDOW
    kind: performance
    title: "No read inside a refresh-deferral window waits for a refresh"
    text: "While ref_defer is high and the postponement allowance is not used up, refreshes that fall due are postponed, so the reads accepted in the window see no tRFC wait (the cost moves to reads after the window). Regression bound, not a target."
    source: docs/memory_controller_plan.md#10-results
    spec_status: draft
    performance: {quantity: maximum read latency inside the window, unit: clocks, op: le, bound: 40, condition: "POLICY 0, REF_POST 4, ref_defer high for 5000 of every 12000 clocks, random reads at light load, nexys_650 profile, simulation, 6000 reads"}
  - id: M141-P-BW
    kind: performance
    title: "Streaming read bandwidth of the bandwidth-first policy"
    text: "A sequential read stream keeps the data bus busy: utilisation (data clocks over elapsed clocks) at least 0.95 with the page-interleaved map. Regression bound, not a target."
    source: docs/memory_controller_plan.md#10-results
    spec_status: draft
    performance: {quantity: data-bus utilisation, unit: fraction, op: ge, bound: 0.95, condition: "POLICY 1, sequential reads, map 0, QD 8, nexys_650 profile, simulation, 4000 reads"}
  - id: M141-P-BOARD
    kind: performance
    title: "Latency and bandwidth against MIG's own controller on the board"
    text: "The five pre-registered hypotheses of docs/memory_controller_plan.md section 12 (median, tail, bandwidth, integrity, predictability against MIG ordering NORM and STRICT, and LiteDRAM if practical)."
    source: docs/memory_controller_plan.md#12-pre-registered-board-test-prepared-not-run
    spec_status: draft
    external: a Nexys A7-100T on wall power, a generated MIG core with the PHY interface, and a Vivado build (heavy slot)
    performance: {quantity: median read latency difference to MIG NORM, unit: controller clocks, op: le, bound: -1, condition: "POLICY 0 on the PHY against MIG ordering NORM, random reads, light load, board, at least 5 runs (the pre-registered H1)"}

verification:
  - id: V-SIM-CLEAN
    requirements: [M141-S-TIMING, M141-S-ORDER, M141-F-SERVICE, M141-S-REFRESH, M141-F-BOUND]
    method: sim_test
    title: "Both policies, six traffic patterns, two timing profiles and three address maps against the behavioural DDR2 model: zero violations, every request served once, order kept, refresh gap within 9 x tREFI, longest wait within the bound"
    evidence: {file: results/116_traceability/m141_ddr2_sched/pytest_junit.xml, reader: junit, tests: ["test_m141_clean_rtl::*"]}
    checks: *rtl
  - id: V-SIM-FAULTS
    requirements: [M141-S-TIMING, M141-S-ORDER, M141-S-REFRESH, M141-F-SERVICE]
    method: sim_test
    title: "Sixteen seeded faults in a copy of the RTL (a timing constant short, the dependency check removed, refresh disabled, a wrong bank on the command bus, a wrong row opened) are each caught by the bench"
    evidence: {file: results/116_traceability/m141_ddr2_sched/pytest_junit.xml, reader: junit, tests: ["test_m141_faults_rtl::*"]}
    checks: *rtl
  - id: V-LINT
    requirements: [M141-F-LINT]
    method: sim_test
    title: "Verilator 5 -Wall clean on both modules"
    evidence: {file: results/116_traceability/m141_ddr2_sched/pytest_junit.xml, reader: junit, tests: ["test_m141_lint_rtl::*"]}
    checks: *rtl
  - id: V-FORMAL-RULES
    requirements: [M141-S-TIMING, M141-S-ORDER, M141-S-REFRESH]
    method: formal
    title: "SymbiYosys proofs of the timing rules and request order (k-induction with helper invariants, depth 3, at the real data sheet constants and at small ones, both policies), the refresh debt (property-directed reachability), covers, and one mutant per rule that a named assertion catches"
    evidence: {file: results/116_traceability/m141_ddr2_sched/pytest_junit.xml, reader: junit, tests: ["test_m141_formal::*"]}
    checks: *rtl
  - id: V-FORMAL-BOUND
    requirements: [M141-F-BOUND]
    method: formal
    title: "Bounded response of a tracked request, bounded model check to the proved bound plus six clocks at small parameters (a check from reset, not a proof for all time)"
    bounded: {depth: 98}
    evidence: {file: results/b141/formal_full.json, reader: json, field: by_name.live_bmc_tiny_p0.verdict}
    pass_when: [{field: by_name.live_bmc_tiny_p0.verdict, op: eq, value: PASS}]
    checks: *rtl
  - id: V-SIM-LAT
    requirements: [M141-P-LAT]
    method: sim_measurement
    title: "Median read latency, latency-first policy, light random reads"
    evidence: {file: results/b141/sim_summary.json, reader: json, field: runs.lat_rand_read_p0.lat_clk.p50}
    checks: *rtl
  - id: V-SIM-LATTAIL
    requirements: [M141-P-LATTAIL]
    method: sim_measurement
    title: "99.9th percentile read latency, latency-first policy, light random reads"
    evidence: {file: results/b141/sim_summary.json, reader: json, field: runs.lat_rand_read_p0.lat_clk.p999}
    checks: *rtl
  - id: V-SIM-WINDOW
    requirements: [M141-P-WINDOW]
    method: sim_measurement
    title: "Maximum read latency inside a refresh-deferral window, latency-first, REF_POST 4"
    evidence: {file: results/b141/sim_summary.json, reader: json, field: runs.refresh_window_p0_post4.lat_clk_win.max}
    checks: *rtl
  - id: V-SIM-BW
    requirements: [M141-P-BW]
    method: sim_measurement
    title: "Data-bus utilisation, bandwidth-first policy, sequential reads, page-interleaved map"
    evidence: {file: results/b141/sim_summary.json, reader: json, field: runs.bw_seq_read_map0_p1.util}
    checks: *rtl
  - id: V-BOARD-PLANNED
    requirements: [M141-P-BOARD]
    method: board_measurement
    instrument: latency_loop
    title: "The pre-registered board test (docs/memory_controller_plan.md section 12): not run"
    planned: a Vivado build with MIG (section 11) and a board visit
