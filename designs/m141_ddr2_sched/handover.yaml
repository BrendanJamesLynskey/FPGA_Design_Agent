# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: m141_ddr2_sched
title: An application-optimised DDR2 command scheduler with two policies and formal timing proofs
kind: showcase
produced_by: session
summary: A request queue in front of a DDR2 command bus for the Micron MT47H64M16 on the Nexys A7, with two policies chosen
  by a parameter, latency-first for few random reads and bandwidth-first for streams, an abstract command interface that
  maps to AMD's PHY-only interface or to the MIG native interface, and the JEDEC timing rules enforced by per-bank counters.
  The rules are proved on the command stream by SymbiYosys against an independent monitor, and the scheduler is measured
  against a behavioural DDR2 model written from the data sheet.
scope_not:
- a data path, a PHY, a MIG core, DDR2 initialisation or calibration, ZQ, on-die termination, power-down or self-refresh;
  the scheduler issues commands and the data bursts follow them at fixed latencies
- any Vivado build or board run; both heavy slots were taken by other sessions during the work, and the build plan and the
  pre-registered board test are written but not run
- the four-wide command packing a controller clock slower than the memory clock needs; the scheduler decides one command
  per memory clock
target:
  part: xc7a100tcsg324-1
  board: Digilent Nexys A7-100T (one Micron MT47H64M16HR-25 DDR2 part, x16, single rank)
  top: ddr2_sched
  tool: Vivado 2026.1
  note: simulation and formal only in phase 0; no build.yaml and no constraints; the memory clock the board allows is a
    period of 3077 ps (reference manual Table 3.1.1)
clocks:
- name: clk
  mhz: 325
  source: results/b141/sim_summary.json
  note: the memory clock period the Nexys A7 reference manual recommends for the MIG (3077 ps); the scheduler decides one
    command a clock, a figure no build supports yet
resets:
- name: rst
  active: high
  note: synchronous; clears the queue, every timer and the refresh state; applied once before en rises and never while the
    part is in use, because a reset in the middle would forget the open banks of a real part
interfaces:
- name: request
  type: req_v, req_rdy, req_wr, req_addr, req_tag
  doc: designs/m141_ddr2_sched/docs/blocks.md
  note: a valid and ready handshake for one BL8 burst by burst address; req_rdy does not depend on req_v; tags must be unique
    among queued requests
- name: command
  type: cmd_v, cmd_op, cmd_bank, cmd_row, cmd_col, cmd_tag
  doc: designs/m141_ddr2_sched/docs/blocks.md
  note: one registered DDR2 command a clock (ACTIVATE, READ, WRITE, PRECHARGE, PRECHARGE ALL, REFRESH); the data burst follows
    a READ by the read latency and a WRITE by the write latency; there is no completion signal
- name: control
  type: en, ref_defer
  doc: designs/m141_ddr2_sched/docs/blocks.md
  note: en rises once when the PHY says the part is initialised and precharged; ref_defer postpones refresh within the allowance
    and never past it
parameters:
- name: POLICY
  value: 0 latency-first (default), 1 bandwidth-first
  legal: 0 or 1
  note: 0 reads first, writes in batches, eager precharge, refresh in idle time; 1 open page, first-ready first-come first-served,
    direction runs
- name: QD
  value: 8 (default)
  legal: 2 and up, verified in simulation to 33
  note: queue entries; a deeper queue lets the bandwidth policy batch longer
- name: MAP
  value: 0 (default), 1, 2
  legal: 0 to 2
  note: address map, page-interleaved, bank-group interleaved, or every burst to the next bank
- name: AGE_LIM
  value: 1024 (default)
  legal: above the wait of a request in a full queue
  note: an oldest request this old is served alone; set lower, the queue degrades toward first-come first-served (measured)
- name: REF_POST
  value: 4 (default)
  legal: 0 to 6
  note: refreshes that may be postponed; JEDEC's allowance is 8 and is not checked against the standard's text here
- name: timing parameters T_RCD to T_REFI, RL, WL, BL2
  value: MT47H64M16-25 at a clock period of 2500 ps by default; tests/m141_timing.py derives them for a period
  legal: whole clocks below 256 (counters are 8 bits), RL = WL + 1, tREFI at least four times the longest refresh sequence
  note: elaboration errors name a violated range
