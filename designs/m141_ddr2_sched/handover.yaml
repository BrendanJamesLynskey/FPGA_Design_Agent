gaps:
- about: resources
  text: Not measured; no Vivado run was made because both heavy slots were taken by other sessions, so there is no LUT,
    flip-flop or block RAM figure for the scheduler.
- about: timing
  text: Not measured; no out-of-context or full build exists, so the closed clock of the decision logic is unknown. The
    scheduler decides one command a clock and its combinational scan of the queue and the timer file is expected to close
    well below the memory clock.
- about: power
  text: Not measured; no build and no board.
- about: board_run
  text: Not run on a board and not built with MIG; the pre-registered board test and the build plan are in docs/memory_controller_plan.md
    sections 11 and 12.
- about: model
  text: The DDR2 model and the formal monitor encode one reading of the Micron data sheet by the author of the scheduler;
    no vendor model was used, and JEDEC's refresh postponement allowance was not checked against the standard's text.
- about: bounded_response
  text: The bounded-response property is a bounded model check from reset at small parameters, not a proof for all time;
    at real parameters the bound is measured in simulation only.
- about: phy_interface
  text: The AMD PHY-only interface needs periodic reads, the temperature sample enable, FIFO flow control and up to four
    commands per controller clock; none is built, and the scheduler's one-command-a-clock decision is not what a controller
    clock four times slower needs.
- about: behaviour
  text: 'Guessable wrongly: no data path and no completion signal; spacings are those of the registered output; a read waits
    for an older write to its address and is never forwarded the write''s data; tags must be unique among queued requests
    and nothing checks it; a reset in the middle of operation is unsupported; an AGE_LIM below the wait of a request in
    a full queue makes the queue first-come first-served; tRC is implied by tRAS plus tRP at the data sheet values.'
next_steps:
- Run an out-of-context Vivado build of ddr2_sched on the Artix-7 100T and the K26 for several queue depths, to put resources
  and a closed clock on the block, in a heavy slot.
- Find out whether the generated MIG sources can drop the controller and keep the PHY, then build the first design with
  the PHY interface, periodic reads and the temperature enable.
- Make the decision four-wide so one controller clock carries up to four commands, and re-run the proofs and the measurements
  on it.
- Run the pre-registered board test once the build exists.
open_questions:
- Does the MIG controller leave a row open after a read? The first hypothesis of the board test (the eager-precharge gain)
  depends on it.
- Is a four-wide decision better built as four scheduler copies on interleaved banks or as one wider arbiter?
