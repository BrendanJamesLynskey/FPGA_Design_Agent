gaps:
- about: power
  text: Not measured; no power report was taken for any variant.
- about: throughput
  text: Not measured; one master word at most every second clock by construction.
- about: board
  text: Never programmed; no hardware measurement.
- about: UltraScale+
  text: Every cost and effect was measured on the 7-series part only.
- about: fsm_safe_state
  text: The safe-state effect is a netlist property; the RTL fault injection cannot show it and no netlist-level injection
    was run.
- about: latency
  text: Measured in simulation only, one burst; throughput was not measured.
- about: structure
  text: The cost figures come from one small design and one run per variant; the spread between runs is unknown.
- about: behaviour
  text: A start while busy is ignored; len is taken at start; the watchdog does not watch an idle sequencer; after a flagged
    ECC error the stored word stays wrong until rewritten.
next_steps:
