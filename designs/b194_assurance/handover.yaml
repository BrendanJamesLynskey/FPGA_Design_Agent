# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b194_assurance
title: Development design for the assurance switch (burst sequencer, FIFO with ECC, TMR, safe FSM, watchdog)
kind: demonstration
produced_by: human
summary: A burst sequencer in front of a 512 x 64 FIFO with an accumulating checksum, AXI4-Stream handshakes. Each reliability
  structure is a parameter (ECC 0/1/2, parity, safe-state FSM, TMR on the remaining-words counter, watchdog) so that its
  area, Fmax, latency and what it catches in a seeded single-event-upset simulation are measured against the plain design.
  It is the demonstration design of the verification profiles and is not a held-out benchmark task.
scope_not:
- a held-out or benchmark task; it was written for the measurements of docs/assurance.md
- a board design; it has no pins, no constraints and was only built out of context
- a failure-rate figure; the fault injection is seeded single bit flips in simulation
target:
  part: xc7a100tcsg324-1
  board: none (out of context)
  top: a194_core
  tool: Vivado 2026.1
clocks:
- name: aclk
  mhz: 200
  source: designs/b194_assurance/ooc.xdc
  note: the only clock; there is no board clock; a fixed 5.0 ns constraint, which the plain design meets and the structured
    variants do not
resets:
- name: aresetn
  active: low
  note: AXI reset polarity at the stream ports; inverted once inside and used synchronously everywhere
interfaces:
- name: slave stream
  type: AXI4-Stream, 64-bit tdata, tvalid, tready
  doc: designs/b194_assurance/rtl/a194_core.sv
  note: tready is low unless the sequencer is running a burst and the FIFO is not full; valid never waits for ready
- name: master stream
  type: AXI4-Stream, 64-bit tdata, tvalid, tready
  doc: designs/b194_assurance/rtl/a194_core.sv
  note: one word at most every second clock (the FIFO read takes two clocks); the payload is stable while valid is high
    and ready low
- name: control and status
  type: start, len[15:0] in; busy, done (one clock), checksum[63:0], err_corr, err_det, fsm_fault, wd_fault, tmr_fault out
  doc: designs/b194_assurance/rtl/a194_core.sv
  note: len is sampled with start while idle; a start while busy is ignored; len 0 completes without words; the error flags
    are sticky until reset
parameters:
- name: ECC
  value: 0
  legal: 0 none, 1 fabric SECDED code over 64 data bits, 2 RAMB36E1 built-in ECC (simulation needs xsim and UNISIM)
  note: with 2 the dbg_inj_s and dbg_inj_d inputs inject a single or double bit error at a write (UG473)
- name: PAR
  value: 0
  legal: 0 or 1
  note: even parity bit across the output register
- name: SAFE
  value: 0
  legal: 0 or 1
  note: fsm_safe_state auto_safe_state on the state register; no effect on RTL simulation
- name: TMR
  value: 0
  legal: 0 or 1
  note: three DONT_TOUCH copies of the remaining-words counter with a majority voter
- name: WD
  value: 0
  legal: 0 or 1
  note: watchdog, 256 clocks without progress while busy forces the sequencer to idle and sets wd_fault; it does not see
    a stall in idle
