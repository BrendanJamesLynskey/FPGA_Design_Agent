# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b2_acl_adxl362
title: ADXL362 accelerometer board self-check
kind: board-selfcheck
produced_by: human
summary: Drives the Nexys A7's ADXL362 accelerometer over SPI mode 0 at 1 MHz from a small register block in the test shell.
  The host reads the three ID registers, switches the part to measurement mode, reads one X/Y/Z sample at rest, returns
  it to standby and reads POWER_CTL back. `selfcheck.py` holds the on-board pass rule, written before any board run.
scope_not:
- 'an accelerometer application: it takes one sample per check, so it says nothing about noise, offsets, other ranges or
  interrupts'
- an agent benchmark task; it was written by hand to prove the board inventory on hardware
target:
  part: xc7a100tcsg324-1
  board: Nexys A7-100T
  top: b2_acl_adxl362_top
  tool: Vivado 2026.1
clocks:
- name: CLK100MHZ
  mhz: 100
  source: designs/b2_acl_adxl362/design.xdc
  note: the only clock; SCLK is divided from it (HALF clocks low, HALF high) and ACL_MISO is synchronised into it
resets:
- name: CPU_RESETN
  active: low
  note: the board's reset button, synchronised by the test shell's reset synchroniser (assert asynchronous, release synchronous)
interfaces:
- name: UART register window
  type: test shell, 8N1 UART at 115200 baud
  doc: shell/PROTOCOL.md
  note: seven registers at shell addresses 0x80 to 0x86 (CTRL, STATUS, TX0, TX1, RX0, RX1, INFO); the map is in the header
    of rtl/acl_regs.sv; other window addresses read 0, and writes to STATUS, RX0, RX1, INFO or undefined addresses are ignored
- name: ADXL362 SPI
  type: ACL_SCLK, ACL_MOSI, ACL_CSN out and ACL_MISO in, mode 0 (CPOL 0, CPHA 0), MSB first, LVCMOS33
  doc: boards/nexys_a7_100t/inventory.yaml
  note: one transfer is chip select low, 1 to 8 bytes out from TX0 and TX1 (byte 0 first) with the same number of bytes
    captured into RX0 and RX1, then chip select high; MISO is sampled at the end of each SCLK high half; INT1 and INT2 are
    not connected
parameters:
- name: HALF
  value: 50
  legal: 1 to 65535 (16-bit divider); the board value is 50
  note: SCLK half period in 100 MHz clocks; 50 gives 1 MHz
- name: CLKS_PER_BIT
  value: 868
  legal: set by the shell's UART; the board value is 868
  note: UART bit period in clocks (115200 baud at 100 MHz)
