gaps:
- about: latency
  text: Not measured. A transfer takes eight SCLK periods per byte plus set-up and hold half periods at 1 MHz by construction;
    no record times it.
- about: throughput
  text: Not applicable; the block moves at most 8 bytes per host request and the check takes one sample per run.
- about: E3
  text: The board runs used bitstreams built on the earlier Vivado release; the 2026.1 build (E2) was not programmed. Re-run
    the board check on a 2026.1 bitstream to close this.
- about: operating conditions
  text: The board runs predate the house rule of 2026-11-11 that every board run records its operating conditions from the
    XADC; die temperature and the VCCINT, VCCAUX and VCCBRAM rails were not read from the XADC, so the runs cannot be shown
    to be inside the recommended operating conditions.
- about: accuracy
  text: The pass range for the magnitude is wide (0.57 to 1.43 g) because it must hold at any board tilt with worst-case
    offsets; the check does not calibrate or test offsets, noise, other ranges, the FIFO or the interrupt pins.
- about: REVID
  text: The data sheet value quoted in selfcheck.py is 0x01 but the board returned a different value in all three runs (M7);
    the rule does not judge it, and no record explains the difference.
- about: behaviour
  text: GO written while a transfer runs is ignored (spi_burst.sv takes GO only when idle), but no test covers it; a CTRL
    write changes the byte count register at once, though the running transfer keeps the count it started with; TX0 and
    TX1 writes during a transfer do not change that transfer; RX0 and RX1 hold the previous transfer's bytes until the transfer
    ends and are not cleared by a new one until then; a byte count of 0 is sent as 1 and above 8 as 8; bytes beyond the
    count read as 0; reads of undefined addresses return 0 with no error.
- about: reset
  text: Reset clears the transmit data, sets the byte count to 1, and clears busy and done; the received bytes are cleared
    too. This design drives no reset signal to the sensor, so a reset between the measurement-mode write and the standby
    write leaves the part in measurement mode.
next_steps:
- Re-run the board check on a Vivado 2026.1 bitstream with the XADC read at the start and end of each run.
- Add a test for GO written while busy and state in the register map header that it is ignored.
- Record the board orientation with each run so the magnitude can be compared with the expected 1 g more tightly.
open_questions:
- Should REVID be judged once the revision on the board is confirmed against the data sheet?
