# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b87_ml_trading
title: Decision models in the trading path on the K26
kind: showcase
produced_by: session
summary: Small decision models for the 58A trading path, trained on synthetic order flow and built in the fabric of the
  K26 (Kria KR260). Boosted trees, an MLP built by hand and through hls4ml with Vitis HLS, and a LUT network are each checked
  bit for bit against their integer models over the whole test split, built out of context and routed, and the boosted trees
  sit behind the 58A rule table in simulation, switched by a register.
scope_not:
- real market data or a real exchange; the order flow comes from our own seeded generator with a planted signal
- a board run; every number here is from simulation or an out-of-context Vivado 2026.1 build
- a trading result; the back-test's fill model is an assumption and its differences are within noise
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260 (K26 SOM)
  top: ooc_wrap (one arm with an input register), out of context; trigger_core with ML_ARM = 1 in simulation
  tool: Vivado 2026.1
  note: no board top of its own; the 58A board top would carry the model with ML_ARM set
clocks:
- name: clk
  mhz: 125
  source: results/b87/integration/integration_latency_sim.json
  note: the 58A core clock in the integration; each arm's out-of-context clock is in results/b87/ooc/<arm>.json
resets:
- name: rst
  active: high
  note: synchronous; resets only the valid pipeline of an arm and the feature unit's state, not the datapath
interfaces:
- name: arm ports
  type: clk, rst, in_v, in_f[37:0] (packed features), out_v, out_cls[1:0]
  doc: designs/b87_ml_trading/docs/arms.md
  note: out_v follows in_v by exactly LATENCY clocks for every input; one input a clock; ties go to the lower class
- name: model control in trigger_core
  type: registers 0x02A ML_CTRL (enable, tracked instrument), 0x02B ML_LAST_CLASS, 0x02C ML_VETOES
  doc: designs/b87_ml_trading/docs/arms.md
  note: with ML_ARM = 0 (the default) the 58A path is unchanged and the registers read 0, 1 and 0
parameters:
- name: ML_ARM
  value: 0 in 58A, 1 in the integration test
  legal: 0 none, 1 gbt_comb, 2 lutnet; 3 (mlp_hand, 13 clocks) is refused because an arm's LATENCY must be at most 8 clocks
  note: trigger_core parameter; elaboration fails above 8 clocks (the order slot binds an order to its frame)
- name: label horizon
  value: 40 events
  legal: any positive integer (model/lobsim.py Params.horizon)
  note: the sign of the mid-price change 40 events later; changing it needs retraining
- name: training seed built
  value: seed 0 of three
  legal: 0, 1 or 2 (the evaluation trains all three)
  note: the RTL is generated from results/b87/models/*.json
