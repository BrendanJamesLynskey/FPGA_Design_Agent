gaps:
- about: board_run
  text: Not run on a board; the KR260 build with the model in the 58A top is a next step.
- about: timing
  text: The feature unit and the gate (ml_feat, ml_gate) have no Vivado run; only the arms were built. Out of context the
    clock has no buffer or jitter, so every latency is quoted at no faster than 2.0 ns.
- about: power
  text: Not measured; the out-of-context builds have no power report and nothing ran on a board.
- about: throughput
  text: Every arm accepts one input a clock (the RTL test streams the first half of the test split back to back), but no
    throughput figure beyond that is recorded.
- about: data
  text: Synthetic order flow from one generator with a planted signal; the accuracies say how well each arm recovers it,
    nothing about a market.
- about: E4
  text: Out-of-context builds; inside a full design the clock and placement can differ. Only seed 0 is built.
- about: lutnet
  text: The LUT network (seed 0) does not beat the trivial rule on the test split; it is reported as not useful.
- about: behaviour
  text: 'Guessable wrongly: the feature history follows one tracked instrument only; a decision for another instrument passes
    unchanged; a vetoed decision still performs the rule''s pin and log actions; ML_LAST_CLASS updates even with the model
    off; the hls4ml core must run every clock (its ap_vld input stalls the pipeline).'
next_steps:
- Phase 2 (docs/jepa_student_plan.md) - a JEPA-pretrained teacher distilled into a student within the MLP's cost.
- Build the 58A board top with ML_ARM = 1 and take the board run with stage timestamps.
- A richer generator (several instruments, regimes) so that the arms are separated by more than one feature set.
open_questions:
- Should the model veto, or skew the price and size of the order instead?
