commands:
- what: train and score every arm
  cmd: python3 -m designs.b87_ml_trading.model.evaluate --out results/b87
  heavy: false
  minutes: 17
  needs: numpy, scikit-learn, torch (CPU); run under a 5 GB memory scope
- what: regenerate the RTL and check it against the models over the test split
  cmd: python3 -m designs.b87_ml_trading.model.gen_rtl && B87_RECORD=results/b87 python3 -m pytest -q designs/b87_ml_trading/tests/test_b87_rtl.py
  heavy: false
  minutes: 3
  needs: Icarus Verilog 12
- what: the 58A integration in simulation
  cmd: B87_RECORD=$PWD/results/b87/integration python3 -m pytest -q designs/b87_ml_trading/tests/test_b87_integ_rtl.py
  heavy: false
  minutes: 1
  needs: Icarus Verilog 12 and cocotb 2.0.1
- what: hls4ml conversion, C simulation and Vitis HLS
  cmd: python3 -m designs.b87_ml_trading.model.hls4ml_arm --synth --clock 2.0
  heavy: true
  minutes: 3
  needs: hls4ml 1.3.0 and Vitis 2026.1 (vitis-run on PATH), a heavy slot
- what: out-of-context builds and the clock search
  cmd: python3 -m designs.b87_ml_trading.ooc.ooc
  heavy: true
  minutes: 60
  needs: Vivado 2026.1 and a heavy slot
