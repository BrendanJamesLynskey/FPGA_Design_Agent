<svg xmlns="http://www.w3.org/2000/svg" width="640" height="248" viewBox="0 0 640 248" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="248" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">reset_sync</text><text x="170" y="43">asynchronous assert, synchronous release of CPU_RESETN (test shell)</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">fpga_shell</text><text x="170" y="77">UART register window (test shell)</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">dimmer_counter</text><text x="170" y="111">debounced up/down/clear counter, PWM LEDs, display scan</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">debounce</text><text x="170" y="145">two-flop synchroniser and counting debounce, one per button</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">sevenseg_scan</text><text x="170" y="179">eight-digit multiplexed display</text><text x="8" y="206" font-weight="bold">Interfaces</text><text x="8" y="224">fpga_shell - dimmer_counter: register_window (simple)</text></svg>
