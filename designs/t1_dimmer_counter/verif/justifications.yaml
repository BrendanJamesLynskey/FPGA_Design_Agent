# Coverage-hole justifications for T1 (brief 53; read by flow/trace.py, gate coverage_holes_justified).
# Every unhit line, branch, toggle point, planned bin or cover property of the design RTL is either closed by a test or
# matched here (`item`: a glob over the hole as the matrix prints it, brackets literal, or `re:<regex>`; `kind`: line,
# branch, toggle, bin or cover).
# Each entry has an owner, a reason and a date (gate waivers_complete). The holes were measured on the committed
# reference run (flow/tests/data/ref_t1_sim, Verilator, seeds 1-3) and again in brief 53's own run.
schema: fpga-design-agent/justifications/v1
coverage:
  - kind: toggle
    item: "re:.*win_rdata\\[(2[4-9]|3[01])\\]:.*"
    reason: "Bits 31:24 of the read data are 0 for every register (spec registers.map); they are constant by design."
    owner: brief 53 executor (owner review pending)
    date: 2026-11-11
  - kind: toggle
    item: "re:dimmer_counter\\.sv:\\d+ n_(up|down|clear)\\[[4-7]\\]:.*"
    reason: >-
      Open gap, justified by elemental analysis only: no seed presses one button 16 or more times, so bits 7:4 of the
      three 8-bit PRESSES counters never change. Each counter is one incrementer whose low bits and wrap are exercised;
      a test with 256 presses of each button would close it.
    owner: brief 53 executor (owner review pending)
    date: 2026-11-11
  - kind: toggle
    item: "re:.*win_rdata\\[2[0-3]\\]:.*"
    reason: "Read-back of PRESSES bits 23:20 (the clear counter's bits 7:4); the same gap as the counter bits above."
    owner: brief 53 executor (owner review pending)
    date: 2026-11-11
  - kind: toggle
    item: "dimmer_counter.sv:* pre[2]:*"
    reason: >-
      The prescaler is $clog2(PWM_PRESCALE + 1) bits wide; at PWM_PRESCALE 4 it counts 0 to 3, so its top bit is
      always 0. Constant for this parameter value.
    owner: brief 53 executor (owner review pending)
    date: 2026-11-11
  - kind: toggle
    item: "re:sevenseg_scan\\.sv:\\d+ digits\\[(1[6-9])\\]:.*"
    reason: "Digit 4's glyph input is tied to 0 (spec display: digits 4 and 5 are blank)."
    owner: brief 53 executor (owner review pending)
    date: 2026-11-11
  - kind: toggle
    item: "re:sevenseg_scan\\.sv:\\d+ digits\\[(2[0-3])\\]:.*"
    reason: "Digit 5's glyph input is tied to 0 (spec display: digits 4 and 5 are blank)."
    owner: brief 53 executor (owner review pending)
    date: 2026-11-11
  - kind: toggle
    item: "sevenseg_scan.sv:* blank[*]:*"
    reason: "The blank mask is the constant 8'b0011_0000 (digits 4 and 5 blank by the spec); it never changes."
    owner: brief 53 executor (owner review pending)
    date: 2026-11-11
  - kind: toggle
    item: "re:.* (an|AN)\\[[45]\\]:1->0"
    reason: "The anodes of digits 4 and 5 are never driven low (spec display: those digits stay dark)."
    owner: brief 53 executor (owner review pending)
    date: 2026-11-11
  - kind: toggle
    item: "t1_dimmer_counter_top.sv:* DP:1->0"
    reason: "The decimal point is always off (spec display: DP is always 1)."
    owner: brief 53 executor (owner review pending)
    date: 2026-11-11
  - kind: cover
    item: "re:C_SC_DIGIT_[45]_LIT"
    reason: >-
      Unreachable by the spec: digits 4 and 5 are blank, so these covers must stay unhit (a hit would be a bug,
      and A_SC_BLANK would also fire).
    owner: brief 53 executor (owner review pending)
    date: 2026-11-11
reconfirmed: []
