# Mutation set for T1 (flow/mutate.py): each mutant replaces `old` (exactly once) by `new` in a copy of rtl/.
# class: operator | constant | condition | reset. Nothing here is ever applied to the real RTL.
mutants:
  - name: db_step_two
    file: debounce.sv
    old: "cnt <= cnt + 1'b1;"
    new: "cnt <= cnt + 2'd2;"
    class: constant
    why: debounce counts in steps of two
  - name: db_level_cond
    file: debounce.sv
    old: "end else if (s == level) begin"
    new: "end else if (s != level && !press) begin"
    class: condition
    why: the count is cleared when the input differs
  - name: db_late
    file: debounce.sv
    old: "cnt == CW'(CYCLES - 1)"
    new: "cnt == CW'(CYCLES)"
    class: constant
    why: debounce accepts a level one clock late
  - name: db_early
    file: debounce.sv
    old: "cnt == CW'(CYCLES - 1)"
    new: "cnt == CW'(CYCLES - 2)"
    class: constant
    why: debounce accepts a level one clock early
  - name: db_reset_level
    file: debounce.sv
    old: "level <= 1'b0;\n            cnt   <= '0;\n        end else if"
    new: "level <= 1'b1;\n            cnt   <= '0;\n        end else if"
    class: reset
    why: the debounced level resets to 1
  - name: db_release_press
    file: debounce.sv
    old: "press <= s;"
    new: "press <= 1'b1;"
    class: condition
    why: a release also makes a press
  - name: reset_duty
    file: dimmer_counter.sv
    old: "duty    <= 8'h40;"
    new: "duty    <= 8'h41;"
    class: reset
    why: DUTY resets to 0x41
  - name: reset_ctrl
    file: dimmer_counter.sv
    old: "ctrl    <= 2'b10;"
    new: "ctrl    <= 2'b11;"
    class: reset
    why: CTRL resets with DUTY_SRC set
  - name: up_is_down
    file: dimmer_counter.sv
    old: "else if (p_up)                     count <= count + 1'b1;"
    new: "else if (p_up)                     count <= count - 1'b1;"
    class: operator
    why: up subtracts
  - name: clear_loses_to_up
    file: dimmer_counter.sv
    old: "else if (p_clear)                  count <= '0;"
    new: "else if (p_clear && !p_up)         count <= '0;"
    class: condition
    why: clear loses to up on the same clock
  - name: press_not_counted
    file: dimmer_counter.sv
    old: "if (p_down)  n_down  <= n_down + 1'b1;"
    new: "if (p_down && !p_up)  n_down  <= n_down + 1'b1;"
    class: condition
    why: a down press on the clock of an up press is not counted
  - name: pwm_le
    file: dimmer_counter.sv
    old: "(phase < duty_eff)"
    new: "(phase <= duty_eff)"
    class: operator
    why: PWM on one phase step too long
  - name: pwm_prescale
    file: dimmer_counter.sv
    old: "if (pre == PW'(PWM_PRESCALE - 1))"
    new: "if (pre == PW'(PWM_PRESCALE - 2))"
    class: constant
    why: PWM phase advances early
  - name: duty_src_bit
    file: dimmer_counter.sv
    old: "wire [7:0] duty_eff = ctrl[0] ? sw[7:0] : duty;"
    new: "wire [7:0] duty_eff = ctrl[1] ? sw[7:0] : duty;"
    class: condition
    why: DUTY_SRC read from the wrong CTRL bit
  - name: presses_swap
    file: dimmer_counter.sv
    old: "{8'h0, n_clear, n_down, n_up}"
    new: "{8'h0, n_clear, n_up, n_down}"
    class: operator
    why: PRESSES up and down fields swapped
  - name: duty_write_mask
    file: dimmer_counter.sv
    old: "duty <= win_wdata[7:0];"
    new: "duty <= {1'b0, win_wdata[6:0]};"
    class: constant
    why: DUTY write drops bit 7
  - name: inputs_swap
    file: dimmer_counter.sv
    old: "{13'h0, lv_clear, lv_down, lv_up, sw}"
    new: "{13'h0, lv_clear, lv_up, lv_down, sw}"
    class: operator
    why: INPUTS up and down levels swapped
  - name: an_enable
    file: sevenseg_scan.sv
    old: "(enable && !blank[k])"
    new: "(enable || !blank[k])"
    class: condition
    why: DISPLAY_EN no longer darkens the display
  - name: glyph_A
    file: sevenseg_scan.sv
    old: "4'hA: glyph = 7'b1110111;"
    new: "4'hA: glyph = 7'b1110110;"
    class: constant
    why: glyph A loses segment a
  - name: scan_step
    file: sevenseg_scan.sv
    old: "scan <= scan + 1'b1;"
    new: "scan <= scan + 2'd2;"
    class: constant
    why: display scan runs at twice the rate
  - name: scan_reset_an
    file: sevenseg_scan.sv
    old: "an   <= '1;"
    new: "an   <= '0;"
    class: reset
    why: anodes reset all low
