# ILA probes for the debug build (flow/debug.tcl inserts them after synthesis).
# pins: post-synthesis register output pins (cell names survive synthesis; net
# names do not); a bus lists its bits with [*] and the width must match.
ila:
  name: u_ila_0
  clock_net: CLK100MHZ_IBUF_BUFG
  depth: 1024                 # samples per capture
  input_pipe_stages: 0
probes:
  - name: count
    pins: "u_dut/count_reg[*]/Q"
    width: 16
    why: the counter itself
  - name: press_up
    pins: u_dut/u_db_up/press_reg/Q
    width: 1
    why: one-clock debounced press pulses
  - name: press_down
    pins: u_dut/u_db_down/press_reg/Q
    width: 1
  - name: press_clear
    pins: u_dut/u_db_clear/press_reg/Q
    width: 1
  - name: rx_valid
    pins: u_shell/u_rx/valid_reg/Q
    width: 1
    why: a byte arrived from the host
  - name: rx_data
    pins: "u_shell/u_rx/data_reg[*]/Q"
    width: 8
  - name: win_wr
    pins: u_shell/u_core/win_wr_reg/Q
    width: 1
    why: the shell writes a design register
  - name: win_rd
    pins: u_shell/u_core/win_rd_reg/Q
    width: 1
  - name: addr
    pins: "u_shell/u_core/frame_reg[1][*]/Q"
    width: 8
    why: the request's ADDR byte (0x80 + offset for the design's registers)
  - name: led
    pins: "u_dut/led_reg[*]/Q"
    width: 16
    why: the LED outputs (PWM); added in F0B so the ILA can check duty against level
  - name: phase
    pins: "u_dut/phase_reg[*]/Q"
    width: 8
    why: the PWM phase counter; LED[i] is lit on the clock after phase < duty while count[i] is 1
  - name: uart_rx_pin
    pins: UART_TXD_IN_IBUF_inst/O
    width: 1
    why: the raw serial line from the host
  - name: uart_tx_pin
    pins: UART_RXD_OUT_OBUF_inst/I
    width: 1
triggers:                     # suggestions; BRINGUP.md walks through each (flow/bringup.py runs count_write and pwm_period)
  - name: count_write
    condition: "win_wr == 1 AND addr == 0x80"
    position: 64
    use: capture a shell write to COUNT; count must take the written value on the next clock
  - name: button_press
    condition: "press_up == 1 OR press_down == 1 OR press_clear == 1"
    position: 512
    use: catch a debounced press; count changes by one on the next clock
  - name: host_byte
    condition: "rx_valid == 1 AND rx_data == 0xA5"
    position: 16
    use: confirm the shell receives the host's sync byte (1024 samples = 10.24 us, about one byte time at 115200)
  - name: pwm_period
    condition: "phase == 0x00"
    position: 0
    use: one capture of 1024 samples is exactly one PWM period (256 phases x PWM_PRESCALE 4); LED on-time = duty x 4
