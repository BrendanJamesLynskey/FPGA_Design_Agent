# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: t1_dimmer_counter
title: T1, LED dimmer and push-button counter
kind: example
produced_by: human
summary: A 16-bit up/down/clear counter on the Nexys A7-100T. Debounced buttons step it, the LEDs show it under PWM brightness
  (register or switches), the 7-segment display shows count and brightness in hex, and every register is reachable over
  the USB-UART through the test shell. The hand-written reference design for task T1.
scope_not:
- an agent run; the RTL, model and tests were written by hand
- a gamma-corrected or auto-repeating dimmer; brightness is linear in the duty and one press is one step
- a claim of compliance with any standard; the traceability record is DO-254-style evidence only
target:
  part: xc7a100tcsg324-1
  board: Nexys A7-100T
  top: t1_dimmer_counter_top
  tool: Vivado 2026.1
  note: also builds an ILA variant for debugging; the base build is the design
clocks:
- name: CLK100MHZ
  mhz: 100
  source: designs/t1_dimmer_counter/design.xdc
  note: the only clock; no MMCM
resets:
- name: CPU_RESETN
  active: low
  note: the board's reset button, through the shell's reset synchroniser
interfaces:
- name: UART register window
  type: test shell, 8N1 UART at 115200 baud
  doc: shell/PROTOCOL.md
  note: COUNT 0x00 RW, DUTY 0x01 RW (reset 0x40), CTRL 0x02 RW (reset 0x2; bit 0 DUTY_SRC, bit 1 DISPLAY_EN), INPUTS 0x03
    RO, PRESSES 0x04 RO; offsets 0x05 to 0x7F read 0; design ID T1DC
- name: buttons and switches
  type: BTNU, BTND, BTNC, SW[15:0] in; asynchronous, LVCMOS33 (SW[8] and SW[9] are LVCMOS18, bank 34)
  doc: designs/t1_dimmer_counter/spec.yaml
  note: synchronised and debounced; a press is a 0 to 1 change; clear beats up beats down; a shell write to COUNT beats
    a press
- name: LEDs and display
  type: LED[15:0], 7-segment CA to CG with AN[7:0], active low segments and anodes
  doc: designs/t1_dimmer_counter/spec.yaml
  note: LEDs show COUNT gated by the PWM; digits 0 to 3 show COUNT, 6 and 7 the effective duty, 4 and 5 blank
parameters:
- name: DEBOUNCE_CYCLES
  value: 1000000
  legal: tests shrink it; the board value is 10 ms at 100 MHz
  note: clocks the synchronised input must differ from the debounced level before it changes
- name: PWM_PRESCALE
  value: 4
  legal: positive integer
  note: the 8-bit phase counter advances every PWM_PRESCALE clocks, so a PWM period is 256 times this many clocks
- name: REFRESH_BITS
  value: 17
  legal: tests shrink it
  note: each display digit is lit for 2^REFRESH_BITS clocks, 8 digits per scan
- name: CLKS_PER_BIT
  value: 868
  legal: shell parameter
  note: UART 115200 baud at 100 MHz
