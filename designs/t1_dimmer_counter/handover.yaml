gaps:
- about: latency
  text: Button to count is 2 + DEBOUNCE_CYCLES + 1 clocks by design (10.00 ms at the board parameters); no record times
    it on the board.
- about: throughput
  text: Not applicable; a control design with no data path.
- about: E4
  text: The 100 percent is after fixing the bench for two survivors. The unbiased first-run score was 19 of 21.
- about: E7
  text: One passing bring-up run on 2026.1; the earlier release had three in a row.
- about: manual checks
  text: Buttons, display glyphs and three brightness levels were checked by a person on the earlier release's bitstream
    (results/f0b/manual_checks.md), not on 2026.1.
- about: operating conditions
  text: XADC rails and die temperature were not read, so the runs cannot be shown inside the recommended operating conditions.
- about: behaviour
  text: No auto-repeat or gamma curve exists. Reads of undefined window addresses return 0 with no error.
next_steps:
- Repeat the manual button, display and brightness checks on the 2026.1 bitstream and record them.
- Add a button-press ILA capture so a record times the button-to-count latency on the board.
- Read the XADC rails and die temperature during bring-up.
open_questions:
- Should brightness follow a gamma curve so equal steps look equal (the spec default is linear)?
- Should holding a button auto-repeat (the spec default is no)?
