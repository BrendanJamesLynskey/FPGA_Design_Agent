# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b110_itch_ouch
title: ITCH 5.0 over MoldUDP64 in, OUCH 5.0 out, phase 1 (simulation)
kind: showcase
produced_by: human
summary: A trading path in the formats a real venue speaks, in simulation. UDP payload words carrying MoldUDP64 and Nasdaq
  TotalView-ITCH 5.0 are decoded, a small top-of-book is kept for a few instruments, a pre-trade risk check with a kill
  switch decides, and an OUCH 5.0 Enter Order is built in a SoupBinTCP 3.00 packet and handed to a stub port, optionally
  started before the risk verdict and cancelled if it fails. A Python reference model and a seeded synthetic generator check
  the RTL bit for bit, seeded faults in the RTL are all caught, and the block is built out of context for the KR260's part
  at the 10G core clock.
scope_not:
- real market data or a real exchange; every message comes from our own seeded generator and no order is ever sent anywhere
- TCP, SoupBinTCP login, heartbeats or order responses; the frame goes to a stub port (docs/tcp_plan.md is a plan)
- Ethernet, IP or UDP handling and the FCS check; the path starts at the UDP payload (docs/phase2_integration.md is a plan)
- a full-depth book or every instrument; a few instruments with a bounded number of price levels, and a stated way to fail
- a board run, power, or timing inside the 10G core; the numbers are simulation and an out-of-context Vivado 2026.1 build
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260 (K26 SOM)
  top: itch_ouch_top (wrapped with input registers in ooc_wrap for the out-of-context build)
  tool: Vivado 2026.1
  note: no board top of its own; phase 2 puts it behind the 10G MAC of designs/b96_kr260_10g
clocks:
- name: clk
  mhz: 161.132
  source: results/b110/ooc/itch_ouch_top.json
  note: the 10G core user clock (nominally 161.1328125 MHz); the out-of-context build constrains the period 6.2061 ns, the
    4-decimal rounding of the nominal
resets:
- name: rst
  active: high
  note: synchronous; resets every register including the counters and starts the table sweep; one clock domain, no asynchronous
    input
interfaces:
- name: payload input
  type: s_v, s_d[63:0], s_sof, s_eof, s_keep[7:0], s_err (UDP payload words)
  doc: designs/b110_itch_ouch/docs/itch_ouch.md
  note: byte 0 in bits 7:0; keep is low-contiguous on the last word; the messages of a packet are delivered before its frame
    check is known
- name: order frame output
  type: o_v, o_d[63:0], o_sof, o_eof, o_keep[7:0], o_abort (stub port)
  doc: designs/b110_itch_ouch/docs/itch_ouch.md
  note: eight words, never paused; o_abort cancels the frame in flight (speculative start only)
- name: configuration and clears
  type: cfg_* static inputs and one-clock clr_* pulses
  doc: designs/b110_itch_ouch/docs/itch_ouch.md
  note: configuration is static while traffic runs; clr_book starts a table sweep during which events are dropped and counted
- name: observation
  type: flags, cnt (45 counters of 32 bits), tu_* top-of-book update record, tob_* registers
  doc: designs/b110_itch_ouch/docs/itch_ouch.md
  note: counters wrap, never saturate; every counter is defined in the datasheet
parameters:
- name: N_INST
  value: 4
  legal: 2 to 8
  note: instruments watched, found through Stock Directory messages
- name: LEVELS
  value: 8
  legal: 4 or 8
  note: price levels per side and instrument; more distinct prices makes the instrument inexact
- name: ORD_AW
  value: 8
  legal: 4 to 16 (tested at 5, 6, 8 and 10)
  note: order table index bits, so 2^ORD_AW live orders; two live orders with one index make the instrument inexact
