gaps:
- about: board_run
  text: Not run on a board; phase 2 would bring it behind the 10G MAC of the KR260 design (docs/phase2_integration.md).
- about: power
  text: Not measured; an out-of-context build has no realistic activity and nothing ran on a board.
- about: E6
  text: Out of context the clock has no buffer or jitter and the inputs are registered in the wrapper; inside the 10G core
    the clock and placement can differ. Only the default parameters were built.
- about: throughput
  text: Measured in simulation only, and the figure is the rate of the input stream for these message sizes, not a limit
    of the path; no figure on a board.
- about: tcp
  text: No TCP, SoupBinTCP login, client heartbeat or response handling; the frame goes to a stub port. docs/tcp_plan.md
    compares the options and recommends one for phase 2; it was not built or timed.
- about: ethernet
  text: The path starts at the UDP payload. Header handling, the frame check and the late frame verdict of the 10G MAC are
    phase 2 (docs/phase2_integration.md); until then a bad frame cannot recall messages already applied or an order already
    triggered.
- about: spec
  text: Field layouts were read from the public Nasdaq documents; the items that were recalled or assumed are marked UNCONFIRMED
    in docs/spec_notes.md, among them whether older OUCH 5.0 ports expect a 4 byte price and whether a TagValue length counts
    its tag byte. No order was ever accepted by anything but our own model.
- about: book
  text: Not a full-depth book. Behaviour a user could guess wrong - more distinct prices than LEVELS or two live orders
    with one table index make the instrument inexact and orders on it are refused until clr_book; the position counts the
    quantity sent, not filled; a Replace never triggers an order; the candidate's verdict uses the book after the triggering
    message.
- about: simulators
  text: Simulated with Icarus Verilog and cocotb only; no Verilator simulation and no formal proof of the protocol layer.
- about: cdc
  text: One clock domain and no asynchronous input, so no clock-domain-crossing check applies; the crossing into the 10G
    core's clock is phase 2.
- about: data
  text: Synthetic data from one generator with its own message mix; the figures say how the block behaves on that mix, nothing
    about a market.
next_steps:
- Write the phase 2 brief from docs/phase2_integration.md - the adapter from the MAC's words, the late frame verdict, registers,
  and in-context timing on the KR260.
- Build the TCP fast path of docs/tcp_plan.md option A and test it against a software exchange on the host PC.
- Decide with the board latency whether the book-dependent risk verdict should be replaced by a faster partial check.
open_questions:
- Is the speculative start worth its abort path once the TCP headers and the 10G chain are in front of the frame?
- Should a Replace trigger an order, given that its side is known one clock after an Add's?
