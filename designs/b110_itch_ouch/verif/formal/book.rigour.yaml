schema: fpga-design-agent/formal_rigour/v1
scope: >-
  book_core at N_INST = 2, LEVELS = 4 and ORD_AW = 2 (the instance run_book_formal.py also runs with its ablations and seeded faults), properties Q1 to Q6 from reset.
# every assertion NAME is paired with the cover NAME__ante written next to it in book_props.sv; q3's antecedent is the saturation itself
sanity: [c_saturates, c_live_level]
depth:
  bmc:
    enough: false
    why: >-
      A bound from reset, not a proof: depth 12 covers the sweep after reset (2^ORD_AW + 1 = 5 clocks) and the deepest antecedent of this job (the saturation of a level
      by an add, a few clocks after live), but the quantity invariants hold for every reachable state and BMC does not say that. Q5 is an invariant over the ladder memories, which
      k-induction cannot assume without a strengthening over every entry (this job's header); the unbounded proof is brief 191's.
