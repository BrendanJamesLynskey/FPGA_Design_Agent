# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b102_managed_fcs
title: Managed-project demonstration - an FCS self-test around a frozen CRC netlist
kind: demonstration
produced_by: human
summary: A KR260 self-test of an Ethernet FCS stage that exists to demonstrate a managed project (brief 102). An owned sequencer
  sends a fixed sixteen-word frame through a CRC-32 block that was made outside the project as an EDIF netlist and is frozen,
  and shows the verdict on an LED; a heartbeat divider is excluded from the agent's view but built with the rest. project.yaml
  marks each part, and the agent's tools enforce it.
scope_not:
- a 10G Ethernet FCS check; the CRC block takes sixteen bits a clock, not the 64-bit word of the 96 design, because the
  open equivalence engines could not prove 64 bits
- a board design; it was not programmed, and the 161 MHz clock constraint is on the 25 MHz oscillator pin for a timing study
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260
  top: fcs_top
  tool: Vivado 2026.1
clocks:
- name: clk_25
  mhz: 161.13
  source: designs/b102_managed_fcs/design.xdc
  note: the oscillator pin is 25 MHz on the board; the constraint is the 10G datapath rate to ask the real question of the
    CRC block
resets:
- name: power-on counter
  active: high
  note: a four-clock shift register in fcs_top holds every block in synchronous reset after configuration; there is no reset
    input
interfaces:
- name: crc32_d16 slot
  type: black-box module filled by an EDIF netlist (build.yaml netlists)
  doc: designs/b102_managed_fcs/project.yaml
  note: the contract is in project.yaml (ports, clock, reset, boundary timing budgets); behaviour a user could guess wrong
    is in the header of ext/reference/crc32_d16.sv (register not complement, little-endian words, hold on en low, reset
    wins)
parameters:
- name: N_WORDS
  value: 16
  legal: 1 to 254 (the counter is eight bits wide in the word function)
  note: words per frame, two bytes each
- name: EXPECT
  value: '0x79D3D43A'
  legal: the CRC register value of the frame, from flow/managed_import.crc32_model
  note: checked against zlib in designs/b102_managed_fcs/tests/test_b102_fcs.py
