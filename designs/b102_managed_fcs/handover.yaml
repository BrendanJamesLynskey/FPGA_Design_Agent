gaps:
- about: power
  text: The estimate is vectorless at default toggle rates; this is a timing study that was never run on a board, so no
    power measurement is claimed.
- about: throughput
  text: Not applicable beyond the clock; the block takes two bytes a clock by construction and no throughput measurement
    was made.
- about: width
  text: The CRC block is sixteen bits wide; the 10G design uses sixty-four. The open engines of eqy proved 8 and 16 bits
    within two minutes and not 32 or 64 (results/102_managed/eqy_width_scaling.json).
- about: board
  text: Never programmed; no hardware evidence and no operating conditions exist.
- about: behaviour
  text: The design has no reset input and one fixed frame; the verdict LED is sticky until the next configuration, a corrupted
    word in a later frame does not clear it.
