# How flow/run_vivado.sh builds this design (paths are relative to the repo root). The CRC block is a netlist made outside the
# project (netlists:), filling the black-box slot in ext/crc32_d16.sv.
top: fcs_top
part: xck26-sfvc784-2LV-c
board: kr260           # boards/kr260/board.yaml
sources:
  - designs/b102_managed_fcs/ext/crc32_d16.sv
  - designs/b102_managed_fcs/rtl/fcs_ctrl.sv
  - designs/b102_managed_fcs/rtl/heartbeat/heartbeat.sv
  - designs/b102_managed_fcs/rtl/fcs_top.sv
netlists:
  - {file: designs/b102_managed_fcs/ext/crc32_d16.edf, format: edif}
constraints:
  - designs/b102_managed_fcs/design.xdc
generics: {}           # BUILD_STAMP is added by the flow
