gaps:
- about: latency
  text: Not measured; the design has no data path latency requirement and the stand-in has no transceiver latency. Board
    work (56B) is the first chance.
- about: throughput
  text: The line rate is 10.3125 Gb/s by configuration; no throughput or error-rate measurement exists because nothing ran
    on a board.
- about: hardware
  text: Nothing has run on a board. The reference clock source and frequency, the 25 MHz input, the SFP+ control pin functions
    and the TX_DISABLE polarity are unconfirmed (open-source example, not the schematic).
- about: simulation
  text: AMD's Wizard simulation model is refused by the free Vivado Simulator (54716 instances against 50000); the register-level
    bench uses a behavioural stand-in, so the transceiver itself is untested.
- about: counters
  text: The hard PRBS checker counts cycles with an error, not bits; TXPRBSFORCEERR may inject two errors per pulse with
    these clock ratios (UG576); the DRP window hangs if used while the transceiver is in reset (no timeout).
- about: behaviour
  text: 'Guessable wrongly (docs/register_map.md): unmapped reads return 0 and writes are ignored; PULSE bits are strobes
    and read 0; counters change only on a snapshot; DRP_DATA reads the last read, not the last write; reads have no side
    effects.'
- about: review
  text: One review round; STATUS bits 6 and 7 are reserved; the planner does not check that a rate is reachable from the
    reference by an integer divider; SYSMON conversion to physical units is not implemented.
next_steps:
- Run docs/board_run_plan.md on the KR260 (laser polarity first, then near-end loopback BER, then the optical loop).
- Confirm the reference clock and the control pins against the carrier schematic.
- Build an I2C master for the module's SFF-8472 diagnostics.
