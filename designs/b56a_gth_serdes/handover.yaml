schema: fda-handover/1
id: b56a_gth_serdes
title: One GTH transceiver at 10.3125 Gb/s with PRBS testing on the KR260 SFP+ cage
kind: example
produced_by: human
summary: A Kria KR260 design that drives one UltraScale+ GTH transceiver (quad 224, channel 2, the SFP+ cage J24) at 10.3125
  Gb/s with PRBS test patterns, checks them in fabric (exact bit errors) and in the transceiver (error cycles), and reports
  everything over the JTAG cable through a documented register block. It is the base for the board work of brief 56. Built
  with Vivado 2026.1 on the free Basic licence; not yet run on a board.
scope_not:
- a protocol or a link layer (RAW data, PRBS only); no Aurora or Ethernet core (10G/25G Ethernet is refused by the Basic
  licence)
- multi-lane work, meaning channel bonding, lane deskew, PCIe x4 and 40G are simulation-only on this one-lane board
