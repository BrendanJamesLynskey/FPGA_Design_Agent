<svg xmlns="http://www.w3.org/2000/svg" width="640" height="266" viewBox="0 0 640 266" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="266" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">gth_wiz</text><text x="170" y="43">AMD UltraScale FPGAs Transceivers Wizard core: GTHE4 channel X0Y6, QPL</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">prbs_gen64</text><text x="170" y="77">fabric PRBS-7/15/23/31 generator, one 64-bit word per clock, error inj</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">prbs_chk64</text><text x="170" y="111">fabric PRBS checker, exact bit-error counting, lock and loss of lock, </text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">gth_serdes_core</text><text x="170" y="145">register block, counter snapshot, DRP and SYSMON windows, SFP+ control</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">jtag_bus</text><text x="170" y="179">host register bus over the JTAG cable (BSCANE2 USER4), reused from b58</text><text x="8" y="206" font-weight="bold">Interfaces</text><text x="8" y="224">jtag_bus - gth_serdes_core: host_regs (simple)</text><text x="8" y="242">prbs_gen64 - gth_wiz: user_data (simple)</text></svg>
