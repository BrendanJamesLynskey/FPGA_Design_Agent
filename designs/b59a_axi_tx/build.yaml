# How flow/run_vivado.sh builds this design (paths are relative to the repo root).
top: b59a_axi_tx_top
part: xc7a100tcsg324-1
board: nexys_a7_100t    # report_power uses this board's thermal environment (boards/<board>/board.yaml)
sources:
  - shell/rtl/*.sv
  - ip_lib/logic_analyser/rtl/*.sv
  - axi_tx/rtl/axi_tx_lfsr.sv
  - axi_tx/rtl/axil_rules.sv
  - axi_tx/rtl/axis_rules.sv
  - axi_tx/rtl/axi_viol_log.sv
  - axi_tx/rtl/axil_mon.sv
  - axi_tx/rtl/axis_mon.sv
  - axi_tx/rtl/axil_tx_master.sv
  - axi_tx/rtl/axis_tx_source.sv
  - axi_tx/rtl/axis_tx_sink.sv
  - axi_tx/rtl/axi_tx_core.sv
  - axi_tx/rtl/axil_demo_periph.sv
  - axi_tx/rtl/axis_demo_fifo.sv
  - axi_tx/rtl/axi_tx_sys.sv
  - designs/b59a_axi_tx/rtl/*.sv
constraints:
  - designs/b59a_axi_tx/design.xdc
ip_tcl:                 # brief 59A: AMD IP created in the in-memory project (flow/prepare.py, flow/build.tcl)
  - designs/b59a_axi_tx/ip/amd_ip.tcl
generics: {}            # board values are the RTL defaults; BUILD_STAMP is added by the flow
