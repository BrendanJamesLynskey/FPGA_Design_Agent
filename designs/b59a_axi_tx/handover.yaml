gaps:
- about: throughput
  text: Not measured as a data rate; the records give transaction counts and latencies, not bytes per second on either bus.
- about: latency
  text: Latency is from one run (bram_random_rw) with random back-pressure; none for the peripheral target or without back-pressure.
- about: E3
  text: The 11 scenarios were chosen by the checker's author; they show those legal cases are quiet, not that no legal traffic
    can fire a rule.
- about: amd_ip
  text: The AMD IP build test (amd_ip_probe.json) shows the five cores build on Vivado 2026.1 without a licence; the AMD
    traffic generator and stream checker were not used on the board.
- about: verification
  text: Proofs are bounded to 20 cycles and the properties were written by the checker's author; AMD's checker agreeing
    on hardware is the independent evidence. The clean Verilator lint run has no record in results/.
- about: board
  text: BRAM-target runs are compared with a transaction-level model, not with simulation cycle for cycle (Icarus cannot
    run the AMD core); block RAM keeps contents across runs, so unwritten words are unknown to the model.
- about: build identity
  text: Board evidence is tied to commit e562dd3 (build ID 44b780c9); later commits changed build inputs, not logic, so
    the current tree has another build ID and no rebuild or board re-run was made.
- about: operating conditions
  text: The XADC samples about 1 MSPS with alarms latched between reads, so a shorter supply droop is not seen.
- about: behaviour
  text: 'Guessable wrongly (RTL and docs/axi_tx.md): the target select is a static mux, change it only while no program
    runs; rules 0-8 are not evaluated while ARESETn is low; a READY-to-VALID path shows only as a VALID that drops or changes;
    outstanding counts saturate at 255; a read of an unwritten word counts as unchecked, not matched; whether a write to
    an unlisted window offset is ignored was not checked.'
- about: scope
  text: One AXI4-Lite transaction in flight, no IDs, bursts, slave side or soak mode; stream data 32-bit only; AMD's checker
    does not watch the stream.
- about: readout speed
  text: A board run reads every counter and the log over 115200-baud UART, taking 7 to 33 seconds; no faster readout is
    built.
next_steps:
- Decode the AMD checker's pc_status bits to rule names using the AMD protocol-checker guide's table, and add them to the
  run record.
- Add the full AXI4 transactor, the slave side and a soak mode that steers random traffic toward untested combinations.
- Root-cause the 64-bit stream synthesis trim, or keep the core 32-bit only and say so at every interface.
- Run the board plan again on a bitstream built from the current tree, so the evidence and the build ID agree.
open_questions:
- Is a faster readout (JTAG-AXI or a higher baud rate) worth building before the next board plan?
