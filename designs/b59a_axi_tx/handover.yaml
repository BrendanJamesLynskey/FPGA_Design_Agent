# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b59a_axi_tx
title: AXI transactor, protocol checker and scoreboard on the Nexys A7
kind: showcase
produced_by: human
summary: Board demonstration of an on-chip AXI4-Lite and AXI4-Stream traffic generator, protocol checker and scoreboard.
  A program loaded over the UART shell drives a vendor block-RAM controller or our own peripheral and stream FIFO, which
  carry run-time seeded bugs. Ten AXI4-Lite and five AXI4-Stream rules are watched and counted, a capture records the bus
  around the first violation, and AMD's AXI Protocol Checker watches the same AXI4-Lite bus as a cross-check.
scope_not:
- full AXI4 (bursts, IDs, several transactions in flight), a slave side, a DMA target or a soak mode
- a hunt for bugs in a third-party core; the peripheral, the FIFO and their bugs are ours and deliberately simple
target:
  part: xc7a100tcsg324-1
  board: Nexys A7-100T
  top: b59a_axi_tx_top
  tool: Vivado 2026.1
  note: core RTL is in axi_tx/rtl; this folder holds the board top, constraints and AMD IP Tcl
clocks:
- name: CLK100MHZ
  mhz: 100
  source: designs/b59a_axi_tx/design.xdc
  note: the only clock
resets:
- name: CPU_RESETN
  active: low
  note: the reset button, synchronised; the host can hold the targets' ARESETn low through SYS_CTRL bit 12
interfaces:
- name: UART register window
  type: test shell, 8N1 UART at 115200 baud
  doc: shell/PROTOCOL.md
  note: shell addresses 0x80-0xFF; offsets 0x00-0x3F transactor (axi_tx/host/regs.py), 0x40-0x4C XADC, 0x50-0x55 AMD checker
    status; other offsets read 0
- name: Transactor, checker and scoreboard
  type: AXI4-Lite master with monitors; AXI4-Stream source and sink
  doc: docs/axi_tx.md
  note: program format, rules, counters, capture; one AXI4-Lite transaction outstanding, 32-bit stream data
- name: Target 0 (board)
  type: AMD AXI BRAM Controller 4.1 with Block Memory Generator 8.4, AXI4-Lite
  doc: docs/axi_tx.md
  note: 8 KB; only address bits 12:0 reach it, so a higher address wraps rather than errors
- name: Target 1 (board)
  type: axil_demo_periph, AXI4-Lite
  doc: docs/axi_tx.md
  note: ID, R0-R3, COUNT, WCOUNT, BUG; write to a read-only register answers SLVERR; address 0x20 up answers DECERR (reads
    0); AxPROT ignored
parameters:
- name: CLKS_PER_BIT
  value: 868
  legal: positive integer; 868 gives 115200 baud
  note: UART bit period in clocks
- name: SDATA_W
  value: 32
  legal: 32 only
  note: core refuses other widths at elaboration
- name: program RAM
  value: 256 instructions of four 32-bit words
  legal: loops nest 4 deep
  note: loaded over the UART
