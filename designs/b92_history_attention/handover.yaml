gaps:
- about: board_run
  text: Not run on a board and not built inside the 58A top; out of context only.
- about: timing
  text: Out of context the clock has no buffer or jitter, so every latency is quoted at no faster than 2.0 ns; the arms
    have two registered stages before the output (three for attention).
- about: power
  text: Not measured; the out-of-context builds have no power report.
- about: data
  text: Two synthetic generators with planted structure; the ranking of history mechanisms may not hold on real order flow.
- about: attention
  text: Attention was trained with a throwaway head, frozen, then given the common head; its negative result holds for that
    recipe only. It was not built in Vivado.
- about: comparison
  text: Many paired intervals over 10 sessions, uncorrected; the gain of the sums over the history-free head has a lower
    bound of +0.004.
- about: throughput
  text: Every arm accepts one event a clock (the RTL test streams half the events back to back).
- about: behaviour
  text: 'Guessable wrongly: state is cleared by rst and advances only on in_v; the first N outputs after a reset use an
    empty history; shifts floor; ties go to the lower class and, in attention, to the most recent event.'
