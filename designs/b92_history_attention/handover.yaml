# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b92_history_attention
title: Order-flow history and tiny attention for nanosecond inference, measured
kind: showcase
produced_by: human
summary: A gated study of whether order-flow history helps small integer classifiers on synthetic limit-order-book data,
  and what it costs in the fabric. A self-exciting generator (Hawkes-type arrivals, sign persistence, informed bursts) makes
  history matter; lagged features help the 87 trees (gate passed). On one common head, exponentially decaying sums and a
  learned fixed window each add about 0.015 test accuracy over the history-free head, while two softmax-free tiny attentions
  end about 0.012 below the decaying sums, so no attention block was built in Vivado. The stateful arms are bit-exact against
  a twin and built out of context on the K26 and the Artix-7 100T.
scope_not:
- real market data; both generators are seeded synthetic order flow with planted structure
- a board run or a full-design build; every hardware number is an out-of-context, post-route Vivado 2026.1 build
- 'an attention block in the fabric: it lost at the stage 2 test, so its RTL was simulated against its twin but never built'
- a model of a real market; the clustering is exponential and short-memory (docs/what_we_found.md section 2)
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260 (K26 SOM); also xc7a100tcsg324-1 (Nexys A7) out of context
  top: b92_<arm> (a stateful front end and a head), out of context, behind an input register
  tool: Vivado 2026.1
  note: no board top; the arms take the 87 features plus three event terms (docs/generator.md)
clocks:
- name: clk
  mhz: 80.6
  source: results/b92/ooc/k26/b92_a1_decay.json
  note: closed clocks differ per module; every module's closed clock is in results/b92/ooc/<part>/<module>.json
resets:
- name: rst
  active: high
  note: synchronous; clears the valid pipeline and the front end's state (sums, window); never the datapath or out_cls
interfaces:
- name: arm ports
  type: clk, rst, in_v, in_f[50:0] (87 features, then ts+1, sv+8, ofi+31), out_v, out_cls[1:0]
  doc: designs/b92_history_attention/docs/generator.md
  note: state advances only on in_v; out_v follows in_v by exactly LATENCY clocks; ties go to the lower class
- name: generator and training API
  type: Python (hist.hawkes_sim, hist.frontends, hist.attn, hist.stage2, hist.rtl)
  doc: designs/b92_history_attention/docs/generator.md
  note: options and the behaviours a user could guess wrong are listed in the datasheet
parameters:
- name: decay rate pair
  value: shifts 2 and 4 (chosen on validation from 1/3, 2/4, 3/5, 4/6)
  legal: any shift pair
  note: time constants about 4 and 16 events
- name: window length
  value: 8 and 16 events
  legal: any N
  note: cost grows with the window
- name: attention
  value: N=16, key size 4, value size 4, forms top1 and relu
  legal: fixed in this brief
  note: not built in Vivado
