# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b64b_zedboard
title: HW/SW partitioning demo on the ZedBoard (Zynq-7000), bare metal
kind: demonstration
produced_by: session
summary: Measures what a Cortex-A9 and the fabric of a Zynq-7000 cost each other, bare metal, on the ZedBoard. A PS7 with
  GP0, HP0 and ACP ports drives two AXI DMA to accelerator chains (CRC-32 or a 16-tap FIR) and a register plane with a latency
  probe and three bus-error blocks. Software against the HP path with cache maintenance against the coherent ACP path is
  swept over buffer sizes, and the A9's reaction to AXI SLVERR and DECERR responses is recorded for each memory mapping.
scope_not:
- Linux, UIO, device-tree or kernel-driver measurements; bare metal only
- the KR260 and the Cortex-A53; this folder is Zynq-7000 only
- a power or energy measurement; the only power figure is the tool's estimate
target:
  part: xc7z020clg484-1
  board: ZedBoard
  top: zb_hwsw_wrapper
  tool: Vivado 2026.1
  note: the block design is built by vivado/build_full.tcl with the PS7 settings in vivado/ps7_zedboard.tcl (DDR3 from the
    board guide, no board file); the register blocks are generated from regmaps/
clocks:
- name: clk_fpga_0
  mhz: 100
  source: results/64b_zedboard/builds/full/timing.rpt
  note: PS FCLK_CLK0; every fabric block, the DMAs, the HP0 and ACP ports and the GP0 master run on it
resets:
- name: FCLK_RESET0_N
  active: low
  note: from the PS, through a processor system reset block to every fabric block as aresetn (synchronous, active low)
interfaces:
- name: GP0 register plane
  type: AXI3 from the PS through a protocol converter to AXI4-Lite, our axil_xbar, generated register blocks
  doc: designs/b64b_zedboard/gen/regs/zb_lat_regs.md
  note: latency probe, error blocks and the accelerator control registers at the window base 0x40000000; accesses outside
    every block get DECERR from the crossbar, holes inside a block follow its unmapped setting
- name: Bus-error blocks
  type: three generated register blocks, one per unmapped setting (okay, slverr, split)
  doc: designs/b64b_zedboard/gen/regs/zb_hole_split_regs.md
  note: each has an error-capture register pair at offsets 0xFF8 and 0xFFC; the other two blocks have the same layout
- name: DMA and accelerator chains
  type: AXI DMA simple mode, 32-bit AXI4-Stream into zb_accel, chain 0 on HP0 and chain 1 on the ACP
  doc: designs/b64b_zedboard/gen/regs/zb_accel_regs.md
  note: the ACP chain drives AxUSER 1 and AxCACHE 0011 so its accesses are coherent; the HP chain needs software cache maintenance
- name: Console and logs
  type: PS UART1 at 115200 baud, 8N1 on the board's USB-UART; a copy of the console text is kept in DDR and read over JTAG
  note: the DDR copy is the record because the UART has one reader at a time
parameters:
- name: accelerator mode
  value: CRC-32 or 16-tap FIR
  legal: register ACC_CTRL 0 or 1 (designs/b64b_zedboard/gen/regs/zb_accel_regs.md)
  note: the FIR uses the library fir block in its lut_mult variant
- name: stream width
  value: 32 bit
  legal: fixed
  note: the DMA streams are 32 bits wide, which caps the transfer rate near 400 MB/s at 100 MHz
