gaps:
- about: board_run
  text: Linux was not run. UIO interrupt-to-user latency, access through devmem or UIO mmap and a kernel driver reacting
    to an error response are unmeasured, and SD-card writes need the owner's yes.
- about: E1
  text: The accelerator testbench is not run by CI, and its result is the first executor's report, not a committed log.
- about: power
  text: Power is the tool's estimate (confidence Medium) and no board power measurement was made; energy per result is not
    given.
- about: behaviour
  text: With the normal non-cacheable mapping the error-capture count read 255 (it saturates) for 200 accesses, so more
    accesses reached the slave than the core issued; the cause is not known. DFAR is not reliable for an imprecise abort
    (stale in six of eight read runs). A write error with a device or non-cacheable mapping produced no abort in any run,
    so its only trace is the slave's capture register.
- about: statistics
  text: Each timing is a median with min, 95th percentile and max over the repetitions in the log (hundreds at small sizes,
    a dozen at 1 MB); no confidence interval is computed, and one board, one bitstream and one power-up were used.
- about: wedges
  text: The PS wedged three times on 2026-11-14 on full reloads. None occurred on 2026-11-15 with one full load after the
    power cycle and light reloads only, but the cause is not proven, so the first load and light-reload procedure in tcl/zb.tcl
    is a precaution.
next_steps:
- Run the same three-way comparison on Linux (UIO latency, devmem and driver behaviour on an error response).
- Find why the normal non-cacheable mapping shows more accesses at the slave than the core issued.
- Put the same bus-error test on the KR260 Cortex-A53 and compare SError against the A9's abort.
open_questions:
- Is the posted-write error lost in the PS interconnect for every non-strongly-ordered mapping, or only for these buffering
  settings?
