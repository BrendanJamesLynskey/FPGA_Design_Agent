commands:
- what: build the bitstream and the XSA
  cmd: vivado -mode batch -source designs/b64b_zedboard/vivado/build_full.tcl -tclargs <out dir> <repo root>
  heavy: true
  minutes: 16
  needs: Vivado 2026.1 and a heavy slot (take_heavy_slot.sh)
- what: build the bare-metal programs
  cmd: make -C designs/b64b_zedboard/sw t_crc.elf t_fir.elf hello.elf && bash designs/b64b_zedboard/sw/build_err.sh
  heavy: false
  minutes: 1
  needs: the arm-none-eabi GCC from the Vitis 2026.1 install
- what: run one program on the board (first load after a power cycle, then ZB_LIGHT=1)
  cmd: ZB_SERIAL=<cable serial> XSA_DIR=<unzipped XSA> ZB_FIRST=1 designs/b64b_zedboard/run_elf.sh designs/b64b_zedboard/sw/hello.elf
    out.log 60
  heavy: false
  minutes: 1
  needs: the ZedBoard on its own supply with the JTAG boot straps, hw_server running, the board lock; read the board rules
