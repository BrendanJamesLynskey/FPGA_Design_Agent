# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b65a_axil_soc
title: Generated block-design sample, a tone generator on an AXI4-Lite crossbar
kind: example
produced_by: human
summary: The brief 65A sample block design. A DDS tone generator and a frequency and duty counter (grouped as the tone hierarchy)
  and a logic analyser, all from ip_lib, sit behind a generated AXI4-Lite crossbar that the host reaches through the UART
  test shell. blockdesign.yaml and tone.yaml are the source; everything under gen/ (top, wrappers, address map, graph) is
  generated from them. It shows the block-design format, its checks and the generator, and was built; it has not been run
  on a board.
scope_not:
- a showcase or a board-verified design; the bitstream was built, not programmed
- a general interconnect; generation covers AXI4-Lite only, 32-bit data and one clock domain
target:
  part: xc7a100tcsg324-1
  board: Nexys A7-100T
  top: b65a_axil_soc_top
  tool: Vivado 2026.1
  note: the block diagram is drawn from gen/graph.json by the 65A viewer; docs/blockdesign.md is the user guide to the format
clocks:
- name: CLK100MHZ
  mhz: 100
  source: designs/b65a_axil_soc/design.xdc
  note: the only clock domain (sys); one reset synchroniser per domain is generated
resets:
- name: CPU_RESETN
  active: low
  note: the reset button; synchronised into the sys domain, where the generated blocks see a synchronous active-high rst
interfaces:
- name: UART register window
  type: test shell, 8N1 UART at 115200 baud
  doc: shell/PROTOCOL.md
  note: the window is an AXI4-Lite master (bd_win_axil_master); window registers ADDR, WDATA, CTRL, STATUS, RDATA at offsets
    0x00-0x04; one transfer at a time, ignored while busy
- name: Address map
  type: AXI4-Lite slaves behind axil_xbar
  doc: designs/b65a_axil_soc/gen/address_map.md
  note: tone.s_dds 0x40000000, tone.s_fd 0x40001000, la.s_axil 0x40010000, 4 KB each; the register layout of each block
    is in that file
- name: LEDs
  type: LED[15:0] (LVCMOS33)
  note: LED[15:8] show the high byte of the DDS sample; LED[7:0] are tied to 0
parameters:
- name: CLKS_PER_BIT
  value: 868
  legal: derived from the clock; raised to a top-module parameter
  note: UART bit period in clocks, so the simulation can shorten it
- name: tone.fd.GATE_CLKS
  value: 1000000
  legal: a positive integer; raised to a top-module parameter
  note: the frequency counter's gate length in clocks, 10 ms at 100 MHz
- name: la ADDR_W
  value: 8
  legal: per ip_lib/logic_analyser
  note: 256 samples; the window exposes 128 words
- name: dds
  value: PHASE_W 32, LUT_W 8, OUT_W 16, variant bram
  legal: per ip_lib/dds_awg
  note: block RAM sine table
