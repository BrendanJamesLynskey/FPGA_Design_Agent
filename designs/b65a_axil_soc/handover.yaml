gaps:
- about: board_run
  text: No board run was attempted. A smoke run reading the three blocks over the UART would put it on hardware; nothing
    in the records shows the UART, the DDS output or the LEDs working on the device.
- about: latency
  text: Not measured. The records count transfers, not clocks per transfer through the shell master and crossbar.
- about: throughput
  text: Not measured. The shell master does one transfer at a time over a 115200-baud link, so the rate is set by the UART;
    no record times it.
- about: power
  text: Vectorless estimate only; the tone generator's real switching activity is not in it.
- about: E1
  text: The end-to-end bench exercises the generated design in simulation only, with a shortened UART bit time and a shortened
    gate; the full-length parameters were built but not simulated.
- about: E2
  text: There is no seeded-fault run against the generator's own output or the support RTL (the shell master, the window
    adapter and the register bank); the end-to-end test covers them functionally only.
- about: E3
  text: Faults cover the crossbar alone. The parameter guards of the crossbar and the support RTL run in simulation only;
    Vivado ignores them.
- about: E5
  text: The graph check compares 6 of the 7 links; the inverted sample bit that feeds the frequency counter goes through
    logic and is not compared.
- about: build identity
  text: The recorded build was made from a tree with uncommitted changes (git_dirty is true in run.json), at 2 threads;
    the build ID covers the thread count and the inputs, so it changes when either does.
- about: scope
  text: Generation covers AXI4-Lite with 32-bit data and a single clock domain; AXI4 and AXI4-Stream links are checked and
    wired point to point only; no interrupt concatenation and no debug-core automation.
- about: behaviour
  text: 'From the generated gen/address_map.md: addresses between the blocks'' ranges (0x40002000 to 0x4000FFFF) get DECERR
    from the crossbar; inside the register-bank blocks an offset with no register, and a write to a read-only register,
    answer SLVERR with read data 0, which that file says agrees with the house convention for a read of a hole (split response:
    SLVERR, read 0) and differs for a write, which the house convention answers with OKAY and ignores; the banks have no
    error-capture registers; la.s_axil answers SLVERR from offset 0x200. Byte strobes are honoured on control registers.
    fd offset 0x000 is a SCRATCH register with no block input. The master keeps one write and one read in flight.'
next_steps:
- Add a board smoke run over the UART that reads the three blocks and checks the reset values, and record it with its operating
  conditions.
- Bring the hand-written register banks (flow/blockdesign/rtl/bd_axil_regs.sv, bd_axil_win.sv) in line with the house split
  response (a write to an unmapped offset answers OKAY) and give them the error-capture registers, or generate them with
  hwsw/regmap.py; until then gen/address_map.md states how they differ. Then regenerate gen/ and the docs.
- Use the viewer as the how-it-works diagram on other showcase pages, and add the remaining items in docs/blockdesign.md
  under Not yet.
open_questions:
- The register-map format is 65A's own; should brief 64A's single source consume or replace it?
