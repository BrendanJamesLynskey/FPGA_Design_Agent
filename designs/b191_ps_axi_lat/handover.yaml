# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b191_ps_axi_lat
title: Cortex-A53 to programmable-logic AXI latency probe (KR260, board row B-R8, prepared)
kind: demonstration
produced_by: session
summary: A register block with a free-running counter that timestamps every AXI read request and every write it accepts,
  one on each of the Zynq UltraScale+ processor system's two AXI masters towards the fabric (M_AXI_HPM0_FPD and M_AXI_HPM0_LPD),
  and a host program that times 32-bit reads and writes of it from the Arm Cortex-A53 with the processor's own timer and
  with the fabric's counter. The probe is simulated against an edge-counting AXI master and seeded faults are caught; the
  host program and its judging script are tested without a board against a software stand-in. The board row (B-R8) is pre-registered;
  the programmable-logic image's build recipe is written and was not built, and nothing has run on a board.
scope_not:
- a measured result; no latency figure for the processor-to-fabric path exists yet, only the means of measuring it
- a built bitstream; the image's recipe (build.yaml, the processor-system IP script) is untested, so its clock constraint,
  address assignment and the flow's gates are unchecked
- the latency of the ACP or HP ports, DMA, cached accesses, wider accesses or a faster fabric clock than 100 MHz
- a design that does anything else; the image has no I/O pins and no function besides the two probes
target:
  part: xck26-sfvc784-2LV-c
  board: Kria KR260 (K26 SOM)
  top: ps_axi_lat_top (the PL image); axi_lat_probe (simulated alone)
  tool: Vivado 2026.1
  note: the image was not built; the probe is simulated with Icarus Verilog and cocotb
clocks:
- name: pl_clk0
  mhz: 100
  source: designs/b191_ps_axi_lat/design.xdc
  note: the processor system's PL clock 0 (the IP script sets 100 MHz); the XDC constraint on the PS clock pin is untested
    because the image was not built; a fabric clock of 10 ns, so fabric-side figures have a resolution of 10 ns
resets:
- name: aresetn
  active: low
  note: the processor system's pl_resetn0 through a 4-flop reset synchroniser (asynchronous assert, synchronous release);
    clears the counter, the registers and the counts, not the log memory
interfaces:
- name: AXI4 slave (one per processor master)
  type: awid, awaddr, awlen, awsize, awvalid/awready, wdata, wstrb, wlast, wvalid/wready, bid, bresp, bvalid/bready, arid,
    araddr, arlen, arsize, arvalid/arready, rid, rdata, rresp, rlast, rvalid/rready (32-bit data, 16-bit ids)
  doc: designs/b191_ps_axi_lat/docs/ps_axi_lat.md
  note: single-beat 32-bit accesses only; anything else is answered SLVERR and counted; unmapped reads return 0 with SLVERR;
    partial write strobes are refused
- name: register window
  type: 4 KiB at the PS addresses 0xA0000000 (FPD) and 0x80000000 (LPD); ID, BUILD, CLK_HZ, SCRATCH, CNT, WR_TS, WR_N, LOG_N,
    TRIG, CTRL, BAD and the write-clock log
  doc: designs/b191_ps_axi_lat/docs/ps_axi_lat.md
  note: the counter is 32 bits and wraps in 42.9 s at 100 MHz; software uses differences modulo 2^32
parameters:
- name: LOG_DEPTH
  value: 256
  legal: a power of two, at most 256
  note: entries of the write-clock log (window 0x400 to 0x7FC)
- name: CLK_HZ
  value: 100000000
  legal: the fabric clock in Hz
  note: only reported in the CLK_HZ register; the clock itself is set in the IP script
- name: BUILD_STAMP
  value: '0xB1910F01'
  legal: any 32-bit stamp (the flow sets it from the sources' hash)
  note: read from the BUILD register; the host program refuses to run if it differs from the one it is told to expect
