gaps:
- about: E4
  text: The PL image was not built, so there is no build record; the board row waits for it.
- about: resources
  text: Not measured; the image was not built, so there is no utilisation. The probe is a few hundred LUTs and one block
    of memory by construction, not by measurement.
- about: timing
  text: Not measured; no implementation was run. The probe is one clock domain of 10 ns with a counter, so closure is expected,
    not shown.
- about: power
  text: Not measured; nothing was built or run on a board.
- about: throughput
  text: Not applicable to a probe; the figures it measures are latencies, and the board has not run.
- about: build
  text: The PL image was not built. The recipe is written, and the properties it sets exist in the IP definition of Vivado
    2026.1, but the PS clock constraint, the address assignment and the flow's gates are unchecked.
- about: board_run
  text: Not run on a board. Whether /dev/mem accepts the mapping on the board's Ubuntu kernel, the PS base addresses and
    the timer frequency are unconfirmed (docs/ps_axi_lat.md lists them).
- about: values
  text: No latency value is measured; the pre-registration judges the validity of the measurement and records three hypotheses.
- about: clock
  text: Only a 100 MHz fabric clock is prepared; the processor-to-fabric crossing's cost depends on that clock.
next_steps:
- Build the image (about 15 minutes, small), fix whatever the flow's gates report, and record the build ID.
- Run board row B-R8 in the next board visit and use the figures to fix what a fast and slow loop split may ask of software.
- A 250 MHz row (a one-line change in the IP script) to see how much of the latency is the fabric clock.
open_questions:
- Does the board's Ubuntu kernel allow /dev/mem for the PS-PL windows, or does the generic-uio overlay have to be used?
