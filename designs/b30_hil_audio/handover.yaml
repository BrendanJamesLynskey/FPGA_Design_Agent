gaps:
- about: latency
  text: Not measured; no record times a window read or the tone path.
- about: throughput
  text: Not applicable; the design is an instrument carrier, and the logic analyser captures one 256-sample buffer at the
    48.008 kHz sample rate per arm.
- about: E3
  text: The board run used a bitstream built on the earlier Vivado release; the 2026.1 build (E2) was not programmed. It
    was one run, so there is no spread.
- about: audio calibration
  text: The audio level is relative to the capture interface's full scale at an uncalibrated gain, not a voltage at the
    jack; the THD includes the board's filter and the interface, which no run measured alone.
- about: paths not run
  text: No run used the M2K, Pluto, RTL-SDR, Red Pitaya, HDMI capture, I2S audio or an XADC analogue input; their host drivers
    are tested only on synthetic data or a fake server (results/b30/README.md).
- about: agent loop
  text: The hardware-in-the-loop stage (flow/hil.py) is not wired into the agent's repair loop or gates.
- about: behaviour
  text: Writes to read-only offsets are ignored and offsets with no register read 0. Offsets 0x20 to 0x2F all go to the
    logic analyser, beyond the nine registers its header lists. After reset the frame CRC expected value (0x54) is 0, so
    every frame counts as a mismatch until the host writes the model's CRC. CTRL bit 1 flips one pixel bit of every frame
    until cleared.
- about: instrument limits
  text: The frequency counter gates 0.5 s, so a tone change takes up to a gate to show; the logic analyser samples at the
    tone tick, not at 100 MHz.
next_steps:
- Re-run flow/hil.py on a Vivado 2026.1 bitstream, with the XADC and JTAG sysmon read at the start and end, and repeat it
  several times for a spread.
- Calibrate the audio path once (interface alone, then the board) so the level and THD can be quoted in volts and in the
  board's own contribution.
- Run the paths that were not connected (M2K, Pluto, RTL-SDR, Red Pitaya, HDMI capture) when the hardware is attached, as
  results/b30/README.md lists.
open_questions:
- Should the hardware-in-the-loop stage be wired into the agent's gates, and what should it do when the audio interface
  is absent (skip and report, as now)?
