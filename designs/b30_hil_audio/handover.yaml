# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b30_hil_audio
title: Hardware-in-the-loop demonstration design (audio tone and instruments)
kind: demonstration
produced_by: human
summary: One design on the Nexys A7 that carries four library instruments (a tone generator, a frequency and duty counter,
  a logic analyser and a frame CRC) and an XADC readout behind the test shell, so that every sensing path of the brief 30
  hardware-in-the-loop stage has something to read. The tone leaves the board as PWM audio, and `hil.yaml` lists eight checks
  that compare the board with Python golden models, including a measurement of the tone at the audio jack.
scope_not:
- a product design; its job is to give the hardware-in-the-loop checks a known answer on every path
- a test of the instruments' own correctness; the library blocks are tested in ip_lib and hil/tests
- the video, analogue-input, M2K, Pluto, RTL-SDR and Red Pitaya paths, which no run covered
target:
  part: xc7a100tcsg324-1
  board: Nexys A7-100T
  top: b30_hil_audio_top
  tool: Vivado 2026.1
  note: brief 30 built it from the library entries dds_awg, freq_duty_counter, logic_analyser and frame_crc plus the test
    shell
clocks:
- name: CLK100MHZ
  mhz: 100
  source: designs/b30_hil_audio/design.xdc
  note: the only clock; the 48.008 kHz sample tick, the PWM carrier and the frame timing are enables or counters derived
    from it
resets:
- name: CPU_RESETN
  active: low
  note: the board's reset button, synchronised by the test shell's reset synchroniser (assert asynchronous, release synchronous);
    reset turns the tone on, clears the pixel-fault switch and sets the DDS step back to its 1 kHz value
interfaces:
- name: UART register window
  type: test shell, 8N1 UART at 115200 baud
  doc: shell/PROTOCOL.md
  note: 32-bit registers at shell addresses 0x80 plus the offset in the header of rtl/b30_hil_audio_top.sv (CTRL 0x00, STEP
    0x01, WAVE 0x02, SAMPLE 0x03, frequency counter 0x10 to 0x13, logic analyser 0x20 to 0x28, XADC 0x40 to 0x43, frame
    CRC 0x50 to 0x55); read data is valid the clock after the read strobe; offsets with no register read 0
- name: Audio output
  type: AUD_PWM (PWM, 10-bit duty, offset binary) and AUD_SD (held high), LVCMOS33
  doc: boards/nexys_a7_100t/inventory.yaml
  note: the line is driven low for the low part of each PWM period and released for the high part, because the board's audio
    stage pulls it up; the board's low-pass filter and 3.5 mm jack follow
- name: LEDs
  type: LED[0] is the tone-on bit and LED[1] is a slow heartbeat, LVCMOS33
  note: indicators only; no check reads them
parameters:
- name: CLKS_PER_BIT
  value: 868
  legal: set by the shell's UART; the board value is 868
  note: UART bit period in clocks (115200 baud at 100 MHz); the simulation uses 8
- name: FD_GATE_CLKS
  value: 50000000
  legal: 1 or more; the board value is 50,000,000
  note: gate length of the frequency and duty counter in clocks (0.5 s at 100 MHz); the simulation shrinks it to 40,000
- name: STEP (reset value)
  value: 89463225
  legal: a 32-bit DDS phase step, writable at offset 0x01
  note: gives a 1 kHz tone at the 48.008 kHz sample rate
