gaps:
- about: latency
  text: Not measured. A transfer is 72 SCK periods at 1 MHz by construction, plus the one-time preamble after reset; no
    record times it.
- about: throughput
  text: Not applicable; the block reads one 8-byte ID per host request.
- about: E3
  text: The board runs used bitstreams built on the earlier Vivado release; the 2026.1 build (E2) was not programmed. Re-run
    the board check on a 2026.1 bitstream to close this.
- about: operating conditions
  text: The board runs predate the house rule of 2026-11-11 that every board run records its operating conditions from the
    XADC; die temperature and the VCCINT, VCCAUX and VCCBRAM rails were not read from the XADC, so the runs cannot be shown
    to be inside the recommended operating conditions.
- about: part identity
  text: The pass rule accepts both flash parts the board may carry. The record shows the bytes read but not which of the
    two parts is fitted, because the model-number bytes are recorded, not judged.
- about: behaviour
  text: GO written while a transfer runs is ignored (qspi_rdid.sv takes GO only when idle), but no test covers it. The ID
    registers keep the previous transfer's bytes until a new transfer ends, and are cleared only by reset. CTRL reads 0.
    Only bit 0 of CTRL means anything. The first transfer after reset takes longer because of the preamble, and a reset
    repeats it. Reads of undefined addresses return 0 with no error.
- about: flash safety
  text: Nothing was run that tries to make the flash accept a write; the claim that it cannot rests on the source checks
    and the flash model in E1, not on a board test, and WP# is held low as a second guard.
next_steps:
- Re-run the board check on a Vivado 2026.1 bitstream with the XADC read at the start and end of each run.
- Add a test for GO written while busy and state in the register map header that it is ignored.
- Judge the model-number bytes once the part fitted to the board is known, to tell the two parts apart.
open_questions:
- Should the self-check read the JEDEC ID again at a faster SCK, to find the fastest clock the board's layout supports?
