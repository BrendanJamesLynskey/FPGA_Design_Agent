# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: b2_qspi_jedec
title: Configuration flash JEDEC ID board self-check
kind: board-selfcheck
produced_by: human
summary: Reads the JEDEC ID of the Nexys A7's configuration flash (S25FL128S or S25FL127S) with the RDID command (9Fh) over
  single-bit SPI at 1 MHz, with SCK leaving through STARTUPE2. The 8-byte ID is read twice and compared with the data sheets'
  values. The opcode is a constant in the RTL, so the design cannot send a write, erase or register-write command. `selfcheck.py`
  holds the on-board pass rule, written before any board run.
scope_not:
- 'a flash memory test: it reads only the ID, so it says nothing about the flash contents, erase, program or quad-mode operation'
- an agent benchmark task; it was written by hand to prove the board inventory on hardware
target:
  part: xc7a100tcsg324-1
  board: Nexys A7-100T
  top: b2_qspi_jedec_top
  tool: Vivado 2026.1
clocks:
- name: CLK100MHZ
  mhz: 100
  source: designs/b2_qspi_jedec/design.xdc
  note: the only clock; SCK is divided from it (HALF clocks low, HALF high) and reaches the flash through STARTUPE2's USRCCLKO,
    and QSPI_DQ1 is synchronised into it
resets:
- name: CPU_RESETN
  active: low
  note: the board's reset button, synchronised by the test shell's reset synchroniser (assert asynchronous, release synchronous)
interfaces:
- name: UART register window
  type: test shell, 8N1 UART at 115200 baud
  doc: shell/PROTOCOL.md
  note: five registers at shell addresses 0x80 to 0x84 (CTRL, STATUS, ID0, ID1, INFO); the map is in the header of rtl/qspi_regs.sv;
    other window addresses read 0, and a write to any address but CTRL, or to CTRL without bit 0, starts nothing
- name: Configuration flash (single-bit SPI)
  type: QSPI_CSN, QSPI_DQ0 (to the flash) out, QSPI_DQ1 (from the flash) in, SCK through STARTUPE2, LVCMOS33
  doc: boards/nexys_a7_100t/inventory.yaml
  note: one transfer is chip select low, opcode 9Fh, eight ID bytes read, chip select high; QSPI_DQ2 (WP#) is held low and
    QSPI_DQ3 (HOLD#) high; the first transfer after reset is preceded by PREAMBLE clock pulses with chip select high because
    STARTUPE2 swallows the first edges after configuration
parameters:
- name: HALF
  value: 50
  legal: 1 to 65535 (16-bit divider); the board value is 50
  note: SCK half period in 100 MHz clocks; 50 gives 1 MHz
- name: PREAMBLE
  value: 8
  legal: 0 to 255 clock pulses; the board value is 8
  note: clock pulses sent with chip select high before the first transfer after reset
- name: CLKS_PER_BIT
  value: 868
  legal: set by the shell's UART; the board value is 868
  note: UART bit period in clocks (115200 baud at 100 MHz)
