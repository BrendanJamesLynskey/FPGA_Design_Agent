schema: fpga-design-agent/architecture/v1
blocks:
- {name: jtag_bus, function: JTAG register bus, supplied unmodified}
- {name: p6_clkmux_core, function: registers, SEL/STATUS, switch count, gate FSM, LEDs}
- {name: clk_mux_gen, function: IBUFDS_GTE4, BUFG_GT divider and BUFGCTRL glitch-free mux}
- {name: mux_domain, function: 64-bit counter, Gray twin, checker, error counter, edge counter}
interfaces:
- {name: reg_bus, between: [jtag_bus, p6_clkmux_core], protocol: simple, prefix: h, module: p6_clkmux_core}
clock_domains:
- {name: clk_c3, clock: clk_c3, freq_mhz: 25}
- {name: gt_refclk, clock: gt_refclk_p, freq_mhz: 156.25}
- {name: clk_mux, clock: clk_mux, freq_mhz: 78.125}
reset:
  synchronisers: [xpm_cdc_async_rst]
crossings:
- {from: clk_mux, to: clk_c3, signal: active_sel, primitive: xpm_cdc_single, inline_in: p6_clkmux_core}
- {from: clk_c3, to: clk_mux, signal: gate_en, primitive: xpm_cdc_single, inline_in: p6_clkmux_core}
- {from: clk_mux, to: clk_c3, signal: freq_count, primitive: xpm_cdc_handshake, inline_in: p6_clkmux_core}
- {from: clk_mux, to: clk_c3, signal: mux_errs, primitive: xpm_cdc_handshake, inline_in: p6_clkmux_core}
- {from: clk_c3, to: clk_mux, signal: snapshot, primitive: xpm_cdc_handshake, inline_in: p6_clkmux_core}
- {from: clk_c3, to: clk_mux, signal: rst, primitive: xpm_cdc_async_rst, inline_in: p6_clkmux_core}
predicted_resources:
  lut: [450, 1000]
  ff: [900, 1500]
  bram_tile: 0
  dsp: 0
