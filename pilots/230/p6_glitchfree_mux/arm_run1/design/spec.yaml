name: p6_clkmux
title: P6 glitch-free clock multiplexer with self-checking muxed domain
board: kr260
part: xck26-sfvc784-2LV-c
top: p6_clkmux_top
clocks:
- name: clk_c3
  freq_mhz: 25
  role: C3 25 MHz board clock; clock A; register bus and measurement gate clock
- name: gt_refclk
  freq_mhz: 156.25
  role: SFP+ MGTREFCLK0 via IBUFDS_GTE4 and BUFG_GT divider; clock B source
- name: clk_b
  freq_mhz: 78.125
  role: gt_refclk divided by B_DIV (default 2)
- name: clk_mux
  freq_mhz: 0
  role: BUFGCTRL output, equals clk_a or clk_b; drives the muxed domain
reset:
  name: rst
  polarity: active_high
  sync: synchronous to clk_c3; held a few clocks at start by jtag_bus
  note: muxed domain reset is synchronised into clk_mux; SEL resets to 0
parameters:
  DESIGN_ID: 546701313
  B_DIV: 2
  GATE_LEN_DEFAULT_CYCLES: 25000000
  SYNC_STAGES: 2
ports:
- name: clk_c3
  direction: input
  width: 1
  board_pin_role: C3 25 MHz clock
- name: gt_refclk_p
  direction: input
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 P
- name: gt_refclk_n
  direction: input
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 N
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ TX_DISABLE, held at 1
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
behaviour:
  host_interface:
  - jtag_bus.sv is used unchanged; its register port (h_we, h_re, h_addr[11:0], h_wdata,
    h_rdata) runs in clk_c3
  - A write takes effect the clock after h_we
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it
  - Unmapped addresses read 0 and ignore writes
  common_registers:
  - ID at 0x000 reads 0x20960001
  - BUILD at 0x004 reads USR_ACCESSE2 word
  - SCRATCH at 0x008 reads back the last write, reset 0
  clock_mux:
  - BUFGCTRL-style glitch-free mux selects clk_a (SEL=0) or clk_b (SEL=1)
  - STATUS.ACTIVE_SEL shows the clock actually driving the muxed domain, synchronised
    to clk_c3
  - STATUS.SWITCHING is 1 from the SEL change until ACTIVE_SEL equals SEL
  - SWITCH_COUNT increments once per completed change of ACTIVE_SEL; a write of the
    current SEL does not count
  - B_DIV reads the divide applied to the GT reference clock
  - sfp_tx_disable is constant 1; no GT transceiver channel is used
  muxed_domain:
  - A free-running 64-bit binary counter increments every clk_mux edge
  - An independently coded Gray counter twin runs in parallel
  - Every clock the twin is compared with the counter and the counter is checked to
    be previous + 1
  - Any mismatch increments MUX_ERRS (saturating at 0xFFFFFFFF)
  - SNAPSHOT write latches the low 32 bits of the counter into MUX_COUNT, crossing
    domains safely
  freq_measure:
  - FREQ_CTRL.START begins a gate of GATE_LEN clk_c3 cycles; START self-clears
  - FREQ_STATUS.BUSY is 1 during the gate; DONE is set at the end and cleared by the
    next START
  - FREQ_COUNT holds the clk_mux rising edges counted in the last gate
  leds:
  - led[0] shows ACTIVE_SEL; led[1] shows SWITCHING
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546701313
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESS word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] scratch'
  - offset: 16
    name: SEL
    access: RW
    reset: 0
    bits: '[0] 0=clock A, 1=clock B'
  - offset: 20
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] SWITCHING, [1] ACTIVE_SEL'
  - offset: 24
    name: B_DIV
    access: RO
    reset: 2
    bits: '[3:0] divide of GT clock, 1 to 8'
  - offset: 28
    name: GATE_LEN
    access: RW
    reset: 25000000
    bits: '[31:0] gate length in clk_c3 cycles'
  - offset: 32
    name: FREQ_CTRL
    access: RW
    reset: 0
    bits: '[0] START self-clearing'
  - offset: 36
    name: FREQ_STATUS
    access: RO
    reset: 0
    bits: '[0] BUSY, [1] DONE'
  - offset: 40
    name: FREQ_COUNT
    access: RO
    reset: 0
    bits: '[31:0] edges in last gate'
  - offset: 44
    name: MUX_ERRS
    access: RO
    reset: 0
    bits: '[31:0] error count'
  - offset: 48
    name: MUX_COUNT
    access: RO
    reset: 0
    bits: '[31:0] counter low bits at last SNAPSHOT'
  - offset: 52
    name: SWITCH_COUNT
    access: RO
    reset: 0
    bits: '[31:0] switches carried out'
  - offset: 56
    name: SNAPSHOT
    access: WO
    reset: 0
    bits: any write latches MUX_COUNT
timing:
  gate_cycles_clock: clk_c3
  gate_note: GATE_LEN_DEFAULT_CYCLES 25000000 cycles of 25 MHz = 1 s
  latency:
    read: h_rdata valid within 2 clk_c3 cycles of h_re
    write: register updated 1 clk_c3 cycle after h_we
    switch: ACTIVE_SEL follows SEL after a few cycles of each clock (BUFGCTRL handshake)
resources_expected:
  luts: 400
  ffs: 600
  bufgctrl: 1
  bufg_gt: 1
  gt_channels: 0
  brams: 0
  dsps: 0
