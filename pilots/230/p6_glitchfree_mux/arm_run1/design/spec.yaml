assumptions:
- text: Part is xck26-sfvc784-2LV-c
  reason: KR260 carries the K26 SOM
- text: Clocks A, B and the C3 clock are asynchronous to each other
  reason: separate oscillators; every crossing is synchronised
- text: Frequency count is accurate to plus or minus 2 edges
  reason: gate and muxed clock are asynchronous
- text: No simulation of jtag_bus.sv; tests drive the register port
  reason: contains Xilinx primitives, per request
- text: Pin locations come from the KR260 constraints knowledge, not guessed here
  reason: spec.md gives no pin names
open_questions: []
resolved_questions:
- question: Which divide should be applied to the GT reference clock for clock B?
  answer: 2 (78.125 MHz), fixed at build time
  status: defaulted
  by: default
  default_reason: request says 1 to 8 as suits the device; 2 leaves timing margin
    in the muxed domain
  risk: high
- question: What happens when SEL is written while SWITCHING is 1?
  answer: The new value is taken and the mux follows the latest SEL once the current
    handshake ends
  status: defaulted
  by: default
  default_reason: request does not say; the test waits so it is untested
  risk: high
- question: What happens when START is written while BUSY, or GATE_LEN is 0 or changed
    during a gate?
  answer: START while BUSY is ignored; GATE_LEN is sampled at START; GATE_LEN 0 is
    treated as 1
  status: defaulted
  by: default
  default_reason: request leaves it open
  risk: high
- question: Should SWITCH_COUNT count a write of the SEL value already selected?
  answer: No, only real changes of ACTIVE_SEL count
  status: defaulted
  by: default
  default_reason: the check says 'number of real changes'
  risk: high
- question: What do the LEDs show?
  answer: led[0] = ACTIVE_SEL, led[1] = SWITCHING
  status: defaulted
  by: default
  default_reason: request names the LEDs but gives no function
  risk: medium
- question: What is the exact register map?
  answer: As listed in registers.map, taken from spec.md (all offsets given)
  status: defaulted
  by: default
  default_reason: offsets are given in spec.md; confirming the map including reads
    of write-only SNAPSHOT as 0
  risk: high
- question: Width of the muxed counter and error counter saturation?
  answer: 64-bit counter, 32-bit saturating error count
  status: defaulted
  by: default
  default_reason: request only says low 32 bits are read
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
