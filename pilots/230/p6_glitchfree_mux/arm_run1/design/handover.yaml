- about: led_order
  text: spec.yaml says led[0] = ACTIVE_SEL and led[1] = SWITCHING; rtl/p6_clkmux_core.sv drives led = {sel, sel != act_c3},
    so led[0] is SWITCHING and led[1] is the requested SEL, not ACTIVE_SEL. The RTL is what was built. design.xdc maps led[0]
    to F8 and led[1] to E8.
- about: status_and_read_path
  text: STATUS bit 0 is SWITCHING, computed as sel != act_c3, and bit 1 is ACTIVE_SEL, as in the register map. A read loads
    h_rdata from the addressed register on the clk_c3 edge that sees h_re, so the data is valid the clock after h_re, inside
    the spec's 2 clocks (rtl/p6_clkmux_core.sv; jtag_bus.sv was not simulated). A write to a mapped address is visible the
    clock after h_we.
- about: unmapped_and_wo_reads
  text: Reads of any address not listed in the read case, including SNAPSHOT (0x038), FREQ_CTRL (0x020) and every unmapped
    address, return 0 (default branch in rtl/p6_clkmux_core.sv). Writes to RO or unmapped addresses are ignored because
    only the SCRATCH, SEL, GATE_LEN, FREQ_CTRL and SNAPSHOT strobes exist. FREQ_CTRL START is not stored, so it reads back
    0.
- about: snapshot_semantics
  text: A SNAPSHOT write copies rep_data_c[31:0], the last counter value delivered by the free-running report handshake
    in the muxed domain, into MUX_COUNT. It is not a counter sample taken at the write itself, so MUX_COUNT can be older
    than the write. MUX_ERRS is refreshed by the same report channel.
- about: sel_while_switching
  text: A SEL write is taken immediately, even while SWITCHING is 1, and goes straight to the BUFGCTRL select pins with
    no synchroniser. The mux follows the latest value. This case is untested, per the assumption recorded for it.
- about: switch_count_source
  text: SWITCH_COUNT increments on each change of the synchronised ACTIVE_SEL seen in clk_c3, so a SEL write equal to the
    current selection does not count. A switch back and forth faster than the synchroniser can pass may merge into one or
    no count.
- about: freq_gate_behaviour
  text: START is ignored while BUSY or while the edge count is still awaited. GATE_LEN is sampled at START and 0 is treated
    as 1. FREQ_COUNT is cleared at START. BUSY drops after the remaining counter reaches 0, which is longer than GATE_LEN
    clk_c3 cycles by the counter's final step, and DONE is set only when the edge count returns through the handshake, so
    DONE comes later than BUSY falling. The spec's plus-or-minus 2 count accuracy is untested against these exact lengths.
- about: reset_style
  text: spec.yaml says the muxed domain reset is synchronised; the RTL uses xpm_cdc_async_rst (asserted asynchronously,
    released synchronously) feeding a synchronous reset in mux_domain.sv. The register reset in the core is synchronous
    in clk_c3. rtl/p6_clkmux_top.sv generates the reset itself; jtag_bus does not hold it, so the spec's wording about jtag_bus
    is not what was built.
- about: sat_error_counter
  text: MUX_ERRS saturates at 0xFFFFFFFF. The checker is pipelined over three register stages, so an error is counted a
    few clk_mux cycles after it happens.
- about: assumption_clock_groups
  text: design.xdc declares sys_clk_pin and gt_refclk asynchronous. The BUFGCTRL output clk_mux is not declared as a separate
    clock, so its paths are derived by the tool from the two source clocks. This was not checked in a build.
- about: timing_risk
  text: The synthesis timing report in the last visit failed on the Gray twin in mux_domain.sv (gry_reg[58] to gry_reg[61],
    slack -4.051 ns against a 1.6 ns requirement). The tool treats it as a path in sys_clk_pin, which suggests the clk_mux
    domain is analysed at a tighter period than the 25 MHz clock. Verify this in a new build.
