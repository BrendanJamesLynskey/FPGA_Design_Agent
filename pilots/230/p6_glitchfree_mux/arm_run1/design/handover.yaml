schema: fda-handover/1
id: p6_glitchfree_mux
title: P6 glitch-free clock multiplexer with self-checking muxed domain (KR260)
kind: agent-run
produced_by: agent
summary: The design selects between the 25 MHz board clock (clock A) and the SFP+ reference clock divided by B_DIV (clock
  B) with a BUFGCTRL. In the muxed domain it runs a 64-bit counter, an independent Gray-code twin and a checker, and it
  has a gated edge counter for frequency measurement. A JTAG register bus (jtag_bus.sv, unmodified) gives host access. The
  run stopped in rtl-design-creation after repeated failures of the design standards and report gates. No synthesis, implementation
  or hardware result exists, and verification reached V2 of V3.
scope_not:
- Not a GT transceiver design. No GT channel is used and sfp_tx_disable is tied to 1.
- Not a design with a reset input. Every reset is a reconfiguration of the FPGA, plus a short power-up reset generated in
  the top.
- Not timed, placed or measured on a board. No build of this design passed its gates.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p6_clkmux_top
clocks:
- name: clk_c3
  mhz: 25.0
  source: runs/20261126-175655-b2dc/p6_glitchfree_mux/design.xdc
- name: gt_refclk_p
  mhz: 156.25
  source: runs/20261126-175655-b2dc/p6_glitchfree_mux/design.xdc
resets:
- name: rst (internal)
  active: high
  note: There is no reset input port. rst_sr in rtl/p6_clkmux_top.sv starts at 4'hF and shifts out in 4 clk_c3 cycles; it
    is synchronous in clk_c3 and reaches the muxed domain through xpm_cdc_async_rst. Reset values are in the register map.
interfaces:
- name: clk_c3
  type: input clock, 25 MHz, pin C3 LVCMOS18
  note: Register bus, gate and status clock; also clock A of the mux.
- name: gt_refclk_p / gt_refclk_n
  type: differential input clock, 156.25 MHz, SFP+ MGTREFCLK0
  note: design.xdc gives no PACKAGE_PIN for these; the GT reference clock site places them. They feed IBUFDS_GTE4 and BUFG_GT.
- name: sfp_tx_disable
  type: output, pin Y10 LVCMOS33
  note: Constant 1.
- name: led
  type: output, 2 bits, pins F8 (led[0]) and E8 (led[1]) LVCMOS18
  note: RTL drives led = {sel, sel != act_c3}, so led[0] is the SWITCHING condition and led[1] is SEL. The spec says led[0]
    = ACTIVE_SEL and led[1] = SWITCHING.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546701313
  bits: '[31:0] design ID'
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: '[31:0] USR_ACCESS word'
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: '[31:0] scratch'
- offset: 16
  name: SEL
  access: RW
  reset: 0
  bits: '[0] 0=clock A, 1=clock B'
- offset: 20
  name: STATUS
  access: RO
  reset: 0
  bits: '[0] SWITCHING, [1] ACTIVE_SEL'
- offset: 24
  name: B_DIV
  access: RO
  reset: 2
  bits: '[3:0] divide of GT clock, 1 to 8'
- offset: 28
  name: GATE_LEN
  access: RW
  reset: 25000000
  bits: '[31:0] gate length in clk_c3 cycles'
- offset: 32
  name: FREQ_CTRL
  access: RW
  reset: 0
  bits: '[0] START self-clearing'
- offset: 36
  name: FREQ_STATUS
  access: RO
  reset: 0
  bits: '[0] BUSY, [1] DONE'
- offset: 40
  name: FREQ_COUNT
  access: RO
  reset: 0
  bits: '[31:0] edges in last gate'
- offset: 44
  name: MUX_ERRS
  access: RO
  reset: 0
  bits: '[31:0] error count'
- offset: 48
  name: MUX_COUNT
  access: RO
  reset: 0
  bits: '[31:0] counter low bits at last SNAPSHOT'
- offset: 52
  name: SWITCH_COUNT
  access: RO
  reset: 0
  bits: '[31:0] switches carried out'
- offset: 56
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: any write latches MUX_COUNT
parameters:
- name: DESIGN_ID
  value: 546701313
  legal: any 32-bit value; the spec fixes 546701313 (0x20960001)
  note: Value returned by the ID register.
- name: B_DIV
  value: 2
  legal: 1 to 8
  note: Divide of the GT reference clock, so clock B is 78.125 MHz at the default; the top drives BUFG_GT DIV with B_DIV-1.
    Fixed at build time and not simulated at other values.
- name: GATE_LEN_DEFAULT_CYCLES
  value: 25000000
  legal: 1 to 4294967295 clk_c3 cycles
  note: 'Reset value of GATE_LEN; 25000000 cycles of 25 MHz is 1 s. The benches ran it at 150, so the spec''s value was
    not simulated. Spec timing: clk_c3'
- name: SYNC_STAGES
  value: 2
  legal: 2 or more
  note: Synchroniser depth of the XPM CDC cells in the core; the SEL crossing uses SYNC_STAGES + 1.
