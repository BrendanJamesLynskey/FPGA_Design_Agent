resolved_questions:
- question: Which clock does the register port run on, and how are RUN, SLOW_READ
    and INJECT crossed to the reader?
  answer: clk_wr; control bits cross by 2-flop synchronisers, INJECT by a toggle handshake
  status: defaulted
  by: default
  default_reason: The request does not say; the slow clock is simplest for jtag_bus.
  risk: high
- question: What does CLEAR do when written while RUN is 1?
  answer: Ignored, the bit still self-clears
  status: defaulted
  by: default
  default_reason: The request says CLEAR acts only while RUN is 0.
  risk: medium
- question: Does stopping RUN (RUN 1 to 0) drain the FIFO?
  answer: The writer stops; the reader keeps draining until empty and checking, so
    counts settle
  status: defaulted
  by: default
  default_reason: Not stated; a drain keeps the written and read counts equal after
    a stop.
  risk: medium
- question: Is OCC_MAX measured in the writer domain from the synchronised read pointer?
  answer: Yes, written count minus synchronised read pointer, so it can be pessimistic
    by a few words
  status: defaulted
  by: default
  default_reason: Exact fill is not observable across unrelated clocks.
  risk: medium
- question: Which word does INJECT corrupt and which bit is flipped?
  answer: The next word checked after INJECT arrives, bit 0
  status: defaulted
  by: default
  default_reason: The request says one bit of one word.
  risk: medium
- question: Is the register map as listed in the request including the SNAPSHOT behaviour
    at 0x030 read?
  answer: Map as in the request; read of 0x030 returns 0
  status: defaulted
  by: default
  default_reason: WO register read value is unstated.
  risk: high
- question: What do the LEDs show?
  answer: led[0] = RUN, led[1] = sticky error
  status: defaulted
  by: default
  default_reason: Not specified.
  risk: medium
- question: What are the pin locations and IO standards for C3, MGTREFCLK0 and LEDs?
  answer: Take from the KR260 board file
  status: defaulted
  by: default
  default_reason: Not in the request.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
