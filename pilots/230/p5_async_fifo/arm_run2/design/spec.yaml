name: p5_async_fifo_soak
title: 'P5: asynchronous FIFO soak (25 MHz writer, 156.25 MHz reader)'
board: kr260
part: xck26-sfvc784-2LV-c
top: p5_async_fifo_soak
clocks:
- name: clk_wr
  role: C3 25 MHz board clock
  freq_mhz: 25
  note: writer domain; also the clk given to jtag_bus and the register port
- name: clk_rd
  role: SFP+ MGTREFCLK0 156.25 MHz via IBUFDS_GTE4 (no GT channel)
  freq_mhz: 156.25
  note: reader domain; asynchronous to clk_wr
reset:
  model: reprogram
  note: every reset is a reconfiguration; registers start from initial values; no
    reset input. jtag_bus rst is driven internally for a few clocks at start.
parameters:
  FIFO_DEPTH: 512
  DATA_WIDTH: 32
  ADDR_WIDTH: 9
  PRBS_SEED: 2147483647
  DESIGN_ID: 546635777
  SLOW_READ_DIV_CYCLES: 8
  SYNC_STAGES: 2
ports:
- name: clk_25
  direction: input
  width: 1
  board_pin_role: C3 25 MHz clock pin
- name: mgtrefclk0_p
  direction: input
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 P
- name: mgtrefclk0_n
  direction: input
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 N
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ TX_DISABLE, constant 1
behaviour:
  identity:
  - Register 0x000 reads 0x20950001.
  - Register 0x004 reads the USR_ACCESSE2 word.
  - Register 0x008 reads back the last value written, reset 0.
  - Unmapped addresses read 0 and ignore writes.
  writer:
  - While RUN is 1 and the FIFO is not full the writer pushes one 32-bit PRBS-31 word
    on every clk_wr.
  - PRBS-31 uses x^31 + x^28 + 1, 32 new bits per word, seed 0x7FFFFFFF.
  - While RUN is 1 and the FIFO is full the writer is held off and STALL_W increments.
  - A write while full (overflow) increments OVERFLOWS and must never happen.
  reader:
  - The reader pops a word on clk_rd whenever the FIFO is not empty and RUN is 1.
  - With SLOW_READ set the reader pops at most one word every 8 clk_rd.
  - Each popped word is compared with the reader's own PRBS-31 copy started from the
    same seed.
  - A mismatch increments DATA_ERRS and WORDS_R counts every checked word.
  - A read while empty (underflow) increments UNDERFLOWS and must never happen.
  inject:
  - Writing CTRL.INJECT=1 flips one bit of exactly one received word before the check,
    then INJECT clears.
  control:
  - CTRL.CLEAR written with RUN 0 restarts all counters and both PRBS sequences from
    the seed, then self-clears.
  - CTRL.CLEAR written while RUN is 1 is ignored.
  - OCC_MAX holds the highest FIFO fill seen in words.
  - All counters are 32 bits and wrap.
  snapshot:
  - Any write to 0x030 latches all counters into 0x014 to 0x02C at one instant.
  - Reads of 0x014 to 0x02C return the latched values until the next snapshot.
  safety:
  - sfp_tx_disable is driven to 1 at all times.
  - No GT transceiver channel is used, only the GT reference clock buffer.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546635777
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 RUN; 1 SLOW_READ; 2 CLEAR self-clearing; 3 INJECT self-clearing
  - offset: 20
    name: WORDS_W
    access: RO
    reset: 0
    bits: 31:0 words written (snapshot)
  - offset: 24
    name: WORDS_R
    access: RO
    reset: 0
    bits: 31:0 words read and checked (snapshot)
  - offset: 28
    name: DATA_ERRS
    access: RO
    reset: 0
    bits: 31:0 mismatched words (snapshot)
  - offset: 32
    name: OVERFLOWS
    access: RO
    reset: 0
    bits: 31:0 (snapshot)
  - offset: 36
    name: UNDERFLOWS
    access: RO
    reset: 0
    bits: 31:0 (snapshot)
  - offset: 40
    name: STALL_W
    access: RO
    reset: 0
    bits: 31:0 writer clocks held off (snapshot)
  - offset: 44
    name: OCC_MAX
    access: RO
    reset: 0
    bits: 31:0 highest fill in words (snapshot)
  - offset: 48
    name: SNAPSHOT
    access: WO
    reset: 0
    bits: any write latches 0x014 to 0x02C
timing:
  register_port: A write takes effect the clock after h_we; h_rdata valid within 2
    clk after h_re and held.
  clock_domains: clk_wr and clk_rd are asynchronous; CDC paths are constrained and
    reported.
  latency:
    read_data: h_rdata valid at most 2 clk_wr after h_re
    write_effect: 1 clk_wr after h_we
    slow_read: one pop per 8 clk_rd
  expected_rates: WORDS_W grows 25e6 per second at no stall; WORDS_R matches within
    FIFO depth
resources_expected:
  bram36: 1
  luts: under 1500
  ffs: under 2000
  dsp: 0
  gt_channels: 0
assumptions:
- assumption: The register port and control logic run on the 25 MHz clock.
  reason: The request says clk is a free-running clock we choose; the writer clock
    is the slow one with most registers.
- assumption: Gray-coded pointers with 2-flop synchronisers implement the FIFO.
  reason: Standard safe CDC for unrelated clocks.
- assumption: Counters on the reader side are transferred to the register domain only
    through the snapshot handshake.
  reason: The values read together must be coherent.
- assumption: jtag_bus.sv is used unchanged and is not simulated.
  reason: The request says so; it holds Xilinx primitives.
- assumption: LEDs show RUN and a sticky error flag (any data error, overflow or underflow).
  reason: The request leaves LED use open and this is useful.
open_questions: []
