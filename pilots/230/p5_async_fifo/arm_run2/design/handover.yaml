  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 scratch
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 RUN; 1 SLOW_READ; 2 CLEAR self-clearing; 3 INJECT self-clearing
- offset: 20
  name: WORDS_W
  access: RO
  reset: 0
  bits: 31:0 words written (snapshot)
- offset: 24
  name: WORDS_R
  access: RO
  reset: 0
  bits: 31:0 words read and checked (snapshot)
- offset: 28
  name: DATA_ERRS
  access: RO
  reset: 0
  bits: 31:0 mismatched words (snapshot)
- offset: 32
  name: OVERFLOWS
  access: RO
  reset: 0
  bits: 31:0 (snapshot)
- offset: 36
  name: UNDERFLOWS
  access: RO
  reset: 0
  bits: 31:0 (snapshot)
- offset: 40
  name: STALL_W
  access: RO
  reset: 0
  bits: 31:0 writer clocks held off (snapshot)
- offset: 44
  name: OCC_MAX
  access: RO
  reset: 0
  bits: 31:0 highest fill in words (snapshot)
- offset: 48
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: any write latches 0x014 to 0x02C
parameters:
- name: FIFO_DEPTH
  value: 512
  legal: Must equal 2^ADDR_WIDTH; the pointers are ADDR_WIDTH+1 bits wide.
  note: Spec value, and the value built. The depth drives the full test and the single BRAM expected by the spec.
- name: DATA_WIDTH
  value: 32
  legal: Only 32 works; the PRBS step produces a fixed 32-bit word.
  note: Width of the FIFO memory word and of the compared data.
- name: ADDR_WIDTH
  value: 9
  legal: log2(FIFO_DEPTH).
  note: Memory address width.
- name: PRBS_SEED
  value: 2147483647
  legal: Any nonzero 31-bit value (only bits 30:0 are used). Zero would lock the LFSR.
  note: Spec seed 0x7FFFFFFF, shared by writer and reader and reloaded on CLEAR.
- name: DESIGN_ID
  value: 546635777
  legal: Any 32-bit value.
  note: Read back at 0x000 (0x20950001).
- name: SLOW_READ_DIV_CYCLES
  value: 8
  legal: 1 to 16, because it is loaded as value minus 1 into a 4-bit counter.
  note: With SLOW_READ set the reader pops at most one word per 8 clk_rd (156.25 MHz), as in the spec's timing section.
- name: SYNC_STAGES
  value: 2
  legal: 2 or more.
  note: Flip-flop depth of every XPM CDC synchroniser.
