schema: fda-handover/1
id: p5_async_fifo
title: Asynchronous FIFO soak, 25 MHz writer to 156.25 MHz reader
kind: agent-run
produced_by: agent
summary: 'The design writes a PRBS-31 word stream into a 512-word, 32-bit FIFO on the 25 MHz board clock. A reader on the
  156.25 MHz SFP+ reference clock pops the words, compares each with its own PRBS-31 copy and counts words, mismatches and
  fill. A host reads and controls it through a JTAG register bus (jtag_bus, BSCANE2 USER4). The run reached synthesis, implementation,
  timing, power and DRC closure and produced a bitstream (build evidence E3 passes). Verification reached V2 of V3: the
  V3 coverage, mutation and CDC checks did not pass or were not measured. Configuration and debug was not run, and nothing
  was tried on the board. The specification and architecture were approved automatically, with no human review.

  '
scope_not:
- Not a transceiver design. No GT channel is used, only the GT reference clock buffer, and sfp_tx_disable is held at 1.
- Not hardware-proven. There is no bring-up or board result, so the 10-minute soak and the 25 million words per second rate
  are not demonstrated.
- Not a design with a reset input. Every reset is a reconfiguration of the FPGA (reset model reprogram).
- Not a general FIFO IP. The data source is the internal PRBS-31 writer and the sink is the internal checker.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p5_async_fifo_soak
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261126-210155-ee69/p5_async_fifo/design.xdc
resets:
- name: rst_sr[3] (internal, drives jtag_bus rst)
  active: high
  note: A 4-bit shift register initialised to all ones in rtl/p5_async_fifo_soak.sv holds jtag_bus in reset for a few clk_25
    cycles after configuration. There is no external reset input, and all other registers start from their initial values.
interfaces:
- name: clk_25
  type: input, 25 MHz clock, pin C3, LVCMOS18
  note: This is the spec's clk_wr. It drives the register port, writer and control. design.xdc creates the clock with a
    40.00 ns period.
- name: mgtrefclk0_p, mgtrefclk0_n
  type: differential input, SFP+ MGTREFCLK0, 156.25 MHz
  note: Goes through IBUFDS_GTE4 ODIV2 and BUFG_GT to become clk_rd (the spec's reader clock). design.xdc has no pin and
    no create_clock for these ports (see gaps).
- name: led
  type: output, 2 bits, led[0] F8 and led[1] E8, LVCMOS18
  note: led[0] is RUN. led[1] is a sticky error from the checker (data error or underflow) or a nonzero OVERFLOWS count,
    and CLEAR resets it.
- name: sfp_tx_disable
  type: output, 1 bit, pin Y10, LVCMOS33
  note: Constant 1.
