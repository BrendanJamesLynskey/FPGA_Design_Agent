open_questions:
- Should the design count overflows and underflows as the spec says, or is it acceptable that they are structurally 0 because
  the writer is gated by full and the reader by empty?
- Is the 156.25 MHz clk_rd meant to be constrained in design.xdc? The file contains a comment about mgtrefclk0 but no clock
  or pin for it.
- Is it acceptable that SNAPSHOT latches the writer-side and reader-side counters at different instants, or must it be a
  single instant as the spec states?
