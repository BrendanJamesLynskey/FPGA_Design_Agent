assumptions:
- question: Which clock does the register port run on, and how are RUN, SLOW_READ and INJECT crossed to the reader?
  risk: high
  used: clk_wr; control bits cross by 2-flop synchronisers, INJECT by a toggle handshake
  how: 'defaulted: nobody answered'
  reason: The request does not say; the slow clock is simplest for jtag_bus.
- question: Is the register map as listed in the request including the SNAPSHOT behaviour at 0x030 read?
  risk: high
  used: Map as in the request; read of 0x030 returns 0
  how: 'defaulted: nobody answered'
  reason: WO register read value is unstated.
- question: What are the pin locations and IO standards for C3, MGTREFCLK0 and LEDs?
  risk: high
  used: Take from the KR260 board file
  how: 'defaulted: nobody answered'
  reason: Not in the request.
- question: This design has no reset input. Is every reset a reconfiguration of the FPGA (the device is reprogrammed, so
    every register starts from its initial value), or does something restart the running design (then it needs a reset input)?
  risk: high
  used: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram): registers get initial values, control state
    included, and the design has no reset input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  how: 'defaulted: nobody answered'
  reason: 'With no reset input, a register can start only from its initial value, which the FPGA loads at configuration
    (owner, 2026-11-26: particularly useful for designs whose every reset reprograms the device). A design that must restart
    while running needs a reset input and resets its control state; the two models are checked by different rules (STD-INIT-02).'
- question: What does CLEAR do when written while RUN is 1?
  risk: medium
  used: Ignored, the bit still self-clears
  how: 'defaulted: nobody answered'
  reason: The request says CLEAR acts only while RUN is 0.
- question: Does stopping RUN (RUN 1 to 0) drain the FIFO?
  risk: medium
  used: The writer stops; the reader keeps draining until empty and checking, so counts settle
  how: 'defaulted: nobody answered'
  reason: Not stated; a drain keeps the written and read counts equal after a stop.
- question: Is OCC_MAX measured in the writer domain from the synchronised read pointer?
  risk: medium
  used: Yes, written count minus synchronised read pointer, so it can be pessimistic by a few words
  how: 'defaulted: nobody answered'
  reason: Exact fill is not observable across unrelated clocks.
- question: Which word does INJECT corrupt and which bit is flipped?
  risk: medium
  used: The next word checked after INJECT arrives, bit 0
  how: 'defaulted: nobody answered'
  reason: The request says one bit of one word.
- question: What do the LEDs show?
  risk: medium
  used: led[0] = RUN, led[1] = sticky error
  how: 'defaulted: nobody answered'
  reason: Not specified.
