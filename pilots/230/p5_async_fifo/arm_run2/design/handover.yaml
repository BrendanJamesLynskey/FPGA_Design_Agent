  text: 'latency not measured: the run measured no latency; the spec''s latency promise is checked only by the benches'
- about: throughput
  text: 'throughput not measured: the run measured no throughput'
- about: read_latency
  text: 'Counted from rtl/p5_async_fifo_soak_core.sv: h_rdata is a register loaded on clk_wr the clock after h_re, so read
    data is valid 1 clk_wr after h_re and held until the next h_re. The spec promises at most 2. A write takes effect 1
    clk_wr after h_we, as the spec says.'
- about: overflow_underflow_counters
  text: OVERFLOWS and UNDERFLOWS cannot count in the RTL. ovf_w is only ever cleared, never incremented, and the writer
    gates writes with run && !full. The underflow condition is can_pop && empty while can_pop already includes !empty. Both
    read 0 by construction, so the 0 results of REQ-11, REQ-12 and REQ-27 prove nothing about the FIFO. The spec says they
    count violations.
- about: ctrl_read_and_unmapped
  text: Reading CTRL (0x010) returns only RUN in bit 0 and SLOW_READ in bit 1. CLEAR and INJECT read as 0. Reads of any
    unmapped address, including 0x030 (SNAPSHOT is write-only) and 0x00C, return 0, and writes to unmapped addresses are
    ignored. The snapshot registers read 0 until the first SNAPSHOT write.
- about: ctrl_write_priority
  text: Every CTRL write sets RUN and SLOW_READ from bits 0 and 1. CLEAR acts only if the RUN value before the write is
    0, and otherwise it is ignored and nothing else changes. INJECT is sent whatever CLEAR does. A write with CLEAR=1 and
    RUN=1 on a stopped design clears and starts in the same write. The reader then flushes until empty, which may discard
    or desynchronise words the restarted writer has already sent (inferred from the RTL, not simulated). Write CLEAR with
    RUN 0 first, then set RUN in a later write.
- about: clear_scope
  text: 'CLEAR resets the live counters and both PRBS sequences, but the snapshot registers 0x014 to 0x02C keep their old
    values until the next SNAPSHOT write. It also does not reset the FIFO pointers: the reader discards (flushes) any words
    still in the FIFO without counting them, then reseeds.'
- about: snapshot_not_one_instant
  text: The spec says a SNAPSHOT write latches all counters at one instant. In the RTL, WORDS_W, STALL_W, OVERFLOWS and
    OCC_MAX latch on clk_wr one clock after the write. WORDS_R, DATA_ERRS and UNDERFLOWS are sampled on clk_rd after the
    pulse crosses and are copied over by a 96-bit XPM handshake. A read right after the write can return the previous values
    for those three. The counts can also differ by words in flight.
- about: stop_drains
  text: 'The reader does not look at RUN: it pops whenever the FIFO is not empty, so it drains after RUN falls. The spec
    says the reader pops when RUN is 1. This matches the defaulted interview answer (drain after stop), so WORDS_R catches
    up with WORDS_W.'
- about: occ_max_pessimistic
  text: OCC_MAX is written count plus 1 minus the read pointer synchronised into clk_wr, so it can be high by a few words.
    It is not the exact fill.
- about: inject_word
  text: INJECT flips bit 0 of the next word checked after the pulse reaches clk_rd. If the FIFO is empty the flip waits
    for the next word. The pulse is a toggle crossing, so it is not lost.
- about: clk_rd_constraint
  text: design.xdc has no pin assignment and no create_clock for mgtrefclk0_p or mgtrefclk0_n, so the 156.25 MHz clk_rd
    is not constrained there. The spec and ARCHITECTURE.md assume it is constrained and that timing is met on both clocks
    (REQ-26). The timing result M6 and M7 may therefore not cover the reader domain. Check the post-route clock report before
    relying on the result.
- about: clock_names
  text: The spec calls the clocks clk_wr and clk_rd. The top-level ports are clk_25 and mgtrefclk0_p/n, and the XDC clock
    is named sys_clk_pin. The spec's clk_wr is clk_25.
- about: build_word_sim
  text: In simulation the USR_ACCESSE2 stub returns 0, so BUILD reads 0 there. Its real value is known only on hardware.
- about: assumptions_run
  text: The run assumed jtag_bus.sv is used unchanged and is not simulated. It also assumed LEDs show RUN and a sticky error
    flag, the register port runs on the 25 MHz clock, and pointers cross as Gray code through 2-flop synchronisers. All
    of these were defaulted or are spec assumptions, not answered by a person.
