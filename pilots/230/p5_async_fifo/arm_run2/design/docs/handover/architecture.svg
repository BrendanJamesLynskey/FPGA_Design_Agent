<svg xmlns="http://www.w3.org/2000/svg" width="640" height="232" viewBox="0 0 640 232" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="232" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">p5_async_fifo_soak</text><text x="170" y="43">thin top; instantiates jtag_bus, the core, IBUFDS_GTE4 for clk_rd, dri</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">jtag_bus</text><text x="170" y="77">BSCANE2 USER4 register bus (supplied, unmodified), clk_wr domain</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">soak_core</text><text x="170" y="111">register map, control, snapshot, LEDs, writer PRBS-31, FIFO memory, re</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">fifo_mem</text><text x="170" y="145">512x32 simple dual port RAM with gray-coded pointers and full/empty fl</text><text x="8" y="172" font-weight="bold">Interfaces</text><text x="8" y="190">jtag_bus - soak_core: host_reg (simple)</text><text x="8" y="208">soak_core - p5_async_fifo_soak: led_out (gpio)</text></svg>
