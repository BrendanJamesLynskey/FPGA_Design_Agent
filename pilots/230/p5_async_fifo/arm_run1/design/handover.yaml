# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: p5_async_fifo
title: Asynchronous FIFO soak with PRBS-31 (25 MHz writer, 156.25 MHz reader)
kind: agent-run
produced_by: agent
summary: The design writes a PRBS-31 word stream into a 512 x 32 asynchronous FIFO in the 25 MHz clk_wr domain. A reader
  in the 156.25 MHz clk_rd domain checks each word against its own PRBS-31 copy and counts errors. A JTAG register port
  exposes control, snapshot counters and an ID. The run reached a routed bitstream on the KR260 with the timing, power and
  DRC stages passing. Verification reached V2 of V3, and the bring-up on the board has not been run.
scope_not:
- It is not a transceiver design. No GT channel is used, and the SFP+ reference clock is only a 156.25 MHz fabric clock
  source.
- It does not drive the SFP+ laser, because sfp_tx_disable is held at 1.
- It has no reset input; every reset is a reconfiguration of the FPGA, and the top runs a power-up reset generator.
- It is not a throughput or latency benchmark; neither was measured.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p5_async_fifo_soak
clocks:
- name: clk_c3
  mhz: 25.0
  source: runs/20261126-164034-895f/p5_async_fifo/design.xdc
resets:
- name: rst (internal)
  active: high
  note: Not a port. The top holds it for 16 clk_wr clocks from initial values (p5_async_fifo_soak.sv), then xpm_cdc_async_rst
    (4 stages) gives each domain its own reset. The spec says it comes from jtag_bus, but the RTL generates it in the top;
    jtag_bus gets a registered copy, rst_j.
interfaces:
- name: clk_c3
  type: input clock, 25 MHz, pin C3 LVCMOS18
  note: Drives clk_wr through a BUFG; the writer, jtag_bus and registers run on it.
- name: gt_refclk_p / gt_refclk_n
  type: differential input clock, 156.25 MHz, SFP+ MGTREFCLK0
  note: IBUFDS_GTE4 then BUFG_GT gives clk_rd. design.xdc does not redefine the clock; the flow creates it. The spec and
    ARCHITECTURE.md say IBUFDS_GTE2/BUFG, and the RTL uses GTE4 and BUFG_GT.
- name: led
  type: output, 2 bits, pins F8 (led[0]) and E8 (led[1]) LVCMOS18
  note: led[0] = RUN. led[1] = reader error flag (DATA_ERRS or UNDERFLOWS nonzero, through a CDC) OR OVERFLOWS nonzero (soak_core.sv).
- name: sfp_tx_disable
  type: output, 1 bit, pin Y10 LVCMOS33
  note: Constant 1 (laser off).
- name: JTAG register port (internal)
  type: jtag_bus h_we, h_re, h_addr[11:0], h_wdata, h_rdata on clk_wr
  note: Register map is in the registers list. Not a top-level port.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546635777
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word from USR_ACCESSE2
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 read-back
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 RUN, 1 SLOW_READ, 2 CLEAR (self-clearing, only while RUN 0), 3 INJECT (self-clearing)
- offset: 20
  name: WORDS_W
  access: RO
  reset: 0
  bits: 31:0 words written (snapshot)
- offset: 24
  name: WORDS_R
  access: RO
  reset: 0
  bits: 31:0 words read and checked (snapshot)
- offset: 28
  name: DATA_ERRS
  access: RO
  reset: 0
  bits: 31:0 mismatching words (snapshot)
- offset: 32
  name: OVERFLOWS
  access: RO
  reset: 0
  bits: 31:0 (snapshot)
- offset: 36
  name: UNDERFLOWS
  access: RO
  reset: 0
  bits: 31:0 (snapshot)
- offset: 40
  name: STALL_W
  access: RO
  reset: 0
  bits: 31:0 writer clocks held off by full (snapshot)
- offset: 44
  name: OCC_MAX
  access: RO
  reset: 0
  bits: 9:0 highest fill in words (snapshot)
- offset: 48
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: any write latches 0x014 to 0x02C; reads 0
parameters:
- name: FIFO_DEPTH_WORDS
  value: 512
  legal: 512 only
  note: Fixed by the RTL (9-bit addresses, 10-bit pointers); not a module parameter. The spec gives a write rate of 25 Mword/s.
- name: DATA_WIDTH_BITS
  value: 32
  legal: 32 only
  note: Fixed in the RTL (PRBS word and FIFO width); not a module parameter.
- name: PRBS_SEED
  value: 2147483647
  legal: nonzero 31-bit value
  note: Seed 0x7FFFFFFF for both PRBS copies; a zero seed would lock the generator.
- name: SLOW_READ_PERIOD_CYCLES
  value: 8
  legal: 2 or more
  note: With SLOW_READ set the reader takes at most one word per this many clk_rd clocks, 19.53 Mword/s per the spec. The
    benches ran at this value.
- name: DESIGN_ID
  value: 546635777
  legal: any 32-bit value
  note: Read at offset 0 (0x20950001).
- name: COUNTER_WIDTH_BITS
  value: 32
  legal: 32 as built and verified
  note: Counter width; the spec requires 32 and counters wrap. Other widths were not checked.
