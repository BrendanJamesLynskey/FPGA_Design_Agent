assumptions:
- question: Which clock drives jtag_bus and the register block?
  risk: high
  used: clk_wr (25 MHz)
  how: 'defaulted: nobody answered'
  reason: Free-running, matches the writer; counters from clk_rd are brought over by CDC.
- question: What do snapshot registers read before the first SNAPSHOT write?
  risk: high
  used: '0'
  how: 'defaulted: nobody answered'
  reason: Reset value is not given.
- question: Should the LEDs show anything?
  risk: high
  used: led[0] = RUN, led[1] = any error seen (DATA_ERRS, OVERFLOWS or UNDERFLOWS nonzero).
  how: 'defaulted: nobody answered'
  reason: LEDs are not described in the request.
- question: Please confirm the register map (offset, width, reset value and access of every register).
  risk: high
  used: 'The map in registers.map: 0x000 ID, 0x004 BUILD, 0x008 SCRATCH, 0x010 CTRL, 0x014 to 0x02C counters, 0x030 SNAPSHOT,
    all 32 bits, as in the request.'
  how: 'defaulted: nobody answered'
  reason: Offsets are given in the request; confirmed for the harness.
- question: This design has no reset input. Is every reset a reconfiguration of the FPGA (the device is reprogrammed, so
    every register starts from its initial value), or does something restart the running design (then it needs a reset input)?
  risk: high
  used: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram): registers get initial values, control state
    included, and the design has no reset input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  how: 'defaulted: nobody answered'
  reason: 'With no reset input, a register can start only from its initial value, which the FPGA loads at configuration
    (owner, 2026-11-26: particularly useful for designs whose every reset reprograms the device). A design that must restart
    while running needs a reset input and resets its control state; the two models are checked by different rules (STD-INIT-02).'
- question: What happens to words still in the FIFO when RUN falls?
  risk: medium
  used: The reader keeps draining and checking until empty; the writer stops.
  how: 'defaulted: nobody answered'
  reason: Avoids a false mismatch from a sequence break.
- question: Which bit does INJECT flip?
  risk: medium
  used: Bit 0 of the next word read after INJECT is seen by the reader.
  how: 'defaulted: nobody answered'
  reason: The request says one bit of one word without naming it.
- question: Does a CLEAR with RUN 1 set any error flag?
  risk: medium
  used: No, it is ignored silently and the bit still self-clears.
  how: 'defaulted: nobody answered'
  reason: Request only restricts CLEAR to RUN 0.
