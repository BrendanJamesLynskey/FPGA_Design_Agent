    by constrained-random and directed simulation against the model.'
- about: latency
  text: 'latency not measured: the run measured no latency; the spec''s latency promise is checked only by the benches'
- about: throughput
  text: 'throughput not measured: the run measured no throughput'
- about: cover-vs-functional
  text: The V3 record shows functional bins 0 of 0 and cover properties 0.0 percent, with line, toggle and mutation not
    measured. The cover results and the functional coverage do not agree and must be compared before new stimulus.
- about: reset-source
  text: spec.yaml says rst comes from jtag_bus; p5_async_fifo_soak.sv generates it from a 16-clock power-up counter and
    no reset input exists. The RTL is what was built.
- about: reset-values
  text: All registers reset to 0 as in the map. Snapshot registers read 0 until the first SNAPSHOT write (assumption, defaulted).
    SCRATCH and CTRL return to 0 only on reconfiguration or the power-up reset.
- about: unmapped-access
  text: Reads of unmapped or reserved addresses return 0 (default branch in soak_core.sv; 0x00C, 0x03C etc.). Writes to
    unmapped addresses change nothing. SNAPSHOT (0x030) reads 0, since it has no read case.
- about: read-latency
  text: In p5_async_fifo_soak_core.sv h_rdata is registered on h_re, so it shows the addressed value one clk_wr clock after
    h_re and holds it until the next h_re. This is inside the spec's 2-clock promise. Register writes also take effect one
    clock after h_we.
- about: ctrl-read-layout
  text: CTRL reads back bit 0 RUN, bit 1 SLOW_READ, bit 3 INJECT pending, bit 2 always 0. Every CTRL write replaces RUN
    and SLOW_READ with bits 0 and 1 of the data.
- about: clear-behaviour
  text: CLEAR is tested against the old RUN value (the RTL checks !run before the same write updates it), so writing RUN=1
    and CLEAR=1 together still clears. CLEAR holds the writer in reset for 10 clk_wr clocks (clr_cnt), and the writer does
    not write during that time. A CLEAR while RUN is 1 is ignored silently.
- about: inject-behaviour
  text: INJECT flips bit 0 of the next word popped by the reader, and the request is dropped if the previous ack is still
    showing (inj_ack_s). It clears when the reader acknowledges, not at the write.
- about: led-priority
  text: led[1] includes OVERFLOWS but, as built, UNDERFLOWS is never counted in the reader; the UNDERFLOWS register is fed
    from a handshake field that the reader leaves at zero, so it reads 0 always. The spec promises an underflow count.
- about: overflow-count
  text: OVERFLOWS increments only when a write is made while full, but the write enable already includes not-full, so the
    counter cannot count in the built RTL.
- about: snapshot-timing
  text: Writer-side counters latch at the SNAPSHOT write. The reader counters (WORDS_R, DATA_ERRS, UNDERFLOWS) arrive later
    by a handshake, so the snapshot is not one instant and a read right after the write may show old reader values. The
    spec promises one instant.
- about: occupancy
  text: OCC_MAX is computed in clk_wr from the synchronised read pointer, so it can over-read the true fill by the pointer
    synchroniser delay. It is a 10-bit value; full is flagged at 512.
- about: slow-read-period
  text: The benches ran at the spec value of SLOW_READ_PERIOD_CYCLES; no other value was simulated.
- about: stop-behaviour
  text: When RUN falls the writer stops and the reader drains and checks the remaining words (assumption, defaulted). Counters
    keep their values until CLEAR.
- about: pin-spec
  text: The spec says IBUFDS_GTE2 and BUFG; the RTL uses IBUFDS_GTE4, BUFG_GT and USR_ACCESSE2. design.xdc sets the max
    delay clk_wr to clk_rd at 6.4 ns only in that direction.
