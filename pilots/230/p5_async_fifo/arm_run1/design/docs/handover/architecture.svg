<svg xmlns="http://www.w3.org/2000/svg" width="640" height="266" viewBox="0 0 640 266" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="266" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">jtag_bus</text><text x="170" y="43">JTAG USER4 register bus to the h_* register port</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">reset_gen</text><text x="170" y="77">power-up reset pulse and per-domain reset synchronisers</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">reg_core</text><text x="170" y="111">registers</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">async_fifo</text><text x="170" y="145">512x32 asynchronous FIFO (xpm_fifo_async)</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">rd_checker</text><text x="170" y="179">reader with slow-read gate</text><text x="8" y="206" font-weight="bold">Interfaces</text><text x="8" y="224">jtag_bus - reg_core: host_reg (simple)</text><text x="8" y="242">reg_core - rd_checker: fifo_data (simple)</text></svg>
