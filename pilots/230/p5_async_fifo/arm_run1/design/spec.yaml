assumptions:
- text: Register port clock (clk of jtag_bus) is the 25 MHz clk_wr.
  reason: The request does not name it; the slower control domain keeps timing easy
    and the writer lives there.
- text: Part is xck26-sfvc784-2LV-c.
  reason: Standard K26 SOM part of the KR260.
- text: When RUN is 0 the writer stops and the reader drains the FIFO.
  reason: Request defines activity only while RUN.
- text: Counters keep their values when RUN goes 0 until CLEAR.
  reason: The script reads results after a run.
open_questions: []
resolved_questions:
- question: Which clock drives jtag_bus and the register block?
  answer: clk_wr (25 MHz)
  status: defaulted
  by: default
  default_reason: Free-running, matches the writer; counters from clk_rd are brought
    over by CDC.
  risk: high
- question: What happens to words still in the FIFO when RUN falls?
  answer: The reader keeps draining and checking until empty; the writer stops.
  status: defaulted
  by: default
  default_reason: Avoids a false mismatch from a sequence break.
  risk: medium
- question: Which bit does INJECT flip?
  answer: Bit 0 of the next word read after INJECT is seen by the reader.
  status: defaulted
  by: default
  default_reason: The request says one bit of one word without naming it.
  risk: medium
- question: Does a CLEAR with RUN 1 set any error flag?
  answer: No, it is ignored silently and the bit still self-clears.
  status: defaulted
  by: default
  default_reason: Request only restricts CLEAR to RUN 0.
  risk: medium
- question: What do snapshot registers read before the first SNAPSHOT write?
  answer: '0'
  status: defaulted
  by: default
  default_reason: Reset value is not given.
  risk: high
- question: Should the LEDs show anything?
  answer: led[0] = RUN, led[1] = any error seen (DATA_ERRS, OVERFLOWS or UNDERFLOWS
    nonzero).
  status: defaulted
  by: default
  default_reason: LEDs are not described in the request.
  risk: high
- question: Please confirm the register map (offset, width, reset value and access
    of every register).
  answer: 'The map in registers.map: 0x000 ID, 0x004 BUILD, 0x008 SCRATCH, 0x010 CTRL,
    0x014 to 0x02C counters, 0x030 SNAPSHOT, all 32 bits, as in the request.'
  status: defaulted
  by: default
  default_reason: Offsets are given in the request; confirmed for the harness.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
