name: p5_async_fifo_soak
title: 'P5: asynchronous FIFO soak (25 MHz writer, 156.25 MHz reader, PRBS-31)'
board: kr260
part: xck26-sfvc784-2LV-c
top: p5_async_fifo_soak
clocks:
- name: clk_wr
  role: C3 25 MHz board clock pin
  freq_mhz: 25
  use: writer domain, JTAG register port (clk of jtag_bus), control and snapshot registers
- name: clk_rd
  role: SFP+ cage MGTREFCLK0 156.25 MHz through the GT reference clock buffer
  freq_mhz: 156.25
  use: reader domain and checker
- note: clk_wr and clk_rd are asynchronous to each other (set_clock_groups -asynchronous
    plus max_delay -datapath_only on the gray pointers and the CDC bus)
reset:
  name: rst
  source: from jtag_bus (held for a few clocks at start)
  polarity: active high
  sync: synchronised into each clock domain; the FIFO is also reset by CLEAR while
    RUN is 0
parameters:
  FIFO_DEPTH_WORDS: 512
  DATA_WIDTH_BITS: 32
  PRBS_SEED: 2147483647
  SLOW_READ_PERIOD_CYCLES: 8
  DESIGN_ID: 546635777
  COUNTER_WIDTH_BITS: 32
ports:
- name: clk_c3
  direction: in
  width: 1
  board_pin_role: C3 25 MHz clock
- name: gt_refclk_p
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 positive
- name: gt_refclk_n
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 negative
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
behaviour:
  writer:
  - In clk_wr when RUN is 1 and the FIFO is not full, one 32-bit PRBS-31 word (x^31
    + x^28 + 1, 32 new bits per word, seed 0x7FFFFFFF) is written every clock.
  - When RUN is 1 and the FIFO is full, no word is written, the PRBS does not advance
    and STALL_W increments.
  - A write attempted while full (never expected) increments OVERFLOWS and is dropped.
  reader:
  - In clk_rd when RUN is 1 and the FIFO is not empty, a word is read and compared
    with the reader's own PRBS-31 copy started from the same seed.
  - A mismatch increments DATA_ERRS; WORDS_R increments for every word read and checked.
  - A read attempted while empty (never expected) increments UNDERFLOWS.
  - With SLOW_READ set the reader takes at most one word every 8 clk_rd clocks.
  - INJECT flips one bit of exactly one received word before the check, then clears
    itself.
  control:
  - CLEAR, written only while RUN is 0, zeroes all counters and OCC_MAX, reloads both
    sequences with the seed and empties the FIFO; it self-clears.
  - A CLEAR written while RUN is 1 is ignored.
  - A write to SNAPSHOT latches all seven counters at one instant into the RO registers;
    reads return the latched values.
  - Counters are 32 bits and wrap.
  - OCC_MAX is the highest FIFO fill seen in words (0 to 512).
  register_port:
  - h_we and h_re pulses with h_addr[11:0] byte addresses; a write takes effect the
    clock after h_we.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - jtag_bus.sv is used unchanged and instantiated at the top; simulation tests the
    register port directly.
  pins:
  - sfp_tx_disable is driven to 1 at all times; no GT transceiver channel is used.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546635777
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word from USR_ACCESSE2
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 read-back
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 RUN, 1 SLOW_READ, 2 CLEAR (self-clearing, only while RUN 0), 3 INJECT
      (self-clearing)
  - offset: 20
    name: WORDS_W
    access: RO
    reset: 0
    bits: 31:0 words written (snapshot)
  - offset: 24
    name: WORDS_R
    access: RO
    reset: 0
    bits: 31:0 words read and checked (snapshot)
  - offset: 28
    name: DATA_ERRS
    access: RO
    reset: 0
    bits: 31:0 mismatching words (snapshot)
  - offset: 32
    name: OVERFLOWS
    access: RO
    reset: 0
    bits: 31:0 (snapshot)
  - offset: 36
    name: UNDERFLOWS
    access: RO
    reset: 0
    bits: 31:0 (snapshot)
  - offset: 40
    name: STALL_W
    access: RO
    reset: 0
    bits: 31:0 writer clocks held off by full (snapshot)
  - offset: 44
    name: OCC_MAX
    access: RO
    reset: 0
    bits: 9:0 highest fill in words (snapshot)
  - offset: 48
    name: SNAPSHOT
    access: WO
    reset: 0
    bits: any write latches 0x014 to 0x02C; reads 0
timing:
  clk_wr_period_ns: 40
  clk_rd_period_ns: 6.4
  write_rate: 25 Mword/s while RUN and not full
  read_rate: 156.25 Mword/s max, 19.53 Mword/s with SLOW_READ
  latency:
    register_read: h_rdata valid within 2 clk_wr clocks of h_re
    register_write: effect 1 clk_wr clock after h_we
    snapshot: reader-domain counters cross to clk_wr by a handshake or gray-coded
      CDC; all values taken at one instant
    fifo_cdc: gray pointers through 2-flop synchronisers in each direction
resources_expected:
  bram36: 1
  lut: 700
  ff: 900
  dsp: 0
  gt_channels: 0
  bufg: 2
