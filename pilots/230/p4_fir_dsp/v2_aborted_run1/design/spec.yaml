name: fir32_sym
title: 'P4: 32-tap symmetric FIR low-pass filter with FIFOs, JTAG register access'
board: kr260
part: xck26-sfvc784-2LV-c
top: fir_top
clocks:
- name: clk25
  port: clk25
  freq_comment: 25 MHz board clock, pin C3
  role: input to MMCM; also the register-bus clock (clk of jtag_bus)
- name: clk_dp
  source: MMCM from clk25 (multiply 40, VCO 1000 MHz, divide 4)
  freq_comment: 250 MHz datapath clock, must close timing at 250 MHz or faster
  role: FIR datapath, FIFO read/write on the datapath side
reset:
  name: rst
  source: from jtag_bus (held for a few clocks at start), synchronous to clk25; datapath
    reset is synchronised to clk_dp and held until MMCM locked
  polarity: active-high
parameters:
  NUM_TAPS: 32
  UNIQUE_COEFFS: 16
  DATA_WIDTH: 16
  COEFF_WIDTH: 16
  FIFO_DEPTH: 1024
  ACC_WIDTH: 38
  ROUND_CONST: 16384
  SHIFT: 15
  DESIGN_ID: 546570241
  MMCM_MULT: 40
  MMCM_OUT_DIVIDE: 4
ports:
- name: clk25
  direction: in
  width: 1
  board_pin_role: 25 MHz system clock, pin C3
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
behaviour:
  filter:
  - y[n] = saturate16((sum_{k=0..31} h[k]*x[n-k] + 0x4000) >>> 15), exact sum, arithmetic
    shift, no intermediate rounding.
  - Coefficients h[0..31] come from data/coeffs.hex (16-bit signed Q1.15, tap 0 first),
    symmetric h[k]=h[31-k].
  - 'Symmetry used: pre-add x[n-k]+x[n-31+k] for k=0..15 and 16 multipliers on DSP
    slices.'
  - Samples before the first are 0.
  - Saturation clamps to 32767 or -32768; each saturated output increments SAT_COUNT.
  - Datapath accepts one sample per clock_dp cycle.
  fifo_and_run:
  - Input FIFO holds 1024 16-bit samples; IN_PUSH writes the low 16 bits, ignored
    when full.
  - Output FIFO holds 1024 16-bit samples; OUT_POP read returns the oldest and removes
    it.
  - RUN processes every sample in the input FIFO in order and pushes results to the
    output FIFO; BUSY is 1 until done.
  - Filter history persists between runs until CLEAR.
  - CLEAR empties both FIFOs, zeroes filter history, SAT_COUNT and SAMPLES_DONE.
  host_port:
  - 'Register port from data/jtag_bus.sv (unchanged): h_we, h_re, h_addr[11:0], h_wdata,
    h_rdata in the clk25 domain.'
  - A write takes effect one clock after h_we. h_rdata shows the addressed register
    within 2 clocks of h_re and holds.
  - Unmapped addresses read 0 and ignore writes.
  - ID at 0x000 reads 0x20940001; BUILD at 0x004 reads USR_ACCESSE2; SCRATCH at 0x008
    is RW, reset 0.
  - Registers cross between clk25 and clk_dp with proper CDC (command pulses, counts,
    FIFOs asynchronous).
  pins:
  - sfp_tx_disable is driven 1 at all times; no GT transceiver used.
  - led[0] shows BUSY, led[1] shows MMCM locked.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546570241
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 CLEAR self-clearing; 1 RUN self-clearing; 31:2 reserved
  - offset: 20
    name: IN_PUSH
    access: WO
    reset: 0
    bits: 15:0 sample pushed
  - offset: 24
    name: OUT_POP
    access: RO
    reset: 0
    bits: 31 valid; 15:0 oldest output; read pops
  - offset: 28
    name: STATUS
    access: RO
    reset: 0
    bits: 0 BUSY; 15:4 input FIFO count; 31:20 output FIFO count
  - offset: 32
    name: SAT_COUNT
    access: RO
    reset: 0
    bits: 31:0 saturated outputs since CLEAR
  - offset: 36
    name: SAMPLES_DONE
    access: RO
    reset: 0
    bits: 31:0 samples processed since CLEAR
timing:
  datapath_clock: clk_dp 250 MHz or faster, setup WNS >= 0
  throughput: 1 sample per clk_dp cycle
  latency:
    register_read: h_rdata valid within 2 clk25 cycles of h_re
    register_write: effect 1 clk25 cycle after h_we
    filter_pipeline: fixed pipeline depth from sample in to result out, set by DSP
      cascade (about 20 clk_dp cycles)
resources_expected:
  dsp48e2: 16 (one per unique coefficient), report to show count
  bram: 2 x 1024x16 FIFOs (about 1 RAMB36 each)
  lut_ff: under 2000 LUTs
  mmcm: 1
assumptions:
- text: Bus clock is clk25 directly (no extra clock).
  reason: The request says the bus can stay on its own clock.
- text: Coefficients embedded or read by $readmemh from data/coeffs.hex; data files
    could not be inspected when writing this spec.
  reason: Symmetry stated in the request.
- text: Accumulator is 38 bits.
  reason: 32 products of 16x16 bits with Q1.15 need at most 31+5 bits plus rounding
    headroom.
- text: Writes to IN_PUSH when full are dropped silently.
  reason: Stated in the request.
- text: SAT_COUNT and SAMPLES_DONE are 32-bit.
  reason: Register width is 32 bits.
open_questions: []
