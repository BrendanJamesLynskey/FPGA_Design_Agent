resolved_questions:
- question: Is the register map exactly the offsets in the request (0x000-0x008 common,
    0x010-0x024 FIR)?
  answer: Yes, use the map in registers.map with the offsets, widths, reset values
    and access of every register as in the request.
  status: defaulted
  by: default
  default_reason: The request gives offsets, but reset values for BUILD and counters
    are not all stated.
  risk: high
- question: What do writes to IN_PUSH while BUSY, and RUN with an empty input FIFO,
    do?
  answer: IN_PUSH while BUSY is accepted if not full; RUN with empty FIFO finishes
    at once with no output.
  status: defaulted
  by: default
  default_reason: Request does not say.
  risk: medium
- question: What happens if the output FIFO would overflow (input count plus output
    count above 1024)?
  answer: Processing stalls until the output FIFO has room (no sample lost).
  status: defaulted
  by: default
  default_reason: A run can produce more outputs than the free output space; request
    silent.
  risk: high
- question: 'Reading OUT_POP when BUSY or STATUS counts while BUSY: are they coherent?'
  answer: Counts are the live values, synchronised to clk25 with at most a few cycles
    of lag.
  status: defaulted
  by: default
  default_reason: CDC between the two clocks.
  risk: medium
- question: Do CLEAR and RUN written in the same CTRL write both act?
  answer: CLEAR wins and RUN is ignored.
  status: defaulted
  by: default
  default_reason: Request silent.
  risk: medium
- question: What do the LEDs show?
  answer: led[0] = BUSY, led[1] = MMCM locked.
  status: defaulted
  by: default
  default_reason: Request does not assign them.
  risk: medium
- question: Does RUN written while BUSY restart or queue?
  answer: Ignored while BUSY.
  status: defaulted
  by: default
  default_reason: Request silent.
  risk: medium
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
