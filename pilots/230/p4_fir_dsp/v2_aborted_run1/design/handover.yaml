schema: fda-handover/1
id: p4_fir_dsp
title: 32-tap symmetric FIR filter with FIFOs and JTAG register access (KR260)
kind: agent-run
produced_by: agent
summary: The design is a 32-tap symmetric low-pass FIR filter that uses 16 multipliers. A host pushes 16-bit samples into
  a 1024-deep input FIFO over a JTAG register port on the 25 MHz clock. RUN streams them through a datapath clocked at 250
  MHz by an MMCM, and the results go to a 1024-deep output FIFO that the host pops. The run reached simulation level V2
  of V3. It stopped in board-and-device-planning, where check_constraints failed repeatedly. Synthesis ran once and its
  resource gate failed. No implementation, timing, power or hardware result exists.
scope_not:
- Not proven on hardware, and not timing-closed. No post-route result exists.
- Not a runtime-loadable coefficient filter. The 16 unique coefficients are constants in rtl/fir_datapath.sv.
- Not a design with a reset input. Resets come from reprogramming plus an internal power-up reset.
- No GT transceiver is used. sfp_tx_disable is a constant output.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: fir_top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261126-132847-e69d/p4_fir_dsp/design.xdc
resets:
- name: rst (internal)
  active: high
  note: Generated in rtl/fir_top.sv by a 4-bit counter on clk_25 and held for 15 clocks after configuration. There is no
    reset port. fir_core also resets the datapath asynchronously through xpm_cdc_async_rst until the MMCM is locked, and
    every register has an initial value.
interfaces:
- name: clk_25
  type: input, 25 MHz clock, pin C3 LVCMOS18
  note: design.xdc names the port clk_25 and fir_top.sv uses it. spec.yaml names it clk25. fir_top also declares an unused
    input clk25 that has no pin in design.xdc.
- name: led
  type: output [1:0], pins F8 (led[0]) and E8 (led[1]), LVCMOS18
  note: led[0] is BUSY and led[1] is the MMCM locked flag after synchronisation to clk25.
- name: sfp_tx_disable
  type: output, pin Y10 LVCMOS33
  note: Constant 1 in rtl/fir_core.sv.
- name: JTAG register bus (internal)
  type: h_we, h_re, h_addr[11:0], h_wdata, h_rdata from data/jtag_bus.sv, on clk_25
  note: Not a top-level port. It is the host access path to the register map.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546570241
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 scratch
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 CLEAR self-clearing; 1 RUN self-clearing; 31:2 reserved
- offset: 20
  name: IN_PUSH
  access: WO
  reset: 0
  bits: 15:0 sample pushed
- offset: 24
  name: OUT_POP
  access: RO
  reset: 0
  bits: 31 valid; 15:0 oldest output; read pops
- offset: 28
  name: STATUS
  access: RO
  reset: 0
  bits: 0 BUSY; 15:4 input FIFO count; 31:20 output FIFO count
- offset: 32
  name: SAT_COUNT
  access: RO
  reset: 0
  bits: 31:0 saturated outputs since CLEAR
- offset: 36
  name: SAMPLES_DONE
  access: RO
  reset: 0
  bits: 31:0 samples processed since CLEAR
parameters:
- name: NUM_TAPS
  value: 32
  legal: 32 only
  note: The RTL hard-codes 32 taps (16 pre-adders and multipliers) and does not use this parameter.
- name: UNIQUE_COEFFS
  value: 16
  legal: 16 only
  note: One DSP multiplier per unique coefficient. The coefficient table is hard-coded in fir_datapath.sv.
- name: DATA_WIDTH
  value: 16
  legal: 16 only
  note: Signed 16-bit samples. The datapath widths are fixed in the RTL.
- name: COEFF_WIDTH
  value: 16
  legal: 16 only
  note: Signed Q1.15 coefficients.
- name: FIFO_DEPTH
  value: 1024
  legal: 1024 only
  note: The xpm_fifo_async instances in fir_core.sv hard-code a depth of 1024 and an 11-bit count.
- name: ACC_WIDTH
  value: 38
  legal: 38 only
  note: Accumulator width in fir_datapath.sv.
- name: ROUND_CONST
  value: 16384
  legal: 16384 only
  note: Added before the shift, which is 0x4000.
- name: SHIFT
  value: 15
  legal: 15 only
  note: Arithmetic right shift, then saturation to 16 bits.
- name: DESIGN_ID
  value: 546570241
  legal: any 32-bit value
  note: The only parameter that exists in the RTL (fir_core, default 32'h20940001). It is returned by the ID register.
- name: MMCM_MULT
  value: 40
  legal: 40 with a 25 MHz input
  note: The VCO is 1000 MHz. The value is hard-coded in fir_top.sv.
- name: MMCM_OUT_DIVIDE
  value: 4
  legal: 4 for 250 MHz
  note: Gives a 250 MHz clk_dp. The spec asks for timing closure at 250 MHz, which has not been measured.
