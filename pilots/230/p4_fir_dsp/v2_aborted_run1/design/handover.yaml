- about: coverage_disagreement
  text: Functional bins show 0 of 0 and cover properties show 0 percent, so no coverage was collected. Treat the V3 coverage
    numbers as missing, not as a result.
- about: port_name
  text: spec.yaml names the clock port clk25, but design.xdc constrains clk_25 (pin C3, period 40.00 ns) and fir_top.sv
    drives everything from clk_25. The unused extra input clk25 in fir_top.sv has no pin constraint. The RTL and XDC are
    what was built.
- about: reset_style
  text: spec.yaml describes a reset from jtag_bus and an active-high rst. The RTL generates rst in fir_top.sv from a 15-clock
    counter and there is no reset port. The reset model is reprogram, so registers carry initial values. The reset values
    of the map match the spec.
- about: unmapped_access
  text: Reads of unmapped addresses return 0 (default case in fir_core.sv). Writes to unmapped addresses change nothing.
    Writes to ID, BUILD, OUT_POP, STATUS, SAT_COUNT and SAMPLES_DONE have no effect. CTRL bits 31:2 are ignored.
- about: read_side_effects
  text: A read of OUT_POP pops the FIFO when it is not empty. On an empty FIFO it returns 0 and pops nothing. h_rdata is
    updated only on h_re and holds its value between reads. It is registered, so it appears one clk25 cycle after h_re,
    inside the spec bound of 2.
- about: ctrl_priority
  text: In one CTRL write, CLEAR wins and RUN is ignored. RUN is also ignored while BUSY. RUN with an empty input FIFO ends
    with no output. CLEAR holds the input FIFO in reset for several clk25 cycles. IN_PUSH writes made in that window wait
    in a 64-entry queue and are dropped only when the queue is full.
- about: push_when_full
  text: IN_PUSH goes through a 64-entry queue and then the FIFO, which ignores writes when full. The spec says a push to
    a full FIFO is ignored. A push dropped for a full queue is also silent.
- about: output_backpressure
  text: Issue stalls when the output FIFO has no room, so no result is lost. The room check uses a registered, synchronised
    pop count, so it is conservative.
- about: pipeline_latency
  text: The spec says about 20 clk_dp cycles of filter latency. The RTL valid chain in fir_datapath.sv is 9 stages, with
    the history register and the FIFO read added outside it. No measurement was made.
- about: coefficient_source
  text: The spec says the coefficients come from data/coeffs.hex. The RTL hard-codes them in a case table in fir_datapath.sv
    and does not read the file. Whether the table matches the file was not checked in this handover.
- about: fifo_sim_model
  text: The benches use the behavioural stand-ins in rtl/xilinx_sim_stubs.sv for the XPM FIFOs, the CDC cells, USR_ACCESSE2
    and the MMCM. USR_ACCESSE2 returns 0 there, so BUILD reads 0 in simulation. The real XPM models were not simulated.
- about: bram_prediction
  text: The synthesis gate found 0 BRAM tiles against a predicted 2 to 4. The FIFOs may have been mapped to other memory,
    or the FIFO depth was reduced. The architecture also names xpm_cdc_array_single, which fir_core.sv does not use. Check
    this before anything else in synthesis.
- about: assumption_defaults
  text: All 8 interview questions were defaulted with nobody answering. The defaults set the register map, output FIFO stall,
    the reprogram reset model, the CLEAR over RUN priority, the LED meanings and the RUN-while-BUSY behaviour. All are in
    the RTL as described.
