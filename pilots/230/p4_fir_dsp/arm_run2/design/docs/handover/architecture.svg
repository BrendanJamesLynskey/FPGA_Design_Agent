<svg xmlns="http://www.w3.org/2000/svg" width="640" height="352" viewBox="0 0 640 352" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="352" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">fir32_top</text><text x="170" y="43">Thin top: jtag_bus, MMCM (clk25 x10 -&gt; clk_dp 250 MHz), reset synch</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">jtag_bus</text><text x="170" y="77">Supplied BSCANE2 USER4 register bus in clk25 domain, used unchanged (d</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">fir_core</text><text x="170" y="111">Register map, CTRL/IN_PUSH/OUT_POP/STATUS decode, LEDs (BUSY, heartbea</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">fir_engine</text><text x="170" y="145">Run control: reads input FIFO, feeds filter, writes output FIFO, count</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">fir_filter</text><text x="170" y="179">32-tap symmetric FIR: 16 pre-adders, 16 DSP48E2 multipliers, adder tre</text><rect x="8" y="196" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="213">in_fifo</text><text x="170" y="213">1024x16 xpm_fifo_async, clk25 write, clk_dp read</text><rect x="8" y="230" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="247">out_fifo</text><text x="170" y="247">1024x16 xpm_fifo_async, clk_dp write, clk25 read</text><text x="8" y="274" font-weight="bold">Interfaces</text><text x="8" y="292">jtag_bus - fir_core: host_reg (simple)</text><text x="8" y="310">fir_core - fir_engine: fifo_in (simple)</text><text x="8" y="328">fir_engine - fir_core: fifo_out (simple)</text></svg>
