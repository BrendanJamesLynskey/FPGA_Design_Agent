resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: 'The map in registers.map: ID 0x000 RO, BUILD 0x004 RO, SCRATCH 0x008 RW,
    CTRL 0x010 RW, IN_PUSH 0x014 WO, OUT_POP 0x018 RO, STATUS 0x01C RO, SAT_COUNT
    0x020 RO, SAMPLES_DONE 0x024 RO, all 32 bits wide, reset 0 except ID.'
  status: defaulted
  by: default
  default_reason: The request lists offsets, but the map is confirmed here because
    the host script depends on it.
  risk: high
- question: Which pin or bus signal gives the design reset, and is it only the jtag_bus
    rst?
  answer: Use jtag_bus rst only, synchronised into clk_dp.
  status: defaulted
  by: default
  default_reason: Request gives no board reset button.
  risk: high
- question: What happens when RUN is written while BUSY?
  answer: Ignored.
  status: defaulted
  by: default
  default_reason: Request does not define it.
  risk: high
- question: What if the output FIFO lacks room for all queued inputs at RUN?
  answer: Process only as many samples as free output space; the rest stay in the
    input FIFO.
  status: defaulted
  by: default
  default_reason: Avoids losing results and keeps chunked results identical.
  risk: medium
- question: Does CLEAR written while BUSY abort the run?
  answer: Yes, abort and clear everything.
  status: defaulted
  by: default
  default_reason: Request says CLEAR empties everything.
  risk: medium
- question: Are CTRL bits read back as 0 and does writing both bits at once do CLEAR
    first then RUN?
  answer: CTRL reads 0; CLEAR wins and RUN is dropped when both are set.
  status: defaulted
  by: default
  default_reason: Self-clearing bits and no stated priority.
  risk: medium
- question: Does writing IN_PUSH or reading OUT_POP while BUSY have defined behaviour?
  answer: Push accepted into the FIFO while busy (processed in a later RUN or the
    same run if still draining); pops are allowed.
  status: defaulted
  by: default
  default_reason: Request is silent.
  risk: medium
- question: What do the LEDs show?
  answer: led[0]=BUSY, led[1]=heartbeat from clk25.
  status: defaulted
  by: default
  default_reason: Request names LEDs but gives no function.
  risk: medium
- question: Do SAT_COUNT and SAMPLES_DONE wrap at 32 bits?
  answer: Wrap at 2^32.
  status: defaulted
  by: default
  default_reason: Not stated.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
