name: fir32_sym
title: 32-tap symmetric FIR low-pass filter with FIFOs, JTAG register bus
board: kr260
part: xck26-sfvc784-2LV-c
top: fir32_top
clocks:
- name: clk25
  pin_role: board 25 MHz clock (pin C3)
  freq_mhz: 25
  use: register bus clock (clk of jtag_bus), FIFO host side, MMCM input
- name: clk_dp
  freq_mhz: 250
  use: datapath clock generated by an MMCM from clk25 (multiply 10), target 250 MHz
    or faster
reset:
  name: rst
  source: rst output of data/jtag_bus.sv (held for a few clocks at start), synchronised
    into clk_dp
  polarity: active high
  synchronous: true
parameters:
  TAPS: 32
  UNIQUE_COEFFS: 16
  DATA_WIDTH: 16
  COEFF_WIDTH: 16
  FIFO_DEPTH: 1024
  ROUND_CONST: 16384
  SHIFT: 15
  MMCM_MULT: 10
  MMCM_DIV: 1
  DESIGN_ID: 546570241
ports:
- name: clk25
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
behaviour:
  filter:
  - y[n] = saturate16((sum over k=0..31 of h[k]*x[n-k] + 0x4000) >>> 15), arithmetic
    shift.
  - The sum is exact (at least 35 bits), no intermediate rounding.
  - Samples before the first are 0.
  - Coefficients are read from data/coeffs.hex, tap 0 first, 16-bit signed Q1.15,
    symmetric h[k]=h[31-k].
  - 'Symmetry used: pre-add x[n-k]+x[n-31+k] for k=0..15, then 16 multipliers on DSP
    slices.'
  - Saturation clamps to -32768..32767; an output that was clamped increments SAT_COUNT.
  - One sample accepted per datapath clock.
  fifo_run:
  - IN_PUSH writes the low 16 bits into the input FIFO (1024 deep); ignored when full.
  - RUN processes every sample in the input FIFO in order and pushes results to the
    output FIFO (1024 deep).
  - BUSY is 1 from RUN until the last result is in the output FIFO.
  - Filter history persists between runs until CLEAR.
  - OUT_POP read returns 0x80000000 | y for the oldest output and removes it, or 0
    when empty.
  - CLEAR empties both FIFOs, zeroes the filter history, SAT_COUNT and SAMPLES_DONE.
  host_bus:
  - 'Register port from jtag_bus.sv (used unchanged) in the clk25 domain: h_we, h_re,
    h_addr[11:0], h_wdata, h_rdata.'
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - Registers cross between clk25 and clk_dp through CDC (async FIFOs and synchronised
    pulses).
  board:
  - sfp_tx_disable is driven 1 at all times; no GT channel used.
  - BUILD reads USR_ACCESSE2.
  - led[1:0] show BUSY on led[0] and heartbeat on led[1].
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546570241
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 CLEAR self-clearing; 1 RUN self-clearing
  - offset: 20
    name: IN_PUSH
    access: WO
    reset: 0
    bits: 15:0 sample
  - offset: 24
    name: OUT_POP
    access: RO
    reset: 0
    bits: 31 valid; 15:0 data; read pops
  - offset: 28
    name: STATUS
    access: RO
    reset: 0
    bits: 0 BUSY; 15:4 input count; 31:20 output count
  - offset: 32
    name: SAT_COUNT
    access: RO
    reset: 0
    bits: 31:0 saturated outputs since CLEAR
  - offset: 36
    name: SAMPLES_DONE
    access: RO
    reset: 0
    bits: 31:0 samples processed since CLEAR
timing:
  clock_target: clk_dp 250 MHz or faster, WNS >= 0 after implementation
  throughput: 1 sample per clk_dp cycle
  latency:
    read_data: h_rdata valid within 2 clk25 cycles of h_re
    write: effect 1 clk25 cycle after h_we
    filter_pipeline: fixed pipeline depth, proposed under 12 clk_dp cycles from sample
      read to output write
resources_expected:
  dsp48e2: 16
  bram: 2 to 4 (two 1024x16 FIFOs, 18Kb each)
  lut: under 1500
  ff: under 2500
assumptions:
- text: Coefficients are symmetric as the request says, so 16 multipliers suffice.
  reason: Request states symmetry and asks to halve the multipliers.
- text: Part is xck26-sfvc784-2LV-c.
  reason: Standard K26 SOM part on the KR260.
- text: Data files are not visible to me; their content is taken as described.
  reason: data/ was not readable when writing this spec.
- text: Registers 0x00C and other gaps read 0 and ignore writes.
  reason: Request says unmapped addresses read 0.
- text: FIFO counts reach 1024, needing 12 bits in the count fields.
  reason: Bits 15:4 and 31:20 are 12 bits wide.
open_questions: []
