    to them change nothing. CTRL and IN_PUSH read back 0.
- about: ctrl_priority
  text: When CTRL is written with both bits set, CLEAR wins and RUN is dropped. RUN is also ignored while BUSY, with an
    empty input FIFO, or while the input FIFO is still being reset after CLEAR.
- about: read_latency
  text: In fir_core.sv h_rdata is registered on the clk25 edge after h_re, so it is valid one clk25 cycle after h_re and
    holds until the next h_re; this is within the spec's 2 cycles. Only the benches checked it, since the formal checks
    were not run.
- about: pop_side_effect
  text: Reading OUT_POP returns the head word and pops it one cycle later (pop_v); a read while the output FIFO is empty
    returns 0. Reading any other address returns with no pop.
- about: counters_snapshot
  text: SAT_COUNT and SAMPLES_DONE are read from a snapshot refreshed continuously through a CDC handshake, so they can
    lag the datapath by several clock cycles. BUSY includes a 300-cycle clk_dp tail so the counters settle before BUSY drops.
- about: filter_latency
  text: fir_filter.sv has a 9-stage pipeline from accepted sample to output, within the spec's proposed bound of under 12
    clk_dp cycles. It accepts one sample per clk_dp cycle, but fir_engine.sv waits a 15-cycle hold at RUN start, so a run
    is not gapless from the start. This was not measured.
- about: full_output
  text: If the output FIFO lacks room, a RUN processes only as many samples as fit and leaves the rest in the input FIFO
    (fir_engine.sv room check).
- about: fifo_sim_model
  text: The simulated FIFO, MMCM and CDC models in xilinx_sim_stubs.sv are simplified stand-ins; the clock in simulation
    is not 10 times clk25.
- about: build_word
  text: BUILD reads 0 in simulation because the USR_ACCESSE2 stub returns 0; the real value exists only in hardware.
- about: constraints_failure
  text: The failing path is bus_rst_q_reg (clk25) to the PRE pin of the first xpm_cdc_async_rst stage in fir_core.sv; the
    synchroniser is asynchronous-set and the path is timed against the 40 ns clock with negative slack even without net
    delay, per the stage record above.
- about: coverage_disagreement
  text: Functional bins and cover properties both read 0 of 0 with the V3 coverage run not completed; no coverage figure
    is available.
- about: clk_dp_constraint
  text: design.xdc creates only the 40.00 ns clock on clk25; clk_dp (250 MHz, the spec's target) comes from the MMCM in
    fir32_top.sv and has no constraint of its own, so the 250 MHz target is not stated in the XDC.
- about: coefficients_source
  text: The spec says coefficients are read from data/coeffs.hex; fir_filter.sv holds them as constants, so the file is
    not read at build time.
