# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: p4_fir_dsp
title: 32-tap symmetric FIR low-pass filter with FIFOs and JTAG register bus
kind: agent-run
produced_by: agent
summary: The design is a 32-tap symmetric FIR filter (Q1.15 coefficients, 16 DSP multipliers) on the KR260. Samples are
  pushed through a JTAG register bus into a 1024-deep input FIFO. A RUN command filters them at 250 MHz (MMCM from the 25
  MHz board clock) into a 1024-deep output FIFO. The run passed clarify, board planning and RTL creation, but stopped at
  the constraints stage because a synthesis timing path from the reset register to the clk_dp reset synchroniser failed.
  Synthesis, implementation and later stages did not run. Simulation verification reached V2 of V3, and no hardware result
  exists.
scope_not:
- Not a runtime-programmable filter; the 16 unique coefficients are fixed constants in fir_filter.sv.
- Not a transceiver design; sfp_tx_disable is held at 1 and no GT channel is used.
- No streaming interface; all data moves through the JTAG register bus and the two FIFOs.
- Not built, timed or tested on hardware in this run.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: fir32_top
clocks:
- name: clk25
  mhz: 25.0
  source: runs/20261126-191008-4141/p4_fir_dsp/design.xdc
resets:
- name: rst (bus_rst)
  active: high
  note: Generated in fir32_top.sv from a 4-clock power-on shift register and the MMCM LOCKED flag, registered on clk25.
    It resets the clk25 registers and, through xpm_cdc_async_rst, the clk_dp datapath. The design has no external reset
    pin.
interfaces:
- name: clk25
  type: input, 1 bit, 25 MHz board clock, pin C3 (LVCMOS18)
  note: Register bus clock, FIFO host side and MMCM input; constrained at 40.00 ns in design.xdc.
- name: led
  type: output, 2 bits, pins F8 (led[0]) and E8 (led[1]), LVCMOS18
  note: led[0] is BUSY; led[1] is hb[23], a heartbeat counted on clk25.
- name: sfp_tx_disable
  type: output, 1 bit, pin Y10, LVCMOS33
  note: Constant 1 (laser off).
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546570241
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 scratch
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 CLEAR self-clearing; 1 RUN self-clearing
- offset: 20
  name: IN_PUSH
  access: WO
  reset: 0
  bits: 15:0 sample
- offset: 24
  name: OUT_POP
  access: RO
  reset: 0
  bits: 31 valid; 15:0 data; read pops
- offset: 28
  name: STATUS
  access: RO
  reset: 0
  bits: 0 BUSY; 15:4 input count; 31:20 output count
- offset: 32
  name: SAT_COUNT
  access: RO
  reset: 0
  bits: 31:0 saturated outputs since CLEAR
- offset: 36
  name: SAMPLES_DONE
  access: RO
  reset: 0
  bits: 31:0 samples processed since CLEAR
parameters:
- name: TAPS
  value: 32
  legal: fixed at 32
  note: The history, pre-add and tree in fir_filter.sv are written for 32 taps; the parameter is not wired into the RTL.
- name: UNIQUE_COEFFS
  value: 16
  legal: fixed at 16 (TAPS/2)
  note: One DSP multiplier per unique coefficient.
- name: DATA_WIDTH
  value: 16
  legal: fixed at 16
  note: Signed sample and output width.
- name: COEFF_WIDTH
  value: 16
  legal: fixed at 16
  note: Signed Q1.15 coefficients.
- name: FIFO_DEPTH
  value: 1024
  legal: fixed at 1024
  note: The RTL instantiates FIFOs of write depth 2048 and limits the input count to 1024 in logic; the output limit comes
    from the room check in fir_engine.sv.
- name: ROUND_CONST
  value: 16384
  legal: fixed at 16384 (0x4000)
  note: Added before the arithmetic shift.
- name: SHIFT
  value: 15
  legal: fixed at 15
  note: Arithmetic right shift before saturation.
- name: MMCM_MULT
  value: 10
  legal: fixed at 10
  note: The RTL uses CLKFBOUT_MULT_F 40.0 and CLKOUT0_DIVIDE_F 4.0 for 250 MHz (VCO 1000 MHz); the spec's multiply of 10
    gives the same clk_dp.
- name: MMCM_DIV
  value: 1
  legal: fixed at 1
  note: Maps to DIVCLK_DIVIDE 1.
- name: DESIGN_ID
  value: 546570241
  legal: fixed (0x20940001)
  note: Returned by the ID register.
