- question: This design has no reset input. Is every reset a reconfiguration of the FPGA (the device is reprogrammed, so
    every register starts from its initial value), or does something restart the running design (then it needs a reset input)?
  risk: high
  used: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram): registers get initial values, control state
    included, and the design has no reset input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  how: 'defaulted: nobody answered'
  reason: 'With no reset input, a register can start only from its initial value, which the FPGA loads at configuration
    (owner, 2026-11-26: particularly useful for designs whose every reset reprograms the device). A design that must restart
    while running needs a reset input and resets its control state; the two models are checked by different rules (STD-INIT-02).'
- question: What if the output FIFO lacks room for all queued inputs at RUN?
  risk: medium
  used: Process only as many samples as free output space; the rest stay in the input FIFO.
  how: 'defaulted: nobody answered'
  reason: Avoids losing results and keeps chunked results identical.
