<svg xmlns="http://www.w3.org/2000/svg" width="640" height="402" viewBox="0 0 640 402" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="402" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">fir32_top</text><text x="170" y="43">thin top; instantiates jtag_bus, reset generator, MMCM, fir32_core, dr</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">jtag_bus</text><text x="170" y="77">supplied BSCANE2 USER4 register bus (data/jtag_bus.sv, unchanged), clk</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">reset_gen</text><text x="170" y="111">16-cycle power-on counter held until MMCM locked; active-high rst on c</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">reset_sync</text><text x="170" y="145">xpm_cdc_async_rst producing synchronised active-high reset for clk_dp</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">fir32_core</text><text x="170" y="179">register map (ID, BUILD, SCRATCH, CTRL, IN_PUSH, OUT_POP, STATUS, SAT_</text><rect x="8" y="196" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="213">in_fifo</text><text x="170" y="213">1024x16 xpm_fifo_async, clk_25 write, clk_dp read</text><rect x="8" y="230" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="247">out_fifo</text><text x="170" y="247">1024x16 xpm_fifo_async, clk_dp write, clk_25 read</text><rect x="8" y="264" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="281">fir_datapath</text><text x="170" y="281">32-tap symmetric FIR, 16 pre-add + DSP48E2 multiplies, round, shift 15</text><rect x="8" y="298" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="315">ctrl_cdc</text><text x="170" y="315">run/clear command and busy/counter status crossings between domains</text><text x="8" y="342" font-weight="bold">Interfaces</text><text x="8" y="360">jtag_bus - fir32_core: host_regs (simple)</text><text x="8" y="378">fir32_core - fir32_top: led_pins (gpio)</text></svg>
