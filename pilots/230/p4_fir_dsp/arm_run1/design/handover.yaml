  text: 'throughput not measured: the run measured no throughput'
- about: coefficients
  text: The coefficients are literals in rtl/fir_datapath.sv, not read from data/coeffs.hex via $readmemh as spec.yaml and
    ARCHITECTURE.md say. This run did not check that they match the file.
- about: filter_latency
  text: Counting the RTL, the datapath takes 11 clk_dp cycles from v_in to v_out (rtl/fir_datapath.sv). Reads of the input
    memory add one more cycle, and results reach the host through the handshake CDC. No total latency was measured.
- about: clock_ratio
  text: ARCHITECTURE.md describes the MMCM as VCO 1000 MHz with x40 and divide 4, and the RTL sets CLKFBOUT_MULT_F 40.0
    and CLKOUT0_DIVIDE_F 4.0. spec.yaml calls it 25 MHz x 10. The RTL gives 250 MHz.
- about: cdc_style
  text: spec.yaml and ARCHITECTURE.md describe async FIFOs. The RTL uses dual-clock xpm_memory_sdpram blocks plus xpm_cdc_handshake
    for commands and done messages (rtl/fir32_core.sv), and the CDC structure and injection checks have no result.
- about: reset_style
  text: spec.yaml describes a reset port with polarity and sync_to, but the top level has no reset input and the interview
    chose the reprogram model. In the RTL, rst is generated internally and used synchronously on clk_25, and clk_dp logic
    uses a synchronised copy.
- about: reset_timing
  text: The post-synthesis timing report shows a negative setup slack from u_rst/rst_reg to the clk_dp reset synchroniser's
    first flop (-0.477 ns), which no placement can close. This is the open failure at rtl-design-creation.
- about: run_semantics
  text: RUN is ignored while BUSY and when CLEAR is also written in the same write (CLEAR has priority). RUN is also ignored
    if n_calc is 0. The batch is min(input count, free output space), and leftover samples stay in the input FIFO.
- about: clear_while_busy
  text: CLEAR aborts the run, empties both FIFOs, zeroes counters and the sticky LED, and sends a clear message to clk_dp,
    which drops samples in flight and zeroes history.
- about: unmapped_access
  text: Reads of any unmapped address return 0 and writes to unmapped addresses do nothing. Write-only IN_PUSH reads 0,
    and CTRL reads 0 because there is no read case for it.
- about: read_side_effects
  text: Reading OUT_POP at 0x018 pops the oldest entry only when the output count is non-zero; an empty read returns 0 with
    bit 31 clear. Only a read pops.
- about: counters
  text: SAT_COUNT and SAMPLES_DONE are 32-bit and wrap. They are updated when a run finishes, not per sample, so they can
    lag the output FIFO count.
- about: simulation_stubs
