- question: What happens if IN_PUSH is written while BUSY?
  risk: high
  used: The push is accepted if the FIFO is not full, and it is not part of the running batch.
  how: 'defaulted: nobody answered'
  reason: RUN processes what is in the FIFO at the RUN time, and the request does not define later pushes.
- question: What happens if the output FIFO would overflow during RUN?
  risk: high
  used: Not possible when the output FIFO is empty at RUN. RUN is limited to the free output space, and leftover input stays
    in the input FIFO.
  how: 'defaulted: nobody answered'
  reason: The request sizes both FIFOs at 1024 but does not say what happens when outputs were not drained.
- question: What happens if CLEAR is written while BUSY?
  risk: high
  used: CLEAR aborts the run and empties everything.
  how: 'defaulted: nobody answered'
  reason: Not defined by the request.
- question: What is the exact filter latency in clocks?
  risk: high
  used: Any fixed pipeline depth, since only results through the FIFO are observed.
  how: 'defaulted: nobody answered'
