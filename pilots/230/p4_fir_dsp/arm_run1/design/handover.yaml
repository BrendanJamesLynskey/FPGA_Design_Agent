schema: fda-handover/1
id: p4_fir_dsp
title: 32-tap symmetric FIR low-pass filter with JTAG register bus (KR260)
kind: agent-run
produced_by: agent
summary: The design is a 32-tap symmetric FIR filter on the KR260. Samples are pushed through a JTAG register bus into an
  input memory, a RUN command streams them through a pre-add plus 16-multiplier datapath on a 250 MHz clock made by an MMCM
  from the 25 MHz board clock, and the saturated 16-bit results are read back from an output memory. The run stopped at
  rtl-design-creation, which did not pass its gates (a setup path on the reset synchroniser in the post-synthesis timing
  report). Verification reached V2 of V3, and no routed build, power or hardware result exists. The specification and architecture
  were approved automatically, with no human review.
scope_not:
- Not a general FIR; the 32 coefficients are fixed at build time and symmetric.
- No transceiver is used and sfp_tx_disable is held at 1.
- No AXI or other bus is offered; the only host path is the JTAG register bus (data/jtag_bus.sv).
- Not verified on hardware, and no timing closure at 250 MHz is shown.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: fir32_top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261126-152242-3f5c/p4_fir_dsp/design.xdc
resets:
- name: rst
  active: high
  note: Internal only, there is no reset port. rtl/reset_gen.sv holds it for RESET_CYCLES clk_25 cycles after the MMCM locks.
    rtl/reset_sync.sv (xpm_cdc_async_rst) derives the clk_dp reset, which asserts asynchronously and releases synchronously.
    Registers have initial values (reprogram model).
interfaces:
- name: clk_25
  type: input clock, 25 MHz, pin C3 LVCMOS18
  note: Board clock; the MMCM makes clk_dp (250 MHz) from it in rtl/fir32_top.sv.
- name: led
  type: output, 2 bits, F8 and E8 LVCMOS18
  note: led[0] is BUSY and led[1] is sticky saturation since CLEAR (rtl/fir32_core.sv).
- name: sfp_tx_disable
  type: output, 1 bit, Y10 LVCMOS33
  note: Constant 1.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546570241
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 read back value
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 CLEAR self-clearing, 1 RUN self-clearing
- offset: 20
  name: IN_PUSH
  access: WO
  reset: 0
  bits: 15:0 sample
- offset: 24
  name: OUT_POP
  access: RO
  reset: 0
  bits: 31 valid, 15:0 oldest output, read pops
- offset: 28
  name: STATUS
  access: RO
  reset: 0
  bits: 0 BUSY, 15:4 input FIFO count, 31:20 output FIFO count
- offset: 32
  name: SAT_COUNT
  access: RO
  reset: 0
  bits: 31:0 saturated outputs since CLEAR
- offset: 36
  name: SAMPLES_DONE
  access: RO
  reset: 0
  bits: 31:0 samples processed since CLEAR
parameters:
- name: NUM_TAPS
  value: 32
  legal: fixed at 32
  note: Not a module parameter in the RTL; the datapath is hard-wired to 32 taps.
- name: UNIQUE_COEFFS
  value: 16
  legal: fixed at 16
  note: Equals NUM_TAPS/2; the coefficients are literals in rtl/fir_datapath.sv.
- name: DATA_WIDTH
  value: 16
  legal: fixed at 16
  note: Signed samples; the register map and FIFOs assume 16 bits.
- name: COEFF_WIDTH
  value: 16
  legal: fixed at 16
  note: Signed coefficients.
- name: FIFO_DEPTH
  value: 1024
  legal: fixed at 1024
  note: Both sample memories use 10-bit addresses, and the 11-bit counts assume 1024.
- name: ROUND_CONST
  value: 16384
  legal: fixed at 16384 (0x4000)
  note: Added before the shift in rtl/fir_datapath.sv.
- name: SHIFT
  value: 15
  legal: fixed at 15
  note: Arithmetic shift right.
- name: RESET_CYCLES
  value: 16
  legal: 1 to 31 (5-bit counter)
  note: Set on reset_gen in rtl/fir32_top.sv. Reset stays active until the MMCM is locked and then for this many clk_25
    cycles.
- name: DESIGN_ID
  value: 546570241
  legal: any 32-bit value
  note: Equals 0x20940001; read from the ID register.
