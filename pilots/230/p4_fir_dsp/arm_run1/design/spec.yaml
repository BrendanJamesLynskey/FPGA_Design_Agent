name: fir32_sym
title: 'P4: 32-tap symmetric FIR low-pass filter with JTAG register bus'
board: kr260
part: xck26-sfvc784-2LV-c
top: fir32_top
interfaces:
  axi_lite_profile: house
clocks:
- name: clk_25
  freq_hz: 25000000
  pin: C3
  role: board clock, drives jtag_bus and the register block
- name: clk_dp
  freq_hz: 250000000
  role: datapath clock from an MMCM fed by clk_25 (25 MHz x 10)
reset:
  name: rst
  polarity: active_high
  sync_to: clk_25
  description: Power-on reset counter held for 16 clk_25 cycles and until the MMCM
    is locked, passed to jtag_bus and the logic. A synchronised copy resets clk_dp
    logic.
parameters:
  NUM_TAPS: 32
  UNIQUE_COEFFS: 16
  DATA_WIDTH: 16
  COEFF_WIDTH: 16
  FIFO_DEPTH: 1024
  ROUND_CONST: 16384
  SHIFT: 15
  RESET_CYCLES: 16
  DESIGN_ID: 546570241
ports:
- name: clk_25
  direction: input
  width: 1
  role: board 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  role: SFP+ tx disable, constant 1 (laser off)
behaviour:
  filter:
  - y[n] = saturate16((sum over k=0..31 of h[k]*x[n-k] + 0x4000) >>> 15), sum exact,
    arithmetic shift, saturation to -32768..32767.
  - x[n-k] is 0 for samples before the first one after CLEAR.
  - Coefficients are read from data/coeffs.hex (tap 0 first), symmetric h[k]=h[31-k].
    Pre-add x[n-k]+x[n-31+k] then 16 multiplies on DSP slices.
  - The datapath accepts one sample per clk_dp cycle.
  run:
  - Writing CTRL bit 1 sets BUSY and processes every sample in the input FIFO at that
    moment, in order, pushing results to the output FIFO.
  - BUSY clears after the last result is in the output FIFO.
  - Filter history persists between RUNs and is cleared only by CLEAR.
  - A RUN with an empty input FIFO completes with no change.
  fifos:
  - Input FIFO of 1024 samples of 16 bits, filled by IN_PUSH writes (low 16 bits),
    a push when full is ignored.
  - Output FIFO of 1024 samples of 16 bits, drained by OUT_POP reads, the read removes
    the oldest entry.
  - Input FIFO count never exceeds 1024 so the 12-bit STATUS field holds it.
  counters:
  - SAT_COUNT increments for each output that was clipped to the 16-bit range.
  - SAMPLES_DONE increments for each sample processed.
  - Both clear on CLEAR.
  bus:
  - 'Register port from data/jtag_bus.sv (used unchanged): h_we, h_re, h_addr[11:0],
    h_wdata, h_rdata in the clk_25 domain.'
  - Write takes effect the clock after h_we. h_rdata shows the addressed register
    within 2 clocks of h_re and holds.
  - Unmapped addresses read 0 and ignore writes.
  - BUILD reads the USR_ACCESSE2 word.
  - Register block crosses to clk_dp through CDC (async FIFOs or handshakes).
  io:
  - sfp_tx_disable driven to 1 at all times, no GT channel used.
  - led[0] shows BUSY, led[1] shows the heartbeat or sticky saturation (see open questions).
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546570241
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 read back value
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 CLEAR self-clearing, 1 RUN self-clearing
  - offset: 20
    name: IN_PUSH
    access: WO
    reset: 0
    bits: 15:0 sample
  - offset: 24
    name: OUT_POP
    access: RO
    reset: 0
    bits: 31 valid, 15:0 oldest output, read pops
  - offset: 28
    name: STATUS
    access: RO
    reset: 0
    bits: 0 BUSY, 15:4 input FIFO count, 31:20 output FIFO count
  - offset: 32
    name: SAT_COUNT
    access: RO
    reset: 0
    bits: 31:0 saturated outputs since CLEAR
  - offset: 36
    name: SAMPLES_DONE
    access: RO
    reset: 0
    bits: 31:0 samples processed since CLEAR
timing:
  datapath_clock: 250 MHz or faster, 4.0 ns period, one sample per clk_dp cycle
  register_clock: 25 MHz
  latency:
    filter_pipeline: fixed number of clk_dp cycles from sample in to result out, set
      by the design, to be recorded in the model
    read_response: h_rdata valid within 2 clk_25 cycles of h_re
    write_effect: 1 clk_25 cycle after h_we
resources_expected:
  dsp48e2: 16 to 20 (16 multipliers, extra for pre-add or accumulate)
  bram: 2 to 4 RAMB36 (two 1024x16 FIFOs)
  lut: under 3000
  ff: under 4000
  mmcm: 1
  gt: 0
