assumptions:
- assumption: The part is xck26-sfvc784-2LV-c.
  reason: This is the K26 SOM device on the KR260.
- assumption: jtag_bus receives clk_25 and the register block runs at 25 MHz.
  reason: The request lets the register bus stay on its own clock.
- assumption: Coefficients are embedded or read via $readmemh from data/coeffs.hex
    at build time.
  reason: The request allows both. The file could not be inspected here, so the values
    are taken as given.
- assumption: Output of the sum uses a 38-bit or wider accumulator.
  reason: 32 products of 16x16 bits need at least 16+16+5 bits to stay exact.
- assumption: A RUN written while BUSY is ignored.
  reason: The request does not define it and ignoring keeps the batch well defined.
open_questions: []
resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: 'The map in registers.map: ID 0x000, BUILD 0x004, SCRATCH 0x008, CTRL 0x010,
    IN_PUSH 0x014, OUT_POP 0x018, STATUS 0x01C, SAT_COUNT 0x020, SAMPLES_DONE 0x024,
    all 32 bits, resets 0 except ID.'
  status: defaulted
  by: default
  default_reason: The request lists these offsets in its tables, so they are taken
    as given and confirmed here.
  risk: high
- question: What do the two LEDs show?
  answer: led[0] = BUSY, led[1] = 1 once any output has saturated since CLEAR.
  status: defaulted
  by: default
  default_reason: The request names the LEDs but gives no function.
  risk: medium
- question: What does a read of SAT_COUNT or SAMPLES_DONE do on overflow?
  answer: 32-bit counters that wrap.
  status: defaulted
  by: default
  default_reason: Not stated, and wrap is unreachable in practice.
  risk: high
- question: What happens if IN_PUSH is written while BUSY?
  answer: The push is accepted if the FIFO is not full, and it is not part of the
    running batch.
  status: defaulted
  by: default
  default_reason: RUN processes what is in the FIFO at the RUN time, and the request
    does not define later pushes.
  risk: high
- question: What happens if the output FIFO would overflow during RUN?
  answer: Not possible when the output FIFO is empty at RUN. RUN is limited to the
    free output space, and leftover input stays in the input FIFO.
  status: defaulted
  by: default
  default_reason: The request sizes both FIFOs at 1024 but does not say what happens
    when outputs were not drained.
  risk: high
- question: What happens if CLEAR is written while BUSY?
  answer: CLEAR aborts the run and empties everything.
  status: defaulted
  by: default
  default_reason: Not defined by the request.
  risk: high
- question: What is the exact filter latency in clocks?
  answer: Any fixed pipeline depth, since only results through the FIFO are observed.
  status: defaulted
  by: default
  default_reason: The request checks output values only.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
