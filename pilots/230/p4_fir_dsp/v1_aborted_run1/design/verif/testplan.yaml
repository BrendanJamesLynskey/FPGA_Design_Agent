- {requirement: REQ-36, method: formal, replaced_by: simulation, artefact: fir_bench.test_registers, why: SymbiYosys is not installed so unmapped writes are checked in simulation.}
- {requirement: REQ-28, method: formal, replaced_by: simulation, artefact: fir_bench.test_sfp_disable, why: SymbiYosys is not installed so the constant output is checked in simulation.}
