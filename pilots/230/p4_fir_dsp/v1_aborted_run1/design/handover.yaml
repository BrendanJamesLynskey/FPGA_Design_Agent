schema: fda-handover/1
id: p4_fir_dsp
title: 32-tap symmetric FIR filter with FIFOs on a JTAG register bus (KR260)
kind: agent-run
produced_by: agent
summary: The design is a 32-tap symmetric Q1.15 FIR low-pass filter. Samples are pushed into an input FIFO over a JTAG register
  bus on clk25, a RUN command filters them on a 250 MHz MMCM clock using 16 multipliers, and the results are read back from
  an output FIFO. The run got as far as the constraints stage, whose gates failed; synthesis and later stages did not run.
  Verification reached V2 of V3, and no resource, timing or power number was measured.
scope_not:
- Not a runtime-programmable filter; the coefficients are fixed, symmetric and written into fir_dsp.sv.
- Not a streaming core; samples go in only through the IN_PUSH register and come out through OUT_POP.
- No transceiver is used (sfp_tx_disable is a constant output) and no hardware result exists for this design.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: fir32_top
clocks:
- name: clk25
  mhz: 25.0
  source: runs/20261126-105159-268e/p4_fir_dsp/design.xdc
resets:
- name: rst (internal, no pin)
  active: high
  note: fir32_top.sv builds rst25 from a 16-clock power-on counter and the MMCM lock, registered in clk25, and feeds it
    to jtag_bus and fir32_core (synchronous in clk25). It enters clk_dsp through xpm_cdc_async_rst, which asserts asynchronously.
    The spec says the design has no reset input and uses reprogram; the RTL has this internal reset.
interfaces:
- name: clk25
  type: input, 25 MHz board clock, pin C3 LVCMOS18
  note: Constrained with a 40.00 ns period named sys_clk_pin in design.xdc.
- name: led
  type: output [1:0], F8 (led[0]) and E8 (led[1]), LVCMOS18
  note: fir32_top.sv drives led[0] with BUSY and led[1] with the synchronised MMCM lock. The XDC has a false path to both.
- name: sfp_tx_disable
  type: output, pin Y10, LVCMOS33
  note: Constant 1 (fir32_core.sv). The XDC has a false path to it.
- name: h_we, h_re, h_addr, h_wdata, h_rdata
  type: internal register port to jtag_bus (no pins), 1, 1, 12, 32 and 32 bits
  note: Runs on clk25. These signals are internal nets between jtag_bus and fir32_core, not top-level ports in fir32_top.sv.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546570241
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 scratch
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 CLEAR self-clearing, 1 RUN self-clearing, 31:2 reserved 0
- offset: 20
  name: IN_PUSH
  access: WO
  reset: 0
  bits: 15:0 sample pushed
- offset: 24
  name: OUT_POP
  access: RO
  reset: 0
  bits: 31 valid, 15:0 oldest output, read pops; 0 when empty
- offset: 28
  name: STATUS
  access: RO
  reset: 0
  bits: 0 BUSY, 15:4 input FIFO count, 31:20 output FIFO count, others 0
- offset: 32
  name: SAT_COUNT
  access: RO
  reset: 0
  bits: 31:0 saturated outputs since CLEAR
- offset: 36
  name: SAMPLES_DONE
  access: RO
  reset: 0
  bits: 31:0 samples processed since CLEAR
parameters:
- name: N_TAPS
  value: 32
  legal: fixed at 32
  note: Not a Verilog parameter; the tap count is fixed in fir_dsp.sv, with taps paired by symmetry.
- name: N_MULT
  value: 16
  legal: fixed at 16 (N_TAPS/2)
  note: Not a Verilog parameter; fir_dsp.sv has 16 multipliers. The spec expects them in DSP slices, which no build has
    confirmed.
- name: DATA_WIDTH
  value: 16
  legal: fixed at 16
  note: Signed input and output sample width, hard-coded in the RTL.
- name: COEF_WIDTH
  value: 16
  legal: fixed at 16
  note: Signed Q1.15 coefficients; the 16 values are written into the coef function in fir_dsp.sv.
- name: ACC_WIDTH
  value: 38
  legal: fixed at 38
  note: Exact sum plus the rounding constant, no intermediate rounding.
- name: FIFO_DEPTH
  value: 1024
  legal: fixed at 1024
  note: Both FIFOs are distributed-memory xpm_fifo_async with depth 1024, not BRAM as the spec expected.
- name: SHIFT
  value: 15
  legal: fixed at 15
  note: Arithmetic right shift before saturation.
- name: ROUND_CONST
  value: 16384
  legal: fixed at 16384 (2^(SHIFT-1))
  note: Added to the sum before the shift.
- name: DESIGN_ID
  value: 546570241
  legal: fixed at 0x20940001
  note: Read from the ID register; a localparam in fir32_core.sv.
- name: SFP_TX_DISABLE_VALUE
  value: 1
  legal: fixed at 1
  note: sfp_tx_disable is tied to 1 and there is no parameter.
