- question: What happens if RUN is written while BUSY is 1?
  risk: high
  used: The write is ignored.
  how: 'defaulted: nobody answered'
  reason: The request does not say, ignoring keeps the sample order simple.
- question: What happens when IN_PUSH is written while BUSY is 1?
  risk: high
  used: The sample is accepted if the FIFO is not full, and is processed by the next RUN.
  how: 'defaulted: nobody answered'
  reason: The request says RUN processes what is in the FIFO, later pushes are not specified.
- question: Do SAT_COUNT and SAMPLES_DONE wrap or saturate at 2^32?
  risk: high
  used: They wrap.
  how: 'defaulted: nobody answered'
  reason: Not specified, 2^32 samples cannot occur in a test.
- question: Is the 250 MHz clock a target or may a faster one such as 300 MHz be used?
  risk: high
  used: 250 MHz exactly from the MMCM.
  how: 'defaulted: nobody answered'
  reason: Request says 250 MHz or faster, 250 is an integer multiple of 25.
- question: Does the BUILD register read 0 in simulation?
  risk: high
  used: Yes, the USR_ACCESSE2 primitive is replaced by a 0 constant (or a testbench word).
  how: 'defaulted: nobody answered'
  reason: The primitive is not simulated.
- question: This design has no reset input. Is every reset a reconfiguration of the FPGA (the device is reprogrammed, so
    every register starts from its initial value), or does something restart the running design (then it needs a reset input)?
  risk: high
  used: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram): registers get initial values, control state
    included, and the design has no reset input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  how: 'defaulted: nobody answered'
  reason: 'With no reset input, a register can start only from its initial value, which the FPGA loads at configuration
    (owner, 2026-11-26: particularly useful for designs whose every reset reprograms the device). A design that must restart
    while running needs a reset input and resets its control state; the two models are checked by different rules (STD-INIT-02).'
- question: What happens when the output FIFO is full during a run?
  risk: medium
  used: 'The run is limited so it never overflows: processing stalls until the output FIFO has room (no result is lost).'
  how: 'defaulted: nobody answered'
  reason: The request does not say, and bit-exact comparison forbids dropped results.
- question: What do led[1:0] show?
  risk: medium
