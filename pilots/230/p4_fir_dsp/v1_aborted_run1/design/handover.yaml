  text: 'resources not measured: no current Vivado build of this design has been recorded'
- about: timing
  text: 'timing not measured: no current Vivado build of this design has been recorded'
- about: power
  text: 'power not measured: no current Vivado build of this design has been recorded'
- about: latency
  text: 'latency not measured: the run measured no latency; the spec''s latency promise is checked only by the benches'
- about: throughput
  text: 'throughput not measured: the run measured no throughput'
- about: coverage_vs_cover
  text: The V3 record shows functional bins 0/0 and cover properties at 0.0 while line and toggle coverage were not measured,
    so these results say nothing about hit bins. Compare the cover results with the functional coverage before any new stimulus.
- about: reset_model
  text: The spec says the design has no reset input and every reset is a reprogram. The RTL has an internal active-high
    rst (fir32_top.sv, a power-on counter plus MMCM lock) and clears state on it. Spec.yaml also names a reset "rst" with
    a port-like description, which is not a pin.
- about: reset_failing_path
  text: The failing constraints gate reports a setup path from rst25_reg to the PRE pin of the xpm_cdc_async_rst flops in
    u_rst_dsp (timing_summary_synth.rpt), and an overridden exception on usr_cclk. design.xdc has no clock for the USR_ACCESSE2
    CFGCLK domain. Neither is fixed.
- about: build_register
  text: BUILD reads 0 in simulation because the USR_ACCESSE2 stub in xilinx_sim_stubs.sv returns 0. In fir32_core.sv it
    passes through a 2-stage xpm_cdc_array_single with a source clock tied to 0.
- about: reset_values
  text: On rst, fir32_core.sv clears scratch, the counters, h_rdata and the push buffer to 0. ID reads 0x20940001 whatever
    the reset state.
- about: unmapped_access
  text: In fir32_core.sv a read of an unmapped address returns 0 and a write to one changes nothing. Writes to ID, BUILD,
    STATUS, OUT_POP, SAT_COUNT and SAMPLES_DONE have no effect. Reads of IN_PUSH and CTRL return 0 (default branch).
- about: ctrl_priority
  text: 'A CTRL write with bit 0 set runs CLEAR only; bit 1 (RUN) is ignored in that write. RUN is also ignored while BUSY
    is 1 or when the input FIFO is empty. CLEAR is not instant: it resets the input FIFO for 4 clocks and holds OUT_POP
    and the STATUS output count at 0 for 8 clk25 clocks, and the output FIFO is reset for 16 clk_dsp clocks. OUT_POP reads
    0 and does not pop during this window.'
- about: out_pop_read
  text: OUT_POP pops only on an h_re when the FIFO is not empty and not in reset. h_rdata is registered, so it shows the
    value on the clock after h_re (one clk25 cycle), within the spec's limit of 2. It holds until the next h_re.
- about: in_push_buffer
  text: The IN_PUSH writes are accepted when STATUS-visible input count (FIFO plus a 4-entry holding buffer) is below 1024,
    otherwise ignored. The holding buffer covers an FIFO reset or busy window. STATUS input count is the sum of the FIFO
    count and the buffer.
- about: busy_sample_push
  text: Pushes while BUSY are accepted and wait for the next RUN, since RUN takes only the count present at the start. The
    assumption was defaulted; no one confirmed it.
- about: counters_wrap
  text: SAT_COUNT and SAMPLES_DONE are 32-bit and wrap. They reach clk25 by a 64-bit handshake sent only when a run ends,
    so they are stale during a run.
- about: filter_latency
  text: 'Counted from fir_dsp.sv: history register, pre-add, multiply, 4-way sum, 2-way sum, final sum and shift/saturate
    give out_valid 6 clk_dsp cycles after in_valid, plus 1 clock for the history register, so about 7 stages. The spec promised
    about 10 to 12. The run measured none of this.'
- about: fifo_memory
  text: Both FIFOs are FIFO_MEMORY_TYPE distributed in fir32_core.sv; the spec expected BRAM (2 BRAM36). Resource predictions
    in ARCHITECTURE.md do not match this.
- about: mmcm_math
  text: The ARCHITECTURE.md clock plan text is garbled; fir32_top.sv sets CLKFBOUT_MULT_F 40 and CLKOUT0_DIVIDE_F 4 (VCO
    1000 MHz, output 250 MHz). design.xdc defines only the clk25 clock; the MMCM output is auto-derived.
- about: led_order
  text: ARCHITECTURE.md says led[1] is MMCM locked and led[0] is BUSY; fir32_top.sv drives led = {locked25, busy}, which
    matches. fir32_core.sv drives its own led as {1, busy25}, which the top ignores except for bit 0.
- about: sim_stubs
  text: In simulation the MMCM stub outputs a constant 0 clock (CLKOUT0 = 0) in xilinx_sim_stubs.sv, so the benches must
    drive clk_dsp another way. How the benches do this was not checked here.
- about: unseen_inputs
  text: spec.yaml says data/jtag_bus.sv and data/coeffs.hex were not visible when the spec was written. The coefficients
    in fir_dsp.sv are inlined; whether they match data/coeffs.hex was not checked.
