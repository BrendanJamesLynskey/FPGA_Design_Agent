resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: 'The map given in spec.md: ID 0x000, BUILD 0x004, SCRATCH 0x008, CTRL 0x010,
    IN_PUSH 0x014, OUT_POP 0x018, STATUS 0x01C, SAT_COUNT 0x020, SAMPLES_DONE 0x024,
    all 32 bits, resets 0 except ID.'
  status: defaulted
  by: default
  default_reason: The request gives offsets in tables, confirm they are final.
  risk: high
- question: What happens if RUN is written while BUSY is 1?
  answer: The write is ignored.
  status: defaulted
  by: default
  default_reason: The request does not say, ignoring keeps the sample order simple.
  risk: high
- question: What happens when the output FIFO is full during a run?
  answer: 'The run is limited so it never overflows: processing stalls until the output
    FIFO has room (no result is lost).'
  status: defaulted
  by: default
  default_reason: The request does not say, and bit-exact comparison forbids dropped
    results.
  risk: medium
- question: What happens when IN_PUSH is written while BUSY is 1?
  answer: The sample is accepted if the FIFO is not full, and is processed by the
    next RUN.
  status: defaulted
  by: default
  default_reason: The request says RUN processes what is in the FIFO, later pushes
    are not specified.
  risk: high
- question: Do SAT_COUNT and SAMPLES_DONE wrap or saturate at 2^32?
  answer: They wrap.
  status: defaulted
  by: default
  default_reason: Not specified, 2^32 samples cannot occur in a test.
  risk: high
- question: What do led[1:0] show?
  answer: led[0] = BUSY, led[1] = MMCM locked.
  status: defaulted
  by: default
  default_reason: The request does not give a function.
  risk: medium
- question: Is the 250 MHz clock a target or may a faster one such as 300 MHz be used?
  answer: 250 MHz exactly from the MMCM.
  status: defaulted
  by: default
  default_reason: Request says 250 MHz or faster, 250 is an integer multiple of 25.
  risk: high
- question: Does the BUILD register read 0 in simulation?
  answer: Yes, the USR_ACCESSE2 primitive is replaced by a 0 constant (or a testbench
    word).
  status: defaulted
  by: default
  default_reason: The primitive is not simulated.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
