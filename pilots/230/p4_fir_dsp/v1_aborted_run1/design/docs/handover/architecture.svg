<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="300" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">jtag_bus</text><text x="170" y="43">BSCANE2 USER4 register bus master</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">fir32_top</text><text x="170" y="77">thin top; instantiates jtag_bus</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">fir32_core</text><text x="170" y="111">register map</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">fir_dsp</text><text x="170" y="145">32-tap symmetric FIR</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">in_fifo</text><text x="170" y="179">1024x16 input FIFO clk25 to clk_dsp (xpm_fifo_async)</text><rect x="8" y="196" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="213">out_fifo</text><text x="170" y="213">1024x16 output FIFO clk_dsp to clk25 (xpm_fifo_async)</text><text x="8" y="240" font-weight="bold">Interfaces</text><text x="8" y="258">jtag_bus - fir32_core: regport (simple)</text><text x="8" y="276">fir32_top - fir32_core: sfp_ctl (gpio)</text></svg>
