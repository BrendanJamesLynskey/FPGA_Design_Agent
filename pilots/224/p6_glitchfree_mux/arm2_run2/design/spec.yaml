name: p6_clkmux
title: Glitch-free clock multiplexer with self-checking muxed domain, controlled over
  JTAG register bus
board: kr260
part: xck26-sfvc784-2LV-c
top: p6_clkmux_top
clocks:
- name: clk
  role: C3 25 MHz free-running clock; register bus, clock A, gate timer
  freq_mhz: 25
- name: clk_b_ref
  role: SFP+ MGTREFCLK0 156.25 MHz differential GT reference clock via IBUFDS_GTE4,
    divided by B_DIV in BUFG_GT to give clock B
  freq_mhz: 156.25
- name: clk_mux
  role: output of BUFGCTRL choosing clock A or clock B; drives the muxed domain
  freq_mhz: 25 or 156.25/B_DIV
reset:
  name: rst
  polarity: active high
  description: Internal power-on reset, held for 8 clk cycles at start and given to
    the jtag_bus module; synchronised into the muxed domain
  sync: synchronous to clk
parameters:
  DESIGN_ID: 546701313
  B_DIV: 1
  GATE_LEN_DEFAULT: 25000000
  GATE_LEN_BITS: 32
  RST_HOLD_CYCLES: 8
  ADDR_WIDTH: 12
ports:
- name: clk
  direction: in
  width: 1
  board_pin_role: C3 25 MHz clock
- name: gtref_p
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 P
- name: gtref_n
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 N
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ TX_DISABLE, constant 1
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
behaviour:
  register_port:
  - Uses data/jtag_bus.sv unchanged, clocked by clk; design side is h_we, h_re, h_addr[11:0],
    h_wdata[31:0], h_rdata[31:0].
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - Writes to RO registers are ignored.
  common_registers:
  - ID at 0x000 reads 0x20960001.
  - BUILD at 0x004 reads USR_ACCESSE2 word.
  - SCRATCH at 0x008 is 32-bit read/write, reset 0.
  mux:
  - SEL bit 0 selects clock A (0) or clock B (1); reset 0.
  - A BUFGCTRL glitch-free mux switches between clock A and clock B.
  - SWITCHING is 1 from a change of SEL until the mux output has taken the new clock.
  - ACTIVE_SEL is the clock actually driving the muxed domain, synchronised to clk.
  - SWITCH_COUNT increments once per completed change of the active clock; writing
    the same SEL value does not count.
  - A write to SEL during SWITCHING is held until the change completes then applied
    (latest value wins).
  - B_DIV reads the constant divide of clock B.
  - sfp_tx_disable is driven to 1 at all times; no GT transceiver channel is used.
  muxed_domain:
  - A free-running 32-bit binary counter and a Gray-coded twin advance every clk_mux
    cycle.
  - Every clk_mux cycle the Gray twin decoded is compared with the binary counter;
    a mismatch adds 1 to the error count.
  - Every clk_mux cycle the counter is checked to equal previous value plus 1; a failure
    adds 1 to the error count.
  - MUX_ERRS reads the error count, saturating at 0xFFFFFFFF, synchronised to clk.
  - SNAPSHOT write latches the low 32 bits of the counter into MUX_COUNT using a safe
    clock-domain crossing.
  frequency:
  - FREQ_CTRL START begins a gate of GATE_LEN clk cycles; START self-clears.
  - BUSY is 1 during the gate; DONE is set at gate end and cleared by a new START.
  - FREQ_COUNT is the number of rising edges of clk_mux in the gate.
  - START while BUSY is ignored.
  leds:
  - led[0] shows ACTIVE_SEL; led[1] shows MUX_ERRS nonzero.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546701313
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 data
  - offset: 16
    name: SEL
    access: RW
    reset: 0
    bits: 0 select (0 clock A, 1 clock B)
  - offset: 20
    name: STATUS
    access: RO
    reset: 0
    bits: 0 SWITCHING, 1 ACTIVE_SEL
  - offset: 24
    name: B_DIV
    access: RO
    reset: 1
    bits: 3:0 divide 1 to 8
  - offset: 28
    name: GATE_LEN
    access: RW
    reset: 25000000
    bits: 31:0 gate length in C3 cycles
  - offset: 32
    name: FREQ_CTRL
    access: RW
    reset: 0
    bits: 0 START self-clearing
  - offset: 36
    name: FREQ_STATUS
    access: RO
    reset: 0
    bits: 0 BUSY, 1 DONE
  - offset: 40
    name: FREQ_COUNT
    access: RO
    reset: 0
    bits: 31:0 edges in last gate
  - offset: 44
    name: MUX_ERRS
    access: RO
    reset: 0
    bits: 31:0 error count
  - offset: 48
    name: MUX_COUNT
    access: RO
    reset: 0
    bits: 31:0 counter low 32 bits at last SNAPSHOT
  - offset: 52
    name: SWITCH_COUNT
    access: RO
    reset: 0
    bits: 31:0 switches carried out
  - offset: 56
    name: SNAPSHOT
    access: WO
    reset: 0
    bits: any write latches MUX_COUNT
timing:
  gate_cycles: GATE_LEN clk cycles; default 25,000,000 = 1 s at 25 MHz
  read_latency_clks: 2
  latency:
    register_read: h_rdata valid within 2 clk of h_re and held
    register_write: effective 1 clk after h_we
    switch: bounded by a few cycles of each clock (BUFGCTRL); ACTIVE_SEL follows after
      CDC synchroniser
  constraints:
  - clk 25 MHz (40 ns); clk_b_ref 156.25 MHz (6.4 ns); clk_mux paths treated as asynchronous
    to clk with set_clock_groups; CDC via synchronisers or handshakes.
resources_expected:
  luts: < 600
  ffs: < 800
  bufgctrl: 1
  bufg_gt: 1
  ibufds_gte4: 1
  bram: 0
  dsp: 0
  gt_channels: 0
assumptions:
- text: clk (C3 25 MHz) drives jtag_bus and clock A is the same net
  reason: request names C3 as both free-running clk and clock A
- text: Power-on reset generated internally
  reason: no reset pin is named; the request says hold rst a few clocks at start
- text: data/jtag_bus.sv is not simulated; the register port is tested directly
  reason: request says it contains Xilinx primitives
- text: MUX_ERRS saturates rather than wraps
  reason: a wrap to zero could hide errors
- text: Both clocks keep running during switches
  reason: BUFGCTRL glitch-free switching needs both clocks present
open_questions: []
