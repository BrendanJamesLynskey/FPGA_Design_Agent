resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: 'The map in registers.map: 0x000 ID RO, 0x004 BUILD RO, 0x008 SCRATCH RW,
    0x010 SEL RW, 0x014 STATUS RO, 0x018 B_DIV RO, 0x01C GATE_LEN RW (reset 25000000),
    0x020 FREQ_CTRL RW, 0x024 FREQ_STATUS RO, 0x028 FREQ_COUNT RO, 0x02C MUX_ERRS
    RO, 0x030 MUX_COUNT RO, 0x034 SWITCH_COUNT RO, 0x038 SNAPSHOT WO; all 32 bit,
    reset 0 unless stated'
  status: defaulted
  by: default
  default_reason: the request gives a table, taken as given; confirming it before
    the map is frozen
- question: What B_DIV is wanted?
  answer: 1 (156.25 MHz, fixed at build time)
  status: defaulted
  by: default
  default_reason: request says 1 to 8 as suits the device; 1 is the simplest
- question: What happens to a SEL write while SWITCHING?
  answer: held and applied after the current change completes; latest value wins
  status: defaulted
  by: default
  default_reason: the request does not say; this keeps the mux safe
- question: Does SWITCH_COUNT count a write of the same SEL value?
  answer: no, only real changes of the active clock
  status: defaulted
  by: default
  default_reason: the check says it equals the number of real changes
- question: What do the LEDs show?
  answer: led[0] = ACTIVE_SEL, led[1] = MUX_ERRS nonzero
  status: defaulted
  by: default
  default_reason: request does not assign them
- question: What is the BUILD value in simulation?
  answer: a testbench-set constant, as USR_ACCESSE2 reads 0 in simulation
  status: defaulted
  by: default
  default_reason: primitive is not modelled
- question: Is GATE_LEN 0 allowed, and what does a change during a gate do?
  answer: 0 is treated as 1 cycle; GATE_LEN is sampled at START
  status: defaulted
  by: default
  default_reason: request leaves it open
- question: Does FREQ_COUNT keep counting across a clock switch within a gate?
  answer: yes, it counts edges of whatever clk_mux is running
  status: defaulted
  by: default
  default_reason: request defines it as edges of the muxed clock
