schema: fpga-design-agent/testplan/v0
design: p6_glitchfree_mux
spec: spec.yaml
model: model.py
bench:
  modules: [p6_bench]
  dir: tests
checkers: verif/checkers
formal_dir: verif/formal
thresholds:
  seeds_min: 3
  functional_bins_pct: 100
  cover_properties_pct: 100
  line_pct: 90
  toggle_pct: 60
  mutation_score_pct: 80
waivers:
  code_coverage: []
  functional_bins: []
  cover_properties: []
