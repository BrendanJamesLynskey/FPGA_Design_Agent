schema: fda-handover/1
id: p6_glitchfree_mux
title: Glitch-free clock multiplexer with self-checking muxed domain on the KR260
kind: agent-run
produced_by: agent
summary: The design switches a BUFGCTRL clock mux between the 25 MHz board clock (clock A) and the SFP+ 156.25 MHz GT reference
  clock divided by B_DIV (clock B). A counter with a Gray-coded twin runs on the muxed clock and counts its own errors.
  A JTAG register bus controls the select, a frequency gate, error and switch counters and a counter snapshot. The run stopped
  at rtl-design-creation, which failed its design-standards gate; no constraints, synthesis or implementation stage ran.
  Verification reached V2 of V3 and no board result exists.
scope_not:
- Not a transceiver design; no GT channel is used and sfp_tx_disable is held at 1.
- Not proven on hardware, and no resource, timing or power figure exists for it.
- Not a clock-failure tolerant mux; both clocks must keep running during a switch.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p6_clkmux_top
clocks:
- name: clk
  mhz: 25.0
  source: runs/20261126-011553-f268/p6_glitchfree_mux/design.xdc
- name: gtref_p
  mhz: 156.25
  source: runs/20261126-011553-f268/p6_glitchfree_mux/design.xdc
resets:
- name: rst
  active: high
  note: Internal power-on reset generated in rtl/p6_clkmux_top.sv from a counter with initial values (no reset pin), synchronous
    to clk. It reaches the muxed domain through xpm_cdc_async_rst (rtl/p6_clkmux_core.sv).
interfaces:
- name: clk
  type: input, 25 MHz board clock on pin C3 (LVCMOS18)
  note: Clock A, the register bus clock and the gate timer clock; design.xdc creates a 40 ns clock on it.
- name: gtref_p
  type: input, differential GT reference clock, positive leg
  note: Clock B source through IBUFDS_GTE4 and BUFG_GT; design.xdc creates a 6.4 ns clock on it but assigns no PACKAGE_PIN
    to it.
- name: gtref_n
  type: input, differential GT reference clock, negative leg
  note: No pin constraint in design.xdc; ARCHITECTURE.md says the pins are still to be resolved.
- name: sfp_tx_disable
  type: output, 1 bit on pin Y10 (LVCMOS33)
  note: Driven to 1 at all times.
- name: led
  type: output, 2 bits, F8 for led[0] and E8 for led[1] (LVCMOS18)
  note: led[0] is the synchronised ACTIVE_SEL; led[1] is set when the synchronised MUX_ERRS is nonzero.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546701313
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 data
- offset: 16
  name: SEL
  access: RW
  reset: 0
  bits: 0 select (0 clock A, 1 clock B)
- offset: 20
  name: STATUS
  access: RO
  reset: 0
  bits: 0 SWITCHING, 1 ACTIVE_SEL
- offset: 24
  name: B_DIV
  access: RO
  reset: 1
  bits: 3:0 divide 1 to 8
- offset: 28
  name: GATE_LEN
  access: RW
  reset: 25000000
  bits: 31:0 gate length in C3 cycles
- offset: 32
  name: FREQ_CTRL
  access: RW
  reset: 0
  bits: 0 START self-clearing
- offset: 36
  name: FREQ_STATUS
  access: RO
  reset: 0
  bits: 0 BUSY, 1 DONE
- offset: 40
  name: FREQ_COUNT
  access: RO
  reset: 0
  bits: 31:0 edges in last gate
- offset: 44
  name: MUX_ERRS
  access: RO
  reset: 0
  bits: 31:0 error count
- offset: 48
  name: MUX_COUNT
  access: RO
  reset: 0
  bits: 31:0 counter low 32 bits at last SNAPSHOT
- offset: 52
  name: SWITCH_COUNT
  access: RO
  reset: 0
  bits: 31:0 switches carried out
- offset: 56
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: any write latches MUX_COUNT
parameters:
- name: DESIGN_ID
  value: 546701313
  legal: any 32-bit value
  note: Read back at ID (0x000); 546701313 is 0x20960001.
- name: B_DIV
  value: 1
  legal: 1 to 8
  note: Fixed at build time; top feeds B_DIV-1 to the BUFG_GT DIV pin and B_DIV reads it back. Clock B is 156.25 MHz divided
    by B_DIV.
- name: GATE_LEN_DEFAULT
  value: 25000000
  legal: 1 to 4294967295 (0 acts as 1)
  note: 'Reset value of GATE_LEN in clk cycles; 25,000,000 is 1 s at 25 MHz. The benches ran at 300, so the spec''s value
    was not simulated. Spec timing: GATE_LEN clk cycles; default 25,000,000 = 1 s at 25 MHz'
- name: GATE_LEN_BITS
  value: 32
  legal: fixed at 32
  note: 'Width of GATE_LEN and FREQ_COUNT. It is in the spec but not a parameter of the RTL, which hard-codes 32 bits. Spec
    timing: GATE_LEN clk cycles; default 25,000,000 = 1 s at 25 MHz'
- name: RST_HOLD_CYCLES
  value: 8
  legal: fixed at 8
  note: Not a parameter in the RTL. The reset counter in rtl/p6_clkmux_top.sv is hard-coded to count to 8.
- name: ADDR_WIDTH
  value: 12
  legal: fixed at 12
  note: Width of h_addr from jtag_bus; hard-coded in the RTL.
