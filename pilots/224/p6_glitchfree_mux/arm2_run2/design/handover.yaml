  text: GATE_LEN_BITS, RST_HOLD_CYCLES and ADDR_WIDTH are listed as parameters in spec.yaml but are literals in the RTL,
    so they cannot be changed from the top level.
- about: reset_hold_length
  text: The reset counter in rtl/p6_clkmux_top.sv counts rst_cnt from 0 to 8 before releasing rst, so reset is held for
    about 9 clk cycles, not the 8 the spec states. The RTL is what was built.
- about: register_decode
  text: Unmapped addresses read 0 and ignore writes. Writes to RO registers are ignored. FREQ_CTRL reads 0 always. Reading
    SNAPSHOT (0x038) returns 0 (default arm).
- about: start_behaviour
  text: A START write is ignored while BUSY. GATE_LEN is sampled at START, and a value of 0 is treated as 1. The gate timer
    does not count down in the cycle of a START write.
- about: sel_during_switching
  text: A SEL write is stored in sel immediately, but the mux only follows after the current change completes (latest value
    wins). SWITCH_COUNT is incremented when a switch completes, after a minimum wait of 16 clk cycles (SW_MIN).
- about: read_latency
  text: In rtl/p6_clkmux_core.sv h_rdata is registered on h_re, so it is valid 1 clk after h_re and held until the next
    h_re. This is within the spec's 2 clk promise. The latency was checked only in simulation. A write takes effect 1 clk
    after h_we.
- about: build_register
  text: BUILD reads USR_ACCESSE2 only under SYNTHESIS; in simulation it reads 0.
- about: bufgctrl_sim_model
  text: In simulation BUFGCTRL and BUFG_GT are ideal stubs (rtl/xilinx_sim_stubs.sv), so glitch-free switching and the clock
    B divide are not exercised by the benches.
- about: cdc_finding
  text: The verification gate reports unsafe crossings on the xpm_cdc_gray bus u_err (MUX_ERRS), saying the macro's Max
    Delay Datapath Only exception is missing and that only an Asynch Clock Groups exception is present. design.xdc uses
    set_clock_groups, so it needs checking after a build. The cdc injection check is missing.
- about: gt_pins
  text: design.xdc has no PACKAGE_PIN for gtref_p or gtref_n, although the spec names SFP+ MGTREFCLK0. The pin assignment
    is unresolved.
- about: spec_disagrees_ids
  text: The spec requirement gaps for hardware proof (uart_tests) refer to a bring-up that was never run, and REQ-24 needs
    post_route timing that never ran.
- about: approval
  text: The specification and architecture were approved automatically with no human review; the interview oracle only answered
    the interview questions.
- about: coverage_disagreement
  text: Functional bins read 0 of 0 and cover properties 0.0 percent, and line, toggle and mutation figures were not measured,
    so coverage is unproven rather than shown.
