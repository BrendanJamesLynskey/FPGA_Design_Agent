- about: clock_port_name
  text: The spec and the top-level RTL call the 25 MHz port clk_c3, but design.xdc constrains a port named clk_25 (pin C3,
    40 ns). The names disagree, so the constraint would not match the RTL port as written.
- about: gtref_constraints
  text: design.xdc has no pin or clock constraint for gtref_p and gtref_n, although the spec gives a 156.25 MHz clock there.
    It also declares no asynchronous clock groups, which the spec assumes.
- about: bufgctrl_declaration
  text: The BUFGCTRL at p6_clkmux_core.sv:37 is not declared in architecture.yaml clock_muxes, and this is the failing standards
    gate (STD-CLK-01).
- about: cover_vs_functional
  text: Functional bins and cover properties both read 0.0 percent with 0 of 0 bins, so no bin or cover property was counted.
    Treat this as a measurement fault until the cover results are compared with the functional coverage.
- about: read_latency
  text: h_rdata is registered in the core on h_re, so it is valid one clk_c3 cycle after h_re (p6_clkmux_core.sv). The spec
    allows 2. The jtag_bus delay is not counted here, and the value is held until the next h_re.
- about: unmapped_access
  text: Reads of unmapped addresses return 0 (default of the read case). Writes to them are ignored. Offsets 0x00C, 0x03C
    and above are unmapped.
- about: fixed_zero_reads
  text: A read of FREQ_CTRL (0x020) returns 0, so START is never seen as 1. Writes to RO registers are ignored. A write
    to SNAPSHOT (0x038) copies the most recent hand-over word into MUX_COUNT, with any data. That word comes from a continuous
    handover, so it can be older than the write.
- about: freq_start_rules
  text: START is ignored while BUSY. GATE_LEN 0 is treated as 1 at START, and GATE_LEN writes apply at the next START. START
    clears DONE and FREQ_COUNT. DONE is set after the gate plus 12 settle clocks, so BUSY outlasts the gate.
- about: sel_write_priority
  text: A SEL write during SWITCHING simply overwrites sel_q, so the latest value wins. SWITCHING is sel_q != active, which
    also reads 1 after the BUFGCTRL has switched until the detector updates ACTIVE_SEL.
- about: active_sel_detection
  text: ACTIVE_SEL is inferred by counting toggles of a slow tap bit of the mux counter over 64-clock windows, and needs
    two consecutive agreeing windows. It assumes clock B is faster than clock A. At B_DIV values where clock B is not faster
    than 25 MHz, the detector would be wrong. It is not a direct read of BUFGCTRL state, so the switch latency is a multiple
    of 64 clk_c3 cycles.
- about: build_in_sim
  text: BUILD reads 0 in simulation because USR_ACCESSE2 exists only under SYNTHESIS. REQ-02 can be proved only on hardware.
- about: error_count
  text: MUX_ERRS saturates at 0xFFFFFFFF and clears only at reset. The checker skips its first mux_clk after reset (valid
    flag). The counter and Gray twin are not reset.
- about: led_mapping
  text: The LED mapping was a defaulted interview answer, not a requirement. led = {SWITCHING, ACTIVE_SEL}.
