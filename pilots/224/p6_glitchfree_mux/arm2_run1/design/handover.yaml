parameters:
- name: ID_VALUE
  value: 546701313
  legal: any 32-bit value
  note: Value read from the ID register (0x20960001).
- name: B_DIV
  value: 1
  legal: 1 to 8
  note: Divide applied to the GT reference by BUFG_GT and reported in B_DIV. At 1, clock B is 156.25 MHz.
- name: GATE_LEN_DEFAULT
  value: 25000000
  legal: 1 to 4294967295
  note: 'Reset value of GATE_LEN, 1 s at 25 MHz per the spec. The benches simulate 200 (test_p6_glitchfree_mux_rtl.py:32),
