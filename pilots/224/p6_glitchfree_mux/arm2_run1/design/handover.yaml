schema: fda-handover/1
id: p6_glitchfree_mux
title: P6 glitch-free clock multiplexer on the KR260
kind: agent-run
produced_by: agent
summary: The design selects between the 25 MHz board clock and the SFP+ MGTREFCLK0 reference (through IBUFDS_GTE4 and BUFG_GT)
  with a BUFGCTRL, and exposes control, status, a Gray-coded counter checker and a frequency gate through a JTAG register
  bus. The run stopped at the RTL stage, whose design-standards gate failed on the BUFGCTRL clock mux. Verification reached
  V2 of V3, no Vivado build passed its gates, and nothing was run on the board. The specification and architecture were
  accepted automatically, with no human review.
scope_not:
- Not a general clock manager. It has two inputs, one BUFGCTRL, and no PLL or MMCM.
- Does not use any GT transceiver channel; the GT reference buffer feeds only the mux.
- Not built, timed or run on hardware in this run; no resource, timing or power figure exists.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p6_clkmux_top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261125-203614-91c8/p6_glitchfree_mux/design.xdc
resets:
- name: rst
  active: high
  note: 'Internal power-on reset in p6_clkmux_top.sv: a synchronous counter in clk_c3, held for RST_HOLD_CYCLES clocks,
    with no reset pin. It is brought into mux_clk through xpm_cdc_async_rst.'
interfaces:
- name: clk_c3
  type: input, 25 MHz clock
  note: design.xdc names this port clk_25 on pin C3 (LVCMOS18) with a 40 ns clock, while spec.yaml and the RTL top use clk_c3.
- name: gtref_p / gtref_n
  type: input, differential reference clock, 156.25 MHz
  note: Spec role is SFP+ MGTREFCLK0; design.xdc has no pin or clock constraint for these ports.
- name: led
  type: output, 2 bits
  note: The RTL drives led[0] = ACTIVE_SEL and led[1] = SWITCHING. design.xdc places them on F8 and E8 (LVCMOS18).
- name: sfp_tx_disable
  type: output, 1 bit
  note: Constant 1. design.xdc puts it on Y10 (LVCMOS33).
