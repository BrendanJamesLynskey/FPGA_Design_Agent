- offset: 24
  name: B_DIV
  access: RO
  reset: 1
  bits: 3:0 divide 1 to 8
- offset: 28
  name: GATE_LEN
  access: RW
  reset: 25000000
  bits: 31:0 gate length in clk_c3 cycles
- offset: 32
  name: FREQ_CTRL
  access: RW
  reset: 0
  bits: 0 START self-clearing
- offset: 36
  name: FREQ_STATUS
  access: RO
  reset: 0
  bits: 0 BUSY, 1 DONE
- offset: 40
  name: FREQ_COUNT
  access: RO
  reset: 0
  bits: 31:0 edges in last gate
- offset: 44
  name: MUX_ERRS
  access: RO
  reset: 0
  bits: 31:0 error count
- offset: 48
