<svg xmlns="http://www.w3.org/2000/svg" width="640" height="266" viewBox="0 0 640 266" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="266" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">jtag_bus</text><text x="170" y="43">BSCANE2 USER4 register bus, gives h_we/h_re/h_addr/h_wdata/h_rdata in </text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">rst_gen</text><text x="170" y="77">power-on counter in clk_c3, holds rst high 16 clocks</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">p6_clkmux_core</text><text x="170" y="111">register map, SEL/STATUS, switch counter, frequency gate, LEDs</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">clk_mux</text><text x="170" y="145">IBUFDS_GTE4 + BUFG_GT (div B_DIV) and BUFGCTRL selecting clock A or B</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">mux_checker</text><text x="170" y="179">in mux_clk, binary counter, Gray twin, error counter, saturating</text><text x="8" y="206" font-weight="bold">Interfaces</text><text x="8" y="224">jtag_bus - p6_clkmux_core: regbus (simple)</text><text x="8" y="242">p6_clkmux_core - p6_clkmux_top: led_out (gpio)</text></svg>
