resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: The map in the request, as written in registers.map - ID 0x000 RO, BUILD
    0x004 RO, SCRATCH 0x008 RW, CTRL 0x010 RW, WORDS_W 0x014, WORDS_R 0x018, DATA_ERRS
    0x01C, OVERFLOWS 0x020, UNDERFLOWS 0x024, STALL_W 0x028, OCC_MAX 0x02C all RO,
    SNAPSHOT 0x030 WO, all 32 bits, reset 0 except ID.
  status: defaulted
  by: default
  default_reason: the request gives the offsets in tables, confirm they are final.
- question: Is the FIFO a first-word-fall-through or standard-read FIFO, and is full
    defined at 512 words?
  answer: Standard FIFO with registered read, full at 512 words, on one BRAM with
    10-bit Gray pointers.
  status: defaulted
  by: default
  default_reason: the request gives depth 512 but not the read mode.
- question: What does OCC_MAX measure and in which domain?
  answer: Fill measured in the writer domain from the write pointer and the synchronised
    read pointer, so it is a conservative upper bound.
  status: defaulted
  by: default
  default_reason: fill differs by domain and the request does not say.
- question: What happens to the reader when RUN returns to 0 while words are in the
    FIFO?
  answer: Writer stops, reader drains the remaining words and checks them, counters
    hold.
  status: defaulted
  by: default
  default_reason: stopping at once would flag false errors or leave stale words for
    the next run.
- question: Which bit does INJECT flip?
  answer: Bit 0 of the next word checked after INJECT reaches the reader domain.
  status: defaulted
  by: default
  default_reason: the request says one bit of one word without naming it.
- question: What do the two LEDs show?
  answer: led0 is RUN, led1 is set when any of DATA_ERRS, OVERFLOWS, UNDERFLOWS is
    non-zero.
  status: defaulted
  by: default
  default_reason: the request names the LEDs but gives no function.
- question: Is a CLEAR written while RUN is 1 ignored, and are the other CTRL bits
    written with it kept?
  answer: CLEAR is ignored while RUN is 1, other bits are still stored.
  status: defaulted
  by: default
  default_reason: request says CLEAR acts only while RUN is 0.
- question: Does a read of the counters without a prior SNAPSHOT return the last snapshot?
  answer: Yes, reads return the last latched values (0 after reset).
  status: defaulted
  by: default
  default_reason: the registers are marked snapshot and the request gives no live
    read path.
