name: p5_async_fifo_soak
title: 'P5: asynchronous FIFO soak (25 MHz writer, 156.25 MHz reader)'
board: kr260
part: xck26-sfvc784-2LV-c
top: p5_async_fifo_soak
clocks:
- name: clk_c3
  freq_mhz: 25
  role: writer clock and register-bus clock (C3 pin, free running)
  board_pin_role: C3 25 MHz oscillator
- name: clk_gt156
  freq_mhz: 156.25
  role: reader clock (SFP+ MGTREFCLK0 through a GT reference clock buffer, no GT channel)
  board_pin_role: SFP+ cage MGTREFCLK0 differential pair
reset:
  name: rst
  polarity: active high
  description: synchronous in clk_c3, held for a few clocks at start, re-synchronised
    into clk_gt156
  source: internal power-up reset generator (no reset pin)
parameters:
  FIFO_DEPTH_WORDS: 512
  DATA_WIDTH: 32
  PRBS_SEED: 2147483647
  DESIGN_ID: 546635777
  SLOW_READ_PERIOD_CYCLES: 8
  COUNTER_WIDTH: 32
  RESET_HOLD_CYCLES: 8
ports:
- name: clk_c3
  direction: in
  width: 1
  board_pin_role: C3 25 MHz clock
- name: gt_refclk_p
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 P
- name: gt_refclk_n
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 N
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ TX_DISABLE, constant 1
- name: h_we
  direction: internal_in
  width: 1
  board_pin_role: jtag_bus register port write pulse (clk_c3)
- name: h_re
  direction: internal_in
  width: 1
  board_pin_role: jtag_bus register port read pulse (clk_c3)
- name: h_addr
  direction: internal_in
  width: 12
  board_pin_role: jtag_bus byte address
- name: h_wdata
  direction: internal_in
  width: 32
  board_pin_role: jtag_bus write data
- name: h_rdata
  direction: internal_out
  width: 32
  board_pin_role: jtag_bus read data
behaviour:
  writer:
  - In clk_c3 domain, while RUN is 1 and the FIFO is not full, write one 32-bit PRBS-31
    word on every clock.
  - PRBS-31 uses x^31 + x^28 + 1, 32 new bits per word, seed 0x7FFFFFFF.
  - While RUN is 1 and the FIFO is full, the write is held off and STALL_W increments
    by 1 per held-off clock.
  - WORDS_W increments by 1 per word written.
  reader:
  - In clk_gt156 domain, read one word whenever the FIFO is not empty (every clock,
    or one in 8 clocks when SLOW_READ is 1).
  - Each word is compared with a local PRBS-31 copy started from the same seed when
    RUN begins.
  - WORDS_R increments per word read and checked, DATA_ERRS increments per mismatching
    word.
  - INJECT flips one bit of exactly one received word before the check, then self-clears.
  fault_counters:
  - OVERFLOWS counts writes attempted while full (must stay 0).
  - UNDERFLOWS counts reads attempted while empty (must stay 0).
  - OCC_MAX holds the highest FIFO fill seen, in words.
  - All counters are 32 bits and wrap.
  control:
  - CLEAR is self-clearing and is honoured only while RUN is 0, it zeroes counters
    and restarts both sequences from the seed.
  - INJECT is self-clearing.
  - A write to SNAPSHOT (0x030) latches all counters (0x014 to 0x02C) at one instant
    into holding registers, reads of those return the latched values.
  cdc:
  - Gray-coded pointers cross through two-flop synchronisers with ASYNC_REG, set_clock_groups
    or max-delay constraints cover them.
  - Control bits RUN, SLOW_READ, INJECT cross from clk_c3 to clk_gt156 through synchronisers
    or toggle handshakes.
  - Reader counters cross to clk_c3 for the snapshot through a handshake so that the
    values are coherent.
  host_interface:
  - Register port from data/jtag_bus.sv (unchanged) in clk_c3, unmapped addresses
    read 0 and ignore writes.
  - A write takes effect the clock after h_we, h_rdata shows the addressed register
    within 2 clocks of h_re and holds.
  - BUILD reads USR_ACCESSE2, SCRATCH reads back its written value.
  pins:
  - sfp_tx_disable is driven to 1 at all times, no GT channel is used.
  - led[1:0] indicate status (default led0 is RUN, led1 is error seen).
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546635777
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESS word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] scratch'
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] RUN, [1] SLOW_READ, [2] CLEAR self-clearing only while RUN=0, [3] INJECT
      self-clearing'
  - offset: 20
    name: WORDS_W
    access: RO
    reset: 0
    bits: '[31:0] words written (snapshot)'
  - offset: 24
    name: WORDS_R
    access: RO
    reset: 0
    bits: '[31:0] words read and checked (snapshot)'
  - offset: 28
    name: DATA_ERRS
    access: RO
    reset: 0
    bits: '[31:0] mismatching words (snapshot)'
  - offset: 32
    name: OVERFLOWS
    access: RO
    reset: 0
    bits: '[31:0] writes while full (snapshot)'
  - offset: 36
    name: UNDERFLOWS
    access: RO
    reset: 0
    bits: '[31:0] reads while empty (snapshot)'
  - offset: 40
    name: STALL_W
    access: RO
    reset: 0
    bits: '[31:0] writer clocks held off (snapshot)'
  - offset: 44
    name: OCC_MAX
    access: RO
    reset: 0
    bits: '[31:0] highest fill in words (snapshot)'
  - offset: 48
    name: SNAPSHOT
    access: WO
    reset: 0
    bits: any write latches 0x014 to 0x02C; reads 0
timing:
  writer_clock: 25 MHz, period 40 ns
  reader_clock: 156.25 MHz, period 6.4 ns
  slow_read_period: one read per 8 clk_gt156 clocks when SLOW_READ is 1
  expected_rates: WORDS_W grows 25e6 per second, WORDS_R grows 25e6 per second in
    steady state
  latency:
    h_rdata: within 2 clk_c3 clocks of h_re
    register_write: effective 1 clk_c3 clock after h_we
    fifo_cdc: about 2 to 4 destination clocks pointer synchronisation latency
resources_expected:
  lut: under 600
  ff: under 800
  bram36: 1 (512 x 32 FIFO, or 1 BRAM18 pair)
  dsp: 0
  gt_channels: 0
assumptions:
- text: Part is xck26-sfvc784-2LV-c.
  reason: standard K26 SOM device on the KR260.
- text: GT reference clock is received with an IBUFDS_GTE4 and its ODIV2 or a BUFG_GT
    output clocks the reader.
  reason: spec says at most the GT reference clock buffer is used and no transceiver
    channel.
- text: The two clocks are declared asynchronous clock groups in the XDC, with max-delay
    constraints on the Gray pointer crossings.
  reason: the clocks are unrelated and the request wants the CDC constraints visible.
- text: Writer rate is one word per clk_c3 clock, so the FIFO fills only when the
    reader is throttled.
  reason: reader at 156.25 MHz is faster than the writer at 25 MHz, so the FIFO normally
    stays near empty.
- text: jtag_bus.sv is used unchanged and not simulated, the register port is tested
    directly.
  reason: it contains Xilinx primitives, as stated in the request.
- text: Counters stop counting while RUN is 0.
  reason: a soak count should cover only the run period.
