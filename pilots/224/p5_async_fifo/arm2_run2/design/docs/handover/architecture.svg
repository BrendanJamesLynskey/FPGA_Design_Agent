<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="300" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">jtag_bus</text><text x="170" y="43">supplied BSCANE2 USER4 register bus, unchanged (data/jtag_bus.sv), clk</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">reset_gen</text><text x="170" y="77">power-up reset counter in clk_c3 (RESET_HOLD_CYCLES), xpm_cdc_async_rs</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">soak_core</text><text x="170" y="111">register map, control, writer PRBS-31, counters, snapshot, LEDs</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">soak_fifo</text><text x="170" y="145">512x32 xpm_fifo_async, one BRAM, Gray pointers inside the macro</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">soak_reader</text><text x="170" y="179">clk_gt156 reader, PRBS-31 checker, inject, read/underflow/occupancy co</text><rect x="8" y="196" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="213">gt_clk</text><text x="170" y="213">IBUFDS_GTE4 + BUFG_GT (ODIV2) giving the 156.25 MHz reader clock, no G</text><text x="8" y="240" font-weight="bold">Interfaces</text><text x="8" y="258">jtag_bus - soak_core: host_regs (simple)</text><text x="8" y="276">soak_core - soak_reader: fifo_data (simple)</text></svg>
