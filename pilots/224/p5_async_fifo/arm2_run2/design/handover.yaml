schema: fda-handover/1
id: p5_async_fifo
title: P5 asynchronous FIFO soak (25 MHz writer, 156.25 MHz reader)
kind: agent-run
produced_by: agent
summary: The design writes PRBS-31 words from a 25 MHz writer domain (clk_c3) into an asynchronous 32-bit FIFO and reads
  and checks them in a 156.25 MHz reader domain (clk_gt156, from the SFP+ MGTREFCLK0 buffer, no GT channel). Counters for
  words, errors, overflow, underflow, stalls and peak fill are read over the jtag_bus register port. The run reached V2
  of V3 in verification and stopped at the constraints stage, where the Vivado post-synthesis exception check failed on
  an invalid site name; no bitstream, timing, power or hardware result exists.
scope_not:
- Not a transceiver design. No GT channel is used, only the reference clock buffer, and SFP+ TX is held disabled.
- Not a throughput or latency measurement. Neither was measured in this run.
- Not hardware-verified. No board result is recorded.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p5_async_fifo_soak
clocks:
- name: clk_c3
  mhz: 25.0
  source: runs/20261125-233045-dfe1/p5_async_fifo/design.xdc
- name: gt_refclk_p
  mhz: 156.25
  source: runs/20261125-233045-dfe1/p5_async_fifo/design.xdc
resets:
- name: rst
  active: high
  note: Internal power-up generator in clk_c3 (rtl/p5_async_fifo_soak.sv), held for RESET_HOLD_CYCLES clocks, no pin. It
    reaches clk_gt156 through xpm_cdc_async_rst.
interfaces:
- name: clk_c3
  type: input clock, 25 MHz, pin C3 (LVCMOS18)
  note: Writer clock and register-bus clock.
- name: gt_refclk_p / gt_refclk_n
  type: differential input clock, SFP+ MGTREFCLK0, 156.25 MHz
  note: Enters an IBUFDS_GTE4; its ODIV2 output drives a BUFG_GT that clocks the reader.
- name: led[1:0]
  type: output, pins F8 and E8 (LVCMOS18)
  note: led[0] is RUN; led[1] is set when a snapshotted DATA_ERRS, OVERFLOWS or UNDERFLOWS is non-zero.
- name: sfp_tx_disable
  type: output, pin Y10 (LVCMOS33)
  note: Constant 1.
- name: h_we / h_re / h_addr / h_wdata / h_rdata
  type: internal register port (no pins), clk_c3
  note: In the top these ports are declared but the live port is wired internally to jtag_bus; h_we, h_re, h_addr and h_wdata
    are unused there.
