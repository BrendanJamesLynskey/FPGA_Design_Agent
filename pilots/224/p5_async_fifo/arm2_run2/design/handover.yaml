  text: 'throughput not measured: the run measured no throughput'
- about: fifo_depth
  text: soak_fifo.sv instantiates xpm_fifo_async with depth 512 passed in, but its file comment says 1024 x 32 in one RAMB36
    and the macro uses FIFO_MEMORY_TYPE distributed, while the spec and ARCHITECTURE.md say one BRAM. The 512-word claim
    (REQ-08) is not confirmed by a Vivado build.
- about: xdc_site
  text: design.xdc as built has LOC IBUFDS_GTE4_X0Y0 at line 21 (its comment names X0Y0), but the failing check quotes X0Y1
    as an invalid site name. The XDC and the check disagree; re-run to confirm which site Vivado accepts.
- about: spec_vs_rtl_registers
  text: The RTL read mux (soak_core.sv) returns 0 for unmapped addresses, including 0x030 SNAPSHOT, and writes to unmapped
    addresses change nothing. CTRL reads back only RUN and SLOW_READ; CLEAR and INJECT always read 0.
- about: clear_priority
  text: CLEAR is honoured only if written while RUN is 0 (clr_req = write to CTRL with bit 2, and not run). The same write
    can set RUN, but the test uses the old RUN value. CLEAR also holds the FIFO in reset for 8 clk_c3 clocks, and the writer
    is blocked meanwhile.
- about: counters_run_gated
  text: Stall, overflow and OCC_MAX counting is gated by RUN and by the FIFO not being in reset. The reader counts words
    read independently of RUN.
- about: snapshot_latency
  text: A write to 0x030 does not latch at once. The request is delayed about 50 clocks (64 for the first snapshot after
    reset) and aligned to an 8-clock grid, then crosses through a handshake, so the snapshot registers update tens of clocks
    after the write. Reading too soon returns the previous snapshot. The spec does not state this delay.
- about: read_latency
  text: h_rdata is registered in soak_core.sv, so it updates one clk_c3 clock after h_re, inside the spec's 2-clock promise,
    and holds until the next h_re. The jtag_bus latency was not counted here.
- about: build_stamp
  text: In simulation USR_ACCESSE2 is a stub returning 0, so BUILD is 0 in the benches; only hardware shows the real word.
