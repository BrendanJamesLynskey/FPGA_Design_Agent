  access: RO
  reset: 546635777
  bits: '[31:0] design ID'
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: '[31:0] USR_ACCESS word'
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: '[31:0] scratch'
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: '[0] RUN, [1] SLOW_READ, [2] CLEAR self-clearing only while RUN=0, [3] INJECT self-clearing'
- offset: 20
  name: WORDS_W
  access: RO
  reset: 0
  bits: '[31:0] words written (snapshot)'
- offset: 24
  name: WORDS_R
  access: RO
  reset: 0
  bits: '[31:0] words read and checked (snapshot)'
- offset: 28
  name: DATA_ERRS
  access: RO
  reset: 0
  bits: '[31:0] mismatching words (snapshot)'
- offset: 32
  name: OVERFLOWS
  access: RO
  reset: 0
  bits: '[31:0] writes while full (snapshot)'
- offset: 36
  name: UNDERFLOWS
  access: RO
  reset: 0
  bits: '[31:0] reads while empty (snapshot)'
- offset: 40
  name: STALL_W
  access: RO
  reset: 0
  bits: '[31:0] writer clocks held off (snapshot)'
- offset: 44
  name: OCC_MAX
  access: RO
  reset: 0
  bits: '[31:0] highest fill in words (snapshot)'
- offset: 48
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: any write latches 0x014 to 0x02C; reads 0
parameters:
- name: FIFO_DEPTH_WORDS
  value: 512
  legal: 512 only as built
  note: soak_core.sv instantiates soak_fifo with DEPTH 512, while soak_fifo.sv comments say 1024 words; see the fifo_depth
    gap. Not a top-level parameter.
- name: DATA_WIDTH
  value: 32
  legal: 32 only
  note: Fixed in the RTL, not a top-level parameter.
- name: PRBS_SEED
  value: 2147483647
  legal: non-zero 31-bit value
  note: Seed 0x7FFFFFFF for both writer and reader sequences. Default of soak_core.
- name: DESIGN_ID
  value: 546635777
  legal: any 32-bit value
  note: Read from register ID (0x20950001). Default of soak_core.
- name: SLOW_READ_PERIOD_CYCLES
  value: 8
  legal: 2 to 16 (the slow counter is 4 bits)
  note: 'One read per 8 clk_gt156 clocks when SLOW_READ is 1, as the spec''s timing section says. Passed to the reader as
    SLOW_PERIOD. Spec timing: one read per 8 clk_gt156 clocks when SLOW_READ is 1'
- name: COUNTER_WIDTH
  value: 32
  legal: 32 only
  note: Counters are fixed at 32 bits in the RTL and wrap; not a parameter.
- name: RESET_HOLD_CYCLES
  value: 8
  legal: 0 to 31 (5-bit hold counter)
  note: Power-up reset length in clk_c3 clocks.
