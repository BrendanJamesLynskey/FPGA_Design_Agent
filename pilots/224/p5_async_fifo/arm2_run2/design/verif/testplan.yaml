replan:
- requirement: REQ-18
  method: formal
  replaced_by: simulation
  artefact: bench_p5_async_fifo.test_slow_read_fill_and_stall
  why: SymbiYosys is not installed, so the no-overflow property is shown in simulation with the FIFO driven full, and by the hardware soak.
- requirement: REQ-19
  method: formal
  replaced_by: simulation
  artefact: bench_p5_async_fifo.test_slow_read_fill_and_stall
  why: SymbiYosys is not installed, so the no-underflow property is shown in simulation across fast and slow reads, and by the hardware soak.
- requirement: REQ-27
  method: formal
  replaced_by: simulation
  artefact: bench_p5_async_fifo.test_run_counters
  why: SymbiYosys is not installed, so pointer crossing is shown by error-free data transfer across both clocks in simulation, plus the CDC analysis.
