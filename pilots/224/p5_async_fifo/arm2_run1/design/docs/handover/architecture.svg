<svg xmlns="http://www.w3.org/2000/svg" width="640" height="248" viewBox="0 0 640 248" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="248" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">jtag_bus</text><text x="170" y="43">BSCANE2 USER4 register bus (supplied, unchanged), clk = clk_c3</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">rst_gen</text><text x="170" y="77">startup counter (&gt;= 8 clk_c3 cycles) and per-domain reset synchroni</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">fifo_core</text><text x="170" y="111">register core; map, control, snapshot, writer PRBS-31, reader PRBS-31 </text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">async_fifo</text><text x="170" y="145">512x32 asynchronous FIFO, xpm_fifo_async, 2-stage synchronisers, gray </text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">refclk_buf</text><text x="170" y="179">IBUFDS_GTE4 plus BUFG_GT giving the gt_refclk0 reader clock</text><text x="8" y="206" font-weight="bold">Interfaces</text><text x="8" y="224">jtag_bus - fifo_core: host_reg (simple)</text></svg>
