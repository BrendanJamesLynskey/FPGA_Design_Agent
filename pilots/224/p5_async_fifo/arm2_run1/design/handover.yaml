schema: fda-handover/1
id: p5_async_fifo
title: Asynchronous FIFO soak, 25 MHz writer to 156.25 MHz reader (KR260)
kind: agent-run
produced_by: agent
summary: The design streams a PRBS-31 sequence from a writer on the 25 MHz board clock through a 512-word asynchronous FIFO
  to a checker on the 156.25 MHz SFP+ reference clock. A JTAG register port starts and stops the run, injects a one-word
  error, and reads latched counters (words written and read, data errors, overflows, underflows, writer stalls, peak fill).
  The run reached simulation level V2 of V3 and stopped at the constraints stage after repeated failures, so no bitstream
  result, timing, or hardware result is available. The specification and architecture were approved automatically, with
  no human review.
scope_not:
- Not a transceiver design. Only the reference clock buffer is used, no GT channel is instantiated, and sfp_tx_disable is
  held at 1.
- Not hardware-proven. No bring-up result exists, and no timing or power figure is published for this run.
- Not a general-purpose FIFO IP. DATA_WIDTH is effectively fixed at 32, and the stored word is a 31-bit PRBS state with
  bit 31 always 0.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p5_async_fifo_soak
clocks:
- name: clk_c3
  mhz: 25.0
  source: runs/20261125-193550-9069/p5_async_fifo/design.xdc
- name: gt_refclk0_p
  mhz: 156.25
  source: runs/20261125-193550-9069/p5_async_fifo/design.xdc
resets:
- name: rst
  active: high
  note: There is no reset port. rst_gen.sv (clk_c3 domain) holds an internal synchronous reset for about 16 clk_c3 cycles
    after configuration (spec asks for at least 8) from a power-up-initialised counter. The reader domain gets it through
    xpm_cdc_async_rst (rst_sync.sv, 4 sync flops).
interfaces:
- name: clk_c3
  type: input clock, pin C3, LVCMOS18, period 40 ns (design.xdc)
  note: Writer domain, jtag_bus register port and reset generator.
- name: gt_refclk0_p
  type: differential clock input, 156.25 MHz, period 6.4 ns (design.xdc)
  note: Goes through IBUFDS_GTE4 and BUFG_GT (taken from the ODIV2 output) to the reader clock. design.xdc sets no PACKAGE_PIN
    for this pair.
- name: gt_refclk0_n
  type: differential clock input (complement of gt_refclk0_p)
  note: No pin constraint in design.xdc, same as gt_refclk0_p.
- name: sfp_tx_disable
  type: output, pin Y10, LVCMOS33
  note: Constant 1 in fifo_core (laser off).
- name: led
  type: output [1:0], pins F8 (led[0]) and E8 (led[1]), LVCMOS18
  note: led[0] is RUN. led[1] is the reader error flag (data mismatch or underflow) or the writer overflow flag.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546635777
  bits: '[31:0] design ID'
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: '[31:0] USR_ACCESSE2 word'
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: '[31:0] scratch'
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: '[0] RUN, [1] SLOW_READ, [2] CLEAR self-clearing only while RUN=0, [3] INJECT self-clearing'
- offset: 20
  name: WORDS_W
  access: RO
  reset: 0
  bits: '[31:0] words written (snapshot)'
- offset: 24
  name: WORDS_R
  access: RO
  reset: 0
  bits: '[31:0] words read and checked (snapshot)'
- offset: 28
  name: DATA_ERRS
  access: RO
  reset: 0
  bits: '[31:0] mismatching words (snapshot)'
- offset: 32
  name: OVERFLOWS
  access: RO
  reset: 0
  bits: '[31:0] writes while full (snapshot)'
- offset: 36
  name: UNDERFLOWS
  access: RO
  reset: 0
  bits: '[31:0] reads while empty (snapshot)'
- offset: 40
  name: STALL_W
  access: RO
  reset: 0
  bits: '[31:0] writer clocks held off by full (snapshot)'
- offset: 44
  name: OCC_MAX
  access: RO
  reset: 0
  bits: '[31:0] highest fill seen in words (snapshot)'
- offset: 48
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: any write latches 0x014 to 0x02C; reads 0
parameters:
- name: DEPTH
  value: 512
  legal: power of two; must equal 2 to the power ADDR_WIDTH
  note: FIFO depth in words. The FIFO is an xpm_fifo_async in distributed memory (LUTRAM), not block RAM, although the spec
    expected one RAMB36 or LUTRAM.
- name: DATA_WIDTH
  value: 32
  legal: only 32 works; the core writes {1 zero bit, 31-bit PRBS state}
  note: 'FIFO word width. Spec rate: one word per clk_c3 cycle, 25 Mwords/s, 800 Mbit/s when not full; not measured in this
    run.'
- name: ADDR_WIDTH
  value: 9
  legal: log2(DEPTH)
  note: Sets the width of the fill count (ADDR_WIDTH + 1 bits) used for OCC_MAX.
- name: PRBS_SEED
  value: 2147483647
  legal: non-zero, 31 bits
  note: Seed 0x7FFFFFFF for both PRBS-31 copies; an all-zero seed would lock the sequence.
- name: DESIGN_ID
  value: 546635777
  legal: any 32-bit value
  note: Read back at ID (0x000) as 0x20950001.
- name: SLOW_READ_DIV_CLOCKS
  value: 8
  legal: 1 to 16 (the reader cool-down counter is 4 bits)
  note: With SLOW_READ set the reader pops at most one word per 8 gt_refclk0 cycles (a pop, then 7 idle cycles).
- name: SYNC_STAGES
  value: 2
  legal: 2 to 8 (XPM limits)
  note: Synchroniser depth for the FIFO macro, the control crossings and the snapshot handshake. The reset synchroniser
    is fixed at 4 stages.
