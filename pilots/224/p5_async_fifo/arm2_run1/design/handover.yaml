- about: xdc_async_groups
  text: The spec promises asynchronous clock groups between clk_c3 and gt_refclk0 and set_max_delay -datapath_only on CDC
    paths. design.xdc has neither; it only creates the clocks sys_clk_pin, gt_refclk0 and jtag_tck and a false path to led[*]
    and sfp_tx_disable. The spec disagrees with what was built, and REQ-30 and REQ-31 are not met by the constraints file.
- about: xdc_refclk_pins
  text: design.xdc gives gt_refclk0_p and gt_refclk0_n a create_clock but no PACKAGE_PIN or IOSTANDARD; the placement of
    these pins was not set by the file.
- about: xdc_output_timing
  text: design.xdc cuts led[*] and sfp_tx_disable with set_false_path instead of an output delay. The constraints-stage
    gate still reported led[0] and led[1] as having no output delay.
- about: usr_accesse2_clock
  text: The CFGCLK pin of USR_ACCESSE2 (u_usr) is left unconnected in p5_async_fifo_soak.sv and has no clock, which is the
    unconstrained register pin the constraints gate reports.
- about: word_width
  text: The spec says 32 new PRBS bits per word. The RTL (p5_async_fifo_soak_core.sv) advances the 31-bit state 32 steps
    per word and stores {1 zero bit, 31-bit state}, so bit 31 of every FIFO word is always 0. The first word is the state
    after 32 steps from the seed, not the seed itself. The reader checks the same way.
- about: reset_style
  text: Spec says each domain gets its own synchronised reset release through xpm_cdc_async_rst. In rst_gen.sv only the
    clk_gt domain uses it (via rst_sync.sv); rst_c3 is the counter-driven register directly. The hold is about 16 clk_c3
    cycles, not the spec minimum of 8.
- about: reset_values
  text: Every register, counter, the visible snapshot copies and h_rdata reset to 0 in the clk_c3 domain; the reader counters
    and PRBS copy reset in the clk_gt domain. RUN, SLOW, INJECT and CLEAR reset to 0.
- about: unmapped_access
  text: Reads of any address not in the register map (the gaps between mapped offsets and everything above SNAPSHOT) and
    a read of SNAPSHOT return 0. Writes to unmapped addresses and to read-only registers change nothing (fifo_core, case
    default).
- about: ctrl_write_semantics
  text: Every write to CTRL (0x010) overwrites RUN and SLOW from bits 0 and 1 of the written value. CLEAR is accepted only
    when the written bit 0 is 0 (it tests the value being written, not the current RUN), so a CLEAR written together with
    RUN=1 is ignored and never stays set. A CTRL read returns RUN in bit 0, SLOW in bit 1, 0 in bit 2 and, in bit 3, whether
    an INJECT is still pending (armed, no word flipped yet). INJECT flips bit 0 of the next received word, once.
- about: clear_scope
  text: 'CLEAR resets the writer, the reader counters, both PRBS copies and the FIFO (pointers, with the FIFO reset held
    for a few clk_c3 cycles and the reader held for a number of its own cycles), but not the visible snapshot registers
    0x014 to 0x02C: they keep the last snapshot until the next SNAPSHOT write.'
- about: snapshot_behaviour
  text: A SNAPSHOT write latches the four writer-side counters at once and requests the reader-side counters by toggle;
    all seven visible registers then update together when the handshake returns. A request that arrives while a previous
    handover is in flight or a CLEAR is pending is held and served later, not lost. The latency in clk_c3 cycles was not
    counted from the RTL or measured; the spec default is under 16 cycles.
- about: register_latency
  text: A write takes effect the clock after h_we. h_rdata is registered, so it shows the addressed register one clk_c3
    cycle after h_re and holds it until the next h_re (within the spec limit of 2 cycles). Counted from fifo_core in p5_async_fifo_soak_core.sv.
- about: occ_max_basis
  text: OCC_MAX is measured in the writer domain from the FIFO write count (capped at DEPTH), so it may overstate the true
    fill by the synchroniser delay; it is not updated during a FIFO reset.
- about: slow_read_stall
  text: With SLOW_READ set the reader pops once per 8 clk_gt cycles; a pop is also blocked by FIFO empty, FIFO reset busy
    and the post-CLEAR hold. STALL_W counts clk_c3 cycles with RUN=1 and the FIFO full outside a FIFO reset. The writer
    never writes while full, so OVERFLOWS should stay 0 by construction.
- about: sim_stubs
  text: Simulation uses the behavioural stand-ins in rtl/xilinx_sim_stubs.sv for xpm_fifo_async, the CDC macros, IBUFDS_GTE4,
    BUFG_GT and USR_ACCESSE2. BUILD reads 0 in simulation, and the real macro behaviour (reset busy timing, full and empty
    flags) was not simulated.
- about: led_meaning
  text: led[0]=RUN and led[1]=reader error or writer overflow seen is an assumption from the Clarifier (the request did
    not define LED use), not a given requirement. The reader error flag is cleared by CLEAR.
- about: hardware_proof
  text: The requirement rows that name hardware (uart_tests) refer to a bring-up that never ran; no board was used.
