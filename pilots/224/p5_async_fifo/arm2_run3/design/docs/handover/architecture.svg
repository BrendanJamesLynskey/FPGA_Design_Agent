<svg xmlns="http://www.w3.org/2000/svg" width="640" height="266" viewBox="0 0 640 266" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="266" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">top</text><text x="170" y="43">thin top; instantiates jtag_bus, power-on reset generator, IBUFDS_GTE4</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">jtag_bus</text><text x="170" y="77">supplied BSCANE2 USER4 register bus (data/jtag_bus.sv, unchanged), clk</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">fifo_core</text><text x="170" y="111">register core in clk_25 domain with LEDs, CTRL, counters, snapshot, PR</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">async_fifo</text><text x="170" y="145">512x32 asynchronous FIFO, Gray pointers (xpm_cdc_gray), simple dual-po</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">reset_gen</text><text x="170" y="179">power-on reset counter in clk_25, xpm_cdc_async_rst into gt_refclk dom</text><text x="8" y="206" font-weight="bold">Interfaces</text><text x="8" y="224">jtag_bus - fifo_core: host_regs (simple)</text><text x="8" y="242">top - board: sfp_ctl (gpio)</text></svg>
