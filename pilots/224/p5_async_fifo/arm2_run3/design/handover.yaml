- about: cover_vs_functional
  text: The draft shows functional bins at 0 of 0 and cover properties at 0 percent; the two coverage results must be compared
    before any new stimulus.
- about: unmapped_access
  text: In p5_async_fifo_core.sv unmapped read addresses return 0 and writes to them change nothing. CTRL (0x010) reads
    back only RUN and SLOW; CLEAR and INJECT always read 0. SNAPSHOT (0x030) and other addresses read 0.
- about: read_latency
  text: h_rdata is registered on h_re in p5_async_fifo_core.sv, so it is valid 1 clk_25 cycle after h_re and holds until
    the next h_re. This is within the spec's promise of 2 cycles. It is not measured by the flow.
- about: ctrl_write_priority
  text: Every write to CTRL replaces RUN and SLOW from bits 0 and 1. CLEAR (bit 2) acts only if the same write has RUN=0
    and the current RUN is 0; a write that sets RUN and CLEAR together is ignored for CLEAR. CLEAR also holds the writer
    off for 6 further clk_25 cycles and the reader for 8 gt_refclk cycles. After reset the reader waits 8 cycles. INJECT
    toggles a flag that flips bit 0 of the next word read.
- about: clear_semantics
  text: CLEAR zeroes the writer-side counters at once and the reader counters through a CDC event. The snapshot registers
    are not cleared by CLEAR; only reset clears them.
- about: run_fall
  text: Clearing RUN stops the writer at once. The reader keeps draining and checking the remaining words, because its enable
    does not depend on RUN. This matches the defaulted interview answer. The spec text says the reader acts while RUN is
    1, so the RTL differs.
- about: snapshot_latency
  text: SNAPSHOT is a toggle event crossing clk_25 to gt_refclk, then a 96-bit handshake back. Snapshot values arrive several
    clk_25 cycles after the write and the RTL gives no fixed bound. The read-side counters (WORDS_R, DATA_ERRS, UNDERFLOWS)
    come from the reader and the writer counters are sampled at arrival, so the seven values are not captured at one instant.
    This differs from the spec's single-instant claim.
- about: occ_max
  text: OCC_MAX is computed in the writer domain from the synchronised read pointer, so it is a conservative upper estimate
    (fill after the current write). It is not updated during the CLEAR hold.
- about: led_spec
  text: led[1] in the RTL covers DATA_ERRS, UNDERFLOWS (via the reader flag) and OVERFLOWS, as the defaulted interview answer
    says. Overflow cannot occur because the writer is gated by full, so OVERFLOWS stays 0 unless the gating changes.
- about: spec_overflow
  text: OVERFLOWS counts w_en && w_full in async_fifo.sv, but the core drives w_en with do_w (already gated by not full),
    so the FIFO-level overflow never fires. Writes held off by a full FIFO are counted in STALL_W instead. The spec says
    OVERFLOWS counts writes attempted while full.
- about: spec_stall_xdc
  text: 'design.xdc:33 area: output delays on led and sfp_tx_disable (lines near the end) are overridden by the set_max_delay
    from sys_clk_pin to gt_refclk, which the exception gate reports as ignored. The spec asked for no output delay; the
    XDC adds one only to make the outputs constrained.'
- about: sim_stubs
  text: Simulation uses behavioural stand-ins for the XPM and GT primitives (xilinx_sim_stubs.sv). USR_ACCESSE2 reads 0
    in simulation, so BUILD is only checkable on hardware.
- about: assumption_decisions
  text: The spec and architecture were approved automatically, and all 7 interview answers were defaults. Behaviours such
    as the INJECT bit and the LED meaning come from those defaults.
