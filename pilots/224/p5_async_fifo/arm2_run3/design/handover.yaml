schema: fda-handover/1
id: p5_async_fifo
title: Asynchronous FIFO soak, 25 MHz writer and 156.25 MHz reader on the KR260
kind: agent-run
produced_by: agent
summary: The design writes a 32-bit PRBS-31 stream at the clk_25 rate into a 512-word asynchronous FIFO. A reader in the
  gt_refclk domain (SFP+ MGTREFCLK0, 156.25 MHz) checks every word against its own PRBS copy and counts errors and underflows.
  A host reads and writes the registers over jtag_bus, with counters latched by SNAPSHOT. The run stopped at the constraints
  stage, whose exit gate failed on an ignored output-delay exception in design.xdc, and verification reached V2 of V3. A
  Vivado base build is recorded as failed and there is no board result.
scope_not:
- 'Not a transceiver design: no GT channel is used, only the reference clock buffer, and sfp_tx_disable is held at 1.'
- 'Not hardware-proven: no board result exists, and the build gates did not pass.'
- 'Not a general FIFO IP: depth, width and PRBS polynomial are fixed by the parameters and the RTL.'
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261126-021747-15f3/p5_async_fifo/design.xdc
resets:
- name: rst
  active: high
  note: Internal power-on reset in top.sv, held for 8 clk_25 cycles after configuration. It resets the clk_25 logic synchronously
    and enters the gt_refclk domain through xpm_cdc_async_rst with 4 flops (reset_gen.sv).
interfaces:
- name: clk_25
  type: input clock, C3, LVCMOS18, 25 MHz
  note: Writer domain, register port and jtag_bus clock.
- name: gt_refclk_p / gt_refclk_n
  type: differential input clock, Y6 / Y5
  note: SFP+ MGTREFCLK0 through IBUFDS_GTE4 and BUFG_GT; reader domain at 156.25 MHz (6.4 ns in design.xdc).
- name: led[1:0]
  type: output, F8 and E8, LVCMOS18
  note: led[0] is RUN. led[1] is set when DATA_ERRS or UNDERFLOWS is non-zero (synchronised) or the writer-side OVERFLOWS
    count is non-zero.
- name: sfp_tx_disable
  type: output, Y10, LVCMOS33
  note: Constant 1 (laser off).
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546635777
  bits: '[31:0] design ID'
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: '[31:0] USR_ACCESS word'
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: '[31:0] read back value'
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: '[0] RUN, [1] SLOW_READ, [2] CLEAR self-clearing only while RUN=0, [3] INJECT self-clearing'
- offset: 20
  name: WORDS_W
  access: RO
  reset: 0
  bits: '[31:0] words written (snapshot)'
- offset: 24
  name: WORDS_R
  access: RO
  reset: 0
  bits: '[31:0] words read and checked (snapshot)'
- offset: 28
  name: DATA_ERRS
  access: RO
  reset: 0
  bits: '[31:0] mismatched words (snapshot)'
- offset: 32
  name: OVERFLOWS
  access: RO
  reset: 0
  bits: '[31:0] (snapshot)'
- offset: 36
  name: UNDERFLOWS
  access: RO
  reset: 0
  bits: '[31:0] (snapshot)'
- offset: 40
  name: STALL_W
  access: RO
  reset: 0
  bits: '[31:0] writer clocks held off (snapshot)'
- offset: 44
  name: OCC_MAX
  access: RO
  reset: 0
  bits: '[31:0] highest fill in words (snapshot)'
- offset: 48
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: '[31:0] any write latches 0x014 to 0x02C; reads 0'
parameters:
- name: DESIGN_ID
  value: 546635777
  legal: any 32-bit value
  note: Read back at ID (0x000) as 0x20950001.
- name: FIFO_DEPTH_WORDS
  value: 512
  legal: 512 only
  note: Not a real RTL parameter; async_fifo.sv hard-codes 512 words and 10-bit pointers.
- name: DATA_WIDTH
  value: 32
  legal: 32 only
  note: Hard-coded in the RTL; one PRBS word per write.
- name: PRBS_SEED
  value: 2147483647
  legal: nonzero 31-bit value
  note: Seed 0x7FFFFFFF for the writer and the reader copy; used at reset and on CLEAR.
- name: SLOW_READ_DIV_CYCLES
  value: 8
  legal: 1 to 8 (the slow counter is 3 bits)
  note: With SLOW_READ set the reader takes one word per 8 gt_refclk cycles, the spec's 19.53 Mwords/s. Which value the
    benches ran is not recorded in the draft, so the spec's value is not shown to have been simulated.
- name: PTR_WIDTH
  value: 9
  legal: 9 only
  note: Address width of the 512-word RAM; the RTL pointers are 10 bits including a wrap bit.
- name: COUNTER_WIDTH
  value: 32
  legal: 32 only
  note: All counters are 32 bits and wrap.
