resolved_questions:
- question: Confirm the register map (offset, width, reset value and access of every
    register).
  answer: 'Map as given in spec.md: 0x000 ID, 0x004 BUILD, 0x008 SCRATCH, 0x010 CTRL,
    0x014..0x02C RO counters, 0x030 SNAPSHOT WO, all 32 bits.'
  status: defaulted
  by: default
  default_reason: the request lists offsets; confirmation avoids a mismatch with the
    host script.
- question: Is the wanted behaviour on RUN falling to stop both sides and leave the
    FIFO content unchecked?
  answer: Writer stops at once; reader drains the remaining words and checks them.
  status: defaulted
  by: default
  default_reason: the request does not say what happens to data in flight on RUN 0.
- question: Which bit is flipped by INJECT?
  answer: Bit 0 of the next word the reader takes.
  status: defaulted
  by: default
  default_reason: the request says one bit of one word only.
- question: Does OCC_MAX count writer-side fill (conservative) or an exact value?
  answer: Writer-side fill computed from the synchronised read pointer, maximum 512.
  status: defaulted
  by: default
  default_reason: exact fill is not observable across unrelated clocks.
- question: Should the LEDs show anything?
  answer: led[0] = RUN, led[1] = 1 when any of DATA_ERRS, OVERFLOWS, UNDERFLOWS is
    non-zero (live).
  status: defaulted
  by: default
  default_reason: the request leaves the LEDs unused.
- question: What does CLEAR do if written while RUN is 1?
  answer: Ignored, bit reads 0.
  status: defaulted
  by: default
  default_reason: the request says only while RUN is 0.
- question: Is the BUILD word valid before configuration finishes?
  answer: BUILD reads USR_ACCESSE2 live.
  status: defaulted
  by: default
  default_reason: the request does not say.
- question: Confirm the register map (offset, width, reset value and access of every
    register).
  answer: 'Map as in spec.md: 0x000 ID, 0x004 BUILD, 0x008 SCRATCH, 0x010 CTRL, 0x014
    to 0x02C RO counters, 0x030 SNAPSHOT WO, all 32 bits, reset 0 except ID.'
  status: defaulted
  by: default
  default_reason: the request lists offsets, confirmation avoids a mismatch with the
    host script.
- question: Confirm the register map (offset, width, reset value and access of every
