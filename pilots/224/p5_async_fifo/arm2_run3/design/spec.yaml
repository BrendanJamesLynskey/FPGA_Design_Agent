name: p5_async_fifo_soak
title: 'P5: asynchronous FIFO soak (25 MHz writer, 156.25 MHz reader)'
board: kr260
part: xck26-sfvc784-2LV-c
top: top
clocks:
- name: clk_25
  freq_mhz: 25
  role: C3 pin 25 MHz clock; writer domain and register port (jtag_bus clk)
- name: gt_refclk
  freq_mhz: 156.25
  role: SFP+ MGTREFCLK0 via a GT reference clock buffer (IBUFDS_GTE4); reader domain
- note: clk_25 and gt_refclk are unrelated; declare them asynchronous clock groups
    and constrain the CDC paths (max delay / false path with bounded skew on Gray
    pointers)
reset:
  name: rst
  polarity: active_high
  sync_to: clk_25
  note: internal power-on reset held for a few clocks, synchronised separately into
    the gt_refclk domain
parameters:
  DESIGN_ID: 546635777
  FIFO_DEPTH_WORDS: 512
  DATA_WIDTH: 32
  PRBS_SEED: 2147483647
  SLOW_READ_DIV_CYCLES: 8
  PTR_WIDTH: 9
  COUNTER_WIDTH: 32
ports:
- name: clk_25
  direction: in
  width: 1
  board_pin_role: C3 25 MHz clock
- name: gt_refclk_p
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 P
- name: gt_refclk_n
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 N
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
interfaces_internal:
  jtag_bus: data/jtag_bus.sv used unchanged; register port h_we, h_re, h_addr[11:0],
    h_wdata[31:0], h_rdata[31:0] in clk_25 domain
behaviour:
  writer:
  - In clk_25 domain, while RUN is 1 and the FIFO is not full, writes one 32-bit PRBS-31
    word (x^31 + x^28 + 1, 32 new bits per word, seed 0x7FFFFFFF) on every clk_25
    cycle.
  - While RUN is 1 and the FIFO is full, no write occurs and STALL_W increments by
    1 per clk_25 cycle.
  - While RUN is 0 the writer writes nothing.
  reader:
  - In gt_refclk domain, while RUN is 1 and the FIFO is not empty, reads one word
    and compares it with its own PRBS-31 copy started from seed 0x7FFFFFFF.
  - A mismatch increments DATA_ERRS by 1.
  - With SLOW_READ 1 the reader takes at most one word in every 8 gt_refclk cycles.
  - INJECT flips one bit of one received word before the check, once, then clears
    itself.
  fifo:
  - Asynchronous FIFO, 512 words x 32 bits, Gray-coded pointers with two-flop synchronisers.
  - OVERFLOWS counts writes attempted while full, UNDERFLOWS counts reads attempted
    while empty; both must stay 0.
  - OCC_MAX holds the highest fill seen, in words.
  counters:
  - All counters are 32 bits and wrap.
  - A write to SNAPSHOT latches all seven counters at one instant into 0x014 to 0x02C.
  - CLEAR, written only while RUN is 0, zeroes all counters and restarts both sequences
    from the seed and empties the FIFO.
  host:
  - Unmapped addresses read 0 and ignore writes.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it.
  - BUILD reads the USR_ACCESSE2 word.
  - sfp_tx_disable is 1 at all times, no GT transceiver channel is used.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546635777
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESS word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] read back value'
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] RUN, [1] SLOW_READ, [2] CLEAR self-clearing only while RUN=0, [3] INJECT
      self-clearing'
  - offset: 20
    name: WORDS_W
    access: RO
    reset: 0
    bits: '[31:0] words written (snapshot)'
  - offset: 24
    name: WORDS_R
    access: RO
    reset: 0
    bits: '[31:0] words read and checked (snapshot)'
  - offset: 28
    name: DATA_ERRS
    access: RO
    reset: 0
    bits: '[31:0] mismatched words (snapshot)'
  - offset: 32
    name: OVERFLOWS
    access: RO
    reset: 0
    bits: '[31:0] (snapshot)'
  - offset: 36
    name: UNDERFLOWS
    access: RO
    reset: 0
    bits: '[31:0] (snapshot)'
  - offset: 40
    name: STALL_W
    access: RO
    reset: 0
    bits: '[31:0] writer clocks held off (snapshot)'
  - offset: 44
    name: OCC_MAX
    access: RO
    reset: 0
    bits: '[31:0] highest fill in words (snapshot)'
  - offset: 48
    name: SNAPSHOT
    access: WO
    reset: 0
    bits: '[31:0] any write latches 0x014 to 0x02C; reads 0'
timing:
  write_effect: register write takes effect 1 clk_25 cycle after h_we
  read_response: h_rdata valid within 2 clk_25 cycles of h_re
  writer_rate: 1 word per clk_25 cycle (25 Mwords/s) when not full
  reader_rate: up to 1 word per gt_refclk cycle; 1 in 8 with SLOW_READ (19.53 Mwords/s)
  latency:
    fifo_pointer_cdc: 2 destination clock cycles of synchroniser per pointer crossing
    snapshot: snapshot data stable in clk_25 domain within a bounded number of clk_25
      cycles after the write; read after it
resources_expected:
  bram36: 1
  lut: about 600
  ff: about 900
  dsp: 0
  gt_channels: 0
assumptions:
- assumption: Register port and writer share clk_25.
  reason: jtag_bus needs a free-running clock and clk_25 is the slower one, easing
    timing.
- assumption: Reader counters are captured into clk_25 domain at SNAPSHOT via a handshake
    CDC.
  reason: gives a coherent snapshot across unrelated clocks.
- assumption: Counters keep running after SNAPSHOT; only the latched copies are frozen.
  reason: the soak must not be disturbed by reads.
- assumption: Fill level for OCC_MAX is measured in the writer domain from the synchronised
    read pointer.
  reason: a conservative (upper) estimate that is safe to compute without extra CDC.
- assumption: The reader only starts after RUN is seen in gt_refclk domain via a synchroniser,
    and the FIFO is empty at that time.
  reason: both sequences must start together from the seed.
