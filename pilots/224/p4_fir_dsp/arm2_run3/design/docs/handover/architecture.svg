<svg xmlns="http://www.w3.org/2000/svg" width="640" height="386" viewBox="0 0 640 386" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="386" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">fir32_top</text><text x="170" y="43">Thin top; instantiates jtag_bus, reset generator, MMCM and the core; d</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">jtag_bus</text><text x="170" y="77">Supplied BSCANE2 USER4 register bus (data/jtag_bus.sv, unchanged) givi</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">fir32_core</text><text x="170" y="111">Register map (ID, BUILD, SCRATCH, CTRL, IN_PUSH, OUT_POP, STATUS, SAT_</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">fir_dsp</text><text x="170" y="145">32-tap symmetric FIR, pre-add, 16 DSP48 multipliers, adder tree, round</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">in_fifo</text><text x="170" y="179">xpm_fifo_async 1024x16 input FIFO, clk write, clk_dsp read</text><rect x="8" y="196" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="213">out_fifo</text><text x="170" y="213">xpm_fifo_async 1024x16 output FIFO, clk_dsp write, clk read</text><rect x="8" y="230" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="247">mmcm</text><text x="170" y="247">MMCM 25 MHz x40 / 4 -&gt; 250 MHz clk_dsp</text><rect x="8" y="264" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="281">rst_gen</text><text x="170" y="281">Power-up reset for clk, and reset synchroniser into clk_dsp gated by M</text><text x="8" y="308" font-weight="bold">Interfaces</text><text x="8" y="326">jtag_bus - fir32_core: reg_bus (simple)</text><text x="8" y="344">in_fifo - fir_dsp: in_stream (simple)</text><text x="8" y="362">fir_dsp - out_fifo: out_stream (simple)</text></svg>
