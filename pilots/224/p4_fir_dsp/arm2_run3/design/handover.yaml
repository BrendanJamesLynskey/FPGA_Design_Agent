- about: latency
  text: 'latency not measured: the run measured no latency; the spec''s latency promise is checked only by the benches'
- about: throughput
  text: 'throughput not measured: the run measured no throughput'
- about: clock_name
  text: spec.yaml and ARCHITECTURE.md name the board clock clk25, but design.xdc constrains a port named clk_25 (period
    40.00 ns). The XDC is what was built; the top-level port name must match it or the constraint will not bind.
- about: rtl-absent
  text: No RTL exists, so the reset style, reset values, read latency and filter pipeline depth are spec intent only. Spec
    leaves the filter pipeline depth to the implementation.
- about: busy-and-full-behaviour
  text: Defaulted answers, not built. RUN while BUSY is ignored. IN_PUSH while BUSY is accepted if the FIFO is not full
    and is held for the next RUN. CLEAR during BUSY aborts the run. A result arriving at a full output FIFO is dropped,
    though SAMPLES_DONE still counts it.
- about: register-access
  text: Per spec, unmapped addresses (including 0x00C and the gaps between the mapped registers) read 0 and ignore writes.
    OUT_POP on an empty FIFO reads 0, and a valid read pops as a side effect. IN_PUSH on a full FIFO is ignored. CTRL bits
    read back 0 the clock after the write.
- about: snapshot
  text: Each register read is a single-register snapshot; STATUS counts, SAT_COUNT and SAMPLES_DONE are not read atomically
    together.
- about: build_sim
  text: BUILD reads USR_ACCESSE2, which does not exist in simulation; the behavioural model returns 0 or a testbench-set
    word.
- about: unread_sources
  text: spec.yaml records that data/jtag_bus.sv and data/coeffs.hex were not readable when the spec was written, so their
    contents come only from the description in spec.md.
- about: led1_proposal
  text: The led[1] heartbeat is a proposal in the spec, not a requirement.
