# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: p4_fir_dsp
title: 32-tap symmetric FIR filter with FIFOs and JTAG register access (specified, RTL not written)
kind: agent-run
produced_by: agent
summary: The design is specified as a 32-tap symmetric low-pass FIR filter on the KR260 (xck26). Samples are pushed through
  a register bus behind jtag_bus into an input FIFO, a RUN command streams them through a 16-DSP datapath at 250 MHz from
  an MMCM, and results are popped from an output FIFO. The run stopped after the clarify and board-and-device-planning stages
  passed; no RTL was written, so nothing was simulated, synthesised or measured.
scope_not:
- Not a runtime-loadable coefficient filter; coefficients are fixed, symmetric, and come from data/coeffs.hex.
- Not an AXI4-Lite peripheral and does not use a GT transceiver channel; the SFP+ transmitter is only held disabled.
- Not built or verified; there is no RTL, bitstream, or timing, power or resource result.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: fir32_top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261126-015902-dd64/p4_fir_dsp/design.xdc
resets:
- name: rst
  active: high
  note: Per spec.yaml it is driven by jtag_bus, synchronous to clk, and synchronised into clk_dsp with MMCM lock gating
    the datapath reset. No RTL exists to confirm this.
interfaces:
- name: clk25
  type: input, 1 bit, 25 MHz board clock
  note: spec.yaml names it clk25 but design.xdc constrains and places a port named clk_25 on pin C3 with a 40 ns period.
- name: led
  type: output, 2 bits
  note: design.xdc places led[0] on F8 and led[1] on E8, LVCMOS18. Per spec, led[0] shows BUSY and led[1] a heartbeat.
- name: sfp_tx_disable
  type: output, 1 bit
  note: design.xdc places it on Y10, LVCMOS33. Per spec it is constant 1 and no GT channel is used.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546570241
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 read back what was written
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 CLEAR self-clearing; 1 RUN self-clearing
- offset: 20
  name: IN_PUSH
  access: WO
  reset: 0
  bits: 15:0 sample
- offset: 24
  name: OUT_POP
  access: RO
  reset: 0
  bits: 31 valid; 15:0 oldest output; read pops
- offset: 28
  name: STATUS
  access: RO
  reset: 0
  bits: 0 BUSY; 15:4 input FIFO count; 31:20 output FIFO count
- offset: 32
  name: SAT_COUNT
  access: RO
  reset: 0
  bits: 31:0 saturated outputs since CLEAR
- offset: 36
  name: SAMPLES_DONE
  access: RO
  reset: 0
  bits: 31:0 samples processed since CLEAR
parameters:
- name: TAPS
  value: 32
  legal: fixed at 32 by the symmetric structure
  note: Number of filter taps; the datapath is specified for exactly 32.
- name: UNIQUE_COEFFS
  value: 16
  legal: TAPS/2
  note: One DSP multiplier per unique coefficient.
- name: DATA_WIDTH
  value: 16
  legal: 16 (signed)
  note: Sample width; the pre-add makes it 17 bits.
- name: COEFF_WIDTH
  value: 16
  legal: 16 (signed Q1.15)
  note: Coefficient width.
- name: FIFO_DEPTH
  value: 1024
  legal: 1024 as specified; the 12-bit STATUS count fields bound any larger depth
  note: Depth of each of the input and output FIFOs; the 12-bit STATUS count fields are sized for it. Only 1024 was specified,
    and nothing was simulated.
- name: SHIFT
  value: 15
  legal: 15 (Q1.15 coefficients); changing it also changes ROUND_CONST
  note: Arithmetic right shift after rounding.
- name: ROUND_CONST
  value: 16384
  legal: 16384 (0x4000, half of 2^SHIFT)
  note: Rounding constant added before the shift.
- name: ID_VALUE
  value: 546570241
  legal: 546570241 (0x20940001)
  note: Value read from the ID register.
- name: READ_LATENCY_CYCLES
  value: 2
  legal: 2 or fewer clk cycles
  note: Spec gives h_rdata valid within 2 clk cycles of h_re; no RTL exists to count it.
