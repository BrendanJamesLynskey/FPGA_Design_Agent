resolved_questions:
- question: What happens to a RUN written while BUSY, and to IN_PUSH while BUSY?
  answer: RUN while BUSY is ignored; IN_PUSH while BUSY is accepted if not full and
    processed by the next RUN.
  status: defaulted
  by: default
  default_reason: The request does not say.
- question: Is CLEAR during BUSY allowed?
  answer: CLEAR aborts the run and empties everything.
  status: defaulted
  by: default
  default_reason: Request says CLEAR empties both FIFOs and zeroes history; not stated
    for BUSY.
- question: If the output FIFO lacks space for the whole input (more than 1024 total
    outputs)?
  answer: The user must drain; a result arriving at a full output FIFO is dropped.
    SAMPLES_DONE still counts.
  status: defaulted
  by: default
  default_reason: Not specified; host drains between chunks of 1000.
- question: Which clock frequency for the datapath?
  answer: 250 MHz from MMCM (VCO 1000 MHz).
  status: defaulted
  by: default
  default_reason: Request says 250 MHz or faster.
- question: What do the LEDs show?
  answer: led[0]=BUSY, led[1]=heartbeat.
  status: defaulted
  by: default
  default_reason: Not specified.
- question: Do STATUS counts and SAT_COUNT/SAMPLES_DONE need to be consistent snapshots?
  answer: Each read is a single-register snapshot; no cross-register atomicity.
  status: defaulted
  by: default
  default_reason: Not specified.
- question: BUILD value in simulation?
  answer: Behavioural model returns 0 or a testbench-set word.
  status: defaulted
  by: default
  default_reason: USR_ACCESSE2 is a primitive absent in simulation.
