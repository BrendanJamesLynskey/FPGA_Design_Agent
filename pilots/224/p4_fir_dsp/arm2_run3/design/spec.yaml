name: fir32_sym
title: 'P4: 32-tap symmetric FIR low-pass filter with FIFOs, JTAG register access'
board: kr260
part: xck26-sfvc784-2LV-c
top: fir32_top
clocks:
- name: clk25
  pin_role: 25 MHz board clock, pin C3
  freq_mhz: 25
  note: free-running input clock; feeds the MMCM and the register bus clock
- name: clk_dsp
  freq_mhz: 250
  note: generated by an MMCM from clk25 (25 MHz x 40 / 4); datapath clock, must close
    timing at 250 MHz or faster
- name: clk
  freq_mhz: 25
  note: register bus clock for data/jtag_bus.sv (same net as clk25)
reset:
  name: rst
  polarity: active_high
  sync_to: clk
  note: rst is driven by jtag_bus and held for a few clocks at start; synchronised
    into clk_dsp (and MMCM locked gates the datapath reset)
parameters:
  TAPS: 32
  UNIQUE_COEFFS: 16
  DATA_WIDTH: 16
  COEFF_WIDTH: 16
  FIFO_DEPTH: 1024
  SHIFT: 15
  ROUND_CONST: 16384
  ID_VALUE: 546570241
  READ_LATENCY_CYCLES: 2
ports:
- name: clk25
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
behaviour:
  filter:
  - y[n] = saturate16((sum_{k=0..31} h[k]*x[n-k] + 0x4000) >>> 15), arithmetic shift,
    exact sum, no intermediate rounding.
  - h is read from data/coeffs.hex (tap 0 first, 16-bit signed Q1.15) and is symmetric
    h[k] = h[31-k].
  - Symmetry is used by pre-adding x[n-k] + x[n-31+k] (17-bit) so 16 multipliers are
    used on DSP slices.
  - Samples before the first one are 0; history is kept between runs until CLEAR.
  - Saturation clamps to -32768..32767; a clamped output increments SAT_COUNT.
  - The datapath accepts one sample per clk_dsp clock.
  fifos:
  - Input FIFO holds 1024 samples, output FIFO holds 1024 samples, both cross between
    clk and clk_dsp.
  - IN_PUSH write pushes the low 16 bits; ignored when the input FIFO is full.
  - OUT_POP read returns bit31=1 and bits 15:0 = oldest output and removes it; returns
    0 when empty.
  run:
  - A write with CTRL bit 1 starts a run that processes every sample in the input
    FIFO at the time of RUN, in order, into the output FIFO.
  - BUSY is 1 from RUN until the last result is in the output FIFO.
  - SAMPLES_DONE increments per processed sample.
  clear:
  - CTRL bit 0 empties both FIFOs, zeroes filter history, SAT_COUNT and SAMPLES_DONE;
    the bit self-clears.
  bus:
  - Registers are 32 bits on 4-byte steps behind jtag_bus (unchanged); h_rdata shows
    the addressed register within 2 clocks of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - BUILD reads the USR_ACCESSE2 word.
  pins:
  - sfp_tx_disable is driven to 1 constantly; no GT channel is used.
  - led[0] shows BUSY; led[1] shows heartbeat from clk25 (proposal).
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546570241
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 read back what was written
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 CLEAR self-clearing; 1 RUN self-clearing
  - offset: 20
    name: IN_PUSH
    access: WO
    reset: 0
    bits: 15:0 sample
  - offset: 24
    name: OUT_POP
    access: RO
    reset: 0
    bits: 31 valid; 15:0 oldest output; read pops
  - offset: 28
    name: STATUS
    access: RO
    reset: 0
    bits: 0 BUSY; 15:4 input FIFO count; 31:20 output FIFO count
  - offset: 32
    name: SAT_COUNT
    access: RO
    reset: 0
    bits: 31:0 saturated outputs since CLEAR
  - offset: 36
    name: SAMPLES_DONE
    access: RO
    reset: 0
    bits: 31:0 samples processed since CLEAR
timing:
  datapath_clock: clk_dsp >= 250 MHz, one sample per clock throughput
  latency:
    register_read: h_rdata valid within 2 clk cycles of h_re
    register_write: effect 1 clk cycle after h_we
    filter_pipeline: fixed pipeline depth through pre-add, multiply, adder tree, round
      and saturate (depth set by implementation, documented in the design)
resources_expected:
  dsp: 16 (one per unique coefficient)
  bram: 2 to 4 RAMB36 for the two 1024x16 FIFOs
  mmcm: 1
  lut_ff: under 2000 LUTs
assumptions:
- text: Output sum width is 16+16+5 = 37 bits, held exact in 48-bit DSP accumulators.
  reason: 32 products of 32-bit width sum to under 2^36, so no overflow.
- text: Part is xck26-sfvc784-2LV-c.
  reason: K26 SOM on the KR260.
- text: Samples pushed while a run is in progress are held for the next RUN.
  reason: Run covers the FIFO content at RUN time; simplest defined behaviour.
- text: No AXI4-Lite block; register access is the jtag_bus simple port, so no interfaces
    profile.
  reason: spec.md specifies h_we/h_re port.
- text: data/jtag_bus.sv and data/coeffs.hex were not readable when writing this spec.
  reason: Their contents are taken only from the description in spec.md.
open_questions: []
