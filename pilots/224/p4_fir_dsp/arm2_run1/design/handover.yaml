- about: fir_latency
  text: The spec asks for a pipeline depth of about 8 to 12 clk_dp cycles. Counting from fir_datapath.sv, LAT is 9 cycles
    from accept (the input FIFO read) to out_wr_en. The first result is readable after the output FIFO crossing, which adds
    further clocks that the RTL does not bound.
- about: bus_read_latency
  text: In fir32_core.sv h_rdata is a register loaded on the clock after h_re, so one bus cycle in the core. The spec allows
    2. The delay inside jtag_bus.sv was not counted. h_rdata holds its value until the next h_re.
- about: unmapped_access
  text: Decoded read addresses are 0x000, 0x004, 0x008, 0x018, 0x01C, 0x020 and 0x024. Any other address reads 0, including
    CTRL (0x010) and IN_PUSH (0x014). Writes are decoded only for SCRATCH, CTRL and IN_PUSH, and all other writes, including
    writes to RO registers, are ignored.
- about: ctrl_priority
  text: A CTRL write with bit 0 set does CLEAR and ignores bit 1, so writing 3 does not RUN. CLEAR also holds the input
    FIFO in reset for 16 clk_bus cycles and the output FIFO for 64 clk_dp cycles, and a RUN issued in that window is dropped.
    IN_PUSH writes are ignored while the input FIFO is in reset.
- about: run_edge_cases
  text: RUN is ignored while busy or when the input FIFO is empty. It takes min(input count, output free space) samples,
    taken from the FIFO levels as they stand at the RUN. CLEAR during a run aborts it. BUSY stays high for 64 clk_dp cycles
    after the last result, and led[0] lags BUSY by three more clk_bus cycles.
- about: reset_values
  text: SCRATCH, h_rdata and the counters reset to 0. Counters and history are cleared by reset and by CLEAR. The histories
    of the two pending-push counters that guard the input FIFO level are cleared by reset only.
- about: status_counts
  text: STATUS counts cross clock domains and may lag. The input count is the write-side count and the output count is the
    read-side count. The input push limit adds the pushes of the last 4 clocks to the count so that 1024 is not exceeded.
    Pushing to a full FIFO is dropped by this check.
- about: spec_vs_rtl
  text: The spec says the reset comes from jtag_bus, coefficients come from data/coeffs.hex, and the parameters are adjustable.
    In the RTL (reset_gen.sv, fir_datapath.sv, fir32_core.sv) the reset is a power-on counter plus MMCM lock, the coefficients
    are literals and the parameters are fixed. The RTL is what was built.
- about: unsigned_samples
  text: fir_datapath.sv zero-extends samples in the pre-add, so they are treated as unsigned 16-bit words. The comment says
    this matches the reference model, but the spec does not say whether samples are signed. Check against model.py and the
    request.
- about: bram_zero
  text: The architecture predicts 2 to 4 BRAM36 for the two FIFOs, but the synthesis gate reports 0 BRAM tiles used. The
    cause is not recorded. The XPM FIFOs in in_fifo.sv and out_fifo.sv request block memory.
- about: build_sim_value
  text: BUILD reads 0 in simulation because the stub USR_ACCESSE2 returns 0. The real word is only seen on hardware.
- about: extra_clocks
  text: design.xdc declares jtag_tck (100 ns) and usr_cclk (10 ns) clocks and puts them in asynchronous groups with sys_clk_pin.
    The spec lists neither. LEDs and sfp_tx_disable are false-pathed.
