  to this stage.
- Get the V3 verification checks to run. Line, toggle and mutation score are not measured, and the functional bins report
  0 of 0 and the cover properties 0 percent, so first compare the cover results with the functional coverage. Then re-run
  the verification gates with the command listed.
- Decide the sample sign convention (unsigned in the RTL) against the request and model.py, and fix whichever is wrong.
- Re-run python -m agent resume once the flow reaches the build again, to take resource, timing and power numbers. Publish
  none until then.
- Run the hardware bring-up for the REQs that name it, and a human review of the spec and architecture.
open_questions:
- Should the input samples be signed? The RTL treats them as unsigned and the spec is silent.
- Why does synthesis report 0 BRAM tiles for the two FIFOs?
