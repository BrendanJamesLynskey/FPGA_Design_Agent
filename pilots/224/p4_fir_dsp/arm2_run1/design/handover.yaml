schema: fda-handover/1
id: p4_fir_dsp
title: 32-tap symmetric FIR filter with FIFOs and JTAG register access on the KR260
kind: agent-run
produced_by: agent
summary: A 32-tap symmetric low-pass FIR filter with 16-bit samples, built for the K26 on the KR260. A host pushes samples
  through a JTAG register bus into a 1024-sample input FIFO, writes RUN, and pops the saturated, rounded 16-bit results
  from an output FIFO. The datapath runs at 250 MHz from an MMCM on the 25 MHz board clock and uses 16 DSP multipliers through
  coefficient symmetry. The run reached simulation level V2 of V3 against the Modeller's model. It stopped at synthesis,
  whose gates failed. Nothing was implemented or measured on a board.
scope_not:
- Not an AXI design. The register port is the supplied jtag_bus simple port.
- Not a runtime-programmable filter. The 16 unique coefficients are fixed in rtl/fir_datapath.sv.
- Not timing-closed, power-checked or run on hardware. No Vivado resource, timing or power figure is recorded.
- Uses no GT transceiver. sfp_tx_disable is a plain output held at 1.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: fir32_top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261125-174731-a2e5/p4_fir_dsp/design.xdc
resets:
- name: rst
  active: high
  note: rtl/reset_gen.sv makes it, not jtag_bus as the spec says. A power-on counter holds rst_bus for 15 clk_25 cycles,
    and rst_dp is released synchronously by xpm_cdc_async_rst while the MMCM is unlocked or rst_bus is high. The reset is
    synchronous inside each domain. Register reset values are in the register table.
interfaces:
- name: clk_25
  type: input clock, pin C3 LVCMOS18, 40 ns period in design.xdc
  note: Board clock. It is the bus clock and the MMCM input.
- name: led
  type: output [1:0], F8 and E8 LVCMOS18
  note: led[0] is BUSY delayed by three clk_bus cycles and led[1] is output FIFO not empty. This is an assumption of the
    run, since the request gave no LED function.
- name: sfp_tx_disable
  type: output, Y10 LVCMOS33
  note: Constant 1 (fir32_core.sv).
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546570241
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 scratch
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 CLEAR self-clearing; 1 RUN self-clearing; others 0
- offset: 20
  name: IN_PUSH
  access: WO
  reset: 0
  bits: 15:0 sample pushed
- offset: 24
  name: OUT_POP
  access: RO
  reset: 0
  bits: 31 valid; 15:0 oldest output; read pops
- offset: 28
  name: STATUS
  access: RO
  reset: 0
  bits: 0 BUSY; 15:4 input count; 31:20 output count; rest 0
- offset: 32
  name: SAT_COUNT
  access: RO
  reset: 0
  bits: 31:0 saturated outputs
- offset: 36
  name: SAMPLES_DONE
  access: RO
  reset: 0
  bits: 31:0 samples processed
parameters:
- name: NUM_TAPS
  value: 32
  legal: 32 only
  note: Not an RTL parameter. The structure (32-deep history, 16 pre-adders, 16 multipliers) is fixed in fir_datapath.sv.
- name: DATA_WIDTH
  value: 16
  legal: 16 only
  note: Fixed in the RTL. Input samples are zero-extended in the pre-add, so they are treated as unsigned words.
- name: COEFF_WIDTH
  value: 16
  legal: 16 only
  note: Signed Q1.15. The 16 unique values are literals in fir_datapath.sv, not read from data/coeffs.hex.
- name: ACC_WIDTH
  value: 40
  legal: 40 only
  note: The 32-tap sum needs at most 37 bits per the spec, so the sum is exact.
- name: FIFO_DEPTH
  value: 1024
  legal: 1024 only
  note: Each XPM FIFO is built 2048 deep, and fir_core.sv and fir_datapath.sv limit occupancy to 1024.
- name: ROUND_CONST
  value: 16384
  legal: 16384 only
  note: The value 0x4000 is added before the shift, as a literal in fir_datapath.sv.
- name: SHIFT
  value: 15
  legal: 15 only
  note: Arithmetic shift, then saturation to 16 bits. The spec gives 1 sample per clk_dp cycle at 250 MHz or faster, and
    this is not measured.
- name: DESIGN_ID
  value: 546570241
  legal: any 32-bit value
  note: Equals 0x20940001. It is a localparam in fir32_core.sv and returned by the ID register.
