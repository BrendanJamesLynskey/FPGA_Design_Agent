resolved_questions:
- question: What if RUN is written while BUSY, or CLEAR while BUSY?
  answer: RUN while BUSY is ignored; CLEAR while BUSY aborts the run and clears everything.
  status: defaulted
  by: default
  default_reason: Request does not say; this is the simplest safe behaviour.
- question: What if the output FIFO lacks room for all input samples at RUN?
  answer: RUN processes only as many samples as the output FIFO has free space for,
    the rest stay in the input FIFO.
  status: defaulted
  by: default
  default_reason: Avoids losing results and keeps history consistent.
- question: Do IN_PUSH writes during BUSY get accepted?
  answer: Yes, accepted if the FIFO is not full, but not processed until the next
    RUN.
  status: defaulted
  by: default
  default_reason: Request is silent.
- question: What do the two LEDs show?
  answer: led[0]=BUSY, led[1]=output FIFO not empty.
  status: defaulted
  by: default
  default_reason: Request gives no function.
- question: Which pins do led[1:0] use?
  answer: Take them from the KR260 board constraints.
  status: defaulted
  by: default
  default_reason: Request does not list pin locations.
- question: Does reading OUT_POP and STATUS at the same time of a RUN matter, i.e.
    what do counts show mid-run?
  answer: Counts show the current FIFO levels, synchronised across domains (may lag
    by a few clocks).
  status: defaulted
  by: default
  default_reason: Counts cross clock domains.
