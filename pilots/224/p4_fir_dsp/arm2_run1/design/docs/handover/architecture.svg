<svg xmlns="http://www.w3.org/2000/svg" width="640" height="352" viewBox="0 0 640 352" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="352" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">fir32_top</text><text x="170" y="43">Thin top: MMCM (25 to 250 MHz), reset generator, jtag_bus, fir_core; d</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">jtag_bus</text><text x="170" y="77">Supplied BSCANE2 USER4 register bus (data/jtag_bus.sv, unchanged); h_w</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">fir_core</text><text x="170" y="111">Register core: ID, BUILD, SCRATCH, CTRL, IN_PUSH, OUT_POP, STATUS, SAT</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">in_fifo</text><text x="170" y="145">Input FIFO 1024x16, xpm_fifo_async, clk_bus write, clk_dp read</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">out_fifo</text><text x="170" y="179">Output FIFO 1024x16, xpm_fifo_async, clk_dp write, clk_bus read</text><rect x="8" y="196" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="213">fir_datapath</text><text x="170" y="213">32-tap symmetric FIR at clk_dp: 16 pre-adds, 16 DSP48 multipliers, add</text><rect x="8" y="230" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="247">reset_gen</text><text x="170" y="247">Synchronises rst into each domain; datapath reset held until MMCM lock</text><text x="8" y="274" font-weight="bold">Interfaces</text><text x="8" y="292">jtag_bus - fir_core: host_reg_port (simple)</text><text x="8" y="310">in_fifo - fir_datapath: sample_in (simple)</text><text x="8" y="328">fir_datapath - out_fifo: sample_out (simple)</text></svg>
