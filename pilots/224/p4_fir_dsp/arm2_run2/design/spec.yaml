resolved_questions:
- question: What happens to RUN written while BUSY, and to IN_PUSH while BUSY?
  answer: RUN while BUSY is ignored; IN_PUSH while BUSY is accepted if not full and
    is processed by a later RUN.
  status: defaulted
  by: default
  default_reason: The request does not say.
- question: What if the output FIFO would overflow (input count plus output count
    above 1024) during a RUN?
  answer: The datapath stalls until the output FIFO has room, so no result is lost.
  status: defaulted
  by: default
  default_reason: The request gives equal FIFO sizes but allows pop only by the host.
- question: Do CLEAR and RUN in the same write both act?
  answer: CLEAR wins and RUN is dropped.
  status: defaulted
  by: default
  default_reason: Ordering is unspecified.
- question: What do SAT_COUNT and SAMPLES_DONE do on overflow, and what is the STATUS
    count when 1024 entries are held?
  answer: Counters are 32-bit and wrap; counts of 1024 show as 0x400 in the 12-bit
    fields.
  status: defaulted
  by: default
  default_reason: 12 bits can hold 1024 exactly.
- question: Is the register map as given in the request final?
  answer: Yes, as in registers.map; reads of WO IN_PUSH return 0, writes to RO registers
    are ignored.
  status: defaulted
  by: default
  default_reason: Access to wrong-direction registers is not stated.
- question: What do the LEDs show?
  answer: led[0] = BUSY, led[1] = 0.
  status: defaulted
  by: default
  default_reason: Unspecified in the request.
- question: Is the clock-met report taken from post-route timing?
  answer: Yes, post-route WNS at 250 MHz is reported along with DSP count.
  status: defaulted
  by: default
  default_reason: The request asks for DSP slices used and the clock met in the build
    report.
