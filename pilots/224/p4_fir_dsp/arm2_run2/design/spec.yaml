name: fir32_sym
title: 32-tap symmetric FIR low-pass filter with FIFOs, JTAG register access
board: kr260
part: xck26-sfvc784-2LV-c
top: fir32_top
clocks:
- name: clk_25
  freq_mhz: 25
  pin: C3
  role: board clock; register bus (jtag_bus clk) and control logic
- name: clk_dsp
  freq_mhz: 250
  role: datapath clock generated from clk_25 by an MMCM; must close timing at 250
    MHz or faster
reset:
  name: rst
  polarity: active-high
  sync_to: clk_25
  note: generated inside the design by a power-on counter, held for at least 8 clk_25
    cycles; jtag_bus data/jtag_bus.sv used unchanged
parameters:
  NUM_TAPS: 32
  NUM_UNIQUE_COEFFS: 16
  DATA_WIDTH: 16
  COEFF_WIDTH: 16
  FIFO_DEPTH: 1024
  SHIFT: 15
  ROUND_CONST: 16384
  DESIGN_ID: 546570241
  RST_HOLD_CYCLES: 16
ports:
- name: clk_25
  direction: in
  width: 1
  board_pin_role: 25 MHz board clock, pin C3
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
behaviour:
  filter:
  - y[n] = saturate16((sum_{k=0..31} h[k]*x[n-k] + 0x4000) >>> 15) with exact 16x16
    products and an exact sum (no intermediate rounding).
  - Coefficients are loaded from data/coeffs.hex (tap 0 first), symmetric h[k]=h[31-k];
    pre-add x[n-k]+x[n-31+k] and use 16 multipliers on DSP slices.
  - Samples before the first one are 0.
  - Saturation clamps to -32768..32767; a clamped output increments SAT_COUNT.
  - The datapath accepts one sample per clk_dsp cycle.
  run:
  - RUN processes every sample in the input FIFO in order and pushes each result to
    the output FIFO.
  - BUSY is 1 from RUN until the last result is in the output FIFO.
  - Filter history persists between runs and is zeroed only by CLEAR.
  fifos:
  - Input FIFO holds 1024 samples; IN_PUSH when full is ignored.
  - Output FIFO holds 1024 samples; OUT_POP read removes the oldest entry.
  registers:
  - Unmapped addresses read 0 and ignore writes; all registers are 32 bits on 4-byte
    steps.
  - h_rdata shows the addressed register within 2 clk_25 cycles of h_re and holds
    it.
  - A write takes effect the clock after h_we.
  pins:
  - sfp_tx_disable is 1 at all times; no GT transceiver is used.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546570241
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESSE2 word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 read-back value
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 CLEAR self-clearing; 1 RUN self-clearing
  - offset: 20
    name: IN_PUSH
    access: WO
    reset: 0
    bits: 15:0 sample to push
  - offset: 24
    name: OUT_POP
    access: RO
    reset: 0
    bits: 31 valid; 15:0 oldest output; read pops
  - offset: 28
    name: STATUS
    access: RO
    reset: 0
    bits: 0 BUSY; 15:4 input FIFO count; 31:20 output FIFO count
  - offset: 32
    name: SAT_COUNT
    access: RO
    reset: 0
    bits: 31:0 saturated outputs since CLEAR
  - offset: 36
    name: SAMPLES_DONE
    access: RO
    reset: 0
    bits: 31:0 samples processed since CLEAR
timing:
  clk_dsp_period_ns: 4.0
  throughput: 1 sample per clk_dsp cycle once the pipeline is full
  latency:
    register_read: h_rdata valid within 2 clk_25 cycles of h_re
    register_write: effect 1 clk_25 cycle after h_we
    datapath: fixed pipeline depth in clk_dsp cycles, documented by the design (expected
      about 8 to 12)
resources_expected:
  dsp48e2: 16
  bram36: 4
  note: 16 multipliers from symmetry; two 1024x16 FIFOs (about 2 BRAM36 each if 32
    bit wide for CDC, otherwise 1 each); LUT/FF a few hundred
assumptions:
- assumption: Part is xck26-sfvc784-2LV-c.
  reason: Kria KR260 uses the K26 SOM.
- assumption: Register bus and FIFO ports run on clk_25; the datapath runs on a 250
    MHz MMCM clock with asynchronous FIFOs or handshake crossing.
  reason: The request lets the bus keep its own clock and asks for 250 MHz datapath.
- assumption: Reset is generated internally by a power-on counter.
  reason: No reset pin is named; jtag_bus needs rst held a few clocks at start.
- assumption: LEDs show BUSY on led[0] and a heartbeat-free constant 0 on led[1].
  reason: LED use is not specified.
- assumption: data/jtag_bus.sv and data/coeffs.hex could not be inspected when writing
    this spec; the register port is as described in spec.md.
  reason: Files were not readable in the design directory.
open_questions: []
