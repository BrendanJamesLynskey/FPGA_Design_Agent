name: p4_fir32
title: 32-tap symmetric FIR low-pass filter with input/output FIFOs and JTAG register
  access
board: kr260
part: xck26-sfvc784-2LV-c
top: p4_fir32_top
clocks:
- name: clk
  freq_mhz: 25
  pin: C3
  role: board clock, also the register-bus clock (h_* port of jtag_bus)
- name: clk_dsp
  freq_mhz: 250
  role: datapath clock generated by an MMCM from clk (25 MHz x 10), must close timing
    at 250 MHz or faster
reset:
  name: rst
  polarity: active high
  source: held for a few clocks at start by jtag_bus (synchronised into clk_dsp domain
    inside the design)
  note: CLEAR register bit also resets FIFOs, filter history and counters
parameters:
  NUM_TAPS: 32
  UNIQUE_COEFFS: 16
  DATA_WIDTH: 16
  COEFF_WIDTH: 16
  FIFO_DEPTH: 1024
  ACC_WIDTH: 38
  SHIFT: 15
  ROUND_CONST: 16384
  DESIGN_ID: 546570241
  MMCM_MULT: 10
  MMCM_DIV: 1
ports:
- name: clk
  direction: in
  width: 1
  board_pin_role: 25 MHz board clock on pin C3
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ laser disable, held at 1 always
- name: rst
  direction: in
  width: 1
  board_pin_role: internal reset from jtag_bus (not a board pin)
- name: h_we
  direction: in
  width: 1
  board_pin_role: internal register write pulse from jtag_bus
- name: h_re
  direction: in
  width: 1
  board_pin_role: internal register read pulse from jtag_bus
- name: h_addr
  direction: in
  width: 12
  board_pin_role: internal byte address from jtag_bus
- name: h_wdata
  direction: in
  width: 32
  board_pin_role: internal write data from jtag_bus
- name: h_rdata
  direction: out
  width: 32
  board_pin_role: internal read data to jtag_bus
behaviour:
  filter:
  - y[n] = saturate16((sum_{k=0..31} h[k]*x[n-k] + 0x4000) >>> 15), arithmetic shift,
    exact sum, no intermediate rounding.
  - Samples before the first one are 0.
  - Coefficients are read from data/coeffs.hex, 32 lines, tap 0 first, 16-bit signed
    Q1.15, symmetric h[k] = h[31-k].
  - Symmetry is used by pre-adding x[n-k] + x[n-31+k] for k = 0..15 (17-bit) then
    16 multiplies, mapped to DSP slices.
  - Saturation clamps to 32767 or -32768 and counts one saturated output.
  - The datapath accepts one sample per clk_dsp cycle.
  fifos:
  - Input FIFO holds 1024 16-bit samples and the output FIFO holds 1024 16-bit samples.
  - IN_PUSH write of the low 16 bits pushes a sample, ignored when the input FIFO
    is full.
  - OUT_POP read returns the oldest output and removes it.
  - OUT_POP on an empty output FIFO returns 0 and removes nothing.
  run:
  - Writing CTRL bit 1 starts processing of every sample in the input FIFO, in order,
    results go to the output FIFO.
  - BUSY is 1 from RUN until the last sample's result is in the output FIFO.
  - Filter history persists between runs and is zeroed only by CLEAR.
  - Chunked runs give the same output as one run over the concatenated input.
  clear:
  - CTRL bit 0 CLEAR is self-clearing, empties both FIFOs, zeroes the filter history,
    SAT_COUNT and SAMPLES_DONE.
  common_registers:
  - ID at 0x000 reads 0x20940001.
  - BUILD at 0x004 reads the USR_ACCESSE2 word.
  - SCRATCH at 0x008 is RW 32 bits and resets to 0.
  - Unmapped addresses read 0 and ignore writes.
  - h_rdata shows the addressed register within 2 clk cycles of h_re and holds it.
  - A write takes effect the clock after h_we.
  pins:
  - sfp_tx_disable is driven to 1 at all times and no GT transceiver channel is used.
  - led[0] shows BUSY and led[1] shows MMCM lock (proposal).
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546570241
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESSE2 word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 CLEAR self-clearing, 1 RUN self-clearing
  - offset: 20
    name: IN_PUSH
    access: WO
    reset: 0
    bits: 15:0 sample to push
  - offset: 24
    name: OUT_POP
    access: RO
    reset: 0
    bits: 31 valid, 15:0 oldest output, read pops
  - offset: 28
    name: STATUS
    access: RO
    reset: 0
    bits: 0 BUSY, 15:4 input FIFO count, 31:20 output FIFO count
  - offset: 32
    name: SAT_COUNT
    access: RO
    reset: 0
    bits: 31:0 saturated outputs since CLEAR
  - offset: 36
    name: SAMPLES_DONE
    access: RO
    reset: 0
    bits: 31:0 samples processed since CLEAR
timing:
  datapath_clock: clk_dsp >= 250 MHz, WNS >= 0 after route
  register_clock: clk 25 MHz
  throughput: 1 sample per clk_dsp cycle
  latency:
    register_read: h_rdata valid within 2 clk cycles of h_re
    register_write: effective 1 clk cycle after h_we
    filter_pipeline: fixed pipeline depth, determined at implementation (about 6 to
      8 clk_dsp cycles)
resources_expected:
  dsp48e2: 16
  bram36: 2
  lut: 1500
  ff: 2000
  note: FIFOs 1024x16 each fit in one BRAM36 (or two RAMB18). 16 multipliers thanks
    to symmetry.
assumptions:
- assumption: Part is xck26-sfvc784-2LV-c.
  reason: K26 SOM on the KR260.
- assumption: The FIFOs and RUN control cross between clk and clk_dsp with async FIFOs
    or handshakes.
  reason: The register bus is on the 25 MHz clk while the datapath runs at 250 MHz.
- assumption: Accumulator width 38 bits.
  reason: Worst case 32 * 2^15 * 2^15 = 2^35 magnitude needs 37 bits plus margin,
    fits DSP cascade.
- assumption: jtag_bus.sv is used unchanged and is excluded from simulation.
  reason: Request says so, it contains Xilinx primitives.
- assumption: No AXI4-Lite block, so no interfaces profile.
  reason: The host port is the simple h_* register port.
