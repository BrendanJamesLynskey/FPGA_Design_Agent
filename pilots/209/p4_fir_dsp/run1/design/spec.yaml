resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: The map as in registers.map above, taken from the request table (0x000 to
    0x008 and 0x010 to 0x024), all 32 bits.
  status: defaulted
  by: default
  default_reason: The request gives offsets, but confirm them.
- question: What happens to IN_PUSH while BUSY is 1?
  answer: Pushes are accepted if the FIFO is not full, and samples pushed during a
    run may or may not be processed in that run.
  status: defaulted
  by: default
  default_reason: The request does not say.
- question: What happens when the output FIFO would overflow during a RUN (input count
    plus output count above 1024)?
  answer: The datapath stalls until space is available, so no result is lost.
  status: defaulted
  by: default
  default_reason: Request leaves it open.
- question: What does a RUN written while BUSY do?
  answer: Ignored.
  status: defaulted
  by: default
  default_reason: Not specified.
- question: What happens when CLEAR and RUN are written together?
  answer: CLEAR wins and RUN is ignored.
  status: defaulted
  by: default
  default_reason: Not specified.
- question: What are the width and wrap of SAT_COUNT and SAMPLES_DONE?
  answer: 32-bit counters, wrap at 2^32.
  status: defaulted
  by: default
  default_reason: Not specified.
- question: What do the LEDs show?
  answer: led[0] = BUSY, led[1] = MMCM locked.
  status: defaulted
  by: default
  default_reason: Request names the LEDs but gives no function.
- question: Does CTRL read back the written bits?
  answer: CTRL reads 0 since both bits are self-clearing.
  status: defaulted
  by: default
  default_reason: RW access is stated but the bits clear themselves.
- question: Is a read of OUT_POP while empty an error?
  answer: No, returns 0 and has no side effect.
  status: defaulted
  by: default
  default_reason: Request states it returns 0.
