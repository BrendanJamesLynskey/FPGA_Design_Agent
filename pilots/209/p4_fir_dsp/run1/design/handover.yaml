- about: clock_port_name
  text: spec.yaml names the clock port clk, but design.xdc constrains a port named clk_25 (pin C3, 40 ns period, LVCMOS18).
    The XDC is what was built; the spec disagrees. The spec's clk_dsp (250 MHz from the MMCM) has no constraint in design.xdc
    and is not listed as a clock in this handover.
- about: spec_vs_rtl_unchecked
  text: The RTL sources were not shown to the Designer for this handover, so reset style, reset values, unmapped accesses
    and the read and write latencies are given as the spec states them. They are not confirmed from the RTL; the benches
    that would check them produced no results.
- about: defaulted_behaviour
  text: 'All 9 interview answers were defaulted, not given by a person. Behaviours a user could guess wrong: CLEAR wins
    over RUN when both are written together; RUN while BUSY is ignored; CTRL reads 0 because both bits self-clear; a read
    of OUT_POP on an empty FIFO returns 0 with no side effect; IN_PUSH while full is ignored; IN_PUSH during a run may or
    may not be processed in that run; the datapath stalls when the output FIFO is full so no result is lost; SAT_COUNT and
    SAMPLES_DONE are 32 bits and wrap at 2^32; unmapped addresses read 0 and ignore writes.'
- about: latency_promise
  text: The spec promises h_rdata within 2 clk cycles of h_re, writes effective 1 clk cycle after h_we, and a filter pipeline
    of about 6 to 8 clk_dsp cycles. None of these was counted from the RTL here.
- about: architecture_crossings
  text: The standards gate reports architecture.yaml crossings that name inline_in fir_regs, which is not a module of the
    design or the shell. The CDC description in architecture.yaml needs to match the real module names.
