schema: fda-handover/1
id: p4_fir_dsp
title: p4_fir32, a 32-tap symmetric FIR filter with FIFOs and JTAG register access
kind: agent-run
produced_by: agent
summary: The design is a 32-tap symmetric low-pass FIR filter (Q1.15 coefficients, 16 unique, pre-adder plus 16 DSP multipliers)
  for the KR260. It has 1024-sample input and output FIFOs and is controlled through a 32-bit register port fed by jtag_bus.
  The run stopped at rtl-design-creation after clarify and board-and-device-planning passed. Simulation produced no seeded
  results, verification reached V1 of V3, and no Vivado build was made. The specification and architecture were approved
  automatically, with no human review.
scope_not:
- Not built or measured on hardware; no synthesis, implementation, timing, power or bitstream result exists from this run.
- Not an AXI4-Lite design; the host port is the simple h_* register port.
- Does not use any GT transceiver channel; sfp_tx_disable is a static output.
- jtag_bus.sv is not part of the simulation; it is used unchanged and contains Xilinx primitives.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p4_fir32_top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261125-122959-66c4/p4_fir_dsp/design.xdc
resets:
- name: rst
  active: high
  note: Comes from jtag_bus, not a board pin. The spec says it is synchronised into clk_dsp and the datapath uses synchronous
    reset; that was not checked against the RTL here. CLEAR also resets FIFOs, history and counters.
interfaces:
- name: clk
  type: input clock, 25 MHz board clock on pin C3
  note: The spec calls this port clk; design.xdc constrains a port named clk_25 with a 40 ns period (see gap).
- name: led
  type: output, 2 bits
  note: design.xdc puts led[0] on F8 and led[1] on E8, LVCMOS18. Per spec, led[0] is BUSY and led[1] is MMCM lock.
- name: sfp_tx_disable
  type: output, 1 bit
  note: design.xdc puts it on Y10, LVCMOS33. Spec requires it to be 1 at all times.
- name: h_we, h_re, h_addr, h_wdata, h_rdata
  type: internal register port to jtag_bus (1, 1, 12, 32, 32 bits)
  note: Not board pins. h_addr is a byte address and the port runs on the 25 MHz clock.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546570241
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESSE2 word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 scratch
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 CLEAR self-clearing, 1 RUN self-clearing
- offset: 20
  name: IN_PUSH
  access: WO
  reset: 0
  bits: 15:0 sample to push
- offset: 24
  name: OUT_POP
  access: RO
  reset: 0
  bits: 31 valid, 15:0 oldest output, read pops
- offset: 28
  name: STATUS
  access: RO
  reset: 0
  bits: 0 BUSY, 15:4 input FIFO count, 31:20 output FIFO count
- offset: 32
  name: SAT_COUNT
  access: RO
  reset: 0
  bits: 31:0 saturated outputs since CLEAR
- offset: 36
  name: SAMPLES_DONE
  access: RO
  reset: 0
  bits: 31:0 samples processed since CLEAR
parameters:
- name: NUM_TAPS
  value: 32
  legal: 32 only; the pre-adder structure assumes 2 x UNIQUE_COEFFS
  note: Symmetric taps, h[k] = h[31-k], read from data/coeffs.hex.
- name: UNIQUE_COEFFS
  value: 16
  legal: NUM_TAPS / 2
  note: Equals the number of multipliers and DSP48E2 slices expected (16).
- name: DATA_WIDTH
  value: 16
  legal: 16 only; the register fields are fixed at 16 bits
  note: Signed sample width.
- name: COEFF_WIDTH
  value: 16
  legal: 16 only (signed Q1.15)
  note: Coefficient width.
- name: FIFO_DEPTH
  value: 1024
  legal: 1024; the STATUS count fields are 12 bits wide
  note: Applies to both FIFOs. The spec expects one BRAM36 each.
- name: ACC_WIDTH
  value: 38
  legal: at least 37 bits
  note: The spec gives a worst case of 2^35 magnitude plus margin.
- name: SHIFT
  value: 15
  legal: 15 for Q1.15
  note: Arithmetic right shift after rounding.
- name: ROUND_CONST
  value: 16384
  legal: 2^(SHIFT-1)
  note: This is 0x4000, added before the shift.
- name: DESIGN_ID
  value: 546570241
  legal: any 32-bit value
  note: Reads back as 0x20940001 in ID.
- name: MMCM_MULT
  value: 10
  legal: must keep the MMCM VCO in range
  note: 25 MHz x 10 gives clk_dsp = 250 MHz, which the spec requires to close timing; not yet measured.
- name: MMCM_DIV
  value: 1
  legal: 1 or more, keeping clk_dsp at 250 MHz or faster
  note: Divider with MMCM_MULT.
