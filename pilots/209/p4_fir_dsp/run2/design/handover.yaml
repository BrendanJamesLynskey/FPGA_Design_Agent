- about: busy_behaviour
  text: By interview defaults in spec.yaml, IN_PUSH and CLEAR are ignored while BUSY is 1, and a RUN during BUSY is ignored.
    OUT_POP works normally during BUSY. These come from the spec, not from checked RTL.
- about: clear_run_priority
  text: By default in spec.yaml, if CLEAR and RUN are written in the same write, CLEAR wins and RUN is dropped. RUN on an
    empty input FIFO does nothing and BUSY stays 0.
- about: run_partial
  text: By default in spec.yaml, RUN processes only min(input count, output free space) samples and leaves the rest in the
    input FIFO. It drops no outputs.
- about: unmapped_registers
  text: Per spec.yaml, unmapped and reserved offsets read 0 and ignore writes. Writes to read-only registers are presumed
    ignored but the spec does not say so.
- about: counter_width
  text: SAT_COUNT and SAMPLES_DONE are 32-bit counters that wrap at 2^32 (spec default). The STATUS FIFO count fields are
    12 bits and a full FIFO reads 1,024.
- about: latency_count
  text: The spec expects a filter pipeline of about 8 clk_dsp cycles and leaves it to the design. The count was not taken
    from the RTL in this review, so the real figure is unknown. Bus read latency is specified as at most 2 clk_bus cycles
    and was not simulated.
- about: architecture_crossings
  text: The standards gate reports that architecture.yaml names inline_in fir_core, which is not a module of this design
    or the shell. This is a mismatch between architecture.yaml and the RTL and must be fixed before the CDC checks can run.
- about: assumptions
  text: The run assumed the bus runs on clk_25 directly, BUILD (USR_ACCESSE2) is not simulated, jtag_bus.sv is used unchanged
    and excluded from simulation, and the coefficients are loaded by $readmemh of data/coeffs.hex.
- about: pin_voltage
  text: design.xdc puts sfp_tx_disable on Y10 at LVCMOS33 and the other pins at LVCMOS18. design.xdc defines only the clk_25
    clock (40.00 ns). The 250 MHz clk_dsp period is not constrained there and depends on the MMCM being derived.
