schema: fda-handover/1
id: p4_fir_dsp
title: 32-tap symmetric FIR low-pass filter with FIFOs and a JTAG register bus (KR260)
kind: agent-run
produced_by: agent
summary: The design is a 32-tap symmetric FIR filter. It adds mirrored taps before 16 multiplications, takes input samples
  through an input FIFO and returns saturated 16-bit results through an output FIFO. A host drives it over a simple register
  port behind a JTAG bridge. The run stopped in rtl-design-creation, after the clarify and board-and-device-planning stages
  passed. Verification reached V1 of V3, no Vivado build was made, and nothing was measured on hardware.
scope_not:
- Not a general FIR core. Coefficients come from data/coeffs.hex at build time and cannot be changed at run time.
- Not an AXI4-Lite design. The host port is the h_we/h_re register port and no interface profile is declared.
- Not a transceiver design. No GT channel is used and sfp_tx_disable is a constant output.
- Not built, routed or run on a board. No bitstream was produced in this run.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: fir_top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261125-130418-8166/p4_fir_dsp/design.xdc
resets:
- name: rst
  active: high
  note: Per spec.yaml it is synchronous in each clock domain, held by a power-up counter in the clk_bus domain and released
    only after MMCM lock. The RTL was not shown in this review, so the reset style actually built is unchecked.
interfaces:
- name: clk_25
  type: input clock, 25 MHz, pin C3, LVCMOS18
  note: Board clock. It feeds the MMCM and is also the register bus clock (design.xdc, period 40.00 ns).
- name: led
  type: 2-bit output, F8 and E8, LVCMOS18
  note: The spec proposes led[0] = BUSY and led[1] = MMCM locked. This is a default and not confirmed by hardware. design.xdc
    maps led[0] to F8 and led[1] to E8.
- name: sfp_tx_disable
  type: 1-bit output, Y10, LVCMOS33
  note: Constant 1, which turns the laser off.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546570241
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESSE2 word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 read back what was written
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 CLEAR self-clearing, 1 RUN self-clearing
- offset: 20
  name: IN_PUSH
  access: WO
  reset: 0
  bits: 15:0 sample pushed
- offset: 24
  name: OUT_POP
  access: RO
  reset: 0
  bits: 31 valid, 15:0 oldest output, read pops
- offset: 28
  name: STATUS
  access: RO
  reset: 0
  bits: 0 BUSY, 15:4 input FIFO count, 31:20 output FIFO count
- offset: 32
  name: SAT_COUNT
  access: RO
  reset: 0
  bits: 31:0 saturated outputs since CLEAR
- offset: 36
  name: SAMPLES_DONE
  access: RO
  reset: 0
  bits: 31:0 samples processed since CLEAR
parameters:
- name: NUM_TAPS
  value: 32
  legal: 32 only; the symmetric pre-add structure assumes it
  note: Number of filter taps. The coefficients are symmetric, h[k]=h[31-k].
- name: UNIQUE_COEFFS
  value: 16
  legal: NUM_TAPS/2
  note: Number of multipliers after pre-adding. It is 16 DSP48E2 slices in the architecture.
- name: DATA_WIDTH
  value: 16
  legal: 16 only
  note: Signed sample width. The pre-adder output is 17 bits.
- name: COEFF_WIDTH
  value: 16
  legal: 16 only
  note: Signed Q1.15 coefficients.
- name: FIFO_DEPTH
  value: 1024
  legal: 1024 as specified
  note: Depth of each FIFO. STATUS count fields are 12 bits wide.
- name: SHIFT
  value: 15
  legal: 15 only
  note: Right shift after rounding, matching the Q1.15 coefficients.
- name: ROUND_CONST
  value: 16384
  legal: 2^(SHIFT-1)
  note: Rounding constant 0x4000 added before the shift.
- name: ID_VALUE
  value: 546570241
  legal: any 32-bit value
  note: Read from the ID register. It equals 0x20940001.
- name: SFP_TX_DISABLE_VALUE
  value: 1
  legal: 1 (laser off) as specified
  note: Level driven on sfp_tx_disable.
