name: p4_fir32
title: 32-tap symmetric FIR low-pass filter with FIFOs, JTAG register bus
board: kr260
part: xck26-sfvc784-2LV-c
top: fir_top
clocks:
- name: clk_25
  freq_mhz: 25
  pin: C3
  role: board clock, input of the MMCM
- name: clk_dsp
  freq_mhz: 250
  role: datapath clock generated from clk_25 by an MMCM (25 MHz x 10 = 250 MHz), timing
    target 250 MHz or faster
- name: clk_bus
  freq_mhz: 25
  role: register bus clock for jtag_bus.sv (clk_25 directly), clock-domain crossing
    to clk_dsp needed
reset:
  name: rst
  polarity: active high
  sync: synchronous to each clock domain (per-domain synchroniser)
  source: held for a few clocks at start (power-up counter in clk_bus domain), released
    only after MMCM lock
parameters:
  NUM_TAPS: 32
  UNIQUE_COEFFS: 16
  DATA_WIDTH: 16
  COEFF_WIDTH: 16
  FIFO_DEPTH: 1024
  SHIFT: 15
  ROUND_CONST: 16384
  ID_VALUE: 546570241
  SFP_TX_DISABLE_VALUE: 1
ports:
- name: clk_25
  direction: in
  width: 1
  board_pin_role: 25 MHz board clock, pin C3
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
behaviour:
  filter:
  - y[n] = saturate16((sum over k=0..31 of h[k]*x[n-k] + 0x4000) >>> 15), with the
    sum exact (no intermediate rounding).
  - Samples before the first one are 0.
  - Coefficients are read from data/coeffs.hex (tap 0 first, 16-bit signed Q1.15,
    symmetric h[k]=h[31-k]).
  - Symmetry is used by adding x[n-k] + x[n-31+k] (17-bit pre-adder) before 16 multiplications.
  - Saturation clamps to -32768 or 32767 and increments SAT_COUNT by 1 for that output.
  - The datapath accepts one sample per clk_dsp cycle and produces one output per
    cycle.
  fifo_run:
  - IN_PUSH writes the low 16 bits into the input FIFO (1024 deep), ignored when full.
  - RUN processes every sample in the input FIFO in order and pushes each result to
    the output FIFO (1024 deep).
  - Filter history persists between runs and is zeroed only by CLEAR.
  - BUSY is 1 from the RUN command until the last result is in the output FIFO.
  - OUT_POP read removes the oldest output when the FIFO is non-empty.
  control:
  - CLEAR (CTRL bit 0) empties both FIFOs, zeroes filter history, SAT_COUNT and SAMPLES_DONE,
    and reads back 0.
  - RUN (CTRL bit 1) self-clears and reads back 0.
  bus:
  - 'Register port from data/jtag_bus.sv (unchanged): h_we, h_re, h_addr[11:0], h_wdata,
    h_rdata in the clk_bus domain.'
  - A write takes effect the clock after h_we.
  - After h_re, h_rdata shows the addressed register within 2 clocks and holds it.
  - Unmapped addresses read 0 and ignore writes.
  pins:
  - sfp_tx_disable is driven 1 at all times and no GT transceiver channel is used.
  - led[1:0] show led[0] = BUSY, led[1] = MMCM locked (proposed).
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546570241
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESSE2 word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 read back what was written
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 CLEAR self-clearing, 1 RUN self-clearing
  - offset: 20
    name: IN_PUSH
    access: WO
    reset: 0
    bits: 15:0 sample pushed
  - offset: 24
    name: OUT_POP
    access: RO
    reset: 0
    bits: 31 valid, 15:0 oldest output, read pops
  - offset: 28
    name: STATUS
    access: RO
    reset: 0
    bits: 0 BUSY, 15:4 input FIFO count, 31:20 output FIFO count
  - offset: 32
    name: SAT_COUNT
    access: RO
    reset: 0
    bits: 31:0 saturated outputs since CLEAR
  - offset: 36
    name: SAMPLES_DONE
    access: RO
    reset: 0
    bits: 31:0 samples processed since CLEAR
timing:
  datapath_clock: clk_dsp >= 250 MHz (period <= 4.0 ns), WNS >= 0 after route
  throughput: 1 sample per clk_dsp cycle
  bus_read: h_rdata valid within 2 clk_bus cycles of h_re
  latency:
    filter_pipeline: fixed number of clk_dsp cycles from sample in to result out (to
      be set by design, expected about 8)
    run_total: N input samples take N plus pipeline latency clk_dsp cycles plus crossing
resources_expected:
  dsp48e2: 16
  bram: 2 to 4 (two 1024x16 FIFOs, 18Kb or 36Kb blocks)
  mmcm: 1
  lut_ff: under 2000 LUTs
  gt_channels: 0
assumptions:
- assumption: Register bus runs on clk_25 directly, datapath on a 250 MHz MMCM clock.
  reason: The request allows the bus on its own clock and asks for 250 MHz or faster
    on the datapath.
- assumption: BUILD is read through USR_ACCESSE2 and not simulated.
  reason: The primitive is Xilinx-only and the request says test the register port
    directly.
- assumption: jtag_bus.sv is used unchanged and excluded from simulation.
  reason: The request says so.
- assumption: Coefficients are embedded via $readmemh of data/coeffs.hex.
  reason: The request says the file is available at build and simulation.
- assumption: No AXI4-Lite block exists so no interface profile is declared.
  reason: The host port is the simple h_we/h_re register port.
open_questions: []
