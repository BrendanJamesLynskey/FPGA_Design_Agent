resolved_questions:
- question: What happens to RUN when the output FIFO has less free space than the
    input FIFO holds?
  answer: RUN processes only min(input count, output free space) samples and leaves
    the rest in the input FIFO.
  status: defaulted
  by: default
  default_reason: Avoids dropping outputs silently, the request does not say.
- question: What happens to IN_PUSH, OUT_POP or CLEAR while BUSY is 1?
  answer: IN_PUSH is ignored while BUSY, OUT_POP works normally, CLEAR is ignored
    while BUSY, a RUN while BUSY is ignored.
  status: defaulted
  by: default
  default_reason: Keeps the processed set well defined.
- question: What does RUN do with an empty input FIFO?
  answer: Nothing, BUSY stays 0.
  status: defaulted
  by: default
  default_reason: No samples to process.
- question: What happens if CLEAR and RUN are written in the same write?
  answer: CLEAR wins, RUN is dropped.
  status: defaulted
  by: default
  default_reason: Both are self-clearing and CLEAR gives a known state.
- question: What do the two user LEDs show?
  answer: led[0] = BUSY, led[1] = MMCM locked.
  status: defaulted
  by: default
  default_reason: Request gives the pins only.
- question: Width and wrap of SAT_COUNT and SAMPLES_DONE?
  answer: 32-bit counters that wrap at 2^32.
  status: defaulted
  by: default
  default_reason: Registers are 32 bits and 10,000 samples fit easily.
- question: Is the register map exactly as in the request table?
  answer: Yes, registers at 0x000-0x008 and 0x010-0x024 as listed, reserved offsets
    read 0.
  status: defaulted
  by: default
  default_reason: Offsets are given in the request, this confirms the map.
