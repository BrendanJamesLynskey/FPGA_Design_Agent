resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: The map in spec.md (0x000 ID, 0x004 BUILD, 0x008 SCRATCH, 0x010 CTRL, 0x014
    IN_PUSH, 0x018 OUT_POP, 0x01C STATUS, 0x020 SAT_COUNT, 0x024 SAMPLES_DONE), all
    32 bits, resets 0 except ID
  status: defaulted
  by: default
  default_reason: spec.md gives offsets; confirm they are final
- question: What happens to samples pushed while BUSY?
  answer: Pushes during a run are accepted but not processed until the next RUN
  status: defaulted
  by: default
  default_reason: the request says RUN processes what is in the FIFO, nothing about
    concurrent pushes
- question: What happens to a RUN written while BUSY, or with an empty input FIFO?
  answer: Ignored while BUSY; with an empty FIFO it completes at once with no output
  status: defaulted
  by: default
  default_reason: unspecified
- question: What if the output FIFO would overflow (input plus output count above
    1024)?
  answer: RUN processes only as many samples as fit in the output FIFO free space
  status: defaulted
  by: default
  default_reason: no output sample may be lost or the bit-exact check breaks
- question: What if CLEAR and RUN are written together, or CLEAR while BUSY?
  answer: CLEAR wins and aborts any run; RUN in the same write is ignored
  status: defaulted
  by: default
  default_reason: unspecified
- question: What do the LEDs show?
  answer: led[0] = BUSY, led[1] = MMCM locked
  status: defaulted
  by: default
  default_reason: not specified
- question: Do SAT_COUNT and SAMPLES_DONE wrap at 32 bits?
  answer: Yes, they wrap
  status: defaulted
  by: default
  default_reason: width not stated
- question: Does the bit-exact result need OUT_POP sign extension?
  answer: No, bits 30:16 are 0, host takes bits 15:0
  status: defaulted
  by: default
  default_reason: table gives bit 31 and bits 15:0 only
