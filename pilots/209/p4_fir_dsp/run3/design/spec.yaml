name: fir32_sym
title: 'P4: 32-tap symmetric FIR low-pass filter with FIFOs, JTAG register bus'
board: kr260
part: xck26-sfvc784-2LV-c
top: fir32_top
clocks:
- name: clk25
  pin: C3
  freq_mhz: 25
  role: board clock, drives the register bus (jtag_bus clk) and the clock generator
- name: clk_dsp
  freq_mhz: 250
  role: datapath clock made from clk25 by an MMCM (25 MHz x 10), one sample per clock,
    must close at 250 MHz or faster
reset:
  name: rst
  polarity: active high
  sync: synchronous
  note: held for a few clocks at start by jtag_bus.sv; a copy is synchronised into
    clk_dsp; MMCM lock also holds the datapath in reset
parameters:
  NUM_TAPS: 32
  UNIQUE_COEFFS: 16
  DATA_WIDTH: 16
  COEFF_WIDTH: 16
  ACC_WIDTH: 37
  FIFO_DEPTH: 1024
  ROUND_CONST: 16384
  SHIFT: 15
  DESIGN_ID: 546570241
  MMCM_MULT: 10
  MMCM_DIV: 1
ports:
- name: clk25
  direction: in
  width: 1
  board_pin_role: 25 MHz board clock, pin C3
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, held 1 (laser off) at all times
- name: h_we
  direction: internal
  width: 1
  board_pin_role: jtag_bus register port, write pulse
- name: h_re
  direction: internal
  width: 1
  board_pin_role: jtag_bus register port, read pulse
- name: h_addr
  direction: internal
  width: 12
  board_pin_role: jtag_bus register port, byte address
- name: h_wdata
  direction: internal
  width: 32
  board_pin_role: jtag_bus register port, write data
- name: h_rdata
  direction: internal
  width: 32
  board_pin_role: jtag_bus register port, read data
behaviour:
  filter:
  - y[n] = saturate16((sum for k=0..31 of h[k]*x[n-k] + 0x4000) >>> 15), exact sum,
    arithmetic shift.
  - Samples before the first are 0; x is 16-bit signed, h is 16-bit signed Q1.15 from
    data/coeffs.hex, tap 0 first.
  - Coefficients are symmetric h[k] = h[31-k]; pre-add x[n-k] + x[n-31+k] (17 bits)
    and use 16 multipliers on DSP slices.
  - Saturation clamps to 32767 or -32768 and increments SAT_COUNT by 1 for that output.
  - Datapath accepts one sample per clk_dsp cycle.
  run:
  - Writing CTRL bit 1 starts a run that processes every sample in the input FIFO
    at the time of the command, in order, pushing results to the output FIFO.
  - Filter history persists between runs until CLEAR.
  - BUSY is 1 from the RUN write until the last result is in the output FIFO.
  - SAMPLES_DONE increments by 1 per processed sample.
  clear:
  - Writing CTRL bit 0 empties both FIFOs, zeroes the filter history, SAT_COUNT and
    SAMPLES_DONE.
  - CTRL bits 0 and 1 are self-clearing and read back 0.
  fifo:
  - IN_PUSH stores the low 16 bits; ignored when the input FIFO holds 1024 samples.
  - OUT_POP read returns 0x80000000 | oldest output (sign bits not extended, bits
    30:16 = 0) and removes it; empty returns 0.
  bus:
  - Design uses data/jtag_bus.sv unchanged; register port is in the clk25 domain.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - ID at 0x000 reads 0x20940001; BUILD at 0x004 reads USR_ACCESSE2; SCRATCH at 0x008
    is RW, reset 0.
  - sfp_tx_disable is constant 1; no GT transceiver is used.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546570241
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 CLEAR self-clearing; 1 RUN self-clearing
  - offset: 20
    name: IN_PUSH
    access: WO
    reset: 0
    bits: 15:0 sample
  - offset: 24
    name: OUT_POP
    access: RO
    reset: 0
    bits: 31 valid; 15:0 oldest output; read pops
  - offset: 28
    name: STATUS
    access: RO
    reset: 0
    bits: 0 BUSY; 15:4 input FIFO count; 31:20 output FIFO count
  - offset: 32
    name: SAT_COUNT
    access: RO
    reset: 0
    bits: 31:0 saturated outputs since CLEAR
  - offset: 36
    name: SAMPLES_DONE
    access: RO
    reset: 0
    bits: 31:0 samples processed since CLEAR
timing:
  datapath_clock: 250 MHz (4 ns period), one sample per clk_dsp cycle
  bus_clock: 25 MHz
  latency:
    register_read: h_rdata valid within 2 clk25 cycles of h_re
    register_write: effect 1 clk25 cycle after h_we
    filter_pipeline: fixed pipeline depth of a few clk_dsp cycles from FIFO pop to
      FIFO push, set by DSP48 pipelining
resources_expected:
  dsp48: 16 (one per unique coefficient); report must list DSP usage
  bram: 2 x 1024x16 FIFOs (about 1 BRAM36 each or 1 BRAM18 each)
  lut_ff: a few hundred LUTs, under 2000 FFs
  timing: WNS >= 0 at 250 MHz on clk_dsp; report shows achieved clock
assumptions:
- text: Datapath clock is 250 MHz from an MMCM
  reason: the request needs 250 MHz or faster and gives a 25 MHz board clock
- text: Register bus stays on clk25
  reason: request says the bus may remain on its own clock
- text: FIFOs are dual-clock (write/read across clk25 and clk_dsp)
  reason: bus and datapath are in different clock domains
- text: LEDs show BUSY on led[0] and lock/heartbeat on led[1]
  reason: request names the LEDs but gives no function
- text: data/jtag_bus.sv and coeffs.hex were not readable when writing this spec
  reason: interface taken from spec.md text only
open_questions: []
