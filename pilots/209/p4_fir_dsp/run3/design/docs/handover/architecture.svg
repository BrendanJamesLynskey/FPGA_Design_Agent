<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="300" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">jtag_bus</text><text x="170" y="43">BSCANE2 USER4 register bus, supplied data/jtag_bus.sv</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">fir32_core</text><text x="170" y="77">register map, CTRL/STATUS, LEDs, CDC of commands and status</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">in_fifo</text><text x="170" y="111">1024x16 xpm_fifo_async, clk25 to clk_dsp</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">out_fifo</text><text x="170" y="145">1024x16 xpm_fifo_async, clk_dsp to clk25</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">fir_datapath</text><text x="170" y="179">run controller, pre-add, 16 DSP multipliers, round, saturate</text><rect x="8" y="196" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="213">clk_gen</text><text x="170" y="213">MMCM 25 MHz x10 to 250 MHz, BUFG, reset synchroniser</text><text x="8" y="240" font-weight="bold">Interfaces</text><text x="8" y="258">jtag_bus - fir32_core: reg_port (simple)</text><text x="8" y="276">fir32_core - board: led_out (gpio)</text></svg>
