    spec: ["behaviour.run[1]"]
    tests: [fir_bench.test_history_clear]
  - id: REQ-23
    spec: ["behaviour.run[3]", "registers.map.SAMPLES_DONE"]
    tests: [fir_bench.test_saturation, fir_bench.test_impulse]
  - id: REQ-24
    spec: ["behaviour.clear[0]", "behaviour.clear[1]", "registers.map.CTRL"]
    tests: [fir_bench.test_history_clear]
  - id: REQ-16
    spec: ["behaviour.fifo[0]", "registers.map.IN_PUSH"]
    tests: [fir_bench.test_fifo_full_empty, fir_bench.test_impulse]
  - id: REQ-17
    spec: ["behaviour.fifo[1]", "registers.map.OUT_POP"]
    tests: [fir_bench.test_impulse, fir_bench.test_fifo_full_empty]
