- about: latency
  text: 'latency not measured: the run measured no latency; the spec''s latency promise is checked only by the benches'
- about: throughput
  text: 'throughput not measured: the run measured no throughput'
- about: clock_port_name
  text: design.xdc constrains a port named clk_25 with a 40 ns period (25 MHz) on C3. spec.yaml and ARCHITECTURE.md name
    it clk25. The XDC is what was built, so the top level must expose clk_25.
- about: xdc_clocks
  text: design.xdc has no constraint for the 250 MHz clk_dsp. Whether the MMCM output is auto-derived was not checked, since
    no build ran.
- about: spec_sources_unread
  text: spec.yaml records that data/jtag_bus.sv and coeffs.hex were not readable when the spec was written, so the bus interface
    came from spec.md text only. The 12-bit h_addr and the register timing are therefore unconfirmed against that file.
- about: defaulted_behaviour
  text: 'All 8 interview answers were defaulted, not answered by a person. Decided by default: pushes during BUSY are accepted
    but processed at the next RUN; RUN while BUSY is ignored; RUN with an empty input FIFO completes at once with no output;
    RUN processes only as many samples as fit in the output FIFO; CLEAR wins over a RUN in the same write and aborts a run;
    SAT_COUNT and SAMPLES_DONE wrap at 32 bits; OUT_POP bits 30:16 are 0.'
- about: unmapped_access
  text: Per spec.yaml, unmapped addresses read 0 and ignore writes. Writes to the read-only registers are presumably ignored
    too, but the spec does not say so and no RTL was reviewed.
- about: read_side_effect
  text: An OUT_POP read removes the oldest output as a side effect. An empty FIFO returns 0, so a valid sample with value
    0 is told apart only by bit 31.
- about: latency_count
  text: The spec promises h_rdata within 2 clk25 cycles of h_re, a write effect 1 clk25 cycle after h_we, and a filter pipeline
    of a few clk_dsp cycles. None was counted from the RTL here, because no passing simulation or build exists to count
    from.
