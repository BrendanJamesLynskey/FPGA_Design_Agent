# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: p4_fir_dsp
title: 32-tap symmetric FIR low-pass filter with FIFOs and JTAG register bus (KR260)
kind: agent-run
produced_by: agent
summary: The design is a 32-tap symmetric FIR filter on the KR260. It is meant to use 16 DSP multipliers at 250 MHz from
  an MMCM, two 1024-sample FIFOs, and a register bus on the 25 MHz clock reached over JTAG. The host pushes samples, writes
  RUN, and pops saturated 16-bit outputs. The run stopped in stage rtl-design-creation after six visits with the same failure.
  Verification reached V1 of V3, and no Vivado build, timing, power or board result exists.
scope_not:
- Not built or measured on hardware. Synthesis, implementation, timing, power and bring-up were not run.
- Not a general FIR. The coefficients are fixed, symmetric, and loaded from data/coeffs.hex at build time.
- Not a transceiver design. sfp_tx_disable is meant to be held at 1 and no GT channel is used.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: fir32_top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261125-133549-a1e9/p4_fir_dsp/design.xdc
resets:
- name: rst
  active: high
  note: Per spec.yaml it is synchronous and held for a few clocks at start by jtag_bus.sv. A copy is synchronised into clk_dsp,
    and MMCM lock also holds the datapath in reset. This was not confirmed in a passing build.
interfaces:
- name: clk_25
  type: input clock, pin C3, LVCMOS18, 25 MHz
  note: design.xdc names the port clk_25 and constrains it with a 40 ns period. spec.yaml and ARCHITECTURE.md call it clk25,
    so the spec disagrees with the XDC on the name.
- name: led
  type: output, 2 bits (F8 and E8, LVCMOS18)
  note: Per the spec's assumption led[0] shows BUSY and led[1] shows MMCM lock or heartbeat. The function was defaulted,
    not specified.
- name: sfp_tx_disable
  type: output, 1 bit (Y10, LVCMOS33)
  note: Meant to be constant 1, laser off.
- name: h_we, h_re, h_addr, h_wdata, h_rdata
  type: internal register port (1, 1, 12, 32 and 32 bits)
  note: This is the jtag_bus register port in the clk25 domain, not a top-level pin group.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546570241
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 scratch
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 CLEAR self-clearing; 1 RUN self-clearing
- offset: 20
  name: IN_PUSH
  access: WO
  reset: 0
  bits: 15:0 sample
- offset: 24
  name: OUT_POP
  access: RO
  reset: 0
  bits: 31 valid; 15:0 oldest output; read pops
- offset: 28
  name: STATUS
  access: RO
  reset: 0
  bits: 0 BUSY; 15:4 input FIFO count; 31:20 output FIFO count
- offset: 32
  name: SAT_COUNT
  access: RO
  reset: 0
  bits: 31:0 saturated outputs since CLEAR
- offset: 36
  name: SAMPLES_DONE
  access: RO
  reset: 0
  bits: 31:0 samples processed since CLEAR
parameters:
- name: NUM_TAPS
  value: 32
  legal: 32 only; the pre-add pairing assumes an even tap count
  note: Symmetric, h[k] = h[31-k].
- name: UNIQUE_COEFFS
  value: 16
  legal: NUM_TAPS/2
  note: One DSP multiplier per unique coefficient.
- name: DATA_WIDTH
  value: 16
  legal: 16 only
  note: Signed samples. The pre-add result is 17 bits.
- name: COEFF_WIDTH
  value: 16
  legal: 16 only
  note: Signed Q1.15.
- name: ACC_WIDTH
  value: 37
  legal: at least the width of the exact sum
  note: Holds the exact sum before rounding.
- name: FIFO_DEPTH
  value: 1024
  legal: 1024 per the spec
  note: The STATUS count fields are 12 bits wide, so counts up to 1024 fit.
- name: ROUND_CONST
  value: 16384
  legal: 2^(SHIFT-1)
  note: Equals 0x4000, added before the arithmetic shift.
- name: SHIFT
  value: 15
  legal: 15 for Q1.15
  note: Arithmetic right shift before saturation.
- name: DESIGN_ID
  value: 546570241
  legal: any 32-bit value
  note: Equals 0x20940001, read at ID.
- name: MMCM_MULT
  value: 10
  legal: set by the MMCM VCO range
  note: 25 MHz x 10 gives the 250 MHz clk_dsp, which is a 4 ns period and one sample per clock.
- name: MMCM_DIV
  value: 1
  legal: set by the MMCM VCO range
  note: Divider for the datapath clock.
