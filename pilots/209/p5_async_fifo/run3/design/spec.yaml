resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: The map in spec.md as written in registers.map, all 32 bits on 4-byte steps,
    with 0x030 SNAPSHOT write-only.
  status: defaulted
  by: default
  default_reason: The request gives offsets, and this confirms them for the harness;
    an answered map overrides the proposal.
- question: Which clock drives the register port (clk of jtag_bus)?
  answer: clk25
  status: defaulted
  by: default
  default_reason: Not stated. A free-running clock is required and clk25 is on a plain
    pin.
- question: How is the snapshot of reader-domain counters made coherent with writer-domain
    counters?
  answer: On SNAPSHOT write a request toggle goes to the gt_refclk domain which freezes
    its counters and returns them by handshake, while writer-domain counters freeze
    at the same request. Words in flight can make the two sides differ by up to 512.
  status: defaulted
  by: default
  default_reason: Two unrelated clocks cannot be sampled at one true instant.
- question: What do snapshot registers return before any SNAPSHOT write?
  answer: 0, shadow registers reset to 0
  status: defaulted
  by: default
  default_reason: Not stated.
- question: Which bit does INJECT flip and in which word?
  answer: Bit 0 of the next word received after INJECT is set. INJECT is ignored while
    RUN is 0.
  status: defaulted
  by: default
  default_reason: The request says one bit of one word, with no position.
- question: Does CLEAR also clear the pending INJECT, SLOW_READ and the FIFO contents?
  answer: CLEAR empties the FIFO, clears counters and the pending INJECT. SLOW_READ
    is unchanged.
  status: defaulted
  by: default
  default_reason: The request says counters and sequences restart.
- question: What happens to words still in the FIFO when RUN goes from 1 to 0?
  answer: The writer stops at once and the reader keeps draining and checking until
    empty, so both sequences stay aligned.
  status: defaulted
  by: default
  default_reason: Not stated. Stopping the reader at once would leave unchecked words
    that mismatch after the next RUN without CLEAR.
- question: Is OCC_MAX measured in the writer domain and can it reach 512?
  answer: Writer-domain fill estimate from the synchronised read pointer, so it may
    read slightly high, and the maximum value is 512.
  status: defaulted
  by: default
  default_reason: Exact fill is not observable across two clocks.
- question: What do the LEDs show?
  answer: led[0] = RUN, led[1] = sticky error flag (any of DATA_ERRS, OVERFLOWS, UNDERFLOWS
    non-zero)
  status: defaulted
  by: default
  default_reason: LED use is not specified.
- question: What tolerance counts as the word counts moving at the clock rate?
  answer: WORDS_W delta per 10 s equals 250 Mwords within 0.1 percent when STALL_W
    delta is 0
  status: defaulted
  by: default
  default_reason: No numeric tolerance is given.
- question: Is the reset internal?
  answer: Yes, a power-on counter of 16 clk25 cycles
  status: defaulted
  by: default
  default_reason: No reset pin is named in the request.
