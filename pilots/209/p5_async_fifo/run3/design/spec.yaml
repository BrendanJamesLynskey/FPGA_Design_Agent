name: p5_async_fifo_soak
title: 'P5: asynchronous FIFO soak (25 MHz writer, 156.25 MHz reader, PRBS-31 checked)'
board: kr260
part: xck26-sfvc784-2LV-c
top: top
clocks:
- name: clk25
  role: C3 pin, 25 MHz, writer domain, also the clk of jtag_bus and the register port
  freq_mhz: 25
  period_ns: 40.0
- name: gt_refclk
  role: SFP+ MGTREFCLK0 via IBUFDS_GTE4 and BUFG_GT, 156.25 MHz, reader domain
  freq_mhz: 156.25
  period_ns: 6.4
- name: crossing_note
  role: clk25 and gt_refclk are unrelated; declare them asynchronous clock groups
    and constrain every crossing with set_max_delay -datapath_only or set_bus_skew
reset:
  name: rst
  polarity: active high
  description: Generated internally by a power-on counter in clk25 (held for 16 clocks),
    synchronised into the gt_refclk domain. jtag_bus takes rst as an input.
parameters:
  FIFO_DEPTH: 512
  DATA_WIDTH: 32
  PRBS_SEED: 2147483647
  DESIGN_ID: 546635777
  SLOW_READ_DIV_CYCLES: 8
  ADDR_WIDTH: 9
  RESET_CYCLES: 16
ports:
- name: clk25
  direction: input
  width: 1
  board_pin_role: C3 25 MHz clock
- name: gt_refclk_p
  direction: input
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 P
- name: gt_refclk_n
  direction: input
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 N
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ TX_DISABLE, held at 1 (laser off)
behaviour:
  writer:
  - Domain clk25. While RUN is 1 and the FIFO is not full, the writer pushes one 32-bit
    PRBS-31 word on every clk25.
  - PRBS-31 polynomial x^31 + x^28 + 1, 32 new bits per word, seed 0x7FFFFFFF.
  - When RUN is 1 and the FIFO is full the writer holds the word and STALL_W increments.
  - A write attempted while full would increment OVERFLOWS (must stay 0 because the
    writer gates on full).
  reader:
  - Domain gt_refclk. While RUN is 1 and the FIFO is not empty the reader pops a word
    and compares it with its own PRBS-31 copy started from the same seed.
  - A mismatch increments DATA_ERRS. WORDS_R increments for every word read and checked.
  - A read attempted while empty would increment UNDERFLOWS (must stay 0 because the
    reader gates on empty).
  - With SLOW_READ=1 the reader pops at most one word every 8 gt_refclk cycles.
  - INJECT (self-clearing) flips one bit of exactly one received word before the check,
    once.
  fifo:
  - Asynchronous FIFO, 512 words x 32 bits, Gray-coded pointers with two-flop synchronisers.
  - OCC_MAX holds the highest fill seen, in words, measured in the writer domain.
  control:
  - RUN=0 stops the writer. CLEAR is accepted only while RUN is 0 and resets counters,
    both PRBS sequences and the FIFO pointers. CLEAR is ignored when RUN is 1.
  - SNAPSHOT write latches all seven counters at one request instant into shadow registers.
    Reads of 0x014 to 0x02C return the shadow values.
  - Counters are 32 bits and wrap.
  host_bus:
  - Register port from data/jtag_bus.sv, used unchanged. h_we and h_re pulses, h_addr[11:0],
    h_wdata, h_rdata.
  - A write takes effect the clock after h_we. h_rdata shows the addressed register
    within 2 clocks of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - ID at 0x000 reads 0x20950001. BUILD at 0x004 reads the USR_ACCESSE2 DATA word.
    SCRATCH at 0x008 is RW and resets to 0.
  pins:
  - sfp_tx_disable is driven to 1 at all times. No GT transceiver channel is used,
    only the reference clock buffer.
  - led[0] shows RUN. led[1] is 1 when any of DATA_ERRS, OVERFLOWS or UNDERFLOWS is
    non-zero (sticky until CLEAR).
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546635777
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESSE2 word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] scratch'
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] RUN, [1] SLOW_READ, [2] CLEAR self-clearing only while RUN=0, [3] INJECT
      self-clearing, [31:4] reserved read 0'
  - offset: 20
    name: WORDS_W
    access: RO
    reset: 0
    bits: '[31:0] words written (snapshot)'
  - offset: 24
    name: WORDS_R
    access: RO
    reset: 0
    bits: '[31:0] words read and checked (snapshot)'
  - offset: 28
    name: DATA_ERRS
    access: RO
    reset: 0
    bits: '[31:0] mismatching words (snapshot)'
  - offset: 32
    name: OVERFLOWS
    access: RO
    reset: 0
    bits: '[31:0] writes while full (snapshot)'
  - offset: 36
    name: UNDERFLOWS
    access: RO
    reset: 0
    bits: '[31:0] reads while empty (snapshot)'
  - offset: 40
    name: STALL_W
    access: RO
    reset: 0
    bits: '[31:0] writer clocks held off by full (snapshot)'
  - offset: 44
    name: OCC_MAX
    access: RO
    reset: 0
    bits: '[9:0] highest fill in words (snapshot)'
  - offset: 48
    name: SNAPSHOT
    access: WO
    reset: 0
    bits: any write latches 0x014 to 0x02C, reads 0
timing:
  clk25_period_ns: 40
  gt_refclk_period_ns: 6.4
  latency:
    register_read: h_rdata valid within 2 clk25 cycles of h_re and held
    register_write: effect 1 clk25 cycle after h_we
    snapshot: reader-domain counters cross to clk25 by a handshake, snapshot completes
      within 16 clk25 cycles (proposed)
    fifo_cdc: Gray pointer synchroniser 2 destination clocks
  expected_rates: WORDS_W advances at 25 Mwords/s while not stalled, WORDS_R at the
    same average rate in normal mode
resources_expected:
  bram36: 1
  lut: 600
  ff: 800
  dsp: 0
  gt_channels: 0
assumptions:
- assumption: The register port clock clk is clk25.
  reason: The request leaves the choice open and the writer domain is slow and free-running,
    which eases timing on the JTAG bus.
- assumption: jtag_bus.sv is instantiated unchanged and is not simulated.
  reason: The request says so, the tests drive h_we and h_re directly.
- assumption: In normal mode the reader drains faster than the writer so the FIFO
    does not fill.
  reason: Rate ratio is 6.25 to 1, so STALL_W is expected to stay 0 unless SLOW_READ
    is set.
- assumption: A write to CTRL with CLEAR set while RUN is 1 ignores the CLEAR bit.
  reason: The request says CLEAR acts only while RUN is 0.
