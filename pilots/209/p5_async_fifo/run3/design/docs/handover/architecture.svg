<svg xmlns="http://www.w3.org/2000/svg" width="640" height="352" viewBox="0 0 640 352" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="352" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">top</text><text x="170" y="43">thin top; IBUFDS_GTE4 + BUFG_GT for reference clock, power-on reset ge</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">jtag_bus</text><text x="170" y="77">supplied BSCANE2 USER4 register bus (unchanged), clk25 register port</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">reset_gen</text><text x="170" y="111">16-clock power-on counter in clk25 giving active-high rst; synchronise</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">soak_core</text><text x="170" y="145">register file, CTRL, snapshot control, counters, LED logic; the simula</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">prbs_writer</text><text x="170" y="179">clk25 PRBS-31 generator (32 bits per word), full gating, STALL_W, OVER</text><rect x="8" y="196" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="213">async_fifo</text><text x="170" y="213">512x32 dual-clock FIFO, Gray pointers with two-flop synchronisers, one</text><rect x="8" y="230" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="247">prbs_checker</text><text x="170" y="247">gt_refclk reader, PRBS-31 reference, compare, WORDS_R, DATA_ERRS, UNDE</text><text x="8" y="274" font-weight="bold">Interfaces</text><text x="8" y="292">jtag_bus - soak_core: host_reg (simple)</text><text x="8" y="310">prbs_writer - async_fifo: fifo_wr (simple)</text><text x="8" y="328">async_fifo - prbs_checker: fifo_rd (simple)</text></svg>
