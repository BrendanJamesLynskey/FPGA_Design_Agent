- about: snapshot_coherence
  text: 'Spec: SNAPSHOT cannot sample the two clocks at one true instant, so reader-domain counters cross by handshake and
    writer and reader counters may differ by up to 512 words in flight. The spec proposes completion within 16 clk25 cycles;
    this was not counted from RTL.'
