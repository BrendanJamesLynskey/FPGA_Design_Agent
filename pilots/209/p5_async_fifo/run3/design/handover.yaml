schema: fda-handover/1
id: p5_async_fifo
title: Asynchronous FIFO soak with PRBS-31 check (25 MHz writer, 156.25 MHz reader)
kind: agent-run
produced_by: agent
summary: The design is meant to push a 32-bit PRBS-31 stream through a 512-word asynchronous FIFO from a 25 MHz writer domain
  to a 156.25 MHz reader domain, check it word by word, and expose counters through a JTAG-driven register port. The run
  stopped at rtl-design-creation, with the specification and architecture written and no verified RTL. Verification reached
  V1 of V3. Constraints, synthesis, implementation and later stages were not run, and no Vivado build is recorded.
scope_not:
- Not a transceiver design. No GT channel is used, only the reference clock buffer, and sfp_tx_disable is held at 1 (laser
  off).
- Not a verified or built design. No bitstream, timing, power or board result exists.
- Not a general-purpose FIFO IP. It is a soak and test fixture with fixed width and depth.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261125-151313-ce44/p5_async_fifo/design.xdc
resets:
- name: rst
  active: high
  note: Per spec.yaml it comes from a power-on counter in clk25 held for 16 clocks and is synchronised into the gt_refclk
    domain. No verified RTL was recorded, so this is the specified behaviour; ARCHITECTURE.md says other resets are synchronous.
interfaces:
- name: clk_25
  type: input, 25 MHz clock, pin C3, LVCMOS18
  note: design.xdc names the port clk_25 and defines the 40.00 ns clock on it; spec.yaml calls it clk25. Gap recorded.
- name: gt_refclk_p / gt_refclk_n
  type: input, differential 156.25 MHz reference clock (SFP+ MGTREFCLK0)
  note: Goes through IBUFDS_GTE4 and BUFG_GT. design.xdc has no pin or clock constraint for these ports.
- name: led
  type: output, 2 bits, pins F8 (led[0]) and E8 (led[1]), LVCMOS18
  note: led[0] shows RUN; led[1] is a sticky error flag (any of DATA_ERRS, OVERFLOWS, UNDERFLOWS non-zero) until CLEAR.
- name: sfp_tx_disable
  type: output, 1 bit, pin Y10, LVCMOS33
  note: Constant 1 per the spec.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546635777
  bits: '[31:0] design ID'
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: '[31:0] USR_ACCESSE2 word'
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: '[31:0] scratch'
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: '[0] RUN, [1] SLOW_READ, [2] CLEAR self-clearing only while RUN=0, [3] INJECT self-clearing, [31:4] reserved read
    0'
- offset: 20
  name: WORDS_W
  access: RO
  reset: 0
  bits: '[31:0] words written (snapshot)'
- offset: 24
  name: WORDS_R
  access: RO
  reset: 0
  bits: '[31:0] words read and checked (snapshot)'
- offset: 28
  name: DATA_ERRS
  access: RO
  reset: 0
  bits: '[31:0] mismatching words (snapshot)'
- offset: 32
  name: OVERFLOWS
  access: RO
  reset: 0
  bits: '[31:0] writes while full (snapshot)'
- offset: 36
  name: UNDERFLOWS
  access: RO
  reset: 0
  bits: '[31:0] reads while empty (snapshot)'
- offset: 40
  name: STALL_W
  access: RO
  reset: 0
  bits: '[31:0] writer clocks held off by full (snapshot)'
- offset: 44
  name: OCC_MAX
  access: RO
  reset: 0
  bits: '[9:0] highest fill in words (snapshot)'
- offset: 48
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: any write latches 0x014 to 0x02C, reads 0
parameters:
- name: FIFO_DEPTH
  value: 512
  legal: 512 as specified; a power of two matching ADDR_WIDTH
  note: Words in the FIFO. The spec's value was not simulated; no bench result exists.
- name: DATA_WIDTH
  value: 32
  legal: 32 as specified
  note: Bits per word. PRBS-31 produces 32 new bits per word.
- name: PRBS_SEED
  value: 2147483647
  legal: non-zero 31-bit value; 0x7FFFFFFF as specified
  note: Seed for both writer and reader PRBS-31 copies.
- name: DESIGN_ID
  value: 546635777
  legal: any 32-bit value
  note: Read back at register 0x000 as 0x20950001.
- name: SLOW_READ_DIV_CYCLES
  value: 8
  legal: 1 or more
  note: With SLOW_READ set the reader pops at most one word per 8 gt_refclk cycles. Normal mode drains faster than the 25
    Mwords/s writer (rate ratio 6.25 to 1).
- name: ADDR_WIDTH
  value: 9
  legal: log2 of FIFO_DEPTH
  note: Pointer width for the 512-word FIFO.
- name: RESET_CYCLES
  value: 16
  legal: 1 or more
  note: Length in clk25 cycles of the power-on reset.
