schema: fda-handover/1
id: p5_async_fifo
title: P5 asynchronous FIFO soak (25 MHz writer, 156.25 MHz reader, PRBS-31 checked)
kind: agent-run
produced_by: agent
summary: The design writes 32-bit PRBS-31 words into a 512-word asynchronous FIFO from the 25 MHz board clock. A reader
  on the 156.25 MHz SFP+ MGTREFCLK0 clock (no GT channel) checks them against its own PRBS copy and counts errors, overflows,
  underflows and fill. A host reads the counters through the jtag_bus register port, with a snapshot register for coherent
  reads. The run stopped at rtl-design-creation, which failed its gates. Only clarify and board-and-device-planning passed.
  No simulation results, no Vivado build and no board result exist.
scope_not:
- Not a transceiver design; no GT channel is used and sfp_tx_disable is held at 1.
- Not a general FIFO IP; it is a soak and check fixture for one fixed width and depth.
- Not verified, built or run on hardware yet; no timing, resource or power figure exists.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p5_async_fifo_soak
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261125-140334-22f2/p5_async_fifo/design.xdc
resets:
- name: rst
  active: high
  note: Comes from jtag_bus in the clk domain and is synchronised into the gt_refclk domain with async assert and sync release
    (spec.yaml, ARCHITECTURE.md). The RTL was not shown here, so this is the spec's description.
interfaces:
- name: clk_25
  type: input, 25 MHz clock, pin C3, LVCMOS18
  note: design.xdc names this port clk_25 while spec.yaml names it clk; see the port_names gap.
- name: gt_refclk_p / gt_refclk_n
  type: input, differential 156.25 MHz reference clock pair
  note: design.xdc has no pins or clock for these ports; ARCHITECTURE.md lists this as an open point.
- name: led[1:0]
  type: output, 2 bits, pins F8 (led[0]) and E8 (led[1]), LVCMOS18
  note: led[0] shows RUN and led[1] shows a nonzero error count (spec assumption).
- name: sfp_tx_disable
  type: output, 1 bit, pin Y10, LVCMOS33
  note: Constant 1.
- name: jtag_bus register port (rst, h_we, h_re, h_addr[11:0], h_wdata[31:0], h_rdata[31:0])
  type: internal
  note: Not top-level pins. jtag_bus.sv is used unchanged and is not simulated; tests drive the port directly.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546635777
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 scratch
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 RUN; 1 SLOW_READ; 2 CLEAR self-clearing only while RUN=0; 3 INJECT self-clearing; 31:4 reserved read 0
- offset: 20
  name: WORDS_W
  access: RO
  reset: 0
  bits: 31:0 words written (snapshot)
- offset: 24
  name: WORDS_R
  access: RO
  reset: 0
  bits: 31:0 words read and checked (snapshot)
- offset: 28
  name: DATA_ERRS
  access: RO
  reset: 0
  bits: 31:0 mismatching words (snapshot)
- offset: 32
  name: OVERFLOWS
  access: RO
  reset: 0
  bits: 31:0 writes while full (snapshot)
- offset: 36
  name: UNDERFLOWS
  access: RO
  reset: 0
  bits: 31:0 reads while empty (snapshot)
- offset: 40
  name: STALL_W
  access: RO
  reset: 0
  bits: 31:0 writer clocks held off (snapshot)
- offset: 44
  name: OCC_MAX
  access: RO
  reset: 0
  bits: 31:0 highest fill in words (snapshot)
- offset: 48
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: any write latches 0x014 to 0x02C; reads 0
parameters:
- name: FIFO_DEPTH_WORDS
  value: 512
  legal: 512 is the only value the spec covers; other values are untested
  note: FIFO depth in words; the spec expects one RAMB36 (512 x 32) or 16 LUTRAM.
- name: DATA_WIDTH
  value: 32
  legal: 32 only; the PRBS-31 writer emits 32 new bits per word
  note: Word width in bits.
- name: PRBS_SEED
  value: 2147483647
  legal: nonzero 31-bit value
  note: Seed 0x7FFFFFFF for both PRBS-31 copies (x^31 + x^28 + 1).
- name: SLOW_READ_DIV_CYCLES
  value: 8
  legal: 1 or more
  note: With SLOW_READ set the reader takes at most one word per 8 gt_refclk cycles (156.25 MHz).
- name: DESIGN_ID
  value: 546635777
  legal: any 32-bit value
  note: Read back at ID, 0x20950001.
- name: ADDR_BITS
  value: 12
  legal: 12 for the jtag_bus byte address
  note: Width of h_addr.
