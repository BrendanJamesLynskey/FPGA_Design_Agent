  text: 'latency not measured: the run measured no latency; the spec''s latency promise is checked only by the benches'
- about: throughput
  text: 'throughput not measured: the run measured no throughput'
- about: port_names
  text: design.xdc names the clock port clk_25 (pin C3, create_clock period 40.00 ns), while spec.yaml and its port list
    name it clk. design.xdc is what was built; the top-level RTL port name was not shown to the Designer and must be checked
    against it.
- about: gt_refclk_constraints
  text: design.xdc has no pins, I/O standard or create_clock for gt_refclk_p/gt_refclk_n (6.4 ns in the spec), and no set_clock_groups
    or set_max_delay -datapath_only lines. The spec requires all of them (REQ-24, REQ-33); ARCHITECTURE.md calls the MGTREFCLK0
    pin an open point. The file ends at sfp_tx_disable.
- about: sfp_tx_disable_io
  text: design.xdc puts sfp_tx_disable on pin Y10 with LVCMOS33, while the LEDs and clock use LVCMOS18; this is the board
    file's choice and was not checked against the board.
- about: architecture_cdc
  text: The standards gate reports architecture.yaml crossings that name inline modules (reset_gen and others) which are
    not modules of the design or shell. The crossing list in architecture.yaml needs correcting before STD-CDC-01 can pass.
- about: defaults
  text: All 8 interview answers were defaults, not human answers. They include reset values of 0 for the counters and snapshot
    registers, INJECT flipping bit 0 of the next word and staying pending while RUN is 0, STALL_W counting only while RUN
    is 1, and counters holding their values when RUN falls while the reader drains the FIFO.
- about: unmapped_access
  text: Per spec.yaml, unmapped addresses read 0 and ignore writes. Writes to the RO registers and reads of SNAPSHOT (0)
    are likewise expected to change nothing; the RTL was not shown to confirm this.
- about: control_priority
  text: CLEAR is honoured only while RUN is 0 and is ignored while RUN is 1 (REQ-17). CLEAR and INJECT self-clear. SNAPSHOT
    latches via a clk-to-gt_refclk handshake, so the reader counters are coherent but not instantaneous.
- about: latency_count
  text: The spec promises h_rdata within 2 clk cycles of h_re and a write effect 1 clk cycle after h_we. The RTL was not
    shown to the Designer, so these were not counted from it and only the benches would check them, and they have not run.
