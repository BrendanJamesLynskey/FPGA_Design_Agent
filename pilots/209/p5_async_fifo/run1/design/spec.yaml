open_questions: []
resolved_questions:
- question: Which pin and I/O standard carry sfp_tx_disable, and the GT reference
    clock pair?
  answer: Use the KR260 board file pin names for SFP+ tx disable and MGTREFCLK0
  status: defaulted
  by: default
  default_reason: spec.md gives no pin locations.
- question: What do the LEDs show?
  answer: led[0] = RUN, led[1] = DATA_ERRS nonzero
  status: defaulted
  by: default
  default_reason: The request names the LEDs but gives no meaning.
- question: What happens to the counters when RUN falls to 0 (are they held)?
  answer: Counters hold their values and the writer stops; the reader drains the FIFO,
    then stops
  status: defaulted
  by: default
  default_reason: The request defines RUN start and CLEAR only.
- question: Is INJECT honoured while RUN is 0?
  answer: INJECT stays pending until the next word is checked while RUN is 1
  status: defaulted
  by: default
  default_reason: The request does not say.
- question: What do snapshot registers read before the first SNAPSHOT write?
  answer: 0 after reset
  status: defaulted
  by: default
  default_reason: The request does not say.
- question: Which flip bit position does INJECT use?
  answer: Bit 0 of the next received word
  status: defaulted
  by: default
  default_reason: The request says one bit but not which.
- question: Does the writer count a stall when RUN is 0?
  answer: No; STALL_W counts only while RUN is 1
  status: defaulted
  by: default
  default_reason: The request defines it as held off by a full FIFO.
- question: Is the register map exactly as in the request table (offsets 0x010 to
    0x030)? Please confirm offset, width, reset value and access of every register.
  answer: The map in registers.map, taken from the request table, all 32-bit with
    reset 0 except ID
  status: defaulted
  by: default
  default_reason: The harness requires the map to be confirmed by the user.
