name: p5_async_fifo_soak
title: 'P5: asynchronous FIFO soak (25 MHz writer to 156.25 MHz reader, PRBS-31 checked)'
board: kr260
part: xck26-sfvc784-2LV-c
top: p5_async_fifo_soak
clocks:
- name: clk
  role: C3 25 MHz board clock (free running); writer domain and JTAG register port
    domain
  freq_hz: 25000000
  period_ns: 40.0
- name: gt_refclk
  role: SFP+ cage MGTREFCLK0 156.25 MHz through the GT reference clock buffer only
    (no GT channel); reader domain
  freq_hz: 156250000
  period_ns: 6.4
- note: clk and gt_refclk are unrelated; declared as asynchronous clock groups, with
    set_max_delay -datapath_only on each CDC path
reset:
  name: rst
  source: from jtag_bus (held for a few clocks at start), in the clk domain
  polarity: active high
  synchronisation: synchronised separately into the gt_refclk domain (async assert,
    sync release)
parameters:
  FIFO_DEPTH_WORDS: 512
  DATA_WIDTH: 32
  PRBS_SEED: 2147483647
  SLOW_READ_DIV_CYCLES: 8
  DESIGN_ID: 546635777
  ADDR_BITS: 12
ports:
- name: clk
  direction: in
  width: 1
  board_pin_role: C3 25 MHz clock
- name: gt_refclk_p
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 positive
- name: gt_refclk_n
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 negative
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, constant 1
- name: rst
  direction: internal
  width: 1
  board_pin_role: from jtag_bus
- name: h_we
  direction: internal
  width: 1
  board_pin_role: jtag_bus register port write pulse
- name: h_re
  direction: internal
  width: 1
  board_pin_role: jtag_bus register port read pulse
- name: h_addr
  direction: internal
  width: 12
  board_pin_role: jtag_bus byte address
- name: h_wdata
  direction: internal
  width: 32
  board_pin_role: jtag_bus write data
- name: h_rdata
  direction: internal
  width: 32
  board_pin_role: jtag_bus read data
behaviour:
  writer:
  - In the clk domain, while RUN is 1 and the FIFO is not full, one 32-bit PRBS-31
    word (x^31 + x^28 + 1, 32 new bits per word, seed 0x7FFFFFFF) is written on every
    clk cycle.
  - While RUN is 1 and the FIFO is full the writer is held off and STALL_W increments
    once per held clk cycle.
  - When RUN is 0 the writer writes nothing.
  reader:
  - In the gt_refclk domain, while RUN is 1 and the FIFO is not empty, the reader
    takes one word per gt_refclk cycle.
  - With SLOW_READ set the reader takes at most one word in every 8 gt_refclk cycles.
  - Each word is compared with the reader's own PRBS-31 copy started from seed 0x7FFFFFFF
    when RUN begins; a mismatch increments DATA_ERRS.
  - INJECT flips one bit of one received word before the check, once, then clears
    itself.
  counters:
  - WORDS_W, WORDS_R, DATA_ERRS, OVERFLOWS, UNDERFLOWS, STALL_W and OCC_MAX are 32
    bits and wrap at 2^32.
  - OVERFLOWS counts a write attempt while full; UNDERFLOWS counts a read attempt
    while empty; both must stay 0.
  - OCC_MAX is the highest FIFO fill seen, in words.
  - CLEAR (only honoured while RUN is 0) zeroes all counters and restarts both PRBS
    sequences from the seed; it self-clears.
  snapshot:
  - A write to 0x030 latches all seven counters at one instant; reads of 0x014 to
    0x02C return the latched values.
  - Counters from the gt_refclk domain are carried to the clk domain with a handshake
    so the snapshot set is coherent.
  host_port:
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - 0x000 ID reads 0x20950001; 0x004 BUILD reads USR_ACCESSE2; 0x008 SCRATCH is RW
    and resets to 0.
  pins:
  - sfp_tx_disable is driven to 1 at all times; no GT transceiver channel is used.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546635777
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 RUN; 1 SLOW_READ; 2 CLEAR self-clearing only while RUN=0; 3 INJECT self-clearing;
      31:4 reserved read 0
  - offset: 20
    name: WORDS_W
    access: RO
    reset: 0
    bits: 31:0 words written (snapshot)
  - offset: 24
    name: WORDS_R
    access: RO
    reset: 0
    bits: 31:0 words read and checked (snapshot)
  - offset: 28
    name: DATA_ERRS
    access: RO
    reset: 0
    bits: 31:0 mismatching words (snapshot)
  - offset: 32
    name: OVERFLOWS
    access: RO
    reset: 0
    bits: 31:0 writes while full (snapshot)
  - offset: 36
    name: UNDERFLOWS
    access: RO
    reset: 0
    bits: 31:0 reads while empty (snapshot)
  - offset: 40
    name: STALL_W
    access: RO
    reset: 0
    bits: 31:0 writer clocks held off (snapshot)
  - offset: 44
    name: OCC_MAX
    access: RO
    reset: 0
    bits: 31:0 highest fill in words (snapshot)
  - offset: 48
    name: SNAPSHOT
    access: WO
    reset: 0
    bits: any write latches 0x014 to 0x02C; reads 0
timing:
  clock_domains: writer and register port on clk 25 MHz; reader on gt_refclk 156.25
    MHz; unrelated
  cdc: Gray-coded pointers through 2-flop synchronisers; control and snapshot through
    handshakes; set_clock_groups -asynchronous plus set_max_delay -datapath_only
  latency:
    register_read: h_rdata valid within 2 clk cycles of h_re
    register_write: effect 1 clk cycle after h_we
    snapshot: values coherent after the handshake completes, bounded by a few gt_refclk
      and clk cycles
    fifo_pointer_crossing: 2 to 3 destination clock cycles
resources_expected:
  lut: under 1000
  ff: under 1500
  bram: 1 RAMB36 (512 x 32) or 16 LUTRAM
  dsp: 0
  gt_channels: 0
  clock_buffers: 1 GT reference clock buffer (IBUFDS_GTE4), BUFG_GT for gt_refclk
    output
assumptions:
- assumption: jtag_bus.sv is used unchanged and not simulated; tests drive the register
    port directly.
  reason: It contains Xilinx primitives, as stated in the request.
- assumption: The GT reference clock buffer output reaches fabric through a BUFG_GT.
  reason: The request allows at most the GT reference clock buffer and no GT channel.
- assumption: OVERFLOWS and UNDERFLOWS count attempts, which the logic never makes
    by construction.
  reason: The request says they must never happen, so the counters are a check that
    stays 0.
- assumption: led[0] shows RUN and led[1] shows any nonzero error count.
  reason: The request does not define the LEDs; this is a harmless choice.
