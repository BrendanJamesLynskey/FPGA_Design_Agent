<svg xmlns="http://www.w3.org/2000/svg" width="640" height="334" viewBox="0 0 640 334" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="334" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">jtag_bus</text><text x="170" y="43">BSCANE2 USER4 register bus (supplied, unchanged); gives rst, h_we, h_r</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">reset_gen</text><text x="170" y="77">Active-high reset synchronised into the gt_refclk domain (xpm_cdc_asyn</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">p5_async_fifo_core</text><text x="170" y="111">Register map, control, snapshot, writer PRBS-31, counters in clk domai</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">xpm_fifo_async</text><text x="170" y="145">512 x 32 asynchronous FIFO (XPM, Gray pointers inside)</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">reader_checker</text><text x="170" y="179">gt_refclk domain reader, slow-read divider, PRBS-31 check, inject, cou</text><rect x="8" y="196" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="213">snapshot_cdc</text><text x="170" y="213">xpm_cdc_handshake carrying the counter set from gt_refclk to clk</text><rect x="8" y="230" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="247">gt_refclk_buf</text><text x="170" y="247">IBUFDS_GTE4 reference buffer and BUFG_GT; no GT channel</text><text x="8" y="274" font-weight="bold">Interfaces</text><text x="8" y="292">jtag_bus - p5_async_fifo_core: host_port (simple)</text><text x="8" y="310">p5_async_fifo_core - reader_checker: fifo_data (simple)</text></svg>
