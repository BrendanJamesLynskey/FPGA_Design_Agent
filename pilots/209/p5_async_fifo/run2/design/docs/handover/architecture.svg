<svg xmlns="http://www.w3.org/2000/svg" width="640" height="248" viewBox="0 0 640 248" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="248" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">p5_async_fifo_soak</text><text x="170" y="43">thin top; instantiates jtag_bus, POR reset generator, IBUFDS_GTE4+BUFG</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">jtag_bus</text><text x="170" y="77">supplied BSCANE2 USER4 register bus (data/jtag_bus.sv, unchanged)</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">por_reset</text><text x="170" y="111">16-clock power-on reset counter in clk_25 (active high)</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">soak_core</text><text x="170" y="145">register map, writer PRBS-31, xpm_fifo_async 512x32, reader PRBS check</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">reset_sync_gt</text><text x="170" y="179">xpm_cdc_async_rst of rst into clk_gt156</text><text x="8" y="206" font-weight="bold">Interfaces</text><text x="8" y="224">jtag_bus - soak_core: reg_port (simple)</text></svg>
