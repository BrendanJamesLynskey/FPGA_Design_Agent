resolved_questions:
- question: What are the register offsets, widths, reset values and access of every
    register?
  answer: 'The map in spec.md: 0x000 ID, 0x004 BUILD, 0x008 SCRATCH, 0x010 CTRL, 0x014-0x02C
    counters RO, 0x030 SNAPSHOT WO, all 32 bits'
  status: defaulted
  by: default
  default_reason: Register map confirmation for the shell registers; the request gives
    offsets, so they are taken as proposed.
- question: Which clock drives the register port (clk of jtag_bus)?
  answer: clk_25
  status: defaulted
  by: default
  default_reason: Simplest; the request says only a free-running clock.
- question: What happens if INJECT is written while RUN is 0?
  answer: The inject is held pending and applied to the first word received after
    RUN; it clears when used.
  status: defaulted
  by: default
  default_reason: The request says one flipped word, once, not when.
- question: Which bit is flipped by INJECT?
  answer: bit 0 of the next received word
  status: defaulted
  by: default
  default_reason: Any single bit works for the checker; bit 0 is simplest.
- question: What is CLEAR behaviour when written while RUN is 1?
  answer: Ignored and the bit does not stay set
  status: defaulted
  by: default
  default_reason: Spec says it acts only while RUN is 0.
- question: What do the LEDs show?
  answer: led[0] RUN, led[1] sticky error (any data error, overflow or underflow)
  status: defaulted
  by: default
  default_reason: Unspecified in the request.
- question: Is OCC_MAX measured on the write side or read side?
  answer: Write side, fill at each writer clock
  status: defaulted
  by: default
  default_reason: The fill seen differs by a few words between domains.
- question: What is the BUILD value in simulation?
  answer: 0 (USR_ACCESSE2 not simulated)
  status: defaulted
  by: default
  default_reason: The primitive is unavailable in simulation.
