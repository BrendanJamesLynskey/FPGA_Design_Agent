    found none. The gate expects runs/20261125-143655-7b11/p5_async_fifo/build/verif/sim/seed<N>/results.xml, one directory
    per ; the same failure on 6 consecutive visits)'
- about: formal
  text: 'formal checks were planned for REQ-11, REQ-12, REQ-21, REQ-22 and did not run; each was replaced by a simulation
    check (verif/testplan.yaml replan). Reason recorded: SymbiYosys is not installed here so the overflow check is re-planned
    to simulation with a full FIFO stall.'
- about: resources
  text: 'resources not measured: no current Vivado build of this design has been recorded'
- about: timing
  text: 'timing not measured: no current Vivado build of this design has been recorded'
- about: power
  text: 'power not measured: no current Vivado build of this design has been recorded'
- about: latency
  text: 'latency not measured: the run measured no latency; the spec''s latency promise is checked only by the benches'
- about: throughput
  text: 'throughput not measured: the run measured no throughput'
- about: xdc_vs_spec
  text: design.xdc constrains only clk_25 (pin C3, 40 ns), led, and sfp_tx_disable. It has no constraint for gt_refclk0_p/n,
    no clk_gt156 clock and no clock-group or max-delay between the clocks, although spec.yaml and ARCHITECTURE.md promise
    them (REQ-26). The XDC names the 25 MHz port clk_25, while the spec names it clk_c3. The XDC is what was built.
- about: architecture_inconsistency
  text: The gate failure STD-CDC-01 reports that architecture.yaml names inline_in p5_async_fifo_soak, which is not a module
    of the design or shell. The crossing description needs correcting before the design gates can pass.
- about: reset_values
  text: Every register resets to the value in the register table; BUILD reads 0 in simulation because USR_ACCESSE2 is not
    simulated. Unmapped addresses read 0 and ignore writes (spec.yaml, not checked against RTL, as no simulation ran).
- about: control_priorities
  text: Per the interview defaults, which no review confirmed, CLEAR written while RUN is 1 is ignored and does not stay
    set. INJECT written while RUN is 0 stays pending and flips bit 0 of the first word received after RUN. RUN to 0 stops
    both sides and CLEAR flushes the FIFO.
- about: snapshot_semantics
  text: Registers 0x014 to 0x02C return the snapshot values, not live counters, so a SNAPSHOT write is needed before each
    read. The reader-side counters arrive through a request/acknowledge handshake, so they are stable only a few clk_25
    clocks after the write. A read inside that window may give the older values.
- about: latency_count
  text: The spec promises h_rdata within 2 clk_25 clocks of h_re and a write effect 1 clock after h_we. These were not counted
    from the RTL and were not simulated, so they are unconfirmed.
- about: occ_max_side
  text: OCC_MAX is the write-side fill (write pointer minus the synchronised read pointer), a conservative estimate that
    can differ from the read-side fill by a few words. This was an assumption of the run.
