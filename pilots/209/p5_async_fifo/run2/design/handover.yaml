schema: fda-handover/1
id: p5_async_fifo
title: Asynchronous FIFO soak with PRBS-31 checking across two unrelated clocks
kind: agent-run
produced_by: agent
summary: The design writes PRBS-31 words from a 25 MHz writer into a 512 x 32 asynchronous FIFO and pops them in a 156.25
  MHz reader that checks each word against its own PRBS copy. Counters for words, errors, overflow, underflow, stalls and
  peak fill are read through a snapshot register on the jtag_bus register port. The run stopped at rtl-design-creation,
  which failed its gates (lint, simulation, design standards and verification V2). Only V1 was reached, and no Vivado build
  exists.
scope_not:
- Not a transceiver design, no GT channel is used; only the reference clock buffer is taken from the SFP+ clock pin pair.
- Not a verified or built design; no bitstream, timing, resource or power result exists.
- Not a throughput or latency measurement tool; none was measured.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p5_async_fifo_soak
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261125-143655-7b11/p5_async_fifo/design.xdc
resets:
- name: rst
  active: high
  note: Internal power-on counter in clk_25 held for 16 clocks (POR_CYCLES); it is synchronised into clk_gt156 with async
    assert and sync release (spec.yaml, ARCHITECTURE.md). The RTL itself was not shown to the Designer for this handover,
    so this is taken from the spec.
interfaces:
- name: clk_c3
  type: input, 25 MHz clock, 1 bit
  note: Writer and register-port clock. design.xdc names the port clk_25 on pin C3 (LVCMOS18), while spec.yaml names it
    clk_c3.
- name: gt_refclk0_p / gt_refclk0_n
  type: input, differential clock pair, 156.25 MHz
  note: SFP+ MGTREFCLK0 through IBUFDS_GTE4 and BUFG_GT, reader clock. design.xdc has no pin or clock constraint for these
    ports.
- name: led
  type: output, 2 bits
  note: led[0] shows RUN and led[1] a sticky error flag (an assumption of the run). Pins F8 and E8, LVCMOS18, from design.xdc.
- name: sfp_tx_disable
  type: output, 1 bit
  note: Constant 1, laser off. Pin Y10, LVCMOS33, from design.xdc.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546635777
  bits: '[31:0] design ID'
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: '[31:0] USR_ACCESSE2 word'
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: '[31:0] read-back'
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: '[0] RUN, [1] SLOW_READ, [2] CLEAR self-clearing (only while RUN 0), [3] INJECT self-clearing'
- offset: 20
  name: WORDS_W
  access: RO
  reset: 0
  bits: '[31:0] words written (snapshot)'
- offset: 24
  name: WORDS_R
  access: RO
  reset: 0
  bits: '[31:0] words read and checked (snapshot)'
- offset: 28
  name: DATA_ERRS
  access: RO
  reset: 0
  bits: '[31:0] mismatching words (snapshot)'
- offset: 32
  name: OVERFLOWS
  access: RO
  reset: 0
  bits: '[31:0] snapshot'
- offset: 36
  name: UNDERFLOWS
  access: RO
  reset: 0
  bits: '[31:0] snapshot'
- offset: 40
  name: STALL_W
  access: RO
  reset: 0
  bits: '[31:0] writer clocks held off (snapshot)'
- offset: 44
  name: OCC_MAX
  access: RO
  reset: 0
  bits: '[31:0] highest fill in words (snapshot)'
- offset: 48
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: any write latches 0x014 to 0x02C; reads 0
parameters:
- name: FIFO_DEPTH
  value: 512
  legal: positive power of two; 512 is the specified value
  note: FIFO depth in words; one BRAM36 is expected. Only the spec value is documented; the benches' parameter values are
    not recorded here.
- name: DATA_WIDTH
  value: 32
  legal: 32 only (PRBS step is 32 bits per word)
  note: Word width of the FIFO and PRBS.
- name: PRBS_SEED
  value: 2147483647
  legal: non-zero 31-bit value
  note: Seed 0x7FFFFFFF for both the writer and the reader PRBS-31 copies.
- name: DESIGN_ID
  value: 546635777
  legal: any 32-bit value
  note: Read back at register 0x000 as 0x20950001.
- name: SLOW_READ_DIV_CYCLES
  value: 8
  legal: 1 or more
  note: With SLOW_READ 1 the reader pops at most one word per 8 clk_gt156 clocks (6.4 ns period).
- name: POR_CYCLES
  value: 16
  legal: 1 or more
  note: Length of the power-on reset in clk_25 clocks (40 ns period).
- name: SYNC_STAGES
  value: 2
  legal: 2 or more
  note: Synchroniser stages on the Gray-coded FIFO pointers.
- name: SNAP_SYNC_STAGES
  value: 2
  legal: 2 or more
  note: Synchroniser stages on the snapshot handshake from the reader domain.
