resolved_questions:
- question: Does a PUSH_N with TAIL_LEN 0 count as a busy cycle?
  answer: No, it pushes nothing and BUSY_CYCLES is unchanged
  status: defaulted
  by: default
  default_reason: request only defines busy for full-word messages
- question: Does a PUSH_N with TAIL_LEN 1 to 3 add 1 to BUSY_CYCLES?
  answer: Yes, 1 cycle
  status: defaulted
  by: default
  default_reason: the datapath processes data in that clock
- question: What happens on a TAIL_LEN write above 3?
  answer: The write is ignored and the old value is kept
  status: defaulted
  by: default
  default_reason: request says N is 0 to 3 and gives no behaviour outside
- question: What do the LEDs show?
  answer: led[0] is a heartbeat of about 1 Hz and led[1] is MMCM locked
  status: defaulted
  by: default
  default_reason: request names the LEDs but gives no function
- question: Is data pushed after a PUSH_N continued as a message, or is PUSH_N always
    final?
  answer: PUSH_N is not special; further pushes keep accumulating until INIT
  status: defaulted
  by: default
  default_reason: request says 'last push' but defines the CRC as of everything sent
    since INIT
- question: Is the register map exactly as in the request table?
  answer: Yes, offsets, widths and access as listed in registers.map
  status: defaulted
  by: default
  default_reason: offsets are given in the request, confirming only
