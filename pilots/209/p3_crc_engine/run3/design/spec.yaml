name: p3_crc32
title: P3 Ethernet CRC-32 engine, 4 bytes per clock, JTAG register access
board: kr260
part: xck26-sfvc784-2LV-c
top: crc32_top
clocks:
- name: clk_25
  pin_role: 25 MHz board clock, pin C3
  freq_mhz: 25
- name: clk
  pin_role: internal 100 MHz design clock from an MMCM driven by clk_25 (period 10
    ns)
  freq_mhz: 100
reset:
  name: rst
  polarity: active_high
  type: synchronous
  description: Held for at least 4 clk cycles after MMCM lock is false, released synchronously
    to clk
parameters:
  DESIGN_ID: 546504705
  CLK_MULT_NUM_X1000: 40000
  RST_HOLD_CYCLES: 8
  MAX_TAIL_LEN: 3
  DATA_BYTES_PER_CLK: 4
  CRC_POLY: 79764919
  CRC_INIT: 4294967295
  CRC_XOROUT: 4294967295
ports:
- name: clk_25
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
- name: h_we
  direction: internal_input
  width: 1
  board_pin_role: register port write pulse from data/jtag_bus.sv (no pin)
- name: h_re
  direction: internal_input
  width: 1
  board_pin_role: register port read pulse from jtag_bus (no pin)
- name: h_addr
  direction: internal_input
  width: 12
  board_pin_role: byte address from jtag_bus (no pin)
- name: h_wdata
  direction: internal_input
  width: 32
  board_pin_role: write data from jtag_bus (no pin)
- name: h_rdata
  direction: internal_output
  width: 32
  board_pin_role: read data to jtag_bus (no pin)
behaviour:
  crc:
  - Reflected CRC-32, polynomial 0x04C11DB7, register initial 0xFFFFFFFF, final XOR
    0xFFFFFFFF, matching zlib.crc32.
  - Bytes are consumed in send order; within a PUSH4 word bits 7:0 is the first byte.
  - A write to PUSH4 updates the CRC state by 4 bytes in one clk cycle.
  - A write to PUSH_N updates the CRC state by TAIL_LEN bytes (low bytes, bits 7:0
    first) in one clk cycle; TAIL_LEN 0 changes nothing.
  - CRC register read returns state XOR 0xFFFFFFFF; after INIT with no bytes it reads
    0x00000000.
  - A write takes effect the clock after h_we; a write may arrive on every clk cycle
    without loss.
  counters:
  - BYTE_COUNT increases by 4 on PUSH4 and by TAIL_LEN on PUSH_N, 32 bits, wraps.
  - BUSY_CYCLES increases by 1 for each clk cycle in which a PUSH4 or a PUSH_N with
    TAIL_LEN above 0 is processed; so N full words give N.
  - INIT write with bit 0 set resets CRC state to start value and BYTE_COUNT and BUSY_CYCLES
    to 0; bit 0 reads back 0.
  - A push in the same cycle as INIT is dropped.
  registers_access:
  - Read data is valid on h_rdata 1 clk after h_re and holds until the next h_re.
  - Unmapped addresses read 0 and ignore writes. Writes to RO registers are ignored.
  - ID reads 0x20930001; BUILD reads the USR_ACCESSE2 word; SCRATCH reads back what
    was written, reset 0.
  - TAIL_LEN write with a value above 3 is ignored (previous value kept).
  board:
  - sfp_tx_disable is driven 1 at all times; no GT transceiver channel is used.
  - data/jtag_bus.sv is used unchanged and not part of simulation; tests drive the
    h_ register port directly.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546504705
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESSE2 word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 data
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 INIT self-clearing; 31:1 reserved read 0
  - offset: 20
    name: PUSH4
    access: WO
    reset: 0
    bits: 31:0 four bytes, 7:0 first; reads 0
  - offset: 24
    name: PUSH_N
    access: WO
    reset: 0
    bits: 31:0 low TAIL_LEN bytes used; reads 0
  - offset: 28
    name: TAIL_LEN
    access: RW
    reset: 0
    bits: 1:0 N 0 to 3; 31:2 read 0
  - offset: 32
    name: CRC
    access: RO
    reset: 0
    bits: 31:0 finished CRC-32
  - offset: 36
    name: BYTE_COUNT
    access: RO
    reset: 0
    bits: 31:0 bytes pushed since INIT
  - offset: 40
    name: BUSY_CYCLES
    access: RO
    reset: 0
    bits: 31:0 busy clk cycles since INIT
timing:
  clock_period_ns: 10
  throughput: 4 bytes per clk cycle, 400 MB/s at 100 MHz
  latency:
    write_to_effect: 1 clk cycle after h_we
    read_to_data: h_rdata valid 1 clk cycle after h_re (limit 2)
    crc_update: 1 clk cycle from PUSH to CRC register update
  constraints: clk 100 MHz must close timing with WNS >= 0; clk_25 constrained at
    40 ns
resources_expected:
  lut: 400
  ff: 300
  bram: 0
  dsp: 0
  mmcm: 1
  bufg: 2
  gt: 0
assumptions:
- text: Design clock is 100 MHz generated by an MMCM from the 25 MHz C3 clock
  reason: request needs at least 100 MHz and only 25 MHz is on the board; 100 MHz
    gives margin for a 32-bit parallel CRC
- text: Reset is generated internally from MMCM lock and held at least 4 clocks
  reason: request says hold rst a few clocks at start
- text: jtag_bus h_we and h_re are never asserted in the same clock
  reason: single register port transaction at a time
- text: Counters are 32 bits and wrap
  reason: all registers are 32 bits
- text: Reading registers has no side effects
  reason: request says read at any time
open_questions: []
