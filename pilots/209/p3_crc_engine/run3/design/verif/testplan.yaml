schema: fpga-design-agent/testplan/v0
design: p3_crc_engine
spec: spec.yaml
model: model.py
bench:
  modules: [crc_bench]
  dir: tests
checkers: verif/checkers
formal_dir: verif/formal
thresholds:
  seeds_min: 3
  functional_bins_pct: 100
  cover_properties_pct: 100
  line_pct: 95
  toggle_pct: 80
  mutation_score_pct: 80
waivers:
  code_coverage: []
  functional_bins: []
  cover_properties: []
requirements:
  - id: REQ-01
    spec: ["behaviour.crc[0]", "behaviour.crc[2]", "registers.map.CRC", "registers.map.PUSH4", "timing.latency.crc_update"]
    tests: [crc_bench.test_random_traffic, crc_bench.test_lengths, crc_bench.test_back_to_back]
  - id: REQ-02
    spec: ["behaviour.crc[4]"]
    tests: [crc_bench.test_init, crc_bench.test_reset_values]
  - id: REQ-03
    spec: ["behaviour.counters[0]", "registers.map.BYTE_COUNT"]
    tests: [crc_bench.test_lengths, crc_bench.test_random_traffic, crc_bench.test_back_to_back]
  - id: REQ-04
    spec: ["behaviour.crc[1]"]
    tests: [crc_bench.test_lengths]
  - id: REQ-05
    spec: ["behaviour.crc[1]"]
    tests: [crc_bench.test_byte_order]
  - id: REQ-06
    spec: ["behaviour.crc[3]", "registers.map.PUSH_N"]
    tests: [crc_bench.test_push_n]
  - id: REQ-07
    spec: ["behaviour.crc[3]", "registers.map.TAIL_LEN"]
    tests: [crc_bench.test_push_n]
