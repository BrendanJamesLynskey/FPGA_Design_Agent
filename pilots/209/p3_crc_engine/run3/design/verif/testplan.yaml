    spec: ["behaviour.counters[1]", "registers.map.BUSY_CYCLES"]
    tests: [crc_bench.test_back_to_back, crc_bench.test_lengths]
  - id: REQ-09
    spec: ["behaviour.crc[5]"]
    tests: [crc_bench.test_back_to_back]
  - id: REQ-10
    spec: ["behaviour.counters[2]", "behaviour.counters[3]"]
    tests: [crc_bench.test_init]
  - id: REQ-11
    spec: ["registers.map.CTRL"]
    tests: [crc_bench.test_init]
  - id: REQ-12
    spec: ["registers.map.ID", "behaviour.registers_access[2]"]
    tests: [crc_bench.test_reset_values, crc_bench.test_registers]
  - id: REQ-13
    spec: ["registers.map.BUILD"]
    tests: [crc_bench.test_build_and_structure]
  - id: REQ-14
    spec: ["registers.map.SCRATCH"]
    tests: [crc_bench.test_registers]
  - id: REQ-15
    spec: ["registers.unmapped"]
