  - id: REQ-16
    spec: ["behaviour.registers_access[0]", "timing.latency.read_to_data"]
    tests: [crc_bench.test_read_hold]
  - id: REQ-24
    spec: ["reset"]
    tests: [crc_bench.test_reset_values]
  - id: REQ-25
    spec: ["behaviour.registers_access[1]"]
    tests: [crc_bench.test_registers]
  - id: REQ-26
    spec: ["behaviour.registers_access[0]"]
    tests: [crc_bench.test_read_hold]
  - id: REQ-17
    spec: ["timing.latency.write_to_effect"]
    tests: [crc_bench.test_back_to_back]
  - id: REQ-18
    spec: []
    tests: [crc_bench.test_build_and_structure]
  - id: REQ-19
    spec: ["behaviour.board[0]"]
    tests: [crc_bench.test_sfp_tx_disable, crc_bench.test_reset_values]
  - id: REQ-20
    spec: []
    tests: [crc_bench.test_build_and_structure]
