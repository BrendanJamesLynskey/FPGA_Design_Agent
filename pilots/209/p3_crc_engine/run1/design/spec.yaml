resolved_questions:
- question: 'Register map: offset, width, reset value and access of every register?'
  answer: The map in the request (0x000 to 0x028, all 32 bits, as in registers.map).
  status: defaulted
  by: default
  default_reason: The request lists offsets; confirming them.
- question: Does a PUSH_N with TAIL_LEN 0 count as a busy cycle?
  answer: No, it consumes nothing so BUSY_CYCLES does not change.
  status: defaulted
  by: default
  default_reason: The request says only that full-word messages are checked.
- question: Does PUSH_N with TAIL_LEN 1 to 3 count one busy cycle?
  answer: Yes, one cycle.
  status: defaulted
  by: default
  default_reason: The datapath processes the tail in one clock.
- question: What does TAIL_LEN do when written above 3?
  answer: Only bits 1:0 are stored, value 3 is the maximum stored; bit 2 and up ignored.
  status: defaulted
  by: default
  default_reason: Request says 0 to 3 only.
- question: Which clock frequency?
  answer: 125 MHz via MMCM.
  status: defaulted
  by: default
  default_reason: Must be at least 100 MHz and the board clock is 25 MHz.
- question: What do the LEDs show?
  answer: led0 MMCM locked, led1 heartbeat.
  status: defaulted
  by: default
  default_reason: Not specified.
- question: Can a PUSH occur in the same clock as INIT or while TAIL_LEN is being
    written?
  answer: Register writes are one per clock, so no; a push uses TAIL_LEN as of the
    previous clock.
  status: defaulted
  by: default
  default_reason: Single register port.
- question: CLK_FREQ_MHZ is given as 125 MHZ. The model and the RTL need an integer
    number of clock cycles (CLK_FREQ_CYCLES); at 25 MHz, how many?
  answer: '1'
  status: defaulted
  by: default
  default_reason: 1 is 125 MHZ at 25 MHz, rounded once, so the model and RTL agree
