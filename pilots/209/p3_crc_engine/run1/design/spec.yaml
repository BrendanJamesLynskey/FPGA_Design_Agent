name: p3_crc32
title: CRC-32 engine (Ethernet, 4 bytes per clock) with JTAG register access
board: kr260
part: xck26-sfvc784-2LV-c
top: crc32_top
clocks:
- name: clk_25
  pin_role: C3 25 MHz board clock input
  freq_mhz: 25
- name: clk
  source: MMCM from clk_25
  freq_mhz: 125
  note: free-running design clock, feeds jtag_bus and all logic; at least 100 MHz
    required
reset:
  name: rst
  polarity: active_high
  type: synchronous
  note: held for a few clocks at start, derived from MMCM lock; not a board pin
parameters:
  DESIGN_ID: 546504705
  CRC_POLY: 79764919
  CRC_INIT: 4294967295
  CRC_XOROUT: 4294967295
  DATA_BYTES_PER_CLK: 4
  TAIL_LEN_MAX: 3
  READ_LATENCY_CYCLES: 1
  CLK_FREQ_CYCLES: 1
ports:
- name: clk_25
  direction: in
  width: 1
  board_pin_role: C3 25 MHz clock
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
- name: h_we
  direction: internal
  width: 1
  board_pin_role: jtag_bus register port write pulse
- name: h_re
  direction: internal
  width: 1
  board_pin_role: jtag_bus register port read pulse
- name: h_addr
  direction: internal
  width: 12
  board_pin_role: jtag_bus byte address
- name: h_wdata
  direction: internal
  width: 32
  board_pin_role: jtag_bus write data
- name: h_rdata
  direction: internal
  width: 32
  board_pin_role: jtag_bus read data
behaviour:
  crc:
  - CRC-32 reflected, polynomial 0x04C11DB7, init 0xFFFFFFFF, final XOR 0xFFFFFFFF,
    equal to zlib.crc32 of the bytes in push order.
  - PUSH4 consumes bytes h_wdata[7:0] first, then [15:8], [23:16], [31:24], in one
    clock.
  - PUSH_N consumes the low TAIL_LEN bytes of the written word, bits 7:0 first; TAIL_LEN
    0 consumes nothing.
  - CRC register reads the finalised value (state XOR 0xFFFFFFFF); an empty message
    reads 0x00000000.
  counters:
  - BYTE_COUNT adds 4 per PUSH4 and TAIL_LEN per PUSH_N.
  - BUSY_CYCLES adds 1 for each clock in which the CRC datapath consumes a push with
    at least one byte.
  - INIT (CTRL bit 0) restores CRC state to 0xFFFFFFFF and clears BYTE_COUNT and BUSY_CYCLES;
    bit 0 self-clears.
  register_port:
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - Writes to RO registers are ignored.
  - ID reads 0x20930001; BUILD reads USR_ACCESSE2 word; SCRATCH is 32-bit RW reset
    0.
  board:
  - sfp_tx_disable is driven 1 at all times; no GT channel is used.
  - jtag_bus.sv is used unchanged.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546504705
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 INIT self-clearing; 31:1 reserved
  - offset: 20
    name: PUSH4
    access: WO
    reset: 0
    bits: 31:0 four data bytes
  - offset: 24
    name: PUSH_N
    access: WO
    reset: 0
    bits: 31:0 data, low TAIL_LEN bytes used
  - offset: 28
    name: TAIL_LEN
    access: RW
    reset: 0
    bits: 1:0 N 0 to 3
  - offset: 32
    name: CRC
    access: RO
    reset: 0
    bits: 31:0 finalised CRC-32
  - offset: 36
    name: BYTE_COUNT
    access: RO
    reset: 0
    bits: 31:0 bytes pushed
  - offset: 40
    name: BUSY_CYCLES
    access: RO
    reset: 0
    bits: 31:0 busy clocks
timing:
  clock_mhz: 125
  throughput: 4 bytes per clock, one PUSH4 per clock without stall
  latency:
    push_to_crc: CRC register reflects a push 1 clock after h_we
    read: h_rdata valid 1 clock after h_re (limit 2)
resources_expected:
  luts: 400
  ffs: 300
  brams: 0
  dsps: 0
  mmcm: 1
assumptions:
- assumption: Design clock is 125 MHz from an MMCM (25 MHz x 40 / 8).
  reason: The 25 MHz board clock is below the required 100 MHz; 125 MHz is an integer
    MMCM ratio with timing margin.
- assumption: Counters are 32 bits and wrap.
  reason: Registers are 32 bits wide; no overflow handling requested.
- assumption: led[1:0] show MMCM lock and a heartbeat.
  reason: Request gives no LED function; this is harmless.
- assumption: jtag_bus.sv is not visible in the working directory; its port names
    follow the request (h_we, h_re, h_addr, h_wdata, h_rdata, clk, rst).
  reason: Only the request text was available.
