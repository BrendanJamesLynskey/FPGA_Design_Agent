schema: fda-handover/1
id: p3_crc_engine
title: CRC-32 engine (Ethernet, 4 bytes per clock) with JTAG register access
kind: agent-run
produced_by: agent
summary: The design computes a reflected CRC-32 (the zlib.crc32 variant) over bytes pushed through a JTAG-accessed register
  map (jtag_bus) on the KR260. A PUSH4 write consumes four bytes in one clock and a PUSH_N write consumes 1 to 3 tail bytes.
  The core also keeps byte and busy-cycle counters. The run stopped at the rtl-design-creation stage, whose lint gate failed
  on 5 consecutive visits. Nothing was synthesised, implemented or run on a board, and verification reached V2 of V3. The
  specification and architecture were approved automatically, with no human review.
scope_not:
- Not a general CRC engine, the polynomial, init and final XOR are fixed to the Ethernet CRC-32 values in the RTL.
- Not a streaming or AXI data path, data enters only through the single JTAG register port, one write per clock.
- Not built, timed or tested on hardware, no Vivado build or board result exists.
- Uses no GT transceiver, sfp_tx_disable is a constant output.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: crc32_top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261125-102852-3fd4/p3_crc_engine/design.xdc
resets:
- name: rst
  active: high
  note: Internal and synchronous, not a board pin. crc32_rst_gen asserts it while the MMCM is unlocked and releases it through
    xpm_cdc_async_rst with 4 synchroniser stages.
interfaces:
- name: clk_25
  type: input, 25 MHz board clock on pin C3 (LVCMOS18)
  note: Feeds the MMCM (x40 / 8) that makes the 125 MHz design clock. design.xdc defines the 40 ns period on this port.
- name: led
  type: output, 2 bits, F8 and E8 (LVCMOS18)
  note: led[0] is the MMCM lock, led[1] is bit 24 of a free-running heartbeat counter.
- name: sfp_tx_disable
  type: output, 1 bit, Y10 (LVCMOS33)
  note: Driven 1 at all times in crc32_top.sv.
- name: h_we, h_re, h_addr, h_wdata, h_rdata
  type: register port, 1, 1, 12, 32 and 32 bits
  note: The spec calls these internal, but crc32_top.sv exposes them as top-level outputs. They link jtag_bus and crc32_core,
    and h_rdata is driven by the core.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546504705
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 scratch
- offset: 16
  name: CTRL
  access: RW
  reset: 0
  bits: 0 INIT self-clearing; 31:1 reserved
- offset: 20
  name: PUSH4
  access: WO
  reset: 0
  bits: 31:0 four data bytes
- offset: 24
  name: PUSH_N
  access: WO
  reset: 0
  bits: 31:0 data, low TAIL_LEN bytes used
- offset: 28
  name: TAIL_LEN
  access: RW
  reset: 0
  bits: 1:0 N 0 to 3
- offset: 32
  name: CRC
  access: RO
  reset: 0
  bits: 31:0 finalised CRC-32
- offset: 36
  name: BYTE_COUNT
  access: RO
  reset: 0
  bits: 31:0 bytes pushed
- offset: 40
  name: BUSY_CYCLES
  access: RO
  reset: 0
  bits: 31:0 busy clocks
parameters:
- name: DESIGN_ID
  value: 546504705
  legal: any 32-bit value, spec value 0x20930001
  note: Value read from the ID register at offset 0.
- name: CRC_POLY
  value: 79764919
  legal: fixed at 0x04C11DB7
  note: Not a parameter of crc32_core. The RTL hard-codes the bit-reflected form of this polynomial in the local constant
    RPOLY, so changing this value changes nothing.
- name: CRC_INIT
  value: 4294967295
  legal: any 32-bit value, spec value 0xFFFFFFFF
  note: Initial CRC state, restored by INIT.
- name: CRC_XOROUT
  value: 4294967295
  legal: any 32-bit value, spec value 0xFFFFFFFF
  note: Applied when the CRC register is read.
- name: DATA_BYTES_PER_CLK
  value: 4
  legal: 4 only
  note: Spec throughput is one PUSH4 per clock. It is not a parameter in the RTL.
- name: TAIL_LEN_MAX
  value: 3
  legal: 3 only
  note: TAIL_LEN stores 2 bits, so 3 is the maximum.
- name: READ_LATENCY_CYCLES
  value: 1
  legal: 1 (the spec limit is 2)
  note: Spec gives h_rdata valid 1 clock after h_re. The RTL registers h_rdata once, which matches, but jtag_bus latency
    was not measured.
- name: CLK_FREQ_CYCLES
  value: 1
  legal: 1 only
  note: Spec rounding of the 125 MHz design clock against the 25 MHz board clock. It is not used in the RTL. The spec's
    rate is 125 MHz; the benches did not time it.
