- about: cover_vs_functional
  text: Functional bins and cover properties both read 0 of 0 in verif_gates.json, so no coverage was gathered. Line, toggle
    and mutation results are not measured.
- about: crc_empty_read
  text: In crc32_core.sv the CRC register reads 0 whenever BYTE_COUNT is 0, not only for an empty message. After INIT, or
    after a PUSH_N with TAIL_LEN 0, it reads 0 instead of the finalised state. A 4 GiB wrap of BYTE_COUNT back to 0 would
    also read 0.
- about: init_priority
  text: INIT wins over a push in the same clock (crc32_core.sv). Only one register write happens per clock, so the two cannot
    coincide on the register port.
- about: unmapped_and_ro_access
  text: Reads of unmapped addresses return 0, including 0x00C, 0x014, 0x018 and above 0x028, so PUSH4 and PUSH_N read 0.
    Writes to RO registers do nothing. CTRL always reads 0.
- about: tail_len_write
  text: TAIL_LEN stores only bits 1:0 of the write. A PUSH_N uses the value stored before that clock.
- about: push_latency
  text: A write updates the CRC, counters, SCRATCH and TAIL_LEN on the next clock edge, 1 clock after h_we. A read loads
    h_rdata 1 clock after h_re and holds it until the next h_re, and reset clears it to 0. jtag_bus delay is not counted.
- about: busy_cycles
  text: BUSY_CYCLES adds 1 per push with at least 1 byte, and PUSH_N with TAIL_LEN 0 adds nothing. Counters are 32 bits
    and wrap.
- about: build_register
  text: In simulation the USR_ACCESSE2 stub gives BUILD = 0, so the BUILD value (REQ-13) can only be checked on hardware.
- about: spec_vs_rtl_ports
  text: spec.yaml lists h_we, h_re, h_addr, h_wdata and h_rdata as internal, but crc32_top.sv declares them as top-level
    outputs. design.xdc has no pins for them. This disagreement is unresolved and may block implementation.
- about: spec_vs_rtl_core_params
  text: crc32_core.sv takes only DESIGN_ID, CRC_INIT and CRC_XOROUT as parameters. CRC_POLY, DATA_BYTES_PER_CLK, TAIL_LEN_MAX,
    READ_LATENCY_CYCLES and CLK_FREQ_CYCLES are not RTL parameters.
- about: jtag_bus_source
  text: The spec assumes jtag_bus.sv was not visible, so its port names follow the request. It is not among the listed files,
    and the lint failure may involve it.
next_steps:
- Fix the lint failure of rtl-design-creation first. Read the review page build/review/02_rtl-design-creation.html for the
  failing rule, and check the jtag_bus instance and the h_* ports in crc32_top.sv.
- Decide whether h_we, h_re, h_addr, h_wdata and h_rdata stay as top-level outputs, and update crc32_top.sv, design.xdc
  or spec.yaml so they agree.
- Decide whether CRC must read 0 only for an empty message, and change the BYTE_COUNT test in crc32_core.sv or the spec.
- Compare the cover results with the functional coverage before any new stimulus, then re-run the Verilator coverage command
  and the verification gates.
- Resume with python -m agent resume to reach constraints, synthesis and implementation, then measure resources, timing
  (WNS at or above 0 ns) and power.
- Run the hardware tests for the REQ items that have a hardware proof method.
open_questions:
- Should the CRC register read 0 only for an empty message, as the spec says, or whenever BYTE_COUNT is 0, as the RTL does?
- Should the register-port signals be top-level ports, given that the spec calls them internal?
