<svg xmlns="http://www.w3.org/2000/svg" width="640" height="214" viewBox="0 0 640 214" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="214" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">crc32_top</text><text x="170" y="43">Board top; instantiates MMCM, reset generator, jtag_bus and crc32_core</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">jtag_bus</text><text x="170" y="77">JTAG USER4 register bus (data/jtag_bus.sv, unchanged)</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">crc32_rst_gen</text><text x="170" y="111">Derives synchronous active-high rst from MMCM lock using xpm_cdc_async</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">crc32_core</text><text x="170" y="145">Register map, CRC-32 datapath (4 bytes per clock), BYTE_COUNT, BUSY_CY</text><text x="8" y="172" font-weight="bold">Interfaces</text><text x="8" y="190">jtag_bus - crc32_core: reg_port (simple)</text></svg>
