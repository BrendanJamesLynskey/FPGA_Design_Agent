resolved_questions:
- question: Does PUSH_N with N from 1 to 3 count as a busy cycle, and PUSH_N with
    N=0?
  answer: N 1 to 3 counts 1 busy cycle, N=0 counts 0
  status: defaulted
  by: default
  default_reason: the request only checks BUSY_CYCLES for full-word messages
- question: What clock rate to use?
  answer: 100 MHz
  status: defaulted
  by: default
  default_reason: meets the at-least-100 MHz need with easy timing
- question: What do the LEDs show?
  answer: led[0] = MMCM locked, led[1] = 0
  status: defaulted
  by: default
  default_reason: the request names the LEDs but gives no function
- question: Is TAIL_LEN above 3 allowed?
  answer: values written are masked to 2 bits, so 4 or more read back as value and
    3
  status: defaulted
  by: default
  default_reason: the request gives range 0 to 3 only
- question: Do reads of WO registers (PUSH4, PUSH_N) and writes to RO registers do
    anything?
  answer: WO registers read 0, RO writes are ignored
  status: defaulted
  by: default
  default_reason: the request does not say
- question: Is the register map offset, width, reset value and access of every register
    as in the request table?
  answer: the map in registers.map above, as given in the request
  status: defaulted
  by: default
  default_reason: confirms the register map before it is fixed
- question: What does a push do when it arrives in the same clock as INIT?
  answer: INIT wins, push dropped
  status: defaulted
  by: default
  default_reason: the request does not say
