name: p3_crc32
title: 'P3: CRC-32 engine (Ethernet CRC-32, 4 bytes per clock, JTAG register bus)'
board: kr260
part: xck26-sfvc784-2LV-c
top: top
clocks:
- name: clk25
  pin_role: C3 board 25 MHz oscillator input
  freq_mhz: 25
- name: clk
  source: MMCM from clk25, 100 MHz (25 MHz x 40 / 10), free-running, drives jtag_bus
    and all logic
  freq_mhz: 100
reset:
  name: rst
  polarity: active_high
  style: synchronous
  source: held while MMCM unlocked plus a few clocks (at least 4) after lock, synchronised
    to clk
parameters:
  DESIGN_ID: 546504705
  CRC_POLY: 79764919
  CRC_INIT: 4294967295
  CRC_XOROUT: 4294967295
  DATA_BYTES_PER_CLK: 4
  MMCM_MULT: 40
  MMCM_DIVIDE: 10
  RDATA_LATENCY_CYCLES: 1
ports:
- name: clk25
  direction: input
  width: 1
  board_pin_role: C3 25 MHz clock
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
- name: h_we
  direction: internal
  width: 1
  board_pin_role: jtag_bus register port write pulse (clk domain)
- name: h_re
  direction: internal
  width: 1
  board_pin_role: jtag_bus register port read pulse
- name: h_addr
  direction: internal
  width: 12
  board_pin_role: jtag_bus byte address
- name: h_wdata
  direction: internal
  width: 32
  board_pin_role: jtag_bus write data
- name: h_rdata
  direction: internal
  width: 32
  board_pin_role: jtag_bus read data, valid within 2 clocks of h_re and held
behaviour:
  register_port:
  - A write at h_we takes effect the clock after h_we.
  - After h_re, h_rdata shows the addressed register within 2 clocks and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - All registers are 32 bits on 4-byte steps.
  common_registers:
  - ID at 0x000 reads 0x20930001.
  - BUILD at 0x004 reads the USR_ACCESSE2 word.
  - SCRATCH at 0x008 reads back the last written value and resets to 0.
  crc:
  - CRC-32 reflected, polynomial 0x04C11DB7 (reflected 0xEDB88320), state initial
    0xFFFFFFFF, read value is state XOR 0xFFFFFFFF.
  - PUSH4 write feeds bytes wdata[7:0], [15:8], [23:16], [31:24] in that order, one
    word per clock.
  - PUSH_N write feeds the low N bytes of wdata, bits 7:0 first, N = TAIL_LEN (0 to
    3); N = 0 pushes nothing.
  - CTRL bit 0 written 1 resets CRC state to 0xFFFFFFFF, BYTE_COUNT and BUSY_CYCLES
    to 0; bit self-clears.
  - CRC of an empty message reads 0x00000000; result equals zlib.crc32 of the bytes
    pushed.
  - BYTE_COUNT increments by 4 per PUSH4 and by N per PUSH_N.
  - BUSY_CYCLES increments by 1 for each clock in which the datapath processes a push.
  - Back-to-back PUSH4 writes on consecutive clocks are each accepted (1 word per
    clock).
  board:
  - sfp_tx_disable is driven 1 at all times; no GT transceiver is used.
  - led[0] shows MMCM locked and led[1] is driven 0.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546504705
    bits: 31:0 design id
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESSE2 word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 INIT self-clearing; 31:1 reserved 0
  - offset: 20
    name: PUSH4
    access: WO
    reset: 0
    bits: 31:0 four bytes, bits 7:0 first
  - offset: 24
    name: PUSH_N
    access: WO
    reset: 0
    bits: 31:0 low N bytes used
  - offset: 28
    name: TAIL_LEN
    access: RW
    reset: 0
    bits: 1:0 N 0 to 3; 31:2 reserved 0
  - offset: 32
    name: CRC
    access: RO
    reset: 0
    bits: 31:0 final CRC-32
  - offset: 36
    name: BYTE_COUNT
    access: RO
    reset: 0
    bits: 31:0 bytes pushed
  - offset: 40
    name: BUSY_CYCLES
    access: RO
    reset: 0
    bits: 31:0 busy clocks
timing:
  clock: clk 100 MHz, period 10 ns; 4 bytes per clock = 3.2 Gbit/s
  latency:
    push_to_crc: CRC register reflects a push within 2 clocks after h_we
    read: h_rdata valid 1 clock after h_re, held
    write: write effective the clock after h_we
  constraints: WNS >= 0 at 100 MHz for the 32-bit-per-clock CRC datapath
resources_expected:
  luts: under 400
  ffs: under 400
  bram: 0
  dsp: 0
  mmcm: 1
  other: BSCAN and USR_ACCESSE2 primitives (BSCAN inside jtag_bus)
assumptions:
- assumption: clk is 100 MHz generated by an MMCM from the 25 MHz C3 clock
  reason: the request needs at least 100 MHz and the board only provides 25 MHz
- assumption: jtag_bus.sv is used unchanged and its register port is in the clk domain
  reason: stated in the request
- assumption: tests drive the register port h_* directly without jtag_bus
  reason: the request says simulation need not include it
- assumption: pushes arrive at most one per clock from the register port
  reason: h_we is a single-cycle pulse per write
- assumption: CTRL INIT write wins over a push in the same clock
  reason: INIT must give a clean start
open_questions: []
