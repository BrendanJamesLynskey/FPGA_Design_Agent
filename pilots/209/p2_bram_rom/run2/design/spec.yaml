resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: 'The map in registers.map, as in the request table: 0x000 ID RO, 0x004 BUILD
    RO, 0x008 SCRATCH RW, 0x010 MEM_ADDR RW, 0x014 ROM_DATA RO, 0x018 RAM_DATA RW,
    0x01C MEM_CTRL RW, 0x020 MARCH_CTRL RW, 0x024 MARCH_PASSES RW, 0x028 MARCH_STATUS
    RO, 0x02C MARCH_ERRS RO, 0x030 MARCH_FIRST_ERR RO, all 32 bits wide.'
  status: defaulted
  by: default
  default_reason: The request gives offsets but not reset values for all registers,
    so resets are proposed.
- question: Which order and which backgrounds does a pass use?
  answer: Each pass runs March C- with the all-ones background and then with the all-zeros
    background, so the RAM ends all zeros.
  status: defaulted
  by: default
  default_reason: The request says backgrounds are all-zero and all-one and the RAM
    must end at zeros, but not the order.
- question: Where is the injected fault and what is it?
  answer: One read per pass at address 0 returns bit 0 flipped, giving 1 error per
    pass.
  status: defaulted
  by: default
  default_reason: The request says one wrong value at one address each pass without
    naming the address.
- question: Does MARCH_ERRS count each wrong word read once, or each wrong read operation?
  answer: Each wrong read operation counts 1.
  status: defaulted
  by: default
  default_reason: A word can be wrong in several elements.
- question: What happens if START is written with MARCH_PASSES equal to 0, or while
    BUSY?
  answer: Passes 0 is treated as 1; START while BUSY is ignored.
  status: defaulted
  by: default
  default_reason: The request defines the range 1 to 65535 only.
- question: What do the LEDs show?
  answer: led[0] BUSY, led[1] DONE.
  status: defaulted
  by: default
  default_reason: Not specified.
- question: What do host RAM accesses do while the test is BUSY?
  answer: Reads return 0 and writes are ignored while BUSY.
  status: defaulted
  by: default
  default_reason: The test owns the RAM port.
- question: What does MARCH_CTRL INJECT_FAULT read back, and does RAM_DATA reading
    before any write reflect the init?
  answer: Bit 1 reads back as written, bit 0 reads 0.
  status: defaulted
  by: default
  default_reason: START is self-clearing.
