  - hardware
- id: REQ-21
  text: The design uses 0 GT transceiver channels.
  proof:
  - analysis
- id: REQ-22
  text: The design meets timing at 25 MHz with worst setup slack at or above 0 ns.
  proof:
  - analysis
- id: REQ-23
