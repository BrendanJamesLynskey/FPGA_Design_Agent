  proof:
  - hardware
- id: REQ-03
  text: SCRATCH reads back the last written 32-bit value.
  proof:
  - simulation
  - hardware
- id: REQ-24
  text: SCRATCH reads 0 after reset.
  proof:
  - simulation
  - hardware
- id: REQ-04
  text: Reading ROM_DATA for MEM_ADDR 0 to 1023 returns the 1024 words of data/rom_init.hex
    in order.
  proof:
  - simulation
  - hardware
- id: REQ-05
  text: Before any write RAM word i reads 0xC0DE0000 + i for i from 0 to 1023.
  proof:
  - simulation
  - hardware
- id: REQ-06
  text: With AUTOINC set each ROM_DATA read adds 1 to MEM_ADDR modulo 1024.
  proof:
  - simulation
  - formal
- id: REQ-07
  text: With AUTOINC set each RAM_DATA read or write adds 1 to MEM_ADDR modulo 1024.
  proof:
  - simulation
  - formal
- id: REQ-08
  text: With AUTOINC clear MEM_ADDR is unchanged by ROM_DATA and RAM_DATA accesses.
  proof:
  - simulation
- id: REQ-09
  text: A RAM_DATA write followed by a RAM_DATA read at the same address returns the
    written value.
  proof:
  - simulation
  - hardware
- id: REQ-10
  text: h_rdata shows the addressed register within 2 clocks of h_re.
  proof:
  - simulation
  - formal
- id: REQ-11
  text: A read of an unmapped address returns 0.
  proof:
  - simulation
- id: REQ-26
  text: A write to an unmapped address changes no register.
  proof:
  - simulation
- id: REQ-12
