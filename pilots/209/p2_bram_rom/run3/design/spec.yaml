  - analysis
assumptions:
- assumption: Part is xck26-sfvc784-2LV-c.
  reason: This is the K26 SOM device on the KR260.
- assumption: jtag_bus supplies h_we, h_re, h_addr, h_wdata and takes h_rdata, all
    in the clk domain.
  reason: spec.md describes it so, simulation drives the port directly.
- assumption: Reset is generated inside the top by a counter of 8 clocks.
  reason: The request says rst is held a few clocks at start and the board has no
    reset pin listed.
- assumption: led[0] shows BUSY and led[1] shows DONE.
  reason: The request names the LEDs but gives them no function.
- assumption: ROM and RAM use block RAM with 1 clock read latency.
  reason: 1024 x 32 maps to block RAM and the 2 clock read budget allows it.
open_questions: []
resolved_questions:
- question: What is the exact register map (offset, width, reset value and access
    of every register)?
  answer: 'The table in spec.md as written into registers.map: 32-bit registers at
    0x000 to 0x008 and 0x010 to 0x030, reset values as listed.'
  status: defaulted
  by: default
  default_reason: The request gives offsets but the harness map must be confirmed.
- question: What does a host RAM_DATA access do while the March test is BUSY?
  answer: Reads return 0 and writes are ignored while BUSY.
  status: defaulted
  by: default
  default_reason: The March engine owns the RAM port during the test and the request
    is silent.
- question: Does a MARCH_PASSES write of 0 or a START with 0 passes do anything?
  answer: A value of 0 is treated as 1 pass.
  status: defaulted
  by: default
  default_reason: The request allows 1 to 65535 only.
- question: How is INJECT_FAULT realised and at which address?
  answer: The value read by the engine at address 0 in the first read element of each
    background is inverted in the checker, so the RAM itself is not damaged.
  status: defaulted
  by: default
  default_reason: The request says one wrong value at one address per pass but not
    how many reads or where.
- question: How many errors does one injected fault count per pass?
  answer: 1 error per pass per background that reads the address, giving at least
    1 per pass.
  status: defaulted
  by: default
  default_reason: The request only says errors are expected.
- question: What do the LEDs show?
  answer: led[0] BUSY and led[1] DONE.
  status: defaulted
  by: default
  default_reason: No function is given.
- question: Does START while BUSY restart the test?
  answer: START is ignored while BUSY.
  status: defaulted
  by: default
  default_reason: The request is silent.
- question: Is INJECT_FAULT sampled at START or live?
  answer: Live level, the checker reads it every cycle.
  status: defaulted
  by: default
  default_reason: The request calls it a control bit.
- question: What does BUILD read in simulation?
  answer: A constant 0 stub for USR_ACCESSE2.
  status: defaulted
  by: default
  default_reason: The primitive is not simulated.
