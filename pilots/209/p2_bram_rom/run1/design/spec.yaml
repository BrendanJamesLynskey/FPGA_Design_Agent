resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: The map in spec.md, 0x000-0x008 common and 0x010-0x030 memory registers,
    all 32 bits, as listed in registers.map
  status: defaulted
  by: default
  default_reason: the request gives offsets; confirm them and the reset values it
    leaves unstated (MARCH_PASSES reset 1, others 0)
- question: Which address and how many errors does INJECT_FAULT produce per pass?
  answer: One flipped bit 0 on the first checked read of address 0x155 in the first
    background of each pass, so exactly 1 error per pass
  status: defaulted
  by: default
  default_reason: the request says one wrong value at one address each pass without
    naming it
- question: Is RAM all zero after the run when the last background is all-ones?
  answer: Final element of each background pass leaves the background value; the second
    background pass (all ones) ends with w0, so RAM ends as all zeros
  status: defaulted
  by: default
  default_reason: March C- ends with the array at its starting background; with the
    ones background it would leave ones, but the request requires zeros, so the all-ones
    background is run first and the all-zero background last
- question: What happens on MARCH_PASSES = 0 or a START while BUSY?
  answer: Passes 0 is treated as 1; START while BUSY is ignored
  status: defaulted
  by: default
  default_reason: the request specifies 1 to 65535 only
- question: What happens on host RAM_DATA access while the test is BUSY?
  answer: Writes are ignored and reads return 0 while BUSY
  status: defaulted
  by: default
  default_reason: the march engine owns the RAM port
- question: Do MARCH_PASSES, INJECT_FAULT and reads of the ROM interplay with AUTOINC
    on ROM_DATA reads only?
  answer: AUTOINC acts on ROM_DATA reads and RAM_DATA reads and writes only; MEM_ADDR
    writes are never incremented
  status: defaulted
  by: default
  default_reason: the request lists increments only for those accesses
- question: What are the LED meanings?
  answer: led[0] = BUSY, led[1] = DONE
  status: defaulted
  by: default
  default_reason: the request names the LEDs but gives no function
