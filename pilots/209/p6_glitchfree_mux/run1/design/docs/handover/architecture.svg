<svg xmlns="http://www.w3.org/2000/svg" width="640" height="214" viewBox="0 0 640 214" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="214" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">p6_clkmux_top</text><text x="170" y="43">Thin top; instantiates jtag_bus, reset generator, IBUFDS_GTE4, BUFG_GT</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">jtag_bus</text><text x="170" y="77">BSCANE2 USER4 register bus, supplied unchanged in data/jtag_bus.sv</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">p6_clkmux_core</text><text x="170" y="111">Register map, SEL/switch FSM, SWITCH_COUNT, frequency gate counter, LE</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">p6_muxed_domain</text><text x="170" y="145">Free-running binary counter, Gray twin, checker and MUX_ERRS in clk_mu</text><text x="8" y="172" font-weight="bold">Interfaces</text><text x="8" y="190">jtag_bus - p6_clkmux_core: host_reg_port (simple)</text></svg>
