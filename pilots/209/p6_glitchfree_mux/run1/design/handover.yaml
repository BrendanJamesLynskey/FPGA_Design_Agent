schema: fda-handover/1
id: p6_glitchfree_mux
title: P6 glitch-free clock multiplexer (25 MHz C3 clock and divided GT refclk)
kind: agent-run
produced_by: agent
summary: The design switches a muxed clock domain between the 25 MHz C3 clock and the SFP+ GT reference clock divided by
  B_DIV, using a BUFGCTRL. A register map on the JTAG bus controls SEL, reports switching state, checks a binary counter
  against a Gray twin in the muxed domain, and measures the muxed clock frequency with a gate counted in clk cycles. The
  run stopped at rtl-design-creation, which did not pass its gates. Verification reached V1 of V3, no seeded simulation
  results exist, and nothing was synthesised or built. The specification and architecture were approved automatically, with
  no human review.
scope_not:
- Not a bitstream-ready design; no synthesis, implementation or board result exists.
- No GT transceiver channel is used; only the reference clock buffer IBUFDS_GTE4 is.
- B_DIV is a build-time constant, not a run-time setting.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p6_clkmux_top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261125-154117-dad9/p6_glitchfree_mux/design.xdc
resets:
- name: rst
  active: high
  note: Per spec.yaml, synchronous and held a few clocks at start by jtag_bus; it is synchronised into clk_mux with RESET_SYNC_STAGES
    stages. design.xdc has no reset pin, and the RTL source was not among the files shown for this handover, so the reset
    style is the spec's, not read from the RTL.
interfaces:
- name: clk_25
  type: input clock, 1 bit, pin C3 LVCMOS18
  note: Register bus, gate and clock A. design.xdc names the port clk_25 and creates a 40 ns clock; spec.yaml names it clk.
- name: gt_refclk_p / gt_refclk_n
  type: differential input clock, SFP+ MGTREFCLK0
  note: Drives IBUFDS_GTE4 and then BUFG_GT. design.xdc has no pin or clock constraint for these ports.
- name: led
  type: output, 2 bits, pins F8 (led[0]) and E8 (led[1]) LVCMOS18
  note: led[0] shows ACTIVE_SEL, led[1] shows SWITCHING (spec.yaml).
- name: sfp_tx_disable
  type: output, 1 bit, pin Y10 LVCMOS33
  note: Constant 1.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546701313
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 data
- offset: 16
  name: SEL
  access: RW
  reset: 0
  bits: 0 SEL (0 = A, 1 = B)
- offset: 20
  name: STATUS
  access: RO
  reset: 0
  bits: 0 SWITCHING, 1 ACTIVE_SEL
- offset: 24
  name: B_DIV
  access: RO
  reset: 2
  bits: 3:0 divide of GT refclk (1 to 8)
- offset: 28
  name: GATE_LEN
  access: RW
  reset: 25000000
  bits: 31:0 gate length in clk cycles
- offset: 32
  name: FREQ_CTRL
  access: RW
  reset: 0
  bits: 0 START (self-clearing)
- offset: 36
  name: FREQ_STATUS
  access: RO
  reset: 0
  bits: 0 BUSY, 1 DONE
- offset: 40
  name: FREQ_COUNT
  access: RO
  reset: 0
  bits: 31:0 edges in last gate
- offset: 44
  name: MUX_ERRS
  access: RO
  reset: 0
  bits: 31:0 error count
- offset: 48
  name: MUX_COUNT
  access: RO
  reset: 0
  bits: 31:0 counter low 32 bits at last SNAPSHOT
- offset: 52
  name: SWITCH_COUNT
  access: RO
  reset: 0
  bits: 31:0 completed switches
- offset: 56
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: any write latches MUX_COUNT
parameters:
- name: DESIGN_ID
  value: 546701313
  legal: any 32-bit value; the spec fixes 546701313 (0x20960001)
  note: Value returned by the ID register.
- name: B_DIV_VALUE
  value: 2
  legal: 1 to 8 (BUFG_GT divide range)
  note: Divides the 156.25 MHz GT refclk to give clk_b at 78.125 MHz; read back through B_DIV.
- name: GATE_LEN_DEFAULT
  value: 25000000
  legal: 32-bit unsigned; 0 is treated as 1 cycle (spec default)
  note: 'Reset value of GATE_LEN, 1 s at 25 MHz. The benches simulated 200, so the spec''s value was not simulated. Spec
    timing: clk cycles'
- name: MUX_COUNTER_WIDTH
  value: 32
  legal: 32 (MUX_COUNT exposes only the low 32 bits)
  note: Width of the binary counter and Gray twin in the muxed domain.
- name: RESET_SYNC_STAGES
  value: 3
  legal: 2 or more (XPM reset synchroniser)
  note: Stages of the reset synchroniser into clk_mux.
