- about: resources
  text: 'resources not measured: no current Vivado build of this design has been recorded'
- about: timing
  text: 'timing not measured: no current Vivado build of this design has been recorded'
- about: power
  text: 'power not measured: no current Vivado build of this design has been recorded'
- about: latency
  text: 'latency not measured: the run measured no latency; the spec''s latency promise is checked only by the benches'
- about: throughput
  text: 'throughput not measured: the run measured no throughput'
- about: clock_port_name
  text: design.xdc names the clock port clk_25 and creates a 40 ns clock on it, while spec.yaml and ARCHITECTURE.md call
    the port clk. The XDC is what was built. The RTL top port name was not shown and must match clk_25.
- about: xdc_missing_constraints
  text: design.xdc has no pins or constraints for gt_refclk_p/n and no asynchronous clock-group between clk_mux and clk,
    although REQ-23 and ARCHITECTURE.md require the asynchronous constraint. It also has no clock for the 156.25 MHz refclk.
- about: unmapped_and_reserved_accesses
  text: Per spec.yaml, unmapped addresses (the hole between SCRATCH and SEL, and everything above SNAPSHOT) read 0 and ignore
    writes; writes to RO registers are not specified to have any effect. This is the spec's behaviour and was not shown
    by simulation.
- about: defaulted_behaviours
  text: All eight interview answers were defaults, not user decisions. START written while BUSY is ignored. GATE_LEN 0 acts
    as 1 cycle. A switch during a gate does not abort it or flag FREQ_COUNT. MUX_ERRS saturates at 0xFFFFFFFF and clears
    only on reset. A SEL write during SWITCHING makes the last value win. None of these was checked against the RTL.
- about: read_and_write_latency
  text: The spec promises a write effective 1 clk after h_we and h_rdata valid within 2 clk of h_re, held. This was not
    counted from the RTL here, and no passing simulation backs it.
- about: architecture_cdc_check
  text: The STD-CDC-01 failures cite architecture.yaml crossings whose inline_in names p6_clkmux_top, which the checker
    says is not a module of the design or the shell. This may be an architecture.yaml error rather than an RTL one.
