name: p6_glitch_free_clkmux
title: 'P6: glitch-free clock multiplexer between C3 25 MHz and GT refclk (divided)'
board: kr260
part: xck26-sfvc784-2LV-c
top: p6_clkmux_top
clocks:
- name: clk
  freq_mhz: 25
  pin_role: C3 25 MHz clock (clock A, also the register-bus and gate clock)
- name: gt_refclk
  freq_mhz: 156.25
  pin_role: SFP+ MGTREFCLK0 differential pair (IBUFDS_GTE4 only, no GT channel)
- name: clk_b
  freq_mhz: 78.125
  pin_role: internal, gt_refclk divided by B_DIV (BUFG_GT)
- name: clk_mux
  freq_mhz: 0
  pin_role: internal, BUFGCTRL output, equals clk_a or clk_b (muxed domain)
reset:
  name: rst
  polarity: active-high
  synchronous: true
  note: held a few clocks at start by jtag_bus; muxed domain reset is synchronised
    into clk_mux
parameters:
  DESIGN_ID: 546701313
  B_DIV_VALUE: 2
  GATE_LEN_DEFAULT: 25000000
  MUX_COUNTER_WIDTH: 32
  RESET_SYNC_STAGES: 3
ports:
- name: clk
  direction: input
  width: 1
  board_pin_role: C3 25 MHz clock
- name: gt_refclk_p
  direction: input
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 P
- name: gt_refclk_n
  direction: input
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 N
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ TX_DISABLE (held at 1)
behaviour:
  access:
  - jtag_bus.sv is used unchanged and gives the register port h_we, h_re, h_addr[11:0],
    h_wdata, h_rdata in the clk domain.
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes.
  common_registers:
  - ID at 0x000 reads 0x20960001.
  - BUILD at 0x004 reads the USR_ACCESSE2 word.
  - SCRATCH at 0x008 reads back what was written and resets to 0.
  mux:
  - SEL bit 0 selects clock A (0) or clock B (1), reset 0.
  - A BUFGCTRL-style glitch-free mux drives the muxed domain.
  - SWITCHING is 1 from a change of SEL until the mux output has moved to the requested
    clock.
  - ACTIVE_SEL shows the clock actually driving the muxed domain, synchronised into
    clk.
  - SWITCH_COUNT increments once per completed real change of the selected clock,
    a write of the current value does not count.
  - A SEL write while SWITCHING is 1 is taken as the new request and the final state
    follows the last value written.
  muxed_domain:
  - A free-running 32-bit binary counter increments on every clk_mux edge.
  - An independently coded Gray twin counter runs beside it and is compared with it
    on every clk_mux edge.
  - MUX_ERRS increments on a mismatch or when the count is not previous count plus
    1.
  - MUX_ERRS stays 0 across any number of switches.
  - SNAPSHOT write latches the low 32 bits of the counter into MUX_COUNT through a
    safe clock domain crossing.
  frequency:
  - FREQ_CTRL START begins a gate of GATE_LEN clk cycles, then START self-clears.
  - Rising edges of clk_mux are counted during the gate, the count is moved to clk
    through a safe CDC.
  - BUSY is 1 during the gate, DONE is set at the end and cleared by a new START.
  outputs:
  - sfp_tx_disable is constant 1.
  - led[0] shows ACTIVE_SEL, led[1] shows SWITCHING.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546701313
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 data
  - offset: 16
    name: SEL
    access: RW
    reset: 0
    bits: 0 SEL (0 = A, 1 = B)
  - offset: 20
    name: STATUS
    access: RO
    reset: 0
    bits: 0 SWITCHING, 1 ACTIVE_SEL
  - offset: 24
    name: B_DIV
    access: RO
    reset: 2
    bits: 3:0 divide of GT refclk (1 to 8)
  - offset: 28
    name: GATE_LEN
    access: RW
    reset: 25000000
    bits: 31:0 gate length in clk cycles
  - offset: 32
    name: FREQ_CTRL
    access: RW
    reset: 0
    bits: 0 START (self-clearing)
  - offset: 36
    name: FREQ_STATUS
    access: RO
    reset: 0
    bits: 0 BUSY, 1 DONE
  - offset: 40
    name: FREQ_COUNT
    access: RO
    reset: 0
    bits: 31:0 edges in last gate
  - offset: 44
    name: MUX_ERRS
    access: RO
    reset: 0
    bits: 31:0 error count
  - offset: 48
    name: MUX_COUNT
    access: RO
    reset: 0
    bits: 31:0 counter low 32 bits at last SNAPSHOT
  - offset: 52
    name: SWITCH_COUNT
    access: RO
    reset: 0
    bits: 31:0 completed switches
  - offset: 56
    name: SNAPSHOT
    access: WO
    reset: 0
    bits: any write latches MUX_COUNT
timing:
  register_clock: clk (25 MHz)
  gate_unit: clk cycles
  latency:
    write: register takes effect 1 clk after h_we
    read: h_rdata valid within 2 clk of h_re and held
    switch: SWITCHING clears within a few cycles of both clocks after SEL changes,
      bounded by the BUFGCTRL handshake
    freq_gate: GATE_LEN clk cycles (1 s at default) plus CDC delay
resources_expected:
  luts: 400
  ffs: 600
  bufgctrl: 1
  bufg_gt: 1
  ibufds_gte4: 1
  dsp: 0
  bram: 0
  gt_channels: 0
assumptions:
- assumption: Register bus clock is the 25 MHz C3 clock.
  reason: jtag_bus runs in the clk given to it and C3 is the free-running clock; it
    is also the gate reference.
- assumption: Clock B is the GT refclk through IBUFDS_GTE4 and BUFG_GT divided by
    2.
  reason: BUFG_GT divides 1 to 8 and a lower rate eases timing in the muxed domain.
- assumption: B_DIV is fixed at build time.
  reason: The request says the design tells the divide, so it is a read-only constant.
- assumption: Muxed-domain counter is 32 bits.
  reason: MUX_COUNT exposes only the low 32 bits.
- assumption: Pin locations come from the kr260 board knowledge, none are invented
    here.
  reason: The request names roles only.
open_questions: []
