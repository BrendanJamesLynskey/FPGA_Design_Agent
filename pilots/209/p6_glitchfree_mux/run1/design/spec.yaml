resolved_questions:
- question: What are the register offsets, widths, reset values and access of every
    register?
  answer: The map in the request table (0x000 to 0x038, 32 bits each, reset values
    as listed), as written in registers.map.
  status: defaulted
  by: default
  default_reason: The request gives offsets, confirm they are final.
- question: Which divide B_DIV should clock B use?
  answer: 2 (78.125 MHz)
  status: defaulted
  by: default
  default_reason: The request leaves the value to the design, 1 to 8.
- question: What happens to FREQ_COUNT and DONE if a switch occurs during a gate?
  answer: The gate completes and counts the muxed-clock edges seen, no special flag.
  status: defaulted
  by: default
  default_reason: The request does not say.
- question: What happens when START is written while BUSY is 1?
  answer: Ignored.
  status: defaulted
  by: default
  default_reason: Unspecified, ignoring keeps the running gate valid.
- question: What does GATE_LEN 0 mean?
  answer: Treated as 1 cycle.
  status: defaulted
  by: default
  default_reason: Avoids a stuck BUSY.
- question: What do the LEDs show?
  answer: led[0] ACTIVE_SEL, led[1] SWITCHING.
  status: defaulted
  by: default
  default_reason: The request names the LEDs but not their use.
- question: Is MUX_ERRS saturating and is it cleared by anything?
  answer: Saturates at 0xFFFFFFFF and clears only on reset.
  status: defaulted
  by: default
  default_reason: Unspecified.
- question: What does a write to SEL during SWITCHING do?
  answer: Last value wins, switch counted per completed change.
  status: defaulted
  by: default
  default_reason: The script waits, but behaviour must still be defined.
