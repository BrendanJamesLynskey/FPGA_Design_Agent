schema: fpga-design-agent/architecture/v1
blocks:
  - name: p6_clkmux_top
    function: Thin top; instantiates jtag_bus, reset generator, IBUFDS_GTE4, BUFG_GT, BUFGCTRL and the core
  - name: jtag_bus
    function: BSCANE2 USER4 register bus, supplied unchanged in data/jtag_bus.sv
  - name: p6_clkmux_core
    function: Register map, SEL/switch FSM, SWITCH_COUNT, frequency gate counter, LEDs
  - name: p6_muxed_domain
    function: Free-running binary counter, Gray twin, checker and MUX_ERRS in clk_mux domain
interfaces:
  - name: host_reg_port
    between: [jtag_bus, p6_clkmux_core]
    protocol: simple
    prefix: h
    module: p6_clkmux_core
clock_domains:
  - name: clk
    clock: clk
    freq_mhz: 25
  - name: clk_mux
    clock: clk_mux
    freq_mhz: 78.125
  - name: gt_refclk
    clock: gt_refclk_p
    freq_mhz: 156.25
reset:
  synchronisers: [xpm_cdc_async_rst]
crossings:
  - {from: clk, to: clk_mux, signal: rst, primitive: xpm_cdc_async_rst, inline_in: p6_clkmux_top}
  - {from: clk, to: clk_mux, signal: sel_request, primitive: xpm_cdc_single, inline_in: p6_clkmux_top}
  - {from: clk_mux, to: clk, signal: active_sel, primitive: xpm_cdc_single, inline_in: p6_clkmux_core}
  - {from: clk, to: clk_mux, signal: snapshot_req, primitive: xpm_cdc_pulse, inline_in: p6_muxed_domain}
  - {from: clk_mux, to: clk, signal: mux_count_snapshot, primitive: xpm_cdc_gray, inline_in: p6_muxed_domain}
  - {from: clk_mux, to: clk, signal: mux_errs, primitive: xpm_cdc_gray, inline_in: p6_muxed_domain}
  - {from: clk_mux, to: clk, signal: freq_edges, primitive: xpm_cdc_gray, inline_in: p6_clkmux_core}
predicted_resources:
  lut: [350, 800]
  ff: [600, 1100]
  bram_tile: 0
  dsp: 0
