    there. The spec disagrees with design.xdc.
- about: rtl_not_reviewed
  text: The RTL sources were not among the files shown for this handover. Reset style, unmapped-access behaviour and the
    2-clock read latency are taken from spec.yaml and are not confirmed against the RTL. The run never reached a passing
    RTL stage.
- about: sel_during_switching
  text: Per the interview default, a SEL write during SWITCHING is applied immediately and SWITCH_COUNT counts only completed
    changes of ACTIVE_SEL. A write of the current SEL value does not count. This was a defaulted answer, not simulated.
- about: register_access_rules
  text: 'Per spec.yaml (not simulated): unmapped addresses read 0 and ignore writes; writes to RO registers are ignored
    with no error response; SNAPSHOT reads 0; START while BUSY is ignored; MUX_ERRS saturates at 0xFFFFFFFF; a write takes
    effect one clk_a cycle after h_we.'
- about: freq_tolerance
  text: FREQ_COUNT is expected within plus or minus 2 of the ideal count because the gate is asynchronous to the muxed clock
    (defaulted interview answer). Not measured.
- about: cover_vs_bins
  text: No cover or functional-bin results exist, so the two cannot be compared yet.
