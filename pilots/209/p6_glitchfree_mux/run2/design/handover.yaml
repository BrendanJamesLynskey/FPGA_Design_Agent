schema: fda-handover/1
id: p6_glitchfree_mux
title: Glitch-free clock multiplexer with self-checking muxed domain (KR260)
kind: agent-run
produced_by: agent
summary: The design is meant to switch a muxed clock domain between the 25 MHz board clock and the SFP+ GT reference clock
  (156.25 MHz, divided by B_DIV) through a BUFGCTRL. A 64-bit binary counter and a Gray twin in the muxed domain check each
  other, a gated counter measures the muxed clock frequency, and a register block is reached through jtag_bus. The run stopped
  at the RTL stage, which never passed its gates. Only the clarify and board-and-device-planning stages passed, and no Vivado
  build exists. The specification and architecture were approved automatically, with no human review.
scope_not:
- Not a verified or built design. No simulation results, bitstream, timing, power or board result exist.
- Does not use any GT transceiver channel; only the reference clock buffer is used.
- Not a general clock-domain-crossing library; it covers one mux and one muxed domain.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p6_clkmux_top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261125-161633-50bb/p6_glitchfree_mux/design.xdc
resets:
- name: rst
  active: high
  note: 'Per spec.yaml: comes from jtag_bus, synchronous to clk_a, and is re-synchronised into the clk_mux domain. The RTL
    was not available to confirm this; design.xdc has no reset pin.'
interfaces:
- name: clk_c3
  type: input clock, 25 MHz
  note: spec.yaml name. design.xdc names this port clk_25 (pin C3, LVCMOS18, 40 ns period); see the port_names gap.
- name: mgtrefclk0_p / mgtrefclk0_n
  type: differential GT reference clock input, 156.25 MHz
  note: Listed in spec.yaml and ARCHITECTURE.md, but design.xdc has no constraint for them.
- name: led
  type: output, 2 bits
  note: led[0] shows ACTIVE_SEL and led[1] shows SWITCHING (spec.yaml). Pins F8 and E8, LVCMOS18 in design.xdc.
- name: sfp_tx_disable
  type: output, 1 bit, constant 1
  note: Pin Y10, LVCMOS33 in design.xdc.
- name: h_we, h_re, h_addr, h_wdata, h_rdata
  type: internal register port to jtag_bus (1, 1, 12, 32, 32 bits)
  note: Not top-level pins; tests drive them directly. jtag_bus.sv is meant to be instantiated unchanged.
