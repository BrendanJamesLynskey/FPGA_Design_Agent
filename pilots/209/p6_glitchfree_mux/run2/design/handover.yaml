  access: RW
  reset: 0
  bits: '[0] 0=clock A 1=clock B'
- offset: 20
  name: STATUS
  access: RO
  reset: 0
  bits: '[0] SWITCHING, [1] ACTIVE_SEL'
- offset: 24
  name: B_DIV
  access: RO
  reset: 1
  bits: '[3:0] divide 1 to 8'
- offset: 28
  name: GATE_LEN
  access: RW
  reset: 25000000
  bits: '[31:0] gate length in clk_a cycles'
- offset: 32
  name: FREQ_CTRL
  access: RW
  reset: 0
  bits: '[0] START self-clearing'
- offset: 36
  name: FREQ_STATUS
  access: RO
  reset: 0
  bits: '[0] BUSY, [1] DONE'
- offset: 40
  name: FREQ_COUNT
  access: RO
  reset: 0
  bits: '[31:0] edges in last gate'
- offset: 44
  name: MUX_ERRS
  access: RO
  reset: 0
  bits: '[31:0] error count'
- offset: 48
  name: MUX_COUNT
  access: RO
  reset: 0
  bits: '[31:0] counter low 32 bits at last SNAPSHOT'
- offset: 52
  name: SWITCH_COUNT
  access: RO
  reset: 0
  bits: '[31:0] switches carried out'
- offset: 56
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: '[31:0] any write latches MUX_COUNT; reads 0'
parameters:
- name: ID_VALUE
  value: 546701313
  legal: fixed at 546701313 (0x20960001)
  note: Value read back from the ID register.
- name: B_DIV
  value: 1
  legal: 1 to 8
  note: Divide of the GT reference clock, so clk_b is 156.25 MHz divided by B_DIV (spec timing). It is a build-time constant
    read from the B_DIV register.
- name: GATE_LEN_DEFAULT
  value: 25000000
  legal: 1 to 4294967295 (32-bit register)
  note: 'Reset value of GATE_LEN in clk_a cycles, which is 1 s at 25 MHz (spec timing). The benches simulate it at 200,
    so the spec''s value was not simulated. Spec timing: GATE_LEN clk_a cycles, default 25,000,000 = 1 s at 25 MHz'
- name: SYNC_STAGES
  value: 2
  legal: 2 or more
  note: Synchroniser depth for the clock-domain crossings.
