resolved_questions:
- question: Which divide B_DIV of the GT reference clock should be built in?
  answer: 1 (156.25 MHz used as is)
  status: defaulted
  by: default
  default_reason: request says 'as suits the device'; 1 is the simplest and BUFG_GT
    handles 156.25 MHz
- question: Please confirm the register map (offset, width, reset value and access
    of every register).
  answer: The map in registers.map, taken from the request table (0x000 to 0x038),
    all 32 bits wide
  status: defaulted
  by: default
  default_reason: the request lists offsets; confirming protects the host script and
    unlisted addresses read 0
- question: What tolerance applies to FREQ_COUNT?
  answer: within plus or minus 2 counts of GATE_LEN times f_mux divided by 25 MHz
  status: defaulted
  by: default
  default_reason: the gate is asynchronous to the muxed clock, so the count is quantised
- question: Is a SEL write during SWITCHING queued or applied immediately?
  answer: applied immediately; the BUFGCTRL takes the last value, and SWITCH_COUNT
    counts only completed changes of ACTIVE_SEL
  status: defaulted
  by: default
  default_reason: the script waits for ACTIVE_SEL but random intervals may be short
