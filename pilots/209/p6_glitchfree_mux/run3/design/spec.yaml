name: p6_clkmux
title: 'P6: glitch-free clock multiplexer'
board: kr260
part: xck26-sfvc784-2LV-c
top: p6_clkmux_top
clocks:
- name: clk_c3
  freq_mhz: 25
  pin_role: C3 25 MHz clock pin
  use: register bus (jtag_bus clk), control, gate timer, clock A source
- name: gt_refclk0
  freq_mhz: 156.25
  pin_role: SFP+ cage MGTREFCLK0 (differential, through IBUFDS_GTE4, no GT channel)
  use: clock B source, divided by B_DIV with BUFG_GT
- name: clk_mux
  freq_mhz: 25 or 156.25/B_DIV
  pin_role: internal (BUFGCTRL output)
  use: muxed domain (counter, twin, checker, frequency edge counter)
reset:
  name: rst
  polarity: active high
  sync: synchronous in clk_c3, held by jtag_bus for a few clocks at start
  muxed_domain: reset released synchronously in clk_mux by a 2-flop synchroniser
parameters:
  DESIGN_ID: 546701313
  B_DIV_VALUE: 1
  GATE_LEN_DEFAULT: 25000000
  SWITCH_TIMEOUT_CYCLES: 4096
  MUX_COUNT_WIDTH: 32
ports:
- name: clk_c3
  direction: in
  width: 1
  board_pin_role: C3 25 MHz clock
- name: gt_refclk_p
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 P
- name: gt_refclk_n
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 N
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx_disable, constant 1
behaviour:
  register_port:
  - jtag_bus.sv is used unchanged and gives h_we, h_re, h_addr[11:0], h_wdata[31:0],
    h_rdata[31:0] in clk_c3.
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - ID at 0x000 reads 0x20960001, BUILD at 0x004 reads USR_ACCESSE2, SCRATCH at 0x008
    is RW with reset 0.
  mux:
  - A BUFGCTRL-style glitch-free mux selects clk_c3 (SEL=0) or divided GT clock (SEL=1)
    for the muxed domain.
  - ACTIVE_SEL reports the clock actually driving the muxed domain, synchronised into
    clk_c3.
  - SWITCHING is 1 from a SEL change until ACTIVE_SEL equals SEL.
  - SWITCH_COUNT increments once per completed change of ACTIVE_SEL, and a write of
    SEL equal to the current value adds nothing.
  muxed_domain:
  - A free-running 32-bit binary counter and a Gray-coded twin both increment every
    clk_mux edge.
  - Each clock the Gray twin is compared with the binary counter converted to Gray,
    and the counter is checked as previous+1.
  - Any mismatch or non-increment adds 1 to MUX_ERRS (saturating at 0xFFFFFFFF).
  frequency:
  - START begins a gate of GATE_LEN clk_c3 cycles, BUSY=1 during it, DONE=1 and FREQ_COUNT
    valid at its end.
  - Rising edges of clk_mux are counted over the gate, and START clears DONE.
  - START while BUSY is ignored.
  snapshot:
  - Any write to SNAPSHOT latches the low 32 bits of the muxed counter into MUX_COUNT.
  outputs:
  - sfp_tx_disable is driven 1 at all times and no GT channel is used.
  - led[0] shows ACTIVE_SEL, led[1] shows SWITCHING.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546701313
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 data
  - offset: 16
    name: SEL
    access: RW
    reset: 0
    bits: 0 clock select (0=A, 1=B)
  - offset: 20
    name: STATUS
    access: RO
    reset: 0
    bits: 0 SWITCHING, 1 ACTIVE_SEL
  - offset: 24
    name: B_DIV
    access: RO
    reset: 1
    bits: 3:0 divide 1 to 8
  - offset: 28
    name: GATE_LEN
    access: RW
    reset: 25000000
    bits: 31:0 C3 cycles
  - offset: 32
    name: FREQ_CTRL
    access: RW
    reset: 0
    bits: 0 START self-clearing
  - offset: 36
    name: FREQ_STATUS
    access: RO
    reset: 0
    bits: 0 BUSY, 1 DONE
  - offset: 40
    name: FREQ_COUNT
    access: RO
    reset: 0
    bits: 31:0 edges in last gate
  - offset: 44
    name: MUX_ERRS
    access: RO
    reset: 0
    bits: 31:0 error count
  - offset: 48
    name: MUX_COUNT
    access: RO
    reset: 0
    bits: 31:0 counter at last SNAPSHOT
  - offset: 52
    name: SWITCH_COUNT
    access: RO
    reset: 0
    bits: 31:0 switches done
  - offset: 56
    name: SNAPSHOT
    access: WO
    reset: 0
    bits: write latches MUX_COUNT, reads 0
timing:
  gate_cycles: GATE_LEN clk_c3 cycles (25,000,000 = 1 s at 25 MHz)
  read_latency_clocks: 2
  latency:
    register_read: h_rdata valid within 2 clk_c3 clocks of h_re
    register_write: effect 1 clk_c3 clock after h_we
    switch: ACTIVE_SEL follows SEL within SWITCH_TIMEOUT_CYCLES clk_c3 cycles
resources_expected:
  lut: under 600
  ff: under 800
  bufgctrl: 1
  bufg_gt: 1
  bram: 0
  dsp: 0
assumptions:
- assumption: Register port, control and gate timer run in clk_c3 (25 MHz).
  reason: jtag_bus needs a free-running clk and C3 is the only always-present clock.
- assumption: Clock B is divided with BUFG_GT and the divide is a build-time constant.
  reason: B_DIV is read-only so it is fixed by the design.
- assumption: Status and counter values cross into clk_c3 through synchronisers or
    a toggle handshake, and the clocks are declared asynchronous.
  reason: A and B are unrelated, so no timing path between them is valid.
- assumption: The frequency edge count of clk_mux is transferred to clk_c3 after the
    gate ends.
  reason: Avoids a multi-bit crossing of a running counter.
- assumption: The jtag_bus port names are taken from spec.md.
  reason: data/jtag_bus.sv was not readable in the working directory.
open_questions: []
