resolved_questions:
- question: Which divide from 1 to 8 should clock B use?
  answer: 1 (156.25 MHz undivided)
  status: defaulted
  by: default
  default_reason: The request says as suits the device, and 1 is the simplest with
    the largest ratio against 25 MHz.
- question: Is the register map exactly the table in the request (offset, width, reset
    value and access of every register)?
  answer: Yes, the map in registers.map as in spec.md, all 32-bit at 4-byte steps
  status: defaulted
  by: default
  default_reason: Offsets are given, this confirms no change.
- question: What does a SEL write do while SWITCHING is 1?
  answer: The new value is taken and the mux follows the latest SEL once the current
    change ends
  status: defaulted
  by: default
  default_reason: The request leaves it open.
- question: What does START do if GATE_LEN is 0?
  answer: Gate of 1 cycle (0 treated as 1)
  status: defaulted
  by: default
  default_reason: Avoids a stuck BUSY.
- question: What is FREQ_COUNT if clk_mux is switched during a gate?
  answer: Count whatever edges occur and flag no error
  status: defaulted
  by: default
  default_reason: The request does not say.
- question: Do SWITCH_COUNT and MUX_ERRS clear on anything but reset?
  answer: No, only on rst
  status: defaulted
  by: default
  default_reason: No clear register exists in the map.
- question: Which pins are MGTREFCLK0 and the LEDs?
  answer: Take them from the KR260 board constraints
  status: defaulted
  by: default
  default_reason: Pin names are not in the request.
