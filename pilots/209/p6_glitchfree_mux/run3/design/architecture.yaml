schema: fpga-design-agent/architecture/v1
blocks:
  - {name: jtag_bus, function: "supplied BSCANE2 USER4 register bus, unchanged"}
  - {name: p6_clkmux_top, function: "thin top: jtag_bus, reset, core, IBUFDS_GTE4, BUFG_GT, BUFGCTRL"}
  - {name: p6_clkmux_core, function: "register map, SEL and switch tracking, gate timer, LEDs"}
  - {name: p6_clkmux_mux_domain, function: "clk_mux counter, Gray twin, checker, edge counter"}
interfaces:
  - {name: reg_port, between: [jtag_bus, p6_clkmux_core], protocol: simple, prefix: h, module: p6_clkmux_core}
clock_domains:
  - {name: clk_c3, clock: clk_c3, freq_mhz: 25}
  - {name: gt_refclk0, clock: gt_refclk_p, freq_mhz: 156.25}
  - {name: clk_mux, clock: clk_mux, freq_mhz: 156.25}
reset:
  synchronisers: [p6_clkmux_mux_domain]
crossings:
  - {from: clk_mux, to: clk_c3, signal: active_sel, primitive: xpm_cdc_single, inline_in: p6_clkmux_core}
  - {from: clk_mux, to: clk_c3, signal: freq_count, primitive: xpm_cdc_handshake, inline_in: p6_clkmux_core}
  - {from: clk_mux, to: clk_c3, signal: mux_errs, primitive: xpm_cdc_handshake, inline_in: p6_clkmux_core}
  - {from: clk_mux, to: clk_c3, signal: mux_count_snapshot, primitive: xpm_cdc_handshake, inline_in: p6_clkmux_core}
  - {from: clk_c3, to: clk_mux, signal: gate_enable, primitive: xpm_cdc_single, inline_in: p6_clkmux_mux_domain}
  - {from: clk_c3, to: clk_mux, signal: rst, primitive: xpm_cdc_async_rst, inline_in: p6_clkmux_mux_domain}
predicted_resources:
  lut: [250, 800]
  ff: [650, 1200]
  bram_tile: 0
  dsp: 0
