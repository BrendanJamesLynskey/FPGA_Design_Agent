schema: fda-handover/1
id: p6_glitchfree_mux
title: P6 glitch-free clock multiplexer on the KR260
kind: agent-run
produced_by: agent
summary: The design selects between the 25 MHz board clock (clock A) and the SFP+ MGTREFCLK0 reference clock divided by
  B_DIV (clock B) through a BUFGCTRL-style glitch-free mux. In the muxed domain it runs a binary counter with a Gray-coded
  twin and a checker that counts errors in MUX_ERRS. It also provides a gated edge counter for frequency measurement and
  a snapshot latch, all read and written through a jtag_bus register port in the 25 MHz domain. The run stopped at the rtl-design-creation
  stage. Verification reached V1 of V3, no seeded simulation results exist, and no synthesis, implementation or board result
  was recorded.
scope_not:
- Not a transceiver design; no GT channel is used and sfp_tx_disable is held at 1.
- Not a runtime-configurable divider; B_DIV is read-only and fixed at build time.
- Not verified, built or run on hardware in this run; no Vivado build was made.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: p6_clkmux_top
clocks:
- name: clk_25
  mhz: 25.0
  source: runs/20261125-165016-2a4e/p6_glitchfree_mux/design.xdc
resets:
- name: rst
  active: high
  note: Synchronous in clk_c3, held by jtag_bus for a few clocks at start. It is released into the clk_mux domain through
    a 2-flop synchroniser (spec.yaml; ARCHITECTURE.md names xpm_cdc_async_rst). The RTL was not shown, so this was not checked
    against it.
interfaces:
- name: clk_c3
  type: input clock, 25 MHz, C3 pin
  note: design.xdc names the port clk_25 (pin C3, LVCMOS18, period 40.00 ns), while spec.yaml names it clk_c3; the XDC is
    what was built.
- name: gt_refclk_p / gt_refclk_n
  type: differential input clock, SFP+ MGTREFCLK0, 156.25 MHz
  note: design.xdc has no pin or clock constraint for these ports, so the constraints are incomplete in the built file.
- name: led
  type: output, 2 bits
  note: led[0] shows ACTIVE_SEL and led[1] shows SWITCHING (spec.yaml). design.xdc drives led[0] on F8 and led[1] on E8,
    LVCMOS18.
- name: sfp_tx_disable
  type: output, 1 bit
  note: Constant 1 (spec.yaml). design.xdc places it on Y10, LVCMOS33.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546701313
  bits: 31:0 design ID
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: 31:0 USR_ACCESS word
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: 31:0 data
- offset: 16
  name: SEL
  access: RW
  reset: 0
  bits: 0 clock select (0=A, 1=B)
- offset: 20
  name: STATUS
  access: RO
  reset: 0
  bits: 0 SWITCHING, 1 ACTIVE_SEL
- offset: 24
  name: B_DIV
  access: RO
  reset: 1
  bits: 3:0 divide 1 to 8
- offset: 28
  name: GATE_LEN
  access: RW
  reset: 25000000
  bits: 31:0 C3 cycles
- offset: 32
  name: FREQ_CTRL
  access: RW
  reset: 0
  bits: 0 START self-clearing
- offset: 36
  name: FREQ_STATUS
  access: RO
  reset: 0
  bits: 0 BUSY, 1 DONE
- offset: 40
  name: FREQ_COUNT
  access: RO
  reset: 0
  bits: 31:0 edges in last gate
- offset: 44
  name: MUX_ERRS
  access: RO
  reset: 0
  bits: 31:0 error count
- offset: 48
  name: MUX_COUNT
  access: RO
  reset: 0
  bits: 31:0 counter at last SNAPSHOT
- offset: 52
  name: SWITCH_COUNT
  access: RO
  reset: 0
  bits: 31:0 switches done
- offset: 56
  name: SNAPSHOT
  access: WO
  reset: 0
  bits: write latches MUX_COUNT, reads 0
parameters:
- name: DESIGN_ID
  value: 546701313
  legal: fixed at 546701313 (0x20960001)
  note: Value read back from the ID register at offset 0.
- name: B_DIV_VALUE
  value: 1
  legal: 1 to 8
  note: Divide applied to the 156.25 MHz GT reference clock by BUFG_GT; 1 means undivided. Read back through B_DIV.
- name: GATE_LEN_DEFAULT
  value: 25000000
  legal: 32-bit value; the spec treats 0 as a gate of 1 cycle
  note: 'Reset value of GATE_LEN, in clk_c3 cycles (25,000,000 is 1 s at 25 MHz). The benches simulate at 200, so the spec''s
    value was not simulated. Spec timing: GATE_LEN clk_c3 cycles (25,000,000 = 1 s at 25 MHz)'
- name: SWITCH_TIMEOUT_CYCLES
  value: 4096
  legal: positive integer
  note: ACTIVE_SEL must follow SEL within this many clk_c3 cycles (spec.yaml timing).
- name: MUX_COUNT_WIDTH
  value: 32
  legal: 32 (the registers and the spec are 32 bits)
  note: Width of the muxed-domain counter and its Gray twin.
