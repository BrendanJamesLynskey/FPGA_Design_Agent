resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: 'The map in spec.md, as in registers.map: ID 0x000, BUILD 0x004, SCRATCH
    0x008, GATE_LEN 0x010, CTRL 0x014, STATUS 0x018, COUNT 0x01C, GATE_ACTUAL 0x020,
    MEAS_DONE 0x024, all 32 bits'
  status: defaulted
  by: default
  default_reason: Offsets are given by spec.md, confirm they are final
- question: What happens when GATE_LEN below 1000 is written?
  answer: The value reads back as written, the gate is clamped to 1000 at start, and
    GATE_ACTUAL reports 1000
  status: defaulted
  by: default
  default_reason: Request gives a minimum but not the behaviour below it
- question: What happens on a write to GATE_LEN while BUSY?
  answer: The register updates, the running gate uses the value latched at START
  status: defaulted
  by: default
  default_reason: Keeps GATE_ACTUAL equal to the gate that ran
- question: Do COUNT and GATE_ACTUAL keep the previous result while a new measurement
    runs?
  answer: Yes, they hold the last completed result; DONE=0 marks them stale
  status: defaulted
  by: default
  default_reason: Request says last completed gate
- question: What does MEAS_DONE count from and does it reset?
  answer: Reset to 0 only by rst, increments per completed gate, wraps at 2^32
  status: defaulted
  by: default
  default_reason: '''since configuration'' is ambiguous'
- question: What is the maximum GATE_LEN and the behaviour if the C3 clock is absent?
  answer: Any 32-bit value is accepted; with no C3 clock the gate still ends and COUNT
    is 0
  status: defaulted
  by: default
  default_reason: Not stated; the gate runs on the reference clock
- question: What are the LED duty and exact blink period?
  answer: 50 percent duty, 1 Hz (toggle every 0.5 s of its own clock)
  status: defaulted
  by: default
  default_reason: '''About 1 Hz'' leaves it open'
- question: Is the BUILD register the raw USR_ACCESS value with no byte swap?
  answer: Raw 32-bit value
  status: defaulted
  by: default
  default_reason: Compared to the build record
