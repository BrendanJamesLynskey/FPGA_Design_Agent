name: p1_freq_meter
title: 'P1: clock frequency meter (C3 25 MHz clock measured against the 156.25 MHz
  SFP GT reference clock)'
board: kr260
part: xck26-sfvc784-2LV-c
top: freq_meter_top
clocks:
- name: ref_clk
  role: 156.25 MHz GT reference clock MGTREFCLK0 of the SFP+ quad (via IBUFDS_GTE4
    and BUFG_GT); ruler, register bus clock and gate counter clock
  freq_mhz: 156.25
- name: c3_clk
  role: 25 MHz clock on pin C3, the clock under measurement, edge counter and LED
    0 clock
  freq_mhz: 25
reset:
  name: rst
  polarity: active_high
  type: synchronous
  description: Held for a few ref_clk cycles at start by the JTAG bus module (data/jtag_bus.sv,
    used unchanged); synchronised into c3_clk domain
parameters:
  GATE_LEN_DEFAULT: 156250000
  GATE_LEN_MIN: 1000
  LED_HALF_PERIOD_C3_CYCLES: 12500000
  LED_HALF_PERIOD_REF_CYCLES: 78125000
  DESIGN_ID: 546373633
  REG_READ_LATENCY_CYCLES: 1
ports:
- name: ref_clk_p
  direction: input
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 P (156.25 MHz)
- name: ref_clk_n
  direction: input
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 N
- name: c3_clk
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]; led[0] from c3_clk, led[1] from ref_clk
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
behaviour:
  measurement:
  - Writing CTRL.START=1 while not busy clears DONE, sets BUSY, latches GATE_LEN and
    runs one gate of exactly GATE_LEN ref_clk cycles.
  - During the gate, rising edges of c3_clk are counted; the gate window is transferred
    between clock domains by a synchroniser.
  - At the gate end BUSY clears, COUNT and GATE_ACTUAL are updated, DONE is set and
    MEAS_DONE increments by 1.
  - START written while BUSY is ignored.
  - START is self-clearing and always reads 0.
  - GATE_LEN values below 1000 are clamped to 1000 when a measurement starts.
  leds:
  - led[0] toggles every LED_HALF_PERIOD_C3_CYCLES c3_clk cycles when LED_EN=1.
  - led[1] toggles every LED_HALF_PERIOD_REF_CYCLES ref_clk cycles when LED_EN=1.
  - Both LEDs are 0 when LED_EN=0, and LED_EN is 0 after reset.
  io:
  - sfp_tx_disable is driven to 1 at all times.
  - No GT transceiver channel is used; only the GT reference clock buffer.
  register_port:
  - Interface is the h_we, h_re, h_addr[11:0], h_wdata, h_rdata port of data/jtag_bus.sv.
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register within 1 clock of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - Writes to RO registers are ignored.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546373633
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESSE2 word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] scratch'
  - offset: 16
    name: GATE_LEN
    access: RW
    reset: 156250000
    bits: '[31:0] gate length in ref_clk cycles'
  - offset: 20
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] START self-clearing, ignored while busy; [1] LED_EN'
  - offset: 24
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] BUSY; [1] DONE'
  - offset: 28
    name: COUNT
    access: RO
    reset: 0
    bits: '[31:0] c3_clk rising edges in last gate'
  - offset: 32
    name: GATE_ACTUAL
    access: RO
    reset: 0
    bits: '[31:0] ref_clk cycles in last gate'
  - offset: 36
    name: MEAS_DONE
    access: RO
    reset: 0
    bits: '[31:0] completed measurements'
timing:
  gate_cycles: GATE_LEN ref_clk cycles (6.4 ns each); default 156250000 = 1 s
  c3_count_uncertainty: plus or minus 1 c3_clk edge from clock domain crossing
  latency:
    register_read: h_rdata valid 1 ref_clk cycle after h_re
    register_write: effective 1 ref_clk cycle after h_we
    measurement: GATE_LEN plus a few ref_clk cycles from START to DONE
  constraints: ref_clk 6.4 ns, c3_clk 40 ns, declared asynchronous; CDC paths set
    false or max-delay
resources_expected:
  luts: 400
  ffs: 500
  bram: 0
  dsp: 0
  gt_channels: 0
  gt_refclk_buffers: 1
assumptions:
- assumption: Register bus clk is ref_clk
  reason: The ruler clock is trusted and the gate counter then needs no crossing;
    jtag_bus needs a free-running clock
- assumption: data/jtag_bus.sv is not present in this working directory, its port
    names follow spec.md
  reason: File could not be read; spec.md gives h_we, h_re, h_addr, h_wdata, h_rdata,
    clk, rst
- assumption: BUILD register is read from USR_ACCESSE2 and is not simulated (model
    uses a settable constant)
  reason: Xilinx primitive absent in simulation
- assumption: Pin locations come from the KR260 board file, not stated in spec.md
  reason: spec.md names only pin C3 and the SFP quad
- assumption: The 100 ppm check is a host script check, the design only has to give
    an exact GATE_ACTUAL and a COUNT within 1 edge
  reason: Oscillator accuracy is not a design property
open_questions: []
