resolved_questions:
- question: Which clock drives the register port clk and jtag_bus?
  answer: clk_c3 (25 MHz)
  status: defaulted
  by: default
  default_reason: Always available and no GT clock buffer needed for the register
    path. If the reference clock is dead the registers still answer.
- question: What happens if GATE_LEN is written below 1000?
  answer: Clamp to 1000 at start of measurement, GATE_ACTUAL then reads 1000
  status: defaulted
  by: default
  default_reason: The request gives a minimum but not the behaviour below it.
- question: Does writing GATE_LEN during BUSY change the running gate?
  answer: No, the value is latched at START
  status: defaulted
  by: default
  default_reason: Keeps GATE_ACTUAL equal to the requested gate.
- question: What do COUNT and GATE_ACTUAL read before the first measurement and what
    does MEAS_DONE count since?
  answer: 0 until the first completion, MEAS_DONE resets to 0 only on rst
  status: defaulted
  by: default
  default_reason: '''Since configuration'' is read as since reset.'
- question: Are writes to RO registers and START set together with other CTRL bits
    handled how?
  answer: Writes to RO registers are ignored, LED_EN is written independent of START
  status: defaulted
  by: default
  default_reason: Not specified.
- question: Do the LEDs restart their blink phase when LED_EN is set?
  answer: No, the blink counters free-run and only the output is gated
  status: defaulted
  by: default
  default_reason: Simplest and not specified.
- question: Is the register map as listed correct (offsets given in the request, BUILD
    at 0x004)?
  answer: Use the map in registers.map, offsets 0x000 to 0x024 as in the request
  status: defaulted
  by: default
  default_reason: Confirms the map, the request names the offsets.
