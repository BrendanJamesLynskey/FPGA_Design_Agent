name: p1_freq_meter
title: P1 clock frequency meter (C3 25 MHz clock measured against the 156.25 MHz SFP+
  GT reference clock)
board: kr260
part: xck26-sfvc784-2LV-c
top: freq_meter_top
clocks:
- name: clk_c3
  freq_mhz: 25
  pin: C3
  role: 25 MHz clock under test, also the register-port clock clk (free-running)
- name: clk_ref
  freq_mhz: 156.25
  pin: MGTREFCLK0 of the SFP+ quad (differential pair)
  role: ruler clock, entered through IBUFDS_GTE4 and BUFG_GT, no GT channel used
reset:
  name: rst
  polarity: active_high
  source: rst from data/jtag_bus.sv, held a few clocks at start, synchronised into
    clk_ref domain
  note: LED_EN, START, GATE_LEN, SCRATCH return to their reset values
parameters:
  GATE_LEN_DEFAULT: 156250000
  GATE_LEN_MIN: 1000
  LED_C3_HALF_PERIOD_CYCLES: 12500000
  LED_REF_HALF_PERIOD_CYCLES: 78125000
  DESIGN_ID: 546373633
  REG_READ_LATENCY_CYCLES: 1
ports:
- name: clk_c3
  direction: in
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: mgtrefclk0_p
  direction: in
  width: 1
  board_pin_role: SFP+ GT reference clock 156.25 MHz, positive
- name: mgtrefclk0_n
  direction: in
  width: 1
  board_pin_role: SFP+ GT reference clock 156.25 MHz, negative
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0], led[0] from C3 clock, led[1] from reference
    clock
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
behaviour:
  measurement:
  - Writing CTRL.START=1 while not busy clears DONE and starts one measurement.
  - START written while BUSY is ignored.
  - The gate is open for exactly GATE_LEN reference-clock cycles.
  - COUNT is the number of rising edges of clk_c3 seen during the gate.
  - GATE_ACTUAL is the number of reference cycles the gate was open and equals GATE_LEN
    as latched at start.
  - At gate close the results are stored, DONE is set, BUSY is cleared and MEAS_DONE
    increments by 1.
  - GATE_LEN values below 1000 are clamped to 1000 when latched.
  - Changing GATE_LEN during a measurement does not affect the running gate.
  leds:
  - led[0] toggles every LED_C3_HALF_PERIOD_CYCLES cycles of clk_c3.
  - led[1] toggles every LED_REF_HALF_PERIOD_CYCLES cycles of clk_ref.
  - Both LEDs are 0 while CTRL.LED_EN=0, which is the reset value.
  registers_port:
  - Write takes effect the clock after h_we.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - data/jtag_bus.sv is used unchanged.
  sfp:
  - sfp_tx_disable is 1 at all times, no GT transceiver channel is used.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546373633
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESSE2 word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] scratch'
  - offset: 16
    name: GATE_LEN
    access: RW
    reset: 156280480
    bits: '[31:0] gate length in reference cycles (156250000)'
  - offset: 20
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] START self-clearing, [1] LED_EN'
  - offset: 24
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] BUSY, [1] DONE'
  - offset: 28
    name: COUNT
    access: RO
    reset: 0
    bits: '[31:0] C3 rising edges in last gate'
  - offset: 32
    name: GATE_ACTUAL
    access: RO
    reset: 0
    bits: '[31:0] reference cycles in last gate'
  - offset: 36
    name: MEAS_DONE
    access: RO
    reset: 0
    bits: '[31:0] completed measurements'
timing:
  gate_default: 156250000 clk_ref cycles = 1 s
  gate_min: 1000 clk_ref cycles
  resolution: 1 count of 25 MHz in 1 s is 0.04 ppm
  latency:
    register_read: h_rdata valid 1 to 2 clk cycles after h_re
    register_write: effective 1 clk cycle after h_we
    result_visibility: DONE set only after COUNT and GATE_ACTUAL are stable
resources_expected:
  lut: 300
  ff: 400
  bram: 0
  dsp: 0
  bufg: 3
  gt_channels: 0
  note: USR_ACCESSE2, IBUFDS_GTE4, BUFG_GT, jtag_bus primitives (BSCANE2) included
assumptions:
- assumption: Register-port clk is the 25 MHz C3 clock and the gate FSM runs in clk_ref
    with CDC (toggle or handshake) for START, GATE_LEN and results.
  reason: The request says the port is in the clk domain given to jtag_bus and C3
    is the always-present board clock.
- assumption: COUNT is counted in the clk_c3 domain with the gate signal synchronised
    into it, so the error is at most 1 edge.
  reason: 1 edge in 25e6 is 0.04 ppm, well inside the 100 ppm limit.
- assumption: jtag_bus ports are named clk, rst, h_we, h_re, h_addr, h_wdata, h_rdata.
  reason: Taken from the request text, the file was not readable here.
- assumption: No reference-clock loss detection is provided.
  reason: Not requested.
