- {requirement: REQ-11, method: formal, replaced_by: simulation, artefact: bench_p1_clkmeter.test_measure_basic, why: SymbiYosys is not installed here so BUSY behaviour is checked in simulation.}
- {requirement: REQ-27, method: formal, replaced_by: simulation, artefact: bench_p1_clkmeter.test_measure_basic, why: SymbiYosys is not installed here so DONE validity is checked in simulation.}
- {requirement: REQ-19, method: formal, replaced_by: simulation, artefact: bench_p1_clkmeter.test_sfp_constant, why: SymbiYosys is not installed here so constant sfp_tx_disable is checked in simulation.}
- {requirement: REQ-21, method: formal, replaced_by: simulation, artefact: bench_p1_clkmeter.test_read_latency_hold, why: SymbiYosys is not installed here so read latency is checked in simulation.}
- {requirement: REQ-29, method: formal, replaced_by: simulation, artefact: bench_p1_clkmeter.test_read_latency_hold, why: SymbiYosys is not installed here so the hold property is checked in simulation.}
- {requirement: REQ-22, method: formal, replaced_by: simulation, artefact: bench_p1_clkmeter.test_unmapped_and_ro, why: SymbiYosys is not installed here so unmapped reads are checked in simulation.}
- {requirement: REQ-23, method: formal, replaced_by: simulation, artefact: bench_p1_clkmeter.test_unmapped_and_ro, why: SymbiYosys is not installed here so ignored writes are checked in simulation.}
