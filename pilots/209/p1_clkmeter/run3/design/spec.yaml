name: p1_freq_meter
title: 'P1 clock frequency meter: 25 MHz C3 clock measured against the 156.25 MHz
  SFP+ GT reference clock'
board: kr260
part: xck26-sfvc784-2LV-c
top: freq_meter_top
clocks:
- name: clk_c3
  freq_hz: 25000000
  pin_role: C3 25 MHz single-ended clock input (device under measurement, also the
    register-port clk)
  note: buffered with BUFG; drives jtag_bus, register file and LED0 divider
- name: clk_ref
  freq_hz: 156250000
  pin_role: SFP+ quad MGTREFCLK0 differential pair, through IBUFDS_GTE4 (no GT channel)
    then BUFG_GT (ODIV2)
  note: the ruler; gate counter and LED1 divider run here
reset:
  name: rst
  polarity: active_high
  type: synchronous
  source: no reset pin; generated in clk_c3 domain by a power-up shift register that
    holds rst for 8 clocks, passed to jtag_bus.rst
  note: a synchronised copy is used in the clk_ref domain
parameters:
  DESIGN_ID: 546373633
  GATE_DEFAULT_CYCLES: 156250000
  GATE_MIN_CYCLES: 1000
  LED_C3_HALF_PERIOD_CYCLES: 12500000
  LED_REF_HALF_PERIOD_CYCLES: 78125000
  REG_WIDTH: 32
  COUNT_WIDTH: 32
ports:
- name: clk_c3_in
  direction: in
  width: 1
  board_pin_role: C3 25 MHz clock pin
- name: mgtrefclk0_p
  direction: in
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 P (156.25 MHz)
- name: mgtrefclk0_n
  direction: in
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 N
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]; led[0] from C3, led[1] from reference
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx_disable, held at 1 (laser off) always
- name: h_we
  direction: internal
  width: 1
  board_pin_role: jtag_bus register port write pulse (clk_c3)
- name: h_re
  direction: internal
  width: 1
  board_pin_role: jtag_bus register port read pulse
- name: h_addr
  direction: internal
  width: 12
  board_pin_role: jtag_bus byte address
- name: h_wdata
  direction: internal
  width: 32
  board_pin_role: jtag_bus write data
- name: h_rdata
  direction: internal
  width: 32
  board_pin_role: jtag_bus read data
behaviour:
  measurement:
  - Writing CTRL.START while not BUSY clears DONE, sets BUSY and latches GATE_LEN
    as the gate length for this run.
  - The gate is opened in the clk_ref domain and lasts exactly the latched number
    of clk_ref cycles.
  - During the gate every rising edge of clk_c3 is counted in a 32-bit counter.
  - At gate close COUNT and GATE_ACTUAL are loaded, MEAS_DONE increments by 1, BUSY
    clears and DONE sets.
  - GATE_ACTUAL counts the clk_ref cycles the gate really stayed open and equals the
    latched gate length.
  - CTRL.START written while BUSY is ignored.
  - START and the gate results cross between clk_c3 and clk_ref through synchronisers
    or toggle handshakes, results are stable while DONE is 1.
  leds:
  - LED_EN resets to 0 and both LEDs are 0 while LED_EN is 0.
  - With LED_EN 1, led[0] toggles every LED_C3_HALF_PERIOD_CYCLES clk_c3 cycles.
  - With LED_EN 1, led[1] toggles every LED_REF_HALF_PERIOD_CYCLES clk_ref cycles.
  sfp:
  - sfp_tx_disable is constant 1, no GT channel is instantiated.
  register_port:
  - A write takes effect the clock after h_we.
  - After h_re, h_rdata shows the addressed register within 2 clocks and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - Writes to RO registers are ignored.
  - BUILD reads the USR_ACCESSE2 value.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546373633
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESSE2 word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] read back what was written'
  - offset: 16
    name: GATE_LEN
    access: RW
    reset: 156250000
    bits: '[31:0] gate length in clk_ref cycles'
  - offset: 20
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] START self-clearing, ignored while busy; [1] LED_EN'
  - offset: 24
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] BUSY; [1] DONE'
  - offset: 28
    name: COUNT
    access: RO
    reset: 0
    bits: '[31:0] clk_c3 rising edges in last gate'
  - offset: 32
    name: GATE_ACTUAL
    access: RO
    reset: 0
    bits: '[31:0] clk_ref cycles in last gate'
  - offset: 36
    name: MEAS_DONE
    access: RO
    reset: 0
    bits: '[31:0] completed measurements'
timing:
  gate_default: 156,250,000 clk_ref cycles = 1 s
  gate_min: 1,000 clk_ref cycles = 6.4 us
  resolution: one C3 edge in 1 s gives 1 ppm of 25 MHz resolution is 0.04 ppm, well
    inside 100 ppm
  latency:
    read: h_rdata valid within 2 clk_c3 cycles after h_re
    write: register updated 1 clk_c3 cycle after h_we
    start_to_busy: BUSY visible within 4 clk_c3 cycles of START
    result: DONE set within 8 clk_c3 cycles after the gate closes
resources_expected:
  lut: 400
  ff: 500
  bram: 0
  dsp: 0
  bufg: 3
  gt_channels: 0
assumptions:
- assumption: jtag_bus.sv is used unchanged and instantiated in the clk_c3 domain
  reason: the request says use it unchanged, and C3 is the only other clock besides
    the GT reference
- assumption: the power-up reset is generated internally
  reason: there is no reset pin on the request
- assumption: the 156.25 MHz reference runs from IBUFDS_GTE4 ODIV2 through BUFG_GT
  reason: the GT buffer is the only way to reach the MGTREFCLK0 pins without a transceiver
- assumption: the reference is not a 25 MHz derivative so C3 edges are asynchronous
    to the gate
  reason: count error is at most 1 edge, which is 0.04 ppm at one second
- assumption: GATE_LEN is 32 bits wide
  reason: the default 156,250,000 needs 28 bits and registers are 32 bits
open_questions: []
