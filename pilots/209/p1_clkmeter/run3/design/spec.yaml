resolved_questions:
- question: Which clock should be the register-port clk given to jtag_bus?
  answer: clk_c3 (25 MHz), with the gate logic in clk_ref and CDC between
  status: defaulted
  by: default
  default_reason: the request only says a free-running clock; C3 is a plain pin, the
    GT ODIV2 clock needs more setup, but if C3 is dead the port is dead
- question: What happens when GATE_LEN is written below 1,000?
  answer: the value is clamped to 1,000 at START time and GATE_LEN reads back as written
  status: defaulted
  by: default
  default_reason: the request gives a minimum but no behaviour below it
- question: What happens to a GATE_LEN write while BUSY?
  answer: the write is stored but the running measurement uses the value latched at
    START
  status: defaulted
  by: default
  default_reason: not stated; keeps GATE_ACTUAL equal to the gate of that run
- question: Does LED_EN or SCRATCH change MEAS_DONE, and when does MEAS_DONE clear?
  answer: MEAS_DONE clears only at reset
  status: defaulted
  by: default
  default_reason: the request says since configuration without defining it
- question: Is the register map (offsets, width, reset value and access of every register)
    the one in spec.md?
  answer: the map written in registers.map, copied from the request table, 0x000 ID,
    0x004 BUILD, 0x008 SCRATCH, 0x010 to 0x024 as listed, all 32 bit
  status: defaulted
  by: default
  default_reason: confirms the shell register map, since the offsets are given but
    reset values of the result registers are not (default 0)
- question: Are COUNT and GATE_ACTUAL cleared when a new START is written?
  answer: no, they keep the last values and DONE is 0 until the new result
  status: defaulted
  by: default
  default_reason: the request clears only DONE on START
