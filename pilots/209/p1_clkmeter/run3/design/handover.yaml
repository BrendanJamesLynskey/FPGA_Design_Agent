schema: fda-handover/1
id: p1_clkmeter
title: P1 clock frequency meter (25 MHz C3 clock against the 156.25 MHz SFP+ reference)
kind: agent-run
produced_by: agent
summary: The design measures the 25 MHz C3 clock against the 156.25 MHz MGTREFCLK0 reference on the KR260. A host starts
  a gate of a programmed number of reference cycles through a JTAG register port (jtag_bus), the design counts C3 edges
  inside the gate, and it reports COUNT and GATE_ACTUAL so the host can compute the frequency. Two LEDs show the two clocks.
  The run reached verification level V2 of V3 and stopped at the constraints stage, where design.xdc:13 failed in Vivado.
  No synthesis, implementation or bitstream result exists, and the specification and architecture were approved automatically
  with no human review.
scope_not:
- Not a transceiver design. No GT channel is instantiated, and the reference clock only goes through IBUFDS_GTE4 and BUFG_GT.
- Not a general frequency counter. It has one fixed input (the C3 clock) and one fixed ruler (the SFP+ reference).
- Not built, routed or tested on hardware in this run.
target:
  part: xck26-sfvc784-2LV-c
  board: kr260
  tool: Vivado 2026.1
  top: freq_meter_top
clocks:
- name: clk_c3_in
  mhz: 25.0
  source: runs/20261125-064524-4d2a/p1_clkmeter/design.xdc
- name: mgtrefclk0_p
  mhz: 156.25
  source: runs/20261125-064524-4d2a/p1_clkmeter/design.xdc
resets:
- name: rst
  active: high
  note: Internal and synchronous to clk_c3. An 8-bit power-up shift register in freq_meter_top.sv holds it for 8 clk_c3
    cycles, and there is no reset pin. It is passed through xpm_cdc_async_rst into clk_ref.
interfaces:
- name: clk_c3_in
  type: input clock, 25 MHz, pin C3, LVCMOS18
  note: Buffered by BUFG. Drives jtag_bus, the register file, the edge counter and LED0.
- name: mgtrefclk0_p / mgtrefclk0_n
  type: input differential clock, 156.25 MHz, SFP+ MGTREFCLK0
  note: Goes through IBUFDS_GTE4 (ODIV2) and BUFG_GT to give clk_ref. design.xdc constrains only mgtrefclk0_p, with a 6.40
    ns period.
- name: led
  type: output, 2 bits, LVCMOS18
  note: led[0] is on pin F8 and is driven from clk_c3. led[1] is on pin E8 and is driven from clk_ref. Both are 0 while
    CTRL.LED_EN is 0.
- name: sfp_tx_disable
  type: output, 1 bit, pin Y10, LVCMOS33
  note: Constant 1 (laser off).
- name: h_we, h_re, h_addr, h_wdata, h_rdata
  type: spec-declared register-port names, top-level ports
  note: In the spec these are internal. The RTL exposes them as top-level ports that are unused, except that h_rdata mirrors
    the internal jtag_bus read data. They have no pins in design.xdc, which gives them input and output delays only.
registers:
- offset: 0
  name: ID
  access: RO
  reset: 546373633
  bits: '[31:0] design ID'
- offset: 4
  name: BUILD
  access: RO
  reset: 0
  bits: '[31:0] USR_ACCESSE2 word'
- offset: 8
  name: SCRATCH
  access: RW
  reset: 0
  bits: '[31:0] read back what was written'
- offset: 16
  name: GATE_LEN
  access: RW
  reset: 156250000
  bits: '[31:0] gate length in clk_ref cycles'
- offset: 20
  name: CTRL
  access: RW
  reset: 0
  bits: '[0] START self-clearing, ignored while busy; [1] LED_EN'
- offset: 24
  name: STATUS
  access: RO
  reset: 0
  bits: '[0] BUSY; [1] DONE'
- offset: 28
  name: COUNT
  access: RO
  reset: 0
  bits: '[31:0] clk_c3 rising edges in last gate'
- offset: 32
  name: GATE_ACTUAL
  access: RO
  reset: 0
  bits: '[31:0] clk_ref cycles in last gate'
- offset: 36
  name: MEAS_DONE
  access: RO
  reset: 0
  bits: '[31:0] completed measurements'
parameters:
- name: DESIGN_ID
  value: 546373633
  legal: any 32-bit value; 546373633 is 0x20910001
  note: Read back in the ID register.
- name: GATE_DEFAULT_CYCLES
  value: 156250000
  legal: 1 up to the largest 32-bit value; values below GATE_MIN_CYCLES are clamped at START
  note: Reset value of GATE_LEN. The spec gives 156,250,000 clk_ref cycles = 1 s.
- name: GATE_MIN_CYCLES
  value: 1000
  legal: 1 up to the largest 32-bit value
  note: 'Minimum gate, 1,000 clk_ref cycles = 6.4 us per the spec. A shorter GATE_LEN is clamped at START, while GATE_LEN
    reads back as written. Spec timing: 156,250,000 clk_ref cycles = 1 s'
- name: LED_C3_HALF_PERIOD_CYCLES
  value: 12500000
  legal: 1 or more
  note: led[0] half period in clk_c3 cycles. The benches ran it at 24, so the spec's value was not simulated.
- name: LED_REF_HALF_PERIOD_CYCLES
  value: 78125000
  legal: 1 or more
  note: led[1] half period in clk_ref cycles. The benches ran it at 125, so the spec's value was not simulated.
- name: REG_WIDTH
  value: 32
  legal: 32 only; the RTL hard-codes 32-bit registers and has no such parameter
  note: Register width, taken from the spec.
- name: COUNT_WIDTH
  value: 32
  legal: 32 only; the RTL hard-codes a 32-bit counter and has no such parameter
  note: Width of the edge counter, taken from the spec.
