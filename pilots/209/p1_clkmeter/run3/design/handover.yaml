- about: xdc_site
  text: design.xdc:13 places u_ibufds_gt on IBUFDS_GTE4_X1Y6, and Vivado rejected it as not a valid site name. The file's
    own comment says REFCLK0 is site X1Y0, so the comment and the LOC disagree. This is the blocker for the constraints
    stage.
- about: cover_vs_bins
  text: Functional bins are reported 0 of 0 and cover properties 0 percent. The cover and functional results are not usable
    as evidence yet, and the two must be compared before new stimulus is written.
- about: read_latency
  text: The spec promises h_rdata within 2 clocks of h_re. The RTL (freq_meter_core.sv) registers h_rdata on the clock after
    h_re, which is 1 clk_c3 cycle. The benches check it, and no run measured it.
- about: result_snapshot
  text: COUNT, GATE_ACTUAL and MEAS_DONE read through a snapshot (count_h, actual_h, meas_h) that is refreshed only when
    STATUS is read while BUSY is 0. A host must read STATUS before reading the results. A read of COUNT without a prior
    STATUS read can return the older values. The spec does not describe this.
- about: ctrl_readback
  text: CTRL reads back only LED_EN in bit 1, and bit 0 always reads 0. Any write to CTRL sets LED_EN from h_wdata[1], so
    a START write with bit 1 clear turns the LEDs off.
- about: start_clamp
  text: GATE_LEN below 1000 is clamped to 1000 at START (a default answer from the interview, implemented in freq_meter_core.sv).
    GATE_LEN writes while BUSY are stored but do not affect the running gate.
- about: unmapped_access
  text: Unmapped addresses, including 0x00C, read 0. Writes to RO or unmapped addresses are ignored because the write decode
    matches only 0x008, 0x010 and 0x014.
- about: reset_values
  text: After reset COUNT, GATE_ACTUAL, MEAS_DONE, STATUS, SCRATCH and CTRL read 0, and GATE_LEN reads 156250000. START
    does not clear COUNT or GATE_ACTUAL, and MEAS_DONE clears only at reset.
- about: reset_style
  text: The spec says the reset is synchronous. The RTL uses a synchronous reset in clk_c3 and a CDC-synchronised reset
    in clk_ref, as the spec says. The power-up shift register relies on an initial value (8'hFF) rather than a pin.
- about: top_ports
  text: Spec.yaml lists h_* as internal, but freq_meter_top.sv declares them as top-level ports, and design.xdc gives them
    no pin. Whether they should stay as ports is undecided.
- about: xdc_cdc
  text: design.xdc has no clock-group exception between sys_clk_pin and clk_ref_pin, so the spec's asynchronous constraint
    (REQ-26) relies on the XPM scoped max delays. ARCHITECTURE.md says set_clock_groups -asynchronous is used. The XDC disagrees
    with it.
