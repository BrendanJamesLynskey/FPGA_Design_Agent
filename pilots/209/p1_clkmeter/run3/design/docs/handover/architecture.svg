<svg xmlns="http://www.w3.org/2000/svg" width="640" height="266" viewBox="0 0 640 266" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="266" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">freq_meter_top</text><text x="170" y="43">Thin top: IBUFDS_GTE4+BUFG_GT for the reference, BUFG for C3, power-up</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">jtag_bus</text><text x="170" y="77">Supplied BSCANE2 USER4 register bus (data/jtag_bus.sv, unchanged), clk</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">freq_meter_core</text><text x="170" y="111">Register file (ID, BUILD, SCRATCH, GATE_LEN, CTRL, STATUS, COUNT, GATE</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">gate_ref</text><text x="170" y="145">clk_ref domain gate counter and LED1 divider</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">count_c3</text><text x="170" y="179">clk_c3 edge counter gated by the gate window, sampled via synchroniser</text><text x="8" y="206" font-weight="bold">Interfaces</text><text x="8" y="224">jtag_bus - freq_meter_core: reg_port (simple)</text><text x="8" y="242">freq_meter_top - board: sfp_ctrl (gpio)</text></svg>
