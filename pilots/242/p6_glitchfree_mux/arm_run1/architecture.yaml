schema: fpga-design-agent/architecture/v1
design: p6_clkmux
blocks:
- name: jtag_bus
  function: supplied BSCANE2 USER4 host register bus (data/jtag_bus.sv, unchanged)
- name: p6_clkmux_top
  function: thin top; jtag_bus, power-up reset counter, IBUFDS_GTE4, BUFG_GT divider, BUFGCTRL, core, sfp_tx_disable tie-off
- name: p6_clkmux_core
  function: register core in clk; ID, BUILD, SCRATCH, SEL, STATUS, B_DIV, GATE_LEN, FREQ, MUX regs, SWITCH_COUNT, LEDs
- name: mux_checker
  function: clk_mux domain binary counter, independent Gray twin, comparison and saturating error counter, edge counter for the gate
interfaces:
- name: host_regbus
  between: [jtag_bus, p6_clkmux_core]
  protocol: simple
  prefix: h
  module: p6_clkmux_core
- name: sfp_ctrl
  between: [p6_clkmux_top, board]
  protocol: gpio
  prefix: sfp
  module: p6_clkmux_top
clock_domains:
- name: clk
  clock: clk
  freq_mhz: 25
- name: gt_refclk
  clock: gt_refclk_p
  freq_mhz: 156.25
- name: clk_mux
  clock: clk_mux
  freq_mhz: 156.25
reset:
  synchronisers: [mux_checker]
crossings:
- {from: clk, to: clk_mux, signal: muxed domain reset release, primitive: xpm_cdc_async_rst, inline_in: mux_checker}
- {from: clk, to: clk_mux, signal: gate enable, primitive: xpm_cdc_single, inline_in: mux_checker}
- {from: clk, to: clk_mux, signal: snapshot request, primitive: xpm_cdc_pulse, inline_in: mux_checker}
- {from: clk, to: clk_mux, signal: SEL to BUFGCTRL select, primitive: xpm_cdc_single, inline_in: p6_clkmux_top}
- {from: clk_mux, to: clk, signal: ACTIVE_SEL, primitive: xpm_cdc_single, inline_in: p6_clkmux_core}
- {from: clk_mux, to: clk, signal: error count, primitive: xpm_cdc_gray, inline_in: mux_checker}
- {from: clk_mux, to: clk, signal: edge count at gate end, primitive: xpm_cdc_array_single, inline_in: mux_checker}
- {from: clk_mux, to: clk, signal: snapshot counter low 32, primitive: xpm_cdc_array_single, inline_in: mux_checker}
predicted_resources:
  lut: [250, 500]
  ff: [650, 950]
  bram_tile: 0
  dsp: 0
