# Hidden full spec (pool, P1 training set). The spec oracle answers the agent's questions from this file only.
schema: fpga-design-agent/spec/v0
name: p_digital_clock
title: "Time-of-day clock with 12/24 hour display"
source: spec.md
tier: T1
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: p_digital_clock_top
design_id: 0x54434C4B          # "TCLK"

clocks:
  - {name: sys_clk, port: CLK100MHZ, freq_mhz: 100, source: board oscillator}

reset:
  port: CPU_RESETN
  polarity: active_low
  kind: asynchronous button, synchronised (asserts at once, releases on the clock)
  effect: "the time returns to 00:00:00, DAYS and UPTIME to 0"

parameters:                     # board values; the bench shrinks the time constants
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 100000
  TICK_CYCLES: 100000000
  REFRESH_BITS: 17

ports:
  - {name: CLK100MHZ, dir: in, width: 1, pins: [E3], iostandard: LVCMOS33}
  - {name: CPU_RESETN, dir: in, width: 1, async: true, pins: [C12], iostandard: LVCMOS33}
  - {name: UART_TXD_IN, dir: in, width: 1, async: true, pins: [C4], iostandard: LVCMOS33}
  - {name: UART_RXD_OUT, dir: out, width: 1, pins: [D4], iostandard: LVCMOS33}
  - {name: SW, dir: in, width: 16, async: true, note: "only SW[1:0] are used", pins: [J15, L16, M13, R15, R17, T18, U18, R13, T8, U8, R16, T13, H6, U12, U11, V10], iostandard: {default: LVCMOS33, "SW[8]": LVCMOS18, "SW[9]": LVCMOS18}}
  - {name: LED, dir: out, width: 16, pins: [H17, K15, J13, N14, R18, V17, U17, U16, V16, T15, U14, T16, V15, V14, V12, V11], iostandard: LVCMOS33}
  - {name: CA, dir: out, width: 1, pins: [T10], iostandard: LVCMOS33}
  - {name: CB, dir: out, width: 1, pins: [R10], iostandard: LVCMOS33}
  - {name: CC, dir: out, width: 1, pins: [K16], iostandard: LVCMOS33}
  - {name: CD, dir: out, width: 1, pins: [K13], iostandard: LVCMOS33}
  - {name: CE, dir: out, width: 1, pins: [P15], iostandard: LVCMOS33}
  - {name: CF, dir: out, width: 1, pins: [T11], iostandard: LVCMOS33}
  - {name: CG, dir: out, width: 1, pins: [L18], iostandard: LVCMOS33}
  - {name: DP, dir: out, width: 1, pins: [H15], iostandard: LVCMOS33}
  - {name: AN, dir: out, width: 8, pins: [J17, J18, T9, J14, P14, T14, K2, U13], iostandard: LVCMOS33}

behaviour:
  time:
  - A second divider counts TICK_CYCLES clocks per second and a second increments SS, then MM, then HH (24-hour internal), rolling 23:59:59 -> 00:00:00 and incrementing DAYS (8 bits, wraps).
  - SW[1] (synchronised) up freezes the divider and every counter; the partly counted second is kept and resumes when SW[1] falls.
  - UPTIME counts every second that passes (32 bits, frozen by the pause). A write to TIME sets HH:MM:SS and restarts the divider at 0 (UPTIME and DAYS are unchanged).
  display:
  - Digits are numbered 0 (rightmost, AN[0]) to 7. Digits 0..7 are lit one at a time in order, each for 2^REFRESH_BITS clocks; while digit k is lit AN[k] = 0 and the other AN = 1.
  - Digit 0 = seconds units, 1 = seconds tens, 2 = minutes units, 3 = minutes tens, 4 = hours units, 5 = hours tens; digits 6 and 7 are dark (all AN stay 1 in their slots).
  - 24-hour mode (SW[0] = 0) shows HH as two digits. 12-hour mode (SW[0] = 1) shows H12 = (HH mod 12), or 12 when that is 0; a tens digit of 0 is dark (AN all 1 in its slot). Minutes and seconds always show two digits.
  - 'DP is 0 (lit) while digit 2 or digit 4 is lit and 1 otherwise. Glyphs (segments lit): 0 abcdef, 1 bc, 2 abdeg, 3 abcdg, 4 bcfg, 5 acdfg, 6 acdefg, 7 abc, 8 abcdefg, 9 abcdfg; CA..CG active low.'
  leds:
  - LED[0] = 1 in 12-hour mode when HH >= 12, otherwise 0. LED[15] = pause (SW[1]). All other LEDs 0.

registers:
  shell: shell/PROTOCOL.md (version 1.0)
  map:
    - {offset: 0x00, name: TIME, access: RW, reset: 0, bits: "[5:0] seconds, [11:6] minutes, [16:12] hours (24-hour); a write of a value with seconds > 59, minutes > 59 or hours > 23 is ignored whole"}
    - {offset: 0x01, name: DAYS, access: RW, reset: 0, bits: "[7:0] midnights passed; any write sets it to 0"}
    - {offset: 0x02, name: UPTIME, access: RO, reset: 0, bits: "[31:0] seconds counted while not paused"}
  unmapped: "offsets above the last register read 0; writes to them and to RO registers are ignored"

timing:
  clock_constraint: 10 ns on CLK100MHZ
  latency:
    second: exactly TICK_CYCLES clocks from the divider restart
  async_inputs: switches, CPU_RESETN and UART RX are synchronised and false-pathed
  outputs: slow registered outputs, false-pathed

requirements:
  - {id: REQ-01, text: "Seconds, minutes, hours roll over correctly and midnights are counted", proof: [simulation]}
  - {id: REQ-02, text: "The pause holds the divider and counters, and resumes from the held second", proof: [simulation]}
  - {id: REQ-03, text: "The display shows the time in 24-hour or 12-hour form as described, with separators", proof: [simulation]}
  - {id: REQ-04, text: "TIME writes are validated; registers behave as listed", proof: [simulation]}
  - {id: REQ-05, text: "Registers answer as the model predicts on the board", proof: [hardware]}
  - {id: REQ-06, text: "The design closes timing at 100 MHz with no unconstrained path", proof: [analysis]}

resources_expected: "a few hundred LUTs and FFs; no BRAM, no DSP"

assumptions:
  - assumption: "a write to TIME restarts the second divider"
    reason: "so a set time begins a full second from the write"

open_questions: []
