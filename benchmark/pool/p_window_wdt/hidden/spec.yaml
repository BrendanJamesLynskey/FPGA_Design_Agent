# Hidden full spec (pool, P1 training set). The spec oracle answers the agent's questions from this file only.
schema: fpga-design-agent/spec/v0
name: p_window_wdt
title: "Window watchdog with fault pulse"
source: spec.md
tier: T1
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: p_window_wdt_top
design_id: 0x57574454          # "WWDT"

clocks:
  - {name: sys_clk, port: CLK100MHZ, freq_mhz: 100, source: board oscillator}

reset:
  port: CPU_RESETN
  polarity: active_low
  kind: asynchronous button, synchronised (asserts at once, releases on the clock)
  effect: "the counter restarts, all flags and counts return to 0, JA1 low"

parameters:                     # board values; the bench shrinks the time constants
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 100000
  WIN_OPEN: 50000000
  WIN_CLOSE: 150000000
  RST_PULSE: 10000000

ports:
  - {name: CLK100MHZ, dir: in, width: 1, pins: [E3], iostandard: LVCMOS33}
  - {name: CPU_RESETN, dir: in, width: 1, async: true, pins: [C12], iostandard: LVCMOS33}
  - {name: UART_TXD_IN, dir: in, width: 1, async: true, pins: [C4], iostandard: LVCMOS33}
  - {name: UART_RXD_OUT, dir: out, width: 1, pins: [D4], iostandard: LVCMOS33}
  - {name: SW, dir: in, width: 16, async: true, note: "only SW[0] is used", pins: [J15, L16, M13, R15, R17, T18, U18, R13, T8, U8, R16, T13, H6, U12, U11, V10], iostandard: {default: LVCMOS33, "SW[8]": LVCMOS18, "SW[9]": LVCMOS18}}
  - {name: LED, dir: out, width: 16, pins: [H17, K15, J13, N14, R18, V17, U17, U16, V16, T15, U14, T16, V15, V14, V12, V11], iostandard: LVCMOS33}
  - {name: JA1, dir: out, width: 1, note: "fault pulse on Pmod JA pin 1", pins: [C17], iostandard: LVCMOS33}

behaviour:
  timing:
  - SW[0] (synchronised) is ENABLE. While ENABLE = 0 the counter C is held at 0 and nothing is checked; the clock after ENABLE rises C starts counting from 0.
  - C counts clocks since the last restart (enable, good kick or fault).
  - 'When C passes WIN_CLOSE (C = WIN_CLOSE + 1 with no good kick) a LATE fault occurs: LATES increments (8 bits, saturating), the flags LATE and FAULT set, the pulse starts and C restarts at 0 on the same clock.'
  kick:
  - 'A write of 0x6B to KICK is a key kick; any other value is a wrong key: BADKEYS increments (8 bits, saturating) and nothing else happens.'
  - 'A key kick with C >= WIN_OPEN and C <= WIN_CLOSE is good: C restarts at 0.'
  - 'A key kick with C < WIN_OPEN is an EARLY fault: EARLYS increments (8 bits, saturating), the flags EARLY and FAULT set, the pulse starts and C restarts at 0.'
  - Key writes while ENABLE = 0 have no effect; wrong-key writes are still counted in BADKEYS.
  outputs:
  - JA1 is high for RST_PULSE clocks after each fault (registered); a new fault during a pulse restarts the pulse. LED[1] = JA1; LED[0] = FAULT flag; other LEDs 0.
  - A write to STATUS clears the flags and EARLYS, LATES and BADKEYS.

registers:
  shell: shell/PROTOCOL.md (version 1.0)
  map:
    - {offset: 0x00, name: KICK, access: WO, reset: 0, bits: "[7:0] key; reads 0"}
    - {offset: 0x01, name: STATUS, access: RW, reset: 0, bits: "[0] FAULT, [1] EARLY, [2] LATE (sticky flags); any write clears the flags and the three counts"}
    - {offset: 0x02, name: EARLYS, access: RO, reset: 0, bits: "[7:0] early faults"}
    - {offset: 0x03, name: LATES, access: RO, reset: 0, bits: "[7:0] late faults"}
    - {offset: 0x04, name: BADKEYS, access: RO, reset: 0, bits: "[7:0] wrong keys"}
    - {offset: 0x05, name: WIN_OPEN, access: RO, reset: null, bits: "[31:0] WIN_OPEN"}
    - {offset: 0x06, name: WIN_CLOSE, access: RO, reset: null, bits: "[31:0] WIN_CLOSE"}
  unmapped: "offsets above the last register read 0; writes to them and to RO registers are ignored"

timing:
  clock_constraint: 10 ns on CLK100MHZ
  latency:
    fault_to_pulse: 1 clock
  async_inputs: SW[0], CPU_RESETN and UART RX are synchronised and false-pathed
  outputs: registered, false-pathed

requirements:
  - {id: REQ-01, text: "A good key kick inside the window restarts the timing without a fault", proof: [simulation]}
  - {id: REQ-02, text: "A key kick before WIN_OPEN is an early fault; no kick by WIN_CLOSE is a late fault; both restart the timing", proof: [simulation]}
  - {id: REQ-03, text: "Each fault gives a JA1 pulse of RST_PULSE clocks and lights LED[0] until cleared", proof: [simulation]}
  - {id: REQ-04, text: "Wrong keys are counted and otherwise ignored; the watchdog is idle while disabled", proof: [simulation]}
  - {id: REQ-05, text: "Registers answer as the model predicts on the board", proof: [hardware]}
  - {id: REQ-06, text: "The design closes timing at 100 MHz with no unconstrained path", proof: [analysis]}

resources_expected: "under 150 LUTs and FFs; no BRAM, no DSP"

assumptions:
  - assumption: "a fault restarts the timing at 0 so a missed kick repeats a late fault every WIN_CLOSE + 1 clocks"
    reason: "the request says that after any fault the timing starts again"

open_questions: []
