# Hidden full spec (pool, P1 training set). The spec oracle answers the agent's questions from this file only.
schema: fpga-design-agent/spec/v0
name: p_servo_pwm
title: "Hobby-servo pulse generator"
source: spec.md
tier: T1
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: p_servo_pwm_top
design_id: 0x5352564F          # "SRVO"

clocks:
  - {name: sys_clk, port: CLK100MHZ, freq_mhz: 100, source: board oscillator}

reset:
  port: CPU_RESETN
  polarity: active_low
  kind: asynchronous button, synchronised (asserts at once, releases on the clock)
  effect: "the output goes low and the first frame starts again"

parameters:                     # board values; the bench shrinks the time constants
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 100000
  FRAME_CYCLES: 2000000
  MIN_CYCLES: 100000
  STEP_CYCLES: 390

ports:
  - {name: CLK100MHZ, dir: in, width: 1, pins: [E3], iostandard: LVCMOS33}
  - {name: CPU_RESETN, dir: in, width: 1, async: true, pins: [C12], iostandard: LVCMOS33}
  - {name: UART_TXD_IN, dir: in, width: 1, async: true, pins: [C4], iostandard: LVCMOS33}
  - {name: UART_RXD_OUT, dir: out, width: 1, pins: [D4], iostandard: LVCMOS33}
  - {name: SW, dir: in, width: 16, async: true, pins: [J15, L16, M13, R15, R17, T18, U18, R13, T8, U8, R16, T13, H6, U12, U11, V10], iostandard: {default: LVCMOS33, "SW[8]": LVCMOS18, "SW[9]": LVCMOS18}}
  - {name: LED, dir: out, width: 16, pins: [H17, K15, J13, N14, R18, V17, U17, U16, V16, T15, U14, T16, V15, V14, V12, V11], iostandard: LVCMOS33}
  - {name: JA1, dir: out, width: 1, note: "servo signal on Pmod JA pin 1", pins: [C17], iostandard: LVCMOS33}

behaviour:
  frame:
  - A free-running frame counter restarts every FRAME_CYCLES clocks. JA1 rises on the first clock of a frame (a registered output) and rising edges are exactly FRAME_CYCLES clocks apart.
  sampling:
  - On the clock a frame starts, the synchronised SW[7:0] becomes POS and the synchronised SW[15] becomes OFF for the whole frame; later switch changes act from the next frame.
  pulse:
  - WIDTH = MIN_CYCLES + POS x STEP_CYCLES. JA1 is high for exactly WIDTH clocks from the start of the frame (WIDTH is always below FRAME_CYCLES).
  - While OFF is set for the frame, JA1 stays low for the whole frame and WIDTH reads 0.
  outputs:
  - LED[7:0] = POS, LED[15] = OFF, others 0.

registers:
  shell: shell/PROTOCOL.md (version 1.0)
  map:
    - {offset: 0x00, name: POS, access: RO, reset: 0, bits: "[7:0] position of the current frame"}
    - {offset: 0x01, name: WIDTH, access: RO, reset: 0, bits: "[31:0] pulse width in clocks of the current frame (0 when off)"}
    - {offset: 0x02, name: FRAME, access: RO, reset: null, bits: "[31:0] FRAME_CYCLES"}
  unmapped: "offsets above the last register read 0; writes to them and to RO registers are ignored"

timing:
  clock_constraint: 10 ns on CLK100MHZ
  latency:
    switch_to_pulse: at most one frame plus 3 clocks
  async_inputs: switches, CPU_RESETN and UART RX are synchronised and false-pathed
  outputs: registered, false-pathed

requirements:
  - {id: REQ-01, text: "JA1 pulses once per frame, the frame length being exactly FRAME_CYCLES clocks", proof: [simulation]}
  - {id: REQ-02, text: "The pulse width is MIN_CYCLES + POS x STEP_CYCLES, with POS sampled at the frame start only", proof: [simulation]}
  - {id: REQ-03, text: "SW[15] switches the output off from the next frame", proof: [simulation]}
  - {id: REQ-04, text: "The LEDs and registers reflect the position in use", proof: [simulation]}
  - {id: REQ-05, text: "Registers answer as the model predicts on the board", proof: [hardware]}
  - {id: REQ-06, text: "The design closes timing at 100 MHz with no unconstrained path", proof: [analysis]}

resources_expected: "under 100 LUTs and FFs; no BRAM, no DSP"

assumptions:
  - assumption: "the pulse starts at the start of the frame"
    reason: "the usual servo convention; the request only describes the width"

open_questions: []
