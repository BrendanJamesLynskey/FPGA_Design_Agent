# Hidden full spec (pool, P1 training set). The spec oracle answers the agent's questions from this file only.
schema: fpga-design-agent/spec/v0
name: p_sigma_delta_dac
title: "First-order sigma-delta DAC on the audio output"
source: spec.md
tier: T2
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: p_sigma_delta_dac_top
design_id: 0x53444441          # "SDDA"

clocks:
  - {name: sys_clk, port: CLK100MHZ, freq_mhz: 100, source: board oscillator}

reset:
  port: CPU_RESETN
  polarity: active_low
  kind: asynchronous button, synchronised (asserts at once, releases on the clock)
  effect: "VALUE = 0, accumulator 0, AUD_PWM low, AUD_SD low"

parameters:                     # board values; the bench shrinks the time constants
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 100000

ports:
  - {name: CLK100MHZ, dir: in, width: 1, pins: [E3], iostandard: LVCMOS33}
  - {name: CPU_RESETN, dir: in, width: 1, async: true, pins: [C12], iostandard: LVCMOS33}
  - {name: UART_TXD_IN, dir: in, width: 1, async: true, pins: [C4], iostandard: LVCMOS33}
  - {name: UART_RXD_OUT, dir: out, width: 1, pins: [D4], iostandard: LVCMOS33}
  - {name: SW, dir: in, width: 16, async: true, note: "SW[0] invert, SW[15] enable", pins: [J15, L16, M13, R15, R17, T18, U18, R13, T8, U8, R16, T13, H6, U12, U11, V10], iostandard: {default: LVCMOS33, "SW[8]": LVCMOS18, "SW[9]": LVCMOS18}}
  - {name: AUD_PWM, dir: out, width: 1, pins: [A11], iostandard: LVCMOS33}
  - {name: AUD_SD, dir: out, width: 1, pins: [D12], iostandard: LVCMOS33}
  - {name: LED, dir: out, width: 16, pins: [H17, K15, J13, N14, R18, V17, U17, U16, V16, T15, U14, T16, V15, V14, V12, V11], iostandard: LVCMOS33}

behaviour:
  input:
  - SW[0] (INV) and SW[15] (EN) are synchronised by two flops.
  stream:
  - 'An 8-bit accumulator ACC, starting at 0 after reset. While EN = 1, on every clock: SUM = ACC + VALUE (9 bits); ACC = SUM[7:0]; the raw bit is SUM[8] (the carry). AUD_PWM = raw XOR INV, registered. While EN = 0, ACC is held and AUD_PWM = 0.'
  - So in any 256 consecutive enabled clocks with constant VALUE and INV = 0 there are exactly VALUE ones, and the stream repeats with period 256 / gcd(VALUE, 256) once ACC has settled to the same phase.
  - AUD_SD = EN (registered). A write to VALUE takes effect on the next clock and does not clear ACC.
  outputs:
  - LED[7:0] = VALUE, LED[15] = EN, others 0.

registers:
  shell: shell/PROTOCOL.md (version 1.0)
  map:
    - {offset: 0x00, name: VALUE, access: RW, reset: 0, bits: "[7:0] density numerator; upper bits ignored"}
  unmapped: "offsets above the last register read 0; writes to them and to RO registers are ignored"

timing:
  clock_constraint: 10 ns on CLK100MHZ
  latency:
    value_to_stream: within 3 clocks
  async_inputs: switches, CPU_RESETN and UART RX are synchronised and false-pathed
  outputs: registered, false-pathed

requirements:
  - {id: REQ-01, text: "Any 256 consecutive enabled clocks hold exactly VALUE ones (or 256 - VALUE inverted)", proof: [simulation]}
  - {id: REQ-02, text: "The ones are spread by the accumulator rule: the stream matches the first-order sigma-delta sequence", proof: [simulation]}
  - {id: REQ-03, text: "EN gates AUD_PWM and AUD_SD; INV complements the stream", proof: [simulation]}
  - {id: REQ-04, text: "VALUE and the LEDs behave as listed", proof: [simulation]}
  - {id: REQ-05, text: "Registers answer as the model predicts on the board", proof: [hardware]}
  - {id: REQ-06, text: "The design closes timing at 100 MHz with no unconstrained path", proof: [analysis]}

resources_expected: "under 50 LUTs and FFs; no BRAM, no DSP"

assumptions:
  - assumption: "the accumulator keeps its phase across value writes"
    reason: "the usual behaviour of a sigma-delta modulator"

open_questions: []
