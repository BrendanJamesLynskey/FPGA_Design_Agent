# Hidden full spec (pool, P1 training set). The spec oracle answers the agent's questions from this file only.
schema: fpga-design-agent/spec/v0
name: p_seq_detect
title: "Programmable serial pattern detector"
source: spec.md
tier: T1
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: p_seq_detect_top
design_id: 0x53514454          # "SQDT"

clocks:
  - {name: sys_clk, port: CLK100MHZ, freq_mhz: 100, source: board oscillator}

reset:
  port: CPU_RESETN
  polarity: active_low
  kind: asynchronous button, synchronised (asserts at once, releases on the clock)
  effect: "PATTERN = 0x0B, LEN = 4, shift register, counts and match LED cleared"

parameters:                     # board values; the bench shrinks the time constants
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 100000
  SAMPLE_CYCLES: 100000

ports:
  - {name: CLK100MHZ, dir: in, width: 1, pins: [E3], iostandard: LVCMOS33}
  - {name: CPU_RESETN, dir: in, width: 1, async: true, pins: [C12], iostandard: LVCMOS33}
  - {name: UART_TXD_IN, dir: in, width: 1, async: true, pins: [C4], iostandard: LVCMOS33}
  - {name: UART_RXD_OUT, dir: out, width: 1, pins: [D4], iostandard: LVCMOS33}
  - {name: SW, dir: in, width: 16, async: true, note: "SW[0] data, SW[1] invert, SW[2] hold", pins: [J15, L16, M13, R15, R17, T18, U18, R13, T8, U8, R16, T13, H6, U12, U11, V10], iostandard: {default: LVCMOS33, "SW[8]": LVCMOS18, "SW[9]": LVCMOS18}}
  - {name: LED, dir: out, width: 16, pins: [H17, K15, J13, N14, R18, V17, U17, U16, V16, T15, U14, T16, V15, V14, V12, V11], iostandard: LVCMOS33}

behaviour:
  sampling:
  - A free-running counter produces a sampling instant every SAMPLE_CYCLES clocks from reset; LED[1] toggles at every instant, hold or not.
  - 'SW[0], SW[1], SW[2] are synchronised by two flops. At an instant with HOLD = SW[2] = 0: S = SW[0]; SHIFT = ((SHIFT << 1) | S) & 0xFF; SAMPLES increments (16 bits, wraps); a match is determined as below. With HOLD = 1 nothing changes except LED[1].'
  match:
  - LEN_E = LEN, but 1 if LEN is 0 and 8 if LEN is above 8. MASK = 2^LEN_E - 1. TARGET = PATTERN & MASK, or (~PATTERN) & MASK when SW[1] (INV) is 1 at the instant.
  - MATCH = (SAMPLES counted since the last clear, including this one, >= LEN_E) and (SHIFT & MASK) = TARGET, evaluated on the updated SHIFT. COUNT increments on a match (16 bits, wraps). LED[0] = MATCH of the latest taken-in sample (held until the next one that is taken in; held through HOLD).
  reset_and_clear:
  - A write to CTRL clears SHIFT, SAMPLES, COUNT and LED[0].

registers:
  shell: shell/PROTOCOL.md (version 1.0)
  map:
    - {offset: 0x00, name: PATTERN, access: RW, reset: 0x0B, bits: "[7:0] pattern (oldest bit = most significant of the used length)"}
    - {offset: 0x01, name: LEN, access: RW, reset: 4, bits: "[3:0] pattern length 1..8 (0 acts as 1, above 8 as 8; reads as written)"}
    - {offset: 0x02, name: SHIFT, access: RO, reset: 0, bits: "[7:0] the last eight bits taken in, newest in bit 0"}
    - {offset: 0x03, name: COUNT, access: RO, reset: 0, bits: "[15:0] matches"}
    - {offset: 0x04, name: SAMPLES, access: RO, reset: 0, bits: "[15:0] bits taken in"}
    - {offset: 0x05, name: CTRL, access: WO, reset: 0, bits: "any write clears SHIFT, SAMPLES, COUNT and LED[0]; reads 0"}
  unmapped: "offsets above the last register read 0; writes to them and to RO registers are ignored"

timing:
  clock_constraint: 10 ns on CLK100MHZ
  latency:
    input_to_sample: taken at the next sampling instant, 2-3 clocks after the switch
  async_inputs: switches, CPU_RESETN and UART RX are synchronised and false-pathed
  outputs: registered, false-pathed

requirements:
  - {id: REQ-01, text: "The detector matches the pattern over the latest bits, with overlap, only after LEN bits have been taken in", proof: [simulation]}
  - {id: REQ-02, text: "INV looks for the flipped pattern; HOLD freezes the detector", proof: [simulation]}
  - {id: REQ-03, text: "LEN edge cases (0, above 8) and CTRL clearing behave as listed", proof: [simulation]}
  - {id: REQ-04, text: "LED[1] toggles at the sampling rate", proof: [simulation]}
  - {id: REQ-05, text: "Registers answer as the model predicts on the board", proof: [hardware]}
  - {id: REQ-06, text: "The design closes timing at 100 MHz with no unconstrained path", proof: [analysis]}

resources_expected: "a few hundred LUTs and FFs; no BRAM, no DSP"

assumptions:
  - assumption: "matches before LEN bits have arrived since a clear are suppressed"
    reason: "otherwise the leading zeros of the shift register could match"

open_questions: []
