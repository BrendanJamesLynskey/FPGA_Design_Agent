# Hidden full spec (pool, P1 training set). The spec oracle answers the agent's questions from this file only.
schema: fpga-design-agent/spec/v0
name: p_rr_arbiter
title: "Four-way round-robin arbiter with a hold limit"
source: spec.md
tier: T1
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: p_rr_arbiter_top
design_id: 0x52524152          # "RRAR"

clocks:
  - {name: sys_clk, port: CLK100MHZ, freq_mhz: 100, source: board oscillator}

reset:
  port: CPU_RESETN
  polarity: active_low
  kind: asynchronous button, synchronised (asserts at once, releases on the clock)
  effect: "no grant, rotation start after requester 3, counts at 0"

parameters:                     # board values; the bench shrinks the time constants
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 100000
  MAX_HOLD: 5000000

ports:
  - {name: CLK100MHZ, dir: in, width: 1, pins: [E3], iostandard: LVCMOS33}
  - {name: CPU_RESETN, dir: in, width: 1, async: true, pins: [C12], iostandard: LVCMOS33}
  - {name: UART_TXD_IN, dir: in, width: 1, async: true, pins: [C4], iostandard: LVCMOS33}
  - {name: UART_RXD_OUT, dir: out, width: 1, pins: [D4], iostandard: LVCMOS33}
  - {name: SW, dir: in, width: 16, async: true, note: "SW[3:0] are the four requests", pins: [J15, L16, M13, R15, R17, T18, U18, R13, T8, U8, R16, T13, H6, U12, U11, V10], iostandard: {default: LVCMOS33, "SW[8]": LVCMOS18, "SW[9]": LVCMOS18}}
  - {name: LED, dir: out, width: 16, pins: [H17, K15, J13, N14, R18, V17, U17, U16, V16, T15, U14, T16, V15, V14, V12, V11], iostandard: LVCMOS33}

behaviour:
  input:
  - SW[3:0] are synchronised by two flops; R is the synchronised request vector.
  decision:
  - 'State: GRANT (none or one of 0..3), LAST (starts at 3), HOLD (clocks the current grant has been visible).'
  - 'Each clock, with GRANT = none: if R != 0, the first requester i found in the order LAST+1, LAST+2, LAST+3, LAST (mod 4) with R[i] = 1 is granted: GRANT = i, LAST = i, HOLD = 0, GRANTS[i] increments. Otherwise nothing.'
  - 'Each clock with a GRANT = g: if R[g] = 0 the grant is released (GRANT = none). Else if HOLD + 1 >= MAX_HOLD and some other R bit is set, the grant is taken away (GRANT = none, FORCED increments). Else HOLD increments.'
  - So after a release or a take-away the grant lines are all low for exactly one clock when another request is waiting, and a taken-away grant was visible for exactly MAX_HOLD clocks.
  outputs:
  - LED[3:0] = one-hot GRANT (registered), LED[15:4] = 0.

registers:
  shell: shell/PROTOCOL.md (version 1.0)
  map:
    - {offset: 0x00, name: GRANTS0, access: RW, reset: 0, bits: "[15:0] grants given to requester 0; any write clears GRANTS0-3 and FORCED"}
    - {offset: 0x01, name: GRANTS1, access: RO, reset: 0, bits: "[15:0] grants to requester 1"}
    - {offset: 0x02, name: GRANTS2, access: RO, reset: 0, bits: "[15:0] grants to requester 2"}
    - {offset: 0x03, name: GRANTS3, access: RO, reset: 0, bits: "[15:0] grants to requester 3"}
    - {offset: 0x04, name: FORCED, access: RO, reset: 0, bits: "[15:0] grants taken away at MAX_HOLD"}
    - {offset: 0x05, name: LAST, access: RO, reset: 3, bits: "[1:0] requester granted last (3 after reset)"}
  unmapped: "offsets above the last register read 0; writes to them and to RO registers are ignored"

timing:
  clock_constraint: 10 ns on CLK100MHZ
  latency:
    request_to_grant: a few clocks (two-flop synchroniser plus output register)
  async_inputs: switches, CPU_RESETN and UART RX are synchronised and false-pathed
  outputs: registered, false-pathed

requirements:
  - {id: REQ-01, text: "At most one grant line is high at a time and a grant lasts until released", proof: [simulation, formal]}
  - {id: REQ-02, text: "After a release the next requester in rotation after the last granted wins", proof: [simulation]}
  - {id: REQ-03, text: "A grant is taken away after MAX_HOLD clocks only when another request waits", proof: [simulation]}
  - {id: REQ-04, text: "One idle clock separates grants; counters and LAST read as listed", proof: [simulation]}
  - {id: REQ-05, text: "Registers answer as the model predicts on the board", proof: [hardware]}
  - {id: REQ-06, text: "The design closes timing at 100 MHz with no unconstrained path", proof: [analysis]}

resources_expected: "under 100 LUTs and FFs; no BRAM, no DSP"

assumptions:
  - assumption: "a taken-away requester that is still requesting competes again, last in the rotation"
    reason: "that follows from the rotation rule"

open_questions: []
