# Hidden full spec (benchmark v1). The spec oracle answers the agent's questions from this file only.
schema: fpga-design-agent/spec/v0
name: t2_qspi_sfdp
title: Configuration flash JEDEC ID and SFDP header reader
source: spec.md
tier: T2
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: t2_qspi_sfdp_top
design_id: 0x53464450          # "SFDP"

clocks:
  - {name: sys_clk, port: CLK100MHZ, freq_mhz: 100, source: board oscillator, note: "SCK is a registered data signal into STARTUPE2 USRCCLKO, not a fabric clock"}

reset:
  port: CPU_RESETN
  polarity: active_low
  kind: asynchronous button, synchronised (asserts at once, releases on the clock)
  effect: registers to reset values; QSPI_CSN high; SCK low; then the start-up SCK cycles (below)

parameters:                     # board values; the bench shrinks the time constants
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 100000
  HALF: 10                      # SCK 5 MHz

ports:
  - {name: CLK100MHZ, dir: in, width: 1, pins: [E3], iostandard: LVCMOS33}
  - {name: CPU_RESETN, dir: in, width: 1, async: true, pins: [C12], iostandard: LVCMOS33}
  - {name: QSPI_CSN, dir: out, width: 1, note: "4.7 kohm pull-up on the board", pins: [L13], iostandard: LVCMOS33}
  - {name: QSPI_DQ0, dir: out, width: 1, note: "flash SI (master out)", pins: [K17], iostandard: LVCMOS33}
  - {name: QSPI_DQ1, dir: in, width: 1, async: true, note: "flash SO (master in)", pins: [K18], iostandard: LVCMOS33}
  - {name: QSPI_DQ2, dir: out, width: 1, note: "WP# - drive 0", pins: [L14], iostandard: LVCMOS33}
  - {name: QSPI_DQ3, dir: out, width: 1, note: "HOLD# - drive 1", pins: [M14], iostandard: LVCMOS33}
  - {name: UART_TXD_IN, dir: in, width: 1, async: true, pins: [C4], iostandard: LVCMOS33}
  - {name: UART_RXD_OUT, dir: out, width: 1, pins: [D4], iostandard: LVCMOS33}

behaviour:
  sck:
    - SCK reaches the flash only through STARTUPE2 - USRCCLKO = SCK, USRCCLKTS = 0; the other STARTUPE2 inputs inactive (GSR 0, GTS 0, KEYCLEARB 1, PACK 0, USRDONEO 1, USRDONETS 1). No QSPI_SCK port.
    - "After reset, before any transaction, SCK makes at least 3 full cycles with QSPI_CSN high (STARTUPE2 drops the first 3 USRCCLKO edges after configuration)."
    - SCK idles low (mode 0); each half period is HALF clocks.
  transactions:
    - "Mode 0 - the flash samples DQ0 on SCK rising edges and changes DQ1 after falling edges; the master puts each bit on DQ0 before the rising edge and samples DQ1 (synchronised by two flops) at the rising edge. Bytes MSB first."
    - "Each transaction - QSPI_CSN low, at least HALF clocks, the SCK cycles back to back, at least HALF clocks after the last falling edge QSPI_CSN high, and at least 4 * HALF clocks high before the next."
    - "A write to CTRL with bit 0 = 1 while BUSY = 0 - BUSY set, DONE and SIG_OK cleared, then two transactions - RDID [0x9F, then 3 bytes read into ID] and RSFDP [0x5A, address 0x00 0x00 0x00, 8 dummy SCK cycles, then 16 bytes read into SFDP0-SFDP3]; then BUSY cleared, DONE set, SIG_OK = (SFDP0 == 0x50444653)."
    - Writes to CTRL while BUSY are ignored. A later start reads both again.
    - "No other opcode is ever sent (no write enable, program, erase, register write or reset); DQ0 carries 0 during dummy and read bytes."
  pins:
    - QSPI_DQ2 (WP#) = 0 and QSPI_DQ3 (HOLD#) = 1 at all times.

registers:
  shell: shell/PROTOCOL.md (version 1.0)
  map:
    - {offset: 0x00, name: CTRL, access: WO, reset: 0, bits: "[0] write 1 to start; reads return 0"}
    - {offset: 0x01, name: STATUS, access: RO, reset: 0, bits: "[0] BUSY, [1] DONE, [2] SIG_OK; [31:3] 0"}
    - {offset: 0x02, name: ID, access: RO, reset: 0, bits: "[23:16] first RDID byte (manufacturer), [15:8] second, [7:0] third; [31:24] 0"}
    - {offset: 0x03, name: SFDP0, access: RO, reset: 0, bits: "SFDP bytes 0-3, byte 0 in [7:0] (little-endian; the signature reads 0x50444653)"}
    - {offset: 0x04, name: SFDP1, access: RO, reset: 0, bits: "SFDP bytes 4-7, byte 4 in [7:0]"}
    - {offset: 0x05, name: SFDP2, access: RO, reset: 0, bits: "SFDP bytes 8-11"}
    - {offset: 0x06, name: SFDP3, access: RO, reset: 0, bits: "SFDP bytes 12-15"}
  unmapped: offsets 0x07-0x7F read 0; writes to them and to RO registers are ignored

timing:
  clock_constraint: 10 ns on CLK100MHZ
  latency:
    transaction: "RDID 4 bytes, RSFDP 21 bytes (opcode, 3 address, 1 dummy, 16 data), 16 * HALF clocks a byte"
  async_inputs: QSPI_DQ1, CPU_RESETN and UART RX are synchronised and false-pathed
  outputs: QSPI_CSN, DQ0, DQ2, DQ3 and USRCCLKO registered

requirements:
  - {id: REQ-01, text: "RDID and RSFDP (address 0, 8 dummy cycles, 16 bytes) are sent exactly as listed, in mode 0", proof: [simulation]}
  - {id: REQ-02, text: "No opcode other than 0x9F and 0x5A ever reaches the flash", proof: [simulation, analysis]}
  - {id: REQ-03, text: "ID, SFDP0-3 and SIG_OK hold what the flash returned", proof: [simulation]}
  - {id: REQ-04, text: "SCK leaves through STARTUPE2 USRCCLKO, with start-up cycles; WP# low, HOLD# high", proof: [simulation, analysis]}
  - {id: REQ-05, text: "On the board the ID reads 01 20 18", proof: [hardware]}
  - {id: REQ-06, text: "The design closes timing at 100 MHz with no unconstrained path", proof: [analysis]}

resources_expected: "about a hundred and fifty LUTs and FFs; one STARTUPE2; no BRAM, no DSP"

assumptions:
  - assumption: the start-up SCK cycles are sent once after reset, not before every start.
    reason: STARTUPE2 drops edges only after configuration; once is enough.
  - assumption: SIG_OK compares only the four signature bytes.
    reason: the request asks whether the signature matched.

open_questions: []
