mutants:
  - {name: zero_not_fixed, file: lfsr_dice.sv, find: "if (r == 16'd0) r = 16'd1;", replace: "", why: "a step can lock the LFSR at 0"}
  - {name: seed_zero_loads_zero, file: lfsr_dice.sv, find: "s    <= (win_wdata[15:0] == 16'd0) ? 16'd1 : win_wdata[15:0];", replace: "s    <= win_wdata[15:0];", why: "a SEED write of 0 loads 0"}
  - {name: roll_from_old_state, file: lfsr_dice.sv, find: "roll  <= 3'(ns % 16'd6) + 3'd1;", replace: "roll  <= 3'(s % 16'd6) + 3'd1;", why: "the roll uses the state before the step"}
  - {name: history_reversed, file: lfsr_dice.sv, find: "hist  <= {hist[11:0], 1'b0, 3'(ns % 16'd6) + 3'd1};", replace: "hist  <= {1'b0, 3'(ns % 16'd6) + 3'd1, hist[15:4]};", why: "newest roll lands in the top nibble"}
  - {name: wrong_feedback_bit, file: lfsr_dice.sv, find: "if (v[0]) r = r ^ t;", replace: "if (r[0]) r = r ^ t;", why: "taps applied on the wrong bit"}
  - {name: burst_one_extra, file: lfsr_dice.sv, find: "if (wr_step) left <= win_wdata[15:0];", replace: "if (wr_step) left <= win_wdata[15:0] + 16'd1;", why: "a burst of n makes n + 1 steps"}
  - {name: dark_digit_shows_zero, file: t1_lfsr_dice_top.sv, find: "default: glyph = 7'b0000000;\n        endcase\n        seg_lit = '0;\n        seg_lit[0] = glyph;\n    end\n\n    bm_scan8 #(.REFRESH_BITS(REFRESH_BITS)) u_scan (\n        .clk(clk), .rst(rst), .enable(1'b1), .seg_lit(seg_lit), .blank({7'h7F, roll == 3'd0})", replace: "default: glyph = 7'b0111111;\n        endcase\n        seg_lit = '0;\n        seg_lit[0] = glyph;\n    end\n\n    bm_scan8 #(.REFRESH_BITS(REFRESH_BITS)) u_scan (\n        .clk(clk), .rst(rst), .enable(1'b1), .seg_lit(seg_lit), .blank({7'h7F, 1'b0})", why: "digit 0 shows a 0 glyph before the first roll (v1.2: the v1 form, a lit digit with a blank glyph, is dark and so equivalent to the reference)"}
  - {name: six_without_top, file: t1_lfsr_dice_top.sv, find: "3'd6: glyph = 7'b1111101;", replace: "3'd6: glyph = 7'b1111100;", why: "6 drawn without segment a"}
  - {name: debounce_half, file: bm_debounce.sv, find: "end else if (run == CW'(CYCLES - 1)) begin", replace: "end else if (run == CW'(CYCLES / 2)) begin", why: "debounce accepts pulses of half the time"}
