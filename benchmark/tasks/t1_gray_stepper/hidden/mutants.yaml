mutants:
  - {name: gray_wrong_shift, file: gray_stepper.sv, find: "gray  <= bin_nx ^ (bin_nx >> 1);", replace: "gray  <= bin_nx ^ (bin_nx << 1);", why: "Gray conversion shifts the wrong way: several LEDs change per step"}
  - {name: direction_inverted, file: gray_stepper.sv, find: "assign bin_nx = dir ? bin - 10'd1 : bin + 10'd1;", replace: "assign bin_nx = dir ? bin + 10'd1 : bin - 10'd1;", why: "SW[15] = 1 counts up"}
  - {name: leds_binary, file: gray_stepper.sv, find: "assign led = {auto_on, 5'd0, gray};", replace: "assign led = {auto_on, 5'd0, bin};", why: "LEDs show the binary count"}
  - {name: rate_off_by_one, file: gray_stepper.sv, find: "tk == rate - 16'd1;", replace: "tk == rate;", why: "automatic steps RATE + 1 ticks apart"}
  - {name: auto_ignored, file: gray_stepper.sv, find: "assign run    = auto_on && rate != 16'd0;", replace: "assign run    = rate != 16'd0;", why: "automatic stepping runs with AUTO off"}
  - {name: wrap_at_1000, file: gray_stepper.sv, find: "assign bin_nx = dir ? bin - 10'd1 : bin + 10'd1;", replace: "assign bin_nx = dir ? (bin == 10'd0 ? 10'd999 : bin - 10'd1) : (bin == 10'd999 ? 10'd0 : bin + 10'd1);", why: "counter wraps at 1000 (decimal habit): the wrap changes several LEDs"}
  - {name: steps_count_writes, file: gray_stepper.sv, find: "        end else if (wr_bin) begin\n            bin  <= win_wdata[9:0];", replace: "        end else if (wr_bin) begin\n            steps <= steps + 1'b1;\n            bin  <= win_wdata[9:0];", why: "a BIN write counts as a step"}
  - {name: debounce_half, file: bm_debounce.sv, find: "end else if (run == CW'(CYCLES - 1)) begin", replace: "end else if (run == CW'(CYCLES / 2)) begin", why: "debounce accepts pulses of half the time"}
  - {name: press_restarts_prescaler, file: gray_stepper.sv, find: "if (wr_ctrl || wr_rate || !run) begin", replace: "if (wr_ctrl || wr_rate || press || !run) begin", why: "a button press moves the automatic grid"}
