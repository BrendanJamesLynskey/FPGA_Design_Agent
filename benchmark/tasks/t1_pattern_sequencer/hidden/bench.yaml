# Hidden acceptance bench for t1_pattern_sequencer (benchmark/tools/run_task.py)
toplevel: t1_pattern_sequencer_top
module: acceptance
parameters: {CLKS_PER_BIT: 8, TIMEOUT_CYCLES: 400, DEBOUNCE_CYCLES: 16, TICK_CYCLES: 16}
phrases:
  - "play back a little light show that I program over the test shell"
  - "It can loop for ever or play once and stop on the last step"
  - "When I change a step's pattern while the show runs, I want to see the change straight away"
  - "how many times it has gone round"
