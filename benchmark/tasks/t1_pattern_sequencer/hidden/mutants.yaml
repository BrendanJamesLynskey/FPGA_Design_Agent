mutants:
  - {name: dur_zero_not_256, file: pattern_sequencer.sv, find: "return (d == 8'd0) ? 9'd256 : {1'b0, d};", replace: "return {1'b0, d};", why: "DUR 0 is not 256 ticks"}
  - {name: tick_off_by_one, file: pattern_sequencer.sv, find: "wire tick     = pre == PW'(TICK_CYCLES - 1);", replace: "wire tick     = pre == PW'(TICK_CYCLES);", why: "a tick is TICK_CYCLES + 1 clocks"}
  - {name: plays_one_extra, file: pattern_sequencer.sv, find: "else if (5'(idx) + 5'd1 < len) begin", replace: "else if (5'(idx) < len) begin", why: "LENGTH + 1 entries played"}
  - {name: oneshot_goes_dark, file: pattern_sequencer.sv, find: "led <= (run || done) ? pat[idx] : 16'd0;", replace: "led <= run ? pat[idx] : 16'd0;", why: "one-shot does not hold the last pattern"}
  - {name: run_write_restarts, file: pattern_sequencer.sv, find: "end else if (wr_ctrl && !run) begin", replace: "end else if (wr_ctrl && win_wdata[0]) begin", why: "a RUN = 1 write while running restarts the show"}
  - {name: pause_keeps_time, file: pattern_sequencer.sv, find: "if (!paused) begin", replace: "if (1'b1) begin", why: "time keeps running while paused"}
  - {name: oneshot_no_loop_count, file: pattern_sequencer.sv, find: "loops <= loops + 1'b1;", replace: "if (!oneshot) loops <= loops + 1'b1;", why: "a finished one-shot is not counted in LOOPS"}
  - {name: length_accepts_17, file: pattern_sequencer.sv, find: "win_wdata[4:0] <= 5'd16)", replace: "win_wdata[4:0] <= 5'd17)", why: "LENGTH 17 accepted"}
  - {name: debounce_half, file: bm_debounce.sv, find: "end else if (run == CW'(CYCLES - 1)) begin", replace: "end else if (run == CW'(CYCLES / 2)) begin", why: "debounce accepts pulses of half the time"}
  - {name: run_not_reset, file: pattern_sequencer.sv, find: "if (rst) begin\n            run <= 1'b0; ", replace: "if (rst) begin\n            ", why: "CPU_RESETN does not reset run (amended 2026-11-10: the reset test now kills a mutant)"}
