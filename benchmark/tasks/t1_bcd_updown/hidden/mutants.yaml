mutants:
  - {name: step_eight, file: bcd_updown.sv, find: "default: step = 14'd10;", replace: "default: step = 14'd8;", why: "SW = 11 steps by 8, not 10"}
  - {name: wrap_off_by_one, file: bcd_updown.sv, find: "if (sum >= 15'd10000) begin", replace: "if (sum > 15'd10000) begin", why: "9999 + 1 shows 10000 instead of wrapping"}
  - {name: debounce_half, file: bm_debounce.sv, find: "end else if (run == CW'(CYCLES - 1)) begin", replace: "end else if (run == CW'(CYCLES / 2)) begin", why: "debounce accepts pulses of half the time"}
  - {name: simultaneous_up_wins, file: bcd_updown.sv, find: "end else if (p_up && !p_dn) begin", replace: "end else if (p_up) begin", why: "up wins when both press on one clock"}
  - {name: write_range, file: bcd_updown.sv, find: "win_wdata < 32'd10000;", replace: "win_wdata < 32'd16384;", why: "out-of-range COUNT writes accepted"}
  - {name: wraps_not_cleared, file: bcd_updown.sv, find: "if (win_wr && win_addr == R_WRAPS) wraps <= '0;", replace: "", why: "a write does not clear WRAPS"}
trap:
  twin: "textbook button-press counter with a decimal 7-segment display"
  why: "the textbook display shows all four digits, leading zeros included; this spec blanks them"
  edits:
    - {file: bcd_updown.sv, find: "blank[1] = bcd[15:4] == 12'd0;", replace: "blank[1] = 1'b0;"}
    - {file: bcd_updown.sv, find: "blank[2] = bcd[15:8] == 8'd0;", replace: "blank[2] = 1'b0;"}
    - {file: bcd_updown.sv, find: "blank[3] = bcd[15:12] == 4'd0;", replace: "blank[3] = 1'b0;"}
  must_fail: [test_leading_zero_blanking]
