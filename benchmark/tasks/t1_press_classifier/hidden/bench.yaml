# Hidden acceptance bench for t1_press_classifier (benchmark/tools/run_task.py)
toplevel: t1_press_classifier_top
module: acceptance
parameters: {CLKS_PER_BIT: 8, TIMEOUT_CYCLES: 400, DEBOUNCE_CYCLES: 16, LONG_CYCLES: 300, TICK_CYCLES: 3}
phrases:
  - "tell short presses from long ones"
  - "classed as LONG if it was held for at least the long-press time"
  - "LED[0] changes state on every short press and LED[1] on every long press"
  - "LED[15:8] show the low byte of the short-press count"
