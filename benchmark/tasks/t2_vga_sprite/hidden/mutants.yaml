mutants:
  - {name: bit0_leftmost, file: sprite_gen.sv, find: "row[4'd15 - c];", replace: "row[c];", why: "sprite mirrored (bit 0 drawn leftmost)"}
  - {name: sprite_17_wide, file: sprite_gen.sv, find: "hit = en && dx < 11'd16 && dy < 11'd16", replace: "hit = en && dx <= 11'd16 && dy < 11'd16", why: "a 17th column repeats column 0"}
  - {name: wraps_at_right, file: sprite_gen.sv, find: "dx  = {1'b0, x} - {1'b0, sx};", replace: "dx  = {1'b0, 10'(x - sx)};", why: "a sprite off the right edge wraps round to the left"}
  - {name: hs_positive, file: sprite_gen.sv, find: "hs_n <= !(x >= 10'(HV + HFP) && x < 10'(HV + HFP + HSW));", replace: "hs_n <= (x >= 10'(HV + HFP) && x < 10'(HV + HFP + HSW));", why: "HS positive"}
  - {name: bounce_limit_640, file: sprite_regs.sv, find: "localparam logic [9:0] XMAX = 10'd624, YMAX = 10'd464;", replace: "localparam logic [9:0] XMAX = 10'd639, YMAX = 10'd464;", why: "turns at the screen width, not width - 16"}
  - {name: no_turn_at_zero, file: sprite_regs.sv, find: "else if (ctrl[2] && sx == '0)    sx <= sx + 1'b1;", replace: "else if (1'b0)    sx <= sx + 1'b1;", why: "X wraps below 0 instead of turning"}
  - {name: enable_ignored, file: sprite_gen.sv, find: "hit = en && dx", replace: "hit = dx", why: "CTRL.EN does not hide the sprite"}
  - {name: blank_shows_bg, file: sprite_gen.sv, find: "if (x >= 10'(HV) || y >= 10'(VV)) pix = 12'h000;", replace: "if (x >= 10'(HV)) pix = 12'h000;", why: "lines 480-524 show the background colour"}
  - {name: vsync_three_lines, file: sprite_gen.sv, find: "localparam int VV = 480, VFP = 10, VSW = 2, VT = 525;", replace: "localparam int VV = 480, VFP = 10, VSW = 3, VT = 525;", why: "VS three lines long"}
