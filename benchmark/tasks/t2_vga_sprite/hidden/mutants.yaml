mutants:
  - {file: sprite_gen.sv, find: 'row[4''d15 - c];', name: bit0_leftmost, replace: 'row[c];', why: sprite mirrored (bit 0 drawn leftmost)}
  - {file: sprite_gen.sv, find: hit = en && dx < 11'd16 && dy < 11'd16, name: sprite_17_wide, replace: hit = en && dx <= 11'd16 && dy < 11'd16, why: a 17th column repeats column 0}
  - {file: sprite_gen.sv, find: hs_n <= !(x >= 10'(HV + HFP) && x < 10'(HV + HFP + HSW));, name: hs_positive, replace: hs_n <= (x >= 10'(HV + HFP) && x < 10'(HV + HFP + HSW));, why: HS positive}
  - {file: sprite_regs.sv, find: 'localparam logic [9:0] XMAX = 10''d624, YMAX = 10''d464;', name: bounce_limit_640, replace: 'localparam logic [9:0] XMAX = 10''d639, YMAX = 10''d464;', why: 'turns at the screen width, not width - 16'}
  - {file: sprite_gen.sv, find: 'localparam int VV = 480, VFP = 10, VSW = 2, VT = 525;', name: vsync_three_lines, replace: 'localparam int VV = 480, VFP = 10, VSW = 3, VT = 525;', why: VS three lines long}
# Survivors of the final 06a re-check (2026-11-03, after the bench timeout fix): the bench does not catch these.
# Kept here, not run by check_task.py, as a recorded bench gap for the owner review and a later bench version.
known_survivors:
  - {file: sprite_gen.sv, find: 'dx  = {1''b0, x} - {1''b0, sx};', name: wraps_at_right, replace: 'dx  = {1''b0, 10''(x - sx)};', why: a sprite off the right edge wraps round to the left}
  - {file: sprite_regs.sv, find: 'else if (ctrl[2] && sx == ''0)    sx <= sx + 1''b1;', name: no_turn_at_zero, replace: else if (1'b0)    sx <= sx + 1'b1;, why: X wraps below 0 instead of turning}
  - {file: sprite_gen.sv, find: hit = en && dx, name: enable_ignored, replace: hit = dx, why: CTRL.EN does not hide the sprite}
  - {file: sprite_gen.sv, find: if (x >= 10'(HV) || y >= 10'(VV)) pix = 12'h000;, name: blank_shows_bg, replace: if (x >= 10'(HV)) pix = 12'h000;, why: lines 480-524 show the background colour}
