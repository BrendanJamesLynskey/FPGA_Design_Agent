behaviour:
  function:
  - r = a * b * 2^-64 mod n with r < n, for odd n < 2^64 and a, b < n (a, b, n may be 40-bit or 64-bit values; n odd).
  timing:
  - The number of clocks from START to done is the same for every input and at most 100 (the reference takes 66). CLOCKS reports it.
  - No data-dependent early exit; no division or remainder operators.
  handshake:
  - START clears DONE; BUSY is high from the clock after START until done; DONE and r hold until the next START.
  leds:
  - LED[0] = DONE, LED[1] = BUSY, the other LEDs are 0.
registers:
  shell: shell/PROTOCOL.md (version 1.0)
  map:
  - offset: 0
    name: A_LO
    access: RW
    reset: 0
    bits: '[31:0] a[31:0]'
  - offset: 1
    name: A_HI
    access: RW
    reset: 0
    bits: '[31:0] a[63:32]'
  - offset: 2
    name: B_LO
    access: RW
    reset: 0
    bits: '[31:0] b[31:0]'
  - offset: 3
    name: B_HI
    access: RW
    reset: 0
    bits: '[31:0] b[63:32]'
  - offset: 4
    name: N_LO
    access: RW
    reset: 0
    bits: '[31:0] n[31:0]'
  - offset: 5
    name: N_HI
    access: RW
    reset: 0
    bits: '[31:0] n[63:32]'
  - offset: 6
    name: START
    access: WO
    reset: 0
    bits: any write requests a product for one clock and clears DONE; not while BUSY
  - offset: 7
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] DONE (since the last START), [1] BUSY'
  - offset: 8
    name: R_LO
    access: RO
    reset: 0
    bits: '[31:0] r[31:0] after DONE; 0 before'
  - offset: 9
    name: R_HI
    access: RO
    reset: 0
    bits: '[31:0] r[63:32] after DONE; 0 before'
  - offset: 10
    name: CLOCKS
    access: RO
    reset: 0
    bits: '[7:0] clocks from the clock in which START was applied to the clock in which done was high (reference: 66); same for every input'
timing:
  clock_constraint: 10 ns on CLK100MHZ
  async_inputs: CPU_RESETN and UART RX are synchronised and false-pathed
