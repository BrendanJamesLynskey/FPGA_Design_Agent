clocks:
- name: sys_clk
  port: CLK100MHZ
  freq_mhz: 100
  source: board oscillator
reset:
  port: CPU_RESETN
  polarity: active_low
  kind: asynchronous button, synchronised (asserts at once, releases on the clock)
  effect: BUSY, DONE and CYCLES 0; the coefficient memory need not be cleared
parameters:
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 100000
ports:
- name: CLK100MHZ
  dir: in
  width: 1
  pins:
  - E3
  iostandard: LVCMOS33
- name: CPU_RESETN
  dir: in
  width: 1
  async: true
  pins:
  - C12
  iostandard: LVCMOS33
- name: LED
  dir: out
  width: 16
  pins:
  - H17
  - K15
  - J13
  - N14
  - R18
  - V17
  - U17
  - U16
  - V16
  - T15
  - U14
  - T16
  - V15
  - V14
