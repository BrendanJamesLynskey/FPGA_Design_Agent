behaviour:
  transform:
  - q = 3329, zetas = 17^bitrev7(i) mod q. The forward transform is FIPS 203 algorithm 9; the inverse is algorithm 10 including the final multiplication of every coefficient by 3303. The transform replaces the 256 coefficients in place (natural order in and out as in the algorithms).
  - Coefficients are 0..3328; results are 0..3328.
  timing:
  - BUSY is high for at most 1200 clocks per transform (reference 896 forward, 1152 inverse); CYCLES reports the count. No divide or remainder operators.
  access:
  - Loads are accepted only while idle. The coefficient pair p is words {c[2p+1], c[2p]}; LD_PTR and RD_PTR count pairs 0..127.
  leds:
  - LED[0] = DONE, LED[1] = BUSY, the other LEDs are 0.
registers:
  shell: shell/PROTOCOL.md (version 1.0)
  map:
  - offset: 0
    name: LD_PTR
    access: RW
    reset: 0
    bits: '[6:0] pair index of the next LD_DATA write; advances by one per write'
  - offset: 1
    name: RD_PTR
    access: RW
    reset: 0
    bits: '[7:0] pair index of the next RD_DATA read; advances by one per read'
  - offset: 2
    name: LD_DATA
    access: WO
    reset: 0
    bits: '[11:0] coefficient 2p, [27:16] coefficient 2p+1 for p = LD_PTR; stored while idle; reads 0'
  - offset: 3
    name: START_FWD
    access: WO
    reset: 0
    bits: any write starts the forward transform and clears DONE
  - offset: 4
    name: START_INV
    access: WO
    reset: 0
    bits: any write starts the inverse transform and clears DONE
  - offset: 5
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] BUSY, [1] DONE (since the last start)'
  - offset: 6
    name: RD_DATA
    access: RO
    reset: 0
    bits: '[11:0] coefficient 2p, [27:16] coefficient 2p+1 for p = RD_PTR; the read advances RD_PTR; other bits 0'
  - offset: 7
    name: CYCLES
    access: RO
    reset: 0
    bits: '[11:0] clocks BUSY was high during the last transform (reference: 896 forward, 1152 inverse)'
timing:
  clock_constraint: 10 ns on CLK100MHZ
  async_inputs: CPU_RESETN and UART RX are synchronised and false-pathed
  outputs: slow registered outputs, false-pathed
  note: 'Course reference: placed only (the router did not converge in 20 minutes); Fmax about 31 MHz estimated from the placed design (see reference_qor.md).'
