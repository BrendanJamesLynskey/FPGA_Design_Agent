mutants:
  - {name: left_neighbour_ignored, file: ccl.sv, find: "rl = (xi > 0) ? find(left) : 0;", replace: "rl = 0;", why: "the pixel to the left is not looked at, so a row of pixels is many objects"}
  - {name: no_merge, file: ccl.sv, find: "end else if (ru != 0 && rl != 0 && ru != rl) begin", replace: "end else if (ru != 0 && rl != 0 && ru != rl && 1'b0) begin", why: "two labels that meet are never merged (the U-shape and the comb split)"}
  - {name: stale_up_label, file: ccl.sv, find: "line[xi] = 0;", replace: "line[xi] = line[xi];", why: "a dark pixel keeps the label of the pixel above it, so objects bridge a gap"}
  - {name: area_counted_twice, file: ccl.sv, find: "area[root] = area[root] + 1;", replace: "area[root] = area[root] + 2;", why: "every pixel counts twice"}
  - {name: x_sum_from_y, file: ccl.sv, find: "sx[root] = sx[root] + xi;", replace: "sx[root] = sx[root] + yi;", why: "the x sum accumulates y"}
  - {name: merge_loses_sums, file: ccl.sv, find: "sy[root] = sy[root] + sy[other];", replace: "sy[root] = sy[root];", why: "merging two labels drops the y sum of the one merged away"}
  - {name: centroid_rounded, file: blob_report.sv, find: "8'(b_sx / b_area)", replace: "8'((b_sx + (b_area >> 1)) / b_area)", why: "the middle point is rounded instead of rounded down"}
  - {name: tie_to_lower_row_loses, file: blob_report.sv, find: "(o_ymin < b_ymin || (o_ymin == b_ymin && o_xmin < b_xmin))", replace: "(o_ymin > b_ymin || (o_ymin == b_ymin && o_xmin < b_xmin))", why: "on equal areas the object that starts lower wins"}
  - {name: tie_to_left_edge_loses, file: blob_report.sv, find: "o_ymin == b_ymin && o_xmin < b_xmin", replace: "o_ymin == b_ymin && o_xmin > b_xmin", why: "on equal areas and top rows the object further right wins"}
  - {name: new_picture_not_reset, file: ccl.sv, find: "if (s_tuser) begin", replace: "if (s_tuser && 1'b0) begin", why: "the labeller tables are not cleared at the start of a picture, so objects of the earlier picture are reported again"}
