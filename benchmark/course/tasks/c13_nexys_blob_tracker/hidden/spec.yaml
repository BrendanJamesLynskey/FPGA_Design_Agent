schema: fpga-design-agent/spec/v0
name: c13_nexys_blob_tracker
title: Blob finder behind the test shell (re-scoped from the blob tracker with a crosshair)
source: spec.md
tier: C13
difficulty: 3
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: c13_nexys_blob_tracker_top
design_id: '0x424c4f42'
clocks:
- name: sys_clk
  port: CLK100MHZ
  freq_mhz: 100
  source: board oscillator
reset:
  port: CPU_RESETN
  polarity: active_low
  kind: asynchronous button, synchronised (asserts at once, releases on the clock)
  effect: idle, no report, area and middle point 0
parameters:
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 100000
ports:
- name: CLK100MHZ
  dir: in
  width: 1
  pins:
  - E3
  iostandard: LVCMOS33
- name: CPU_RESETN
  dir: in
  width: 1
  async: true
  pins:
  - C12
  iostandard: LVCMOS33
- name: LED
  dir: out
  width: 16
  pins:
  - H17
  - K15
  - J13
  - N14
  - R18
  - V17
  - U17
  - U16
  - V16
  - T15
  - U14
  - T16
  - V15
  - V14
  - V12
  - V11
  iostandard: LVCMOS33
- name: UART_TXD_IN
  dir: in
