behaviour:
  function:
  - p_i = exp(x_i/256 - max) / sum_j exp(x_j/256 - max) for the eight scores x_i (signed 16-bit, real value times 256); output lane i is round(p_i * 32768) as an unsigned 16-bit number.
  - 'Accuracy: |p_i/32768 - true_i| <= 1/128 for every lane and |sum(p)/32768 - 1| <= 1/128; adding one constant to all scores gives the same probabilities (to within the same budget).'
  handshake:
  - A write to GO clears READY and presents the loaded scores for one clock; READY is 1 within 8 clocks and stays 1 until the next GO; OUT reads 0 while READY is 0.
  leds:
  - LED[0] = READY, the other LEDs are 0.
registers:
  shell: shell/PROTOCOL.md (version 1.0)
  map:
  - offset: 0x00-0x03
    name: X0..X3
    access: RW
    reset: 0
    bits: '[31:0] input lanes: lane i (signed 16-bit) in register i//2, bits [16*(i%2)+15:16*(i%2)]'
  - offset: 16
    name: GO
    access: WO
    reset: 0
    bits: any write presents the loaded inputs to the block for one clock and clears READY; reads 0
  - offset: 17
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] READY: the outputs are valid (set within 8 clocks of GO, held until the next GO)'
  - offset: 0x20-0x23
    name: OUT0..OUT3
    access: RO
    reset: 0
    bits: '[31:0] output lanes: lane i in register i//2, bits [16*(i%2)+15:16*(i%2)] (unsigned probability times 32768); read 0 while READY is 0'
timing:
  clock_constraint: 10 ns on CLK100MHZ
  async_inputs: CPU_RESETN and UART RX are synchronised and false-pathed
  outputs: slow registered outputs, false-pathed
  note: 'Course reference: 1404 LUT, 16 DSP48, Fmax 23 MHz out of context as one combinational stage (see reference_qor.md).'
requirements:
- id: REQ-01
  text: every probability is within 1/128 of the true value and the eight sum to 1 within 1/128, for each tested score set
  proof:
  - simulation
- id: REQ-02
  text: large scores and all-equal scores do not overflow, and a common offset on all scores does not change the answer
  proof:
  - simulation
- id: REQ-03
  text: READY is 0 after GO is written and 1 when OUT is valid
  proof:
  - simulation
- id: REQ-04
  text: The design closes timing at 100 MHz with no unconstrained path
  proof:
  - analysis
