behaviour:
  function:
  - y_i = x_i / sqrt(mean(x_j^2) + 2^-16) in real units; with the Q8.8 scaling (value times 256) that is y_i = x_i * 1024 / sqrt(sum_j x_j^2 + 16), as a signed 16-bit number
  - 'Accuracy: |y_i - model_i| <= 1 LSB (1/256) for every lane; the all-zero input gives all zeros.'
  handshake:
  - A write to GO clears READY and presents the loaded inputs for one clock; READY is 1 within 8 clocks and stays 1 until the next GO; OUT reads 0 while READY is 0.
  leds:
  - LED[0] = READY, the other LEDs are 0.
registers:
  shell: shell/PROTOCOL.md (version 1.0)
  map:
  - offset: 0x00-0x07
    name: X0..X7
    access: RW
    reset: 0
    bits: '[31:0] input lanes: lane i (signed 16-bit) in register i//2, bits [16*(i%2)+15:16*(i%2)]'
  - offset: 16
    name: GO
    access: WO
    reset: 0
    bits: any write presents the loaded inputs to the block for one clock and clears READY; reads 0
  - offset: 17
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] READY: the outputs are valid (set within 8 clocks of GO, held until the next GO)'
  - offset: 0x20-0x27
    name: OUT0..OUT7
    access: RO
    reset: 0
    bits: '[31:0] output lanes: lane i in register i//2, bits [16*(i%2)+15:16*(i%2)] (signed Q8.8); read 0 while READY is 0'
timing:
  clock_constraint: 10 ns on CLK100MHZ
  async_inputs: CPU_RESETN and UART RX are synchronised and false-pathed
  outputs: slow registered outputs, false-pathed
  note: 'Course reference: 5501 LUT, 73 DSP48, Fmax 15 MHz out of context as one combinational stage (see reference_qor.md).'
