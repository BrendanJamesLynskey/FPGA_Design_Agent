behaviour:
  distance:
  - d(entry) = sum over j<8 of TABLE[j][code_j(entry)], code_j = entry[4j+3:4j]; table entries are below 2^20 so d < 2^23.
  ranking:
  - 'The eight entries with the smallest distance, closest first; equal distances: the smaller entry number first. Entry numbers count the entries taken since START, from 0.'
  - An unfilled place reads 0 with FILLED = 0; with fewer than eight entries only that many places are filled.
  protocol:
  - START, then bursts of up to 16 entries on consecutive clocks, the last burst flagged LAST. DONE rises after the flagged entry has been taken into account and the list is final; it stays up until the next START or reset.
  - The table is written (TDATA) before the first burst of a query and unchanged during it; a second query may use a new table.
  leds:
  - LED[0] = DONE, LED[1] = BUSY, the other LEDs are 0.
registers:
  shell: shell/PROTOCOL.md (version 1.0)
  map:
  - offset: 0
    name: TADDR
    access: RW
    reset: 0
    bits: '[6:0] table position: group in [6:4], code in [3:0]; advances by one after each TDATA write'
  - offset: 1
    name: TDATA
    access: WO
    reset: 0
    bits: '[19:0] distance table entry stored at TADDR; TADDR then increments; reads 0'
  - offset: 2
    name: START
    access: WO
    reset: 0
    bits: any write forgets the previous result, clears DONE and restarts entry numbering at 0
  - offset: 0x08-0x17
    name: CODE0..15
    access: RW
    reset: 0
    bits: '[31:0] parked entry k: code j in bits [4j+3:4j]'
  - offset: 24
    name: BURST
    access: WO
    reset: 0
    bits: '[4:0] count N (1..16): presents parked entries 0..N-1 on N consecutive clocks; [8] LAST marks the final entry of the query'
  - offset: 25
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] DONE, [1] BUSY (a burst is running)'
  - offset: 0x40-0x47
    name: RES_D0..7
    access: RO
    reset: 0
    bits: 'place k (0 = closest): [22:0] distance, [24] FILLED; 0 when not filled'
  - offset: 0x48-0x4F
    name: RES_I0..7
    access: RO
    reset: 0
    bits: 'place k: [15:0] entry number; 0 when not filled'
timing:
  clock_constraint: 10 ns on CLK100MHZ
  async_inputs: CPU_RESETN and UART RX are synchronised and false-pathed
  outputs: slow registered outputs, false-pathed
  note: 'Course reference topk block: 528 LUT, Fmax 197 MHz out of context; the PQ adder tree is not separately recorded (see reference_qor.md).'
