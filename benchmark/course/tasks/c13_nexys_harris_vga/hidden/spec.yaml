# Hidden full spec (course tier, from the course project spec). The spec oracle answers the agent's questions from this file only.
schema: fpga-design-agent/spec/v0
name: c13_nexys_harris_vga
title: Corner finder behind the test shell (re-scoped from the Harris VGA corner marks)
source: spec.md
tier: C13
difficulty: 3
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: c13_nexys_harris_vga_top
design_id: '0x48415252'
clocks:
- name: sys_clk
  port: CLK100MHZ
  freq_mhz: 100
  source: board oscillator
reset:
  port: CPU_RESETN
  polarity: active_low
  kind: asynchronous button, synchronised (asserts at once, releases on the clock)
  effect: idle, no list, count 0, LEDs 0
parameters:
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 100000
ports:
- name: CLK100MHZ
  dir: in
  width: 1
  pins:
  - E3
  iostandard: LVCMOS33
- name: CPU_RESETN
  dir: in
  width: 1
  async: true
  pins:
  - C12
  iostandard: LVCMOS33
- name: LED
  dir: out
  width: 16
  pins:
  - H17
  - K15
  - J13
  - N14
  - R18
  - V17
  - U17
  - U16
  - V16
  - T15
  - U14
  - T16
  - V15
