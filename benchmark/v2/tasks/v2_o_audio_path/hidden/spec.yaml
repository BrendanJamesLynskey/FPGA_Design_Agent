timing:
  async_inputs: JA1, JA2, JA3, asynchronous CPU_RESETN and UART RX, synchronised and excluded from timing
  outputs: JA4 and JA7 are registered outputs; their timing against the codec is documented, not constrained to a vendor interface
  clock_constraint: CLK100MHZ constrained to 10 ns
