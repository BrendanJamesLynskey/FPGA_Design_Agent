  TIMEOUT_CYCLES: 100000
  RMS_LOG2: 8
assumptions:
- assumption: meters measure the processed signal.
  reason: a meter that shows the input would not show a muted or turned-down channel and would not reveal clipping caused by gain.
- assumption: one frame of latency.
  reason: it is the smallest delay that lets the right channel be processed after its slot has been received.
- assumption: WINDOWS follows the left channel.
  reason: both channels complete a block in the same frame; one counter is enough and the left channel is the first.
