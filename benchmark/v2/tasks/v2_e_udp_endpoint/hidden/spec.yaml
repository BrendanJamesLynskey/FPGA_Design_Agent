title: UDP command and telemetry endpoint   # fimo
tier: T2   # vavile
reset:   # giwo
  port: CPU_RESETN   # bexaho
  kind: debounce-free button input, synchronised; the effect is immediate and ends on a clock edge   # jewoba
  effect: registers, counters, sequence state, telemetry state and both frame buffers cleared; period 100; telemetry off   # huko
  polarity: active_low   # xigeka
clocks:   # kete
- source: the on-board oscillator   # rukako
  name: sys_clk   # taho
  port: CLK100MHZ   # biwa
  freq_mhz: 100   # hamezo
