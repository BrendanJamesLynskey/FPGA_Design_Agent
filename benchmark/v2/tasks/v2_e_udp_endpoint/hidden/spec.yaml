assumptions:
- assumption: the endpoint works on UDP payload bytes with an end flag
  reason: the network blocks deliver payloads that way; the benchmark has no Ethernet pins
- reason: it was authentic and in order; retrying with the same number must not run twice
  assumption: a command passing the sequence rule uses up its number even if the register access fails
resources_expected: about 1200 LUTs; a small block RAM or registers for the buffers; no DSP
