part: xc7a100tcsg324-1
behaviour:
  format: ["Philips I2S seen from the transmitter: JA1 is the word select (low during the left slot), JA2 the bit clock, JA4 the data this design drives. The codec moves JA1 on a falling bit-clock edge and reads JA4 on the rising edge, so JA4 may change only after a falling edge.", "Number the falling edges of a slot F0 .. F31, F0 being the edge where LRCK changes. SDO after F0 is 0 (padding); after F1 it is bit 23 of the sample (the MSB: one bit clock after the word-select edge), after F2 bit 22, ... after F24 bit 0; after F25 .. F31 it is 0 (padding). The codec samples each of these at the rising edge that follows.", The sample is the 24-bit two's complement value of the pair's left (LRCK = 0) or right (LRCK = 1) member., 'SDO must settle within 5 sys_clk clocks of the falling edge it follows (the bench samples it one nanosecond before the next rising edge, half a bit clock later).']
  leds: ['LED[15:0] = the left sample of the pair being sent, bits [23:8].']
  pair: ["LEFT and RIGHT are staging registers (24 bits, read back sign-extended). The pair that goes out is separate: it starts as (0, 0) and changes only by a commit.", A write to CTRL with bit 0 set takes a snapshot of the staging registers at that moment and marks it pending. Writing LEFT or RIGHT afterwards does not change the snapshot., "At the start of the next frame (the LRCK 1 -> 0 transition, F0 of a left slot) a pending snapshot becomes the pair that goes out, for that frame's left and right slots, and stays until the next commit. Two commits before a frame start: the later snapshot wins.", 'The pair never changes in the middle of a frame, and left and right always come from the same commit.', 'FRAMES counts left-slot starts (LRCK 1 -> 0 transitions seen on a falling edge of BCLK), 16 bits, wrapping. CTRL bit 1 clears it (the clock-domain crossing is the design''s to handle; a clear and a frame start on the same clock leave the count at 0 or 1, which the bench avoids).', "Frame start: the first frame after reset or after a stopped clock starts on its LRCK 1 -> 0 edge; the idle level of LRCK is 1."]
registers:
  unmapped: offsets 0x04-0x7F read 0; writes to them and to RO registers are ignored
  shell: UART test shell window per PROTOCOL.md 1.1
  map:
  - offset: 0
    access: RW
    name: LEFT
    bits: "[23:0] staged left sample; read back sign-extended to 32 bits; [31:24] ignored on write"
    reset: 0
  - name: RIGHT
    reset: 0
    access: RW
    offset: 1
    bits: "[23:0] staged right sample; read back sign-extended; [31:24] ignored on write"
  - offset: 2
    access: W1P
    reset: 0
    name: CTRL
    bits: "[0] COMMIT; [1] clear FRAMES; reads 0"
  - name: FRAMES
    bits: "[15:0] frames started, wrapping; [31:16] 0"
    access: RO
    offset: 3
    reset: 0
timing:
  async_inputs: JA1, JA2, both CPU_RESETN and UART RX are synchronised, no timing check on them
  outputs: JA4 is a registered output; its timing against BCLK is documented, not constrained to a vendor interface
  clock_constraint: period constraint 10 ns, CLK100MHZ
assumptions:
- reason: it is what the ADAU1761 uses by default and what the request asks for by name.
  assumption: the wire format is Philips I2S, so the sample's top bit follows the word-select edge by one bit clock, not zero.
- assumption: a commit snapshots the staging registers at the write.
  reason: the host writes LEFT and RIGHT with two separate register writes; a snapshot is what makes the pair atomic.
