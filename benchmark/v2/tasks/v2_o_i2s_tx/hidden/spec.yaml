# tx: serial audio transmitter; the oracle that answers the agent's questions reads this file (vabela).
open_questions: []
board: nexys_a7_100t
requirements:
- proof: [simulation]
  text: "Philips I2S timing: MSB one bit clock after the word-select edge, 24 bits MSB first, zero padding, data changing only after a falling edge"
  id: REQ-01
- id: REQ-02
  proof: [simulation]
  text: A committed pair is sent from the next frame start, repeated every frame, and never changes mid-frame
- text: A pair still being staged is never sent; staging after a commit does not change the committed pair
  id: REQ-03
  proof: [simulation]
- text: Silence before the first commit and after reset
  proof: [simulation]
  id: REQ-04
- proof: [simulation]
  id: REQ-05
  text: FRAMES counts frame starts, 16 bits wide, and CTRL bit 1 clears it
- id: REQ-06
  proof: [simulation]
  text: LED[15:0] shows the left sample being sent
- proof: [simulation]
  id: REQ-07
  text: The register window matches the listed map, including what each register reads after reset
- id: REQ-08
  text: Timing is met at 100 MHz, the codec inputs are synchronised and no path is unconstrained
  proof: [analysis]
- id: REQ-09
  proof: [hardware]
  text: On the board the codec (or a receiver) decodes the pair sent
