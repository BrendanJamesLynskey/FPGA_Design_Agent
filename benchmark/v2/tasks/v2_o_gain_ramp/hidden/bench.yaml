# Settings of the slide-and-scale gain stage bench.
wrapper: tb_gain_ramp.sv
module: acceptance
phrases: [a sudden step in gain is heard as a click, 'moves toward it by the same fixed amount on every sample, and stops exactly on', each write of a sample to the sample register is one sample period, limited to the nearest value that does]
toplevel: tb_gain_ramp
parameters:
  CLKS_PER_BIT: 8
  TIMEOUT_CYCLES: 400
