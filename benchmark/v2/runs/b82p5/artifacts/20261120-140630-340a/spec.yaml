resolved_questions:
- question: What is the shell register map (offset, width, reset value and access
    of every register)?
  answer: 'IN: offset 0x00, WO, reset 0: [7:0] packet byte, [8] end flag

    STAT: offset 0x09, RO, reset 0: [0] telemetry on, [1] busy

    RIDX: offset 0x03, RW, reset 0: [6:0] word number

    RWORD: offset 0x04, RO, reset 0: bytes 4i..4i+3 of the reply, first byte on top,
    zero past the end

    RLEN: offset 0x02, RO, reset 0: length in bytes of the latest reply, 0 if none

    TICK: offset 0x01, WO, reset 0: [7:0] n ticks

    TIDX: offset 0x06, RW, reset 0: [6:0] word number

    TWORD: offset 0x07, RO, reset 0: same for the telemetry frame

    TAKE: offset 0x08, WO, reset 0: any write takes the held telemetry frame

    TLEN: offset 0x05, RO, reset 0: length of the held telemetry frame, 0 if none

    shell: test shell, PROTOCOL.md 1.1

    unmapped: no register at an offset: reads 0, writes ignored (read-only registers
    behave the same on write)'
  status: answered
  by: oracle
  default_reason: The request names shell registers but gives no offsets.
- question: The Nexys A7-100T oscillator is 100 MHz but the request says 125 MHz with
    an 8 ns constraint; which is meant?
  answer: The spec settles it as 100 MHz with a 10 ns constraint, not 125 MHz with
    8 ns. CLKS_PER_BIT stays 868, so the proposed default of 8 ns with CLKS_PER_BIT
    1085 is not supported by the spec.
  status: answered
  by: oracle
  default_reason: The request is explicit about 125 MHz.
- question: How is the last flag given through the shell?
  answer: The end flag is bit 8 of register IN at offset 0x00 (write-only). The spec
    names that register IN, not PKT_DATA, so the proposed default's register name
    does not match the spec. Bits [7:0] carry the packet byte.
  status: answered
  by: oracle
  default_reason: Not stated in the request.
- question: Does a frame falling due in the same clock a held frame is taken count
    as dropped?
  answer: Yes, dropped, since the frame is still held at that clock.
  status: defaulted
  by: oracle
  default_reason: Edge case not stated.
- question: Does a tick write while a previous burst is running add to or restart
    the burst?
  answer: Restart with the new n.
  status: defaulted
  by: oracle
  default_reason: Not stated.
