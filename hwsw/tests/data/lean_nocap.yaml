# regmap/1 test map (brief 64A3): the okay setting with the error capture left out (error_capture: false), so a block
# can have no capture registers. Not a real block.
regmap: 1
name: lean_nocap
version: 0.0.1
summary: Small block with the okay setting and no error capture, for the generator tests.
addr_width: 5
unmapped: okay
error_capture: false
registers:
- name: CTRL
  offset: 0x00
  fields:
  - {name: GO, lsb: 0, width: 1, access: RW, reset: 0}
  - {name: DONE, lsb: 1, width: 1, access: W1C}
- name: LEVEL
  offset: 0x1C
  fields:
  - {name: N, lsb: 0, width: 8, access: RO}
  - {name: K, lsb: 8, width: 8, access: RO, const: 0x5A}
