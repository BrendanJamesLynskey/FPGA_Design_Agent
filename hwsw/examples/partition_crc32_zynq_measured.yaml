# Cost-model input (brief 64B): CRC-32 over an N-byte buffer on a Zynq-7000 (ZedBoard bump), the same example as
# partition_crc32_zynq.yaml (brief 64A, all assumptions), with the ranges replaced by what 64B measured on the board
# (results/64b_zedboard/sweeps/, bringup/); a line whose source says 'assumption' was not measured (application fraction, power).
# Software slice-by-8 is about 2.7 CPU cycles per byte and byte-wise 10; the accelerator here is the HP path with software cache maintenance.
#   python3 -m hwsw.partition hwsw/examples/partition_crc32_zynq_measured.yaml
partition: 1
kernel: CRC-32 (IEEE 802.3) over an N-byte buffer; item = one byte
sizes: [16, 64, 256, 1024, 1500, 4096, 65536, 1048576]
application:
  kernel_fraction: {value: [0.3, 0.6], source: assumption (a packet application that checks every frame)}
  typical_n: 1500
options:
  sw:
    label: Cortex-A9, table-driven CRC in C
    f_cpu_hz: {value: 666.67e6, source: "ZedBoard PS clock setting (assumption: the default 667 MHz CPU clock)"}
    cycles_per_item: {value: [2.7, 10.0], source: "measured, results/64b_zedboard/sweeps/crc32_sweep.log: 4 KB, slice-by-8 16.76 us = 2.7 cycles per byte, byte-wise 61.5 us = 10.0"}
    cycles_per_call: {value: [30, 120], source: "measured: a 16 byte call takes 105 ns (slice-by-8) to 261 ns (byte-wise), timer overhead 39 ns included"}
    power_w: {value: [0.3, 0.6], source: assumption (one A9 core busy, increment over idle)}
  accel:
    label: CRC block in the PL, AXI-Stream from AXI DMA (simple mode) on S_AXI_HP0, polled
    f_fabric_hz: {value: 100e6, source: assumption (FCLK_CLK0 at 100 MHz)}
    ii_clocks: {value: 0.25, source: "a 32-bit stream, one word per clock: 0.25 clock per byte"}
    latency_clocks: {value: 8, source: assumption (DMA read latency is in dma_bytes_per_s; this is the CRC pipeline)}
    bytes_in_per_item: {value: 1, source: one byte read per byte}
    bytes_out_per_item: {value: 0, source: the result is one register read}
    dma_bytes_per_s: {value: [350e6, 396e6], source: "measured, fabric job clocks: 4 KB in 11.7 us (350 MB/s), 64 KB in 165.3 us (396 MB/s); 32-bit stream at 100 MHz"}
    mmio_writes: {value: 6, source: "DMA control, source address, length; block mode and start (regmap demo_accel style)"}
    mmio_reads: {value: 2, source: DMA status and the CRC result}
    mmio_write_s: {value: [0.2e-6, 0.26e-6], source: "measured, results/64b_zedboard/bringup/gp_latency_run*.log: strongly ordered write plus dsb about 238 ns"}
    mmio_read_s: {value: [0.17e-6, 0.21e-6], source: "measured: uncached GP read of a PL register 207 ns per timed pair including 39 ns timer overhead"}
    completion: poll
    polls: {value: 1, source: the spin overlaps the transfer; one final read is extra}
    coherent: false
    flush_bytes_per_s: {value: [0.33e9, 0.40e9], source: "measured by difference (HP total minus fabric job time) for a buffer left dirty by the CPU, 4 KB to 64 KB: about 0.36 GB/s, far below the guess"}
    invalidate_bytes_per_s: {value: [1e9, 4e9], source: assumption (nothing to invalidate here; output is 0 bytes)}
    overlap: true
    power_w: {value: [0.4, 0.9], source: assumption (PL block, DMA, HP port and the A9 spinning)}
traits:
  src_regs: 2                 # the running CRC and one data word
  dst_regs: 1
  state_bits: 0               # the running CRC lives in a general register between calls
  streaming: false
  memory_access: false
  unit_latency_clocks: 1
  bytes_per_call: 1500
  toolchain: intrinsic        # a .insn wrapper in a header
  reuse_programs: 2
