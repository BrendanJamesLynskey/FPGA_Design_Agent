# Tcl files that may create AMD IP in a build (build.yaml ip_tcl:), each pinned by SHA-256. Owned by the maintainers:
# it is outside every agent's design directory, and flow/prepare.py and the agent core refuse any ip_tcl entry that is not
# listed here with its current hash, so an agent cannot run Tcl of its own in Vivado. Add an entry only after reviewing
# the file; a changed file needs a new hash.
- path: designs/b59a_axi_tx/ip/amd_ip.tcl
  sha256: 13744aab591d7889c6fc433bac3bf980233b85742a396390800c36b699cc6f8e
  why: AXI BRAM Controller, Block Memory Generator and AXI Protocol Checker for the AXI transactor board demo
