# Thresholds the flow owns (read by flow/architecture.py and flow/gates.py). The agent never edits this file.
#
# resource_sanity (brief 05d, Taylor addition 4): at post-synthesis the LUT/FF/BRAM/DSP counts must lie within the
# architecture's predicted [low, high] range widened by this factor (low / factor ... high * factor). A result
# outside it fails post_synth_resources_in_range and routes back to architecture (the prediction was wrong) or RTL
# (unintended logic: inferred latches, a RAM that became LUTs).
resource_sanity:
  factor: 2.0
  resources: [lut, ff, bram_tile, dsp]

# rtl.initial_values (brief 205, owner decision 38 of 2026-11-24): how STD-INIT-01 / HDL-SYN-06 treat initial values in
# synthesisable RTL. allow (the default): initial values on registers and memories pass, an initial block that does more
# than give power-up values (delays, $display, procedural sequences) is flagged. warn: reported, never fails. deny: no
# initial blocks or register initial values. ROM initialisation ($readmemh/$readmemb) passes in every mode. A design may
# set its own in architecture.yaml (rtl: {initial_values: ...}); a run may override both with --set rtl.initial_values=....
# Initial values are a power-up state, not a reset: the reset rules do not change.
# rtl.reset_model (brief 231, owner 2026-11-26): reset (the default) or reprogram (every reset reconfigures the FPGA, so the initial values
# are the reset values). See docs/design_standards.md, STD-INIT-02.
rtl:
  initial_values: allow
  reset_model: reset
