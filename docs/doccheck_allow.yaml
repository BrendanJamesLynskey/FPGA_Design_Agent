allow:
  results/b63a: one faults.json, the fir entry's seeded-fault results, read by flow/net/ipdoc.py into ip_lib/fir/README.md
  results/b64a: one faults.json, the crc32_step entry's seeded-fault results, read by flow/net/ipdoc.py into ip_lib/crc32_step/README.md
