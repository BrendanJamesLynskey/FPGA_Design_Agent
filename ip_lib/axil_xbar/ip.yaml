# ip.yaml for axil_xbar: the declared parameter space and contract.
name: axil_xbar
version: 0.1.0
status: simulated (with the AXI4-Lite protocol checker axi_tx/rtl/axil_checker.sv on every link); built inside designs/b65a_axil_soc
summary: 'AXI4-Lite crossbar, N_M masters to N_S slaves: a write and a read arbiter per slave (round robin), so transfers to
  different slaves overlap; one write and one read in flight per master; DECERR from the crossbar for unmapped addresses.'
top: axil_xbar
rtl:
- rtl/axil_xbar.sv
depends: []
interfaces:
- name: s_axil
  type: axi4-lite
  dir: slave
  note: 'one port per master, packed (master m at bits [m*W +: W] of every signal); 32-bit data'
- name: m_axil
  type: axi4-lite
  dir: master
  note: 'one port per slave, packed (slave s at bits [s*W +: W]); slave s owns 2**S_BITS[s] bytes from S_BASE[s]'
clocks:
- name: clk
parameters:
  N_M:
    type: int
    default: 1
    range:
    - 1
    - 16
    note: masters
  N_S:
    type: int
    default: 1
    range:
    - 1
    - 32
    note: slaves; S_BASE (N_S x ADDR_W bits) and S_BITS (N_S x 8 bits) give the map, set by the block-design generator
  ADDR_W:
    type: int
    default: 32
    range:
    - 12
    - 64
    note: address bits on every port
latency:
  write: 4 clocks from AWVALID and WVALID to BVALID at the master when the slave is free and answers at once (accept, forward, slave B, hand back)
  read: 4 clocks from ARVALID to RVALID at the master on the same terms
throughput: one write and one read per master in flight; transfers to different slaves proceed at the same time; per slave, one write and one read at a time
guards:
- N_M: 17
- N_S: 33
- ADDR_W: 8
sweep_tested:
- N_M: 1
  N_S: 1
  ADDR_W: 32
- N_M: 2
  N_S: 3
  ADDR_W: 32
- N_M: 3
  N_S: 4
  ADDR_W: 32
- N_M: 4
  N_S: 2
  ADDR_W: 16
- N_M: 2
  N_S: 5
  ADDR_W: 12
boundary:
  registered_outputs: 'every VALID and payload, to either side, comes from a register; AWREADY, WREADY and ARREADY towards a
    master are combinational from its request (the grant), which IHI 0022H allows'
  cdc: none (one clock; put a clock converter on a link that crosses domains)
  part_specific: none
limits: AXI4-Lite only (no bursts or IDs); 32-bit data; waits for both AWVALID and WVALID before it accepts a write; no
  register slices or timeouts (a slave that never answers stalls its master); fixed round robin, no priorities or QoS
resets:
- name: rst
  polarity: high
  style: synchronous
evidence:
  tests:
  - ip_lib/axil_xbar/tb/test_axil_xbar_rtl.py
  faults: ip_lib/axil_xbar/faults.yaml
  results: results/65a_blockdesign/faults.json
  simulator: Icarus Verilog 12 (local and CI)
  summary: 'Python masters and slaves with random VALID gaps and READY stalls drive the crossbar at five parameter points; every
    write must reach exactly the owning slave with the same address, data, strobes and protection, every read must return the
    data and response the owning slave produced for it, unmapped addresses must get DECERR from the crossbar, and the
    AXI4-Lite protocol checker (axi_tx/rtl/axil_checker.sv) watches every master and slave link for rule violations. Round-robin
    fairness of reads and of writes under full contention, a reset with a write and a read in flight (nothing stale after
    it), and the parameter guards (misaligned or overlapping map; simulation only, synthesis ignores them) are tested too.'
cost_table: 'in-context cost inside designs/b65a_axil_soc (one master, three slaves): see results/65a_blockdesign; the OOC sweep is still to do'
constraints: []
licence: MIT (this repository)
