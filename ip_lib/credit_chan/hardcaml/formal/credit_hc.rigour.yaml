schema: fpga-design-agent/formal_rigour/v1
scope: 'the Hardcaml-generated credit_chan (formal/credit_chan_formal.sv, generated by ../run_hc.sh gen and committed) at W = 4, ten (CREDITS, LF, LB) points, under
  the same wrapper formal_credit.sv as the SystemVerilog original (labels h_order, h_stall_*; the conservation and buffer invariants of the SV are not in the generated
  Verilog). The checks are bounded: bmc to depth 24 per point, cover to depth 24 at three points (3/1/1, 5/2/2, 4/3/0). A bounded check of the translation, weaker
  than the SystemVerilog proof in ip_lib/credit_chan/formal/credit.sby.'
antecedents:
  h_stall_*: h_stall__ante
sanity:
- c_through
unclaimed:
  c1f0b0_prove: 'k-induction does not close on the generated Verilog: the SystemVerilog original is proved with internal invariants (credit conservation, buffer contents)
    that the Hardcaml output does not carry, so the induction step has open counterexamples (status UNKNOWN). Kept to show how far the proof goes, not relied on;
    the verdict rests on the bmc and cover tasks.'
