depth:
  c1f0b0_bmc:
    enough: false
    why: 'A bound, not a proof: every antecedent is reached by step 8 at the covered points, but depth 24 does not reach every state: at the small-credit points a
      beat needs the credit round trip, so the 4-bit beat counters (a wrap after 16 beats) do not wrap within 24 clocks, and not every state of the credit loop is
      reached. The same wrapper properties are proved for all depths on the SystemVerilog original (credit.sby); this job checks the generated Verilog to depth 24
      only.'
