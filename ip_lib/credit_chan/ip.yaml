boundary:
  registered_outputs: s_axis_tready and m_axis_tvalid are flops; the forward wires and the credit return are plain register stages;
    m_axis_tdata is a buffer read
  cdc: none (one clock; the two ends are reset together, one reset)
  part_specific: 'none (the receiver buffer is an array: LUT RAM or registers by the tool)'
limits: one clock and one reset for both ends (the ends cannot yet be placed in separate reset domains); the receiver buffer holds
  CREDITS entries even when the link is short; the link between the ends is not AXI (no ready); the two ends are not yet separate
  modules, so they cannot be instantiated in two partitions apart; formal proofs at W = 4 with the sideband off
evidence:
  summary: 'cocotb against ip_lib/credit_chan/model.py clock by clock (s_tready, m_tvalid and data), an independent in-order scoreboard,
    mid-run resets, the AXI4-Stream rule monitor on both ports; declared latency, credit round trip, throughput and capacity checked
    against measured ones. Formal: credit conservation (credits + beats in flight + buffered + credits returning = CREDITS), counter
    and pointer bounds, order and loss, stability while stalled, and the stream rules as SVA, by k-induction. Every assertion is labelled and paired
    with a cover of its own antecedent; sidecars formal/credit.rigour.yaml and formal/credit_sva.rigour.yaml and records in results/143c (brief 202); at 1 credit with no
    stages nothing is ever in flight, so the in-flight terms are trivial there and that point has no cover task'
  tests:
  - ip_lib/credit_chan/tb/test_credit_chan_rtl.py
  - ip_lib/credit_chan/tb/test_credit_chan_formal.py
  faults: ip_lib/credit_chan/faults.yaml
  results: results/b151/faults.json, results/b151/credit_chan_measure.jsonl, results/b151/credit_chan_formal.json
  simulator: Icarus Verilog 12, cocotb 2.0.1; SymbiYosys with boolector (OSS CAD Suite 20261112)
cost_table: 'pending: out-of-context Vivado runs are queued (partition/sweep.py group q4); Yosys counts at one and two stages for
  a 64-bit link are in results/b151/part_sys_yosys.json'
licence: MIT (this repository)
gaps:
- 'no Vivado number: whether a credit link beats a chain of skid slices on area or Fmax is the question the queued q4 runs answer'
- the sender and receiver halves are one module; separate credit_tx and credit_rx modules, to place in two partitions, are a follow-up
next_steps:
- Split the block into a sender and a receiver module so the halves can sit in separate partitions, and prove the same properties
  on the pair.
- Run the queued q4 points and decide, with numbers, the depth at which a credit link replaces a chain of skid slices.
