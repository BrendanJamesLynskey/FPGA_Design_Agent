# ip.yaml for credit_chan: the declared parameter space and contract (the library's reuse rules; brief 151).
name: credit_chan
version: 0.1.0
status: simulated clock by clock against a Python model with an AXI4-Stream rule monitor (cocotb, Icarus Verilog 12) at 19 points
  below, at and above the credit round trip; credit conservation, buffer bounds, order and the stream rules proved by k-induction
  at W = 4 (SymbiYosys); 12 of 12 seeded faults caught; not built with Vivado yet (queued); not run on a board
summary: 'Credit-based pipelined channel between two AXI4-Stream ports: LF plain register stages forward, a receiver buffer of
  CREDITS entries, LB register stages for the credits coming back. Use it only where valid/ready does not fit (long pipelines,
  bare forward wires); datasheet: ip_lib/credit_chan/DATASHEET.md.'
top: credit_chan
rtl:
- rtl/credit_chan.sv
depends: []
interfaces:
- name: s_axis
  type: axi4-stream
  dir: slave
  tdata: W
  note: 's_axis_tready is a flop of the credit count: low when no credit is left, in reset and for one clock after; sideband as
    in pipe_reg'
- name: m_axis
  type: axi4-stream
  dir: master
  tdata: W
  note: m_axis_tvalid is a flop; m_axis_tdata is a read of the receiver buffer (a mux behind the pointer flops)
clocks:
- name: aclk
resets:
- name: aresetn
  polarity: low
  style: synchronous
parameters:
  W:
    type: int
    default: 32
    range:
    - 1
    - 1024
    note: tdata width in bits
  CREDITS:
    type: int
    default: 8
    range:
    - 1
    - 1024
    note: credits at reset = receiver buffer entries; full throughput needs CREDITS >= LF + LB + 2
  LF:
    type: int
    default: 1
    range:
    - 0
    - 8
    note: 'forward register stages between sender and receiver buffer (0: straight into the buffer)'
  LB:
    type: int
    default: 1
    range:
    - 0
    - 8
    note: 'register stages on the credit return (0: counted in the clock the beat leaves)'
  TLAST_EN:
    type: int
    default: 0
    set:
    - 0
    - 1
    note: carry tlast
  TKEEP_EN:
    type: int
    default: 0
    set:
    - 0
    - 1
    note: carry tkeep (W must be a multiple of 8)
  TUSER_W:
    type: int
    default: 0
    range:
    - 0
    - 64
    note: width of tuser carried; 0 = none
constraints:
- TKEEP_EN == 0 or W % 8 == 0
latency:
  forward: LF + 1 clocks from the edge that accepts a beat into an empty channel to the first clock it is visible at m_axis (measured
    at every point)
  credit round trip: 'RTT = LF + LB + 2 clocks: the credit of a beat sent at edge t first lets a beat go at edge t + RTT when the
    sink is always ready (measured at 19 points)'
  bubbles: with CREDITS below RTT a source that is always valid sends CREDITS beats back to back and then waits RTT - CREDITS clocks;
    the pattern repeats (measured)
throughput: 'min(1, CREDITS / (LF + LB + 2)) beats per clock with an always-ready sink (measured); beats held when the sink stops:
  CREDITS'
guards:
- W: 0
- W: 1025
- CREDITS: 0
- CREDITS: 1025
- LF: -1
- LF: 9
- LB: -1
- LB: 9
- TLAST_EN: 2
- TUSER_W: 65
sweep_tested:
- W: 16
  CREDITS: 1
  LF: 0
  LB: 0
- W: 16
  CREDITS: 2
  LF: 0
  LB: 0
- W: 16
