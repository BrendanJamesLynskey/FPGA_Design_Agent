# ip.yaml for match_ternary: the declared parameter space and contract (brief 28 rules; brief 40 entry).
name: match_ternary
version: 0.1.0
status: simulated (brief 40); OOC cost table pending
summary: 'Ternary match (TCAM emulation) in LUT RAM: one 2**CHUNK_W x 1 RAM per (rule, key chunk), AND of the chunk vectors,
  lowest index wins.'
top: match_ternary
rtl:
- rtl/match_ternary.sv
depends: []
interfaces:
- name: lookup
  type: native
- name: cmd
  type: native
  note: op 1 WRITE entry (value, care mask, action), op 2 DELETE
clocks:
- name: clk
parameters:
  KEY_W:
    type: int
    default: 40
    range:
    - 1
    - 128
  ACT_W:
    type: int
    default: 16
    range:
    - 1
    - 128
  ENTRIES:
    type: int
    default: 32
    range:
    - 1
    - 256
  CHUNK_W:
    type: int
    default: 5
    range:
    - 2
    - 8
  TAG_W:
    type: int
    default: 8
    range:
    - 1
    - 64
constraints:
- KEY_W % CHUNK_W == 0
latency:
  lookup: 4 clocks (measured)
  write: 2**CHUNK_W + 2 clocks at the core (34 measured at CHUNK_W 5)
  delete: 1 clock
throughput: one lookup a clock
guards:
- KEY_W: 41
  CHUNK_W: 5
- ENTRIES: 300
- CHUNK_W: 9
  KEY_W: 45
sweep_tested:
- KEY_W: 40
  ENTRIES: 32
  CHUNK_W: 5
- KEY_W: 24
  ENTRIES: 8
  CHUNK_W: 4
- KEY_W: 48
  ENTRIES: 64
  CHUNK_W: 6
- KEY_W: 8
  ENTRIES: 1
  CHUNK_W: 8
boundary:
  registered_outputs: 'yes'
  cdc: none
  part_specific: none; CHUNK_W 5 suits 32-deep and 6 suits 64-deep LUT RAM (7-series and UltraScale+ both have 64x1 LUT
    RAM)
limits: a rule being rewritten is absent for 2**CHUNK_W + 2 clocks; for make-before-break write a free entry, then delete
resets:
- name: rst
  polarity: high
  style: synchronous
evidence:
  tests:
  - flow/net/tests/test_40_tables_rtl.py
  faults: ip_lib/match_ternary/faults.yaml
  results: results/b40/measure.json, results/b40/faults.json
  simulator: Icarus Verilog 12 (local and CI); xsim cross-check pending
cost_table: 'pending: OOC synthesis sweep deferred (no heavy slot free on 2026-11-11)'
licence: MIT (this repository)
