# ip.yaml for ipv4_udp_rx: the declared parameter space and contract (the library's reuse rules; brief 63D).
name: ipv4_udp_rx
version: 0.1.0
status: 'Misses 125 MHz out of context (75-81 MHz estimated: needs pipelining before it sits behind the RGMII MAC); closes
  at 50 MHz. Simulated against an RFC 791/768 model with scapy checking the bench''s frames; output protocol checked by bounded
  model checking; built alone out of context on an Artix-7 with Vivado 2026.1; not yet run on a board (the Nexys A7 network
  design carries it behind eth_mac_rmii; built, not yet run: a cable check comes first, see designs/b63d_nexys_net/host/PLAN.md)'
summary: 'IPv4 and UDP receive: header checksum and length checks, options skipped, fragments refused, destination by own
  address, broadcast or multicast, UDP checksum with the pseudo-header, demultiplexed by destination port; the payload streams
  out with its header fields.'
top: ipv4_udp_rx
rtl:
- rtl/ipv4_udp_rx.sv
depends: []
interfaces:
- name: s_axis
  type: axis
  dir: slave
  tdata: 8
  tuser: 1
  tready: true
  note: received Ethernet frames without FCS; tready falls only while m_axis is stalled and for one clock after each frame
- name: m_axis
  type: axis
  dir: master
  tdata: 8
  tuser: 1
  tdest: 3
  tready: true
  note: UDP payloads; tuser on tlast = discard (bad frame, short frame or wrong UDP checksum); m_src_ip, m_dst_ip, m_src_port,
    m_dst_port and m_len beside every byte
- name: config
  type: native
  signals: own_ip[31:0], ports[N_PORTS*16-1:0], port_en[N_PORTS-1:0]
- name: events
  type: native
  signals: ev_ok, ev_bad_ip, ev_bad_udp, ev_no_port, ev_frag, ev_empty
clocks:
- name: clk
resets:
- name: rst
  polarity: high
  style: synchronous
parameters:
  N_PORTS:
    type: int
    default: 4
    range:
    - 1
    - 8
    note: destination ports in the table (the lowest matching index wins)
  CHECK_UDP:
    type: int
    default: 1
    set:
    - 0
    - 1
    note: 1 = verify a non-zero UDP checksum
  ACCEPT_BCAST:
    type: int
    default: 1
    set:
    - 0
    - 1
    note: 1 = accept 255.255.255.255
  ACCEPT_MCAST:
    type: int
    default: 1
    set:
    - 0
    - 1
    note: 1 = accept 224.0.0.0/4 (the MAC filter and igmp_join choose the groups)
constraints: []
latency:
  payload: each payload byte leaves one input byte later (one byte held back to place tlast); the last one 1 clock after the
    frame's last byte
throughput: a byte a clock, less one clock per frame
guards:
- N_PORTS: 0
- N_PORTS: 9
- CHECK_UDP: 2
- ACCEPT_BCAST: 2
- ACCEPT_MCAST: 2
sweep_tested:
- N_PORTS: 4
  CHECK_UDP: 1
  ACCEPT_BCAST: 1
  ACCEPT_MCAST: 1
- N_PORTS: 1
  CHECK_UDP: 0
  ACCEPT_BCAST: 0
  ACCEPT_MCAST: 0
- N_PORTS: 8
  CHECK_UDP: 1
  ACCEPT_BCAST: 0
  ACCEPT_MCAST: 1
characterisation:
  part: xc7a100tcsg324-1
  clock_ns: 8.0
  points:
  - N_PORTS: 4
  - N_PORTS: 8
boundary:
  registered_outputs: 'yes'
  cdc: none
  part_specific: none
limits: 'no reassembly (fragments are counted and dropped); no VLAN tags (strip them in the MAC); a datagram with no payload
  produces no output; the UDP checksum verdict comes on tlast, so a consumer acting on the bytes early must undo on tuser;
  measured Fmax estimates 75-81 MHz out of context: it closes at the RMII MAC''s 50 MHz but not at the RGMII MAC''s 125 MHz
  (header index compares and checksum folds are not pipelined)'
evidence:
  summary: 'cocotb against ip_lib/ipv4_udp_rx/model.py (RFC 791, 768, 1071), frames built in plain Python with scapy recomputing
    the bench''s own UDP checksums: unicast, broadcast, multicast and foreign destinations; enabled, disabled, duplicated
    and unknown ports; right, wrong and absent UDP checksums; IP options, fragments, other protocols, bad header checksums,
    short and long UDP lengths, zero and non-zero Ethernet padding, bad and truncated frames, empty payloads; input gaps and
    back-pressure; every event counter compared; Icarus Verilog 12. Formal (bounded): the AXI-Stream protocol rules (valid
    held until ready, data steady while waiting) on m_axis with tuser, tdest and the header fields, and a cover of a whole
    datagram; an independent adversarial bench adds last fragments, IHL 15, odd checksums and short UDP lengths'
  tests:
  - flow/net/tests/test_63d_udp_rx_rtl.py
  - flow/net/tests/test_63d_adversarial_rtl.py
  - flow/net/tests/test_63d_formal.py
  faults: ip_lib/ipv4_udp_rx/faults.yaml
  results: results/b63d/faults.json, results/b63d/formal.json, ip_lib/ipv4_udp_rx/char/xc7a100tcsg324-1.json
  simulator: Icarus Verilog 12, cocotb 2.0.1; SymbiYosys
cost_table: 'measured out of context: see the Cost section above'
licence: MIT (this repository)
