# ip.yaml for igmp_join: the declared parameter space and contract (the library's reuse rules; brief 63D).
name: igmp_join
version: 0.1.0
status: 'Misses 125 MHz out of context (71-80 MHz estimated: needs pipelining before it sits behind the RGMII MAC); closes
  at 50 MHz. Simulated against RFC 2236 (directed sequence, every frame compared with the model, scapy decoding); transmit
  framing checked by bounded model checking; built alone out of context on an Artix-7 with Vivado 2026.1; not yet run on a
  board (the Nexys A7 network design carries it behind eth_mac_rmii; built, not yet run: a cable check comes first, see designs/b63d_nexys_net/host/PLAN.md)'
summary: 'Multicast group membership for a host (IGMPv2, RFC 2236) for up to 8 configured groups: unsolicited reports on joining,
  reports in answer to general, group-specific and version 3 queries after a random delay, suppression by other hosts'' reports,
  leaves. IGMPv2 only: IGMPv3 reports are not implemented (a version 3 query is answered as version 2).'
top: igmp_join
rtl:
- rtl/igmp_join.sv
depends: []
interfaces:
- name: s_axis
  type: axis
  dir: slave
  tdata: 8
  tuser: 1
  tready: always 1
  note: received Ethernet frames without FCS
- name: m_axis
  type: axis
  dir: master
  tdata: 8
  tready: true
  note: 46-byte reports and leaves (TTL 1, Router Alert); the MAC pads them
- name: config
  type: native
  signals: own_mac[47:0], own_ip[31:0], groups[N_GROUPS*32-1:0], group_en[N_GROUPS-1:0]
  note: a group joins when its group_en rises and leaves when it falls; the MAC filter must accept the groups (01-00-5E plus
    the low 23 bits)
- name: events
  type: native
  signals: ev_query, ev_report, ev_leave, ev_suppressed
clocks:
- name: clk
resets:
- name: rst
  polarity: high
  style: synchronous
parameters:
  N_GROUPS:
    type: int
    default: 4
    range:
    - 1
    - 8
  TICK_CLKS:
    type: int
    default: 12500000
    range:
    - 1
    - 16777215
    note: clocks per tick; RFC 2236 counts tenths of a second (12_500_000 at 125 MHz)
  UNSOL_TICKS:
    type: int
    default: 100
    range:
    - 1
    - 255
    note: the repeat of a join's report comes within this many ticks
constraints: []
latency:
  report: a join's first report follows at once (no tick wait); query answers after a random 1..Max Response Time ticks, checked
    against that window in the bench
throughput: one frame at a time, lowest group first
guards:
- N_GROUPS: 0
- N_GROUPS: 9
- TICK_CLKS: 0
- UNSOL_TICKS: 0
- UNSOL_TICKS: 256
sweep_tested:
- N_GROUPS: 4
  TICK_CLKS: 40
  UNSOL_TICKS: 10
- N_GROUPS: 1
  TICK_CLKS: 25
  UNSOL_TICKS: 1
- N_GROUPS: 8
  TICK_CLKS: 60
  UNSOL_TICKS: 20
characterisation:
  part: xc7a100tcsg324-1
  clock_ns: 8.0
  points:
  - N_GROUPS: 4
  - N_GROUPS: 8
boundary:
  registered_outputs: 'yes'
  cdc: none
  part_specific: none
limits: 'IGMPv2 host side only: no IGMPv3 reports or source filtering (a version 3 query is answered as a version 2 query,
  RFC 3376 7.2.1); no version 1 router compatibility timer; the random delay comes from a 16-bit LFSR; measured Fmax estimates
  71-80 MHz out of context: below the RGMII MAC''s 125 MHz (the frame''s checksums are summed in one clock)'
evidence:
  summary: 'cocotb, a directed sequence written from RFC 2236 with short ticks: joins (a report at once and one repeat), general,
    group-specific and version 3 queries answered within the Max Response Time, the timer-restart rule, a query with a bad
    checksum ignored, suppression by another host''s report, leaves only after being the last reporter; every frame compared
    byte for byte with ip_lib/igmp_join/model.py and decoded by scapy; Icarus Verilog 12. Formal (bounded): every frame 46
    bytes and the AXI-Stream protocol rules (valid held until ready, data steady while waiting) on m_axis; an independent
    adversarial bench adds report timing in ticks, version 1 queries and scapy-built frames'
  tests:
  - flow/net/tests/test_63d_igmp_rtl.py
  - flow/net/tests/test_63d_adversarial_rtl.py
  - flow/net/tests/test_63d_formal.py
  faults: ip_lib/igmp_join/faults.yaml
  results: results/b63d/faults.json, results/b63d/formal.json, ip_lib/igmp_join/char/xc7a100tcsg324-1.json
  simulator: Icarus Verilog 12, cocotb 2.0.1; SymbiYosys
cost_table: 'measured out of context: see the Cost section above'
licence: MIT (this repository)
next_steps:
- Pipeline the block before it sits behind the RGMII MAC (it closes at 50 MHz, not 125 MHz).
- Run designs/b63d_nexys_net on the board and record the joins on a switch.
