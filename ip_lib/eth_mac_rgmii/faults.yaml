# Seeded faults (run by flow/net/faults.py): each replaces `old` (exactly once) by `new` in a copy of rtl/;
# the tests named in `test` must fail. The real RTL is never touched.
runner: flow/net/faults.py          # the fault runner that owns this block's faults (the other runner skips it)
faults:
  - name: rx_ddr_nibbles_swapped
    file: rgmii_rx.sv
    old: "gmii_d  <= {q_f[3:0], q_r[3:0]};"
    new: "gmii_d  <= {q_r[3:0], q_f[3:0]};"
    class: protocol
    why: at 1000 Mb/s the rising-edge nibble is taken as the upper half of the byte
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k ct_1000
  - name: rx_nibble_alignment_ignores_sfd
    file: rgmii_rx.sv
    old: "if (q_r[3:0] == 4'hD && lo == 4'h5) begin"
    new: "if (q_r[3:0] == 4'h5 && lo == 4'h5) begin"
    class: protocol
    why: at 10/100 Mb/s bytes are aligned on the preamble instead of the SFD
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k ct_1000
  - name: rgmii_rx_crc_skips_first_byte
    file: mac_rx.sv
    old: "assign crc_en    = data_beat;"
    new: "assign crc_en    = data_beat && n != '0;"
    class: off-by-one
    why: the FCS check is computed over one byte too few
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k ct_1000
  - name: rgmii_rx_runt_not_flagged
    file: mac_rx.sv
    old: "end_runt    <= n < LEN_W'(MIN_FRAME);"
    new: "end_runt    <= 1'b0;"
    class: missing check
    why: frames shorter than MIN_FRAME are not reported as runts
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k ct_1000
  - name: rgmii_tx_short_ifg
    file: mac_tx.sv
    old: "if (cnt + 8'd1 >= 8'(IFG_BYTES)) st <= S_IDLE;"
    new: "if (cnt + 8'd2 >= 8'(IFG_BYTES)) st <= S_IDLE;"
    class: off-by-one
    why: the inter-frame gap is one byte time short
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k ct_1000
  - name: tx_no_padding
    file: mac_tx.sv
    old: "assign data_done = (ended || cur_last) && (i + 1'b1 >= LEN_W'(MIN_DATA));"
    new: "assign data_done = (ended || cur_last);"
    class: missing check
    why: short frames are sent without padding to MIN_DATA
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k ct_1000
  - name: tx_underrun_not_poisoned
    file: eth_mac_rgmii.sv
    old: ".poison((tx_poison && !src_p) || bad)"
    new: ".poison(tx_poison && !src_p)"
    class: protocol
    why: a frame cut short by an AXI-Stream underrun leaves with a good FCS
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k ct_1000
  - name: tx_10_100_nibbles_swapped
    file: rgmii_tx.sv
    old: "d1 <= hi ? gmii_d[7:4] : gmii_d[3:0]; d2 <= hi ? gmii_d[7:4] : gmii_d[3:0];"
    new: "d1 <= hi ? gmii_d[3:0] : gmii_d[7:4]; d2 <= hi ? gmii_d[3:0] : gmii_d[7:4];"
    class: protocol
    why: at 10/100 Mb/s the upper nibble is sent first
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k ct_1000
  - name: sf_commits_bad_frames
    file: eth_rx_sf.sv
    old: "if (end_good && end_keep && !full_frame"
    new: "if (end_keep && !full_frame"
    class: missing check
    why: the store-and-forward buffer passes frames with a bad FCS
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k sf_small
  - name: sf_keeps_fcs
    file: eth_rx_sf.sv
    old: "assign keep_len = end_len - LEN_W'(vtag ? 8 : 4);"
    new: "assign keep_len = end_len - LEN_W'(vtag ? 4 : 0);"
    class: off-by-one
    why: the store-and-forward output includes the FCS bytes
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k sf_small
  # 0.2 features (brief 63D)
  - name: filter_hash_wrong_bits
    file: eth_rx_classify.sv
    old: "mc_hash[hcrc[5:0]]"
    new: "mc_hash[hcrc[6:1]]"
    class: protocol
    why: the multicast hash takes the wrong six bits of the CRC
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k v02_ct_hash_pause
  - name: filter_broadcast_always
    file: eth_rx_classify.sv
    old: "(d_bcast && bcast_en)"
    new: "d_bcast"
    class: missing check
    why: broadcast frames pass the filter with bcast_en off
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k v02_full
  - name: vlan_strip_leaves_tci
    file: eth_rx_sf.sv
    old: "assign skip = tpid || (vtag && (bi == LEN_W'(14) || bi == LEN_W'(15)));"
    new: "assign skip = tpid;"
    class: protocol
    why: stripping removes the TPID but leaves the TCI bytes in the frame
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k v02_full
  - name: pause_quanta_half
    file: eth_mac_rgmii.sv
    old: "ptimer <= {c_quanta, 6'd0};"
    new: "ptimer <= {1'b0, c_quanta, 5'd0};"
    class: off-by-one
    why: a pause quantum is taken as 256 bit times instead of 512
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k v02_full
  - name: pause_not_honoured
    file: eth_mac_rgmii.sv
    old: "assign want_u    = s_axis_tvalid && !bad && !tx_paused;"
    new: "assign want_u    = s_axis_tvalid && !bad;"
    class: missing check
    why: a received pause does not hold transmit frames back
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k v02_full
  - name: pause_frame_wrong_opcode
    file: eth_mac_rgmii.sv
    old: "15: pbyte = 8'h01;"
    new: "15: pbyte = 8'h02;"
    class: protocol
    why: the pause frame sent carries opcode 0x0002 instead of 0x0001
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k v02_full
  - name: control_frames_forwarded
    file: eth_mac_rgmii.sv
    old: "assign consumed        = (PAUSE != 0) && c_ctrl;"
    new: "assign consumed        = 1'b0;"
    class: protocol
    why: MAC control frames reach the store-and-forward output instead of being consumed
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k v02_full
  - name: stats_octets_without_fcs
    file: eth_mac_stats.sv
    old: "inc[1] = STAT_W'(rx_len);"
    new: "inc[1] = STAT_W'(rx_len) - STAT_W'(4);"
    class: off-by-one
    why: the good-octet counter leaves out the FCS
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k v02_full
  - name: stats_mcast_counts_broadcast
    file: eth_mac_stats.sv
    old: "inc[8] = STAT_W'(rx_mcast && !rx_bcast);"
    new: "inc[8] = STAT_W'(rx_mcast);"
    class: protocol
    why: broadcast frames are also counted as multicast
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k v02_full
  - name: jumbo_length_11_bits
    file: eth_mac_rgmii.sv
    old: "localparam int LW = (MAX_FRAME > 2000) ? 14 : 11;"
    new: "localparam int LW = 11;"
    class: width
    why: with jumbo frames the length counters stay 11 bits wide and saturate at 2047
    test: flow/net/tests/test_58_mac_rgmii_rtl.py -k v02_jumbo
