# ip.yaml for eth_mac_rgmii: the declared parameter space and contract (the library's reuse rules).
name: eth_mac_rgmii
version: 0.1.0
status: simulated; synthesised and routed inside the KR260 trading-path design; standalone out-of-context (OOC) cost table pending; not yet run on a board
summary: 'Tri-mode (10/100/1000 Mb/s) Ethernet MAC for a PHY with an RGMII (reduced gigabit media-independent
  interface) link: cut-through receive (bytes passed on as they arrive) with the FCS (frame check sequence, the CRC at
  the end of a frame) verdict at the end, optional store-and-forward AXI-Stream receive, AXI-Stream transmit with
  padding, FCS and inter-frame gap (IFG); the receive clock crossing inside.'
top: eth_mac_rgmii
rtl:
- rtl/rgmii_rx.sv
- rtl/rgmii_tx.sv
- rtl/gmii_cdc.sv
- rtl/mac_rx.sv
- rtl/mac_tx.sv
- rtl/eth_rx_sf.sv
- rtl/eth_mac_rgmii.sv
depends:
- eth_mac_rmii            # its byte-wide CRC-32 block (eth_crc32.sv) only
interfaces:
- name: rgmii
  type: native
  signals: rgmii_rx_clk, rgmii_rxd[3:0], rgmii_rx_ctl, rgmii_txc, rgmii_txd[3:0], rgmii_tx_ctl
- name: rx_ct
  type: native
  signals: rx_sof_pulse, rx_valid, rx_sof, rx_data[7:0], rx_idx[10:0], rx_end_valid, rx_end_good, rx_end_fcs_err,
    rx_end_runt, rx_end_giant, rx_end_er, rx_end_len[10:0]
  note: 'cut-through view, always present: every frame byte (FCS included) one clock after mac_rx takes it, before
    the frame is known good; the verdict follows the last byte. No back-pressure'
- name: m_axis
  type: axis
  dir: master
  tdata: 8
  tready: true
  note: store-and-forward, CUT_THROUGH = 0 only; good frames without their FCS; bad and overflowing frames dropped
    and counted (rx_sf_dropped, rx_sf_overflow)
- name: s_axis
  type: axis
  dir: slave
  tdata: 8
  tuser: 1
  note: a frame must keep coming once started (an underrun ends it with a bad FCS, tx_underrun); tuser or tx_poison
    marks the frame bad (inverted FCS)
clocks:
- name: clk
  note: 125 MHz at every speed
- name: clk90
  note: clk, 90 degrees later (forms TXC)
- name: rgmii_rx_clk
  note: the PHY's RX_CLK (125, 25 or 2.5 MHz), on a clock buffer
parameters:
  CUT_THROUGH:
    type: int
    default: 1
    set:
    - 0
    - 1
    note: 1 = cut-through view only; 0 = also the store-and-forward buffer and m_axis
  MIN_FRAME:
    type: int
    default: 64
    range:
    - 18
    - 2000
    note: 'receive: shortest good frame, FCS included'
  MAX_FRAME:
    type: int
    default: 1522
    range:
    - 64
    - 2000
    note: 'receive: longest good frame, FCS included'
  MIN_DATA:
    type: int
    default: 60
    range:
    - 1
    - 1514
    note: 'transmit: pad to this many bytes before the FCS'
  IFG_BYTES:
    type: int
    default: 12
    range:
    - 1
    - 255
    note: 'transmit: idle byte times after the FCS (the gap is one more when a frame is waiting)'
  SF_DEPTH:
    type: int
    default: 4096
    range:
    - 2048
    - 65536
    pow2: true
    note: store-and-forward buffer in bytes (CUT_THROUGH = 0)
constraints:
- MIN_FRAME <= MAX_FRAME
- SF_DEPTH >= 2 * MAX_FRAME when CUT_THROUGH = 0
latency:
  rx: 'cut-through: a byte leaves rx_* one 8 ns clock after it leaves the clock-crossing FIFO. In a looped simulation
    the transmit MAC''s first preamble byte reaches the receive MAC as its SFD (start-of-frame delimiter) 17 clocks
    (136 ns) later: 8 of them are the preamble and SFD themselves, the rest the RGMII pins and the clock-crossing FIFO,
    which is a simulation model, so its real latency is unmeasured (results/b58a/pins_sim.json). Store-and-forward: the
    whole frame, then 2 clocks'
  tx: first preamble byte on the MAC's output 2 clocks after s_axis_tvalid while idle; 2 more to TX_CTL at the pins (a register and the ODDRE1, simulation model; results/b58a/pins_sim.json)
throughput: 'line rate at 10, 100 and 1000 Mb/s; frames offered back to back leave IFG_BYTES + 1 idle byte times apart
  (flow/net/tests/mac_rgmii_cocotb.py)'
guards:
- CUT_THROUGH: 2
- MIN_FRAME: 17
- MAX_FRAME: 2001
- CUT_THROUGH: 0
  SF_DEPTH: 3000
- MIN_DATA: 0
- IFG_BYTES: 0
sweep_tested:
- CUT_THROUGH: 1
- CUT_THROUGH: 0
  SF_DEPTH: 4096
- CUT_THROUGH: 0
  SF_DEPTH: 2048
  MIN_FRAME: 60
  MAX_FRAME: 1000
  MIN_DATA: 46
  IFG_BYTES: 16
boundary:
  registered_outputs: RGMII data and control through ODDRE1/IDDRE1 (behavioural models in simulation); rx_*, m_axis
    and the MAC's GMII side are registers
  cdc: 'one crossing, RX_CLK to clk: an xpm_fifo_async (16 entries, 2 synchroniser stages), the receive reset by
    xpm_cdc_sync_rst and the speed setting by xpm_cdc_array_single; TXC''s waveform moves from clk to clk90 through
    one register'
  part_specific: IDDRE1/ODDRE1 (UltraScale and UltraScale+) under `ifdef SYNTHESIS`; 7-series needs IDDR/ODDR
    instead (not yet written). Pins, IO standards, RGMII delay mode and the RX clock buffer are the board's
    (the project knowledge base, board/kr260/ethernet)
limits: 'formal checks of the frame state machines are bounded (20 and 40 clocks), not proofs; full duplex only; no MDIO (the trading-path design has its own MDIO master), no pause frames, no VLAN handling, no
  statistics block; 10/100 nibble alignment needs the SFD; RGMII input timing is closed only for the PHY''s internal
  RX delay mode (board XDC); measured only in simulation so far'
resets:
- name: rst
  polarity: high
  style: synchronous
evidence:
  summary: cocotb against a Python RGMII PHY model written from RGMII v2.0 and IEEE 802.3 (zlib's CRC-32 for the FCS),
    Icarus Verilog 12; at 1000, 100 and 10 Mb/s in both directions
  tests:
  - flow/net/tests/test_58_mac_rgmii_rtl.py
  faults: ip_lib/eth_mac_rgmii/faults.yaml
  results: results/b58a/mac_rgmii_faults.json, results/b58a/pins_sim.json
  simulator: Icarus Verilog 12, cocotb 2.0.1
cost_table: 'pending: the OOC sweep is not run; the whole trading-path design on the KR260 is in results/b58a'
licence: MIT (this repository)
