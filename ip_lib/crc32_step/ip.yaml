# ip.yaml for crc32_step: the declared parameter space and contract (the library's reuse rules), with a function-unit
# contract (brief 64A+) that hwsw/cfu.py reads to wrap the entry as a CPU custom instruction.
name: crc32_step
version: 0.1.0
status: 'simulated bit-exact against model.py and zlib in both variants; built into a pinned copy of the BRV32P RV32 core as a custom instruction and run there in simulation (results/64a_hwsw); not run on a board'
summary: 'One CRC-32 update (IEEE 802.3, reflected, polynomial 0xEDB88320) by a 32-bit word: two operands, one result, no state; the shape of a CPU custom instruction.'
top: crc32_step
rtl:
- rtl/crc32_step.sv
depends: []
interfaces:
- name: operation
  type: native
  signals: in_valid, crc_in, data_in -> out_valid, crc_out (LATENCY clocks later)
clocks:
- name: clk
parameters:
  IMPL:
    type: string
    default: word
    set:
    - word
    - byte
    note: implementation variant (see variants)
latency:
  result: the variant's latency (1 or 4 clocks) from the in_valid pulse to the out_valid pulse
throughput: the variant's II (a new word every clock, or every 4 clocks)
guards:
- IMPL: nibble
sweep_tested:
- IMPL: [word, byte]
variant_param: IMPL
variants:
  word:
    summary: the 32-bit update in one clock (an XOR network)
    when: 'the lowest latency: the custom-instruction variant and the word-per-clock stream. Measured: 95 LUTs out of context; inside the BRV32P core the core grows by 371 LUTs with it, and the hierarchy report shows the unit at 283 LUTs because synthesis merges logic in front of it into it, most likely the operand multiplexers (one run each; 97 LUTs with its hierarchy kept; results/64a_hwsw/core_ooc.json)'
    uses:
      bram_tiles: 0
      dsp: 0
    latency: 1
    ii: 1
  byte:
    summary: one byte per clock through an 8-bit update, four clocks per word
    when: 'area before speed. Measured: out of context no saving (96 LUTs against 95), but inside the BRV32P core it grows the core by 148 LUTs against 371 for word; as a custom instruction it costs three more stall clocks per word (2.29 against 1.54 cycles per byte)'
    uses:
      bram_tiles: 0
      dsp: 0
    latency: 4
    ii: 4
characterisation:
  part: xc7a100tcsg324-1
  clock_ns: 4.0
  points:
  - {}
function_unit:                       # brief 64A+: how a CPU custom-instruction wrapper drives this entry (hwsw/cfu.py)
  operation: crc32.w
  summary: rd = CRC-32 update of rs1 by the 4 bytes of rs2, least significant byte first (no inversion)
  operands: {rs1: crc_in, rs2: data_in}
  result: {rd: crc_out}
  issue: in_valid                    # one-clock pulse with the operands
  done: out_valid                    # one-clock pulse with the result, `latency` clocks later (the variant's)
  state: none
  model: ip_lib/crc32_step/model.py:crc32_word
boundary:
  registered_outputs: 'yes'
  cdc: none
  part_specific: none
limits: 'the word variant has a combinational XOR network from the operand inputs to the result register: out of context that path has no register before it, so no Fmax is recorded there. Inside a core, synthesis can merge the logic that drives the operands into the network, so the unit''s line in a hierarchy report overstates it (283 LUTs in the BRV32P core, 97 with its hierarchy kept, 95 out of context); read the cost as the whole core''s growth (371 LUTs: results/64a_hwsw/core_ooc.json)'
resets:
- name: rst
  polarity: high
  style: synchronous
evidence:
  tests:
  - ip_lib/crc32_step/tb/test_crc32_step_rtl.py
  faults: ip_lib/crc32_step/faults.yaml
  results: results/b64a/faults.json, results/64a_hwsw/
  simulator: Icarus Verilog 12 (local and CI)
  summary: Bit-exact against `model.py` (written from the CRC definition, not from the RTL) and against zlib over whole buffers; latency and II measured; cocotb with Icarus Verilog 12.
cost_table: 'measured costs are in the Variants section above'
constraints: []
licence: MIT (this repository)
