# Seeded faults; run by hil/ip_faults.py: each must make the block's tests fail.
runner: hil/ip_faults.py          # the fault runner that owns this block's faults (the other runner skips it)
faults:
- name: sine_wrong_slice
  file: dds_awg.sv
  old: 'rom[phase_next[PHASE_W-1 -: LUT_W]]'
  new: 'rom[phase_next[PHASE_W-2 -: LUT_W]]'
  class: value
  why: the table address skips the top phase bit, so the sine runs at twice the frequency (bram variant)
  test: hil/tests/test_30_ip_rtl.py -k test_block and dds_awg
- name: lut_sine_wrong_slice
  file: dds_awg.sv
  old: 'lut[phase[PHASE_W-1 -: LUT_W]]'
  new: 'lut[phase[PHASE_W-2 -: LUT_W]]'
  class: value
  why: the same fault in the lut variant's table address (added with the variants)
  test: hil/tests/test_30_ip_rtl.py -k test_block and dds_awg and lut
- name: bram_next_entry
  file: dds_awg.sv
  old: 'else if (tick) sine <= rom[phase_next[PHASE_W-1 -: LUT_W]];'
  new: 'else if (tick) sine <= rom[phase_next[PHASE_W-1 -: LUT_W] + 1''b1];'
  class: value
  why: the registered table read is one entry ahead of the phase (bram variant)
  test: hil/tests/test_30_ip_rtl.py -k test_block and dds_awg
- name: triangle_no_fold
  file: dds_awg.sv
  old: 'tri_u = top[OUT_W-1] ? (~top << 1) : (top << 1);'
  new: tri_u = (top << 1);
  class: path
  why: the triangle is a saw at twice the rate
  test: hil/tests/test_30_ip_rtl.py -k test_block and dds_awg
- name: shift_logical
  file: dds_awg.sv
  old: sample <= raw >>> amp_shift;
  new: sample <= raw >> amp_shift;
  class: value
  why: amplitude scaling shifts zeros into negative samples
  test: hil/tests/test_30_ip_rtl.py -k test_block and dds_awg
