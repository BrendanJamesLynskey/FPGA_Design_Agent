# ip.yaml for dds_awg: the declared parameter space and contract (brief 28 rules; brief 30 entry).
name: dds_awg
version: 0.2.0
status: simulated bit-exact against hil/instruments/models.py; measured on the Nexys A7-100T inside b30_hil_audio (the 1 kHz sine read at the
  audio jack at 999.99 Hz, THD 1.32 %)
summary: 'DDS/AWG stimulus source: phase accumulator, sine table, triangle, saw and square, amplitude shift. f_out = f_tick * step / 2**PHASE_W.'
top: dds_awg
rtl:
- rtl/dds_awg.sv
depends: []
interfaces:
- name: sample
  type: native
  signals: tick, step, wave, amp_shift -> sample (signed), phase_o
clocks:
- name: clk
parameters:
  IMPL:
    type: string
    default: bram
    set:
    - bram
    - lut
    note: implementation variant of the sine table (see variants)
  PHASE_W:
    type: int
    default: 32
    range:
    - 8
    - 48
    note: accumulator width
  LUT_W:
    type: int
    default: 8
    range:
    - 4
    - 12
    note: sine table address bits (must not exceed PHASE_W)
  OUT_W:
    type: int
    default: 16
    range:
    - 4
    - 24
    note: output sample bits
latency:
  tick_to_sample: 1 clock
throughput: one sample per tick
guards:
- LUT_W: 2
- IMPL: rom
sweep_tested:
- PHASE_W: 32
  LUT_W: 8
  OUT_W: 16
- PHASE_W: 24
  LUT_W: 6
  OUT_W: 12
- IMPL: lut
  PHASE_W: 32
  LUT_W: 8
  OUT_W: 16
- IMPL: lut
  PHASE_W: 24
  LUT_W: 6
  OUT_W: 12
variant_param: IMPL
variants:
  bram:
    summary: sine table in block RAM, read one clock early at the next phase (phase + step) into the RAM's own register
    when: large tables (LUT_W 10 and up) or LUTs scarce; a block RAM free
    uses:
      bram_tiles: 0.5 * ceil(2**LUT_W * OUT_W / 18432)
      dsp: 0
    latency: 1
    ii: 1
  lut:
    summary: sine table as an asynchronous ROM in LUTs, read from the phase register
    when: small tables, or no block RAM to spare
    uses:
      bram_tiles: 0
      dsp: 0
    latency: 1
    ii: 1
characterisation:
  part: xc7a100tcsg324-1
  clock_ns: 4.0
  points:
  - PHASE_W: 32
    LUT_W: 8
    OUT_W: 16
  - PHASE_W: 32
    LUT_W: 12
    OUT_W: 16
boundary:
  registered_outputs: 'yes'
  cdc: none
  part_specific: none (the sine table is built in an initial block with $sin; Vivado 2026.1 synthesises it; rom_style attributes steer the variants)
limits: 'no table interpolation: the sine''s spurs are set by LUT_W (about -6 dB per bit below the carrier, 8 bits: SFDR near 48 dB for the table
  alone); no phase offset input'
resets:
- name: rst
  polarity: high
  style: synchronous
evidence:
  tests:
  - hil/tests/test_30_ip_rtl.py
  - designs/b30_hil_audio/tests/test_hil_audio_rtl.py
  faults: ip_lib/dds_awg/faults.yaml
  results: results/b30/faults.json, results/b30/hil_runs/
  simulator: Icarus Verilog 12 (local and CI)
  summary: Bit-exact against the Python models in `hil/instruments/models.py` (plain Python written from the definitions, not from the RTL); cocotb
    with Icarus Verilog 12.
cost_table: 'out-of-context, per variant: see the Variants table (char/xc7a100tcsg324-1.json); in context inside b30_hil_audio the 0.1.0 design measured 115 LUT, 48 FF, 1 RAMB18 at PHASE_W 32, LUT_W 8, OUT_W 16 (Vivado 2026.1, results/49_vivado_2026_1/b30_hil_audio.json)'
constraints: []
licence: MIT (this repository)
