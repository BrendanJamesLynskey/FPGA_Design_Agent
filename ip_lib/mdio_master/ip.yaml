# ip.yaml for mdio_master: the declared parameter space and contract (the library's reuse rules; brief 63D).
name: mdio_master
version: 0.1.0
status: Meets 125 MHz out of context (285-307 MHz estimated at a 250 MHz target); simulated against a clause 22 PHY model
  at DIV 2, 5 and 32; frame timing proved by k-induction at DIV 2 (SymbiYosys); built alone on an Artix-7 with Vivado 2026.1;
  first written for designs/b58a_trigger (its own copy is used there); not yet run on a board as a library entry
summary: 'PHY management (MDIO, IEEE 802.3 clause 22): the two-wire bus (MDC clock, MDIO data) that reads and writes an Ethernet
  PHY chip''s registers; one access at a time, MDC = clk / (2 x DIV), the line released for the PHY in a read from the turnaround
  on.'
top: mdio_master
rtl:
- rtl/mdio_master.sv
depends: []
interfaces:
- name: cmd
  type: native
  signals: go, rd, phy[4:0], reg_a[4:0], wdata[15:0], rdata[15:0], busy
  note: go is taken while busy is low; rdata holds the value read once busy falls
- name: mdio
  type: native
  signals: mdc, mdio_o, mdio_t, mdio_i
  note: mdio_t = 1 releases the line (the board top makes the tristate; the pin needs a pull-up); mdio_i must be synchronised
    by the board top
clocks:
- name: clk
  note: any; DIV sets MDC (at 125 MHz, DIV 32 gives 1.95 MHz, under the 2.5 MHz of clause 22)
resets:
- name: rst
  polarity: high
  style: synchronous
parameters:
  DIV:
    type: int
    default: 32
    range:
    - 2
    - 1024
    note: clocks per half MDC period
constraints: []
latency:
  frame: 64 bit times of 2 x DIV clocks from go to busy falling (measured in the bench and proved formally)
throughput: one register access per 128 x DIV clocks plus one idle clock
guards:
- DIV: 1
- DIV: 1025
sweep_tested:
- DIV: 32
- DIV: 2
- DIV: 5
characterisation:
  part: xc7a100tcsg324-1
  clock_ns: 4.0
  points:
  - DIV: 32
  - DIV: 2
boundary:
  registered_outputs: yes (mdc, mdio_o, mdio_t, busy, rdata)
  cdc: none inside; mdio_i comes from the pin through the board top's synchroniser
  part_specific: none (the tristate buffer is the board top's)
limits: clause 22 only (no clause 45 indirect access); no preamble suppression; one access at a time; the line changes DIV
  clocks after each rising edge of MDC, so the hold time is DIV clock periods (at least 10 ns asks DIV >= 2 at 125 MHz)
evidence:
  summary: 'cocotb against a clause 22 PHY written from IEEE 802.3 clause 22.2.4.5 (ip_lib/mdio_master/model.py) that samples
    on rising MDC and answers reads after a random clock-to-output delay; every bit driven, the releases, MDIO steady a clock
    either side of each rising MDC edge, the MDC period, the frame length and the values read; Icarus Verilog 12. Formal:
    the frame position, the MDC waveform, the releases and the setup and hold rule proved by k-induction at DIV 2, and a whole
    read covered'
  tests:
  - flow/net/tests/test_63d_mdio_rtl.py
  - flow/net/tests/test_63d_formal.py
  faults: ip_lib/mdio_master/faults.yaml
  results: results/b63d/faults.json, results/b63d/formal.json, ip_lib/mdio_master/char/xc7a100tcsg324-1.json
  simulator: Icarus Verilog 12, cocotb 2.0.1; SymbiYosys
cost_table: 'measured out of context: see the Cost section above'
