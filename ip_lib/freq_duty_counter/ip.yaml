# ip.yaml for freq_duty_counter: the declared parameter space and contract (brief 28 rules; brief 30 entry).
name: freq_duty_counter
version: 0.1.0
status: simulated and measured on the Nexys A7-100T inside b30_hil_audio (1000.0 Hz read for the 1 kHz tone)
summary: 'Frequency and duty counter: edges and high clocks of an asynchronous input over a fixed gate; two-flop synchroniser inside. frequency
  = edges / gate time, duty = high clocks / gate clocks.'
top: freq_duty_counter
rtl:
- rtl/freq_duty_counter.sv
depends: []
interfaces:
- name: measure
  type: native
  signals: sig (asynchronous) -> valid pulse, edges, high_clks, gates
clocks:
- name: clk
parameters:
  GATE_CLKS:
    type: int
    default: 100000
    range:
    - 4
    - 1073741824
    note: gate length in clocks
  CNT_W:
    type: int
    default: 24
    range:
    - 3
    - 32
    note: counter width; must hold a gate (GATE_CLKS < 2**CNT_W)
latency:
  result: one gate (GATE_CLKS clocks) after reset, then every gate
  input_to_count: 3 clocks (two synchroniser flops and an edge register)
throughput: one input sample per clock; at most one counted edge per two clocks
guards:
- GATE_CLKS: 2
- CNT_W: 40
sweep_tested:
- GATE_CLKS: 2000
  CNT_W: 16
- GATE_CLKS: 777
  CNT_W: 12
boundary:
  registered_outputs: 'yes'
  cdc: 'one: sig through a two-flop ASYNC_REG synchroniser'
  part_specific: none
limits: frequency resolution is f_clk / GATE_CLKS; input edges closer than two clocks are missed; no hysteresis or glitch filter
resets:
- name: rst
  polarity: high
  style: synchronous
evidence:
  tests:
  - hil/tests/test_30_ip_rtl.py
  - designs/b30_hil_audio/tests/test_hil_audio_rtl.py
  faults: ip_lib/freq_duty_counter/faults.yaml
  results: results/b30/faults.json, results/b30/hil_runs/
  simulator: Icarus Verilog 12 (local and CI)
  summary: Bit-exact against the Python models in `hil/instruments/models.py` (plain Python written from the definitions, not from the RTL); cocotb
    with Icarus Verilog 12.
cost_table: 'in-context cost (not an OOC sweep): 12 LUT, 165 FF at GATE_CLKS 50 000 000, CNT_W 26 inside b30_hil_audio (Vivado 2025.2, xc7a100t -1); the OOC sweep is still to do'
constraints: []
licence: MIT (this repository)
