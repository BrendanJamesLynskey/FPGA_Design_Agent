# ip.yaml for fir: the declared parameter space, contract and implementation variants (the library's reuse rules).
name: fir
version: 0.1.0
status: 'simulated bit-exact against ip_lib/fir/model.py: every variant at four parameter points, a differential test across the variants, and an adversarial bench (coefficient beats between samples, reloads with results in flight, resets mid-stream); measured out of context on an Artix-7 (xc7a100t, Vivado 2026.1); not yet run on a board'
summary: 'FIR filter with runtime-loadable coefficients, full-precision output and valid/ready streams, in four implementations that trade multipliers for speed: multiply-accumulate (MAC) engines on DSP slices with block RAM or with LUT RAM, one time-shared DSP MAC, and a fully parallel form with one LUT-built multiplier per tap.'
top: fir
rtl:
- rtl/fir.sv
- rtl/fir_fold.sv
- rtl/fir_mac.sv
- rtl/fir_parallel.sv
- rtl/fir_ram.sv
depends: []
interfaces:
- name: coefficients
  type: valid/ready stream
  signals: c_valid, c_ready, c_data (signed COEF_W), c_last
  note: h[0] first; c_last (or the TAPS-th beat) ends a load; no sample is taken while c_valid is high
- name: samples
  type: valid/ready stream
  signals: s_valid, s_ready, s_data (signed DATA_W)
- name: results
  type: valid/ready stream
  signals: m_valid, m_ready, m_data (signed ACC_W = DATA_W + COEF_W + clog2(TAPS))
- name: status
  type: native
  signals: busy (high while the memories are cleared after reset)
clocks:
- name: clk
parameters:
  IMPL:
    type: string
    default: dsp_bram
    set:
    - dsp_bram
    - dist_ram
    - serial
    - lut_mult
    note: implementation variant (see variants)
  TAPS:
    type: int
    default: 16
    range:
    - 2
    - 256
    note: number of taps (lut_mult up to 64)
  DATA_W:
    type: int
    default: 16
    range:
    - 4
    - 24
    note: sample bits, signed
  COEF_W:
    type: int
    default: 16
    range:
    - 4
    - 18
    note: coefficient bits, signed
  FOLD:
    type: int
    default: 4
    range:
    - 2
    - 256
    note: taps per multiply-accumulate engine for dsp_bram and dist_ram (at most TAPS); serial and lut_mult ignore it
latency:
  sample_to_result: the LATENCY localparam of fir (clocks from the accepting clock to m_valid, with m_ready high); per variant below
  after_reset: busy for FOLD clocks (folded variants) or one clock (lut_mult)
throughput: one sample every II clocks (the II localparam; per variant below); results wait for m_ready without loss
guards:
- IMPL: fast
- TAPS: 1
  FOLD: 1
- FOLD: 32
- DATA_W: 25
- COEF_W: 19
- DATA_W: 24
  COEF_W: 18
  TAPS: 256
  FOLD: 8
- IMPL: lut_mult
  TAPS: 65
sweep_tested:
- IMPL: [dsp_bram, dist_ram, serial, lut_mult]
  TAPS: 16
  DATA_W: 16
  COEF_W: 16
  FOLD: 4
- IMPL: [dsp_bram, dist_ram, serial, lut_mult]
  TAPS: 7
  DATA_W: 12
  COEF_W: 10
  FOLD: 3
- IMPL: [dsp_bram, dist_ram, serial, lut_mult]
  TAPS: 33
  DATA_W: 18
  COEF_W: 18
  FOLD: 8
- IMPL: [dsp_bram, dist_ram, serial, lut_mult]
  TAPS: 2
  DATA_W: 4
  COEF_W: 4
  FOLD: 2
constraints:
- DATA_W + COEF_W + clog2(TAPS) <= 48
variant_param: IMPL
variants:
  dsp_bram:
    summary: ceil(TAPS/FOLD) MAC engines on DSP slices, each taking FOLD taps in turn; samples and coefficients in block RAM
    when: 'guidance: longer filters at sample rates well below the clock, with DSP slices and block RAM to spare'
    uses:
      dsp: ceil(TAPS / FOLD)
      bram_tiles: 0.5 * (ceil(ceil(TAPS / FOLD) * DATA_W / 36) + ceil(ceil(TAPS / FOLD) * COEF_W / 36))
    latency: FOLD + 8 + clog2(ceil(TAPS / FOLD))
    ii: FOLD + 3
    requires:
    - FOLD <= TAPS
  dist_ram:
    summary: the same engines with the samples and coefficients in LUT RAM
    when: 'guidance: short coefficient sets, or block RAM already spoken for'
    uses:
      dsp: ceil(TAPS / FOLD)
      bram_tiles: 0
    latency: FOLD + 8 + clog2(ceil(TAPS / FOLD))
    ii: FOLD + 3
    requires:
    - FOLD <= TAPS
  serial:
    summary: one DSP MAC engine time-shared over every tap; memory type left to synthesis
    when: the fewest DSP slices, when a new sample every TAPS + 3 clocks is fast enough
    uses:
      dsp: 1
    latency: TAPS + 8
    ii: TAPS + 3
  lut_mult:
    summary: 'fully parallel: one multiplier per tap built from LUTs, all taps summed every clock (direct form)'
    when: 'a sample every clock with no DSP slices to spare; measured: 15 to 42 times the LUTs of dsp_bram and under half its Fmax'
    uses:
      dsp: 0
      bram_tiles: 0
    latency: 2 + clog2(TAPS)
    ii: 1
    requires:
    - TAPS <= 64
characterisation:
  part: xc7a100tcsg324-1
  clock_ns: 4.0
  points:
  - TAPS: 16
    DATA_W: 16
    COEF_W: 16
    FOLD: 4
  - TAPS: 32
    DATA_W: 16
    COEF_W: 16
    FOLD: 8
  - TAPS: 64
    DATA_W: 12
    COEF_W: 12
    FOLD: 16
boundary:
  registered_outputs: 'yes'
  cdc: none
  part_specific: none (memories and multipliers are inferred; use_dsp and ram_style attributes steer the variants; no primitive is instantiated)
limits: 'no rounding or saturation: the output carries every bit; no symmetric-coefficient or polyphase (decimating, interpolating) forms yet;
  coefficients are loaded one at a time (the folded variants take three clocks per coefficient)'
resets:
- name: rst
  polarity: high
  style: synchronous
evidence:
  tests:
  - ip_lib/fir/tb/test_fir_rtl.py
  faults: ip_lib/fir/faults.yaml
  results: results/b63a/faults.json, ip_lib/fir/char/xc7a100tcsg324-1.json
  simulator: Icarus Verilog 12 (local and CI)
  summary: Bit-exact against `ip_lib/fir/model.py` (plain Python written from the definition, not from the RTL); cocotb with Icarus Verilog 12.
    Every variant at four parameter points with random input gaps and output back-pressure, a coefficient reload mid-stream and the
    full-precision corner; the measured latency and II equal the declared ones; a differential test feeds every variant the same values
    and compares their outputs; an adversarial bench (written by an independent reviewer) interleaves coefficient beats with samples,
    reloads with results in flight and resets mid-stream, rebuilding the expected outputs from the handshakes.
cost_table: 'measured costs are in the Variants section above'
licence: MIT (this repository)
