depth:
  fwd1_bmc:
    enough: false
    why: 'A bound, not a proof: every antecedent is reached by step 5 at one point per mode, but depth 24 does not reach every state: the 4-bit beat counters wrap
      after 16 beats, which a point that moves a beat only every second clock does not get to, and not every stall and skid interaction is reached. The same wrapper
      properties are proved for all depths on the SystemVerilog original (pipe.sby); this job checks the generated Verilog to depth 24 only.'
