schema: fpga-design-agent/formal_rigour/v1
scope: 'the Hardcaml-generated pipe_reg (formal/pipe_reg_formal.sv, generated by ../run_hc.sh gen and committed) at W = 4, 14 (MODE, N) points, under the same wrapper
  formal_pipe.sv as the SystemVerilog original (labels h_order, h_wire, h_bound, h_stall_*; the SV slices'' own assertions are not in the generated Verilog). The
  checks are bounded: bmc to depth 24 per point, cover to depth 20 at one point per mode. This is a bounded check of the translation, weaker than the SystemVerilog
  proof in ip_lib/pipe_reg/formal/pipe.sby, which is proved by k-induction.'
antecedents:
  h_stall_*: h_stall__ante
sanity:
- c_through
unclaimed:
  fwd1_prove: 'k-induction does not close on the generated Verilog: the SystemVerilog original is proved with internal invariants (stage contents, counters) that
    the Hardcaml output does not carry, so the induction step has open counterexamples (status UNKNOWN). Kept to show how far the proof goes, not relied on; the verdict
    rests on the bmc and cover tasks.'
