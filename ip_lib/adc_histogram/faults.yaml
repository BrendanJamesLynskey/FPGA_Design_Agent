# Seeded faults; run by hil/ip_faults.py: each must make the block's tests fail.
runner: hil/ip_faults.py          # the fault runner that owns this block's faults (the other runner skips it)
faults:
- name: no_forwarding
  file: adc_histogram.sv
  old: 'cur = (vw && bw == b1) ? cw : c1;'
  new: cur = c1;
  class: timing
  why: back-to-back samples in one bin lose a count
  test: hil/tests/test_30_ip_rtl.py -k test_block and adc_histogram
- name: bin_from_low_bits
  file: adc_histogram.sv
  old: 'b1 <= s_data[SAMP_W-1 -: BIN_W];'
  new: b1 <= s_data[BIN_W-1:0];
  class: value
  why: the bin index uses the low bits of the code
  test: hil/tests/test_30_ip_rtl.py -k test_block and adc_histogram
- name: min_wrong_way
  file: adc_histogram.sv
  old: if (d1 < min_code) min_code <= d1;
  new: if (d1 > min_code) min_code <= d1;
  class: value
  why: the minimum is tracked the wrong way
  test: hil/tests/test_30_ip_rtl.py -k test_block and adc_histogram
- name: bram_copy_not_written
  file: adc_histogram.sv
  old: 'if (we) begin mem_s[wa] <= wd; mem_r[wa] <= wd; end'
  new: 'if (we) begin mem_s[wa] <= wd; end'
  class: value
  why: the host's copy of the bins is never updated (bram variant, added with the variants)
  test: hil/tests/test_30_ip_rtl.py -k test_block and adc_histogram and bram
