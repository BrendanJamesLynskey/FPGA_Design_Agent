resolved_questions:
- question: What is the register map, including offset, width, reset value, and access
    for every register?
  answer: 'PT: offset 0x00, WO, reset 0: [7:0] x, [15:8] y (0..31): presents the point
    for one clock; ignored while BUSY; reads 0

    CLEAR: offset 0x01, WO, reset 0: any write zeroes all counts (only when not busy);
    reads 0

    RD_SEL: offset 0x02, RW, reset 0: [3:0] direction index k (0..15), [14:8] distance
    index r = rho + 48 (0..95)

    RD_CNT: offset 0x03, RO, reset 0: [15:0] vote count of (k, r), valid a few clocks
    after RD_SEL is written

    STATUS: offset 0x04, RO, reset 0: [0] BUSY: a point is being processed

    shell: shell/PROTOCOL.md (version 1.0)'
  status: answered
  by: oracle
  default_reason: spec.md requires shell register accesses but does not specify offsets,
    widths, reset values, or access modes; the existing map is a proposed default.
- question: What test-shell command protocol maps host commands to register accesses?
  answer: Use the repository test-shell protocol and expose the registers using the
    confirmed register map.
  status: defaulted
  by: oracle
  default_reason: The request specifies test-shell use and the UART baud but does
    not specify command framing or transaction format.
- question: How many CLK100MHZ cycles after the final bin update does BUSY deassert?
  answer: BUSY deasserts on the cycle after all 16 direction-bin updates have completed.
  status: defaulted
  by: oracle
  default_reason: The request does not specify the exact busy duration or cycle of
    deassertion.
- question: What is the width and overflow behavior of each accumulator count?
  answer: Use an unsigned 11-bit saturating count.
  status: defaulted
  by: oracle
  default_reason: The request gives no count width or overflow rule; 11 bits represents
    up to 1024 votes.
- question: What is the maximum number of cycles from an RD_SEL write until RD_CNT
    is valid?
  answer: Make RD_CNT valid within 3 CLK100MHZ cycles after the RD_SEL write.
  status: defaulted
  by: oracle
  default_reason: The answered register description says only that readback is valid
    a few clocks later.
- question: What integer encoding should BUILD_STAMP use?
  answer: Use the 32-bit ASCII encoding of HOUG, 0x484F5547.
  status: defaulted
  by: oracle
  default_reason: The request specifies the design ID but not the parameter encoding.
