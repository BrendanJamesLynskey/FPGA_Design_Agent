name: hough_line_accumulator
title: Hough line accumulator behind the test shell
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: c13_hough_lines_top
clocks:
- name: CLK100MHZ
  frequency_hz: 100000000
  source: Nexys A7 100 MHz oscillator
reset:
  signal: CPU_RESETN
  active_level: 0
  behavior: CPU_RESETN returns the block to idle.
parameters:
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 100000
  BUILD_STAMP: 1213157719
ports:
- name: CLK100MHZ
  direction: input
  width: 1
  board_pin_role: 100 MHz system clock, pin E3
- name: CPU_RESETN
  direction: input
  width: 1
  board_pin_role: active-low CPU reset, pin C12
- name: UART_TXD_IN
  direction: input
  width: 1
  board_pin_role: USB-UART receive into FPGA, pin C4
- name: UART_RXD_OUT
  direction: output
  width: 1
  board_pin_role: USB-UART transmit from FPGA, pin D4
- name: LED
  direction: output
  width: 16
  board_pin_role: Board LEDs; LED[0] is busy, pin H17
behaviour:
  point_input:
  - The test shell supplies x and y in one write, with each coordinate in the range
    0 through 31.
  - Each point write presents the point for one clock.
  - The block accepts a new point only while it is not busy.
  - The STATUS register reports whether the block is busy.
  - The block asserts busy when it accepts a point and deasserts busy after all 16
    bin updates complete.
  - The block ignores point writes while busy.
  accumulation:
  - The accumulator has 16 line-normal directions indexed 0 through 15.
  - Direction 0 has normal angle 0 degrees; each successive direction advances by
    11.25 degrees over the 180-degree range.
  - Each direction has 96 integer-distance bins covering -48 through +47.
  - For each accepted point and direction k, the block computes rho = ((x*CT[k] +
    y*ST[k] + 64) >>> 7), then uses bin index rho + 48.
  - The fixed-point direction coefficients are CT = [128, 126, 118, 106, 91, 71, 49,
    25, 0, -25, -49, -71, -91, -106, -118, -126] and ST = [0, 25, 49, 71, 91, 106,
    118, 126, 128, 126, 118, 106, 91, 71, 49, 25].
  - Each accepted point increments one distance-bin count in each of the 16 directions.
  - The shell selects a direction and distance and reads the corresponding count.
  commands:
  - A CLEAR command zeroes all accumulator counts when the block is not busy.
  - The block ignores CLEAR while busy.
  - CPU_RESETN returns the block to idle.
  board_and_shell:
  - LED[0] is asserted while the block is busy.
  - LED[15:1] are driven low.
  - The test shell communicates over USB-UART at 115200 baud.
  - The design ID is HOUG.
  - All point writes, clear commands, status reads, and count reads are performed
    through the test shell.
  - The top module is c13_hough_lines_top.
  - The top-level parameters are CLKS_PER_BIT, TIMEOUT_CYCLES, and BUILD_STAMP.
registers:
  map:
  - offset: 0
    name: PT
    access: WO
    reset: 0
    bits: '[7:0] x, [15:8] y (0..31): presents the point for one clock; ignored while
      BUSY; reads 0'
  - offset: 1
    name: CLEAR
    access: WO
    reset: 0
    bits: any write zeroes all counts (only when not busy); reads 0
  - offset: 2
    name: RD_SEL
    access: RW
    reset: 0
    bits: '[3:0] direction index k (0..15), [14:8] distance index r = rho + 48 (0..95)'
  - offset: 3
    name: RD_CNT
    access: RO
    reset: 0
    bits: '[15:0] vote count of (k, r), valid a few clocks after RD_SEL is written'
  - offset: 4
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] BUSY: a point is being processed'
timing:
  clock: CLK100MHZ
  baud_rate: 115200
  parameters:
    CLKS_PER_BIT: 868
    TIMEOUT_CYCLES: 100000
  latency:
    point_presentation: One clock per point write.
    busy_interval: Busy asserts on point acceptance and deasserts after all 16 bin
      updates complete.
    readback: RD_CNT is valid a few clocks after RD_SEL is written; exact cycle count
      is unspecified.
resources_expected:
  logic: Small control FSM, fixed-point point projection arithmetic, test-shell interface,
    and address selection logic; exact utilization requires synthesis.
  memory: 1536 bins, with 16 directions by 96 distances; count width and overflow
    behavior are not specified.
  timing: 100 MHz CLK100MHZ target; timing closure requires an implementation report.
assumptions:
- assumption: The target device is xc7a100tcsg324-1.
  reason: This is the device corresponding to the requested Nexys A7-100T board.
- assumption: Point coordinate fields are unsigned 5-bit values.
  reason: The specified coordinate values range from 0 through 31.
- assumption: Accumulator counts are 11 bits wide and repeated coordinates count as
    separate points.
  reason: A 32 by 32 image has 1024 locations, so 11 bits can represent one vote per
    location; duplicate handling and overflow are unspecified.
- assumption: CLKS_PER_BIT defaults to 868 cycles of CLK100MHZ.
  reason: This is the nearest integer divider for 115200 baud from a 100 MHz clock.
- assumption: TIMEOUT_CYCLES defaults to 100000 cycles of CLK100MHZ.
  reason: No timeout value is specified; 100000 cycles is 1 ms at 100 MHz.
- assumption: BUILD_STAMP defaults to the 32-bit integer 1213157719 (0x484F5547).
  reason: This encodes the requested design ID HOUG as ASCII, but the parameter encoding
    is not specified.
- assumption: UART signals use the Nexys A7 master-XDC names UART_TXD_IN and UART_RXD_OUT.
  reason: The request requires the test shell and top-level ports named as in the
    board master XDC.
