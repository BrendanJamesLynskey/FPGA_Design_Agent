# DDS example, coherent tone (brief 19): PINC = 1021 x 2^20, so the 20 low phase bits are zero and the LUT's phase truncation
# produces no error: this flatters the SFDR (115.6 dB at 15 bits). The example in ../dds uses a PINC with every phase bit in use.
name: nco_90db
clock_hz: 100000000
freq_resolution_hz: 0.01     # -> phase width 34 (clock / 2^34 = 0.0058 Hz)
sfdr_db: 90                  # -> output width 15 (6.02 dB per bit)
f_out_hz: 6231689.453125    # 1021 / 16384 of the clock: coherent with the 16384-point record (PINC = 1021 x 2^20, exact)
noise_shaping: None     # Hardware_Parameters mode refuses Auto; PG141: SFDR ~ 6.02 x LUT address bits without dither
n_samples: 16384
sfdr_margin_db: 0
seed: 19
