assumptions:
- text: Reset is generated internally by a 16-clock power-on counter
  reason: the request says rst is held for a few clocks at start but names no reset
    pin
- text: MARCH_PASSES value 0 is treated as 1 pass
  reason: the valid range is 1 to 65535
- text: RAM initial contents come from an RTL initial loop, ROM from $readmemh
  reason: both are loaded at configuration by block RAM INIT
open_questions: []
resolved_questions:
- question: Is the register map exactly as in the table (offsets 0x000 to 0x030, 32-bit,
    reset values and access)?
  answer: Yes, as in registers.map; MARCH_PASSES resets to 1, MARCH_FIRST_ERR to 0xFFFFFFFF,
    others 0
  status: defaulted
  by: default
  default_reason: the request gives offsets but not all reset values
  risk: high
- question: Which background order and which fault does INJECT_FAULT inject?
  answer: Per pass the 0xFFFFFFFF background then the 0x00000000 background so RAM
    ends at zero; the fault flips bit 0 of the read at address 0 once per pass (one
    error per pass)
  status: defaulted
  by: default
  default_reason: the request says one wrong value at one address each pass and that
    RAM ends all zeros
  risk: medium
- question: Do host RAM accesses during BUSY get ignored?
  answer: Yes, reads return 0 and writes are ignored while BUSY
  status: defaulted
  by: default
  default_reason: the RAM belongs to the test engine while it runs
  risk: medium
- question: What do the LEDs show?
  answer: led[0] = BUSY, led[1] = DONE
  status: defaulted
  by: default
  default_reason: not specified
  risk: medium
- question: Does a START while BUSY restart or get ignored?
  answer: Ignored
  status: defaulted
  by: default
  default_reason: not specified
  risk: medium
- question: Does MARCH_ERRS count each wrong read or each wrong word?
  answer: Each wrong read
  status: defaulted
  by: default
  default_reason: '''words that read wrong'' is ambiguous with several read elements
    per pass'
  risk: medium
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
