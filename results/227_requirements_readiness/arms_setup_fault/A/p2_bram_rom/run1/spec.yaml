name: p2_rom_ram_march
title: 'P2: ROM, RAM and a March C- memory test over JTAG register bus'
board: kr260
part: xck26-sfvc784-2LV-c
top: top
clocks:
- name: clk
  freq_mhz: 25
  pin: C3
  note: free-running board clock; all logic and the jtag_bus register port run on
    it
reset:
  name: rst
  model: reprogram
  polarity: active-high
  style: synchronous
  note: every reset is a reconfiguration of the FPGA; registers start from initial
    values; rst for jtag_bus is generated inside top by a power-on counter that holds
    it for 16 clocks after configuration (no reset input port)
parameters:
  ROM_DEPTH: 1024
  RAM_DEPTH: 1024
  DATA_WIDTH: 32
  ADDR_WIDTH: 10
  DESIGN_ID: 546439169
  RAM_INIT_BASE: 3235774464
  POR_CYCLES: 16
  MAX_PASSES: 65535
  FAULT_ADDR: 0
ports:
- name: clk
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx disable, held at 1 (laser off)
behaviour:
  bus:
  - jtag_bus (data/jtag_bus.sv) is instantiated unchanged; its register port h_we,
    h_re, h_addr[11:0], h_wdata, h_rdata is decoded on h_addr[11:2] (byte addresses,
    4-byte steps).
  - A write takes effect the clock after h_we.
  - After h_re, h_rdata shows the addressed register within 2 clocks and holds it
    until the next h_re.
  - Unmapped addresses read 0 and ignore writes.
  common_registers:
  - ID at 0x000 reads 0x20920001.
  - BUILD at 0x004 reads the USR_ACCESSE2 DATA output.
  - SCRATCH at 0x008 is RW, 32 bits, resets to 0.
  rom:
  - ROM is 1024 x 32, initialised with $readmemh from data/rom_init.hex, inferred
    as block RAM, read-only.
  - Reading ROM_DATA returns ROM[MEM_ADDR]; with AUTOINC set, the read then adds 1
    to MEM_ADDR modulo 1024.
  ram:
  - RAM is 1024 x 32 with initial contents word i = 0xC0DE0000 + i, set in the RTL
    initial block so it is defined straight after configuration.
  - Reading or writing RAM_DATA accesses RAM[MEM_ADDR]; with AUTOINC set, each access
    then adds 1 to MEM_ADDR modulo 1024.
  - MEM_ADDR writes use bits 9:0 and reads return the upper bits as 0.
  - While the March test is BUSY the host has no access to the RAM; RAM_DATA reads
    return 0, writes are ignored and MEM_ADDR does not auto-increment.
  march:
  - Writing MARCH_CTRL with START=1 while not BUSY clears MARCH_ERRS, passes completed
    and DONE, sets MARCH_FIRST_ERR to 0xFFFFFFFF and sets BUSY; START reads back 0.
    START while BUSY is ignored.
  - 'Each pass runs March C- twice over the whole RAM: first with background 0xFFFFFFFF,
    then with background 0x00000000, so the RAM ends all zeros.'
  - 'March C- elements: up(w0); up(r0,w1); up(r1,w0); down(r0,w1); down(r1,w0); down(r0),
    where 0 is the background and 1 its complement.'
  - Every read whose value differs from the expected value increments MARCH_ERRS (saturating
    at 0xFFFFFFFF) and the first one since START latches its address in MARCH_FIRST_ERR.
  - After MARCH_PASSES passes complete, BUSY clears, DONE sets and passes completed
    equals MARCH_PASSES. A MARCH_PASSES value of 0 runs 1 pass.
  - INJECT_FAULT=1 flips bit 0 of the value read at address FAULT_ADDR (0) in the
    second element (r0,w1) of the all-zero-background run only, so exactly one wrong
    read occurs per pass.
  leds:
  - led[0] = BUSY, led[1] = DONE.
  sfp:
  - sfp_tx_disable is driven constant 1; no GT channel is used.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546439169
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 value
  - offset: 16
    name: MEM_ADDR
    access: RW
    reset: 0
    bits: 9:0 word address
  - offset: 20
    name: ROM_DATA
    access: RO
    reset: 0
    bits: 31:0 ROM word at MEM_ADDR; AUTOINC read adds 1
  - offset: 24
    name: RAM_DATA
    access: RW
    reset: 0
    bits: 31:0 RAM word at MEM_ADDR; AUTOINC access adds 1
  - offset: 28
    name: MEM_CTRL
    access: RW
    reset: 0
    bits: 0 AUTOINC
  - offset: 32
    name: MARCH_CTRL
    access: RW
    reset: 0
    bits: 0 START (self-clearing), 1 INJECT_FAULT
  - offset: 36
    name: MARCH_PASSES
    access: RW
    reset: 1
    bits: 15:0 passes, 1 to 65535
  - offset: 40
    name: MARCH_STATUS
    access: RO
    reset: 0
    bits: 0 BUSY, 1 DONE, 31:16 passes completed
  - offset: 44
    name: MARCH_ERRS
    access: RO
    reset: 0
    bits: 31:0 error count since START
  - offset: 48
    name: MARCH_FIRST_ERR
    access: RO
    reset: 4294967295
    bits: 31:0 address of first wrong word, 0xFFFFFFFF if none
timing:
  clock_period_ns: 40
  latency:
    register_read: h_rdata valid within 2 clocks after h_re and held
    register_write: effect 1 clock after h_we
    ram_read: RAM_DATA read data captured from block RAM within the 2-clock read window
    march_cycle: one RAM access per clock in the March engine (about 2 x 10 x 1024
      accesses per pass, about 0.8 ms at 25 MHz)
resources_expected:
  bram36: 2 to 3
  lut: under 600
  ff: under 600
  dsp: 0
  gt: 0
