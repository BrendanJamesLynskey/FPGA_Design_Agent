name: p2_rom_ram_march
title: 'P2: ROM, RAM and a March C- memory test'
board: kr260
part: xck26-sfvc784-2LV-c
top: p2_top
clocks:
- name: clk
  pin: C3
  freq: 25 MHz
  role: free-running board clock; every register and memory runs on it
reset:
  name: rst
  model: reprogram
  polarity: active high
  source: internal power-on reset counter, held for 16 clk cycles after configuration
    (no reset pin on the board)
  note: rst is also fed to jtag_bus, which is used unchanged
parameters:
  ROM_DEPTH: 1024
  RAM_DEPTH: 1024
  DATA_WIDTH: 32
  ADDR_WIDTH: 10
  RAM_INIT_BASE: 3235774464
  DESIGN_ID: 546439169
  POR_CYCLES: 16
  MAX_PASSES: 65535
  ROM_INIT_FILE: data/rom_init.hex
ports:
- name: clk
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx disable, driven constant 1 (laser off)
internal_interfaces:
  jtag_bus_register_port:
  - name: h_we
    direction: jtag_bus to core
    width: 1
  - name: h_re
    direction: jtag_bus to core
    width: 1
  - name: h_addr
    direction: jtag_bus to core
    width: 12
    note: byte address
  - name: h_wdata
    direction: jtag_bus to core
    width: 32
  - name: h_rdata
    direction: core to jtag_bus
    width: 32
behaviour:
  host_bus:
  - data/jtag_bus.sv is instantiated unchanged; the host reaches the design only through
    its h_* port (JTAG USER4).
  - All registers are 32 bits on 4-byte steps; decode uses h_addr[11:2].
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds until the
    next h_re.
  - Unmapped addresses read 0 and ignore writes.
  - Read-only registers ignore writes.
  - Read data of ROM_DATA and RAM_DATA is captured at h_re and held, so the auto-increment
    that follows does not change it.
  common_registers:
  - ID (0x000) reads 0x20920001.
  - BUILD (0x004) reads the USR_ACCESSE2 DATA word.
  - SCRATCH (0x008) is 32 bits RW, resets to 0.
  rom:
  - 1024 x 32 ROM inferred as block RAM, initialised by $readmemh from data/rom_init.hex.
  - ROM_DATA read returns ROM[MEM_ADDR]; with AUTOINC set, MEM_ADDR then becomes (MEM_ADDR+1)
    mod 1024.
  ram:
  - 1024 x 32 RAM inferred as block RAM; initial value of word i is 0xC0DE0000 + i,
    applied at configuration (initial block or init file), so it is readable before
    any write.
  - RAM_DATA write stores h_wdata at MEM_ADDR; RAM_DATA read returns RAM[MEM_ADDR].
  - With AUTOINC set, each RAM_DATA read or write then increments MEM_ADDR modulo
    1024.
  - MEM_ADDR is 10 bits; writes to bits 31:10 are ignored and they read 0.
  march:
  - 'March C- sequence per background: up(w0); up(r0,w1); up(r1,w0); down(r0,w1);
    down(r1,w0); down(r0), where 0 and 1 are the background word and its complement.'
  - One pass runs the sequence over all 1024 RAM words with the all-ones background
    first and the all-zeros background second, so the RAM holds all zeros at the end.
  - START (MARCH_CTRL bit 0, self-clearing) clears ERRS, passes completed and DONE,
    sets FIRST_ERR to 0xFFFFFFFF, sets BUSY, and starts MARCH_PASSES passes.
  - Each read is compared with its expected word; a mismatch adds 1 to MARCH_ERRS
    (counts words, saturating at 0xFFFFFFFF) and the first mismatch records its address
    in MARCH_FIRST_ERR.
  - When all passes complete, BUSY clears and DONE sets; passes completed increments
    at the end of each pass.
  - INJECT_FAULT (MARCH_CTRL bit 1) makes the expected word wrong for exactly one
    read, at address 0 of the first r1 element, in each pass, so the error count after
    P injected passes is P.
  - While BUSY the march engine owns the RAM port; host RAM_DATA accesses are ignored
    (writes dropped, reads return 0) and do not auto-increment.
  - START while BUSY is ignored.
  outputs:
  - sfp_tx_disable is 1 at all times; no GT transceiver is used.
  - led[0] shows BUSY; led[1] is 1 when MARCH_ERRS is non-zero.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546439169
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: MEM_ADDR
    access: RW
    reset: 0
    bits: 9:0 word address
  - offset: 20
    name: ROM_DATA
    access: RO
    reset: 0
    bits: 31:0 ROM word at MEM_ADDR; read auto-increments if AUTOINC
  - offset: 24
    name: RAM_DATA
    access: RW
    reset: 0
    bits: 31:0 RAM word at MEM_ADDR; access auto-increments if AUTOINC
  - offset: 28
    name: MEM_CTRL
    access: RW
    reset: 0
    bits: 0 AUTOINC
  - offset: 32
    name: MARCH_CTRL
    access: RW
    reset: 0
    bits: 0 START (self-clearing, reads 0), 1 INJECT_FAULT
  - offset: 36
    name: MARCH_PASSES
    access: RW
    reset: 1
    bits: 15:0 number of passes 1 to 65535
  - offset: 40
    name: MARCH_STATUS
    access: RO
    reset: 0
    bits: 0 BUSY, 1 DONE, 31:16 passes completed
  - offset: 44
    name: MARCH_ERRS
    access: RO
    reset: 0
    bits: 31:0 wrong words since START
  - offset: 48
    name: MARCH_FIRST_ERR
    access: RO
    reset: 4294967295
    bits: 31:0 address of first wrong word, 0xFFFFFFFF if none
timing:
  clock_period: 40 ns
  march_cycles_per_pass: about 20480 RAM accesses per pass (10 per word x 1024 words
    x 2 backgrounds), at most 3 clk each; 200 passes finish in under 0.3 s
  latency:
    host_write: effective 1 clk after h_we
    host_read: h_rdata valid at most 2 clk after h_re and held
    ram_rom_read: 1 clk synchronous block RAM read
    march_access: at most 3 clk per RAM access
resources_expected:
  bram: 2 RAMB36 (ROM 1024x32, RAM 1024x32), or 4 RAMB18
  lut: under 600
  ff: under 600
  dsp: 0
  gt: 0
  other: BSCANE2, USR_ACCESSE2, xpm_cdc in jtag_bus
