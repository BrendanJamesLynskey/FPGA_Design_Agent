assumptions:
- text: The part is xck26-sfvc784-2LV-c.
  reason: K26 SOM on the KR260.
- text: A power-on reset counter generates rst internally.
  reason: No reset pin is specified and jtag_bus needs rst held a few clocks.
- text: BRAM initial contents come from $readmemh (ROM) and an initial loop or init
    (RAM).
  reason: Request requires defined contents at configuration.
- text: jtag_bus simulation stubs are not needed; tests drive h_* directly.
  reason: Stated in the request.
open_questions: []
resolved_questions:
- question: Does each pass run March C- once per background (all-ones, then all-zeros),
    or once with a single background?
  answer: Each pass runs March C- twice, all-ones background first and all-zeros second,
    so the RAM ends at zero.
  status: defaulted
  by: default
  default_reason: The request names both backgrounds and requires all zeros at the
    end.
  risk: medium
- question: Where and how often does INJECT_FAULT corrupt a comparison?
  answer: One wrong expected value at address 0 on the first r1 element of each pass,
    so errors = passes.
  status: defaulted
  by: default
  default_reason: The request says one wrong value at one address each pass.
  risk: medium
- question: What happens if MARCH_PASSES is 0 at START?
  answer: Treated as 1 pass.
  status: defaulted
  by: default
  default_reason: The request allows 1 to 65535 only.
  risk: high
- question: Can the host access RAM_DATA while the march is BUSY?
  answer: 'No: accesses are ignored (reads 0, writes dropped, no auto-increment) while
    BUSY.'
  status: defaulted
  by: default
  default_reason: The march engine owns the single RAM port.
  risk: medium
- question: What do the LEDs show?
  answer: led[0] = BUSY, led[1] = MARCH_ERRS non-zero.
  status: defaulted
  by: default
  default_reason: The request names the LEDs but gives them no function.
  risk: medium
- question: Is the register map exactly as given in the request?
  answer: 'Yes: offsets 0x000 to 0x008 and 0x010 to 0x030 as listed, reset values
    as in registers.map, MARCH_PASSES resets to 1.'
  status: defaulted
  by: default
  default_reason: Offsets are given; reset values of some registers are not.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
