name: p2_rom_ram_march
title: 'P2: ROM, RAM and a March C- memory test over JTAG register bus'
board: kr260
part: xck26-sfvc784-2LV-c
top: p2_top
clocks:
- name: clk
  pin: C3
  freq_mhz: 25
  note: free-running board clock, drives jtag_bus and all logic (single clock domain)
reset:
  model: reprogram
  name: rst
  polarity: active_high
  note: no reset pin; every reset is a reconfiguration of the FPGA. An internal power-on
    counter holds rst (the jtag_bus input) high for 8 clocks after configuration,
    synchronous
parameters:
  ROM_DEPTH: 1024
  RAM_DEPTH: 1024
  DATA_WIDTH: 32
  ADDR_WIDTH: 10
  POR_CYCLES: 8
  FAULT_ADDR: 677
  RAM_INIT_BASE: 3235774464
  DESIGN_ID: 546439169
ports:
- name: clk
  direction: in
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]; led[0]=BUSY, led[1]=DONE
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ TX disable, constant 1 (laser off)
behaviour:
  jtag_bus:
  - data/jtag_bus.sv is instantiated unchanged; its register port h_we, h_re, h_addr[11:0],
    h_wdata, h_rdata is in the clk domain.
  - A write takes effect the clock after h_we. After h_re, h_rdata shows the addressed
    register within 2 clocks and holds it.
  - Unmapped addresses read 0 and ignore writes.
  common_regs:
  - ID (0x000) reads 0x20920001.
  - BUILD (0x004) reads the USR_ACCESSE2 DATA word.
  - SCRATCH (0x008) is a 32-bit RW register that resets to 0.
  rom:
  - ROM is 1024 x 32 bits, initialised with $readmemh from data/rom_init.hex, read
    only.
  - A read of ROM_DATA returns ROM[MEM_ADDR]. If AUTOINC=1, MEM_ADDR then increments
    by 1, wrapping 1023 to 0.
  ram:
  - RAM is 1024 x 32 bits. At configuration word i holds 0xC0DE0000 + i (initial value
    in the RTL, defined before any write).
  - A read of RAM_DATA returns RAM[MEM_ADDR]. A write stores h_wdata at RAM[MEM_ADDR].
    With AUTOINC=1, MEM_ADDR increments by 1 after each access, wrapping 1023 to 0.
  - While the March test is BUSY, host RAM accesses are ignored (reads return 0, writes
    dropped, no auto-increment).
  march:
  - Writing MARCH_CTRL.START=1 clears MARCH_ERRS, passes completed and DONE, sets
    MARCH_FIRST_ERR to 0xFFFFFFFF, sets BUSY, and START self-clears.
  - One pass runs March C- over all 1024 RAM words with the all-zero background, then
    again with the all-one background.
  - 'March C- elements per background (d = background, ~d = complement): up w(d);
    up r(d) w(~d); up r(~d) w(d); down r(d) w(~d); down r(~d) w(d); either r(d).'
  - Each read whose data differs from the expected value adds 1 to MARCH_ERRS (saturating
    at 0xFFFFFFFF). The first mismatch of a run latches its address into MARCH_FIRST_ERR.
  - INJECT_FAULT=1 inverts the data of the first read of address FAULT_ADDR in the
    all-zero background of each pass, so exactly one wrong read occurs per pass.
  - After MARCH_PASSES passes, BUSY clears and DONE sets. Passes completed increments
    at the end of each pass. RAM finishes all zeros.
  - MARCH_PASSES of 0 is treated as 1.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546439169
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: MEM_ADDR
    access: RW
    reset: 0
    bits: 9:0 word address; 31:10 read 0
  - offset: 20
    name: ROM_DATA
    access: RO
    reset: 0
    bits: 31:0 ROM[MEM_ADDR], AUTOINC on read
  - offset: 24
    name: RAM_DATA
    access: RW
    reset: 0
    bits: 31:0 RAM[MEM_ADDR], AUTOINC on access
  - offset: 28
    name: MEM_CTRL
    access: RW
    reset: 0
    bits: 0 AUTOINC
  - offset: 32
    name: MARCH_CTRL
    access: RW
    reset: 0
    bits: 0 START (self-clearing, reads 0); 1 INJECT_FAULT
  - offset: 36
    name: MARCH_PASSES
    access: RW
    reset: 1
    bits: 15:0 number of passes 1..65535
  - offset: 40
    name: MARCH_STATUS
    access: RO
    reset: 0
    bits: 0 BUSY; 1 DONE; 31:16 passes completed
  - offset: 44
    name: MARCH_ERRS
    access: RO
    reset: 0
    bits: 31:0 wrong words since START
  - offset: 48
    name: MARCH_FIRST_ERR
    access: RO
    reset: 4294967295
    bits: 31:0 address of first wrong word, 0xFFFFFFFF if none
timing:
  clock_period_ns: 40
  march_cycles_per_pass: 2 backgrounds x 10 operations x 1024 words, about 20480 clocks
    plus overhead per background (1 op per clock)
  latency:
    write: register takes effect 1 clock after h_we
    read: h_rdata valid 2 clocks after h_re and held
    bram_read: 1 clock synchronous read inside the read window
    march_op: one RAM read or write per clock, pipelined read-compare
resources_expected:
  bram36: 2 ROM (1024x32 = 32 kbit) + 1 RAM, about 2 to 3 RAMB36 total
  lut: under 500
  ff: under 500
  dsp: 0
  gt: 0
assumptions:
- text: single 25 MHz clk, no external reset; power-on reset generated internally
  reason: board has only the C3 clock; jtag_bus needs rst held a few clocks
- text: led[0] shows BUSY and led[1] shows DONE
  reason: request does not assign the LEDs
- text: BUILD reads 0 in simulation
  reason: USR_ACCESSE2 exists only in hardware
- text: sfp_tx_disable is constantly 1 and no GT is used
  reason: request
- text: MARCH_PASSES resets to 1
  reason: keeps START valid without a prior write
open_questions: []
