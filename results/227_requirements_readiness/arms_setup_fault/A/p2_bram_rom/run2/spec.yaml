resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: The map in registers.map, taken from the table in the request (0x000-0x008
    common, 0x010-0x030 memory and March), all 32-bit, 4-byte steps.
  status: defaulted
  by: default
  default_reason: the request lists offsets, but the harness copies any answered map
    into registers.map
  risk: high
- question: Does the host access to RAM or MEM_ADDR during a running March test have
    to work?
  answer: Ignored while BUSY (reads 0, writes dropped, no auto-increment).
  status: defaulted
  by: default
  default_reason: the March engine owns the RAM port
  risk: high
- question: How many errors does INJECT_FAULT produce per pass, and at which address?
  answer: One wrong read per pass at address 677 (0x2A5), in the all-zero background,
    so 3 passes give MARCH_ERRS=3 and MARCH_FIRST_ERR=0x2A5.
  status: defaulted
  by: default
  default_reason: request says one wrong value at one address each pass but not which
  risk: high
- question: What does MARCH_PASSES = 0 do?
  answer: Treated as 1 pass.
  status: defaulted
  by: default
  default_reason: the request gives range 1 to 65,535 only
  risk: medium
- question: Does a pass cover both backgrounds?
  answer: Yes, a pass is the March C- run with the all-zero background followed by
    the all-one background.
  status: defaulted
  by: default
  default_reason: the request says both backgrounds but not how they map to passes
  risk: medium
- question: Does ROM_DATA auto-increment when the host reads while MEM_CTRL.AUTOINC=1
    and does a write to RAM_DATA read-modify the address after the write?
  answer: ROM_DATA read and RAM_DATA read or write each add 1 to MEM_ADDR after the
    access, using the pre-increment address for data.
  status: defaulted
  by: default
  default_reason: order of data and increment is implied but not stated
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input.'
  status: defaulted
  by: default
  default_reason: With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration
  risk: high
