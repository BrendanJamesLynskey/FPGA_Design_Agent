name: freq_meter
title: 'P1: clock frequency meter (C3 25 MHz clock measured against the 156.25 MHz
  SFP+ GT reference clock)'
board: kr260
part: xck26-sfvc784-2LV-c
top: freq_meter_top
interfaces: {}
clocks:
- name: clk_ref
  role: MGTREFCLK0 of the SFP+ quad, differential 156.25 MHz, via IBUFDS_GTE4 (ODIV2
    output) and BUFG_GT; the ruler, and the register bus clock
  freq_mhz: 156.25
  period_ns: 6.4
- name: clk_c3
  role: 25 MHz clock on pin C3 (the clock under test), via IBUF and BUFG
  freq_mhz: 25
  period_ns: 40.0
reset:
  model: reprogram
  name: rst
  polarity: active_high
  type: synchronous
  description: 'Every reset is a reconfiguration of the FPGA: registers start from
    their initial values and the design has no reset input pin. An internal rst for
    jtag_bus is generated in the clk_ref domain, held for at least 8 clk_ref cycles
    after configuration, then released. Registers on clk_c3 get a synchronised copy.'
parameters:
  DEFAULT_GATE_LEN: 156250000
  MIN_GATE_LEN: 1000
  REG_WIDTH: 32
  DESIGN_ID: 546373633
  LED_REF_HALF_PERIOD_CYCLES: 78125000
  LED_C3_HALF_PERIOD_CYCLES: 12500000
  RST_HOLD_CYCLES: 8
ports:
- name: clk_ref_p
  direction: input
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 P (156.25 MHz)
- name: clk_ref_n
  direction: input
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 N
- name: clk_c3
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]; led[0] from clk_c3, led[1] from clk_ref
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx_disable, constant 1 (laser off)
- name: h_we
  direction: internal
  width: 1
  board_pin_role: register port from jtag_bus, write pulse (not a pin)
- name: h_re
  direction: internal
  width: 1
  board_pin_role: register port, read pulse (not a pin)
- name: h_addr
  direction: internal
  width: 12
  board_pin_role: register port, byte address (not a pin)
- name: h_wdata
  direction: internal
  width: 32
  board_pin_role: register port, write data (not a pin)
- name: h_rdata
  direction: internal
  width: 32
  board_pin_role: register port, read data (not a pin)
behaviour:
  host_interface:
  - data/jtag_bus.sv is instantiated unchanged (BSCANE2 USER4); the design implements
    the register port in the clk_ref domain.
  - A write takes effect one clk_ref cycle after h_we.
  - h_rdata shows the addressed register within 2 clk_ref cycles after h_re and holds
    it.
  - Unmapped addresses read 0 and ignore writes; writes to RO registers are ignored.
  - All registers are 32 bits on 4-byte steps; the address is decoded on h_addr[11:2].
  common_registers:
  - ID (0x000) reads 0x20910001.
  - BUILD (0x004) reads the USR_ACCESSE2 DATA word.
  - SCRATCH (0x008) reads back the last value written and resets to 0.
  measurement:
  - Writing CTRL.START=1 while not busy clears DONE, latches GATE_LEN, sets BUSY and
    starts one measurement.
  - START written while BUSY is ignored.
  - The gate is open for exactly GATE_LEN clk_ref cycles; GATE_ACTUAL counts those
    cycles.
  - COUNT counts rising edges of clk_c3 seen while the gate is open, the gate being
    synchronised into the clk_c3 domain.
  - At the end of the gate COUNT and GATE_ACTUAL are captured, MEAS_DONE increments
    by 1, DONE is set and BUSY is cleared.
  - CTRL.START is self-clearing and reads 0.
  - A GATE_LEN below MIN_GATE_LEN is clamped to MIN_GATE_LEN when the measurement
    starts.
  leds:
  - led[0] toggles every LED_C3_HALF_PERIOD_CYCLES clk_c3 cycles (1 Hz blink) when
    CTRL.LED_EN=1.
  - led[1] toggles every LED_REF_HALF_PERIOD_CYCLES clk_ref cycles (1 Hz blink) when
    CTRL.LED_EN=1.
  - Both LEDs are 0 when CTRL.LED_EN=0, including after reset (LED_EN resets to 0).
  sfp:
  - sfp_tx_disable is driven to constant 1; no GT transceiver channel is used, only
    the GT reference clock buffer.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546373633
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESSE2 word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] scratch'
  - offset: 16
    name: GATE_LEN
    access: RW
    reset: 156250000
    bits: '[31:0] gate length in clk_ref cycles'
  - offset: 20
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] START self-clearing, ignored while busy; [1] LED_EN'
  - offset: 24
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] BUSY; [1] DONE (cleared by START, set when results valid)'
  - offset: 28
    name: COUNT
    access: RO
    reset: 0
    bits: '[31:0] clk_c3 rising edges in last completed gate'
  - offset: 32
    name: GATE_ACTUAL
    access: RO
    reset: 0
    bits: '[31:0] clk_ref cycles in last completed gate'
  - offset: 36
    name: MEAS_DONE
    access: RO
    reset: 0
    bits: '[31:0] completed measurements since configuration'
timing:
  gate_cycles: GATE_LEN clk_ref cycles (default 156250000, 1 s)
  max_measurement_time: GATE_LEN + at most 16 clk_ref cycles of synchroniser and capture
    overhead
  latency:
    write_to_effect: 1 clk_ref cycle after h_we
    read_to_data: at most 2 clk_ref cycles after h_re, held until the next read
    start_to_busy: BUSY is 1 within 2 clk_ref cycles of the START write
    gate_to_done: DONE is set within 16 clk_ref cycles after the gate closes
  accuracy: frequency = COUNT * 156.25 MHz / GATE_ACTUAL; counting resolution is plus
    or minus 1 clk_c3 edge per gate (0.04 ppm at 1 s)
resources_expected:
  luts: under 400
  ffs: under 500
  bram: 0
  dsp: 0
  bufg: 2 (BUFG_GT for clk_ref, BUFG for clk_c3)
  gt_channels: 0
