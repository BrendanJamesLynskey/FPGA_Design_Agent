assumptions:
- assumption: The register bus clock is clk_ref (156.25 MHz GT reference clock through
    IBUFDS_GTE4 and BUFG_GT).
  reason: The request wants a free-running clock for jtag_bus, and the reference is
    the trusted, always-present clock that also times the gate.
- assumption: clk_c3 is treated as asynchronous to clk_ref; gate and results cross
    with synchronisers and toggle handshakes.
  reason: The two crystals are independent.
- assumption: Counters are 32 bits; GATE_LEN up to 2^32-1 is valid.
  reason: Registers are 32 bits and COUNT never exceeds GATE_LEN because clk_c3 is
    slower than clk_ref.
- assumption: MEAS_DONE, COUNT, GATE_ACTUAL and DONE start at 0 after configuration;
    the first measurement happens after configuration.
  reason: The request says 'since configuration'.
- assumption: Writes to GATE_LEN while BUSY do not affect the running measurement
    (value latched at START).
  reason: A stable gate length keeps GATE_ACTUAL equal to the gate asked for.
- assumption: The C3 and SFP reference pin locations come from the KR260 board file.
  reason: The request names the pins only by role.
open_questions: []
resolved_questions:
- question: What gate length should a GATE_LEN below 1000 produce?
  answer: Clamp to 1000 at START
  status: defaulted
  by: default
  default_reason: The request gives a minimum of 1000 but not what happens below it;
    clamping always yields a valid measurement, and GATE_ACTUAL then reports the length
    actually used.
  risk: high
- question: Should GATE_LEN written during a measurement take effect?
  answer: No, latched at START; the new value applies to the next measurement
  status: defaulted
  by: default
  default_reason: Keeps GATE_ACTUAL equal to the gate of that measurement.
  risk: high
- question: Is a LED blink duty of 50 percent with toggling every half second acceptable
    for 'about 1 Hz'?
  answer: Yes, 50 percent duty, 1 Hz
  status: defaulted
  by: default
  default_reason: Simplest and visibly 1 Hz.
  risk: medium
- question: Is reading COUNT, GATE_ACTUAL or STATUS while BUSY allowed, and what do
    they return?
  answer: They return the last completed values (zero before the first measurement);
    DONE reads 0 while BUSY
  status: defaulted
  by: default
  default_reason: Results are registered on completion only, so reads never see a
    partial value.
  risk: medium
- question: Please confirm the register map (offset, width, reset value and access
    of every register).
  answer: 'As in registers.map: 0x000 ID RO, 0x004 BUILD RO, 0x008 SCRATCH RW, 0x010
    GATE_LEN RW, 0x014 CTRL RW, 0x018 STATUS RO, 0x01C COUNT RO, 0x020 GATE_ACTUAL
    RO, 0x024 MEAS_DONE RO, all 32 bits'
  status: defaulted
  by: default
  default_reason: Taken from the request table; confirmed so the host script and the
    RTL agree.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA, or does something restart the running design?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input.'
  status: defaulted
  by: default
  default_reason: With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration.
  risk: high
