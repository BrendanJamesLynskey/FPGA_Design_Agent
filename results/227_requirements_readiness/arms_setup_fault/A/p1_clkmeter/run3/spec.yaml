resolved_questions:
- question: Which pins and clock buffer configuration give the SFP+ MGTREFCLK0 (156.25
    MHz) as a fabric clock (IBUFDS_GTE4 ODIV2 divide and BUFG_GT)?
  answer: IBUFDS_GTE4 with ODIV2 undivided (REFCLK_HROW_CK_SEL=00) into BUFG_GT with
    divide 1; pins from the KR260 board file.
  status: defaulted
  by: default
  default_reason: The request names the clock but not pins or the buffer path; the
    fabric clock must be exactly 156.25 MHz.
  risk: high
- question: What happens when GATE_LEN is written below 1000?
  answer: Clamp to 1000 (read back shows 1000).
  status: defaulted
  by: default
  default_reason: Request says minimum 1,000 but not the behaviour below it.
  risk: high
- question: Is GATE_LEN writable while BUSY, and does it affect the running gate?
  answer: Writable any time; the value is latched at START so the running gate is
    not changed.
  status: defaulted
  by: default
  default_reason: Not stated; latching makes GATE_ACTUAL equal the gate in force at
    START.
  risk: high
- question: Do LED_EN and GATE_LEN keep their values after a measurement, and does
    MEAS_DONE reset only with rst?
  answer: Yes, they hold; MEAS_DONE resets only on rst (power-on).
  status: defaulted
  by: default
  default_reason: '''Since configuration'' is read as since power-on reset.'
  risk: high
- question: What do COUNT and GATE_ACTUAL read before any measurement completes?
  answer: '0'
  status: defaulted
  by: default
  default_reason: Reset value not given.
  risk: medium
- question: Does the LED blink phase restart when LED_EN goes 0 to 1?
  answer: No, free-running counters; LED_EN only gates the output.
  status: defaulted
  by: default
  default_reason: Simplest and keeps both clocks visibly alive.
  risk: high
- question: Is a write to the read-only registers or unmapped addresses ignored with
    no error?
  answer: Ignored, reads of unmapped addresses return 0.
  status: defaulted
  by: default
  default_reason: Request states unmapped addresses read 0 and ignore writes; read-only
    writes are not stated.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA, or does something restart the running design?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, and the design has no reset input.'
  status: defaulted
  by: default
  default_reason: With no reset input, a register starts only from its initial value
    loaded at configuration.
  risk: high
