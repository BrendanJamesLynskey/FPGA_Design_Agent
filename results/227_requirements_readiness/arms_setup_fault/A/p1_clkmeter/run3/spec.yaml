name: p1_freq_meter
title: 'P1: clock frequency meter (C3 25 MHz clock measured against the 156.25 MHz
  SFP+ GT reference clock)'
board: kr260
part: xck26-sfvc784-2LV-c
top: freq_meter_top
clocks:
- name: clk_ref
  source: MGTREFCLK0 of the SFP+ quad via IBUFDS_GTE4 (ODIV2 output) then BUFG_GT
  freq_mhz: 156.25
  role: ruler, register bus clock (clk of jtag_bus), gate counter, ref LED
- name: clk_c3
  source: 25 MHz single-ended clock on pin C3 via IBUF/BUFG
  freq_mhz: 25
  role: clock under test, edge counter, c3 LED
reset:
  model: reprogram
  name: rst
  polarity: active_high
  type: synchronous
  domain: clk_ref
  description: 'Every reset is a reconfiguration of the FPGA; registers start from
    initial values. rst for jtag_bus is generated inside the design: power-on hold
    of at least 16 clk_ref cycles, released synchronously. There is no external reset
    pin.'
parameters:
  REF_FREQ_CYCLES_PER_SEC: 156250000
  GATE_LEN_DEFAULT: 156250000
  GATE_LEN_MIN: 1000
  LED_REF_HALF_PERIOD_CYCLES: 78125000
  LED_C3_HALF_PERIOD_CYCLES: 12500000
  DESIGN_ID: 546373633
  RESET_HOLD_CYCLES: 16
  SYNC_STAGES: 2
ports:
- name: gtrefclk_p
  direction: input
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 positive (156.25 MHz)
- name: gtrefclk_n
  direction: input
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 negative
- name: clk25_c3
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
behaviour:
  register_bus:
  - Uses data/jtag_bus.sv unchanged, instantiated with clk=clk_ref and rst; design
    side is h_we, h_re, h_addr[11:0], h_wdata[31:0], h_rdata[31:0].
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes. All registers are 32 bits on 4-byte
    steps.
  - ID at 0x000 reads 0x20910001. BUILD at 0x004 reads the USR_ACCESSE2 word. SCRATCH
    at 0x008 is RW and resets to 0.
  measurement:
  - Writing CTRL.START=1 while not BUSY clears DONE, sets BUSY, latches GATE_LEN and
    opens a gate of exactly GATE_LEN clk_ref cycles.
  - START written while BUSY is ignored.
  - During the gate, rising edges of clk_c3 are counted in the clk_c3 domain; the
    gate level is synchronised into clk_c3 and the count is captured on its falling
    edge.
  - At the end of the gate COUNT and GATE_ACTUAL are updated, MEAS_DONE increments
    by 1, DONE is set and BUSY is cleared.
  - GATE_ACTUAL equals the latched gate length (count of clk_ref cycles with the gate
    open).
  - COUNT and GATE_ACTUAL hold their last completed values until the next measurement
    completes.
  - GATE_LEN writes below 1000 are clamped to 1000.
  - START bit is self-clearing and reads 0.
  leds:
  - led[0] toggles every 12,500,000 clk_c3 cycles (about 1 Hz) when LED_EN=1.
  - led[1] toggles every 78,125,000 clk_ref cycles (about 1 Hz) when LED_EN=1.
  - Both LEDs are 0 when LED_EN=0 and after reset.
  sfp:
  - sfp_tx_disable is driven to constant 1; no GT transceiver channel is used, only
    the GT reference clock buffer.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546373633
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESSE2 word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] scratch'
  - offset: 16
    name: GATE_LEN
    access: RW
    reset: 156250000
    bits: '[31:0] gate length in clk_ref cycles (156250000), minimum 1000'
  - offset: 20
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] START self-clearing, ignored while busy; [1] LED_EN'
  - offset: 24
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] BUSY; [1] DONE'
  - offset: 28
    name: COUNT
    access: RO
    reset: 0
    bits: '[31:0] clk_c3 rising edges in last completed gate'
  - offset: 32
    name: GATE_ACTUAL
    access: RO
    reset: 0
    bits: '[31:0] clk_ref cycles in last completed gate'
  - offset: 36
    name: MEAS_DONE
    access: RO
    reset: 0
    bits: '[31:0] completed measurements since reset'
timing:
  gate: GATE_LEN clk_ref cycles (156250000 = 1 s at 156.25 MHz)
  led_period: about 1 s each
  latency:
    register_read: h_rdata valid within 2 clk_ref cycles of h_re
    register_write: effect 1 clk_ref cycle after h_we
    measurement_done: DONE set GATE_LEN plus at most 8 clk_ref cycles after START
      (CDC return)
  cdc: gate level ref->c3 through 2-FF synchroniser; count and done toggle c3->ref
    via handshake, count held stable until acknowledged
resources_expected:
  luts: under 400
  ffs: under 600
  bram: 0
  dsp: 0
  bufg: 2
  gt_channels: 0
assumptions:
- text: Gate is opened and closed in clk_ref; C3 edge count error is at most +/-1
    edge.
  reason: Asynchronous clocks; 1 edge in 25e6 is 0.04 ppm, well under the 100 ppm
    check.
- text: clk_ref is also the register bus clock and is free-running after configuration.
  reason: jtag_bus needs a free-running clk; the GT reference clock is always present.
- text: COUNT is 32 bits wide, enough for gate lengths up to 2^32-1 reference cycles.
  reason: Registers are 32 bits.
- text: Internal reset is power-on generated; no external reset pin.
  reason: Board has no reset pin requested by the spec.
- text: BUILD is sampled from USR_ACCESSE2 and may be registered in clk_ref.
  reason: Value is static after configuration.
open_questions: []
