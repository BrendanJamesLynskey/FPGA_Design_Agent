name: p1_freq_meter
title: 'P1 clock frequency meter: 25 MHz C3 clock measured against the 156.25 MHz
  SFP GT reference clock'
board: kr260
part: xck26-sfvc784-2LV-c
top: freq_meter_top
clocks:
- name: ref_clk
  role: 156.25 MHz SFP+ GT reference clock MGTREFCLK0 (differential pair, IBUFDS_GTE4
    then BUFG_GT); the ruler and the register-bus clk
  freq_mhz: 156.25
- name: c3_clk
  role: 25 MHz clock on pin C3 (measured; single-ended input, BUFG)
  freq_mhz: 25
reset:
  model: reprogram
  name: rst
  polarity: active_high
  description: Every reset is a reconfiguration of the FPGA, so registers start from
    their initial values and the design has no reset input pin. The rst given to jtag_bus
    is an internal power-up shift register (initial value all ones, 8 ref_clk cycles)
    so that jtag_bus sees rst held for a few clocks at start.
parameters:
  GATE_LEN_DEFAULT: 156250000
  GATE_LEN_MIN: 1000
  DESIGN_ID: 546373633
  LED_HALF_PERIOD_C3_CYCLES: 12500000
  LED_HALF_PERIOD_REF_CYCLES: 78125000
  RST_HOLD_CYCLES: 8
  READ_LATENCY_CYCLES: 1
ports:
- name: sfp_refclk_p
  direction: input
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 positive (156.25 MHz)
- name: sfp_refclk_n
  direction: input
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 negative
- name: clk25_c3
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]; led[0] from C3 clock, led[1] from reference
    clock
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
behaviour:
  bus:
  - jtag_bus (data/jtag_bus.sv, unchanged) is instantiated on ref_clk and gives h_we,
    h_re, h_addr[11:0], h_wdata[31:0]; the design returns h_rdata[31:0].
  - A write takes effect the clock after h_we. h_rdata shows the addressed register
    within 1 clock of h_re and holds it until the next h_re.
  - Unmapped addresses (including unaligned h_addr[1:0] != 0) read 0 and ignore writes.
    Writes to RO registers are ignored.
  common_registers:
  - ID (0x000) reads 0x20910001. BUILD (0x004) reads the USR_ACCESSE2 DATA word. SCRATCH
    (0x008) is RW 32 bits, initial value 0.
  measurement:
  - Writing CTRL.START=1 while not BUSY clears DONE, sets BUSY and starts a gate of
    GATE_LEN ref_clk cycles; START written while BUSY is ignored.
  - START is self-clearing and always reads 0.
  - During the gate a counter in the c3_clk domain counts rising edges of c3_clk;
    the gate-open and gate-close signals cross from ref_clk to c3_clk through synchronisers,
    and the gate-actual count is measured in ref_clk between the same events seen
    from the ref_clk side.
  - At the end COUNT, GATE_ACTUAL are latched, MEAS_DONE increments by 1, BUSY clears
    and DONE sets in the same clock.
  - GATE_ACTUAL equals GATE_LEN exactly.
  - GATE_LEN written below 1000 is clamped to 1000 (value read back is the clamped
    value). GATE_LEN writes while BUSY are ignored.
  - MEAS_DONE counts completed measurements since configuration (initial value 0)
    and wraps at 2^32.
  leds:
  - 'LED_EN (CTRL bit 1, initial value 0) gates both LEDs: when 0 both LEDs are off;
    LEDs are off after reset.'
  - led[0] toggles every 12,500,000 c3_clk cycles (1 Hz blink); led[1] toggles every
    78,125,000 ref_clk cycles (1 Hz blink). LED_EN is synchronised into the c3_clk
    domain. The blink counters free-run; only the outputs are gated.
  sfp:
  - sfp_tx_disable is driven constant 1; no GT transceiver channel is used, only the
    GT reference clock buffer.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546373633
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESSE2 word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] scratch'
  - offset: 16
    name: GATE_LEN
    access: RW
    reset: 156250000
    bits: '[31:0] gate length in ref_clk cycles, min 1000'
  - offset: 20
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] START self-clearing, ignored while BUSY; [1] LED_EN'
  - offset: 24
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] BUSY; [1] DONE'
  - offset: 28
    name: COUNT
    access: RO
    reset: 0
    bits: '[31:0] c3_clk rising edges in last completed gate'
  - offset: 32
    name: GATE_ACTUAL
    access: RO
    reset: 0
    bits: '[31:0] ref_clk cycles in last completed gate'
  - offset: 36
    name: MEAS_DONE
    access: RO
    reset: 0
    bits: '[31:0] completed measurements'
timing:
  gate: GATE_LEN ref_clk cycles (156,250,000 = 1 s at 156.25 MHz)
  latency:
    register_read: h_rdata valid 1 ref_clk after h_re (limit 2)
    register_write: effect 1 ref_clk after h_we
    start_to_busy: BUSY set 1 ref_clk after the START write
    result_valid: COUNT and GATE_ACTUAL valid when DONE=1; DONE set within 4 ref_clk
      plus 3 c3_clk of gate end
  accuracy: COUNT is within +-2 edges of GATE_LEN*25e6/156.25e6 plus the true frequency
    offset (synchroniser uncertainty); 100 ppm at 1 s is 2500 counts
  cdc: c3_clk domain only sees gate and LED_EN through 2-flop synchronisers; COUNT
    returns to ref_clk after gate close via a handshake
resources_expected:
  lut: 300
  ff: 400
  bram: 0
  dsp: 0
  bufg: 2
  gt_refclk_buf: 1
  usr_access: 1
  power: negligible
