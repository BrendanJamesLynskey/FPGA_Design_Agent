assumptions:
- assumption: Register bus clk is the 156.25 MHz reference clock through IBUFDS_GTE4
    and BUFG_GT
  reason: the ruler clock is the only trusted free-running clock; sharing it avoids
    an extra crossing for the bus
- assumption: Every reset is a reconfiguration of the FPGA; the rst fed to jtag_bus
    comes from an 8-clock power-up shift register
  reason: no reset pin is specified and jtag_bus needs rst held a few clocks
- assumption: Gate-open/close edges in ref_clk cross to c3_clk with 2-flop synchronisers,
    so COUNT has up to +-2 edge uncertainty
  reason: unavoidable CDC jitter, negligible against 100 ppm at 1 s (2500 counts)
    and covered for short gates in the tests
- assumption: Simulation tests the register port directly, with jtag_bus excluded
  reason: request states it contains Xilinx primitives
- assumption: Pin C3 is a 1.8 V or 3.3 V LVCMOS clock input as the board file lists;
    constraints come from the board file
  reason: voltage not given in the request
- assumption: In simulation BUILD reads from a stub of USR_ACCESSE2
  reason: primitive is not simulated
open_questions: []
resolved_questions:
- question: Please give the register map (offset, width, reset value and access of
    every register).
  answer: 'The map in the request: ID 0x000 RO, BUILD 0x004 RO, SCRATCH 0x008 RW,
    GATE_LEN 0x010 RW (reset 156250000), CTRL 0x014 RW, STATUS 0x018 RO, COUNT 0x01C
    RO, GATE_ACTUAL 0x020 RO, MEAS_DONE 0x024 RO, all 32 bits'
  status: defaulted
  by: default
  default_reason: the request gives offsets, confirmed here for the harness
  risk: high
- question: Is the GATE_LEN below the minimum clamped to 1000 or is the write ignored?
  answer: Clamp to 1000
  status: defaulted
  by: default
  default_reason: request states minimum 1000 but not the out-of-range behaviour
  risk: medium
- question: Can GATE_LEN be written while BUSY, and does it affect the running gate?
  answer: Writes while BUSY are ignored
  status: defaulted
  by: default
  default_reason: keeps GATE_ACTUAL equal to the gate that ran
  risk: high
- question: Does MEAS_DONE clear on reset only?
  answer: Cleared only by reset (configuration), wraps at 2^32
  status: defaulted
  by: default
  default_reason: no clear control is listed
  risk: high
- question: Does LED blink phase restart when LED_EN is turned on?
  answer: No, the LED counters free-run; only the outputs are gated
  status: defaulted
  by: default
  default_reason: simpler, about 1 Hz is enough
  risk: medium
- question: Which single-ended or differential I/O standards for C3 and the GT refclk?
  answer: Take them from the KR260 board file; refclk via IBUFDS_GTE4
  status: defaulted
  by: default
  default_reason: not stated in the request
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
