name: crc32_engine
title: 'P3: Ethernet CRC-32 engine with JTAG register bus'
board: kr260
part: xck26-sfvc784-2LV-c
top: crc32_top
clocks:
- name: clk_in
  pin_role: 25 MHz board clock, pin C3
  freq_mhz: 25
- name: clk
  source: MMCM from clk_in
  freq_mhz: 100
  note: free-running design clock, drives jtag_bus and all logic; 4 bytes per clock
    = 400 MB/s
reset:
  model: reprogram
  note: Every reset is a reconfiguration of the FPGA; registers take initial values
    at configuration and the design has no reset input port. An internal rst for jtag_bus
    is derived from MMCM lock and held at least 8 clk cycles after lock.
parameters:
  DESIGN_ID: 546504705
  DATA_WIDTH: 32
  RST_HOLD_CYCLES: 16
  CLK_FREQ_MHZ_INFO: 100
ports:
- name: clk_in
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
- name: jtag_bus.h_we
  direction: internal
  width: 1
  board_pin_role: register port write pulse (from data/jtag_bus.sv, BSCANE2 USER4,
    unchanged)
- name: jtag_bus.h_re
  direction: internal
  width: 1
  board_pin_role: register port read pulse
- name: jtag_bus.h_addr
  direction: internal
  width: 12
  board_pin_role: byte address
- name: jtag_bus.h_wdata
  direction: internal
  width: 32
  board_pin_role: write data
- name: jtag_bus.h_rdata
  direction: internal
  width: 32
  board_pin_role: read data, valid within 2 clk of h_re and held
behaviour:
  crc:
  - CRC-32 reflected, polynomial 0x04C11DB7 (reflected 0xEDB88320), init 0xFFFFFFFF,
    final XOR 0xFFFFFFFF; equals zlib.crc32 of the bytes in push order.
  - PUSH4 write consumes bits 7:0 first, then 15:8, 23:16, 31:24 in one clk cycle.
  - PUSH_N write consumes the low TAIL_LEN bytes (bits 7:0 first); TAIL_LEN 0 pushes
    nothing.
  - The CRC register reads the finished value (state XOR 0xFFFFFFFF); after INIT with
    no bytes it reads 0x00000000.
  - The datapath accepts one PUSH4 per clk cycle (4 bytes per clock) with no stall.
  counters:
  - BYTE_COUNT increments by 4 per PUSH4 and by TAIL_LEN per PUSH_N; cleared by INIT.
  - BUSY_CYCLES increments by 1 for each clk cycle in which the datapath processes
    a push of at least one byte (PUSH4, or PUSH_N with TAIL_LEN 1 to 3); cleared by
    INIT.
  - N PUSH4 words give BUSY_CYCLES = N.
  - A simultaneous INIT and push in the same clk cycle - INIT wins.
  registers_bus:
  - A write takes effect the clk cycle after h_we.
  - h_rdata shows the addressed register within 2 clk cycles of h_re and holds it.
  - Unmapped addresses read 0 and ignore writes; writes to RO registers are ignored.
  - CTRL bit 0 INIT is self-clearing and reads 0; it resets CRC to the start value,
    BYTE_COUNT and BUSY_CYCLES to 0.
  - TAIL_LEN stores only bits 1:0, so a value above 3 reads back masked.
  board:
  - sfp_tx_disable is driven 1 at all times; no GT transceiver is used.
  - BUILD reads the USR_ACCESSE2 DATA word; in simulation it reads 0.
  - led[0] shows MMCM locked, led[1] shows push activity (stretched).
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546504705
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 data
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 INIT self-clearing; 31:1 reserved, read 0
  - offset: 20
    name: PUSH4
    access: WO
    reset: 0
    bits: 31:0 four bytes, bits 7:0 first; reads 0
  - offset: 24
    name: PUSH_N
    access: WO
    reset: 0
    bits: 23:0 up to 3 bytes, bits 7:0 first; reads 0
  - offset: 28
    name: TAIL_LEN
    access: RW
    reset: 0
    bits: 1:0 N, 0 to 3; 31:2 reserved, read 0
  - offset: 32
    name: CRC
    access: RO
    reset: 0
    bits: 31:0 finished CRC-32
  - offset: 36
    name: BYTE_COUNT
    access: RO
    reset: 0
    bits: 31:0 bytes pushed
  - offset: 40
    name: BUSY_CYCLES
    access: RO
    reset: 0
    bits: 31:0 busy clk cycles
timing:
  clock: clk 100 MHz (10 ns) derived from 25 MHz by MMCM
  throughput: 4 bytes per clk per PUSH4 accepted, 400 MB/s at 100 MHz
  latency:
    write_to_effect: 1 clk after h_we
    read_data: h_rdata valid 1 clk after h_re (limit 2) and held
    push_to_crc_visible: 1 clk after h_we
resources_expected:
  luts: about 400
  ffs: about 300
  brams: 0
  dsps: 0
  mmcm: 1
  bufg: 2
  timing: WNS >= 0 at 100 MHz; CRC32 4-byte XOR tree is about 3 LUT levels
assumptions:
- text: Clock is 100 MHz from an MMCM on the 25 MHz C3 input
  reason: request needs clock of at least 100 MHz and only a 25 MHz clock is on the
    board
- text: Reset model is reprogram; internal rst for jtag_bus comes from MMCM lock
  reason: no reset button is named; jtag_bus needs rst held for a few clocks
- text: jtag_bus.sv is instantiated unchanged and is not simulated; tests drive the
    register port
  reason: request says so
- text: Pushes are accepted at most one per clk; JTAG delivers far slower, back-to-back
    is tested at the register port
  reason: request wants 4 bytes per clock capability
- text: Reads of the CRC/counter registers are not interlocked against concurrent
    pushes
  reason: host reads after finishing a message
- text: A PUSH_N with TAIL_LEN 1 to 3 counts 1 busy cycle, TAIL_LEN 0 counts 0
  reason: request only specifies the full-word case
open_questions: []
