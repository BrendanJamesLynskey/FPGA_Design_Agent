name: crc32_engine
title: 'P3: Ethernet CRC-32 engine with JTAG register bus'
board: kr260
part: xck26-sfvc784-2LV-c
top: crc32_top
clocks:
- name: clk_25
  pin_role: C3 (25 MHz board clock)
  freq: 25 MHz
  role: input to MMCM
- name: clk
  source: MMCM from clk_25
  freq: 100 MHz (period 10 ns)
  role: free-running design clock for CRC datapath, register port and jtag_bus
reset:
  model: reprogram
  note: Every reset is a reconfiguration of the FPGA; registers take initial values
    at configuration and the design has no reset input. Any rst needed by jtag_bus
    is generated internally from MMCM lock.
parameters:
  DESIGN_ID: 32'h20930001
  CRC_POLY_REFLECTED: 32'hEDB88320
  CRC_INIT: 32'hFFFFFFFF
  CRC_XOROUT: 32'hFFFFFFFF
  CLK_MULT: 40
  CLK_DIV: 10
  READ_LATENCY_CYCLES: 1
ports:
- name: clk_25
  direction: in
  width: 1
  board_pin_role: C3 25 MHz clock
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
behaviour:
  crc:
  - State register starts at 0xFFFFFFFF; CRC register reads state XOR 0xFFFFFFFF,
    so an empty message reads 0x00000000.
  - PUSH4 consumes 4 bytes in one clock, byte 0 = wdata[7:0] first, reflected CRC-32
    polynomial 0x04C11DB7 (0xEDB88320 reflected); BYTE_COUNT += 4.
  - PUSH_N consumes the low TAIL_LEN bytes (0 to 3), byte 0 = wdata[7:0] first; BYTE_COUNT
    += TAIL_LEN; TAIL_LEN 0 changes nothing.
  - Result equals zlib.crc32 over all bytes pushed since INIT.
  - TAIL_LEN values above 3 are clamped to the low 2 bits on write (stored value is
    wdata[1:0]).
  control:
  - Write of CTRL with bit 0 set restores state to 0xFFFFFFFF and clears BYTE_COUNT
    and BUSY_CYCLES; the bit reads back 0.
  - Host writes arrive at most one per clock; INIT has priority over a push in the
    same clock.
  throughput:
  - Datapath accepts one PUSH4 per clock; BUSY_CYCLES increments by 1 for every clock
    in which a push (PUSH4 or PUSH_N with TAIL_LEN>0) is processed.
  - A message of N full words gives BUSY_CYCLES = N (empty PUSH_N adds 0).
  register_port:
  - Write takes effect the clock after h_we; h_rdata shows the addressed register
    1 clock after h_re and holds it until the next h_re.
  - Unmapped addresses read 0 and ignore writes; h_addr[1:0] ignored (4-byte steps).
  - BUILD reads the USR_ACCESSE2 DATA output.
  - jtag_bus.sv is instantiated unchanged; simulation drives the register port directly.
  io:
  - sfp_tx_disable is driven constant 1; no GT transceiver is used.
  - led[0] is heartbeat from clk divider, led[1] is on when BYTE_COUNT is non-zero.
registers:
  map:
  - offset: '0x000'
    name: ID
    access: RO
    reset: '0x20930001'
    bits: 31:0 design ID
  - offset: '0x004'
    name: BUILD
    access: RO
    reset: USR_ACCESS
    bits: 31:0 USR_ACCESSE2 word
  - offset: '0x008'
    name: SCRATCH
    access: RW
    reset: '0x00000000'
    bits: 31:0 data
  - offset: '0x010'
    name: CTRL
    access: RW
    reset: '0x00000000'
    bits: 0 INIT self-clearing; 31:1 reserved 0
  - offset: '0x014'
    name: PUSH4
    access: WO
    reset: '0x00000000'
    bits: 31:0 four bytes, bits 7:0 first; reads 0
  - offset: '0x018'
    name: PUSH_N
    access: WO
    reset: '0x00000000'
    bits: 31:0 low TAIL_LEN bytes; reads 0
  - offset: '0x01C'
    name: TAIL_LEN
    access: RW
    reset: '0x00000000'
    bits: 1:0 N (0 to 3); 31:2 read 0
  - offset: '0x020'
    name: CRC
    access: RO
    reset: '0x00000000'
    bits: 31:0 finished CRC-32
  - offset: '0x024'
    name: BYTE_COUNT
    access: RO
    reset: '0x00000000'
    bits: 31:0 bytes pushed since INIT
  - offset: '0x028'
    name: BUSY_CYCLES
    access: RO
    reset: '0x00000000'
    bits: 31:0 busy clocks since INIT
timing:
  clock: 100 MHz from MMCM (VCO 1000 MHz = 25 MHz x 40, divide 10)
  throughput: one 4-byte word per clock = 400 MB/s
  latency:
    push_to_crc: CRC register updated 1 clock after h_we of a push
    read: h_rdata valid 1 clock after h_re (limit 2)
    init: state restored 1 clock after h_we
resources_expected:
  luts: about 300
  ffs: about 300
  brams: 0
  dsps: 0
  mmcm: 1
  bscane2: 1
  usr_access: 1
assumptions:
- assumption: Design clock is 100 MHz from an MMCM on the 25 MHz input.
  reason: Request demands at least 100 MHz; 32-bit parallel CRC XOR tree closes easily
    at 10 ns.
- assumption: Host never writes a push and INIT in the same clock; INIT wins if it
    happens.
  reason: jtag_bus issues one command at a time.
- assumption: BUSY_CYCLES counts clocks with an accepted push of at least one byte.
  reason: Request says clocks the datapath processed data; N full words give N.
- assumption: Reads of write-only registers return 0.
  reason: Unmapped-like behaviour is the only value the request defines.
- assumption: Throughput of one word per clock is proven at the register port; the
    JTAG link itself is far slower.
  reason: jtag_bus issues a command per scan, not per clock.
