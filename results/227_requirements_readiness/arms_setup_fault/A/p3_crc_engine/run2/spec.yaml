open_questions: []
resolved_questions:
- question: Which clock frequency should the design run at (at least 100 MHz)?
  answer: 100 MHz from an MMCM on the 25 MHz input
  status: defaulted
  by: default
  default_reason: Request gives only a lower bound; 100 MHz meets it with margin and
    4 bytes per clock gives 400 MB/s.
  risk: high
- question: Does BUSY_CYCLES count a PUSH_N tail push as one busy cycle?
  answer: Yes if TAIL_LEN is 1 to 3, no if 0
  status: defaulted
  by: default
  default_reason: Request only checks BUSY_CYCLES for full-word messages.
  risk: high
- question: What should TAIL_LEN do when written with a value above 3?
  answer: Store only bits 1:0
  status: defaulted
  by: default
  default_reason: Request defines 0 to 3 only.
  risk: high
- question: What should the LEDs show?
  answer: led[0] heartbeat, led[1] on when BYTE_COUNT is non-zero
  status: defaulted
  by: default
  default_reason: Request names the LEDs but gives no function.
  risk: high
- question: Reads of write-only registers (PUSH4, PUSH_N) return what?
  answer: '0'
  status: defaulted
  by: default
  default_reason: Request does not say.
  risk: high
- question: Confirm the register map (offset, width, reset value and access of every
    register).
  answer: The map given in the request, all 32-bit on 4-byte steps, as in registers.map
  status: defaulted
  by: default
  default_reason: Offsets are given in the request, confirmed here for the record.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
