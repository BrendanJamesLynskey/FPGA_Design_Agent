assumptions:
- assumption: Fault injection yields one counted error per pass at address 5 (per
    user's text), taking one compare per pass.
  reason: User says one wrong word per pass; with two backgrounds the compare at address
    5 is chosen once per pass.
- assumption: Top creates rst from a power-up counter of RESET_CYCLES clocks.
  reason: User says hold rst a few clocks at start; no reset button specified.
- assumption: Part is xck26-sfvc784-2LV-c.
  reason: Kria KR260 K26 SOM.
- assumption: Fresh read data of RAM is sampled from block RAM with 1 clock latency,
    so the bus read FSM adds one register stage.
  reason: Meets the 2-clock h_rdata bound.
open_questions: []
resolved_questions:
- question: What should led[1:0] show?
  answer: led[0] = BUSY, led[1] = DONE
  status: defaulted
  by: default
  default_reason: Request names LEDs but gives no behaviour.
  risk: high
- question: In which exact pass compare does INJECT_FAULT fire (the March C- has several
    compares at address 5 per pass)?
  answer: Exactly one forced mismatch per pass, in the first read of address 5 of
    the first background; MARCH_ERRS grows by 1 per pass
  status: defaulted
  by: default
  default_reason: Request says one wrong word per pass at address 5.
  risk: high
- question: Is the register map as listed in the request the final one?
  answer: Yes, offsets 0x000-0x030 exactly as in the request table
  status: defaulted
  by: default
  default_reason: Offsets are given; confirming the map the harness copies into registers.map.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
