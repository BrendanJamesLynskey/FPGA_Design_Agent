name: p2_bram_rom
title: 'P2: ROM, RAM and a March C- memory test'
board: kr260
part: xck26-sfvc784-2LV-c
top: p2_bram_rom_top
interfaces: {}
clocks:
- name: clk
  port: clk
  frequency: 25 MHz
  pin: C3
  note: free-running; register bus and memory clock
reset:
  name: rst
  polarity: active high
  note: core input rst; top generates it for a few clocks at start (power-up counter);
    held for at least 4 clocks
parameters:
  ROM_DEPTH: 1024
  RAM_DEPTH: 1024
  DATA_WIDTH: 32
  ADDR_WIDTH: 10
  RAM_INIT_BASE: 3235774464
  DESIGN_ID: 546439169
  FAULT_ADDR: 5
  RESET_CYCLES: 8
  READ_LATENCY_CYCLES: 2
ports:
- name: clk
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx disable, driven constant 1
- name: rst
  direction: input
  width: 1
  board_pin_role: core only; active high reset
- name: h_we
  direction: input
  width: 1
  board_pin_role: core only; register port write pulse from jtag_bus
- name: h_re
  direction: input
  width: 1
  board_pin_role: core only; register port read pulse
- name: h_addr
  direction: input
  width: 12
  board_pin_role: core only; byte address
- name: h_wdata
  direction: input
  width: 32
  board_pin_role: core only; write data
- name: h_rdata
  direction: output
  width: 32
  board_pin_role: core only; read data valid 2 clocks after h_re
behaviour:
  rom:
  - 1024x32 ROM initialised with $readmemh from data/rom_init.hex at configuration.
  - ROM_DATA read returns the word at MEM_ADDR; writes are ignored.
  ram:
  - 1024x32 RAM; word i holds 0xC0DE0000 + i after configuration, before any write
    (initial block / INIT).
  - RAM contents are not changed by rst.
  host_access:
  - MEM_ADDR holds 10 bits; upper write bits ignored, read as 0.
  - With AUTOINC a ROM_DATA read or any RAM_DATA access uses the old MEM_ADDR then
    adds 1, wrapping 1023 to 0.
  - Without AUTOINC MEM_ADDR is unchanged by data accesses.
  - 'RAM_DATA access while BUSY: write ignored, read returns 0, MEM_ADDR not incremented;
    MEM_ADDR writes still work.'
  - Unmapped addresses read 0 and ignore writes.
  - h_rdata is registered and valid 2 clocks after h_re, held until next read.
  march:
  - 'March C-: up(w0); up(r0,w1); up(r1,w0); down(r0,w1); down(r1,w0); down(r0), run
    with all-zero background then all-one background (data inverted); one pass is
    both backgrounds.'
  - Pass count used is max(1, MARCH_PASSES).
  - START while BUSY is ignored; START self-clears and clears MARCH_ERRS, MARCH_FIRST_ERR
    (to 0xFFFFFFFF), passes completed and DONE.
  - BUSY is high for the whole test; DONE rises and BUSY falls in the same clock when
    the last pass ends.
  - Each read compare mismatch increments MARCH_ERRS; first mismatch address stored
    in MARCH_FIRST_ERR.
  - INJECT_FAULT forces a mismatch in the compare only at address 5, once per pass;
    stored data is never corrupted, RAM ends all zero.
  common:
  - ID reads 0x20920001; BUILD reads USR_ACCESSE2 word; SCRATCH is 32-bit RW reset
    0.
  - sfp_tx_disable is constant 1; no GT transceiver used.
  - Top instantiates data/jtag_bus.sv unchanged and the core p2_bram_rom_core (no
    vendor primitive).
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546439169
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: MEM_ADDR
    access: RW
    reset: 0
    bits: 9:0 word address
  - offset: 20
    name: ROM_DATA
    access: RO
    reset: 0
    bits: 31:0 ROM word at MEM_ADDR
  - offset: 24
    name: RAM_DATA
    access: RW
    reset: 0
    bits: 31:0 RAM word at MEM_ADDR
  - offset: 28
    name: MEM_CTRL
    access: RW
    reset: 0
    bits: 0 AUTOINC
  - offset: 32
    name: MARCH_CTRL
    access: RW
    reset: 0
    bits: 0 START (self-clearing), 1 INJECT_FAULT
  - offset: 36
    name: MARCH_PASSES
    access: RW
    reset: 1
    bits: 15:0 passes (0 treated as 1)
  - offset: 40
    name: MARCH_STATUS
    access: RO
    reset: 0
    bits: 0 BUSY, 1 DONE, 31:16 passes completed
  - offset: 44
    name: MARCH_ERRS
    access: RO
    reset: 0
    bits: 31:0 error count
  - offset: 48
    name: MARCH_FIRST_ERR
    access: RO
    reset: 4294967295
    bits: 31:0 first wrong address
timing:
  clock: 25 MHz, 40 ns period
  latency:
    register_read: h_rdata valid 2 clocks after h_re and held
    register_write: takes effect 1 clock after h_we
    bram_read: 1 clock
    march_busy_to_done: BUSY falls and DONE rises in the same clock
resources_expected:
  BRAM36: 2 to 3 (ROM 1024x32 and RAM 1024x32 are one 36Kb block each)
  LUT: under 800
  FF: under 600
  DSP: 0
  GT: 0
