name: p2_bram_rom
title: 'P2: ROM, RAM and a March C- memory test over a JTAG register bus'
board: kr260
part: xck26-sfvc784-2LV-c
top: p2_bram_rom_top
clocks:
- name: clk
  frequency_mhz: 25
  pin: C3
  note: free-running board clock; register bus, memories and march engine all run
    on it
reset:
  name: rst
  polarity: active_high
  note: no reset pin on the board; top generates rst from a power-on counter held
    for 16 clocks after configuration. The core takes rst as an input. RAM contents
    are not reset.
parameters:
  ROM_DEPTH: 1024
  RAM_DEPTH: 1024
  DATA_WIDTH: 32
  ADDR_WIDTH: 10
  DESIGN_ID: 546439169
  RAM_INIT_BASE: 3235774464
  ROM_INIT_FILE: data/rom_init.hex
  RST_HOLD_CYCLES: 16
  MARCH_ERR_ADDR: 5
interfaces_note: no AXI4-Lite block; registers are on the jtag_bus h_* port
ports:
- name: clk
  direction: in
  width: 1
  role: C3 25 MHz clock
- name: led
  direction: out
  width: 2
  role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  role: SFP+ tx disable, held at 1 (laser off)
- name: core.rst
  direction: in
  width: 1
  role: internal active-high reset (core only)
- name: core.h_we
  direction: in
  width: 1
  role: register write pulse from jtag_bus
- name: core.h_re
  direction: in
  width: 1
  role: register read pulse from jtag_bus
- name: core.h_addr
  direction: in
  width: 12
  role: byte address from jtag_bus
- name: core.h_wdata
  direction: in
  width: 32
  role: write data from jtag_bus
- name: core.h_rdata
  direction: out
  width: 32
  role: read data to jtag_bus, valid 2 clocks after h_re and held
- name: core.led
  direction: out
  width: 2
  role: LED drive from core
behaviour:
  structure:
  - p2_bram_rom_top (rtl/p2_bram_rom_top.sv) instantiates data/jtag_bus.sv unchanged,
    p2_bram_rom_core, the USR_ACCESSE2 primitive and the power-on reset counter.
  - p2_bram_rom_core (rtl/p2_bram_rom_core.sv) holds all registers, ROM, RAM and march
    engine and contains no vendor primitive.
  - The BUILD word is read from USR_ACCESSE2 in the top and passed to the core as
    an input (build_word).
  - sfp_tx_disable is constant 1. No GT channel is used.
  common_registers:
  - 0x000 ID reads 0x20920001.
  - 0x004 BUILD reads the USR_ACCESS word.
  - 0x008 SCRATCH is 32 bits RW, resets to 0.
  - Unmapped addresses read 0 and ignore writes. Addresses decode on h_addr[11:2].
  bus:
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it.
  memories:
  - ROM is 1024 x 32, initialised with $readmemh from data/rom_init.hex, inferred
    as block RAM, read latency 1 clock.
  - RAM is 1024 x 32 true block RAM with initial contents word i = 0xC0DE0000 + i,
    set at configuration and not touched by rst. Read latency 1 clock.
  - MEM_ADDR is 10 bits, upper write bits ignored and read as 0.
  - ROM_DATA read returns ROM[MEM_ADDR]. Writes ignored. With AUTOINC, MEM_ADDR increments
    after the data is captured, wrapping 1023 to 0. Without AUTOINC MEM_ADDR is unchanged.
  - RAM_DATA write stores at the old MEM_ADDR, then increments if AUTOINC. RAM_DATA
    read returns RAM[MEM_ADDR], then increments if AUTOINC.
  - While MARCH BUSY, RAM_DATA writes are ignored and reads return 0 and do not change
    MEM_ADDR. MEM_ADDR writes are still accepted.
  march:
  - START (MARCH_CTRL bit 0) is self-clearing and reads 0. START while BUSY is ignored.
  - START clears MARCH_ERRS to 0, MARCH_FIRST_ERR to 0xFFFFFFFF, passes completed
    to 0 and DONE to 0, and sets BUSY.
  - Pass count used is max(1, MARCH_PASSES[15:0]). MARCH_PASSES keeps the value written.
  - 'One pass is March C- with background 0x00000000 and then with background 0xFFFFFFFF:
    up(w0); up(r0,w1); up(r1,w0); down(r0,w1); down(r1,w0); down(r0), where w0/w1
    write the background / its complement and r0/r1 expect it.'
  - Each pass is 2 x 10 x 1024 = 20480 memory operations plus pipeline fill, one operation
    per clock.
  - Every read compared with the expected word. A mismatch increments MARCH_ERRS (32
    bit, saturating at 0xFFFFFFFF) and, if it is the first since START, loads MARCH_FIRST_ERR
    with the address.
  - INJECT_FAULT (MARCH_CTRL bit 1) forces the compare to see a wrong value for address
    5 once per pass, on the first read of address 5 in each pass. Stored data is never
    altered.
  - After the last pass DONE rises and BUSY falls in the same clock. Passes completed
    (MARCH_STATUS[31:16]) increments at the end of each pass.
  - After a completed run the RAM holds all zeros.
  leds:
  - led[0] = BUSY, led[1] = MARCH_ERRS != 0 (proposal, see resolved questions).
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546439169
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESS word of the bitstream'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] scratch'
  - offset: 16
    name: MEM_ADDR
    access: RW
    reset: 0
    bits: '[9:0] word address, [31:10] read 0'
  - offset: 20
    name: ROM_DATA
    access: RO
    reset: 0
    bits: '[31:0] ROM word at MEM_ADDR, AUTOINC read adds 1 to MEM_ADDR'
  - offset: 24
    name: RAM_DATA
    access: RW
    reset: 0
    bits: '[31:0] RAM word at MEM_ADDR, AUTOINC access adds 1 to MEM_ADDR'
  - offset: 28
    name: MEM_CTRL
    access: RW
    reset: 0
    bits: '[0] AUTOINC'
  - offset: 32
    name: MARCH_CTRL
    access: RW
    reset: 0
    bits: '[0] START self-clearing, [1] INJECT_FAULT'
  - offset: 36
    name: MARCH_PASSES
    access: RW
    reset: 1
    bits: '[15:0] number of passes, 0 treated as 1'
  - offset: 40
    name: MARCH_STATUS
    access: RO
    reset: 0
    bits: '[0] BUSY, [1] DONE, [31:16] passes completed'
  - offset: 44
    name: MARCH_ERRS
    access: RO
    reset: 0
    bits: '[31:0] words that read wrong since START'
  - offset: 48
    name: MARCH_FIRST_ERR
    access: RO
    reset: 4294967295
    bits: '[31:0] address of first wrong word, 0xFFFFFFFF if none'
timing:
  clock_period_ns: 40
  read_latency_clocks: 2
  march_pass_clocks_approx: 20480
  march_200_passes_note: about 4.1 million clocks, about 164 ms at 25 MHz
  latency:
    bus_write: effect 1 clock after h_we
    bus_read: h_rdata valid 2 clocks after h_re and held
    bram_read: 1 clock
    march_op: 1 memory operation per clock
resources_expected:
  bram36: 2 (ROM 1, RAM 1; 32 Kbit each)
  lut: under 600
  ff: under 600
  dsp: 0
  gt: 0
  note: timing at 25 MHz is expected to close with large margin
assumptions:
- assumption: xck26-sfvc784-2LV-c is the K26 part on the KR260.
  reason: the request names only the board.
- assumption: A power-on counter of 16 clocks generates rst in the top.
  reason: the board gives no reset input and the request asks rst to be held a few
    clocks at start.
- assumption: jtag_bus.sv is used unchanged and sits in the top, so the cocotb bench
    drives the core only.
  reason: the request says to use it unchanged and that it needs no simulation.
- assumption: RAM initial contents come from an initial block or INIT attribute equal
    to 0xC0DE0000 + i.
  reason: block RAM configuration-time contents are required before any write.
- assumption: MARCH_ERRS saturates at 0xFFFFFFFF.
  reason: avoids wraparound to a false zero; unreachable in the stated test.
- assumption: The fault is injected on the first read of address 5 in each pass (background
    0, first up(r0,w1) element).
  reason: the request says one wrong word at address 5 per pass.
- assumption: A RAM_DATA read during BUSY does not auto-increment MEM_ADDR.
  reason: the access is ignored while the test owns the RAM.
open_questions: []
