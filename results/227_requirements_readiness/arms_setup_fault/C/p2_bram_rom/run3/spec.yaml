resolved_questions:
- question: What do the two user LEDs show?
  answer: led[0] = BUSY, led[1] = MARCH_ERRS != 0
  status: defaulted
  by: default
  default_reason: the request names the LEDs but gives no behaviour.
  risk: medium
- question: Which memory read is used for the INJECT_FAULT at address 5 when each
    pass has many reads of address 5?
  answer: the first read of address 5 in the pass, so exactly one error per pass
  status: defaulted
  by: default
  default_reason: the request says one wrong value at one address each pass.
  risk: high
- question: What does BUILD read in simulation?
  answer: a core input build_word, driven by the bench; USR_ACCESSE2 in the top
  status: defaulted
  by: default
  default_reason: the primitive is not available in simulation.
  risk: medium
- question: Does a write to MARCH_PASSES or MARCH_CTRL.INJECT_FAULT during BUSY take
    effect?
  answer: the register stores it but the running test latches passes and the fault
    bit at START
  status: defaulted
  by: default
  default_reason: the request does not say.
  risk: medium
- question: Should the register map be confirmed as the given one?
  answer: 'use the offsets in the request table: 0x000-0x008 common and 0x010-0x030
    as listed'
  status: defaulted
  by: default
  default_reason: offsets are given in the request; recorded for the harness.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
