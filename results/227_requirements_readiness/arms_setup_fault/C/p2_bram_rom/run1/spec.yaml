assumptions:
- text: The harness bench drives p2_bram_rom_core directly; jtag_bus is not simulated.
  reason: the request says jtag_bus holds Xilinx primitives and the register port
    is tested directly
- text: RAM initial values are produced by an initial block filling 0xC0DE0000 + i,
    which Vivado maps to BRAM INIT.
  reason: request needs defined power-up contents without a reset
- text: The power-on reset is generated in the top by a 16-clock counter.
  reason: request says rst is held a few clocks at start and gives no reset pin
- text: The march test and host access share one RAM port set with the march engine
    taking priority while BUSY.
  reason: request says the test owns the RAM while BUSY
- text: The passes-completed field saturates naturally at 65535 since passes are at
    most 65535.
  reason: 16-bit field and 16-bit pass count
open_questions: []
resolved_questions:
- question: What are the register offsets, width, reset value and access of every
    register?
  answer: Use the map in the request (0x000 to 0x008 common, 0x010 to 0x030 as tabled),
    all 32 bits wide, with the resets given in the user's answers, as in registers.map.
  status: defaulted
  by: default
  default_reason: the request tables give offsets, so the map is taken as given; confirmation
    only.
  risk: high
- question: What do led[1:0] show?
  answer: led[0] = BUSY, led[1] = DONE
  status: defaulted
  by: default
  default_reason: the request names the LEDs but gives no behaviour for them
  risk: medium
- question: What is the read value of the START bit and of unused bits in MARCH_CTRL?
  answer: START reads 0, bit 1 reads back INJECT_FAULT, other bits read 0
  status: defaulted
  by: default
  default_reason: START is self-clearing and the request does not say about other
    bits
  risk: medium
- question: Can INJECT_FAULT be changed while BUSY?
  answer: The register is writable at any time, the value is sampled live by the checker
    compare
  status: defaulted
  by: default
  default_reason: the request does not say
  risk: medium
- question: What does a write to read-only registers (ID, BUILD, MARCH_STATUS, ERRS,
    FIRST_ERR) do?
  answer: ignored
  status: defaulted
  by: default
  default_reason: the request only says unmapped addresses ignore writes
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
