name: p2_bram_rom
title: 'P2: ROM, RAM and a March C- memory test over JTAG register bus'
board: kr260
part: xck26-sfvc784-2LV-c
top: p2_bram_rom_top
interfaces: {}
clocks:
- name: clk
  port: clk
  frequency: 25 MHz
  pin_role: C3 board clock
  note: free-running; register bus, ROM, RAM and march test all run on it
reset:
  name: rst
  polarity: active_high
  source: power-on counter in the top holds rst for 16 clocks after configuration;
    the core takes rst
  scope: resets registers only; RAM contents are not reset and keep 0xC0DE0000 + i
    from configuration
parameters:
  ROM_DEPTH: 1024
  RAM_DEPTH: 1024
  DATA_WIDTH: 32
  ADDR_WIDTH: 10
  PASSES_WIDTH: 16
  RESET_HOLD_CYCLES: 16
  FAULT_ADDR: 5
  DESIGN_ID: 546439169
  ROM_INIT_FILE: data/rom_init.hex
ports:
- name: clk
  direction: in
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, held at 1 (laser off)
- name: 'core: rst'
  direction: in
  width: 1
  board_pin_role: internal, active high, from top power-on counter
- name: h_we
  direction: in
  width: 1
  board_pin_role: internal register bus write pulse from jtag_bus
- name: h_re
  direction: in
  width: 1
  board_pin_role: internal register bus read pulse from jtag_bus
- name: h_addr
  direction: in
  width: 12
  board_pin_role: internal byte address
- name: h_wdata
  direction: in
  width: 32
  board_pin_role: internal write data
- name: h_rdata
  direction: out
  width: 32
  board_pin_role: internal read data, valid 2 clocks after h_re and held
behaviour:
  structure:
  - p2_bram_rom_top instantiates data/jtag_bus.sv unchanged, the p2_bram_rom_core,
    a USR_ACCESSE2 primitive for BUILD, and drives sfp_tx_disable to 1.
  - p2_bram_rom_core (rtl/p2_bram_rom_core.sv) holds the registers, ROM, RAM and march
    engine and has no vendor primitive; BUILD value enters the core as a port.
  - No GT transceiver channel is used.
  common_registers:
  - ID at 0x000 reads 0x20920001.
  - BUILD at 0x004 reads the USR_ACCESS word.
  - SCRATCH at 0x008 reads back what was written and resets to 0.
  - Unmapped addresses read 0 and ignore writes.
  - A write takes effect the clock after h_we; h_rdata shows the addressed register
    within 2 clocks of h_re and holds it.
  rom:
  - 1024 x 32 ROM initialised with $readmemh from data/rom_init.hex at configuration.
  - ROM_DATA read returns the word at MEM_ADDR; writes are ignored.
  - With AUTOINC a ROM_DATA read adds 1 to MEM_ADDR after the data is captured, wrapping
    1023 to 0; without AUTOINC MEM_ADDR is unchanged.
  ram:
  - 1024 x 32 RAM, initial content word i = 0xC0DE0000 + i from configuration (initial
    block or INIT, not reset).
  - RAM_DATA read or write accesses the word at MEM_ADDR; with AUTOINC MEM_ADDR then
    increments (access at the old address), wrap 1023 to 0.
  - While march BUSY a RAM_DATA write is ignored and a read returns 0 with no MEM_ADDR
    increment; MEM_ADDR can still be written.
  mem_addr:
  - MEM_ADDR is 10 bits; upper write bits are ignored and read as 0.
  march:
  - 'March C-: up(w0); up(r0,w1); up(r1,w0); down(r0,w1); down(r1,w0); down(r0), run
    with the all-zero background then the all-one background (w0 writes the background
    word, w1 its complement); this is one pass.'
  - Pass count used is max(1, MARCH_PASSES); MARCH_PASSES keeps the value written.
  - START (write 1 to MARCH_CTRL bit 0) while not BUSY clears MARCH_ERRS, MARCH_FIRST_ERR
    (to 0xFFFFFFFF), passes completed and DONE, sets BUSY and starts; START while
    BUSY is ignored; START bit reads 0.
  - Each read that differs from the expected value increments MARCH_ERRS; the first
    one sets MARCH_FIRST_ERR to its address.
  - DONE rises when the last pass has finished and BUSY falls in the same clock.
  - INJECT_FAULT forces the compare at address 5 to see a wrong value once per pass;
    stored data is never altered, so the RAM ends all zero.
  leds:
  - led[0] shows BUSY, led[1] shows DONE (proposed, request does not define the LED
    use).
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546439169
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: MEM_ADDR
    access: RW
    reset: 0
    bits: 9:0 word address, 31:10 read 0
  - offset: 20
    name: ROM_DATA
    access: RO
    reset: 0
    bits: 31:0 ROM word at MEM_ADDR
  - offset: 24
    name: RAM_DATA
    access: RW
    reset: 0
    bits: 31:0 RAM word at MEM_ADDR
  - offset: 28
    name: MEM_CTRL
    access: RW
    reset: 0
    bits: 0 AUTOINC
  - offset: 32
    name: MARCH_CTRL
    access: RW
    reset: 0
    bits: 0 START self-clearing, 1 INJECT_FAULT
  - offset: 36
    name: MARCH_PASSES
    access: RW
    reset: 1
    bits: 15:0 number of passes
  - offset: 40
    name: MARCH_STATUS
    access: RO
    reset: 0
    bits: 0 BUSY, 1 DONE, 31:16 passes completed
  - offset: 44
    name: MARCH_ERRS
    access: RO
    reset: 0
    bits: 31:0 wrong words since START
  - offset: 48
    name: MARCH_FIRST_ERR
    access: RO
    reset: 4294967295
    bits: 31:0 address of first wrong word
timing:
  clock: 25 MHz, 40 ns period
  latency:
    register_write: takes effect 1 clock after h_we
    register_read: h_rdata valid 2 clocks after h_re and held
    bram_read: 1 clock
    march_test: about 2 clocks per read and 1 per write, roughly 30000 clocks per
      pass (1.2 ms), 200 passes about 0.25 s
resources_expected:
  bram36: 2 to 3 (ROM 1024x32 and RAM 1024x32, 36 Kb each or 18Kb halves)
  lut: under 600
  ff: under 600
  dsp: 0
  gt: 0
