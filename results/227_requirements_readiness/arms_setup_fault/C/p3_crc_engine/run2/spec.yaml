name: p3_crc_engine
title: P3 Ethernet CRC-32 engine, 4 bytes per clock, JTAG register bus
board: kr260
part: xck26-sfvc784-2LV-c
top: p3_crc_engine_top
interfaces: {}
clocks:
- name: clk_25
  role: board input clock, pin C3
  freq_mhz: 25
- name: clk
  role: register bus and data clock, generated from clk_25 by an MMCM (156.25 MHz,
    period 6.4 ns)
  freq_mhz: 156.25
reset:
  name: rst
  polarity: active high
  description: Synchronous to clk; held while the MMCM is not locked and for a few
    clocks after lock (at least 8 clocks).
parameters:
  DESIGN_ID: 546504705
  CRC_POLY: 79764919
  CRC_INIT: 4294967295
  CRC_XOR_OUT: 4294967295
  TAIL_LEN_BITS: 2
  COUNTER_WIDTH: 32
  MMCM_MULT_NUM_X8: 200
  CLK_MIN_CYCLES: 1
ports:
- name: clk_25
  direction: in
  width: 1
  role: board clock, pin C3, 25 MHz (top only)
- name: led
  direction: out
  width: 2
  role: user LEDs led[1:0] (top only; driven low, no function requested)
- name: sfp_tx_disable
  direction: out
  width: 1
  role: SFP+ tx disable, held constant 1 (laser off)
- name: clk
  direction: in
  width: 1
  role: 'core: register bus clock, 156.25 MHz'
- name: rst
  direction: in
  width: 1
  role: 'core: active-high synchronous reset'
- name: h_we
  direction: in
  width: 1
  role: 'core: write pulse from jtag_bus'
- name: h_re
  direction: in
  width: 1
  role: 'core: read pulse from jtag_bus'
- name: h_addr
  direction: in
  width: 12
  role: 'core: byte address'
- name: h_wdata
  direction: in
  width: 32
  role: 'core: write data'
- name: h_rdata
  direction: out
  width: 32
  role: 'core: read data, valid within 2 clocks of h_re and held'
- name: build_id
  direction: in
  width: 32
  role: 'core: USR_ACCESSE2 word supplied by the top (the primitive lives in the top)'
behaviour:
  structure:
  - p3_crc_engine_top instantiates an MMCM (25 MHz to 156.25 MHz), reset generation,
    USR_ACCESSE2, data/jtag_bus.sv (unchanged) and p3_crc_engine_core.
  - p3_crc_engine_core (rtl/p3_crc_engine_core.sv) holds all register logic and the
    CRC datapath, with no vendor primitive.
  - sfp_tx_disable is constant 1; no GT transceiver is used; led[1:0] are driven 0.
  crc:
  - CRC-32 reflected, polynomial 0x04C11DB7 (reflected 0xEDB88320), state initial
    0xFFFFFFFF, bytes processed in send order, each word least significant byte first.
  - CRC register reads the state XOR 0xFFFFFFFF, equal to zlib.crc32 of all bytes
    since INIT; a message of no bytes reads 0x00000000.
  - PUSH4 advances the state by 4 bytes in one clock (a 32-bit-parallel update); PUSH_N
    advances it by TAIL_LEN bytes (1 to 3) in one clock; TAIL_LEN 0 changes nothing.
  - One push is accepted every clock with no gap and no back-pressure signal.
  - A CRC read shows all pushes up to and including the one at the previous clock;
    a push in the same clock as the read is not shown.
  counters:
  - BYTE_COUNT adds 4 for PUSH4 and TAIL_LEN for PUSH_N; 32 bits, wraps.
  - BUSY_CYCLES adds 1 in each clock where a PUSH4 or a PUSH_N with TAIL_LEN>0 is
    processed; 32 bits, wraps.
  init:
  - 'Writing CTRL bit 0 = 1 takes effect the clock after the write: state to 0xFFFFFFFF,
    BYTE_COUNT 0, BUSY_CYCLES 0; CTRL bit 0 self-clears so CTRL reads 0.'
  - INIT wins over a PUSH4 or PUSH_N in the same clock; that push is dropped.
  register_port:
  - A write takes effect the clock after h_we.
  - After h_re, h_rdata shows the addressed register within 2 clocks and holds it.
  - Unmapped addresses read 0 and ignore writes; writes to RO registers are ignored.
  - TAIL_LEN stores only wdata bits 1:0; it resets to 0.
  - SCRATCH reads back the last write, resets to 0.
  - Only h_addr[11:2] is decoded for the word registers; all registers are 32 bits.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546504705
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESSE2 word of the bitstream
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 read-back value
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 INIT (self-clearing, reads 0); 31:1 reserved, read 0
  - offset: 20
    name: PUSH4
    access: WO
    reset: 0
    bits: 31:0 four bytes, bits 7:0 first; reads 0
  - offset: 24
    name: PUSH_N
    access: WO
    reset: 0
    bits: 31:0 low TAIL_LEN bytes, bits 7:0 first; reads 0
  - offset: 28
    name: TAIL_LEN
    access: RW
    reset: 0
    bits: 1:0 N (0 to 3); 31:2 read 0
  - offset: 32
    name: CRC
    access: RO
    reset: 0
    bits: 31:0 final CRC-32 (state XOR 0xFFFFFFFF)
  - offset: 36
    name: BYTE_COUNT
    access: RO
    reset: 0
    bits: 31:0 bytes pushed since INIT
  - offset: 40
    name: BUSY_CYCLES
    access: RO
    reset: 0
    bits: 31:0 clocks with a push processed since INIT
timing:
  clock: clk 156.25 MHz (6.4 ns), required at least 100 MHz
  throughput: 4 bytes per clock, one push per clock
  latency:
    write_to_effect: 1 clock after h_we
    read_data: h_rdata valid within 2 clocks of h_re and held until the next read
    push_to_crc_visible: 1 clock after the push
resources_expected:
  luts: about 300 to 600 (32-bit parallel CRC XOR trees, counters, register mux)
  ffs: about 250
  bram: 0
  dsp: 0
  mmcm: 1
  gt: 0
assumptions:
- text: Register bus clock is 156.25 MHz made by an MMCM from the 25 MHz C3 clock.
  reason: The request fixes a 156.25 MHz data clock of at least 100 MHz and the board
    supplies only 25 MHz.
- text: BUILD is passed into the core as a build_id port, with USR_ACCESSE2 in the
    top.
  reason: The core must contain no vendor primitive.
- text: led[1:0] are driven 0.
  reason: The request names the LEDs but gives them no function.
- text: Simultaneous h_we and h_re in one clock are not issued by jtag_bus, so no
    ordering is defined.
  reason: jtag_bus issues one command at a time.
- text: A write to PUSH_N uses the TAIL_LEN value stored before that write.
  reason: A write takes effect the clock after h_we, so TAIL_LEN changed in the same
    clock is not yet visible.
open_questions: []
