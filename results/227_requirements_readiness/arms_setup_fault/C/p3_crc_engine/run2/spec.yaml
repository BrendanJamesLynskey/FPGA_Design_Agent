resolved_questions:
- question: Is the register map as listed in spec.md (offsets, widths, reset values,
    access) final?
  answer: 'Use the map in spec.md: ID 0x000, BUILD 0x004, SCRATCH 0x008, CTRL 0x010,
    PUSH4 0x014, PUSH_N 0x018, TAIL_LEN 0x01C, CRC 0x020, BYTE_COUNT 0x024, BUSY_CYCLES
    0x028, all 32 bits.'
  status: defaulted
  by: default
  default_reason: The request gives the offsets; this confirms them.
  risk: high
- question: What do the two user LEDs show?
  answer: Driven 0 (off).
  status: defaulted
  by: default
  default_reason: The request gives them no function.
  risk: medium
- question: What does a read of a write-only register (PUSH4, PUSH_N) return?
  answer: '0.'
  status: defaulted
  by: default
  default_reason: The request says only that unmapped addresses read 0.
  risk: high
- question: Does BUILD read 0 before USR_ACCESSE2 is valid?
  answer: Pass the primitive output through unchanged.
  status: defaulted
  by: default
  default_reason: The request says only that BUILD is the USR_ACCESS word.
  risk: medium
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
- question: CLK_MIN_MHZ is given as 100 MHZ. The model and the RTL need an integer
    number of clock cycles (CLK_MIN_CYCLES); at 25 MHz, how many?
  answer: '1'
  status: defaulted
  by: default
  default_reason: 1 is 100 MHZ at 25 MHz, rounded once, so the model and RTL agree
  risk: high
