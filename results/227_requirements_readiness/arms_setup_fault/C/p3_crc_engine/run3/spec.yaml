name: p3_crc_engine
title: 'P3: Ethernet CRC-32 engine, 4 bytes per clock, JTAG register bus'
board: kr260
part: xck26-sfvc784-2LV-c
top: p3_crc_engine_top
clocks:
- name: clk_25mhz
  port: clk_25mhz
  freq_mhz: 25
  pin: C3
  role: board input clock
- name: clk
  freq_mhz: 156.25
  source: MMCM from clk_25mhz (25 MHz x 25 / 4 = 156.25 MHz)
  role: register bus and CRC datapath clock (free running, at least 100 MHz)
reset:
  model: reprogram
  name: rst
  polarity: active high
  sync: synchronous to clk
  source: held while the MMCM is not locked, plus a few clocks after lock
  note: internal to the top, the top has no reset input; the core takes rst as a port;
    registers also have initial values from configuration
parameters:
  DESIGN_ID: 546504705
  CRC_POLY: 79764919
  CRC_INIT: 4294967295
  CRC_XOROUT: 4294967295
  DATA_BYTES_PER_CLK: 4
  MIN_CLK_MHZ_CHECK: 100
  CLK_MHZ_X100: 15625
  TAIL_LEN_BITS: 2
  ADDR_BITS: 12
ports:
- name: clk_25mhz
  direction: in
  width: 1
  board_pin_role: 25 MHz system clock, pin C3
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
- name: clk
  direction: in
  width: 1
  board_pin_role: 'core: register bus clock, internal'
- name: rst
  direction: in
  width: 1
  board_pin_role: 'core: active high reset, internal'
- name: h_we
  direction: in
  width: 1
  board_pin_role: 'core: write pulse from jtag_bus'
- name: h_re
  direction: in
  width: 1
  board_pin_role: 'core: read pulse from jtag_bus'
- name: h_addr
  direction: in
  width: 12
  board_pin_role: 'core: byte address from jtag_bus'
- name: h_wdata
  direction: in
  width: 32
  board_pin_role: 'core: write data from jtag_bus'
- name: h_rdata
  direction: out
  width: 32
  board_pin_role: 'core: read data to jtag_bus'
- name: build_word
  direction: in
  width: 32
  board_pin_role: 'core: USR_ACCESSE2 word from the top'
- name: led_out
  direction: out
  width: 2
  board_pin_role: 'core: LED drive, to led[1:0]'
behaviour:
  crc:
  - Reflected CRC-32, polynomial 0x04C11DB7, start value 0xFFFFFFFF, final XOR 0xFFFFFFFF,
    equal to zlib.crc32 of the bytes in push order.
  - Internal state resets to 0xFFFFFFFF, so CRC reads 0x00000000 for an empty message.
  - CRC reads state XOR 0xFFFFFFFF, and includes the push of the previous clock but
    not one in the same clock.
  push:
  - PUSH4 (write 0x014) consumes four bytes of h_wdata, bits 7:0 first, in one clock.
  - PUSH_N (write 0x018) consumes the low TAIL_LEN bytes of h_wdata, bits 7:0 first,
    in one clock.
  - 'PUSH_N with TAIL_LEN 0 changes nothing: CRC, BYTE_COUNT and BUSY_CYCLES hold.'
  - One push is accepted per clock with no gap and no busy or back-pressure signal.
  counters:
  - BYTE_COUNT adds 4 per PUSH4 and TAIL_LEN per PUSH_N, 32 bits, wraps.
  - BUSY_CYCLES adds 1 per clock in which a push with at least one byte is processed,
    32 bits, wraps.
  ctrl:
  - 'Write to CTRL with bit 0 set takes effect one clock later: CRC state to 0xFFFFFFFF,
    BYTE_COUNT 0, BUSY_CYCLES 0. Bit 0 self-clears and reads 0.'
  - INIT wins over a PUSH4 or PUSH_N in the same clock, the push is dropped.
  - TAIL_LEN stores only bits 1:0 of the written word; INIT does not change TAIL_LEN.
  bus:
  - Writes take effect the clock after h_we.
  - After h_re, h_rdata shows the addressed register within 2 clocks and holds it.
  - Unmapped addresses read 0 and ignore writes. Writes to RO registers and reads
    of WO registers (reads 0) are ignored.
  - jtag_bus.sv is used unchanged in the top, the core has no vendor primitive.
  board:
  - sfp_tx_disable is driven 1 at all times. No GT transceiver is used.
  - BUILD reads the USR_ACCESSE2 word, captured in the top and passed to the core
    as build_word.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546504705
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 value
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 INIT self-clearing; 31:1 reserved, read 0
  - offset: 20
    name: PUSH4
    access: WO
    reset: 0
    bits: 31:0 four bytes, bits 7:0 first
  - offset: 24
    name: PUSH_N
    access: WO
    reset: 0
    bits: 31:0 low TAIL_LEN bytes
  - offset: 28
    name: TAIL_LEN
    access: RW
    reset: 0
    bits: 1:0 N; 31:2 read 0
  - offset: 32
    name: CRC
    access: RO
    reset: 0
    bits: 31:0 CRC-32 finished
  - offset: 36
    name: BYTE_COUNT
    access: RO
    reset: 0
    bits: 31:0 bytes pushed
  - offset: 40
    name: BUSY_CYCLES
    access: RO
    reset: 0
    bits: 31:0 busy clocks
timing:
  clock: 156.25 MHz, period 6.4 ns
  throughput: 4 bytes per clock, one push per clock
  latency:
    push_to_crc: CRC register reflects a push 1 clock after the write clock
    read: h_rdata valid at most 2 clocks after h_re
    init: state cleared 1 clock after the write
resources_expected:
  luts: about 300 to 600 (4-byte CRC XOR network, 3 counters, bus mux)
  ffs: about 250
  brams: 0
  dsps: 0
  mmcm: 1
  bscane2: 1
  usr_access: 1
assumptions:
- assumption: The 156.25 MHz clock is made by an MMCM from the 25 MHz C3 clock.
  reason: The user states the data clock is 156.25 MHz and the board input is 25 MHz.
- assumption: The core exposes build_word and led_out ports beyond the h_* port.
  reason: BUILD needs USR_ACCESSE2 which is a primitive, so it stays in the top.
- assumption: Reads of the WO registers PUSH4 and PUSH_N return 0.
  reason: The request does not say; 0 is the safe value and matches unmapped reads.
- assumption: The CRC register reads state XOR 0xFFFFFFFF combinationally from the
    state register.
  reason: Fits the 2 clock read limit and the final XOR on read.
open_questions: []
