resolved_questions:
- question: 'Register map: please confirm offset, width, reset value and access of
    every register.'
  answer: The map given in the request (0x000 to 0x028), all 32 bits, resets as in
    registers.map.
  status: defaulted
  by: default
  default_reason: The request gives offsets, this confirms them.
  risk: high
- question: What do the LEDs show?
  answer: led[0] heartbeat from a slow counter on clk, led[1] on when BYTE_COUNT is
    not 0.
  status: defaulted
  by: default
  default_reason: The request names the LEDs but gives no behaviour.
  risk: medium
- question: What does a read of a WO register (PUSH4, PUSH_N) return?
  answer: '0'
  status: defaulted
  by: default
  default_reason: Not specified.
  risk: high
- question: Does a write of CTRL with bit 0 clear change anything, and are CTRL bits
    31:1 stored?
  answer: No effect; bits 31:1 are not stored and read 0.
  status: defaulted
  by: default
  default_reason: Only bit 0 is defined.
  risk: medium
- question: Does INIT change TAIL_LEN or SCRATCH?
  answer: No, only CRC state, BYTE_COUNT and BUSY_CYCLES.
  status: defaulted
  by: default
  default_reason: The request lists exactly what INIT clears.
  risk: medium
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
