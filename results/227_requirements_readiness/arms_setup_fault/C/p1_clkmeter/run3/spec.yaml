assumptions:
- text: The register bus clock is refclk and the core runs entirely in refclk, except
    the LED 0 divider in clk25.
  reason: Stated in the request.
- text: GATE_LEN accepted at START is latched so GATE_ACTUAL equals it.
  reason: Writes to GATE_LEN are ignored while BUSY, so this is equivalent and simple.
- text: The 156.25 MHz reference enters via IBUFDS_GTE4 and a BUFG_GT (or ODIV2 path)
    with no GT channel.
  reason: Only the GT reference clock buffer is allowed.
- text: Power-on reset is generated internally (no reset pin).
  reason: Request gives no reset input; jtag_bus needs rst held a few clocks.
- text: The clk25 LED 0 gating by LED_EN is synchronised into the clk25 domain.
  reason: LED_EN lives in refclk domain.
open_questions: []
resolved_questions:
- question: Exact package pins for refclk_p/refclk_n and for led[1:0], sfp_tx_disable
    (C3 is given)?
  answer: Take them from the KR260 board file for MGTREFCLK0 of the SFP quad, user
    LEDs and SFP tx disable.
  status: defaulted
  by: default
  default_reason: The request names roles but not pin locations.
  risk: high
- question: What does a START do when GATE_LEN has never been written?
  answer: Run with the reset value 156250000.
  status: defaulted
  by: default
  default_reason: Request says default one second.
  risk: medium
- question: Does a write of CTRL with START also store LED_EN from the same write?
  answer: Yes, bit 1 is stored on every CTRL write; bit 0 never stored.
  status: defaulted
  by: default
  default_reason: Unspecified, this is the natural behaviour.
  risk: medium
- question: Do LED phases reset to 0 when LED_EN goes 0 then 1?
  answer: Dividers free-run; only the output is gated by LED_EN, and LED state is
    0 after reset.
  status: defaulted
  by: default
  default_reason: Request only says LEDs are 0 with LED_EN 0.
  risk: high
- question: Is the register map as listed in the request final (offset, width, reset
    value, access of every register)?
  answer: Yes, the map in registers.map above, all 32-bit on 4-byte steps.
  status: defaulted
  by: default
  default_reason: The request lists offsets; confirming before RTL.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA, or does something restart the running design?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values and the design has no reset input.'
  status: defaulted
  by: default
  default_reason: With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration.
  risk: high
