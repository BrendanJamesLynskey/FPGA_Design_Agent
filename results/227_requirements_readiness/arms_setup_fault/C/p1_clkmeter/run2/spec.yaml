name: p1_clkmeter
title: 'P1: clock frequency meter (C3 25 MHz clock measured against the 156.25 MHz
  SFP+ GT reference clock)'
board: kr260
part: xck26-sfvc784-2LV-c
top: p1_clkmeter_top
clocks:
- name: clk_ref
  role: MGTREFCLK0 of the SFP+ quad, 156.25 MHz differential, through IBUFDS_GTE4
    (ODIV2 output via BUFG_GT or the buffer output used as fabric clock); register
    bus clock and ruler
  freq_mhz: 156.25
  period_ns: 6.4
- name: clk_c3
  role: 25 MHz clock on pin C3, measured clock; asynchronous to clk_ref
  freq_mhz: 25
  period_ns: 40.0
reset:
  name: rst
  polarity: active_high
  style: synchronous
  model: reprogram
  note: core rst is active high, held for a few clk_ref cycles at start (power-on
    counter in the top); the C3 domain LED counter is reset by a synchronised copy
    of rst
parameters:
  GATE_LEN_DEFAULT: 156250000
  GATE_LEN_MIN: 1000
  LED0_TOGGLE_CYCLES: 12500000
  LED1_TOGGLE_CYCLES: 78125000
  SYNC_STAGES: 2
  DESIGN_ID: 546373633
  READ_LATENCY_CYCLES: 2
ports:
- name: clk_ref_p
  direction: in
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 P (156.25 MHz)
- name: clk_ref_n
  direction: in
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 N
- name: clk_c3
  direction: in
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]; led[0] from clk_c3, led[1] from clk_ref
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ TX disable, constant 1 (laser off)
- name: 'core: clk'
  direction: in
  width: 1
  board_pin_role: internal, register-bus clock = clk_ref
- name: 'core: rst'
  direction: in
  width: 1
  board_pin_role: internal, active high
- name: 'core: h_we'
  direction: in
  width: 1
  board_pin_role: internal, from jtag_bus
- name: 'core: h_re'
  direction: in
  width: 1
  board_pin_role: internal, from jtag_bus
- name: 'core: h_addr'
  direction: in
  width: 12
  board_pin_role: internal, byte address
- name: 'core: h_wdata'
  direction: in
  width: 32
  board_pin_role: internal
- name: 'core: h_rdata'
  direction: out
  width: 32
  board_pin_role: internal
- name: 'core: clk_c3'
  direction: in
  width: 1
  board_pin_role: internal, measured clock
- name: 'core: usr_access'
  direction: in
  width: 32
  board_pin_role: internal, USR_ACCESSE2 word from the top
- name: 'core: led'
  direction: out
  width: 2
  board_pin_role: internal
behaviour:
  structure:
  - p1_clkmeter_top instantiates IBUFDS_GTE4 for the reference clock, USR_ACCESSE2,
    the unchanged data/jtag_bus.sv, and p1_clkmeter_core; no GT transceiver channel
    is used.
  - p1_clkmeter_core holds all registers and logic with no vendor primitive; the bench
    drives its h_* port directly.
  - sfp_tx_disable is constant 1 from reset on.
  register_port:
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register 2 clocks after h_re and holds until the next
    h_re.
  - Unmapped addresses read 0 and ignore writes; writes to read-only registers are
    ignored.
  measurement:
  - START (CTRL bit 0) written while not BUSY clears DONE at once and sets BUSY within
    2 clocks; the gate then runs GATE_LEN clk_ref cycles.
  - START written while BUSY is ignored and does not restart the gate.
  - CTRL bit 0 is self-clearing and reads 0.
  - C3 edges are counted after a two-flop synchroniser into clk_ref, rising edges
    only, during the gate.
  - In the clock of the last gate cycle, COUNT and GATE_ACTUAL get their final values,
    DONE is set, BUSY is cleared and MEAS_DONE increments by one (wraps at 32 bits).
  - DONE stays set until the next accepted START; COUNT, GATE_ACTUAL keep the last
    completed result while a new gate runs.
  - GATE_ACTUAL equals the GATE_LEN used for the gate.
  - COUNT is 32 bits, no saturation; plus or minus 1 edge from the synchroniser is
    accepted.
  gate_len:
  - A write of GATE_LEN below 1000 is stored as 1000; read back returns the clamped
    value.
  - A write of GATE_LEN while BUSY is ignored.
  leds:
  - LED_EN (CTRL bit 1) is 0 after reset; both LEDs are 0 until it is set.
  - led[0] toggles every 12,500,000 clk_c3 cycles while LED_EN is 1; led[1] toggles
    every 78,125,000 clk_ref cycles while LED_EN is 1.
  - With LED_EN 0 both LEDs are 0.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546373633
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESSE2 word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] read-back value'
  - offset: 16
    name: GATE_LEN
    access: RW
    reset: 156250000
    bits: '[31:0] gate length in clk_ref cycles, minimum 1000 (clamped)'
  - offset: 20
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] START self-clearing, ignored while BUSY; [1] LED_EN'
  - offset: 24
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] BUSY; [1] DONE'
  - offset: 28
    name: COUNT
    access: RO
    reset: 0
    bits: '[31:0] C3 rising edges in last completed gate'
  - offset: 32
    name: GATE_ACTUAL
    access: RO
    reset: 0
    bits: '[31:0] clk_ref cycles in last completed gate'
  - offset: 36
    name: MEAS_DONE
    access: RO
    reset: 0
    bits: '[31:0] completed measurements, wraps'
timing:
  clk_ref: 156.25 MHz, 6.4 ns; design must meet timing at this clock
  clk_c3: 25 MHz, 40 ns; asynchronous to clk_ref, documented asynchronous crossing
    (two-flop synchroniser with ASYNC_REG, set_false_path or max-delay on the crossing)
  latency:
    read: h_rdata valid 2 clk_ref cycles after h_re, held until next h_re
    write: register updated 1 clk_ref cycle after h_we
    start_to_busy: BUSY=1 within 2 clk_ref cycles of START write, DONE=0 at once
    gate: GATE_LEN clk_ref cycles; default 156,250,000 cycles = 1 s
    done: DONE, COUNT, GATE_ACTUAL valid in the same clock as the last gate cycle
  accuracy: frequency = COUNT x 156.25 MHz / GATE_ACTUAL; 25 MHz within 100 ppm expected;
    COUNT plus or minus 1 edge
resources_expected:
  luts: about 300
  ffs: about 400
  bram: 0
  dsp: 0
  gt_channels: 0
  bufg: 2
assumptions:
- assumption: The register bus clock is clk_ref (156.25 MHz) taken from the GT reference
    clock buffer into fabric.
  reason: The request states the bus clock is the reference clock.
- assumption: The top generates rst from a power-on counter of a few clk_ref cycles.
  reason: jtag_bus needs rst held a few clocks at start and the board has no reset
    pin given.
- assumption: Maximum gate length fits 32 bits so COUNT cannot overflow.
  reason: Request says COUNT cannot overflow with permitted gate lengths; C3 is slower
    than clk_ref.
- assumption: LED toggling counters run only while LED_EN is 1 and restart from 0
    on reset.
  reason: Request says LEDs are off after reset and blink only when enabled.
- assumption: data/jtag_bus.sv is used unchanged and is not in the simulation.
  reason: Request says use it unchanged and test the register port directly.
