resolved_questions:
- question: Confirm the register map (offset, width, reset value and access of every
    register).
  answer: The map in registers.map, taken from the request tables (0x000 to 0x024,
    all 32-bit).
  status: defaulted
  by: default
  default_reason: Offsets are given in the request, so the proposal only restates
    them.
  risk: high
- question: What value does a GATE_LEN write above the maximum take, and what is the
    maximum?
  answer: No upper clamp; any 32-bit value is accepted as written (at least 1000).
  status: defaulted
  by: default
  default_reason: The request gives only a minimum.
  risk: medium
- question: What does CTRL read back for bit 0?
  answer: 0 (self-clearing), bit 1 reads LED_EN.
  status: defaulted
  by: default
  default_reason: START is self-clearing; read value is not stated.
  risk: medium
- question: Does LED_EN going 0 and back 1 restart the LED phase?
  answer: Counters reset to 0 and LED outputs 0 while LED_EN is 0, so the blink restarts
    from 0 on enable.
  status: defaulted
  by: default
  default_reason: The request says both LEDs are 0 with LED_EN 0.
  risk: medium
- question: Is the START write coincident with a GATE_LEN write in the same clock
    handled?
  answer: Writes are one per h_we, so they are never coincident.
  status: defaulted
  by: default
  default_reason: The register port carries one write at a time.
  risk: high
- question: Pin location and IO standard for the GT reference clock and C3 clock.
  answer: Taken from the KR260 board file (C3 LVCMOS 1.8 V per board; MGTREFCLK0 SFP
    pins).
  status: defaulted
  by: default
  default_reason: The request names the signals but not package pins other than C3.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
