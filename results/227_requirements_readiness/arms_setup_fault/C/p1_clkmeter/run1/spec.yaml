name: p1_clkmeter
title: 'P1: clock frequency meter (25 MHz C3 clock measured against the 156.25 MHz
  SFP+ GT reference clock)'
board: kr260
part: xck26-sfvc784-2LV-c
top: p1_clkmeter_top
clocks:
- name: clk_ref
  role: MGTREFCLK0 of the SFP+ quad, 156.25 MHz differential (clk_ref_p/clk_ref_n)
    through IBUFDS_GTE4 and BUFG_GT; register bus clock and ruler
  freq_mhz: 156.25
- name: clk_c3
  role: 25 MHz oscillator on pin C3, the clock under test; asynchronous to clk_ref
  freq_mhz: 25
reset:
  name: rst
  model: reprogram
  polarity: active_high
  note: No reset pin on the board; every reset is a reconfiguration of the FPGA. The
    top generates rst from a power-up shift counter in clk_ref, held for at least
    8 clocks. Synchronous to clk_ref. The C3 side LED counter is held in reset by
    a synchronised copy of rst.
parameters:
  GATE_LEN_DEFAULT: 156250000
  GATE_LEN_MIN: 1000
  LED0_TOGGLE_CYCLES: 12500000
  LED1_TOGGLE_CYCLES: 78125000
  DESIGN_ID: 546373633
  RDATA_LATENCY_CYCLES: 2
  C3_SYNC_FLOPS: 2
  RST_HOLD_CYCLES: 8
ports:
- name: clk_ref_p
  direction: input
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 P, 156.25 MHz
- name: clk_ref_n
  direction: input
  width: 1
  board_pin_role: SFP+ GT reference clock MGTREFCLK0 N
- name: clk_c3
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0] (led[0] blinks from C3 clock, led[1] from reference
    clock)
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ TX_DISABLE, constant 1 (laser off)
- name: 'core: clk'
  direction: input
  width: 1
  board_pin_role: internal, clk_ref
- name: 'core: rst'
  direction: input
  width: 1
  board_pin_role: internal, active high
- name: 'core: h_we'
  direction: input
  width: 1
  board_pin_role: internal, from jtag_bus
- name: 'core: h_re'
  direction: input
  width: 1
  board_pin_role: internal, from jtag_bus
- name: 'core: h_addr'
  direction: input
  width: 12
  board_pin_role: internal, byte address
- name: 'core: h_wdata'
  direction: input
  width: 32
  board_pin_role: internal
- name: 'core: h_rdata'
  direction: output
  width: 32
  board_pin_role: internal
- name: 'core: clk_c3'
  direction: input
  width: 1
  board_pin_role: internal, clock under test
- name: 'core: build_word'
  direction: input
  width: 32
  board_pin_role: internal, USR_ACCESSE2 word from the top
- name: 'core: led'
  direction: output
  width: 2
  board_pin_role: internal
behaviour:
  structure:
  - p1_clkmeter_top instantiates IBUFDS_GTE4 plus BUFG_GT for the reference clock,
    IBUF plus BUFG for C3, the unchanged data/jtag_bus.sv, USR_ACCESSE2, and p1_clkmeter_core
    (no vendor primitive).
  - sfp_tx_disable is tied to 1 at all times. No GT transceiver channel is used.
  registers:
  - All registers are 32 bits on 4-byte steps. Unmapped addresses read 0 and ignore
    writes. Writes to RO registers are ignored.
  - A write takes effect the clock after h_we. After h_re, h_rdata shows the addressed
    register 2 clocks later and holds it until the next h_re.
  - ID reads 0x20910001. BUILD reads the USR_ACCESSE2 word. SCRATCH reads back what
    was written and resets to 0.
  - GATE_LEN write below 1000 is stored as 1000. Readback returns the stored (clamped)
    value. A write while BUSY is ignored.
  measurement:
  - START (CTRL bit 0) is self-clearing and reads 0. START while BUSY is ignored and
    does not restart the gate.
  - An accepted START clears DONE at once and sets BUSY within 2 clocks. The gate
    runs exactly GATE_LEN clk_ref cycles.
  - C3 is passed through a 2-flop synchroniser into clk_ref; rising edges of the synchronised
    signal inside the gate are counted into a 32-bit COUNT (no saturation).
  - At the last cycle of the gate, COUNT and GATE_ACTUAL are latched and DONE is set
    and BUSY cleared in the same clock; MEAS_DONE increments by 1 (wraps at 32 bits).
  - DONE stays set until the next accepted START. GATE_ACTUAL equals the gate length
    used.
  leds:
  - LED_EN (CTRL bit 1) resets to 0. With LED_EN 0 both LEDs are 0.
  - With LED_EN 1, led[0] toggles every 12,500,000 clk_c3 cycles and led[1] toggles
    every 78,125,000 clk_ref cycles.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546373633
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: USR_ACCESSE2 word
    bits: '[31:0] bitstream USR_ACCESS word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] scratch'
  - offset: 16
    name: GATE_LEN
    access: RW
    reset: 156250000
    bits: '[31:0] gate length in clk_ref cycles, minimum 1000 (clamped)'
  - offset: 20
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] START self-clearing, ignored while busy; [1] LED_EN'
  - offset: 24
    name: STATUS
    access: RO
    reset: 0
    bits: '[0] BUSY; [1] DONE'
  - offset: 28
    name: COUNT
    access: RO
    reset: 0
    bits: '[31:0] C3 rising edges in last completed gate'
  - offset: 32
    name: GATE_ACTUAL
    access: RO
    reset: 0
    bits: '[31:0] clk_ref cycles in last completed gate'
  - offset: 36
    name: MEAS_DONE
    access: RO
    reset: 0
    bits: '[31:0] completed measurements, wraps'
timing:
  clk_ref_period_ns: 6.4
  clk_c3_period_ns: 40
  latency:
    read: h_rdata valid 2 clk_ref cycles after h_re, held until the next h_re
    write: register updated 1 clk_ref cycle after h_we
    start_to_busy: BUSY=1 within 2 clk_ref cycles of START write, DONE=0 at once
    gate: GATE_LEN clk_ref cycles (default 156,250,000 = 1 s)
  crossing: clk_c3 to clk_ref through a 2-flop synchroniser (documented asynchronous
    crossing, set_false_path or max-delay on the first flop); LED 0 logic is in the
    clk_c3 domain and drives the pin directly via a registered output.
  accuracy: COUNT is within plus or minus 1 edge of the true value; frequency = COUNT
    x 156.25 MHz / GATE_ACTUAL
resources_expected:
  luts: under 400
  ffs: under 500
  bram: 0
  dsp: 0
  gt_channels: 0
  clock_buffers: 1 BUFG_GT (ref), 1 BUFG (C3)
