assumptions:
- text: The register bus clock is clk_ref (156.25 MHz).
  reason: Stated in the request.
- text: The C3 clock is the only signal crossing asynchronously, through a 2-flop
    synchroniser.
  reason: Stated in the request; COUNT accepts plus or minus 1 edge.
- text: The top derives rst internally from a power-up counter.
  reason: The board offers no reset pin and the request says to hold rst for a few
    clocks at start.
- text: The maximum gate length keeps COUNT below 2^32 (25 MHz over a gate up to 2^32
    reference cycles gives about 6.9e8).
  reason: A 32-bit COUNT cannot overflow.
- text: The led[0] counter runs in the clk_c3 domain and LED_EN is synchronised into
    it.
  reason: The request says LED 0 blinks from the C3 clock.
- text: Reads of SCRATCH, GATE_LEN and CTRL return the stored values; CTRL bit 0 reads
    0.
  reason: START is self-clearing.
open_questions: []
resolved_questions:
- question: What is the exact GATE_LEN behaviour for a write of 0 or a very large
    value (above 2^32 - 1 cannot occur)?
  answer: 0 is clamped to 1000 like any value below 1000; all other values are taken
    as is.
  status: defaulted
  by: default
  default_reason: The request clamps below 1000, which covers 0.
  risk: medium
- question: Is START written in the same clock as a GATE_LEN write while idle taken
    with the new or old length?
  answer: The new length (the write takes effect a clock after h_we, START uses the
    stored value one clock later); the test script writes GATE_LEN first.
  status: defaulted
  by: default
  default_reason: The request does not say; the script writes them separately.
  risk: high
- question: Which pins carry the LEDs, sfp_tx_disable and the GT reference clock on
    the KR260?
  answer: Taken from the board file for kr260 (roles led[1:0], SFP+ TX_DISABLE, MGTREFCLK0,
    C3).
  status: defaulted
  by: default
  default_reason: The request gives roles but only C3 as a pin.
  risk: high
- question: Does CTRL START read back 0 and LED_EN read back its value?
  answer: Yes, START reads 0 and LED_EN reads its stored value.
  status: defaulted
  by: default
  default_reason: START is self-clearing.
  risk: medium
- question: Is the register map (offset, width, reset, access) exactly as in the request
    table?
  answer: 'Yes, as given in registers.map: 0x000 ID, 0x004 BUILD, 0x008 SCRATCH, 0x010
    to 0x024 as in the table, all 32-bit.'
  status: defaulted
  by: default
  default_reason: The request lists offsets; confirming for the harness.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
