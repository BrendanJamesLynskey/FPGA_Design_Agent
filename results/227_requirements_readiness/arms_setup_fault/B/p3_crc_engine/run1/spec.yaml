name: crc32_engine
title: 'P3: Ethernet CRC-32 engine with JTAG register bus'
board: kr260
part: xck26-sfvc784-2LV-c
top: crc32_top
clocks:
- name: clk_in
  pin: C3
  freq_mhz: 25
  role: board oscillator input
- name: clk
  freq_mhz: 125
  role: core clock, generated from clk_in by an MMCM (VCO 1000 MHz, divide 8), drives
    jtag_bus and all registers
reset:
  name: rst
  polarity: active-high
  sync: synchronous to clk
  source: held while the MMCM is not locked, then released after a few clocks
parameters:
  CLK_FREQ_NOTE: 125
  DESIGN_ID: 546504705
  CRC_POLY: 79764919
  CRC_INIT: 4294967295
  CRC_XOROUT: 4294967295
  DATA_BYTES_PER_CLK: 4
  RESET_HOLD_CYCLES: 8
  SFP_TX_DISABLE_VALUE: 1
ports:
- name: clk_in
  direction: in
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, held 1 (laser off)
- name: h_we
  direction: internal
  width: 1
  board_pin_role: jtag_bus register port write pulse
- name: h_re
  direction: internal
  width: 1
  board_pin_role: jtag_bus register port read pulse
- name: h_addr
  direction: internal
  width: 12
  board_pin_role: jtag_bus byte address
- name: h_wdata
  direction: internal
  width: 32
  board_pin_role: jtag_bus write data
- name: h_rdata
  direction: internal
  width: 32
  board_pin_role: jtag_bus read data
behaviour:
  crc:
  - Reflected CRC-32, polynomial 0x04C11DB7, init 0xFFFFFFFF, final XOR 0xFFFFFFFF,
    equal to zlib.crc32 of the bytes pushed since INIT.
  - PUSH4 writes feed bytes wdata[7:0], [15:8], [23:16], [31:24] in that order, all
    four in one clock.
  - PUSH_N feeds the low TAIL_LEN bytes of wdata, bits 7:0 first. TAIL_LEN 0 pushes
    nothing.
  - CRC reads the finished value (final XOR applied); an empty message reads 0x00000000.
  - INIT (CTRL bit 0) restores the CRC state to 0xFFFFFFFF and clears BYTE_COUNT and
    BUSY_CYCLES, then the bit clears itself.
  counters:
  - BYTE_COUNT adds 4 per PUSH4 and TAIL_LEN per PUSH_N.
  - BUSY_CYCLES adds 1 for each clock in which the CRC datapath processes a push (PUSH4,
    or PUSH_N with TAIL_LEN above 0).
  - A message of N full words gives BUSY_CYCLES = N.
  bus:
  - A write takes effect the clock after h_we. After h_re, h_rdata shows the addressed
    register within 2 clocks and holds it.
  - Unmapped addresses read 0 and ignore writes. Write-only registers read 0. Writes
    to RO registers are ignored.
  - jtag_bus.sv is used unchanged; simulation drives the h_* register port directly.
  - A push sent in the same clock as INIT is not expected; INIT wins if it happens.
  board:
  - ID reads 0x20930001. BUILD reads the USR_ACCESSE2 word. SCRATCH is 32 bits RW,
    resets to 0.
  - sfp_tx_disable is driven 1 at all times. No GT transceiver is used.
  - led[1:0] show a heartbeat on led[0] and the lower bit of BUSY_CYCLES activity
    on led[1] (cosmetic).
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546504705
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 data
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 INIT self-clearing; 31:1 reserved, read 0
  - offset: 20
    name: PUSH4
    access: WO
    reset: 0
    bits: 31:0 four bytes, bits 7:0 first
  - offset: 24
    name: PUSH_N
    access: WO
    reset: 0
    bits: 31:0 low TAIL_LEN bytes used
  - offset: 28
    name: TAIL_LEN
    access: RW
    reset: 0
    bits: 1:0 N, 0 to 3; 31:2 read 0
  - offset: 32
    name: CRC
    access: RO
    reset: 0
    bits: 31:0 finished CRC-32
  - offset: 36
    name: BYTE_COUNT
    access: RO
    reset: 0
    bits: 31:0 bytes pushed
  - offset: 40
    name: BUSY_CYCLES
    access: RO
    reset: 0
    bits: 31:0 busy clocks
timing:
  clock: 125 MHz core clock (8 ns period), at least the 100 MHz requested
  throughput: 4 bytes per clock, 500 MB/s at 125 MHz
  latency:
    write_effect: 1 clock after h_we
    read_data: valid within 2 clocks after h_re and held
    push4_to_crc: CRC register updated 1 clock after h_we
resources_expected:
  lut: 400
  ff: 300
  bram: 0
  dsp: 0
  mmcm: 1
  other: BSCANE2 and USR_ACCESSE2 primitives
assumptions:
- assumption: Core clock is 125 MHz from an MMCM on the 25 MHz input.
  reason: The request needs at least 100 MHz and only a 25 MHz pin exists; 125 MHz
    has VCO 1000 MHz and meets timing easily for a 32-bit CRC.
- assumption: A PUSH_N with N 1 to 3 counts as one busy cycle, PUSH_N with N 0 counts
    none.
  reason: The datapath processes one push per clock; the request checks BUSY_CYCLES
    only for full-word messages.
- assumption: Writing CTRL stores only bit 0 as a pulse; CTRL reads 0.
  reason: INIT is self-clearing.
- assumption: TAIL_LEN values 4 to 7 are not written; only bits 1:0 are stored.
  reason: The request limits N to 0 to 3.
- assumption: BYTE_COUNT and BUSY_CYCLES are 32-bit and wrap.
  reason: Registers are 32 bits.
open_questions: []
