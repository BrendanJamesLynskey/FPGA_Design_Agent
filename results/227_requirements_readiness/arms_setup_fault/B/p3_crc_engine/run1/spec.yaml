- id: REQ-20
  text: INIT clears BYTE_COUNT.
  proof:
  - simulation
- id: REQ-21
  text: INIT clears BUSY_CYCLES.
  proof:
  - simulation
- id: REQ-22
  text: CTRL bit 0 reads 0 after INIT.
  proof:
  - simulation
- id: REQ-23
  text: SCRATCH resets to 0.
  proof:
  - simulation
  - hardware
- id: REQ-24
  text: After h_re, h_rdata keeps showing the value of the register addressed when
    h_re was pulsed, even if h_addr changes while h_re is low.
  proof:
  - simulation
  - formal
  kind: functional
  modal: shall
  source: answer Q3
  worked:
  - 'h_re pulsed for one clock on ID (0x20930001), then h_addr changes to another
    register: h_rdata still shows 0x20930001.'
  never: h_rdata switches to the register at the new h_addr or goes to 0.
- id: REQ-25
