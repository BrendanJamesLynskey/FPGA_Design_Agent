  kind: functional
  modal: shall
  source: answer Q5
  l2: {}
  worked:
  - 'INIT is written on the same clock edge that a PUSH4 is presented: afterwards
    BUSY_CYCLES reads 0.'
  never: The word pushed on the same clock as INIT is counted in BUSY_CYCLES.
- id: REQ-30
  text: When INIT and a PUSH4 occur on the same clock edge, INIT takes priority and
    the pushed word is dropped, so the CRC state is the same as after INIT alone.
  proof:
  - simulation
  - formal
  kind: functional
  modal: shall
  source: answer Q5
  l2: {}
  worked:
  - 'INIT is written on the same clock edge that a PUSH4 is presented: afterwards
    the CRC state equals the state after INIT with no push.'
  never: The word pushed on the same clock as INIT changes the CRC state.
- id: REQ-31
  text: A read of SCRATCH in the clock immediately after the h_we that wrote it returns
    the written value.
  proof:
  - simulation
  - formal
  kind: functional
  modal: shall
  source: answer Q6
  worked:
  - 'h_we writes SCRATCH=0xA and h_re reads SCRATCH in the very next clock: the read
    returns 0xA.'
  never: The read in the clock right after the write returns the old SCRATCH value.
- id: REQ-32
  text: Writing TAIL_LEN stores only bits 1:0 of the written value.
  proof:
  - simulation
  kind: functional
  modal: shall
  source: answer Q7
  worked:
  - 'TAIL_LEN is written with 4: TAIL_LEN becomes 0, a following PUSH_N pushes nothing
    and BYTE_COUNT still reads 0 after INIT.'
  never: A TAIL_LEN value of 4 or more is stored or makes PUSH_N push bytes.
- id: REQ-33
  text: BYTE_COUNT reads 0 after reset when no INIT has been issued.
  proof:
  - simulation
  kind: functional
  modal: shall
  source: answer Q8
  worked:
  - After reset release with no INIT, a read of BYTE_COUNT returns 0, even if earlier
    pushes had been made before reset.
  never: BYTE_COUNT keeps a pre-reset value after reset without INIT.
- id: REQ-34
  text: BYTE_COUNT wraps around as a 32-bit counter.
  proof:
  - simulation
  - formal
  kind: functional
  modal: shall
  source: answer Q9
  worked:
  - 'BYTE_COUNT is 0xFFFFFFFC and one more PUSH4 is issued: BYTE_COUNT reads 0x00000000.'
  never: BYTE_COUNT saturates at 0xFFFFFFFF or stays at 0xFFFFFFFC after the push.
resolved_questions:
- question: Does a PUSH_N with N 1 to 3 add 1 to BUSY_CYCLES?
  answer: Yes. BUSY_CYCLES counts one per clock in which a push is processed, and
    that includes a PUSH_N with N from 1 to 3. Only a PUSH_N with N = 0 does not count.
  status: answered
  by: oracle
  default_reason: The request fixes BUSY_CYCLES only for full words.
  risk: medium
- question: What clock frequency do you want?
  answer: 156.25 MHz. The data clock is the register bus clock, which must be at least
    100 MHz, so the proposed 125 MHz default is not what the spec states.
  status: answered
  by: oracle
  default_reason: At least 100 MHz is required; the C3 clock is 25 MHz.
  risk: high
- question: What do the LEDs show?
  answer: led[0] heartbeat, led[1] busy activity.
  status: defaulted
  by: oracle
  default_reason: The request gives no LED function.
  risk: medium
- question: Confirm the register map (offset, width, reset value and access of every
    register).
  answer: Yes, with the map taken from the spec tables, not from a file called registers.map
    (the spec does not mention that file). All registers are 32 bits wide on 4-byte
    steps. 0x000 ID is RO and reads 0x20930001. 0x004 BUILD is RO and holds the USR_ACCESS
    word. 0x008 SCRATCH is RW and resets to 0. 0x010 CTRL is RW (bit 0 INIT, self-clearing)
    and resets to 0. 0x014 PUSH4 is WO. 0x018 PUSH_N is WO. 0x01C TAIL_LEN is RW,
    stores only bits 1:0 and resets to 0. 0x020 CRC is RO and reads 0x00000000 at
    reset (internal state 0xFFFFFFFF, final XOR applied on read). 0x024 BYTE_COUNT
    is RO and resets to 0. 0x028 BUSY_CYCLES is RO and resets to 0. Unmapped addresses
    read 0 and ignore writes. Writes to read-only registers are ignored.
  status: answered
  by: oracle
  default_reason: Offsets are named in the request; confirm no others are needed.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'No, the default does not hold. The design has a reset input: `rst`, active
    high, which is held for a few clocks at start. The core module `p3_crc_engine_core`
    has `rst` among its ports, and the reset values are specified (CRC state 0xFFFFFFFF,
    BYTE_COUNT 0, BUSY_CYCLES 0, TAIL_LEN 0, CTRL 0). The specification does not say
    whether reset can also be applied while the design is running, so I cannot settle
    that part.'
  status: answered
  by: oracle
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
- question: 'Which verification profile should this run use? Profiles: prototype:
    fastest: lint and directed tests to V1; no coverage, no formal, no netlist checks;
    standard: today''s default: V3 with the floors, constrained-random, bounded formal
    on the control logic, board smoke run; thorough: standard plus the netlist checks
    (functional simulation of the synthesised netlist, equivalence), 8 seeds, deeper
    formal; ip_release: thorough plus an independent spec bench, mutation floor 85,
    induction and PDR proofs, pyuvm bench: what a library ''verified'' label needs;
    high_dependability: thorough plus the structures the interview chose (ECC, parity,
    safe FSM, TMR, watchdog) and fault-injection simulation; low_latency: standard
    plus the latency budget checks and the latency-path documentation rule. Answer
    with a profile name.'
  answer: standard
  status: defaulted
  by: oracle
  default_reason: 'nothing in the spec asks for more or less; standard is the default
    and what runs today. measured on the development design: 9 s of checks against
    9 s for standard (model time not included)'
  risk: low
- question: 'Is this a production build that must be hard to copy, read back or debug?
    A yes turns on: readback security and JTAG access to the system monitor and the
    BSCAN block off, no debug core or debug port in the built design, and system-monitor
    alarms wired to a latched safe shutdown; the build then fails a gate for each
    of these that Vivado''s own outputs do not show. Bitstream encryption and authentication
    are requested too, but on a Zynq MPSoC (the KR260) they are boot-image steps that
    are yours: the record lists them as handed over, never as done. You keep the key:
    the agent never makes, stores or programs one (eFUSE and BBRAM are yours). Answer
    yes or no.'
  answer: 'no'
  status: defaulted
  by: oracle
  default_reason: 'nothing in the spec asks for a protected or production build. cost:
    not measured yet'
  risk: high
production_secure:
  answer: 'no'
  status: defaulted
  value: false
verif_profile: standard
dependability: []
