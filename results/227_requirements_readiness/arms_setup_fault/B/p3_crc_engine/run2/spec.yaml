name: p3_crc32
title: 'P3: CRC-32 engine, 4 bytes per clock, JTAG register bus'
board: kr260
part: xck26-sfvc784-2LV-c
top: crc32_top
clocks:
- name: clk
  source: MMCM output derived from the 25 MHz board clock on pin C3 (pin role clk_25mhz)
  frequency_mhz: 100
  note: 100 MHz meets the 'at least 100 MHz' request; the 32-bit parallel CRC is a
    few LUT levels
- name: clk_25
  source: pin C3, 25 MHz, feeds only the MMCM
  frequency_mhz: 25
reset:
  name: rst
  polarity: active_high
  type: synchronous
  source: held while the MMCM is not locked, plus a few clocks after lock (at least
    8 cycles of clk)
parameters:
  DESIGN_ID: 546504705
  CRC_POLY: 79764919
  CRC_INIT: 4294967295
  CRC_XOROUT: 4294967295
  DATA_BYTES: 4
  RST_HOLD_CYCLES: 8
  READ_LATENCY_CYCLES: 1
ports:
- name: clk_25
  direction: in
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx disable, constant 1 (laser off)
- name: h_we
  direction: internal_in
  width: 1
  board_pin_role: 'from jtag_bus (no pin): write pulse'
- name: h_re
  direction: internal_in
  width: 1
  board_pin_role: 'from jtag_bus (no pin): read pulse'
- name: h_addr
  direction: internal_in
  width: 12
  board_pin_role: 'from jtag_bus (no pin): byte address'
- name: h_wdata
  direction: internal_in
  width: 32
  board_pin_role: 'from jtag_bus (no pin): write data'
- name: h_rdata
  direction: internal_out
  width: 32
  board_pin_role: 'to jtag_bus (no pin): read data'
behaviour:
  crc:
  - CRC-32 reflected, polynomial 0x04C11DB7 (reflected 0xEDB88320), init 0xFFFFFFFF,
    final XOR 0xFFFFFFFF; result equals zlib.crc32 of the bytes pushed since INIT.
  - The CRC register reads the finished value (state XOR 0xFFFFFFFF); with no bytes
    pushed it reads 0x00000000.
  - Write to PUSH4 processes 4 bytes in one clock, byte 0 = wdata[7:0] first.
  - Write to PUSH_N processes the low TAIL_LEN bytes (wdata[7:0] first) in one clock;
    TAIL_LEN 0 processes nothing.
  - A push takes effect the clock after h_we; a read after that sees the updated CRC.
  - The datapath accepts a push on every clock (one 4-byte word per clock).
  control:
  - 'CTRL bit 0 INIT is self-clearing: writing 1 sets CRC state to 0xFFFFFFFF and
    BYTE_COUNT and BUSY_CYCLES to 0; CTRL reads 0 in bit 0.'
  - If INIT and a push could land in the same clock, INIT wins.
  - TAIL_LEN is RW, holds 0 to 3.
  counters:
  - BYTE_COUNT adds 4 per PUSH4 and TAIL_LEN per PUSH_N.
  - BUSY_CYCLES adds 1 for every clock in which the datapath processed bytes (PUSH4,
    or PUSH_N with TAIL_LEN above 0); N full-word pushes give N.
  - BYTE_COUNT and BUSY_CYCLES are 32 bits and wrap.
  bus:
  - 'Register port: h_we/h_re pulses, byte addresses h_addr[11:0], 32-bit registers
    on 4-byte steps (address bits 1:0 ignored).'
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register 1 clock after h_re and holds it until the
    next h_re.
  - Unmapped addresses read 0 and ignore writes; writes to RO registers are ignored.
  - ID reads 0x20930001; BUILD reads the USR_ACCESSE2 DATA word; SCRATCH is 32-bit
    RW reset 0.
  - jtag_bus from data/jtag_bus.sv is instantiated unchanged; simulation tests the
    register port directly.
  board:
  - sfp_tx_disable is driven 1 at all times; no GT channel used.
  - led[1:0] shown per open question default.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546504705
    bits: 31:0 design ID
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: 31:0 USR_ACCESS word (bitstream)
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: 31:0 scratch
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: 0 INIT self-clearing; 31:1 reserved 0
  - offset: 20
    name: PUSH4
    access: WO
    reset: 0
    bits: 31:0 four bytes, 7:0 first; reads 0
  - offset: 24
    name: PUSH_N
    access: WO
    reset: 0
    bits: 31:0 up to 3 bytes, 7:0 first; reads 0
  - offset: 28
    name: TAIL_LEN
    access: RW
    reset: 0
    bits: 1:0 N (0 to 3); 31:2 reads 0
  - offset: 32
    name: CRC
    access: RO
    reset: 0
    bits: 31:0 finished CRC-32
  - offset: 36
    name: BYTE_COUNT
    access: RO
    reset: 0
    bits: 31:0 bytes pushed since INIT
  - offset: 40
    name: BUSY_CYCLES
    access: RO
    reset: 0
    bits: 31:0 busy clocks since INIT
timing:
  clock_period_ns: 10
  throughput: 4 bytes per clock, 400 MB/s at 100 MHz
  latency:
    push_to_crc_visible: 1 clock after h_we
    read_data: 1 clock after h_re (limit 2)
    reset_release: 8 clocks of clk after MMCM lock
resources_expected:
  luts: under 400
  ffs: under 400
  brams: 0
  dsps: 0
  mmcm: 1
  bscane2: 1
  usr_access: 1
assumptions:
- text: clk is 100 MHz from an MMCM fed by the 25 MHz C3 clock
  reason: the board has only 25 MHz and the request needs at least 100 MHz
- text: Reset is held by the MMCM lock status plus 8 clocks
  reason: the request says hold rst a few clocks at start
- text: BUSY_CYCLES counts a PUSH_N with N 1 to 3 as one busy cycle and N 0 as none
  reason: request defines the check only for full-word messages
- text: The host can issue at most one write per several clocks over JTAG, so one-per-clock
    is shown on the register port in simulation
  reason: the JTAG bus is much slower than the datapath
- text: Counters are 32 bits wide
  reason: registers are 32 bits
open_questions: []
