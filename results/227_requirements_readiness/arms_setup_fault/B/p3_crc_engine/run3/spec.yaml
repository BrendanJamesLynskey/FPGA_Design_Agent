assumptions:
- assumption: The 100 MHz core clock comes from an MMCM driven by the 25 MHz C3 pin.
  reason: Only a 25 MHz pin is given and the request asks for at least 100 MHz.
- assumption: rst is generated internally from MMCM lock plus RST_HOLD_CYCLES clocks.
  reason: No reset pin is given; jtag_bus needs rst held a few clocks.
- assumption: Byte counters are 32 bits and wrap.
  reason: Registers are 32 bits and 4 GB messages are out of scope.
- assumption: Back-to-back pushes are tested at the register port; JTAG itself is
    far slower than one push per clock.
  reason: jtag_bus needs many TCK cycles per command.
open_questions: []
resolved_questions:
- question: Which clock frequency should be used?
  answer: Use 156.25 MHz as the data clock (the register bus clock). It must be at
    least 100 MHz, so the proposed 100 MHz default is not what the user specified.
  status: answered
  by: oracle
  default_reason: Meets the 100 MHz minimum with easy timing for a 32-bit parallel
    CRC.
  risk: high
- question: Does PUSH_N with N > 0 count as one busy cycle and PUSH_N with N = 0 as
    none?
  answer: Yes. Each clock in which a PUSH4 or a PUSH_N with N>0 is processed counts
    as one busy cycle, and a PUSH_N with N = 0 does not count.
  status: answered
  by: oracle
  default_reason: The request only defines busy cycles for full-word messages.
  risk: high
- question: What happens when TAIL_LEN is written with a value above 3?
  answer: TAIL_LEN values above 3 cannot be written. The upper bits of the written
    value are ignored and only bits 1:0 are stored. The spec does not state separately
    what the upper bits read back as.
  status: answered
  by: oracle
  default_reason: The request says N is 0 to 3 and gives no behaviour for other values.
  risk: high
- question: What do the LEDs show?
  answer: led[0] = MMCM locked, led[1] = push activity stretched to about 0.1 s
  status: defaulted
  by: oracle
  default_reason: The request names the LEDs but gives them no function.
  risk: medium
- question: Please confirm the register map (offset, width, reset value and access
    of every register).
  answer: 'The offsets, names, access and 32-bit width in your proposed map match
    the specification. Reset values: ID reads 0x20930001, BUILD is the USR_ACCESS
    word, SCRATCH, CTRL, TAIL_LEN, BYTE_COUNT and BUSY_CYCLES reset to 0, and CRC
    reads 0x00000000 at reset. The specification does not say what PUSH4 and PUSH_N
    (write-only) return when read, so ''write-only registers read 0'' is not confirmed.
    Only unmapped addresses are stated to read 0.'
  status: answered
  by: oracle
  default_reason: Offsets are given in the request; reads of write-only registers
    are not.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'The design does have a reset input: `rst`, active high, which is held for
    a few clocks at start. So the reset model is a reset (a restart of the running
    design), not reprogram. The core ports include `rst`.'
  status: answered
  by: oracle
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
- question: 'Which verification profile should this run use? Profiles: prototype:
    fastest: lint and directed tests to V1; no coverage, no formal, no netlist checks;
    standard: today''s default: V3 with the floors, constrained-random, bounded formal
    on the control logic, board smoke run; thorough: standard plus the netlist checks
    (functional simulation of the synthesised netlist, equivalence), 8 seeds, deeper
    formal; ip_release: thorough plus an independent spec bench, mutation floor 85,
    induction and PDR proofs, pyuvm bench: what a library ''verified'' label needs;
    high_dependability: thorough plus the structures the interview chose (ECC, parity,
    safe FSM, TMR, watchdog) and fault-injection simulation; low_latency: standard
    plus the latency budget checks and the latency-path documentation rule. Answer
    with a profile name.'
  answer: standard
  status: defaulted
  by: oracle
  default_reason: 'nothing in the spec asks for more or less; standard is the default
    and what runs today. measured on the development design: 9 s of checks against
    9 s for standard (model time not included)'
  risk: low
- question: 'Is this a production build that must be hard to copy, read back or debug?
    A yes turns on: readback security and JTAG access to the system monitor and the
    BSCAN block off, no debug core or debug port in the built design, and system-monitor
    alarms wired to a latched safe shutdown; the build then fails a gate for each
    of these that Vivado''s own outputs do not show. Bitstream encryption and authentication
    are requested too, but on a Zynq MPSoC (the KR260) they are boot-image steps that
    are yours: the record lists them as handed over, never as done. You keep the key:
    the agent never makes, stores or programs one (eFUSE and BBRAM are yours). Answer
    yes or no.'
  answer: 'no'
  status: defaulted
  by: oracle
  default_reason: 'nothing in the spec asks for a protected or production build. cost:
    not measured yet'
  risk: high
production_secure:
  answer: 'no'
  status: defaulted
  value: false
verif_profile: standard
dependability: []
