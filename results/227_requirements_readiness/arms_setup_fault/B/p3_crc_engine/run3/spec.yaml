name: p3_crc32
title: 'P3: CRC-32 engine (Ethernet, 4 bytes per clock) behind a JTAG register bus'
board: kr260
part: xck26-sfvc784-2LV-c
top: crc32_top
clocks:
- name: clk
  source: C3 pin 25 MHz, scaled by an MMCM (VCO 1000 MHz, divide 10) to 100 MHz
  frequency_mhz: 100
  input_pin_role: clk_25 (C3, 25 MHz)
reset:
  name: rst
  polarity: active_high
  style: synchronous
  source: held while the MMCM is not locked, plus a few clocks after lock (RST_HOLD_CYCLES)
parameters:
  DESIGN_ID: '0x20930001'
  POLY: 0x04C11DB7 (reflected form 0xEDB88320)
  CRC_INIT: '0xFFFFFFFF'
  CRC_XOROUT: '0xFFFFFFFF'
  RST_HOLD_CYCLES: 16
  DATA_WIDTH: 32
  COUNTER_WIDTH: 32
  ADDR_WIDTH: 12
ports:
- name: clk_25
  direction: input
  width: 1
  board_pin_role: 25 MHz clock, pin C3
- name: led
  direction: output
  width: 2
  board_pin_role: user LEDs led[1:0]
- name: sfp_tx_disable
  direction: output
  width: 1
  board_pin_role: SFP+ tx disable, driven constant 1 (laser off)
- name: jtag_bus internal (clk, rst, h_we, h_re, h_addr[11:0], h_wdata[31:0], h_rdata[31:0])
  direction: internal
  width: 1
  board_pin_role: BSCANE2 USER4 inside data/jtag_bus.sv, no board pin
behaviour:
  bus:
  - data/jtag_bus.sv is instantiated unchanged; its register port runs in the clk
    domain.
  - A write takes effect the clock after h_we.
  - h_rdata shows the addressed register within 2 clocks of h_re and holds it (registered
    read mux, 1 clock).
  - Unmapped addresses read 0 and ignore writes. Write-only registers (PUSH4, PUSH_N)
    read 0. Writes to RO registers are ignored.
  - Only h_addr[11:2] is decoded; registers sit on 4-byte steps.
  crc:
  - CRC-32 reflected, polynomial 0x04C11DB7, init 0xFFFFFFFF, final XOR 0xFFFFFFFF,
    equal to zlib.crc32 of the bytes in push order.
  - PUSH4 consumes 4 bytes in one clock, bits 7:0 first, via a 32-bit parallel update.
  - PUSH_N consumes the low N bytes (N = TAIL_LEN, 0 to 3), bits 7:0 first; N = 0
    changes nothing.
  - CRC reads the running state XOR 0xFFFFFFFF, so an empty message reads 0x00000000.
  - BYTE_COUNT adds 4 per PUSH4 and N per PUSH_N.
  - Pushes may arrive on consecutive clocks (h_we every clock) with no stall and no
    loss.
  init:
  - CTRL bit 0 written as 1 sets the CRC state to 0xFFFFFFFF and BYTE_COUNT and BUSY_CYCLES
    to 0, then reads back 0 (self-clearing).
  busy:
  - BUSY_CYCLES increments by 1 for each clock in which the datapath processes a PUSH4
    or a PUSH_N with N > 0.
  - A message of N full words gives BUSY_CYCLES = N.
  common:
  - ID at 0x000 reads 0x20930001. BUILD at 0x004 reads the USR_ACCESSE2 DATA word.
    SCRATCH at 0x008 reads back the written value and resets to 0.
  board:
  - sfp_tx_disable is 1 at all times. No GT transceiver is used.
  - led[0] shows MMCM locked, led[1] toggles on each push (visible stretch).
registers:
  map:
  - offset: '0x000'
    name: ID
    access: RO
    reset: '0x20930001'
    bits: 31:0 design ID
  - offset: '0x004'
    name: BUILD
    access: RO
    reset: USR_ACCESS word
    bits: 31:0 USR_ACCESSE2 DATA
  - offset: '0x008'
    name: SCRATCH
    access: RW
    reset: '0x00000000'
    bits: 31:0 data
  - offset: '0x010'
    name: CTRL
    access: RW
    reset: '0x00000000'
    bits: 0 INIT self-clearing (reads 0); 31:1 reserved, read 0
  - offset: '0x014'
    name: PUSH4
    access: WO
    reset: '0x00000000'
    bits: 31:0 four bytes, bits 7:0 first; reads 0
  - offset: '0x018'
    name: PUSH_N
    access: WO
    reset: '0x00000000'
    bits: 31:0 low N bytes pushed, bits 7:0 first; reads 0
  - offset: '0x01C'
    name: TAIL_LEN
    access: RW
    reset: '0x00000000'
    bits: 1:0 N (0 to 3); 31:2 read 0
  - offset: '0x020'
    name: CRC
    access: RO
    reset: '0x00000000'
    bits: 31:0 finished CRC-32
  - offset: '0x024'
    name: BYTE_COUNT
    access: RO
    reset: '0x00000000'
    bits: 31:0 bytes pushed since INIT
  - offset: '0x028'
    name: BUSY_CYCLES
    access: RO
    reset: '0x00000000'
    bits: 31:0 busy clocks since INIT
timing:
  clock_mhz: 100
  throughput: 4 bytes per clock = 400 MB/s at 100 MHz, one PUSH4 accepted every clock
  latency:
    register_write: 1 clock from h_we to the register taking the value
    crc_update: CRC register updated 1 clock after a push write; readable on the next
      read
    register_read: h_rdata valid 1 clock after h_re, at most 2
    init: state cleared 1 clock after the CTRL write
resources_expected:
  luts: about 250
  ffs: about 300
  brams: 0
  dsps: 0
  other: 1 MMCM, 1 BSCANE2, 1 USR_ACCESSE2, xpm_cdc cells inside jtag_bus
