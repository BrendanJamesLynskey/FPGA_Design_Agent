resolved_questions:
- question: 'Give the register map: offset, width, reset value and access (RO, RW
    or WO) of every shell register, and whether offsets are byte or word addressed.'
  answer: 'Byte-addressed 32-bit registers: 0x00 ID RO reset 0x47524159; 0x04 GRAY
    RO reset 0x000; 0x08 COUNT RW reset 0x000 (bits 9:0); 0x0C CTRL RW reset 0 (bit
    0 auto_en); 0x10 RATE RW reset 0 (bits 15:0); 0x14 STEPS RO reset 0 (bits 31:0).'
  status: defaulted
  by: default
  default_reason: spec.md names the shell registers and the values read back but gives
    no offsets, so the map is proposed here and must be confirmed.
- question: Does SW[15] also set the direction of automatic steps?
  answer: Yes, SW[15] sets the direction of button and automatic steps alike.
  status: defaulted
  by: default
  default_reason: the request ties SW[15] to the counter direction and says buttons
    work in automatic mode without naming a different direction.
- question: What happens when BTNU is held down?
  answer: 'One step per press: a step is requested only on the debounced rising edge,
    and holding the button does not repeat steps.'
  status: defaulted
  by: default
  default_reason: the request says one press gives exactly one step, and a held button
    is still one press.
- question: When an automatic step and a button step fall in the same clock, how are
    they ordered?
  answer: The automatic step is applied on that clock and the button step is applied
    on the next clock with no automatic step, so the automatic timing stays exact.
  status: defaulted
  by: default
  default_reason: one step per clock keeps the one-LED-change property and the request
    requires automatic steps exactly the set rate apart.
- question: What is DEBOUNCE_CYCLES on the board?
  answer: 1000000 clocks (10 ms at 100 MHz).
  status: defaulted
  by: default
  default_reason: the request gives no debounce time; 10 ms is a common pushbutton
    settle time and is far longer than typical bounce.
- question: What is TICK_CYCLES on the board?
  answer: 100000 clocks (1 ms at 100 MHz).
  status: defaulted
  by: default
  default_reason: the request states that the rate unit is one millisecond on the
    board, so one millisecond is 100000 clocks of the 100 MHz clock.
- question: What range does the RATE value have?
  answer: 16-bit unsigned, 0 to 65535 ms per step.
  status: defaulted
  by: default
  default_reason: the request gives no range; 16 bits covers about 65 s per step.
- question: How wide is the steps counter, what happens when it wraps, and what clears
    it?
  answer: 32 bits, wraps modulo 2^32, cleared only by CPU_RESETN.
  status: defaulted
  by: default
  default_reason: the request asks for the number of steps taken but gives no width
    or clear rule.
- question: Does writing RATE or enabling automatic mode restart the automatic period?
  answer: Yes, the subcounter and ms counter restart at zero, so the first automatic
    step comes one full period later.
  status: defaulted
  by: default
  default_reason: the request requires exact spacing of automatic steps, which needs
    a defined phase at every change.
- question: Does a COUNT write change the automatic timing or the steps counter?
  answer: No, the count changes at once, the automatic timer keeps running and the
    steps counter is not changed.
  status: defaulted
  by: default
  default_reason: the request does not say; a set is not a step, so the step count
    must not change.
- question: What value does TIMEOUT_CYCLES take?
  answer: 1000000 clocks (10 ms at 100 MHz).
  status: defaulted
  by: default
  default_reason: the request names the parameter but gives no value; it must cover
    several UART bytes, about 8680 clocks per byte, with margin.
- question: What value does BUILD_STAMP take and where is it read?
  answer: 0 as a parameter only, not in the register map, overwritten by the build
    when set.
  status: defaulted
  by: default
  default_reason: the request names the parameter but gives no value or read path.
- question: What happens when the host writes a read-only register (ID, GRAY, STEPS)?
  answer: The write is ignored and the register keeps its value; the shell still answers
    normally.
  status: defaulted
  by: limit
  default_reason: the request names read-only values but does not say how writes to
    them are answered.
