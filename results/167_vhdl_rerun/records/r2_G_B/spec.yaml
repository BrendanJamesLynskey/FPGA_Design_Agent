name: gray_stepper
title: Gray-code stepper on the LEDs
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: t1_gray_stepper_top
clocks:
- name: clk100mhz
  port: CLK100MHZ
  frequency: 100 MHz, period 10 ns
  role: all logic; every timing parameter is a count of this clock
reset:
  name: rst_n
  port: CPU_RESETN
  polarity: active_low
  behaviour: asserted asynchronously, released synchronously to clk100mhz; resets
    every register and counter
parameters:
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 1000000
  BUILD_STAMP: 0
  DEBOUNCE_CYCLES: 1000000
  TICK_CYCLES: 100000
ports:
- name: CLK100MHZ
  direction: input
  width: 1
  role: 100 MHz board oscillator
- name: CPU_RESETN
  direction: input
  width: 1
  role: CPU reset pushbutton, active low
- name: BTNU
  direction: input
  width: 1
  role: up pushbutton; each press gives one step
- name: SW
  direction: input
  width: 16
  role: slide switches; SW[15] is the direction (1 down, 0 up); SW[14:0] unused
- name: LED
  direction: output
  width: 16
  role: LED[9:0] Gray value of the count; LED[15] automatic mode on; LED[14:10] always
    off
- name: UART_TXD_IN
  direction: input
  width: 1
  role: USB-UART receive into the FPGA (host transmit), 115200 baud
- name: UART_RXD_OUT
  direction: output
  width: 1
  role: USB-UART transmit from the FPGA (host receive), 115200 baud
behaviour:
  debounce:
  - BTNU passes through a two-flop synchroniser before the debouncer
  - the debounced BTNU level changes only after the synchronised level holds the same
    value for DEBOUNCE_CYCLES consecutive clocks
  - one button step is requested on each rising edge of the debounced BTNU level
  step_control:
  - an applied step adds +1 to the 10-bit binary count when SW[15] is 0 and adds -1
    when SW[15] is 1, arithmetic modulo 1024
  - at most one step is applied per clock
  - when an automatic step and a button step are requested in the same clock, the
    automatic step is applied and the button step stays pending until the next clock
    with no automatic step
  - each applied step increments the 32-bit steps counter by one
  - a write to COUNT changes the binary count directly, is not an applied step and
    does not change the steps counter
  gray_output:
  - LED[9:0] = count XOR (count shifted right by one), a combinational function of
    the binary count
  automatic:
  - auto_en is set and cleared only by CTRL bit 0 written over the shell
  - rate_ms is a 16-bit unsigned value written over the shell
  - a 1 ms subcounter counts TICK_CYCLES clocks and wraps; each wrap increments a
    ms counter; when the ms counter equals rate_ms an automatic step is requested
    and the ms counter restarts at zero
  - rate_ms = 0 requests no automatic steps
  - auto_en = 0 requests no automatic steps and holds the subcounter and ms counter
    at zero
  - a write to RATE or a set of auto_en restarts the subcounter and ms counter at
    zero
  - a button step does not change the subcounter or the ms counter
  led_status:
  - LED[15] = auto_en
  - LED[14:10] = 0 at all times
  shell:
  - ID register reads 0x47524159 (ASCII GRAY)
  - GRAY register reads LED[9:0] as the Gray code of the count
  - COUNT register read returns the 10-bit binary count in bits 9:0 with bits 31:10
    read as 0; a write sets the binary count to bits 9:0
  - CTRL bit 0 reads and writes auto_en
  - RATE register reads and writes rate_ms
  - STEPS register reads the 32-bit steps counter
  reset:
  - CPU_RESETN low sets the count, steps counter, rate_ms, auto_en, subcounter, ms
    counter and debounce state to 0
registers:
  map:
  - offset: '0x00'
    name: ID
    access: RO
    reset: '0x47524159'
    bits: 31:0 ASCII GRAY
  - offset: '0x04'
    name: GRAY
    access: RO
    reset: '0x000'
    bits: 9:0 Gray code of the binary count
  - offset: '0x08'
    name: COUNT
    access: RW
    reset: '0x000'
    bits: 9:0 binary count
  - offset: '0x0C'
    name: CTRL
    access: RW
    reset: '0x0'
    bits: 0 auto_en
  - offset: '0x10'
    name: RATE
    access: RW
    reset: '0x0000'
    bits: 15:0 rate_ms, milliseconds per automatic step
  - offset: '0x14'
    name: STEPS
    access: RO
    reset: '0x00000000'
    bits: 31:0 applied steps since reset
timing:
  latency:
    button_to_step: DEBOUNCE_CYCLES + 3 clocks from the BTNU edge to the count change
    automatic_step_interval: rate_ms * TICK_CYCLES clocks, exact, between consecutive
      automatic steps
    shell_write_to_effect: within 2 clocks of the UART write being decoded
    uart_byte: 10 bit times of CLKS_PER_BIT clocks each
resources_expected:
  luts: under 400 (estimate, includes UART and shell)
  ffs: under 300 (estimate)
  brams: 0
  dsps: 0
  timing: meets 100 MHz with no failing setup or hold slack
assumptions:
- text: port names CLK100MHZ, CPU_RESETN, BTNU, SW, LED, UART_TXD_IN and UART_RXD_OUT
    are the names used in the Digilent Nexys A7-100T master XDC
  reason: the request asks for ports named as in the board master XDC; these are the
    standard master XDC names for this board
- text: the board oscillator is 100 MHz
  reason: the Nexys A7 oscillator is 100 MHz and CLKS_PER_BIT and TICK_CYCLES are
    computed from it
- text: BTNU is synchronised with two flip-flops before debouncing
  reason: the pushbutton is asynchronous to the clock and must not feed the step logic
    directly
- text: only SW[15] is used; SW[14:0] are ignored
  reason: the request defines a direction switch only
- text: rate_ms resets to 0 and auto_en resets to 0
  reason: the request says reset resets everything and rate 0 stands still, so no
    automatic steps happen until the shell enables them
- text: the shell handles one UART request at a time and answers each read or write
    before the next request
  reason: a single-request serial shell is the usual test-shell form; overlapping
    requests are not in the request
- text: the steps counter is 32 bits and is read-only over the shell
  reason: the request asks only to read how many steps have been taken
open_questions: []
