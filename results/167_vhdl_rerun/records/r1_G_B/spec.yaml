  - simulation
  - formal
- id: REQ-02
  text: A BTNU bounce shorter than DEBOUNCE_CYCLES clocks produces no step
  proof:
  - simulation
- id: REQ-03
  text: With SW[15] equal to 0 a step increases the count by 1 modulo 1024
  proof:
  - simulation
  - formal
- id: REQ-04
  text: With SW[15] equal to 1 a step decreases the count by 1 modulo 1024
  proof:
  - simulation
  - formal
- id: REQ-05
  text: On every step exactly one bit of LED[9:0] changes
  proof:
  - formal
  - simulation
- id: REQ-06
  text: The step from count 1023 to count 0 changes exactly one bit of LED[9:0]
  proof:
  - simulation
  - formal
- id: REQ-07
  text: The step from count 0 to count 1023 changes exactly one bit of LED[9:0]
  proof:
  - simulation
  - formal
- id: REQ-08
  text: Every one of the 1024 steps in the up direction matches the Gray reference
    model
  proof:
  - simulation
- id: REQ-09
  text: Every one of the 1024 steps in the down direction matches the Gray reference
    model
  proof:
  - simulation
- id: REQ-10
  text: LED[9:0] equals count XOR (count shifted right by 1) after every clock
  proof:
  - simulation
  - formal
- id: REQ-11
  text: LED[15] is 1 exactly when auto enable is 1
  proof:
  - simulation
  - hardware
- id: REQ-12
  text: LED[14:10] are 0 at all times
  proof:
  - simulation
  - formal
- id: REQ-13
  text: With RATE equal to 0 no automatic step occurs
  proof:
  - simulation
- id: REQ-14
  text: With RATE equal to R greater than 0 automatic steps occur every R times TICK_CYCLES
    clocks
  proof:
  - simulation
- id: REQ-15
  text: A BTNU press during automatic mode adds one step without changing the automatic
    step times
  proof:
  - simulation
- id: REQ-16
  text: STEPS increases by exactly one for each accepted button step and each automatic
    step
  proof:
  - simulation
- id: REQ-17
  text: CPU_RESETN low sets count to 0, auto enable to 0, RATE to 0 and STEPS to 0
  proof:
  - simulation
  - hardware
- id: REQ-18
  text: A shell read of ID returns 0x47524159
  proof:
  - simulation
