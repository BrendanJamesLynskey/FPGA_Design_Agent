- id: REQ-19
  text: A shell read of GRAY returns the Gray code of the current count
  proof:
  - simulation
  - hardware
- id: REQ-20
  text: A shell write to BIN loads the low 10 bits of the written value into count
  proof:
  - simulation
  - hardware
- id: REQ-21
  text: A shell write of 1 to CTRL bit 0 turns automatic mode on
  proof:
  - simulation
  - hardware
- id: REQ-22
  text: A shell write of 0 to CTRL bit 0 turns automatic mode off
  proof:
  - simulation
  - hardware
- id: REQ-23
  text: A shell write to RATE sets the automatic period to the written value in TICK_CYCLES
    units
  proof:
  - simulation
- id: REQ-24
  text: A shell read of STEPS returns the number of steps taken since reset
  proof:
  - simulation
  - hardware
- id: REQ-25
  text: The UART runs at 115200 baud with CLKS_PER_BIT equal to 868 at 100 MHz
