resolved_questions:
- question: 'Register map: give offset, width, reset value and access of every register
    the test shell reads or writes (ID, GRAY, BIN, CTRL, RATE, STEPS)'
  answer: ID 0x00 RO reset 0x47524159; GRAY 0x04 RO; BIN 0x08 RW reset 0; CTRL 0x0C
    RW bit0 auto enable; RATE 0x10 RW 32-bit; STEPS 0x14 RO 32-bit
  status: defaulted
  by: default
  default_reason: spec.md names shell registers but gives no offsets, so the proposed
    word-aligned map is used until the answer overrides it
- question: Should the step counter STEPS be 32 bits, and does it wrap or saturate
    at its maximum?
  answer: 32 bits, wraps modulo 2^32
  status: defaulted
  by: default
  default_reason: 32 bits covers over 49 days at 1 ms per step and wrapping is the
    simplest exact behaviour
- question: Does the direction bit SW[15] also apply to automatic steps, or only to
    button steps?
  answer: applies to both automatic and button steps
  status: defaulted
  by: default
  default_reason: the request describes one counter with one direction switch, so
    one rule for every step is the simplest reading
- question: What happens to the automatic period when RATE is written while auto mode
    runs?
  answer: a RATE write restarts the period counter from 0
  status: defaulted
  by: default
  default_reason: gives a deterministic first step after a rate change and matches
    a fresh start
- question: Does holding BTNU repeat steps?
  answer: no, one step per debounced press, repeat needs a release and new press
  status: defaulted
  by: default
  default_reason: the request says one press must give exactly one step
- question: Does a shell write to BIN change the STEPS counter?
  answer: no, STEPS counts only steps
  status: defaulted
  by: default
  default_reason: the request defines STEPS as steps taken, not count changes
- question: What is DEBOUNCE_CYCLES on the board?
  answer: 1000000 clocks, 10 ms at 100 MHz
  status: defaulted
  by: default
  default_reason: 10 ms is a common mechanical bounce window and is far longer than
    typical bounce
- question: What is TICK_CYCLES on the board?
  answer: 100000 clocks, 1 ms at 100 MHz
  status: defaulted
  by: default
  default_reason: the request sets the rate in milliseconds per step
- question: What meaning and value does TIMEOUT_CYCLES have in the test shell?
  answer: 1000000 clocks, 10 ms at 100 MHz, as a host-side read timeout
  status: defaulted
  by: default
  default_reason: the parameter name is given by the shell but its meaning is not
    in spec.md
- question: What value should BUILD_STAMP take?
  answer: 0, overwritten by the build flow
  status: defaulted
  by: default
  default_reason: spec.md names the parameter without a value and the build flow normally
    fills it
- question: Is LED[15] lit when auto mode is on but RATE is 0?
  answer: yes, LED[15] follows auto enable only
  status: defaulted
  by: default
  default_reason: the request ties LED[15] to automatic mode being on, not to steps
    happening
