name: gray_stepper
title: Gray-code stepper on the LEDs
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: t1_gray_stepper_top
clocks:
- name: CLK100MHZ
  period_ns: 10
  pin: E3
  note: 100 MHz board oscillator, all logic runs in this single clock domain
reset:
  name: CPU_RESETN
  polarity: active_low
  pin: C12
  type: synchronous to CLK100MHZ after a 2-flop synchroniser; assertion clears all
    state
parameters:
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 1000000
  BUILD_STAMP: 0
  DEBOUNCE_CYCLES: 1000000
  TICK_CYCLES: 100000
ports:
- name: CLK100MHZ
  direction: input
  width: 1
  board_pin_role: 100 MHz oscillator, pin E3
- name: CPU_RESETN
  direction: input
  width: 1
  board_pin_role: CPU reset button, active low, pin C12
- name: BTNU
  direction: input
  width: 1
  board_pin_role: up push button, pin M18, bounces
- name: SW
  direction: input
  width: 16
  board_pin_role: slide switches; only SW[15] is used as direction, pin V10 for SW[15]
- name: LED
  direction: output
  width: 16
  board_pin_role: LEDs; LED[9:0] show Gray code, LED[15] automatic mode indicator
- name: uart_txd_in
  direction: input
  width: 1
  board_pin_role: USB-UART receive into FPGA from host, pin C4
- name: uart_rxd_out
  direction: output
  width: 1
  board_pin_role: USB-UART transmit from FPGA to host, pin D4
behaviour:
  counter:
  - count is a 10-bit binary value, reset value 0, held in one register
  - gray output is LED[9:0] equal to count XOR (count shifted right by 1)
  - a step adds 1 modulo 1024 when SW[15] is 0 (up)
  - a step subtracts 1 modulo 1024 when SW[15] is 1 (down)
  - a step is the only operation that changes count apart from a shell write of BIN
  button:
  - BTNU is passed through a 2-flop synchroniser then a debounce counter
  - debounced level must stay unchanged for DEBOUNCE_CYCLES clocks before it is accepted
  - one accepted rising edge of the debounced BTNU level produces exactly one step
  - holding BTNU produces no further steps until it is released and pressed again
  automatic:
  - auto enable is a single bit set and cleared over the shell CTRL register
  - while auto enable is set a period counter counts clocks and produces one step
    each time it reaches RATE times TICK_CYCLES
  - RATE of 0 produces no automatic steps
  - a button step does not reset or alter the period counter
  - a write to RATE restarts the period counter from 0
  - automatic steps use the same direction as button steps
  steps:
  - STEPS counts every accepted button step and every automatic step, one increment
    per step
  - a shell write to BIN does not change STEPS
  leds:
  - LED[9:0] shows the Gray code of count at all times
  - LED[15] is 1 while auto enable is 1 and 0 otherwise
  - LED[14:10] are always 0
  shell:
  - UART is 8 data bits, no parity, 1 stop bit, 115200 baud, CLKS_PER_BIT clocks per
    bit
  - reads and writes use the register map in registers.map
  - a write to BIN loads count with the low 10 bits of the written value
  - a read of ID returns the design ID GRAY
  reset:
  - CPU_RESETN low sets count 0, auto enable 0, RATE 0, STEPS 0, debounce and period
    counters 0
registers:
  map:
  - offset: '0x00'
    name: ID
    access: RO
    reset: '0x47524159'
    bits: '[31:0] design ID ASCII GRAY'
  - offset: '0x04'
    name: GRAY
    access: RO
    reset: '0x00000000'
    bits: '[9:0] Gray code of count, [31:10] read as 0'
  - offset: '0x08'
    name: BIN
    access: RW
    reset: '0x00000000'
    bits: '[9:0] plain binary count, a write loads count, [31:10] read as 0 and ignored
      on write'
  - offset: '0x0C'
    name: CTRL
    access: RW
    reset: '0x00000000'
    bits: '[0] automatic mode enable, [31:1] read as 0 and ignored on write'
  - offset: '0x10'
    name: RATE
    access: RW
    reset: '0x00000000'
    bits: '[31:0] automatic period in TICK_CYCLES units, 0 stands still'
  - offset: '0x14'
    name: STEPS
    access: RO
    reset: '0x00000000'
    bits: '[31:0] steps taken since reset, button and automatic together'
timing:
  latency:
    button_to_step: 2 clocks synchroniser plus DEBOUNCE_CYCLES plus 1 clock
    shell_write_to_effect: at most 2 clocks after the last UART stop bit is sampled
    auto_period: RATE times TICK_CYCLES clocks between automatic steps
  constraints:
  - clock period 10 ns on CLK100MHZ with timing met after place and route
  - DEBOUNCE_CYCLES is 1000000 clocks by default, 10 ms at 100 MHz
  - TICK_CYCLES is 100000 clocks by default, 1 ms at 100 MHz
  - CLKS_PER_BIT is 868 clocks by default, 115200 baud at 100 MHz
resources_expected:
  LUT: under 200
  FF: under 150
  BRAM: '0'
  DSP: '0'
  IO: about 25 pins used of the board's connected pins
assumptions:
- text: SW[14:0] and all other switches and buttons are unused and left unconnected
    in logic
  reason: the request only names SW[15] for direction and BTNU for stepping
- text: direction is read from SW[15] at each step, not latched at press time
  reason: the request gives SW[15] as the direction selector without a latching rule
- text: the 10-bit count wraps modulo 1024 in both directions
  reason: the request asks for the wrap at either end to change exactly one LED
- text: Gray code is the standard reflected binary code, gray = bin XOR (bin >> 1)
  reason: this is the usual Gray code and makes 1023 to 0 a one-bit change
- text: all logic runs in CLK100MHZ with no derived clocks
  reason: a single clock domain keeps the debounce and period counters simple and
    exact
- text: button presses and shell writes that land in the same clock are both applied
    in one step, shell write taking priority for BIN
  reason: the request does not rank simultaneous events, so a fixed rule is needed
    for a deterministic model
- text: the host sends well-formed UART frames at 115200 baud
  reason: the shell has no framing recovery in this design
open_questions: []
requirements:
- id: REQ-01
  text: Each accepted BTNU press changes the count by exactly one step
