name: t1_sync_fifo_regs
title: Byte FIFO behind the test shell
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: t1_sync_fifo_regs_top
clocks:
- name: CLK100MHZ
  port: CLK100MHZ
  period_ns: 10
  note: 100 MHz board oscillator, single clock domain for the whole design
reset:
  port: CPU_RESETN
  polarity: active_low
  sync: assertion is synchronised to CLK100MHZ through two flip-flops
  note: CPU_RESETN is the board reset button
parameters:
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 100000
  BUILD_STAMP: 0
  DEPTH: 16
  DATA_WIDTH: 8
  AF_THRESHOLD_RESET: 12
ports:
- name: CLK100MHZ
  direction: input
  width: 1
  role: 100 MHz board oscillator
- name: CPU_RESETN
  direction: input
  width: 1
  role: CPU reset button, active low
- name: UART_TXD_IN
  direction: input
  width: 1
  role: USB-UART receive line, host to FPGA
- name: UART_RXD_OUT
  direction: output
  width: 1
  role: USB-UART transmit line, FPGA to host
- name: LED
  direction: output
  width: 16
  role: 16 LEDs as a fill-level bar graph, LED[0] is the first bar
behaviour:
  fifo:
  - The FIFO holds DEPTH entries of DATA_WIDTH bits, DEPTH = 16 and DATA_WIDTH = 8
  - A byte written to PUSH is added at the tail when the FIFO is not full
  - A read of POP returns the head byte and removes it when the FIFO is not empty
  - A read of PEEK returns the head byte and leaves the stored bytes unchanged
  - COUNT holds the number of stored bytes, from 0 to 16
  - A push to a full FIFO discards the byte and sets the overflow error flag
  - A pop from an empty FIFO returns 0x00 and sets the underflow error flag
  - A push and a pop in the same clock cycle on a full FIFO performs the pop and discards
    the push, which sets the overflow error flag
  - A push and a pop in the same clock cycle on an empty FIFO performs the push and
    discards the pop, which sets the underflow error flag
  flags:
  - empty is 1 exactly when COUNT is 0
  - full is 1 exactly when COUNT is 16
  - almost_full is 1 exactly when COUNT is greater than or equal to AF_THRESHOLD
  - AF_THRESHOLD is a 5-bit register written over the shell, reset value AF_THRESHOLD_RESET
  - overflow is a sticky flag, set by a push to a full FIFO and cleared only by writing
    1 to its bit
  - underflow is a sticky flag, set by a pop from an empty FIFO and cleared only by
    writing 1 to its bit
  - Clearing one error flag leaves the other error flag unchanged
  leds:
  - LED[i] is 1 exactly when COUNT is greater than i, for i from 0 to 15
  - LED bar graph updates one clock cycle after COUNT changes
  reset:
  - CPU_RESETN low empties the FIFO, sets COUNT to 0 and clears overflow and underflow
  - CPU_RESETN low sets AF_THRESHOLD to AF_THRESHOLD_RESET
  shell:
  - The register block is accessed from the test shell over the USB-UART at 115200
    baud
  - ID reads back the design ID FIFO as ASCII
  - Writes to the read-only registers are ignored
registers:
  map:
  - offset: '0x00'
    name: ID
    access: RO
    reset: '0x4649464F'
    bits: '[31:0] design ID, ASCII FIFO'
  - offset: '0x04'
    name: PUSH
    access: WO
    reset: '0x00'
    bits: '[7:0] byte to push at the tail, reads return 0'
  - offset: '0x08'
    name: POP
    access: RO (read pops)
    reset: '0x00'
    bits: '[7:0] head byte, removed by the read, 0x00 when empty'
  - offset: '0x0C'
    name: PEEK
    access: RO
    reset: '0x00'
    bits: '[7:0] head byte, not removed, 0x00 when empty'
  - offset: '0x10'
    name: COUNT
    access: RO
    reset: '0x00'
    bits: '[4:0] number of stored bytes, 0 to 16'
  - offset: '0x14'
    name: STATUS
    access: RO
    reset: '0x01'
    bits: '[0] empty, [1] full, [2] almost_full'
  - offset: '0x18'
    name: AF_THRESHOLD
    access: RW
    reset: '0x0C'
    bits: '[4:0] almost-full threshold'
  - offset: '0x1C'
    name: ERROR
    access: RW1C
    reset: '0x00'
    bits: '[0] overflow sticky, [1] underflow sticky, write 1 to clear the bit'
behaviour_notes:
- Register offsets above are a proposal until the register map question is answered
timing:
  clock_period_ns: 10
  latency:
    push_to_count: COUNT changes one clock cycle after the push is accepted
    pop_to_count: COUNT changes one clock cycle after the pop is accepted
    flags_to_status: STATUS reflects COUNT in the same clock cycle COUNT changes
    led_update: LED changes one clock cycle after COUNT changes
    uart_bit: one UART bit lasts CLKS_PER_BIT clock cycles = 868
resources_expected:
  LUT: under 300
  FF: under 250
  BRAM: 0
  DSP: 0
  note: 16 x 8 storage in distributed RAM or flip-flops, plus the UART and register
    block
assumptions:
- text: The test shell is the existing UART register shell and supplies the register
    access protocol
  reason: spec.md says the FIFO is exercised entirely from the test shell
- text: There is one clock, CLK100MHZ, and every register and the FIFO run in that
    domain
  reason: spec.md names no other clock and gives no other time constant
- text: CPU_RESETN is the only reset and the FIFO has no separate soft reset register
  reason: spec.md lists only CPU_RESETN as the reset
- text: The 115200 baud UART uses CLKS_PER_BIT = 868 from a 100 MHz clock
  reason: 100000000 / 115200 is about 868.06, rounded to the nearest integer
- text: Only the names given in the master XDC are used for board ports
  reason: spec.md requires top-level ports named as in the board master XDC
interfaces_note: No AXI4-Lite block, the register block is driven by the USB-UART
  shell, so no interfaces profile is set
