resolved_questions:
- question: What is the register map (offset, width, reset value and access of every
    register)?
  answer: 'Use the proposed map in registers.map: ID at 0x00 RO, PUSH 0x04 WO, POP
    0x08 RO with read-pops, PEEK 0x0C RO, COUNT 0x10 RO, STATUS 0x14 RO, AF_THRESHOLD
    0x18 RW reset 12, ERROR 0x1C RW1C'
  status: defaulted
  by: default
  default_reason: spec.md names shell registers and reading values back but gives
    no offsets, so the map must come from the user
- question: Does a push and a pop in the same cycle on a full FIFO perform the pop
    and drop the push, or drop the pop?
  answer: Perform the pop, drop the push and set overflow, because the pop frees a
    slot and the FIFO is full only at the start of the cycle
  status: defaulted
  by: default
  default_reason: spec.md does not cover simultaneous push and pop
- question: Does a push and a pop in the same cycle on an empty FIFO perform the push
    and drop the pop, or drop the push?
  answer: Perform the push, drop the pop and set underflow, mirroring the full case
  status: defaulted
  by: default
  default_reason: spec.md does not cover simultaneous push and pop on an empty FIFO
- question: What value does PEEK return when the FIFO is empty, and does it set an
    error flag?
  answer: Return 0x00 and set no flag, because spec.md only defines the pop-empty
    case
  status: defaulted
  by: default
  default_reason: spec.md defines POP on empty but not PEEK on empty
- question: Which values are legal for AF_THRESHOLD and what happens above 16?
  answer: Accept 0 to 16 as thresholds, and store values 17 to 31 with almost_full
    never set, because COUNT cannot exceed 16
  status: defaulted
  by: default
  default_reason: spec.md asks for a settable threshold but gives no range
- question: What is the almost-full threshold after reset?
  answer: 12, three quarters of the depth, and reset restores it
  status: defaulted
  by: default
  default_reason: spec.md gives no reset value for the threshold
- question: Does CPU_RESETN also reset AF_THRESHOLD to its default, or only clear
    the error flags?
  answer: Reset restores AF_THRESHOLD to 12 as well, so the design starts in a known
    state
  status: defaulted
  by: default
  default_reason: spec.md says reset clears every flag but does not mention the threshold
- question: What does BUILD_STAMP do, and is it read back over the shell?
  answer: BUILD_STAMP is a top-level parameter with default 0 that the FIFO logic
    ignores, and it is not readable over the shell
  status: defaulted
  by: default
  default_reason: spec.md names BUILD_STAMP as a test hook but does not say what it
    does
- question: What is the shell response timeout TIMEOUT_CYCLES?
  answer: 100000 clock cycles, which is 1 ms at 100 MHz, enough for one 8-byte-command
    round trip at 115200 baud
  status: defaulted
  by: default
  default_reason: spec.md names TIMEOUT_CYCLES but gives no value
