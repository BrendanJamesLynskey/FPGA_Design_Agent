open_questions: []
resolved_questions:
- question: 'Give the register map: offset, width, reset value and access of every
    register'
  answer: 'Proposed map in registers.map: PUSH 0x00 W, POP 0x01 R, PEEK 0x02 R, COUNT
    0x03 R, STATUS 0x04 R, AF_THRESH 0x05 RW reset 0x0C, ERR 0x06 RW1C, ID0 to ID3
    at 0x07 to 0x0A R'
  status: defaulted
  by: default
  default_reason: spec.md names registers and shell reads but gives no offsets, so
    the map must be confirmed
- question: How are the sticky ERR bits cleared
  answer: Write 1 to the ERR bit to clear it, write 0 leaves it unchanged (write-1-to-clear
    per bit)
  status: defaulted
  by: default
  default_reason: spec.md says the errors stay until cleared but does not name the
    clear mechanism
- question: What does a read of PUSH return
  answer: 0x00, with no effect on the FIFO or flags
  status: defaulted
  by: default
  default_reason: PUSH is a write-only register and the request does not say what
    a read returns
- question: Is CPU_RESETN synchronous or asynchronous to CLK100MHZ
  answer: Two flip-flop synchroniser, then synchronous clear, so all state resets
    on the clock edge after the synchronised low
  status: defaulted
  by: default
  default_reason: The request says reset empties the FIFO but not how reset is applied
- question: What happens when a push and a pop arrive in the same clock
  answer: Pop is applied first and then the push is applied, COUNT is unchanged when
    COUNT was between 1 and 15, and a push to a full FIFO with a pop in the same clock
    is accepted with no overflow
  status: defaulted
  by: default
  default_reason: The request does not define simultaneous push and pop, though the
    shell serialises accesses so this should not occur
- question: Reset value and valid range of AF_THRESH
  answer: Reset 12, values 0 to 16 used as written, 17 to 31 treated as 16, and threshold
    0 makes almost_full always 1
  status: defaulted
  by: default
  default_reason: The request asks for a settable threshold but gives no reset or
    range
- question: Is the design ID FIFO read as four separate byte registers
  answer: Four byte registers ID0 to ID3 with ASCII F I F O
  status: defaulted
  by: default
  default_reason: The request gives the ID as a string but not how the shell reads
    it
- question: Should BUILD_STAMP be readable over the shell
  answer: No, BUILD_STAMP is a parameter only and drives no logic
  status: defaulted
  by: default
  default_reason: The request names it as a test hook with no read path
- question: Value of TIMEOUT_CYCLES
  answer: 1000000 clocks, which is 10 ms at 100 MHz, as the shell read timeout
  status: defaulted
  by: default
  default_reason: The request names the parameter but gives no value
- question: Should CLKS_PER_BIT be 868 or 869
  answer: 868, the nearest integer to 100000000 / 115200 = 868.06
  status: defaulted
  by: default
  default_reason: The request gives the baud rate but not the integer divider
- question: Should the LED bar graph show COUNT directly
  answer: Yes, LED[k] lit when COUNT is greater than k, so 16 entries fill all 16
    LEDs
  status: defaulted
  by: default
  default_reason: The request asks for a bar graph of the fill level but does not
    give the exact mapping
