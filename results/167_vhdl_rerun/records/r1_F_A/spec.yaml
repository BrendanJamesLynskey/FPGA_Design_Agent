name: t1_sync_fifo_regs
title: Byte FIFO behind the test shell
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: t1_sync_fifo_regs_top
clocks:
- name: CLK100MHZ
  port: CLK100MHZ
  frequency: 100 MHz board oscillator
  note: All FIFO, flag, error, LED and shell logic runs in this single clock domain
reset:
  name: CPU_RESETN
  port: CPU_RESETN
  polarity: active low
  synchronisation: two flip-flop synchroniser on CLK100MHZ, then synchronous clear
  effect: empties the FIFO, sets COUNT to 0, clears both ERR bits
parameters:
  DEPTH: 16
  WIDTH: 8
  CLKS_PER_BIT: 868
  TIMEOUT_CYCLES: 1000000
  BUILD_STAMP: 0
ports:
- name: CLK100MHZ
  direction: input
  width: 1
  board_pin_role: 100 MHz oscillator (master XDC CLK100MHZ, pin E3)
- name: CPU_RESETN
  direction: input
  width: 1
  board_pin_role: CPU reset push button, active low (master XDC CPU_RESETN, pin C12)
- name: UART_TXD_IN
  direction: input
  width: 1
  board_pin_role: USB-UART receive line into the FPGA, host to FPGA (master XDC UART_TXD_IN,
    pin C4)
- name: UART_RXD_OUT
  direction: output
  width: 1
  board_pin_role: USB-UART transmit line out of the FPGA, FPGA to host (master XDC
    UART_RXD_OUT, pin D4)
- name: LED
  direction: output
  width: 16
  board_pin_role: 16 user LEDs, LED[0] at the bottom of the bar graph (master XDC
    LED[15:0])
behaviour:
  fifo:
  - Storage holds DEPTH = 16 entries of WIDTH = 8 bits, first-in first-out
  - A byte written to PUSH is added at the tail on the write accepted in that cycle,
    when the FIFO is not full
  - A read of POP returns the head byte and removes it, when the FIFO is not empty
  - A read of PEEK returns the head byte and leaves the stored bytes unchanged
  - COUNT is the number of stored bytes, from 0 to 16
  - A push to a full FIFO discards the byte and leaves the stored bytes and COUNT
    unchanged
  - A read of POP from an empty FIFO returns 0x00 and leaves COUNT at 0
  - A read of PEEK from an empty FIFO returns 0x00 and sets no error flag
  flags:
  - STATUS bit 0 (empty) is 1 exactly when COUNT is 0
  - STATUS bit 1 (full) is 1 exactly when COUNT is 16
  - STATUS bit 2 (almost_full) is 1 exactly when COUNT is greater than or equal to
    AF_THRESH
  - AF_THRESH holds a 5-bit threshold, reset value 12, written and read over the shell
  errors:
  - ERR bit 0 (overflow) is set by a push to a full FIFO
  - ERR bit 1 (underflow) is set by a read of POP from an empty FIFO
  - Each ERR bit is sticky and stays 1 until a 1 is written to that bit of ERR
  - Writing 0 to an ERR bit leaves that bit unchanged
  - Setting or clearing one ERR bit does not change the other ERR bit
  leds:
  - LED[k] is 1 exactly when COUNT is greater than k, for k from 0 to 15
  - LED[15:0] is driven from COUNT only, with no blinking or other pattern
  id:
  - Reads of ID0, ID1, ID2 and ID3 return the ASCII bytes of the design ID FIFO in
    that order
  reset:
  - CPU_RESETN low empties the FIFO, sets COUNT to 0, sets STATUS to 0x01 and clears
    both ERR bits
  - CPU_RESETN low sets AF_THRESH to 12
  shell_link:
  - The USB-UART link runs at 115200 baud with CLKS_PER_BIT = 868 at 100 MHz
  - TIMEOUT_CYCLES and BUILD_STAMP are top-level parameters of the test shell and
    drive no logic in this design
registers:
  map:
  - offset: '0x00'
    name: PUSH
    access: W
    reset: '0x00'
    bits: 7:0 byte pushed at the tail
  - offset: '0x01'
    name: POP
    access: R
    reset: '0x00'
    bits: 7:0 head byte, removed by the read; 0x00 when empty (sets underflow)
  - offset: '0x02'
    name: PEEK
    access: R
    reset: '0x00'
    bits: 7:0 head byte, not removed; 0x00 when empty
  - offset: '0x03'
    name: COUNT
    access: R
    reset: '0x00'
    bits: 4:0 number of stored bytes, 0 to 16
  - offset: '0x04'
    name: STATUS
    access: R
    reset: '0x01'
    bits: bit0 empty, bit1 full, bit2 almost_full
  - offset: '0x05'
    name: AF_THRESH
    access: RW
    reset: '0x0C'
    bits: 4:0 almost_full threshold
  - offset: '0x06'
    name: ERR
    access: RW1C
    reset: '0x00'
    bits: bit0 overflow sticky, bit1 underflow sticky
  - offset: '0x07'
    name: ID0
    access: R
    reset: '0x46'
    bits: 7:0 ASCII F
  - offset: '0x08'
    name: ID1
    access: R
    reset: '0x49'
    bits: 7:0 ASCII I
  - offset: '0x09'
    name: ID2
    access: R
    reset: '0x46'
    bits: 7:0 ASCII F
  - offset: '0x0A'
    name: ID3
    access: R
    reset: '0x4F'
    bits: 7:0 ASCII O
timing:
  latency:
    push_to_count: COUNT and STATUS show a push 1 clock after the PUSH write is accepted
    pop_to_count: COUNT and STATUS show a pop 1 clock after the POP read is accepted
    reset_to_empty: COUNT is 0 and STATUS is 0x01 on the clock after CPU_RESETN is
      sampled low by the synchroniser
    uart_bit: CLKS_PER_BIT = 868 clocks per UART bit, 10 bits per byte on the link
resources_expected:
- 'LUT: about 120'
- 'FF: about 90'
- 'Storage: 16 x 8 bits in distributed RAM or flip-flops'
- 'BRAM: 0'
- 'DSP: 0'
assumptions:
- assumption: The shell serialises transactions, so a push and a pop never arrive
    in the same clock
  reason: The shell is a single UART link that sends one register access at a time
- assumption: Port names CLK100MHZ, CPU_RESETN, UART_TXD_IN, UART_RXD_OUT and LED
    match the Digilent master XDC for the Nexys A7-100T
  reason: spec.md asks for ports named as in the board master XDC and I have no XDC
    view in this session
- assumption: The 100 MHz oscillator is the only clock and no PLL is used
  reason: The request lists no other clock and the 868 clocks per bit value is for
    100 MHz
- assumption: CLKS_PER_BIT = 868 gives 115200 baud with an error of about 0.006 percent
  reason: 100000000 / 115200 = 868.06, so 868 is the nearest integer
- assumption: The design has no AXI4-Lite block, so no interface profile applies
  reason: The register block is read and written through the UART test shell
