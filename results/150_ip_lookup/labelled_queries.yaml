# it) and committed before the ranker was written. Deviation from the review: it asks a different brief to write the set;
# this executor wrote it, so the split below guards against tuning: ranker choices (synonyms, weights, threshold) may be
# tuned on `split: dev` only; `split: test` is scored once, at the end.
#
# Method of labelling: each positive names the library entries (ip_lib/<name>) that a competent FPGA engineer would
# accept as an answer, judged from the entry names and one-line summaries alone. A decoy is a request that no entry
# answers; the right answer is "nothing fits". `near_miss` marks decoys that share words with an entry.
# Queries are phrased as a user would say them, not as the entry says them.
