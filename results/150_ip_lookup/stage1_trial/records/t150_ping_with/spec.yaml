name: ping_responder
title: Ping responder for Nexys A7-100T
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: ping_top
clocks:
- name: clk
  period_ns: 10
  source: 100 MHz board oscillator, pin role CLK100MHZ
- name: eth_refclk
  period_ns: 20
  source: 50 MHz RMII reference clock generated in the FPGA and driven to the PHY
    (open question OQ-04)
reset:
  name: cpu_resetn
  polarity: active_low
  source: CPU RESET button, pin role CPU_RESETN
  sync: asynchronous assert, synchronous release on clk
parameters:
  LOCAL_IP: '0xC0A80132'
  LOCAL_MAC: '0x02504E475001'
  LED_PULSE_CYCLES: 10000000
  MAX_FRAME_BYTES: 1518
  DESIGN_ID: '0x50494E47'
  PHY_RST_RELEASE_CYCLES: 1000
ports:
- name: clk
  direction: input
  width: 1
  board_pin_role: CLK100MHZ 100 MHz oscillator
- name: cpu_resetn
  direction: input
  width: 1
  board_pin_role: CPU RESET button, active low
- name: led
  direction: output
  width: 1
  board_pin_role: user LED0, pending OQ-07
- name: eth_refclk
  direction: output
  width: 1
  board_pin_role: Ethernet PHY RMII reference clock input, 50 MHz
- name: eth_rst_n
  direction: output
  width: 1
  board_pin_role: Ethernet PHY reset, active low
- name: eth_crsdv
  direction: input
  width: 1
  board_pin_role: Ethernet PHY RMII carrier sense and receive data valid
- name: eth_rxerr
  direction: input
  width: 1
  board_pin_role: Ethernet PHY RMII receive error
- name: eth_rxd
  direction: input
  width: 2
  board_pin_role: Ethernet PHY RMII receive data
- name: eth_txen
  direction: output
  width: 1
  board_pin_role: Ethernet PHY RMII transmit enable
- name: eth_txd
  direction: output
  width: 2
  board_pin_role: Ethernet PHY RMII transmit data
behaviour:
  rx:
  - 'Parse each received Ethernet frame: EtherType 0x0800 (IPv4) or 0x0806 (ARP),
    all other EtherTypes are discarded.'
  - Discard any frame longer than MAX_FRAME_BYTES or with a bad FCS.
  - Discard IPv4 packets with a bad header checksum, a version other than 4, or a
    fragment (MF set or fragment offset nonzero).
  - Discard IPv4 packets whose destination address is not LOCAL_IP.
  - Discard ICMP messages whose type is not 8 (echo request) or whose ICMP checksum
    is bad.
  arp:
  - An ARP request (opcode 1) whose target protocol address equals LOCAL_IP is answered
    with one ARP reply (opcode 2).
  - The ARP reply carries LOCAL_MAC as sender hardware address and LOCAL_IP as sender
    protocol address.
  icmp_reply:
  - An accepted echo request is answered with one ICMP echo reply (type 0) addressed
    to the requester MAC and IP.
  - The reply copies the identifier, sequence number and payload of the request unchanged.
  - The reply IPv4 header checksum and ICMP checksum are recomputed over the reply.
  - A request that arrives while a reply is being transmitted is discarded.
  tx:
  - Transmit each reply as one Ethernet frame with a valid FCS on the RMII interface.
  - The reply TTL is 64 and the IPv4 protocol field is 1 (ICMP).
  led:
  - The led output goes high on the first clock of each reply transmission.
  - The led output returns low after LED_PULSE_CYCLES clocks; a second reply during
    the pulse restarts the count.
  id_reg:
  - Register ID at offset 0x00 returns DESIGN_ID (ASCII PING) and is read-only.
  reset:
  - While cpu_resetn is low the design holds the RX and TX state machines in idle,
    led low and eth_rst_n low.
  - After cpu_resetn goes high eth_rst_n stays low for PHY_RST_RELEASE_CYCLES clk
    cycles, then goes high.
registers:
  map:
  - offset: '0x00'
    name: ID
    access: RO
    reset: '0x50494E47'
    bits: 31:0 DESIGN_ID, ASCII PING with P in bits 31:24
timing:
  LED_PULSE_CYCLES: 10000000
  PHY_RST_RELEASE_CYCLES: 1000
  latency:
    reply_start: Reply transmission starts within 2000 clk cycles after the last byte
      of a valid echo request is received (pending confirmation).
    reset_to_idle: led and TX state return to idle within 2 clk cycles of cpu_resetn
      going low.
    eth_refclk: eth_refclk is 50 MHz, half of clk, generated by an MMCM or a divide-by-2
      register with the clock domain constraint in the XDC.
resources_expected:
  luts: under 2000 estimated
  ffs: under 2000 estimated
  bram: 1 RAMB36 for the frame buffer, estimated
  dsp: 0
assumptions:
- text: The Nexys A7-100T Ethernet PHY is wired for RMII with a 50 MHz reference clock
    supplied by the FPGA.
  reason: The request names only the Ethernet PHY; RMII is the mode the board routing
    is expected to use, to be confirmed against the board schematic and master XDC.
- text: The PHY is used with its strap defaults (auto-negotiation enabled), so no
    MDIO configuration is performed.
  reason: The request does not ask for PHY configuration and MDIO adds a state machine;
    OQ-05 covers the change if link fails.
- text: The other machines on the network use ARP to resolve 192.168.1.50 before sending
    echo requests.
  reason: On an Ethernet LAN an IPv4 sender needs the MAC address of the target; without
    an ARP reply the echo requests never reach the board.
- text: The board and the requesting machines are on the same subnet 192.168.1.0/24
    with no router between them.
  reason: The request says the machines are on the same network, so the reply is sent
    directly to the requester MAC with no gateway.
- text: Frames are received from the PHY without preamble and start-of-frame delimiter.
  reason: The RMII MAC interface delivers only the frame bytes after the SFD, so the
    design does not parse the preamble.
open_questions: []
requirements:
- id: REQ-01
  text: The IPv4 source address in every reply is 192.168.1.50.
  proof:
  - simulation
- id: REQ-02
  text: A valid ICMP echo request addressed to 192.168.1.50 is answered with exactly
    one ICMP echo reply of type 0.
  proof:
  - simulation
  - hardware
- id: REQ-03
  text: The echo reply payload is byte-identical to the echo request payload.
  proof:
  - simulation
- id: REQ-04
  text: The echo reply destination MAC is the source MAC of the request.
  proof:
  - simulation
- id: REQ-05
  text: The echo reply source MAC is LOCAL_MAC.
  proof:
  - simulation
- id: REQ-06
  text: The echo reply IPv4 header checksum is correct.
  proof:
  - simulation
- id: REQ-07
  text: The echo reply ICMP checksum is correct.
  proof:
  - simulation
- id: REQ-08
  text: An echo request addressed to any IPv4 address other than 192.168.1.50 gets
    no reply.
  proof:
  - simulation
- id: REQ-09
  text: An echo request with a bad IPv4 header checksum gets no reply.
  proof:
  - simulation
- id: REQ-10
  text: An ICMP message with type other than 8 gets no reply.
  proof:
  - simulation
- id: REQ-11
  text: An ARP request for 192.168.1.50 is answered with one ARP reply that carries
    LOCAL_MAC.
  proof:
  - simulation
  - hardware
- id: REQ-12
  text: The led output goes high on the first clock of each reply transmission.
  proof:
  - simulation
  - hardware
- id: REQ-13
  text: The led output goes low exactly LED_PULSE_CYCLES clocks after it went high
    when no further reply is sent.
  proof:
  - simulation
- id: REQ-14
  text: Every transmitted reply frame has a valid Ethernet FCS.
  proof:
  - simulation
  - hardware
- id: REQ-15
  text: While cpu_resetn is low the led output is low.
  proof:
  - formal
- id: REQ-16
  text: While cpu_resetn is low no reply transmission is started.
  proof:
  - formal
- id: REQ-17
  text: Register ID at offset 0x00 reads 0x50494E47 after reset.
  proof:
  - simulation
  - hardware
- id: REQ-18
  text: The design has no failing setup slack at the 100 MHz clk domain in the timing
    report.
  proof:
  - analysis
- id: REQ-19
  text: The design has no failing hold slack at the 100 MHz clk domain in the timing
    report.
  proof:
  - analysis
- id: REQ-20
  text: The design has no failing setup slack at the 50 MHz eth_refclk domain in the
    timing report.
  proof:
  - analysis
- id: REQ-21
  text: The design has no failing hold slack at the 50 MHz eth_refclk domain in the
    timing report.
  proof:
  - analysis
- id: REQ-22
  text: A ping from a second machine on 192.168.1.0/24 to 192.168.1.50 receives a
    reply on the board bring-up setup.
  proof:
  - hardware
resolved_questions:
- question: What is the register map? Offset, width, reset value and access of every
    register, and how the ID register is read through the test shell or USB-UART host
    path?
  answer: One 32-bit read-only register ID at offset 0x00, reset 0x50494E47 (ASCII
    PING), read through a test shell path to be defined.
  status: defaulted
  by: default
  default_reason: The request says the design ID reads PING but names no offset, width
    or access path, so the only register is proposed here.
- question: Should the board answer ARP requests for 192.168.1.50?
  answer: Yes, answer ARP requests for LOCAL_IP with LOCAL_MAC.
  status: defaulted
  by: default
  default_reason: Other machines cannot send echo requests to the board on the same
    LAN without an ARP reply, so ping fails otherwise.
- question: What MAC address should the board use?
  answer: 0x02504E475001 (02:50:4E:47:50:01), locally administered and unicast.
  status: defaulted
  by: default
  default_reason: The request says give the board a MAC address but gives no value;
    a locally administered address avoids clashing with a vendor OUI.
- question: Is the PHY wired for RMII with a 50 MHz reference clock from the FPGA,
    or for RGMII?
  answer: RMII with a 50 MHz reference clock generated in the FPGA.
  status: defaulted
  by: default
  default_reason: RMII needs fewer pins and a single 50 MHz clock; the choice must
    match the board schematic and the XDC pin constraints.
- question: Is any MDIO configuration of the PHY needed, for example to force 100
    Mbps or disable auto-negotiation?
  answer: No, use strap defaults with auto-negotiation.
  status: defaulted
  by: default
  default_reason: The request does not state a link speed; MDIO adds a state machine
    that is only needed if link negotiation fails.
- question: How long should the LED stay lit after each reply?
  answer: LED_PULSE_CYCLES = 10000000 clock cycles, which is 100 ms at 100 MHz.
  status: defaulted
  by: default
  default_reason: The request says light an LED each time a reply is sent but gives
    no duration; a single reply would otherwise be too short to see.
- question: Which LED should light?
  answer: LED0, the first user LED of the board.
  status: defaulted
  by: default
  default_reason: The request says an LED without naming one; LED0 is the first user
    LED and is easy to find.
- question: What should happen to echo requests sent to the broadcast address or to
    a multicast IPv4 address?
  answer: Ignore them and send no reply.
  status: defaulted
  by: default
  default_reason: The request asks for replies to requests sent to the board; replying
    to broadcast would reply to every machine on the subnet.
- question: What is the largest frame accepted?
  answer: 1518 bytes including FCS; larger frames are discarded.
  status: defaulted
  by: default
  default_reason: The request gives no size limit; the standard Ethernet maximum keeps
    the frame buffer to one BRAM.
- question: Should the design check the FCS of received frames?
  answer: Yes, discard received frames with a bad FCS.
  status: defaulted
  by: default
  default_reason: A corrupted request would otherwise be answered with a corrupted
    reply.
- question: Should fragmented IPv4 echo requests be answered?
  answer: No, discard fragmented packets.
  status: defaulted
  by: default
  default_reason: Reassembly needs a buffer and state that the request does not ask
    for; ping from normal machines is not fragmented.
- question: What does the design do with the PHY reset while the CPU reset button
    is pressed and released?
  answer: Hold eth_rst_n low while cpu_resetn is low and release it PHY_RST_RELEASE_CYCLES
    (1000) clk cycles after cpu_resetn goes high.
  status: defaulted
  by: default
  default_reason: The request says reset with the CPU reset button; the PHY needs
    its reset release sequence before link.
