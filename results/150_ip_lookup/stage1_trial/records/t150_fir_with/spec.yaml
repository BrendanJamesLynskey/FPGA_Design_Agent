resolved_questions:
- question: 'Give the register map for the test shell: offset, width, reset value
    and access of every register'
  answer: ID 0x00 RO 0x46494C54; SAMPLE_IN 0x04 WO 0x0000; SAMPLE_OUT 0x08 RO 0x0000;
    STATUS 0x0C RO bit 0 busy; COEF_k 0x10 + 4*k RW 0x0000 for k 0 to 31
  status: defaulted
  by: default
  default_reason: The request names registers and read-back over the shell but gives
    no offsets; the user answered with this map, which is copied into registers.map
- question: What command framing does the UART test shell use for register reads and
    writes, and how is a 16-bit value packed into the 32-bit data word?
  answer: The shell's standard read and write framing, with the 16-bit value in the
    low half of the 32-bit data word and the upper half read as 0
  status: defaulted
  by: default
  default_reason: The shell protocol document was not available in this session, so
    the framing must be confirmed against the shell
- question: What UART baud rate and framing does the host link use?
  answer: 115200 baud, 8 data bits, no parity, 1 stop bit, giving BAUD_DIV_CYCLES
    868
  status: defaulted
  by: default
  default_reason: The request gives no baud rate and 115200 8N1 is the usual test
    shell setting
- question: What is the coefficient number format?
  answer: Q1.15 signed 16-bit, with FRAC_BITS 15
  status: defaulted
  by: default
  default_reason: The request gives no format and Q1.15 matches the 16-bit width and
    the DSP multiplier
- question: How is the accumulator rounded when shifted to 16-bit output?
  answer: Truncate toward negative infinity with an arithmetic shift by FRAC_BITS,
    with no rounding offset
  status: defaulted
  by: default
  default_reason: The request does not say and truncation needs no extra adder
- question: What happens when the sum exceeds the signed 16-bit output range?
  answer: Saturate to 0x7FFF or 0x8000
  status: defaulted
  by: default
  default_reason: The request does not say and saturation avoids wrap-around spikes
    on the output
- question: What are the reset coefficient values?
  answer: All 32 coefficients reset to 0x0000, so the output is 0 until the host loads
    coefficients
  status: defaulted
  by: default
  default_reason: The request says the coefficients are loaded at run time and gives
    no default filter taps
- question: What happens to a SAMPLE_IN or COEF_k write that arrives while the filter
    is busy?
  answer: The write is ignored and the host polls STATUS bit 0 before writing again
  status: defaulted
  by: default
  default_reason: A single shared MAC cannot take new coefficients or samples mid-pass
    without shadow storage that costs area
- question: Is the filter cutoff and tap design done by the host, with no tap design
    in hardware?
  answer: Yes, the host computes and loads all 32 taps; the hardware is a generic
    32-tap FIR
  status: defaulted
  by: default
  default_reason: The request gives no cutoff frequency, sample rate or filter design
    method
- question: Is one sample every 34 clk cycles (about 2.9 million samples per second)
    fast enough?
  answer: Yes, a single shared DSP slice is accepted for the lowest DSP use
  status: defaulted
  by: default
  default_reason: The request asks for as few DSP slices as practical and gives no
    sample rate
