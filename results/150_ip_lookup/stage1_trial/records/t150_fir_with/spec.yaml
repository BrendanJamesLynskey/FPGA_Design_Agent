name: low_pass_fir
title: 32-tap low-pass FIR filter with run-time coefficients over the UART test shell
board: nexys_a7_100t
part: xc7a100tcsg324-1
top: filt_top
clocks:
- name: clk
  period_ns: 10
  pin: E3
  role: CLK100MHZ oscillator, 100 MHz
reset:
  name: cpu_resetn
  pin: C12
  polarity: active low
  synchronous: true
  note: CPU RESET button; assertion clears all state synchronously to clk, release
    is synchronised to clk
parameters:
  TAPS: 32
  DATA_WIDTH: 16
  COEF_WIDTH: 16
  FRAC_BITS: 15
  ACC_WIDTH: 48
  BAUD_DIV_CYCLES: 868
ports:
- name: clk
  direction: in
  width: 1
  role: E3 CLK100MHZ
- name: cpu_resetn
  direction: in
  width: 1
  role: C12 CPU_RESETN button, active low
- name: uart_rx
  direction: in
  width: 1
  role: C4 UART from host (uart_txd_in)
- name: uart_tx
  direction: out
  width: 1
  role: D4 UART to host (uart_rxd_out)
behaviour:
  reset:
  - cpu_resetn asserted clears the busy flag, the 32-entry sample history, SAMPLE_OUT
    and all COEF_k
  - COEF_k resets to 0x0000 for k = 0 to 31, so the filter outputs 0 until coefficients
    are written
  - SAMPLE_OUT resets to 0x0000
  host_interface:
  - UART 8 data bits, no parity, 1 stop bit, one bit every BAUD_DIV_CYCLES clk cycles
  - The test shell reads and writes the registers in the register map; no other host
    access exists
  sample_path:
  - An accepted SAMPLE_IN write shifts the 16-bit signed sample into the history with
    the new sample at tap 0
  - An accepted SAMPLE_IN write sets busy for exactly 34 clk cycles
  - While busy, one DSP48E1 multiply-accumulate runs per clk cycle for k = 0 to 31,
    multiplying COEF_k by history tap k
  - When the accumulation completes, SAMPLE_OUT takes the 48-bit sum shifted right
    arithmetically by FRAC_BITS and saturated to signed 16 bits
  - A SAMPLE_IN write while busy is ignored and leaves the history unchanged
  coefficient_path:
  - A write to COEF_k stores the 16-bit signed value in coefficient k when busy is
    0
  - A write to COEF_k while busy is 1 is ignored and leaves COEF_k unchanged
  - Coefficients use Q1.15 signed format, so 0x7FFF represents about 1.0 and 0x8000
    represents -1.0
registers:
  map:
  - offset: '0x00'
    name: ID
    access: RO
    reset: '0x46494C54'
    bits: '[31:0] ASCII FILT'
  - offset: '0x04'
    name: SAMPLE_IN
    access: WO
    reset: '0x0000'
    bits: '[15:0] signed input sample; a write starts a filter pass'
  - offset: '0x08'
    name: SAMPLE_OUT
    access: RO
    reset: '0x0000'
    bits: '[15:0] signed filtered sample'
  - offset: '0x0C'
    name: STATUS
    access: RO
    reset: '0x00000000'
    bits: '[0] busy; [31:1] reserved read as 0'
  - offset: 0x10 + 4*k
    name: COEF_k (k = 0 to 31)
    access: RW
    reset: '0x0000'
    bits: '[15:0] signed Q1.15 coefficient for tap k'
timing:
  clock: 10 ns period, 100 MHz
  latency:
    sample_to_output: 34 clk cycles from an accepted SAMPLE_IN write to the SAMPLE_OUT
      update
    sample_rate: one accepted sample every 34 clk cycles at most, about 2.9 million
      samples per second
    uart_bit: BAUD_DIV_CYCLES clk cycles per bit
resources_expected:
  DSP48E1: 1
  BRAM36: 0
  LUT: about 400 (estimate)
  FF: about 400 (estimate)
assumptions:
- assumption: The design runs from the 100 MHz board oscillator on pin E3 with no
    clock management block
  reason: The request names no clock and the board oscillator is the only clock source
    on the board
- assumption: One DSP48E1 slice performs all 32 multiplications in sequence
  reason: The request asks for as few DSP slices as practical, and 34 cycles per sample
    is acceptable at the test shell rate
- assumption: Samples and coefficients are 16-bit signed two's complement values
  reason: The request states 16-bit signed samples and a 16-bit coefficient width
    is the smallest that fits the 25x18 DSP multiplier
- assumption: The 48-bit accumulator never overflows for 32 taps of 16-bit by 16-bit
    products
  reason: The worst-case sum is 32 times 2^30, which needs 36 bits, so 48 bits leaves
    margin
- assumption: The UART host link is the only input path and the test shell provides
    the read and write transactions
  reason: The request says coefficients and results go over the same UART test shell
    link
open_questions: []
