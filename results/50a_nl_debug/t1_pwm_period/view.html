  const lo = Math.max(0, t0 - (r.pre == null ? t0 : r.pre)), hi = Math.min(n - 1, t0 + (r.post == null ? n : r.post));
  px = Math.min(40, Math.max(0.05, (sc.clientWidth - 4) / (hi - lo + 1))); draw(); sc.scrollLeft = lo * px;
}
function fit() { if (!cap) return; px = Math.max(0.05, (sc.clientWidth - 4) / cap.timebase.samples); draw(); }
function toTrigger() { if (!cap) return; sc.scrollLeft = cap.timebase.trigger_sample * px - sc.clientWidth / 2; }
function zoom(f, at) {
  if (!cap) return;
  const x = at === undefined ? sc.scrollLeft + sc.clientWidth / 2 : at, s = x / px;
  px = Math.min(40, Math.max(0.05, px * f)); draw(); sc.scrollLeft = s * px - (x - sc.scrollLeft);
}
function draw() {
  if (!cap) return;
  const n = cap.timebase.samples, W = Math.max(sc.clientWidth, Math.ceil(n * px) + 2), H = AXIS + ROW * cap.channels.length;
  const dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = css("--bg"); g.fillRect(0, 0, W, H);
  const t0 = cap.timebase.trigger_sample, fg = css("--wave"), line = css("--line"), muted = css("--muted");
  g.font = "11px ui-monospace, Menlo, monospace"; g.textBaseline = "middle";
  // axis ticks every power-of-ten-ish step of cycles
  const steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000];
  const step = steps.find(s => s * px >= 60) || 100000;
  g.strokeStyle = line; g.fillStyle = muted; g.lineWidth = 1;
  for (let cy = Math.ceil(-t0 / step) * step; cy <= n - 1 - t0; cy += step) {
    const x = (cy + t0) * px + 0.5; g.beginPath(); g.moveTo(x, AXIS - 6); g.lineTo(x, H); g.stroke(); g.fillText(String(cy), x + 3, AXIS / 2);
  }
  g.strokeStyle = line; g.beginPath(); g.moveTo(0, AXIS - 0.5); g.lineTo(W, AXIS - 0.5); g.stroke();
  cap.channels.forEach((ch, i) => {
    const y = AXIS + i * ROW, hi = y + 6, lo = y + ROW - 6, s = ch.samples;
    g.strokeStyle = line; g.beginPath(); g.moveTo(0, y + ROW - 0.5); g.lineTo(W, y + ROW - 0.5); g.stroke();
    g.strokeStyle = fg; g.lineWidth = 1.25;
    if (ch.width === 1) {
      g.beginPath(); g.moveTo(0, s[0] ? hi : lo);
      for (let k = 1; k < n; k++) { if (s[k] !== s[k - 1]) { const x = k * px; g.lineTo(x, s[k - 1] ? hi : lo); g.lineTo(x, s[k] ? hi : lo); } }
      g.lineTo(n * px, s[n - 1] ? hi : lo); g.stroke();
    } else {
      let a = 0;
      for (let k = 1; k <= n; k++) {
        if (k === n || s[k] !== s[a]) {
          const x0 = a * px, x1 = k * px, m = Math.min(3, (x1 - x0) / 2), yc = (hi + lo) / 2;
          g.fillStyle = css("--bus"); g.beginPath();
          g.moveTo(x0, yc); g.lineTo(x0 + m, hi); g.lineTo(x1 - m, hi); g.lineTo(x1, yc); g.lineTo(x1 - m, lo); g.lineTo(x0 + m, lo); g.closePath(); g.fill(); g.stroke();
          const txt = hex(s[a], ch.width);
          if (g.measureText(txt).width + 6 < x1 - x0) { g.fillStyle = fg; g.fillText(txt, x0 + 4, yc); }
          a = k;
        }
      }
    }
  });
  // trigger and cursor
  g.strokeStyle = css("--trig"); g.setLineDash([4, 3]); g.lineWidth = 1;
  const xt = t0 * px + 0.5; g.beginPath(); g.moveTo(xt, 0); g.lineTo(xt, H); g.stroke(); g.setLineDash([]);
  g.fillStyle = css("--trig"); g.fillText("trigger", xt + 16, AXIS / 2);
  if (cursor !== null) { const xc = (cursor + 0.5) * px; g.strokeStyle = css("--cursor"); g.beginPath(); g.moveTo(xc, AXIS); g.lineTo(xc, H); g.stroke(); }
}
function readout(k) {
  if (!cap || k < 0 || k >= cap.timebase.samples) return;
  const cy = k - cap.timebase.trigger_sample;
  document.getElementById("readout").textContent = `cycle ${cy}: ` + cap.channels.map(ch => `${ch.name}=${hex(ch.samples[k], ch.width)}`).join("  ");
}
const sampleAt = e => Math.floor((e.clientX - cv.getBoundingClientRect().left) / px);
cv.addEventListener("mousemove", e => readout(sampleAt(e)));
cv.addEventListener("click", e => { cursor = sampleAt(e); readout(cursor); draw(); });
sc.addEventListener("wheel", e => { if (e.ctrlKey || Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); zoom(e.deltaY < 0 ? 1.25 : 0.8, e.clientX - cv.getBoundingClientRect().left); } }, { passive: false });
let drag = null;
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, s: sc.scrollLeft }; });
window.addEventListener("pointerup", () => { drag = null; });
window.addEventListener("pointermove", e => { if (drag) sc.scrollLeft = drag.s - (e.clientX - drag.x); });
document.getElementById("zin").onclick = () => zoom(2);
document.getElementById("zout").onclick = () => zoom(0.5);
document.getElementById("fit").onclick = fit;
document.getElementById("asked").onclick = asked;
document.getElementById("trig").onclick = toTrigger;
document.getElementById("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { cursor = null; load(JSON.parse(t), ""); }).catch(err => alert("Not a capture JSON: " + err));
};
window.addEventListener("resize", () => draw());
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
if (CAPTURE) load(CAPTURE, ANSWER);
</script>
