name: p5_async_fifo_soak
title: 'P5: asynchronous FIFO soak, 25 MHz writer to 156.25 MHz reader'
board: kr260
part: xck26-sfvc784-2LV-c
top: p5_async_fifo_soak
clocks:
- name: clk_wr
  role: C3 pin, 25 MHz on-board clock (writer domain)
  freq_mhz: 25
  period_ns: 40.0
- name: clk_rd
  role: SFP+ cage MGTREFCLK0 (differential pair) through IBUFDS_GTE4 and BUFG_GT,
    156.25 MHz (reader domain)
  freq_mhz: 156.25
  period_ns: 6.4
- name: tck
  role: JTAG TCK inside jtag_bus.sv (BSCANE2 USER4), asynchronous to both
  freq_mhz: 0
  note: constrained by the build as an asynchronous clock group
reset:
  model: reprogram
  name: none
  note: every reset is a reconfiguration of the FPGA, registers start from initial
    values, no reset input; a power-on counter of RESET_HOLD_CYCLES bus clocks drives
    the rst of jtag_bus; each domain has its own reset synchroniser and the FIFO reset
    is released in both domains before RUN is honoured
parameters:
  DESIGN_ID: 546635777
  FIFO_DEPTH_WORDS: 512
  DATA_WIDTH: 32
  PRBS_SEED: 2147483647
  PRBS_TAP_A: 31
  PRBS_TAP_B: 28
  SLOW_READ_DIV_CYCLES: 8
  COUNTER_WIDTH: 32
  RESET_HOLD_CYCLES: 16
  READ_LATENCY_MAX_CYCLES: 2
ports:
- name: clk_25mhz
  direction: in
  width: 1
  board_pin_role: C3 25 MHz clock pin (writer clock)
- name: gt_refclk_p
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 P (156.25 MHz, reader clock)
- name: gt_refclk_n
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 N
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]; led[0] = RUN, led[1] = error seen (data, overflow
    or underflow)
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ tx_disable, constant 1 (laser off)
behaviour:
  register_bus:
  - jtag_bus.sv is instantiated unchanged; its h_we, h_re, h_addr, h_wdata, h_rdata
    port runs in the clock domain of the bus clk.
  - A write takes effect the clock after h_we.
  - After h_re, h_rdata shows the addressed register within 2 clocks and holds it.
  - Unmapped addresses read 0 and ignore writes.
  - All registers are 32 bits on 4-byte steps.
  - BUILD reads the USR_ACCESSE2 word.
  writer:
  - While RUN is 1 the writer writes one 32-bit word on every writer clock in which
    the FIFO is not full.
  - Each word is the next 32 bits of PRBS-31 (x^31 + x^28 + 1), seed 0x7FFFFFFF.
  - When the FIFO is full on a writer clock with RUN 1 the writer holds the word and
    STALL_W increments.
  - A write attempted while full would increment OVERFLOWS; the writer gating makes
    it never happen.
  reader:
  - The reader pops a word whenever the FIFO is not empty and RUN is 1.
  - Each popped word is compared with its own PRBS-31 copy started from the same seed
    at RUN start; a mismatch increments DATA_ERRS.
  - With SLOW_READ 1 the reader pops at most one word in every 8 reader clocks.
  - A read attempted while empty would increment UNDERFLOWS; the reader gating makes
    it never happen.
  inject:
  - Writing CTRL with INJECT 1 arms a single injection; the next received word has
    one bit flipped before the check, once, then INJECT clears itself.
  clear:
  - Writing CTRL with CLEAR 1 while RUN is 0 zeroes all counters, reloads both PRBS
    generators with the seed and resets the FIFO; CLEAR self-clears.
  - CLEAR written while RUN is 1 is ignored.
  snapshot:
  - Any write to SNAPSHOT latches all seven counters at one instant into holding registers;
    reads of 0x014 to 0x02C return the held values.
  - Counters are 32 bits and wrap.
  - Counters of the other clock domain are carried across with a handshake or Gray-coded
    transfer so the snapshot is coherent.
  cdc:
  - The FIFO is an asynchronous FIFO with Gray-coded pointers and 2-flop synchronisers
    (xpm_fifo_async or equivalent).
  - The build carries set_clock_groups -asynchronous between clk_wr, clk_rd and tck
    plus max_delay -datapath_only on Gray pointers.
  - The CDC report is a deliverable.
  sfp:
  - sfp_tx_disable is driven to 1 at all times.
  - No GT transceiver channel is used, only the reference clock buffer.
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546635777
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESSE2 word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] read back what was written'
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] RUN, [1] SLOW_READ, [2] CLEAR self-clearing, [3] INJECT self-clearing'
  - offset: 20
    name: WORDS_W
    access: RO
    reset: 0
    bits: '[31:0] words written (snapshot)'
  - offset: 24
    name: WORDS_R
    access: RO
    reset: 0
    bits: '[31:0] words read and checked (snapshot)'
  - offset: 28
    name: DATA_ERRS
    access: RO
    reset: 0
    bits: '[31:0] mismatched words (snapshot)'
  - offset: 32
    name: OVERFLOWS
    access: RO
    reset: 0
    bits: '[31:0] writes while full (snapshot)'
  - offset: 36
    name: UNDERFLOWS
    access: RO
    reset: 0
    bits: '[31:0] reads while empty (snapshot)'
  - offset: 40
    name: STALL_W
    access: RO
    reset: 0
    bits: '[31:0] writer clocks held off by full (snapshot)'
  - offset: 44
    name: OCC_MAX
    access: RO
    reset: 0
    bits: '[31:0] highest fill in words (snapshot)'
  - offset: 48
    name: SNAPSHOT
    access: WO
    reset: 0
    bits: any write latches 0x014 to 0x02C; reads 0
timing:
  bus_clock: 25 MHz writer clock (default, see resolved questions)
  latency:
    read_data: h_rdata valid within 2 bus clocks of h_re and held
    write_effect: 1 bus clock after h_we
    snapshot_coherence: held values stable until the next SNAPSHOT write
    word_rate_writer: one word per 25 MHz writer clock, 25 Mwords/s when not full
    word_rate_reader: up to one word per 156.25 MHz clock, one per 8 clocks (19.53
      Mwords/s) in SLOW_READ
resources_expected:
  lut: under 600
  ff: under 800
  bram36: 1 (512 x 32 FIFO, 16 Kbit; may map to one RAMB36 or two RAMB18)
  dsp: 0
  gt_channels: 0
  bufg: 2 to 3
assumptions:
- assumption: Part is xck26-sfvc784-2LV-c.
  reason: K26 SOM on the KR260.
- assumption: In SLOW_READ the drain rate (19.5 Mwords/s) is below the 25 Mwords/s
    fill rate, so the FIFO fills and the writer stalls.
  reason: Required to show STALL_W and OCC_MAX near 512.
- assumption: Reader at 156.25 MHz in normal mode drains faster than the writer, so
    STALL_W stays 0 and OCC_MAX stays small.
  reason: 6.25x rate ratio.
- assumption: WORDS_W and WORDS_R differ by at most the FIFO occupancy (plus pipeline)
    at a snapshot.
  reason: Counts are taken at one instant.
- assumption: The INJECT flips bit 0 of the next received word.
  reason: Request says one bit; position is irrelevant to detection.
- assumption: Writes to RO registers and to unmapped addresses are ignored.
  reason: Request says unmapped ignore writes; RO analogous.
