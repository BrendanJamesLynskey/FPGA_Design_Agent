resolved_questions:
- question: Which clock does the jtag_bus register port run on?
  answer: The 25 MHz C3 clock (writer domain), with reader-domain counters transferred
    by handshake.
  status: defaulted
  by: default
  default_reason: The request gives no choice; the slow clock eases bus timing while
    the 156.25 MHz GT clock needs a BUFG_GT.
  risk: high
- question: Please give the register map (offset, width, reset value and access of
    every register); is the map in the request complete?
  answer: 'As in the request table: ID 0x000, BUILD 0x004, SCRATCH 0x008, CTRL 0x010,
    WORDS_W 0x014, WORDS_R 0x018, DATA_ERRS 0x01C, OVERFLOWS 0x020, UNDERFLOWS 0x024,
    STALL_W 0x028, OCC_MAX 0x02C, SNAPSHOT 0x030, all 32 bits, resets 0 except ID.'
  status: defaulted
  by: default
  default_reason: Offsets are given, but widths, resets and reads of write-only registers
    are inferred.
  risk: high
- question: What do the LEDs show?
  answer: led[0] = RUN, led[1] = sticky error (data, overflow or underflow, cleared
    by CLEAR).
  status: defaulted
  by: default
  default_reason: The request names the LEDs but gives no meaning.
  risk: medium
- question: What do the counters do while RUN is 0 and what is the FIFO state when
    RUN stops?
  answer: Counters hold; the writer stops, the reader drains the FIFO and keeps checking
    until empty.
  status: defaulted
  by: default
  default_reason: Not stated.
  risk: medium
- question: Is OCC_MAX measured on the writer side or the reader side, and what is
    the maximum value?
  answer: Writer-side fill count, maximum 512.
  status: defaulted
  by: default
  default_reason: Fill differs by view across clock domains; writer side captures
    the peak.
  risk: medium
- question: Which bit of the injected word is flipped?
  answer: Bit 0.
  status: defaulted
  by: default
  default_reason: Not stated.
  risk: medium
- question: What if INJECT is written while RUN is 0?
  answer: It stays armed until the next word is checked after RUN starts.
  status: defaulted
  by: default
  default_reason: Not stated.
  risk: medium
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration. A design that must restart while
    running needs a reset input and resets its control state; the two models are checked
    by different rules (STD-INIT-02).
  risk: high
- question: 'How do the clocks of this design relate to each other: clk_wr, clk_rd,
    tck? For each pair say asynchronous (no common source), related (outputs of one
    MMCM or PLL), or exclusive (the inputs of a clock mux).'
  answer: Every pair is asynchronous unless both clocks come from one MMCM or PLL
    (then related) or are the inputs of a clock mux (then exclusive).
  status: defaulted
  by: default
  default_reason: The flow writes set_clock_groups from the declared relation of each
    clock pair; without it Vivado times unrelated clocks against each other and the
    methodology gate (TIMING-6/7) fails.
  risk: high
