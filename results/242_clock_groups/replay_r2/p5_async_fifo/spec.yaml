open_questions: []
resolved_questions:
- question: Which clock should the JTAG register bus and register file run on?
  answer: clk_c3 (25 MHz)
  status: defaulted
  by: default
  default_reason: The request leaves it open; the free-running writer clock keeps
    the bus simple.
  risk: high
- question: Where is OCC_MAX measured, and is a conservative value acceptable?
  answer: Write side, from the synchronised read pointer (never below true fill).
  status: defaulted
  by: default
  default_reason: Fill level is exact in neither domain; write-side is safe and next
    to the full flag.
  risk: medium
- question: What does INJECT flip, and does it flip a word already in the FIFO or
    the next one received?
  answer: Bit 0 of the next word the reader receives after the INJECT request arrives.
  status: defaulted
  by: default
  default_reason: The request says one bit of one word only.
  risk: medium
- question: What do the two LEDs show?
  answer: led[0] = RUN, led[1] = DATA_ERRS non-zero.
  status: defaulted
  by: default
  default_reason: The request names the LEDs but gives no use.
  risk: medium
- question: Should RUN falling to 0 let the reader drain the FIFO, and can WORDS_R
    then catch up with WORDS_W?
  answer: Yes, the reader drains until empty.
  status: defaulted
  by: default
  default_reason: Lets the script compare totals after a run.
  risk: medium
- question: Is the register map exactly as given in the request (offsets 0x000 to
    0x030, 32-bit, 4-byte steps)? Please confirm offset, width, reset and access of
    every register.
  answer: As in spec.md, with reserved CTRL bits reading 0 and reset value 0 for all
    counters.
  status: defaulted
  by: default
  default_reason: Map was given in the request; confirmation only.
  risk: high
- question: This design has no reset input. Is every reset a reconfiguration of the
    FPGA (the device is reprogrammed, so every register starts from its initial value),
    or does something restart the running design (then it needs a reset input)?
  answer: 'Every reset is a reconfiguration of the FPGA (reset model: reprogram):
    registers get initial values, control state included, and the design has no reset
    input. Record it in spec.yaml as reset: {model: reprogram}; a design that restarts
    while it runs is reset: {model: reset} with a reset port.'
  status: defaulted
  by: default
  default_reason: 'With no reset input, a register can start only from its initial
    value, which the FPGA loads at configuration (owner, 2026-11-26: particularly
    useful for designs whose every reset reprograms the device). A design that must
    restart while running needs a reset input and resets its control state; the two
    models are checked by different rules (STD-INIT-02).'
  risk: high
- question: 'How do the clocks of this design relate to each other: clk_c3, gt_refclk?
    For each pair say asynchronous (no common source), related (outputs of one MMCM
    or PLL), or exclusive (the inputs of a clock mux).'
  answer: Every pair is asynchronous unless both clocks come from one MMCM or PLL
    (then related) or are the inputs of a clock mux (then exclusive).
  status: defaulted
  by: default
  default_reason: 'The flow writes set_clock_groups from the declared relation of
    each clock pair (brief 242): asynchronous, related (outputs of one MMCM, timed
    together) or exclusive (inputs of a clock mux). Without it Vivado times unrelated
    clocks against each other and the methodology gate (TIMING-6/7) fails; a wrong
    answer would hide a real crossing, so the flow writes a group only where every
    crossing goes through a recognised synchroniser.'
  risk: high
