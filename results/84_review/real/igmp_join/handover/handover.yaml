interfaces_text: 's_axis: 8-bit AXI-Stream slave, tready tied high, tuser used as a frame-bad flag. m_axis: 8-bit master,
  46-byte frames with tlast. Config inputs: own_mac, own_ip, groups, group_en (level, edge-detected inside). Event pulses:
  ev_query, ev_report, ev_leave, ev_suppressed. Single clock clk, synchronous active-high rst.'
clocks_resets_text: Single clock domain with no crossings. Synchronous reset; control state, valid and timers are reset, while
  the checksum and data registers are mostly reset too. group_en and groups come from the same domain and are assumed synchronous.
  No async reset.
architecture_text: A receive FSM indexed by byte counter k captures ethertype, IHL, length, protocol, IGMP type, MRT and group
  while accumulating two ones-complement checksums. A per-group state block (run, rep_p, lv_p, last_rep, 8-bit tmr) is updated
  each clock from joins, leaves, queries, reports and ticks. A transmit block picks the lowest pending group (leaves first),
  precomputes IP and IGMP checksums in one combinational sum, and streams the frame bytes from a case function indexed by
  j.
