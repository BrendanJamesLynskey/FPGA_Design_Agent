summary: igmp_join is an IGMPv2 host-side membership block for 1..8 configured multicast groups. It parses received Ethernet
  frames byte by byte, sends reports on join, answers general, group-specific and v3 queries after a random delay, honours
  suppression by other hosts' reports, and sends leaves. It emits fixed 46-byte frames on a byte-wide AXI-Stream master. Timing
  is per-tick counters driven by a TICK_CLKS divider, and the random delay comes from a 16-bit LFSR.
