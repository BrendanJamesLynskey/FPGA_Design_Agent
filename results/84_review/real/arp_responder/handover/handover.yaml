summary: arp_responder is a single-clock ARP (RFC 826) block for one IPv4 address. It parses byte-wide Ethernet frames, replies
  to requests for own_ip, learns sender MACs into a small fully-associative cache with round-robin replacement, and answers
  next-hop lookups. On a miss it sends a rate-limited broadcast request. It flags address conflicts (RFC 5227) through ev_conflict
  and never caches the conflicting sender.
