interfaces_text: 's_axis: 8-bit AXI-Stream receive with tuser on tlast marking a bad frame, tready tied high. m_axis: 8-bit
  AXI-Stream transmit of 42-byte frames with tvalid/tready/tlast. Lookup: lk_valid/lk_ip in, lk_done/lk_hit/lk_mac out one
  clock later, plus flush. Static own_mac and own_ip inputs. Seven one-clock event pulses.'
clocks_resets_text: One clock, clk, and one synchronous active-high reset, rst. There are no clock crossings and no asynchronous
  resets. Reset covers control state, the cache valid bits and the parse fields. own_mac and own_ip are static inputs treated
  as quasi-constant.
architecture_text: The receive path is a byte counter k that captures fields by index (et, htype, ptype, hlen, plen, op, sha,
  spa, tpa). It latches fin, fin_bad and fin_long at tlast, and the combinational arp_ok/for_me/learn terms are evaluated
  the following clock. The cache is a register array of valid/IP/MAC with priority-encoded known and free search and a round-robin
  pointer rr. Lookup is a combinational compare registered into lk_*, with a single holdoff timer and IP. Transmit is a small
  FSM with one reply slot and one request slot, replies first. A function arp_byte generates the frame bytes by index j, using
  the m_axis registers as a one-byte pipeline.
