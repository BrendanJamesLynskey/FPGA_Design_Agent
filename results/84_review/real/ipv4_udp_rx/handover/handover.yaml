summary: ipv4_udp_rx is a byte-wide AXI-Stream IPv4/UDP receiver. It parses Ethernet frames without FCS and checks the IPv4
  header (version, IHL, checksum, length), fragments, protocol, destination address and UDP length. It optionally verifies
  the UDP checksum including the pseudo-header, and picks the lowest enabled matching destination port. Payload bytes stream
  out with a one-byte holdback so tlast can carry the verdict as tuser, and header fields and event pulses accompany them.
  I found no functional bug in the RTL by reading. The main weaknesses are timing (it misses 125 MHz, which the docs state),
  documentation mismatches, and the limited reach of the formal and seeded-fault evidence.
