interfaces_text: Slave AXI-Stream s_axis (8-bit data, tuser = bad frame). Master AXI-Stream m_axis (8-bit data, tuser = discard
  on tlast, 3-bit tdest = port index) with sideband m_src_ip, m_dst_ip, m_src_port, m_dst_port and m_len. Native config inputs
  own_ip, ports[N_PORTS*16] and port_en. Six one-clock event pulses. s_axis_tready = !fin && (!m_axis_tvalid || m_axis_tready),
  so it is combinational from m_axis_tready.
clocks_resets_text: Single clock `clk`, synchronous active-high `rst`, no crossings. The reset also clears many data registers
  (header fields, accumulators and so on), which is more than needed but harmless. Config inputs are used directly with no
  synchronisation, which is fine in one domain but they must be static during a frame.
architecture_text: A byte counter k, saturating at 0xFFFF, indexes the frame. Header fields are captured by case on k. Two
  32-bit one's-complement accumulators run, one over the IP header and one over the UDP datagram. The header verdict (mine
  && len_ok && port_hit) is taken when the first payload byte arrives at k = u0+8, which sets fwd and f_dest. A single holding
  register h_d/h_v delays each payload byte by one so the last byte can be emitted with tlast and tuser = u_bad once the `fin`
  cycle follows tlast. In that cycle, if nothing was held, the reason is classified into an ev_* pulse. Large combinational
  cones (index compares, the fold and the 7-term u_tot add) are unpipelined.
