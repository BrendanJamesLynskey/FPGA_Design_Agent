interfaces_text: 's_axis: 8-bit AXI-Stream slave, one payload per frame. s_axis_tready is high only in S_IN. s_dst_mac, s_dst_ip,
  s_src_port and s_dst_port are sampled with the first beat. m_axis: 8-bit AXI-Stream master carrying an Ethernet frame without
  FCS, 42 + n bytes, with registered tvalid, tdata and tlast. config: own_mac and own_ip are plain level inputs. events: ev_sent
  and ev_too_long are one-cycle pulses.'
clocks_resets_text: One clock (clk) and one synchronous active-high reset (rst). There are no clock crossings and no asynchronous
  resets. Control state, counters, the checksum accumulator, the captured header fields and the output registers are reset.
  RAM contents and rq are not, which matches the house convention. rq is only consumed after a read that follows reset.
architecture_text: 'A three-state FSM: S_IN, S_CALC, S_OUT. In S_IN the payload is written at address n and p_acc accumulates
  the word sum, with the byte placed in the high or low half according to n[0]. In S_CALC the two checksums are computed in
  one cycle from wide adder chains. In S_OUT, j indexes frame bytes 0 to n+41. A read stage (rj, rv, rq) feeds the output
  register. rd_en = more && (take || !rv) keeps rq stable while the output is stalled. Bytes 0..41 come from hdr_byte and
  the rest from the RAM. The final output beat returns the FSM to S_IN and increments ident.'
