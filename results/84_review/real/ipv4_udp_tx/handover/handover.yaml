summary: 'ipv4_udp_tx is a store-and-forward UDP/IPv4/Ethernet transmitter. It accepts one byte-wide AXI-Stream payload into
  a RAM (block or LUT RAM), sums the payload as 16-bit words while it arrives, and drops anything longer than MAX_PAYLOAD
  (ev_too_long). A single-cycle S_CALC state computes the IPv4 header checksum and the UDP checksum (an all-zero result is
  sent as 0xFFFF; CSUM=0 sends 0). The 42 header bytes and the payload then go out through a two-stage read pipeline. I traced
  the length, checksum and handshake logic by hand and found no functional defect. The findings are minor: a live-config hazard,
  RAM address width, documentation and testbench weaknesses, and verification gaps.'
