interfaces_text: 's_axis: 8-bit AXI-Stream in, tready tied to 1, tuser marks a bad frame, frames carry no FCS. m_axis: 8-bit
  AXI-Stream out with tvalid/tready/tlast and registered outputs. own_mac and own_ip are static configuration inputs. Four
  one-clock event pulses: ev_request, ev_reply, ev_busy, ev_bad. Parameters are BUF_BYTES (power of two, 128..16384), TTL
  (1..255) and RAM (bram or lutram).'
clocks_resets_text: One clock, clk, and one synchronous active-high reset, rst. There are no clock crossings and no asynchronous
  resets. Control state and header/accumulator registers are reset. The RAM and the read data register rq are not, which is
  fine. The event pulses default to 0 and are cleared in reset.
architecture_text: A receive side counts bytes with k (saturating) and captures header fields at fixed offsets. It accumulates
  the IP header sum (ip_acc) and the ICMP sum (ic_acc, limited to the IP total length). It writes the frame into mem. `fin`
  pulses one clock after tlast, and `ok` is then evaluated combinationally from the captured fields. `blocked` stops a frame
  that starts right after a request's last byte from being stored over the request. The reply side starts at fin&&ok&&f_store
  and sets busy. It computes the new IP and ICMP checksums incrementally and reads the RAM with an address swap for the IP
  source and destination (offsets 26..33). A small skid-style pipeline (rq, rv, rj, take) feeds m_axis, and out_byte substitutes
  the MACs, TTL, checksums and ICMP type.
