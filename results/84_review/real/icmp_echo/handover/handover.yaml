summary: icmp_echo answers ICMP echo requests for one IPv4 address on a byte-wide AXI-Stream link. It stores each received
  frame in a RAM (block or LUT RAM) while checking the Ethernet, IP and ICMP fields and both checksums. If the frame is a
  valid echo request and the buffer is free, it replays the stored frame with addresses swapped, a fixed TTL, ICMP type 0
  and RFC 1624 incrementally updated checksums. Only one request is held at a time; a request arriving while a reply is pending
  is dropped and flagged with ev_busy. Evidence is cocotb against a Python model with scapy, SymbiYosys bounded checks and
  an out-of-context Artix-7 build. The design has not been run on a board.
