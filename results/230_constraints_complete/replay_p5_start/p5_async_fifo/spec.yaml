name: p5_async_fifo_soak
title: 'P5: asynchronous FIFO soak (25 MHz writer to 156.25 MHz reader)'
board: kr260
part: xck26-sfvc784-2LV-c
top: p5_async_fifo_soak
clocks:
- name: clk_c3
  freq_hz: 25000000
  role: C3 25 MHz board clock; writer domain and JTAG register port domain (clk of
    jtag_bus)
- name: gt_refclk0
  freq_hz: 156250000
  role: SFP+ MGTREFCLK0 differential pair through IBUFDS_GTE4 (no GT channel); reader
    domain
- relation: 'asynchronous: clk_c3 and gt_refclk0 declared as asynchronous clock groups,
    with set_max_delay -datapath_only on CDC paths'
reset:
  name: rst
  polarity: active high
  description: synchronous, derived from a startup counter held for at least 8 clk_c3
    cycles; each domain gets its own synchronised reset release
parameters:
  DEPTH: 512
  DATA_WIDTH: 32
  ADDR_WIDTH: 9
  PRBS_SEED: 2147483647
  DESIGN_ID: 546635777
  SLOW_READ_DIV_CLOCKS: 8
  SYNC_STAGES: 2
ports:
- name: clk_c3
  direction: in
  width: 1
  board_pin_role: C3 25 MHz clock
- name: gt_refclk0_p
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 P
- name: gt_refclk0_n
  direction: in
  width: 1
  board_pin_role: SFP+ MGTREFCLK0 N
- name: sfp_tx_disable
  direction: out
  width: 1
  board_pin_role: SFP+ TX_DISABLE, constant 1 (laser off)
- name: led
  direction: out
  width: 2
  board_pin_role: user LEDs led[1:0]
behaviour:
  register_port:
  - jtag_bus.sv is used unchanged and instantiated with clk = clk_c3; it provides
    h_we, h_re, h_addr[11:0], h_wdata[31:0], h_rdata[31:0]
  - A write takes effect the clock after h_we; h_rdata shows the addressed register
    within 2 clocks of h_re and holds it
  - Unmapped addresses read 0 and ignore writes
  - ID at 0x000 reads 0x20950001; BUILD at 0x004 reads the USR_ACCESSE2 word; SCRATCH
    at 0x008 is RW and resets to 0
  writer:
  - In clk_c3 domain while RUN is 1 the writer writes one 32-bit PRBS-31 word (x^31
    + x^28 + 1, 32 new bits per word, seed 0x7FFFFFFF) on every clk_c3 cycle in which
    the FIFO is not full
  - When RUN is 1 and the FIFO is full the writer holds the word and increments STALL_W
  - A write attempted while full increments OVERFLOWS and is dropped (must never happen)
  reader:
  - In gt_refclk0 domain the reader pops a word whenever the FIFO is not empty
  - Each popped word is compared with the reader's own PRBS-31 copy started from the
    same seed at RUN start; a mismatch increments DATA_ERRS
  - A pop attempted while empty increments UNDERFLOWS (must never happen)
  - With SLOW_READ set the reader pops at most one word every 8 gt_refclk0 cycles
  - INJECT flips one bit of one received word before the check, once, then self-clears
  fifo:
  - Asynchronous FIFO of 512 words x 32 bits with gray-code pointers and 2-flop synchronisers
  - OCC_MAX records the highest fill seen, in words
  control:
  - CLEAR (self-clearing) restarts counters and both sequences, honoured only while
    RUN is 0
  - SNAPSHOT write latches all counters 0x014 to 0x02C at one instant; counters wrap
    at 32 bits
  - sfp_tx_disable is driven 1 at all times; no GT transceiver channel is used
registers:
  map:
  - offset: 0
    name: ID
    access: RO
    reset: 546635777
    bits: '[31:0] design ID'
  - offset: 4
    name: BUILD
    access: RO
    reset: 0
    bits: '[31:0] USR_ACCESSE2 word'
  - offset: 8
    name: SCRATCH
    access: RW
    reset: 0
    bits: '[31:0] scratch'
  - offset: 16
    name: CTRL
    access: RW
    reset: 0
    bits: '[0] RUN, [1] SLOW_READ, [2] CLEAR self-clearing only while RUN=0, [3] INJECT
      self-clearing'
  - offset: 20
    name: WORDS_W
    access: RO
    reset: 0
    bits: '[31:0] words written (snapshot)'
  - offset: 24
    name: WORDS_R
    access: RO
    reset: 0
    bits: '[31:0] words read and checked (snapshot)'
  - offset: 28
    name: DATA_ERRS
    access: RO
    reset: 0
    bits: '[31:0] mismatching words (snapshot)'
  - offset: 32
    name: OVERFLOWS
    access: RO
    reset: 0
    bits: '[31:0] writes while full (snapshot)'
  - offset: 36
    name: UNDERFLOWS
    access: RO
    reset: 0
    bits: '[31:0] reads while empty (snapshot)'
  - offset: 40
    name: STALL_W
    access: RO
    reset: 0
    bits: '[31:0] writer clocks held off by full (snapshot)'
  - offset: 44
    name: OCC_MAX
    access: RO
    reset: 0
    bits: '[31:0] highest fill seen in words (snapshot)'
  - offset: 48
    name: SNAPSHOT
    access: WO
    reset: 0
    bits: any write latches 0x014 to 0x02C; reads 0
timing:
  latency:
    register_read: h_rdata valid within 2 clk_c3 cycles of h_re
    register_write: effect 1 clk_c3 cycle after h_we
    snapshot: values latched in a bounded number of clk_c3 cycles via CDC handshake
      (default under 16 cycles)
  cdc:
  - Gray-coded pointers cross with 2-flop synchronisers, ASYNC_REG, set_max_delay
    -datapath_only
  - Control bits and reader counters cross by handshake or toggle synchroniser
  throughput:
  - Writer one word per clk_c3 cycle when not full, 25 Mwords/s, 800 Mbit/s
resources_expected:
  luts: 600
  ffs: 900
  bram36: 1
  dsp: 0
  notes: 512x32 FIFO fits one RAMB36 or LUTRAM; counters 32 bits each
assumptions:
- assumption: Register port and writer share clk_c3
  reason: jtag_bus needs a free-running clk and C3 is the board's always-on clock
- assumption: Reader runs on gt_refclk0 through IBUFDS_GTE4 and BUFG_GT
  reason: the request says only the reference clock buffer may be used, no GT channel
- assumption: led[0] shows RUN and led[1] shows any error seen
  reason: request does not define LED use
