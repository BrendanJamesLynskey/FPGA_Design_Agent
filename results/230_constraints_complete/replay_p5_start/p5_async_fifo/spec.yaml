resolved_questions:
- question: 'Register map: is the map in spec.md (0x000..0x030) the final register
    map (offset, width, reset value and access of every register)?'
  answer: Yes, 32-bit registers as given in the request, written in registers.map
  status: defaulted
  by: default
  default_reason: offsets are stated in the request, confirmed for completeness
- question: How are counters made coherent across the two domains at SNAPSHOT?
  answer: Snapshot request toggles into each domain, which latches its counters; results
    are handed back by handshake; reads return the stored copy. Instants differ by
    a few clocks between domains.
  status: defaulted
  by: default
  default_reason: a single instant across unrelated clocks is impossible; the request
    wants values read together to belong together
- question: When RUN falls, is the FIFO flushed?
  answer: No. RUN 1 to 0 pauses the writer, the reader keeps draining until empty;
    CLEAR with RUN 0 resets pointers, counters and PRBS in both domains
  status: defaulted
  by: default
  default_reason: request does not say what happens to words in the FIFO at stop;
    draining keeps sequences aligned
- question: Where is OCC_MAX measured?
  answer: Writer domain, from write pointer minus the synchronised read pointer (conservative,
    may overstate by synchroniser latency)
  status: defaulted
  by: default
  default_reason: request says only highest fill seen
- question: Which bit does INJECT flip, and what if no word arrives?
  answer: Armed until the next received word, flips bit 0 of it, then clears; exactly
    one DATA_ERR expected
  status: defaulted
  by: default
  default_reason: request says one bit of one word
- question: What happens to CLEAR written while RUN is 1?
  answer: Ignored, and it does not stay set
  status: defaulted
  by: default
  default_reason: request says CLEAR acts only while RUN is 0
- question: What do the user LEDs show?
  answer: led[0]=RUN, led[1]=any of data error, overflow, underflow seen
  status: defaulted
  by: default
  default_reason: unspecified
