# Written by phase 0 (python -m project spec; brief 27B P1). Format: docs/project_layer.md.
schema: fpga-design-agent/contract/v1
module: pattern_timing
summary: Generates the video raster and test pattern; exposes pattern selection and frame count through the top-level
  register window.
clocks:
- {name: pixel_clk, port: clk, max_mhz: 74.25}
resets:
- {name: pixel_reset, port: rst, clock: pixel_clk, polarity: active_low, style: sync}
ports:
- {name: clk, dir: in}
- {name: rst, dir: in}
- {name: pattern_select, dir: in, width: 2, clock: pixel_clk}
- {name: frame_count, dir: out, width: 32, clock: pixel_clk, reset_value: 0}
- {name: m_axis_tvalid, dir: out, clock: pixel_clk, reset_value: 0}
- {name: m_axis_tready, dir: in, clock: pixel_clk}
- {name: m_axis_tdata, dir: out, width: 48, clock: pixel_clk}
data_formats:
- {name: raster_x, format: u11, packing: Raster horizontal coordinate}
- {name: raster_y, format: u10, packing: Raster vertical coordinate}
- {name: channel, format: u8, packing: Unsigned 8-bit colour channel}
- {name: flag, format: u1, packing: Boolean raster or sync flag}
interfaces:
- name: out
  protocol: axi4-stream
  role: master
  prefix: m_axis
  clock: pixel_clk
  reset: pixel_reset
  tdata:
    width: 48
    fields:
    - name: x
      bits: [47, 37]
      format: raster_x
    - name: y
      bits: [36, 27]
      format: raster_y
    - name: red
      bits: [26, 19]
      format: channel
    - name: green
      bits: [18, 11]
      format: channel
    - name: blue
      bits: [10, 3]
      format: channel
    - name: active
      bits: [2, 2]
      format: flag
    - name: hsync
      bits: [1, 1]
      format: flag
    - name: vsync
      bits: [0, 0]
      format: flag
  backpressure: false
  source_gaps: false
registers:
  bus: top
  map:
  - name: PATTERN
    offset: 0
    access: RW
    reset: 0
    width: 2
    volatile: false
    fields:
    - name: pattern_select
      bits: [1, 0]
      port: pattern_select
  - name: FRAME_COUNT
    offset: 4
    access: RO
    reset: 0
    width: 32
    volatile: true
    fields:
    - name: frame_count
      bits: [31, 0]
      port: frame_count
throughput:
- {interface: out, beats_per_cycle: 1}
