# Written by phase 0 (python -m project spec; brief 27B P1). Format: docs/project_layer.md.
schema: fpga-design-agent/contract/v1
module: audio_gain
summary: Holds the sample and capped gain registers and produces the combinational scaled sample_out.
clocks:
- {name: clk, port: clk, max_mhz: 100}
resets:
- {name: rst_n, port: rst_n, clock: clk, polarity: active_low, style: async}
ports:
- {name: clk, dir: in}
- {name: rst_n, dir: in}
- {name: sample, dir: in, width: 16, clock: clk}
- {name: gain, dir: in, width: 16, clock: clk}
- {name: sample_out, dir: out, width: 16, clock: clk, reset_value: 0}
registers:
  bus: top
  map:
  - name: SAMPLE
    offset: 0
    access: RW
    reset: 0
    width: 32
    volatile: false
    fields:
    - name: sample
      bits: [15, 0]
      port: sample
  - name: GAIN
    offset: 1
    access: WO
    reset: 0
    width: 32
    volatile: false
    fields:
    - name: gain
      bits: [15, 0]
      port: gain
  - name: SOUT
    offset: 2
    access: RO
    reset: 0
    width: 32
    volatile: true
    fields:
    - name: sample_out
      bits: [15, 0]
      port: sample_out
