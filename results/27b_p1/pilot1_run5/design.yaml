# Written by phase 0 (python -m project spec; brief 27B P1). Format: docs/project_layer.md.
schema: fpga-design-agent/project/v1
name: vmed
board: nexys_a7_100t
clocks:
- {name: clk_sys, source: board, port: CLK100MHZ, mhz: 100}
- {name: clk_pix, source: mmcm, from: clk_sys, mhz: 74.25}
resets:
- {name: rst_pix, domain: clk_pix, polarity: active_low, style: async, from: BTNC, via: reset_sync}
shell: {design_id: VMED, clock: clk_pix, reset: rst_pix}
modules:
- name: video_source
  kind: rtl
  clocks: {clk: clk_pix}
  resets: {rst: rst_pix}
  window_base: 0
  register_crossings: {}
- name: median_filter
  kind: rtl
  clocks: {clk: clk_pix}
  resets: {rst: rst_pix}
- name: vga_output
  kind: rtl
  clocks: {clk: clk_pix}
  resets: {rst: rst_pix}
  window_base: 4
  register_crossings: {}
connections:
- {from: video_source.out, to: median_filter.in}
- {from: median_filter.out, to: vga_output.in}
board_ports:
- {name: CLK100MHZ, dir: in, drive: input, to: clk_sys}
- {name: BTNC, dir: in, drive: input, to: video_source.button_center}
- {name: BTNC, dir: in, drive: input, to: rst_pix}
- {name: UART_TXD_IN, dir: in, drive: input, to: shell.uart_rx}
- {name: UART_RXD_OUT, dir: out, drive: push-pull, from: shell.uart_tx}
- {name: 'VGA_R[3:0]', dir: out, drive: push-pull, from: vga_output.vga_r}
- {name: 'VGA_G[3:0]', dir: out, drive: push-pull, from: vga_output.vga_g}
- {name: 'VGA_B[3:0]', dir: out, drive: push-pull, from: vga_output.vga_b}
- {name: VGA_HS, dir: out, drive: push-pull, from: vga_output.vga_hs}
- {name: VGA_VS, dir: out, drive: push-pull, from: vga_output.vga_vs}
- {name: 'LED[0]', dir: out, drive: push-pull, from: clk_pix.locked}
owned: []
assumptions:
- id: A-1
  text: How should the 3 x 3 neighbourhood be formed at the active-picture edges?
  default: Clamp each neighbourhood coordinate to the nearest active-picture edge.
  reason: The specification defines the filter neighbourhood but not how samples beyond the active picture are handled.
  affects: [S-3]
  status: open
  by: oracle
- id: A-2
  text: Which patterns must be selectable in addition to the default colour bars?
  default: Offer the specified colour bars and a black-and-white checkerboard.
  reason: The shell must allow pattern selection, but the available pattern choices are not specified.
  affects: [S-2, S-7]
  status: open
  by: oracle
- id: A-3
  text: What UART command and response format should the test shell use, including serial framing?
  default: Use 115200 baud, 8N1, with newline-terminated ASCII commands and responses.
  reason: The baud rate and shell capabilities are specified, but the serial framing and command protocol are not.
  affects: [S-7]
  status: open
  by: oracle
- id: A-4
  text: What are the frame counter's width, initial value, and increment point?
  default: Use a 32-bit counter that starts at zero after FPGA configuration and increments once per completed frame,
    wrapping modulo 2^32.
  reason: The specification requires reading a frame counter but does not define its counting or initialization
    behavior.
  affects: [S-7]
  status: open
  by: oracle
- id: A-5
  text: What does tlast mark on video_source.out, if anything?
  default: End of each 1650-pixel line.
  reason: Mark each line boundary in the stream.
  affects: [video_source.contract.interfaces.out.tlast, median_filter.contract.interfaces.in.tlast]
  status: open
  by: oracle
- id: A-6
  text: May the source of video_source.out leave gaps (tvalid low) once the stream has started?
  default: 'false'
  reason: Generate one stream beat per pixel clock, including blanking intervals.
  affects: [video_source.contract.interfaces.out.source_gaps, median_filter.contract.interfaces.in.source_gaps]
  status: open
  by: oracle
- id: A-7
  text: What throughput must video_source.out sustain (beats per clock, and output beats per input beat)?
  default: '{beats_per_cycle: 1}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [video_source.contract.throughput.out]
  status: open
  by: oracle
- id: A-8
  text: What does tlast mark on median_filter.out, if anything?
  default: End of each 1650-pixel line.
  reason: Delay the line marker with the filtered raster.
  affects: [median_filter.contract.interfaces.out.tlast, vga_output.contract.interfaces.in.tlast]
  status: open
  by: oracle
- id: A-9
  text: How many beats does a packet on median_filter.out have?
  default: '1650'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [median_filter.contract.interfaces.out.packet_beats, vga_output.contract.interfaces.in.packet_beats]
  status: open
  by: oracle
- id: A-10
  text: May the sink of median_filter.out stall the stream (drive tready low)?
  default: 'false'
  reason: The fixed-rate VGA output cannot stall.
  affects: [median_filter.contract.interfaces.out.backpressure, vga_output.contract.interfaces.in.backpressure]
  status: open
  by: oracle
- id: A-11
  text: Is vga_output's reset rst active high or active low, and synchronous or asynchronous?
  default: '{polarity: active_high, style: sync}'
  reason: Use a synchronous, active-high reset in the generated pixel-clock domain.
  affects: [vga_output.contract.resets.rst]
  status: open
  by: oracle
- id: A-12
  text: 'What is vga_output''s port vga_r: its direction, width and value in reset?'
  default: '{dir: out, width: 4, reset_value: 0}'
  reason: Use the requested four-bit RGB channel width and drive zero when blanked.
  affects: [vga_output.contract.ports.vga_r]
  status: open
  by: oracle
- id: A-13
  text: 'What is vga_output''s port vga_g: its direction, width and value in reset?'
  default: '{dir: out, width: 4, reset_value: 0}'
  reason: Use the requested four-bit RGB channel width and drive zero when blanked.
  affects: [vga_output.contract.ports.vga_g]
  status: open
  by: oracle
- id: A-14
  text: 'What is vga_output''s port vga_b: its direction, width and value in reset?'
  default: '{dir: out, width: 4, reset_value: 0}'
  reason: Use the requested four-bit RGB channel width and drive zero when blanked.
  affects: [vga_output.contract.ports.vga_b]
  status: open
  by: oracle
- id: A-15
  text: 'What is vga_output''s port vga_hs: its direction, width and value in reset?'
  default: '{dir: out, width: 1, reset_value: 0}'
  reason: Drive the positive horizontal sync required by the timing.
  affects: [vga_output.contract.ports.vga_hs]
  status: open
  by: oracle
- id: A-16
  text: 'What is vga_output''s port vga_vs: its direction, width and value in reset?'
  default: '{dir: out, width: 1, reset_value: 0}'
  reason: Drive the positive vertical sync required by the timing.
  affects: [vga_output.contract.ports.vga_vs]
  status: open
  by: oracle
- id: A-17
  text: 'What is vga_output''s port frame_count: its direction, width and value in reset?'
  default: '{dir: out, width: 32, reset_value: 0}'
  reason: Expose the frame counter through the shell's register window.
  affects: [vga_output.contract.ports.frame_count]
  status: open
  by: oracle
- id: A-18
  text: What number format is x_coord in video_source (signed or unsigned, total and fraction bits), and how is
    it packed?
  default: '{format: u11, packing: ''Horizontal raster coordinate, 0 through 1649.''}'
  reason: Eleven bits represent all 1650 horizontal clock positions.
  affects: [video_source.contract.data_formats.x_coord]
  status: open
  by: oracle
- id: A-19
  text: What number format is y_coord in video_source (signed or unsigned, total and fraction bits), and how is
    it packed?
  default: '{format: u10, packing: ''Vertical raster coordinate, 0 through 749.''}'
  reason: Ten bits represent all 750 vertical line positions.
  affects: [video_source.contract.data_formats.y_coord]
  status: open
  by: oracle
- id: A-20
  text: What number format is rgb444 in video_source (signed or unsigned, total and fraction bits), and how is it
    packed?
  default: '{format: u12, packing: ''R[3:0], G[3:0], B[3:0], with each channel 0xF when on and 0x0 when off.''}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [video_source.contract.data_formats.rgb444]
  status: open
  by: oracle
- id: A-21
  text: What number format is x_coord in median_filter (signed or unsigned, total and fraction bits), and how is
    it packed?
  default: '{format: u11, packing: ''Horizontal raster coordinate, 0 through 1649.''}'
  reason: Eleven bits represent all 1650 horizontal clock positions.
  affects: [median_filter.contract.data_formats.x_coord]
  status: open
  by: oracle
- id: A-22
  text: What number format is y_coord in median_filter (signed or unsigned, total and fraction bits), and how is
    it packed?
  default: '{format: u10, packing: ''Vertical raster coordinate, 0 through 749.''}'
  reason: Ten bits represent all 750 vertical line positions.
  affects: [median_filter.contract.data_formats.y_coord]
  status: open
  by: oracle
- id: A-23
  text: What number format is rgb444 in median_filter (signed or unsigned, total and fraction bits), and how is
    it packed?
  default: '{format: u12, packing: ''R[3:0], G[3:0], B[3:0], with each channel 0xF when on and 0x0 when off.''}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [median_filter.contract.data_formats.rgb444]
  status: open
  by: oracle
- id: A-24
  text: What number format is x_coord in vga_output (signed or unsigned, total and fraction bits), and how is it
    packed?
  default: '{format: u11, packing: ''Horizontal raster coordinate, 0 through 1649.''}'
  reason: Eleven bits represent all 1650 horizontal clock positions.
  affects: [vga_output.contract.data_formats.x_coord]
  status: open
  by: oracle
- id: A-25
  text: What number format is y_coord in vga_output (signed or unsigned, total and fraction bits), and how is it
    packed?
  default: '{format: u10, packing: ''Vertical raster coordinate, 0 through 749.''}'
  reason: Ten bits represent all 750 vertical line positions.
  affects: [vga_output.contract.data_formats.y_coord]
  status: open
  by: oracle
- id: A-26
  text: What number format is rgb444 in vga_output (signed or unsigned, total and fraction bits), and how is it
    packed?
  default: '{format: u12, packing: ''R[3:0], G[3:0], B[3:0], with each channel 0xF when on and 0x0 when off.''}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [vga_output.contract.data_formats.rgb444]
  status: open
  by: oracle
- id: A-27
  text: What number format is frame_counter in vga_output (signed or unsigned, total and fraction bits), and how
    is it packed?
  default: '{format: u32, packing: ''Completed-frame count, modulo 2^32.''}'
  reason: Use the answered 32-bit modulo counter width.
  affects: [vga_output.contract.data_formats.frame_counter]
  status: open
  by: oracle
- id: A-28
  text: What does the board pin CLK100MHZ connect to, and how is it driven (push-pull, open-drain, pulled up, input)?
  default: '{dir: in, drive: input, to: clk_sys}'
  reason: The board's master XDC identifies CLK100MHZ as the board clock input.
  affects: [design.board_ports.CLK100MHZ]
  status: open
  by: oracle
- id: A-29
  text: What does the board pin VGA_HS connect to, and how is it driven (push-pull, open-drain, pulled up, input)?
  default: '{dir: out, drive: push-pull, from: vga_output.vga_hs}'
  reason: Connect the generated horizontal sync to the board VGA horizontal-sync output.
  affects: [design.board_ports.VGA_HS]
  status: open
  by: limit
- id: A-30
  text: What does the board pin VGA_VS connect to, and how is it driven (push-pull, open-drain, pulled up, input)?
  default: '{dir: out, drive: push-pull, from: vga_output.vga_vs}'
  reason: Connect the generated vertical sync to the board VGA vertical-sync output.
  affects: [design.board_ports.VGA_VS]
  status: open
  by: limit
- id: A-31
  text: What does the board pin LED[0] connect to, and how is it driven (push-pull, open-drain, pulled up, input)?
  default: '{dir: out, drive: push-pull, from: clk_pix.locked}'
  reason: Drive the requested indicator directly from the declared pixel clock's MMCM lock status.
  affects: ['design.board_ports.LED[0]']
  status: open
  by: limit
