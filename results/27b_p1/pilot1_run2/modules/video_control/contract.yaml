# Written by phase 0 (python -m project spec; brief 27B P1). Format: docs/project_layer.md.
schema: fpga-design-agent/contract/v1
module: video_control
summary: Provide host pattern selection and frame-count access through the shell register window.
clocks:
- {name: clk, port: clk, max_mhz: 74.25}
resets:
- {name: rst, port: rst, clock: clk, polarity: active_low, style: async}
ports:
- {name: clk, dir: in}
- {name: rst, dir: in}
- {name: pattern, dir: in, width: 2, clock: clk}
- {name: pattern_selected, dir: out, width: 2, clock: clk, reset_value: 0}
- {name: frame_count_in, dir: in, width: 32, clock: clk}
- {name: frame_count, dir: out, width: 32, clock: clk, reset_value: 0}
registers:
  bus: top
  map:
  - name: PATTERN
    offset: 0
    access: RW
    reset: 0
    width: 32
    volatile: false
    fields:
    - name: pattern
      bits: [1, 0]
      port: pattern
  - name: FRAME_COUNT
    offset: 4
    access: RO
    reset: 0
    width: 32
    volatile: true
    fields:
    - name: count
      bits: [31, 0]
      port: frame_count
