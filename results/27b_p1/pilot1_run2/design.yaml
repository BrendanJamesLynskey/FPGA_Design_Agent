# Written by phase 0 (python -m project spec; brief 27B P1). Format: docs/project_layer.md.
schema: fpga-design-agent/project/v1
name: vga_median_720p
board: nexys_a7_100t
clocks:
- {name: clk_sys, source: board, port: CLK100MHZ, mhz: 100}
- {name: clk_pix, source: mmcm, from: clk_sys, mhz: 74.25}
resets:
- {name: rst_sys, domain: clk_sys, polarity: active_low, style: async, from: CPU_RESETN, via: reset_sync}
- {name: rst_pix, domain: clk_pix, polarity: active_low, style: async, from: rst_sys, via: reset_sync}
shell: {design_id: VMED, clock: clk_sys, reset: rst_sys}
modules:
- name: video_timing
  kind: rtl
  clocks: {clk: clk_pix}
  resets: {rst: rst_pix}
- name: color_bars
  kind: rtl
  clocks: {clk: clk_pix}
  resets: {rst: rst_pix}
- name: median_filter
  kind: rtl
  clocks: {clk: clk_pix}
  resets: {rst: rst_pix}
- name: frame_counter
  kind: rtl
  clocks: {clk: clk_pix}
  resets: {rst: rst_pix}
- name: video_cdc
  kind: rtl
  clocks: {clk_sys: clk_sys, clk_pix: clk_pix}
  resets: {rst_sys: rst_sys, rst_pix: rst_pix}
- name: video_output
  kind: rtl
  clocks: {clk: clk_pix}
  resets: {rst: rst_pix}
- name: video_control
  kind: rtl
  clocks: {clk: clk_pix}
  resets: {rst: rst_pix}
  window_base: 0
  register_crossings: {PATTERN: xpm_cdc_array_single, FRAME_COUNT: xpm_cdc_array_single}
connections: []
board_ports:
- {name: CLK100MHZ, dir: in, drive: input, to: clk_sys}
- {name: CPU_RESETN, dir: in, drive: input, to: rst_sys}
- {name: UART_TXD_IN, dir: in, drive: input, to: shell.uart_rx}
- {name: UART_RXD_OUT, dir: out, drive: push-pull, from: shell.uart_tx}
- {name: BTNC, dir: in, drive: input, to: video_output.btnc}
- {name: VGA_HS, dir: out, drive: push-pull, from: video_output.hsync}
- {name: VGA_VS, dir: out, drive: push-pull, from: video_output.vsync}
- {name: 'VGA_R[3:0]', dir: out, drive: push-pull, from: video_output.red}
- {name: 'VGA_G[3:0]', dir: out, drive: push-pull, from: video_output.green}
- {name: 'VGA_B[3:0]', dir: out, drive: push-pull, from: video_output.blue}
- {name: 'LED[0]', dir: out, drive: push-pull, from: clk_pix.locked}
owned: []
assumptions:
- id: A-1
  text: Which clock input should be used to generate the 74.25 MHz pixel clock, and what should count as stable?
  default: Use the Nexys A7 100 MHz onboard oscillator and consider the pixel clock stable when the clock generator's
    lock signal is asserted.
  reason: The required pixel-clock frequency is specified, but the source and stability criterion are not.
  affects: [S-1, S-5, S-6]
  status: open
  by: oracle
- id: A-2
  text: What should the median filter use for neighbourhood samples beyond the active picture boundaries?
  default: Replicate the nearest active-picture pixel at each boundary.
  reason: The 3 x 3 operation is specified, but its boundary behavior is not.
  affects: [S-3, S-4, S-5]
  status: open
  by: oracle
- id: A-3
  text: What UART command and response format should the host use?
  default: Use newline-terminated ASCII commands `ID?`, `PAT n`, and `FRAME?`, with line-terminated ASCII responses.
  reason: The baud rate, design ID, and shell capabilities are specified, but the protocol is not.
  affects: [S-7]
  status: open
  by: oracle
- id: A-4
  text: How wide should the frame counter be, and when should it increment?
  default: Use a 32-bit unsigned counter that increments once at the end of each video frame.
  reason: Reading a frame counter is required, but its width and counting event are not specified.
  affects: [S-7]
  status: open
  by: oracle
- id: A-5
  text: Is video_timing's reset rst active high or active low, and synchronous or asynchronous?
  default: '{polarity: active_high, style: sync}'
  reason: Reset polarity and style were not specified; use a synchronous active-high reset in the pixel-clock domain.
  affects: [video_timing.contract.resets.rst]
  status: open
  by: oracle
- id: A-6
  text: 'What is video_timing''s port x: its direction, width and value in reset?'
  default: '{dir: out, width: 11, reset_value: 0}'
  reason: An 11-bit coordinate can represent the horizontal timing range of 0 through 1649.
  affects: [video_timing.contract.ports.x]
  status: open
  by: oracle
- id: A-7
  text: 'What is video_timing''s port y: its direction, width and value in reset?'
  default: '{dir: out, width: 10, reset_value: 0}'
  reason: A 10-bit coordinate can represent the vertical timing range of 0 through 749.
  affects: [video_timing.contract.ports.y]
  status: open
  by: oracle
- id: A-8
  text: 'What is video_timing''s port active: its direction, width and value in reset?'
  default: '{dir: out, width: 1, reset_value: 0}'
  reason: The timing generator needs an active-picture qualification to identify the picture region.
  affects: [video_timing.contract.ports.active]
  status: open
  by: oracle
- id: A-9
  text: 'What is video_timing''s port hsync: its direction, width and value in reset?'
  default: '{dir: out, width: 1, reset_value: 0}'
  reason: The timing generator needs a horizontal sync output.
  affects: [video_timing.contract.ports.hsync]
  status: open
  by: oracle
- id: A-10
  text: 'What is video_timing''s port vsync: its direction, width and value in reset?'
  default: '{dir: out, width: 1, reset_value: 0}'
  reason: The timing generator needs a vertical sync output.
  affects: [video_timing.contract.ports.vsync]
  status: open
  by: oracle
- id: A-11
  text: 'What is video_timing''s port frame_end: its direction, width and value in reset?'
  default: '{dir: out, width: 1, reset_value: 0}'
  reason: A frame-end pulse is needed by the frame counter; its event is specified in the answered frame-counter
    default.
  affects: [video_timing.contract.ports.frame_end]
  status: open
  by: oracle
- id: A-12
  text: 'What is color_bars''s port x: its direction, width and value in reset?'
  default: '{dir: in, width: 11}'
  reason: The bar generator needs the horizontal coordinate to select a 160-pixel bar.
  affects: [color_bars.contract.ports.x]
  status: open
  by: oracle
- id: A-13
  text: 'What is color_bars''s port y: its direction, width and value in reset?'
  default: '{dir: in, width: 10}'
  reason: The bar generator accepts the vertical coordinate so its input follows the raster.
  affects: [color_bars.contract.ports.y]
  status: open
  by: oracle
- id: A-14
  text: 'What is color_bars''s port active: its direction, width and value in reset?'
  default: '{dir: in, width: 1}'
  reason: The bar generator needs the active-picture qualification to restrict the test picture to the active region.
  affects: [color_bars.contract.ports.active]
  status: open
  by: oracle
- id: A-15
  text: 'What is color_bars''s port pattern: its direction, width and value in reset?'
  default: '{dir: in, width: 2}'
  reason: A two-bit field is sufficient for pattern 0 and the proposed selection interface; width is not otherwise
    specified.
  affects: [color_bars.contract.ports.pattern]
  status: open
  by: oracle
- id: A-16
  text: 'What is color_bars''s port red: its direction, width and value in reset?'
  default: '{dir: out, width: 4, reset_value: 0}'
  reason: The bar generator needs a red output channel.
  affects: [color_bars.contract.ports.red]
  status: open
  by: oracle
- id: A-17
  text: 'What is color_bars''s port green: its direction, width and value in reset?'
  default: '{dir: out, width: 4, reset_value: 0}'
  reason: The bar generator needs a green output channel.
  affects: [color_bars.contract.ports.green]
