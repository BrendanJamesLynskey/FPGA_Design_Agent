  status: open
  by: oracle
- id: A-41
  text: 'What is video_control''s port pattern_selected: its direction, width and value in reset?'
  default: '{dir: out, width: 2, reset_value: 0}'
  reason: Expose the selected pattern to the CDC path; this is the proposed control-module connection.
  affects: [video_control.contract.ports.pattern_selected]
  status: open
  by: limit
- id: A-42
  text: 'What is video_control''s port frame_count_in: its direction, width and value in reset?'
  default: '{dir: in, width: 32}'
  reason: Accept the synchronized frame count for the shell register window.
  affects: [video_control.contract.ports.frame_count_in]
  status: open
  by: limit
- id: A-43
  text: 'What is video_control''s port frame_count: its direction, width and value in reset?'
  default: '{dir: out, width: 32, reset_value: 0}'
  reason: Expose the frame count as the RO register field.
  affects: [video_control.contract.ports.frame_count]
  status: open
  by: limit
- id: A-44
