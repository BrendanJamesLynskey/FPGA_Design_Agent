# Written by phase 0 (python -m project spec; brief 27B P1). Format: docs/project_layer.md.
schema: fpga-design-agent/project/v1
name: vmed_video_filter
board: nexys_a7_100t
clocks:
- {name: sys_clk, source: board, port: CLK100MHZ, mhz: 100}
- {name: pixel_clk, source: mmcm, from: sys_clk, mhz: 74.25}
resets:
- {name: sys_reset, domain: sys_clk, polarity: active_low, style: async, from: CPU_RESETN, via: reset_sync}
- {name: pixel_reset, domain: pixel_clk, polarity: active_low, style: sync, from: sys_reset, via: reset_sync}
shell: {design_id: VMED, clock: sys_clk, reset: sys_reset}
modules:
- name: pattern_timing
  kind: rtl
  clocks: {pixel_clk: pixel_clk}
  resets: {pixel_reset: pixel_reset}
  window_base: 0
  register_crossings: {PATTERN: xpm_cdc_handshake, FRAME_COUNT: xpm_cdc_handshake}
- name: median_filter
  kind: rtl
  clocks: {pixel_clk: pixel_clk}
  resets: {pixel_reset: pixel_reset}
- name: vga_output
  kind: rtl
  clocks: {pixel_clk: pixel_clk}
  resets: {pixel_reset: pixel_reset}
connections:
- {from: pattern_timing.out, to: median_filter.in}
- {from: median_filter.out, to: vga_output.in}
board_ports:
- {name: CLK100MHZ, dir: in, drive: input, to: sys_clk}
- {name: CPU_RESETN, dir: in, drive: input, to: sys_reset}
- {name: BTNC, dir: in, drive: input, to: vga_output.blank_button}
- {name: UART_TXD_IN, dir: in, drive: input, to: shell.uart_rx}
- {name: UART_RXD_OUT, dir: out, drive: push-pull, from: shell.uart_tx}
- {name: VGA_HS, dir: out, drive: push-pull, from: vga_output.hsync}
- {name: VGA_VS, dir: out, drive: push-pull, from: vga_output.vsync}
- {name: 'VGA_R[3:0]', dir: out, drive: push-pull, from: vga_output.red}
- {name: 'VGA_G[3:0]', dir: out, drive: push-pull, from: vga_output.green}
- {name: 'VGA_B[3:0]', dir: out, drive: push-pull, from: vga_output.blue}
- {name: 'LED[0]', dir: out, drive: push-pull, from: pixel_clk.locked}
owned: []
assumptions:
- id: A-1
  text: What boundary rule should the 3 x 3 filter use for neighbourhood samples beyond the active picture?
  default: Replicate the nearest active-picture pixel at each boundary, so every active output pixel has a complete
    3 x 3 neighbourhood.
  reason: The specification defines the neighbourhood operation but not how to obtain samples beyond the image edges.
  affects: [S-3]
  status: open
  by: oracle
- id: A-2
  text: Which patterns should be selectable through the UART?
  default: Provide the specified colour bars, a grayscale ramp, and a checkerboard; use the colour bars at startup.
  reason: The default pattern is specified, but the other choices available through the pattern-selection interface
    are not.
  affects: [S-2, S-7]
  status: open
  by: oracle
- id: A-3
  text: What UART command and response format should select a pattern and read the frame counter?
  default: Use newline-terminated ASCII commands `P<n>` to select pattern number n and `F` to read the counter,
    with newline-terminated ASCII replies.
  reason: The interface functions and baud rate are specified, but the command syntax and response format are not.
  affects: [S-7]
  status: open
  by: oracle
- id: A-4
  text: How should the frame counter count frames, and what width and reset behavior should it have?
  default: Use a 32-bit unsigned counter that increments once per completed displayed frame and starts at zero after
    power-up or reset.
  reason: The specification requires a readable frame counter but does not define its counting event, width, or
    initialization.
  affects: [S-7]
  status: open
  by: oracle
- id: A-5
  text: What pixel-clock stability criterion should control the colour blanking and LED[0]?
  default: Treat the clock as stable when the clock-generation primitive's locked indication is asserted.
  reason: The specification requires stable-clock behavior but does not define how stability is determined.
  affects: [S-5, S-6]
  status: open
  by: oracle
- id: A-6
  text: Is pattern_timing's reset pixel_reset active high or active low, and synchronous or asynchronous?
  default: '{polarity: active_low, style: sync}'
  reason: Reset the timing generator synchronously in its pixel-clock domain.
  affects: [pattern_timing.contract.resets.pixel_reset]
  status: open
  by: oracle
- id: A-7
  text: 'What is pattern_timing''s port pattern_select: its direction, width and value in reset?'
  default: '{dir: in, width: 2}'
  reason: Two bits encode the three selectable patterns, with zero selecting the startup colour bars.
  affects: [pattern_timing.contract.ports.pattern_select]
  status: open
  by: oracle
- id: A-8
  text: 'What is pattern_timing''s port frame_count: its direction, width and value in reset?'
  default: '{dir: out, width: 32, reset_value: 0}'
  reason: Use the supplied 32-bit unsigned completed-frame counter.
  affects: [pattern_timing.contract.ports.frame_count]
  status: open
  by: oracle
- id: A-9
  text: What protocol does pattern_timing's interface out use, and is pattern_timing its master or slave?
  default: '{protocol: axi4-stream, role: master}'
  reason: AXI4-Stream provides a point-to-point stream between the design blocks.
  affects: [pattern_timing.contract.interfaces.out.protocol]
  status: open
  by: oracle
- id: A-10
  text: 'What does a beat of pattern_timing.out carry: the tdata width and its fields with their formats?'
  default: '{width: 36, fields: [{name: x, bits: [35, 25], format: raster_x}, {name: y, bits: [24, 15], format:
    raster_y}, {name: red, bits: [14, 11], format: channel}, {name: green, bits: [10, 7], format: channel}, {name:
    blue, bits: [6, 3], format: channel}, {name: active, bits: [2, 2], format: flag}, {name: hsync, bits: [1, 1],
    format: flag}, {name: vsync, bits: [0, 0], format: flag}]}'
  reason: Carry raster coordinates, generated colour, active state, and sync signals to the filter.
  affects: [pattern_timing.contract.interfaces.out.tdata, median_filter.contract.interfaces.in.tdata]
  status: open
  by: oracle
- id: A-11
  text: Does pattern_timing.out carry sideband bits in tuser, and what does each bit mean?
  default: '(none: leave the field out)'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pattern_timing.contract.interfaces.out.tuser, median_filter.contract.interfaces.in.tuser]
  status: open
  by: oracle
- id: A-12
  text: What does tlast mark on pattern_timing.out, if anything?
  default: '(none: leave the field out)'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pattern_timing.contract.interfaces.out.tlast, median_filter.contract.interfaces.in.tlast]
  status: open
  by: oracle
- id: A-13
  text: How many beats does a packet on pattern_timing.out have?
  default: '(none: leave the field out)'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pattern_timing.contract.interfaces.out.packet_beats, median_filter.contract.interfaces.in.packet_beats]
  status: open
  by: oracle
- id: A-14
  text: 'What is the register map of pattern_timing: the offset, width, reset value and access (RW, RO, WO) of every
    register the host reads or writes?'
  default: '[{name: PATTERN, offset: 0, access: RW, reset: 0}, {name: FRAME_COUNT, offset: 4, access: RO, reset:
    0}]'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pattern_timing.contract.registers]
  status: open
  by: oracle
- id: A-15
  text: What protocol does median_filter's interface in use, and is median_filter its master or slave?
  default: '{protocol: axi4-stream, role: slave}'
  reason: Use AXI4-Stream for the point-to-point raster connection.
  affects: [median_filter.contract.interfaces.in.protocol]
  status: open
  by: oracle
- id: A-16
  text: What protocol does median_filter's interface out use, and is median_filter its master or slave?
  default: '{protocol: axi4-stream, role: master}'
  reason: Use AXI4-Stream for the point-to-point filtered raster connection.
  affects: [median_filter.contract.interfaces.out.protocol]
  status: open
  by: oracle
- id: A-17
  text: 'What does a beat of median_filter.out carry: the tdata width and its fields with their formats?'
  default: '{width: 36, fields: [{name: x, bits: [35, 25], format: raster_x}, {name: y, bits: [24, 15], format:
    raster_y}, {name: red, bits: [14, 11], format: channel}, {name: green, bits: [10, 7], format: channel}, {name:
    blue, bits: [6, 3], format: channel}, {name: active, bits: [2, 2], format: flag}, {name: hsync, bits: [1, 1],
    format: flag}, {name: vsync, bits: [0, 0], format: flag}]}'
  reason: Preserve raster fields so filtered pixels and sync timing remain aligned.
  affects: [median_filter.contract.interfaces.out.tdata, vga_output.contract.interfaces.in.tdata]
  status: open
  by: oracle
- id: A-18
  text: Does median_filter.out carry sideband bits in tuser, and what does each bit mean?
  default: '(none: leave the field out)'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [median_filter.contract.interfaces.out.tuser, vga_output.contract.interfaces.in.tuser]
  status: open
  by: oracle
- id: A-19
  text: What does tlast mark on median_filter.out, if anything?
  default: '(none: leave the field out)'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [median_filter.contract.interfaces.out.tlast, vga_output.contract.interfaces.in.tlast]
  status: open
  by: oracle
- id: A-20
  text: How many beats does a packet on median_filter.out have?
  default: '(none: leave the field out)'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [median_filter.contract.interfaces.out.packet_beats, vga_output.contract.interfaces.in.packet_beats]
  status: open
  by: oracle
- id: A-21
  text: May the sink of median_filter.out stall the stream (drive tready low)?
  default: 'false'
  reason: The fixed-rate output raster is not stalled.
  affects: [median_filter.contract.interfaces.out.backpressure, vga_output.contract.interfaces.in.backpressure]
  status: open
  by: oracle
- id: A-22
  text: What throughput must median_filter.out sustain (beats per clock, and output beats per input beat)?
  default: '{beats_per_cycle: 1}'
  reason: The filter must sustain one output pixel beat per pixel clock.
  affects: [median_filter.contract.throughput.out]
  status: open
  by: oracle
- id: A-23
  text: Is vga_output's reset pixel_reset active high or active low, and synchronous or asynchronous?
  default: '{polarity: active_low, style: sync}'
  reason: Reset the output stage synchronously in its pixel-clock domain.
  affects: [vga_output.contract.resets.pixel_reset]
  status: open
  by: oracle
- id: A-24
  text: 'What is vga_output''s port pixel_stable: its direction, width and value in reset?'
  default: '{dir: in, width: 1}'
  reason: Use the clock-generation primitive's locked indication as the stability input.
  affects: [vga_output.contract.ports.pixel_stable]
  status: open
  by: oracle
- id: A-25
  text: 'What is vga_output''s port blank_button: its direction, width and value in reset?'
  default: '{dir: in, width: 1}'
  reason: Use BTNC as the colour-blanking control.
  affects: [vga_output.contract.ports.blank_button]
  status: open
  by: oracle
- id: A-26
  text: 'What is vga_output''s port red: its direction, width and value in reset?'
  default: '{dir: out, width: 4, reset_value: 0}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [vga_output.contract.ports.red]
  status: open
  by: oracle
- id: A-27
  text: 'What is vga_output''s port green: its direction, width and value in reset?'
  default: '{dir: out, width: 4, reset_value: 0}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [vga_output.contract.ports.green]
  status: open
  by: oracle
- id: A-28
  text: 'What is vga_output''s port blue: its direction, width and value in reset?'
  default: '{dir: out, width: 4, reset_value: 0}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [vga_output.contract.ports.blue]
  status: open
  by: oracle
- id: A-29
  text: 'What is vga_output''s port hsync: its direction, width and value in reset?'
  default: '{dir: out, width: 1, reset_value: 0}'
  reason: Drive the horizontal sync from the aligned raster timing.
  affects: [vga_output.contract.ports.hsync]
  status: open
  by: oracle
- id: A-30
  text: 'What is vga_output''s port vsync: its direction, width and value in reset?'
  default: '{dir: out, width: 1, reset_value: 0}'
  reason: Drive the vertical sync from the aligned raster timing.
  affects: [vga_output.contract.ports.vsync]
  status: open
  by: oracle
- id: A-31
  text: What protocol does vga_output's interface in use, and is vga_output its master or slave?
  default: '{protocol: axi4-stream, role: slave}'
  reason: Use AXI4-Stream for the filtered raster connection.
  affects: [vga_output.contract.interfaces.in.protocol]
  status: open
  by: oracle
- id: A-32
  text: What number format is raster_x in pattern_timing (signed or unsigned, total and fraction bits), and how
    is it packed?
  default: '{format: u11, packing: Raster horizontal coordinate}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pattern_timing.contract.data_formats.raster_x]
  status: open
  by: oracle
- id: A-33
  text: What number format is raster_y in pattern_timing (signed or unsigned, total and fraction bits), and how
