  affects: [design.modules.pattern_gen.window_base]
  status: open
  by: limit
- id: A-54
  text: What does the board pin CLK100MHZ connect to, and how is it driven (push-pull, open-drain, pulled up, input)?
  default: '{dir: in, drive: input, to: clk_sys}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [design.board_ports.CLK100MHZ]
  status: open
  by: limit
- id: A-55
  text: What does the board pin CPU_RESETN connect to, and how is it driven (push-pull, open-drain, pulled up, input)?
  default: '{dir: in, drive: input, to: rst_sys}'
  reason: The board reset pin is used for configuration/runtime initialization; BTNC is not used as reset.
  affects: [design.board_ports.CPU_RESETN]
  status: open
  by: limit
- id: A-56
  text: What does the board pin VGA_R[3:0] connect to, and how is it driven (push-pull, open-drain, pulled up, input)?
  default: '{dir: out, drive: push-pull, from: vga_output.red}'
  reason: The board's VGA red channel is four bits wide.
