- id: A-38
  text: Is vga_output's reset rst active high or active low, and synchronous or asynchronous?
  default: '{polarity: active_high, style: sync}'
  reason: Use the synchronized video-domain reset.
  affects: [vga_output.contract.resets.rst]
  status: open
  by: limit
- id: A-39
  text: 'What is vga_output''s port red: its direction, width and value in reset?'
  default: '{dir: out, width: 4, reset_value: 0}'
  reason: The VGA red output uses the specified four-bit channel.
  affects: [vga_output.contract.ports.red]
  status: open
