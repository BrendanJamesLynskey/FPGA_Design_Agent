  status: open
  by: limit
- id: A-48
  text: 'Which clock is clk_sys: its frequency and where it comes from?'
  default: '{source: board, mhz: 100, port: CLK100MHZ}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [design.clocks.clk_sys]
  status: open
  by: limit
- id: A-49
  text: 'Which clock is clk_video: its frequency and where it comes from?'
  default: '{source: mmcm, mhz: 74.25, from: clk_sys}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [design.clocks.clk_video]
  status: open
  by: limit
- id: A-50
  text: What resets the design's reset rst_sys (button or other source), and its polarity?
  default: '{from: CPU_RESETN, polarity: active_low, style: async}'
  reason: Use CPU_RESETN as the board reset; BTNC is explicitly reserved for video blanking.
  affects: [design.resets.rst_sys]
  status: open
  by: limit
- id: A-51
  text: What resets the design's reset rst_video (button or other source), and its polarity?
  default: '{from: rst_sys, polarity: active_high, style: sync}'
  reason: Synchronize reset into the MMCM-derived video clock domain.
  affects: [design.resets.rst_video]
  status: open
  by: limit
- id: A-52
  text: At which offset of the shell's register window do timing_gen's registers start?
  default: '4'
  reason: Place the frame counter register at the next non-overlapping aligned shell-window offset.
  affects: [design.modules.timing_gen.window_base]
  status: open
  by: limit
- id: A-53
  text: At which offset of the shell's register window do pattern_gen's registers start?
  default: '0'
