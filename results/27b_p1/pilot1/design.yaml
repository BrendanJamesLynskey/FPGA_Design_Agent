- id: A-43
  text: What does the board pin CLK100MHZ connect to, and how is it driven (push-pull, open-drain, pulled up, input)?
  default: '{dir: in, drive: input, to: sys_clk}'
  reason: Connect the board reference clock to the declared system clock.
  affects: [design.board_ports.CLK100MHZ]
  status: open
  by: limit
- id: A-44
  text: What does the board pin CPU_RESETN connect to, and how is it driven (push-pull, open-drain, pulled up, input)?
  default: '{dir: in, drive: input, to: sys_reset}'
  reason: Connect the board's external active-low reset to the declared reset source.
  affects: [design.board_ports.CPU_RESETN]
  status: open
  by: limit
- id: A-45
  text: What does the board pin VGA_HS connect to, and how is it driven (push-pull, open-drain, pulled up, input)?
  default: '{dir: out, drive: push-pull, from: vga_output.hsync}'
  reason: Connect the horizontal sync output to the board's VGA horizontal-sync pin.
  affects: [design.board_ports.VGA_HS]
  status: open
  by: limit
- id: A-46
  text: What does the board pin VGA_VS connect to, and how is it driven (push-pull, open-drain, pulled up, input)?
  default: '{dir: out, drive: push-pull, from: vga_output.vsync}'
  reason: Connect the vertical sync output to the board's VGA vertical-sync pin.
  affects: [design.board_ports.VGA_VS]
  status: open
  by: limit
