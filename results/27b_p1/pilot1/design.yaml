# Written by phase 0 (python -m project spec; brief 27B P1). Format: docs/project_layer.md.
schema: fpga-design-agent/project/v1
name: vmed
board: nexys_a7_100t
clocks:
- {name: clk_sys, source: board, port: CLK100MHZ, mhz: 100}
- {name: clk_video, source: mmcm, from: clk_sys, mhz: 74.25}
resets:
- {name: rst_sys, domain: clk_sys, polarity: active_low, style: async, from: CPU_RESETN}
- {name: rst_video, domain: clk_video, polarity: active_high, style: sync, from: rst_sys, via: reset_sync}
shell: {design_id: VMED, clock: clk_sys, reset: rst_sys}
modules:
- name: pixel_clock
  kind: rtl
  clocks: {clk: clk_sys}
  resets: {rst: rst_sys}
- name: timing_gen
  kind: rtl
  clocks: {clk: clk_video}
  resets: {rst: rst_video}
  window_base: 4
  register_crossings: {FRAME_COUNT: xpm_cdc_gray}
- name: pattern_gen
  kind: rtl
  clocks: {clk: clk_video}
  resets: {rst: rst_video}
  window_base: 0
  register_crossings: {PATTERN: xpm_cdc_single}
- name: median_filter
  kind: rtl
  clocks: {clk: clk_video}
  resets: {rst: rst_video}
- name: vga_output
  kind: rtl
  clocks: {clk: clk_video}
  resets: {rst: rst_video}
connections:
- {from: timing_gen.out, to: pattern_gen.in}
- {from: pattern_gen.out, to: median_filter.in}
- {from: median_filter.out, to: vga_output.in}
board_ports:
- {name: CLK100MHZ, dir: in, drive: input, to: clk_sys}
- {name: CPU_RESETN, dir: in, drive: input, to: rst_sys}
- {name: UART_TXD_IN, dir: in, drive: input, to: shell.uart_rx}
- {name: UART_RXD_OUT, dir: out, drive: push-pull, from: shell.uart_tx}
- {name: BTNC, dir: in, drive: input, to: vga_output.blank_button}
- {name: 'LED[0]', dir: out, drive: push-pull, from: clk_video.locked}
- {name: 'VGA_R[3:0]', dir: out, drive: push-pull, from: vga_output.red}
- {name: 'VGA_G[3:0]', dir: out, drive: push-pull, from: vga_output.green}
- {name: 'VGA_B[3:0]', dir: out, drive: push-pull, from: vga_output.blue}
- {name: VGA_HS, dir: out, drive: push-pull, from: vga_output.hsync}
- {name: VGA_VS, dir: out, drive: push-pull, from: vga_output.vsync}
owned: []
assumptions:
- id: A-1
  text: What should the filter do at the active-picture boundaries, where a full 3x3 neighbourhood extends outside
    the picture?
  default: 'Use nearest-edge replication: clamp each neighbourhood coordinate to the nearest active-picture coordinate.'
  reason: The filter operation is specified, but boundary pixels do not have a complete in-picture neighbourhood.
  affects: [S-3]
  status: open
  by: oracle
- id: A-2
  text: Which patterns should be selectable through the test shell?
  default: Offer the specified colour bars and a solid-black pattern, with the colour bars selected at power-up.
  reason: The specification requires pattern selection and defines the default pattern, but does not define the
    other selectable patterns.
  affects: [S-2, S-8]
  status: open
  by: oracle
- id: A-3
  text: What UART command and response format should the host use for identifying the design, selecting a pattern,
    and reading the frame counter?
  default: 'Use newline-terminated ASCII commands and responses: ID, PAT <number>, and FRAME; return VMED for ID
    and an acknowledgement or value for the other commands.'
  reason: The baud rate and design ID are specified, but the serial protocol and command syntax are not.
  affects: [S-7, S-8]
  status: open
  by: oracle
- id: A-4
  text: What should the frame counter count, and what width and wrap behaviour should it have?
  default: Use a 32-bit unsigned counter that increments once per completed video frame and wraps naturally on overflow.
  reason: A readable frame counter is required, but its meaning, width, and overflow behaviour are unspecified.
  affects: [S-8]
  status: open
  by: oracle
- id: A-5
  text: How should the design initialize its state at FPGA configuration, given that BTNC is specified as a video-blanking
    control?
  default: Initialize state through FPGA configuration; use BTNC only to blank colour outputs, not as a reset.
  reason: The specification assigns BTNC a blanking behaviour but does not specify a reset or initialization method.
  affects: [S-3, S-8]
  status: open
  by: oracle
- id: A-6
  text: At what clock rate (MHz) must pixel_clock's clock clk close timing?
  default: '100'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pixel_clock.contract.clocks.clk.max_mhz]
  status: open
  by: oracle
- id: A-7
  text: 'What is pixel_clock''s port locked: its direction, width and value in reset?'
  default: '{dir: out, width: 1, reset_value: 0}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pixel_clock.contract.ports.locked]
  status: open
  by: oracle
- id: A-8
  text: Is timing_gen's reset rst active high or active low, and synchronous or asynchronous?
  default: '{polarity: active_high, style: sync}'
  reason: Use the synchronized video-domain reset.
  affects: [timing_gen.contract.resets.rst]
  status: open
  by: oracle
- id: A-9
  text: What number format is rgb12 in timing_gen (signed or unsigned, total and fraction bits), and how is it packed?
  default: '{format: u12, packing: three 4-bit RGB channels}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [timing_gen.contract.data_formats.rgb12]
  status: open
  by: oracle
- id: A-10
  text: What number format is y10 in timing_gen (signed or unsigned, total and fraction bits), and how is it packed?
  default: '{format: u10, packing: vertical raster coordinate}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [timing_gen.contract.data_formats.y10]
  status: open
  by: oracle
- id: A-11
  text: What number format is bit1 in timing_gen (signed or unsigned, total and fraction bits), and how is it packed?
  default: '{format: u1, packing: one raster metadata bit}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [timing_gen.contract.data_formats.bit1]
  status: open
  by: oracle
- id: A-12
  text: What protocol does timing_gen's interface out use, and is timing_gen its master or slave?
  default: '{protocol: axi4-stream, role: master}'
  reason: AXI4-Stream is selected as the internal raster connection protocol.
  affects: [timing_gen.contract.interfaces.out.protocol]
  status: open
  by: oracle
- id: A-13
  text: 'What does a beat of timing_gen.out carry: the tdata width and its fields with their formats?'
  default: '{width: 36, fields: [{name: rgb, bits: [35, 24], format: rgb12}, {name: x, bits: [23, 13], format: x11},
    {name: y, bits: [12, 3], format: y10}, {name: active, bits: [2, 2], format: bit1}, {name: hsync, bits: [1, 1],
    format: bit1}, {name: vsync, bits: [0, 0], format: bit1}]}'
  reason: Receive raster coordinates and timing metadata from the timing generator.
  affects: [timing_gen.contract.interfaces.out.tdata, pattern_gen.contract.interfaces.in.tdata]
  status: open
  by: oracle
- id: A-14
  text: What does tlast mark on timing_gen.out, if anything?
  default: Assert on the final raster position of each frame.
  reason: Use the final raster position to mark the end of the frame.
  affects: [timing_gen.contract.interfaces.out.tlast, pattern_gen.contract.interfaces.in.tlast]
  status: open
  by: oracle
- id: A-15
  text: How many beats does a packet on timing_gen.out have?
  default: '1237500'
  reason: One frame has 1650 clocks per line and 750 lines.
  affects: [timing_gen.contract.interfaces.out.packet_beats, pattern_gen.contract.interfaces.in.packet_beats]
  status: open
  by: oracle
- id: A-16
  text: What throughput must timing_gen.out sustain (beats per clock, and output beats per input beat)?
  default: '{beats_per_cycle: 1}'
  reason: One raster sample is generated per pixel clock.
  affects: [timing_gen.contract.throughput.out]
  status: open
  by: oracle
- id: A-17
  text: Is pattern_gen's reset rst active high or active low, and synchronous or asynchronous?
  default: '{polarity: active_high, style: sync}'
  reason: Use the synchronized video-domain reset.
  affects: [pattern_gen.contract.resets.rst]
  status: open
  by: oracle
- id: A-18
  text: 'What is pattern_gen''s port pattern_select: its direction, width and value in reset?'
  default: '{dir: in, width: 1}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pattern_gen.contract.ports.pattern_select]
  status: open
  by: oracle
- id: A-19
  text: What number format is rgb12 in pattern_gen (signed or unsigned, total and fraction bits), and how is it
    packed?
  default: '{format: u12, packing: three 4-bit RGB channels}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pattern_gen.contract.data_formats.rgb12]
  status: open
  by: oracle
- id: A-20
  text: What number format is y10 in pattern_gen (signed or unsigned, total and fraction bits), and how is it packed?
  default: '{format: u10, packing: vertical raster coordinate}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pattern_gen.contract.data_formats.y10]
  status: open
  by: oracle
- id: A-21
  text: What number format is bit1 in pattern_gen (signed or unsigned, total and fraction bits), and how is it packed?
  default: '{format: u1, packing: one raster metadata bit}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pattern_gen.contract.data_formats.bit1]
  status: open
  by: oracle
- id: A-22
  text: What protocol does pattern_gen's interface in use, and is pattern_gen its master or slave?
  default: '{protocol: axi4-stream, role: slave}'
  reason: AXI4-Stream is selected as the internal raster connection protocol.
  affects: [pattern_gen.contract.interfaces.in.protocol]
  status: open
  by: oracle
- id: A-23
  text: What protocol does pattern_gen's interface out use, and is pattern_gen its master or slave?
  default: '{protocol: axi4-stream, role: master}'
  reason: AXI4-Stream is selected as the internal raster connection protocol.
  affects: [pattern_gen.contract.interfaces.out.protocol]
  status: open
  by: oracle
- id: A-24
  text: What does tlast mark on pattern_gen.out, if anything?
  default: Assert on the final raster position of each frame.
  reason: Preserve the frame marker through the pattern generator.
  affects: [pattern_gen.contract.interfaces.out.tlast, median_filter.contract.interfaces.in.tlast]
  status: open
  by: oracle
- id: A-25
  text: How many beats does a packet on pattern_gen.out have?
  default: '1237500'
  reason: One frame has 1650 clocks per line and 750 lines.
  affects: [pattern_gen.contract.interfaces.out.packet_beats, median_filter.contract.interfaces.in.packet_beats]
  status: open
  by: oracle
- id: A-26
  text: 'What is the register map of pattern_gen: the offset, width, reset value and access (RW, RO, WO) of every
    register the host reads or writes?'
  default: '[{name: PATTERN, offset: 0, access: RW, reset: 0}]'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pattern_gen.contract.registers]
  status: open
  by: oracle
- id: A-27
  text: What throughput must pattern_gen.out sustain (beats per clock, and output beats per input beat)?
  default: '{beats_per_cycle: 1}'
  reason: The pattern generator processes every timing sample.
  affects: [pattern_gen.contract.throughput.out]
  status: open
  by: oracle
- id: A-28
  text: What latency, in clock cycles, from pattern_gen.in to pattern_gen.out?
  default: '(none: leave the field out)'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [pattern_gen.contract.latency.in.out]
  status: open
  by: oracle
- id: A-29
  text: What number format is rgb12 in median_filter (signed or unsigned, total and fraction bits), and how is it
