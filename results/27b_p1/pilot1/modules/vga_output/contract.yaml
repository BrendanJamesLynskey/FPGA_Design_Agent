# Written by phase 0 (python -m project spec; brief 27B P1). Format: docs/project_layer.md.
schema: fpga-design-agent/contract/v1
module: vga_output
summary: Drives VGA colour and sync pins, blanks colour when required, and exposes the completed-frame counter.
clocks:
- {name: clk, port: clk, max_mhz: 74.25}
resets:
- {name: rst, port: rst, clock: clk, polarity: active_high, style: sync}
ports:
- {name: clk, dir: in}
- {name: rst, dir: in}
- {name: s_axis_tvalid, dir: in, clock: clk}
- {name: s_axis_tready, dir: out, clock: clk, reset_value: 0}
- {name: s_axis_tdata, dir: in, width: 16, clock: clk}
- {name: s_axis_tlast, dir: in, clock: clk}
- {name: centre_button, dir: in, width: 1, clock: async}
- {name: vga_r, dir: out, width: 4, clock: clk, reset_value: 0}
- {name: vga_g, dir: out, width: 4, clock: clk, reset_value: 0}
- {name: vga_b, dir: out, width: 4, clock: clk, reset_value: 0}
- {name: vga_hsync, dir: out, width: 1, clock: clk}
- {name: vga_vsync, dir: out, width: 1, clock: clk, reset_value: 0}
- {name: frame_count, dir: out, width: 32, clock: clk, reset_value: 0}
data_formats:
- {name: rgb444, format: u12, packing: 'R[11:8], G[7:4], B[3:0]'}
- {name: bit, format: u1, packing: one Boolean raster or status value}
- {name: count32, format: u32, packing: unsigned 32-bit frame count}
interfaces:
- name: in
  protocol: axi4-stream
  role: slave
  prefix: s_axis
  clock: clk
  reset: rst
  tdata:
    width: 16
    fields:
    - name: rgb
      bits: [11, 0]
      format: rgb444
    - name: hsync
      bits: [12, 12]
      format: bit
    - name: vsync
      bits: [13, 13]
      format: bit
    - name: active
      bits: [14, 14]
      format: bit
    - name: stable
      bits: [15, 15]
      format: bit
  tlast: Assert on the final pixel clock of each raster frame.
  packet_beats: 1237500
  backpressure: true
  source_gaps: false
registers:
  bus: top
  map:
  - name: FRAME_COUNT
    offset: 4
    access: RO
    reset: 0
    width: 32
    volatile: true
    fields:
    - name: frame_count
      bits: [31, 0]
      port: frame_count
