# Written by phase 0 (python -m project spec; brief 27B P1). Format: docs/project_layer.md.
schema: fpga-design-agent/project/v1
name: safe_pwm_audio
board: nexys_a7_100t
clocks:
- {name: clk_sys, source: board, port: CLK100MHZ, mhz: 100}
resets:
- {name: rst_sys, domain: clk_sys, polarity: active_low, style: async, from: CPU_RESETN, via: reset_sync}
shell: {design_id: PWMA, clock: clk_sys, reset: rst_sys}
modules:
- name: c12_nexys_pwm_audio_top
  kind: rtl
  clocks: {clk: clk_sys}
  resets: {rst: rst_sys}
  params: {CLKS_PER_BIT: 868, TIMEOUT_CYCLES: 100000, BUILD_STAMP: 0}
  window_base: 0
connections: []
board_ports:
- {name: CLK100MHZ, dir: in, drive: input, to: clk_sys}
- {name: CPU_RESETN, dir: in, drive: input, to: rst_sys}
- {name: UART_TXD_IN, dir: in, drive: input, to: shell.uart_rx}
- {name: UART_RXD_OUT, dir: out, drive: push-pull, from: shell.uart_tx}
- {name: AUD_PWM, dir: out, drive: open-drain, from: c12_nexys_pwm_audio_top.AUD_PWM}
- {name: AUD_SD, dir: out, drive: push-pull, from: c12_nexys_pwm_audio_top.AUD_SD}
- {name: 'LED[15:0]', dir: out, drive: push-pull, from: c12_nexys_pwm_audio_top.LED}
owned: []
assumptions:
- id: A-1
  text: What UART command and response format shall the shell use for sample writes, gain writes, and sample_out
    reads?
  default: 'Use line-oriented ASCII commands: S followed by a four-digit hexadecimal two''s-complement sample, G
    followed by a four-digit hexadecimal gain, and R to read sample_out as four hexadecimal digits.'
  reason: The required shell operations and baud rate are specified, but the framing, command syntax, numeric encoding,
    and response format are not.
  affects: [S-5]
  status: open
  by: oracle
- id: A-2
  text: What reset behavior and phase should the PWM counter have under CPU_RESETN?
  default: Reset the counter to zero while CPU_RESETN is asserted so PWM starts at a deterministic phase.
  reason: The specified reset effects cover the gain and sample but do not state whether reset affects the PWM counter.
  affects: [S-4, S-6]
  status: open
  by: oracle
- id: A-3
  text: What value, and what allowed range, should parameter BUILD_STAMP of c12_nexys_pwm_audio_top have?
  default: '{default: 0, min: 0, max: 2147483647}'
  reason: The specification names this parameter but gives no default or range; zero is a neutral proposed default.
  affects: [c12_nexys_pwm_audio_top.contract.parameters.BUILD_STAMP]
  status: open
  by: oracle
- id: A-4
  text: 'What is c12_nexys_pwm_audio_top''s port gain: its direction, width and value in reset?'
  default: '{dir: in, width: 16}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [c12_nexys_pwm_audio_top.contract.ports.gain]
  status: open
  by: oracle
- id: A-5
  text: 'What is c12_nexys_pwm_audio_top''s port sample_out: its direction, width and value in reset?'
  default: '{dir: out, width: 16, reset_value: 0}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [c12_nexys_pwm_audio_top.contract.ports.sample_out]
  status: open
  by: oracle
- id: A-6
  text: 'What is c12_nexys_pwm_audio_top''s port AUD_PWM: its direction, width and value in reset?'
  default: '{dir: out, width: 1, reset_value: 0}'
  reason: The board-facing output must support high-impedance behavior, so the board port is declared open-drain.
  affects: [c12_nexys_pwm_audio_top.contract.ports.AUD_PWM]
  status: open
  by: oracle
- id: A-7
  text: What number format is q15_gain in c12_nexys_pwm_audio_top (signed or unsigned, total and fraction bits),
    and how is it packed?
  default: '{format: u16, packing: unsigned Q15 gain}'
  reason: the specification does not state it; this is the drafter's proposal
  affects: [c12_nexys_pwm_audio_top.contract.data_formats.q15_gain]
  status: open
  by: oracle
- id: A-8
  text: What does the board pin UART_RXD_OUT connect to, and how is it driven (push-pull, open-drain, pulled up,
    input)?
  default: '{dir: out, drive: push-pull, from: shell.uart_tx}'
  reason: The board pin direction is the FPGA's own; the oracle answer identifies UART_RXD_OUT as an output.
  affects: [design.board_ports.UART_RXD_OUT]
  status: open
  by: oracle
