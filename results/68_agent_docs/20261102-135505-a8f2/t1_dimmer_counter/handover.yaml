schema: fda-handover/1
id: t1_dimmer_counter
title: T1 LED dimmer and push-button counter (Nexys A7-100T)
kind: agent-run
produced_by: agent
summary: The design keeps a 16-bit up/down/clear counter driven by three debounced push-buttons or by writes through the
  USB-UART test shell. It shows the counter on 16 LEDs gated by a PWM dimmer. Brightness comes from a register or from the
  eight right-hand switches. The counter and the brightness appear on a multiplexed seven-segment display. It also keeps
  three per-button press counters, a control register and a design ID, all in the shell's register window. The run reached
  a base bitstream under an earlier Vivado release than the pinned one, so no number from that build is published. Verification
  reached V1 of V3, and the debug build with the ILA did not complete. The specification and architecture were accepted
  by a model with no human review.
scope_not:
- Not a general UART peripheral. UART framing, command syntax and register transactions come from the shared test shell
  (shell/rtl), not from this design.
- No board result (V-HW) is recorded. The design has not been shown working on hardware.
- Not a timing-, resource- or power-characterised design. No current Vivado measurement exists.
- No interrupts, no bus other than the shell's register window, and no decimal-point or middle-digit (AN[5:4]) output.
target:
  part: xc7a100tcsg324-1
  board: nexys_a7_100t
  tool: Vivado 2026.1
  top: t1_led_dimmer_counter
clocks:
- name: clk
  mhz: 100.0
  source: results/68_agent_docs/20261102-135505-a8f2/t1_dimmer_counter/design.xdc
resets:
- name: cpu_resetn
  active: low
  note: Active-low CPU reset button. In t1_led_dimmer_counter.sv the design registers use ~cpu_resetn directly as a synchronous
    reset, with no synchroniser. Only the shell gets a two-flop synchronised release.
interfaces:
- name: clk
  type: clock input
  note: 100 MHz oscillator. design.xdc puts it on pin E3 and creates the clock with a 10.00 ns period.
- name: btn_up, btn_down, btn_center
  type: push-button inputs, active high
  note: Increment, decrement and clear. They pass two flops and a per-button debounce before they act. Pins are in design.xdc.
- name: switches[7:0]
  type: slide-switch inputs
  note: Manual brightness source when CONTROL bit 0 is set. Also readable in INPUT_STATUS.
- name: leds[15:0]
  type: LED outputs
  note: Counter bits, forced to zero while the PWM waveform is off.
- name: seg[6:0], dp
  type: seven-segment outputs, active low
  note: dp is held inactive. See the gap on seg bit order.
- name: an[7:0]
  type: digit enables, active low
  note: AN[3:0] show the counter, AN[7:6] show the brightness, and AN[5:4] stay off.
- name: uart_rxd, uart_txd
  type: USB-UART
  note: 8-N-1 at the shell's divider, connected to the embedded fpga_shell. The shell maps the design's registers into its
    register window (set by address bit 7 in shell_core.sv).
registers:
- offset: 0
  name: COUNTER
  access: RW
  reset: 0
  bits: 16
- offset: 4
  name: BRIGHTNESS
  access: RW
  reset: 255
  bits: 8
- offset: 8
  name: CONTROL
  access: RW
  reset: 0
  bits: 2
- offset: 12
  name: INPUT_STATUS
  access: RO
  reset: 0
  bits: 11
- offset: 16
  name: UP_PRESS_COUNT
  access: RO
  reset: 0
  bits: 32
- offset: 20
  name: DOWN_PRESS_COUNT
  access: RO
  reset: 0
  bits: 32
- offset: 24
  name: CENTRE_PRESS_COUNT
  access: RO
  reset: 0
  bits: 32
- offset: 28
  name: DESIGN_ID
  access: RO
  reset: 1412514883
  bits: 32
parameters:
- name: DEBOUNCE_CYCLES
  value: 1000000
  legal: positive integer count of clk cycles. Only the default was exercised.
  note: 'Stable-input time before a press or release is accepted: about 10 ms at 100 MHz (spec timing). It sizes the per-button
    counter. Spec timing: 1000000 sys_clk cycles of stable input, approximately 10 ms at 100 MHz.'
- name: PWM_PERIOD_CYCLES
  value: 4096
  legal: positive integer count of clk cycles. Only the default was exercised.
  note: 'PWM period: about 24.4 kHz at 100 MHz, chosen to avoid visible flicker (spec timing). On-time is ceil(brightness
    * period / 255), with 255 always on and 0 always off. Spec timing: 4096 sys_clk cycles, approximately 24.4 kHz at 100
    MHz; selected to avoid visible flicker.'
- name: DISPLAY_DIGIT_CYCLES
  value: 100000
  legal: positive integer count of clk cycles. Only the default was exercised.
  note: 'Time per digit slot: about 1 ms per digit and 125 Hz for the eight-digit scan (spec timing). The RTL uses this
    value, not the 131072 cycles in one interview answer. Spec timing: 100000 sys_clk cycles per digit, approximately 1
    ms per digit and 125 Hz for an eight-digit scan.'
- name: UART_BAUD_DIVIDER_CYCLES
  value: 868
  legal: integer clk cycles per UART bit. Only the default was exercised, and the receiver halves it, so a tiny divider
    is unlikely to work.
  note: 'Passed to the shell as CLKS_PER_BIT. 115200 baud at 100 MHz, the nearest integer divider (spec timing). Spec timing:
    115200 baud with UART_BAUD_DIVIDER_CYCLES=868, the nearest integer divider for a 100 MHz clock.'
