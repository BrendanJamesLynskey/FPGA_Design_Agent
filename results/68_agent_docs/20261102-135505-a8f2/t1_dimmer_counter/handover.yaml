# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: t1_dimmer_counter
title: T1 LED dimmer and push-button counter
kind: agent-run
produced_by: agent
summary: 'A Nexys A7-100T design with a 16-bit up/down counter driven by three debounced push-buttons (up, down, centre-clear)
  and by UART register writes. The counter is shown on 16 PWM-dimmed LEDs and as hexadecimal on a scanned seven-segment
  display, which also shows the brightness. Registers are reached through the shared UART test shell. The run stopped because
  stage 9 was visited more than 4 times: the base build reached a bitstream under an earlier Vivado release and the debug
  build with the ILA did not complete. Verification reached V1 of V3 and no board run was recorded.'
scope_not:
- Not a general-purpose PWM or display core. The glyph table, the digit layout and the register map are fixed in t1_led_dimmer_counter.sv.
- Not a UART protocol implementation of its own. Framing and commands come from the shared shell (shell/rtl), and the spec
  leaves them unspecified.
- Not timing-, power- or resource-characterised on the pinned Vivado release. No current numbers exist.
- Not verified on a board, and the seven-segment glyphs were not checked against the pins.
target:
  part: xc7a100tcsg324-1
  board: nexys_a7_100t
  tool: Vivado 2026.1
  top: t1_led_dimmer_counter
clocks:
- name: clk
  mhz: 100.0
  source: results/68_agent_docs/20261102-135505-a8f2/t1_dimmer_counter/design.xdc
resets:
- name: cpu_resetn
  active: low
  note: In t1_led_dimmer_counter.sv the design registers are reset synchronously by rst = ~cpu_resetn with no synchroniser,
    so the button release is not aligned to clk. Only the shell receives the two-flop reset_sync (shell_rst, asserted asynchronously,
    released synchronously). The spec asks for synchronised release everywhere.
interfaces:
- name: clk
  type: 100 MHz clock input, pin E3 in design.xdc (period 10.00 ns)
  note: The spec says W5; design.xdc is what was built.
- name: btn_up, btn_down, btn_center
  type: three active-high push-button inputs (BTNU, BTND, BTNC)
  note: Synchronised by two flops, then debounced. The INPUT_STATUS bits read the raw pins instead.
- name: switches
  type: 8-bit input, SW[7:0]
  note: Brightness source when CONTROL bit 0 is set. Not synchronised in RTL.
- name: leds
  type: 16-bit output, LED[15:0]
  note: Counter bits gated by the PWM waveform.
- name: seg
  type: 7-bit active-low output, seg[0] is CA and seg[6] is CG
  note: See the seg_bit_order gap.
- name: dp
  type: 1-bit output
  note: Held at 1, which is inactive (active low).
- name: an
  type: 8-bit active-low digit enables
  note: AN[3:0] show the counter, AN[7:6] show the brightness, AN[5:4] are always off.
- name: uart_rxd
  type: serial input, pin C4
  note: Goes to the shared fpga_shell (8-N-1, 115200 baud).
- name: uart_txd
  type: serial output, pin D4
  note: Driven by the shared fpga_shell.
registers:
- offset: 0
  name: COUNTER
  access: RW
  reset: 0
  bits: 16
- offset: 4
  name: BRIGHTNESS
  access: RW
  reset: 255
  bits: 8
- offset: 8
  name: CONTROL
  access: RW
  reset: 0
  bits: 2
- offset: 12
  name: INPUT_STATUS
  access: RO
  reset: 0
  bits: 11
- offset: 16
  name: UP_PRESS_COUNT
  access: RO
  reset: 0
  bits: 32
- offset: 20
  name: DOWN_PRESS_COUNT
  access: RO
  reset: 0
  bits: 32
- offset: 24
  name: CENTRE_PRESS_COUNT
  access: RO
  reset: 0
  bits: 32
- offset: 28
  name: DESIGN_ID
  access: RO
  reset: 1412514883
  bits: 32
parameters:
- name: DEBOUNCE_CYCLES
  value: 1000000
  legal: Integer of 2 or more. The RTL does not range-check it.
  note: 'A button level must be stable for this many sys_clk cycles, about 10 ms at 100 MHz. The same count applies to release.
    Spec timing: 1000000 sys_clk cycles of stable input, approximately 10 ms at 100 MHz.'
- name: PWM_PERIOD_CYCLES
  value: 4096
  legal: Integer of 2 or more. Only 4096 is specified, and the RTL does not range-check it.
  note: 'PWM period in sys_clk cycles, about 24.4 kHz at 100 MHz. LEDs are on while the phase is below ceil(brightness*period/255);
    brightness 255 is always on and 0 is always off. Spec timing: 4096 sys_clk cycles, approximately 24.4 kHz at 100 MHz;
    selected to avoid visible flicker.'
- name: DISPLAY_DIGIT_CYCLES
  value: 100000
  legal: Integer of 2 or more. The RTL does not range-check it.
  note: 'Cycles per digit slot, about 1 ms per digit and 125 Hz for the eight-slot scan at 100 MHz. The interview answer
    asked for 2^17 cycles, but the RTL and spec use this value. Spec timing: 100000 sys_clk cycles per digit, approximately
    1 ms per digit and 125 Hz for an eight-digit scan.'
- name: UART_BAUD_DIVIDER_CYCLES
  value: 868
  legal: Integer of 2 or more. The shell's receiver uses half of it.
  note: 'sys_clk cycles per UART bit, 115200 baud at 100 MHz. The shell''s frame timeout stays fixed at 100000 cycles in
    the RTL. Spec timing: 115200 baud with UART_BAUD_DIVIDER_CYCLES=868, the nearest integer divider for a 100 MHz clock.'
