  text: 'throughput not measured: the run measured no throughput'
- about: clock_pin
  text: spec.yaml gives the clock pin as W5, but design.xdc places clk on E3 and creates a 10.00 ns clock on it. design.xdc,
    generated from the board master constraints, is what was built.
- about: reset_style
  text: spec.yaml and ARCHITECTURE.md ask for asynchronous assertion with synchronised release for the whole design. The
    RTL does this only for the shell (reset_sync, shell_rst). The counter, brightness, control, press counters, debouncers,
    PWM and scan counters use rst = ~cpu_resetn sampled synchronously on clk, with no synchroniser on the release. The RTL
    is what was built.
- about: press_count_width
  text: an interview answer says the press counters are 8-bit and wrap at 256, but spec.yaml registers.map and the RTL (up_count,
    down_count, center_count) are 32-bit. The RTL and the spec map are what was built.
- about: display_period
  text: an interview answer asks for 2^17 cycles per digit and ARCHITECTURE.md notes the same proposal, but spec.yaml and
    the RTL parameter use 100000 cycles. The RTL value is what was built.
- about: register_access
  text: a write to any offset other than the three RW ones (COUNTER, BRIGHTNESS, CONTROL) is silently ignored, and the shell
    still answers OK. Reads of any other offset, including unaligned ones, return zero. Writes use only the low bits (16,
    8 and 2 respectively); upper write bits are dropped. Reads have no side effects.
- about: window_address
  text: the design decodes only win_addr, the low seven bits of the shell address. The shell routes an access to the design
    only when address bit 7 is set (shell_core.sv), so the spec offsets are the low seven bits of that window address.
- about: write_priority
  text: the counter takes a software write first, then a centre clear, then up, then down (the if/else chain in t1_led_dimmer_counter.sv).
    The three press counters increment independently of this chain, so a press that loses to a software write is still counted.
- about: input_status
  text: INPUT_STATUS bits 7:0 are the raw switches and bits 10:8 are the raw up, down and centre button pins. They are not
    synchronised or debounced, and the value is captured into the read-data register on a read. The reset value of zero
    is only the read-data register before any read.
- about: brightness_display
  text: when CONTROL bit 0 is set, the switches replace BRIGHTNESS for the PWM and also for the two brightness digits on
    the display. CONTROL bit 1 turns all digits off (an and seg all high) but does not affect the LEDs.
- about: latency_counts
  text: 'counted from the RTL: a button reaches btn_sync after two flops, then about DEBOUNCE_CYCLES cycles of stable level
    are needed. The counter and the press count update on the same clock edge that sets the debounced flag. A release must
    also be stable for that long before the next press can be accepted. The LED duty compares brightness and phase combinationally,
    so a brightness change acts at once rather than at the next PWM interval; display digits follow the counter combinationally,
    one scan slot being shown at a time.'
- about: assumption_scan_slots
  text: 'assumption: the scan runs eight slots of DISPLAY_DIGIT_CYCLES each, with slots 4 and 5 blank, so each lit digit
    is on for one slot in eight.'
