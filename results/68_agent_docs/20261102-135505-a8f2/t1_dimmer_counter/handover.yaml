  (seeded runs, constrained-random test, assertions, coverage, mutation score).'
- 'Reconcile the spec with what was built: press-counter width, display period, clock pin, and reset style (add a synchroniser
  on the design reset release, or change the spec).'
- Find why the debug build with the ILA left an error stub in build/ila/gates.json, fix it, and rebuild it.
- When the flow reaches the build again, re-measure the base build with python -m agent resume on Vivado 2026.1, then record
