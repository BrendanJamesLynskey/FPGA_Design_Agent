# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: t1_dimmer_counter
title: T1 LED dimmer and push-button counter on the Nexys A7-100T
kind: agent-run
produced_by: agent
summary: The design keeps a 16-bit up/down counter driven by three debounced push-buttons (up, down, clear) and by writes
  over the USB-UART test shell. It shows the counter on 16 LEDs gated by a PWM brightness waveform and on a multiplexed
  seven-segment display, and exposes the counter, brightness, control bits, input status, three press counters and a design
  ID as a register window. The run reached a base bitstream, but under an earlier Vivado release than the pinned one, so
  none of its numbers are published. Stages clarify to drc-closure passed their gates; configuration-and-debug did not,
  because the ILA debug build did not complete. Simulation verification reached V1 of V3.
scope_not:
- Not a processor or a general bus; it is a fixed register window behind the shared UART test shell (shell/rtl), whose framing
  the Designer did not write.
- The switches and the raw button levels have no debounce or synchronisation in the RTL; only the press events that update
  the counter are debounced.
- No decimal-point output, no per-digit brightness, and no scrolling or blanking of leading zeros on the display.
- Not verified on the board, and not measured for resources, timing, power, latency or throughput in a current build.
target:
  part: xc7a100tcsg324-1
  board: nexys_a7_100t
  tool: Vivado 2026.1
  top: t1_led_dimmer_counter
clocks:
- name: clk
  mhz: 100.0
  source: results/68_agent_docs/20261102-135505-a8f2/t1_dimmer_counter/design.xdc
resets:
- name: cpu_resetn
  active: low
  note: Pin C12. In t1_led_dimmer_counter.sv the registers of the top level use rst = ~cpu_resetn directly, so a reset asserts
    at once and releases without synchronisation to clk. Only the shell receives a two-flop synchronised release (shell_rst).
    The shared reset_sync.sv is listed in the build but not instantiated; the top level has its own inline copy.
interfaces:
- name: clk
  type: clock input
  note: Port clk, pin E3 in design.xdc, 10.00 ns period (100 MHz), LVCMOS33.
- name: cpu_resetn
  type: reset input
  note: Port cpu_resetn, pin C12; behaviour is described under resets.
- name: btn_up
  type: input
  note: BTNU, pin M18, active high; two flip-flop stage then debounce; increments the counter.
- name: btn_down
  type: input
  note: BTND, pin P18, active high; two flip-flop stage then debounce; decrements the counter.
- name: btn_center
  type: input
  note: BTNC, pin N17, active high; two flip-flop stage then debounce; clears the counter.
- name: switches
  type: input, 8 bits
  note: SW[7:0], pins J15, L16, M13, R15, R17, T18, U18, R13. Used unsynchronised as the brightness when CONTROL bit 0 is
    set, and read into INPUT_STATUS bits 7:0.
- name: leds
  type: output, 16 bits
  note: LED[15:0], pins H17, K15, J13, N14, R18, V17, U17, U16, V16, T15, U14, T16, V15, V14, V12, V11. Shows the counter
    when the PWM phase is on, otherwise all off.
- name: seg
  type: output, 7 bits
  note: Segments CA to CG on seg[0] to seg[6], active low, pins T10, R10, K16, K13, P15, T11, L18.
- name: dp
  type: output
  note: Pin H15, active low; held high (off) permanently.
- name: an
  type: output, 8 bits
  note: AN[7:0], active low, pins J17, J18, T9, J14, P14, T14, K2, U13. AN[3:0] show the counter nibbles (AN[0] least significant),
    AN[7] the high nibble and AN[6] the low nibble of the effective brightness, AN[5:4] always off.
- name: uart_rxd
  type: UART input
  note: Pin C4, 115200 baud 8-N-1 into the shared shell. Shell address bit 7 selects the register window, so a window register
    at offset N is addressed with that bit set plus N.
- name: uart_txd
  type: UART output
  note: Pin D4, 115200 baud 8-N-1 from the shared shell.
parameters:
- name: DEBOUNCE_CYCLES
  value: 1000000
  legal: Integer of 2 or more; the counter width is derived with $clog2. Other values were not simulated.
  note: 'Consecutive stable sys_clk cycles needed to accept a press or release, about 10 ms at 100 MHz (spec timing section).
    Spec timing: 1000000 sys_clk cycles of stable input, approximately 10 ms at 100 MHz.'
- name: PWM_PERIOD_CYCLES
  value: 4096
  legal: Integer of 2 or more; any value works in the RTL, a power of two is not required. Other values were not simulated.
  note: 'PWM period in sys_clk cycles, about 24.4 kHz at 100 MHz, chosen to avoid visible flicker (spec timing section).
    Spec timing: 4096 sys_clk cycles, approximately 24.4 kHz at 100 MHz. Spec timing: 4096 sys_clk cycles, approximately
    24.4 kHz at 100 MHz; selected to avoid visible flicker.'
- name: DISPLAY_DIGIT_CYCLES
  value: 100000
  legal: Integer of 2 or more. Other values were not simulated.
  note: 'Cycles per digit slot; eight slots per scan, about 1 ms per digit and 125 Hz refresh at 100 MHz (spec timing section).
    The interview answer asks for 131072 cycles instead; the RTL default is 100000. Spec timing: 100000 sys_clk cycles per
    digit, approximately 1 ms per digit and 125 Hz for an eight-digit scan.'
- name: UART_BAUD_DIVIDER_CYCLES
  value: 868
  legal: Integer of 2 or more, because the receiver samples at half a bit. Must match the host baud rate; only 868 was planned.
  note: 'Passed to the shell as CLKS_PER_BIT; 868 gives 115200 baud at 100 MHz, the nearest integer divider (spec timing
    section). The shell frame timeout is fixed at 100000 cycles in the top-level instance, not a parameter. Spec timing:
    115200 baud with UART_BAUD_DIVIDER_CYCLES=868, the nearest integer divider for a 100 MHz clock.'
