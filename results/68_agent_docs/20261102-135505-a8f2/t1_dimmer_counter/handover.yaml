schema: fda-handover/1
id: t1_dimmer_counter
title: T1 LED dimmer and push-button counter for the Nexys A7-100T
kind: agent-run
produced_by: agent
summary: 'A single-clock design for the Nexys A7-100T. A 16-bit counter is stepped by three debounced push-buttons (up,
  down, centre-clear) or set by a register write. The counter value is shown on the 16 LEDs gated by a PWM waveform, and
  as four hexadecimal digits on the seven-segment display, with the selected 8-bit brightness shown on the two leftmost
  digits. Brightness comes from a register or from the eight switches, chosen by CONTROL bit 0. A USB-UART test shell (the
  fpga_shell module) gives read and write access to an eight-register map: counter, brightness, control, input status, three
  press counts and a design ID. How far the run got: the specification, planning, RTL, constraints, synthesis, implementation,
  timing, power and DRC stages passed their gates, and the Verifier''s simulation reached V1 (E2, pass). Stage configuration-and-debug
  failed its gates (the bitstream did not run in that stage). The base and debug builds were made with an earlier Vivado
  release than 2026.1, so no current resource, timing or power figure exists.'
scope_not:
- 'It is not a verified hardware result: no current Vivado build, no passing bitstream gate and no on-board test is recorded.'
- It does not define UART framing or test-shell command syntax itself; that lives in the external fpga_shell module, whose
  source is not in this run's file list.
- It has one clock domain only (clk); there are no derived clocks and no clock-domain crossings other than the input synchronizers.
- It does not use block RAM or DSP blocks; the register storage is flip-flops.
- It does not drive the decimal point or the middle display digits AN[5:4]; both stay off.
target:
  part: xc7a100tcsg324-1
  board: nexys_a7_100t
  tool: Vivado 2026.1
  top: t1_led_dimmer_counter
clocks:
- name: clk
  mhz: 100.0
  source: results/68_agent_docs/20261102-135505-a8f2/t1_dimmer_counter/design.xdc
resets:
- name: cpu_resetn
  active: low
  note: 'Board CPU reset button. In rtl/t1_led_dimmer_counter.sv the counter, brightness, control, press counts, debouncers,
    PWM and display scan reset synchronously on clk from ~cpu_resetn (not synchronized, so assertion and release are sampled
    by clk). A two-flop synchronizer (async assert, synchronous release) drives only the shell reset. Reset values: COUNTER
    0, BRIGHTNESS 255, CONTROL 0, all press counts 0, display enabled.'
interfaces:
- name: clk
  type: clock input
  note: 100 MHz board oscillator; the XDC maps it to pin E3 and creates clock sys_clk_pin with a 10.00 ns period.
- name: cpu_resetn
  type: reset input
  note: Active-low CPU reset button, pin C12.
- name: btn_up, btn_down, btn_center
  type: push-button inputs
  note: BTNU, BTND and BTNC, assumed active high. Each passes a two-stage synchronizer and a stable-count debouncer before
    it counts as a press.
- name: switches
  type: slide-switch input, 8 bits
  note: SW[7:0]. They give the effective brightness when CONTROL bit 0 is set and are readable in INPUT_STATUS bits 7:0.
- name: leds
  type: LED output, 16 bits
  note: Counter bits gated by the PWM waveform; all off when the effective brightness is zero.
- name: seg, dp, an
  type: seven-segment display outputs (7, 1 and 8 bits)
  note: All active low. seg holds segments a to g, dp is held high (off), an selects one digit at a time. The XDC pins are
    the board ones.
- name: uart_rxd, uart_txd
  type: UART
  note: USB-UART into and out of the FPGA, pins C4 and D4. Both are connected to the fpga_shell instance; CLKS_PER_BIT is
    set from UART_BAUD_DIVIDER_CYCLES.
parameters:
- name: DEBOUNCE_CYCLES
  value: 1000000
  legal: positive integer count of clk cycles; only the built value was exercised
  note: Number of consecutive stable clk cycles before a button change is accepted (about 10 ms at 100 MHz). It also sets
    the debounce counter width.
- name: PWM_PERIOD_CYCLES
  value: 4096
  legal: positive integer count of clk cycles; only the built value was exercised
  note: Length of one PWM period in clk cycles. The on-time threshold is the brightness scaled to this period and rounded
    up; brightness 255 is always on and 0 always off.
- name: DISPLAY_DIGIT_CYCLES
  value: 100000
  legal: positive integer count of clk cycles; only the built value was exercised
  note: Time each of the eight digit slots stays active. The interview answer asked for 131072 instead; the RTL keeps 100000
    (see gaps).
- name: UART_BAUD_DIVIDER_CYCLES
  value: 868
  legal: positive integer; 868 gives 115200 baud from 100 MHz
  note: Passed to the shell as CLKS_PER_BIT. Change it only together with the clock frequency.
