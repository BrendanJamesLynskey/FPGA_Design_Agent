  text: 'throughput not measured: the run measured no throughput'
- about: clock_pin
  text: spec.yaml gives the clock board pin as W5; design.xdc, which was built, places clk on E3 (CLK100MHZ) with a 10.00
    ns period. Treat E3 as what the build uses and correct the spec.
- about: display_scan_period
  text: the interview answer asked for 2^17 (131072) clk cycles per digit, but spec.yaml, ARCHITECTURE.md and the RTL use
    DISPLAY_DIGIT_CYCLES = 100000. The RTL scans at 100000 cycles per digit; the spec disagrees with itself.
- about: press_count_width
  text: an interview answer asked for 8-bit press counts wrapping at 256, but spec.yaml and the RTL use 32-bit counts (up_count,
    down_count, center_count) wrapping modulo 2^32. The RTL is what was built.
- about: reset_style
  text: spec.yaml says asynchronous assertion with synchronized deassertion for all design state. In the RTL only the shell
    reset (shell_rst, from the two-flop reset_sync) has that style. The counter, registers, debouncers, PWM and display
    scan use a synchronous reset on rst = ~cpu_resetn, which is not synchronized, so releasing the button near a clk edge
    is unprotected for that logic. Constraints mark cpu_resetn as a false path, so timing analysis does not check it.
- about: io_timing_constraints
  text: design.xdc sets input and output delays but then declares false paths from every input and to every output, so static
    timing analysis does not check the board I/O paths.
- about: reset_values
  text: 'after reset: COUNTER 0, BRIGHTNESS 255 (0xFF), CONTROL 0 (switch brightness off, display enabled), all three press
    counts 0, win_rdata 0. DESIGN_ID always reads 1412514883 (0x54314443, ASCII T1DC).'
- about: unmapped_registers
  text: a read of any offset other than 0, 4, 8, 12, 16, 20, 24 or 28 returns 0. A write to an unmapped offset or to a read-only
    register (INPUT_STATUS, the press counts, DESIGN_ID) changes no register.
- about: write_blocks_buttons
  text: in the RTL any write strobe (win_wr), even to an unmapped or read-only offset, takes the priority branch and suppresses
    the button update of COUNTER in that cycle. Press counts still increment. A write to COUNTER wins over buttons as spec.yaml
    says; a write to another address also costs a coincident button step.
- about: button_priority
  text: when several buttons qualify in the same cycle, COUNTER follows centre first, then up, then down; the losing buttons
    still increment their own press counts. Presses are counted when the press is accepted (after DEBOUNCE_CYCLES stable
    cycles), not on release, and the counter changes in that same cycle.
- about: input_status_raw
  text: 'INPUT_STATUS reads bits 7:0 as the switches, bit 8 as btn_up, bit 9 as btn_down and bit 10 as btn_center, taken
    directly from the top-level pins: they are neither synchronized nor debounced. Upper bits read 0.'
- about: partial_writes
  text: 'writes use the low bits only: COUNTER takes bits 15:0, BRIGHTNESS bits 7:0, CONTROL bits 1:0. Higher write-data
    bits are ignored. Reads are zero-extended to 32 bits.'
- about: read_latency
  text: win_rdata is a register loaded in the cycle win_rd is high, so read data is valid the cycle after the read strobe.
    It holds its value until the next read, and is cleared by reset.
- about: brightness_display
  text: the seven-segment display and the LED PWM both use the effective brightness, so with CONTROL bit 0 set the two leftmost
    digits show the switch value, while BRIGHTNESS keeps its stored value. Digit AN[7] shows the high nibble and AN[6] the
    low nibble; AN[3:0] show the counter, AN[0] the lowest nibble.
- about: fpga_shell_source
  text: the RTL instantiates fpga_shell with TIMEOUT_CYCLES 100000 and BUILD_STAMP 0, but the shell source is not in this
    run's file list. UART framing and command syntax come from that module and were not reviewed here.
- about: assumption_buttons
  text: 'assumption carried from the spec: BTNU, BTND and BTNC are active high; 8-N-1 framing and the nearest integer baud
    divider are assumed; the register map is byte-addressed with 32-bit alignment.'
