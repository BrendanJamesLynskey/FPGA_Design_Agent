replan:
  - requirement: REQ-01
    method: formal
    replaced_by: simulation
    artefact: c14_bench.test_arith_random
    why: SymbiYosys is not installed here, so exactness of acc is checked by directed extremes and random cases against the model.
  - requirement: REQ-02
    method: formal
    replaced_by: simulation
    artefact: c14_bench.test_shift_sweep
    why: SymbiYosys is not installed here, so rounding for every shift 1..31 is swept in simulation with exact-half cases.
  - requirement: REQ-03
    method: formal
    replaced_by: simulation
    artefact: c14_bench.test_arith_b
    why: SymbiYosys is not installed here, so both clamp ends and relu are covered by directed simulation cases.
  - requirement: REQ-05
    method: formal
    replaced_by: simulation
    artefact: c14_bench.test_go_timing
    why: SymbiYosys is not installed here, so the GO-to-READY latency of at most 8 clocks is measured on LED0 in simulation.
  - requirement: REQ-06
    method: formal
    replaced_by: simulation
    artefact: c14_bench.test_reset
    why: SymbiYosys is not installed here, so reset clearing, including reset in mid-computation, is checked in simulation.
