<svg xmlns="http://www.w3.org/2000/svg" width="640" height="284" viewBox="0 0 640 284" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Architecture: blocks and interfaces"><rect width="640" height="284" fill="#fff"/><text x="8" y="16" font-weight="bold">Blocks (architecture.yaml)</text><rect x="8" y="26" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="43">c14_int8_dot_requant_top</text><text x="170" y="43">Board top; synchronises CPU_RESETN, instantiates fpga_shell and regist</text><rect x="8" y="60" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="77">fpga_shell</text><text x="170" y="77">Test shell, UART 115200 8N1 to register window.</text><rect x="8" y="94" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="111">dotq_regs</text><text x="170" y="111">Register map 0x00-0x0A, operand storage, GO one-clock pulse, result ho</text><rect x="8" y="128" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="145">dotq_core</text><text x="170" y="145">Pipelined 8-way int8 dot product plus bias, multiply by mult, round sh</text><rect x="8" y="162" width="150" height="26" fill="#fff" stroke="#000"/><text x="16" y="179">reset_sync</text><text x="170" y="179">Two-flop synchroniser for active-low CPU_RESETN into the CLK100MHZ dom</text><text x="8" y="206" font-weight="bold">Interfaces</text><text x="8" y="224">fpga_shell - dotq_regs: shell_window (simple)</text><text x="8" y="242">c14_int8_dot_requant_top - fpga_shell: uart (uart)</text><text x="8" y="260">dotq_regs - dotq_core: core_operands (simple)</text></svg>
