- about: latency_count
  text: Counted from dotq_regs.sv and dotq_core.sv, not measured. The GO write strobe registers into a one-cycle go pulse.
    go then passes through five valid stages (v1..v5) and the done register, and READY is set one cycle after done. READY
    is therefore high 8 clocks after the clock in which the shell's GO write strobe is high, exactly at the spec's limit
    of 8. READY rises only after y and acc are latched.
- about: reset_latency
  text: The spec says outputs clear within 2 cycles of CPU_RESETN asserting. In the RTL (shell/rtl/reset_sync.sv) rst asserts
    asynchronously, so registers clear at the first clock edge after assertion. Release takes two clock edges after the
    button is let go.
- about: spec_led_port
  text: spec.yaml names the output LED0. The RTL top port and the XDC use the bus LED[0] (pin H17), and LED0 is only an
    internal net. The RTL and XDC are what was built.
- about: spec_design_id
  text: spec.yaml lists DESIGN_ID as a parameter. In c14_int8_dot_requant_top.sv it is a localparam and cannot be overridden
    from outside. The top-level parameters are CLKS_PER_BIT, TIMEOUT_CYCLES and BUILD_STAMP, as REQ-10 says.
- about: reset_values
  text: 'On reset (dotq_regs.sv, dotq_core.sv): A_LO, A_HI, W_LO, W_HI, BIAS and MULT clear to 0, CTRL to shift 1 and relu
    0, READY to 0, and y, acc and the read-data register to 0. In-flight pipeline valid bits are also cleared.'
- about: unmapped_access
  text: Reads of 0x0B-0x7F and of GO (0x07) return 0. Writes to unmapped offsets and to Y, ACC and STATUS are ignored with
    no error status. Offsets are the shell window offsets; the shell reaches them with address bit 7 set.
- about: read_behaviour
  text: 'Reads have no side effects. Read data is registered and is due one cycle after win_rd. Y and ACC are gated at the
    read mux: they read 0 while READY is 0, although the core registers keep their last values internally.'
- about: partial_writes
  text: Writes are 32-bit only, with no byte enables. MULT stores bits [15:0] only, and CTRL stores only bits [4:0] (shift)
    and [8] (relu); the other bits are dropped and read back as 0.
- about: shift_range
  text: CTRL shift is stored as written with no range check. The spec contract is 1..31 and the benches do not test outside
    it. A shift of 0 is handled in dotq_core.sv by skipping the rounding constant, which is behaviour the spec does not
    define.
- about: go_priority
  text: 'A GO always restarts: while go is high, the core clears the in-flight valid bits and done, so earlier computations
    are abandoned. In dotq_regs.sv a GO write in the same cycle as done wins over the READY set and clears READY. A GO written
    in the cycle just before done rises can still leave READY set with the previous result. A UART frame is far too slow
    to hit this window, and no test is recorded for it.'
- about: operands_live
  text: The core samples act and wgt every clock and carries bias, mult, shift and relu stage by stage, so operand writes
    during a computation can corrupt it. The spec assumes this is not required to be safe.
- about: assumption_acc_range
  text: 'Assumption from the spec: acc never overflows 32 bits for tested inputs and weights are never -128. The RTL does
    not check either.'
