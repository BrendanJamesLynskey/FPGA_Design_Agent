schema: fda-handover/1
id: c14_int8_dot_requant
title: Int8 dot-product and requantise unit behind the UART test shell
kind: agent-run
produced_by: agent
summary: 'The design computes an 8-way signed int8 dot product plus a 32-bit bias, multiplies by a 16-bit unsigned multiplier,
  rounds and shifts right with round-half-up, and clamps to int8 with an optional ReLU. A host loads operands and reads
  Y, ACC and STATUS through the UART test shell on the Nexys A7-100T. The run stopped in stage rtl-design-creation: simulation
  reached V2 of V3 and the V3 cover-property gate failed. All 17 sampled mutants were killed. No current Vivado build or
  board result exists, so nothing past RTL has a current measurement.'
scope_not:
- Not a streaming or pipelined engine. One result per GO, and the host UART dominates the time.
- Operands are not captured at GO. The core reads the live operand registers, so writing them while a result is computed
  is unsafe.
- No overflow or wrap handling for acc, and no range check on shift. Both are out of contract for inputs outside the spec.
- Not verified on hardware, and not measured for timing, power or resources under the pinned Vivado release.
target:
  part: xc7a100tcsg324-1
  board: nexys_a7_100t
  tool: Vivado 2026.1
  top: c14_int8_dot_requant_top
clocks:
- name: CLK100MHZ
  mhz: 100.0
  source: results/68_agent_docs/20261107-005621-8deb/c14_int8_dot_requant/design.xdc
resets:
- name: CPU_RESETN
  active: low
  note: The reset_sync module (shell/rtl/reset_sync.sv) asserts the internal active-high rst asynchronously and releases
    it synchronously after two clock edges. All design registers use rst as a synchronous reset.
interfaces:
- name: CLK100MHZ
  type: clock input, pin E3, 100 MHz board oscillator
  note: Single clock domain for the shell and the arithmetic. design.xdc creates the 10 ns clock sys_clk_pin.
- name: CPU_RESETN
  type: reset input, pin C12, LVCMOS33
  note: Asynchronous button. design.xdc gives it an input delay and it is synchronised by reset_sync.
- name: UART_TXD_IN
  type: UART data into the FPGA, pin C4, LVCMOS33
  note: 8N1 at 115200 baud, synchronised inside the shell. Protocol in shell/PROTOCOL.md.
  doc: shell/PROTOCOL.md
- name: UART_RXD_OUT
  type: UART data out of the FPGA, pin D4, LVCMOS33
  note: Shell response line, driven by the shell's registered transmitter.
  doc: shell/PROTOCOL.md
- name: LED0
  type: output, pin H17, LVCMOS33
  note: Shows the READY flag. In the RTL the top-level port is the one-bit bus LED[0:0], and LED0 is an internal net (c14_int8_dot_requant_top.sv,
    design.xdc).
parameters:
- name: CLKS_PER_BIT
  value: 868
  legal: Positive integer, large enough that half a bit period is non-zero. 868 is the only value that gives 115200 baud
    at 100 MHz.
  note: Clock cycles per UART bit. It is passed to the shell receiver and transmitter, and the spec gives uart_bit_cycles
    as 868.
- name: TIMEOUT_CYCLES
  value: 100000000
  legal: Positive integer number of CLK100MHZ cycles.
  note: Shell frame timeout in clock cycles. The top overrides the shell default with this value. A partly received frame
    older than this is dropped without a response.
- name: BUILD_STAMP
  value: 0
  legal: Any 32-bit value.
  note: Top-level parameter, default 0, read back at shell register 0x02. The flow overrides it per build.
- name: DESIGN_ID
  value: DOTQ
  legal: Fixed. It is a localparam, 32'h444F5451, not an overridable parameter.
  note: Read back at shell register 0x00 as ASCII D,O,T,Q.
