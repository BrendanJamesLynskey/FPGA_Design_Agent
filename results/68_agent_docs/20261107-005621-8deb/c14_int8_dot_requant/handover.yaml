- about: led_port_name
  text: spec.yaml names the output port LED0 with width 1. The RTL and design.xdc (pin H17) use the one-bit bus LED[0] (top
    port LED, declared [0:0]), and an internal signal LED0 is assigned to it. The spec disagrees with what was built. The
    RTL and XDC are authoritative.
- about: design_id_parameter
  text: spec.yaml lists DESIGN_ID as a parameter. In c14_int8_dot_requant_top.sv it is a localparam of 32'h444F5451 and
    cannot be overridden. Only CLKS_PER_BIT, TIMEOUT_CYCLES and BUILD_STAMP are top-level parameters, which matches REQ-10.
- about: reset_sync_source
  text: rtl/reset_sync.sv in this design is an intentionally empty file with a comment. The reset synchroniser actually
    used is shell/rtl/reset_sync.sv, which this run did not review. ARCHITECTURE.md calls it a 2-flop synchroniser, but
    the RTL here does not show it. The spec's promise that outputs clear within 2 cycles of CPU_RESETN asserting was not
    measured.
- about: reset_values
  text: After reset every operand register, bias and mult read 0, CTRL reads 1 (shift 1, relu 0), READY and the GO pulse
    are 0, and the core's y and acc registers are 0. The reset is synchronous and active high inside the design. The pipeline
    data registers in dotq_core (products, sums, and so on) are not reset, only the valid bits.
- about: unmapped_and_ro_access
  text: In dotq_regs.sv a read of any offset without a case arm returns 0. This covers 0x07 (GO), 0x0B and above, and the
    unused offsets. A write to an unmapped offset or to an RO register (Y, ACC, STATUS) is ignored by the default arm. This
    matches the spec.
- about: partial_writes_and_bit_masks
  text: Writes are whole 32-bit words with no byte strobes. MULT keeps only wdata[15:0]. CTRL keeps wdata[4:0] as shift
    and wdata[8] as relu and drops the other bits, which read back 0. Reads of MULT bits [31:16] return 0. The write data
    of a GO write is ignored. The shift field is not range-checked, so shift 0 can be stored. With shift 0 the core adds
    no rounding term and passes acc*mult through. Shift 0 is out of contract and untested.
- about: read_side_effects
  text: Reads have no side effects. The read-data register changes only on a shell read strobe and otherwise holds its value.
    Y and ACC read 0 while READY is 0 because the read is gated by ready in dotq_regs.sv. The core's own y and acc registers
    are not cleared by GO. They are overwritten when the next result is valid.
- about: go_priority_and_restart
  text: A GO write clears READY and is registered into a one-cycle go pulse to the core. If READY is being set by done in
    the same cycle as the GO write, the GO write wins and READY is 0. Inside the core a go pulse clears the valid bits of
    results in flight, so a GO while a computation is running restarts it with the loaded operands. A GO is also accepted
    when READY is already set.
- about: go_done_race
  text: Reading dotq_regs.sv and dotq_core.sv, a done pulse can reach dotq_regs in the same cycle as the registered go pulse,
    if a GO write lands one cycle before done. READY would then be set again, with the old y and acc, until the new done
    arrives. The run did not test or simulate this case. It could break the spec's rule that READY is set only when y and
    acc are valid for the latest GO. The shell's UART access time makes it unlikely in practice.
- about: latency_structure
  text: READY follows the registered go pulse through a fixed chain of valid bits in dotq_core (one per pipeline stage),
    then a registered done, then the READY flag. The spec promises READY within 8 clocks of GO. The run did not measure
    this, and it is not counted from the shell write strobe, which adds one clock for the registered go pulse. Only the
    Verifier's benches check the promise, and verification did not reach V3.
- about: operand_sampling
  text: The core samples the operand registers every clock and carries mult, shift, relu and bias with the data through
    the pipeline. An operand write during the computation may be mixed into a result in flight or ignored. The spec does
    not require it to be safe and the run did not test it.
- about: assumptions
  text: Assumptions from the interview, kept as made. The clock is the 100 MHz board oscillator, so CLKS_PER_BIT is 868.
    Weights are never -128, though the design should still compute them correctly. acc never overflows 32 bits for the inputs
    tested. Operand writes during a computation need not be safe. Shift outside 1..31 is out of contract. TIMEOUT_CYCLES
    and BUILD_STAMP defaults and the DOTQ ID presentation were defaulted by the oracle, not decided by a user.
next_steps:
- Open build/review/02_rtl-design-creation.html and the verif_gates record. Make the five unhit cover properties (C_led_fall,
  C_led_high, C_led_rise, C_rx_start, C_tx_start) hit. Either extend the Verifier's benches so the shell traffic and a READY
  rise and fall drive them, or correct the V_COVER expressions if they can never be true. Then re-run the simulation tests
  until V3 passes.
- Write or run a directed test for the go_done_race gap (a GO write one cycle before done) and fix dotq_regs.sv or dotq_core.sv
  if READY is set with stale results.
- Review shell/rtl/reset_sync.sv, since the design's own reset_sync.sv is empty, and confirm the clear-within-2-cycles claim.
  Decide whether the spec should name the LED port LED[0] and DESIGN_ID as a localparam.
- Run python -m flow.handover fresh, then resume the flow so the constraints, synthesis, implementation, timing, power and
  DRC stages run with Vivado 2026.1. This replaces the earlier-release base build.
- Measure latency from the GO write to READY, plus resources, timing and power, from a current build. Check REQ-11 against
  the post-route setup gate.
- Do hardware bring-up over the UART to produce the pending evidence for REQ-04, REQ-06, REQ-07, REQ-08 and REQ-09.
open_questions:
- Should the spec keep the port name LED0, or adopt the built LED[0] bus, given the master XDC?
- Is the go_done_race case acceptable as is, because UART access is slow, or must READY be strictly tied to the latest GO?
- Should an out-of-contract shift value (0, or a value above the legal range) be rejected, ignored or left undefined?
