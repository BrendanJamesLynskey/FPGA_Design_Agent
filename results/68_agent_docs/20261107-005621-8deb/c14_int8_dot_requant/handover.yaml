schema: fda-handover/1
id: c14_int8_dot_requant
title: Quantised-layer int8 dot-product and requantise unit behind the UART test shell
kind: agent-run
produced_by: agent
summary: 'The design computes an eight-way signed int8 dot product plus a 32-bit bias. It multiplies the sum by a 16-bit
  unsigned multiplier, rounds and shifts right by a programmable amount, and clamps the result to a signed byte (0..127
  when relu is set). Operands, results and a READY flag are reached over the UART test shell on the Nexys A7-100T, and LED0
  shows READY. The run reached RTL, benches and mutation testing: verification reached V2 of V3, the cover-property gate
  at V3 failed, and no stage from constraints onward ran. The only build was made under an earlier Vivado release and no
  figure from it is published. The specification and architecture were approved automatically, with no human review.'
scope_not:
- Not a general matrix or layer engine. It computes one eight-element dot product per GO, and the shell UART access dominates
  throughput.
- No overflow handling. acc is a plain 32-bit sum that wraps, and a shift outside 1..31 is out of contract.
- Not safe against operand writes while a computation is in flight. The core samples the operand registers every cycle and
  does not latch them at GO.
- Not hardware-verified. No bring-up or board result is recorded.
- Not timing-, resource- or power-measured on the pinned Vivado release.
target:
  part: xc7a100tcsg324-1
  board: nexys_a7_100t
  tool: Vivado 2026.1
  top: c14_int8_dot_requant_top
clocks:
- name: CLK100MHZ
  mhz: 100.0
  source: results/68_agent_docs/20261107-005621-8deb/c14_int8_dot_requant/design.xdc
resets:
- name: CPU_RESETN
  active: low
  note: Board button (C12). The shell reset_sync (shell/rtl/reset_sync.sv) asserts it asynchronously and releases it synchronously
    to the internal active-high rst. dotq_regs, dotq_core and the shell flops use synchronous reset. The spec calls the
    reset "synchronised"; the RTL does this only on release.
interfaces:
- name: CLK100MHZ
  type: clock input, 100 MHz oscillator, pin E3
  note: Single clock domain for shell and arithmetic; no MMCM or PLL (design.xdc creates sys_clk_pin with a period of 10.00
    ns).
- name: UART_TXD_IN
  type: UART serial input, 115200 baud 8N1, pin C4
  doc: shell/PROTOCOL.md
  note: Host-to-FPGA data. It is asynchronous and is synchronised inside the shell, and design.xdc gives it a 2.0 ns maximum
    input delay.
- name: UART_RXD_OUT
  type: UART serial output, 115200 baud 8N1, pin D4
  doc: shell/PROTOCOL.md
  note: FPGA-to-host data. The register offsets in this handover are the shell window offsets; the host addresses them with
    address bit 7 set.
- name: LED0
  type: status LED output, pin H17
  note: Shows the READY flag. The RTL top port is the bus LED[0:0] (design.xdc names LED[0]), not a port called LED0; LED0
    is an internal alias.
registers:
- offset: '0x00'
  name: A_LO
  access: RW
  reset: '0x00000000'
  bits: '[31:0] activations 0..3, a_i in bits [8i+7:8i]'
- offset: '0x01'
  name: A_HI
  access: RW
  reset: '0x00000000'
  bits: '[31:0] activations 4..7, a_(4+i) in bits [8i+7:8i]'
- offset: '0x02'
  name: W_LO
  access: RW
  reset: '0x00000000'
  bits: '[31:0] weights 0..3, same packing'
- offset: '0x03'
  name: W_HI
  access: RW
  reset: '0x00000000'
  bits: '[31:0] weights 4..7, same packing'
- offset: '0x04'
  name: BIAS
  access: RW
  reset: '0x00000000'
  bits: '[31:0] signed bias'
- offset: '0x05'
  name: MULT
  access: RW
  reset: '0x00000000'
  bits: '[15:0] unsigned multiplier; [31:16] read 0'
- offset: '0x06'
  name: CTRL
  access: RW
  reset: '0x00000001'
  bits: '[4:0] shift (1..31), [8] relu; other bits read 0'
- offset: '0x07'
  name: GO
  access: WO
  reset: '0x00000000'
  bits: any write starts one computation; reads 0
- offset: '0x08'
  name: Y
  access: RO
  reset: '0x00000000'
  bits: '[7:0] limited answer (two''s complement); [31:8] read 0'
- offset: '0x09'
  name: ACC
  access: RO
  reset: '0x00000000'
  bits: '[31:0] the signed accumulator including the bias'
- offset: '0x0A'
  name: STATUS
  access: RO
  reset: '0x00000000'
  bits: '[0] READY; other bits 0'
parameters:
- name: CLKS_PER_BIT
  value: 868
  legal: Positive integer. 868 gives 115200 baud at the 100 MHz clock; any other value changes the baud rate.
  note: The spec gives 868 clocks per UART bit. The benches ran at 8, so the spec value was not simulated.
- name: TIMEOUT_CYCLES
  value: 100000000
  legal: Positive integer, the shell frame-gap timeout in clocks.
  note: Spec default, defaulted by the interview oracle. It is much longer than the shell's own default. The benches ran
    at 2000, so the spec value was not simulated.
- name: BUILD_STAMP
  value: 0
  legal: Any 32-bit value.
  note: The flow overrides the default of 0. The benches ran at 464367618, so the spec value was not simulated.
- name: DESIGN_ID
  value: DOTQ
  legal: Fixed at 32'h444F5451 (ASCII D,O,T,Q); not changeable from outside.
  note: The spec lists it as a parameter, but in c14_int8_dot_requant_top.sv it is a localparam passed to the shell.
