# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: c14_int8_dot_requant
title: Int8 dot-product and requantise unit behind the UART test shell (Nexys A7-100T)
kind: agent-run
produced_by: agent
summary: 'The design takes eight signed 8-bit activations and eight signed 8-bit weights, a signed 32-bit bias, an unsigned
  16-bit multiplier, a 5-bit shift and a relu bit, all loaded through registers. A write to GO runs a pipelined computation:
  acc is the sum of the eight products plus bias, the scaled value is acc times mult divided by two to the power shift (rounded
  to nearest, exact halves towards plus infinity), and y is that value clamped to -128..127, or to 0..127 when relu is set.
  The registers are reached through the UART test shell at 115200 baud (shell/PROTOCOL.md version 1.0). LED0 shows the READY
  flag. The design uses one clock, CLK100MHZ, and a synchronous reset derived from CPU_RESETN. The run got as far as RTL
  and the first verification stages. The Clarifier''s specification was signed off and board and device planning passed.
  The RTL stage did not pass its gates. Simulation evidence reached V2 but the run asked for V3, and five cover properties
  were never hit. The run stopped because stage 2 had been visited too often. Constraints, synthesis, implementation, timing,
  power, DRC and bring-up were not run. The only Vivado build (stages rtl and post_synth) used an earlier release than 2026.1.
  The design has no measured resources, timing, power or latency.'
scope_not:
- Not a general matrix or convolution engine. It computes one eight-element dot product per GO and nothing else.
- Not safe against operand writes while a result is being computed. The run assumed this is not required.
- Not defined for shift outside 1..31, for weights of -128, or for an acc that overflows 32 bits. None of these is tested.
- Not a clock-domain-crossing design. There is a single clock, and no MMCM or PLL is used.
- Not proven on hardware. No bring-up result exists.
target:
  part: xc7a100tcsg324-1
  board: nexys_a7_100t
  tool: Vivado 2026.1
  top: c14_int8_dot_requant_top
clocks:
- name: CLK100MHZ
  mhz: 100.0
  source: results/68_agent_docs/20261107-005621-8deb/c14_int8_dot_requant/design.xdc
resets:
- name: CPU_RESETN
  active: low
  note: Board CPU reset button (pin C12), asynchronous. It goes through reset_sync into an active-high synchronous reset
    used by the shell, the register block and the core. The reset clears the operand registers, bias, mult, the READY flag,
    the GO pulse, the core's y, acc and done, and the read-data register. CTRL resets to shift 1 and relu 0. The core's
    pipeline data registers are not reset, only its valid bits. rtl/reset_sync.sv in this design is an intentionally empty
    file, and the design uses shell/rtl/reset_sync.sv instead, which was not reviewed in this run.
interfaces:
- name: CLK100MHZ
  type: clock input, 100 MHz board oscillator (pin E3)
  note: Single clock domain for the shell and the arithmetic. The XDC creates clock sys_clk_pin with a 10 ns period.
- name: UART_TXD_IN
  type: serial input, host to FPGA (pin C4)
  doc: shell/PROTOCOL.md
  note: USB-UART at 115200 baud, 8N1. Asynchronous, synchronised inside the shell. design.xdc gives it a nominal input delay
    only so that it has a defined arrival time.
- name: UART_RXD_OUT
  type: serial output, FPGA to host (pin D4)
  doc: shell/PROTOCOL.md
  note: USB-UART transmit side of the shell. design.xdc gives it a nominal output delay.
- name: LED0
  type: LED output (pin H17), the READY flag
  note: In the RTL and XDC the port is the one-bit bus LED[0] (top port LED, declared [0:0]), not a scalar named LED0. The
    spec names it LED0.
parameters:
- name: CLKS_PER_BIT
  value: 868
  legal: Positive integer equal to the clock frequency divided by the baud rate. 868 gives 115200 baud at 100 MHz. Any other
    value changes the baud rate.
  note: Passed to the shell. Top-level parameter.
- name: TIMEOUT_CYCLES
  value: 100000000
  legal: Positive integer number of CLK100MHZ cycles. It is the shell's timeout; see shell/PROTOCOL.md for its meaning.
  note: Passed to the shell. Top-level parameter. The default is an assumption made in the interview (status defaulted).
- name: BUILD_STAMP
  value: 0
  legal: Any 32-bit value.
  note: Top-level parameter passed to the shell. The default is 0 and the flow overrides it per build.
- name: DESIGN_ID
  value: DOTQ
  legal: Fixed. It is the 32-bit value 0x444F5451 (ASCII D,O,T,Q) and cannot be changed from outside.
  note: In the RTL this is a localparam in the top module, not a top-level parameter. It is passed to the shell, which supplies
    it through its ID mechanism.
