# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: t1_dimmer_counter
title: T1 LED dimmer and push-button counter for the Nexys A7-100T
kind: agent-run
produced_by: agent
summary: The design drives 16 LEDs with a 16-bit up/down counter gated by 8-bit PWM brightness, and shows the counter and
  the active brightness on the eight-digit seven-segment display. Three debounced buttons change the counter (up, down,
  centre clear) and keep their own 32-bit press counts. Registers are reachable over the repository test shell on the USB-UART,
  which gives access to the counter, brightness, control, button and switch state, and press counts. The run reached a bitstream
  under an earlier Vivado release than the pinned one, so that build is not current. Verification reached V1 of V3, the
  configuration-and-debug stage did not pass, and nothing has been run on a board.
scope_not:
- not a general-purpose UART core; the serial link exists only for the repository test shell protocol
- no auto-repeat on a held button; each debounced rising edge counts once
- no decimal-point or AN5/AN4 output; the decimal point stays off and AN5 and AN4 show nothing
- not board-tested, and no ILA debug build was attempted or recorded
target:
  part: xc7a100tcsg324-1
  board: nexys_a7_100t
  tool: Vivado 2026.1
  top: t1_led_dimmer_counter
clocks:
- name: clk
  mhz: 100.0
  source: results/68_agent_docs/20261102-114228-5a32/t1_dimmer_counter/design.xdc
resets:
- name: cpu_reset_n
  active: low
  note: In rtl/t1_led_dimmer_counter.sv it asserts asynchronously and releases through two flops on clk. The resulting internal
    active-high reset is synchronous and also resets the shell. Every register in the register map resets to its listed
    value, leds to 0, and segments_n and digit_enable_n to all ones (display dark) until the first clock after release.
interfaces:
- name: clk
  type: clock input
  note: Pin E3, LVCMOS33, 10.00 ns period in design.xdc.
- name: cpu_reset_n
  type: reset input
  note: Pin C12, active-low push-button. design.xdc sets input delays and a false path from it.
- name: button_up
  type: input, 1 bit
  note: Pin M18, active high. Two-flop synchroniser, then debounce.
- name: button_down
  type: input, 1 bit
  note: Pin P18, active high. Two-flop synchroniser, then debounce.
- name: button_center
  type: input, 1 bit
  note: Pin N17, active high. Two-flop synchroniser, then debounce.
- name: switches
  type: input, 8 bits
  note: SW0..SW7 on J15, L16, M13, R15, R17, T18, U18, R13. Passed through a single register stage in the RTL.
- name: uart_rx
  type: input, 1 bit
  note: Pin C4 (UART_TXD_IN) in design.xdc, to the shell receiver at UART_BAUD_DIVIDER clocks per bit.
- name: uart_tx
  type: output, 1 bit
  note: Pin D4 (UART_RXD_OUT) in design.xdc, from the shell transmitter. Registered output, idle high.
- name: leds
  type: output, 16 bits
  note: LD0..LD15 on H17, K15, J13, N14, R18, V17, U17, U16, V16, T15, U14, T16, V15, V14, V12, V11, active high. Registered.
- name: segments_n
  type: output, 8 bits
  note: Active low and registered. Bit 0 is CA (T10) through bit 6 CG (L18), bit 7 is DP (H15). The glyph table in the RTL
    uses the same order, with bit 0 as segment a.
- name: digit_enable_n
  type: output, 8 bits
  note: Bit n drives AN[n] (J17, J18, T9, J14, P14, T14, K2, U13), active low. AN3..AN0 show the counter with the most significant
    nibble at AN3, AN7 and AN6 show the active brightness with the high nibble at AN7, and AN5 and AN4 are enabled with
    all segments off.
registers:
- offset: 0
  name: DESIGN_ID
  access: R
  reset: 1412514883
  bits: 31:0, ASCII T1DC
- offset: 4
  name: COUNTER
  access: RW
  reset: 0
  bits: '15:0'
- offset: 8
  name: BRIGHTNESS
  access: RW
  reset: 0
  bits: '7:0'
- offset: 12
  name: CONTROL
  access: RW
  reset: 0
  bits: bit 0 selects switch brightness; bit 1 disables seven-segment display; other bits reserved
- offset: 16
  name: BUTTON_STATE
  access: R
  reset: 0
  bits: bit 0 up, bit 1 down, bit 2 centre; debounced levels
- offset: 20
  name: SWITCH_STATE
  access: R
  reset: 0
  bits: bits 7:0 are SW7:SW0
- offset: 24
  name: UP_PRESS_COUNT
  access: R
  reset: 0
  bits: '31:0'
- offset: 28
  name: DOWN_PRESS_COUNT
  access: R
  reset: 0
  bits: '31:0'
- offset: 32
  name: CENTRE_PRESS_COUNT
  access: R
  reset: 0
  bits: '31:0'
parameters:
- name: DEBOUNCE_CYCLES
  value: 1000000
  legal: integer of 1 or more; 0 or 1 removes the qualification delay
  note: 'Spec rate: approximately 10 ms at 100 MHz. The benches simulate it at 4, so the spec''s value was not simulated.
    Spec timing: DEBOUNCE_CYCLES = 1,000,000 cycles, approximately 10 ms at 100 MHz.'
- name: PWM_PERIOD_CYCLES
  value: 256
  legal: integer of 2 or more; only 256 uses the direct brightness-to-phase compare, other values use a scaled threshold
  note: 'Spec rate: approximately 390.625 kHz at 100 MHz, above visible flicker. The benches simulate it at 16, so the spec''s
    value was not simulated. Spec timing: PWM_PERIOD_CYCLES = 256 cycles, approximately 390.625 kHz at 100 MHz; this is
    above visible flicker rates.'
- name: DISPLAY_SCAN_CYCLES
  value: 100000
  legal: integer of 1 or more
  note: 'Spec rate: 100,000 cycles per digit, approximately 125 Hz full-frame refresh for eight digits at 100 MHz. The benches
    simulate it at 3, so the spec''s value was not simulated. Spec timing: DISPLAY_SCAN_CYCLES = 100,000 cycles per digit
    selection, approximately 125 Hz full-frame refresh for eight digits at 100 MHz.'
- name: UART_BAUD_DIVIDER
  value: 868
  legal: integer of 2 or more, because the receiver samples at half a bit
  note: 'Spec rate: 868 clk cycles per bit, approximately 115207 baud at 100 MHz. The benches simulate it at 8, so the spec''s
    value was not simulated. Spec timing: UART_BAUD_DIVIDER = 868 clk cycles per bit, approximately 115207 baud at 100 MHz,
    close to 115200 baud.'
