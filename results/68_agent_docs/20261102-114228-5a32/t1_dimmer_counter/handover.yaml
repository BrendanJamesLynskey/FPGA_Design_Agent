# Brief 68 handover: the facts behind README.md and AGENT.md (docs/documentation_standard.md).
# Measurement values and every sha256 are filled from the records by `python -m flow.handover fill`;
# do not type them. Render with `python -m flow.handover write <this directory>`.
schema: fda-handover/1
id: t1_dimmer_counter
title: T1 LED dimmer and push-button counter for the Nexys A7-100T
kind: agent-run
produced_by: agent
summary: A single-clock design for the Nexys A7-100T. A 16-bit up/down counter is driven by three debounced push-buttons
  (up, down, centre-clear) and can also be read and written over the USB-UART through the repository fpga_shell register
  window. The counter value is shown on the 16 LEDs, gated by an 8-bit linear PWM brightness. Brightness comes either from
  a UART-written register or from the eight switches, chosen by a control bit. The counter and the active brightness are
  also shown on the eight-digit seven-segment display. The run produced RTL, constraints, a reference model and simulation
  tests, and the Vivado base build ran through bitstream with an earlier Vivado release than the pinned 2026.1. The timing-closure
  and configuration-and-debug stages did not pass their gates, so the design is not signed off on hardware or on current
  timing.
scope_not:
- not a general UART bridge; the UART framing and command syntax belong to the repository's fpga_shell, which this design
  only instantiates
- not a multi-clock design; every function runs from the single 100 MHz clk with clock-enable style counters and no derived
  clocks
- not a design with measured resources, timing or power; no current Vivado build is recorded
- no register read side effects, no interrupts and no hold-to-repeat on the buttons
target:
  part: xc7a100tcsg324-1
  board: nexys_a7_100t
  tool: Vivado 2026.1
  top: t1_led_dimmer_counter
clocks:
- name: clk
  mhz: 100.0
  source: results/68_agent_docs/20261102-114228-5a32/t1_dimmer_counter/design.xdc
resets:
- name: cpu_reset_n
  active: low
  note: 'Pin C12, red CPU reset button. design: rtl/t1_led_dimmer_counter.sv asserts it asynchronously and releases it synchronously
    through a two-flop chain on clk. It clears the counter, brightness, control, the three press counts, the button and
    switch synchronizers, debounce state, PWM and display scan state, the registered LED and display outputs, and the register
    read data; the fpga_shell receives the same internal reset. Reset values are listed in the gaps.'
interfaces:
- name: clk
  type: clock input
  note: Pin E3, 100 MHz board oscillator, constrained with a 10.00 ns period in design.xdc.
- name: button_up
  type: input, active high
  note: Pin M18. Two-flop synchronizer, then debounce; one event per debounced rising edge increments the counter.
- name: button_down
  type: input, active high
  note: Pin P18. Same path as button_up; one event decrements the counter.
- name: button_center
  type: input, active high
  note: Pin N17. Same path as button_up; one event clears the counter and has priority over up and down.
- name: switches
  type: input, 8 bits
  note: SW0 to SW7 on J15, L16, M13, R15, R17, T18, U18, R13. Sampled through one register stage; they set the active brightness
    when CONTROL bit 0 is set and are readable at SWITCH_STATE.
- name: uart_rx
  type: UART input
  note: Pin C4 per design.xdc (the board's USB-UART TX to FPGA). Handled by fpga_shell.
- name: uart_tx
  type: UART output
  note: Pin D4 per design.xdc (FPGA to the board's USB-UART RX). Handled by fpga_shell.
  doc: results/68_agent_docs/20261102-114228-5a32/t1_dimmer_counter/ARCHITECTURE.md
- name: leds
  type: output, 16 bits, active high
  note: LD0 to LD15. The counter value gated by PWM, registered once before the pins.
- name: segments_n
  type: output, 8 bits, active low
  note: Segments CA to CG and DP. In the RTL the DP bit is always off.
- name: digit_enable_n
  type: output, 8 bits, active low
  note: AN0 to AN7. AN3 to AN0 show the counter, AN7 and AN6 show active brightness, AN5 and AN4 are blank. CONTROL bit
    1 blanks all.
parameters:
- name: DEBOUNCE_CYCLES
  value: 1000000
  legal: positive integer clock-cycle count; the RTL treats a value of one or less as immediate acceptance
  note: A button level change is accepted only after the new level has been stable this many clk cycles, about 10 ms at
    100 MHz.
- name: PWM_PERIOD_CYCLES
  value: 256
  legal: positive integer; the exact linear compare is used only at the default 256, other values use a scaled compare,
    and only the default has been described by the spec
  note: PWM period in clk cycles, about 390.625 kHz at 100 MHz. Brightness 0 is off and 255 is always on.
- name: DISPLAY_SCAN_CYCLES
  value: 100000
  legal: positive integer clock-cycle count per digit
  note: Cycles each digit stays selected; a full eight-digit frame takes eight times this value.
- name: UART_BAUD_DIVIDER
  value: 868
  legal: positive integer; passed to fpga_shell as CLKS_PER_BIT
  note: Clock cycles per UART bit, about 115207 baud at 100 MHz, close to 115200 baud.
