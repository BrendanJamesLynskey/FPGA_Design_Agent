  text: 'timing not measured: no current Vivado build of this design has been recorded'
- about: power
  text: 'power not measured: no current Vivado build of this design has been recorded'
- about: latency
  text: 'latency not measured: the run measured no latency; the spec''s latency promise is checked only by the benches'
- about: throughput
  text: 'throughput not measured: the run measured no throughput'
- about: uart_pins
  text: design.xdc puts uart_rx on C4 and uart_tx on D4, which matches spec.yaml. The pin table in ARCHITECTURE.md has them
    the other way round (uart_rx D4, uart_tx C4). design.xdc is what was built; ARCHITECTURE.md disagrees.
- about: reset_values
  text: rtl/t1_led_dimmer_counter.sv resets BRIGHTNESS and CONTROL to zero, which matches the register map in spec.yaml.
    An answer recorded in spec.yaml (resolved_questions) says brightness resets to 0x40 and CTRL to 0x2 with the display
    enabled; the RTL does not do this. With CONTROL zero the switch source is off and the display is enabled (bit 1 set
    would blank it). The RTL is what was built; the spec disagrees with itself.
- about: pwm_period
  text: The RTL runs the PWM phase counter once per clk cycle with a period of PWM_PERIOD_CYCLES (256), about 390.625 kHz,
    as the timing section of spec.yaml says. A recorded answer in spec.yaml describes a prescale giving 1024 cycles and
    about 97.7 kHz; the RTL has no prescale, so that answer disagrees with what was built.
- about: register_reads
  text: Reads of any offset other than 0x00, 0x04, 0x08, 0x0C, 0x10, 0x14, 0x18, 0x1C and 0x20 return zero. Reads have no
    side effects. The read data register updates on the cycle after win_rd, so the value is registered one cycle late and
    is cleared by reset.
- about: register_writes
  text: Writes to unmapped offsets and to read-only registers (DESIGN_ID, BUTTON_STATE, SWITCH_STATE and the three press
    counts) are silently ignored. COUNTER takes the low 16 bits and BRIGHTNESS the low 8 bits of the write data; the upper
    bits are dropped. CONTROL stores all 32 bits and reads them back, although only bits 0 and 1 have any effect; the other
    bits are reserved but writable. There are no byte enables, so there are no partial writes.
- about: counter_priorities
  text: A UART write to COUNTER in the same cycle as a button event wins over the event; the press counts still increment.
    Among button events, centre clear wins over up and down, and simultaneous up and down cancel. A held button gives one
    event only, and an event is produced when the debounce interval ends, on a rising edge only; releasing a button changes
    the debounced level but gives no event.
- about: brightness_source
  text: With CONTROL bit 0 set, the switches set the active brightness and the display shows that value; the stored BRIGHTNESS
    register is not overwritten and stays readable and writable. The recorded answer on whether UART writes are kept in
    switch mode is not firm, but the RTL keeps them.
- about: synchronizers
  text: The three buttons pass through two flops; the eight switches pass through one register stage only, which is weaker
    than the buttons. This is an assumption of the Designer that switch changes are slow.
- about: display_details
  text: Digit 0 to 3 are AN0 to AN3 showing counter nibbles, least significant at AN0. AN7 shows the high nibble of active
    brightness and AN6 the low nibble. AN5 and AN4 are enabled but have all segments off. The DP segment is always off.
    LED and display outputs are registered, so they lag the internal state by one clock cycle.
- about: input_timing
  text: design.xdc applies set_false_path from all the asynchronous inputs (reset, buttons, switches, uart_rx), so setup
    and hold on those paths are not analysed; the input delay lines document the board budget only.
- about: unchecked_hardware
  text: No evidence entry records a run on the board, so button, UART, LED and display behaviour on hardware is unverified.
next_steps:
- Rebuild the base build with Vivado 2026.1 (flow/run_vivado.sh in the commands list) and read build/base/gates.json; this
  clears gap E3 and shows why the bitstream stage did not run.
- Read the review pages of timing-closure and configuration-and-debug, fix the failure that stopped the bitstream, and rerun
  those stages.
- Decide the reset values for BRIGHTNESS and CONTROL (the RTL uses zero, a recorded answer says 0x40 and 0x2), then update
  spec.yaml or the RTL and the model and tests to agree.
- Decide the PWM period (256 cycles as built, or the prescaled period in the recorded answer) and make spec.yaml, the model
  and the RTL consistent.
- Correct the UART pin table in ARCHITECTURE.md to match design.xdc, then record resources, timing and power from the current
  build.
- Test on the board over the UART at 115200 baud, including the buttons, switch brightness mode and the display.
open_questions:
- Should BRIGHTNESS reset to 0x40 and CONTROL to 0x2 as one recorded answer says, or to zero as built?
- Should the PWM have a prescale (a period of 1024 clock cycles) or stay at 256 cycles as built?
- Should the switches get a second synchronizer stage like the buttons?
- Should writes to the reserved bits of CONTROL be stored, as built, or dropped?
