  text: 'power not measured: no current Vivado build of this design has been recorded'
- about: latency
  text: 'latency not measured: the run measured no latency; the spec''s latency promise is checked only by the benches'
- about: throughput
  text: 'throughput not measured: the run measured no throughput'
- about: uart_pins
  text: ARCHITECTURE.md lists uart_rx on D4 and uart_tx on C4. design.xdc, which is what was built, and spec.yaml put uart_rx
    on C4 (UART_TXD_IN) and uart_tx on D4 (UART_RXD_OUT). Trust the XDC; the architecture table is wrong.
- about: reset_values
  text: the interview answer says BRIGHTNESS resets to 0x40 and CONTROL to 0x2. spec.yaml's register map and rtl/t1_led_dimmer_counter.sv
    reset both to 0, and CONTROL bit 1 set means display disabled, so the display is enabled after reset. The RTL is what
    was built.
- about: pwm_period
  text: 'the interview answer says a 256-count phase with a prescale gives 1024 clock cycles and about 97.7 kHz. The RTL
    has no prescale: the phase counter advances every clock and wraps at PWM_PERIOD_CYCLES, so the period is 256 clocks,
    which matches the spec timing section.'
- about: pwm_scale
  text: with PWM_PERIOD_CYCLES at 256 the LEDs are on while phase < brightness, so brightness b gives duty b/256 for b below
    255. Brightness 255 is a special case that keeps the LEDs on continuously and 0 is always off. The scale is therefore
    not exactly linear over the whole brightness range.
- about: pwm_threshold_wrap
  text: for PWM_PERIOD_CYCLES other than 256, the scaled threshold is cast to the phase counter width. When the period is
    a power of two, brightness values just below 255 give a threshold equal to the period, which wraps to 0, so the LEDs
    would go off at high brightness. Read from the RTL only, not simulated at the spec's value, and the spec gives no other
    period.
- about: button_events
  text: each button gives one event per debounced rising edge; releases are debounced but make no event. Centre clear beats
    simultaneous up and down; simultaneous up and down cancel, so the counter is unchanged. Every simultaneous event still
    increments its own press count. A UART write to COUNTER in the same cycle beats any button change to the counter. A
    button held through reset release produces one press after the debounce interval, because the debounced level resets
    to 0.
- about: unmapped_accesses
  text: a window read of any offset not in the register map returns 0 with an OK status. A window write to a read-only or
    unmapped offset is ignored and the shell still answers OK; the READ_ONLY status applies only to the shell's own registers
    below 0x80. Host address is 0x80 plus the register offset.
- about: register_widths
  text: a COUNTER write keeps bits 15:0 and a BRIGHTNESS write keeps bits 7:0. CONTROL stores all 32 written bits and reads
    them back, though only bits 0 and 1 have an effect. Reads of BRIGHTNESS return the stored UART value, not the switch-selected
    active brightness; in switch mode the stored value is kept and the display shows the switch value.
- about: latency_count
  text: 'counted from the RTL: a button press reaches the counter register DEBOUNCE_CYCLES plus 2 clocks after the pin changes
    (two synchroniser flops, then the debounce count), and leds and the display outputs follow one clock later (registered).
    A full display frame is 8 times DISPLAY_SCAN_CYCLES clocks, as the spec says. Not measured on hardware.'
- about: switch_sync
  text: switches pass through one register stage (switches_sync) in the RTL, whereas the buttons use two flops. Asynchronous
    switch changes therefore have less metastability margin than the spec's synchronisation wording suggests.
- about: xdc_io_constraints
  text: design.xdc false-paths all asynchronous inputs and sets output delays of max -3.000 and min 0.000 ns on the outputs.
    The negative max output delay was not reviewed and no current timing run has checked it.
- about: unused_reset_module
  text: build.yaml reads shell/rtl/reset_sync.sv and sync2.sv, but the top-level RTL builds its own two-flop reset bridge
    and one-flop switch stage; only the shell's UART receiver uses sync2.
