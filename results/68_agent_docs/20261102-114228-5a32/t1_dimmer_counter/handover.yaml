schema: fda-handover/1
id: t1_dimmer_counter
title: T1 LED dimmer and push-button counter
kind: agent-run
produced_by: agent
summary: A Nexys A7-100T design with a 16-bit up/down/clear counter driven by three debounced push-buttons. The counter
  is shown on the 16 LEDs, gated by an 8-bit linear PWM brightness taken from a UART register or from the eight switches,
  and as hexadecimal on the seven-segment display (brightness on the two leftmost digits). The repository test shell exposes
  the counter, brightness, control, button and switch state and three press counts over USB-UART. The run reached a base-build
  bitstream, but only under an earlier Vivado release, so it must be re-measured. Verification reached V1 of V3, and stage
  configuration-and-debug did not pass.
scope_not:
- Not a verified design beyond V1. No seeded simulation, constrained-random test, coverage or mutation result is recorded,
  and no board result exists.
- Not measured for resources, timing, power, latency or throughput on Vivado 2026.1.
- No repeat on a held button, no hardware-selectable debounce time and no UART access wider than 32-bit aligned registers.
- No integrated logic analyzer (ILA) debug build exists.
target:
  part: xc7a100tcsg324-1
  board: nexys_a7_100t
  tool: Vivado 2026.1
  top: t1_led_dimmer_counter
clocks:
- name: clk
  mhz: 100.0
  source: results/68_agent_docs/20261102-114228-5a32/t1_dimmer_counter/design.xdc
resets:
- name: cpu_reset_n
  active: low
  note: Pin C12. rtl/t1_led_dimmer_counter.sv asserts it asynchronously and releases it synchronously through its own two-flop
    bridge. The internal active-high reset also drives the shell. design.xdc marks the input as a false path.
interfaces:
- name: clk
  type: input, 1 bit
  note: Pin E3, 100 MHz board oscillator; design.xdc creates a 10.00 ns clock on it. All logic runs in this one domain.
- name: button_up
  type: input, 1 bit, active high
  note: Pin M18. Two-flop synchronised, then debounced, one event per debounced rising edge.
- name: button_down
  type: input, 1 bit, active high
  note: Pin P18. Same path as button_up.
- name: button_center
  type: input, 1 bit, active high
  note: Pin N17. Same path as button_up.
- name: switches
  type: input, 8 bits
  note: SW0 to SW7 on J15, L16, M13, R15, R17, T18, U18, R13. Registered once in the top, not twice (see gap switch_sync).
- name: uart_rx
  type: input, 1 bit
  note: Pin C4 in design.xdc (UART_TXD_IN), host to FPGA, 115200 baud shell protocol. ARCHITECTURE.md swaps C4 and D4; the
    XDC and spec.yaml agree.
- name: uart_tx
  type: output, 1 bit
  note: Pin D4 in design.xdc, FPGA to host. Registered, idle high.
- name: leds
  type: output, 16 bits, active high
  note: 'LD0 to LD15, H17 through V11 as listed in design.xdc. Registered: counter value gated by PWM.'
- name: segments_n
  type: output, 8 bits, active low
  note: Bit 0 to bit 7 drive CA, CB, CC, CD, CE, CF, CG, DP (T10, R10, K16, K13, P15, T11, L18, H15). The RTL segment bit
    order matches the XDC; DP is never lit.
- name: digit_enable_n
  type: output, 8 bits, active low
  note: Bit n drives ANn (J17, J18, T9, J14, P14, T14, K2, U13). AN0 to AN3 show the counter from least to most significant
    nibble, AN6 and AN7 show the active brightness low and high nibble, AN4 and AN5 are blank.
registers:
- offset: 0
  name: DESIGN_ID
  access: R
  reset: 1412514883
  bits: 31:0, ASCII T1DC
- offset: 4
  name: COUNTER
  access: RW
  reset: 0
  bits: '15:0'
- offset: 8
  name: BRIGHTNESS
  access: RW
  reset: 0
  bits: '7:0'
- offset: 12
  name: CONTROL
  access: RW
  reset: 0
  bits: bit 0 selects switch brightness; bit 1 disables seven-segment display; other bits reserved
- offset: 16
  name: BUTTON_STATE
  access: R
  reset: 0
  bits: bit 0 up, bit 1 down, bit 2 centre; debounced levels
- offset: 20
  name: SWITCH_STATE
  access: R
  reset: 0
  bits: bits 7:0 are SW7:SW0
- offset: 24
  name: UP_PRESS_COUNT
  access: R
  reset: 0
  bits: '31:0'
- offset: 28
  name: DOWN_PRESS_COUNT
  access: R
  reset: 0
  bits: '31:0'
- offset: 32
  name: CENTRE_PRESS_COUNT
  access: R
  reset: 0
  bits: '31:0'
parameters:
- name: DEBOUNCE_CYCLES
  value: 1000000
  legal: Positive integer; a value of 1 or less removes the filtering. Only the default was built.
  note: 'About 10 ms at 100 MHz. A new level is accepted after the synchronised input has differed from the debounced level
    for this many clock cycles. Spec timing: DEBOUNCE_CYCLES = 1,000,000 cycles, approximately 10 ms at 100 MHz.'
- name: PWM_PERIOD_CYCLES
  value: 256
  legal: Positive integer. 256 is special-cased in the RTL; other values use a scaled threshold that was not exercised.
  note: 'One PWM phase step per clock, so the period is 256 clocks, about 390.625 kHz at 100 MHz, above visible flicker.
    Spec timing: PWM_PERIOD_CYCLES = 256 cycles, approximately 390.625 kHz at 100 MHz; this is above visible flicker rates.'
- name: DISPLAY_SCAN_CYCLES
  value: 100000
  legal: Positive integer; only the default was built.
  note: 'Clock cycles per digit selection, giving about 125 Hz full-frame refresh over eight digits at 100 MHz. Spec timing:
    DISPLAY_SCAN_CYCLES = 100,000 cycles per digit selection, approximately 125 Hz full-frame refresh for eight digits at
    100 MHz.'
- name: UART_BAUD_DIVIDER
  value: 868
  legal: Positive integer, passed to the shell as clocks per bit; only the default was built.
  note: 'About 115207 baud at 100 MHz, close to 115200 baud. The shell frame timeout is fixed at 100000 cycles in the top.
    Spec timing: UART_BAUD_DIVIDER = 868 clk cycles per bit, approximately 115207 baud at 100 MHz, close to 115200 baud.'
