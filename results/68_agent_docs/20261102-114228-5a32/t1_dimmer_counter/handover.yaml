schema: fda-handover/1
id: t1_dimmer_counter
title: T1 LED dimmer and push-button counter for the Nexys A7-100T
kind: agent-run
produced_by: agent
summary: The design keeps a 16-bit up/down counter that three debounced push-buttons change (up, down, centre-clear) and
  that a UART register window can read and write. The counter drives 16 LEDs gated by an 8-bit linear PWM, and the counter
  and the active brightness are shown on the eight-digit seven-segment display. The brightness comes either from a UART
  register or from the eight switches, and the registers are reached through the repository test shell at 115200 baud. The
  run reached a base bitstream under an earlier Vivado release than the pinned one, so no build number is published. Verification
  reached V1 of V3 and the debug build with the ILA did not complete.
scope_not:
- Not a general PWM or display core. It is one board-level top for the Nexys A7-100T and its pins are fixed in design.xdc.
- Not a gamma-corrected dimmer. Brightness is linear 8-bit duty.
- No auto-repeat on a held button, and no use of the decimal points or of the UART beyond the shell register window.
- Not verified on hardware. No board result is recorded, and no ILA debug build result exists.
target:
  part: xc7a100tcsg324-1
  board: nexys_a7_100t
  tool: Vivado 2026.1
  top: t1_led_dimmer_counter
clocks:
- name: clk
  mhz: 100.0
  source: results/68_agent_docs/20261102-114228-5a32/t1_dimmer_counter/design.xdc
resets:
- name: cpu_reset_n
  active: low
  note: Asserts asynchronously and releases after two clk edges, through reset_meta and reset_sync inside t1_led_dimmer_counter.sv
    (the shell's reset_sync module is not used). Every other register uses this as a synchronous reset, including the shell,
    whose reset input is this signal.
interfaces:
- name: clk
  type: input, 100 MHz clock
  note: Pin E3, LVCMOS33, 10.00 ns period in design.xdc. The only clock; all intervals are clock enables or counters.
- name: cpu_reset_n
  type: input, active-low reset
  note: Pin C12, the CPU reset button. See resets.
- name: button_up
  type: input, active-high push-button
  note: Pin M18. Two-flop synchroniser, then debounce.
- name: button_down
  type: input, active-high push-button
  note: Pin P18. Same path as button_up.
- name: button_center
  type: input, active-high push-button
  note: Pin N17. Same path as button_up.
- name: switches
  type: input, 8 bits
  note: SW0 to SW7 on J15, L16, M13, R15, R17, T18, U18, R13. Sampled by one register stage.
- name: uart_rx
  type: input, serial
  note: Pin C4 in design.xdc (USB-UART TX to FPGA), one start bit, eight data bits and one stop bit at the shell baud divider.
    ARCHITECTURE.md lists D4 and disagrees.
- name: uart_tx
  type: output, serial
  note: Pin D4 in design.xdc (FPGA to USB-UART RX). ARCHITECTURE.md lists C4 and disagrees.
- name: leds
  type: output, 16 bits, active high
  note: LD0 on H17 through LD15 on V11, as assigned in design.xdc. Registered output.
- name: segments_n
  type: output, 8 bits, active low
  note: CA to CG are bits 0 to 6, DP is bit 7, on T10, R10, K16, K13, P15, T11, L18, H15. Registered output; DP is always
    off.
- name: digit_enable_n
  type: output, 8 bits, active low
  note: AN0 to AN7 on J17, J18, T9, J14, P14, T14, K2, U13. Registered output.
parameters:
- name: DEBOUNCE_CYCLES
  value: 1000000
  legal: Positive integer in clk cycles. The value 1 or less makes the filter pass a change after one cycle. The counter
    width is $clog2 of the value.
  note: 'About 10 ms at 100 MHz. A button must stay changed for this many cycles, and the same interval filters release.
    Spec timing: DEBOUNCE_CYCLES = 1,000,000 cycles, approximately 10 ms at 100 MHz.'
- name: PWM_PERIOD_CYCLES
  value: 256
  legal: Built and specified at 256. Other values use a scaled compare in the RTL that the run did not exercise. A power
    of two below 256 would truncate the full-duty compare constant.
  note: 'The PWM phase counter advances every clk, so the period is 256 cycles, about 390.625 kHz at 100 MHz, above visible
    flicker. Spec timing: PWM_PERIOD_CYCLES = 256 cycles, approximately 390.625 kHz at 100 MHz; this is above visible flicker
    rates.'
- name: DISPLAY_SCAN_CYCLES
  value: 100000
  legal: Positive integer in clk cycles.
  note: 'Cycles each digit stays selected. A full eight-digit frame takes 8 times this value, about 125 Hz at 100 MHz. Spec
    timing: DISPLAY_SCAN_CYCLES = 100,000 cycles per digit selection, approximately 125 Hz full-frame refresh for eight
    digits at 100 MHz.'
- name: UART_BAUD_DIVIDER
  value: 868
  legal: Positive integer, clk cycles per UART bit. It must match the host baud rate. The shell receiver halves it to sample
    the start bit, so very small values are unsupported.
  note: 'Passed to the shell as CLKS_PER_BIT: about 115207 baud at 100 MHz, close to 115200 baud. The shell frame timeout
    is fixed at 100000 cycles in the RTL. Spec timing: UART_BAUD_DIVIDER = 868 clk cycles per bit, approximately 115207
    baud at 100 MHz, close to 115200 baud.'
