# designs/b58a_trigger on the KR260 (brief 155): the RGMII transmit pins of the two PL Ethernet ports, LVCMOS18 in HP banks, 125 MHz DDR.
# Trace length, Z0 and the PHY pin capacitance are ASSUMPTIONS (the SOM and carrier schematics are not in the repo; RGMII asks for 50 ohm single-ended).
design: designs/b58a_trigger
xdc: designs/b58a_trigger/design.xdc
board: kr260
family: zynquplus
part: xck26-sfvc784-2LV-c
bank_type: HP
off_chip:
  - name: rgmii_a_tx
    ports: [a_txd*, a_tx_ctl, a_txc]
    direction: output
    iostandard: LVCMOS18
    vcco: 1.8
    bank_type: HP
    line: {z0_ohm: 50, length_in: 4.0}       # ASSUMED
    load: {c_pf: 4.0, receiver_std: LVCMOS18}  # ASSUMED
    priority: edge_rate
    ui_ns: 4.0                               # DDR at 125 MHz: 4 ns per bit
  - name: rgmii_b_tx
    ports: [b_txd*, b_tx_ctl, b_txc]
    direction: output
    iostandard: LVCMOS18
    vcco: 1.8
    bank_type: HP
    line: {z0_ohm: 50, length_in: 4.0}       # ASSUMED
    load: {c_pf: 4.0, receiver_std: LVCMOS18}
    priority: edge_rate
    ui_ns: 4.0
  - name: leds
    ports: [led*]
    direction: output
    iostandard: LVCMOS18
    vcco: 1.8
    bank_type: HP
    line: short
    load: {c_pf: 5.0}
    priority: emi
    ui_ns: 1000.0                              # a static or slow signal: a long unit interval (UART 115200 baud = 8680 ns)
    min_drive_ma: 4                        # ASSUMED: the output must source or sink at least this much DC current
