# Interface contract of median3x3 (format: docs/project_layer.md). Hand-written for P0.
schema: fpga-design-agent/contract/v1
module: median3x3
summary: per-channel 3x3 median of a full-raster AXI4-Stream video, fixed latency, sideband delayed with the pixels

parameters:
  - {name: H_TOTAL, default: 1650, min: 8, max: 4096}   # beats per raster line (the line buffer length)

clocks:
  - {name: clk, port: clk, max_mhz: 100}
resets:
  - {name: rst, port: rst, clock: clk, polarity: active_high, style: sync}

ports:
  - {name: clk, dir: in}
  - {name: rst, dir: in}
  - {name: s_axis_video_tvalid, dir: in,  clock: clk}
  - {name: s_axis_video_tready, dir: out, clock: clk}
  - {name: s_axis_video_tdata,  dir: in,  width: 24, clock: clk}
  - {name: s_axis_video_tuser,  dir: in,  width: 3,  clock: clk}
  - {name: s_axis_video_tlast,  dir: in,  clock: clk}
  - {name: m_axis_video_tvalid, dir: out, clock: clk, reset_value: 0}
  - {name: m_axis_video_tready, dir: in,  clock: clk}
  - {name: m_axis_video_tdata,  dir: out, width: 24, clock: clk}
  - {name: m_axis_video_tuser,  dir: out, width: 3,  clock: clk}
  - {name: m_axis_video_tlast,  dir: out, clock: clk}

data_formats:
  - {name: chan8, format: u8, packing: "one colour channel; 0 is off, 255 is full intensity"}

interfaces:
  - name: video_in
    protocol: axi4-stream
    role: slave
    prefix: s_axis_video
    clock: clk
    reset: rst
    tdata: &video_tdata
      width: 24
      fields:
        - {name: r, bits: [23, 16], format: chan8}
        - {name: g, bits: [15, 8],  format: chan8}
        - {name: b, bits: [7, 0],   format: chan8}
    tuser: &video_tuser
      - {bit: 0, name: hs, meaning: "horizontal sync"}
      - {bit: 1, name: vs, meaning: "vertical sync"}
      - {bit: 2, name: de, meaning: "active picture"}
    tlast: "the last beat of each raster line, blanking included"
    packet_beats: H_TOTAL
    backpressure: false                   # tready is high on every clock after reset
    source_gaps: false                    # needs one beat on every clock (the window is in raster time)
  - name: video_out
    protocol: axi4-stream
    role: master
    prefix: m_axis_video
    clock: clk
    reset: rst
    tdata: *video_tdata
    tuser: *video_tuser
    tlast: "the last beat of each raster line, blanking included"
    packet_beats: H_TOTAL
    backpressure: false
    source_gaps: false

latency:                                  # one line and one pixel to reach the window's last pixel, one clock to sort
  - {from: video_in, to: video_out, cycles: "H_TOTAL + 2"}

throughput:
  - {interface: video_out, beats_per_cycle: 1, from: video_in, out_per_in: 1}
