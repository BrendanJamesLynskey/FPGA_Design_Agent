# Interface contract of video_src (format: docs/project_layer.md). Hand-written for P0; in the pipeline, phase 0
# writes it with the user and it is hash-pinned when approved.
schema: fpga-design-agent/contract/v1
module: video_src
summary: CEA-861 720p60 raster with a test pattern, one AXI4-Stream beat per pixel clock (blanking included)

parameters:
  - {name: H_ACTIVE, default: 1280, values: [1280]}
  - {name: H_FP,     default: 110,  values: [110]}
  - {name: H_SYNC,   default: 40,   values: [40]}
  - {name: H_BP,     default: 220,  values: [220]}
  - {name: V_ACTIVE, default: 720,  values: [720]}
  - {name: V_FP,     default: 5,    values: [5]}
  - {name: V_SYNC,   default: 5,    values: [5]}
  - {name: V_BP,     default: 20,   values: [20]}

clocks:
  - {name: clk, port: clk, max_mhz: 74.25}
resets:
  - {name: rst, port: rst, clock: clk, polarity: active_high, style: sync}

ports:
  - {name: clk, dir: in}
  - {name: rst, dir: in}
  - {name: m_axis_video_tvalid, dir: out, clock: clk, reset_value: 0}
  - {name: m_axis_video_tready, dir: in,  clock: clk}
  - {name: m_axis_video_tdata,  dir: out, width: 24, clock: clk}
  - {name: m_axis_video_tuser,  dir: out, width: 3,  clock: clk}
  - {name: m_axis_video_tlast,  dir: out, clock: clk}
  - {name: pattern_sel, dir: in,  width: 2,  clock: clk}
  - {name: frame_count, dir: out, width: 16, clock: clk, reset_value: 0}

data_formats:
  - {name: chan8, format: u8, packing: "one colour channel; 0 is off, 255 is full intensity"}

interfaces:
  - name: video_out
    protocol: axi4-stream
    role: master
    prefix: m_axis_video
    clock: clk
    reset: rst
    tdata:
      width: 24
      fields:
        - {name: r, bits: [23, 16], format: chan8}
        - {name: g, bits: [15, 8],  format: chan8}
        - {name: b, bits: [7, 0],   format: chan8}
    tuser:
      - {bit: 0, name: hs, meaning: "horizontal sync, high during the 40-clock pulse"}
      - {bit: 1, name: vs, meaning: "vertical sync, high during the 5-line pulse"}
      - {bit: 2, name: de, meaning: "active picture; tdata is 0 whenever de is 0"}
    tlast: "the last beat of each raster line, blanking included"
    packet_beats: "H_ACTIVE + H_FP + H_SYNC + H_BP"
    backpressure: false                   # a real-time raster: the sink must keep tready high
    source_gaps: false                    # one beat on every clock after reset

registers:
  bus: top                                # the generated top decodes the shell window and crosses to clk_pix
  map:
    - name: PATTERN
      offset: 0x00
      access: RW
      reset: 0
      fields:
        - {name: sel, bits: [1, 0], port: pattern_sel, meaning: "0 colour bars; 1-3 open (assumption A-2)"}
    - name: FRAMES
      offset: 0x01
      access: RO
      reset: 0
      volatile: true
      fields:
        - {name: count, bits: [15, 0], port: frame_count, meaning: "frames started since reset, wrapping"}

throughput:
  - {interface: video_out, beats_per_cycle: 1}
