# Positives (the reviewer should flag the problem and name the missing fact), negatives (it must not flag), candidates (undiagnosed: described, never scored).
dataset: nvidia/cvdp-benchmark-dataset (agentic split for A to F, the non-agentic held-out hundred for G)
groups:
