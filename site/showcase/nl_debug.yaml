limits:
  not_measured: ["One design and a handful of requests: the parser and the name resolver were not measured on other designs or on requests the authors had not seen.", "No agent role is offered the debug tools yet; they were tested in CI, not used on the board by an agent.", "Supply and temperature are read at programming, arming and after upload, not on the capture timeline.", "No timed comparison with setting up the analyser by hand.", "Refused, as it should be: the example request \"capture the UART byte when the FIFO overflows\" cannot be built on this design, which has no FIFO; the plan says so instead of guessing a signal."]
  next: ["Our own capture core behind the same front end: triggers changed without a rebuild, more than one clock domain, no port limit.", "Offer the tools to the agent's repair loop, measured in a pre-registered comparison.", "Supply and temperature samples on the same timeline as the digital signals."]
try_it: {command: "python -m debug_core answer debug_core/tests/fixtures/golden/t1_count_write/capture.json", note: "Prints the plain-words answer for the replayed capture; no board, Vivado or model needed."}
