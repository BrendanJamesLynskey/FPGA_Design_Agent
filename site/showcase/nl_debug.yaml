headline: "Nexys A7-100T (xc7a100tcsg324-1), Vivado 2026.1: {passed} of {runs} known-answer requests on one design, written in plain English, were answered from captures on the board. Every answer matched the known result, and the value read back over the serial link where a register was read back."
description: "A plain-English request becomes a probe plan, an on-chip logic analyser build, a capture on the Nexys A7 and an answer that quotes only the capture: measured on one design with known answers."
hero: {kind: wave, source: results/50a_nl_debug/hero.json, path: "", caption: "One real run replayed: the request, the plan, the build, then the capture filling in sample by sample around the trigger, and the answer read from it."}
story:
  problem: "An on-chip logic analyser (ILA: logic added to the design that records chosen signals into on-chip memory, one sample per clock) shows what a design really does on the board, but setting one up is slow: choosing signals that survive synthesis, packing them into the analyser's ports, writing the trigger, rebuilding and reading the waveform. On the free Basic licence tier of Vivado the analyser is also limited: one analyser per design, so one clock; at most {ports} probe ports (groups of wires into the analyser); and one comparator per port (the hardware that tests a port against the trigger value). A request that does not fit fails late, after a long build."
  how: "A language model only restates the request as structured JSON. Everything after it is deterministic: each signal name is resolved against the RTL (the design's source code) to a register output, the trigger becomes per-bit compare values, the window and the analyser's ports are sized within the free tier's limits, and the plan is shown before anything is built. The build reuses the normal Vivado flow and all its checks and is programmed into the board's volatile memory (SRAM, never the flash). The capture runs over the board's programming cable (JTAG) while the design is driven over its serial link; the answer is written from facts computed from the samples, and a check refuses any number that the capture does not support."
  architecture:
    blocks: [[req, Request in words], [plan, Plan by RTL name], [build, Logic analyser build], [board, Capture on the board], [ans, Answer from the capture]]
    links: [[req, plan, JSON], [plan, build, probes], [build, board, SRAM], [board, ans, samples], [ans, plan, "the agent asks the next question"]]
  results:
    - "{passed} of {runs} known-answer requests on one design passed: the answer matched the known result each time, and the value read back over the serial link in the {readback_runs} runs that read a register back. One run each, so no spread is stated. All five are in the table below."
    - "{builds} debug builds of {build_lo} to {build_hi} seconds each (about {build_min} to {build_max} minutes): {builds_used} served the requests and {builds_refused} was the OR layout that Vivado refused to arm, rebuilt with one port per OR term. {reused} of the {runs} requests needed no new build because an earlier build already held its signals. Every build met timing (worst setup slack at least {wns_lo} ns), at most {power_hi} W estimated by Vivado."
    - "Programming and capture took {cap_lo} to {cap_hi} seconds per request. Reading each request cost ${cost_lo} to ${cost_hi} per request, as the model provider reported."
    - "All {inside} captures ran inside the recommended operating conditions: die {die_lo} to {die_hi} C at the readings (latched maximum {die_latched} C), core supply {vccint} V, {alarms} alarms."
  table:
    caption: "The known-answer requests: each links to its capture (common capture format, with the plan, the answer and the raw analyser export beside it)."
    source: results/50a_nl_debug/summary.json
    path: runs_table
    columns: [[run, Request], [what, What it checked], [trigger, Trigger as planned], [build, Build], [capture_s, Programming and capture (s)], [readback, Read back], [result, Answer]]
    link: capture
    link_column: run
  agent:
    request: "{hero_request}"
    plan: "Three signals resolved by RTL name to register outputs and packed into {hero_ports} of the {ports} ports; the trigger on the write strobe and the address byte; a {hero_depth}-sample window, the smallest that holds the {hero_pre} cycles before and {hero_post} after that were asked for (the answer covers only those)."
    gates: ["The plan matched its schema and the free tier's limits before any build.", "The build passed every check of the normal flow, including timing and the debug hub's clock crossing.", "The build ID read back over JTAG matched before arming ({hero_build}).", "Every number in the answer was checked against the capture."]
    approvals: ["The owner asked for this capability, set the order (front end first) and the safety rules: board memory only, power and temperature limits, design checks never skipped. No approval was needed per run: each capture holds the board lock and programs board memory only."]
  details:
    - title: "When a name is ambiguous, the plan stops and asks"
      text: "The resolver reads the RTL, not the model. Asked for '{amb_q}', it finds {amb_n} different registers with that name ({amb_c}) and refuses the plan with the list, instead of picking one. The model's only job is to turn a phrase into a name: '{phrase}' came back from the model as '{phrase_as}', which the resolver then traced to {phrase_to} (pins {phrase_pins}); a name it cannot trace is an error with suggestions, never a guess."
    - title: "The answer check refuses a made-up number"
      text: "Every number in an answer must be a value, change, run or count of the signal its line names, inside the window asked for. '{check_good}' passes. Changing one value, '{check_bad}', is refused: {check_bad_refused} is not in the capture. The check reads line by line and does not understand sentences, so a true number of the right signal used for the wrong thing would still pass; the answers are written from the capture's facts by a template, which never does that."
    - title: "Who wrote what"
      text: "The resolver, planner, build reuse, capture driver, answer writer and answer check are ordinary deterministic Python. They were written by an AI coding assistant to the owner's brief and checked by independent reviewers and the tests. At run time the only model call is reading the request, by {model} through a provider; nothing it says is trusted until the resolver has traced it in the RTL."
    - title: "Where the trigger is, and why the counter changes one clock later"
      text: "Cycle {t_cycle} is the sample in which the trigger condition holds: there win_wr = {t_win_wr} and addr = {t_addr}. The counter still shows {c_before} in that sample and {c_after} one clock later, because the register loads on the clock edge that ends the write strobe."
    - title: "What this saves, honestly"
      text: "Not measured: there is no timed comparison with a person setting up the analyser by hand. Qualitatively, the request replaces choosing post-synthesis register names, packing ports within the free tier's limits, writing per-bit trigger values and reading the waveform; the build itself takes the same Vivado time either way, and a request served by an existing build needs no build at all."
