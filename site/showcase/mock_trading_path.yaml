order: 4
status: planned
title: A mock low-latency trading path
one_line: "Our own Ethernet processing parses a packet of a made-up market-data format while it is still arriving, a rule set at run time fires, and a reply leaves, with the time from first bit in to first bit out measured as a full distribution. Everything is a mock: no real exchange, market or broker."
