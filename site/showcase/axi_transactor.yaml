# Showcase project (brief 59A). Contract: docs/showcase_pages.md. Every number comes from a {name} placeholder; the values
# are derived by axi_tx/report.py from the committed records in results/59a_axi_tx/.
id: axi_transactor
order: 2
status: published
title: An on-chip AXI traffic generator and protocol checker
one_line: "A block that sits on the chip beside the IP under test, drives AXI4-Lite and AXI4-Stream traffic from a program loaded at run time, and checks every protocol rule in hardware while the traffic runs."
description: "An on-chip AXI4-Lite and AXI4-Stream transactor, protocol checker and scoreboard on the Nexys A7: seeded bugs caught on the board, the same traffic cycle for cycle in simulation, the checker proved formally."
board: Digilent Nexys A7-100T
part: xc7a100tcsg324-1
