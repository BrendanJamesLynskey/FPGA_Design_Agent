# Showcase project (brief 59A). Contract: docs/showcase_pages.md. In progress: no numbers until a board result is committed.
id: axi_transactor
order: 2
status: in_progress
title: An on-chip AXI traffic generator and protocol checker
one_line: "A block that sits on the chip beside the IP under test, drives AXI4-Lite and AXI4-Stream traffic from a program loaded at run time, and checks every protocol rule in hardware while the traffic runs."
board: Digilent Nexys A7-100T
part: xc7a100tcsg324-1
what_it_will_show: "The checker catching a bug seeded in a peripheral on the board, with the same traffic run in simulation so the first point where the two differ marks the bug."
