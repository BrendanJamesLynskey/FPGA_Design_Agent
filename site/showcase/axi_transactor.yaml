title: An on-chip AXI traffic generator and protocol checker
one_line: "A block that sits on the chip beside the design under test, drives AXI4-Lite and AXI4-Stream traffic from a program loaded at run time, and checks a set of named protocol rules in hardware while the traffic runs."
description: "An on-chip AXI4-Lite and AXI4-Stream traffic generator, protocol checker and scoreboard on the Nexys A7: seeded bugs caught on the board, the same traffic cycle for cycle in simulation, the checker checked formally to a bounded depth."
