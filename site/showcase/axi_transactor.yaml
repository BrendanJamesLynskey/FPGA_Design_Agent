  - {kind: record, label: "Board runs: verdicts, counters, captures and the simulation comparison", path: results/59a_axi_tx/board_run.json}
  - {kind: record, label: "Earlier board attempts, and what changed after them", path: results/59a_axi_tx/board_run_attempts.md}
  - {kind: record, label: "Simulation records of the same programs", path: results/59a_axi_tx/sim}
  - {kind: record, label: "Formal proofs and checker mutants", path: results/59a_axi_tx/formal.json}
  - {kind: record, label: "Resource cost per configuration and the AMD IP build test", path: results/59a_axi_tx/resources.json}
  - {kind: conditions, label: "Die temperature and rails before, during and after the runs, against the recommended operating conditions", path: results/59a_axi_tx/board_run.json}
  - {kind: versions, label: "Vivado 2026.1, build ID {build_id}, timing, power and gate results", path: results/59a_axi_tx/board_build.json}
  - {kind: requirements, label: "Requirements traced", text: "Not done yet: the programs carry requirement tags, but nothing reads them yet."}
limits:
  not_measured:
    - "Coverage of real-world bugs: the bugs were planted by us to demonstrate the checker; this is not a measure of how many unknown bugs it would find."
    - "Full AXI4 (bursts, IDs, outstanding transactions), the slave side and a long soak: the next phase."
    - "Runs against the block-RAM controller IP core are checked against a model, not cycle for cycle with simulation: the free simulator we used cannot simulate that core."
    - "One board, one clock: the stream path is a single width (the stand-alone stream checker was also synthesised at wider widths), and the bus runs at the board's single system clock."
    - "The proofs are bounded, and the property restatement shares its author with the checker; the AMD checker is the independent check."
  nulls: []
  next:
    - "Full AXI4 with IDs and a DMA target, and a soak mode that steers random traffic towards untested combinations."
    - "Decode the AMD checker's status bits to rule names, and read the counters faster than the serial link allows."
try_it:
  command: "python -m pytest -q axi_tx/tests/test_59a_rtl.py && python axi_tx/formal/run_formal.py"
  note: "Simulation and formal checks only (open-source Icarus Verilog, cocotb, Yosys, SymbiYosys): every program, seeded bug and broken checker. The board runs need the board and are recorded in the evidence above."
