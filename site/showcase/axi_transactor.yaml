headline: "A hardware checker that watches an AXI bus and names the rule a bug breaks. On the Digilent Nexys A7-100T (xc7a100tcsg324-1, Vivado 2026.1) it flagged the expected rule in all {bug_runs} runs with a seeded protocol bug ({faults} faults), and against our own peripheral and stream FIFO the board's traffic matched simulation cycle for cycle in {parity_eq} of {parity} runs."
hero:
  kind: wave
  source: results/59a_axi_tx/hero.json
  path: wave
  caption: "One capture from the board, one seeded bug: our peripheral raises the write-response valid signal (BVALID) before any write data has arrived, and the checker flags it in that cycle."
story:
  problem: "AXI is the standard on-chip bus of Arm and AMD designs. A bus interface that breaks its handshake rules often passes a quick test and fails in a system: read data that is not held while the master stalls, or a write response sent before the data. Such bugs show only under the right timing, and a logic analyser shows the waveform but not which rule it breaks.\n\nThe hard part is the checker, not the traffic. A wrong checker passes bad designs or flags good ones, so this one is checked formally, attacked with deliberately broken copies of itself, and compared on the board with AMD's own checker.\n\nThe other hard part is making the board and the simulation see identical traffic: every random choice has to be seeded, and every counter has to start with the run."
  how: "A transaction program, written in plain YAML and loaded over the serial link, drives AXI4-Lite traffic (a simple register-access bus) and AXI4-Stream traffic (a packet stream) with seeded random addresses, data and byte-enables (which bytes of a word to write), pauses by the sender and refusals by the receiver (back-pressure). Monitors that watch only the bus wires check {lite_rules} AXI4-Lite and {stream_rules} AXI4-Stream rules every cycle. A reference copy of the memory checks reads of every word written in the run, counters record latency, stalls and which cases were covered, and the first violation starts a capture. The same program runs on the board and in simulation."
  architecture:
    blocks: [[host, Host (serial)], [seq, Sequencer], [eng, AXI masters], [dut, Targets], [chk, Checkers], [cap, Capture]]
    links: [[host, seq, YAML], [seq, eng, txns], [eng, dut, AXI], [dut, chk, bus], [chk, cap, trigger], [chk, host, verdicts]]
  results:
    - "{runs} board runs, written in a plan before the board was used: {bug_runs} with a seeded protocol bug ({faults} faults in all), {func_runs} with a seeded data bug, {clean} clean. All {runs_pass} gave the verdict the plan expected. Earlier attempts on earlier builds are listed in the evidence: after them the transaction model and the RTL were changed, and the whole plan was run again on the final build."
    - "Each protocol-bug run was flagged by the rule we expected, and by no other rule. The data bugs (write byte-enables ignored, the end-of-packet marker TLAST lost) were caught by the reference memory or the stream receiver alone ({func_caught} of {func_runs}), and all {clean_quiet} clean runs fired nothing. A demonstration on bugs we planted, not a measure of coverage."
    - "Board against simulation, for our own peripheral and stream FIFO (a first-in, first-out buffer): a checksum over every transaction, including its latency in cycles, and the run's length in cycles were identical in {parity_eq} of {parity} runs; {txn_diff} of {txns} logged transactions differed."
    - "Independent check: AMD's AXI Protocol Checker, watching the same AXI4-Lite bus (not the stream), raised its flag in exactly the {amd_asserted} runs where ours flagged an AXI4-Lite rule; on the AXI4-Lite bus the two agree in {amd_agree} of {lite_runs} runs."
    - "The checker is checked formally to depth {depth} (bounded): {proofs_pass} of {proofs} proofs show each rule quiet on legal traffic and firing on its own seeded violation within that many clock cycles, and {mutants_killed} of {mutants} deliberately broken copies of the checker were caught. The properties were written by the same author as the checker, which is why the AMD checker matters."
    - "In one run against the board's block-RAM controller IP core, under random back-pressure, write latency ran from {wlat_min} to {wlat_max} cycles and read latency from {rlat_min} to {rlat_max}; {reads_checked} reads of written words were checked against the reference memory with no mismatch."
    - "Design size and timing: the whole board design used {lut} LUTs and met timing with {wns} ns of slack; Vivado estimated {power} W."
    - "Measured conditions: the die stayed at or below {tj_max} C and the core supply rail (VCCINT) between {vccint_min} and {vccint_max} V, inside the recommended operating conditions, with {alarms} alarms latched."
  agent:
    request: "The owner asked for an on-chip AMBA AXI traffic generator and protocol checker that exercises on-chip modules with transactions of any complexity while verifying protocol correctness."
    plan: "The owner chose the project and set the rules. A language-model coding agent wrote the RTL, the rule monitors (from the specification, in its own words), the seeded bugs, the proofs, the simulation and the board runs. The bugs were seeded by the same agent that wrote the checker; AMD's checker is the part it did not write."
    gates: ["Every rule checked quiet and firing, every broken copy of the checker caught", "Simulation of every program, seeded bug and memory fault", "Vivado 2026.1 gates: methodology, timing, design rule checks, power", "The board plan written in advance, with die temperature and rails logged"]
    approvals: ["The owner authorised hardware use (volatile configuration only, wall power)", "Independent reviewers checked the work, and the owner merges it"]
