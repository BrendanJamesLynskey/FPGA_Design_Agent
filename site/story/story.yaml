text:
  lede: >-
    How the FPGA Design Agent was designed, measured and corrected. The agent turns a plain-English request into a design
    checked by hidden tests, code-run gates and a board. This page shows how that was built and tested, one experiment at a
    time, including the ones that found nothing.
  best: >-
    Best result: a deterministic CDC gate flagged {c_gate} of {c_mut} faulty designs where the tool's own report flagged
    {c_tool}, with {c_false} false alarms on {c_ok} correct designs. Not proven: how often the agent solves a task it has
    never seen. The first held-out evaluation was stopped with no score, and the baseline evaluation has not been run.
  scope: >-
    {exp_n} experiments are written up below, each in the same form. Where a run was single or the sample small, the card
    says so and claims no rate.
  glossary: >-
    Terms used below: CVDP is a public set of RTL-writing problems. CDC is a signal crossing between two clocks. A mutant is a design with one deliberate fault, used to test
    whether the tests notice. An escape is a run whose own checks passed while the hidden tests failed. Slack is how much
    timing margin a path has; negative means it fails. V0 to V3 are the four verification stages. H1, H2 and H9 are three
    harness changes (context management, hang protection, report digests). Slack and WNS both mean timing margin. An oracle answers the agent's clarifying questions from the hidden spec. ILA is an on-chip logic analyser. MCP is the protocol the agent's tools speak. Stage 2 is the RTL and tests stage. The Clarifier, Modeller, Verifier and Designer are the agent's four roles. The models are named as the provider lists them.
  limits: >-
    The grouping of the timeline and the cause class of each finding are the author's reading of the pull request text,
    not a measurement. The findings listed are the ones with a recorded fix, not a complete count of the agent's faults.
    Most experiments ran one model on a small task set, and each card says so. Results measured on an earlier Vivado
    release and not repeated on Vivado 2026.1 are not shown. The list of merged pull requests is a snapshot from the day
    the page was built.
  fine_tune: >-
    A fine-tuning experiment on a narrow sub-problem (choosing a closure strategy when timing is tight) is planned and has
    not been run. It will be added here as one more card, whatever it finds, including a no.

timeline:
  - id: t_flow
    date: "2026-10-30"
    title: A flow that a board can check
    changed: The Vivado flow, its gates, an ILA debug core and a test shell on the Nexys A7 board, then automated bring-up that programs the board by its JTAG serial number and runs tests against a model.
    why: A design only counts when hardware shows it behaving as specified. Everything later is judged against that bar.
    showed: The first design, T1 (a dimmer and counter), went from source to bitstream to a board test with no hand steps.
    prs: [1, 2, 9]
    links: [results/f0b, docs/methodology.md]
  - id: t_models
    date: "2026-10-31"
    title: Which model writes the RTL
    changed: A pre-registered screen of cheap open-weight models against the base model on {f1_probs} problems.
    why: Cost decides how many runs the project can afford, so the model choice was measured rather than assumed.
    showed: Neither cheaper model beat the base, and one was worse by a margin its interval excludes from zero (card below).
    prs: [4, 6, 10]
    experiment: x_models
    links: [results/f1b]
  - id: t_verif
    date: "2026-11-01"
    title: Verification stages V0 to V3
    changed: A verification backbone of four stages, from requirements tracing to coverage and mutation testing, on a simulator-portable stack.
    why: The agent's own testbench never counts as a pass. A model's test shares its misreading of the spec, so checks must come from code and from tests the agent does not see.
    showed: Mutation testing of T1's tests found two survivors that no test looked at, both reset-state faults (card below).
    prs: [11]
    experiment: x_mutation
    links: [results/04f, docs/verification.md]
  - id: t_graph
    date: "2026-11-02"
    title: A graph of stages and roles, two ways to run a role
    changed: A harness-neutral agent core with an MCP tool server, a stage machine in plain code, role agents (Clarifier, Modeller, Verifier, Designer) on Deep Agents, and a second arm that drives the same roles through Claude Code.
    why: Keeping the stage order in code, not in a prompt, makes each stage gate-able. Two harnesses let the same task be run on different models without changing the graph.
    showed: The first runs failed at stage 2 for harness reasons (spec items lost silently, stale test files, a model API mismatch). The fixes came out of one diagnosis.
    prs: [12, 13, 14, 15]
    links: [docs/agent_core.md, docs/agent.md]
  - id: t_roles
    date: "2026-11-03"
    title: Per-role models and the test writer
    changed: Each role picks its own model and effort. The test-writer role's failures were diagnosed from run records and fixed in code.
    why: One role spent the whole stage budget so the Verifier never got a turn, and a repair visit deleted the Verifier's own files.
    showed: The fixes are plain code (a turn reserve, files kept across repair), not prompt wording.
    prs: [18, 21]
    links: [docs/role_models.md, docs/test_writer.md]
  - id: t_bench
    date: "2026-11-04"
    title: A frozen benchmark with hidden tests
    changed: Benchmark tasks with a spec, hidden tests the agent never sees, reference RTL and mutants, split into development and held-out, then reviewed and re-frozen; a course tier of larger projects added.
    why: Success has to be decided by something the agent cannot influence. Development tasks are for fixing the agent; held-out tasks are for deciding.
    showed: Review found blockers and fixed them before any scored run. Every later change to frozen content has a dated amendment.
    prs: [19, 32, 33, 42]
    links: [benchmark/AMENDMENTS.md, benchmark/FROZEN.md]
  - id: t_floors
    date: "2026-11-05"
    title: Gates the agent cannot lower
    changed: The harness runs coverage and mutation testing itself, gate messages name what is missing, and V3 thresholds have floors the agent's plan cannot lower.
    why: A live run set its own mutation threshold low in its own test plan and passed V3 with few mutants evaluated.
    showed: The floors are now fixed numbers in a file the agent never writes (mutation score floor {fl_mut} percent, at least {fl_mineval} mutants evaluated).
    prs: [27, 31, 34, 40, 41]
    links: [flow/verif_floors.yaml, results/05l]
  - id: t_devruns
    date: "2026-11-06"
    title: Development runs expose faults, and a fix follows each
    changed: Runs of course tasks on the Claude Code arm, each followed by a fix to the agent for the fault it exposed.
    why: Reading single failed runs generates hypotheses cheaply. A fix that corrects a measuring-instrument fault needs no statistics.
    showed: "{d_esc} of {d_runs} development runs were escapes: the agent's own checks passed and the hidden tests failed (card below)."
    prs: [45, 47, 49, 52, 55, 56, 57, 58, 59, 60, 61, 69, 70]
    experiment: x_devruns
    links: [results/course]
  - id: t_eval1
    date: "2026-11-09"
    title: Grader check, pre-registration, and a held-out evaluation that was stopped
    changed: A check of the graders found two faults in the benchmark's own bench and spec; eval-1 was pre-registered and started, then stopped before any result was analysed.
    why: A scored evaluation is only worth running once the measuring instrument is trusted, and its method is fixed in advance.
    showed: eval-1 has no score. Later evaluations pin the CLI binary and turn off its auto-update.
    prs: [72, 73, 75, 77]
    experiment: x_eval1
    links: [docs/eval/eval1_preregistration.md]
  - id: t_beyond
    date: "2026-11-10"
    title: Gates where the standard flow is silent
    changed: A review of the agent's core and gates, a stronger CDC gate, and measured timing-exception checks.
    why: Where the standard tool flow reports nothing, the agent can pass a design that fails on the board.
    showed: The tool's own CDC report alone flags {c_tool} of {c_mut} faulty designs; the new gate flags {c_gate} (card below).
    prs: [83, 85, 99, 110]
    experiment: x_cdc
    links: [results/16_cdc_gate_2026_1, results/20_timing_exceptions_2026_1]
  - id: t_kb
    date: "2026-11-11"
    title: Routing knowledge, harness arms and faster builds
    changed: Skill routing and retrieval behind a flag, three pre-registered harness arms (H1, H2, H9), and a build cache for Vivado.
    why: Each is a plausible gain, and each was measured before it was adopted.
    showed: Routing was a null. H1 and H9 lowered cost and H2 showed no difference. The build cache cut the build sequence against a modelled no-cache time, with identical results.
    prs: [114, 115, 118, 123, 130, 145]
    experiment: x_routing
    links: [results/36_skill_routing, results/42_workflows, results/33_vivado_speed_2026_1]
  - id: t_2026_1
    date: "2026-11-12"
    title: Vivado 2026.1 for everything published
    changed: The flow moved to Vivado 2026.1 and every published number was re-measured on it or withdrawn.
    why: A number measured on an older release does not describe the tool the reader will use.
    showed: Some results were identical on the new release; some could not be repeated and were withdrawn. Vivado 2026.1 needs its free licence installed to start at all, which the earlier release did not.
    prs: [126, 128, 134]
    links: [results/33_vivado_speed_2026_1, results/vivado_2026_1_remeasure]
  - id: t_closure
    date: "2026-11-12"
    title: A closure loop and a design-time timing plan
    changed: When a design passes simulation but misses timing, a loop edits the RTL, re-checks it on an independent bench, rebuilds and repeats; a plan chooses DSP and block RAM use before the first build.
    why: Timing repairs are routine work that the agent should do itself.
    showed: One case closed in a single iteration both with and without the plan, one seeded case also closed, and two seeded cases stopped at the iteration limit (card below).
    prs: [140]
    experiment: x_closure
    links: [results/62a_closure, docs/closure_loop.md]
  - id: t_doc
    date: "2026-11-13"
    title: The agent documents its own work
    changed: A documentation standard and checker, a handover file that code fills from the run's records, and a DOC step in which the Designer writes the prose.
    why: Anything the agent produces is held to the standard of a human engineer's hand-over, so the next engineer can pick it up.
    showed: An independent re-review of three agent-written handovers found claims the records did not support, and the DOC step's prompt and checks were tightened.
    prs: [154, 157, 159]
    links: [docs/documentation_standard.md, results/68_agent_docs]
  - id: t_checks
    date: "2026-11-14"
    title: One check tool with a registry
    changed: A single check tool and registry, with reset rules; the first version of the reset check read source text with regular expressions.
    why: Gates should be code with tests. A text scanner is not a sound HDL front end.
    showed: Three adversarial reviews each defeated the regular-expression scan, so it was replaced by elaboration with Yosys and slang or GHDL, failing closed.
    prs: [163, 164]
    links: [flow/doccheck.py]

experiments:
  - id: x_models
    verdict: negative
    date: "2026-10-31"
    order: 1
    title: Does a cheaper open-weight model match the base model?
    question: Can one of the cheaper open-weight models (z-ai/glm-5.3-flash or deepseek/deepseek-v4.1-flash-1017) replace the base model openai/gpt-6-luna for writing RTL at lower cost?
    setup: "The {f1_probs} CVDP evaluation problems, the same LangGraph agent harness for every arm, the base model run once and each candidate two or three times. Pre-registered before any scored run: the problems, the settings and the rule for picking. Pass rate is the hidden benches' verdict; no language model scores anything."
    result: "Paired against the base ({f1_base} percent pass rate), glm-5.3-flash differed by {f1_g_est|plus} points (interval {f1_g_lo} to {f1_g_hi}), which is no detectable difference. deepseek-v4.1-flash-1017 was worse, by {f1_d_est|abs} points (interval {f1_d_lo} to {f1_d_hi}), with a pooled pass rate of {f1_d_pool} percent."
    interval: "{f1_level} percent paired bootstrap over problems. Cost was reported incompletely for the candidates, so its comparison is a lower bound only."
    decision: The base model stays. The screen's rule picked it.
    lesson: A cheaper model's price advantage is not evidence of equal quality. Pair the comparison on the same problems and read the interval, not the two means.
    plot: models
    detail:
      - "glm-5.3-flash pooled pass rate: {f1_g_pool} percent over its runs; the interval includes zero, so this is a null, not a tie."
    prs: [4, 6]
    links: [results/f1b/PREREG.md, results/f1b/paired_eval86.md]
  - id: x_base
    verdict: inconclusive
    date: "2026-11-01"
    order: 2
    title: Which open-weight model to fine-tune
    question: Which of two open-weight code models is the better base for a later fine-tune?
    setup: Two open-weight models (qwen3.6-35b-a3b and qwen3-coder-30b-a3b-instruct, the latter run twice) through the same harness on the same {p0_n} problems through a paid inference service, with a per-run spend guard. Pre-registered, including the rule that a run stopped by the guard is void.
    result: "The spend guard ended {p0_a}, {p0_b} and {p0_c} of the {p0_n} problems in the three runs. Under the pre-registered rule all runs are void, so no model is recommended."
    interval: None. No paired comparison was made, because every run was void.
    decision: No base was chosen. The result is recorded as inconclusive.
    lesson: A guard that is too tight turns an experiment into noise. Size the guard from a pilot, not from a budget.
    prs: [10]
    links: [results/p0/REPORT.md, results/p0/SUMMARY.md]
  - id: x_mutation
    verdict: win
    date: "2026-11-01"
    order: 3
    title: Do the agent's own tests detect broken designs?
    question: Does a test bench that passes on the correct design also fail on a design with a deliberate fault?
    setup: "{m_n} hand-written mutants (operator, constant, condition and reset faults) of T1, run against the bench alone and against the bench with the bound assertion checkers. First full run, then a re-run after one new test."
    result: "The first full run killed {m_first} percent of the mutants ({m_surv} survived, both reset-state faults no test looked at). The bound checkers killed none that the bench missed ({m_first_chk} percent). After a test for reset state was added, {m_final} percent."
    interval: One design, one seed, hand-written mutants. A score, not an estimate with an interval.
    decision: The first-run figure is the unbiased one. The harness now runs mutation testing itself, and V3 floors that the agent's plan cannot lower are fixed in a file.
    lesson: A bench can look complete and miss reset-state faults. Measure it with mutants, and report the score from before the bench was fixed.
    detail:
      - "A live run later set its own mutation threshold low in its test plan and passed V3 on few evaluated mutants. The floors are {fl_mut} percent mutation score and {fl_toggle} percent toggle coverage, with at least {fl_mineval} mutants evaluated."
    prs: [11, 31, 34, 40]
    links: [results/04f/mutation_t1.json, results/05l/mutation_t1_harness.json, flow/verif_floors.yaml]
  - id: x_devruns
    verdict: mixed
    date: "2026-11-09"
    order: 4
    title: Does the agent's own check catch a misread spec?
    question: When the agent's own tests and gates pass, do the hidden tests also pass?
    setup: "{d_runs} development runs on {d_tasks} course tasks, one model (claude-sonnet-5-5 through Claude Code). Hidden tests the agent never sees decide the outcome. The agent was changed between runs to fix what each run exposed, so the runs are not independent samples."
    result: "{d_pass} of {d_runs} runs passed every hidden test. {d_esc} were escapes: the agent's own checks passed and the hidden tests failed, every one from reading the spec differently from the tests."
    interval: "Development tasks, changed between runs: no interval is meaningful, and none is claimed as a pass rate for new tasks."
    decision: The agent's own testbench never counts as a pass. Escapes went to the spec interview, to gates in code, and to the benchmark itself where a task left a behaviour unstated.
    lesson: A model's test shares the model's misreading, so passing needs a check the model did not write. The runs of one task show the loop working (below).
    plot: c14_runs
    prs: [45, 47, 49, 52]
    links: [results/course/c14_int8_dot_requant, results/course]
  - id: x_routing
    verdict: "null"
    date: "2026-11-11"
    order: 5
    title: Does routing the right skill to a role help?
    question: Would a router that picks skills for each role, and a hybrid keyword and vector index, help the agent find the right knowledge?
    setup: "Retrieval on {r_tasks} labelled development tasks against a catalogue of {r_skills} skills, then an end-to-end comparison with the router off and on, {r_runs} runs per arm, the low-cost model gpt-6-luna, stopping after stage 2. Pre-registered; later arms marked post hoc."
    result: "Retrieval recall at six skills was {r_t0} for the plain index, {r_hyb} for the hybrid index and {r_r1} for the router's classifier. End to end, hidden-test passes were {r_off_pass} with the router off and {r_router_pass} on; stage 2 gates passed in {r_off_gate} and {r_router_gate} runs."
    interval: Three runs per arm cannot show a difference in pass rate, and none is claimed.
    decision: The router stays behind a flag and is not adopted.
    lesson: In the traces the roles hardly used the new tools and kept calling the old one, so the intervention was never exercised. Check that a tool is used before measuring what it does. The by-product was a bug where a multi-skill load silently dropped the middle of each skill, fixed on one case.
    prs: [114, 115]
    links: [results/36_skill_routing/PREREG.md, results/36_skill_routing/e2e.md, results/36_skill_routing/retrieval.md]
  - id: x_harness
    verdict: mixed
    date: "2026-11-12"
    order: 6
    title: Does changing the harness around the model change cost and success?
    question: Do context management (H1), hang protection (H2) or typed report digests (H9) cut tokens, cost or wall time without losing hidden-test passes?
    setup: "{h_tasks} tasks, {h_repeats} repeats, four arms (the baseline A0 and H1, H2, H9), {h_valid} valid runs of {h_started}, the low-cost model gpt-6-luna, stopping after stage 2 (no Vivado). Each task and repeat is a block with all four arms in rotated order. Pre-registered adopt rule: a primary metric at least {h_bar} percent better with an interval that excludes zero, and no loss of tests passed."
    result: "H1 lowered cost by {h1_cost_est|abs} percent (interval {h1_cost_lo} to {h1_cost_hi}) but tokens by {h1_tok_est|abs} percent with an interval that includes zero (to {h1_tok_hi|plus}), so it met the rule on one reading and not the other. Its wall time fell {h1_wall_est|abs} percent but the interval includes zero once the blocks with a run stopped by the time limit are left out. H2 lowered cost by {h2_cost_est|abs} percent (interval {h2_cost_lo} to {h2_cost_hi}): no difference detectable. H9 lowered cost by {h9_cost_est|abs} percent, below the bar. {h_base_pass} of {h_runs} blocks passed the hidden tests in the baseline and {h1_pass} in H1; two of the {h_tasks} tasks were passed by no arm."
    interval: Percentile bootstrap over the {h_runs} blocks, paired against the baseline. With this few blocks only a very large effect is visible.
    decision: No arm was adopted by the pre-registered rule. The project owner then made H1 the default for development runs after seeing the data, which is recorded as a decision made after the data. Re-measure on more tasks before quoting a saving.
    lesson: The adopt rule said "tokens per run (and cost)" without saying how to read "and". Write the rule so it cannot be read two ways. H2 solved a problem that was too rare in the round to compare.
    plot: harness
    prs: [123, 130, 145]
    links: [results/42_workflows/README.md, results/42_workflows/analysis.md, results/42_workflows/prereg.md]
  - id: x_cdc
    verdict: win
    date: "2026-11-10"
    order: 7
    title: Does a deterministic CDC gate beat the tool's own report?
    question: Does a gate that checks the structure of the asynchronous paths and simulates with injected synchroniser delay catch clock-crossing faults that the tool's own CDC report does not?
    setup: "{c_ok} correct and {c_mut} deliberately faulty small designs (fixtures), synthesised on Vivado 2026.1, xc7a100tcsg324-1. Columns: the tool's CDC report alone, a structure check, a cycle-level simulation with injected delay (three seeds) and the new gate."
    result: "The tool's CDC report alone flagged {c_tool} of the {c_mut} faulty designs. The new gate flagged {c_gate} of {c_mut}, with {c_false} false alarms on the {c_ok} correct designs. The table was identical on the re-measurement on Vivado 2026.1."
    interval: Fixtures are small hand-written designs, not a sample of real designs, so this is a detection table, not a rate. The simulation injection is cycle-level with no timing window. Faults found in the soak rig (M9 and M11) were not re-run on Vivado 2026.1 and are withdrawn.
    decision: The gate was merged into the flow and replaces reliance on the tool's report alone.
    lesson: Where the standard tool is silent, a small deterministic check can be decisive. Seed the fault yourself and show which check sees it.
    prs: [85]
    links: [results/16_cdc_gate_2026_1/mutant_table.md, results/16_cdc_gate_2026_1]
  - id: x_exceptions
    verdict: win
    date: "2026-11-11"
    order: 8
    title: Do timing exceptions hide failures, and can a gate see them?
    question: Can a timing exception (a false path or multicycle path) hide a real failure, and does a gate flag the harmful ones without flagging the correct ones?
    setup: "{x_rows} drill designs on Vivado 2026.1, each with an exception that is either correct or harmful (too broad, a typo that matches nothing, a false path over a binary bus), re-timed without the exception and after routing."
    result: "The gate's verdict matched the expected verdict on {x_ok} of {x_n} drills, of which {x_flag} were expected to be flagged. A further row of the {x_rows} is an alternative design with no exception and no expected verdict."
    interval: Fixtures, one run each. The drills show the gate's logic; they say nothing about how often real designs have such exceptions.
    decision: The exceptions gate is part of the build flow. A later fix stopped it failing every build with a debug core, whose own ignored exceptions it had counted as the design's.
    lesson: A gate that fails every build is as broken as one that passes every build. Test it on a clean design and on a faulty one.
    prs: [99, 110, 120]
    links: [results/20_timing_exceptions_2026_1/exceptions_table.md, results/20_timing_exceptions_2026_1]
  - id: x_closure
    verdict: mixed
    date: "2026-11-12"
    order: 9
    title: Can the agent repair a timing miss by itself?
    question: Can a loop that edits the RTL, re-checks it on an independent bench and rebuilds close a timing miss, and does a design-time plan help?
    setup: "Vivado 2026.1, xc7a100tcsg324-1, whole-board builds. The RTL writer was gpt-6-luna. One run per case: c13_hough_lines with and without the plan, and {cl_seed_n} seeded misses made by raising a task's clock. The hidden bench is always the acceptance check."
    result: "c13_hough_lines closed in one iteration, from {cl_np_start} to {cl_np_end} ns of worst slack without the plan. Of {cl_seed_n} seeded misses, {cl_seed_closed} closed; c14_int8_dot_requant stopped at the {cl_c14_it}-iteration limit at {cl_c14_end} ns (from {cl_c14_start}) and c11_nco_mixer at {cl_c11_end} ns (from {cl_c11_start}). When the RTL was written with the plan, none of {cl_w_attempts} attempts passed the hidden bench, so no first build with the plan exists."
    interval: "None: one run per case, so these are illustrations, not rates. Two builds of the same unchanged RTL differed by about {cl_noise} ns of slack."
    decision: The loop stays as a repair tool with its limits stated. The plan's comparison on other designs is not run.
    lesson: An early with-plan run accepted a design whose core had been removed by synthesis; Icarus allowed two blocks driving the same registers and Vivado tied them to ground. That run is not counted, and it is why a synthesis guard exists. A passing simulation is not a passing build.
    prs: [140]
    links: [results/62a_closure/README.md, results/62a_closure]
  - id: x_speed
    verdict: mixed
    date: "2026-11-11"
    order: 10
    title: Do more threads or a build cache make Vivado runs faster?
    question: Does the thread count change results or time, and can a cache and resumed builds cut an agent run's build time without changing the result?
    setup: Fresh builds of three designs on Vivado 2026.1, one at a time under a {b_cap} GB memory cap, at one, two and four threads, and one agent run's build sequence replayed with and without the cache.
    result: "Placement and routing hashes and slack were identical at every thread count. The mid-size design c13 took {b_c13_t1} s at one thread and {b_c13_t4} s at four; the small design c10 showed no measurable gain. The cache cut one agent run's build sequence by {b_c10_save} percent on c10 and {b_c13_save} percent on c13, with identical hashes and slack."
    interval: Two runs per thread count, other jobs shared the PC that night, so wall times carry that load. The no-cache time is modelled from the measured fresh-build stages.
    decision: The build cache is part of the flow. Threads stay at one under the memory cap, since results are identical and the gain was small.
    lesson: Check the result is identical before you celebrate a speed-up. Several figures from the earlier release were withdrawn because they could not be repeated under the new memory cap.
    prs: [118]
    links: [results/33_vivado_speed_2026_1/README.md, results/33_vivado_speed_2026_1/results.md]
  - id: x_eval1
    verdict: stopped
    date: "2026-11-09"
    order: 11
    title: "The first held-out evaluation (eval-1): stopped, no score"
    question: What fraction of {e_tasks} held-out tasks does the agent solve, with {e_reps} runs each?
    setup: "Pre-registered before any scored run: {e_tasks} tasks, {e_reps} runs each, scored by hidden tests, a task-level bootstrap, with a planned half-width of {e_half} points. The agent, knowledge bank and benchmark were frozen at the tag eval-1."
    result: "Stopped before analysis. {e_launched} of the {e_slots} run slots had been launched and {e_scored} runs were scored; {e_notrun} ended as not run because Claude Code updated itself between two launches and the agent refuses an untested CLI version. No result is reported."
    interval: None. No score exists.
    decision: The project owner stopped it, because it could not finish in time and the benchmark was too small for the goals. This was a scope decision, not a reaction to results. The tag stays as a record. Later evaluations pin the CLI binary with a version check, and a new tag and pre-registration come with a baseline evaluation on the larger benchmark.
    lesson: Pin every tool that is not under test, including the one that runs the agent. Some held-out tasks had their pass counts seen, so they moved to development, and no fix was derived from them.
    prs: [73, 75, 77]
    links: [docs/eval/eval1_preregistration.md, benchmark/AMENDMENTS.md]

