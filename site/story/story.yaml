runs_plot:
  title: One task, five runs, a fix after each
  source: site/data/dev.json
  list: runs_list
  where: task=c14_int8_dot_requant
  fix_after:
    1: [45, "Ask for a register map that is not given; do not invent one"]
    2: [47, "Top-level port names must be board constraint names"]
    3: [49, "Show the first simulator exception, and import-check test files"]
    4: [52, "Put the assertion checkers in every Verilator build"]

method:
  - title: Hidden tests decide
    text: A task's tests are written from its spec and never shown to the agent. Passing means the hidden tests pass, the code-run gates pass and, for hardware tasks, the board agrees. The agent's own testbench never counts, and no language model ever produces a score.
  - title: Repeats and pairs
    text: The agent is stochastic, so every task runs several times ({e_reps} in the first evaluation) and two versions of the agent are compared on the same tasks, with an interval, not two means. With {e_tasks} tasks a pass rate was planned to be known to about plus or minus {e_half} points, which shows a large difference and not a small one.
  - title: Development and held-out
    text: Development tasks are for finding and fixing faults. Held-out tasks decide, are touched rarely, and a fix is never derived from them. Where one was seen, as in eval-1, it moves to development.
  - title: Nothing leaks
    text: Knowledge comes from documentation, never from the benchmark. A leak guard fails the site build if text from private tasks appears, and during scored runs the agent searches only a frozen library.
  - title: Pre-register, then pin
    text: Before a scored run the arms, tasks, repeats, comparisons and stopping rules are written down and committed. The CLI, model and tool versions are pinned and recorded with every run.
  - title: Change one thing
    text: A measurement changes one thing at a time. When several changes ship together, nothing is attributed to any of them. A correctness bug in the measuring instrument is the exception, and is fixed on one case.
  - title: Retire, do not delete
    text: An evaluation is retired when it is saturated, no longer measures what is wanted, is contaminated, is not comparable after a change to the tools, or is too noisy. It becomes a regression suite. eval-1 was retired by a scope decision before it produced a score.

findings:
  - {pr: 14, cause: Harness or instrument, finding: "Spec items were lost silently, the reference model and the RTL disagreed on an interface, and stale test files stayed in the build.", fix: "A schema so no spec item is lost, one model contract with a check, and superseded tests deleted."}
  - {pr: 21, cause: Cost or budget, finding: "The RTL writer used a stage's whole budget so the Verifier never got a turn.", fix: "A turn reserve per role, and files kept across repair visits."}
  - {pr: 40, cause: Verification, finding: "A live run set its own V3 thresholds low in its own plan and passed.", fix: "Fixed floors in a file the agent never writes, and a minimum number of evaluated mutants."}
  - {pr: 45, cause: Spec and clarification, finding: "The agent invented a register map that only the hidden spec held, and never asked for it.", fix: "The Clarifier must ask for a map that is not given, and the oracle answers with the whole map."}
  - {pr: 47, cause: Constraints and closure, finding: "A top-level port was named LED0 where the board constraints and the bench use the bus LED.", fix: "Rule FDA-CON-7: a port must be a master-constraints name or a bus of one."}
  - {pr: 49, cause: Tools, finding: "The simulate summary showed a follow-on error and hid the first exception.", fix: "The first exception is put at the head, and test files are import-checked before pytest starts."}
  - {pr: 52, cause: Verification, finding: "The assertion checkers were not in the Verilator builds, so cover properties read as zero.", fix: "Checkers are added to every Verilator build, and stage 2 gets more visits."}
  - {pr: 64, cause: Tools, finding: "The Claude Code CLI updated itself and the arm refused the untested version.", fix: "The accepted version list was updated after a live tool-text check; later evaluations pin the binary."}
  - {pr: 72, cause: Harness or instrument, finding: "A hidden bench read a high-impedance value from a legal design (a pull-up the simulator drops on a variable port), and a spec left a weight encoding unstated.", fix: "The bench resolves the pull for both port styles, the spec states the encoding, and a pin scan covers every bench.", kind: instrument}
  - {pr: 83, cause: Constraints and closure, finding: "Scoped XPM constraints were not applied, so a clock crossing showed negative slack with no exception.", fix: "A script applies them after synthesis, and a probe design records the effect."}
  - {pr: 83, cause: Verification, finding: "Skipped and expected-fail tests were counted as passing tests.", fix: "The gate counts them as not passing."}
  - {pr: 83, cause: Tools, finding: "A timed-out build left Vivado running.", fix: "The runner gets its own process group and kills it."}
  - {pr: 115, cause: Knowledge bank, finding: "A call that loaded several skills overflowed the output limit and silently cut the middle out of each.", fix: "Whole skills are returned up to the limit, and those held back are named."}
  - {pr: 120, cause: Tools, finding: "The exceptions gate failed every build with a debug core, whose own ignored exceptions it counted as the design's.", fix: "Those are information, and the design's own still fail."}
  - {pr: 132, cause: Tools, finding: "A test run moved the checkout it ran from.", fix: "A session guard compares branch and head, and git variables are scrubbed from child processes."}
  - {pr: 134, cause: RTL, finding: "A benchmark reference design missed timing on Vivado 2026.1.", fix: "Two pipeline stages were added under a dated amendment, with the acceptance tests and mutants unchanged."}
  - {pr: 140, cause: Verification, finding: "A closure run accepted a design whose core synthesis had removed.", fix: "A synthesis guard, and the run was marked invalid and not counted."}
  - {pr: 159, cause: Prompts and context, finding: "Independent review found claims in agent-written handovers that the records did not support.", fix: "The DOC step's request and checks were tightened, and the handovers regenerated."}
  - {pr: 164, cause: Tools, finding: "Three adversarial reviews each defeated the regular-expression source scan of the reset check.", fix: "Replaced by elaboration, failing closed, with a regression set and attack designs."}

lessons:
  - claim: The agent's own checks are not a pass.
    evidence: "{d_esc} of {d_runs} development runs passed their own checks and failed the hidden tests, each from a spec read differently."
    links: [site/data/dev.json]
  - claim: Where the standard tool is silent, a deterministic gate can see the fault.
    evidence: "The tool's own CDC report alone flagged {c_tool} of {c_mut} faulty designs; the gate flagged {c_gate}, with {c_false} false alarms on {c_ok} correct designs."
    links: [results/16_cdc_gate_2026_1/mutant_table.md]
  - claim: A test bench that looks complete can miss reset-state faults.
    evidence: "The first full mutation run killed {m_first} percent of {m_n} mutants; the survivors were both reset-state faults."
    links: [results/04f/mutation_t1.json]
  - claim: A cheaper model is not evidence of equal quality.
    evidence: "Paired over {f1_probs} problems, one cheaper model was {f1_d_est|abs} points worse (interval {f1_d_lo} to {f1_d_hi}) and the other showed no detectable difference."
    links: [results/f1b/paired_eval86.md]
  - claim: A tool the roles do not use cannot be measured.
    evidence: "With the router on, end-to-end hidden passes were {r_router_pass} and with it off {r_off_pass}; the roles hardly called the new tools."
    links: [results/36_skill_routing/e2e.md]
  - claim: Few blocks show only large effects, and a rule needs one reading.
    evidence: "H1 lowered cost by {h1_cost_est|abs} percent (interval {h1_cost_lo} to {h1_cost_hi}) and tokens by {h1_tok_est|abs} percent (interval to {h1_tok_hi|plus}), so the adopt rule gave two answers."
    links: [results/42_workflows/analysis.md]
  - claim: One run per case is an illustration, not a rate.
    evidence: "{cl_seed_closed} of {cl_seed_n} seeded timing misses closed, and none of {cl_w_attempts} attempts to write RTL with the design-time plan passed its hidden bench."
    links: [results/62a_closure/README.md]
  - claim: Pin every tool that is not under test.
    evidence: "{e_notrun} of the {e_slots} eval-1 slots ended as not run after an automatic CLI update."
    links: [docs/eval/eval1_preregistration.md]
  - claim: A speed-up counts only with an identical result.
    evidence: "The build cache cut an agent run's build sequence by {b_c10_save} and {b_c13_save} percent on two designs with identical placement and routing hashes."
    links: [results/33_vivado_speed_2026_1/README.md]
