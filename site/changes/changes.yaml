# What changed in the agent since 23 November 2026 (brief 237). Rendered by site/changes.py into site/src/changes.html's body.
# Prose holds no typed numbers: a figure is a {name} placeholder whose value is read from a committed file by one of site/expertise.py's
# expressions (the same rule and the same expressions as the story page). Every PR must be in changes/merged_prs.json and every path must exist.
# Headlines are in plain words and name the model; a result that was not measured is said to be so.
text:
  intro: "These are the changes to FPGA Force from 23 November 2026, each with what it does in plain words, what was shown (a headline from a committed record, with the model that did the work), what it does not show, and the evidence. {changes_n} merged pull requests are covered. Nothing here is a held-out score: no held-out evaluation of FPGA Force has been run."
  how_to_read: "Each change is a drawer. The first line says what changed; the result line says what a record shows and which model produced it; the limits line says what that result cannot tell you. The pull request links go to the change itself; the evidence links go to the committed files that every figure here is read from."
values:
  kr_reached: {source: results/209_kr260_pilot/README.md, expr: 're:Reached a bitstream[^:]*: (\d+) of \d+ runs'}
  kr_runs: {source: results/209_kr260_pilot/README.md, expr: 're:Reached a bitstream[^:]*: \d+ of (\d+) runs'}
  kr_cut_runs: {source: results/209_kr260_pilot/README.md, expr: 're:All (\d+) runs of p4, p5 and p6 failed'}
  kr_cost: {source: results/209_kr260_pilot/README.md, expr: 're:Cost: ([\d.]+) USD real'}
  kr_second_spent: {source: pilots/224/STOPPED, expr: 're:cumulative real dollars ([\d.]+) above'}
  kr_second_cap: {source: pilots/224/STOPPED, expr: 're:above (\d+)'}
  cvdp_sample: {source: results/215_public_benchmarks/README.md, expr: 're:stratified sample of (\d+) of the \d+ problems'}
  cvdp_all: {source: results/215_public_benchmarks/README.md, expr: 're:stratified sample of \d+ of the (\d+) problems'}
  req_t1_a: {source: results/210_requirements/README.md, expr: 're:The first has (\d+) of \d+ requirements passed'}
  req_t1_n: {source: results/210_requirements/README.md, expr: 're:The first has \d+ of (\d+) requirements passed'}
  req_t1_b: {source: results/210_requirements/README.md, expr: 're:the second (\d+) of \d+ passed'}
  sva_after: {source: results/218_coverage_sva/README.md, expr: 're:\*\*After:\*\* (\d+) requirement rows'}
  sva_cand: {source: results/218_coverage_sva/README.md, expr: 're:out of (\d+) candidate rows'}
  sva_designs: {source: results/218_coverage_sva/README.md, expr: 're:three pilot designs'}
  seu_variants: {source: results/b194/README.md, expr: 're:(\d+) variants x \d+ targets x \d+ trials'}
  seu_targets: {source: results/b194/README.md, expr: 're:\d+ variants x (\d+) targets x \d+ trials'}
  seu_trials: {source: results/b194/README.md, expr: 're:\d+ variants x \d+ targets x (\d+) trials'}
