  rec_menu: {source: results/216_closure_recipes/README.md, expr: 're:at 6 runs is [\d.]+ ns guided, ([\d.]+) menu order'}
  rec_random: {source: results/216_closure_recipes/README.md, expr: 're:menu order, ([\d.]+) random'}
