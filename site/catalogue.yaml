# Problem catalogue: domain and survey row of each development task, and the showcase choices.
# Domains are the letters of the benchmark v2 coverage survey (brief 10 B-1, version 2, 2026-11-09); the survey row is
# the row whose coverage column names the task. Descriptions (what/where) are in catalogue_parts/*.yaml, written fresh
# from spec.md; export.py fails if a digit in a description is not in the task's spec.md or hidden/spec.yaml.
domains:
  A: Basic digital design drills
  B: DSP
  C: Communications, SDR and coding
  D: Cryptography and security
  E: Ethernet and networking
  F: Interfaces and protocols
  G: Memory and storage
  H: Video and image processing
  I: Machine learning inference
  J: Processors, SoC and embedded software
  K: Control, motors and robotics
  L: Test and measurement
  M: Clocking, CDC and resets
  N: HPC, acceleration and data processing
  O: Audio
  P: Verification and debug
  Q: High reliability
  R: Other commonly attempted
  S: Computer vision
  T: High-speed serial transceivers
boards:
  nexys_a7_100t: Nexys A7-100T
showcase: [t1_elevator_fsm, c10_dds_sine, c16_nexys_aes_uart, c9_median3x3, c14_systolic_matmul]
