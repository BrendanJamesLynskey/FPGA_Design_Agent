- id: arithmetic
  name: Arithmetic
  summary: Widths and rounding, saturation, fixed-point datapaths, modular multiplication and quantised neural-network arithmetic.
  kb: [techniques/arithmetic, techniques/hardware-algorithms, functions/crypto, functions/dsp~fixed-point, family/artix7/dsp, vendor/vivado_synthesis/synthesis-attributes~datapath]
  checks: []
  evidence:
  - kind: agent
    source: [results/course/c14_int8*/run_*.json, results/course/c15_softmax*/run_*.json, results/course/c16_montgomery*/run_*.json]
    where: split=dev
    values: [n, "count:hidden_pass=true", "count:outcome=escape", "count:outcome=fail"]
    text: "Development runs of the int8 dot product, softmax and Montgomery multiplier tasks: {0} runs, hidden tests all passed in {1}, escapes {2}, failures {3}."
  cards: []
