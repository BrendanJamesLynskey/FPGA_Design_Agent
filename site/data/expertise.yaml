       family/artix7/logic-fabric, vendor/ross_distilled/lint, procedures/ultrafast~rtl-design|synthesis, vendor/vivado_synthesis/synthesis-attributes]
  checks:
  - {file: agent/graph/stages.py, gate: standards_rtl, enforced: true, what: "Design standards on the RTL: no latches, no combinational loops, no gated clocks, synchronous resets, declared crossings."}
  - {file: flow/gates.py, gate: rtl_methodology_no_critical, enforced: true, what: "Methodology checks on the elaborated design, then after synthesis: no Critical Warning."}
  - {file: flow/lint.sh, enforced: false, what: "Verilator lint, run before the stage can end."}
  evidence:
  - kind: agent
    source: results/course/*/run_*.json
    where: split=dev
    values: [n, "count:hidden_pass=true", "count:outcome=escape", "count:outcome=fail"]
    text: "Across all development runs: {0} runs, hidden tests all passed in {1}, escapes (own checks passed, hidden tests failed) {2}, failures {3}."
  cards:
  - {href: "flow-notes.html#gates", label: "Beyond the flow: gates beyond Vivado's own"}
  gaps:
  - "Every escape so far was a misreading of the specification; the gates cannot catch a spec error the agent's own tests share."
  - "These are development tasks, not the held-out score."
- id: fsm
  name: Finite state machines
  summary: Separating control from datapath, choosing the clock and any multicycle ratio, registering inputs and outputs, encoding, reset, and coverage.
  kb: [techniques/fsm, family/artix7/fsm, techniques/reset~reset-strategy, techniques/counters-and-timers, techniques/pipelining-handshakes~valid-ready]
  checks:
  - {file: flow/standards_check.py, gate: STD-RST-01, enforced: false, what: "Synchronous-reset rule, no latch and no combinational loop; part of the standards stage gate that covers all RTL."}
  evidence:
  - kind: example
    source: results/board_v2/t1_elevator_fsm.json
    values: [get:runs, get:passed]
    text: "A hand-built elevator controller (an FSM with timers) passed its on-board self-check in {1} of {0} run."
  cards: []
  gaps:
  - "Brief 24 (FSM measurements and coverage) is not merged: no committed measurement compares encodings, registered outputs, reset styles or an FSM split from its counter."
  - "No gate checks state or transition coverage; the owner's slow-FSM multicycle pattern is part of Brief 20."
  - "There is no FSM lesson in the course yet."
- id: verification
  name: Verification
  summary: Self-checking tests, assertions, formal checks, mutation testing, coverage, and CDC fault injection, staged V0 to V3 with a hardware step.
  kb: [techniques/verification, procedures/verification-stages, vendor/free_simulators/simulation, vendor/ross_distilled/simulation,
       vendor/amba_axi/simulation, techniques/debugging, family/artix7/cdc~verification]
  checks:
  - {file: flow/verif_gates.py, gate: mutation_score_pct, gate_in: flow/verif_floors.yaml, enforced: true, what: "V0 to V3: plan, traceability, passing tests on every seed, coverage and a mutation score, each at or above a floor the agent cannot lower."}
  - {file: flow/mutate.py, enforced: true, gate: mutant, what: "Mutation testing of the RTL against the agent's tests."}
  - {file: flow/formal.sh, enforced: false, what: "SymbiYosys jobs for bounded proofs."}
