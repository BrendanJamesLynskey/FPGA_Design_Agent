  - "HDMI and DisplayPort have skills but no design."
- id: arithmetic
  name: Arithmetic
  summary: Widths and rounding, saturation, fixed-point datapaths, modular multiplication and quantised neural-network arithmetic.
  about: "Arithmetic in hardware is mostly about widths: how many bits each step needs, how it rounds and when it saturates, across fixed-point datapaths, modular multipliers and quantised neural-network maths. No gate is specific to arithmetic; the hidden tests of the arithmetic tasks are the check."
  kb: [techniques/arithmetic, techniques/hardware-algorithms, functions/crypto, functions/dsp~fixed-point, family/artix7/dsp, vendor/vivado_synthesis/synthesis-attributes~datapath]
  checks: []
  evidence:
  - kind: agent
    source: [results/course/c14_int8*/run_*.json, results/course/c15_softmax*/run_*.json, results/course/c16_montgomery*/run_*.json]
    where: split=dev
    values: [n, "count:hidden_pass=true", "count:outcome=escape", "count:outcome=fail"]
    text: "The int8 dot-product, softmax and Montgomery-multiplier tasks had {0} development runs: {1} passed every hidden test, {2} were escapes and {3} failed."
  cards: []
  gaps:
  - "The int8 task escaped most often, and the misreading was of the spec, not of the arithmetic."
  - "Rounding modes and saturation are covered by skills, and only these tasks test them."
- id: rtl
  name: RTL design
  summary: Reading a specification, synthesisable coding, pipelines and handshakes, hierarchy and register boundaries, lint and synthesis messages.
  about: "RTL design is the core of the work: reading a spec, writing synthesisable code, pipelines and handshakes, hierarchy and register boundaries, and acting on lint and synthesis messages. One gate enforces the design standards on every run (no latches, no combinational loops, no gated clocks, synchronous resets), and another requires Vivado's methodology checks to show no critical warning."
  kb: [techniques/rtl-coding, techniques/spec-reading, techniques/integration, techniques/pipelining-handshakes, techniques/existing-code,
       techniques/arbitration-and-muxing, techniques/counters-and-timers, techniques/clocking, techniques/timing-concepts,
       family/artix7/logic-fabric, vendor/ross_distilled/lint, procedures/ultrafast~rtl-design|synthesis, vendor/vivado_synthesis/synthesis-attributes]
  checks:
  - {file: agent/graph/stages.py, gate: standards_rtl, enforced: true, what: "Design standards on the RTL: no latches, no combinational loops, no gated clocks, synchronous resets, declared crossings."}
  - {file: flow/gates.py, gate: rtl_methodology_no_critical, enforced: true, what: "Methodology checks on the elaborated design, then after synthesis: no Critical Warning."}
  - {file: flow/lint.sh, enforced: false, what: "Verilator lint, run before the stage can end."}
  evidence:
  - kind: agent
    source: results/course/*/run_*.json
    where: split=dev
    values: [n, "count:hidden_pass=true", "count:outcome=escape", "count:outcome=fail"]
    text: "Across all {0} development runs, {1} passed every hidden test, {2} were escapes (the agent's own checks passed, the hidden tests did not) and {3} failed."
  cards:
  - {href: "flow-notes.html#gates", label: "Beyond the flow: a missing report or skipped test looks like a pass"}
  gaps:
  - "Every escape so far was a misreading of the spec, and no gate can catch a spec error that the agent's own tests share."
  - "These are development tasks, not the held-out score."
- id: fsm
  name: Finite state machines
  summary: Separating control from datapath, choosing the clock and any multicycle ratio, registering inputs and outputs, encoding, reset, and coverage.
  about: "Finite state machines carry the control in most designs. The skills cover separating control from counters, what a register on an input or an output costs in latency and timing, choosing an encoding and a reset (including a reset inside a clock-enable branch), running a slow machine on one fast clock, and checking that the tests reach every state and every legal transition. The coverage check is an evidence file that the flow can add to the second verification stage; it is off unless asked for."
  kb: [techniques/fsm, family/artix7/fsm, techniques/reset~reset-strategy, techniques/counters-and-timers, techniques/pipelining-handshakes~valid-ready, vendor/free_simulators/simulation~fsm-coverage]
  checks:
  - {file: flow/standards_check.py, gate: STD-RST-01, enforced: false, what: "Synchronous-reset rule, no latch and no combinational loop; part of the standards stage gate that covers all RTL."}
  - {file: flow/fsm_coverage.py, gate: fsm_state_transition_coverage, gate_in: flow/verif_gates.py, enforced: false, what: "Reads the state register's value changes against the machine's state table: every state visited, every legal transition taken, none outside the table. Off unless the flag is given."}
  - {file: flow/cdc_structure.py, gate: synchroniser, enforced: false, what: "An input launched by another clock must pass two synchroniser registers; a direct use or a single register is flagged."}
  evidence:
  - kind: measured
    source: results/24_fsm_2026_1/summary.json
    values: [get:separation.sep_states, get:separation.sep_lut, get:separation.mono_states, get:separation.mono_lut, get:separation.sep_transitions, get:separation.mono_transitions]
    text: "One controller built in Vivado two ways with the same behaviour: {0} states plus a counter ({1} LUTs) and {2} states with the counter folded in ({3} LUTs). Folding was the smaller; the split machine has {4} transitions to cover instead of {5}."
  - kind: measured
    source: results/24_fsm_2026_1/summary.json
    values: [get:outputs.comb_slack_ns, get:outputs.registered_slack_ns, get:outputs.lookahead_latency_extra_clocks, get:outputs.registered_latency_extra_clocks]
    text: "At the test clock the slack from the state flops to an output pin was {0} ns with a decoded output and {1} ns with a registered one. A registered decode adds {3} clock of latency; registering the decode of the next state adds {2}."
  - kind: measured
    source: results/24_fsm_2026_1/summary.json
    values: [get:ratio.none, get:ratio.n2, get:ratio.n4, get:ratio.n8]
    text: "A state machine on a one-in-N clock enable, constrained with the multicycle pair on its own registers: slack between its registers was {0} ns without the exception and {1}, {2} and {3} ns at three enable ratios."
  - kind: measured
    source: results/24_fsm_2026_1/summary.json
    values: [get:coverage.designs, get:coverage.mutants_caught, get:coverage.mutants]
    text: "The coverage check passed on {0} designs with their real tests, and failed, naming the missed state or transition, in {1} of {2} runs with one test removed."
  - kind: example
    source: results/board_v2/t1_elevator_fsm.json
    values: [get:runs, get:passed]
    text: "A hand-built lift controller, a state machine with timers, passed its self-check on the board in {1} of {0} run."
  cards: []
  gaps:
  - "The coverage check is not an agent tool and is off by default, so the agent does not yet know its state table or write one."
  - "Routed numbers for output and input registering come from one controller on one part; the other families were probed in synthesis only."
  - "Two drills were built for the registered-output and zero-latency choices; see the brief report for how many agent runs were made."
- id: verification
  name: Verification
  summary: Self-checking tests, assertions, formal checks, mutation testing, coverage, and CDC fault injection, staged V0 to V3 with a hardware step.
  about: "The agent writes its own tests, assertions and formal checks, and they must reach staged floors that it cannot lower: a plan, traced requirements, tests passing on every seed, then coverage and a mutation score. Formal proofs run where the test plan promises one. Even so, the agent's tests never decide a pass; the hidden tests do."
  kb: [techniques/verification, procedures/verification-stages, vendor/free_simulators/simulation, vendor/ross_distilled/simulation,
       vendor/amba_axi/simulation, techniques/debugging, family/artix7/cdc~verification]
  checks:
  - {file: flow/verif_gates.py, gate: mutation_score_pct, gate_in: flow/verif_floors.yaml, enforced: true, what: "V0 to V3: plan, traceability, passing tests on every seed, coverage and a mutation score, each at or above a floor the agent cannot lower."}
  - {file: flow/mutate.py, enforced: true, gate: mutant, what: "Mutation testing of the RTL against the agent's tests."}
  - {file: flow/formal.sh, enforced: false, what: "SymbiYosys jobs for bounded proofs."}
  evidence:
  - kind: measured
    source: results/04f/mutation_t1.json
    values: [get:mutants, "get:first_run.score_pct", get:score_pct]
    text: "On the reference design, mutation testing made {0} valid changes; the tests caught {1} percent on the first run and {2} percent after the bench was fixed."
  - kind: agent
    source: results/course/*/run_*.json
    where: split=dev,gates.V3^=pass
    values: [n]
    text: "Of the development runs, {0} passed the coverage and mutation floors of the flow's last verification gate."
  cards:
  - {href: "flow-notes.html#gates", label: "Beyond the flow: a missing report or skipped test looks like a pass"}
  gaps:
  - "The agent's own tests never count as a pass, and several runs passed every gate yet failed the hidden tests."
  - "Formal checks are enforced only where the test plan promises a proof."
- id: hil
  name: Hardware in the loop
  summary: Sensing a design on the board and feeding the result back - UART self-checks, ILA in batch, XADC, in-FPGA instruments, audio at the jack - with a known answer and a seeded fault for each path, plus the soak rig for clock crossings.
  about: "Hardware in the loop means running designs on a real board and checking what they do against the same Python model the simulation uses. The board is programmed into volatile memory only. Each sensing path has a known answer, a pass rule and a seeded fault that must fail: registers over the serial link, an on-chip logic analyser run from a script, the die sensors, instruments built into the design (frequency, frame checksum, logic analyser), and a tone captured at the audio jack. A seeded pin fault passed simulation and every in-FPGA check and was caught only at the jack. Drivers for a USB scope and logic analyser, a spectrum analyser and a Red Pitaya exist but have only been tested on synthetic data, because none was connected. Board steps are done by the harness, never by the model."
  kb: [procedures/board-onboarding, vendor/ross_distilled/debug-ila-vio, procedures/verification-stages~hw, procedures/ultrafast~configuration, techniques/debugging]
  checks:
  - {file: flow/board_check.py, gate: power_ok, enforced: false, what: "The board-check tool: the power check again before programming, programming by cable serial and SRAM only, identify, self-check and still-alive steps. The stage gate that enforces the power check is under power and thermal."}
  evidence:
  - kind: measured
    source: results/board_v2/*.json
    where: pass=true
    values: [nfiles, n]
    text: "There are {0} board-check result files, each a design built by the flow and run on the board, and {1} are marked pass."
  - kind: agent
    source: results/f2/agent_luna_05c2_run7_bringup.json
    values: ["get:run_as_written.steps.uart_tests.tests", "get:run_as_written.steps.uart_tests.failures", "get:run_as_written.failed_step"]
    text: "An agent-built design from a development run was programmed on the board: of its {0} UART self-checks, {1} failed; the run stopped at the step {2}."
  - kind: measured
    source: results/b30/hil_runs/b30_hil_audio.hil.json
    values: ["get:checks.tone_at_the_jack.measured.freq_hz", "get:checks.tone_at_the_jack.measured.thd_percent", "get:checks.xadc_vs_jtag.measured.tj_c"]
    text: "On the board, a tone made by the design's own signal generator was read at the audio jack at {0} Hz with {1} percent distortion, and the fabric temperature readout gave {2} degrees C against the JTAG reading."
  - kind: measured
    source: results/b30/hil_runs/b30_hil_audio_pinfault.hil.json
    values: ["get:checks.tone_at_the_jack.measured.level_dbfs_rms", "get:checks.tone_at_the_jack.measured.sinad_db"]
    text: "The same design with one output pin moved passes simulation and every check inside the chip, and fails at the jack: level {0} dBFS, signal-to-noise-and-distortion {1} dB."
  cards:
  - {href: "flow-notes.html#pblock", label: "Beyond the flow: placement regions on the crossing rig"}
  gaps:
  - "No USB scope, logic analyser, spectrum analyser, Red Pitaya or video capture was connected on the day, so those paths are drivers tested on synthetic data, not measurements."
  - "The soak's hardware logs are not among the committed results; the builds and simulations are."
  - "Unattended soaks and board runs need the owner's approval."
  - "Agent-built bitstreams have been programmed on the board, but no agent-built design has yet passed every test on the board."
- id: power
  name: Power and thermal
  summary: Power and junction-temperature budgets for a board without a heat sink, power rails, and low-power coding.
  about: "The Nexys A7 has no heat sink, so power is a hard limit, not a nicety. Two checks in the power-closure stage gate enforce it: the junction temperature Vivado computes for the board's real cooling must stay within the limit, and the total on-chip power and temperature must fit the budget for the board's power source, which the board tools check again before programming."
  kb: [family/artix7/power-config, family/zynq_ultrascale_plus/power-config, board/nexys_a7_100t/power-config,
       board/zedboard/power-config, board/kr260/power-config, procedures/ultrafast~power, techniques/timing-concepts]
  checks:
  - {file: flow/gates.py, gate: power_junction_ok, enforced: true, what: "The junction temperature computed for the board's real cooling must fit the limit."}
  - {file: agent/graph/stages.py, gate: power_ok, enforced: true, what: "Part of the power-closure stage gate: total on-chip power and junction temperature must be within the limits for the board's power source, and the board tools refuse to program a build that fails."}
  evidence:
  - kind: agent
    source: results/course/*/run_*.json
    where: split=dev,qor.power_w?,gates.stage_gates_post_route=pass
    values: [n]
    text: "Of the development runs, {0} recorded power after routing and passed every gate at that stage, the junction-temperature gate among them."
  cards: []
  gaps:
  - "The power figures are Vivado's estimates, not measurements at the supply."
  - "Low-power coding techniques have skills, but no run compares them."
- id: toolflow
  name: Tool flow
  summary: Non-project batch Vivado, reproducible builds, report reading, cross-probing a failing path to its source line, and what changes between Vivado versions.
  about: "The agent builds only through scripted, non-project Vivado under a memory cap and a thread limit, so every build is reproducible and writes the reports the gates read. A cross-probing tool traces a failing or tight path back to its source line, its place on the chip and its nets, so a repair starts from the right spot."
  kb: [vendor/ross_distilled/non-project-flow, vendor/ross_distilled/timing-methodology~reading, procedures/ultrafast, vendor/vivado_synthesis/synthesis-attributes,
       vendor/free_simulators/simulation, vendor/ross_distilled/lint~synth-message, vendor/ross_distilled/simulation]
  checks:
  - {file: flow/run_vivado.sh, enforced: false, what: "The only way the agent builds: batch Vivado under a memory cap and a thread limit, writing the reports the gates read."}
  - {file: flow/xprobe.py, enforced: false, what: "Cross-probing: names the RTL file and line, clock region and nets of a failing or tight path."}
  evidence:
  - kind: measured
    source: results/project_parity_2026_1/xprobe/*.xprobe.json
    values: [n, "min:wns"]
    text: "Cross-probing was run on {0} routed designs; the tighter had {1} ns of setup slack, and the output names the source lines, locations and nets."
  - kind: agent
    source: results/course/*/run_*.json
    where: split=dev,stop.stages_0_to_8_passed=true
    values: [n]
    text: "Of the development runs, {0} went through every stage up to configuration with every stage gate passed."
  cards: []
  gaps:
  - "No local design had a failing path to cross-probe, so it is shown on passing ones."
  - "Every Vivado number on this page is measured on Vivado 2026.1, and other versions are not tested here."
  - "The block-design and project-mode steps are measured in scripts but are not part of the flow."
