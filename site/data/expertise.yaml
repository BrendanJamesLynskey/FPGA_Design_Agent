  summary: Display timing, pixel pipelines and line buffers, VGA and HDMI-style output.
  kb: [functions/video, board/zedboard/video, board/kr260/video, board/nexys_a7_100t/user-io~vga, functions/on-chip-memory~memories]
  checks: []
  evidence:
