  - "The int8 task escaped most often; the misreading was of the specification, not the arithmetic."
  - "Rounding modes and saturation are covered by skills; only these tasks test them."
- id: rtl
  name: RTL design
  summary: Reading a specification, synthesisable coding, pipelines and handshakes, hierarchy and register boundaries, lint and synthesis messages.
  kb: [techniques/rtl-coding, techniques/spec-reading, techniques/integration, techniques/pipelining-handshakes, techniques/existing-code,
