# Areas of expertise (brief 23). One entry per drawer on site/src/expertise.html; site/expertise.py builds and checks it.
# `about` (brief 32): the drawer's opening paragraph in plain prose (what the area is, what the agent knows and checks); no numbers.
# To extend an area in a later brief: add a skill selector to `kb`, a check to `checks`, an item to `evidence`
# (kind measured , agent , example; numbers only as {0} {1} placeholders filled from `values` expressions, see
# `python3 -c "import expertise; print(expertise.EXPR)"`), or a line to `gaps`. The evidence level is computed:
# an `agent` item gives "Shown in agent runs", an enforced check gives "Checked by the flow", a `measured` item
# gives "Measured in Vivado"; an `example` item never raises the level. `cap` lowers it, with a reason shown.
# kb selectors: "<unit>/<section>" (section may be *), optionally "~sub1|sub2" to keep skills whose name has a substring.
# checks: gate = an id that must occur in `file`; enforced = a stage gate fails the run when it is not met.
areas:
- id: constraints
  name: Constraints and timing closure
  summary: Writing clocks, I/O delays and exceptions that are right, and reading timing reports to close the paths that fail.
  about: "Constraints tell Vivado what the clocks are, when signals arrive at the pins and which paths need no timing; timing closure is the work of making every remaining path fast enough. The agent writes the constraints from its skills, and a gate after routing fails any run that misses setup, hold or pulse-width timing or leaves a path unconstrained. A separate checker looks for risky lines, such as a false path with no stated reason."
  kb: [vendor/amd_constraints/constraints, vendor/ross_distilled/constraints, vendor/ross_distilled/timing-methodology,
       techniques/timing-concepts, family/artix7/timing-concepts, procedures/ultrafast~constraints|timing-closure|sta-report|implementation,
       family/artix7/io-standards~timing-constraints]
  checks:
  - {file: flow/gates.py, gate: no_unconstrained_endpoints, enforced: true, what: "Setup, hold and pulse-width slack must be met after routing, and no endpoint may be left unconstrained."}
  - {file: agent/core/constraints.py, gate: FDA-CON-5, enforced: false, what: "Checks design.xdc: clocks only on the board's clock input, no disabled clock-route check, a reason beside every false path or asynchronous clock group. Run as the check_constraints tool; a command outside the allow-list refuses the build."}
  - {file: flow/xpm_cdc.tcl, enforced: false, what: "Applies the exceptions that AMD ships as scoped files for its crossing macros, which the batch flow otherwise drops."}
  - {file: flow/exceptions_check.py, gate: post_synth_exceptions_clean, gate_in: flow/gates.py, enforced: true, what: "After synthesis and after routing: no exception ignored or covering no path, no constraint message from an XDC line, no TIMING-24/-29/-47 or XDCH-1, and every multicycle path's registers share a real clock enable."}
  - {file: agent/core/constraints.py, gate: FDA-CON-10, enforced: false, what: "Before Vivado: a -setup N multicycle needs its -hold N-1, and a multicycle or datapath-only max delay needs a comment naming the enable or the synchroniser."}
  - {file: flow/io_check.py, gate: io_timing_clean, gate_in: flow/gates.py, enforced: true, what: "After synthesis and after routing: no made-up delay on a button, switch, LED or UART pin, every delay explained by its data-sheet formula, -min not above -max, no delay replaced for want of -add_delay; for the interfaces a design declares, both -min and -max, the data sheet's values, the right reference clock, and the registers in the I/O blocks."}
  - {file: agent/core/constraints.py, gate: FDA-CON-11, enforced: false, what: "Before Vivado: the same made-up, unexplained, swapped or replaced I/O delays, and a virtual clock used before it is defined."}
  evidence:
  - kind: measured
    source: results/20_timing_exceptions_2026_1/exceptions_table.json
    values: ["count@rows:expect_flag=true", "count@rows:expect_flag=true,vivado_flags=true", "count@rows:expect_flag=true,flow_flags=true", "count@rows:expect_flag=false", "count@rows:expect_flag=false,flow_flags=false"]
    text: "On {0} small designs with one timing-exception mistake each, Vivado itself said something about the exception in {1}; the flow's checks flagged {2}. They passed {4} of {3} correct designs."
  - kind: measured
    source: results/20_timing_exceptions_2026_1/io_table.json
    values: ["count@rows:fault=true", "count@rows:fault=true,vivado_flags=true", "count@rows:fault=true,flow_flags=true"]
    text: "On {0} small designs with one I/O-delay or virtual-clock mistake each, Vivado itself said something in {1}; the flow's gates flagged {2}."
  - kind: measured
    source: results/49_vivado_2026_1/xpm_probe.json
    values: [get:xpm_probe.before.wns_ns, get:xpm_probe.after.wns_ns]
    text: "On a two-clock probe design, setup slack on the crossing was {0} ns without AMD's macro exceptions and {1} ns with them (Vivado 2026.1)."
  - kind: agent
    source: results/49_vivado_2026_1/dev_rebuilds.json
    values: ["count@rows:wns_ns?", "count@rows:wns_ns>0"]
    text: "Of the development runs whose saved designs were rebuilt on Vivado 2026.1, {0} reached routing; setup slack was positive in {1}."
  - kind: agent
    source: results/20_timing_exceptions/drills/run_*.constraints.json
    values: [n, "count:pass=true"]
    text: "In {0} agent runs of the slow-controller drill (one clock, a one-in-eight enable, an eight-clock multicycle), the constraint grader passed {1}; the other run put a register that a write sets on any clock into the eight-clock group, which only the grader's simulation check caught."
  - kind: agent
    source: results/20_timing_exceptions/drills/run_b*.io.json
    values: [n, "count:checks.interface.pass=true", "count:checks.no_invented.pass=true", "count:checks.input_jitter.pass=true", "count:checks.margin.pass=true"]
    text: "In {0} agent runs of the ADC-capture drill (input delays from a data sheet, the oscillator's jitter, a margin for implementation only), the delays were right in {1}, free of made-up delays in {2} and carried the jitter in {3}; the implementation-only margin was right in {4}."
  cards:
  - {href: "flow-notes.html#xpm-cdc", label: "Beyond the flow: AMD's crossing macros lose their exceptions"}
  - {href: "flow-notes.html#exceptions", label: "Beyond the flow: over-broad exceptions hide failures"}
  cap: {level: checked, why: "Exceptions and I/O delays are now shown in agent runs, but one exception run wrote a wrong multicycle that the flow passed, and no I/O run kept its implementation margin out of sign-off the way asked; virtual clocks have no agent runs yet."}
  gaps:
  - "I/O delay constraints, virtual clocks and clock uncertainty are written from the skills; no committed run scores them against a data sheet."
  - "The flow's multicycle check looks at each register's clock-enable logic, not at whether the register really changes only on the enable; the drill grader adds that check in simulation, the flow does not yet."
  - "Only one exception drill is built (the slow controller); the two-cycle datapath, the quasi-static register and the seeded wrong false path are not."
- id: cdc
  name: Clock-domain and reset-domain crossing
  summary: Synchronisers, multi-bit crossings, asynchronous FIFOs, reset bridges and the checks that find a crossing report_cdc passes but that is still wrong.
  about: "Signals that pass between unrelated clocks need synchronisers, and a mistake there can pass every simulation and still fail on the bench. The agent knows the standard circuits for single bits, buses, FIFOs and resets, and its flow checks each crossing three ways: Vivado's crossing report, a structural check of every flip-flop fed from another clock, and a simulation that makes synchronisers resolve late."
  kb: [techniques/cdc, family/artix7/cdc, techniques/reset, family/artix7/reset, vendor/ross_distilled/drc-and-cdc-reports,
       vendor/amba_axi/amba~clock-domain-crossing, techniques/fifo]
  checks:
  - {file: flow/cdc_structure.py, gate: post_synth_cdc_structure_clean, gate_in: flow/gates.py, enforced: true, what: "After synthesis, classifies every flip-flop reached from another clock (synchroniser chain, XPM macro, constrained Gray or handshake, reset bridge, unsafe) and fails on an unsafe one."}
  - {file: flow/cdc_inject.py, enforced: true, gate: inject, what: "Simulation with a late-resolving first synchroniser stage, so a crossing that only works when every bit settles on time fails."}
  - {file: flow/gates.py, gate: cdc_no_critical, enforced: true, what: "report_cdc must have no Critical row, after synthesis and after routing."}
  - {file: flow/xpm_cdc.tcl, enforced: false, what: "Exceptions for AMD's crossing macros."}
  evidence:
  - kind: measured
    source: results/16_cdc_gate/mutant_table.json
    values: ["count@rows:kind=mutant", "count@rows:kind=mutant,report_cdc_alone_flags=true", "count@rows:kind=mutant,gate_flags=true", "count@rows:kind=correct", "count@rows:kind=correct,gate_flags=false"]
    text: "On {0} ported broken crossings, report_cdc alone flagged {1}; the flow's gate flagged {2}. It passed {4} of {3} correct variants."
  - kind: measured
    source: site/data/flow_notes.json
    link: [hil/cdc_soak/results/cdc_rig_sim.json]
    values: ["get:counts.rig_mutants", "get:counts.rig_sim_flags"]
    text: "On the {0} mutants of the soak rig, its simulation with injection flagged {1}."
  cards:
  - {href: "flow-notes.html#cdc-gate", label: "Beyond the flow: the crossing report passes some unsafe crossings"}
  - {href: "flow-notes.html#xpm-cdc", label: "Beyond the flow: AMD's crossing macros lose their exceptions"}
  - {href: "flow-notes.html#pblock", label: "Beyond the flow: placement regions made after synthesis"}
  gaps:
  - "No agent run has used the stronger crossing gate yet."
  - "A reset cleared on one side only, in an asynchronous FIFO or a handshake, gets past the gate; only the rig's simulation catches it."
  - "The gate's simulation works cycle by cycle, so it finds lost pulses and bits crossed separately but not route skew, glitches or true metastability."
- id: clocking
  name: Clocking
  summary: Choosing an MMCM or PLL setting, clock buffers, dynamic phase and glitch-free switching, and using the Clocking Wizard as a checker.
  about: "Clocking covers the clock-management tiles (MMCM and PLL), clock buffers and safe switching between clocks. So that an MMCM setting is computed rather than guessed, the flow offers a search over the legal settings for a target frequency, and the design-rule check after synthesis fails any run whose setting is out of range."
  kb: [techniques/clocking, family/artix7/clocking, family/zynq7000/clocking, family/zynq_ultrascale_plus/clocking,
       board/nexys_a7_100t/clocking, vendor/ross_distilled/clocking-ip, family/artix7/primitives~clocking]
  checks:
  - {file: flow/gates.py, gate: post_synth_drc_clean, enforced: true, what: "A DRC Error or Critical Warning after synthesis fails the run; an illegal MMCM VCO or phase-detector frequency raises one (AVAL-46)."}
  - {file: flow/mmcm_search.py, enforced: false, what: "A search over legal MMCM settings for a target frequency, so the setting is computed, not guessed."}
  - {file: flow/cmt_check.tcl, enforced: false, what: "A VCO and phase-detector range checker, written and measured but not wired into a gate."}
  evidence:
  - kind: measured
    source: results/project_parity_2026_1/cmt_check/drc_*.rpt
    values: [nfiles, "nmatch:AVAL-46"]
    text: "Of {0} probe designs (one legal, three with an MMCM setting outside its range), Vivado's design-rule check after synthesis flagged the setting as out of range on {1}."
  cards:
  - {href: "flow-notes.html#xpm-cdc", label: "Beyond the flow: AMD's crossing macros lose their exceptions"}
  gaps:
  - "The Clocking Wizard's own settings were compared with the flow's search on only a few target frequencies."
  - "No agent run has been graded on a clocking task yet."
- id: io
  name: I/O, primitives and transceivers
  summary: Pin planning against the board's master constraints, I/O standards, DDR and delay primitives, and the limits of the 7-series and UltraScale+ I/O.
  about: "This area covers pin planning, I/O standards and banks, the delay and serialiser primitives at the pins, and transceivers, with the limits that differ between 7-series and UltraScale+ parts. The agent can compare every pin and standard in its constraints with the board's master file, but that comparison is a tool it may run, not a gate."
  kb: [family/artix7/io-standards, family/artix7/pin-planning, family/artix7/primitives, family/artix7/logic-fabric~lut6,
       device/xc7a100tcsg324-1/io-standards, device/xc7a100tcsg324-1/pin-planning, device/xc7a100tcsg324-1/primitives,
       family/zynq7000/io-standards, family/zynq_ultrascale_plus/io-standards, family/zynq_ultrascale_plus/pin-planning,
       family/zynq_ultrascale_plus/primitives, family/zynq_ultrascale_plus/high-speed-serial, device/xck26/io-standards,
       device/xck26/primitives, board/nexys_a7_100t/serial-buses]
  checks:
  - {file: agent/core/constraints.py, gate: FDA-CON-4, enforced: false, what: "Compares every pin and I/O standard in design.xdc with the board's master constraints file, and flags two ports on one pin. Run as the check_constraints tool."}
  - {file: tools/inventory_check.py, enforced: false, what: "Checks the board inventory against the master constraints file in CI."}
  evidence: []
  cards: []
  gaps:
  - "The I/O delay and eye-scan procedures exist as skills, and the rig that would measure them is designed on paper only."
  - "No transceiver design has been built or run."
  - "The pin and standard checks are a tool the agent can run, not a stage gate, so nothing in this area is enforced."
- id: memory
  name: Memory, on-chip and off-chip
  summary: Block RAM, distributed RAM and UltraRAM choice, widths, ports and ECC; FIFOs and buffering; crossing clocks through memory; DDR devices, widths and speeds, and the MIG.
  about: "Memory runs from the choice between block RAM, distributed RAM and UltraRAM, through FIFOs and crossing clocks through memory, to external DDR and AMD's memory-controller generator, the MIG. A gate after synthesis compares the resources used with the plan, which catches a memory that was meant to be block RAM and became logic instead."
  kb: [functions/on-chip-memory, family/artix7/on-chip-memory, family/artix7/dram, family/zynq7000/dram, family/zynq_ultrascale_plus/dram,
       family/zynq_ultrascale_plus/primitives~bram, family/artix7/primitives~memory, family/artix7/logic-fabric~srl, functions/caches-and-dma,
       techniques/fifo, family/artix7/cdc~async-fifo, board/kr260/dram, board/zedboard/dram, family/artix7/pin-planning~memory,
       vendor/vivado_synthesis/synthesis-attributes~inference-templates, vendor/amd_ip_cores/ip-cores~memory, functions/crc-and-line-codes]
  checks:
  - {file: flow/gates.py, gate: post_synth_resources_in_range, enforced: true, what: "Post-synthesis LUT, flip-flop, block RAM and DSP counts must lie near the architecture's prediction, which catches a RAM that became LUTs."}
  - {file: flow/mig_impl_check.tcl, enforced: false, what: "Runs a MIG example design through implementation to see whether Vivado rejects a bad pin set."}
  evidence:
  - kind: measured
    source: results/project_parity_2026_1/mig_impl/*/drc_place.rpt
    values: [nfiles, "nmatch:PLIO-3"]
    text: "{0} example designs of the memory controller (good pins, a byte-group fault, a duplicated pin) went through placement; the design-rule check after placement flagged {1}, the duplicated pin; the byte-group fault was not rejected."
  cards:
  - {href: "flow-notes.html#mig", label: "Beyond the flow: scripted DDR controller generation skips the pin check"}
  gaps:
  - "No committed run exercises error correction, dual-port or asynchronous memory behaviour in Vivado or on hardware; the skills give the rules."
  - "The memory controller's pin validation lives in the GUI and has no script command, so pins are checked against rules instead; that rule checker is not in this repository yet."
  - "The choice of DDR device, count, width and speed rests on the skills alone; no memory-interface design has been run."
- id: mixed
  name: "Mixed-signal: XADC and converter interfaces"
  summary: Reading the on-chip XADC, wiring analogue inputs and alarms, and interfacing external converters and sensors over SPI and I2C.
  about: "This area covers the on-chip analogue-to-digital converter (the XADC), its alarms, and external converters and sensors reached over SPI and I2C. On the board the flow checks the power and temperature budget before programming, and the board's own sensors are read by small self-checking designs."
  kb: [family/artix7/analog, device/xc7a100tcsg324-1/analog, device/xc7z020clg484-1/analog, vendor/amd_ip_cores/ip-cores~xadc,
       board/nexys_a7_100t/sensors, board/nexys_a7_100t/audio, board/zedboard/audio, functions/serial-buses]
  checks:
  - {file: flow/board_check.py, gate: power_ok, enforced: false, what: "The board-check tool re-runs the power and junction-temperature check before programming and stops if it fails; the self-checks read the board's sensors. The stage gate that enforces it is under power and thermal."}
  evidence:
  - kind: measured
    source: results/board_v2/b2_*.json
    values: [n]
    where: pass=true
    text: "{0} hand-built designs that read the board's temperature sensor, accelerometer, SPI flash and PDM microphone each ran on the board and passed self-checks written in advance."
  - kind: example
    source: results/board_v2/README.md
    contains: ["ID 0xCB"]
    text: "The temperature sensor design reads the sensor's ID byte and a temperature over I2C three times in a row."
  cards: []
  gaps:
  - "The on-chip XADC is covered by skills only; no committed design reads it or its alarms."
  - "No development task scores analogue front ends or converter timing."
  - "The audio output tasks were development tasks; their runs are under signal processing."
- id: amba
  name: AMBA/AXI and the Zynq processing system
  summary: AXI4, AXI4-Lite and AXI4-Stream handshakes, bursts, bridges and crossing clocks, AMD's AXI IP, and the PS-PL ports of Zynq-7000 and UltraScale+.
  about: "AXI is the family of on-chip bus protocols that AMD's IP and the Zynq processors use, and the usual way blocks connect. The design-standards gate requires every new block interface to be AXI4-Lite or AXI4-Stream with the standard port names. The skills also cover bursts, bridges, crossing clocks on a bus and the ports between a Zynq processor and the fabric."
  kb: [vendor/amba_axi/*, functions/buses-axi, family/zynq7000/*, family/zynq_ultrascale_plus/power-config, family/zynq_ultrascale_plus/reset, board/zedboard/user-io~buttons]
  checks:
  - {file: flow/standards_check.py, gate: STD-AXI-01, enforced: true, what: "A new block interface must be AXI4-Lite or AXI4-Stream with AMBA port names, and ports named like AXI belong to a declared interface."}
  - {file: agent/graph/stages.py, gate: standards_rtl, enforced: true, what: "The stage that runs the design-standards checker on the RTL; a failing rule loops the run back."}
  evidence: []
  cards: []
  gaps:
  - "The gate checks interface names and declarations only; protocol behaviour, such as holding valid until ready, is left to review and to the assertions the skills describe."
  - "No development task is an AXI design, so nothing measures this area end to end yet."
  - "Designs for the Zynq processors have skills but no flow step yet; the flow targets the Nexys A7 first."
- id: ip
  name: AMD IP cores and wizards
  summary: The free IP cores (FIR, DDS, CORDIC, FFT, divider, memory, FIFO, clocking), their licences, and what the wizards do in batch mode.
  about: "AMD supplies free IP cores, such as filters, signal generators, FFTs and memories, that are normally set up through GUI wizards. The agent has no GUI, so the flow drives the wizards from scripts and reads back what they generated. That lets their checks be tested without the GUI."
  kb: [vendor/amd_ip_cores/ip-cores, vendor/amba_axi/ip-cores, vendor/amba_axi/simulation~vip]
  checks:
  - {file: flow/wizard_probe.tcl, enforced: false, what: "Creates a wizard's IP in batch, sets its options and reads back what it generated, so a wizard's checks can be tested without the GUI."}
  evidence:
  - kind: measured
    contains: ["== Block Memory Generator", "== FIFO Generator"]
    source: results/project_parity_2026_1/wizards/wizards.txt
    text: "Scripted generation was tried for the Block Memory, FIFO, XADC, Transceiver, PS7, Clocking and other wizards, and the probe output is committed."
  - kind: measured
    source: results/19_ipgen/bmg_sine/sim.json
    values: [get:sim.mem.n_words, get:sim.mem.n_mismatch, get:sim.mem.latency_cycles]
    text: "A generated block-memory sine table read back in AMD's simulator with {1} mismatches in {0} reads and a measured latency of {2} cycles."
  cards:
  - {href: "flow-notes.html#xsim", label: "Beyond the flow: AMD's IP models need xsim"}
  gaps:
  - "The encrypted cores run only in AMD's simulator; the file-driven harness drives four of them, and the rest are skills only."
  - "The Transceiver wizard's legal low-rate setting was not measured, because of a property-name error."
- id: dsp
  name: DSP and IP driven from external tools
  summary: Filters, NCOs and mixers; designing the coefficients and word lengths in Python, then building and checking the datapath or the AMD core.
  about: "Signal processing on an FPGA starts in software: the coefficients and word lengths of a filter or oscillator are designed first, then built into a datapath or an AMD core. The flow designs a filter in Python, measures what quantising it costs, generates the core and checks it word for word in AMD's simulator. These tools serve design work; none is a gate."
  kb: [functions/dsp, family/artix7/dsp, family/artix7/primitives~dsp, vendor/amd_ip_cores/ip-cores~fir|dds|simulation, functions/crc-and-line-codes]
  checks:
  - {file: flow/ipgen/harness.py, enforced: false, what: "Runs an AMD core in xsim from stimulus files, with a seeded valid and ready schedule, and compares every output word with a Python model. A tool for design work, not a stage gate."}
  - {file: flow/ipgen/fir_design.py, enforced: false, what: "Designs the FIR coefficients, quantises them, and reports the attenuation lost to the word length before the core is built."}
  evidence:
  - kind: agent
    source: [results/course/c10_*/run_*.json, results/course/c11_*/run_*.json]
    where: split=dev
    values: [n, "count:hidden_pass=true", "count:outcome=escape"]
    text: "The sine generator and oscillator-mixer tasks had {0} development runs; {1} passed every hidden test and {2} ended in an escape."
  - kind: measured
    source: results/19_ipgen/fir/design.json
    values: [get:design.taps, get:design.attenuation_lost_db]
    text: "A decimating low-pass filter designed in Python came to {0} taps; rounding its coefficients to the core's word length cost {1} dB of stop-band attenuation, and the specification was still met."
  - kind: measured
    source: results/19_ipgen/fir/sim.json
    values: [get:sim.continuous.n_got, get:sim.continuous.n_mismatch, get:sim.random.n_mismatch]
    text: "The generated filter core matched the integer model on all {0} outputs in AMD's simulator: {1} mismatches with continuous input and {2} with random gaps."
  - kind: measured
    source: results/19_ipgen/fir/ooc.json
    values: [get:luts, get:dsp, get:wns_ns]
    text: "Synthesised on its own, that core used {0} LUTs and {1} DSP slices, with {2} ns of setup slack at the target clock; that figure is before routing, so it is an upper bound."
  - kind: measured
    source: results/19_ipgen/dds/sim.json
    values: [get:sim.continuous.sfdr_db, get:sim.continuous.sfdr_spec_db]
    text: "The generated sine-generator core measured {0} dB of spurious-free dynamic range against a target of {1} dB."
  cards: []
  gaps:
  - "Only the FIR, CIC, block memory and DDS cores have adapters; CORDIC, FFT and the Clocking Wizard do not, and the CIC and FIR have not been simulated in cascade."
  - "The cores are exercised by examples run by hand, not by the agent; no development task uses an AMD core yet."
  - "All of this is on one part, the Artix-7 on the Nexys A7, with one example each; development results are not the held-out score."
- id: video
  name: Video
  summary: Display timing, pixel pipelines and line buffers, VGA and HDMI-style output.
  about: "Video designs generate display timing and move pixels through pipelines and line buffers to a VGA or HDMI-style output. No flow check is specific to video; the evidence is one agent run on a pixel filter and a hand-built design on the board."
