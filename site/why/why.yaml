# The "Why FPGA Force" page (brief 193). Prose holds no typed numbers: every figure is a {name} read from a committed file.
# A value is {source, expr}: expr is one of site/expertise.py's expressions (python3 -c "import expertise; print(expertise.EXPR)").
# `expect: {path, is}` pins a value read by list position to the item it must be (the build fails if the order changes).
# `derived` values are computed by site/why.py from the named committed file, by the stated formula.
# Claims rest on what is merged into main; work still in review is left out or marked as not built.
intro:
  answer: "An FPGA engineer's flow, run by an agent and judged by evidence."
  note: "It does the implementation work of an FPGA engineer and shows each result against your specification, with the simulators, Vivado and, where one is attached, a board, so your time goes to what the design must do and to whether the evidence is enough. This is the one-page summary: {drawer_n} drawers, each a claim that opens to what it means, an example from this project with its numbers, what it does not do yet, and where to read more. These are development results; no held-out score exists yet."
diagram_caption: "Who does what. The two solid boxes are yours. A failed gate sends the work back to the agent; a gap in the evidence, or a wrong specification, sends it back to you."
