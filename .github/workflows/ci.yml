# CI: Python models, gates parser and host driver, board inventory check; cocotb + Icarus RTL tests
# (with the mutant check); Verilator lint. Vivado does not run here (it is a
# ~100 GB install): builds run locally through flow/run_vivado.sh, and their
# summaries are committed under results/.
name: CI

# Brief 07a2 fix 5 G: a pull request runs only the benchmark tasks it touches plus a small smoke set
# (tools/ci_select.py, tools/ci_smoke.yaml). Pushes to main, the nightly schedule and a manual run use every task, so
# main's coverage is the full sweep.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A newer push to the same pull request cancels the older run (the same branch on main is never cancelled).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python (models, gates parser, host driver)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pull request base (for the task selection)
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl          # prepare.py's Tcl is loaded by a real tclsh
          # GHDL for the VHDL unit tests (flow/tests/test_55_vhdl.py), the same pinned package as the rtl-sim job
          sudo apt-get install -y --no-install-recommends ghdl=4.1.0+dfsg-0ubuntu2.1 ghdl-mcode=4.1.0+dfsg-0ubuntu2.1 ghdl-common=4.1.0+dfsg-0ubuntu2.1
          pip install pyyaml pyserial pytest cocotb==2.0.1 mcp==2.3.0 jsonschema \
            langgraph==1.2.19 langgraph-checkpoint-sqlite==3.1.3 deepagents==0.7.32 langchain-openai==1.7.3 scipy \
            boto3==1.44.0 moto==5.2.5
      - name: pytest (no simulator; agent core + the 05b agent graph - isolation, interview, review, rewind, T1 episode)
        run: python -m pytest -q --ignore-glob='*_rtl.py'
      - name: Check build manifests and the sample release bundle (no Vivado)
        run: |
          for y in designs/*/build.yaml; do
            d=$(dirname "$y")
            python flow/manifest.py show "$d" --json "build/manifest_$(basename "$d").json" >/dev/null
            python -c 'import json, sys; m = json.load(open(sys.argv[1])); print(m["design"], "build ID", m["build_id"], len(m["inputs"]), "inputs")' "build/manifest_$(basename "$d").json"
          done
          for b in results/54_reproducible/sample_bundle/*/; do python flow/release.py check "$b"; done
      - name: Board inventory against the master XDC (brief 04c)
        run: python tools/inventory_check.py boards/nexys_a7_100t
      - name: Benchmark v1 training pool, model unit tests (brief 06a)
        run: |
          rc=0
          sel=$(python tools/ci_select.py pool)
          if [ "$sel" = ALL ]; then dirs=$(ls -d benchmark/pool/*/hidden); else dirs=$(for t in $sel; do echo benchmark/pool/$t/hidden; done); fi
          echo "pool tasks: $sel"
          for d in $dirs; do
            PYTHONPATH=$d:. python -m pytest -q -p no:cacheprovider --import-mode=importlib $d/test_model.py || rc=1
          done
          exit $rc

  rtl-sim:
    name: RTL tests (cocotb + Icarus) and mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pull request base (for the task selection)
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          # GHDL for the VHDL path, pinned to the Ubuntu 24.04 package used locally and in fda-sim:2-ghdl (mcode; about 8.5 MB installed)
          sudo apt-get install -y --no-install-recommends ghdl=4.1.0+dfsg-0ubuntu2.1 ghdl-mcode=4.1.0+dfsg-0ubuntu2.1 ghdl-common=4.1.0+dfsg-0ubuntu2.1
          ghdl --version | head -1
          pip install pyyaml pyserial pytest cocotb==2.0.1 cocotb-coverage
      - name: cocotb tests (shell at 8 clocks a bit and at 115200 baud; T1 against its model)
        run: python -m pytest -q shell/tests/test_shell_rtl.py designs/t1_dimmer_counter/tests/test_t1_rtl.py
      - name: Generic mutation tool on a tiny design (brief 05k)
        run: python -m pytest -q flow/tests/test_05k_mutation.py
      - name: Board self-check designs against device models; QSPI source checks (brief 04c)
        run: >-
          python -m pytest -q designs/b2_tmp_adt7420/tests/test_tmp_rtl.py designs/b2_acl_adxl362/tests/test_acl_rtl.py
          designs/b2_qspi_jedec/tests/test_qspi_rtl.py designs/b2_mic_pdm/tests/test_mic_rtl.py
      - name: HIL instruments (brief 30) - library blocks against their models, the b30 demonstration design, seeded faults
        run: |
          python -m pytest -q hil/tests/test_30_ip_rtl.py designs/b30_hil_audio/tests/test_hil_audio_rtl.py
          python hil/ip_faults.py
      - name: IP variants - the FIR entry's four variants against one model, the differential test, seeded faults
        run: |
          python -m pytest -q ip_lib/fir/tb/test_fir_rtl.py
          python hil/ip_faults.py --blocks fir
      - name: CDC soak rig (brief 11b) - checkers, host reader, the rig with metastability injection and reset storms (one copy a variant)
        run: CDC_SIM_QUICK=1 python -m pytest -q hil/cdc_soak/tests
      - name: CDC gate fixtures - the rig's mutants and correct variants, plain and with synchroniser-delay injection (brief 16)
        run: python -m pytest -q flow/tests/test_16_cdc_inject_rtl.py
      - name: Timing-exception drill - the multicycle registers change on one phase of the enable (brief 20)
        run: python -m pytest -q flow/tests/test_20_drill_sim_rtl.py
      - name: FSM discipline - reference controller variants, FSM coverage on real designs and the test-removal mutants (brief 24)
        run: python -m pytest -q flow/tests/test_24_fsm_rtl.py flow/tests/test_24_drills_rtl.py
      - name: Project layer (brief 27B P0) - generated contract tests on fixture RTL, the reference passes, each mutant fails
        run: python -m pytest -q project/tests/test_27b_contract_tests_rtl.py
      - name: VHDL - translations pass their hidden benches through the GHDL netlist; VHDL blocks under GHDL; the mutation check in a container where one exists
        run: python -m pytest -q flow/tests/test_55_vhdl_rtl.py
      - name: Mutants (each deliberate bug must fail the T1 tests)
        run: PYTHON=python designs/t1_dimmer_counter/tests/run_mutants.sh
      - name: Benchmark v1 development tasks - reference RTL, every mutant killed, every trap fires (brief 06a)
        run: |
          rc=0
          sel=$(python tools/ci_select.py v1)
          if [ "$sel" = ALL ]; then dirs=$(ls -d benchmark/tasks/*/); else dirs=$(for t in $sel; do echo benchmark/tasks/$t/; done); fi
          echo "v1 tasks: $sel"
          for t in $dirs; do python benchmark/tools/check_task.py "$t" --out build/bench_ci || rc=1; done
          exit $rc
      - name: Benchmark v2 development tasks - reference RTL, every mutant killed, every trap fires (quality review 12)
        run: |
          rc=0
          sel=$(python tools/ci_select.py v2)
          if [ "$sel" = ALL ]; then dirs=$(ls -d benchmark/v2/tasks/*/); else dirs=$(for t in $sel; do echo benchmark/v2/tasks/$t/; done); fi
          echo "v2 tasks: $sel"
          for t in $dirs; do python benchmark/tools/check_task.py "$t" --out build/bench_ci_v2 || rc=1; done
          exit $rc
      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: build/sim/*/sim.log

  course-tier:
    name: Course tier development tasks (cocotb + Icarus, reference and mutants)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pull request base (for the task selection)
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install pyyaml pyserial pytest cocotb==2.0.1 numpy
      - name: Course tier (brief 07a1) - reference RTL passes, every mutant killed
        run: |
          rc=0
          sel=$(python tools/ci_select.py course)
          if [ "$sel" = ALL ]; then dirs=$(ls -d benchmark/course/tasks/*/); else dirs=$(for t in $sel; do echo benchmark/course/tasks/$t/; done); fi
          echo "course tasks: $sel"
          for t in $dirs; do python benchmark/course/tools/check_task.py "$t" --out build/course_ci || rc=1; done
          exit $rc

  packet-processing:
    name: Packet processing library (briefs 40, 58A, 63D) - bit-exact sims, seeded faults, lint, ip.yaml
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (scapy is GPL-2.0, a test-time tool only; see ip_lib/README.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator
          pip install pyyaml pytest scapy==2.8.0 cocotb==2.0.1   # cocotb: eth_mac_rgmii's bench (brief 58A)
      - name: ip.yaml against the RTL, generated READMEs current
        run: python flow/net/ipdoc.py --check
      - name: Bench runs against the golden models (Icarus)
        run: python -m pytest -q flow/net/tests
      - name: Brief 63D network design for the Nexys A7 - the library blocks behind eth_mac_rmii, through the shell
        run: python -m pytest -q designs/b63d_nexys_net/tests/test_b63d_nexys_net_rtl.py
      - name: Seeded faults - every one must be caught
        run: python flow/net/faults.py --json build/net/faults.json
      - name: Verilator lint of the library entries
        run: flow/net/lint.sh

  trading-path:
    name: Mock trading path (brief 58A) - cocotb against the reference model, pin-level RGMII loop
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install pyyaml pytest cocotb==2.0.1 jsonschema
      - name: Model, rule validator, recorded natural-language rules (no simulator)
        run: python -m pytest -q designs/b58a_trigger/tests/test_b58a_model.py designs/b58a_trigger/tests/test_b58a_records.py
      - name: trigger_core against the model; assemble-then-send comparison; kr260_top RGMII loop
        run: python -m pytest -q designs/b58a_trigger/tests/test_b58a_rtl.py
      - name: Review regression tests (bad-frame undo, slot drain, soft reset in flight, frame-counter wrap)
        run: python -m pytest -q designs/b58a_trigger/tests/test_rev_adv_rtl.py designs/b58a_trigger/tests/test_rev2_rtl.py designs/b58a_trigger/tests/test_rev3_rtl.py
      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b58a-sim
          path: build/sim/**/sim.log

  axi-transactor:
    name: AXI transactor (brief 59A) - cocotb on Icarus, seeded bugs, scoreboard mutant, formal rule proofs and checker mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys z3
          pip install pyyaml pyserial pytest cocotb==2.0.1 click    # click: SymbiYosys needs it
          git clone https://github.com/YosysHQ/sby.git /tmp/sby && cd /tmp/sby && git checkout 79fc9ed && sudo make install
      - name: Transactor, checkers, scoreboard and capture in simulation (the board's programs and seeded bugs)
        run: python -m pytest -q axi_tx/tests/test_59a_rtl.py     # the host and tool tests run in the Python job
      - name: Formal - every rule quiet on legal traffic, fires on its seeded violation; every checker mutant killed
        run: python axi_tx/formal/run_formal.py --depth 20 --json build/59a/formal.json

  lint:
    name: Verilator lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator python3-yaml
      - name: Lint
        run: flow/lint.sh
      - name: Design standards (v1.0) on the reference design, latch and loop rules included (brief 05d)
        run: python3 flow/standards_check.py designs/t1_dimmer_counter --stage rtl

  verification:
    name: Verification (cocotb on Verilator and Icarus, checkers, formal, portability, V-stage gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pull request base (for the task selection)
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys z3 flex bison autoconf g++ make perl help2man ccache libfl2 libfl-dev
          pip install pyyaml pyserial pytest click cocotb==2.0.1 cocotb-coverage pyslang
      - name: Verilator 5.048 from source (cocotb 2 needs 5.036+; the apt package is 5.020), cached
        id: vl
        uses: actions/cache@v4
        with:
          path: ~/verilator-5.048
          key: verilator-5.048-ubuntu-24.04
      - name: Build Verilator
        if: steps.vl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v5.048 https://github.com/verilator/verilator.git /tmp/verilator-src
          cd /tmp/verilator-src && autoconf && ./configure --prefix=$HOME/verilator-5.048 && make -j2 && make install
      - name: SymbiYosys (pinned commit)
        run: |
          git clone https://github.com/YosysHQ/sby.git /tmp/sby && cd /tmp/sby && git checkout 79fc9ed
          sudo make install
      - name: Tool versions
        run: |
          export PATH=$HOME/verilator-5.048/bin:$PATH
          verilator --version; iverilog -V | head -1; yosys -V; z3 --version; sby --help | head -1
      - name: pytest (gates, portability)
        run: |
          export PORT_VERILATORS="$(which verilator):$HOME/verilator-5.048/bin/verilator"
          python -m pytest -q flow/tests/test_verif_gates.py flow/tests/test_portability.py flow/tests/test_standards_check.py
      - name: V2 run under Verilator 5.048 (bound checkers, code coverage), 3 seeds
        run: |
          export PATH=$HOME/verilator-5.048/bin:$PATH
          SIM=verilator T1_SEEDS=1,2,3 python -m pytest -q designs/t1_dimmer_counter/tests/test_t1_verif_rtl.py
      - name: Benchmark v1 development tasks - reference RTL under Verilator 5.048 (brief 06a)
        run: |
          export PATH=$HOME/verilator-5.048/bin:$PATH
          SIM=verilator python -m pytest -q benchmark/tests/test_bench_rtl.py -k "$(python tools/ci_select.py v1 --k)"
      - name: The same bench under Icarus, 3 seeds
        run: SIM=icarus T1_SEEDS=1,2,3 python -m pytest -q designs/t1_dimmer_counter/tests/test_t1_verif_rtl.py
      - name: Formal (SymbiYosys bmc + cover)
        run: flow/formal.sh designs/t1_dimmer_counter
      - name: Formal, brief 58A - the trading interlocks (k-induction) and the MAC frame FSMs
        run: python -m pytest -q designs/b58a_trigger/tests/test_b58a_formal.py
      - name: Formal, brief 63D - MDIO frame (k-induction), network blocks' framing and AXI-Stream rules, the MAC address filter (bounded)
        # these jobs use the boolector engine; Ubuntu's boolector package (1.5, 2012) is too old for yosys-smtbmc, so this
        # step uses the pinned OSS CAD Suite release the jobs were developed with (yosys, sby, boolector together)
        run: |
          curl -sL -o /tmp/oss.tgz https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-11-12/oss-cad-suite-linux-x64-20261112.tgz
          tar xzf /tmp/oss.tgz -C /tmp
          export PATH=/tmp/oss-cad-suite/bin:$PATH
          yosys -V; boolector --version
          python -m pytest -q flow/net/tests/test_63d_formal.py
      - name: Reference FSM controller, separated and monolithic - bounded, cover and k-induction depth (brief 24)
        run: python -m pytest -q flow/tests/test_24_fsm_formal.py
      - name: Simulator support for FSM coverage constructs (Verilator 5.048, brief 24)
        run: |
          export PATH=$HOME/verilator-5.048/bin:$PATH
          python -m pytest -q flow/tests/test_24_fsm_verilator.py
      - name: Portability of the checkers (Icarus, Verilator 5.020 and 5.048, slang; xsim skipped)
        run: |
          export PORT_VERILATORS="$(which verilator):$HOME/verilator-5.048/bin/verilator"
          python flow/portability.py designs/t1_dimmer_counter/verif/portability.yaml --json build/verif/portability.json
      - name: V-stage gates for T1
        run: |
          python flow/verif_gates.py designs/t1_dimmer_counter --also build/verif/icarus \
            --mutation results/04f/mutation_t1.json --hw results/f0b/t1_dimmer_counter_bringup.json \
            --json build/verif/t1_verif_gates.json
      - name: Upload verification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            build/verif/**/results.xml
            build/verif/**/coverage_t1.yml
            build/verif/**/coverage.dat
            build/verif/**/sim.log
            build/verif/formal/*.log
            build/verif/*.json

  site:
    name: Site (data, pages, numbers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml==6.0.1 numpy==2.4.3 cocotb==2.0.1   # traces import the task models; the I2C ones use benchmark/lib (cocotb)
      - run: pip install jsonschema mcp==2.3.0 langgraph==1.2.19 deepagents==0.7.32 langchain-openai==1.7.3   # brief 43: agent.html's graph is compiled from agent/graph
      - name: Site data and pages are current; every number is in site/data; eval-1 section renders from a fixture
        run: python3 -m pytest site/tests -q
