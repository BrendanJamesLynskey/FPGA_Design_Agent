[project]
name = "fpga-design-agent"
version = "0.1.0"
description = "Natural-language spec to a verified, bring-up-ready AMD FPGA bitstream, measured"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyyaml>=6", "pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest>=8", "cocotb==2.0.1"]
# the agent core and its MCP server (brief 05a); mcp 2.3.0 speaks protocol revision 2026-07-28
agent = ["mcp==2.3.0", "jsonschema>=4"]
# the Deep Agents agent (brief 05b); versions current on 2026-11-01
graph = ["langgraph==1.2.19", "langgraph-checkpoint-sqlite==3.1.3", "deepagents==0.7.32", "langchain-openai==1.7.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["flow/tests", "shell/tests", "designs", "tools/tests", "agent/tests", "benchmark/tests"]
python_files = ["test_*.py"]
